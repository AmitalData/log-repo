# Opt out of CI triggers
trigger: none
# Configure PR trigger
pr:
  branches:
    include:
    - '*'
  autoCancel: true
  drafts: false

stages:
- stage: pr_agent
  displayName: 'PR Agent Stage'
  jobs:
  - job: pr_agent_job
    displayName: 'PR Agent Job'
    pool:
      vmImage: 'ubuntu-latest'
    container:
      image: codiumai/pr-agent:latest
      options: --entrypoint ""
    variables:
      - group: pr_agent
    steps:      
    - script: |
            cat > .configuration.toml <<EOF
            # ------------------------------------------------------------------
            # Custom prompt for the automatic /review tool
            # ------------------------------------------------------------------
            [config]
            model = "gemini/gemini-2.0-flash"   # official model ID
            custom_model_max_tokens = 24000  # keep CI bills predictable
            EOF

            mkdir -p ~/.config/pr-agent
            mv .configuration.toml ~/.config/pr-agent/configuration.toml
      displayName: 'Generate .configuration.toml'    
    - script: |
        echo "Running PR Agent action step"

        # Construct PR_URL
        #PR_URL="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECT}/_git/${BUILD_REPOSITORY_NAME}/pullrequest/${SYSTEM_PULLREQUEST_PULLREQUESTID}"
        #PR_URL="https://amitaldata.visualstudio.com/Amital/_git/log-repo/pullrequest/5152"
        #PR_URL="https://amitaldata.visualstudio.com/Amital/_git/log-repo/pullrequest/5156"
        #PR_URL="https://amitaldata.visualstudio.com/Amital/_git/log-repo/pullrequest/5122"
        #PR_URL="https://amitaldata.visualstudio.com/Amital/_git/log-repo/pullrequest/5189"
        PR_URL= "https://amitaldata.visualstudio.com/Amital/_git/log-repo/pullrequest/5230"
        echo "PR_URL=$PR_URL"

        # Extract organization URL from System.CollectionUri
        ORG_URL=$(echo "$(System.CollectionUri)" | sed 's/\/$//') # Remove trailing slash if present
        echo "Organization URL: $ORG_URL"

        export azure_devops__org="$ORG_URL"
        export config__git_provider="azure"

        # === GEMINI MODEL CONFIGURATION ===
        # Tell PR-Agent to use gemini-2.0-flash-lite
        # export config__model="gemini/gemini-2.0-flash"
        # export config__fallback_models='["gemini/gemini-2.0-flash"]'
        # Provide your Gemini API key from Google AI Studio
        export config__model="gemini/gemini-2.0-flash"
        export config__fallback_models='["gemini/gemini-2.0-flash"]'
        export google_ai_studio__gemini_api_key="$GEMINI_KEY"

        pr-agent --pr_url="$PR_URL" describe
        pr-agent --pr_url="$PR_URL" review
        pr-agent --pr_url="$PR_URL" improve
      env:
        azure_devops__pat: $(azure_devops_pat)
        #openai__key: $(OPENAI_KEY)
        GOOGLE_AI_STUDIO__GEMINI_API_KEY: $(GEMINI_KEY)
        model: "gemini/gemini-2.0-flash"
        max__model_tokens: 24000
      displayName: 'Run Qodo Merge'