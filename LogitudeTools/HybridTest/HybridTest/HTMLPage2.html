<style>
    .iwanttohover:hover {
        background: #DDE6F0;
    }

    GridView th, .GridView td, .GridView td div {
        text-align: left;
        text-indent: 5px;
        /*height: 24px;*/
        line-height: 17px;
        vertical-align: middle;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }


    
    .pwdCheckInnerTable {
        font-family: Tahoma,sans-serif;
        font-weight: bold;
        width: 210px;
        border: 0px 0px 0px 0px;
        height: 19px;
        background-color: #FFFFFF;
    }

        .pwdCheckInnerTable span {
            font-size: 70%;
        }

    .pwdCheckLabelCell {
        font-size: 9pt;
        color: #000000;
        font-weight: bold;
        vertical-align: top;
        text-align: right;
        padding: 5px 20px 13px 5px;
    }

    .pwdCheckDataCell {
        width: 200px;
        vertical-align: top;
        padding: 0px 0px 13px 0px;
    }
</style>


<table style="height:265px;width:1000px;">




    <tr style="height:100%;width:100%;vertical-align:top;margin:15px;">


        <td style="position: relative;vertical-align:top">
            <div style="vertical-align:top">



                <table style="vertical-align:top;margin-top:10px">

                    <tr>
                        <td>
                            <div style="height:70px;">

                                <table>
                                    <tr>
                                        <td><div style="width:5px"></div></td>
                                        <td style="text-align:left;width:75px"><span style="text-align:left;width:75px"><img style="width:75px;height:75px" src="Images/ser-password-icon.png" /></span></td>

                                        <td style="vertical-align:top;font-size:16px;font-family:Lucida Sans Unicode;color:#1B90CB;margin-top:5px">Enter password</td>
                                    </tr>
                                </table>

                            </div>
                        </td>

                        <td style="width: 20px;">
                            <IconButton [Name]="'Signout'" [IsIconOnly]="true" (click)="OnSignoutClicked()" title="Sign Out"></IconButton>
                        </td>

                    </tr>


                    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;margin-top:10px;">
                        <td>
                            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                        </td>
                    </tr>






                    <tr>
                        <td>


                            <div style="height:auto;margin-top:5px">

                                <table style="margin-left:20px;">
                                    <tr>


                                        <td style="text-align:left;width:120px"><div style="text-align:left;width:120px;font-family:Lucida Sans Unicode;font-size:11px;color:#6e7172">Password</div> </td>
                                        <td style="text-align:left;width:100px">
                                            <div style="text-align:left">
                                                <input autocomplete="new-password" type="password" style="height:22px;border-radius:3px;border:1px solid gray;width:200px;" [(ngModel)]="CurrentPassword" />


                                            </div>
                                        </td>
                                        <td></td>

                                    </tr>

                                </table>




                            </div>




                        </td>

                    </tr>


                    <tr><td><div style="text-align:left;color:red;font-size:13px;margin-left:35px;">Another user has logged in with your id invalidating this session. </div></td></tr>



                </table>



            </div>
        </td>




    </tr>

    <tr style="height: 32px;align-content:center;">
        <td style="vertical-align: bottom;">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>



                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 80px;">
                        <button tabindex="-5" class="RedButton" (click)="UnlockClicked()">UnLock ></button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
