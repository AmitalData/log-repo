
<style type="text/css">

  .loginButton
        {
            -moz-box-shadow: inset 0px 1px 0px 0px #f29c93;
            -webkit-box-shadow: inset 0px 1px 0px 0px #f29c93;
            box-shadow: inset 0px 1px 0px 0px #f29c93;
            background: -webkit-gradient( linear, left top, left bottom, color-stop(0.05, #fe1a00), color-stop(1, #cc0029) );
            background: -moz-linear-gradient( center top, #fe1a00 5%, #cc0029 100% );
            filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#fe1a00', endColorstr='#cc0029');
            background-color: #fe1a00;
            -moz-border-radius: 6px;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            border: 1px solid #d83526;
            display: inline-block;
            color: #ffffff;
            font-family: arial;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 24px;
            text-decoration: none;
            text-shadow: 1px 1px 0px #b03466;
            width: 80px;
            text-align:center;
        }

            .loginButton:hover
            {
                background: -webkit-gradient( linear, left top, left bottom, color-stop(0.05, #cc0029), color-stop(1, #fe1a00) );
                background: -moz-linear-gradient( center top, #cc0029 5%, #fe1a00 100% );
                filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#cc0029', endColorstr='#fe1a00');
                background-color: #cc0029;
            }

            .loginButton:active
            {
                position: relative;
                top: 1px;
            }
</style>

<table style="height:260px;width:1000px">
    <tr *ngIf="ValidationErrorsList && ValidationErrorsList.length > 0" style="height:1px;">
        <td style="vertical-align: top">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>



    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                     <td style="width: 100px; text-align:center; display:inline;">
                        <button class="loginButton" (click)="UnlockClicked()" style="margin-left:440px">Unlock >
                        </button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
