@defer  {
<div class="limiter">
    <div class="container-login">
        <div class="container-login-child">
            <div class="wrap-login">
                <div class="login-form">
                    <div>
                        <img alt="" class="logo-img" src="{{LogoImgSrc}}">
                    </div>
                    
                    <div *ngIf="!IsResetPasswordViaEmail">
                        <p style="color: #4B4A4A;font-size: 13px;font-family: Arial;">
                            Current password:
                        </p>
                    </div>

                    <div *ngIf="!IsResetPasswordViaEmail" class="wrap-input">
                        <input #input class="input" [(ngModel)]="CurrentPassword" type="password">
                    </div>

                    <div>
                        <p style="color: #4B4A4A;font-size: 13px;font-family: Arial;">
                            Password:
                        </p>
                    </div>

                    <div class="wrap-input">
                        <input #input class="input" [(ngModel)]="NewPassword" type="password" (keypress)="capLock($event)" (keyup)="Passwordkeyup(NewPassword)">
                    </div>

                    <!--<img width="16" src="./assets/images/changePassword/ChangePassword.png" /></div>-->
                    

                    <div>
                        <p style="color: #4B4A4A;font-size: 13px;font-family: Arial;">
                            Confirm password:
                        </p>
                    </div>
                    
                    <div class="wrap-input">
                        <input #input class="input" [(ngModel)]="RetypePassword" type="password">
                    </div>
                    
                    <div>
                        <p style="color: #4B4A4A;font-size: 13px;font-family: Arial;">
                            Your Password must have:
                        </p>
                    </div>
                    <div>
                        <p class="txt password-lenght" [ngStyle]="MainColor != null ? {'color': MainColor} : {}">
                            <img width="16" src={{PasswordLenghtImg}} />
                            8 or more characters
                        </p>
                        <p class="txt password-contains-characters" [ngStyle]="MainColor != null ? {'color': MainColor} : {}">
                            <img width="16" src={{PasswordContainsCharactersImg}} />
                            Upper & lowercase letters
                        </p>
                        <p class="txt password-contains-number" [ngStyle]="MainColor != null ? {'color': MainColor} : {}">
                            <img width="16" src={{PasswordContainsNumberImg}} />
                            At least one number
                        </p>
                    </div>

                    <div *ngIf="ErrorMessage">
                        <p style="font-family: Lucida Sans Unicode; font-size: 12px;color: red;">
                            {{ErrorMessage}}
                        </p>
                    </div>

                    <div style="margin-top: 2px;">
                        <div>
                            <div></div>
                            <button (click)="SubmitClicked()" class="login-form-btn" [ngStyle]="SecondaryColor != null ? {'background': SecondaryColor,'border-color': SecondaryColor} : {}">
                                Submit >
                            </button>
                        </div>
                    </div>
                    

                </div>
            </div>

            <div style="height:10px;">
            </div>
        </div>
    </div>
</div>
}
