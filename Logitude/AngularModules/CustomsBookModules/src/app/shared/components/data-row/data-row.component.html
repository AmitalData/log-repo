<div class="mainTable_item" [ngClass]="{'selected': isSelected}">
	<div class="mainTable_itemToggle" [class.active]="data?.IsShowChildren" (click)="expandClick()">
		<button *ngIf="data?.children.length > 0">
			<i role="img" aria-hidden="true"> <fa-icon [icon]="faArrowAltCircleLeft"></fa-icon> </i>
		</button>
	</div>
	<div class="mainTable_itemName" (click)="showDetails.emit()" #dynamicDiv>
		<a href="#" role="button" [ngClass]="{'selectedLink': isSelected}" [title]="data.CIH_GoodsDescription"
			(click)="$event.preventDefault()">
			<span class="full_classification" *ngIf="data?.CI_Parent_CustomsItemIDNum"
				[innerHTML]="highlight(ClassificationNoDisplay(data,data?.FullClassification), searchItem)"
				[title]="data.CIH_GoodsDescription">
				{{ ClassificationNoDisplay(data,data?.FullClassification) }}
			</span>
			<span *ngIf="data?.CI_Parent_CustomsItemIDNum" [title]="data.CIH_GoodsDescription"> | </span>
			<span class="full_classification" [title]="data.CIH_GoodsDescription"
				[innerHTML]="highlight(data.CIH_GoodsDescription, searchItem)">
				{{ data.CIH_GoodsDescription }}
			</span>
			<div *ngIf="!isShowDetailsOpen && ( TariffListCount > 0 && data?.CI_Parent_CustomsItemIDNum && ClassificationNoDisplay(data,data?.FullClassification).length > 2 && state === 'search')"
				class="item_details">
				<a> {{TariffListCount }} </a>
				<a> {{ TariffList1?.CustomsRate }} </a>
				<a> {{ TariffList2?.CustomsRate }} </a>
				<a> {{ TariffList2?.OptionalTaxAddition }} </a>
				<a> {{ TariffList1?.MeasurementUnitName }} </a>
			</div>
		</a>
	</div>
	<div></div>
	<div class="mainTable_itemActions" *ngIf="!this.showDetailsOpen.getValue()">
		<ul>
			<li>
				<div class="mainTable_itemDocument">
					<a class="icon"><i role="img" class="icon-document"> </i></a>
				</div>
			</li>
			<!--<li>
				<div class="mainTable_itemPopup">
					<a class="icon"><i role="img" class="icon-popup"></i> </a>
				</div>
			</li> -->
			<li>
				<div class="mainTable_itemComment" (click)="showAddCommentSidebar(data)">
					<a class="icon"> <i role="img" class="icon-comment_plus"></i></a>
				</div>
			</li>
			<!-- <li>
				<div class="mainTable_itemStarred" (click)="checked = !checked">
					<a class="icon"><i role="img" [class]="checked ? ' icon-star_full' : 'icon-star'"> </i></a>
				</div>
			</li> -->
		</ul>
	</div>
</div>
