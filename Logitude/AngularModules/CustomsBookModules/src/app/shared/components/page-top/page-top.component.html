<div class="pageTop">
	<div class="centeredContent">
		<div class="pageSearch">
			<strong style="text-align: start; min-width: 220px;">{{searchHeader}}</strong>
			<div class="pageSearch_form">
				<fieldset>
					<div class="pageSearch_formField shown" [id]="text">
						<input type="text" (input)="onChange($event)" [(ngModel)]="textToSearch"
							[maxlength]="isNumeric(textToSearch) ? 11 : 100" [placeholder]="text"
							(keyup.enter)="clickSearch()" [matAutocomplete]="searchCustomsItemAutocomplateComponent?.auto" />
						<app-search-customs-item-autocomplate
							(optionSelected)="onCustomsItemSelected(textToSearch)"></app-search-customs-item-autocomplate>
					</div>

					<button (click)="clickSearch()">חיפוש</button>
				</fieldset>
			</div>
		</div>
	</div>
</div>
