<div class="detailsSlide_box" id="rules">
    <div class="detailsSlide_comments" [class.hidden]="!showRules">
        <div class="detailsSlide_commentsTop">
            <div class="detailsSlide_commentsTitle">
                <a class="detailsSlide_commentsPinned" role="checkbox" aria-checked="false"
                    (click)="clickPin = !clickPin">
                    <i role="img" aria-hidden="true" [ngClass]="clickPin ? 'icon-pin' : 'icon-pin_full'"></i>
                    <!-- <i role="img" aria-hidden="true" class="icon-pin"></i> -->
                    <!-- <i role="img" aria-hidden="true" class="icon-pin_full"></i> -->
                </a>
                <h3>כללים ({{ groupRulesList.length }})</h3>
            </div>
            <div class="detailsSlide_commentsClose" (click)="showRules = false">
                <a role="button" aria-controls="comments">
                    <i role="img" aria-hidden="true" class="icon-close"></i>
                </a>
            </div>
        </div>

        <ul class="rulesList">
            <li class="rulesItem" *ngFor="let group of groupRulesList">
                <div class="rulesItem_toggle">
                    <a href="#" role="button" (click)="toggleRule(group, $event)" [attr.aria-expanded]="group.expanded">
                        {{ group.title }}
                    </a>
                </div>
                <div class="rulesItem_DDown" [class.shown]="group.expanded">
                    <div class="rulesItem_section">
                        <table class="boxRuleData">
                            <tr *ngFor="let rule of group.rules; let i = index" class="parentLine">
                                <td>{{ i + 1 }}</td>
                                <td>
                                    <span>
                                        {{ orderText(rule.Rules) }}
                                    </span>
                                    <table class="boxRuleDataChild">
                                        <tr *ngFor="let childItem of rule.childrens; let j = index">
                                            <td>{{ alephBetHelper.getLetterFromNumber(j + 1) }}</td>
                                            <td>{{ orderText(childItem.Rules) }}</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</div>
