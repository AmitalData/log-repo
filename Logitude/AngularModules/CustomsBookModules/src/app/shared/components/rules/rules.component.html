<div class="detailsSlide_box" id="rules">
    <div class="detailsSlide_comments" [class.hidden]="!showRules">
        <div class="detailsSlide_commentsTop">
            <div class="detailsSlide_commentsTitle">
                <a href="#" class="detailsSlide_commentsPinned" role="checkbox" aria-checked="false"
                    (click)="$event.preventDefault()"><i role="img" aria-hidden="true" class="icon-pin"></i><i
                        role="img" aria-hidden="true" class="icon-pin_full"></i></a>
                <h3>כללים ({{rules.length}})</h3>
            </div>
            <div class="detailsSlide_commentsClose"><a href="#" role="button" aria-controls="comments"><i role="img"
                        aria-hidden="true" class="icon-close"></i></a></div>
        </div>
        <ul class="rulesList">
            <li class="rulesItem" *ngFor="let rule of rules; let i = index">
                <div class="rulesItem_toggle">
                    <a href="#" role="button" (click)="toggleRule(rule, $event)" [attr.aria-expanded]="rule.expanded">
                        {{ rule.title }}
                    </a>
                </div>
                <div class="rulesItem_download"><a href="#" role="button"><i role="img" aria-hidden="true"
                            class="icon-download"></i></a></div>
                <div class="rulesItem_DDown" [class.shown]="rule.expanded">
                    <div class="rulesItem_section">
                        <table class="boxRuleData">
                            <tr>
                                <td>{{ i + 1}}</td>
                                <td>{{ rule.content }}</td>
                            </tr>
                        </table>
                    </div>
                </div>

            </li>
        </ul>
    </div>
</div>
