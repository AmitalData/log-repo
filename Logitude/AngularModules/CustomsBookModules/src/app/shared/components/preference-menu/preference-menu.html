<div class="preference-menu">
  <table>
    <thead>
      <tr>
        <th>היררכיה</th>
        <th>צבע טקסט</th>
        <th>צבע רקע</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of hierarchyLevels">
        <td>{{ item.label }}</td>
        <td>
          <input type="color" [(ngModel)]="preferences[item.level-1].BackgroundColor" />
        </td>
        <td>
          <input type="color" [(ngModel)]="preferences[item.level-1].TextColor" />
        </td>
      </tr>
    </tbody>
  </table>
  <div class="buttons">
    <button (click)="savePreferences()">שמור</button>
    <button (click)="clearPreferences()">CLEAR</button>
  </div>
</div>
