<div class="sidePanel" [class.active]="showAddComment">
    <div class="sidePanel_frame active">
       
        <div class="sidePanel_title">
            <div class="sidePanel_close" *ngIf="showAddComment">
                <a href="#" role="button" (click)="showAddComment = !showAddComment" aria-controls="commentPanel"
                    class="icon-close"></a>
            </div>
            <h3>{{'General.O.AddNewCommentTo' | TextCodeTranslationPipe}}</h3>
            <div class="commentWritesTo">
                <div class="commentWritesTo_read">
                    <div>
                        <span>{{currentItem?.FullClassification}}</span><span class="descriptionItemBox" [title]="currentItem?.CIH_GoodsDescription">{{currentItem?.CIH_GoodsDescription}}</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidePanel_body">
            <div class="sidePanel_addComment">
                <label>{{'General.O.CommentContent' | TextCodeTranslationPipe}}</label>
                <textarea [(ngModel)]="commentText" (input)="updateCommentText($event)"
                    placeholder="הקלידו תיאור/ שמות פריטים/ מידע עבור פרט מכס זה..."></textarea>
            </div>
            <div class="addComment_submit" (click)="sendComment()">
                <button [class.disabled]="commentText?.length < 1 || allComments?.length > 1">{{'   ' | TextCodeTranslationPipe}}</button>
            </div>
        </div>
        <div class="sidePanel_trapFocus"><a href="#" role="button">{{'General.O.BackToPanel ' | TextCodeTranslationPipe}}</a></div>


    </div>
</div>
