<div class="detailsSlide active" aria-hidden="false">
    <div class="detailsSlideFrame">
        <div class="detailsSlide_close"><a href="#" role="button" (click)="showDetails.emit(false)"
                (click)="$event.preventDefault()">
                &#10005;</a></div>
        <div class="detailsSlide_top">
            <div class="detailsSlide_title">

                <p class="rull_no">{{item?.FullClassification}}</p>
                <p class="rull_no">{{item?.CIH_GoodsDescription}}</p>
            </div>
            <div class="detailsSlide_topActions">
                <ul>
                    <li>
                        <div class="mainTable_itemDocument"  (click)="showRules = !showRules">
                            <a class="icon">
                                <i role="img" class="icon-document"> </i>
                            </a>
                        </div>
                    </li>
                    <!-- <li>
                        <div class="mainTable_itemPopup"><a class="icon"><i role="img" class="icon-popup"></i> </a>
                        </div>
                    </li> -->
                    <!-- <li>
                        <div class="mainTable_itemComment" (click)="showComments =!showComments"  class="showComment"><a class="icon">
                                <i role="img" class="icon-comment"></i></a>
                                <span class="countOfComments">{{countOfComments}}</span>
                        </div>
                    </li> -->

                    <li *ngIf="countOfComments > 0; else newComment">
                        <div class="mainTable_itemComment" (click)="showComments = !showComments">
                            <a class="icon" aria-expanded="true">
                                <i role="img"
                                    [ngClass]="{'icon-comment': !showComments, 'icon-comment_full': showComments}"></i>
                            </a>
                            <span class="countOfComments">{{ countOfComments }}</span>
                        </div>
                    </li>
                    <ng-template #newComment>
                        <li>
                            <div class="mainTable_itemComment" (click)="showAddCommentSidebar()">
                                <a class="icon"> <i role="img" class="icon-comment_plus"></i></a>
                            </div>
                        </li>
                    </ng-template>
                    <!-- <li>
                        <div class="mainTable_itemStarred" (click)="checked = !checked"><a class="icon"><i role="img"
                                    [class]="checked? ' icon-star_full' :'icon-star' ">
                                </i></a>
                        </div>
                    </li> -->
                </ul>

            </div>
        </div>
        <div class="conetnt_container">
            <app-rules [showRules]="showRules" [currentItem]="item" />
            <app-comments [showComments]="showComments" [currentItem]="item" />
            <app-accordion [currentItem]="currentItem"></app-accordion>
        </div>
    </div>
</div>
