<div class="detailsSlide active" aria-hidden="false">
    <div class="detailsSlideFrame">
      
        <div class="detailsSlide_top">
            <div class="detailsSlide_title">

                <p class="rull_no">{{item?.FullClassification}}</p>
                <p class="rull_no">{{item?.CIH_GoodsDescription}}</p>
            </div>
            <div class="detailsSlide_topActions">
                <ul>
                    <li>
                        <div class="mainTable_itemDocument" (click)="showRules = !showRules">
                            <a class="icon"><i role="img"
                                    [ngClass]="!showRules ? 'icon-document' : 'icon-document_full'"> </i></a>
                        </div>
                    </li>
                    <li *ngIf="countOfComments > 0; else newComment">
                        <div class="mainTable_itemComment" (click)="showComments = !showComments">
                            <a class="icon" aria-expanded="true">
                                <i role="img"
                                    [ngClass]="{'icon-comment': !showComments, 'icon-comment_full': showComments}"></i>
                            </a>
                            <span class="countOfComments">{{ countOfComments }}</span>
                        </div>
                    </li>
                    <ng-template #newComment>
                        <li>
                            <div class="mainTable_itemComment" (click)="showAddCommentSidebar()">
                                <a class="icon"> <i role="img" class="icon-comment_plus"></i></a>
                            </div>
                        </li>
                    </ng-template>
                    <li>
                        <div class="detailsSlide_close" [ngClass]="showDetailsStatus ? '' : 'showDetailsStatus'"><a href="#"
                            role="button" (click)="showDetails.emit(false)" (click)="$event.preventDefault()">
                            &#10005;</a></div>
                    </li>
                </ul>

            </div>
        </div>
        <div class="conetnt_container">
            <app-rules class="conetntContainerData" [showRules]="showRules" [currentItem]="currentItem"
                (closeRules)="closeRules()" />
            <app-comments class="conetntContainerData" [showComments]="showComments" [currentItem]="item"
                (closeComments)="closeComments()" />
            <app-accordion class="conetntContainerData" [currentItem]="currentItem"></app-accordion>
        </div>
    </div>
</div>
