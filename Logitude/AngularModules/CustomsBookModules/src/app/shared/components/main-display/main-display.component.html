<div class="mainTable">
	<app-add-comment class="addCommentSlider" [customsItemsID]="itemData?.customsItemId"/>
	<div class="centeredContent">
		<div class="mainTable_list">
			<div class="data_row_container" [class.active]="!showDetails">
				<app-table-top class="app-table-top" [class.active]="!showDetails" />
				<ul *ngFor="let item of data" class="wtree">
					<app-data-row [data]="item.CIH_GoodsDescription"
						(showCommentSidebar)="showAddComment = !showAddComment"
						(showDetails)="showDetails = !showDetails"
						(showChildern)="showChildern(item.CIH_GoodsDescription)" class="app-data-row"
						(click)="showDetailsClick(item.CustomsItemID, item)">
					</app-data-row>
					<ul class="wtree" [@inOutAnimation]>
						<ng-container
							*ngIf="item.children && item.children.length > 0 && childrenToDesplay.includes(item.CIH_GoodsDescription)">
							<ng-container *ngFor="let key2 of Object.keys(item.children)">
								<li [@inOutAnimation]>
									<app-data-row [data]="item.children[key2]?.CIH_GoodsDescription"
										(showCommentSidebar)="showAddComment = !showAddComment"
										(showDetails)="showDetails = !showDetails" class="app-data-row"
										(showChildern)="showChildern(item.children[key2]?.CIH_GoodsDescription)"
										(click)="showDetailsClick(item.children[key2]?.CustomsItemID , item.children[key2])">
									</app-data-row>
									<ng-container *ngIf=" item.children[key2] && item.children.length > 0 && childrenToDesplay.includes(item.children[key2]?.CIH_GoodsDescription)">
										<ul [@inOutAnimation]>
											<ng-container
												*ngFor="let key3 of Object.keys(item.children[key2].children)">
												<li [@inOutAnimation]>
													<app-data-row
														[data]="item.children[key2].children[key3]?.CIH_GoodsDescription"
														(showCommentSidebar)="showAddComment = !showAddComment"
														(showDetails)="showDetails = !showDetails" class="app-data-row"
														(showChildern)="showChildern(item.children[key2].children[key3]?.CIH_GoodsDescription)"
														(click)="showDetailsClick(item.children[key2].children[key3]?.CustomsItemID , item.children[key2].children[key3])">
													</app-data-row>
													<ng-container *ngIf=" item.children[key2].children[key3] && item.children.length > 0 && childrenToDesplay.includes(item.children[key2].children[key3]?.CIH_GoodsDescription)">
														<ul [@inOutAnimation]>
															<ng-container
																*ngFor="let key4 of Object.keys(item.children[key2].children[key3].children)">
																<li [@inOutAnimation]>
																	<app-data-row
																		[data]="item.children[key2].children[key3].children[key4]?.CIH_GoodsDescription"
																		(showCommentSidebar)="showAddComment = !showAddComment"
																		(showDetails)="showDetails = !showDetails"
																		class="app-data-row"
																		(click)="showDetailsClick(item.children[key2].children[key3].children[key4]?.CustomsItemID, item.children[key2].children[key3].children[key4])">
																	</app-data-row>
																</li>
															</ng-container>
														</ul>
													</ng-container>
												</li>
											</ng-container>
										</ul>
									</ng-container>
								</li>
							</ng-container>
						</ng-container>
					</ul>
				</ul>
			</div>
			<div class="details_frame_container" [class.active]="showDetails">
				<app-details-frame (showDetails)="showDetails = !showDetails" [itemData]="itemDataBehaviorSubject"
					 [currentItem]="currentItem"/>
			</div>
		</div>
	</div>
</div>
