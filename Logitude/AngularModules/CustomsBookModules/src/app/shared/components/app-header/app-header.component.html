<div class="centeredContent">
	<div class="headerFlex">
		<!-- logo area -->
		<div class="headerLeft">
			<!-- Settings of colors level: -->
			<app-preference-menu class="preference_menu_box"></app-preference-menu>
			<!-- logo: -->
			<div class="headerLogo">
				<a href=""><img class="logoImage" src="assets/images/amital.png" alt="UNIFREIGHT" /></a>
				<span *ngIf="lastUpdateTaskScheduled" style="font-size: 12px;">תאריך עדכון אחרון: {{ lastUpdateTaskScheduled | date: 'dd/MM/yyyy' }}</span>
			</div>
		</div>
		<!-- Search area -->
		<div class="page-top-box">
			<app-page-top class="app-page-top-box" (searchClick)="SearchByText($event)"></app-page-top>
		</div>
		<!-- discountCodes area -->
		<div class="togglediscountCodes"  *ngIf="selected != 'אוטונומיה'">
			<ul role="discountCodesTab">
				<li [class.checked]="IsDiscountCodes">
					<label><input (click)="updateIsDiscountCodes()" type="radio" name="pageSearch_toggle" [checked]="IsDiscountCodes"
							class="fst-btn" aria-controls="sectionSelect1" /><span>{{discountCodes}}</span></label>
				</li>
			</ul>
		</div>
		<!-- header area -->
		<div class="headerToggle">
			<ul role="tablist">
				<li (click)="selectState('אוטונומיה')" [class.checked]="selected === 'אוטונומיה'">
					<label><input type="radio" name="pageSearch_toggle" [checked]="selected === 'אוטונומיה'"
							class="fst-btn" aria-controls="sectionSelect1" /><span>אוטונומיה</span></label>
				</li>
				<li (click)="selectState('יצוא')" [class.checked]="selected === 'יצוא'">
					<label><input type="radio" checked="" name="pageSearch_toggle" [checked]="selected === 'יצוא'"
							class="fst-btn" aria-controls="sectionSelect1" /><span>יצוא</span></label>
				</li>
				<li class="importBox" (click)="selectState('יבוא')" [class.checked]="selected === 'יבוא'">
					<label><input type="radio" checked="" name="pageSearch_toggle" [checked]="selected === 'יבוא'"
							class="fst-btn" aria-controls="sectionSelect1" /><span>יבוא</span></label>
				</li>
			</ul>
		</div>
	</div>
