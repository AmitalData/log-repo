<div class="centeredContent">
	<div class="headerFlex">	
		<!-- header area -->
		<div class="headerToggle">
			<ul role="tablist">
				<li (click)="selectState('יבוא')" [class.checked]="selected === 'יבוא'">
					<label><input type="radio" checked="" name="pageSearch_toggle" [checked]="selected === 'יבוא'"
							class="fst-btn" aria-controls="sectionSelect1" /><span>יבוא</span></label>
				</li>				
				<li (click)="selectState('יצוא')" [class.checked]="selected === 'יצוא'">
					<label><input type="radio" checked="" name="pageSearch_toggle" [checked]="selected === 'יצוא'"
						class="fst-btn" aria-controls="sectionSelect1" /><span>יצוא</span></label>
				</li>
				<li (click)="selectState('אוטונומיה')" [class.checked]="selected === 'אוטונומיה'">
					<label><input type="radio" name="pageSearch_toggle" [checked]="selected === 'אוטונומיה'"
							class="fst-btn" aria-controls="sectionSelect1" /><span>אוטונומיה</span></label>
				</li>
			</ul>
		</div>
		<!-- Search area -->
		<div>
			<app-page-top (searchClick)="SearchByText($event)"></app-page-top>
		</div>
		<!-- logo area -->
		<div class="headerLeft">
			<div class="headerLogo">
				<a href="#"><img class="logoImage" src="assets/images/amital.png" alt="UNIFREIGHT" /></a>
			</div>			
		</div>
	</div>
</div>
