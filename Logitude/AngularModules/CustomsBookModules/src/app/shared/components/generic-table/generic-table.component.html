<div class="detailsSlide_table tableBox">
    <table *ngIf="tableData?.columns?.length > 0">
        <tr>
            <ng-container *ngFor="let col of tableData.columns">
                <th [style.width]="col.width" *ngIf="col.visible">{{ col.displayName }}</th>
            </ng-container>
        </tr>
        <tr *ngFor="let row of tableData.data">
            <ng-container *ngFor="let col of tableData.columns">
                <td *ngIf="col.visible && col.dataType == 'img'; else notImgCell">
                    <img [src]="'' + row[col.key]" />
                </td>
                <ng-template #notImgCell>
                    <td *ngIf="col.visible && col.dataType == fileTypes.pdf; else notFileCell">
                        <a *ngIf="row[col.key]; else notBase64" (click)="openBase64File(row[col.key], fileTypes.pdf)" style="cursor: pointer;">
                            <i class="fas fa-file-pdf" style="font-size: 18px; color: black;"></i>
                        </a>
                        <ng-template #notBase64>-</ng-template>
                    </td>
                    <ng-template #notFileCell>
                        <td *ngIf="col.visible && col.dataType == 'boolean'; else otherCell">
                            {{ row[col.key] ? 'כן' : 'לא' }}
                        </td>
                        <ng-template #otherCell>
                            <td *ngIf="col.visible && col.dataType == 'button'; else notButtonCell">
                                <a href="#" (click)="onButtonClick($event, row, col.key)"
                                    (click)="$event.preventDefault()">{{ row[col.key] }}</a>
                            </td>
                            <ng-template #notButtonCell>
                                <td
                                    *ngIf="col.visible && (col.dataType != 'date' && col.dataType != 'link' && !row[col.link?.key]); else dateOrLinkCell">
                                    {{ row[col.key] ? row[col.key] : '-' }}
                                </td>
                                <ng-template #dateOrLinkCell>
                                    <td *ngIf="col.visible && col.dataType == 'date'; else linkCell">
                                        {{ row[col.key] ? (row[col.key] | date:'dd/MM/yyyy') : '-' }}
                                    </td>
                                    <ng-template #linkCell>
                                        <td *ngIf="col.visible && col.dataType == 'link'">
                                            <a *ngIf="shouldDisplayLink(col.link?.condition, row[col.key]); else linkCondition"
                                                [href]="checkLink(col.link?.url, row[col.link?.key])" target="_blank">{{
                                                row[col.key] ? row[col.key] : '' }}</a>
                                            <ng-template #linkCondition>
                                                <span>{{ row[col.key] ? row[col.key] : '' }}</span>
                                            </ng-template>
                                        </td>
                                    </ng-template>
                                </ng-template>
                            </ng-template>
                        </ng-template>
                    </ng-template>
                </ng-template>
            </ng-container>
        </tr>
    </table>
</div>
