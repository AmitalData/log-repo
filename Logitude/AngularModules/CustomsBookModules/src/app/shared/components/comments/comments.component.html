<div class="detailsSlide_box" id="comments">
    <div class="detailsSlide_comments" [class.hidden]="!showComments">
        <div class="detailsSlide_commentsTop">
            <div class="detailsSlide_commentsTitle">
                <a href="#" class="detailsSlide_commentsPinned" role="checkbox" aria-checked="false"><i role="img"
                        aria-hidden="true" class="icon-pin"></i><i role="img" aria-hidden="true"
                        class="icon-pin_full"></i></a>
                <h3 *ngIf="allComments?.length >= 0">הערות בפרק ({{allComments?.length}})</h3>
            </div>
            <div class="detailsSlide_commentsNew">
                <a href="#" role="button" (click)="showAddCommentSidebar()" (click)="$event.preventDefault()"> <i role="img" aria-hidden="true"
                        class="icon-new"> </i><span>הערה חדשה</span></a>
            </div>
            <div class="detailsSlide_commentsClose" (click)="showComments = !showComments"><a href="#" role="button"
                    aria-controls="comments"><i role="img" aria-hidden="true" class="icon-close"></i></a></div>
        </div>
        <div class="commentsList" *ngIf="allComments?.length > 0">
            <div class="comment" *ngFor="let comment of allComments">
                <div class="commentTitle">
                    <!-- fields: createDate and userName is deleted -->
                    <!-- <div class="commentUser"><img src="assets/images/man.jpg" alt=""><span>יונתן
                            שמעוני</span></div>
                    <div class="commentDate">15/03/2020</div> -->
                    <div class="commentSection">{{currentItem.CIH_GoodsDescription}}</div>
                </div>
                <div class="commentOptions">
                    <a href="#" role="button" class="commentOptions_toggle">
                        <i role="img" aria-hidden="true" class="icon-dots"></i></a>
                    <div class="commentOptions_pop">
                        <ul>
                            <li><a href="#" role="button"><i role="img" aria-hidden="true"
                                        class="icon-pencil"></i><span>עריכה</span></a></li>
                            <li><a href="#" role="button"><i role="img" aria-hidden="true"
                                        class="icon-trash"></i><span>מחיקה</span></a></li>
                        </ul>
                        <div class="commentOptions_trapFocus"><a href="#" role="button">חזור לתחילת הפאנל</a></div>
                    </div>
                </div>
                <div class="commentText">
                    <p>{{ comment.RemarkDescription }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
