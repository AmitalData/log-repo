<div class="detailsSlide_box" id="comments" *ngIf="showComments && allComments?.length > 0">
    <div class="detailsSlide_toggle" (click)="expandedArea = !expandedArea">
        <div>
            <h3 *ngIf="allComments?.length >= 0">הערות בפרק ({{allComments?.length}})</h3>
        </div>
        <div class="toggle" [class.active]="expandedArea">
            <fa-icon [size]="'xl'" class="toggle-close" [fixedWidth]="true" [icon]="faChevronDown"></fa-icon>
        </div>
    </div>
    <div class="detailsSlide_ddown" [class.active]="expandedArea" id="detailsSlide_ddown01">
        <section class="title">
            <div class="commentsList" *ngIf="!expandedArea">
                <div class="comment" *ngFor="let comment of allComments">
                    <div class="commentTitle">
                        <div class="commentSection">{{currentItem?.CIH_GoodsDescription}}</div>
                    </div>
                    <div class="commentOptions">
                        <a href="#" role="button" class="commentOptions_toggle" (click)="showMenu()"
                            (click)="$event.preventDefault()">
                            <i role="img" aria-hidden="true" class="icon-dots"></i>
                        </a>
                        <div class="commentOptions_pop" *ngIf="showMenuOpen">
                            <ul style="padding: 5px;">
                                <li>
                                    <a href="#" role="button" (click)="editComment($event,comment)">
                                        <i role="img" aria-hidden="true" class="icon-pencil"></i><span>עריכה</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#" role="button" (click)="deleteComment($event, comment)">
                                        <i role="img" aria-hidden="true" class="icon-trash"></i><span>מחיקה</span>
                                    </a>
                                </li>
                            </ul>
                            <div class="commentOptions_trapFocus" (click)="$event.preventDefault()">
                                <a href="#" role="button">חזור לתחילת הפאנל</a>
                            </div>
                        </div>
                    </div>
                    <div class="commentText">
                        <p class="commentSection" [innerHTML]="highlight(comment.RemarkDescription)">
                            {{comment.RemarkDescription}}
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
