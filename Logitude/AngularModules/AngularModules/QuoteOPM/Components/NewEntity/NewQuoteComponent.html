<p-toast position="center"></p-toast>

<form (submit)='create()' [ngClass]='{"ng-submitted":isSubmit}'>
    <div class="section root-header">
        <h2 class="root-header-text">Create New Quote</h2>
    </div>

    <div class="container">
        <div class="section left-side">
            <app-new-quote-left-side [formGroup]='formGroup' [EntityPM]='EntityPM'></app-new-quote-left-side>
        </div>

        <div class="right-side"
            [ngClass]="{'disabled':!formGroup.controls.direction?.value || !formGroup.controls.transportMode?.value ||  
    (formGroup.controls.transportMode?.value?.Name === 'Ocean' || formGroup.controls.transportMode?.value?.Name === 'Inland') &&  !formGroup.controls.shipmentType?.value}">

            <div class="section">
                <app-new-quote-partner [type]='"shipper"' [formGroup]='formGroup' [EntityPM]='EntityPM'>
                </app-new-quote-partner>
            </div>

            <div class="section">
                <app-new-quote-partner [type]='"consignee"' [formGroup]='formGroup' [EntityPM]='EntityPM'>
                </app-new-quote-partner>
                <!-- <hr> -->
                <!-- <app-new-quote-my-customers [formGroup]='formGroup'></app-new-quote-my-customers> -->
            </div>

            <app-new-quote-properties [formGroup]='formGroup' [EntityPM]='EntityPM'></app-new-quote-properties>

            <div class="section">
                <app-new-quote-general [formGroup]='formGroup' [EntityPM]='EntityPM'></app-new-quote-general>
            </div>

            <div class="section section-order">
                <app-new-quote-expected-order [formGroup]='formGroup' [EntityPM]='EntityPM'>
                </app-new-quote-expected-order>
            </div>

            <!-- <div class="section">
                <app-accordion label='Additional Fields'></app-accordion>
            </div> -->

        </div>
    </div>
    <div class="section-btn">
        <button pButton pRipple style="color: #f57974; border-radius: 5px;" type="button" label="Danger"
            class="p-button-raised  p-button-text" icon="pi pi-times" iconPos="right" (click)='cancel()'></button>
        <button pButton pRipple style="color: #1084dc; border-radius: 5px;" type="submit" label="Create"
            class="p-button-raised p-button-text" icon="pi pi-check" iconPos="right"></button>
    </div>
</form>
