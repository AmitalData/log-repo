<div class="section root-header">
    <h2>Create New Quote</h2>
</div>

<div class="grid container" [formGroup]="formGroup">
    <div class="col-2 section right-grid">
        <app-new-quote-left-side [formGroup]='formGroup'></app-new-quote-left-side>
    </div>

    <!-- [ngClass]="{'disabled':!formGroup.controls.direction.value || !formGroup.controls.transporation.value ||  
    (formGroup.controls.transporation.value === transporations[1].value || formGroup.controls.transporation.value === transporations[2].value) &&  !formGroup.controls.shipmentType.value}" -->
    <div class="col-10 right-side">
        <div class="section">

            <app-new-quote-shipper [formGroup]='formGroup'></app-new-quote-shipper>
            <app-new-quote-consignee [formGroup]='formGroup'></app-new-quote-consignee>
            <app-new-quote-my-customers [formGroup]='formGroup'></app-new-quote-my-customers>
        </div>

        <div class="section">
            <app-new-quote-properties [formGroup]='formGroup'></app-new-quote-properties>
        </div>

        <div class="section">
            <app-new-quote-general [formGroup]='formGroup'></app-new-quote-general>
        </div>

        <div class="grid">
            <div class="col-6 section section-pickup">
                <app-new-quote-pickup [formGroup]='formGroup'></app-new-quote-pickup>
            </div>

            <div class="col-6 section section-delivery">
                <app-new-quote-delivery [formGroup]='formGroup'></app-new-quote-delivery>
            </div>
        </div>

        <div class="section">
            <app-new-quote-expected-order [formGroup]='formGroup'></app-new-quote-expected-order>
        </div>

        <div class="section">
            <h2>Additional Fields</h2>

            <button pButton type="button" label="Cancel" class="p-button-danger"></button>
            <button pButton type="button" label="Create" class="p-button-primary"></button>
        </div>

    </div>
</div>
