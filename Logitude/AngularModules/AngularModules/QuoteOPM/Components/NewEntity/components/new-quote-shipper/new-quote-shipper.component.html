<div class="grid"  [formGroup]='formGroup'>
    <div class="col-6 p-fluid">
      <div class="p-field">
        <label for="shipperName">Name</label>
        <p-autoComplete formControlName="shipperName" id="shipperName" [suggestions]="shipperNamesSelected"
          [dropdown]="true" (completeMethod)="searchShipperNames($event)"
          (onBlur)='onBlurName()' field='EnglishName'>

            <ng-template pTemplate="item" let-shipper>
                <tr>
                    <td>{{shipper.Code}}</td>
                    <td>{{shipper.EnglishName}}</td>
                    <td>{{shipper.Address1}}</td>
                    <td>{{shipper.CityName}}</td>
                    <td>{{shipper.CountryName}}</td>
                    <td>{{shipper.PartnerTypeName}}</td>
                </tr>
            </ng-template>
          <!-- <ng-template let-x pTemplate="item">{{x.EnglishName}}</ng-template> -->
        </p-autoComplete>
      </div>

      <div class="p-field">
        <label for="shipperAddress">Address</label>
        <input formControlName="shipperAddress" id="shipperAddress" type="text" pInputText>
      </div>

      <div class="p-field">
        <label for="shipperReference1">Reference 1</label>
        <input formControlName="shipperReference1" id="shipperReference1" type="text" pInputText>
      </div>
    </div>

    <div class="col-6 p-fluid">
      <div class="p-field">
        <label for="shipperContact">Contact</label>
        <p-autoComplete formControlName="shipperContact" id="shipperContact"
          [suggestions]="shipperContactSelected" [dropdown]="true" (completeMethod)="searchShipperContact($event)"
          (onKeyUp)='keyUp(formGroup.controls.shipperContact, shipperContacts)'>
          <ng-template let-x pTemplate="item">{{x}}</ng-template>
        </p-autoComplete>
      </div>

      <div class="p-field">
        <label for="shipperNotes">Notes</label>
        <input formControlName="shipperNotes" id="shipperNotes" type="text" pInputText>
      </div>

      <div class="p-field">
        <label for="shipperReference2">Reference 2</label>
        <input formControlName="shipperReference2" id="shipperReference2" type="text" pInputText>
      </div>
    </div>
  </div>
