<div [formGroup]='propertyForm' class="">
    <p-checkbox formControlName='deliveryInclude' [binary]="true"
        label='{{"QuoteOP.O.NewQuote.IncludeDelivery" | TextCodeTranslationPipe}}'
        (onChange)="includeCheckboxChange($event)"></p-checkbox>

    <div [hidden]='!propertyForm.controls.deliveryInclude.value' class='container'>
        <div [hidden]='AddressList.length'>
            <h5>{{"QuoteOP.S.NewQuote.DeliveryAddress" | TextCodeTranslationPipe}}</h5>
            <div class="p-fluid">
                <div class="p-field">
                    <label for="deliveryZipCode">{{"QuoteOP.S.NewQuote.ZipCode" | TextCodeTranslationPipe}}</label>
                    <p-inputNumber formControlName='deliveryZipCode' id="deliveryZipCode" mode="decimal"
                        [useGrouping]="false">
                    </p-inputNumber>
                </div>

                <div class="p-field">
                    <!-- <app-autocomplate-table [columnsShow]="['Name', 'LocalName', 'Country', 'State']" [data]='cityList'
                    [fieldShow]='"Name"' [label]='"QuoteOP.S.NewQuote.City" | TextCodeTranslationPipe'
                    [controlName]='"deliveryCity"' [formGroup]='propertyForm' (onSelect)='onSelectedCity($event)'>
                </app-autocomplate-table> -->
                    <label for="deliveryZipCode">{{"QuoteOP.S.NewQuote.City" | TextCodeTranslationPipe}}</label>
                    <input formControlName='deliveryCity' id="deliveryZipCode" pInputText />
                </div>

                <div class="p-field">
                    <app-autocomplate-table [columnsShow]="{Code:'Code',EnglishName:'Name'}" [data]='countryList'
                        [fieldShow]='"EnglishName"' [label]='"QuoteOP.S.NewQuote.Country" | TextCodeTranslationPipe'
                        [controlName]='"deliveryCountry"' [formGroup]='propertyForm'
                        (onSelect)='onSelectedCountry($event)'>
                    </app-autocomplate-table>
                </div>
            </div>
        </div>

        <div [hidden]='!AddressList.length'>
            <div class="p-field">
                <app-autocomplate-table [columnsShow]="['Description', 'Name', 'Address1']" [data]='AddressList'
                    [fieldShow]='"Description"' [label]="'QuoteOP.S.NewQuote.Name' | TextCodeTranslationPipe"
                    [controlName]='"deliveryAddress"' [formGroup]='propertyForm'>
                </app-autocomplate-table>
                <i class="pi pi-pencil" (click)='editAddress()' [ngClass]='{"disabled":!Address}'></i>
                <i class="pi pi-plus" (click)='addAddress()'></i>
            </div>

            <app-address-textarea [Address]='Address'></app-address-textarea>
        </div>
    </div>
</div>
