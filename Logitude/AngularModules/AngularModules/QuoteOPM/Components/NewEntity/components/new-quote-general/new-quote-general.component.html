<h2 class="sub-header">{{'QuoteOP.S.NewQuote.General' | TextCodeTranslationPipe}}</h2>

<div class="grid p-fluid content-in-section" [formGroup]='formGroup'>
  <div class="col-12">
    <h5 class="text-style">Quote Type</h5>
    <div class='radio-row' *ngFor='let x of quoteTypes'>
      <p-radioButton (click)='checkType(x.code)' [value]="x.code" formControlName="quoteType"
        [label]='x.text'></p-radioButton>
    </div>
  </div>

  <div class="col-3 p-field">
    <label for="StartDate_Date">Start Date</label>
    <p-calendar formControlName='startDate' id="StartDate_Date" showTime="true" showIcon='true'></p-calendar>
  </div>

  <div class="col-3 p-field">
    <label for="expirationDate_Date">Expiration Date</label>
    <p-calendar formControlName='expirationDate' id="expirationDate_Date" showTime="true" showIcon='true'></p-calendar>
  </div>

  <div class="col-6 p-field">
    <label for="expirationDays">Expiration Days</label>
    <p-inputNumber formControlName="expirationDays" mode="decimal" inputId="expirationDays" [useGrouping]="false">
    </p-inputNumber>
  </div>

  <div class="col-3 p-field">
    <app-autocomplate-table [columnsShow]="{Code:'Code',MoveTypeEnglishName:'English Name'}" [data]='moveTypes' [dropIcon]='true'
      [fieldShow]='"MoveTypeEnglishName"' [label]="'Move Type'" [controlName]='"moveType"' [formGroup]='formGroup' logTableName='MoveType'>
    </app-autocomplate-table>
  </div>

  <div class="col-3 p-field col-align">
    <p-checkbox formControlName='isAutomaticallyClosed' [binary]="true"></p-checkbox>
    <span class="checkbox-text">{{'QuoteOP.S.NewQuote.CloseAutomatically' | TextCodeTranslationPipe}}</span>
  </div>

  <div class="col-3 p-field col-align">
    <p-inputNumber  formControlName='automaticallyCloseDays' mode="decimal" [useGrouping]="false"
      [disabled]='!formGroup.controls.isAutomaticallyClosed.value'
       inputStyleClass='close-days'></p-inputNumber>
       <span class="close-days-text">{{'QuoteOP.S.NewQuote.Days' | TextCodeTranslationPipe}}</span>
  </div>

  <div class="col-3 p-field">
    <label for="closeDate_Date">{{'QuoteOP.S.NewQuote.CloseDate' | TextCodeTranslationPipe}}</label>
    <p-calendar formControlName='automaticallyCloseDate' id="closeDate_Date"
      [disabled]='!formGroup.controls.isAutomaticallyClosed.value' showIcon='true'></p-calendar>
  </div>
</div>
