<div [formGroup]="formGroup">
    <div class='radio-section'>
        <h4 class='label'>Direction</h4>
        <div class='radio-row' *ngFor='let x of directionList'
            [ngClass]="{'radio-checked':formGroup.controls.direction.value?.Name === x.Name}"
            (click)='formGroup.controls.direction.setValue(x)'>
            <label [for]="x.Name"><img [src]="icons[x.Name]"></label>
            <p-radioButton [inputId]="x.Name" [value]="x" formControlName="direction" [label]='x.Name' [labelStyleClass]='"simple-text"' >
            </p-radioButton>
        </div>
    </div>

    <div class='radio-section'>
        <h4 class='label'>Transporatation</h4>
        <div class='radio-row' *ngFor='let x of transportModeList'
        [ngClass]="{'radio-checked':formGroup.controls.transportMode.value?.Name === x.Name}"
        (click)='formGroup.controls.transportMode.setValue(x)'>
        <label [for]="x.Name"><img [src]="icons[x.Name]"></label>
        <p-radioButton [inputId]="x.Name" [value]="x" formControlName="transportMode" [label]='x.Name' [labelStyleClass]='"simple-text"'>
        </p-radioButton>
    </div>
</div>

<div class='radio-section' [hidden]='formGroup.controls.transportMode.value?.Name !== "Ocean" && formGroup.controls.transportMode.value?.Name !== "Inland"'>
    <h4 class='label'>Shipment Type</h4>
    <div class='radio-row' *ngFor='let x of shipmentTypeList'
        [ngClass]="{'radio-checked':formGroup.controls.shipmentType.value?.Name === x.Name}"        
        (click)='formGroup.controls.shipmentType.setValue(x)'>
        <label [for]="x.Name"><img [src]="icons[x.Name]"></label>
        <p-radioButton [inputId]="x.Name" [value]="x" formControlName="shipmentType" [label]='x.Name' [labelStyleClass]='"simple-text"'>
        </p-radioButton>
    </div>
</div>
</div>
