<div [formGroup]="formGroup">
    <div class='radio-section'>
        <div class='radio-row' *ngFor='let x of directionList'
            [ngClass]="{'radio-checked':formGroup.controls.direction.value?.Name === x.Name}">
            <label [for]="x.Name"><img [src]="icons[x.Name]"></label>
            <p-radioButton [inputId]="x.Name" [value]="x" formControlName="direction" [label]='x.Name' (onClick)='a($event)'>
            </p-radioButton>
        </div>
    </div>

    <div class='radio-section'>
        <div class='radio-row' *ngFor='let x of transportModeList'
            [ngClass]="{'radio-checked':formGroup.controls.transportMode.value?.Name === x.Name}">
            <label [for]="x.Name"><img [src]="icons[x.Name]"></label>
            <p-radioButton [inputId]="x.Name" [value]="x" formControlName="transportMode" [label]='x.Name'>
            </p-radioButton>
        </div>
    </div>

    <div class='radio-row' *ngFor='let x of shipmentTypeList'
        [ngClass]="{'radio-checked':formGroup.controls.shipmentType.value?.Name === x.Name}"
        [hidden]='formGroup.controls.transportMode.value?.Name !== "Ocean" && formGroup.controls.transportMode.value?.Name !== "Inland"'>
        <label [for]="x.Name"><img [src]="icons[x.Name]"></label>
        <p-radioButton [inputId]="x.Name" [value]="x" formControlName="shipmentType" [label]='x.Name'>
        </p-radioButton>
    </div>
</div>
