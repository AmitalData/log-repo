<div [formGroup]="formGroup">
    <h3>consignee</h3>
    <div class="grid">
        <div class="col-6 p-fluid">
            <div class="p-field">
                <label for="consigneeName">Name</label>
                <p-autoComplete formControlName="consigneeName" id="consigneeName"
                    [suggestions]="consigneeNamesSelected" [dropdown]="true"
                    (completeMethod)="searchConsigneeNames($event)"
                    (onKeyUp)='keyUp(formGroup.controls.consigneeName, consigneeNames)'>
                    <ng-template let-x pTemplate="item">{{x}}</ng-template>
                </p-autoComplete>
            </div>

            <div class="p-field">
                <label for="consigneeAddress">Address</label>
                <input formControlName="consigneeAddress" id="consigneeAddress" type="text" pInputText>
            </div>

            <div class="p-field">
                <label for="consigneeReference1">Reference 1</label>
                <input formControlName="consigneeReference1" id="consigneeReference1" type="text" pInputText>
            </div>
        </div>

        <div class="col-6 p-fluid">
            <div class="p-field">
                <label for="consigneeContact">Contact</label>
                <p-autoComplete formControlName="consigneeContact" id="consigneeContact"
                    [suggestions]="consigneeContactSelected" [dropdown]="true"
                    (completeMethod)="searchConsigneeContact($event)"
                    (onKeyUp)='keyUp(formGroup.controls.consigneeContact, consigneeContacts)'>
                    <ng-template let-x pTemplate="item">{{x}}</ng-template>
                </p-autoComplete>
            </div>

            <div class="p-field">
                <label for="consigneeNotes">Notes</label>
                <input formControlName="consigneeNotes" id="consigneeNotes" type="text" pInputText>
            </div>

            <div class="p-field">
                <label for="consigneeReference2">Reference 2</label>
                <input formControlName="consigneeReference2" id="consigneeReference2" type="text" pInputText>
            </div>
        </div>
    </div>
</div>
