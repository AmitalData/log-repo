<h2 class="sub-header">{{"QuoteOP.S.NewQuote.Pickup" | TextCodeTranslationPipe}}</h2>
<div [formGroup]='formGroup' class="content-in-section">
    <p-checkbox formControlName='pickupInclude' [binary]="true" label='Include PickUp'
        (onChange)="includeCheckboxChange($event)"></p-checkbox>

    <div [hidden]='!formGroup.controls.pickupInclude.value'>
        <h5>{{"QuoteOP.S.NewQuote.PickupAddress" | TextCodeTranslationPipe}}</h5>
        <div class="p-fluid">
            <div class="p-field">
                <label for="pickupZipCode">{{"QuoteOP.S.NewQuote.ZipCode" | TextCodeTranslationPipe}}</label>
                <p-inputNumber formControlName='pickupZipCode' id="pickupZipCode" mode="decimal" [useGrouping]="false">
                </p-inputNumber>
            </div>

            <div class="p-field">
                <!-- <app-autocomplate-table [columnsShow]="['Name', 'LocalName', 'Country', 'State']" [data]='cityList'
                    [fieldShow]='"Name"' [label]='"QuoteOP.S.NewQuote.City" | TextCodeTranslationPipe'
                    [controlName]='"pickupCity"' [formGroup]='formGroup' (onSelect)='onSelectedCity($event)'>
                </app-autocomplate-table> -->
                <label for="pickupZipCode">{{"QuoteOP.S.NewQuote.City" | TextCodeTranslationPipe}}</label>
                <input formControlName='pickupCity' id="pickupZipCode" pInputText />
            </div>

            <div class="p-field">
                <app-autocomplate-table [columnsShow]="{Code:'Code',EnglishName:'Name'}" [data]='countryList'
                    [fieldShow]='"EnglishName"' [label]='"QuoteOP.S.NewQuote.Country" | TextCodeTranslationPipe'
                    [controlName]='"pickupCountry"' [formGroup]='formGroup' (onSelect)='onSelectedCountry($event)'>
                </app-autocomplate-table>
            </div>
        </div>
    </div>
</div>
