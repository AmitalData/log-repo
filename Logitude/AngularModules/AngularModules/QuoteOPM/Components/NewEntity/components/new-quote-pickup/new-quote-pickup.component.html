<div [formGroup]='propertyForm' class="">
    <div [hidden]='Address'>
        <p-checkbox formControlName='pickupInclude' [binary]="true" label='{{"QuoteOP.O.NewQuote.IncludePickUp" | TextCodeTranslationPipe}}'
            (onChange)="includeCheckboxChange($event)"></p-checkbox>

        <div [hidden]='!propertyForm.controls.pickupInclude.value' class='container'>
            <h5>{{"QuoteOP.S.NewQuote.PickupAddress" | TextCodeTranslationPipe}}</h5>
            <div class="p-fluid">
                <div class="p-field">
                    <label for="pickupZipCode">{{"QuoteOP.S.NewQuote.ZipCode" | TextCodeTranslationPipe}}</label>
                    <p-inputNumber formControlName='pickupZipCode' id="pickupZipCode" mode="decimal"
                        [useGrouping]="false">
                    </p-inputNumber>
                </div>

                <div class="p-field">
                    <!-- <app-autocomplate-table [columnsShow]="['Name', 'LocalName', 'Country', 'State']" [data]='cityList'
                    [fieldShow]='"Name"' [label]='"QuoteOP.S.NewQuote.City" | TextCodeTranslationPipe'
                    [controlName]='"pickupCity"' [formGroup]='propertyForm' (onSelect)='onSelectedCity($event)'>
                </app-autocomplate-table> -->
                    <label for="pickupZipCode">{{"QuoteOP.S.NewQuote.City" | TextCodeTranslationPipe}}</label>
                    <input formControlName='pickupCity' id="pickupZipCode" pInputText />
                </div>

                <div class="p-field">
                    <app-autocomplate-table [columnsShow]="{Code:'Code',EnglishName:'Name'}" [data]='countryList'
                        [fieldShow]='"EnglishName"' [label]='"QuoteOP.S.NewQuote.Country" | TextCodeTranslationPipe'
                        [controlName]='"pickupCountry"' [formGroup]='propertyForm' (onSelect)='onSelectedCountry($event)'>
                    </app-autocomplate-table>
                </div>
            </div>
        </div>
    </div>


    <div [hidden]='!Address'>
        <div class="p-field">
            <app-autocomplate-table
                [columnsShow]="['Code', 'EnglishName', 'Address1', 'CityName', 'CountryName', 'PartnerTypeName']"
                [data]='shipperNames' [fieldShow]='"EnglishName"' [label]="'Name'" [controlName]='"pickupAddressId"'
                [formGroup]='propertyForm'>
            </app-autocomplate-table>
        </div>

        <app-address-textarea [Address]='Address'></app-address-textarea>
    </div>
</div>
