<div [formGroup]='formGroup' class="container">
  <div formArrayName="properties">
    <p-tabView (onClose)="removeProperty($event)">
      <p-tabPanel *ngFor='let x of properties.controls; let i = index' [closable]='properties.controls.length > 1'
        [formGroupName]="i">
        <ng-template pTemplate="header">
          <span
            *ngIf='!(x.value.fromPort?.Code || x.value.toPort?.Code || x.value.mainCarriageCarrier?.AIRLINE_ID || x.value.specialService?.SERVLEVEL_ID)'>Quote
            properties</span>
          <span *ngIf='x.value.fromPort?.Code'>{{x.value.fromPort?.Code}}</span>
          <img
            *ngIf='x.value.fromPort?.Code || x.value.toPort?.Code || x.value.mainCarriageCarrier?.AIRLINE_ID || x.value.specialService?.SERVLEVEL_ID'
            [src]="'assets/icons/' + (formGroup.value.transportMode?.Id === 'I' ? 'inland' : formGroup.value.transportMode?.Id === 'O' ? 'ocean' : 'airplane') + '.png'"
            alt="type transport">
          <span *ngIf='x.value.toPort?.Code'>{{x.value.toPort?.Code}},</span>
          <span *ngIf='x.value.mainCarriageCarrier?.AIRLINE_ID'>{{x.value.mainCarriageCarrier?.AIRLINE_ID}},</span>
          <span *ngIf='x.value.specialService?.SERVLEVEL_ID'>{{x.value.specialService?.SERVLEVEL_ID}}</span>
        </ng-template>
        <h3 class="sub-header">Quote Properties</h3>
        <div class="grid content-in-section">

          <div class="col-4 p-fluid">
            <div class="p-field">
              <app-autocomplate-table [columnsShow]="{Code:'Code', Name: 'Name',CountryName:'CountryName'}"
                [data]='toPortList' [fieldShow]='"Name"' [searchIcon]='true'
                [label]="'QuoteOP.S.NewQuote.' + (formGroup.value.transportMode?.Id === 'A' ? 'Gateway': 'LoadingPort') | TextCodeTranslationPipe"
                [controlName]='"fromPort"' [formGroup]='x' (onSelect)='onSelectedFromPort($event)'>
              </app-autocomplate-table>
            </div>

            <div class="p-field">
              <app-autocomplate-table [columnsShow]="{Code:'Code', Name: 'Name',CountryName:'CountryName'}"
                [data]='fromPortList' [fieldShow]='"Name"' [searchIcon]='true'
                [label]="'QuoteOP.S.NewQuote.' + (formGroup.value.transportMode?.Id === 'A' ? 'Destination': 'DischargePort') | TextCodeTranslationPipe"
                [controlName]='"toPort"' [formGroup]='x' (onSelect)='onSelectedtoPort($event)'>
              </app-autocomplate-table>
            </div>

            <div class="p-field">
              <div class="p-field accordion-container">
                <h4>{{"QuoteOP.S.NewQuote.Pickup" | TextCodeTranslationPipe}}</h4>
                <!-- <i [class]="'pi pi-angle-' + (pickup.hidden ? 'down': 'right')" -->
                <i class='pi pi-angle-down' (click)='pickup.hidden = !pickup.hidden'></i>
                <div #pickup hidden class="accordion-contect">
                  <app-new-quote-address  [type]="'pickup'" [propertyForm]='x' [qouteForm]='formGroup' [EntityPM]='EntityPM'></app-new-quote-address>                  
                </div>
              </div>
            </div>
          </div>

          <div class="col-4 p-fluid">
            <div class="p-field">
              <app-autocomplate-table [columnsShow]="carrierColumns" [data]='mainCarriageCarrierList'
                [fieldShow]='"Name"' [searchIcon]='true'
                [label]="'QuoteOP.S.NewQuote.' + (formGroup.value.transportMode?.Id === 'A' ? 'Airline': 'Shippingline') | TextCodeTranslationPipe"
                [controlName]='"mainCarriageCarrier"' [formGroup]='x' (onSelect)='onMainCarriageCarrier($event)'>
              </app-autocomplate-table>
            </div>

            <div class="p-field">
              <app-autocomplate-table [columnsShow]="{PTERMID:'Code', Name: 'Name'}" [data]='incotermList'
                [fieldShow]='"Name"' [label]="'Incoterm'" [controlName]='"incoterm"' [formGroup]='x' [dropIcon]='true'
                (onSelect)='onSelectedIncoterm($event)'>
              </app-autocomplate-table>
            </div>

            <div class="p-field">
              <div class="p-field accordion-container">
                <h4>{{"QuoteOP.S.NewQuote.Delivery" | TextCodeTranslationPipe}}</h4>
                <i class='pi pi-angle-down'  (click)='delivery.hidden = !delivery.hidden'></i>
                <!-- <i [class]="'pi pi-angle-' + (delivery.hidden ? 'down': 'right')"
                  (click)='delivery.hidden = !delivery.hidden'></i> -->
                <div #delivery hidden class="accordion-contect">
                  <app-new-quote-address  [type]="'delivery'" [propertyForm]='x' [qouteForm]='formGroup' [EntityPM]='EntityPM'></app-new-quote-address>
                </div>
              </div>
            </div>
          </div>

          <div class="col-4 p-fluid">
            <div class="p-field">
              <app-autocomplate-table [columnsShow]="{SERVLEVEL_ID:'Code', Name: 'Name'}" [data]='specialServiceList'
                [fieldShow]='"Name"' [label]="'Special Services Type'" [controlName]='"specialService"' [formGroup]='x'
                (onSelect)='onSelectedSpecialService($event)'>
              </app-autocomplate-table>
            </div>
          </div>

        </div>
      </p-tabPanel>
    </p-tabView>
    <i class="pi pi-plus" (click)='addProperty()'></i>
    <hr>
  </div>
</div>
