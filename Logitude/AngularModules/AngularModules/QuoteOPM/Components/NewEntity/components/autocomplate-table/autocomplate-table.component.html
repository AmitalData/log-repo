<div [formGroup]='formGroup' class="p-input-icon-right">

    <label [for]="label">{{label}}</label>

    <p-autoComplete #autoComplete [formControlName]="controlName" [id]="label" [suggestions]="selected" [dropdown]="dropIcon"
        (completeMethod)="search($event)" (onBlur)='onBlur()' [field]='fieldShow' (onSelect)='onSelected($event)'>

        <ng-template pTemplate="item" let-x>
            <div class="autocomplete-col" *ngFor='let col of columnsNames'>{{x[col]}}</div>
        </ng-template>

    </p-autoComplete>

    <i *ngIf='searchIcon' class='pi pi-search' (click)='openDropdown()'></i>

</div>
