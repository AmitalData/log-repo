<div [formGroup]='formGroup'>

    <label [for]="label">{{label}}</label>

    <p-autoComplete [formControlName]="controlName" [id]="label" [suggestions]="selected" [dropdown]="true"
        (completeMethod)="search($event)" (onBlur)='onBlur()' [field]='fieldShow' (onSelect)='onSelected($event)'>

        <ng-template pTemplate="item" let-x>
            <div class="autocomplete-col" *ngFor='let col of columnsNames'>{{x[col]}}</div>
        </ng-template>

    </p-autoComplete>

</div>
