
<style type="text/css">
    .CustomerQueryLink:hover {
        cursor: pointer;
        color: #73A9D8;
    }

    .CustomerQueryLink {
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        color: #1B90CB;
        white-space: nowrap;
    }
</style>

<table style="height: 24px;">
    <tr>
        <td>
            <div class="ShortTitleMainControl" style="float: left; background:#F2F2F2;">
                <table>
                    <tr>
                        <td>
                            <div class="ShortTitleDiv" style="padding-left: 5px; font-size: 18px; color: #1B90CB;">
                                {{EntityPM.TariffNumber}}:
                            </div>
                        </td>

                        <td>
                            <div *ngIf="EntityPM.TypeCode != 'ECC' && EntityPM.TypeCode != 'ICC'" class="ShortTitleDiv TextTrimming" style="padding-left: 5px; max-width: 250px;">
                                <span class="CustomerQueryLink" (click)="ViewSeller()">{{EntityPM.SellerName}}</span>
                            </div>

                            <div *ngIf="EntityPM.TypeCode == 'ECC' || EntityPM.TypeCode == 'ICC'" class="ShortTitleDiv TextTrimming" style="padding-left: 5px; max-width: 250px;">
                                <span class="CustomerQueryLink" (click)="ViewCustomsBroker()">{{EntityPM.CustomsBrokerName}}</span>
                            </div>
                        </td>

                        <td>
                            <div class="ShortTitleDiv TextTrimming" style="padding-left: 5px; max-width: 230px; font-size:13px;">
                               ( {{EntityPM.TypeName}} )
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
</table>
