
<style type="text/css">

        color: #1B90CB;
        white-space: nowrap;
    }
</style>

                            </div>
                        </td>

                        <td>
                            <div class="ShortTitleDiv TextTrimming" style="padding-left: 5px; max-width: 250px;">

                            <div class="ShortTitleDiv TextTrimming" style="padding-left: 5px; max-width: 180px;">
