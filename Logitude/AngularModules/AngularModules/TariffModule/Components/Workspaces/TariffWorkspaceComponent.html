<style>
    .circle {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 11px;
        color: white;
        line-height: 20px;
        text-align: center;
        background: red;
    }
</style>

<table>
    <tr style="height:1px;" *ngIf="HasSettingMenu">
        <td>
            <table>
                <tr>
                    <td colspan="2">
                        <ul class="PagesMenu">
                            <li [class.SelectedPageMenu]="SelectedItem == 'COST'" (click)="SelectedItem = 'COST'">Cost</li>
                            <li [class.SelectedPageMenu]="SelectedItem == 'SALE'" (click)="SelectedItem = 'SALE'">Sale</li>
                            <li [class.SelectedPageMenu]="SelectedItem == 'SETG'" (click)="SelectedItem = 'SETG'">Settings</li>
                        </ul>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:15px;" *ngIf="HasSettingMenu">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill" [hidden]="SelectedItem != 'COST'">
                <div LocationDirective Code="COST"></div>
            </div>
            <div class="MediaFill" [hidden]="SelectedItem != 'SALE'">
                <div LocationDirective Code="SALE"></div>
            </div>
            <div class="MediaFill" [hidden]="SelectedItem != 'SETG'">
                <div LocationDirective Code="SETG"></div>
            </div>
        </td>
    </tr>
</table>
