    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <table class="FixedTable">

                        <tr class="FormFieldRow">
                            <td style="width:130px;">
                                <LogLabel [ObjectFieldName]="'AirDefaultStepsId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                            </td>

                            <td style="width:220px;">
                                <LogLov [ObjectFieldName]="'AirDefaultStepsId'"
                                        [ObjectTableName]="ObjectTableName"
                                        [SelectedValue]="AirDefaultStepsId"
                                        [DataContext]="DataContext"
                                        [LookUpTableName]="'PriceSteps'" [HideColumns]="true">
                                </LogLov>
                            </td>

                            <td style="width:50px;">
                                <IconButton [Name]="'Edit'" [IsSmall]="true" [Left]="5" (click)="EditPriceStepsClicked('Air')"></IconButton>
                                <IconButton [Name]="'Add'" [IsSmall]="true" [Left]="3" (click)="AddPriceStepsClicked('Air')"></IconButton>
                            </td>
                            <td>
                                <div></div>
                            </td>
                        </tr>

                        <tr class="FormFieldRow">
                            <td>
                                <LogLabel [ObjectFieldName]="'LCLDefaultStepsId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                            </td>

                            <td>
                                <LogLov [ObjectFieldName]="'LCLDefaultStepsId'"
                                        [ObjectTableName]="ObjectTableName"
                                        [SelectedValue]="LCLDefaultStepsId"
                                        [DataContext]="DataContext"
                                        [LookUpTableName]="'PriceSteps'" [HideColumns]="true">
                                </LogLov>
                            </td>

                            <td>
                                <IconButton [Name]="'Edit'" [IsSmall]="true" [Left]="5" (click)="EditPriceStepsClicked('LCL')"></IconButton>
                                <IconButton [Name]="'Add'" [IsSmall]="true" [Left]="3" (click)="AddPriceStepsClicked('LCL')"></IconButton>
                            </td>
                            <td>
                                <div></div>
                            </td>
                        </tr>

                        <tr class="FormFieldRow">
                            <td>
                                <LogLabel [NoObjectField]="true" [DataContext]="DataContext" [Text]="'Warning Percentage'"></LogLabel>
                            </td>

                            <td>
                                <LogTextBox [HideColumns]="true" [InputType]="'UnsInteger'" [ObjectFieldName]="'DefaultWarningPercentage'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="DefaultWarningPercentage"></LogTextBox>
                            </td>
                            <td colspan="2">
                                <div></div>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="4">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </ScrollViewer>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
