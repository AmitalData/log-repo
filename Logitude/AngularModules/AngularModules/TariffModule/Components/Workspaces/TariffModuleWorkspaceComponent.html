
<style type="text/css">
    .TariffsSectionHead {
        height: 20px;
        line-height: 20px;
        font-size: 18px;
        color: #1B90CB;
    }

    .TariffsSection:not(:first-child) {
        margin-top: 10px;
    }
</style>

<table>
    <tr style="height:1px;">
        <td>
            <div class="TariffsSectionHead">Tariffs</div>
        </td>
    </tr>

    <tr style="height:10px">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:10px;">
        <td>
            <table>
                <tr>
                    <td style="width:150px">
                        <div>
                            <HyperlinkQuery (click)="TariffSettingsClicked()">Tariff Settings</HyperlinkQuery>
                        </div>
                    </td>

                    <td style="width:20px">
                        <div></div>
                    </td>

                    <td style="width:20px">
                        <div></div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td style="width:150px">
                        <div>
                            <HyperlinkQuery (click)="ViewTariffs('A')">Air Freight Costs ({{AirFreightCount}})</HyperlinkQuery>
                        </div>
                    </td>

                    <td style="width:20px">
                        <div></div>
                    </td>

                    <td style="width:20px">
                        <button class="Button" (click)="NewTariff('A')">New</button>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td class="CellStretch">
            <div></div>
        </td>
    </tr>
</table>
