<table>
    <tr style="height:10px">
        <td>
            <div></div>
        </td>
    </tr>
    <tr style="height:1px">
        <td>
            <div class="QueriesSection">
                <div>Tariffs Settings</div>
                <div>
                    <p class="QueryLink" (click)="TariffSettingsClicked()">Settings</p>
                </div>
            </div>
        </td>
    </tr>
    <tr style="height:10px">
        <td>
            <div></div>
        </td>
    </tr>
    <tr style="height:1px" *ngIf="IsTariffGenerateVisible">
        <td>
            <div class="QueriesSection">
                <div>Tariffs Generator</div>
                <div>
                    <p class="QueryLink" (click)="GenerateTariffsClicked()">Generate</p>
                </div>
                <div style="padding-left:5px;">
                    <input class="QueryLink" style="display: none;float:left;background-color:white"
                           type="file" (change)="GenerateExcelTariffsClicked($event)"
                           (click)="fileInput.value = null" value="" accept=".xls,.xlsx"
                           #fileInput>
                    <a href="#" style="text-decoration:none;float:left;background-color:white">
                        <button style="background-color:white" (click)="fileInput.click()">Generate From Excel</button>
                    </a>
                </div>
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div></div>
        </td>
    </tr>
</table>
