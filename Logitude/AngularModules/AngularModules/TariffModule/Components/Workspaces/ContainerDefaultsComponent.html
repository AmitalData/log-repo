
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">

                        <LogLov [NoObjectField]="true"
                                [ObjectFieldName]="'ContainerType1Id'"
                                [SelectedValue]="ContainerType1Id"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'PackageType'"
                                [HideLastColumn]="true"
                                [RunToggleMode]="true"
                                [DependencyFilter1Value]="'O'"
                                [DependencyFilter2Value]="true">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">

                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <div>3.</div>
                    </td>

                                [LookUpTableName]="'PackageType'"

                                [RunToggleMode]="true"
                                [DependencyFilter1Value]="'O'"
                                [DependencyFilter2Value]="true">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <div>4.</div>
                    </td>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </td>

            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">

                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
