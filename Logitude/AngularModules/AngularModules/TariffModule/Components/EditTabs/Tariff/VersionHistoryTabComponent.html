
<div class="TabHolder">
    <table>
        <tr style="height: 1px;">
            <td>
                <table>
                    <tr>
                        <td style="width:60px;">Version</td>

                        <td style="width:280px;">
                            <ComboBox [ItemsSource]="VersionsList" [Binding]="'Name'" [SelectedItem]="SelectedVersion" (SelectedItemChanged)="SelectedVersion = $event"></ComboBox>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 10px;">
            <td>
                <div></div>
            </td>
        </tr>

        <tr>
            <td>
                <table>
                    <tr>
                        <td>
                            <div class="MediaFill">
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="VersionLinesSource">                                    
                                    <!-- OriginPortId -->
                                    <log-column [header]="'TariffLine.F.OriginPortId' | TextCodeTranslationPipe" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.OriginPortCode}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- DestinationPortId -->
                                    <log-column [header]="'TariffLine.F.DestinationPortId' | TextCodeTranslationPipe" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.DestinationPortCode}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- MinPrice -->
                                    <log-column [header]="'TariffLine.F.MinPrice' | TextCodeTranslationPipe" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.MinPrice}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step1Price -->
                                    <log-column *ngIf="Step1PriceVisibility" [header]="Step1PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step1Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step2Price -->
                                    <log-column *ngIf="Step2PriceVisibility" [header]="Step2PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step2Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step3Price -->
                                    <log-column *ngIf="Step3PriceVisibility" [header]="Step3PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step3Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step4Price -->
                                    <log-column *ngIf="Step4PriceVisibility" [header]="Step4PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step4Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step5Price -->
                                    <log-column *ngIf="Step5PriceVisibility" [header]="Step5PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step5Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step6Price -->
                                    <log-column *ngIf="Step6PriceVisibility" [header]="Step6PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step6Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step7Price -->
                                    <log-column *ngIf="Step7PriceVisibility" [header]="Step7PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step7Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Step8Price -->
                                    <log-column *ngIf="Step8PriceVisibility" [header]="Step8PriceLabel" [width]="'70'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:left;">
                                                <span>{{item.Step8Price}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
