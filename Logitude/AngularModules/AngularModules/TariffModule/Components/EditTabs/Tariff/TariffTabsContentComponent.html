
<style type="text/css">
    .scroller {
        text-align: center;
        cursor: pointer;
        display: none;
        padding: 7px;
        padding-top: 11px;
        white-space: nowrap;
        vertical-align: middle;
        background-color: #fff;
    }

    .scroller-right {
        float: right;
    }

    .scroller-left {
        float: left;
    }

    .wrapper {
        position: relative;
        margin: 0 auto;
        overflow: hidden;
        padding: 5px;
        height: 50px;
    }
</style>


<table>
    <tr>
        <td>
            <div class="MediaFill">
                <div class="TabControl">
                   
                    <div class="TabControlHead">

                        <div style="background-color: #fff;" class="scroller-left">
                            <i class="fa fa-chevron-left"></i>
                        </div>
                        <div style="background-color: #fff;" class="scroller-right">
                            <i class="fa fa-chevron-right"></i>
                        </div>

                        <div class="wrapper">

                            <ul>
                                <li *ngFor="let item of Tabs" [class.Selected]="item.IsSelected" (click)="SelectionChanged(item)">
                                    <div class="InnerChild">
                                        <span *ngIf="(item.Code == 'VR' || item.Code == 'SVR') && item.IsDraft" style="color:orange;">[Draft]</span>
                                        {{item.Header}}
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="TabControlBody">
                        <div class="MediaFillAbsolute" *ngFor="let item of Tabs;" [hidden]="!item.IsSelected">
                            <div LocationDirective Code="TariffTabLocation" Index="{{item.Index}}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </td>
    </tr>
</table>
