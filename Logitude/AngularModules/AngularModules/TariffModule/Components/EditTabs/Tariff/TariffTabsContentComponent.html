<table>
    <tr>
        <td>
            <div class="MediaFill">
                <div class="MarginAbsolute5">
                    <div class="TabControl">
                        <div class="TabControlHead">
                            <ul>
                                <li *ngFor="let item of Tabs" [class.Selected]="item.IsSelected" (click)="SelectionChanged(item)">
                                    <div class="InnerChild">
                                        <span *ngIf="(item.Code == 'VR' || item.Code == 'SVR') && item.IsDraft" style="color:orange;">[Draft]</span>
                                        {{item.Header}}
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <div class="TabControlBody">
                            <div class="MediaFillAbsolute" *ngFor="let item of Tabs;" [hidden]="!item.IsSelected">
                                <div LocationDirective Code="TariffTabLocation" Index="{{item.Index}}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </td>
    </tr>
</table>
