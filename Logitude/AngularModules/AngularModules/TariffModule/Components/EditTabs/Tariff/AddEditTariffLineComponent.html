
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">

                <!-- From  -->
                <tr class="FormFieldRow">
                    <td style="width:100px;">
                        <LogLabel [ObjectFieldName]="'OriginPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:220px;">
                        <LogLov [ObjectFieldName]="'OriginPortId'"
                                [ObjectTableName]="ObjectTableName"
                                [LookUpTableName]="'Port'"
                                [DataContext]="DataContext"
                                (SelectedItemChanged)="DataContext.OriginPort = $event"
                                [DisplayMemberPath]="'Code'"
                                [SelectedValue]="DataContext.OriginPortId">
                        </LogLov>
                    </td>
                    <td *ngIf="!DataContext.OriginPortId" style="width:50px; color:red">
                        {{OriginPortText}}
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- To -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'DestinationPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'DestinationPortId'"
                                [ObjectTableName]="ObjectTableName"
                                [LookUpTableName]="'Port'"
                                [DisplayMemberPath]="'Code'"
                                [DataContext]="DataContext"
                                (SelectedItemChanged)="DataContext.DestinationPort = $event"
                                [SelectedValue]="DataContext.DestinationPortId">
                        </LogLov>
                    </td>
                    <td *ngIf="!DataContext.DestinationPortId" style="width:50px; color:red">
                        {{DestinationPortText}}
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Min -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'MinPrice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'MinPrice'" [Text]="DataContext.MinPrice" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>
                    <td *ngIf="!DataContext.MinPrice" style="width:50px; color:red">
                        {{MinPriceText}}
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Step1Price -->
                <tr *ngIf="DataContext.FatherComponent.Step1PriceVisibility" class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'Step1Price'" [Text]="DataContext.FatherComponent.Step1PriceLabel" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'Step1Price'" [Text]="DataContext.Step1Price" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>
                    <td *ngIf="!DataContext.Step1Price" style="width:50px; color:red">
                        {{Step1PriceText}}
                    </td>
                    <td>
                        <div></div>
                    </td>

                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'Step5Price'" [Text]="DataContext.Step5Price" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>

                    <td>
                        <LogLabel [ObjectFieldName]="'Step6Price'" [Text]="DataContext.FatherComponent.Step6PriceLabel" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'Step6Price'" [Text]="DataContext.Step6Price" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>
                    <td *ngIf="!DataContext.Step6Price" style="width:50px; color:red">

                    </td>
                </tr>

                <tr *ngIf="DataContext.FatherComponent.Step7PriceVisibility" class="FormFieldRow">
                    <td>

                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'Step7Price'" [Text]="DataContext.Step7Price" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>
                    <td *ngIf="!DataContext.Step7Price" style="width:50px; color:red">
                        {{Step7PriceText}}

                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
