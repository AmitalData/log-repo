
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <table class="FixedTable">

                        <!-- From  -->
                        <tr class="FormFieldRow">
                            <td style="width:100px;">
                                <LogLabel [ObjectFieldName]="'OriginPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                            </td>

                            <td style="width:220px;">
                                <LogLov [ObjectFieldName]="'OriginPortId'"
                                        [ObjectTableName]="ObjectTableName"
                                        [LookUpTableName]="'Port'"
                                        [DataContext]="DataContext"
                                        (SelectedItemChanged)="DataContext.OriginPort = $event"
                                        [DisplayMemberPath]="'Code'"
                                        [SelectedValue]="DataContext.OriginPortId"
                                        [DependencyFilter1Value]="OriginDependencyFilterValue">
                                </LogLov>
                            </td>

                            <td *ngIf="TariffType == 'AFC' || TariffType == 'OLC' || TariffType == 'OFC'">
                                <div class="MediaFill">
                                    <table *ngIf="!DataContext.OriginPortId">
                                        <tr>
                                            <td style="color:red; padding-left: 10px;">
                                                {{OriginPortText}}
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </td>

                            <td *ngIf="TariffType == 'ASC' || TariffType == 'OSC'">
                                <table>
                                    <tr>
                                        <td style="width:130px;">
                                            <LogLabel [ObjectFieldName]="'IsFromAllOtherPorts'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td style="width:25px;">
                                            <LogCheckBox [ObjectFieldName]="'IsFromAllOtherPorts'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Checked]="DataContext.IsFromAllOtherPorts"></LogCheckBox>
                                        </td>

                                        <td style="color:red; padding-left: 10px;">
                                            <span *ngIf="!DataContext.OriginPortId">{{OriginPortText}}</span>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <!-- To -->
                        <tr class="FormFieldRow">
                            <td>
                                <LogLabel [ObjectFieldName]="'DestinationPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>

                            <td>

                                        [DependencyFilter1Value]="DestinationDependencyFilterValue">

                            <td *ngIf="TariffType == 'AFC' || TariffType == 'OLC' || TariffType == 'OFC'">

                                    </tr>
                                </table>
