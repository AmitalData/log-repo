<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr *ngIf="TariffType == 'AFC' || TariffType == 'OLC' || TariffType == 'OFC'">
        <td>
            <table>
                <!-- StartDate -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'StartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogDatePicker [ObjectFieldName]="'StartDate'" [SelectedDateValue]="StartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>

                <!-- ExpirationDate -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'ExpirationDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogDatePicker [ObjectFieldName]="'InitialEnddate'" [SelectedDateValue]="InitialEnddate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr *ngIf="TariffType == 'ASC' || TariffType == 'OSC'  || TariffType == 'OFS'">
        <td>
            <table>
                <tr style="height:1px;">
                    <td>
                        <div style="margin-left:10px;">
                            <Label style="font-family:Arial; font-size:11px;color:gray; white-space: pre-line; word-wrap: break-word; text-wrap: normal;text-overflow: ellipsis;">Please set an expiration date for the deleted line</Label>
                        </div>
                    </td>
                </tr>

                <!-- ExpirationDate -->
                <tr class="FormFieldRow">
                    <td>
                        <table>
                            <tr>
                                <td style="width:120px;">
                                    <LogLabel [NoObjectField]="true" [ObjectFieldName]="'LineExpirationDate'" [DataContext]="DataContext" [Text]="'Expiration Date'"></LogLabel>
                                </td>

                                <td style="width:180px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'LineExpirationDate'" [SelectedDateValue]="LineExpirationDate" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 5px;">
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
