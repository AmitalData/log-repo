
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

                                <!-- Name -->
                                <tr class="FormFieldRow">
                                    <td style="width:120px;">
                                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td style="width:220px;">
                                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- ContractNumber -->

                                                    [ObjectTableName]="ObjectTableName"></LogTextBox>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Seller -->

                                        <LogLabel [ObjectFieldName]="'SellerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                        <LogLov [ObjectFieldName]="'SellerId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [SelectedValue]="SellerId"
                                                [DataContext]="DataContext"
                                                [DependencyFilter1IsList]="true"
                                                [HideMaintenanceIcon]="true"
                                                [DependencyFilter1Value]="SellerDependancy"
                                                [LookUpTableName]="'Card'">
                                        </LogLov>
                                    </td>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Currency -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'CurrencyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="TariffCurrencyTextCode"></LogLabel>

                                                [LookUpTableName]="'Currency'">
                                        </LogLov>
                                    </td>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Price Steps  -->
                                <tr *ngIf="EntityPM.TypeCode != 'ASC' && EntityPM.TypeCode != 'OSC' && EntityPM.TypeCode != 'OFC' && EntityPM.TypeCode != 'OFS'" class="FormFieldRow">
                                    <td>
                                        <LogLabel [NoObjectField]="true" [Text]="'Price Steps'" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td colspan="2">

                                            <tr>
                                                <td style="width:1px; text-align:left;" title="{{PriceStepsText}}">

                                                </td>

                                                </td>
                                                <td style="text-align:left;">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditPriceSteps()"></IconButton>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- All in charges  -->

                                    </td>
