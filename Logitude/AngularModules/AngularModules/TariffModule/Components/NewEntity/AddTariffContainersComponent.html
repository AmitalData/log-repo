<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>

                            <tr class="FormFieldRow">

                                    <div>1.</div>
                                </td>
                                <td style="width:220px;">
                                    <LogLov [ObjectFieldName]="'ContainerType1Id'"
                                            [SelectedValue]="ContainerType1Id"
                                            [NoObjectField]="true"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'PackageType'"
                                            [HideLastColumn]="true"
                                            [RunToggleMode]="true"
                                            [DependencyFilter1Value]="'O'"
                                            [DependencyFilter2Value]="true">
                                    </LogLov>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow">
                                <td>
                                    <div>2.</div>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'ContainerType2Id'"
                                            [SelectedValue]="DataContext.ContainerType2Id"
                                            [NoObjectField]="true"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'PackageType'"
                                            [HideLastColumn]="true"
                                            [RunToggleMode]="true"
                                            [DependencyFilter1Value]="'O'"
                                            [DependencyFilter2Value]="true">
                                    </LogLov>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow">
                                <td>
                                    <div>3.</div>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'ContainerType3Id'"
                                            [SelectedValue]="DataContext"
                                            [NoObjectField]="true"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'PackageType'"
                                            [HideLastColumn]="true"
                                            [RunToggleMode]="true"
                                            [DependencyFilter1Value]="'O'"
                                            [DependencyFilter2Value]="true">
                                    </LogLov>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow">
                                <td>
                                    <div>4.</div>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'ContainerType4Id'"
                                            [SelectedValue]="DataContext"
                                            [NoObjectField]="true"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'PackageType'"
                                            [HideLastColumn]="true"
                                            [RunToggleMode]="true"
                                            [DependencyFilter1Value]="'O'"
                                            [DependencyFilter2Value]="true">
                                    </LogLov>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow">
                                <td>
                                    <div>5.</div>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'ContainerType5Id'"
                                            [SelectedValue]="DataContext"
                                            [NoObjectField]="true"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'PackageType'"
                                            [HideLastColumn]="true"
                                            [RunToggleMode]="true"
                                            [DependencyFilter1Value]="'O'"
                                            [DependencyFilter2Value]="true">
                                    </LogLov>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="4"></td>
                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
