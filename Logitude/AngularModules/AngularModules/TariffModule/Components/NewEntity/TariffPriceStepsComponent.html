<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr  style="height: 20px;">
        <td>
            <table>
                <tr>
                    <td style="width:140px">
                        <LogLabel [Text]="UnitOfMeasurementLabel"
                                  [NoObjectField]="true"
                                  [DataContext]="DataContext">
                        </LogLabel>
                    </td>
                    <td style="width:150px" >
                        <LogLov [ObjectFieldName]="'UnitOfMeasurementCode'"
                                [SelectedValue]="UnitOfMeasurementCode"
                                [NoObjectField]="true"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'WeightUnit'">
                        </LogLov>
                    </td>
                    <td >
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
 
    </tr>
    <tr style="height: 5px;">
        <td>
            <div>
            </div>
        </td>
    </tr>
    <tr>
        <td>
             <div class="MediaFill">
                 <div class="SimpleGridView">
                     <div class="SimpleGridViewHeader">
                         <table>
                              <tr>
                                  <td style="width: 120px; min-width: 120px; max-width: 120px;">Price Steps</td>

                                   <td class="LastChild">
                                        <div></div>
                                   </td>
                                </tr>
                            </table>
                     </div>

                     <div class="SimpleGridViewBody">
                         <table>
                             <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource;let i = index">

                                 <td class="CellStretched" style="width: 120px; min-width: 120px; max-width: 120px;">
                                        <LogTextBox [InputType]="'UnsInteger'" [NoObjectField]="true" [ObjectFieldName]="'Step'" [DataContext]="item.DataContext" [HideColumns]="true" [Text]="item.Step"></LogTextBox>
                                 </td>

                                 <td class="CellTools">
                                        <span class="CellSeparator"></span>
                                        <IconButton [ExternalId]="'Package_'+i" [Name]="'Delete'" [IsSmall]="true" [Left]="3" (click)="item.DeleteClicked()" [IsEnabled]="item.Step != null"></IconButton>
                                  </td>
                             </tr>
                             <tr style="height:10px;">
                                 <td colspan="2">
                                    <div></div>
                                 </td>
                             </tr>

                             <tr>
                                <td colspan="2">
                                   <div></div>
                                </td>
                             </tr>
                         </table>
                     </div>
                 </div>
             </div>
        </td>
    </tr>

     <tr style="height: 32px;">
          <td style="vertical-align: bottom">
              <table style="height: 22px;">
                   <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                        </td>
                   </tr>
              </table>
          </td>
     </tr>
</table>
