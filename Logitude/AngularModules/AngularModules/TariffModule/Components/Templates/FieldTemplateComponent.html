
<table *ngIf="Entity">
    <tr>
        <td>
            <div class="MediaFill">

                <!-- Tariff  -->
                <table *ngIf="ObjectTableName == 'Tariff' &&  (FieldName == 'StartDate' || FieldName == 'ExpirationDate')">
                    <tr>
                        <td>
                            <div class="MediaFill">
                                {{Entity[FieldName] | DateTimePipe:'D'}}
                            </div>
                        </td>
                    </tr>
                </table>

                <table *ngIf="ObjectTableName == 'Tariff' && FieldName == 'CurrencyId'">
                    <tr>
                        <td>
                            <div class="MediaFill">
                               {{FieldValue}}
                            </div>
                        </td>
                    </tr>
                </table>

            </div>
        </td>
    </tr>
</table>
