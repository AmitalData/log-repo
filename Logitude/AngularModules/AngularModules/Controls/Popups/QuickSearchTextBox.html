
<div class="LogitudeQuickSearchTextBox" [ngStyle]="{height: HideBox ? '0px' : '22px'}">
    <input *ngIf="!HideBox" type="text" placeholder="{{Watermark}}" [(ngModel)]="SearchText" (focus)="OnFucos();" (blur)="OnLostFucos();" [disabled]="IsDisabled"   id="{{NewId}}"/>
    <img class="LogitudeQuickSearchSearchIcon" src="./Images/Search.png" *ngIf="IsIconsVisible && IsSearchIconVisible && !HideIcons && !HideBox" />
    <img class="LogitudeQuickSearchDeleteIcon" src="./Images/RedX2.png" *ngIf="IsIconsVisible &&IsDeleteIconVisible && !HideIcons && !HideBox" (click)="DeleteClicked()" />

    <div class="LogitudeQuickSearchDropDown" [ngStyle]="{top: HideBox ? '0px' : '22px'}" *ngIf="IsQuickSearchOpened" [style.height.px]="DropDownHeight" [style.width.px]="DropDownWidth">
        <div [ngStyle]="{'background': Background}">
            <ng-content></ng-content>
            <img *ngIf="IsQuickSearchLoading" class="CenterCenter" style="height:20px; width:20px;" src="./Images/LoginScreen/indicator.gif" />
            <div *ngIf="IsQuickSearchNoResult" class="NoDataText" style="top: 27px;">No Data</div>
        </div>
        <div *ngIf="ShowViewAll" style="min-height:20px;height: 20px;bottom:0px;right:0px; position: absolute;float:right; text-align:right;">
            <div style="height: 20px; width: 100%; background: white; text-align:right; padding-right: 5px;float:right;">
                <span class="hyperlink" (mousedown)="OnViewAllClicked()">View All</span>
            </div>
        </div>
    </div>
</div>
