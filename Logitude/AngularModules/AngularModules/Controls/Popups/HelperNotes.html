
<style type="text/css">
    .LogitudeHelperNotes {
        position: relative;
        width: 24px;
        height: 24px;
        padding: 0 !important;
        display: block;
    }

    .LogitudeHelperNotesHeadOpened {
        background: #FFFADC;
        border: 1px solid #AAAAAA;
        border-radius: 4px 4px 0 0;
        -moz-border-radius: 4px 4px 0 0;
        -webkit-border-radius: 4px 4px 0 0;
        box-shadow: 0px 0px 2px 2px #DADADA;
        -moz-box-shadow: 0px 0px 2px 2px #DADADA;
        -webkit-box-shadow: 0px 0px 2px 2px #DADADA;
    }

    .LogitudeHelperNotesBody {
        position: fixed;
        visibility: hidden;
        z-index: 1;
        top: 24px;
        background: #FFFADC;
        border: 1px solid #AAAAAA;
        border-radius: 0 0 4px 4px;
        -moz-border-radius: 0 0 4px 4px;
        -webkit-border-radius: 0 0 4px 4px;
        box-shadow: 0px 2px 3px 2px #DADADA;
        -moz-box-shadow: 0px 2px 3px 2px #DADADA;
        -webkit-box-shadow: 0px 2px 3px 2px #DADADA;
    }

    .LogitudeHelperNotesTextBox {
        width: 100%;
        height: 75px;
        padding: 2px;
        text-indent: 0px;
        background: transparent;
        border: 1px solid transparent;
        box-shadow: none;
        -moz-box-shadow: none;
        -webkit-box-shadow: none;
        font-size: 11px;
        color: #595B5B;
    }

    .LogitudeHelperNotesTextBoxFocused {
        background: white;
        border: 1px solid #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        color: #020202;
    }

    .LogitudeHelperNotesTextBox:read-only {
        font-style: italic;
        color: #8F9293;
    }

    .ClickHereText {
        position: absolute;
        top: 10px;
        left: 5px;
        font-family: Arial;
        font-style: italic;
        font-size: 11px;
        color: #8F9293;
        background: transparent;
        pointer-events: none;
    }
</style>

<div [attr.id]="ComponentId" class="LogitudeHelperNotes">

    <!-- Head -->
    <div class="MediaFillAbsolute" [class.LogitudeHelperNotesHeadOpened]="IsOpened">
        <div class="CenterCenter" style="width: 16px; height: 13px;">
            <button [attr.id]="ComponentButtonId"
                    class="MediaFillRelative"
                    [ngStyle]="{'background': IconPath, 'opacity': IconOpacity}"
                    (click)="OnButtonClicked()"
                    (blur)="OnButtonLostFocus()"
                    (mouseover)="IsMouseOverButton = true;"
                    (mouseleave)="IsMouseOverButton = false;"
                    style="cursor: pointer; padding:0;"></button>
        </div>
    </div>

    <!-- Body -->
    <div class="LogitudeHelperNotesBody"
         [attr.id]="ComponentContentId"
         [style.width.px]="Width"
         [style.height.px]="Height"
         (mouseover)="IsMouseOver = true;"
         (mouseleave)="IsMouseOver = false;">

        <div class="MediaFillRelative">
            <div style="height: 6px; width: 22px; background: #FFFADC; position: absolute; top:-4px; right:0; z-index: 2;"></div>

            <div class="MarginAbsolute10" style="top: 0px;">
                <div class="MediaFillRelative">
                    <table>
                        <tr style="height: 25px;">
                            <td style="line-height: 25px; color: #1B90CB; font-size: 14px;">{{Title}}</td>
                        </tr>

                        <tr style="height: 5px;">
                            <td>
                                <div></div>
                            </td>
                        </tr>

                        <tr style="height: 15px;" *ngIf="EntityTitle">
                            <td style="line-height: 15px; color: #45494A; font-size: 12px;">{{EntityTitle}}</td>
                        </tr>

                        <tr style="height: 75px;">
                            <td>
                                <div class="MediaFill">
                                    <div class="MediaFillRelative">
                                        <span class="ClickHereText" *ngIf="!Text && !IsTextBoxFocused">
                                            {{'General.B.ClickToAddText' | TextCodeTranslationPipe}}
                                        </span>

                                        <textarea [attr.data-cy]="'HelperNotes'" class="LogitudeHelperNotesTextBox"
                                                  [class.LogitudeHelperNotesTextBoxFocused]="IsTextBoxFocused && IsEnabled"
                                                  [(ngModel)]="Text"
                                                  (keydown)="OnTextBoxKeydown($event)"
                                                  (focus)="OnTextBoxFocus()"
                                                  (blur)="OnTextBoxLostFocus()"
                                                  (mouseover)="IsMouseOverTextBox = true;"
                                                  (mouseleave)="IsMouseOverTextBox = false;"
                                                  autocomplete="off"
                                                  autocorrect="off"
                                                  autocapitalize="off"
                                                  spellcheck="false"
                                                  [readonly]="!IsEnabled"></textarea>
                                    </div>
                                </div>
                            </td>
                        </tr>

                        <tr *ngIf="NotesList">
                            <td>
                                <div class="MediaFill">
                                    <ScrollViewer>
                                        <div *ngFor="let item of NotesList" style="height: 70px; position: relative;">
                                            <div class="MediaFill">
                                                <table>
                                                    <tr style="height: 5px; min-height: 5px;">
                                                        <td></td>
                                                    </tr>

                                                    <tr style="height:1px;">
                                                        <td>
                                                            <div class="MediaFill">
                                                                <div class="MediaFillAbsolute" style="height:1px; left: 5px; right: 5px; background: #DADADA;"></div>
                                                            </div>
                                                        </td>
                                                    </tr>

                                                    <tr style="height: 2px; min-height: 2px;">
                                                        <td></td>
                                                    </tr>

                                                    <tr style="height: 1px;">
                                                        <td style="line-height: 15px; font-size: 12px; color: #0075AF;">
                                                            {{item.Header}}
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <textarea class="NotesTextArea" [readonly]="true">{{item.Notes}}</textarea>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </ScrollViewer>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
