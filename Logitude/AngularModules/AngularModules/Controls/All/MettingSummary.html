
<style type="text/css">
    .LogitudeMettingSummary {
        position: relative;
        width: 75px;
        height: 24px;
        padding: 0 !important;
        display: block;
        cursor: default;
    }

    .LogitudeMettingSummaryHead {
        position: absolute;
        left: 0;
        top: 0px;
        right: 0px;
        bottom: 0;
    }

    .LogitudeMettingSummaryHeadOpened {
        background: #FFFADC;
        border: 1px solid #AAAAAA;
        border-radius: 4px 4px 0 0;
        -moz-border-radius: 4px 4px 0 0;
        -webkit-border-radius: 4px 4px 0 0;
        box-shadow: 0px 0px 2px 2px #DADADA;
        -moz-box-shadow: 0px 0px 2px 2px #DADADA;
        -webkit-box-shadow: 0px 0px 2px 2px #DADADA;
    }

    .LogitudeMettingSummaryBody {
        position: fixed;
        height: 100%;
        width: 100%;
        visibility: hidden;
        z-index: 1;
        top: 24px;
        background: white;
        border: 1px solid #AAAAAA;
        border-radius: 0 0 4px 4px;
        -moz-border-radius: 0 0 4px 4px;
        -webkit-border-radius: 0 0 4px 4px;
        box-shadow: 0px 2px 3px 2px #DADADA;
        -moz-box-shadow: 0px 2px 3px 2px #DADADA;
        -webkit-box-shadow: 0px 2px 3px 2px #DADADA;
    }

    .LogitudeMettingSummaryTextBox {
        width: 100%;
        height: 180px;
        padding: 2px;
        text-indent: 0px;
        background: white;
        border: 1px solid #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        font-size: 11px;
    }
</style>

<div [attr.id]="ComponentId" class="LogitudeMettingSummary">

    <div class="LogitudeMettingSummaryHead" [class.LogitudeMettingSummaryHeadOpened]="IsOpened">
        <button [attr.id]="ComponentButtonId" style="width: 75px; height: 22px;"
                class="Button"
                (click)="OnButtonClicked()"
                (blur)="OnButtonLostFocus()"
                (mouseover)="IsMouseOverButton = true;"
                (mouseleave)="IsMouseOverButton = false;">
            Complete
        </button>
    </div>

    <div class="LogitudeMettingSummaryBody"
         [attr.id]="ComponentContentId"
         style="width:380px;height:330px;"
         (mouseover)="IsMouseOver = true;"
         (mouseleave)="IsMouseOver = false;">

        <div class="MediaFillRelative">
            <div class="MarginAbsolute10" style="top: 0px;">
                <table class="FixedTable">
                    <tr style="height:3px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>
                    <tr style="height:1px;">
                        <td *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
                            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                        </td>
                    </tr>
                    <tr style="height:1px;">
                        <td style="color:#1B90CB;font-size:11px;">Please fill Meeting Summary</td>
                    </tr>
                    <tr style="height:10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table>
                                <tr style="height: 150px">
                                    <td style="width:3px;">
                                        <div></div>
                                    </td>
                                    <td>
                                        <textarea class="LogitudeMettingSummaryTextBox"
                                                  [(ngModel)]="Text"
                                                  (keydown)="OnTextBoxKeydown($event)"
                                                  (blur)="OnTextBoxLostFocus()"
                                                  (mouseover)="IsMouseOverInput = true;"
                                                  (mouseleave)="IsMouseOverInput = false;"
                                                  autocomplete="off"
                                                  autocorrect="off"
                                                  autocapitalize="off"
                                                  spellcheck="false"></textarea>
                                    </td>
                                </tr>
                                <tr style="height:22px;">
                                    <td style="width:3px;">
                                        <div></div>
                                    </td>
                                    <td>
                                        <table>
                                            <tr>
                                                <td style="width:16px;" (mouseover)="IsMouseOverInput = true;" (mouseleave)="IsMouseOverInput = false;">
                                                    <CheckBox [IsChecked]="IsChecked" (Checked)="IsChecked = $event"></CheckBox>
                                                </td>
                                                <td style="width:10px;">
                                                    <div></div>
                                                </td>
                                                <td> Post to my followers </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr style="height: 32px;">
                        <td style="vertical-align: bottom">
                            <table style="height: 22px;">
                                <tr>
                                    <td>
                                        <div></div>
                                    </td>

                                    <td style="width: 57px;">
                                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                                    </td>

                                    <td style="width: 5px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 57px;">
                                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
