<style>
    .input-button {
        width: 25px;
        text-align: center;
        /* height: 100%; */
        float: right;
        position: relative;
        top: -21px;
        right: 1px;
        background: #efefef;
        border: 1px solid #cecece;
        cursor: pointer;
        user-select: none;
        height: 20px;
        line-height: 18px;
        font-size: 13px;
    }
    .rtl .input-button{
        float: left;
        right: unset;
        left: 1px;
    }
    .input-button:active {
        background: #e0e0e0;

    }
    .disabledNoOfCasesDiv {
        pointer-events: none;
        opacity: 2.0;
    }

</style>
<div [class.rtl]="isRTL"  [ngClass]="{disabledNoOfCasesDiv: isDisabled}">
    <input type="number"
    [value]="value"
    [(ngModel)]="value" [ngModelOptions]="{standalone: true}" >
    <div class="input-button" (click)="IncrementValue()">+</div>
    <div class="input-button" (click)="DecrementValue()">-</div>
</div>
