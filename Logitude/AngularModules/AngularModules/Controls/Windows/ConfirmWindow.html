
<style type="text/css">
    .ConfirmWindowLayout {
        position: absolute;
        top: 1px;
        bottom: 0;
        left: 0;
        right: 0;
        margin: auto;
        opacity: 0.7;        
        background: -moz-linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        background: -webkit-linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        background: linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        pointer-events: none;
    }

    .ConfirmWindow {
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        background: -moz-linear-gradient(50% 100% 90deg,rgba(255, 255, 255, 1) 89.25%,rgba(247, 247, 247, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        background: -webkit-gradient(linear,50% 100%,50% 0%,color-stop(0.8925,rgba(255, 255, 255, 1) ),color-stop(1,rgba(247, 247, 247, 1) ));
        background: -o-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        background: linear-gradient(0deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        border: 1px solid #C8C8C8;
        box-shadow: 0px 0px 3px 2px #D1D1D1;
        -moz-box-shadow: 0px 0px 3px 2px #D1D1D1;
        -webkit-box-shadow: 0px 0px 3px 2px #D1D1D1;
    }

    .WindowHeader {
        cursor: move;
        width: 100%;
        height: 100%;
        line-height: 30px;
        border-radius: 8px 8px 0 0;
        font-size: 18px;
        color: #1B90CB;
        position: relative;
        background: transparent;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .ConfirmIcon {
        width: 70px;
        height: 70px;
        line-height: 70px;
        color: white;
        font-size: 45px;
        font-weight: bold;
        font-family: Arial;
        text-align: center;
        vertical-align: middle;
        -webkit-border-radius: 50px;
        -moz-border-radius: 50px;
        border-radius: 50px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(108, 132, 153, 1) 0%,rgba(112, 136, 156, 1) 18.27%,rgba(125, 147, 166, 1) 37.99%,rgba(147, 166, 182, 1) 58.38%,rgba(177, 192, 205, 1) 79.19%,rgba(215, 225, 234, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(108, 132, 153, 1) 0%, rgba(112, 136, 156, 1) 18.27%, rgba(125, 147, 166, 1) 37.99%, rgba(147, 166, 182, 1) 58.38%, rgba(177, 192, 205, 1) 79.19%, rgba(215, 225, 234, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(108, 132, 153, 1) ),color-stop(0.1827,rgba(112, 136, 156, 1) ),color-stop(0.3799,rgba(125, 147, 166, 1) ),color-stop(0.5838,rgba(147, 166, 182, 1) ),color-stop(0.7919,rgba(177, 192, 205, 1) ),color-stop(1,rgba(215, 225, 234, 1) ));
        background: -o-linear-gradient(-90deg, rgba(108, 132, 153, 1) 0%, rgba(112, 136, 156, 1) 18.27%, rgba(125, 147, 166, 1) 37.99%, rgba(147, 166, 182, 1) 58.38%, rgba(177, 192, 205, 1) 79.19%, rgba(215, 225, 234, 1) 100%);
        background: linear-gradient(180deg, rgba(108, 132, 153, 1) 0%, rgba(112, 136, 156, 1) 18.27%, rgba(125, 147, 166, 1) 37.99%, rgba(147, 166, 182, 1) 58.38%, rgba(177, 192, 205, 1) 79.19%, rgba(215, 225, 234, 1) 100%);
    }
</style>

<div class="ConfirmWindowLayout" tabindex="-1" contenteditable="false" *ngIf="ShowModal"></div>

<div class="MediaFillAbsolute">
    <div class="MediaFillRelative">
        <div [attr.id]="WindowId" class="ConfirmWindow" [ngStyle]="{left: Left, top: Top, width: Width, height: Height}">
            <table>
                <tr style="height: 40px;">
                    <td colspan="3" style="vertical-align: middle;">
                        <div class="WindowHeader" (mousedown)="OnMouseDown()" style="height: 40px; line-height: 40px;" [ngStyle]="LayoutDirection == 'rtl' ? {'padding-right': '15px'} : {'padding-left': '15px'}">
                            {{Title}}
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td>
                        <table class="FixedTable">
                            <tr>
                                <td style="width: 70px; position: relative;">
                                    <!--<img class="LeftCenter" style="width: 70px; height: 70px;" src="./Images/ConfirmIcon.png" />-->
                                    <div   *ngIf="!ShowWarningImage" [className]="LayoutDirection == 'rtl' ? 'RightCenter ConfirmIcon' : 'LeftCenter ConfirmIcon'">?</div>
                                    <img  *ngIf="ShowWarningImage" style="width:70px;height:70px" src="./Images/SimplogIcons/Warning.png" />
                                </td>

                                <td style="width: 10px;">
                                    <div></div>
                                </td>

                                <td style="vertical-align: middle;" [ngStyle]="{color: StringColor}">
                                    <div [ngStyle]="{color: StringColor}" style="width: 100%; white-space:pre-line; overflow-x: hidden; overflow-y:auto; font-size: 11px;">{{Message}}</div>
                                </td>
                            </tr>

                            <tr *ngIf="ShowCheckBox">
                                <td colspan="3">
                                    <table>
                                        <tr>
                                            <td style="width: 16px;">
                                                <CheckBox [IsChecked]="IsChecked" (Checked)="IsChecked = $event"></CheckBox>
                                            </td>

                                            <td style="width: 5px;">
                                                <div></div>
                                            </td>

                                            <td style="vertical-align: middle; font-size: 11px; color: #6E7172;">I accept and understand that this can't be undone</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>
                </tr>

                <tr style="height: 32px;">
                    <td colspan="3" style="vertical-align: bottom">
                        <table style="height: 22px;">
                            <tr>
                                <td style="width: 10px;">
                                    <div></div>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                                <td style="width: 57px;" *ngIf="ShowCancelButton">
                                    <button class="Button" (click)="CancelButtonClicked()" [attr.id]="CancelButtonId">{{CancelButtonText}}</button>
                                </td>

                                <td style="width: 5px;" *ngIf="ShowCancelButton">
                                    <div></div>
                                </td>

                                <td style="width: 57px;" *ngIf="ShowNoButton">
                                    <button class="Button" (click)="NoButtonClicked()" [attr.id]="NoButtonId">{{NoButtonText}}</button>
                                </td>

                                <td style="width: 5px;" *ngIf="ShowNoButton">
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button class="RedButton" (click)="YesButtonClicked()" [attr.id]="YesButtonId" [disabled]="!IsYesEnabled">{{YesButtonText}}</button>
                                </td>

                                <td style="width: 10px;">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 10px;">
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
