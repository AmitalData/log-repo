<style type="text/css">
    .MessageWindowLayout {
        position: absolute;
        top: 1px;
        bottom: 0;
        left: 0;
        right: 0;
        margin: auto;
        opacity: 0.7;
        background: -moz-linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        background: -webkit-linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        background: linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        pointer-events: none;
        z-index: 2;
    }

    .MessageWindow {
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        background: -moz-linear-gradient(50% 100% 90deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        background: -webkit-gradient(linear, 50% 100%, 50% 0%, color-stop(0.8925, rgba(255, 255, 255, 1)), color-stop(1, rgba(247, 247, 247, 1)));
        background: -o-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        background: linear-gradient(0deg, rgba(255, 255, 255, 1) 89.25%, rgba(247, 247, 247, 1) 100%);
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        border: 1px solid #C8C8C8;
        box-shadow: 0px 0px 3px 2px #D1D1D1;
        -moz-box-shadow: 0px 0px 3px 2px #D1D1D1;
        -webkit-box-shadow: 0px 0px 3px 2px #D1D1D1;
    }

    .WindowHeader {
        cursor: move;
        width: 100%;
        height: 100%;
        line-height: 30px;
        border-radius: 8px 8px 0 0;
        font-size: 18px;
        color: #1B90CB;
        padding-left: 15px;
        position: relative;
        background: transparent;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .WindowHeaderRTL {
        cursor: move;
        width: 100%;
        height: 100%;
        line-height: 30px;
        border-radius: 8px 8px 0 0;
        font-size: 18px;
        color: #1B90CB;
        padding-right: 15px;
        position: relative;
        background: transparent;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .red {
        color: #e50a0a !important;
    }

       .MediaFillAbsolute {
        z-index: 2;
      }
     .table {
        display: table;
        height: 100%;
    }

    .scroll-viewer {
        max-height: 100%;
        max-width: 100%;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .message {
        white-space: normal;
        word-wrap: break-word;
        width: 100%;
        font-size: 11px;
        text-align: left;
        color: #6E7172;
        text-align: right;
        display: table-cell;
        vertical-align: middle;
    }
 </style>

<div class="MessageWindowLayout" tabindex="-1" contenteditable="false" *ngIf="ShowModal"></div>
<LogitudeHotKeysComponent (CTRL_S_HotKey)="OnCTRL_S_HotKeyPressed()"></LogitudeHotKeysComponent>
<div class="MediaFillAbsolute">
    <div class="MediaFillRelative">
        <div [attr.id]="WindowId" class="MessageWindow" [ngStyle]="{left: Left, top: Top, width: Width, height: Height}"
            [style.zIndex]="ZIndex">
            <table [style.direction]="RTL == true ? 'rtl' : 'ltr'">
                <tr style="height: 40px;">
                    <td colspan="3" style="vertical-align: middle;">
                        <div [class.WindowHeader]="RTL == false" [class.WindowHeaderRTL]="RTL == true"
                            (mousedown)="OnMouseDown()" style="height: 40px; line-height: 40px;"
                            [class.red]="ShowErrorIcon">
                            {{Title}}
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td>
                        <table class="FixedTable">
                            <tr>
                                <td *ngIf="ShowIcon" style="width: 70px; position: relative;">
                                    <img [className]="LayoutDirection == 'rtl' ? 'RightCenter' : 'LeftCenter'"
                                        style="width: 70px; height: 70px;" [attr.src]="GetIconPath()" />
                                </td>
                                <td *ngIf="!ShowIcon" style="">
                                </td>

                                <td style="width: 10px;">
                                    <div></div>
                                </td>

                                <td>
                                    <div class="MediaFill">
                                        <ScrollViewer class="scroll-viewer">
                                            <div class="MediaFillRelative">
                                                <div class="table">
                                                    <div *ngIf="!IsMessageMultiLine" class="message"
                                                        [style.text-align]="LayoutDirection == 'rtl' ? 'right' : 'left'">
                                                        {{Message}}
                                                    </div>
                                                    <div *ngIf="IsMessageMultiLine" class="message"
                                                        style="white-space: pre-line;"
                                                        [style.text-align]="LayoutDirection == 'rtl' ? 'right' : 'left'">
                                                        {{Message}}
                                                    </div>
                                                </div>
                                            </div>
                                        </ScrollViewer>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>
                </tr>

                <tr style="height: 32px;">
                    <td colspan="3" style="vertical-align: bottom">
                        <table style="height: 22px;">
                            <tr>
                                <td style="width: 10px;">
                                    <div></div>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button class="Button" (click)="OkButtonClicked()"
                                        [attr.id]="OkButtonId">{{OkButtonText}}</button>
                                </td>

                                <td style="width: 10px;">
                                    <div></div>
                                </td>
                                <td *ngIf="ShowEventButton" style="width: 57px;">
                                    <button  class="Button" (click)="EventButtonClicked()" >{{EventButtonText}}</button>
                                </td>
                                <td *ngIf="ShowEventButton" style="width: 10px;">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 10px;">
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
