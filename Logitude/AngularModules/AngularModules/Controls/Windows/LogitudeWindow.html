
<style type="text/css">
    .WindowLayout {
        position: absolute;
        top: 1px;
        bottom: 0;
        left: 0;
        right: 0;
        margin: auto;
        opacity: 0.7;
        background: -moz-linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        background: -webkit-linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        background: linear-gradient(rgba(21, 61, 110, 0.7) 0%, rgba(21, 61, 110, 0.2) 50%, rgba(21, 61, 110, 0.7) 100%);
        pointer-events: none;
    }

    .LogitudeWindow {
        position: absolute;
        /*top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;*/
        border-radius: 8px;
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        background: -moz-linear-gradient(50% 100% 90deg,rgba(255, 255, 255, 1) 89.25%,rgba(230, 230, 230, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(230, 230, 230, 1) 100%);
        /*background: -webkit-gradient(linear,50% 100%,50% 0%,color-stop(0.8925,rgba(255, 255, 255, 1) ),color-stop(1,rgba(230, 230, 230, 1) ));*/
        background: -o-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(230, 230, 230, 1) 100%);
        background: linear-gradient(0deg, rgba(255, 255, 255, 1) 89.25%, rgba(230, 230, 230, 1) 100%);
        border: 1px solid #C8C8C8;
        overflow: hidden;
        /*vertical-align: middle;
        display: block;
        margin: auto;*/
    }

    .WindowHeader {
        cursor: default;
        width: 100%;
        height: 100%;
        border-radius: 8px 8px 0 0;
        font-size: 18px;
        color: #1B90CB;
        padding-left: 15px;
        position: relative;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    .WindowHeaderRight {
        cursor: default;
        width: 100%;
        height: 100%;
        border-radius: 8px 8px 0 0;
        font-size: 18px;
        color: #1B90CB;
        padding-right: 15px;
        position: relative;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    .CancelControl {
        height: 20px;
        line-height: 20px;
        padding-left: 10px;
        padding-right: 10px;
        background: Red;
        color: white;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .WindowButton:hover {
        border: 1px solid Orange;
        background: #FFFBDA;
        transition: 0.3s;
    }

    .WindowButton {
        width: 20px;
        height: 20px;
        cursor: pointer;
        border: 1px solid transparent;
        position: relative;
        transition: 0.3s;
    }
</style>

<div class="WindowLayout" tabindex="-1" contenteditable="false" *ngIf="ShowModal"></div>

<div class="MediaFillAbsolute">
    <div class="MediaFillRelative" [attr.id]="WindowContainerId" style="overflow:hidden;" (mouseup)="OnMouseUp()">
        <div [attr.id]="WindowId" class="LogitudeWindow" [ngStyle]="{width: Width, height: Height, top: Top, left: Left}">

            <table [style.direction]="RTL == true ? 'rtl' : 'ltr'">
                <tr *ngIf="!IsHideHeader" style="height: 35px">
                    <td>
                        <div [style.border-bottom]="BottomBorderForTitle"
                             [class.WindowHeaderRight]="RTL == true" [class.WindowHeader]="RTL != true"
                             (mousedown)="OnMouseDown($event)">

                            <input [attr.id]="FocusElementId" style="position: absolute; width: 0px; height: 0px; border:0px; outline: none;">

                            <table>
                                <tr>
                                    <td *ngIf="TitleIcon && !IsShowAutomationDelayTitle" style="width:1px; padding-right:5px;">
                                        <img [attr.src]="TitleIcon" width="23" height="28" style="display:block; vertical-align:middle;" />
                                    </td>

                                    <td *ngIf="!IsShowAutomationDelayTitle">
                                        <table>
                                            <tr>
                                                <td style="width: 1px; font-size: 18px;">
                                                    {{Title}}
                                                </td>

                                                <td style="width:10px;">
                                                    <div></div>
                                                </td>

                                                <td *ngIf="ShowHelpIcon" style="width: 14px;padding-left:10px; border-style: hidden;vertical-align:middle;">
                                                    <HelpIcon style="width: 14px;height:14px;" [Text]="HelpText" [HideHeader]="true"></HelpIcon>
                                                </td>

                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td *ngIf="IsShowAutomationDelayTitle" style="width: 1px;">

                                        <span style="font-size:18px;">
                                            Delay Conditions
                                        </span>
                                        <span style="font-size:12px;margin-left:3px">
                                            (will be checked after the delay)
                                        </span>

                                    </td>

                                    <td style="width: 5px;" *ngIf="IsCancelControlVisible">
                                        <div></div>
                                    </td>

                                    <td style="width: 1px;" *ngIf="IsCancelControlVisible">
                                        <div class="CancelControl">Cancelled</div>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                    <td style="width: 1px;" *ngIf="CustomTitleIcon">
                                        <img [attr.src]="CustomTitleIcon" width="46" height="26" style="display:block; vertical-align:middle;" />
                                    </td>

                                    <td style="width: 21px;" *ngIf="IsShowCloseButton">
                                        <IconButton [Name]="'Delete'" (click)="CloseClicked()"></IconButton>
                                    </td>

                                    <td style="width: 20px;" *ngIf="ShowHeaderButtons">
                                        <div class="WindowButton" (mousedown)="MaximizeClicked()" *ngIf="!IsWindowMaximize">
                                            <img src="./Images/WindowIcons/WindowMaximize.png" class="CenterCenter" style="top: -1px; left: 0px;" />
                                        </div>
                                        <div class="WindowButton" (mousedown)="RestoreClicked()" *ngIf="IsWindowMaximize">
                                            <img src="./Images/WindowIcons/WindowRestore.png" class="CenterCenter" style="top: -1px; left: 0px;" />
                                        </div>
                                    </td>
                                    <td style="width: 20px;" *ngIf="ShowHeaderButtons || ShowCloseButton">
                                        <div class="WindowButton" (mousedown)="CloseClicked()">
                                            <img src="./Images/WindowIcons/WindowClose.png" class="CenterCenter" style="top: -1px; left: 0px;" />
                                        </div>
                                    </td>

                                    <td style="width: 10px;">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <table>
                                <tr>
                                    <td style="width: 10px;" *ngIf="!IsEditComponent && !IsFullScreen && !IsHideWindowMargin">
                                        <div></div>
                                    </td>

                                    <td>
                                        <div class="MediaFill">
                                            <div #WindowContent></div>
                                        </div>
                                    </td>

                                    <td style="width: 10px;" *ngIf="!IsEditComponent && !IsFullScreen && !IsHideWindowMargin">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>

                <tr style="height: 10px;" *ngIf="!IsEditComponent && !IsFullScreen && !IsHideWindowMargin">
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>

            <BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator"></BusyIndicator>
        </div>
    </div>
</div>
