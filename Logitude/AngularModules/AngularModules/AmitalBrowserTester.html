    <script>
        function LoginToAngular(userdata) {



            var url = "api/LogitudeApplication"
            $.ajax({
                url: url,
                type: 'GET',
                contentType: 'application/json',

                success: function (result) {

                    if (result == true) {
                        document.location.href = "WebPages/UpgradeScreen.aspx";
                    }
                    else {

                        if (navigator.sayswho == "IE") {

                            alert("Internet explorer is not supported in HTML5");
                            return;
                        }

                        if (navigator.sayswho && navigator.sayswho.includes("Safari")) {

                            var safari = navigator.sayswho.split('Safari')[1];
                            var safariversionstring = safari.trim()
                            if (safariversionstring) {
                                var safariversion = Number(safariversionstring);
                                // Chrome
                                if (safariversion < 10) {
                                    alert("The current version of safari doesn't support HTML5 ,Please upgrade to version 10 or higher");
                                    return;
                                }
                            }
                        }



                        var data = JSON.stringify(userdata);
                        window.sessionStorage.setItem("userdata", data);
                        var version = "";
                        if (userdata.HtmlVersion) version = userdata.HtmlVersion;
                        //document.location.href = "Angular" + version + "/index.html";
                        let myIframe = document.getElementById("myFrame");
                        let myWin = myIframe.contentWindow;
                        //myWin.SendRequestToUnifreightAsync = 
                        //    function (MessageId) {
                        //        alert("SendRequestToUnifreightAsync:" + MessageId);
                        //    };

                        myIframe.src = "index.html" + window.location.search;//"http://localhost:3000/";
                        

                    }
                },

                error: function (jqXHR, textStatus, errorThrown) {

                }
            });



        }

            function getParameterByName(name, url) {
                if (!url) url = window.location.href;
                name = name.replace(/[\[\]]/g, "\\$&");
                var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                    results = regex.exec(url);
                if (!results) return null;
                if (!results[2]) return '';
                return decodeURIComponent(results[2].replace(/\+/g, " "));
            }
