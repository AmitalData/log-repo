
<table style="vertical-align:central;vertical-align:top;">


    <tr style="height:6px;vertical-align:top">
        <td style="width:100%;">
            <div></div>
        </td>
    </tr>


    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:6px;vertical-align:top">
        <td style="width:100%;">
            <div></div>
        </td>
    </tr>

    <tr>

        <td style="width:100%;">
          <table>
              <tr>
                  <td style="width:8px"><div></div></td>

                  <td style="width:50px"><div>{{'QuoteTemplate.S.Name' | TextCodeTranslationPipe}}:</div></td>
                  <td style="width:5px"><div></div></td>
        
                  <td style="width:150px"><input  type="text" [(ngModel)]="Name" style="height:22px;border-radius:3px;border:1px solid #ccc9c9;width:150px" /></td>

                  <td style="height:22px;">
                      <div  style="width:auto;height:22px;position:relative;text-align:left;float:right;margin-right:3px"><button (click)="AddDataField()" style="width:auto;background-color:#E6E6E6;height:22px;" class="Button">{{'QuoteTemplate.B.AddDataField' | TextCodeTranslationPipe}} </button></div>
                  </td>


              </tr>
          </table>
        </td>


        
    </tr>

    <tr style="height:10px;vertical-align:top">
        <td style="width:100%;">
            <div></div>
        </td>
    </tr>

    <tr style="height:100%;vertical-align:top">

        <td>
          <div style="margin:5px;height:100%;vertical-align:top">
            <ScrollViewer>
              <FroalaEditor style="text-align:center;margin-top:-5px;" [EditorfroalaSetting]="froalaEditorSetting"></FroalaEditor>
            </ScrollViewer>
          </div>

        </td>

    </tr>



    <tr style="height:32px;margin-top:-5px">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td  style="width: 57px;">

                        <button class="Button" (click)="CloseButtonClicked()">{{'QuoteTemplate.B.Cancel' | TextCodeTranslationPipe}} </button>
                    </td>

                    <td  style="width: 7px;"></td>

                    <td  style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()"id="{{'Savee' | IdGeneratorPipe}}">{{'QuoteTemplate.B.Save' | TextCodeTranslationPipe}} </button>
                    </td>

                   
                </tr>
            </table>
        </td>
    </tr>


</table>
