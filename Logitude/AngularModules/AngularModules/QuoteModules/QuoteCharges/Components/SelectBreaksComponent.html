<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <LogLabel [DataContext]="DataContext" [ObjectTableName]="ObjectTableName" [ObjectFieldName]="'SelectedPriceStepId'" [Text]="'Price Step'" [NoObjectField]="true"></LogLabel>
                    </td>

                    <td style="width:230px;">
                        <LogLov [ObjectFieldName]="'SelectedPriceStepId'"
                                [SelectedValue]="SelectedPriceStepId"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'PriceStep'"
                                [NoObjectField]="true"
                                (SelectedItemChanged)="SelectedPriceStepList = $event">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
