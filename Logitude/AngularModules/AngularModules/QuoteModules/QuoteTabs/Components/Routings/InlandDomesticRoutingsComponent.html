
<style type="text/css">
    .PartnerBoxHeader td {
        vertical-align: middle;
    }

    .PartnerBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        overflow: hidden;
    }

    .PartnerBoxHeader {
        height: 25px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .NameTextBox {
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        width: 100%;
        border: 1px solid #BABABA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: #F7F7F7;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        text-indent: 5px;
    }
</style>

<table *ngIf="EntityPM">
    <tr class="TabTitleRow">
        <td>{{'Quote.O.Routings' | TextCodeTranslationPipe}}</td>

        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td style="vertical-align: top;">

            <!-- Subject + Dates -->
            <div style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <table>
                    <tr class="FormFieldRow" style="height:1px;" *ngIf="IsSubjectVisible">
                        <td style="width:400px;">
                            <table>
                                <tr>
                                    <td style="width:85px;">
                                        <LogLabel [ObjectFieldName]="'Subject'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:250px;">
                                        <LogTextBox [ObjectFieldName]="'Subject'" [Text]="Subject" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                    </td>

                                    <td style="padding-left: 3px;">
                                        <Hyperlink *ngIf="IsSubjectEdited" [IsEnabled]="IsQuoteEditEnabled" (click)="ResetSubjectEdited()" title="Value Edited by User, Double Click to Reset Calculated value">
                                            <img src="./Images/Buttons/Edit.png" />
                                        </Hyperlink>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="width:400px;">
                            <table>
                                <tr class="FormFieldRow">
                                    <td style="width:85px;">
                                        <LogLabel [ObjectFieldName]="'ETD'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:200px;">
                                        <LogDatePicker [ObjectFieldName]="'ETD'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ETA'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogDatePicker [ObjectFieldName]="'ETA'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </div>

            <div style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <table>
                    <tr style="height: 192px;">
                        <td>
                            <table>
                                <tr>
                                    <td style="width: 400px;">
                                        <fieldset class="MediaFill GroupBox">
                                            <legend>
                                                <span>From</span>
                                            </legend>

                                            <div style="height: 192px; width: 100%; margin-top: -5px;">
                                                <table>
                                                    <tr style="height: 25px;">
                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td>
                                                                        <RadioButton [IsEnabled]="IsQuoteEditEnabled" [Name]="'FromRadio'" [IsChecked]="InlandDomesticFromTypeCode == 'PART'" (Checked)="InlandDomesticFromTypeCode = 'PART'" [Text]="'Partner'"></RadioButton>
                                                                    </td>

                                                                    <td>
                                                                        <RadioButton [IsEnabled]="IsQuoteEditEnabled" [Name]="'FromRadio'" [IsChecked]="InlandDomesticFromTypeCode == 'PORT'" (Checked)="InlandDomesticFromTypeCode = 'PORT'" [Text]="'Port'"></RadioButton>
                                                                    </td>

                                                                    <td>
                                                                        <RadioButton [IsEnabled]="IsQuoteEditEnabled" [Name]="'FromRadio'" [IsChecked]="InlandDomesticFromTypeCode == 'CASL'" (Checked)="InlandDomesticFromTypeCode = 'CASL'" [Text]="'Casual Address'"></RadioButton>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <!-- PART -->
                                                            <table *ngIf="InlandDomesticFromTypeCode == 'PART'">
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'FromPartnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Quote.S.NewQuote.Name'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'FromPartnerId'"
                                                                                [SelectedValue]="FromPartnerId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Card'"
                                                                                [DependencyFilter1Value]="CardLOVDependencyProperty1"
                                                                                [DependencyFilter1IsList]="true">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'FromPartnerAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Quote.S.Partners.Address'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'FromPartnerAddressId'"
                                                                                [SelectedValue]="FromPartnerAddressId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Address'"
                                                                                [DependencyFilter1Value]="FromPartnerId">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="vertical-align: top; padding-top: 5px;">
                                                                        <AddressTemplate [Address]="FromAddressList" [Right]="36"></AddressTemplate>
                                                                    </td>
                                                                </tr>
                                                            </table>

                                                            <!-- PORT -->
                                                            <table *ngIf="InlandDomesticFromTypeCode == 'PORT'">
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'FromPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'From Port'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'FromPortId'"
                                                                                [SelectedValue]="FromPortId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Port'"
                                                                                [DependencyFilter1Value]="TransportModeId">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr style="height: 75px;">
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="height: 75px; vertical-align: top;">
                                                                        <div style="height: 100%;">
                                                                            <LogTextBox [ObjectFieldName]="'MainCarriageFromPortAddress'" [Text]="MainCarriageFromPortAddress" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                                        </div>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td colspan="2">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>

                                                            <!-- CASL -->
                                                            <table *ngIf="InlandDomesticFromTypeCode == 'CASL'">
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'InlandDomesticFromZipCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogTextBox [ObjectFieldName]="'InlandDomesticFromZipCode'" [Text]="InlandDomesticFromZipCode" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>
                                                                </tr>

                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'InlandDomesticFromCity'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'InlandDomesticFromCity'" [Text]="InlandDomesticFromCity" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                                                </td>

                                                                                <td style="padding-left: 5px;">
                                                                                    <Hyperlink [IsEnabled]="IsQuoteEditEnabled" (click)="SelectCityCommand('F')">Select</Hyperlink>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'InlandDomesticFromCountryId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'InlandDomesticFromCountryId'"
                                                                                [SelectedValue]="InlandDomesticFromCountryId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Country'"
                                                                                (SelectedItemChanged)="InlandDomesticFromCountry = $event">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td colspan="2">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </fieldset>
                                    </td>

                                    <td style="width: 10px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 400px;">
                                        <fieldset class="MediaFill GroupBox">
                                            <legend>
                                                <span>To</span>
                                            </legend>

                                            <div style="height: 192px; width: 100%; margin-top: -5px;">
                                                <table>
                                                    <tr style="height: 25px;">
                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td>
                                                                        <RadioButton [IsEnabled]="IsQuoteEditEnabled" [Name]="'ToRadio'" [IsChecked]="InlandDomesticToTypeCode == 'PART'" (Checked)="InlandDomesticToTypeCode = 'PART'" [Text]="'Partner'"></RadioButton>
                                                                    </td>

                                                                    <td>
                                                                        <RadioButton [IsEnabled]="IsQuoteEditEnabled" [Name]="'ToRadio'" [IsChecked]="InlandDomesticToTypeCode == 'PORT'" (Checked)="InlandDomesticToTypeCode = 'PORT'" [Text]="'Port'"></RadioButton>
                                                                    </td>

                                                                    <td>
                                                                        <RadioButton [IsEnabled]="IsQuoteEditEnabled" [Name]="'ToRadio'" [IsChecked]="InlandDomesticToTypeCode == 'CASL'" (Checked)="InlandDomesticToTypeCode = 'CASL'" [Text]="'Casual Address'"></RadioButton>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <!-- PART -->
                                                            <table *ngIf="InlandDomesticToTypeCode == 'PART'">
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'ToPartnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Quote.S.NewQuote.Name'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'ToPartnerId'"
                                                                                [SelectedValue]="ToPartnerId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Card'"
                                                                                [DependencyFilter1Value]="CardLOVDependencyProperty1"
                                                                                [DependencyFilter1IsList]="true">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'ToPartnerAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Quote.S.Partners.Address'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'ToPartnerAddressId'"
                                                                                [SelectedValue]="ToPartnerAddressId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Address'"
                                                                                [DependencyFilter1Value]="ToPartnerId">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="vertical-align: top; padding-top: 5px;">
                                                                        <AddressTemplate [Address]="ToAddressList" [Right]="36"></AddressTemplate>
                                                                    </td>
                                                                </tr>
                                                            </table>

                                                            <!-- PORT -->
                                                            <table *ngIf="InlandDomesticToTypeCode == 'PORT'">
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'ToPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'To Port'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'ToPortId'"
                                                                                [SelectedValue]="ToPortId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Port'"
                                                                                [DependencyFilter1Value]="TransportModeId">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr style="height: 75px;">
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="height: 75px; vertical-align: top;">
                                                                        <div style="height: 100%;">
                                                                            <LogTextBox [ObjectFieldName]="'MainCarriageToPortAddress'" [Text]="MainCarriageToPortAddress" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                                        </div>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td colspan="2">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>

                                                            <!-- CASL -->
                                                            <table *ngIf="InlandDomesticToTypeCode == 'CASL'">
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'InlandDomesticToZipCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogTextBox [ObjectFieldName]="'InlandDomesticToZipCode'" [Text]="InlandDomesticToZipCode" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>
                                                                </tr>

                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'InlandDomesticToCity'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'InlandDomesticToCity'" [Text]="InlandDomesticToCity" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                                                </td>

                                                                                <td style="padding-left: 5px;">
                                                                                    <Hyperlink [IsEnabled]="IsQuoteEditEnabled" (click)="SelectCityCommand('T')">Select</Hyperlink>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'InlandDomesticToCountryId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogLov [ObjectFieldName]="'InlandDomesticToCountryId'"
                                                                                [SelectedValue]="InlandDomesticToCountryId"
                                                                                [ObjectTableName]="ObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Country'"
                                                                                (SelectedItemChanged)="InlandDomesticToCountry = $event">
                                                                        </LogLov>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td colspan="2">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </fieldset>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Carrier-->
            <div style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <table>
                    <tr class="FormFieldRow">
                        <td style="width:85px;">
                            <LogLabel [ObjectFieldName]="'MainCarriageCarrierId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="CarrierLabel"></LogLabel>
                        </td>

                        <td style="width:236px;">
                            <LogLov [ObjectFieldName]="'MainCarriageCarrierId'"
                                    [SelectedValue]="MainCarriageCarrierId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Carrier'"
                                    [DependencyFilter1Value]="CarrierDependencyProperty1">
                            </LogLov>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
</table>
