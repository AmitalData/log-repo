<style>
    .Disabled{
        opacity:0.5;
        pointer-events:none;
    }
</style>


<table  *ngIf="IsLoadPage" style="vertical-align:top;height:100%">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>


    <tr>
        <td>
            <table>
                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px"><LogTextBox style="width:180px" [HideColumns]="true" [IsNewEntityCall]="IsNewEntityCall" [ObjectFieldName]="'Name'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogTextBox></td>
                    <td><div></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [ObjectFieldName]="'TemplateTypeCode'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogLabel></td>
                    <td  style="width:180px" class="Disabled"><LogLov [HideColumns]="true" style="width:180px" [ObjectFieldName]="'TemplateTypeCode'" [SelectedValuePath]="'Code'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext" [LookUpTableName]="'QuoteType'"></LogLov></td>
                    <td><div></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [ObjectFieldName]="'IsDefault'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px;text-align:left"><LogCheckBox [HideColumns]="true" [ObjectFieldName]="'IsDefault'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogCheckBox></td>
                    <td><div></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px;text-align:left"><LogCheckBox [HideColumns]="true" [ObjectFieldName]="'InActive'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogCheckBox></td>
                    <td><div></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [Text]="'Margin Left'" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px"><LogTextBox style="width:180px"  [HideColumns]="true" [ObjectFieldName]="'QuoteOPTemplatePDFMarginLeft'" [ObjectTableName]="'QuoteOPTemplateSetting'" [DataContext]="DataContext"></LogTextBox></td>
                    <td><div style="text-align:left"><span style="text-align:left;margin-left:5px">{{'QuoteOPTemplate.S.px' | TextCodeTranslationPipe}}</span></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [Text]="'Margin Right'" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px;"><LogTextBox  [HideColumns]="true" style="width:180px" [ObjectFieldName]="'QuoteOPTemplatePDFMarginRight'" [ObjectTableName]="'QuoteOPTemplateSetting'" [DataContext]="DataContext"></LogTextBox></td>
                    <td><div style="text-align:left"><span style="text-align:left;margin-left:5px" >{{'QuoteOPTemplate.S.px' | TextCodeTranslationPipe}} </span></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [Text]="'QuoteOPTemplate.S.QuoteOPTemplatePDFMarginTop' | TextCodeTranslationPipe" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px"><LogTextBox style="width:180px" [HideColumns]="true" [ObjectFieldName]="'QuoteOPTemplatePDFMarginTop'" [ObjectTableName]="'QuoteOPTemplateSetting'" [DataContext]="DataContext"></LogTextBox></td>
                    <td><div style="text-align:left"><span style="text-align:left;margin-left:5px">{{'QuoteOPTemplate.S.px' | TextCodeTranslationPipe}}</span></div></td>
                </tr>

                <tr style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [Text]="'QuoteOPTemplate.S.QuoteOPTemplatePDFMarginBottom' | TextCodeTranslationPipe" [DataContext]="DataContext"></LogLabel></td>
                    <td style="width:180px"><LogTextBox style="width:180px" [HideColumns]="true" [ObjectFieldName]="'QuoteOPTemplatePDFMarginBottom'" [ObjectTableName]="'QuoteOPTemplateSetting'" [DataContext]="DataContext"></LogTextBox></td>
                    <td><div style="text-align:left"><span style="text-align:left;margin-left:5px">{{'QuoteOPTemplate.S.px' | TextCodeTranslationPipe}}</span></div></td>
                </tr>



                <tr *ngIf="IsShowIsCopiedAtSignup"  style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [ObjectFieldName]="'IsCopiedAtSignup'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogLabel> </td>
                    <td style="width:180px;"><LogCheckBox [ObjectFieldName]="'IsCopiedAtSignup'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogCheckBox></td>
                    <td><div></div></td>
                </tr>



                <tr *ngIf="IsShowEnableForCustomer" style="vertical-align:top;height:30px">
                    <td style="width:5px"><div></div></td>
                    <td style="width:150px;">  <LogLabel [ObjectFieldName]="'IsEnabledForCustomers'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogLabel> </td>
                    <td style="width:180px;"><LogCheckBox [ObjectFieldName]="'IsEnabledForCustomers'" [ObjectTableName]="'QuoteOPTemplate'" [DataContext]="DataContext"></LogCheckBox></td>
                    <td><div></div></td>
                </tr>



                <tr> <td colspan="4"></td></tr>
            </table>
        </td>

        </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CancelButtonClicked()">{{'QuoteOPTemplate.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()">{{'QuoteOPTemplate.B.Save' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>


</table>
