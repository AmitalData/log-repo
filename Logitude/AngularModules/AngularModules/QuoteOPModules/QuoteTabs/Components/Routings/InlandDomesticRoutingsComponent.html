
<style type="text/css">
    .PartnerBoxHeader td {
        vertical-align: middle;
    }

    .PartnerBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        overflow: hidden;
    }

    .PartnerBoxHeader {
        height: 25px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .NameTextBox {
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        width: 100%;
        border: 1px solid #BABABA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: #F7F7F7;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        text-indent: 5px;
    }
</style>

<table *ngIf="EntityPM">
    <tr class="TabTitleRow">
        <td>{{'QuoteOP.O.Routings' | TextCodeTranslationPipe}}</td>

        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td style="vertical-align: top;">

            <!-- Subject + Dates -->
            <div style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <table>
                    <tr class="FormFieldRow" style="height:1px;" *ngIf="IsSubjectVisible">
                        <td style="width:400px;">
                            <table>
                                <tr>
                                    <td style="width:85px;">
                                        <LogLabel [ObjectFieldName]="'Subject'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:250px;">
                                        <LogTextBox [ObjectFieldName]="'Subject'" [Text]="Subject" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                    </td>

                                    <td style="padding-left: 3px;">
                                        <Hyperlink *ngIf="IsSubjectEdited" [IsEnabled]="IsQuoteEditEnabled" (click)="ResetSubjectEdited()" title="Value Edited by User, Double Click to Reset Calculated value">
                                            <img src="./Images/Buttons/Edit.png" />
                                        </Hyperlink>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="width:400px;">
                            <table>
                                <tr class="FormFieldRow">
                                    <td style="width:85px;">
                                        <LogLabel [ObjectFieldName]="'ETD'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:200px;">
                                        <LogDatePicker [ObjectFieldName]="'ETD'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ETA'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogDatePicker [ObjectFieldName]="'ETA'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Partners-->
            <div style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <table>
                    <tr>
                        <td style="width:700px;">
                            <table>
                                <tr>

                                    <!-- From Partner -->
                                    <td style="width:335px;">
                                        <div class="PartnerBox">
                                            <table>
                                                <tr class="PartnerBoxHeader">
                                                    <td>From Partner</td>
                                                </tr>

                                                <tr>
                                                    <td style="padding-left: 5px; padding-right: 5px;">
                                                        <table class="FixedTable">
                                                            <tr class="FormFieldRow">
                                                                <td style="width:80px;">
                                                                    <LogLabel [ObjectFieldName]="'FromPartnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'QuoteOP.S.Partners.Name'"></LogLabel>
                                                                </td>

                                                                <td style="width:200px; max-width:200px;">
                                                                    <div style="position:relative;" class="NameTextBox TextTrimming">
                                                                        <label style="color:#6E7172; font-size:11px;"> {{FromPartnerName}} </label>
                                                                    </div>
                                                                </td>

                                                                <td>
                                                                    <div></div>
                                                                </td>
                                                            </tr>

                                                            <tr class="FormFieldRow">
                                                                <td style="width:80px;">
                                                                    <div></div>
                                                                </td>

                                                                <td colspan="2">
                                                                    <table>
                                                                        <tr>
                                                                            <td style="width: 200px;">
                                                                                <LogLov [ObjectFieldName]="'FromPartnerAddressId'"
                                                                                        [SelectedValue]="FromPartnerAddressId"
                                                                                        [ObjectTableName]="ObjectTableName"
                                                                                        [DataContext]="DataContext"
                                                                                        [LookUpTableName]="'Address'"
                                                                                        [HideColumns]="true"
                                                                                        [DependencyFilter1Value]="FromPartnerId">
                                                                                </LogLov>
                                                                            </td>

                                                                            <td style="width: 2px;">
                                                                                <div></div>
                                                                            </td>

                                                                            <td style="width:18px;">
                                                                                <IconButton [disabled]="!IsEditFromAddressEnabled" (click)="EditAddressClicked('F')" [Name]="'Edit'" [IsSmall]="true"></IconButton>
                                                                            </td>

                                                                            <td style="width:18px;">
                                                                                <IconButton [disabled]="!IsQuoteEditEnabled" (click)="AddAddressClicked('F')" [Name]="'Add'" [IsSmall]="true" [Left]="3"></IconButton>
                                                                            </td>

                                                                            <td>
                                                                                <div></div>
                                                                            </td>
                                                                        </tr>
                                                                    </table>
                                                                </td>
                                                            </tr>

                                                            <tr style="height: 90px;">
                                                                <td>
                                                                    <LogLabel [ObjectFieldName]="'FromPartnerAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'QuoteOP.S.Partners.Address'"></LogLabel>
                                                                </td>

                                                                <td colspan="2">
                                                                    <AddressTemplate [Address]="FromAddressList" [Height]="80" [Right]="36"></AddressTemplate>                                                                    
                                                                </td>

                                                            </tr>

                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>

                                    <td style="width:10px;">
                                        <div></div>
                                    </td>

                                    <!-- To Partner -->
                                    <td style="width:335px;">
                                        <div class="PartnerBox">
                                            <table>
                                                <tr class="PartnerBoxHeader">
                                                    <td>To Partner</td>
                                                </tr>

                                                <tr>
                                                    <td style="padding-left: 5px; padding-right: 5px;">
                                                        <table class="FixedTable">
                                                            <tr class="FormFieldRow">
                                                                <td style="width:80px;">
                                                                    <LogLabel [ObjectFieldName]="'ToPartnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'QuoteOP.S.Partners.Name'"></LogLabel>
                                                                </td>

                                                                <td style="width:200px; max-width:200px;">
                                                                    <div style="position:relative;" class="NameTextBox TextTrimming">
                                                                        <label style="color:#6E7172; font-size:11px;"> {{ToPartnerName}} </label>
                                                                    </div>
                                                                </td>

                                                                <td>
                                                                    <div></div>
                                                                </td>
                                                            </tr>

                                                            <tr class="FormFieldRow">
                                                                <td style="width:80px;">
                                                                    <div></div>
                                                                </td>

                                                                <td colspan="2">
                                                                    <table>
                                                                        <tr>
                                                                            <td style="width: 200px;">
                                                                                <LogLov [ObjectFieldName]="'ToPartnerAddressId'"
                                                                                        [SelectedValue]="ToPartnerAddressId"
                                                                                        [ObjectTableName]="ObjectTableName"
                                                                                        [DataContext]="DataContext"
                                                                                        [LookUpTableName]="'Address'"
                                                                                        [HideColumns]="true"
                                                                                        [DependencyFilter1Value]="ToPartnerId">
                                                                                </LogLov>
                                                                            </td>

                                                                            <td style="width: 2px;">
                                                                                <div></div>
                                                                            </td>

                                                                            <td style="width:18px;">
                                                                                <IconButton [disabled]="!IsEditToAddressEnabled" (click)="EditAddressClicked('T')" [Name]="'Edit'" [IsSmall]="true"></IconButton>
                                                                            </td>

                                                                            <td style="width:18px;">
                                                                                <IconButton [disabled]="!IsQuoteEditEnabled" (click)="AddAddressClicked('T')" [Name]="'Add'" [IsSmall]="true" [Left]="3"></IconButton>
                                                                            </td>

                                                                            <td>
                                                                                <div></div>
                                                                            </td>
                                                                        </tr>
                                                                    </table>
                                                                </td>
                                                            </tr>

                                                            <tr style="height: 90px;">
                                                                <td>
                                                                    <LogLabel [ObjectFieldName]="'ToPartnerAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'QuoteOP.S.Partners.Address'"></LogLabel>
                                                                </td>

                                                                <td colspan="2">
                                                                    <AddressTemplate [Address]="ToAddressList" [Height]="80" [Right]="36"></AddressTemplate>                                                                     
                                                                </td>

                                                            </tr>

                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                        
                                    <td>
                                        <div></div>
                                    </td>

                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Carrier-->
            <div style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <table>
                    <tr class="FormFieldRow">
                        <td style="width:85px;">
                            <LogLabel [ObjectFieldName]="'MainCarriageCarrierId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="CarrierLabel"></LogLabel>
                        </td>

                        <td style="width:236px;">
                            <LogLov [ObjectFieldName]="'MainCarriageCarrierId'"
                                    [SelectedValue]="MainCarriageCarrierId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Carrier'"
                                    [DependencyFilter1Value]="CarrierDependencyProperty1">
                            </LogLov>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
</table>
