
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td style="width:320px;">
                                    <table class="FixedTable">
                                        <tr class="FormFieldRow">
                                            <td style="width: 115px;">
                                                <LogLabel [ObjectFieldName]="'Step'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:140px;">
                                                <LogTextBox [ObjectFieldName]="'Step'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>

                                            <td style="width:70px;" class="Label">{{DataContext.WeightUnitCode}}</td>

                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'CostUnitPrice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogTextBox [ObjectFieldName]="'CostUnitPrice'" [Text]="DataContext.CostUnitPrice" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'MarkupValue'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogTextBox [ObjectFieldName]="'MarkupValue'" [Text]="DataContext.MarkupValue" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>

                                            <td style="width:70px;" class="Label">{{DataContext.MarkUpType}}</td>

                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'SaleUnitPrice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogTextBox [ObjectFieldName]="'SaleUnitPrice'" [Text]="DataContext.SaleUnitPrice" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td><div></div></td>
                                        </tr>

                                    </table>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
