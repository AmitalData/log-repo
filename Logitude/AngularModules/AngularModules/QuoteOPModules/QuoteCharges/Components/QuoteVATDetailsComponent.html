
<table>
    <tr style="height: 1px;" *ngIf="IsCurrencyFilterVisible">
        <td>
            <table>
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 66px;">
                        <div style="width: 66px;">
                            <ul class="FiltersMenu">
                                <li (click)="OnSelectCurrency(SaleCurrencyCode)" [class.SelectedFilter]="SelectedCurrencyCode === SaleCurrencyCode" style="width:33px;">
                                    {{SaleCurrencyCode}}
                                </li>
                                <li (click)="OnSelectCurrency(LocalCurrencyCode)" [class.SelectedFilter]="SelectedCurrencyCode === LocalCurrencyCode" style="width:33px;">
                                    {{LocalCurrencyCode}}
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;" *ngIf="IsCurrencyFilterVisible">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 120px; min-width: 120px; max-width: 120px;">VAT</td>
                                <td style="width: 150px; min-width: 150px; max-width: 150px; text-align: right;">Amount ({{SelectedCurrencyCode}})</td>
                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource">
                                <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px;">
                                    {{item.VatTypeCell}}
                                </td>

                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; text-align: right;" *ngIf="IsByLocalCurrency">
                                    {{item.LocalCurrencyVATAmount | NumbersPipe:'N2'}}
                                </td>

                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; text-align: right;" *ngIf="!IsByLocalCurrency">
                                    {{item.QuoteCurrencyVATAmount | NumbersPipe:'N2'}}
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
