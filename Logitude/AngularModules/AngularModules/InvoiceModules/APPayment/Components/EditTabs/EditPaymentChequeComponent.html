

<table *ngIf="IsVisibile">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
    <tr  style="height:1px;">

     
        <td colspan="2">

            <div class="alert-animation SaveAlert"
               
                 style=" text-align:center; margin: 0 auto;margin-bottom: 8px;min-width: 325px;height: 24px;width: fit-content;background: #c0e8c2;border: 1px solid #54a758;color: #6a7769;position: relative;padding: 3px 5px;border-radius: 5px;" >
             
                {{'Accounting.General.O.FillPayToName' | TextCodeTranslationPipe}} 
             
            </div>
        </td>

    </tr>
    <tr>
        <td style="width: 450px">
            <table>
                <tr class="FormFieldRow">
                    <td>
                        <table>

                            <!-- GLAccount -->
                            <tr class="FormFieldRow">
                                <td style="width: 180px;">
                                    <LogLabel [ObjectFieldName]="'PayToGLAccountId'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 200px;padding-right: 36px;">
                                    <LogLov [ObjectFieldName]="'PayToGLAccountId'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'GLAccount'"
                                            (SelectedItemChanged)="Account = $event"
                                            [QueryFilterItems]="filterAgrs"
                                            [HideColumns]="true">
                                    </LogLov>
                                </td>
                                <td style="width:100px"><div></div></td>
                            </tr>

                            <!-- Pay to -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'PayToName'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="padding-right: 36px;" colspan="2">
                                    <LogTextBox [ObjectFieldName]="'PayToName'" [InputType]="'ntext'" [DataContext]="DataContext" [Text]="PayToName"
                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td><div></div></td>
                            </tr>

                            <!-- bank account -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'BankAccountId'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="padding-right: 36px;">


                                    <LogLov [ObjectFieldName]="'BankAccountId'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'BankAccount'"
                                            [DisplayMemberPath]="BankName"
                                            (SelectedItemChanged)="BankAccount = $event"
                                            [HideColumns]="true">
                                    </LogLov>

                                </td>
                                <td><div></div></td>
                            </tr>

                            <!-- amount -->
                            <tr class="FormFieldRow">
                                <td>


                                    <LogLabel [ObjectFieldName]="'LocalAmount'" [Text]="LocalAmountFieldLabel" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>

                                </td>

                                <td style="padding-right: 36px;">
                                    <LogTextBox [ObjectFieldName]="'LocalAmount'" [InputType]="'double'" [DataContext]="DataContext"
                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td><div></div></td>
                            </tr>

                            <!-- CurrencyId -->
                            <tr [style.height.px]="50">
                                <td colspan="2">
                                    <table>

                                        <tr class="FormFieldRow">
                                            <td style="width:180px">
                                                <LogLabel [ObjectFieldName]="'CurrencyId'" [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="padding-right: 36px;width:200px">
                                                <LogLov [ObjectFieldName]="'CurrencyId'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Currency'"
                                                        (SelectedItemChanged)="Currency = $event"
                                                        [HideColumns]="true"
                                                        [SelectedValue]="CurrencyId">
                                                </LogLov>
                                            </td>
                                            <td><div></div></td>
                                        </tr>

                                        <!-- ForignAmount -->
                                        <tr class="FormFieldRow">
                                            <td style="width: 180px;">
                                                <LogLabel [ObjectFieldName]="'ForeignAmount'" [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width: 200px;padding-right: 36px;">
                                                <LogTextBox [ObjectFieldName]="'ForeignAmount'" [InputType]="'double'" [DataContext]="DataContext" [Text]="ForeignAmount"
                                                            [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                            </td>
                                            <td><div></div></td>
                                        </tr>


                                    </table>
                                </td>

                            </tr>
                            <!-- ValueDate -->
                            <tr class="FormFieldRow">
                                <td style="width: 180px;">
                                    <LogLabel [ObjectFieldName]="'ValueDate'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 200px;padding-right: 36px;">
                                    <LogDatePicker [ObjectFieldName]="'ValueDate'" [ObjectTableName]="ObjectTableName"
                                                   [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                </td>
                                <td><div></div></td>
                            </tr>
                            <!-- Notes -->
                            <tr class="FormFieldRow">
                                <td style="width: 180px;">
                                    <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 200px;padding-right: 36px;" colspan="2">
                                    <LogTextBox [ObjectFieldName]="'Notes'" [InputType]="'ntext'" [DataContext]="DataContext"
                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td><div></div></td>

                            </tr>

                            <tr><td><div></div></td></tr>
                        </table>

                    </td>
                </tr>
            </table>
        </td>

        <td><div></div></td>

        <!--<td>
            <table>
                <tr class="FormFieldRow">
                    <td>
                        <table>

                            <tr><td><div></div></td></tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>-->

    </tr>

    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
