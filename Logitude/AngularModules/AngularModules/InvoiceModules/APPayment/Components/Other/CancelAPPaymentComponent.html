

<table *ngIf="IsVisibile">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
   
    <tr>
        <td >
            <table>
                <tr class="FormFieldRow">
                    <td >
                        <table>


                            <tr class="FormFieldRow">
                                <td style="width: 220px;">
                                    <LogLabel [ObjectFieldName]="'AccountingCancelationDate'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td><div></div></td>

                                <td style="width: 140px;">
                                    <LogDatePicker [ObjectFieldName]="'AccountingCancelationDate'" [ObjectTableName]="ObjectTableName"
                                                   [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                </td>
                                <td style="width:70px;"><div></div></td>
                            </tr>


                            <tr class="FormFieldRow">
                                <td style="width: 180px;">
                                    <LogLabel [ObjectFieldName]="'CancelationNotes'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td><div></div></td>

                                <td style="width: 140px;" colspan="2">
                                    <LogTextBox [ObjectFieldName]="'CancelationNotes'" [InputType]="'ntext'" [DataContext]="DataContext"
                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td><div></div></td>

                            </tr>
                            <tr class="FormFieldRow">
                                <td style="width: 180px;">
                                    <LogLabel [ObjectFieldName]="'DontIncludeInDeductionReport'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td><div></div></td>

                                <td style="width: 140px;" >
                                    <CheckBox [IsChecked]="DontIncludeInDeductionReport" (Checked)="DontIncludeInDeductionReport = $event"></CheckBox>
</td>
<td><div></div></td>

                            </tr>

                            <tr><td><div></div></td></tr>
                        </table>

                    </td>
                </tr>
            </table>
        </td>

        <td><div></div></td>

        <!--<td>
            <table>
                <tr class="FormFieldRow">
                    <td>
                        <table>

                            <tr><td><div></div></td></tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>-->

    </tr>

    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
