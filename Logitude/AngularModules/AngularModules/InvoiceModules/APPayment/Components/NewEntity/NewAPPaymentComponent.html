<style type="text/css">
    .SectionTitle > span {
        font-size: 14px;
        user-select: text;
        -webkit-user-select: auto;
    }

    .SectionTitle td {
        font-size: 14px;
        user-select: text;
    }

    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }
</style>

<table *ngIf="IsVisible">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table>
                    <tr class="FormFieldRow">
                        <td>
                            <table>

                                <!-- VendorId -->
                                <tr class="FormFieldRow">
                                    <td style="width:120px; ">
                                        <LogLabel [ObjectFieldName]="'VendorId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:230px; ">
                                        <LogLov [ObjectFieldName]="'VendorId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="VendorId"
                                                [LookUpTableName]="'Card'"
                                                [DependencyFilter1Value]="'AC,CS,AG,AL,CG,SG,SL,TR,VD,WH'"
                                                [DependencyFilter1IsList]="true"
                                                [StartSearchFromChar]="3"
                                            [StartSearchFromNumber]="6">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- VendorAddressId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'VendorAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'VendorAddressId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="VendorAddressId"
                                                [LookUpTableName]="'Address'"
                                                [DependencyFilter1Value]="VendorId">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- PaymentCurrencyId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'PaymentCurrencyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'PaymentCurrencyId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Currency'"
                                                [SelectedValue]="PaymentCurrencyId">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- PaymentCurrencyExchangeRate -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'PaymentCurrencyExchangeRate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td [style.text-align]="isRTL ? 'right' : 'left'" colspan="2">
                                        <table class="FixedTable">
                                            <tr>
                                                <td style="width: 194px">
                                                    <LogTextBox [ObjectFieldName]="'PaymentCurrencyExchangeRate'" [HideColumns]="true" [Text]="PaymentCurrencyExchangeRate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [DigitsAfterPoint]="5"></LogTextBox>
                                                </td>

                                                <td style="width: 20px;">
                                                    <div></div>
                                                </td>

                                                <td style="width: 18px;" *ngIf="IsEditExchangeRateVisible">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="UpdateCurrencyRateClicked()" [disabled]="!RateIsEnabled"></IconButton>
                                                </td>

                                                <td style="width: 5px;">
                                                    <div></div>
                                                </td>

                                                <td [style.text-align]="isRTL ? 'right' : 'left'" style="font-size:10px; color:#1B90CB;">
                                                    {{RelativeRateDate}}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- RegisterDate -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'RegisterDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogDatePicker [ObjectFieldName]="'RegisterDate'" [SelectedDateValue]="RegisterDate" [InputType]="'date'" [DataContext]="DataContext"></LogDatePicker>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- PaymentMethodId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'AccountingPaymentMethodId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'AccountingPaymentMethodId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [SelectedValue]="AccountingPaymentMethodId"
                                                [DataContext]="DataContext"
                                                [DependencyFilter2Value]="'true'"
                                                [LookUpTableName]="'AccountingPaymentMethod'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- AmountInPaymentCurrency -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'AmountInPaymentCurrency'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'AmountInPaymentCurrency'" [InputType]="IsNegativeAmountEnabled ? 'sigdouble':'double'"
                                                    [Text]="AmountInPaymentCurrency" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- BranchId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BranchId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'BranchId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="BranchId"
                                                [LookUpTableName]="'Branch'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!--InternalNotes-->
                                <tr class="FormFieldRow" style="height: 75px;">
                                    <td>
                                        <table>
                                            <tr style="height:5px"></tr>
                                            <tr>
                                                <td style="vertical-align:top;">
                                                    <LogLabel [ObjectFieldName]="'PrintNotes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <table>
                                            <tr style="height:10px"></tr>
                                            <tr>
                                                <td style="width:50px">
                                                    <LogTextBox [ObjectFieldName]="'PrintNotes'" [IsMultiline]="true" [InputType]="'ntext'" [Text]="PrintNotes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="false"></LogTextBox>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr style="height:5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                            </table>

                        </td>

                        <td style="width:40%">
                         <div></div>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3">
                            <div></div>
                        </td>
                    </tr>


                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'cance-AddAPPayment' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'ok-AddAPPayment' | IdGeneratorAsyncPipe | async}}" class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
