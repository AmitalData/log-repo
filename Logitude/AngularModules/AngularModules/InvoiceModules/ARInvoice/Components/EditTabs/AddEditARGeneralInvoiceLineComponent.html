
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table>
                    <tr style="height: 1px;">
                        <td style="width: 350px;">
                            <table>

                                <!-- ChargesTypeId -->
                                <tr class="FormFieldRow">
                                    <td style="width: 120px;">
                                        <LogLabel [ObjectFieldName]="'ChargesTypeId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'ChargesTypeId'"
                                                [SelectedValue]="DataContext.ChargesTypeId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'ChargesType'" [QueryFilterItems]="ChargeTypesQueryFilters">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- LocalDescription -->
                                <tr class="FormFieldRow">
                                    <td style="width: 120px;">
                                        <LogLabel [ObjectFieldName]="'LocalDescription'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'LocalDescription'" [Text]="DataContext.LocalDescription" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- VatTypeId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'VatTypeId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'VatTypeId'"
                                                [SelectedValue]="DataContext.VatTypeId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'VatType'"
                                                [HideMaintenanceIcon]="true"
                                                [HideAddLink]="true">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- VatPercentage -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'VatPercentage'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'VatPercentage'" [Text]="DataContext.VatPercentage" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- ForiegnCurrencyId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ForiegnCurrencyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'ForiegnCurrencyId'"
                                                [SelectedValue]="DataContext.ForiegnCurrencyId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Currency'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- ForiegnExchangeRate -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ForiegnExchangeRate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <table>
                                            <tr>
                                                <td style="width: 100px;">
                                                    <LogTextBox [ObjectFieldName]="'ForiegnExchangeRate'" [Text]="DataContext.ForiegnExchangeRate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true" [DigitsAfterPoint]="5"></LogTextBox>
                                                </td>

                                                <td style="width: 3px;">
                                                    <div></div>
                                                </td>

                                                <td style="width: 1px;" *ngIf="DataContext.IsEditExchangeRateVisible">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="DataContext.UpdateCurrencyRateClicked()" [IsEnabled]="DataContext.IsRateEnabled"></IconButton>
                                                </td>

                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Quantity -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Quantity'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'Quantity'" [Text]="DataContext.Quantity" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- UnitPrice -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'UnitPrice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'UnitPrice'" [Text]="DataContext.UnitPrice" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- ForiegnCurrencyAmount -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ForiegnCurrencyAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="AmountForiegnLabel"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'ForiegnCurrencyAmount'" [Text]="DataContext.ForiegnCurrencyAmount" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- LocalCurrencyAmount -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'LocalCurrencyAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="AmountLocalLabel"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'LocalCurrencyAmount'" [Text]="DataContext.LocalCurrencyAmount" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- InvoiceCurrencyAmount -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'InvoiceCurrencyAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="AmountInvoiceLabel"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'InvoiceCurrencyAmount'" [Text]="DataContext.InvoiceCurrencyAmount" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                            </table>
                        </td>

                        <td style="width: 10px;">
                            <div></div>
                        </td>

                        <td style="width: 250px;">
                            <table>
                                <tr class="FormFieldRow">
                                    <td style="vertical-align: bottom">
                                        <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow" style="height: 90px;">
                                    <td style="height: 90px;">
                                        <div style="height: 90px;">
                                            <LogTextBox [ObjectFieldName]="'Notes'" [Text]="DataContext.Notes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <!-- (Ayman: Notes fields is always open for edit) [disabled]="!DataContext.IsEditingEnabled" -->
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
