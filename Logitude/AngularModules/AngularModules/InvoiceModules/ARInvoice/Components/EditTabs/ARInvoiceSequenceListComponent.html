
<style>
    
    .noselect {
        -webkit-touch-callout: none; 
        -webkit-user-select: none; 
        -khtml-user-select: none; 
        -moz-user-select: none; 
        -ms-user-select: none; 
        user-select: none; 
                                  
    }
</style>
    <div 
         style="position: absolute; top:0px; bottom:0; left:0; right:0; margin:auto; padding: 10px; background: white;border-radius:0 5px 5px 0;">
        

            <table class="noselect">
                <tr style="height: 60px;">
                    <td>
                        <table>
                            <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;width: 100%;">
                                <td>
                                    <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                                </td>
                            </tr>
                        </table>
                        <table>
                            <tr>
                                <td style="width: 60px; padding: 10px;">

                                    <BackButton [Text]="BackBtnTitle" (click)="BackButtonClicked()"></BackButton>

                                </td>
                                <td style="width: 150px; padding: 10px; color: #1B90CB;">

                                    <span style="font-size: 20px;">

                                        {{'ARInvoice.O.InvoiceSequence' | TextCodeTranslationPipe}}

                                    </span>

                                </td>

                                  
                                <td style="padding: 10px;"></td>
                            </tr>
                        </table>
                        <table>
                            
                            <tr>
                                <td style="width: 60px; padding: 10px;">
                                    <div>
                                        <IconButton class="excel" [Name]="'Excel'" (click)="ExportToExcelClick()"></IconButton>
                                    </div>
                                </td>
                                <td style="width: 30px; padding: 10px;">
                                    {{'Accounting.General.O.Datefrom' | TextCodeTranslationPipe}}
                                </td>
                                <td style="width: 120px; padding: 10px;">
                                    <LogDatePicker [ObjectFieldName]="'FromDate'"
                                        [ObjectTableName]="ObjectTableName"
                                        [NoObjectField]="true" [ForceSubscribe]="true"
                                        [DataContext]="DataContext" [HideColumns]="true"
                                        [SelectedDateValue]="FromDate"></LogDatePicker>
                                </td>
                                <td style="width: 30px; padding: 10px;">
                                    {{'Accounting.General.O.To' | TextCodeTranslationPipe}}
                                </td>
                                <td style="width: 120px; padding: 10px;">
                                    <LogDatePicker [ObjectFieldName]="'ToDate'"
                                        [ObjectTableName]="ObjectTableName"
                                        [NoObjectField]="true" [ForceSubscribe]="true"
                                        [DataContext]="DataContext" [HideColumns]="true"
                                        [SelectedDateValue]="ToDate"></LogDatePicker>
                                </td>
                                <td style="padding: 10px;"></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 10px;">
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>






                <tr style="height: 10px;">
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>

                <tr >
                    <td colspan="5" class="CellStretch">
                        <div class="CellContent">
                         

                                <logitude-grid [dataSource]="DataSource"
                                               [ObjectTable]="ObjectTableName"
                                               [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                               [columns]="columns"
                                               [IsCustomTemplate]="true">
                                </logitude-grid>


                            
                            </div>
                    </td>
                </tr>
            </table>


      
    </div>
