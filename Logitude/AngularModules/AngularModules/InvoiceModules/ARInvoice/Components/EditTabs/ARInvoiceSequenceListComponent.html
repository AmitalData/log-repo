
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="isLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <!-- <td class="TabTitleRow" style="width:150px">
                            {{'ARInvoice.O.InvoiceSequence'| TextCodeTranslationPipe}}
                        </td> -->

                     
                    </tr>
                    <tr [style.text-align]="isRTL ? 'right' : 'left'">
                        <td  [style.bottom]="isRTL ? '10px' : '10px'"
                             [style.right]="isRTL ? '80px' : '10px'"
                             [style.left]="isRTL ? '0px' : '98%'">
                            
                            <IconButton  [IsSmall]="true"  [Name]="'excel'"  (click)="ExportToExcelClick()" ></IconButton>

                        </td>

                    </tr>

                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-grid GridWidth="100%" GridHeight="100%"
                                               [ObjectTable]="ObjectTableName"
                                               [dataSource]="DataSource"
                                               [columns]="columns"
                                               [autoLoad]="true"
                                               [QueryChangeEvent]="onQueryChangeEvent"
                                               [IsCustomTemplate]="true">
                                </logitude-grid>
                                <div>
                                </div>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
