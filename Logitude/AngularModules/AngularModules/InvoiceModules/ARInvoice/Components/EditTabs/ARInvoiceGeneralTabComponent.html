<style type="text/css">
    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }
</style>

<div class="TabHolder">
    <table>

        <tr class="TabTitleRow">
            <td>{{'General.O.General' | TextCodeTranslationPipe}}</td>
        </tr>

        <tr style="height: 1px;">
            <td>
                <div style="width: 100%; position: relative;">
                    <div #Child></div>
                </div>
            </td>
        </tr>

        <tr style="height: 1px;vertical-align:top" *ngIf="DisplayQBOSettings">
            <td>
                <table>
                    <tr class="TabTitleRow">
                        <td colspan="2">QBO</td>
                    </tr>

                    <tr>
                        <td style="width: 380px;">
                            <table>

                                <tr class="FormFieldRow">
                                    <td style="width: 140px;">
                                        <LogLabel [ObjectFieldName]="'GlobalTaxCalculation'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogLov [ObjectFieldName]="'GlobalTaxCalculation'"
                                                [SelectedValue]="GlobalTaxCalculation"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'QBOGlobalTaxCalculation'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <tr>
                                    <td></td>
                                </tr>

                            </table>

                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 1px;vertical-align:top" *ngIf="DisplaySATSettings">
            <td>
                <table>
                    <tr class="TabTitleRow">
                        <td colspan="2">SAT</td>
                    </tr>

                    <tr>
                        <td style="width: 380px;">

                            <table>

                                <tr class="FormFieldRow">
                                    <td style="width: 140px;">
                                        <LogLabel [ObjectFieldName]="'MetodoPagoCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'MetodoPagoCode'"
                                                [SelectedValue]="MetodoPagoCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'MetodoPago'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- Code -->
                                <tr class="FormFieldRow">
                                    <td style="width: 140px;">
                                        <LogLabel [ObjectFieldName]="'SATPaymentMethodCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'SATPaymentMethodCode'"
                                                [SelectedValue]="SATPaymentMethodCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'SATPaymentMethod'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- Period -->
                                <tr *ngIf="DisplaySATSettings && HaveRegimenFiscalFieldFeatureToggle && EntityPM.IsConsolidationInvoice" class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'PeriodCode'"
                                                  [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                                        </LogLabel>
                                    </td>
                                    <td>
                                        <table>
                                            <tr>
                                                <td>
                                                    <ComboBox (SelectedItemChanged)="SelectdPeriod = $event"
                                                              [SelectedItem]="SelectdPeriod" [ItemsSource]="Periods"
                                                              [Binding]="'Name'"></ComboBox>
                                                </td>
                                                <td style="width:35px;">
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td style="width: 140px;">
                                        <LogLabel [ObjectFieldName]="'RelatedInvoice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'RelatedInvoice'" [Text]="RelatedInvoice" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                        <!--<LogLov [ObjectFieldName]="'SATPaymentMethodCode'"
                    [SelectedValue]="SATPaymentMethodCode"
                    [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'SATPaymentMethod'">
            </LogLov>-->
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td style="width: 140px;">
                                        <LogLabel [ObjectFieldName]="'UsoCFDICode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'UsoCFDICode'"
                                                [SelectedValue]="UsoCFDICode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'UsoCFDI'">
                                        </LogLov>
                                    </td>
                                </tr>
                                <tr>
                                    <td></td>
                                </tr>

                            </table>

                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td>
                <div></div>
            </td>
        </tr>

    </table>
</div>
