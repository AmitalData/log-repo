<style type="text/css">
      .SectionTitle > span {
        font-size: 14px;
        user-select: text;
        -webkit-user-select: auto;
    }

    .SectionTitle td {
        font-size: 14px;
        user-select: text;
    }

    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }
</style>
<table *ngIf="IsVisible">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table>
                    <tr class="FormFieldRow">
                        <td>
                            <table>



                                <!-- PartnerTypes Filter -->
                                <tr *ngIf="isPartnerTypesFilterEnabled" class="FormFieldRow">
                                    <td style="width:120px; ">
                                        {{ 'ARInvoice.F.PartnerType' | TextCodeTranslationPipe }}
                                    </td>

                                    <td style="width:230px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                        <ComboBox [ItemsSource]="PartnerTypes"
                                                  [Binding]="'Name'"
                                                  [SelectedItem]="SelectedPartnerType"
                                                  (SelectedItemChanged)="SelectedPartnerType = $event"></ComboBox>

                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>


                                <!-- PartnerId -->
                                <tr class="FormFieldRow">
                                    <td style="width:120px; ">
                                        <LogLabel [ObjectFieldName]="'PartnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:230px; ">
                                        <LogLov *ngIf="isPartnerTypesFilterEnabled"
                                                [ObjectFieldName]="'PartnerId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="PartnerId"
                                                [LookUpTableName]="'Card'"
                                                [DependencyFilter1Value]="filterByPartnerTypeCode"
                                                [DisplayFieldsFromList]="DisplayFieldsFromList"
                                                [DisplayLocalFieldsFromList]="DisplayLocalFieldsFromList"
                                                [CustomizedWidth]="BillToLovSizeForFullAccounting">
                                        </LogLov>

                                        <LogLov *ngIf="!isPartnerTypesFilterEnabled"
                                                [ObjectFieldName]="'PartnerId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="PartnerId"
                                                [LookUpTableName]="'Card'"
                                                [DependencyFilter1Value]="'CS,AG,AC,AL,CG,SG,SL,TR,VD,WH'"
                                                [DependencyFilter1IsList]="true"
                                                [DisplayFieldsFromList]="DisplayFieldsFromList"
                                                [DisplayLocalFieldsFromList]="DisplayLocalFieldsFromList"
                                                [CustomizedWidth]="BillToLovSizeForFullAccounting">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- BillToId -->
                                <tr class="FormFieldRow">
                                    <td style="width:120px; ">
                                        <LogLabel [ObjectFieldName]="'BillToId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:230px; ">

                                        <LogLov
                                                [ObjectFieldName]="'BillToId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="BillToId"
                                                [LookUpTableName]="'Card'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- BillToAddressId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BillToAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'BillToAddressId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="BillToAddressId"
                                                [LookUpTableName]="'Address'"
                                                [DependencyFilter1Value]="BillToId">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- PaymentCurrencyId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'PaymentCurrencyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'PaymentCurrencyId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Currency'"
                                                [SelectedValue]="PaymentCurrencyId">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- PaymentCurrencyExchangeRate -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'PaymentCurrencyExchangeRate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td [style.text-align]="isRTL ? 'right' : 'left'" colspan="2">
                                        <table class="FixedTable">
                                            <tr>
                                                <td style="width: 194px">
                                                    <LogTextBox [ObjectFieldName]="'PaymentCurrencyExchangeRate'" [HideColumns]="true" [Text]="PaymentCurrencyExchangeRate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [DigitsAfterPoint]="5"></LogTextBox>
                                                </td>

                                                <td style="width: 20px;">
                                                    <div></div>
                                                </td>

                                                <td style="width: 18px;" *ngIf="IsEditExchangeRateVisible">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="UpdateCurrencyRateClicked()" [disabled]="!RateIsEnabled"></IconButton>
                                                </td>

                                                <td style="width: 5px;">
                                                    <div></div>
                                                </td>

                                                <td [style.text-align]="isRTL ? 'right' : 'left'" style="font-size:10px; color:#1B90CB;">
                                                    {{RelativeRateDate}}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- RegisterDate -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'RegisterDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogDatePicker [ObjectFieldName]="'RegisterDate'" [SelectedDateValue]="RegisterDate" [InputType]="'date'" [DataContext]="DataContext"></LogDatePicker>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- ARPaymentMethodId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'AccountingPaymentMethodId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'AccountingPaymentMethodId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [SelectedValue]="AccountingPaymentMethodId"
                                                [DataContext]="DataContext"
                                                [DependencyFilter1Value]="'true'"
                                                [LookUpTableName]="'AccountingPaymentMethod'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- AmountInPaymentCurrency -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'AmountInPaymentCurrency'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'AmountInPaymentCurrency'" [InputType]="IsNegativeAmountEnabled ? 'sigdouble':'double'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- BranchId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BranchId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'BranchId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="BranchId"
                                                [LookUpTableName]="'Branch'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!--InternalNotes-->
                                <tr class="FormFieldRow" style="height: 75px;">
                                    <td>
                                        <table>
                                            <tr style="height:5px"></tr>
                                            <tr>
                                                <td style="vertical-align:top;">
                                                    <LogLabel [ObjectFieldName]="'PrintNotes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <table>
                                            <tr style="height:10px"></tr>
                                            <tr>
                                                <td style="width:50px">
                                                    <LogTextBox [ObjectFieldName]="'PrintNotes'" [IsMultiline]="true" [InputType]="'ntext'" [Text]="PrintNotes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="false"></LogTextBox>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- BankAccountLiteId -->
                                <tr class="FormFieldRow" *ngIf="!accountingActivated">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BankAccountLiteId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'BankAccountLiteId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="BankAccountLiteId"
                                                [LookUpTableName]="'BankAccountLite'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>


                                <tr style="height:5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                            </table>

                        </td>
                        <td style="width:40%">
                            <table>

                                <!-- MetodoPagoCode -->
                                <tr style="height:22px;" *ngIf="DisplaySATSettings">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'MetodoPagoCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'MetodoPagoCode'"
                                                [SelectedValue]="MetodoPagoCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'MetodoPago'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>


                                <!-- SATPaymentMethodCode -->
                                <tr style="height:22px;" *ngIf="DisplaySATSettings">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'SATPaymentMethodCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'SATPaymentMethodCode'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [SelectedValue]="SATPaymentMethodCode"
                                                [LookUpTableName]="'SATPaymentMethod'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>


                                <!-- TipoCadenaPago -->
                                <tr style="height:22px;" *ngIf="DisplaySATSettings">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'TipoCadenaPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <div style="width: calc(100% - 36px); float: left;">
                                            <ComboBox [ItemsSource]="TipoCadenaPagoList" [Binding]="'Name'" [SelectedItem]="SelectedTipoCadenaPago" (SelectedItemChanged)="SelectedTipoCadenaPago = $event"></ComboBox>
                                        </div>
                                        <HelpIcon style="float: left; padding-right: 10px;" [HideHeader]="true" [Text]="'ARPayment.TipoCadenaPagoHelpText' | TextCodeTranslationPipe" [IconSize]="14"></HelpIcon>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>



                                <!-- CadPago -->
                                <tr style="height:22px;" *ngIf="DisplaySATSettings">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'CadPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'CadPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- CertPago -->
                                <tr style="height:50px;" *ngIf="DisplaySATSettings">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'CertPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox style="margin-top:5px;" [ObjectFieldName]="'CertPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <!-- SelloPago -->
                                <tr style="height:70px;" *ngIf="DisplaySATSettings">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'SelloPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox style="margin-top:5px;" [ObjectFieldName]="'SelloPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <tr style="height:22px;" *ngIf="DisplayFechaPago">
                                    <td style="width:120px; height:25px; ">
                                        <LogLabel [ObjectFieldName]="'FechaPago'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <table>
                                            <tr>
                                                <td>
                                                    <LogDatePicker [ObjectFieldName]="'FechaPago'" [SelectedDateValue]="FechaPago" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                                </td>

                                                <td>
                                                    <div></div>
                                                </td>

                                                <td>
                                                    <LogDatePicker [ObjectFieldName]="'FechaPago'" [SelectedDateValue]="FechaPago" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="false" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <tr style="height:5px;">
                                    <td colspan="7">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3">
                            <!-- Additional Fields -->
                            <div *ngIf="ShowAdditionalFieldsScreen">
                                <div class="SectionTitle">{{'ARPayment.S.NewARPayment.AdditionalFields' | TextCodeTranslationPipe}}</div>

                                <table>
                                    <tr>
                                        <td>
                                            <div>
                                                <div class="LocationDirective" #Child></div>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>


                        </td>
                    </tr>

                    <tr>
                        <td colspan="3">
                            <div></div>
                        </td>
                    </tr>


                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'cance-AddARPayment' | IdGeneratorPipe}}" class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'ok-AddARPayment' | IdGeneratorPipe}}" class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
