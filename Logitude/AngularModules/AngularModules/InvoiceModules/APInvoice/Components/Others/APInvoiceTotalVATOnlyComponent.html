
<table>

    <!-- [SingleLine]="true" -->
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <div class="MultiLinesText NoDataTextStyle" style="text-align: left;">
                Enabling will allow inserting VAT totals directly without calculating VAT from the invoice lines.
            </div>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 16px;">
                        <LogCheckBox [ObjectFieldName]="'TotalVATOnly'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Checked]="DataContext.TotalVATOnly" [HideColumns]="true"></LogCheckBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td>
                        VAT Totals Only
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <IconButton [Name]="'Add'" [IsSmall]="true" (click)="DataContext.AddTotalVATItemClicked()" [disabled]="!IsEditingVATEnabled"></IconButton>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 2px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill" style="overflow-x: hidden;">
                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="DataContext.TotalVATsList" [Disabled]="!IsEditingVATEnabled" [UseVirtuallization]="DataContext.IsUsingVirtuallization">

                    <!-- VAT Type -->
                    <log-column [header]="'VAT Type'" [width]="'200'" [Alignment]="'left'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                    <span>{{item.VatTypeName}}</span>
                                </div>

                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogLov [FocusOnMe]="'true'"
                                            [DataContext]="item"
                                            [ObjectTableName]="item.ObjectTableName"
                                            [ObjectFieldName]="'VatTypeId'"
                                            [SelectedValue]="item.VatTypeId"
                                            [LookUpTableName]="'VatType'"
                                            (SelectedItemChanged)="item.VatTypeList = $event"
                                            [HideColumns]="true"
                                            [DependencyFilter1Value]="false">
                                    </LogLov>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!-- Percentage -->
                    <log-column [header]="'Percentage'" [width]="'100'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="!item.IsMultiPercentage">

                                <div class="MediaFill" *ngIf="logcelltemplate.IsDisplayMode">
                                    <table>
                                        <tr>
                                            <td>
                                                <div *ngIf="!item.IsMultiPercentage" class="MediaFill TextTrimming" [ngStyle]="{color: item.VatTypeCellColor}" style="text-align: right;">
                                                    {{item.VatPercent | NumbersPipe:'N3'}}
                                                </div>

                                                <div *ngIf="item.IsMultiPercentage" style="line-height: 25px; padding-left: 4px;">
                                                    Multi
                                                </div>
                                            </td>

                                            <td style="width: 20px; padding-left: 2px;" *ngIf="item.IsMultiPercentage">
                                                <CellTooltip [IconPath]="'./Images/CellIcons/Info_Gray.png'" [Head]="item.VatTypeName">
                                                    <table>
                                                        <tr style="height: 20px; border-bottom: 1px solid #D1D1D1;" *ngFor="let itemGroup of item.VatTypesGroups">
                                                            <td>
                                                                <div class="MediaFill TextTrimming Label">
                                                                    {{itemGroup.SingleVATTypeName}}
                                                                </div>
                                                            </td>
                                                        </tr>

                                                        <tr>
                                                            <td>
                                                                <div></div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </CellTooltip>
                                            </td>
                                        </tr>
                                    </table>
                                </div>


                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'VatPercent'" [DataContext]="item" [Text]="item.VatPercent" [ObjectTableName]="item.ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!-- Amount -->
                    <log-column [header]="'Amount'" [width]="'100'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="TextTrimming" style="width: 100%; text-align: right;" *ngIf="logcelltemplate.IsDisplayMode">
                                    {{item.InvoiceCurrencyVATAmount | NumbersPipe:'N2'}}
                                </div>

                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'InvoiceCurrencyVATAmount'" [DataContext]="item" [Text]="item.InvoiceCurrencyVATAmount" [ObjectTableName]="item.ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!-- Buttons -->
                    <log-column [width]="'30'" [Alignment]="'left'">
                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true">
                                <IconButton [Name]="'Delete'" [IsSmall]="true" style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="RemoveLine(item)"></IconButton>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                </logitude-edit-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="!IsEditingEnabled">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
