
<table>

    <tr style="height:10px">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:1px">
        <td>
            <table>

                <tr class="FormFieldRow" *ngIf="ShowRadioButtons">
                    <td style="width:150px">
                        <LogLabel [ObjectFieldName]="'Potential'" [ObjectTableName]="'CustomerAdditionalService'" [DataContext]="DataContext" [Text]="'Potential / In Use'"></LogLabel>
                    </td>

                    <td style="width:200px">
                        <table>
                            <tr>
                                <td style="width:70px">
                                    <RadioButton [Name]="CustomerAdditionalServiceRadio" [IsChecked]="Potential" (Checked)="Potential=$event" [Text]="'Potential'"></RadioButton>
                                </td>

                                <td style="width:10px">
                                    <div></div>
                                </td>

                                <td>
                                    <RadioButton [Name]="CustomerAdditionalServiceRadio" [IsChecked]="InUse" (Checked)="InUse=$event" [Text]="'In Use'"></RadioButton>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>


                <tr style="height:150px">
                    <td style="width:150px; vertical-align: top; padding-top: 5px;">
                        <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="'CustomerAdditionalService'" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:200px">
                        <div style="height:100%;width:100%">
                            <LogTextBox [ObjectFieldName]="'Notes'" [ObjectTableName]="'CustomerAdditionalService'" [IsMultiline]="true" [InputType]="'ntext'" [DataContext]="DataContext" [HideColumns]="true" style="height:100%;width:100%"></LogTextBox>
                        </div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
