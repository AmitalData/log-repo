<div class="TabHolder" style="overflow-x:auto">
    <table>
        <tr>
            <td>
                <table>
                    <tr>
                        <!-- General -->
                        <td style="width:300px; min-width: 300px;">
                            <table>
                                <tr class="TabTitleRow">
                                    <td>{{'Customer.TH.Tariffs' | TextCodeTranslationPipe}}</td>
                                </tr>

                                <tr>
                                    <td>
                                        <table>

                                            <!-- Import -->
                                            <tr class="FormFieldRow">
                                                <td style="width:180px;">
                                                    <LogLabel [ObjectFieldName]="'ImportLocalCustomerGroupId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width:200px;">
                                                    <LogLov [ObjectFieldName]="'ImportLocalCustomerGroupId'"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'CustomerGroup'"
                                                            [HideColumns]="true">
                                                    </LogLov>

                                                </td>
                                                <td><div></div></td>
                                            </tr>
                                            <!-- Export -->
                                            <tr class="FormFieldRow">
                                                <td>
                                                    <LogLabel [ObjectFieldName]="'ExportLocalCustomerGroupId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td>
                                                    <LogLov [ObjectFieldName]="'ExportLocalCustomerGroupId'"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'CustomerGroup'"
                                                            [HideColumns]="true">
                                                    </LogLov>

                                                </td>
                                                <td><div></div></td>
                                            </tr>

                                            <tr>
                                                <td colspan="3">
                                                    <div></div>
                                                </td>
                                            </tr>

                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                </table>
            </td>
        </tr>

    </table>
</div>
