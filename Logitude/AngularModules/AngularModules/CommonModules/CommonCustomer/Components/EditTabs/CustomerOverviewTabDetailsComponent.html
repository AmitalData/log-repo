

<style type="text/css">
    .RatioBox .NumericButtonDisabled {
        opacity: 0.5;
        pointer-events: none;
    }

    .RatioBox .NumericButton:hover {
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
    }

    .RatioBox .NumericButton {
        width: 15px;
        height: 10px;
        border: 1px solid #6A8299;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        position: relative;
    }

    .RatioBoxDisabled {
        opacity: 0.5;
        pointer-events: none;
    }

    .RatioBox {
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        line-height: 21px;
        width: 70px;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        overflow: hidden;
    }

    .amcharts-pie-slice {
        cursor: default;
    }
</style>

<table style="z-index:3; position:absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; background-color:white">

    <tr style="height:5px">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:30px">
        <td>
            <table>
                <tr>
                    <td style="width:60px">
                        <BackButton [Text]="'Back'" (click)="BackButtonClicked()"></BackButton>
                    </td>

                    <td>
                        <label style="font-size:medium;color:#1B90CB;padding-left:7px">{{Customer.EnglishName}} </label>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:50px">
        <td>
            <table>
                <tr>

                    <td style="width:120px">
                        <ComboBox (SelectedItemChanged)="SelectedDateTypeItem = $event" [ItemsSource]="DateTypeFilterList" [SelectedItem]="SelectedDateTypeItem" [Binding]="'Title'"></ComboBox>
                    </td>

                    <td style="width:3px">
                        <div></div>
                    </td>

                    <td style="width:120px">
                        <ComboBox (SelectedItemChanged)="SelectedTimeRangeItem = $event" [ItemsSource]="TimeRangeFilterList" [SelectedItem]="SelectedTimeRangeItem" [Binding]="'Title'"></ComboBox>
                    </td>

                    <td style="width:3px">
                        <div></div>
                    </td>

                    <td style="width:120px">
                        <LogDatePicker [NoObjectField]="true" [SelectedDateValue]="ActivityToDate" [HideColumns]="true" [ObjectFieldName]="'ActivityToDate'" [ObjectTableName]="'Shipment'" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td style="width:3px">
                        <div></div>
                    </td>

                    <td style="width:120px">
                        <LogDatePicker [NoObjectField]="true" [SelectedDateValue]="ActivityFromDate" [HideColumns]="true" [ObjectFieldName]="'ActivityFromDate'" [ObjectTableName]="'Shipment'" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td style="width:150px">
                        <div></div>
                    </td>

                    <td style="width:1px">Show:</td>

                    <td style="width:130px">
                        <ComboBox (SelectedItemChanged)="SelectedShowItem = $event" [ItemsSource]="ShowFilterList" [SelectedItem]="SelectedShowItem" [Binding]="'Title'"></ComboBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td colspan="3">
                        <table>
                            <tr class="SectionHeader" style="height:27px">
                                <td>
                                    <table>
                                        <tr>
                                            <td>
                                                <label>Shipments Quanitity By Time</label>
                                            </td>

                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr style="height:10px">
                                <td></td>
                            </tr>
                            <tr style="height:20px">
                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:120px">
                                                <TransportsFilter (SelectedValueChanged)="SelectedTransportFilterShipment = $event"></TransportsFilter>
                                            </td>
                                            <td>
                                                <div style="width:3px"></div>
                                            </td>
                                            <td>

                                                <DirectionsFilter (SelectedValueChanged)="SelectedDirectionFilterShipment = $event"></DirectionsFilter>


                                            </td>
                                        </tr>

                                    </table>

                                </td>

                            </tr>
                            <tr style="height:20px">
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <div [attr.id]="ShipmentQuantityByTimeOverViewId" class="CellContent"></div>
                                    <div *ngIf="NoShipmentsQuantityByTime" style="text-align:center;vertical-align:central;width:100%;overflow-y:hidden">
                                        <label style="font-size:large;text-align:center;vertical-align:central;width:100%;height:100%">No Shipments</label>
                                    </div>
                                </td>
                            </tr>
                            <tr style="height:10px">
                                <td></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <table>
                            <tr class="SectionHeader" style="height:27px">
                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:80px">
                                                <label>Countries</label>


                                            </td>
                                            <td style="padding-bottom:4px;font:small;vertical-align:central">
                                                <label style="font-size:x-small">The data viewed doesn't include drop and domestic/inland shipments </label>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr style="height:10px">
                                <td></td>
                            </tr>
                            <tr style="height:20px">
                                <td style="vertical-align:top">
                                    <table style="height:1px">
                                        <tr>
                                            <td style="width:140px;min-width:120px">
                                                <TransportsFilter (SelectedValueChanged)="SelectedTransportFilterCountries = $event"></TransportsFilter>
                                            </td>

                                            <td style="width:260px;min-width:140px">

                                                <DirectionsFilter (SelectedValueChanged)="SelectedDirectionFilterCountries = $event"></DirectionsFilter>


                                            </td>
                                            <td style="width:auto">
                                                <table>
                                                    <tr>
                                                        <td style="width:35px">
                                                            <label style="font-size:small">Top: </label>

                                                        </td>
                                                        <td>
                                                            <div class="RatioBox">
                                                                <table>
                                                                    <tr>

                                                                        <td style="font-size: 11px; padding-left: 2px;">
                                                                            {{TopCountries}}
                                                                        </td>

                                                                        <td style="width: 15px;">
                                                                            <div class="NumericButton" (mousedown)="CountriesTopValueChanged(true)">
                                                                                <img class="CenterCenter" style="height: 3px; width: 5px;" src="./Images/Buttons/Up.png" />
                                                                            </div>
                                                                            <div class="NumericButton" (mousedown)="CountriesTopValueChanged(false)">
                                                                                <img class="CenterCenter" style="height: 3px; width: 5px;" src="./Images/Buttons/Down.png" />
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>


                                            </td>

                                            <td style="width:200px;min-width:10px"></td>

                                            <td style="width:20px;min-width:20px">

                                                <LogCheckBox [ObjectFieldName]="'IncludeOthersCountries'" [DataContext]="DataContext"></LogCheckBox>


                                            </td>
                                            <td>
                                                <label style="font-size:x-small">Include Others</label>

                                            </td>

                                            <td></td>
                                        </tr>

                                    </table>

                                </td>

                            </tr>
                            <tr style="height:5px">
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <table>
                                        <tr style="height:1px">
                                            <td>
                                                <div [attr.id]="CountriesOverviewId" style="height:100%;width:100%" class="CellContent"></div>
                                            </td>
                                            <td style="width:200px;min-width:100px;overflow-y:auto;padding-right:10px">
                                                <div class="MediaFill">
                                                    <ScrollViewer [Small]="true">
                                                        <div [attr.id]="CountriesDashboardLegendId" style="position:relative;width:100%;float:left"></div>
                                                    </ScrollViewer>
                                                </div>
                                            </td>

                                        </tr>
                                        <tr *ngIf="NoCountries">
                                            <td colspan="2">
                                                <div style="text-align:center;vertical-align:central;width:100%;overflow-y:hidden">
                                                    <label style="font-size:large;text-align:center;vertical-align:central;width:100%;height:100%">No Countries</label>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width:10px;max-width:10px;min-width:10px"></td>

                    <td style="width:50%">
                        <table>
                            <tr class="SectionHeader" style="height:27px">
                                <td>
                                    <table>
                                        <tr>
                                            <td>
                                                <label>Direction And Transport Mode</label>
                                            </td>
                                            <td></td>



                                        </tr>
                                    </table>
                                </td>

                            </tr>
                            <tr style="height:10px">
                                <td></td>
                            </tr>

                            <tr>

                                <td>
                                    <table>
                                        <tr style="height:1px">
                                            <td>
                                                <div [attr.id]="DirectionAndTransportModeOverViewId" style="height:100%;width:100%" class="CellContent"></div>
                                            </td>
                                            <td style="width:200px;min-width:100px;overflow-y:auto;padding-right:10px">
                                                <div class="MediaFill">
                                                    <ScrollViewer [Small]="true">
                                                        <div [attr.id]="DirectionAndtransportModeLegendId" style="position:relative;width:100%;float:left"></div>
                                                    </ScrollViewer>
                                                </div>
                                            </td>

                                        </tr>
                                        <tr *ngIf="NoDirectionAndTransportMode">
                                            <td colspan="2">
                                                <div style="text-align:center;vertical-align:central;width:100%;overflow-y:hidden">
                                                    <label style="font-size:large;text-align:center;vertical-align:central;width:100%;height:100%">No Shipments</label>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:10px;">
        <td>
            <div></div>
        </td>
    </tr>
</table>
