
<table>
    <tr>
        <td>
            <div class="MediaFill">
                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ItemsSource">

                    <log-column [width]="'150'" [header]="'Product Type'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="true">
                                {{item.ProductTypeName}}
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <log-column [width]="'200'" [header]="'Mediator'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="true">
                                <div *ngIf="IsDisabled || logcelltemplate.IsDisplayMode" style="width: 100%; text-align: left;" class="TextTrimming">
                                    {{item.PartnerName}}
                                </div>

                                <div *ngIf="!IsDisabled && logcelltemplate.IsEditMode">
                                    <LogLov *ngIf="item.LOVIsVisible"
                                            [FocusOnMe]="true"
                                            [ObjectFieldName]="'PartnerId'"
                                            [DisplayMemberPath]="'EnglishName'"
                                            [DataContext]="item"
                                            [HideColumns]="true"
                                            (SelectedItemChanged)="item.Partner = $event"
                                            [LookUpTableName]="'Card'"
                                            [ObjectTableName]="'CustomerMediatorByProduct'">
                                    </LogLov>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                </logitude-edit-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CencelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button [disabled]="IsDisabled" class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
