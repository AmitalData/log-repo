
<div class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td>{{'Customer.TH.ProductItems' | TextCodeTranslationPipe}}</td>

                        <td style="width: 21px">
                            <IconButton [Name]="'Add'" [IsEnabled]="IsEditingEnabled" (click)="AddProductItem()"></IconButton>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td>
                <div class="MediaFill">
                    <div class="SimpleGridView">
                        <div class="MediaFill" style="overflow-x: hidden;">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ProductItems" [Disabled]="!IsEditingEnabled">

                                <!-- SKU -->
                                <log-column [header]="'SKU'" [width]="'150'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div class="TextTrimming">
                                                <span>{{item.SKU}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Name -->
                                <log-column [header]="'Name'" [width]="'150'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div class="TextTrimming">
                                                <span>{{item.Name}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Brand -->
                                <log-column [header]="'Brand'" [width]="'150'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div class="TextTrimming">
                                                <span>{{item.Brand}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Description -->
                                <log-column [header]="'Description'" [width]="'200'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div class="TextTrimming">
                                                <span>{{item.Description}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Inactive -->
                                <log-column [header]="'Inactive'" [width]="'80'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div style="height: 100%; width: 100%; position:relative;">
                                                <div class="CenterCenter" style="width: 16px;">
                                                    <img *ngIf="item.InActive" class="CenterCenter" src="./Images/GreenTick.png" />
                                                </div>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Buttons -->
                                <log-column [width]="'50'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template [IgnoreMods]="true">
                                            <div style="width: 100%; height: 100%; position: relative;">
                                                <div class="LeftCenter" style="height: 20px;">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditLineClicked(item)"></IconButton>
                                                </div>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>
                            </logitude-edit-grid>
                        </div>
                    </div>
                </div>
            </td>
        </tr>

    </table>
</div>
