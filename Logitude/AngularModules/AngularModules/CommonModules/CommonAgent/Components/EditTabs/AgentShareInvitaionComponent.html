



<style type="text/css">
    .PartnerTemplateRow, .PartnerTemplateRow td, .PartnerTemplateRow td div, .PartnerTemplateRow td span {
        color: #6E7172;
        font-size: 10px;
        height: 15px;
        line-height: 15px;
        white-space: nowrap;
        text-align: left;
    }

    .Template {
        width: 100%;
        height: 100%;
        border-radius: 4px;
        position: relative;
        background-color: white;
        border: 1px solid #AAAAAA;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .GreenAddButtonDisabled {
        pointer-events: none;
    }

    .GreenAddButton:hover {
        background: url('./Images/Buttons/AddGreenSolid.png') center center;
        background-size: contain;
    }

    .GreenAddButton {
        width: 12px;
        height: 12px;
        display: inline-block;
        background: url('./Images/Buttons/AddGreenBrush.png') center center;
        background-size: contain;
        cursor: pointer;
    }
</style>



<!--<div style="vertical-align:top">
    <ScrollViewer>-->

<table>
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td style="padding: 3px;" colspan="3">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table style="margin-left:10px;margin-right:5px">

                

                <!--<tr style="height:20px">
                    <td colspan="3"></td>
                </tr>-->

                <!--Header  Area-->
                <tr style="height:30px" *ngIf="!InvitationSent">
                    <td style="vertical-align:top" colspan="3">
                      <div>
                          Please enter email for invitation sending
                      </div>
                        
                    </td>
                </tr>
                <tr style="height:0px">
                    <td colspan="3"></td>
                </tr>

              
                <tr style="height:35px" *ngIf="!InvitationSent">
                    <td style="width: 60px;">
                        <span>Email </span>
                    </td>

                    <td style="width: 200px;">
                        <input type="text" [(ngModel)]="Email"/>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
                <tr  *ngIf="InvitationSent">
                    <td>
                        <div></div>
                    </td>
                      <td>
                        <div>
                            Invitation email sent successfully 
                        </div>
                    </td>
                   
                    <td style="color:#282E30;font-size:12px;width:185px;height:10px;">
                        <img class="LeftCenter" src="./Images/GreenTick.png" />
                    </td>
                </tr>
                <tr>
                    <td colspan="3"></td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div></div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>


                    <td style="width: 57px;">
                        <button class="Button" (click)="OnCancel()">{{CancelButtonLabel}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>


                    <td style="width: 57px;" *ngIf="!InvitationSent">
                        <button class="RedButton" (click)="OnSendInvitaion()">Send</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</div>-->
