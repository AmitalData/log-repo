<input type="file" (change)="onFileSelected($event)" accept="application/pdf" />

<LogLov style="height: 50px; display: block;"
    [ObjectFieldName]="'DocumentTypeId'"
    [ObjectTableName]="'DocumentsFiling'"
    [DataContext]="dataContext"
    [LookUpTableName]="'DocumentType'"
    [HideColumns]="true"
    >
</LogLov>

<select [(ngModel)]="directionCode">
    <option *ngFor="let item of directionCodes" [value]="item.id">{{item.name}}</option>
</select>

<ng-container *ngIf="dataUrl">
    <pdf-viewer [src]="dataUrl" [render-text]="true"></pdf-viewer>
</ng-container>

<log-close-save-buttons (close)='close($event)'></log-close-save-buttons>
