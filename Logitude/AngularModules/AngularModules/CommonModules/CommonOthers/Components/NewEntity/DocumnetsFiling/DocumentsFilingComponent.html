<div *ngIf='dataReady && tableDataInit' class="view-container" [ngClass]="{'edit-component': isEditComponent}">
    <div class="data-container">
        <div class="data">
            <div class="data-row">
                <label>{{'Customs.CustomsDocument.F.DocumentTypeCode' | TextCodeTranslationPipe}}</label>
                <LogLov class="data-value" [ObjectFieldName]="'DocumentTypeId'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="documentsFilingPM" [LookUpTableName]="'DocumentType'" [HideColumns]="true"
                    (ValueChanged)="documentTypeChanged(false)" [QueryFilterItems]="documentTypeFilter">
                </LogLov>
            </div>
            <div class="data-row">
                <label>{{'Customs.DeficitFileFilterQuery.F.EntityTypeName' | TextCodeTranslationPipe}}</label>
                <LogLov class="data-value" [ObjectFieldName]="'ObjectTableId'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="documentsFilingPM" [LookUpTableName]="'ObjectTable'" [HideColumns]="true"
                    [QueryFilterItems]="objectTablesFilter" [DisplayMemberPath]="'FullNameTextCodeDefaultText'">
                </LogLov>
            </div>
            <div class="data-row">
                <label>Id</label>
                <LogTextBox class="data-value" [ObjectFieldName]="'EntityId'" [DataContext]="documentsFilingPM">
                </LogTextBox>
            </div>
            <div class="data-row">
                <label>{{'Accounting.O.Customer' | TextCodeTranslationPipe}}</label>
                <LogLov class="data-value" [ObjectFieldName]="'ReceivedByByContactId'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="documentsFilingPM" [LookUpTableName]="'Contact'"
                    [HideColumns]="true">
                </LogLov>
            </div>
            <div class="data-row">
                <label>{{'Customs.Declaration.O.Description' | TextCodeTranslationPipe}}</label>
                <LogTextBox class="data-value" [ObjectFieldName]="'Description'" [DataContext]="documentsFilingPM">
                </LogTextBox>
            </div>
            <div class="data-row">
                <label>{{'Customs.Declaration.O.CustomsDocumentRemarks' | TextCodeTranslationPipe}}</label>
                <LogTextBox class="data-value data-value-notes" [HideColumns]="true" [HideLastColumn]="true"
                    [ObjectFieldName]="'Notes'" [IsMultiline]="true" [DataContext]="documentsFilingPM"></LogTextBox>
            </div>
        </div>

        <div class="meta-data-container" *ngIf="documentTypeMetaDataList?.length > 0">
            <h3 class="meta-data-header">{{'Customs.Declaration.O.DocumentMetaData' | TextCodeTranslationPipe}}</h3>
            <div class="meta-data-body">
                <div class="meta-data-row" *ngFor="let item of $any(documentsFilingPM.DocumentsFilingMetaDataValues)">
                    <label>{{item.DocumentsMetaDataTypeEnglishName}}</label>

                    <div [ngSwitch]="item.DocumentsMetaDataTypeFormat?.toLowerCase()" class="mata-data-value">
                        <BooleanFilter *ngSwitchCase="'boolean'" [SelectedValue]="item.MetaDataValue"
                            (SelectedTypeValueChanged)="item.MetaDataValue = $event;metadataChanged()">
                        </BooleanFilter>
                        <LogTextBox *ngSwitchCase="'string'" [ObjectFieldName]="'MetaDataValue'" [DataContext]="item"
                            [ObjectTableName]="'DocumentsFilingMetaDataValue'" (ValueChanged)="metadataChanged()">
                        </LogTextBox>
                        <LogDatePicker [ForceSubscribe]="true" *ngSwitchCase="'datetime'"
                            [ObjectFieldName]="'MetaDataValue'" [DataContext]="item"
                            [ObjectTableName]="'DocumentsFilingMetaDataValue'" (ValueChanged)="metadataChanged()">
                        </LogDatePicker>
                        <LogTextBox *ngSwitchCase="'integer'" [ObjectFieldName]="'MetaDataValue'" [DataContext]="item"
                            [ObjectTableName]="'DocumentsFilingMetaDataValue'" [InputType]="'integer'"
                            (ValueChanged)="metadataChanged()"></LogTextBox>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <app-drag-drop-file-input [input]="fileData" (base64FileSelected)="base64File = $event"
        (fileCleared)="onFileCleared()" (filesSelected)="onFileSelected($event)" [displayOnly]="!isNew"
        [width]="inputFileWidth" [height]="inputFileHeight" [allowedExtensions]="allowedExtensions"
        (fileRotate)="rotationAngle = $event">
    </app-drag-drop-file-input>
</div>

<ValidationSummary *ngIf="errors.length > 0" [ItemsSource]="errors" [SingleLine]="false"></ValidationSummary>

<log-close-save-buttons *ngIf="!isEditComponent" (close)='close($event)'></log-close-save-buttons>
