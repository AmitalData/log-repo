
<style type="text/css">
    .LinkBtn {
        text-decoration: underline;
        float: left;
        color: blue;
        font-size: 11px;
        text-indent: 3px;
    }

        .LinkBtn:hover {
            text-decoration: underline;
            float: left;
            color: lightskyblue;
            font-size: 11px;
            cursor: pointer;
        }

    .GroupItem {
        min-width: 70px;
        min-height: 65px;
        /*border-left: 1px solid gray;
        padding-left: 5px;*/
        /*padding-right: 5px;
        border-right: 1px solid gray;*/
        margin: 5px;
        display: inline-block;
    }

    .FilterItem {
        min-width: 55px;
        min-height: 20px;
        margin: 5px;
        /*height:1px;*/
    }

    .Filters {
        /*display: inline-block;*/
        display: table-cell;
        border-left: 1px solid gray;
    }

    .Operator {
        min-width: 55px;
        min-height: 20px;
        margin: 5px;
        display: inline-block;
        /*display: table-cell;
        vertical-align: middle;*/
    }

    .OperatorItem {
        min-width: 55px;
        min-height: 65px;
        margin: 5px;
        display: inline-block;
    }

    .GroupInnerItem {
        min-width: 55px;
        min-height: 65px;
        /*border-right: 1px solid gray;
        padding-right: 5px;*/
        display: inline-block;
    }

    .GroupItemSeperator {
        width: 55px;
        border-right: 1px solid gray;
        height: 100%;
        position: absolute;
        top: 0px;
        bottom: 0px;
        margin-left: 5px;
        display: inline-block;
    }

    .MyFilterItem {
        /*height:30px;*/
    }

        .MyFilterItem:hover .DeleteButton {
            display: block;
        }

    .DeleteButton {
        display: none;
    }
   
</style>

<div *ngFor="let item of SelectedFiltersDataSource; let i=index;">
    <div *ngIf="item.IsGroup == false" style="width:650px;">
        <div>
            <table style="height:30px;">
                <tr style="height:30px;" class="MyFilterItem">
                    <td style="width: 16px;">
                        <img class="DeleteButton" src="./Images/Trash-can.png" style="cursor: pointer;" (click)="onDeleteFilterClick(item)" />
                    </td>
                    <td style="width:170px;">
                        <ComboBox style="width:170px;display:table-cell;" [ItemsSource]="item.MyParentClass.AllFieldsWithChildrenDataSource" [SelectedItem]="item" [Binding]="'DisplayName'" (SelectedItemChanged)="item.FieldValueChanged($event)"></ComboBox>
                    </td>
                    <td style="width:7px;">
                        <div style="width:7px;"></div>
                    </td>
                    <td style="width:105px;">


                        <ComboBox style="width:105px;" (SelectedItemChanged)="item.FilterTypeChanged($event)" [ItemsSource]="item.FilterTypes" [SelectedItem]="item.FilterTypeSelected" [Binding]="'Name'"></ComboBox>
                    </td>
                    <td style="width:7px;">
                        <div style="width:7px;"></div>
                    </td>
                    <td style="width:100px;">
                        <ComboBox style="width:100px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>
                    </td>
                    <!--<td *ngIf="item.FilterType == 'Ask User'" style="width:7px;">
                        <div style="width:7px;"></div>
                    </td>-->
                    <!--<td *ngIf="item.FilterType == 'Ask User'" style="width:310px;">
                        <span class="LinkBtn" (click)="item.OpenFilterSettings()">Settings</span>
                    </td>-->
                    <td style="width:7px;">
                        <div style="width:7px;"></div>
                    </td>


                    <td *ngIf="item.FilterType == 'Fixed Filter' || (item.FilterType == 'Ask User' && item.IsSetDefaults == true)" [ngSwitch]="item.ParentDataTypeCode" >
                        <!---->
                        <!-- Text -->
                        <div *ngSwitchCase="'Text'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                            <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:157px;">
                                <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Text'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                            </div>
                        </div>

                        <!-- nText -->
                        <div *ngSwitchCase="'nText'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                            <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:157px;">
                                <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'nText'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                            </div>
                        </div>

                        <!-- Integer -->
                        <div *ngSwitchCase="'Integer'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                            <div style="width:157px;">
                                <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Integer'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                            </div>
                        </div>

                        <!-- Double -->
                        <div *ngSwitchCase="'Double'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                            <div style="width:157px;">
                                <LogTextBox [ObjectFieldName]="'TextValue'" [DataContext]="item" [InputType]="'Double'" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                            </div>
                        </div>

                        <!-- Decimal -->
                        <div *ngSwitchCase="'Decimal'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                            <div style="width:157px;">
                                <LogTextBox [ObjectFieldName]="'TextValue'" [DataContext]="item" [InputType]="'Decimal'" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                            </div>
                        </div>

                        <!-- Boolean -->
                        <div *ngSwitchCase="'Boolean'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                            <div style="width:157px;">
                                <!--<LogCheckBox (ValueChanged)="item.onTextChange($event)" [ObjectFieldName]="'TextValue'" [DataContext]="item"></LogCheckBox>-->
                                <ComboBox *ngIf="BooleanValues" (SelectedItemChanged)="item.onTextChange($event)" [ItemsSource]="BooleanValues" [SelectedItem]="item.BoolValue"></ComboBox>
                            </div>
                        </div>

                        <!-- Lookup -->
                        <div *ngSwitchCase="'LookUp'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" (SelectedItemChanged)="item.OperationValueChanged($event)" [Binding]="'Name'"></ComboBox>-->
                            <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:175px;">
                                <DWLov *ngIf="item.ParentDimTabelName && item.Name"
                                       [SelectedValue]="item.TextValue"
                                       [ObjectFieldName]="item.Code"
                                       [DataContext]="item"
                                       (ValueChanged)="item.onTextChange($event)"
                                       [Operation]="item.Operation.Code"
                                       [ObjectTableName]="item.ParentDimTabelName"
                                       [LOVAdditionalColumns]="item.LOVAdditionalColumns"
                                       [IsFreeText]="true">
                                </DWLov>
                            </div>
                        </div>

                        <!--Date-->


                        <div *ngSwitchCase="'Date'">

                            <div style="width:175px;">

                                <DWDate [ObjectFieldName]="item.Code"
                                        [DataContext]="item"
                                        [Operation]="item.Operation.Code"
                                        [SelectedValue]="item.TextValue"
                                        (ValueChanged)="item.onTextChange($event)">
                                </DWDate>

                            </div>
                        </div>


                        <div *ngSwitchCase="'DateTime'">

                            <div style="width:175px;">

                                <DWDate [ObjectFieldName]="item.Code"
                                        [DataContext]="item"
                                        [Operation]="item.Operation.Code"
                                        [SelectedValue]="item.TextValue"
                                        (ValueChanged)="item.onTextChange($event)">
                                </DWDate>

                            </div>
                        </div>

                     

                        <div *ngSwitchCase="'Dimension'">
                            <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" (SelectedItemChanged)="item.OperationValueChanged($event)" [Binding]="'Name'"></ComboBox>-->
                            <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:157px;">
                                <DWLov *ngIf="item.ParentDimTabelName && item.Name"
                                       [SelectedValue]="item.TextValue"
                                       [ObjectFieldName]="item.Code"
                                       [DataContext]="item"
                                       (ValueChanged)="item.onTextChange($event)"
                                       [Operation]="item.Operation.Code"
                                       [ObjectTableName]="item.ParentDimTabelName"
                                       [LOVAdditionalColumns]="item.LOVAdditionalColumns"
                                       [IsFreeText]="true">
                                </DWLov>
                            </div>
                        </div>
                    </td>
                    <td *ngIf="item.FilterType == 'Ask User'">
                        <!--[style.width.px]="item.FilterType == 'Ask User' && item.IsSetDefaults == true ? 50: 310"-->
                        <span class="LinkBtn" (click)="item.OpenFilterSettings()">Settings</span>
                    </td>
                </tr>
            </table>
            <!-------------------------->
            <DWQueryBuilderFilters [SelectedFiltersDataSource]="item.FilterItems" [DataContext]="item.MyParentClass"></DWQueryBuilderFilters>
            <!-------------------------------------------------------->
            <!-------------------------------------------------------->
            <div *ngIf="SelectedFiltersDataSource.length > 0 && item.IsGroup == true" style="margin-top: 10px;margin-left: 6px;">
                <table>
                    <tr>
                        <td style="width:1%;"></td>
                        <td style="width:1%;"><span class="LinkBtn" (click)="AddFilterToGroup(item)">Add Filter</span></td>
                        <td style="width:1%;"></td>
                        <td style="width:10%;"><span class="LinkBtn" (click)="AddGroup(item)">Add Group</span></td>
                        <td style="width:4%;"></td>
                        <td style="width:30%;"></td>
                    </tr>
                </table>
            </div>
        </div>

    </div>
    <div class="GroupItem" *ngIf="item.IsGroup == true" style="width:620px;">
        <div class="OperatorItem">
            <div style="display: table-cell;vertical-align: middle;">
                <div class="Operator">
                    <ComboBox *ngIf="item" (SelectedItemChanged)="item.AndOrOpsChanged($event)" [ItemsSource]="AndOrOps" [SelectedItem]="item.AndOr"></ComboBox>
                </div>
            </div>

            <div class="Filters">
                <div class="FilterItem">
                    <table style="height:30px;" *ngIf="item.IsGroup == false">
                        <tr style="height:30px;" class="MyFilterItem">
                            <td style="width: 16px;">
                                <img class="DeleteButton" src="./Images/Trash-can.png" style="cursor: pointer;" (click)="onDeleteFilterClick(item)" />
                            </td>
                            <td style="width:170px;">
                                <ComboBox style="width:170px;" [ItemsSource]="item.MyParentClass.AllFieldsWithChildrenDataSource" [SelectedItem]="item" [Binding]="'DisplayName'" (SelectedItemChanged)="item.FieldValueChanged($event)"></ComboBox>
                            </td>
                            <td style="width:7px;">
                                <div style="width:7px;"></div>
                            </td>
                            <td style="width:105px;">
                                <ComboBox style="width:105px;" (SelectedItemChanged)="item.FilterTypeChanged($event)" [ItemsSource]="Types" [SelectedItem]="item.FilterType"></ComboBox>
                            </td>
                            <td style="width:7px;">
                                <div style="width:7px;"></div>
                            </td>
                            <td style="width:100px;">
                                <ComboBox style="width:100px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>
                            </td>
                            <td style="width:7px;">
                                <div style="width:7px;"></div>
                            </td>

                            <td *ngIf="item.FilterType == 'Fixed Filter' || (item.FilterType == 'Ask User' && item.IsSetDefaults == true)" [ngSwitch]="item.ParentDataTypeCode">
                                <!--style="width:150px;"-->
                                <!-- Text -->
                                <div *ngSwitchCase="'Text'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                    <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:157px;">
                                        <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Text'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </div>

                                <!-- nText -->
                                <div *ngSwitchCase="'nText'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                    <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:157px;">
                                        <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'nText'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </div>

                                <!-- Integer -->
                                <div *ngSwitchCase="'Integer'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                    <div style="width:157px;">
                                        <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Integer'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </div>

                                <!-- Double -->
                                <div *ngSwitchCase="'Double'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                    <div style="width:157px;">
                                        <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Double'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </div>

                                <!-- Decimal -->
                                <div *ngSwitchCase="'Decimal'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                    <div style="width:157px;">
                                        <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Decimal'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </div>

                                <!-- Boolean -->
                                <div *ngSwitchCase="'Boolean'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                    <div style="width:157px;">
                                        <LogCheckBox (ValueChanged)="item.onTextChange($event)" [ObjectFieldName]="'TextValue'" [DataContext]="item"></LogCheckBox>
                                        <!--<ComboBox *ngIf="BooleanValues" (SelectedItemChanged)="item.onTextChange($event)" [ItemsSource]="BooleanValues" [SelectedItem]="item.TextValue"></ComboBox>-->
                                    </div>
                                </div>

                                <!-- Lookup -->
                                <div *ngSwitchCase="'LookUp'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" (SelectedItemChanged)="item.OperationValueChanged($event)" [Binding]="'Name'"></ComboBox>-->
                                    <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:175px;">
                                        <DWLov *ngIf="item.ParentDimTabelName && item.Name"
                                               [SelectedValue]="'TextValue'"
                                               [ObjectFieldName]="item.Code"
                                               [DataContext]="item"
                                               (ValueChanged)="item.onTextChange($event)"
                                               [Operation]="item.Operation.Code"
                                               [ObjectTableName]="item.ParentDimTabelName"
                                               [IsFreeText]="true">
                                        </DWLov>
                                    </div>
                                </div>


                                <!--Date-->
                                <div *ngSwitchCase="'Date'">

                                    <div style="width:175px;">

                                        <DWDate [ObjectFieldName]="item.Code"
                                                [DataContext]="item"
                                                [Operation]="item.Operation.Code"
                                                (ValueChanged)="item.onTextChange($event)"
                                                [SelectedValue]="item.TextValue">
                                        </DWDate>

                                    </div>
                                </div>
                                <div *ngSwitchCase="'DateTime'">

                                    <div style="width:175px;">

                                        <DWDate [ObjectFieldName]="item.Code"
                                                [DataContext]="item"
                                                [Operation]="item.Operation.Code"
                                                (ValueChanged)="item.onTextChange($event)"
                                                [SelectedValue]="item.TextValue">
                                        </DWDate>

                                    </div>
                                </div>





                                <div *ngSwitchCase="'Dimension'">
                                    <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" (SelectedItemChanged)="item.OperationValueChanged($event)" [Binding]="'Name'"></ComboBox>-->
                                    <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:157px;">
                                        <DWLov *ngIf="item.ParentDimTabelName && item.Name"
                                               [SelectedValue]="'TextValue'"
                                               [ObjectFieldName]="item.Code"
                                               [DataContext]="item"
                                               (ValueChanged)="item.onTextChange($event)"
                                               [Operation]="item.Operation.Code"
                                               [ObjectTableName]="item.ParentDimTabelName"
                                               [IsFreeText]="true">
                                        </DWLov>
                                    </div>
                                </div>
                            </td>
                            <td *ngIf="item.FilterType == 'Ask User'">
                                <!--[style.width.px]="item.FilterType == 'Ask User' && item.IsSetDefaults == true ? 50: 310"-->
                                <span class="LinkBtn" (click)="item.OpenFilterSettings()">Settings</span>
                            </td>


                        </tr>
                    </table>
                    <!-------------------------->
                    <DWQueryBuilderFilters [SelectedFiltersDataSource]="item.FilterItems" [DataContext]="item.MyParentClass"></DWQueryBuilderFilters>
                    <!-------------------------------------------------------->
                    <!-------------------------------------------------------->
                    <div *ngIf="SelectedFiltersDataSource.length > 0 && item.IsGroup == true" style="margin-top: 10px;margin-left: 6px;">
                        <table>
                            <tr>
                                <td style="width:1%;"></td>
                                <td style="width:1%;"><span id="{{'AddFilters' | IdGeneratorAsyncPipe | async}}" class="LinkBtn" (click)="AddFilterToGroup(item)">Add Filter</span></td>
                                <td style="width:1%;"></td>
                                <td style="width:10%;"><span id="{{'AddGroupFilters' | IdGeneratorAsyncPipe | async}}" class="LinkBtn" (click)="AddGroup(item)">Add Group</span></td>
                                <td style="width:4%;"></td>
                                <td style="width:30%;"></td>
                            </tr>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>
