<div [style.width]="width + 'px'" [style.height]="height + 'px'">

    <ng-container *ngIf="file; else dropZone">
        <div class="controls">
            <ng-container *ngIf="fileType === 'pdf'">
                <button class="button button-blue" (click)="zoomOut()">-</button>
                <button class="button button-blue" (click)="zoomIn()">+</button>
                <button class="button button-blue" (click)="rotateCounterClockwise()">⟲</button>
                <button class="button button-blue" (click)="rotateClockwise()">⟳</button>
            </ng-container>
            <button *ngIf="!displayOnly" class="button button-red" (click)="clearFile()">X</button>
        </div>
        <div class="file-view-container">
            <div [ngSwitch]="fileType" class="file-view-container-b" [style.width]="(width - 16) + 'px'"
                [style.height]="(height - 16) + 'px'">
                <pdf-viewer *ngSwitchCase="'pdf'" [original-size]="false" [src]="_dataUrl" [render-text]="true"
                    [zoom]="zoom" [rotation]="rotation"></pdf-viewer>
                <img *ngSwitchCase="'image'" [src]="_dataUrlSafe" alt="Selected Image" />
                <div *ngSwitchDefault class="file-info">
                    <p>{{ file?.name }}</p>
                    <i class="fa fa-file"></i>
                </div>
            </div>
        </div>
    </ng-container>

    <ng-template #dropZone>
        <div class="drag-drop-container" (drop)="onFileDropped($event)" (dragover)="onDragOver($event)"
            (click)="onContainerClick(fileInput)">
            <div class="drag-drop-text-container">
                <i class="fa fa-cloud-upload"></i>
                <p class="drag-drop-text">{{'Customs.Declaration.O.DragHere' | TextCodeTranslationPipe}}</p>
                <p class="drag-drop-text">{{'Customs.Declaration.O.Or' | TextCodeTranslationPipe}}</p>
                <p class="drag-drop-text">{{'Customs.General.O.CllickToSelectFile' | TextCodeTranslationPipe}}</p>
                <p class="drag-drop-text error" *ngIf="error">{{error}}</p>
            </div>
            <input type="file" (change)="onFileSelected($event)" hidden #fileInput>
        </div>
    </ng-template>

</div>
