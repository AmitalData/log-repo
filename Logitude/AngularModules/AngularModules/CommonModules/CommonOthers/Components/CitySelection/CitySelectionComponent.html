
<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 200px;">
                        <SearchBox [UseTimer]="true" (TextChanged)="SearchText = $event"></SearchBox>
                    </td>
                    <td> <div></div> </td>
                    <td style="height: 20px;padding: 5px;padding-bottom: 0px;">
                        <div>
                            <IconButton [IsSmall]="true"
                                [Name]="'Add'"
                                (click)="AddNewCity()"
                            style="float:left;"></IconButton>
                        </div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader" *ngIf="IsResourcesReady">
                        <table>
                            <tr>
                                <td style="width: 150px; min-width: 150px; max-width: 150px;">Name</td>
                                <td style="width: 150px; min-width: 150px; max-width: 150px;">Local name</td>
                                <td style="width: 200px; min-width: 200px; max-width: 200px;">Country</td>
                                <td>State</td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource" (click)="Selecting(item)">
                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px;">
                                    {{item.EnglishName}}
                                </td>

                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px;">
                                    {{item.LocalName}}
                                </td>

                                <td class="GridViewCell" style="width: 200px; min-width: 200px; max-width: 200px;">
                                    {{item.CountryEnglishName}}
                                </td>

                                <td class="GridViewCell">
                                    {{item.StateEnglishName}}
                                </td>
                            </tr>

                            <tr>
                                <td colspan="4">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div *ngIf="IsNoData" class="NoDataText">No cities found, to define please go the maintenance</div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="Close()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
