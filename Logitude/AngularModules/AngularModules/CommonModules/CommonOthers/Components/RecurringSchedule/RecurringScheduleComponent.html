<tr style="height: 170px">
    <td style="vertical-align: top">
        <table>
            <tr style="height: 10px"></tr>
            <tr>
                <td>
                    <div>
                        <table>
                            <tr class="FormFieldRow">
                                <td
                                    style="width: 25px"
                                    [style.text-align]="isRTL ? 'right' : 'left'"
                                >
                                    בכל:
                                </td>
                                <td style="width: 10px">
                                    <div></div>
                                </td>
                                <div
                                    style="
                                        height: 22px;
                                        width: 100px;
                                        position: relative;
                                        top: 10px;
                                    "
                                    [style.text-align]="isRTL ? 'right' : 'left'"
                                >
                                    <div
                                        tabindex="0"
                                        class="ToggleButton"
                                        style="
                                            margin: auto;
                                            width: 100% !important;
                                            height: 100% !important;
                                        "
                                        [style.text-align]="isRTL ? 'right' : 'left'"
                                    >
                                        <label
                                            >{{getDisplayText(AllocationDateType)}}</label
                                        >
                                        <img src="./Images/ToggleIcon.png" />
                                        <div
                                            [style.right]="isRTL ? 'initial' : '0'"
                                            [style.left]="isRTL ? '0' : 'initial'"
                                            class="ToggleButtonMenu"
                                            style="width: 100px"
                                        >
                                            <button
                                                [style.text-align]="isRTL ? 'right' : 'left'"
                                                *ngFor="let type of allocationTypes"
                                                (click)="onSelect(type);"
                                            >
                                                {{ getDisplayText(type) }}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <td style="width: 10px">
                                    <div></div>
                                </td>
                                <td
                                    style="width: 25px"
                                    [style.text-align]="isRTL ? 'right' : 'left'"
                                >
                                    כל:
                                </td>
                                <td style="width: 10px">
                                    <div></div>
                                </td>
                                <td>
                                    <div
                                        style="
                                            width: 80px;
                                            top: 10px;
                                            position: relative;
                                        "
                                    >
                                        <NumberInput
                                            [(ngModel)]="MonthInterval"
                                            name="no"
                                            [min]="1"
                                        ></NumberInput>
                                    </div>
                                </td>
                                <td style="width: 10px">
                                    <div></div>
                                </td>
                                <td
                                style="width: 25px"
                                [style.text-align]="isRTL ? 'right' : 'left'"
                            >
                                חודש(ים)
                            </td>
                            
                            </tr>
                            <tr class="FormFieldRow">
                                <td
                                    style="width: 75px"
                                    [style.text-align]="isRTL ? 'right' : 'left'"
                                >
                                    תאריך תשלום ראשון:
                                </td>
                                <td style="width: 10px">
                                    <div></div>
                                </td>
                                <td style="width: 100px">
                                    <LogDatePicker
                                        [DataContext]="dataContext"
                                        [SelectedDateValue]="StartDateTime"
                                        [HideColumns]="true"
                                        [NoObjectField]="true"
                                    ></LogDatePicker>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td
                                    style="width: 75px"
                                    [style.text-align]="isRTL ? 'right' : 'left'"
                                >
                                    סיום עד תאריך:
                                </td>
                                <td style="width: 10px">
                                    <div></div>
                                </td>
                                <td style="width: 100px">
                                    <LogDatePicker
                                        [DataContext]="dataContext"
                                        [SelectedDateValue]="EndDateTime"
                                        [HideColumns]="true"
                                        [NoObjectField]="true"
                                    ></LogDatePicker>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
            </tr>
        </table>
    </td>
</tr>
