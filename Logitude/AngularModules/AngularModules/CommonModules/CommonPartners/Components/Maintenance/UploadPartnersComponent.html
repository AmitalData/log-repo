
<style type="text/css">
    .ResponseProgressLayout {
        position: absolute;
        top: -5px;
        bottom: -5px;
        left: -5px;
        right: -5px;
        margin: auto;
        border-radius: 8px;
        background: -moz-linear-gradient(rgba(21, 61, 110, 0.4) 0%, rgba(21, 61, 110, 0.1) 50%, rgba(21, 61, 110, 0.4) 100%);
        background: -webkit-linear-gradient(rgba(21, 61, 110, 0.4) 0%, rgba(21, 61, 110, 0.1) 50%, rgba(21, 61, 110, 0.4) 100%);
        background: linear-gradient(rgba(21, 61, 110, 0.4) 0%, rgba(21, 61, 110, 0.1) 50%, rgba(21, 61, 110, 0.4) 100%);
    }

    .ResponseProgressWindow {
        width: 230px;
        height: 110px;
        position: absolute;
        left: 50%;
        bottom: 170px;
        transform: translateX(-50%);
    }

    .ResponseProgressWindowHeader {
        height: 25px;
        line-height: 25px;
        font-size: 13px;
        padding-left: 10px;
        border-radius: 8px 8px 0 0;
        -moz-border-radius: 8px 8px 0 0;
        -webkit-border-radius: 8px 8px 0 0;
        border: 1px solid #8F9192;
        border-bottom: 0px;
        background: linear-gradient(rgba(189, 191, 191, 1) 0%, rgba(143, 145, 146, 1) 100%);
    }

    .ResponseProgressWindowBody {
        height: 100%;
        width: 100%;
        position: relative;
        border-radius: 0 0 8px 8px;
        -moz-border-radius: 0 0 8px 8px;
        -webkit-border-radius: 0 0 8px 8px;
        border: 1px solid #DADADA;
        border-top: 0px;
        background: linear-gradient(rgba(255, 255, 255, 1) 0%, rgba(208, 208, 208, 0.5) 100%);
    }
</style>

<table>
    <tr style="height:1px;">
        <td>
            <table>
                <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                    <td colspan="3">
                        <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width:280px;">
                        <div style="margin-left:5px;">
                            <Label style="width: 280px; font-family:Arial; font-size:12px;color:gray;">Partners Uploading Template can be downloaded </Label>
                        </div>
                    </td>

                    <td style="width:70px;">
                        <Hyperlink [FontSize]="12" (click)="DownloadUploadPartnersTemplate()" [Text]="'from here'"></Hyperlink>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width:280px;">
                        <div style="margin-left:5px;">
                            <Label style="width: 280px; font-family:Arial; font-size:12px;color:gray;">Computing Partner Code </Label>
                        </div>
                    </td>

                    <td style="width:70px;">
                        <LogTextBox [NoObjectField]="true" [HideColumns]="true" [Text]="ComputingPartnerCode" [ObjectFieldName]="'ComputingPartnerCode'" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:190px;">
                                    <div style="margin-left:5px;">
                                        <Label style="width: 190px; font-family:Arial; font-size:12px;color:gray;">Upload new partners to Logitude </Label>
                                    </div>
                                </td>
                                <td style="width: 57px;">
                                    <div>
                                        <input class="upload" style="display: none;width:65px; cursor:pointer;"
                                               type="file" (change)="OnFileChanged($event)"
                                               (click)="fileInput.value = null" value="" accept=".xls,.xlsx"
                                               #fileInput>
                                        <a href="#" style="text-decoration:none">
                                            <button class="Button" (click)="fileInput.click()">Upload Partners</button>
                                        </a>
                                    </div>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td style="width:500px;">
            <div class="MediaFill">
                <ScrollViewer>
                    <table>

                        <tr *ngIf="ErrorsList != null && ErrorsList.length > 0" style="vertical-align:top;">
                            <td style="margin-left:20px;width:500px;">
                                <table>
                                    <tr class="FormFieldRow">
                                        <td style="color:red;padding-left:10px;width:450px;">
                                            Errors in uploaed file: (first 10)
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="color:red;" *ngFor="let item of ErrorsList; let i=index;">
                                        <td style="color:red; padding-left:10px;">
                                            - {{item}}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr class="FormFieldRow" *ngIf="IsDone">
                            <td style="color:green;padding-left:10px;width:550px;">
                                <div style="width:100%;white-space: pre-line; font-size: 11px;line-height: 12px;">
                                    {{DoneMsg}}
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <div></div>
                            </td>
                        </tr>

                    </table>
                </ScrollViewer>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
