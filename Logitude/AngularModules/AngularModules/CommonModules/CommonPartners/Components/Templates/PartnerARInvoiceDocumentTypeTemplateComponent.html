<div *ngIf="IsDocumentTemplateAreaReady && IsHaveARInvoicePrintToogleFeature()"> 
    <div style="height:45px"> </div>
    <table>
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td style="width: 1px">Choose Invoice Print Template</td>
                        <td>
                            <HelpIcon [IconSize]="14" [HideHeader]="true" [Text]="'Using this section you can override the default template defined for all invoices'"></HelpIcon>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td style="width: 380px;">
                <table>
                    <tr class="FormFieldRow" *ngIf="ShowSingleInvoice">
                        <td style="width: 140px;">
                            <LogLabel [ObjectFieldName]="'SingleInvoiceTemplateId'"
                                      [ObjectTableName]="'Card'"
                                      [DataContext]="DataContext"
                                      [Text]="'Shipment Invoice'">
                            </LogLabel>
                        </td>

                        <td>
                            <LogLov [ObjectFieldName]="'SingleInvoiceTemplateId'"
                                    [SelectedValue]="'SingleInvoiceTemplateId'"
                                    [ObjectTableName]="'Card'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'DocumentTypeTemplate'"
                                    [QueryFilterItems]="SingleInvoiceFilter"
                                    [DisplayMemberPath]="'Description'"
                                    [SearchFieldName]="'Description'">
                            </LogLov>
                        </td>
                        <td>
                            <div style="float: right;">
                                <Hyperlink *ngIf="CheckIfDefaultChanged('999S',SingleInvoiceTemplateId)" title="'Value Edited by User'">
                                    <img src="./Images/Buttons/Edit.png" style="width: 12px; height: 12px;" />
                                </Hyperlink>
                            </div>
                        </td>

                    </tr>


                    <tr class="FormFieldRow" *ngIf="ShowCustomsInvoice">
                        <td style="width: 140px;">
                            <LogLabel [ObjectFieldName]="'CustomsInvoiceTemplateId'"
                                      [ObjectTableName]="'Card'"
                                      [DataContext]="DataContext"
                                      [Text]="'Customs Invoice'">
                            </LogLabel>
                        </td>

                        <td>
                            <LogLov [ObjectFieldName]="'CustomsInvoiceTemplateId'"
                                    [SelectedValue]="CustomsInvoiceTemplateId"
                                    [ObjectTableName]="'Card'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'DocumentTypeTemplate'"
                                    [QueryFilterItems]="CustomsInvoiceFilter"
                                    [DisplayMemberPath]="'Description'"
                                    [SearchFieldName]="'Description'">
                            </LogLov>
                        </td>
                        <td>
                            <div style="float: right;">
                                <Hyperlink *ngIf="CheckIfDefaultChanged('999CI',CustomsInvoiceTemplateId)" title="'Value Edited by User'">
                                    <img src="./Images/Buttons/Edit.png" style="width: 12px; height: 12px;" />
                                </Hyperlink>
                            </div>
                        </td>
                    </tr>

                    <tr class="FormFieldRow" *ngIf="ShowConsolidationInvoice">
                        <td style="width: 140px;">
                            <LogLabel [ObjectFieldName]="'ConsolidationInvoiceTemplateId'"
                                      [ObjectTableName]="'Card'"
                                      [DataContext]="DataContext"
                                      [Text]="'Consolidation Invoice'">
                            </LogLabel>
                        </td>

                        <td>
                            <LogLov [ObjectFieldName]="'ConsolidationInvoiceTemplateId'"
                                    [SelectedValue]="ConsolidationInvoiceTemplateId"
                                    [ObjectTableName]="'Card'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'DocumentTypeTemplate'"
                                    [QueryFilterItems]="ConsolidationInvoiceFilter"
                                    [DisplayMemberPath]="'Description'"
                                    [SearchFieldName]="'Description'">
                            </LogLov>
                        </td>
                        <td>
                            <div style="float: right;">
                                <Hyperlink *ngIf="CheckIfDefaultChanged('999C',ConsolidationInvoiceTemplateId)" title="'Value Edited by User'">
                                    <img src="./Images/Buttons/Edit.png" style="width: 12px; height: 12px;" />
                                </Hyperlink>
                            </div>
                        </td>
                    </tr>

                    <tr class="FormFieldRow" *ngIf="ShowManifestInvoice">
                        <td style="width: 140px;">
                            <LogLabel [ObjectFieldName]="'ManifestInvoiceTemplateId'"
                                      [ObjectTableName]="'Card'"
                                      [DataContext]="DataContext"
                                      [Text]="'Manifest Invoice'">
                            </LogLabel>
                        </td>

                        <td>
                            <LogLov [ObjectFieldName]="'ManifestInvoiceTemplateId'"
                                    [SelectedValue]="ManifestInvoiceTemplateId"
                                    [ObjectTableName]="'Card'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'DocumentTypeTemplate'"
                                    [QueryFilterItems]="ManifestInvoiceFilter"
                                    [DisplayMemberPath]="'Description'"
                                    [SearchFieldName]="'Description'">
                            </LogLov>
                        </td>
                        <td>
                            <div style="float: right;">
                                <Hyperlink *ngIf="CheckIfDefaultChanged('999M',ManifestInvoiceTemplateId)" title="'Value Edited by User'">
                                    <img src="./Images/Buttons/Edit.png" style="width: 12px; height: 12px;" />
                                </Hyperlink>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                    </tr>

                </table>

            </td>

            <td style="height:30px">
                <div></div>
            </td>
        </tr>
    </table>
</div>
