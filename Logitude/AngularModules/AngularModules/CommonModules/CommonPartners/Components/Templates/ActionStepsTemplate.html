
<table>

        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td>
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>

        <tr *ngIf="ValidationWarningsList != null && ValidationWarningsList.length > 0" style="height:1px;">
            <td>
                <ValidationSummary [ItemsSource]="ValidationWarningsList"></ValidationSummary>
            </td>
        </tr>

        <tr class="FormFieldRow" *ngIf="IsReasonStackPanel">
            <td style="width: 110px;">
                <LogLabel [Text]="'Decline Reason'" [DataContext]="DataContext"></LogLabel>
            </td>

            <td>
                <LogLov  
                        [ObjectFieldName]="'QuoteClosingReasonCode'"
                        [ObjectTableName]="'QuoteClosingReason'"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Quote'">
                </LogLov>
            </td>
        </tr>

        <tr class="FormFieldRow" *ngIf="IsNotesStackPanelVisible">
            <td colspan="2">
                <table>
                    <tr style="height: 1px;">
                        <td>
                            <LogLabel [DataContext]="DataContext" [Text]="NotesHeader"></LogLabel>
                        </td>
                    </tr>

                    <tr style="height: 80px;">
                        <td>
                            <div class="FillParent">
                                <LogTextBox   [ObjectFieldName]="'EventNotes'"  [IsMultiline]="true" [DataContext]="DataContext"></LogTextBox>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 32px;">
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()">Confirm</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

</table>
