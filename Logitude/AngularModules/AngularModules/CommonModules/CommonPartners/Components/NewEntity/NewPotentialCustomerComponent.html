
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;" *ngIf="IsRadioButtonsVisible">

        <td>
            <div>
                <RadioButton [Name]="'CustomerRadio'" [IsChecked]="IsCustomer" (Checked)="SetIsCustomer(true)" [Text]="'Is Customer (Allows more options in customer management)'"></RadioButton>
            </div>

            <div>
                <RadioButton [Name]="'CustomerRadio'" [IsChecked]="!IsCustomer" (Checked)="SetIsCustomer(false)" [Text]="'Shipper / Consignee is NOT my customer'" [Top]="5"></RadioButton>
            </div>
        </td>

        <td>

        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="ScrollViewer">
                    <div class="ScrollContent">
                        <table *ngIf="IsResourcesReady">

                            <!-- Address + Contact -->
                            <tr style="height: 1px;">
                                <td>
                                    <table>
                                        <tr>
                                            <td>
                                                <table>
                                                    <tr>
                                                        <td>
                                                            <table>

                                                                <!-- Name -->
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 110px;">
                                                                        <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Customer.O.CompanyName'"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogTextBox [ObjectFieldName]="'EnglishName'" [Text]="EnglishName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" (LostFocus)="SearchText = null"></LogTextBox>
                                                                        <SearchBox [SearchText]="SearchText"
                                                                                   [ObjectTableName]="ObjectTableName"
                                                                                   [IsQuickSearch]="true"
                                                                                   [HideBox]="true"
                                                                                   [Background]="'#F0FFFF'"
                                                                                   [Watermark]="''"
                                                                                   [ItemHeight]="35"
                                                                                   [DropDownWidth]="490"
                                                                                   [IsSimilarPartner]="true"
                                                                                   [PartnerTypeId]="'CS'"
                                                                                   [Header]="'Similar customers in the system'">
                                                                        </SearchBox>

                                                                    </td>
                                                                </tr>

                                                                <!-- VatNumber -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'VatNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogTextBox [ObjectFieldName]="'VatNumber'" [Text]="VatNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- Salesman -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'SalesmanUserId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogLov [ObjectFieldName]="'SalesmanUserId'"
                                                                                            [SelectedValue]="SalesmanUserId"
                                                                                            [ObjectTableName]="ObjectTableName"
                                                                                            [DataContext]="DataContext"
                                                                                            [LookUpTableName]="'User'"
                                                                                            [DependencyFilter3Value]="true">
                                                                                    </LogLov>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- LocalName -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogTextBox [ObjectFieldName]="'LocalName'" [Text]="LocalName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>
                                                                </tr>

                                                                <!-- IsLocalLanguage -->
                                                                <tr class="FormFieldRow">
                                                                    <td colspan="2">
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 16px;">
                                                                                    <CheckBox [IsChecked]="IsLocalLanguage" (Checked)="IsLocalLanguage = $event"></CheckBox>
                                                                                </td>

                                                                                <td style="width: 5px;">
                                                                                    <div></div>
                                                                                </td>

                                                                                <td style="font-size: 14px; color: #1B90CB;">Enable address entry in local language</td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- Address1 -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'Address1_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogTextBox [ObjectFieldName]="'Address1_Potential'" [Text]="Address1_Potential" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>
                                                                </tr>

                                                                <!-- Address2 -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'Address2_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogTextBox [ObjectFieldName]="'Address2_Potential'" [Text]="Address2_Potential" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>
                                                                </tr>

                                                                <!-- ZipCode -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'ZipCode_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogTextBox [ObjectFieldName]="'ZipCode_Potential'" [Text]="ZipCode_Potential" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- City -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'City_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 194px;">
                                                                                    <LogTextBox [ObjectFieldName]="'City_Potential'" [Text]="City_Potential" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                                                </td>

                                                                                <td style="width: 5px;">
                                                                                    <div></div>
                                                                                </td>

                                                                                <td>
                                                                                    <span id="{{'SelectLink' | IdGeneratorAsyncPipe | async}}" class="hyperlink" (click)="SelectCityCommand()">Select</span>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- Country -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'CountryId_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogLov [ObjectFieldName]="'CountryId_Potential'"
                                                                                            [SelectedValue]="CountryId_Potential"
                                                                                            [ObjectTableName]="ObjectTableName"
                                                                                            [DataContext]="DataContext"
                                                                                            [LookUpTableName]="'Country'"
                                                                                            (SelectedItemChanged)="Country = $event">
                                                                                    </LogLov>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- State -->
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'StateId_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogLov [ObjectFieldName]="'StateId_Potential'"
                                                                                            [SelectedValue]="StateId_Potential"
                                                                                            [ObjectTableName]="ObjectTableName"
                                                                                            [DataContext]="DataContext"
                                                                                            [LookUpTableName]="'State'"
                                                                                            (SelectedItemChanged)="State = $event"
                                                                                            [DependencyFilter1Value]="CountryId_Potential">
                                                                                    </LogLov>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- PhoneNumber -->
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'PhoneNumber_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogTextBox [ObjectFieldName]="'PhoneNumber_Potential'" [Text]="PhoneNumber_Potential" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <!-- FaxNumber -->
                                                                <tr class="FormFieldRow">
                                                                    <td style="width: 90px;">
                                                                        <LogLabel [ObjectFieldName]="'FaxNumber_Potential'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 230px;">
                                                                                    <LogTextBox [ObjectFieldName]="'FaxNumber_Potential'" [Text]="FaxNumber_Potential" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>

                                                        <td style="width:15px;">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>

                                            <td style="width: 10px;">
                                                <div></div>
                                            </td>

                                            <td *ngIf="!ShowContactPart" style="width:300px;">
                                                <table>
                                                    <tr>
                                                        <td>
                                                            <table>
                                                                <tr class="FormFieldRow">
                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 16px;">
                                                                                    <CheckBox [IsChecked]="IsAddContactChecked" id="{{'AddContactCheckBox' | IdGeneratorAsyncPipe | async}}"(Checked)="IsAddContactChecked = $event"></CheckBox>
                                                                                </td>

                                                                                <td style="width: 5px;">
                                                                                    <div></div>
                                                                                </td>

                                                                                <td style="font-size: 14px; color: #1B90CB;">Add Primary Contact</td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <tr style="height: 20px;" *ngIf="ContactDataContext.Info1Text">
                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 16px;">
                                                                                    <img class="CenterCenter" src="./Images/Info.png" />
                                                                                </td>

                                                                                <td style="width: 5px;">
                                                                                    <div></div>
                                                                                </td>

                                                                                <td style="font-size: 10px; color: #084B8A;">{{ContactDataContext.Info1Text}}</td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <tr style="height: 20px;" *ngIf="ContactDataContext.Info2Text">
                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 16px;">
                                                                                    <img class="CenterCenter" src="./Images/Info.png" />
                                                                                </td>

                                                                                <td style="width: 5px;">
                                                                                    <div></div>
                                                                                </td>

                                                                                <td style="font-size: 10px; color: #084B8A;">{{ContactDataContext.Info2Text}}</td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td>
                                                                        <table>

                                                                            <!-- Email -->
                                                                            <tr class="FormFieldRow">
                                                                                <td style="width:110px;">
                                                                                    <LogLabel [ObjectFieldName]="'Email'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td style="width:220px;">
                                                                                    <LogTextBox [ObjectFieldName]="'Email'" [Text]="ContactDataContext.Email" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext" (LostFocus)="ContactDataContext.EmailLostFocus($event)"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <!-- EnglishName -->
                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'EnglishName'" [Text]="ContactDataContext.EnglishName" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <!-- LocalName -->
                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'LocalName'" [Text]="ContactDataContext.LocalName" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'Position'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'Position'" [Text]="ContactDataContext.Position" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'Mobile'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'Mobile'" [Text]="ContactDataContext.Mobile" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'Fax'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'Fax'" [Text]="ContactDataContext.Fax" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'BusinessPhone'" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogTextBox [ObjectFieldName]="'BusinessPhone'" [Text]="ContactDataContext.BusinessPhone" [ObjectTableName]="ContactDataContext.ObjectTableName" [DataContext]="ContactDataContext"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr style="height:10px;">
                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>

                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td>
                                                                        <table>
                                                                            <tr class="FormFieldRow">
                                                                                <td style="font-size: 16px; color: #1B90CB;">Sales Notes</td>
                                                                            </tr>

                                                                            <tr style="height: 80px;">
                                                                                <td style="height: 80px; vertical-align: top;">
                                                                                    <div style="height: 100%; width: 100%;">
                                                                                        <LogTextBox [ObjectFieldName]="'EntityNotes'" [NoObjectField]="true" [Text]="EntityNotes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                                                    </div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>

                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>

                                            
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr style="height:5px;">
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <!--Additional Fields-->
                            <tr style="height: 1px;">
                                <td>
                                    <div style="font-size: 14px; color: #1B90CB;">Additional Fields</div>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div class="MediaFill">
                                        <div class="LocationDirective" #Child></div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button  id="{{'Cancel-DontCreatePotCustomer' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'Ok-AddPotCustomer' | IdGeneratorAsyncPipe | async}}"  class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
