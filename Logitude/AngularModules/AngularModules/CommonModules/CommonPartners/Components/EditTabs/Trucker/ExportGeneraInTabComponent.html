<style>
    .FormFieldRow {
        height: 32px;
    }

    .col2Label {
        width: 150px;
        padding-right: 15px;
    }
</style>

<div class="TabHolder">
    <table *ngIf="_IsReady">
        <tr>
            <td class="TabTitleRow">
                כללי
            </td>
        </tr>
        <tr>
            <td>
                <div style="width:100%;height:100%">
                    <div class="LocationDirective"></div>
                    <table>
                        <tr>
                            <td style="width:400px;">
                                <table>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td style="width: 160px; min-width: 160px;">
                                            <LogLabel [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName"
                                                      [DataContext]="this"></LogLabel>
                                        </td>
                                        <td>
                                            <LogTextBox [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName"
                                                        [HideColumns]="true" [DataContext]="this" [InputType]="'text'"></LogTextBox>
                                        </td>
                                        <td style="width:20px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td style="width: 160px; min-width: 160px;">
                                            <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                                                      [DataContext]="this"></LogLabel>
                                        </td>
                                        <td>
                                            <LogTextBox [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                                                        [HideColumns]="true" [DataContext]="this" [InputType]="'text'"></LogTextBox>
                                        </td>
                                        <td style="width:20px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td style="width: 160px; min-width: 160px;">
                                            <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                                                      [DataContext]="this"></LogLabel>
                                        </td>
                                        <td>
                                            <LogTextBox [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                                                        [HideColumns]="true" [DataContext]="this" [InputType]="'text'"></LogTextBox>
                                        </td>
                                        <td style="width:20px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td style="width: 160px; min-width: 160px;">
                                            <LogLabel [ObjectFieldName]="'Website'" [ObjectTableName]="ObjectTableName"
                                                      [DataContext]="this"></LogLabel>
                                        </td>
                                        <td>
                                            <LogTextBox [ObjectFieldName]="'Website'" [ObjectTableName]="ObjectTableName"
                                                        [HideColumns]="true" [DataContext]="this" [InputType]="'text'"></LogTextBox>
                                        </td>
                                        <td style="width:20px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td style="width: 160px; min-width: 160px;">
                                            <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName"
                                                      [DataContext]="this"></LogLabel>
                                        </td>
                                        <td>
                                            <LogCheckBox [ObjectFieldName]="'InActive'" [Checked]="InActive" [ObjectTableName]="ObjectTableName" [DataContext]="this"></LogCheckBox>
                                        </td>
                                        <td style="width:20px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td style="width: 160px; min-width: 160px;">
                                            <LogLabel [ObjectFieldName]="'TransmitToPort'" [ObjectTableName]="ObjectTableName"
                                                      [DataContext]="this"></LogLabel>
                                        </td>
                                        <td>
                                            <LogCheckBox [ObjectFieldName]="'TransmitToPort'" [Checked]="InActive" [ObjectTableName]="ObjectTableName" [DataContext]="this"></LogCheckBox>
                                        </td>
                                        <td style="width:20px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr class="FormFieldRow" style="background: transparent;">
                                        <td colspan="2" style="height: 100px;">
                                            <div style="height: 20px; line-height: 20px;">
                                                <LogLabel [ObjectFieldName]="'Remark'" [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="this"></LogLabel>
                                            </div>
                                            <div style="height: 80px; padding-left: 10px;">
                                                <LogTextBox [ObjectFieldName]="'Remark'" [ObjectTableName]="ObjectTableName"
                                                            [HideColumns]="true" [DataContext]="this" [InputType]="'text'" [IsMultiline]="true"></LogTextBox>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="3"><div></div></td>
                                    </tr>
                                </table>
                            </td>
                            <td><div></div></td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>
</div>
