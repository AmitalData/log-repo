<div class="TabHolder">
    <table *ngIf="ResourcesReady">
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td>{{'ShippingLine.TH.ServiceLines' | TextCodeTranslationPipe}}</td>

                        <td style="width: 21px">
                            <IconButton [Name]="'Add'" (click)="AddServiceLine()"></IconButton>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td style="vertical-align:top">
                <table>
                    <tr>
                        <td style="vertical-align:top">
                            <table>
                                <tr>
                                    <td>
                                        <div class="MediaFill">
                                            <div class="SimpleGridView">
                                                <div class="SimpleGridViewHeader">
                                                    <table>
                                                        <tr class="SimpleGridHeaderRow">
                                                            <td style="width: 200px; max-width: 200px; min-width: 200px;">{{'CarrierServiceLine.F.Name' | TextCodeTranslationPipe}}</td>
                                                            <td style="width: 200px; max-width: 200px; min-width: 200px;">{{'CarrierServiceLine.F.Description' | TextCodeTranslationPipe}}</td>
                                                            <td style="width: 90px; max-width: 90px; min-width: 90px;">{{'CarrierServiceLine.F.Inactive' | TextCodeTranslationPipe}}</td>
                                                            <td class="LastChild"></td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div class="SimpleGridViewBody">
                                                    <table>
                                                        <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource">
                                                            <td class="GridViewCell" style="width: 200px; max-width: 200px; min-width: 200px;">
                                                                <div class="TextTrimming" style="width: 200px;">{{item.Name}}</div>
                                                            </td>
                                                            <td class="GridViewCell" style="width: 200px; max-width: 200px; min-width: 200px;">
                                                                <div class="TextTrimming" style="width: 200px;">{{item.Description}}</div>
                                                            </td>
                                                            <td class="GridViewCell" style="width: 90px;">
                                                                <img class="CenterCenter" src="./Images/GreenTick.png" *ngIf="item.Inactive"/>
                                                            </td>
                                                            <td class="LastChild">
                                                                <table>
                                                                    <tr>
                                                                        <td style="width:5px"></td>
                                                                        <td style="width:20px">
                                                                            <IconButton (click)="EditClicked(item)" [IsSmall]="true"
                                                                                        [Name]="'Edit'"></IconButton>
                                                                        </td>
                                                                        <td style="width:20px">
                                                                            <IconButton (click)="DeleteClicked(item)" [IsSmall]="true"
                                                                                        [Name]="'Delete'"></IconButton>
                                                                        </td>
                                                                        <td>
                                                                            <div></div>
                                                                        </td>
                                                                    </tr>
                                                                </table>

                                                            </td>

                                                        </tr>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
