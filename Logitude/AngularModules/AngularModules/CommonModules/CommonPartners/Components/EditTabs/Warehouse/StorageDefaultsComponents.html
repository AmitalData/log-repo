
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table class="FixedTable">
                    <tr style="height:1px;">
                        <td>
                            <table>
                                <tr style="height:25px;">
                                    <td style="width:100px;">
                                        <LogCheckBox [ObjectFieldName]="'ChargeStorage'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Charge Storage'"></LogCheckBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr style="height:20px;">
                                    <td colspan="2" class="Label">
                                        <table>
                                            <tr>
                                                <td style="width:20px;">
                                                    <div>
                                                    </div>
                                                </td>

                                                <td style="font-style:italic; font-size:10px;">
                                                    Enableing will allow to calculate the storage charge in shipments usings this warehouse
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height:10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr class="FormFieldRow">
                        <td>
                            <table>
                                <tr>
                                    <td style="width:130px;">
                                        <LogLabel [ObjectFieldName]="'CurrencyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:220px;">
                                        <LogLov [ObjectFieldName]="'CurrencyId'"
                                                [SelectedValue]="CurrencyId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Currency'">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr class="FormFieldRow">
                        <td>
                            <table>
                                <tr>
                                    <td style="width:130px;">
                                        <LogLabel [ObjectFieldName]="'StorageFreeDays'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width:220px;">
                                        <LogTextBox [ObjectFieldName]="'StorageFreeDays'" [Text]="StorageFreeDays" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>

                                    <td>
                                        <div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height:10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr style="height:1px;">
                        <td>
                            <table>
                                <tr style="height:25px;" class="Label">
                                    <td style="width:130px;"><div></div></td>
                                    <td style="width:150px;">Air</td>
                                    <td style="width:5px;"><div></div></td>
                                    <td style="width:150px;">Ocean</td>
                                    <td style="width:5px;"><div></div></td>
                                    <td style="width:150px;">Inland</td>
                                    <td><div></div></td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td class="Label">Weight Measurement</td>

                                    <td style="width:150px;">
                                        <LogLov [ObjectFieldName]="'AirWeightMeasurementCode'"
                                                [SelectedValue]="AirWeightMeasurementCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'WarehouseWeightMeasurement'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td style="width:5px;"><div></div></td>

                                    <td style="width:150px;">
                                        <LogLov [ObjectFieldName]="'OceanWeightMeasurementCode'"
                                                [SelectedValue]="OceanWeightMeasurementCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'WarehouseWeightMeasurement'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td style="width:5px;"><div></div></td>

                                    <td style="width:150px;">
                                        <LogLov [ObjectFieldName]="'InlandWeightMeasurementCode'"
                                                [SelectedValue]="InlandWeightMeasurementCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'WarehouseWeightMeasurement'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td><div></div></td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td class="Label">Weight Rounding</td>

                                    <td style="width:150px;">
                                        <LogLov [ObjectFieldName]="'AirWeightRoundingCode'"
                                                [SelectedValue]="AirWeightRoundingCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'WarehouseWeightRounding'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td style="width:5px;"><div></div></td>

                                    <td style="width:150px;">
                                        <LogLov [ObjectFieldName]="'OceanWeightRoundingCode'"
                                                [SelectedValue]="OceanWeightRoundingCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'WarehouseWeightRounding'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td style="width:5px;"><div></div></td>

                                    <td style="width:150px;">
                                        <LogLov [ObjectFieldName]="'InlandWeightRoundingCode'"
                                                [SelectedValue]="InlandWeightRoundingCode"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'WarehouseWeightRounding'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td><div></div></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height:10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr style="height:25px;" class="Label">
                        <td>
                            <table>
                                <tr>
                                    <td style="width:100px;">Pricing Defaults</td>
                                    <td style="font-style:italic;">(days after free days)</td>

                                    <td style="width: 20px; padding-right: 2px;float:right;vertical-align:central;">
                                        <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddPricingItemMethod()"></IconButton>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div class="MediaFill" style="overflow-x: hidden;">
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="PricingItemsList" (RowEnded)="OnRowEnded($event)">

                                    <log-column [header]="'Step From'" [width]="'100'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate>
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.StepFrom}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'StepFrom'" [DataContext]="item" [InputType]="'integer'"
                                                                [Text]="item.StepFrom" [ObjectTableName]="'WarehouseStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Number of Days'" [width]="'120'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate>
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.Days}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Days'" [DataContext]="item" [InputType]="'integer'"
                                                                [Text]="item.Days" [ObjectTableName]="'WarehouseStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Step To'" [width]="'80'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate>
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.StepTo}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'StepTo'" [DataContext]="item" [InputType]="'integer'"
                                                                [Text]="item.StepTo" [ObjectTableName]="'WarehouseStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Sale Price'" [width]="'100'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate>
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.SalePrice}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'SalePrice'" [DataContext]="item"
                                                                [Text]="item.SalePrice" [ObjectTableName]="'WarehouseStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <!-- Buttons -->
                                    <log-column [width]="'30'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true">
                                                <IconButton [Name]="'Delete'" [IsSmall]="true"
                                                            style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="item.RemoveLine(item)"></IconButton>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </ScrollViewer>                
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
