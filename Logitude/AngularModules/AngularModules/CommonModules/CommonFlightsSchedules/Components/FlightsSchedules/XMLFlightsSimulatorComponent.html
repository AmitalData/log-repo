
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="UseRequestId" (Checked)="UseRequestId = $event" [Text]="'Use Request Id'"></CheckBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 100px;">
                        <input type="text" [(ngModel)]="RequestId" [disabled]="!UseRequestId" />
                    </td>

                    <td>
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="IsFNA" (Checked)="IsFNA = $event" [Text]="'Is FNA'"></CheckBox>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <textarea [(ngModel)]="XML_Text" [disabled]="UseRequestId"></textarea>
        </td>
    </tr>


    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
