
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 370px;">
                        <table>
                            <tr class="FormFieldRow">
                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'AirlineId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td>
                                    <LogLov [ObjectFieldName]="'AirlineId'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Carrier'"
                                            [DependencyFilter1Value]="'AL'">
                                    </LogLov>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'FromPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td>
                                    <LogLov [ObjectFieldName]="'FromPortId'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Port'"
                                            [DependencyFilter1Value]="'A'">
                                    </LogLov>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'ToPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td>
                                    <LogLov [ObjectFieldName]="'ToPortId'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Port'"
                                            [DependencyFilter1Value]="'A'">
                                    </LogLov>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'ETD'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td>
                                    <LogDatePicker [ObjectFieldName]="'ETD'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogDatePicker>
                                </td>
                            </tr>

                        </table>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td>
                        <table>
                            <tr class="FormFieldRow">
                                <td style="width: 60px;">
                                    <LogLabel [ObjectFieldName]="'GrossWeight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 100px;">
                                    <LogTextBox [ObjectFieldName]="'GrossWeight'" [Text]="GrossWeight" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                </td>

                                <td style="width: 3px;">
                                    <div></div>
                                </td>

                                <td style="width: 100px;">
                                    <LogLov [ObjectFieldName]="'GrossWeightUnitCode'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'WeightUnit'"
                                            [HideColumns]="true">
                                    </LogLov>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow">
                                <td style="width: 60px;">
                                    <LogLabel [ObjectFieldName]="'Volume'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 100px;">
                                    <LogTextBox [ObjectFieldName]="'Volume'" [Text]="Volume" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                </td>

                                <td style="width: 3px;">
                                    <div></div>
                                </td>

                                <td style="width: 100px;">
                                    <LogLov [ObjectFieldName]="'VolumeUnitCode'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'VolumeUnit'"
                                            [HideColumns]="true">
                                    </LogLov>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="5">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <LogLabel [ObjectFieldName]="'AnswerOSI'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [Text]="'Other Service Information'"></LogLabel>

            <div style="height: 100px;">
                <LogTextBox [ObjectFieldName]="'AnswerOSI'" [Text]="AnswerOSI" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <CheckBox [IsChecked]="IsReasonForNoReplayChecked" (Checked)="IsReasonForNoReplayChecked = $event" [Text]="'Reason for no Display'"></CheckBox>
            <div style="height: 100px;">
                <LogTextBox [ObjectFieldName]="'AnswerReasonForNoReply'" [Text]="AnswerReasonForNoReply" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SendClicked()">Send</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
