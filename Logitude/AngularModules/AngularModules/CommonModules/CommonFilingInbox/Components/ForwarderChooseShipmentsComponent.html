
<style>
    .MenuFilters {
        color: #909293;
        text-align: center;
        cursor: default;
    }

        .MenuFilters:hover {
            text-align: center;
            background-image: url('../../../Images/LogBox/FilterHover.png');
            background-repeat: no-repeat;
        }

    .Selected {
        color: white;
        text-align: center;
        background-image: url('../../../Images/LogBox/FilterSelected.png');
        background-repeat: no-repeat;
    }

        .Selected:hover {
            color: white;
            text-align: center;
            background-image: url('../../../Images/LogBox/FilterSelected.png');
            background-repeat: no-repeat;
        }

    .MenuFilters .MenuFiltersCount {
        font-size: 33px;
    }

    .MenuFilters .MenuFiltersName {
        font-size: 13px;
    }

    .Disabled {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr style="height: 10px;">
        <td style="height: 10px;">
            <div></div>
        </td>
    </tr>
    <tr style="height:10px;">
        <td></td>
    </tr>
    <tr style="height: 21px;">
        <td style="height: 21px; vertical-align:middle;">
            <table>
                <tr>
                    <td style="width: 21px;">
                        <IconButton [Name]="'Refresh'" (click)="RefreshBtnClick()"></IconButton>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 250px; vertical-align: middle;">
                        <SearchTextBox [ObjectTableName]="'Shipment'" (SearchTextChangeEvent)="onSearchTextChangeEvent($event)" [PlaceHolder]="'Search Shipments ...'"></SearchTextBox>
                    </td>

                    <td style="width: 485px;">
                        <div></div>
                    </td>

                    <td style="width: 90px; vertical-align: middle; position:relative;">
                        <DirectionsFilter *ngIf="IsPrivateLabelWithMoreThanOneDirectionFilter  && !IsLogbox" [HideExport]="IsLogbox || !IsExportActivated" [ShowCustomFilter]="IsLogbox|| IsCustomsActivated" [HideImportDomistic]="IsLogbox|| IsPrivateLabel" [HideAMANACFilters]="true" [SelectedValue]="SelectedDirectionFilter" [Width]="90" (SelectedValueChanged)="SelectedDirectionFilter = $event"></DirectionsFilter>
                    </td>

                    <td style="width: 3px;">
                        <div></div>
                    </td>

                    <td style="width: 120px; vertical-align: middle; position:relative;">
                        <ShipmentTypeFilter (SelectedTypeValueChanged)="SelectedArchiveFilter = $event"></ShipmentTypeFilter>
                    </td>

                    <td style="width: 3px;">
                        <div></div>
                    </td>

                    <td style="width: 120px; vertical-align: middle; position:relative;">
                        <TransportsFilter (SelectedValueChanged)="SelectedTransportFilter = $event"></TransportsFilter>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height: 10px;">
        <td style="height: 10px;">
            <div></div>
        </td>
    </tr>
    <tr>
        <td style="height: 100%">
            <div style="width:100%;height:100%;background-color: #EAEAEB;border: 1px solid #cccccc;">
                <table>
                    <tr>
                        <td>
                            <div style="height: Calc(100% - 1px);background-color:white;">
                                <logitude-grid GridWidth="100%" GridHeight="100%" 
                                               [ObjectTable]="'Shipment'" 
                                               [dataSource]="DataSource" 
                                               [MenuHeaderchangeevent]="MenuHeaderchangeevent" 
                                               (rowSelectedEvent)="onRowSelected($event)" 
                                               [SelectedRow]="SelectedRow"
                                               [columns]="columns" 
                                               [autoLoad]="true" 
                                               [rows]="items" 
                                               [CustomColumnsReady]="CustomColumnsReady" 
                                               (AfterViewInitCompleted)="GridAfterViewInitCompleted($event)"
                                               [SearchFieldchangeevent]="SearchFieldchangeevent" 
                                               [EnableRowHoverVisibility]="true" 
                                               [RowHoverVisibilityQueryName]="SelectedFilter" 
                                               [HoverTemplateIndex]="5">
                                </logitude-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="height:30px;float:right;">
                <button class="Button" (click)="CloseButtonClicked()" style="width:80px;float: right;margin:4px;">Close</button>
            </div>
        </td>
    </tr>
</table>
