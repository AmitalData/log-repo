<style>
    .NoSelect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Chrome/Safari/Opera */
        -khtml-user-select: none; /* Konqueror */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently not supported by any browser */
    }

    .myTitleClass {
        color: blue;
        text-decoration: underline;
    }

        .myTitleClass:hover .edit {
            visibility: visible;
            /*display:block;*/
            opacity: 1;
        }

    .edit {
        float: left;
        visibility: hidden;
        /*display:none;*/
        opacity: 0;
        margin: 2px;
    }
    .LogitudeIconButton {
        display: block !important;
        float: left !important;
        width: 21px;
        height: 21px;
        outline: none;
        border: 1px solid #6A8299;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;     
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
    }
    .LogitudeIconButton img {
        position: absolute;
        top: 1px;
        bottom: 0;
        margin: auto;
    }
    .FlipImgHoriz{
        -moz-transform: scaleX(-1);
        -o-transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
        transform: scaleX(-1);
        filter: FlipH;
        -ms-filter: "FlipH";
    }
</style>
<div style="height: 24px;direction:ltr">
    <table>
        <tr *ngIf="EntityPM.Direction!='E'">
            <td colspan="2">
                <div class="ShortTitleControl">
                    <span *ngIf="_EntityNumber && _ShowEntityNumberClick"
                          class="myTitleClass" style="float: right; width: auto; padding: 0px 4px;">
                        <!--<span class="edit" *ngIf="_ShowEntityNumberClick" (click)="EntityNumberClick()">
                            &nbsp;
                        </span>-->
                        <!--<img style="visibility:inherit; vertical-align: middle; transform:none;" title="הצג תיק עמילות" class="FlipImgHoriz" src="./Images/LOVSearch.png">-->
                        <!--<a href="#"><i class="fa fa-pencil fa-lg"></i></a>-->
                        <IconButton [IsSmall]="true" [Name]="'Edit'"
                                    class="edit"
                                    (click)="EntityNumberClick()"
                                    style="visibility:inherit; vertical-align: middle; transform:none;" title="שמור והצג תיק עמילות"></IconButton>

                        {{_EntityNumber}}
                    </span>
                    <span *ngIf="_EntityNumber && !_ShowEntityNumberClick"
                          style="float: right; width: auto; padding: 0px 4px;">
                        {{_EntityNumber}}
                    </span>

                    <span *ngIf="EntityNumber" style="float: right; width: auto; padding: 0px 4px;">  {{EntityNumber}} </span>
                    <!--<span *ngIf="!EntityPM.IsCourierDeclaration" class="" style="float: right; width: auto; padding: 0px 4px;">  {{EntityPM.CustomerName}}  </span>-->
                    <span *ngIf="!EntityPM.IsCourierDeclaration" class="" style="float: right; width: auto; padding: 0px 4px;">  {{EntityPM.CustomerName}}  - </span>
                    <span *ngIf="EntityPM.IsCourierDeclaration" class="" style="float: right; width: auto; padding: 0px 4px;">  {{CourierImporterName}}  </span>

                    <span *ngIf="EntityPM.FacilityTypeName" class="TextTrimming"
                          style="float: right; width: auto; font-size:12px;font-weight:bold;padding-bottom:2px">({{EntityPM.FacilityTypeName}})</span>

                </div>
            </td>
        </tr>
        <tr *ngIf="EntityPM.Direction=='E'">
            <td colspan="2">
                <div class="ShortTitleControl">
                    
                    <span style="float: right; width: auto; padding: 0px 4px;"><button class="LogitudeIconButton" (click)="RefreshButtonClicked()"> <img class="FlipImgHoriz" style="visibility: inherit; top: 0px; right: 1px; left: 0px; width: initial;" src="./Images/Buttons/Refresh.png" /></button></span>
                    <span *ngIf="EntityPM.ExportFile" class="TextTrimming"
                          style="float: right; width: auto; padding: 0px 4px;">/ {{EntityPM.ExportFile}}</span>
                    <span *ngIf="_EntityNumber && _ShowEntityNumberClick"
                          class="myTitleClass" style="float: right; width: auto; padding: 0px 4px;">
                        <IconButton [IsSmall]="true" [Name]="'Edit'"
                                    class="edit"
                                    (click)="EntityNumberClick()"
                                    style="visibility:inherit; vertical-align: middle; transform:none;" title="שמור והצג תיק עמילות"></IconButton>

                        {{_EntityNumber}}
                    </span>
                    <span *ngIf="_EntityNumber && !_ShowEntityNumberClick"
                          style="float: right; width: auto; padding: 0px 4px;">
                        {{_EntityNumber}}
                    </span>


                    <span *ngIf="EntityNumber" style="float: right; width: auto; padding: 0px 4px;">  {{EntityNumber}} </span>
                    <!--<span *ngIf="!EntityPM.IsCourierDeclaration" class="" style="float: right; width: auto; padding: 0px 4px;">  {{EntityPM.CustomerName}}  </span>-->
                    <span *ngIf="!EntityPM.IsCourierDeclaration" class="" style="float: right; width: auto; padding: 0px 4px;">  {{EntityPM.CustomerName}}  - </span>
                    <span *ngIf="EntityPM.IsCourierDeclaration" class="" style="float: right; width: auto; padding: 0px 4px;">  {{CourierImporterName}}  </span>

                    <span *ngIf="EntityPM.FacilityTypeName" class="TextTrimming"
                          style="float: right; width: auto; font-size:12px;font-weight:bold;padding-bottom:2px">({{EntityPM.FacilityTypeName}})</span>

                </div>
            </td>
        </tr>
    </table>
</div>
