<p-table [value]="data" [columns]="columns" #table [scrollable]='true' scrollHeight="55vh" [rows]='rows'
    [globalFilterFields]='columnsNames' [resizableColumns]="true" [paginator]="paginator" 
    [rowsPerPageOptions]="[10,25,50,100]" [(first)]='firstRowIndex'>
    <ng-template pTemplate="caption">
        <i class="pi pi-search" style="margin:4px 4px 0 0"></i>
        <input type="text" pInputText size="50" placeholder="Global Filter"
            (input)="filterTable($any($event.target).value)" style="width:auto">
    </ng-template>
    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor='let col of columns' [pSortableColumn]="col.name" pResizableColumn>
                {{col.alias}}
                <p-sortIcon [field]="col.name"></p-sortIcon>
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row let-columns="columns">
        <tr>
            <td *ngFor='let col of columns'>{{row[col.name]}}</td>
        </tr>
    </ng-template>
</p-table>

<p-paginator [totalRecords]="table.totalRecords" [first]="table.first" [rows]="table.rows"
    [pageLinkSize]="table.pageLinks" [rowsPerPageOptions]="table.rowsPerPageOptions"
    (onPageChange)="onPageChange($event)"></p-paginator>
