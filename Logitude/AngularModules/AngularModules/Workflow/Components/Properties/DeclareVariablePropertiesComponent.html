<style>
    .table-row {
        height: 1px;
    }

    .first-split-table-row {
        height: 20px;
    }

    .table-row-cell {
        padding-bottom: 10px;
    }

    .split-block {
        border-bottom: 1px solid #6E6E6E;
    }

    .table-row-cell-block {
        padding-left: 10px;
        padding-right: 10px;
    }

    .input-container {
        width: 320px;
        height: 30px;
    }

    .variable-type-row-cell {
        width: 345px;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-table-row">
        <td class="table-row-cell" colspan="2">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell" colspan="2">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Name'" [ObjectFieldName]="'VariableName'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block input-container">
                <LogTextBox [NoObjectField]="true" [IsFreeText]="true" [DataContext]="DataContext" [Text]="VariableName"
                    [NoValidation]="true" [HideColumns]="true" [ObjectFieldName]="'VariableName'"
                    (ValueChanged)="updateVariableName($event)" [DataCy]="'variable-name'">
                </LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell variable-type-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Data Type'" [ObjectFieldName]="'VariableType'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block input-container">
                <ComboBox [ItemsSource]="DataTypesItems" [Binding]="'Name'"
                    [SelectedItem]="VariableType | ListItemPipe : DataTypesItems"
                    (SelectedItemChanged)="updateVariableType($event ? $event.Code : null)" [ListType]="''"
                    [IsDisabled]="!IsNew">
                </ComboBox>
            </div>
        </td>

        <td class="table-row-cell">
            <div>
                <CheckBox [IsChecked]="IsCollectionVariable" [Text]="'Allow multiple values (Array)'" [Top]="10"
                    [IsEnabled]="IsNew" [DataCy]="'is-collection-variable'"
                    (Checked)="updateIsCollectionVariable($event)"></CheckBox>
            </div>
        </td>
    </tr>

    <tr *ngIf="VariableType && VariableType !== FieldTypes.Record && !IsCollectionVariable" class="table-row">
        <td class="table-row-cell" colspan="2">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Default Value'" [ObjectFieldName]="'VariableValue'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block input-container">
                <FieldValue *ngIf="VariableTypeChangedToggle" [Name]="'defaultValue'" [DataType]="VariableType"
                    [CurrentValue]="VariableValue" (ValueChanged)="updateVariableValue($event)">
                </FieldValue>
                <FieldValue *ngIf="!VariableTypeChangedToggle" [Name]="'defaultValue'" [DataType]="VariableType"
                    [CurrentValue]="VariableValue" (ValueChanged)="updateVariableValue($event)">
                </FieldValue>
            </div>
        </td>
    </tr>

    <tr *ngIf="VariableType && VariableType === FieldTypes.Record" class="table-row">
        <td class="table-row-cell" colspan="2">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Object'" [ObjectFieldName]="'RecordType'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block input-container">
                <TreeSelect [Items]="EntitiesTreeItems" [Width]="'300px'" [Value]="RecordType" [ShowExpand]="false"
                    [ShowItem]="'DeclareVariable' | ShowEntitiesTreeItemPipe" [IsDisabled]="!IsNew"
                    (ValueChanged)="updateRecordType($event)">
                </TreeSelect>
            </div>
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <div></div>
        </td>
    </tr>

</table>
