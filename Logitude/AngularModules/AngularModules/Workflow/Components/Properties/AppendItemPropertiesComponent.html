<style>
    .table-row {
        height: 1px;
    }

    .first-split-table-row {
        height: 20px;
    }

    .table-row-cell {
        padding-bottom: 10px;
    }

    .split-block {
        border-bottom: 1px solid #6E6E6E;
    }

    .table-row-cell-block {
        padding-left: 10px;
        padding-right: 10px;
    }

    .name-container {
        height: 30px;
        width: 320px;
    }

    .table-container {
        overflow: auto;
        height: 420px;
        pointer-events: auto !important;
    }

    .label {
        font-weight: bold;
    }

    .table-row-cell-label {
        padding-bottom: 6px;
    }

    .table-row-cell-block {
        padding-left: 10px;
        padding-right: 10px;
    }

    .input-container {
        width: 320px;
        height: 30px;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Name'" [ObjectFieldName]="'Name'" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="table-row-cell-block name-container">
                <LogTextBox [NoObjectField]="true" [IsFreeText]="true" [DataContext]="DataContext" [Text]="Name"
                    [NoValidation]="true" [HideColumns]="true" [ObjectFieldName]="'Name'"
                    (ValueChanged)="updateName($event)" [DataCy]="'append-item-name'">
                </LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">Append to This Collection</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Collection'" [ObjectFieldName]="'Collection'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block">
                <TreeSelect [Items]="SingleEditableEntitiesTreeItems" [Width]="'300px'" [Value]="Collection"
                    [ShowItem]="'AppendItem' | ShowEntitiesTreeItemPipe" [IsReturnedTreeSelectItem]="true"
                    (ValueChanged)="updateCollection($event)">
                </TreeSelect>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr *ngIf="EntityId || DeclareType" class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">How to Set The Record Fields</div>
            </div>
        </td>
    </tr>

    <tr *ngIf="EntityId || DeclareType " class="table-row">
        <td class="table-row-cell">
            <div class="table-row-cell-block">
                <table>
                    <tr>
                        <td>
                            <RadioButton [Name]="'SetRecordFieldsTypeRadio'"
                                [IsChecked]="SetRecordFieldsType === SetRecordFieldsTypes.UseRecord"
                                (Checked)="updateSetRecordFieldsType(SetRecordFieldsTypes.UseRecord)"
                                [Text]="'Use value from variable'" [Top]="5"
                                [DataCy]="'set-record-fields-type-userecord'">
                            </RadioButton>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <RadioButton [Name]="'SetRecordFieldsTypeRadio'"
                                [IsChecked]="SetRecordFieldsType === SetRecordFieldsTypes.SetValues"
                                (Checked)="updateSetRecordFieldsType(SetRecordFieldsTypes.SetValues)"
                                [Text]="'Set value'" [Top]="5" [DataCy]="'set-record-fields-type-setvalues'">
                            </RadioButton>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr *ngIf="(EntityId || DeclareType) && SetRecordFieldsType === SetRecordFieldsTypes.UseRecord" class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr *ngIf="(EntityId || DeclareType) && SetRecordFieldsType === SetRecordFieldsTypes.UseRecord" class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">Select Variable to Append:</div>
            </div>
        </td>
    </tr>

    <tr *ngIf="EntityId && SetRecordFieldsType === SetRecordFieldsTypes.UseRecord" class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Variable'" [ObjectFieldName]="'Variable'"
                    [DataContext]="DataContext"></LogLabel>
            </div>

            <div class="table-row-cell-block">
                <TreeSelect *ngIf="CollectionChanged" [Items]="VariablesTreeItems" [Width]="'300px'" [Value]="Variable"
                    [ShowExpand]="false" [ShowItem]="Entity | ShowTreeItemPipe : 'type'"
                    [IsReturnedTreeSelectItem]="true" (ValueChanged)="updateVariable($event)">
                </TreeSelect>

                <TreeSelect *ngIf="!CollectionChanged" [Items]="VariablesTreeItems" [Width]="'300px'" [Value]="Variable"
                    [ShowExpand]="false" [ShowItem]="Entity | ShowTreeItemPipe : 'type'"
                    [IsReturnedTreeSelectItem]="true" (ValueChanged)="updateVariable($event)">
                </TreeSelect>
            </div>

        </td>
    </tr>

    <tr *ngIf="DeclareType && SetRecordFieldsType === SetRecordFieldsTypes.UseRecord" class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Variable'" [ObjectFieldName]="'Variable'"
                    [DataContext]="DataContext"></LogLabel>
            </div>

            <div class="table-row-cell-block">
                <TreeSelect *ngIf="CollectionChanged" [Items]="FlowVariablesTreeItems" [Width]="'300px'"
                    [Value]="Variable" [ShowItem]="DeclareType | ShowFlowVariablesTypeTreeItemPipe"
                    [IsReturnedTreeSelectItem]="true" (ValueChanged)="updateVariable($event)">
                </TreeSelect>

                <TreeSelect *ngIf="!CollectionChanged" [Items]="FlowVariablesTreeItems" [Width]="'300px'"
                    [Value]="Variable" [ShowItem]="DeclareType | ShowFlowVariablesTypeTreeItemPipe"
                    [IsReturnedTreeSelectItem]="true" (ValueChanged)="updateVariable($event)">
                </TreeSelect>
            </div>

        </td>
    </tr>

    <tr *ngIf="(EntityId || DeclareType) && SetRecordFieldsType === SetRecordFieldsTypes.SetValues" class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr *ngIf="(EntityId || DeclareType)  && SetRecordFieldsType === SetRecordFieldsTypes.SetValues" class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">{{SetValuesTitleText}}</div>
            </div>
        </td>
    </tr>

    <tr *ngIf="EntityId && SetRecordFieldsType === SetRecordFieldsTypes.SetValues" class="table-row">
        <td class="table-row-cell">
            <div class="table-container">

                <SetValues *ngIf="SetValues && SetValues.length > 0" [(SetValues)]="SetValues" [IsEntityField]="true"
                    [EntityId]="EntityId" (IsValidSetValuesChange)="setIsValidSetValues($event)"
                    [FlowObject]="FlowObject" [CurrentNodeId]="CurrentNodeId">
                </SetValues>

            </div>

        </td>
    </tr>

    <tr *ngIf="DeclareType && SetRecordFieldsType === SetRecordFieldsTypes.SetValues" class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Value'" [ObjectFieldName]="'Value'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-container input-container table-row-cell-block">
                <FieldValue *ngIf="CollectionChanged" [Name]="'defaultValue'" [DataType]="DeclareType"
                    [CurrentValue]="Value" (ValueChanged)="updateValue($event)">
                </FieldValue>
                <FieldValue *ngIf="!CollectionChanged" [Name]="'defaultValue'" [DataType]="DeclareType"
                    [CurrentValue]="Value" (ValueChanged)="updateValue($event)">
                </FieldValue>
            </div>

        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

</table>
