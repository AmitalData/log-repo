<style>
    .table-row {
        height: 1px;
    }

    .first-split-table-row {
        height: 20px;
    }

    .table-row-cell {
        padding-bottom: 10px;
    }

    .split-block {
        border-bottom: 1px solid #6E6E6E;
    }

    .table-row-cell-block {
        padding-left: 10px;
        padding-right: 10px;
    }

    .name-container {
        height: 30px;
        width: 320px;
    }

    .table-container {
        overflow: auto;
        height: 515px;
    }

    .padding-left-10 {
        padding-left: 10px;
    }

    .margin-left-0 {
        margin-left: 0;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <!-- Name -->
    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Name'" [ObjectFieldName]="'Name'" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="table-row-cell-block name-container">
                <LogTextBox [NoObjectField]="true" [IsFreeText]="true" [DataContext]="DataContext" [Text]="Name"
                    [NoValidation]="true" [HideColumns]="true" [ObjectFieldName]="'Name'"
                    (ValueChanged)="updateName($event)" [DataCy]="'name'">
                </LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <!-- variable values -->
    <tr class="table-row">
        <td class="table-row-cell">
            <div class="table-row-cell-block">
                <div class="set-variable-values">Set Variable Values</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td>
            <div class="table-container">



                <SetValues *ngIf="SetValues && SetValues.length > 0" [(SetValues)]="SetValues"
                    (IsValidSetValuesChange)="updateIsValidSetValues($event)" [FlowObject]="FlowObject"
                    [FlowObjectFields]="FlowObjectFields" [CurrentNodeId]="CurrentNodeId">
                </SetValues>



            </div>

        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row">
        <td>

            <FooterButtons [SaveButtonLabel]="'Ok'" (SaveButtonClicked)="saveButtonClicked()"
                (CancelButtonClicked)="cancelButtonClicked()" [SaveButtonDataCy]="'set-value-properties-save-button'"
                [CancelButtonDataCy]="'set-value-properties-cancel-button'"></FooterButtons>

        </td>
    </tr>

</table>
