<style>
    .link-button {
        cursor: pointer;
        color: #2b78e4;
        float: left;
    }

    .link-button .plus-sign {
        font-size: 13px;
        font-weight: bold;
        padding-right: 2px;
    }

    .link-button:hover {
        color: #03a9f4;
    }

    .table-row {
        height: 1px;
    }

    .table-row-cell {
        padding-bottom: 10px;
    }

    .split-block {
        border-bottom: 1px solid #6E6E6E;
    }

    .table-row-cell-block {
        padding-left: 10px;
        padding-right: 10px;
    }

    .select-entity-label {
        padding-bottom: 4px;
    }

    .entity-list-container {
        height: 30px;
    }

    .select-entity-label,
    .set-conditions-label,
    .select-trigger-label {
        font-weight: bold;
    }

    .entity-list-container,
    .trigger-radios-container {
        width: 320px;
    }

    .trigger-radio-cell {
        width: 80px;
    }

    .start-conditions-container {
        overflow: auto;
        width: 800px;
        height: 370px;
    }

    .min-start-conditions-container {
        height: 285px;
    }

    .footer-buttons-cell {
        vertical-align: bottom
    }

    .footer-buttons-table {
        height: 22px;
    }

    .footer-button-cell {
        width: 57px;
    }

    .footer-buttons-split {
        width: 5px;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="table-row-cell-block">
                <div class="select-entity-label">Select Object</div>
                <div>Select the object whose records trigger the flow when they're created or updated</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Object'" [ObjectFieldName]="'Object'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block entity-list-container">
                <LogLov [NoObjectField]="true" [ObjectFieldName]="EntityId" [DataContext]="DataContext"
                    [QueryFilterItems]="getObjectTablesQueryFilters()" [LookUpTableName]="'ObjectTable'"
                    [NoValidation]="true" [IsFreeText]="true" [SelectedValue]="EntityId" [HideColumns]="true"
                    [HideLastColumn]="true" [DisplayMemberPath]="'Name'" (SelectedItemChanged)="updateEntity($event)">
                </LogLov>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="table-row-cell-block">
                <div class="select-trigger-label">Configure Trigger</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Trigger the flow when'" [ObjectFieldName]="'Trigger'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block trigger-radios-container">
                <table>
                    <tr>
                        <td class="trigger-radio-cell">
                            <RadioButton [Name]="'TriggerRadio'" [IsChecked]="Trigger === 'create'"
                                (Checked)="updateTrigger('create')" [Text]="'A record is created'" [Top]="5">
                            </RadioButton>
                        </td>
                    </tr>
                    <tr>
                        <td class="trigger-radio-cell">
                            <RadioButton [Name]="'TriggerRadio'" [IsChecked]="Trigger === 'update'"
                                (Checked)="updateTrigger('update')" [Text]="'A record is updated'" [Top]="5">
                            </RadioButton>
                        </td>
                    </tr>
                    <tr>
                        <td class="trigger-radio-cell">
                            <RadioButton [Name]="'TriggerRadio'" [IsChecked]="Trigger === 'createOrUpdate'"
                                (Checked)="updateTrigger('createOrUpdate')" [Text]="'A record is created or updated'"
                                [Top]="5"></RadioButton>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="table-row-cell-block">
                <div class="set-conditions-label">Set Conditions</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td>
            <div class="table-row-cell-block start-conditions-container"
                [ngClass]="{'min-start-conditions-container': (ValidationErrorsList != null && ValidationErrorsList.length > 0)}">

                <div *ngIf="Conditions && Conditions.length === 0">
                    <span class="link-button" (click)="initializeCondition()">
                        <span class="plus-sign">+</span><span>Add Condition</span>
                    </span>
                </div>

                <Conditions *ngIf="Conditions && Conditions.length > 0" [EntityId]="EntityId"
                    [(ConditionsOperation)]="ConditionsOperation" [(Conditions)]="Conditions"></Conditions>

            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="footer-buttons-cell">
            <table class="footer-buttons-table">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td class="footer-button-cell">
                        <button class="Button" (click)="cancelButtonClicked()">Cancel</button>
                    </td>

                    <td class="footer-buttons-split">
                        <div></div>
                    </td>

                    <td class="footer-button-cell">
                        <button class="RedButton" (click)="saveButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
