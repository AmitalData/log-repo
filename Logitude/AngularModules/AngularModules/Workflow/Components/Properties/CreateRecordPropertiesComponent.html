<style>
    .link-button {
        cursor: pointer;
        color: #2b78e4;
        float: left;
    }

    .link-button .plus-sign {
        font-size: 13px;
        font-weight: bold;
        padding-right: 2px;
    }

    .link-button:not(.disabled):hover {
        color: #03a9f4;
    }

    .link-button.disabled {
        opacity: 0.5;
    }

    .table-row {
        height: 1px;
    }

    .first-split-table-row {
        height: 20px;
    }

    .table-row-cell {
        padding-bottom: 10px;
    }

    .split-block {
        border-bottom: 1px solid #6E6E6E;
    }

    .table-row-cell-block {
        padding-left: 10px;
        padding-right: 10px;
    }

    .name-input-container {
        width: 320px;
    }

    .label {
        font-weight: bold;
    }

    .table-row-cell-label {
        padding-bottom: 6px;
    }

    .entity-list-container {
        width: 320px;
        padding-top: 4px;
    }

    .table-container {
        overflow: auto;
        height: 400px;
        pointer-events: auto !important;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Name'" [ObjectFieldName]="'Name'" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="table-row-cell-block name-input-container">
                <LogTextBox [NoObjectField]="true" [IsFreeText]="true" [DataContext]="DataContext" [Text]="Name"
                    [NoValidation]="true" [HideColumns]="true" [ObjectFieldName]="'Name'"
                    (ValueChanged)="updateName($event)" [DataCy]="'create-record-name'">
                </LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">How Many Records to Create</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="table-row-cell-block records-limit-container">
                <table>
                    <tr>
                        <td>
                            <RadioButton [Name]="'RecordsLimitRadio'" [IsChecked]="RecordsLimit === 'One'"
                                (Checked)="updateRecordsLimit('One')" [Text]="'One'" [Top]="5"
                                [DataCy]="'records-limit-one'">
                            </RadioButton>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <RadioButton [Name]="'RecordsLimitRadio'" [IsChecked]="RecordsLimit === 'Multiple'"
                                (Checked)="updateRecordsLimit('Multiple')" [Text]="'Multiple'" [Top]="5"
                                [DataCy]="'records-limit-multiple'">
                            </RadioButton>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">Create Records of This Object</div>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div>
                <LogLabel [NoObjectField]="true" [Text]="'Object'" [ObjectFieldName]="'Object'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="table-row-cell-block entity-list-container">
                <TreeSelect [Items]="EntitiesTreeItems" [Width]="'300px'" [Value]="Entity"
                    [ShowItem]="'CreateRecord' | ShowEntitiesTreeItemPipe : true"
                    (ValueChanged)="updateEntity($event)">
                </TreeSelect>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr *ngIf="EntityId" class="table-row">
        <td class="table-row-cell-label">
            <div class="table-row-cell-block">
                <div class="label">Set Fields Values of {{Entity | EntityLabelPipe}}</div>
            </div>
        </td>
    </tr>

    <tr *ngIf="EntityId" class="table-row">
        <td class="table-row-cell">
            <div class="table-container">

                <SetValues *ngIf="SetValues && SetValues.length > 0" [(SetValues)]="SetValues" [IsEntityField]="true"
                    [EntityId]="EntityId" (IsValidSetValuesChange)="updateIsValidSetValues($event)"
                    [FlowObject]="FlowObject" [CurrentNodeId]="CurrentNodeId">
                </SetValues>

            </div>

        </td>
    </tr>


    <tr>
        <td>
            <div></div>
        </td>
    </tr>

</table>
