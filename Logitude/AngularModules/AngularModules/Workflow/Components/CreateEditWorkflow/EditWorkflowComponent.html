<style>
    .table-row {
        height: 1px;
    }

    .first-split-row {
        height: 10px;
    }

    .split-row {
        height: 20px;
    }

    .name-row,
    .owner-row {
        height: 50px;
    }

    .description-row {
        height: 85px;
    }

    .name-input-container,
    .description-input-container,
    .owner-input-container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .name-input-container,
    .owner-input-container {
        height: 30px;
    }

    .description-input-container {
        height: 65px;
    }

    .button-container {
        margin: 0px 2px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        width: 110px;
        margin-bottom: 5px;
        float: right;
    }

    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
        margin-left: 10px;
    }

    .margin-l-10 {
        margin-left: 10px;
    }

    .title {
        height: 20px;
    }

    .split-row {
        height: 30px;
    }

    .clickable {
        cursor: pointer;
    }

    .field-name {
        width: 130px;
        padding-left: 10px;
    }

    .title-width {
        width: 180px;
        min-width: 180px;
    }
    .margin-5{
        margin: 5px;
    }
</style>

<div class="MediaFillAbsolute workflow-builder-wrapper">
    <div class="MarginAbsolute10">
        <table *ngIf="EntityPM">
            <tr class="table-row">
                <td></td>
            </tr>

            <tr>
                <td>
                    <div class="MediaFill CurvedArea">
                        <table class="margin-5">
                            <!-- Name -->
                            <tr class="FormFieldRow">
                                <td style="width:110px;">
                                    <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:260px;">
                                    <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                                        [HideColumns]="true" [DataCy]="'Workflow_Name'">
                                    </LogTextBox>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <!-- Description -->
                            <tr class="FormFieldRow">
                                <td style="vertical-align:top;">
                                    <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td colspan="2">
                                    <table>
                                        <tr>
                                            <td style="width:260px;height:85px;">
                                                <div class="MediaFill">
                                                    <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description"
                                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                                                        [IsMultiline]="true" [HideColumns]="true"
                                                        [DataCy]="'Workflow_Description'">
                                                    </LogTextBox>
                                                </div>
                                            </td>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Owner-->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName"
                                        [SelectedValue]="OwnerId" [DataContext]="DataContext" [LookUpTableName]="'User'"
                                        [HideColumns]="true" [DataCy]="'Workflow_Owner'"></LogLov>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="split-row">
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="title clickable" (click)="showAdvancedSettings()">
                                <td class="title-width">
                                    <div class="SectionTitle">
                                        Advanced Settings
                                    </div>
                                </td>
                            </tr>

                            <tr class="FormFieldRow" *ngIf="ShowAdvancedSettings">
                                <td class="field-name">
                                    <LogLabel [ObjectFieldName]="'RetriesNumber'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext">
                                    </LogLabel>
                                </td>

                                <td style="width:230px;">
                                    <LogTextBox [ObjectFieldName]="'RetriesNumber'" [Text]="RetriesNumber"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td >
                                    <HelpIcon [HideHeader]="true" [Text]="'Number of retries once the flow fails'"></HelpIcon>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="FormFieldRow" *ngIf="ShowAdvancedSettings">
                                <td class="field-name">
                                    <LogLabel [ObjectFieldName]="'RetriesDelay'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext">
                                    </LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="'RetriesDelay'" [Text]="RetriesDelay"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td>
                                    <HelpIcon [HideHeader]="true" [Text]="'Waiting time before each retry'"></HelpIcon>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <div></div>
                                </td>
                            </tr>

                        </table>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>
