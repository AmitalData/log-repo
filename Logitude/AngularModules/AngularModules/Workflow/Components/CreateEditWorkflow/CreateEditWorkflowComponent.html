<table *ngIf="EntityPM">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:50px;">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div style="padding-left:10px;padding-right:10px;height:30px;">
                <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr style="height:20px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:85px;">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div style="padding-left:10px;padding-right:10px;height:65px;">
                <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr style="height:20px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:50px;">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div style="padding-left:10px;padding-right: 10px;height:30px;">
                <LogLov [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [SelectedValue]="OwnerId"
                    [DataContext]="DataContext" [LookUpTableName]="'User'" [HideColumns]="true"></LogLov>
            </div>
        </td>
    </tr>


    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="cancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button *ngIf="IsNewEntity" class="RedButton" (click)="saveButtonClicked()">Create</button>
                        <button *ngIf="!IsNewEntity" class="RedButton" (click)="saveButtonClicked()">Save</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="WidthBusyIndicator"></BusyIndicator>
