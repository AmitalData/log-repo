<style>
    .table-row {
        height: 1px;
    }

    .first-split-row {
        height: 10px;
    }

    .split-row {
        height: 20px;
    }

    .name-row,
    .owner-row {
        height: 50px;
    }

    .description-row {
        height: 85px;
    }

    .name-input-container,
    .description-input-container,
    .owner-input-container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .name-input-container,
    .owner-input-container {
        height: 30px;
    }

    .description-input-container {
        height: 65px;
    }

    .Additional-row {
        height: 85px;
    }

    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
        margin-left: 10px;
    }

    .FormFieldRow {
        height: 32px;
    }

    .clickable {
        cursor: pointer;
    }

    .field-name {
        width: 130px;
    }

    .field-input {
        width: 230px;
    }

    .padding-l-5 {
        padding-left: 5px;
    }

    .sub-title {
        margin: 5px 0 5px 10px;
        color: #45494A;
    }
</style>

<table *ngIf="EntityPM">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="name-row">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="name-input-container">
                <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [HideColumns]="true" [DataCy]="'Workflow_Name'"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="description-row">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="description-input-container">
                <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [HideColumns]="true" [DataCy]="'Workflow_Description'"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="owner-row">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="owner-input-container">
                <LogLov [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [SelectedValue]="OwnerId"
                    [DataContext]="DataContext" [LookUpTableName]="'User'" [HideColumns]="true"
                    [DataCy]="'Workflow_Owner'"></LogLov>
            </div>
        </td>
    </tr>

    <tr class="split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row clickable" (click)="showAdvancedSettings()">
        <td>
            <div class="SectionTitle">
                {{AdvancedSettingsTitle}}
            </div>
        </td>
    </tr>

    <tr class="Additional-row" *ngIf="ShowAdvancedSettings">
        <td>
            <div>
                <table>
                    <tr class="table-row">
                        <td>
                            <div class="Label sub-title">
                                Recovery Settings
                            </div>
                        </td>
                    </tr>
                    <tr class="FormFieldRow">
                        <td class="field-name">
                            <LogLabel [ObjectFieldName]="'RetriesNumber'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext" [Text]="'Number of Retries'"></LogLabel>
                        </td>

                        <td class="field-input">
                            <LogTextBox [ObjectFieldName]="'RetriesNumber'" [Text]="RetriesNumber"
                                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true"
                                [HideColumns]="true"></LogTextBox>
                        </td>
                        <td class="padding-l-5">
                            <HelpIcon [HideHeader]="true" [Text]="'Number of retries once the flow fails'"></HelpIcon>
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
                <table>
                    <tr class="table-row">
                        <td>
                            <div class="Label sub-title">
                                Waiting time before each retry (minutes)
                            </div>
                        </td>
                    </tr>

                    <ng-container *ngFor="let delay of RetriesDelayArray; let i = index; trackBy: trackByFn">
                        <tr *ngIf="i % 2 == 0">
                            <td *ngFor="let currentIndex of [i, i+1]">
                                <div *ngIf="currentIndex < SelectedRetryNumber">
                                    <table>
                                        <tr class="FormFieldRow">
                                            <td class="field-name">
                                                <LogLabel [ObjectFieldName]="'RetriesDelay'+currentIndex"
                                                    [NoObjectField]="true" [ObjectTableName]="ObjectTableName"
                                                    [DataContext]="DataContext"
                                                    [Text]="'Retry No. '+ (currentIndex + 1) "></LogLabel>
                                            </td>

                                            <td class="field-input">
                                                <LogTextBox [NoObjectField]="true" [ObjectTableName]="ObjectTableName"
                                                    [ObjectFieldName]="'RetriesDelay' + currentIndex"
                                                    [IsFreeText]="true" [DataContext]="DataContext"
                                                    [Text]="RetriesDelayArray[currentIndex]" [InputType]="'integer'"
                                                    [HideColumns]="true" [HideLastColumn]="true"
                                                    (ValueChanged)="updateRetriesDelayValue($event , currentIndex)">
                                                </LogTextBox>
                                            </td>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </td>
                        </tr>
                    </ng-container>
                </table>
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row">
        <td>

            <FooterButtons [SaveButtonLabel]="'Create'" (SaveButtonClicked)="saveButtonClicked()"
                (CancelButtonClicked)="cancelButtonClicked()" [SaveButtonDataCy]="'workflow-save-button'"
                [CancelButtonDataCy]="'workflow-cancel-button'">
            </FooterButtons>

        </td>
    </tr>

</table>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
