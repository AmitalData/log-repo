<style>
    .table-row {
        height: 1px;
    }

    .first-split-row {
        height: 10px;
    }

    .split-row {
        height: 20px;
    }

    .name-row,
    .owner-row {
        height: 50px;
    }

    .description-row {
        height: 85px;
    }

    .name-input-container,
    .description-input-container,
    .owner-input-container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .name-input-container,
    .owner-input-container {
        height: 30px;
    }

    .description-input-container {
        height: 65px;
    }

    .Additional-row {
        height: 85px;
    }

    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
        margin-left: 10px;
    }

    .margin-l-10 {
        margin-left: 10px;
    }

    .FormFieldRow {
        height: 32px;
    }

    .title {
        height: 20px;
    }

    .clickable {
        cursor: pointer;
    }

    .field-name {
        width: 130px;
        padding-left: 10px;
    }
</style>

<table *ngIf="EntityPM">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="name-row">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="name-input-container">
                <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [HideColumns]="true" [DataCy]="'Workflow_Name'"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="description-row">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="description-input-container">
                <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [HideColumns]="true" [DataCy]="'Workflow_Description'"></LogTextBox>
            </div>
        </td>
    </tr>

    <tr class="split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="owner-row">
        <td>
            <div>
                <LogLabel [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext">
                </LogLabel>
            </div>
            <div class="owner-input-container">
                <LogLov [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [SelectedValue]="OwnerId"
                    [DataContext]="DataContext" [LookUpTableName]="'User'" [HideColumns]="true"
                    [DataCy]="'Workflow_Owner'"></LogLov>
            </div>
        </td>
    </tr>

    <tr class="split-row">
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="title clickable" (click)="showAdvancedSettings()" *ngIf="!ShowAdvancedSettings">
        <td>
            <div class="SectionTitle">
                Show Advanced Settings
            </div>
        </td>
    </tr>

    <tr class="title" *ngIf="ShowAdvancedSettings">
        <td>
            <div class="SectionTitle">
                Advanced Settings
            </div>
            <div class="Label margin-l-10">
                Workflow retry policy:
            </div>
        </td>
    </tr>

    <tr class="Additional-row" *ngIf="ShowAdvancedSettings">
        <td>
            <div>
                <table>
                    <tr class="FormFieldRow">
                        <td class="field-name">
                            <LogLabel [ObjectFieldName]="'RetriesNumber'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="width:230px;">
                            <LogTextBox [ObjectFieldName]="'RetriesNumber'" [Text]="RetriesNumber"
                                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                        </td>
                        <td style="width: 18px; float:left;">
                            <HelpIcon [HideHeader]="true" [Text]="'Number of retries once the flow fails'"></HelpIcon>
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr class="FormFieldRow">
                        <td class="field-name">
                            <LogLabel [ObjectFieldName]="'RetriesDelay'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td>
                            <LogTextBox [ObjectFieldName]="'RetriesDelay'" [Text]="RetriesDelay"
                                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                        </td>
                        <td style="width: 18px; float:left;">
                            <HelpIcon [HideHeader]="true" [Text]="'Waiting time before each retry'"></HelpIcon>
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </div>

        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row">
        <td>

            <FooterButtons [SaveButtonLabel]="IsNewEntity ? 'Create' : 'Save'" (SaveButtonClicked)="saveButtonClicked()"
                (CancelButtonClicked)="cancelButtonClicked()" [SaveButtonDataCy]="'workflow-save-button'"
                [CancelButtonDataCy]="'workflow-cancel-button'">
            </FooterButtons>

        </td>
    </tr>

</table>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
