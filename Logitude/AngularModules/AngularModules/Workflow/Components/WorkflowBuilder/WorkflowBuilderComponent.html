<style>
    .workflow-builder-component-container {
        width: 100%;
        height: 100%;
    }
</style>

<div class="MediaFillAbsolute" style="background: white;">
    <div class="MarginAbsolute10">
        <table>

            <tr style="height: 1px;">
                <td>
                    <table>
                        <tr>
                            <td style="width:10px">
                                <div></div>
                            </td>

                            <td style="width: 1px;">
                                <BackButton [Text]="BackButtonLable" (click)="backButtonClicked()"></BackButton>
                            </td>

                            <td style="width:10px">
                                <div></div>
                            </td>

                            <td style="width:1px;">
                                <div class="TabTitleRow TextTrimming">
                                    {{WorkflowName}}
                                </div>
                            </td>

                            <td style="width:10px">
                                <div></div>
                            </td>

                            <td style="width:20px;float:left;padding-top:2px">
                                <IconButton [Name]="'Edit'" [Title]="'Edit Workflow'" (click)="editWorkflowClicked()">
                                </IconButton>
                            </td>

                            <td>
                                <div></div>
                            </td>

                            <td style="float:right;width:60px;">
                                <table>
                                    <tr>
                                        <td style="width: 55px;">

                                            <button *ngIf="!HasChanges" class="Button" style="width:60px"
                                                (click)="saveWorkflow()">
                                                <img [ngStyle]="{'margin-left': '2px'}" style="width:13px"
                                                    src="./Images/Buttons/Save.png" [className]="'CenterCenter'" />
                                                <span style="line-height: 19px;vertical-align:middle;"
                                                    [ngStyle]="{'margin-left': '3px'}">Save</span>
                                            </button>

                                            <button *ngIf="HasChanges" class="EntityChangesButton" style="width:60px"
                                                (click)="saveWorkflow()">
                                                <img src="./Images/Buttons/Save.Red.png" style="width:13px"
                                                    [className]="'CenterCenter'" [ngStyle]="{'margin-left': '2px'}" />
                                                <span style="line-height: 19px;vertical-align:middle;"
                                                    [ngStyle]="{'margin-left': '3px'}">Save</span>
                                            </button>

                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr style="height: 5px;">
                <td></td>
            </tr>

            <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                <td>
                    <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="MediaFill CurvedArea">
                        <div #workflowBuilderComponentContainer class="workflow-builder-component-container"></div>
                    </div>
                </td>
            </tr>


        </table>
    </div>
</div>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
