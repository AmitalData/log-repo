<style>
    .workflow-builder-wrapper {
        background: white;
    }

    .workflow-builder-component-container {
        width: 100%;
        height: 100%;
    }

    .table-row {
        height: 1px;
    }

    .table-row-cell {
        width: 10px;
    }

    .edit-workflow-button-cell {
        float: left;
    }

    .save-workflow-button-cell {
        float: right;
        width: 60px;
    }

    .save-button-icon {
        margin-left: 2px;
        width: 13px;
    }

    .save-button-label {
        line-height: 19px;
        vertical-align: middle;
        margin-left: 3px;
    }

    .back-button-cell {
        vertical-align: top;
    }
</style>

<div class="MediaFillAbsolute workflow-builder-wrapper">
    <div class="MarginAbsolute10">
        <table>

            <tr class="table-row">
                <td>
                    <table>
                        <tr>
                            <td class="table-row-cell">
                                <div></div>
                            </td>

                            <td class="table-row-cell back-button-cell">
                                <BackButton [Text]="BackButtonLable" (click)="backButtonClicked()"></BackButton>
                            </td>

                            <td class="table-row-cell">
                                <div></div>
                            </td>

                            <td class="table-row-cell">
                                <div class="TabTitleRow TextTrimming">
                                    {{WorkflowName}}
                                </div>
                            </td>

                            <td class="table-row-cell">
                                <div></div>
                            </td>

                            <td class="table-row-cell edit-workflow-button-cell">
                                <IconButton [Name]="'Edit'" [Title]="'Edit Workflow'" (click)="editWorkflowClicked()">
                                </IconButton>
                            </td>

                            <td>
                                <div></div>
                            </td>

                            <td class="save-workflow-button-cell">
                                <table>
                                    <tr>
                                        <td>

                                            <button *ngIf="!HasChanges" class="Button" (click)="saveWorkflow()"
                                                data-cy="save-workflow-changes-button">
                                                <img src="./Images/Buttons/Save.png"
                                                    class="save-button-icon CenterCenter" />
                                                <span class="save-button-label">Save</span>
                                            </button>

                                            <button *ngIf="HasChanges" class="EntityChangesButton"
                                                (click)="saveWorkflow()" data-cy="save-workflow-changes-button">
                                                <img src="./Images/Buttons/Save.Red.png"
                                                    class="save-button-icon CenterCenter" />
                                                <span class="save-button-label">Save</span>
                                            </button>

                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr class="table-row">
                <td></td>
            </tr>

            <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
                <td>
                    <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="MediaFill CurvedArea">
                        <div #workflowBuilderComponentContainer class="workflow-builder-component-container"></div>
                    </div>
                </td>
            </tr>


        </table>
    </div>
</div>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
