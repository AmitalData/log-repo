<style>
    .table-row {
        height: 1px;
    }

    .first-split-table-row {
        height: 20px;
    }

    .table-row-cell {
        padding-bottom: 8px;
    }

    .split-block {
        border-bottom: 1px solid #6E6E6E;
    }

    .expression-label .Label {
        color: black !important;
        font-size: 12px !important;
    }

    .expression-container {
        border: 1px solid black;
        height: 252px;
    }

    .expression-container:focus {
        border: 1px #1e88e5 solid;
    }

    .functions-header {
        background: lightgray;
        padding-bottom: 5px;
    }

    .functions-label {
        margin-bottom: 5px;
    }

    .functions-container {
        display: flex;
        margin-left: 10px;
    }

    .expression-category-dropdown {
        width: 100px;
    }

    .expression-tree {
        width: 360px;
    }

    .resources-tree {
        width: 220px;
        margin-left: 10px;
    }

    .expression-textarea {
        height: 200px;
        border-radius: 0px;
        font-size: 13px;
        font-weight: bold;
    }

    .check-Syntax-btn {
        width: 120px;
        background: white;
        font-size: 14px;
        border: 2px solid black;
    }

    .item-container {
        display: flex;
        flex-direction: column;
        padding: 2px;
    }

    .item-title {
        font-size: 11px;
        font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
        font-weight: 400;
        font-style: normal;
        color: black;
        height: 16px;
    }

    .item-description {
        font-size: 11px;
        font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
        font-weight: 400;
        font-style: normal;
        color: dimgrey;
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="first-split-table-row">
        <td class="table-row-cell">
            <div class="split-block"></div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="expression-label">
                <LogLabel [NoObjectField]="true" [Text]="'Expression'" [ObjectFieldName]="'Expression'"
                    [DataContext]="DataContext"></LogLabel>
            </div>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="expression-container">
                <div class="functions-header">
                    <div class="functions-label">
                        <LogLabel [NoObjectField]="true" [Text]="'Functions'" [ObjectFieldName]="'Expression'"
                            [DataContext]="DataContext"></LogLabel>
                    </div>
                    <div class="functions-container">
                        <div class="expression-category-dropdown">
                            <ComboBox [ItemsSource]="ExpressionCategoryList" [Binding]="'Name'"
                                [SelectedItem]="SelectedCategory"
                                (SelectedItemChanged)="updateExpressionCategory($event)" [ListType]="''"
                                [CyData]="'expression'">
                            </ComboBox>
                        </div>
                        <div class="expression-tree">
                            <TreeSelect *ngIf="SelectedCategoryChanged" [Items]="ExpressionFunctionTreeItems"
                                [Width]="'360px'" [SetSelectedValue]="false" [IsReturnedTreeSelectItem]="true"
                                [AllowClear]="false" [DisplayTitle]="false" [ShowExpand]="false"
                                [Template]="expressionTemplate" (ValueChanged)="updateExpression($event)"
                                [ShowItem]="SelectedCategoryCode | ShowExpressionTreeItemPipe">
                            </TreeSelect>
                            <TreeSelect *ngIf="!SelectedCategoryChanged" [Items]="ExpressionFunctionTreeItems"
                                [Width]="'360px'" [SetSelectedValue]="false" [IsReturnedTreeSelectItem]="true"
                                [AllowClear]="false" [DisplayTitle]="false" [ShowExpand]="false"
                                [Template]="expressionTemplate" (ValueChanged)="updateExpression($event)"
                                [ShowItem]="SelectedCategoryCode | ShowExpressionTreeItemPipe">
                            </TreeSelect>
                            <ng-template #expressionTemplate let-item>
                                <div class="item-container">
                                    <div class="item-title">{{ item.title }}</div>
                                    <div class="item-description">{{ item.origin.data.Description }}</div>
                                </div>
                            </ng-template>
                        </div>
                        <div class="resources-tree">
                            <TreeSelect [Items]="FlowVariablesTreeItems" [Width]="'220px'" [SetSelectedValue]="false"
                                (ValueChanged)="updateResources($event)" [AllowClear]="false" [DisplayTitle]="false">
                            </TreeSelect>
                        </div>
                    </div>
                </div>
                <textarea class="expression-textarea" id="ETextArea" (click)="setCurserPoints($event)"
                    [(ngModel)]='ExpressionTextArea' (ngChange)='updateExpressionTextArea($event.Value)'></textarea>
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div>
                <button class="check-Syntax-btn" (click)="checkSyntax()">check Syntax</button>
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row">
        <td>
            <FooterButtons [SaveButtonLabel]="'Ok'" (SaveButtonClicked)="saveButtonClicked()"
                (CancelButtonClicked)="cancelButtonClicked()" [SaveButtonDataCy]="'expression-save-button'"
                [CancelButtonDataCy]="'expression-cancel-button'">
            </FooterButtons>
        </td>
    </tr>
</table>
