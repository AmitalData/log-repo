<style>
    .link-button {
        cursor: pointer;
        color: #2b78e4;
        float: left;
    }

    .link-button .plus-sign {
        font-size: 13px;
        font-weight: bold;
        padding-right: 2px;
    }

    .link-button:not(.disabled):hover {
        color: #03a9f4;
    }

    .link-button.disabled {
        opacity: 0.5;
    }

    .group-row,
    .condition-row {
        display: table;
    }

    .group-operation-container {
        display: table-cell;
        vertical-align: middle;
        width: 70px;
        padding-right: 10px;
        border-right: 1px solid #808080;
    }

    .group-conditions-container {
        display: table-cell;
    }

    .delete-condition-container {
        display: table-cell;
        vertical-align: middle;
        width: 18px;
    }

    .condition-field-container {
        display: table-cell;
        vertical-align: middle;
        width: 180px;
        padding-right: 10px;
    }

    .condition-operator-container {
        display: table-cell;
        vertical-align: middle;
        width: 100px;
        padding-right: 10px;
    }

    .condition-value-container {
        display: table-cell;
        vertical-align: middle;
        width: 180px;
    }

    .condition-container {
        margin-bottom: 10px;
    }

    .add-buttons-container {
        margin-top: 12px;
        margin-left: 18px;
    }

    .add-group-button {
        margin-left: 18px;
    }

    .padding-left-10 {
        padding-left: 10px;
    }

    .conditions-container {
        margin-top: 10px;
    }

    .delete-condition-button {
        display: none;
        cursor: pointer;
    }

    .condition-row:hover .delete-condition-button {
        display: block;
    }

    .margin-left-0 {
        margin-left: 0;
    }
</style>


<ul class="conditions-container">
    <li *ngFor="let Condition of Conditions; let conditionIndex = index; let isLastCondition = last"
        class="condition-container">


        <div class="group-row">

            <div *ngIf="Condition.isGroup" class="group-operation-container">

                <ComboBox [ItemsSource]="ConditionOperations" [Binding]="'Name'"
                    [SelectedItem]="ListItem(Condition.groupOperation)"
                    (SelectedItemChanged)="updateConditionGroupOperation($event.Code, conditionIndex)"
                    [CyData]="'ConditionOperation_' + Condition.id">
                </ComboBox>

            </div>


            <div class="group-conditions-container" [ngClass]="{'padding-left-10': Condition.isGroup}">

                <div class="condition-row">

                    <div class="delete-condition-container">
                        <img class="delete-condition-button" src="./Images/Trash-can.png"
                            (click)="deleteCondition(conditionIndex, Condition.isGroup)"
                            [attr.data-cy]="'DeleteConditionButton_' + Condition.id" />
                    </div>

                    <div class="condition-field-container">

                        <LogLov [NoObjectField]="true" [ObjectFieldName]="'ConditionField_' + Condition.id"
                            [DataContext]="DataContext" [QueryFilterItems]="getObjectFieldsQueryFilters()"
                            [IsFreeText]="true" [LookUpTableName]="'ObjectField'" [NoValidation]="true"
                            [SelectedValue]="Condition.fieldCode" [HideColumns]="true"
                            [DisplayMemberPath]="'FullNameTextCodeDefaultText'"
                            (SelectedItemChanged)="updateConditionField($event, conditionIndex)"
                            [DataCy]="'ConditionField_' + Condition.id">
                        </LogLov>

                    </div>

                    <div class="condition-operator-container">

                        <ComboBox [ItemsSource]="ConditionOperators[Condition.type] || ConditionOperators['default']"
                            [Binding]="'Name'" [SelectedItem]="ListItem(Condition.operator)"
                            (SelectedItemChanged)="updateConditionOperator($event.Code, conditionIndex)"
                            [CyData]="'ConditionOperator_' + Condition.id">
                        </ComboBox>

                    </div>

                    <div *ngIf="!isNoValueOperator(Condition.operator)" class="condition-value-container">

                        <FieldValue *ngIf="Condition.fieldChangedToggle && ObjectFields[Condition.fieldCode]"
                            [ObjectField]="ObjectFields[Condition.fieldCode]" [Name]="'ConditionValue_' + Condition.id"
                            [CurrentValue]="Condition.value"
                            (ValueChanged)="updateConditionValue($event, conditionIndex)">
                        </FieldValue>

                        <FieldValue *ngIf="!Condition.fieldChangedToggle && ObjectFields[Condition.fieldCode]"
                            [ObjectField]="ObjectFields[Condition.fieldCode]" [Name]="'ConditionValue_' + Condition.id"
                            [CurrentValue]="Condition.value"
                            (ValueChanged)="updateConditionValue($event, conditionIndex)">
                        </FieldValue>

                    </div>


                    <div *ngIf="isNoValueOperator(Condition.operator)" class="condition-value-container">

                        <ComboBox [ItemsSource]="BooleanItems" [Binding]="'Name'"
                            [SelectedItem]="ListItem(Condition.value)"
                            (SelectedItemChanged)="updateConditionValue($event.Code, conditionIndex)"
                            [CyData]="'ConditionValue_' + Condition.id">
                        </ComboBox>

                    </div>

                </div>

                <ConditionGroups *ngIf="Condition.isGroup && Condition.conditions && Condition.conditions.length > 0"
                    [EntityId]="EntityId" [ShowChangedOperator]="ShowChangedOperator"
                    [(Conditions)]="Condition.conditions" [IsValidConditions]="IsValidConditions"
                    [IsRootConditions]="false" (ConditionsChangedEvent)="emitConditionsChanged($event)"
                    [ConditionsCounter]="ConditionsCounter">
                </ConditionGroups>

                <div *ngIf="Condition.isGroup" class="add-buttons-container">
                    <span class="link-button add-condition-button" [ngClass]="{'disabled': !IsValidConditions}"
                        (click)="addCondition(conditionIndex, false)"
                        [attr.data-cy]="'AddConditionButton_' + Condition.id">
                        <span class="plus-sign">+</span><span>Add Condition</span>
                    </span>
                    <span class="link-button add-group-button" [ngClass]="{'disabled': !IsValidConditions}"
                        (click)="addCondition(conditionIndex, true)" [attr.data-cy]="'AddGroupButton_' + Condition.id">
                        <span class="plus-sign">+</span><span>Add Group</span>
                    </span>
                </div>

            </div>


        </div>

        <div *ngIf="IsRootConditions && isLastCondition" class="add-buttons-container margin-left-0">
            <span class="link-button add-condition-button" [ngClass]="{'disabled': !IsValidConditions}"
                (click)="addCondition(null, false)" [attr.data-cy]="'AddRootConditionButton'">
                <span class="plus-sign">+</span><span>Add Condition</span>
            </span>
            <span class="link-button add-group-button" [ngClass]="{'disabled': !IsValidConditions}"
                (click)="addCondition(null, true)" [attr.data-cy]="'AddRootGroupButton'">
                <span class="plus-sign">+</span><span>Add Group</span>
            </span>
        </div>

    </li>
</ul>
