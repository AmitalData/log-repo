<style>
    .link-button {
        cursor: pointer;
        color: #2b78e4;
        float: left;
    }

    .link-button .plus-sign {
        font-size: 13px;
        font-weight: bold;
        padding-right: 2px;
    }

    .link-button:not(.disabled):hover {
        color: #03a9f4;
    }

    .link-button.disabled {
        opacity: 0.5;
    }

    .group-row,
    .condition-row {
        display: table;
    }

    .condition-row {
        height: 25px;
    }

    .group-operation-container {
        display: table-cell;
        vertical-align: middle;
        width: 70px;
        padding-right: 5px;
        border-right: 1px solid #808080;
    }

    .group-conditions-container {
        display: table-cell;
    }

    .delete-condition-container {
        display: table-cell;
        vertical-align: middle;
        width: 18px;
    }

    .condition-field-container {
        display: table-cell;
        vertical-align: middle;
        width: 300px;
        padding-right: 5px;
    }

    .condition-operator-container {
        display: table-cell;
        vertical-align: middle;
        width: 200px;
        padding-right: 5px;
    }

    .condition-value-container {
        display: table-cell;
        vertical-align: middle;
        width: 300px;
    }

    .condition-date-value-container {
        width: 210px !important;
    }

    .condition-value-expression-container {
        display: table-cell;
        vertical-align: middle;
        width: 90px;
        padding-right: 5px;
    }

    .condition-container {
        margin-bottom: 10px;
    }

    .add-buttons-container {
        margin-top: 12px;
        margin-left: 18px;
    }

    .add-group-button {
        margin-left: 18px;
    }

    .padding-left-10 {
        padding-left: 10px;
    }

    .conditions-container {
        margin-top: 10px;
    }

    .delete-condition-button {
        display: none;
        cursor: pointer;
    }

    .condition-row:hover .delete-condition-button {
        display: block;
    }

    .margin-left-0 {
        margin-left: 0;
    }

    .dummy-field-condition {
        width: 100%;
        height: 22px;
        font-size: 11px;
        color: #45494A;
        background: white;
        border: 1px solid #AAAAAA;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -webkit-box-shadow: inset 0 0 3px #aaaaaa;
        box-shadow: inset 0 0 3px #aaaaaa;
        vertical-align: middle;
        pointer-events: none;
        opacity: 0.6;
        padding-top: 2px;
        padding-left: 5px;
    }
</style>


<ul class="conditions-container">
    <li *ngFor="let Condition of Conditions; let conditionIndex = index; let isLastCondition = last"
        class="condition-container">


        <div class="group-row">

            <div *ngIf="Condition.isGroup" class="group-operation-container">

                <ComboBox [ItemsSource]="ConditionOperationsItems" [Binding]="'Name'"
                    [SelectedItem]="Condition.groupOperation | ListItemPipe"
                    (SelectedItemChanged)="updateConditionGroupOperation($event.Code, conditionIndex)" [ListType]="''"
                    [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'go'" [MaxHeight]="ComboBoxMaxHeight"
                    [CyData]="'ConditionOperation_' + Condition.id">
                </ComboBox>

            </div>


            <div class="group-conditions-container" [ngClass]="{'padding-left-10': Condition.isGroup}">

                <div class="condition-row">

                    <div *ngIf="!(AtLeastOneCondition && Conditions.length === 1)" class="delete-condition-container">
                        <img *ngIf="!(Condition.disabled | ConditionDisabledPipe : 'd')" class="delete-condition-button"
                            src="./Images/Trash-can.png" (click)="deleteCondition(conditionIndex, Condition.isGroup)"
                            [attr.data-cy]="'DeleteConditionButton_' + Condition.id" />
                    </div>

                    <div *ngIf="!IsDummyField" class="condition-field-container">

                        <TreeSelect *ngIf="IsEntityField" [Items]="ObjectFieldsTreeItems" [Width]="'300px'"
                            [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'f'"
                            [Value]="Condition.fieldCode" [IsReturnedTreeSelectItem]="true" [ShowExpand]="false"
                            (ValueChanged)="updateConditionEntityField($event, conditionIndex)"
                            [DataCy]="'ConditionField_' + Condition.id">
                        </TreeSelect>

                        <TreeSelect *ngIf="!IsEntityField" [Items]="FlowVariablesTreeItems" [Width]="'300px'"
                            [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'f'"
                            [Value]="Condition.fieldCode" [IsReturnedTreeSelectItem]="true"
                            (ValueChanged)="updateConditionField($event, conditionIndex)"
                            [DataCy]="'ConditionField_' + Condition.id">
                        </TreeSelect>

                    </div>

                    <div *ngIf="IsDummyField" class="condition-field-container">

                        <div class="dummy-field-condition">
                            {{Condition.field}}
                        </div>

                    </div>

                    <div class="condition-operator-container">

                        <ComboBox [ItemsSource]="Condition.type | ConditionOperatorsItemsPipe : ShowChangedOperator"
                            [Binding]="'Name'" [SelectedItem]="Condition.operator | ListItemPipe"
                            (SelectedItemChanged)="updateConditionOperator($event.Code, conditionIndex)" [ListType]="''"
                            [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'o'"
                            [MaxHeight]="ComboBoxMaxHeight" [CyData]="'ConditionOperator_' + Condition.id">
                        </ComboBox>

                    </div>


                    <div *ngIf="!(Condition.operator | IsNoValueOperatorPipe) && !(Condition.operator | IsFieldOperatorPipe) && (Condition.type | IsDateTimeTypePipe)"
                        class="condition-value-expression-container">

                        <ComboBox [ItemsSource]="DateTimeValueExpressionsItems" [Binding]="'Name'"
                            [SelectedItem]="Condition.valueExpression | ListItemPipe"
                            (SelectedItemChanged)="updateConditionValueExpression($event.Code, conditionIndex)"
                            [ListType]="''" [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 've'"
                            [MaxHeight]="ComboBoxMaxHeight" [CyData]="'ConditionValueExpression_' + Condition.id">
                        </ComboBox>

                    </div>


                    <div *ngIf="!(Condition.operator | IsNoValueOperatorPipe) && !(Condition.operator | IsFieldOperatorPipe)"
                        class="condition-value-container"
                        [ngClass]="{'condition-date-value-container': (Condition.type | IsDateTimeTypePipe)}">

                        <FieldValue *ngIf="Condition.fieldChangedToggle"
                            [ObjectField]="(Condition.fieldCode | IsNoObjectFieldVariablePipe) ? null : (Condition.fieldCode | ObjectFieldPipe)"
                            [DataType]="(Condition.fieldCode | IsNoObjectFieldVariablePipe) ? Condition.type : null"
                            [LookupType]="(Condition.fieldCode | IsNoObjectFieldVariablePipe) ? Condition.lookupType : null"
                            [Name]="'ConditionValue_' + Condition.id"
                            [IsIntegerNumberInput]="(Condition.type | IsDateTimeTypePipe) && Condition.valueExpression === DateTimeValueExpressions.PlusMinusToday"
                            [CurrentValue]="Condition.value"
                            [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'v'"
                            (ValueChanged)="updateConditionValue($event, conditionIndex)">
                        </FieldValue>

                        <FieldValue *ngIf="!Condition.fieldChangedToggle"
                            [ObjectField]="(Condition.fieldCode | IsNoObjectFieldVariablePipe) ? null : (Condition.fieldCode | ObjectFieldPipe)"
                            [DataType]="(Condition.fieldCode | IsNoObjectFieldVariablePipe) ? Condition.type : null"
                            [LookupType]="(Condition.fieldCode | IsNoObjectFieldVariablePipe) ? Condition.lookupType : null"
                            [Name]="'ConditionValue_' + Condition.id"
                            [IsIntegerNumberInput]="(Condition.type | IsDateTimeTypePipe) && Condition.valueExpression === DateTimeValueExpressions.PlusMinusToday"
                            [CurrentValue]="Condition.value"
                            [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'v'"
                            (ValueChanged)="updateConditionValue($event, conditionIndex)">
                        </FieldValue>

                    </div>

                    <div *ngIf="!(Condition.operator | IsNoValueOperatorPipe) && (Condition.operator | IsFieldOperatorPipe) && IsEntityFieldValue"
                        class="condition-value-container">

                        <TreeSelect *ngIf="Condition.fieldChangedToggle" [Items]="ObjectFieldsTreeItems"
                            [Width]="'300px'" [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'v'"
                            [Value]="Condition.valueCode" [ShowItem]="Condition | ShowFlowVariablesTreeItemPipe"
                            [IsReturnedTreeSelectItem]="true" [ShowExpand]="false"
                            (ValueChanged)="updateConditionFieldValue($event, conditionIndex)"
                            [DataCy]="'ConditionFieldValue_' + Condition.id">
                        </TreeSelect>

                        <TreeSelect *ngIf="!Condition.fieldChangedToggle" [Items]="ObjectFieldsTreeItems"
                            [Width]="'300px'" [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'v'"
                            [Value]="Condition.valueCode" [ShowItem]="Condition | ShowFlowVariablesTreeItemPipe"
                            [IsReturnedTreeSelectItem]="true" [ShowExpand]="false"
                            (ValueChanged)="updateConditionFieldValue($event, conditionIndex)"
                            [DataCy]="'ConditionFieldValue_' + Condition.id">
                        </TreeSelect>

                    </div>

                    <div *ngIf="!(Condition.operator | IsNoValueOperatorPipe) && (Condition.operator | IsFieldOperatorPipe) && !IsEntityFieldValue"
                        class="condition-value-container">
                        <div [attr.data-cy]="'ConditionFieldValue_' + Condition.id">
                            <TreeSelect [Items]="FlowVariablesTreeItems" [Width]="'300px'" [Value]="Condition.value"
                                [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'v'"
                                [ShowItem]="Condition | ShowFlowVariablesTreeItemPipe" [IsReturnedTreeSelectItem]="true"
                                (ValueChanged)="updateConditionValue(($event ? $event.key : null), conditionIndex, ($event && $event.data ? ($event.data.nodeId || null) : null))"
                                [DataCy]="'ConditionFieldValue_' + Condition.id">
                            </TreeSelect>
                        </div>
                    </div>

                    <div *ngIf="(Condition.operator | IsNoValueOperatorPipe)" class="condition-value-container">
                        <ComboBox [ItemsSource]="BooleanValuesItems" [Binding]="'Name'"
                            [SelectedItem]="Condition.value | ListItemPipe"
                            (SelectedItemChanged)="updateConditionValue($event.Code, conditionIndex)" [ListType]="''"
                            [IsDisabled]="Condition.disabled | ConditionDisabledPipe : 'v'"
                            [MaxHeight]="ComboBoxMaxHeight" [CyData]="'ConditionValue_' + Condition.id">
                        </ComboBox>
                    </div>

                </div>

                <ConditionGroups *ngIf="Condition.isGroup && Condition.conditions && Condition.conditions.length > 0"
                    [EntityId]="EntityId" [ShowChangedOperator]="ShowChangedOperator"
                    [(Conditions)]="Condition.conditions" [IsValidConditions]="IsValidConditions"
                    [IsRootConditions]="false" (ConditionsChangedEvent)="emitConditionsChanged($event)"
                    [ConditionsCounter]="ConditionsCounter" [FlowObject]="FlowObject" [CurrentNodeId]="CurrentNodeId"
                    [IsEntityField]="IsEntityField" [IsEntityFieldValue]="IsEntityFieldValue" [EnableAdd]="EnableAdd"
                    [IsOneLevelConditions]="IsOneLevelConditions" [IsDummyField]="IsDummyField"
                    [GetFieldFromFirstCondition]="GetFieldFromFirstCondition">
                </ConditionGroups>

                <div *ngIf="Condition.isGroup && EnableAdd" class="add-buttons-container">
                    <span class="link-button add-condition-button" [ngClass]="{'disabled': !IsValidConditions}"
                        (click)="addCondition(conditionIndex, false)"
                        [attr.data-cy]="'AddConditionButton_' + Condition.id">
                        <span class="plus-sign">+</span><span>Add Condition</span>
                    </span>
                    <span *ngIf="!IsOneLevelConditions" class="link-button add-group-button"
                        [ngClass]="{'disabled': !IsValidConditions}" (click)="addCondition(conditionIndex, true)"
                        [attr.data-cy]="'AddGroupButton_' + Condition.id">
                        <span class="plus-sign">+</span><span>Add Group</span>
                    </span>
                </div>

            </div>


        </div>

        <div *ngIf="IsRootConditions && isLastCondition && EnableAdd" class="add-buttons-container margin-left-0">
            <span class="link-button add-condition-button" [ngClass]="{'disabled': !IsValidConditions}"
                (click)="addCondition(null, false)" [attr.data-cy]="'AddRootConditionButton'">
                <span class="plus-sign">+</span><span>Add Condition</span>
            </span>
            <span *ngIf="!IsOneLevelConditions" class="link-button add-group-button"
                [ngClass]="{'disabled': !IsValidConditions}" (click)="addCondition(null, true)"
                [attr.data-cy]="'AddRootGroupButton'">
                <span class="plus-sign">+</span><span>Add Group</span>
            </span>
        </div>

    </li>
</ul>
