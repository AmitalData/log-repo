<div #treeSelect>

    <nz-tree-select #nzTreeSelect [ngStyle]="{ width : Width, maxWidth : Width }" [nzNodes]="FilteredTreeItems"
        [nzShowSearch]="ShowSearch" [nzNotFoundContent]="'No Data'" [nzAllowClear]="AllowClear"
        [nzDropdownStyle]="{ 'max-height': '300px' }" [(ngModel)]="Value"
        (ngModelChange)="treeSelectValueChanged($event)">
    </nz-tree-select>
