<div [attr.title]="Title" [attr.data-cy]="DataCy">

    <nz-tree-select #nzTreeSelect [ngStyle]="{ width : Width, maxWidth : Width }" [nzNodes]="FilteredTreeItems"
        [(ngModel)]="Value" [nzShowSearch]="ShowSearch" [nzNotFoundContent]="'No Results Found'"
        [nzPlaceHolder]="PlaceHolder" [nzAllowClear]="AllowClear && !IsDisabled"
        [nzDropdownStyle]="{ 'max-height': '300px' }" [nzDisabled]="IsDisabled" [nzShowExpand]="ShowExpand"
        [nzDisplayWith]="getDisplayTitle" [nzTreeTemplate]="Template || default" [attr.data-cy]="DataCy">
    </nz-tree-select>

    <ng-template #default let-item>
        <div [attr.title]="(item?.origin?.data ? item.origin.data['tooltip'] : null) || item.title"
            [attr.data-cy]="(DataCy ? (DataCy + '_') : null) + item.key">
            {{ item.title }}
        </div>
    </ng-template>

</div>
