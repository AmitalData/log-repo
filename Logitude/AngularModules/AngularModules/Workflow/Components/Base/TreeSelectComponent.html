<div #treeSelect>

    <nz-tree-select [ngStyle]="{ width : Width, maxWidth : Width }" [nzNodes]="Items" [nzShowSearch]="ShowSearch"
        [nzNotFoundContent]="'No Data'" [nzAllowClear]="AllowClear" [nzVirtualHeight]="'250px'" [(ngModel)]="Value"
        (ngModelChange)="treeSelectValueChanged($event)">
    </nz-tree-select>

</div>
