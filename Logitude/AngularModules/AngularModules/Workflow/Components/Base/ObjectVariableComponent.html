<style>
    .copy-container {
        width: 100%;
        height: 30px;
        padding-top: 3px;
        padding-left: 5px;
    }

    .content-container {
        width: 100%;
        height: 320px;
        overflow: auto;
    }

    .download-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .download-container,
    .download-link {
        font-size: 13px;
    }

    .download-link {
        margin-left: 4px;
    }
</style>

<div *ngIf="Value">
    <div *ngIf="IsPrettyJsonHtmlContent" class="copy-container">
        <IconButton [Name]="'copy'" (click)="copyValueToClipboard()" [DataCy]="'CopyValueButton'">
        </IconButton>
    </div>

    <div class="content-container">
        <div *ngIf="IsPrettyJsonHtmlContent" class="json-container" [innerHTML]="PrettyJsonHtmlContent">
        </div>
        <div *ngIf="!IsPrettyJsonHtmlContent" class="download-container">
            The value is too large to display.
            <a class="download-link" (click)="downloadValueJson()">click to download</a>
        </div>
    </div>
</div>
