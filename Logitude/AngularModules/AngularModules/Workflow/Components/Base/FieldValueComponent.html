<div *ngIf="!DataType">

    <div *ngIf="!IsIntegerNumberInput && ObjectField">

        <div *ngIf="ObjectField.DataTypeCode === FieldTypes.LookUp && LookupTable">

            <LogLov [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
                [LookUpTableName]="LookupTable.Name"
                [DependencyFilter1Value]="ObjectField.DependencyFilter1Type === 'Constant' ? ObjectField.DependencyFilter1Value : null"
                [DependencyFilter2Value]="ObjectField.DependencyFilter2Type === 'Constant' ? ObjectField.DependencyFilter2Value : null"
                [DependencyFilter3Value]="ObjectField.DependencyFilter3Type === 'Constant' ? ObjectField.DependencyFilter3Value : null"
                [DependencyFilter1IsList]="ObjectField.DependencyFilter1IsList"
                [DependencyFilter2IsList]="ObjectField.DependencyFilter2IsList"
                [DependencyFilter3IsList]="ObjectField.DependencyFilter3IsList" [NoValidation]="true"
                [DisplayMemberPath]="LookupTable.LovDisplayMemberPath || LookupTable.LookUp2 || LookupTable.LookUp1"
                [SelectedValue]="CurrentValue" [HideColumns]="!LookupTable.AutoCompleteSearchWindow"
                [HideLastColumn]="LookupTable.AutoCompleteSearchWindow" (SelectedItemChanged)="updateValue($event)"
                [DataCy]="Name" [ForceDisabled]="IsDisabled">
            </LogLov>

        </div>

        <div *ngIf="ObjectField.DataTypeCode === FieldTypes.PickList && PickListTable">
            <PickList [ObjectFieldName]="ObjectField.FieldName" [ObjectTableName]="PickListTable.Name"
                [SelectedValue]="CurrentValue" [DataContext]="DataContext" [IsFreeText]="true" [NoValidation]="true"
                [HideLastColumn]="true" [HideColumns]="true" [PlaceHolder]="'Value'"
                (SelectedItemChanged)="updateValue($event?.Id)" [DataCy]="Name" [ForceDisabled]="IsDisabled">
            </PickList>
        </div>

        <div *ngIf="ObjectField.DataTypeCode === FieldTypes.NText || ObjectField.DataTypeCode === FieldTypes.Text">

            <LogTextBox [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
                [Text]="CurrentValue" [InputType]="ObjectField.DataTypeCode.toLowerCase()" [NoValidation]="true"
                [HideColumns]="true" [RowsCount]="0.8" (ValueChanged)="updateValue($event)" [DataCy]="Name"
                [ForceDisabled]="IsDisabled">
            </LogTextBox>

        </div>


        <div *ngIf="ObjectField.DataTypeCode === FieldTypes.BigInteger ||
        ObjectField.DataTypeCode === FieldTypes.Decimal ||
        ObjectField.DataTypeCode === FieldTypes.Double ||
        ObjectField.DataTypeCode === FieldTypes.Integer ||
        ObjectField.DataTypeCode === FieldTypes.SigDouble ||
        ObjectField.DataTypeCode === FieldTypes.UnsDecimal ||
        ObjectField.DataTypeCode === FieldTypes.UnsInteger">

            <LogTextBox [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
                [Text]="CurrentValue" [InputType]="ObjectField.DataTypeCode.toLowerCase()"
                [DigitsAfterPoint]="ObjectField.DigitsAfterPoint" [NoValidation]="true" [HideColumns]="true"
                [RowsCount]="0.8" (ValueChanged)="updateValue($event)" [DataCy]="Name" [ForceDisabled]="IsDisabled">
            </LogTextBox>

        </div>


        <div *ngIf="ObjectField.DataTypeCode === FieldTypes.Boolean">

            <ComboBox [ItemsSource]="BooleanValuesItems" [Binding]="'Name'" [SelectedItem]="CurrentValue | ListItemPipe"
                (SelectedItemChanged)="updateValue($event.Code)" [ListType]="''" [CyData]="Name"
                [IsDisabled]="IsDisabled">
            </ComboBox>

        </div>


        <div *ngIf="ObjectField.DataTypeCode === FieldTypes.DateTime || ObjectField.DataTypeCode === FieldTypes.Date">

            <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="Name" [DataContext]="DataContext"
                [SelectedDateValue]="DateTimeCurrentValue" [InputType]="'date'" [IsFreeValue]="true"
                [NoValidation]="true" [HideColumns]="true" (ValueChanged)="updateValue($event)" [DataCy]="Name"
                [ForceDisabled]="IsDisabled">
            </LogDatePicker>

        </div>

    </div>



    <div *ngIf="IsIntegerNumberInput">

        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
            [Text]="CurrentValue" [InputType]="'integer'" [NoValidation]="true" [HideColumns]="true" [RowsCount]="0.8"
            (ValueChanged)="updateValue($event)" [DataCy]="Name" [ForceDisabled]="IsDisabled">
        </LogTextBox>

    </div>

</div>


<div *ngIf="DataType">

    <div *ngIf="!IsIntegerNumberInput">

        <div *ngIf="DataType === FieldTypes.Text">
            <LogTextBox [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
                [Text]="CurrentValue" [InputType]="'text'" [NoValidation]="true" [HideColumns]="true" [RowsCount]="0.8"
                (ValueChanged)="updateValue($event)" [DataCy]="Name" [ForceDisabled]="IsDisabled">
            </LogTextBox>
        </div>


        <div *ngIf="DataType === FieldTypes.Decimal">
            <LogTextBox [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
                [Text]="CurrentValue" [InputType]="'decimal'" [NoValidation]="true" [HideColumns]="true"
                [RowsCount]="0.8" (ValueChanged)="updateValue($event)" [DataCy]="Name" [ForceDisabled]="IsDisabled">
            </LogTextBox>
        </div>


        <div *ngIf="DataType && this.DataType === FieldTypes.Boolean">
            <ComboBox [ItemsSource]="BooleanValuesItems" [Binding]="'Name'" [SelectedItem]="CurrentValue | ListItemPipe"
                (SelectedItemChanged)="updateValue($event.Code)" [ListType]="''" [CyData]="Name"
                [IsDisabled]="IsDisabled">
            </ComboBox>
        </div>


        <div *ngIf="DataType === FieldTypes.DateTime || DataType === FieldTypes.Date">
            <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="Name" [DataContext]="DataContext"
                [SelectedDateValue]="DateTimeCurrentValue" [InputType]="'date'" [IsFreeValue]="true"
                [NoValidation]="true" [HideColumns]="true" (ValueChanged)="updateValue($event)" [DataCy]="Name"
                [ForceDisabled]="IsDisabled">
            </LogDatePicker>
        </div>

    </div>

    <div *ngIf="IsIntegerNumberInput">

        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="Name" [IsFreeText]="true" [DataContext]="DataContext"
            [Text]="CurrentValue" [InputType]="'integer'" [NoValidation]="true" [HideColumns]="true" [RowsCount]="0.8"
            (ValueChanged)="updateValue($event)" [DataCy]="Name" [ForceDisabled]="IsDisabled">
        </LogTextBox>

    </div>

</div>
