<style>
    .entity-conditions-container {
        display: table;
        width: max-content;
    }

    .entity-conditions-operation-container {
        display: table-cell;
        vertical-align: middle;
        min-width: 70px;
        padding-right: 10px;
        border-right: 1px solid #808080;
    }

    .entity-condition-groups-container {
        display: table-cell;
        padding-left: 10px;
    }
</style>


<div *ngIf="Conditions && Conditions.length > 0" class="entity-conditions-container">

    <div class="entity-conditions-operation-container">

        <ComboBox [ItemsSource]="ConditionOperationsItems" [Binding]="'Name'"
            [SelectedItem]="ListItem(ConditionsOperation)" (SelectedItemChanged)="updateConditionsOperation($event)"
            [ListType]="''" [CyData]="'ConditionsOperation'">
        </ComboBox>

    </div>

    <div class="entity-condition-groups-container">

        <ConditionGroups [EntityId]="EntityId" [ShowChangedOperator]="ShowChangedOperator" [(Conditions)]="Conditions"
            [IsValidConditions]="IsValidConditions" (ConditionsChangedEvent)="conditionsChanged($event)"
            [ConditionsCounter]="ConditionsCounter" [AtLeastOneCondition]="AtLeastOneCondition"
            [ShowFlowVariablesTree]="ShowFlowVariablesTree" [FlowObject]="FlowObject"
            [FlowObjectFields]="FlowObjectFields" [CurrentNodeId]="CurrentNodeId"></ConditionGroups>

    </div>

</div>
