<style>
    .expression-element {
        height: 22px;
        float: left;
    }

    .expression-input {
        padding-left: 24px;
        padding-right: 6px;
    }

    .function-icon {
        position: absolute;
        top: 1px;
        left: 4px;
        bottom: 0;
        margin: auto;
        cursor: pointer;
    }

    .open-expression-builder-btn {
        position: absolute;
        height: 22px;
        cursor: pointer;
    }
</style>

<tr>
    <td>
        <div class="open-expression-builder-btn" [ngStyle]="{ 'width': Width }" (click)="openExpressionBuilder()"
            [attr.data-cy]="DataCy">
        </div>

        <div class="expression-element" [ngStyle]="{ 'width': Width }" [attr.data-cy]="DataCy">
            <input [disabled]="IsDisabled" class="expression-input" type="text" placeholder="Expression ..."
                [(ngModel)]="ExpressionValue.expression" readonly [attr.data-cy]="DataCy" />
            <img class="function-icon" src="./Images/function.png" (click)="openExpressionBuilder()" />
        </div>
    </td>
</tr>
