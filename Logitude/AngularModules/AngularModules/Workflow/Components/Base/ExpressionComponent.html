<style>
    .expression-element {
        height: 22px;
        float: left;
    }

    .expression-input {
        padding-left: 24px;
        padding-right: 6px;
    }

    .function-icon {
        position: absolute;
        top: 1px;
        left: 4px;
        bottom: 0;
        margin: auto;
    }

    .open-expression-builder-btn {
        position: absolute;
        height: 22px;
        z-index: 1;
        cursor: pointer;
    }
</style>

<tr>
    <td>
        <div class="open-expression-builder-btn" [ngStyle]="{ 'width': Width }" (click)="openExpressionBuilder()"></div>
        <div class="expression-element" [ngStyle]="{ 'width': Width }">
            <input [disabled]="IsDisabled" class="expression-input" type="text" placeholder="Expression ..."
                [(ngModel)]="ExpressionValue.expression" readonly />
            <img class="function-icon" src="./Images/function.png" />
        </div>
    </td>
</tr>
