<style>
    .messages-table {
        height: 24px;
    }

    .messages-table-cell {
        padding-right: 5px;
    }

    .toggle-messages-icon {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .messages-container {
        width: 350px;
        height: 125px;
        border-radius: 4px;
        position: fixed;
        z-index: 1;
        background-color: white;
        box-shadow: 0px 2px 5px rgb(0 0 0 / 15%);
    }

    .messages-container:after {
        position: absolute;
        top: -8px;
        right: 10px;
        content: "";
        display: block;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
    }

    .warning-messages-container:after {
        border-bottom: 8px solid #f2a11b;
    }

    .error-messages-container:after {
        border-bottom: 8px solid #dc3545;
    }

    .messages-title {
        padding-top: 3px;
        padding-bottom: 3px;
        padding-left: 8px;
        padding-right: 6px;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 700;
    }

    .warning-messages-title {
        background-color: #f2a11b;
    }

    .error-messages-title {
        background-color: #dc3545;
    }

    .messages-list {
        list-style-type: initial;
        padding-top: 3px;
        padding-bottom: 3px;
        padding-left: 22px;
        padding-right: 3px;
        overflow-x: hidden;
        overflow-y: auto;
        height: 101px;
    }

    .message-item {
        padding-bottom: 4px;
    }

    .message {
        font-size: 11px;
        line-height: 1.4;
        white-space: break-spaces;
        display: block;
    }

    .messages-section {
        display: inline-block;
    }

    .split-block {
        width: 10px;
        display: inline-block;
    }
</style>

<table *ngIf="IsWarningMessagesDisplayed || IsErrorMessagesDisplayed" class="messages-table">
    <tr>
        <td class="messages-table-cell">

            <div class="messages-section" *ngIf="IsWarningMessagesDisplayed">
                <img class="toggle-messages-icon" src="./Images/warning_notice.png"
                    (click)="toggleWarningMessages($event)" />

                <div *ngIf="IsWarningMessagesOpened" class="messages-container warning-messages-container"
                    [ngStyle]="{ top : WarningMessagesContainerPosition.top, right : WarningMessagesContainerPosition.right }">
                    <div class="messages-title warning-messages-title">
                        {{WarningMessagesTitle}}
                    </div>
                    <ul class="messages-list">
                        <li class="message-item" *ngFor="let WarningMessage of WarningMessages">
                            <span class="message">{{WarningMessage}}</span>
                        </li>
                    </ul>
                </div>
            </div>

            <div *ngIf="IsWarningMessagesDisplayed && IsErrorMessagesDisplayed" class="split-block">
            </div>

            <div class="messages-section" *ngIf="IsErrorMessagesDisplayed">
                <img class="toggle-messages-icon" src="./Images/problem.png" (click)="toggleErrorMessages($event)" />

                <div *ngIf="IsErrorMessagesOpened" class="messages-container error-messages-container"
                    [ngStyle]="{ top : ErrorMessagesContainerPosition.top, right : ErrorMessagesContainerPosition.right }">
                    <div class="messages-title error-messages-title">{{ErrorMessagesTitle}}</div>
                    <ul class="messages-list">
                        <li class="message-item" *ngFor="let ErrorMessage of ErrorMessages">
                            <span class="message">{{ErrorMessage}}</span>
                        </li>
                    </ul>
                </div>
            </div>

        </td>
    </tr>
</table>
