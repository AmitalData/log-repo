<style>
    .table-row {
        height: 1px;
    }

    .table-row-cell {
        padding-bottom: 8px;
    }

    .version-textarea {
        height: 200px;
        border-radius: 0px;
        font-size: 13px;
        font-weight: bold;
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" class="table-row">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr class="table-row">
        <td class="table-row-cell">
            <div class="title">
                <LogLabel [NoObjectField]="true" [Text]="'Description'" [ObjectFieldName]="'Description'"
                    [HideColumns]="true" [DataContext]="DataContext"></LogLabel>
            </div>
            <div class="version-description">
                <textarea class="version-textarea" id="version_description" [(ngModel)]='VersionDescription'
                    (ngChange)='updateVersionDescription($event.Value)'></textarea>
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr class="table-row">
        <td>
            <FooterButtons [SaveButtonLabel]="'Ok'" (SaveButtonClicked)="saveButtonClicked()"
                (CancelButtonClicked)="cancelButtonClicked()" [SaveButtonDataCy]="'expression-save-button'"
                [CancelButtonDataCy]="'expression-cancel-button'">
            </FooterButtons>
        </td>
    </tr>
</table>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
