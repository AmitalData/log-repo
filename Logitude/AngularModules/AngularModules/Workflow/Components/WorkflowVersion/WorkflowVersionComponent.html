<style>
    .activate-button-container {
        display: flex;
        justify-content: flex-end;
    }

    .activate-button {
        width: 100px;
    }
</style>
<table style="padding:10px">
    <tr style="height:1px">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width: 200px; padding-right: 5px;">
                        <div class="activate-button-container">
                            <button *ngIf="!HasChanges" class="Button activate-button" (click)="activateVersion()">
                                <span class="activate-button-label">Activate</span>
                            </button>
                            <button *ngIf="HasChanges" class="EntityChangesButton activate-button" (click)="activateVersion()">
                                <span class="activate-button-label">Activate</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="vertical-align:top">
            <div class="MediaFill">
                <div style="vertical-align:top;" class="GeneratedGridContainer">
                    <logitude-grid-v2 GridWidth="100%" GridHeight="100%" [ObjectTable]="ObjectTableName"
                        [dataSource]="DataSource" [columns]="columns" [autoLoad]="true" [IsCustomTemplate]="true"
                        [QueryChangeEvent]="onQueryChangeEvent" [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                        (rowSelectedEvent)="onRowSelected($event)" [DataCy]="'HistoryRow'">
                    </logitude-grid-v2>


                </div>

            </div>
        </td>
    </tr>
</table>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
