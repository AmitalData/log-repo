<style>
    .activate-button-container {
        display: flex;
        justify-content: flex-end;
    }

    .activate-button {
        width: 100px;
    }

    .refresh-row {
        width: 1px;
        padding-left: 5px;
    }

    .margin-5 {
        margin: 5px;
    }
</style>

<div class="MediaFillAbsolute workflow-builder-wrapper">
    <div class="MarginAbsolute10">
        <table>
            <tr>
                <td>
                    <div class="MediaFill CurvedArea">
                        <table style="padding:10px">
                            <tr>
                                <td style="vertical-align:top">
                                    <div style="vertical-align:top;" class="GeneratedGridContainer">
                                        <logitude-grid-v2 GridWidth="100%" GridHeight="100%"
                                            [ObjectTable]="ObjectTableName" [dataSource]="DataSource"
                                            [columns]="columns" [autoLoad]="true" [IsCustomTemplate]="true"
                                            [QueryChangeEvent]="onQueryChangeEvent"
                                            [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                            (rowSelectedEvent)="onRowSelected($event)" [DataCy]="'HistoryRow'">
                                        </logitude-grid-v2>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="BusyIndicatorWidth"></BusyIndicator>
