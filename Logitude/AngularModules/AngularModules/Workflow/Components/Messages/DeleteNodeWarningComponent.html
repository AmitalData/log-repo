<style>
    .warning-icon-cell {
        width: 100px;
    }

    .message-container {
        font-size: 12px;
        white-space: break-spaces;
        overflow: auto;
        width: 100%;
        height: 200px;
        position: absolute;
        top: 20px;
    }

    .message-container * {
        font-size: 12px;
        white-space: break-spaces;
    }

    .warning-icon {
        width: 80px;
        height: 80px;
        position: absolute;
        top: 14px;
        left: 4px;
    }

    .bold-text {
        font-size: 13px !important;
        font-weight: bold;
    }

    .used-by-header {
        padding-top: 10px;
        padding-bottom: 5px;
    }

    .footer-row {
        height: 22px;
    }
</style>

<table>
    <tr>
        <td class="warning-icon-cell">
            <img class="warning-icon" src="./Images/InfoIcon.png">
        </td>
        <td>
            <div *ngIf="UsedInNodes && UsedInNodes.length > 0" class="message-container">
                <div>You cannot delete <span class="bold-text">{{NodeNameToDelete}}</span> yet.</div>

                <div>Remove all references for <span class="bold-text">{{NodeNameToDelete}}</span>, and try again.</div>

                <div class="used-by-header">Used by elements:</div>

                <div class="used-in-node-name" *ngFor="let UsedInNode of UsedInNodes">
                    <span class="bold-text">{{"- " + UsedInNode}}</span>
                </div>
            </div>

            <div *ngIf="!(UsedInNodes && UsedInNodes.length > 0)" class="message-container">
                <div>Cannot delete element</div>
            </div>
        </td>
    </tr>

    <tr class="footer-row">
        <td colspan="2">
            <FooterButtons [ShowSaveOnly]="true" [SaveButtonLabel]="'Ok'" (SaveButtonClicked)="cancelButtonClicked()"
                [SaveButtonDataCy]="'warning-message-ok-button'">
            </FooterButtons>
        </td>
    </tr>
</table>
