<style>
    .status {
        font-weight: bold;
        color: #000000;
    }

    .draft-status {
        color: #258bee !important;
    }

    .published-status {
        color: #54aa41 !important;
    }
</style>

<table *ngIf="Entity">
    <tr>
        <td>
            <div class="MediaFill">

                <table *ngIf="ObjectTableName == 'WorkFlow'">
                    <tr>
                        <td>
                            <div class="MediaFill">

                                <div *ngIf="FieldName == 'StatusName'">
                                    <div
                                        [ngClass]="'status' + (Entity[FieldName] ? (' ' + Entity[FieldName].toLowerCase() + '-status') : '')">
                                        {{Entity[FieldName]}}
                                    </div>
                                </div>

                            </div>
                        </td>
                    </tr>
                </table>

            </div>
        </td>
    </tr>
</table>
