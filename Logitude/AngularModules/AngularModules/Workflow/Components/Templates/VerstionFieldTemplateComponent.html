<style>
    .status {
        font-weight: bold;
        color: #000000;
    }

    .active-version{
        font-weight: bold;
        color: #54aa41;
    }
</style>

<table *ngIf="Entity">
    <tr>
        <td>
            <div class="MediaFill">

                <table *ngIf="ObjectTableName != 'WorkFlow'">
                    <tr>
                        <td>
                            <div class="MediaFill">

                                <div *ngIf="FieldName == 'StatusName'">
                                    <div
                                        [ngClass]="'version ' + (Entity[FieldName] ? (' ' + Entity[FieldName].toLowerCase() + '-version') : '')">
                                        {{Entity[FieldName]}}
                                    </div>
                                </div>

                                <div class="TextTrimming" *ngIf="FieldName == 'CreateDate'">{{ Entity[FieldName] | DateTimePipe:'SD' }}
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>

            </div>
        </td>
    </tr>
</table>
