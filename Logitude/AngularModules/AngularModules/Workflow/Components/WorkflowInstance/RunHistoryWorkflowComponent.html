<table style="padding:10px">
    <tr style="height:1px">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width: 1px; padding-left: 5px;">
                            <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()" [DataCy]="'RunHistoryRefresh'"></IconButton>
                    </td>
                    <td style="vertical-align: middle;width:310px; padding-left: 5px;">
                        <span class="Counter" style="color: #1B90CB;">Run({{DataSource.rowCount}})</span>
                    </td>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 200px; padding-right: 5px;">
                        <SearchTextBox [ObjectTableName]="ObjectTableName" [PlaceHolder]="'Search key'" (SearchTextChangeEvent)="TextChanged($event)" [DataCy]="'RunHistorySearchBox'"></SearchTextBox>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="vertical-align:top">
            <div class="MediaFill">
                <div style="vertical-align:top;" class="GeneratedGridContainer">
                    <logitude-grid-v2 GridWidth="100%" GridHeight="100%" [ObjectTable]="ObjectTableName" 
                        [dataSource]="DataSource" [columns]="columns" [autoLoad]="true" [IsCustomTemplate]="true"
                        [QueryChangeEvent]="onQueryChangeEvent" [MenuHeaderchangeevent]="MenuHeaderchangeevent" 
                        (rowSelectedEvent)="onRowSelected($event)" [DataCy]="'HistoryRow'">
                    </logitude-grid-v2>

                    
                </div>

            </div>
        </td>
    </tr>
