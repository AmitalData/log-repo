<style>
    .table {
        padding: 10px
    }

    .table-row {
        height: 1px
    }

    .refresh-row {
        width: 1px;
        padding-left: 5px;
    }

    .count-row {
        vertical-align: middle;
        width: 50px;
        padding: 0 5px;
    }

    .count-data {
        color: #1B90CB;
    }

    .excel-row {
        height: 21px;
        width: 21px;
        vertical-align: middle;
    }

    .excel-button {
        height: 21px;
        width: 21px;
    }

    .filter-row {
        width: 350px;
    }

    .filter-container {
        display: inline-flex
    }

    .filter-name {
        padding-right: 5px;
    }

    .search-row {
        width: 200px;
        padding-right: 5px;
    }
</style>

<table class="table">
    <tr *ngIf="DataSource" class="table-row">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td class="refresh-row">
                        <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()" [DataCy]="'RunHistoryRefresh'">
                        </IconButton>
                    </td>
                    <td class="count-row">
                        <span class="Counter" class="count-data">Run({{DataSource.rowCount}})</span>
                    </td>
                    <td class="excel-row">
                        <button class="excel-button Button" (click)="ExportToExcel()"><img class="CenterCenter"
                                title="Export To Excel" src="./Images/Buttons/excelicon.png" /></button>
                    </td>
                    <td>
                        <div></div>
                    </td>

                    <td class="filter-row">
                        <div class="filter-container">
                            <span class="filter-name">Start Time</span>
                            <CustomDatePicker (SelectedItemChanged)="setDateFilter($event)"
                                [QueryCode]="ObjectTableName" [ObjectField]="StartTimeObjectfield"></CustomDatePicker>
                        </div>
                    </td>


                    <td class="search-row">
                        <SearchTextBox [ObjectTableName]="ObjectTableName" [PlaceHolder]="'Search key'"
                            (SearchTextChangeEvent)="TextChanged($event)" [DataCy]="'RunHistorySearchBox'">
                        </SearchTextBox>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="vertical-align:top">
            <div class="MediaFill">
                <div *ngIf="DataSource" style="vertical-align:top;" class="GeneratedGridContainer">
                    <logitude-grid-v2 GridWidth="100%" GridHeight="100%" [ObjectTable]="ObjectTableName"
                        [dataSource]="DataSource" [columns]="columns" [autoLoad]="true" [IsCustomTemplate]="true"
                        [QueryChangeEvent]="onQueryChangeEvent" [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                        (rowSelectedEvent)="onRowSelected($event)" [DataCy]="'HistoryRow'">
                    </logitude-grid-v2>


                </div>

            </div>
        </td>
    </tr>
