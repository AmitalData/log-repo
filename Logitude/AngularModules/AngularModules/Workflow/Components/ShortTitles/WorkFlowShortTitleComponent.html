<style>
    .short-title-row {
        display: flex;
    }

    .short-title {
        white-space: nowrap;
        overflow: hidden !important;
        text-overflow: ellipsis;
    }

    .title-span {
        font-size: 18px;
        color: #1B90CB;
    }

    .edit-button {
        display: flex;
        align-items: center;
        margin-left: 5px;
    }
</style>

<div *ngIf="EntityPM" class="short-title-row">
    <div class="short-title">
        <span class="title-span">
            {{WorkflowName}} - V{{WorkflowVersionNumber}}
        </span>
    </div>
    <div class="edit-button">
        <IconButton [Name]="'Edit'" [Title]="'Edit Workflow Version'" (click)="editWorkflowVersionClicked()"
            [DataCy]="'EditWorkflowVersion'" [Height]="20" [Width]="20">
        </IconButton>
    </div>
</div>
