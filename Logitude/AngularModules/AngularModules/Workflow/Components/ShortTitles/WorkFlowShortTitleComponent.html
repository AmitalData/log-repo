<style>
    .short-title-row {
        display: flex;
    }

    .short-title {
        white-space: nowrap;
        overflow: hidden !important;
        text-overflow: ellipsis;
    }

    .title-span {
        font-size: 18px;
        color: #1B90CB;
    }

    .edit-button {
        display: flex;
        align-items: center;
        margin-left: 5px;
    }

</style>

<div class="short-title-row">
    <div *ngIf="EntityPM" class="short-title">
        <span class="title-span">
            {{WorkflowName}} - V{{WorkflowVersionNumber}}
        </span>
    </div>
    <div *ngIf="EntityPM" class="edit-button">
        <IconButton [Name]="'Edit'" [Title]="'Edit Workflow Version'" (click)="editWorkflowVersionClicked()" [DataCy] = "EditWorkflowVersion">
        </IconButton>
    </div>
</div>
