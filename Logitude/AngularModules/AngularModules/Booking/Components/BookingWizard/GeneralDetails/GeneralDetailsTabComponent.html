
<div class="ScrollViewer">
    <div class="ScrollContent">
        <div class="TableHolder">
            <table>
                <tr>
                    <td style="width: 300px;">
                        <table>

                            <!-- Booking Product -->
                            <tr class="FormFieldRow" *ngIf="IsBookingProductVisibile">
                                <td style="width: 140px;">
                                    <LogLabel [ObjectFieldName]="'BookingProductId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="ShowWarning_BookingProduct"></LogLabel>
                                </td>

                                <td style="width: 125px;">
                                    <LogLov [ObjectFieldName]="'BookingProductId'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'BookingProduct'"
                                            [DependencyFilter1Value]="TenantZeroAirlineId">
                                    </LogLov>
                                </td>

                            </tr>

                            <!-- Carrier Tarrif Reference -->
                            <tr class="FormFieldRow">
                                <td style="width: 140px;">
                                    <LogLabel [ObjectFieldName]="'AWBCarrierTarrifReference'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="ShowWarning_TarrifReference"></LogLabel>
                                </td>

                                <td style="width: 125px;">
                                    <LogTextBox [ObjectFieldName]="'AWBCarrierTarrifReference'" [Text]="AWBCarrierTarrifReference" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>

                            </tr>

                                <td colspan="2">
                                    <table>

                                                                    [LookUpTableName]="'AWBSpecialHandlingCode'"

                                                        <td style="width: 2px;">

                                        <tr style="height: 25px;">
                                            <td>

                                                                    [ObjectTableName]="ObjectTableName"

                                                                    [LookUpTableName]="'AWBSpecialHandlingCode'"

                                                                    [DataContext]="DataContext"
                                                                    [LookUpTableName]="'AWBSpecialHandlingCode'"
                                                                    [DependencyFilter1Value]="TenantZeroAirlineId">

                                                        <td style="width: 2px;">

                                                        </td>

                                                        <td>
                                                            <LogLov [ObjectFieldName]="'AWBSpecialHandlingCodeId6'"

                                                                    [DataContext]="DataContext"
                                                                    [LookUpTableName]="'AWBSpecialHandlingCode'"

                                                                    [ObjectTableName]="ObjectTableName"

                                    </table>

                            </tr>

                            <!-- Special Service Request -->
                            <tr style="height: auto;">
                                <td colspan="2">
                                    <table>
                                        <tr style="height: 25px;">

                                            </td>
                                        </tr>
                                        <tr style="height: 60px;">
                                            <td style="height: 60px; vertical-align: top;">
                                                <div style="height: 100%; width: 100%;">
                                                    <LogTextBox [ObjectFieldName]="'SpecialServicesRequest'" [Text]="SpecialServicesRequest" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Other Services Information -->
                            <tr style="height: auto;">
                                <td colspan="2">
                                    <table>
                                        <tr style="height: 25px;">
                                            <td style="vertical-align: bottom;">
                                                <LogLabel [ObjectFieldName]="'OtherServicesInformation'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="ShowWarning_OtherServicesInformation"></LogLabel>
                                            </td>
                                        </tr>
                                        <tr style="height: 60px;">
                                            <td style="height: 60px; vertical-align: top;">

                    <td>

    </div>
