
<style type="text/css">
    .MessageBox {        
        font-size: 12px;
        text-align: center;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
    }
</style>

<table>
    <tr>
        <td>

            <!-- Error -->
            <table *ngIf="IsError">
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 1px;">
                                    <img style="float: left; vertical-align: middle; width: 35px; height: 33px;" src="./_Resources/Images/Icons/Validation/ValidationError_Big.png" />
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="color: #B02020; font-size: 18px;">Error</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 15px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill MessageBox" style="color: #B02020;">
                            {{ErrorMessage}}
                        </div>
                    </td>
                </tr>
            </table>

            <!-- Warning -->
            <table *ngIf="!IsError">
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 1px;">
                                    <img style="float: left; vertical-align: middle; width: 35px; height: 33px;" src="./_Resources/Images/Icons/Validation/WarningIcon_Big.png" />
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="color: #D8770E; font-size: 18px;">Warning</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 15px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill MessageBox" style="color: #D8770E;">
                            {{WarningMessage}}
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;" *ngIf="IsOkButtonVisible">
                        <div></div>
                    </td>

                    <td style="width: 57px;" *ngIf="IsOkButtonVisible">
                        <button class="RedButton" (click)="OkButtonClicked()">{{OkButtonLabel}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
