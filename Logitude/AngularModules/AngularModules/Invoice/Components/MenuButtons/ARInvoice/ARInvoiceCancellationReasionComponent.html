
<table>
    <tr style="height:1px;">
        <td>
            <ValidationSummary *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr class="FormFieldRow">
        <td>
            <table>
                <tr>
                    <td style="width: 100px;">
                        <LogLabel [NoObjectField]="true" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext" [Text]="'Cancel Reason'"></LogLabel>
                    </td>

                    <td style="width: 250px;">
                        <ComboBox (SelectedItemChanged)="SelectdSATCancelReason = $event"
                                  [SelectedItem]="SelectdSATCancelReason" [ItemsSource]="SATCancelReasons"
                                  [AdditionalTitleBinding]="'Code'"
                                  [Binding]="'Name'">
                        </ComboBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="OkButtonClicked()">{{'General.B.Confirm' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
