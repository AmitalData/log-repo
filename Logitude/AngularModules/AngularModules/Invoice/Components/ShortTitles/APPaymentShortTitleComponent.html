<table style="height: 24px;">
    <tr>
        <td style="width: 1px;">
            <div style="height: 24px;">
                <table>
                    <tr>
                        <td>
                            <div class="ShortTitleControl" style="background: rgba(255, 0, 0, 0.1);display: flex;">
                                <span [style.float]="isRTL ? 'right' : 'left'">{{'APPayment.S.ShortTitle' | TextCodeTranslationPipe}}:</span>
                                <span float-start style="margin-left: 5px;">{{EntityNumber}}</span>
                                <span float-start class="TextTrimming" style="max-width: 200px;">{{EntityPM.VendorName}}</span>
                            </div>
                        </td>

                        <!-- Void -->
                        <td style="padding-left: 5px;" *ngIf="EntityPM.StatusCode == 'VD'">
                            <div float-start class="ShortTitleControl" style="background: #6E7172;">
                                <span float-start style="color: white;">{{'General.O.Void' | TextCodeTranslationPipe}}</span>
                            </div>
                        </td>

                    </tr>
                </table>
            </div>
        </td>

        <td>
            <div></div>
        </td>
    </tr>
</table>
