<table style="height: 24px;">
    <tr>
        <td style="width: 1px;">
            <div style="height: 24px;">
                <table>
                    <tr>
                        <td>
                            <div  class="ShortTitleControl" style="background: rgba(255, 0, 0, 0.1);display: flex;">
                                <span [style.float]="isRTL ? 'right' : 'left'" >{{'ARPayment.S.ShortTitle' | TextCodeTranslationPipe}}:</span>
                                <span [style.float]="isRTL ? 'right' : 'left'" style="margin-left: 5px;">{{EntityNumber}}</span>
                                <span [style.float]="isRTL ? 'right' : 'left'" class="TextTrimming" style="max-width: 200px;">{{EntityPM.BillToName}}</span>
                            </div>
                        </td>

                        <!-- Void -->
                        <td style="padding-left: 5px;" *ngIf="EntityPM.StatusCode == 'VD'">
                            <div [style.float]="isRTL ? 'right' : 'left'" class="ShortTitleControl" style="background: #6E7172;">
                                <span [style.float]="isRTL ? 'right' : 'left'" style="color: white;">{{'General.O.Void' | TextCodeTranslationPipe}}</span>
                            </div>
                        </td>

                        <!-- SATTransferStatusName -->
                        <td style="padding-left: 5px;" *ngIf="DisplaySATSettings == true">
                            <div [style.float]="isRTL ? 'right' : 'left'" class="ShortTitleControl" style="background: #6E7172;">
                                <span [style.float]="isRTL ? 'right' : 'left'" style="color: white;">{{EntityPM.SATTransferStatusName}}</span>
                            </div>
                        </td>

                    </tr>
                </table>
            </div>
        </td>

        <td>
            <div></div>
        </td>
    </tr>
</table>
