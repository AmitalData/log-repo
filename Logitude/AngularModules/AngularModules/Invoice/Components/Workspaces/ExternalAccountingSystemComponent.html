
<table *ngIf="IsResourcesReady">
    <tr>
        <td>
            <table>
                <tr style="height:1px">
                    <td style="font:x-small;color:gray">
                        Choose one of the exisiting Accounting systems you can transfer AR Invoices to
                    </td>
                </tr>

                <tr>
                    <td style="vertical-align:top">
                        <table>
                            <tr style="height:10px">
                                <td colspan="3"></td>
                            </tr>
                            <tr style="height:1px">
                                <td style="width:150px">
                                    <LogLabel [ObjectFieldName]="'AccountingSystemCode'" [ObjectTableName]="'AccountingSetting'" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td style="width:200px">
                                    <LogLov [ObjectFieldName]="'AccountingSystemCode'"
                                            [ObjectTableName]="'AccountingSetting'"
                                            [DataContext]="DataContext"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'AccountingSystem'"
                                            (SelectedItemChanged)="SelectedItemChanged($event)">
                                    </LogLov>
                                </td>
                                <td style="width:30px">
                                    <div *ngIf="isQBO" style="padding-left:10px">
                                        <div *ngIf="!isLogedInQBO">
                                            <button class="Button" (click)="ViewXMLClicked()">Connect</button>

                                        </div>
                                        <div *ngIf="isLogedInQBO">
                                            <button class="RedButton" (click)="DissConnectQBO()">Disconnect</button>

                                        </div>
                                    </div>
                                    <div>

                                    </div>
                                </td>
                                <td></td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>


                </tr>
            </table>
        </td>



    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                        <!-- <button class="RedButton" [disabled]="!isLogedInQBO && isQBO" (click)="OkButtonClicked()">Ok</button>-->

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
