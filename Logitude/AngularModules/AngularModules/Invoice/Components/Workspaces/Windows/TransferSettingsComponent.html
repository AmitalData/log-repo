
<table *ngIf="IsResourcesReady">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:1px">
        <td class="ItalicArialText" style="padding-left:10px;">
            Select your accounting system to enable accounting transfer from Logitude
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="ScrollViewer">
                    <div class="ScrollContent">
                        <table>
                            <!--AccountingSystemCode-->
                            <tr class="FormFieldRow">
                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:550px;">
                                                <table>
                                                    <tr>
                                                        <td style="width:185px">
                                                            <LogLabel [ObjectFieldName]="'AccountingSystemCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td style="width:200px">
                                                            <LogLov [ObjectFieldName]="'AccountingSystemCode'"
                                                                    [ObjectTableName]="ObjectTableName"
                                                                    [SelectedValue]="AccountingSystemCode"
                                                                    [DataContext]="DataContext"
                                                                    [HideColumns]="true"
                                                                    [LookUpTableName]="'AccountingSystem'"
                                                                    (SelectedItemChanged)="SelectedItemChanged($event)">
                                                            </LogLov>
                                                        </td>

                                                        <td style="padding-left:5px">
                                                            <table>
                                                                <tr>
                                                                    <td style="width:400px">
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width:150px">
                                                                                    <div *ngIf="IsAccountingSystem_QB_QBO">
                                                                                        <div *ngIf="!isLogedInQBO">
                                                                                            <button class="Button" (click)="ViewXMLClicked()">Connect</button>
                                                                                        </div>

                                                                                        <div *ngIf="isLogedInQBO">
                                                                                            <button class="RedButton" (click)="DissConnectQBO()">Disconnect</button>
                                                                                        </div>
                                                                                    </div>
                                                                                </td>
                                                                                <td style="padding-left:10px">
                                                                                    <div *ngIf="IsAccountingSystem_QB_QBO_old">
                                                                                        <div *ngIf="!isLogedInQBO">
                                                                                            <button class="Button" (click)="ViewXMLClicked(false)">Connect Auth1</button>
                                                                                        </div>

                                                                                        <div *ngIf="isLogedInQBO">
                                                                                            <button class="RedButton" (click)="DissConnectQBO()">Disconnect Auth1</button>
                                                                                        </div>
                                                                                    </div>

                                                                                </td>
                                                                            </tr>
                                                                        </table>


                                                                    </td>

                                                                    <td></td>
                                                                </tr>
                                                            </table>

                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>

                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr *ngIf="AccountingSystemCode != 'NO'">
                                <td>
                                    <table>
                                        <!-- ARInvoiceTransferStartDate -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH || IsAccountingSystem_AI_GI || IsAccountingSystem_QB_QBO">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'ARInvoiceTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px">
                                                <LogDatePicker [ObjectFieldName]="'ARInvoiceTransferStartDate'" [SelectedDateValue]="ARInvoiceTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>

                                            <td style="padding-left: 5px; width:20px;">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditTransferStartDateClicked('ARInvoice')"></IconButton>
                                            </td>

                                            <td>
                                                <div style="float:left;padding-left:3px;" *ngIf="IsAccountingSystem_QB_QBO">
                                                    <HelpIcon [Header]="'QBO Start Date'" [Text]="'When choosing a date, block only ar invoices that are not transferred'"></HelpIcon>
                                                </div>
                                            </td>
                                        </tr>

                                        <!-- APInvoiceTransferStartDate -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH || IsAccountingSystem_AI_GI || IsAccountingSystem_QB_QBO">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'APInvoiceTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogDatePicker [ObjectFieldName]="'APInvoiceTransferStartDate'" [SelectedDateValue]="APInvoiceTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>

                                            <td style="padding-left: 5px; width:20px;">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditTransferStartDateClicked('APInvoice')"></IconButton>
                                            </td>

                                            <td>
                                                <div style="float:left;padding-left:3px;" *ngIf="IsAccountingSystem_QB_QBO">
                                                    <HelpIcon [Header]="'QBO Start Date'" [Text]="'When choosing a date, block only ap invoices that are not transferred'"></HelpIcon>
                                                </div>
                                            </td>
                                        </tr>

                                        <!-- ARPaymentTransferStartDate -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_QB_QBO">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'ARPaymentTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogDatePicker [ObjectFieldName]="'ARPaymentTransferStartDate'" [SelectedDateValue]="ARPaymentTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>

                                            <td style="padding-left: 5px; width:20px;">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditTransferStartDateClicked('ARPayment')"></IconButton>
                                            </td>

                                            <td>
                                                <div style="float:left;padding-left:3px;" *ngIf="IsAccountingSystem_QB_QBO">
                                                    <HelpIcon [Header]="'QBO Start Date'" [Text]="'When choosing a date, block only ar payments that are not transferred'"></HelpIcon>
                                                </div>
                                            </td>
                                        </tr>

                                        <!-- APPaymentTransferStartDate -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_QB_QBO">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'APPaymentTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogDatePicker [ObjectFieldName]="'APPaymentTransferStartDate'" [SelectedDateValue]="APPaymentTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>

                                            <td style="padding-left: 5px; width:20px;">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditTransferStartDateClicked('APPayment')"></IconButton>
                                            </td>

                                            <td>
                                                <div style="float:left;padding-left:3px;" *ngIf="IsAccountingSystem_QB_QBO">
                                                    <HelpIcon [Header]="'QBO Start Date'" [Text]="'When choosing a date, block only ap payments that are not transferred'"></HelpIcon>
                                                </div>
                                            </td>
                                        </tr>

                                        <!--Transfer Enabled for-->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_QB_QBO || IsAccountingSystem_HV_RH || IsAccountingSystem_AI_GI">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'IsARInvoicesTransferEnabled'" [Text]="'Transfer Enabled for'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td colspan="3">
                                                <table>
                                                    <tr>
                                                        <td style="width:85px;">
                                                            <LogCheckBox [Text]="'AR Invoices'" [ObjectFieldName]="'IsARInvoicesTransferEnabled'" [Checked]="IsARInvoicesTransferEnabled" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                                        </td>

                                                        <td style="width:10px;">
                                                            <div>
                                                            </div>
                                                        </td>

                                                        <td style="width:85px;">
                                                            <LogCheckBox [Text]="'AP Invoices'" [ObjectFieldName]="'IsAPInvoicesTransferEnabled'" [Checked]="IsAPInvoicesTransferEnabled" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                                        </td>

                                                        <td style="width:10px;">
                                                            <div>
                                                            </div>
                                                        </td>

                                                        <td style="width:85px;">
                                                            <LogCheckBox [Text]="'AR Payments'" [ObjectFieldName]="'IsARPaymentsTransferEnabled'" [Checked]="IsARPaymentsTransferEnabled" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                                        </td>

                                                        <td style="width:10px;">
                                                            <div>
                                                            </div>
                                                        </td>

                                                        <td style="width:85px;">
                                                            <LogCheckBox [Text]="'AP Payments'" [ObjectFieldName]="'IsAPPaymentsTransferEnabled'" [Checked]="IsAPPaymentsTransferEnabled" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                                        </td>

                                                        <td>
                                                            <div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <!-- External Transmission -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_AI_GI">
                                            <td style="width:185px;">
                                                <LogLabel [NoObjectField]="true" [Text]="'External Transmission'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <ComboBox [ItemsSource]="ExternalTransmissionList" [Binding]="'Name'" [SelectedItem]="SelectedExternalTransmission" (SelectedItemChanged)="SelectedExternalTransmission = $event"></ComboBox>
                                            </td>

                                            <td colspan="2">
                                                <table>
                                                    <tr>
                                                        <td style="width:10px;">
                                                            <div></div>
                                                        </td>

                                                        <td style="width:100px;" *ngIf="SelectedExternalTransmission != null && SelectedExternalTransmission.Code != 'NON'">
                                                            <span (click)="ExternalTransmissionSettingsClicked()" style="font-size:12px;" class="hyperlink">Settings</span>
                                                        </td>

                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <!-- ReceivableVATableTempCard -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'ReceivableVATableTempCard'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogTextBox [ObjectFieldName]="'ReceivableVATableTempCard'" [Text]="ReceivableVATableTempCard" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <!-- ReceivableVATExemptTempCard -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'ReceivableVATExemptTempCard'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogTextBox [ObjectFieldName]="'ReceivableVATExemptTempCard'" [Text]="ReceivableVATExemptTempCard" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <!-- PayableVATableTempCard -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'PayableVATableTempCard'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogTextBox [ObjectFieldName]="'PayableVATableTempCard'" [Text]="PayableVATableTempCard" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <!-- PayableVATExemptTempCard -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'PayableVATExemptTempCard'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogTextBox [ObjectFieldName]="'PayableVATExemptTempCard'" [Text]="PayableVATExemptTempCard" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <!-- ReceivableVATCard -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'ReceivableVATCard'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogTextBox [ObjectFieldName]="'ReceivableVATCard'" [Text]="ReceivableVATCard" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <!-- PayableVATCard -->
                                        <tr class="FormFieldRow" *ngIf="IsAccountingSystem_HV_RH">
                                            <td style="width:185px;">
                                                <LogLabel [ObjectFieldName]="'PayableVATCard'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td style="width:200px;">
                                                <LogTextBox [ObjectFieldName]="'PayableVATCard'" [Text]="PayableVATCard" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="(!isLogedInQBO && isQBO) || NoEntity">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
