
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table *ngIf="IsResourcesReady">

                <!-- ARInvoiceTransferStartDate -->
                <tr class="FormFieldRow" *ngIf="Code == 'ARInvoice'">
                    <td style="width: 90px;">
                        <LogLabel [ObjectFieldName]="'ARInvoiceTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Start date'"></LogLabel>
                    </td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'ARInvoiceTransferStartDate'" [SelectedDateValue]="ARInvoiceTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- APInvoiceTransferStartDate -->
                <tr class="FormFieldRow" *ngIf="Code == 'APInvoice'">
                    <td style="width: 90px;">
                        <LogLabel [ObjectFieldName]="'APInvoiceTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Start date'"></LogLabel>
                    </td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'APInvoiceTransferStartDate'" [SelectedDateValue]="APInvoiceTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- ARPaymentTransferStartDate -->
                <tr class="FormFieldRow" *ngIf="Code == 'ARPayment'">
                    <td style="width: 90px;">
                        <LogLabel [ObjectFieldName]="'ARPaymentTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Start date'"></LogLabel>
                    </td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'ARPaymentTransferStartDate'" [SelectedDateValue]="ARPaymentTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>


                <!-- APPaymentTransferStartDate -->
                <tr class="FormFieldRow" *ngIf="Code == 'APPayment'">
                    <td style="width: 90px;">
                        <LogLabel [ObjectFieldName]="'APPaymentTransferStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Start date'"></LogLabel>
                    </td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'APPaymentTransferStartDate'" [SelectedDateValue]="APPaymentTransferStartDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <table>
                            <tr>
                                <td style="width: 90px;">
                                    <div></div>
                                </td>

                                <td style="vertical-align: top;">
                                    <div class="ItalicArialText" *ngIf="IsNoDataTextVisible">{{NoDataText}}</div>
                                    <div class="ItalicArialText" *ngIf="IsUpdateTextVisible">{{UpdatedDataText}}</div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
