

<table>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="TabControl">
                    <div class="TabControlHead">
                    </div>

                    <div class="TabControlBody">

                        <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'RETASK'">
                            <div class="MediaFillAbsolute" style="top: 5px;margin:5px">
                                <div LocationDirective Code="RETASK"></div>
                            </div>
                        </div>

                        <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'PRREP'">
                            <div class="MediaFillAbsolute" style="top: 5px;margin:5px">
                                <div LocationDirective Code="PRREP"></div>
                            </div>
                        </div>

                        <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'OPEMA'">
                            <div class="MediaFillAbsolute" style="top: 5px;margin:5px">
                                <div LocationDirective Code="OPEMA"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </td>
    </tr>



    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td style="width: 57px;" [hidden]="SelectedTabLocation == 0">
                        <button style="cursor:pointer" class="Button" (click)="BackButtonClicked()">{{'General.B.Back' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;" [hidden]="SelectedTabLocation != 0">
                        <button style="cursor:pointer" class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 5px;">
                        <div></div>
                    </td>
                    <td style="width: 57px;" [hidden]="SelectedTabLocation == 2 || (DataContext.IsFTP && SelectedTabLocation == 1)">
                        <button style="cursor:pointer" class="RedButton" (click)="NextButtonClicked()">{{'General.B.Next' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 57px;" [hidden]="SelectedTabLocation != 2 && !(DataContext.IsFTP && SelectedTabLocation == 1)">
                        <button style="cursor:pointer" class="RedButton" [disabled]="DisableFinishButton()" (click)="SaveButtonClicked()">{{'General.B.Finish' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
