<style>
    .TabBody {
        overflow: auto;
    }
</style>


<table>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="TabControl">
                    <table>
                        <tr>
                            <td>
                                <div>
                                    <table>
                                        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                                            <td>
                                                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </td>
                        </tr>
                        <tr style="height:100%">
                            <td>
                                <div class="TabControlHead" style="height:5px;">
                                </div>

                                <div class="TabControlBody" style="top:5px;">

                                    <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'RETASK'">
                                        <div class="TabBody MediaFillAbsolute" style="top: 5px;margin:5px">
                                            <div LocationDirective Code="RETASK"></div>
                                        </div>
                                    </div>

                                    <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'PRREP'">
                                        <div class="TabBody MediaFillAbsolute" style="top: 5px;margin:5px">
                                            <div LocationDirective Code="PRREP"></div>
                                        </div>
                                    </div>

                                    <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'OPEMA'">
                                        <div class="TabBody MediaFillAbsolute" style="top: 5px;margin:5px">
                                            <div LocationDirective Code="OPEMA"></div>
                                        </div>
                                    </div>

                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div style="height:1px;"></div>
                            </td>
                        </tr>
                    </table>



                </div>
            </div>
        </td>
    </tr>



    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td><div></div></td>
                    <td style="width: 57px;">
                        <button [disabled]="SelectedTabLocation == 0" style="cursor:pointer" class="Button" (click)="BackButtonClicked()">{{'General.B.Previous' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 5px;"><div></div></td>
                    <td style="width: 57px;">
                        <button [disabled]="DisableNextButton()" style="cursor:pointer" class="Button" (click)="NextButtonClicked()">{{'General.B.Next' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 5px;"><div></div></td>
                    <td style="width: 57px;">
                        <button style="cursor:pointer" class="RedButton" [disabled]="DisableFinishButton()" (click)="SaveButtonClicked()">{{'General.B.Finish' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 5px;"><div></div></td>
                    <td style="width: 57px;">
                        <button style="cursor:pointer" class="Button" (click)="CloseButtonClicked()">Cancel</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
