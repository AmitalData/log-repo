<table>

                                                                                <LogTextBox [ObjectFieldName]="'Description'" [Text]="DataContext.Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>

                                                                        </tr>

                                                                            <td style="width:250px;">
                                                                                <CheckBox [IsChecked]="EntityPM.InActive" (Checked)="EntityPM.InActive = $event"></CheckBox>

                                                                            <td></td>
                                                                        </tr>

                                                                        <tr>

                                                                                <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsDaily == true" (Checked)="SetTigger('D')" [Text]="'Daily'" [Top]="5"></RadioButton>


                                                                            </td>
                                                                            <td style="width:80px">

                                                                                <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsWeekly == true" (Checked)="SetTigger('W')" [Text]="'Weekly'" [Top]="5"></RadioButton>

                                                                            </td>
                                                                            <td style="width:80px">
                                                                                <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsMonthly == true" (Checked)="SetTigger('M')" [Text]="'Monthly'" [Top]="5"></RadioButton>

                                                                        </tr>
                                                                    </table>

                                                            </tr>

                                                                                                        </td>

                                                                                                            <LogCheckBox [ObjectFieldName]="'Monday'" [Checked]="DataContext.Monday" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>

                                                                                </td>

                                            <table style="border :none;">

                                                    <td>
