<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 21px; vertical-align:middle;">
                        <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()"></IconButton>
                    </td>

                    <td style="width:5px;">
                        <div></div>
                    </td>

                    <td style="width: 85px;">
                        <button class="Button" (click)="NewTaskClicked()">Add New Scheduler</button>
                    </td>

                    <td>
                        <div></div>
                    </td>
                    <td style="width:40px;" class="Label">Status:</td>

                    <td style="width:5px;">
                        <div></div>
                    </td>

                    <td style="width: 155px;">
                        <ul class="FiltersMenu" style="float: right;">
                            <li (click)="FilterTypeCode = 'AL'" [class.SelectedFilter]="FilterTypeCode == 'AL'" style="width:50px;">
                                All
                            </li>
                            <li (click)="FilterTypeCode = 'AC'" [class.SelectedFilter]="FilterTypeCode == 'AC'" style="width:50px;">
                                Active
                            </li>
                            <li (click)="FilterTypeCode = 'IN'" [class.SelectedFilter]="FilterTypeCode == 'IN'" style="width:50px;">
                                Inactive
                            </li>
                        </ul>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td></td>
    </tr>

     <!-- Tasks -->
    <tr style="height:65%;">
        <td>
            <div class="MediaFill">
                <div style="background-color:white;border-radius: 0 0 0 7px;">
                    <logitude-grid *ngIf="false" GridWidth="100%" GridHeight="100%" [ObjectTable]="'TaskScheduler'" [IgnoreRowHoverVisibilityQueryName]="true" [ShowArrow]="true" [dataSource]="TasksDataSource" [MenuHeaderchangeevent]="MenuHeaderchangeeventTasks"
                                      [columns]="Taskscolumns" [autoLoad]="true" [CustomColumnsReady]="TasksCustomColumnsReady" [IsCustomTemplate]="true" (rowSelectedEvent)="onRowSelected($event)">
                    </logitude-grid>
                    <logitude-grid-v2 *ngIf="true" GridWidth="100%" GridHeight="100%" [ObjectTable]="'TaskScheduler'" [IgnoreRowHoverVisibilityQueryName]="true" [ShowArrow]="true" [dataSource]="TasksDataSource" [MenuHeaderchangeevent]="MenuHeaderchangeeventTasks"
                                      [columns]="Taskscolumns" [autoLoad]="true" [CustomColumnsReady]="TasksCustomColumnsReady" [IsCustomTemplate]="true" (rowSelectedEvent)="onRowSelected($event)" (CountReady)="LogGridDataCountReady($event)">
                    </logitude-grid-v2>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 20px;">
        <td></td>
    </tr>

     <!-- History -->
    <tr style="height:35%;">
        <td>
            <Scheduler-History [SelectedRowChanged]="SelectedRowChanged"></Scheduler-History>
        </td>
    </tr>

</table>
