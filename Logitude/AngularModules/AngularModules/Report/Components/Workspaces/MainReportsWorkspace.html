<style type="text/css">

iframe {
    width: 100%;
    min-height: 100vh;
    border: 0;
}
</style>

<table *ngIf="IsResourcesReady">
    <tr style="height:21px;" *ngIf="IsMenuVisible">
        <td>
            <ul class="PagesMenu">
                <li id="{{'Report' | IdGeneratorAsyncPipe | async}}" *ngIf="IsReportItemVisible"  [class.SelectedPageMenu]="SelectedItem == 'Report'" (click)="SelectedItem = 'Report'">Reports</li>

                <li id="{{'BI' | IdGeneratorAsyncPipe | async}}" *ngIf="IsBIItemVisible" [class.SelectedPageMenu]="SelectedItem == 'BI'" (click)="SelectedItem = 'BI'">BI</li>               

                <li id="{{'PowerBI' | IdGeneratorAsyncPipe | async}}" *ngIf="IsBIItemVisible" [class.SelectedPageMenu]="SelectedItem == 'PowerBI'" (click)="SelectedItem = 'PowerBI'">Power BI</li>               
            </ul>
        </td>
    </tr>

    <tr style="height:10px;" *ngIf="IsMenuVisible">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td class="CellStretch">
            <div class="CellContent" [hidden]="SelectedItem != 'Report'" style="overflow-x:auto">
                <div LocationDirective Code="Report"></div>
            </div>

            <div class="CellContent" [hidden]="SelectedItem != 'BI'">
                <div LocationDirective Code="BI"></div>
            </div>

            <div *ngIf="SelectedItem === 'PowerBI'">
                <iframe title="GLAccount Report" 
                    src="https://app.powerbi.com/reportEmbed?reportId=ca4642ef-db44-4db2-8bed-019a4b178791&autoAuth=true&ctid=418aea5a-d5f4-457a-b629-b678fdd11ec6" 
                    frameborder="0" allowFullScreen="true"></iframe>
            </div>
        </td>
    </tr>
</table>
