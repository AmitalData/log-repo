
<style type="text/css">
    .ReportsSectionHead {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
    }

    .ReportsSection:not(:first-child) {
        margin-top: 10px;
    }

    .ReportScheduler{
        width:23px;
        margin-left: 10px;
        margin-bottom: 2px;
        cursor: pointer;
    }
</style>

<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 300px;">
                        <SearchBox (TextChanged)="SearchTextChanged($event)"></SearchBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <div class="ReportsSection" *ngFor="let item of ItemsSource">
                        <div class="ReportsSectionHead">{{item.Name}}</div>
                        <div class="ReportsSectionBody">
                            <table>
                                <tr>
                                    <td style="width: 1px;">
                                        <div *ngFor="let Report of item.ItemsSource">
                                            <table>
                                                <tr>
                                                    <td>
                    
                                                        <HyperlinkQuery id="{{'View' + Report.Code+ 'Reportbtn' | IdGeneratorAsyncPipe | async}}" (click)="ViewReportClicked(item.GroupList, Report)">{{showLocal ? (Report.LocalName?Report.LocalName:Report.Name) : Report.Name}}</HyperlinkQuery>
                                                    </td>
                                                    <td [hidden]="!IsAvailableForScheduling || !Report.AvailableForScheduling" style="width: 20px;">
                                                        <img class="ReportScheduler" (click)="onReportSchedulerClick(item.GroupList, Report)" title="Report Scheduler" src="./Images/ReportScheduler.png" />
                                                    </td>
                                                    <td style="width:5px;" *ngIf="Report.Code == 'DSCA'">
                                                        <div></div>
                                                    </td>
                                                    <td style="width:18px;" *ngIf="Report.Code == 'DSCA'">
                                                        <HelpIcon [Text]="'Allow to analyze receivables and payables, actual and forecast on Charge level filtered by Register Date or by Operational Date'"></HelpIcon>
                                                    </td>
                                                </tr>
                                            </table>                                           
                                        </div>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </ScrollViewer>
            </div>
        </td>
    </tr>
</table>
