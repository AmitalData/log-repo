
<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 300px;">
                        <SearchBox (TextChanged)="SearchTextChanged($event)"></SearchBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td>
                        <button style="width:120px;float:left;" class="Button" (click)="NewFolderButtonClicked()">New Folder</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <div *ngFor="let item of ItemsSource">                       
                        <table>
                            <tr style="height:25px;" (mouseover)="item.FolderIconMouseOver()" (mouseleave)="item.FolderIconMouseLeave()">
                                <td style="width:25px;">
                                    <img [attr.id]="item.FolderIcon" class="CenterCenter" src="./Images/Icons/Folder_B.png" width="20" height="20"/>
                                </td>

                                <td style="width:230px; top:2px;">
                                    <p class="QueryLink" style="font-size:14px;" (click)="ViewFolderClicked(item)"> {{item.Title}}</p>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </ScrollViewer>
            </div>
        </td>
    </tr>

</table>
