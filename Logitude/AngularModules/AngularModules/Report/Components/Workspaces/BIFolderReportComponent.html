<style type="text/css">
    .ItemBox {
        height: 25px;
    }

    .DeleteButton {
        display: none;
    }

    .ItemBox:hover .DeleteButton {
        display: block;
    }

    .ItemBox:hover .DeleteButtonDisabled {
        display: block;
    }
</style>


<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 300px;">
                        <SearchBox id="{{'SearchBoxBIReport' | IdGeneratorPipe}}" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width:100px;">
                        <button id="{{'NewBIReportFolder' | IdGeneratorPipe}}" style="width:100px;float:left;" class="Button" [disabled]="IsNewBIReportFolderButtonDisabled" (click)="NewFolderButtonClicked()">New Folder</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width:100px;">
                        <button id="{{'NewBIReport' | IdGeneratorPipe}}" style="width:100px;float:left;" class="Button" [disabled]="IsNewBIReportButtonDisabled" (click)="NewReportButtonClicked()">New BI Report</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width:100px;">
                        <button *ngIf="IsShowAddReportFromLibraryLink" style="width:160px;float:left;" class="Button" (click)="LinkAddReportFromLibraryClick()">Upload a Standard BI Report</button>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr> 
    <tr *ngIf="IsTipsOpened && IsShowAddReportFromLibraryLink" style="height:80px">
        <td>
            <table>

                <tr>
                    <td>
                        <table>


                            <tr style="height:80px;margin-top:5px;">
                                <td>
                                    <div style="width:770px;">
                                        <TipsComponent [ObjectTableName]="ObjectTableName" [Code]="'BIRE'" [IsInternalTips]="'true'" [IsFirstTipLoad]="IsFirstTipLoad" (TipVisibilityChangedEvent)="TipVisibilityChanged($event)"></TipsComponent>
                                    </div>
                                    <div style="height:5px; width:100%;"></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

        </td>
    </tr>
    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <div *ngFor="let item of ItemsSource">
                        <table>
                            <tr class="ItemBox" style="height:25px;" (mouseover)="item.FolderIconMouseOver()" (mouseleave)="item.FolderIconMouseLeave()">

                                <td style="width:18px;">
                                    <div class="DeleteButton" style="width: 18px; height: 18px;">
                                        <img class="CenterCenter" src="./Images/Trash-can.png" style="cursor: pointer;" (click)="DeleteFolderClicked(item)" width="18" height="18" />
                                    </div>
                                </td>
                                <td style="width:2px;"><div></div></td>
                                <td style="width:25px;">
                                    <img [attr.id]="item.FolderIcon" class="CenterCenter" src="./Images/Icons/Folder_B.png" width="20" height="20" />
                                </td>

                                <td style="width:230px; top:2px;">
                                    <p id="{{'BIReportFolder' | IdGeneratorPipe}}" class="QueryLink" style="font-size:14px;" [ngStyle]="{color: item.LinkColor}" (click)="ViewFolderClicked(item)">{{item.Title}}</p>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </ScrollViewer>
            </div>
        </td>
    </tr>

</table>
