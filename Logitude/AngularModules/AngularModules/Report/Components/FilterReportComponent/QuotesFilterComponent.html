
<table>
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr style="height:22px">
                    <td style="color:#1B90CB;font-size:14px;">Filter By:</td>
                </tr>

                <tr style="height:28px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;"><div></div></td>

                                <td style="width:160px;">Customer:</td>
                                <td style="width:200px;">
                                    <LogLov [ObjectFieldName]="'CustomerId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Card'"
                                            [ObjectTableName]="'Quote'"
                                            [ShowInActive]="'true'">
                                    </LogLov>
                                </td>

                                <td style="width:45px;">
                                    <div></div>
                                </td>

                                <td style="width:160px;">Salesman:</td>
                                <td style="width:200px;">
                                    <LogLov [ObjectFieldName]="'SalesmanUserId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'User'"
                                            [ObjectTableName]="'Quote'"
                                            [ShowInActive]="'true'">
                                    </LogLov>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:28px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;"><div></div></td>

                                <td style="width:160px;">Open date greater than:</td>
                                <td style="width:200px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:45px;">
                                    <div></div>
                                </td>

                                <td style="width:160px">Expiration date less than:</td>
                                <td style="width:200px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:90px;">
                                    <button (click)="RunReport(true)" class="GreenButton" style="width:90px;height:22px;">Run Report</button>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>
                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
