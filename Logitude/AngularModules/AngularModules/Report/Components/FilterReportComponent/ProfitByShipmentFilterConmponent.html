
<table>
    <tr style="height:30px;">
        <td style="color:#1B90CB;font-size:14px;"> Filter By: </td>
    </tr>

    <tr style="height:30px">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <!--Partner filter-->
                    <td style="width:50px;">Partner</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'CustomerId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DisplayMemberPath]="'EnglishName'"
                                [DependencyFilter1IsList]="'true'"
                                [ShowInActive]="true"
                                [HideMaintenanceIcon]="true"
                                [DependencyFilter1Value]="'CS,AG'">
                        </LogLov>
                    </td>

                    <!--Agent filter-->
                    <td style="width:50px;">Agent</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'AgentId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DisplayMemberPath]="'EnglishName'"
                                [ShowInActive]="'true'"
                                [HideMaintenanceIcon]="true"
                                [DependencyFilter1Value]="'AG'">
                        </LogLov>
                    </td>

                    <!--Salesman filter-->
                    <td style="width:70px;">Salesman</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'SalesmanUserId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'User'"
                                [DisplayMemberPath]="'EnglishName'"
                                [ShowInActive]="'true'"
                                [HideMaintenanceIcon]="true">
                        </LogLov>
                    </td>

                    <!--Department filter-->
                    <td style="width:80px;">Department</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'DepartmentId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Department'"
                                [DisplayMemberPath]="'EnglishName'"
                                [ShowInActive]="'true'"
                                [HideMaintenanceIcon]="true">
                        </LogLov>
                    </td>

                    <td style="width:20px;">
                        <div></div>
                    </td>

                    <td style="width:80px;">
                        <button class="GreenButton" (click)="RunReport(true)">Run Report</button>
                    </td>

                    <td></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:30px">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <!--Carrier filter-->
                    <td style="width:50px;">Carrier</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'CarrierId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Carrier'"
                                [DependencyFilter1IsList]="'true'"
                                [ShowInActive]="true"
                                [HideMaintenanceIcon]="true"
                                [DependencyFilter1Value]="'AL,SL,TR'">
                        </LogLov>
                    </td>

                    <td style="width:130px">
                        <div class="RadioButton" style="width:80px">
                            <input type="radio" [attr.id]="IsOperationalDateId" [attr.name]="DateRadio" (click)="IsOperationalDateClicked() " [checked]="IsOperationalDate == true" style="width:15px" />
                            <label [attr.for]="IsOperationalDateId" style="font-size: 12px">
                                Operational Date
                            </label>
                        </div>
                    </td>

                    <td style="width:100px">
                        <div class="RadioButton" style="width:100px">
                            <input type="radio" [attr.id]="IsCreateDateId" [attr.name]="DateRadio" (click)="IsCreateDateClicked()" [checked]="IsCreateDate == true" style="width:15px" />
                            <label [attr.for]="IsCreateDateId" style="font-size: 12px">
                                Create Date
                            </label>
                        </div>
                    </td>

                    <!--From Date-->
                    <td style="width:70px;">From Date</td>
                    <td style="width:150px;">
                        <LogDatePicker [ObjectFieldName]="'FromDate'" [NoObjectField]="true" [DataContext]="DataContext"></LogDatePicker>
                    </td>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <!--To Date-->
                    <td style="width:60px;">To Date</td>
                    <td style="width:150px;">
                        <LogDatePicker [ObjectFieldName]="'ToDate'" [NoObjectField]="true" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:30px">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <!--Operationally Closed-->
                    <td style="width:22px">
                        <LogCheckBox [ObjectFieldName]="'IncludeClosed'" [DataContext]="DataContext"></LogCheckBox>
                    </td>
                    <td style="width:2px;">
                        <div></div>
                    </td>
                    <td style="width:120px">Operationally Closed</td>
                    <td style="width:20px;">
                        <div></div>
                    </td>

                    <!--Accounting Closed-->
                    <td style="width:22px">
                        <LogCheckBox [ObjectFieldName]="'IncludeAccounting'" [DataContext]="DataContext"></LogCheckBox>
                    </td>
                    <td style="width:2px;">
                        <div></div>
                    </td>
                    <td style="width:120px">Accounting Closed</td>
                    <td style="width:20px;">
                        <div></div>
                    </td>

                    <!--Include Accounted Only-->
                    <td style="width:22px">
                        <LogCheckBox [ObjectFieldName]="'IncludeAccountedOnly'" [DataContext]="DataContext"></LogCheckBox>
                    </td>
                    <td style="width:2px;">
                        <div></div>
                    </td>
                    <td style="width:120px">Include Accounted Only</td>
                    <td style="width:50px;">
                        <div></div>
                    </td>

                    <!--Curreny Filter-->
                    <td style="width:170px">
                        <table>
                            <tr>
                                <td style="width:70px">Display In</td>
                                <td>
                                    <ul class="FiltersMenu">
                                        <li (click)="SelectedCurrency=ProfitCurrencyCode" [class.SelectedFilter]="SelectedCurrency === ProfitCurrencyCode" style="width:33px;">
                                            {{ProfitCurrencyCode}}
                                        </li>
                                        <li (click)="SelectedCurrency=LocalCurrencyCode" [class.SelectedFilter]="SelectedCurrency === LocalCurrencyCode" style="width:33px;">
                                            {{LocalCurrencyCode}}
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <!--Directions Filter-->
                    <td style="width:150px">
                        <DirectionsFilter (SelectedValueChanged)="MySelectedDirectionFilter = $event"></DirectionsFilter>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
