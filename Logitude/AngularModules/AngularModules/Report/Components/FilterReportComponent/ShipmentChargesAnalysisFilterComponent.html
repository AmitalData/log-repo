
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    
    <tr style="height:30px;">
        <td style="color:#1B90CB;font-size:14px;"> Filter By: </td>
    </tr>

    <tr style="height:30px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;"><div></div></td>

                    <!--customer filter-->
                    <td style="width:90px;">Customer:</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'CustomerId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DependencyFilter1IsList]="false"
                                [DependencyFilter1Value]="'CS'"
                                [ShowInActive]="true"
                                [HideMaintenanceIcon]="true">
                        </LogLov>
                    </td>

                    <!--date filter-->
                    <td style="width:40px;">Date:</td>
                    <td style="width:150px;">
                        <ComboBox [ItemsSource]="DateFilterList" [Binding]="'Name'" [SelectedItem]="SelectedDateFilter" (SelectedItemChanged)="SelectedDateFilter = $event"></ComboBox>
                    </td>
                    <td style="width:2px;"><div></div></td>
                    <td style="width:18px;">
                        <HelpIcon [Header]="'Dates'" [Text]="'Use the actual arrival date for import, actual departure date for export and operational date for a specific operational range'"></HelpIcon>
                    </td>
                    <td style="width:20px;"><div></div></td>
                    <td style="width:40px;">From: </td>
                    <td style="width:150px;">
                        <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                    </td>
                    <td style="width:10px;"><div></div></td>
                    <td style="width:30px;">To:  </td>
                    <td style="width:150px;">
                        <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <!--run button-->
                    <td style="width:15px;"><div></div></td>
                    <td style="width:80px;">
                        <button class="GreenButton" (click)="RunReport(true)">Run Report</button>
                    </td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:32px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;"><div></div></td>

                    <!--currency filter-->
                    <td style="width:70px;">Currency: </td>
                    <td style="width: 66px;">
                        <div style="width: 66px; position: absolute; top:5px; right:0;">
                            <ul class="FiltersMenu">
                                <li style="width:33px;" (click)="OnSelectCurrency(LocalCurrencyCode)" [class.SelectedFilter]="SelectedCurrencyCode === LocalCurrencyCode" title="Local Currency">
                                    {{LocalCurrencyCode}}
                                </li>
                                <li style="width:33px;" (click)="OnSelectCurrency(ProfitCurrencyCode)" [class.SelectedFilter]="SelectedCurrencyCode === ProfitCurrencyCode" title="Profit Currency">
                                    {{ProfitCurrencyCode}}
                                </li>                                
                            </ul>
                        </div>
                    </td>

                    <!--operational filter-->
                    <td style="width:20px;"><div></div></td>
                    <td style="width:80px;">Operational: </td>
                    <td style="width: 99px;">
                        <div style="width: 99px; position: absolute; top:5px; right:0;">
                            <ul class="FiltersMenuImage">
                                <li style="width:33px;" (mouseover)="OperationalMouseOver('All')" (mouseleave)="OperationalMouseLeave('A')" (click)="OnOperationalClicked('All')" [class.SelectedFilter]="SelectedOperationalCode === 'All'">
                                    All
                                </li>
                                <li (click)="OnOperationalClicked('Open')" (mouseover)="OperationalMouseOver('Open')" (mouseleave)="OperationalMouseLeave('Open')" [class.SelectedFilter]="SelectedOperationalCode === 'Open'" title="Open">
                                    <img [attr.id]="FilterId_OO" class="CenterCenter" src="./Images/Icons/opened_n.png" style="top: 1px;height:15px" />
                                </li>
                                <li (click)="OnOperationalClicked('Close')" (mouseover)="OperationalMouseOver('Close')" (mouseleave)="OperationalMouseLeave('Close')" [class.SelectedFilter]="SelectedOperationalCode === 'Close'" title="Close">
                                    <img [attr.id]="FilterId_OC" class="CenterCenter" src="./Images/Icons/closed_n.png" style="top: 1px;height:15px" />
                                </li>

                            </ul>
                        </div>
                    </td>

                    <!--accounting filter-->
                    <td style="width:20px;"><div></div></td>
                    <td style="width:80px;">Accounting: </td>
                    <td style="width: 99px;">
                        <div style="width: 99px; position: absolute; top:5px; right:0;">
                            <ul class="FiltersMenuImage">
                                <li style="width:33px;" (mouseover)="AccountingMouseOver('All')" (mouseleave)="AccountingMouseLeave('All')" (click)="OnAccountingClicked('All')" [class.SelectedFilter]="SelectedAccountingCode === 'All'">
                                    All
                                </li>
                                <li (click)="OnAccountingClicked('Open')" (mouseover)="AccountingMouseOver('Open')" (mouseleave)="AccountingMouseLeave('Open')" [class.SelectedFilter]="SelectedAccountingCode === 'Open'" title="Open">
                                    <img [attr.id]="FilterId_AO" class="CenterCenter" src="./Images/Icons/opened_n.png" style="top: 1px;height:17px" />
                                </li>
                                <li (click)="OnAccountingClicked('Close')" (mouseover)="AccountingMouseOver('Close')" (mouseleave)="AccountingMouseLeave('Close')" [class.SelectedFilter]="SelectedAccountingCode === 'Close'" title="Close">
                                    <img [attr.id]="FilterId_AC" class="CenterCenter" src="./Images/Icons/closed_n.png" style="top: 1px;height:17px" />
                                </li>

                            </ul>
                        </div>
                    </td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:30px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;"><div></div></td>

                    <!--charges type filter-->
                    <td style="width:90px;">Charges Type:</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'ChargesTypeId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'ChargesType'"
                                [ShowInActive]="true"
                                [HideMaintenanceIcon]="true">
                        </LogLov>
                    </td>

                    <!--Receivables-->
                    <td style="width:30px;"><div></div></td>
                    <td style="width:90px;">Receivables:</td>
                    <td style="width:140px;">
                        <ComboBox [IsDisabled]="!ReceivablesFilterEnabled" [ItemsSource]="FiltersComboList" [Binding]="'Name'" [SelectedItem]="ReceivablesFilterSelectedItem" (SelectedItemChanged)="ReceivablesFilterSelectedItem = $event"></ComboBox>
                    </td>

                    <!--Payables-->
                    <td style="width:30px;"><div></div></td>
                    <td style="width:80px;">Payables:</td>
                    <td style="width:140px;">
                        <ComboBox [IsDisabled]="!PayablesFilterEnabled" [ItemsSource]="FiltersComboList" [Binding]="'Name'" [SelectedItem]="PayablesFilterSelectedItem" (SelectedItemChanged)="PayablesFilterSelectedItem = $event"></ComboBox>
                    </td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
