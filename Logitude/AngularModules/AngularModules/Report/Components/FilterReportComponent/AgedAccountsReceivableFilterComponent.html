
<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }

        .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }

    .selected {
        background-color: blue;
        cursor: auto;
        pointer-events: none;
    }



    .notSelected {
        background-color: white;
    }

        .notSelected:hover {
            background-color: #F0F8FF;
            cursor: pointer;
        }
</style>

<table style="height:60px;width:550px;">

            <table>
                <tr>
                    <td style="width:5px;">
                        <div></div>
                    </td>

                </tr>
            </table>
        </td>

    </tr>

    <tr style="height:30px">

            <table>
                <tr>

                    </td>

                    <td style="width:260px; float:left">
                        <table>
                            <tr>
                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:auto">
                                                <div class="RadioButton">
                                                    <input type="radio" id="All" name="shipmentType" (click)="settingShipmentTypeCode('All')" [checked]="ShipmentTypeRadio == 'All'" style="width:15px" />
                                                    <label for="All" style="font-size: 12px">
                                                        All
                                                    </label>
                                                </div>

                                            </td>

                                            <td style="width:5px;">
                                                <div></div>
                                            </td>

                                            <td style="width:auto">
                                                <div class="RadioButton">
                                                    <input type="radio" id="AP" name="shipmentType" (click)="settingShipmentTypeCode('AP') " [checked]="ShipmentTypeRadio == 'AP'" style="width:15px" />
                                                    <label for="AP" style="font-size: 12px">
                                                        AP Only
                                                    </label>
                                                </div>
                                            </td>

                                            <td style="width:20px;">
                                                <div></div>
                                            </td>

                                            <td style="width:auto">
                                                <div class="RadioButton">
                                                    <input type="radio" id="AR" name="shipmentType" (click)="settingShipmentTypeCode('AR') " [checked]="ShipmentTypeRadio == 'AR'" style="width:15px" />
                                                    <label for="AR" style="font-size: 12px">
                                                        AR Only
                                                    </label>
                                                </div>
                                            </td>

                                            <td><div></div></td>
                                    </table>
                                </td>
                        </table>

                    </td>

                    <td style="width:90px;">
                        <button (click)="RunReport(true)" class="greenButton" style="width:90px;height:22px;border:1px solid green;border-radius:3px;">
                            <div style="color:black;  text-align:center;vertical-align:central;font-size:12px;">Run Report</div>
                        </button>
                    </td>
                </tr>
            </table>
        </td>

    </tr>
</table>
