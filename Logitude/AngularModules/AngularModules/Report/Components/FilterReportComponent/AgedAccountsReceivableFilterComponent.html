
<table>
    <tr style="height:30px;">
        <td style="color:#1B90CB;font-size:14px;"> Filter By: </td>
    </tr>

    <tr style="height:30px">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <td style="width:260px;">
                        <table>
                            <tr>
                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:auto">
                                                <div class="RadioButton">
                                                    <input type="radio" id="All" name="shipmentType" (click)="settingShipmentTypeCode('All')" [checked]="ShipmentTypeRadio == 'All'" style="width:15px" />
                                                    <label for="All" style="font-size: 12px">
                                                        All
                                                    </label>
                                                </div>

                                            </td>

                                            <td style="width:5px;">
                                                <div></div>
                                            </td>

                                            <td style="width:auto">
                                                <div class="RadioButton">
                                                    <input type="radio" id="AP" name="shipmentType" (click)="settingShipmentTypeCode('AP') " [checked]="ShipmentTypeRadio == 'AP'" style="width:15px" />
                                                    <label for="AP" style="font-size: 12px">
                                                        AP Only
                                                    </label>
                                                </div>
                                            </td>

                                            <td style="width:20px;">
                                                <div></div>
                                            </td>

                                            <td style="width:auto">
                                                <div class="RadioButton">
                                                    <input type="radio" id="AR" name="shipmentType" (click)="settingShipmentTypeCode('AR') " [checked]="ShipmentTypeRadio == 'AR'" style="width:15px" />
                                                    <label for="AR" style="font-size: 12px">
                                                        AR Only
                                                    </label>
                                                </div>
                                            </td>

                                            <td><div></div></td>
                                    </table>
                                </td>
                        </table>

                    </td>

                    <td style="width:30px;">
                        <div></div>
                    </td>

                    <!--Curreny Filter-->
                    <td style="width:170px">
                        <table>
                            <tr>
                                <td style="width:70px">Display In</td>
                                <td>
                                    <ul class="FiltersMenu">
                                        <li title="Profit Currency" (click)="SelectedCurrency=ProfitCurrencyCode" [class.SelectedFilter]="SelectedCurrency === ProfitCurrencyCode" style="width:33px;">
                                            {{ProfitCurrencyCode}}
                                        </li>
                                        <li title="Local Currency" (click)="SelectedCurrency=LocalCurrencyCode" [class.SelectedFilter]="SelectedCurrency === LocalCurrencyCode" style="width:33px;">
                                            {{LocalCurrencyCode}}
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width:30px;">
                        <div></div>
                    </td>

                    <td style="width:80px;">
                        <button class="GreenButton" (click)="RunReport(true)">Run Report</button>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>

    </tr>
</table>
