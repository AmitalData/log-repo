


<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }

        .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }

    .selected {
        background-color: blue;
        cursor: auto;
        pointer-events: none;
    }



    .notSelected {
        background-color: white;
    }

        .notSelected:hover {
            background-color: #F0F8FF;
            cursor: pointer;
        }
</style>






<div *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:25px;">

    <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>

</div>

<table style="height:75px;width:550px;">

    <tr style="height:25px">
        <td style="width:5px;">
            <div style="width:5px;"></div>
        </td>
        <td colspan="10">
            <div style="color:#1B90CB;font-size:14px;">Filter By:</div>
        </td>
    </tr>



    <tr style="height:30px">
        <td style="width:5px;">
            <div style="width:5px;"></div>
        </td>

        <td style="width:70px;min-width:70px;max-width:70px" class="Label">Customer</td>
        <td style="width:200px;">
            <div style="width:200px;">

                <LogLov [ObjectFieldName]="'CustomerId'"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Card'"
                        [DependencyFilter1IsList]="'true'"
                        [DependencyFilter1Value]="'CS,CG,AG,SG,SL,TR,VD,AL'"
                        [SelectedValue]="CustomerId">
                </LogLov>

            </div>
        </td>


        <td style="width:5px;min-width:5px;max-width:5px"></td>

        <td style="width:70px;">
            <div style="width:70px;">Branch</div>
        </td>

        <td style="width:200px;">
            <div style="width:200px;">

                <LogLov [ObjectFieldName]="'BranchId'"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Branch'"
                        [DisplayMemberPath]="'EnglishName'"
                        [DependencyFilter1IsList]="'true'"
                        [ShowInActive]="'false'"
                        [DependencyFilter1Value]="''">


                </LogLov>

            </div>
        </td>
        <td>
            <table>
                <tr>


                    <td>
                        <table>
                            <tr>
                                <td style="width:10px">
                                    <div style="width:10px"></div>
                                </td>
                                <td style="width:70px;">
                                    <div style="width:70px">From Date:</div>
                                </td>

                                <td style="width:120px;">
                                    <div style="width:120px;">

                                        <LogDatePicker [HideColumns]="true" [LogitudeForm]="myForm" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                    </div>

                                </td>
                            </tr>
                        </table>


                    </td>


                    <td style="width:30px">
                        <div style="width:30px"></div>
                    </td>
                    <td>
                        <table>
                            <tr>

                                <td style="width:55px;">
                                    <div style="width:55px;"> To Date: </div>
                                </td>

                                <td style="width:120px;">
                                    <div style="width:120px;">
                                        <LogDatePicker [HideColumns]="true" [LogitudeForm]="myForm" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                    </div>
                                </td>

                            </tr>
                        </table>
                    </td>
                    <td style="width:30px">
                        <div style="width:30px"></div>
                    </td>

                    <td style="width:90px;">
                        <button (click)="RunReport(true)" class="greenButton" style="width:90px;height:22px;border:1px solid green;border-radius:3px;">
                            <div style="color:black;  text-align:center;vertical-align:central;font-size:12px;">Run Report</div>
                        </button>

                    </td>
                    <td></td>


            </table>

        </td>




    </tr>
    <tr>
        <td style="height:5px">
            <div style="height:5px"></div>
        </td>
    </tr>
    <tr>
        <td></td>

        <td colspan="9">
            <table>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td style="width:70px">
                                    <label>Currency:</label>
                                </td>

                                <td style="width:110px">
                                    <div class="RadioButton" style="width:110px">
                                        <input type="radio" [id]="LocalCurrency" [attr.name]="LocalCurrency" (click)="setLocalCurrency('true')" [checked]="IsLocalCurrency == true" style="width:15px" />
                                        <label [attr.for]="LocalCurrency" style="font-size: 12px">
                                            Local Currency
                                        </label>
                                    </div>

                                </td>


                                <td style="width:20px;">
                                    <div style="width:20px;"></div>
                                </td>

                                <td style="width:130px">
                                    <div class="RadioButton" style="width:130px">

                                        <input type="radio" [id]="InvoiceCurrency" [attr.name]="LocalCurrency" (click)="setLocalCurrency('false')" [checked]="IsLocalCurrency == false" style="width:15px" />
                                        <label [attr.for]="InvoiceCurrency" style="font-size: 12px">
                                            Payment Currency
                                        </label>

                                    </div>
                                </td>

                                <td style="width:16px;">
                                    <div></div>
                                </td>



                                <td style="width:200px">

                                    <LogLov [ObjectFieldName]="'CurrencyId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Currency'"
                                            [SelectedValue]="CurrencyId">
                                    </LogLov>

                                </td>


                                <td>
                                    <div></div>
                                </td>
                        </table>

                    </td>
                </tr>
            </table>
        </td>

        <td></td>



        <td colspan="4"></td>

    </tr>
    <tr>
        <td colspan="9"></td>
    </tr>


</table>
