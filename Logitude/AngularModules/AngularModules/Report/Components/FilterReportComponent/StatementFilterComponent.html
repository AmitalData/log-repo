
<table>
    <tr style="height:30px;">
        <td style="color:#1B90CB;font-size:14px;"> Filter By: </td>
    </tr>

    <tr style="height:30px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;"><div></div></td>

                    <td style="width:60px" class="Label">Partner:</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'CustomerId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DisplayMemberPath]="'EnglishName'"
                                [DependencyFilter1IsList]="'true'"
                                [ShowInActive]="'true'"
                                [DependencyFilter1Value]="'AG,CS,AL,SL,CC,VD,CG,CO,OT,SG,TR,WH'">
                        </LogLov>
                    </td>

                    <td style="width:20px;"><div></div></td>
                    <td style="width:70px;">Currency:</td>
                    <td style="width:150px; ">
                        <ComboBox [ItemsSource]="CurrenciesComboList" [SelectedItem]="SelectedItemComboBox" [Binding]="'Name'" (SelectedItemChanged)="SelectedItemComboBox = $event"></ComboBox>
                    </td>
                    <td style="width:20px;"><div></div></td>

                    <td style="width:85px" class="Label">Due Date To:</td>
                    <td style="width:150px;">
                        <LogDatePicker [ObjectFieldName]="'DueDate'" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td style="width: 20px;"><div></div></td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="IncludeDraftInvoices" (Checked)="IncludeDraftInvoices = $event" [Text]="'Include Draft Invoices'"></CheckBox>
                    </td>

                    <td style="width:50px;"><div></div></td>

                    <td style="width:80px;">
                        <button class="GreenButton" (click)="RunReport(true)">Run Report</button>
                    </td>

                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:30px">
        <td>
            <table>
                <tr>
                    <td style="width:10px;"><div></div></td>

                    <td style="width:110px; vertical-align:middle;">
                        <ul class="FiltersMenu">
                            <li (click)="ARAPItemClicked('All')" (mouseover)="ARAPMouseOver('All')" [class.SelectedFilter]="ARAPSelectedValue === 'All'">
                                All
                            </li>
                            <li (click)="ARAPItemClicked('AR')" (mouseover)="ARAPMouseOver('AR')" (mouseleave)="ARAPMouseLeave('AR')" [class.SelectedFilter]="ARAPSelectedValue === 'AR'">
                                AR
                            </li>
                            <li (click)="ARAPItemClicked('AP')" (mouseover)="ARAPMouseOver('AP')" (mouseleave)="ARAPMouseLeave('AP')" [class.SelectedFilter]="ARAPSelectedValue === 'AP'">
                                AP
                            </li>
                        </ul>
                    </td>

                    <td style="width:50px;">
                        <div></div>
                    </td>

                    <td style="width:160px; vertical-align:middle;">
                        <ul class="FiltersMenu">
                            <li (click)="InvoicePaymentItemClicked('All')" (mouseover)="InvoicePaymentMouseOver('All')" [class.SelectedFilter]="InvoicePaymentSelectedValue === 'All'">
                                All
                            </li>
                            <li style="width:60px;" (click)="InvoicePaymentItemClicked('Invoices')" (mouseover)="InvoicePaymentMouseOver('Invoices')" (mouseleave)="InvoicePaymentMouseLeave('Invoices')" [class.SelectedFilter]="InvoicePaymentSelectedValue === 'Invoices'">
                                Invoices
                            </li>
                            <li style="width:70px;" (click)="InvoicePaymentItemClicked('Payments')" (mouseover)="InvoicePaymentMouseOver('Payments')" (mouseleave)="InvoicePaymentMouseLeave('Payments')" [class.SelectedFilter]="InvoicePaymentSelectedValue === 'Payments'">
                                Payments
                            </li>
                        </ul>
                    </td>

                    <td><div></div></td>
                </tr>
            </table>
        </td>       
    </tr>
</table>
