


<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }
     .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }
    .selected {
        background-color: blue;
        cursor: auto;
        pointer-events: none;
    }



    .notSelected {
        background-color: white;
    }

        .notSelected:hover {
            background-color: #F0F8FF;
            cursor: pointer;
        }
</style>









<table style="height:60px">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td style="width:55px">
            <table>


                <tr style="height:25px">
                    <td style="width:5px;"><div style="width:5px;"></div></td>
                    <td colspan="10"><div style="color:#1B90CB;font-size:14px;">Filter By:</div></td>
                </tr>



                <tr style="height:30px">
                    <td style="width:5px;"><div style="width:5px;"></div></td>


                    <td style="width:70px;"><div style="width:70px;">Branch</div></td>

                    <td style="width:200px;">
                        <div style="width:200px;">

                            <LogLov [ObjectFieldName]="'BranchId'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Branch'"
                                    [DisplayMemberPath]="'EnglishName'"
                                    [DependencyFilter1IsList]="'true'"
                                    [ShowInActive]="'true'"
                                    [DependencyFilter1Value]="''">


                            </LogLov>

                        </div>
                    </td>

                    <td>
                        <table>
                            <tr>
                                <td style="width:400px">
                                    <table>
                                        <tr>
                                            <td style="width:7px"><div style="width:7px"></div></td>

                                            <td style="width:100px">
                                                <div class="RadioButton" style="width:100px">
                                                    <input type="radio" [attr.id]="InvoiceDate" [attr.name]="InvoiceTypeRadio" (click)="settingShipmentTypeCode('InvoiceDate')" [checked]="ShipmentTypeRadio == 'InvoiceDate'" style="width:15px" />
                                                    <label [attr.for]="InvoiceDate" style="font-size: 12px">
                                                        Invoice Date
                                                    </label>
                                                </div>

                                            </td>


                                            <td style="width:5px;"><div style="width:5px;"></div></td>

                                            <td style="width:100px">
                                                <div class="RadioButton" style="width:100px">

                                                    <input type="radio"  [attr.id]="CreateDate"  [attr.name]="InvoiceTypeRadio" (click)="settingShipmentTypeCode('CreateDate') " [checked]="ShipmentTypeRadio == 'CreateDate'" style="width:15px" />
                                                    <label [attr.for]="CreateDate" style="font-size: 12px">
                                                        Create Date
                                                    </label>

                                                </div>

                                            </td>
                                            <td></td>


                                    </table>

                                </td>

                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:10px"><div style="width:10px"></div></td>
                                            <td style="width:70px;"><div style="width:70px">From Date:</div></td>

                                            <td style="width:120px;">
                                                <div style="width:120px;">

                                                    <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                                </div>

                                            </td>
                                        </tr>
                                    </table>


                                </td>


                                <td style="width:30px"><div style="width:30px"></div></td>
                                <td>
                                    <table>
                                        <tr>

                                            <td style="width:55px;"><div style="width:55px;"> To Date: </div></td>

                                            <td style="width:120px;">
                                                <div style="width:120px;">
                                                    <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                                </div>
                                            </td>

                                        </tr>
                                    </table>
                                </td>
                                <td></td>


                        </table>

                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td colspan="9">
                        <table>
                            <tr>
                                <td>
                                    <table>
                                        <tr>


                                            <td style="width:400px">
                                                <table>
                                                    <tr>
                                                        <td style="width:7px"><div style="width:7px"></div></td>

                                                        <td style="width:110px">
                                                            <div class="RadioButton" style="width:110px">
                                                                <input type="radio" [attr.id]="LocalCurrency" [attr.name]="LocalCurencyRadio" (click)="ChangeCurrency(true)" [checked]="IsLocalCurrency == true" style="width:15px" />
                                                                <label [attr.for]="LocalCurrency" style="font-size: 12px">
                                                                    Local Currency
                                                                </label>
                                                            </div>

                                                        </td>


                                                        <td style="width:20px;"><div style="width:20px;"></div></td>

                                                        <td style="width:110px">
                                                            <div class="RadioButton" style="width:110px">

                                                                <input type="radio" [attr.id]="InvoiceCurrency" [attr.name]="LocalCurencyRadio" (click)="ChangeCurrency(false)" [checked]="IsLocalCurrency == false" style="width:15px" />
                                                                <label [attr.for]="InvoiceCurrency" style="font-size: 12px">
                                                                    Invoice Currency
                                                                </label>

                                                            </div>

                                                        </td>
                                                        <td style="width:40px;"><div style="width:40px;"></div></td>

                                                        <td style="width:22px">
                                                            <div style="width:22px">

                                                                <LogCheckBox [ObjectFieldName]="'IncludeVoidInvoices'" [DataContext]="DataContext"></LogCheckBox>

                                                            </div>

                                                        </td>
                                                        <td style="width:100px">
                                                            <div style="margin-left:0px;margin-top:0px"><label style="font-size:x-small">Include Void Invoices</label></div>
                                                        </td>


                                                        <td style="width:20px"><div style="width:20px"></div></td>

                                                        <td style="width:22px">
                                                            <div style="width:22px">

                                                                <LogCheckBox [ObjectFieldName]="'IncludeWaiting'" [DataContext]="DataContext"></LogCheckBox>

                                                            </div>
                                                        </td>
                                                        <td style="width:100px">
                                                            <div style="margin-left:0px;margin-top:0px"><label style="font-size:x-small"> {{IncludeStatusString}}</label></div>
                                                        </td>

                                                        <td style="width:30px"><div style="width:30px"></div></td>

                                                        <td style="width:90px;">
                                                            <button (click)="RunReport(true)" class="greenButton" style="width:90px;height:22px;border:1px solid green;border-radius:3px;">
                                                                <div style="color:black;  text-align:center;vertical-align:central;font-size:12px;">Run Report</div>
                                                            </button>

                                                        </td>
                                                        <td></td>
                                                </table>

                                            </td>

                                    </table>

                                </td>
                            </tr>
                        </table>

                    </td>
                    <td></td>
                    <td colspan="4"></td>
                </tr>
                <tr><td colspan="9"></td></tr>
            </table>
        </td>
        <td></td>
    </tr>
</table>
