
<table>
    <tr style="height:22px">
        <td style="color:#1B90CB;font-size:14px;">Filter By:</td>
    </tr>

    <tr style="height:28px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="IsImport" (Checked)="IsImport = $event" [Text]="'Import'"></CheckBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="IsExport" (Checked)="IsExport = $event" [Text]="'Export'"></CheckBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="IsDomestic" (Checked)="IsDomestic = $event" [Text]="'Domestic'"></CheckBox>
                    </td>

                    <td style="width:100px">
                        <div></div>
                    </td>

                    <td style="width:100px;">
                        <label>Shipment Type:</label>
                    </td>

                    <td style="width:70px">
                        <RadioButton [Name]="'ShipmentTypeRadioFilter'" [IsChecked]="ShipmentTypeRadio == 'All'" (Checked)="SetShipmentTypeRadio('All')" [Text]="'All'"></RadioButton>
                    </td>

                    <td style="width:5px;">
                        <div></div>
                    </td>

                    <td style="width:70px">
                        <RadioButton [Name]="'ShipmentTypeRadioFilter'" [IsChecked]="ShipmentTypeRadio == 'FCLD'" (Checked)="SetShipmentTypeRadio('FCLD')" [Text]="'FCL'"></RadioButton>
                    </td>

                    <td style="width:5px;">
                        <div></div>
                    </td>

                    <td style="width:70px">
                        <RadioButton [Name]="'ShipmentTypeRadioFilter'" [IsChecked]="ShipmentTypeRadio == 'LCLD'" (Checked)="SetShipmentTypeRadio('LCLD')" [Text]="'LCL'"></RadioButton>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:28px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <td style="width:50px;">Partner:</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'CustomerId'"
                                [ObjectTableName]="'Shipment'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DisplayMemberPath]="'EnglishName'"
                                [DependencyFilter1IsList]="'true'"
                                [ShowInActive]="InActive"
                                [DependencyFilter1Value]="'AG,CS'">
                        </LogLov>
                    </td>

                    <td style="width:20px">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="InActive" (Checked)="InActive = $event" [Text]="'Inactive'"></CheckBox>
                    </td>

                    <td style="width:20px">
                        <div></div>
                    </td>

                    <td style="width:100px;">From Date:</td>

                    <td style="width:120px;">
                        <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td style="width:50px">
                        <div></div>
                    </td>

                    <td style="width:50px;">To Date:</td>

                    <td style="width:120px;">
                        <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <td style="width:50px">
                        <div></div>
                    </td>

                    <td style="width:90px;">
                        <button (click)="RunReport(true)" class="GreenButton" style="width:90px;height:22px;">Run Report</button>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td> 
    </tr>
</table>
