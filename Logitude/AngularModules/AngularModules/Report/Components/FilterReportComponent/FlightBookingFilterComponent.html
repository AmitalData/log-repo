
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="9">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:30px;">
        <td style="color:#1B90CB;font-size:14px;"> Filter By: </td>
    </tr>

    <tr style="height:30px;">
        <td>
            <table>
                <tr>
                    <td style="width:10px;">
                        <div></div>
                    </td>

                    <td style="width:80px;">Flight Date:</td>
                    <td style="width:150px;">
                        <LogDatePicker [ObjectTableName]="ObjectTableName" [ObjectFieldName]="'FlightDate'" [DataContext]="DataContext" [NoObjectField]="true"></LogDatePicker>
                    </td>

                    <td style="width:80px;">Flight Number:</td>
                    <td style="width:150px;">
                        <LogTextBox [ObjectTableName]="ObjectTableName" [ObjectFieldName]="'FlightNumber'" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td style="width:100px;">Custom Agent:</td>
                    <td style="width:200px;">
                        <LogLov [ObjectFieldName]="'CustomAgentId'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DependencyFilter1Value]="'CG'"
                                [ShowInActive]="true"
                                [HideMaintenanceIcon]="true">
                        </LogLov>
                    </td>

                    <td style="width:25px;"><div></div></td>
                    <td style="width:80px;">
                        <button class="GreenButton" (click)="RunReport(true)">Run Report</button>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
