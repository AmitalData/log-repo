
<table>
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr style="height:22px">
                    <td style="color:#1B90CB;font-size:14px;">Filter By:</td>
                </tr>

                <tr style="height:28px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:70px">From Date:</td>
                                <td style="width:130px">
                                    <AdvancedDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [SelectedDateValue]="FromDate" [DataContext]="DataContext" [ShowToolTip]="true" [InputType]="'date'" [TimeMode]="'12'"></AdvancedDatePicker>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:60px">To Date:</td>
                                <td style="width:130px">
                                    <AdvancedDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDate'" [SelectedDateValue]="ToDate" [DataContext]="DataContext" [ShowToolTip]="true" [InputType]="'date'" [TimeMode]="'12'"></AdvancedDatePicker>
                                </td>
                                <td style="width:20px"><div></div></td>
                                <td style="width:90px;">
                                    <button (click)="RunReport(true)" class="GreenButton" style="width:90px;height:22px;">{{RunReportTitle}}</button>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>


            </table>
        </td>
    </tr>
</table>
