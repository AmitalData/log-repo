


<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }

        .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }
</style>









<table style="height:60px;width:740px;">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:25px">
        <td style="width:5px;"><div style="width:5px;"></div></td>
        <td><div style="color:#1B90CB;font-size:14px;">Filter By:</div></td>
    </tr>



    <tr style="height:30px">
        <td colspan="2">
            <table>
                <tr>
                    <td style="width:5px;"><div style="width:5px;"></div></td>
                    <td style="width:22px">
                        <LogCheckBox [NoObjectField]="true" [ObjectFieldName]="'IncludeShipmentsDetails'" [DataContext]="DataContext"></LogCheckBox>
                    </td>
                    <td style="width:150px;">Include Shipments Details</td>

                    <td>
                        <div></div>
                    </td>



                    <td style="width:20px"><div style="width:20px"></div></td>

                    <td style="width:65px;"><div style="width:65px;margin-left:-10px"> From Date </div></td>

                    <td style="width:120px;">
                        <div style="width:120px;">

                            <LogDatePicker [HideColumns]="true" [LogitudeForm]="myForm" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                        </div>

                    </td>

                    <td style="width:20px"><div style="width:20px"></div></td>
                    <td style="width:50px;"><div style="width:50px;"> To Date </div></td>
                    <td style="width:120px;">
                        <div style="width:120px;">
                            <LogDatePicker [HideColumns]="true" [LogitudeForm]="myForm" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>

                        </div>

                    </td>

                    <td style="width:60px"><div style="width:60px"></div></td>

                    <td style="width:90px;">
                        <button (click)="RunReport(true)" class="greenButton" style="width:90px;height:22px;border:1px solid green;border-radius:3px;">
                            <div style="color:black;  text-align:center;vertical-align:central;font-size:12px;">{{RunReportTitle}}</div>
                        </button>

                    </td>

                </tr>
            </table>
        </td>




    </tr>

    <tr><td colspan="2"></td></tr>

</table>
