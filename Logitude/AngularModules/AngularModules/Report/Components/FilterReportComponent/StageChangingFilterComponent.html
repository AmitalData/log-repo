
<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }
     .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }
    .selected {
        background-color: blue;
        cursor: auto;
        pointer-events: none;
    }



    .notSelected {
        background-color: white;
    }

        .notSelected:hover {
            background-color: #F0F8FF;
            cursor: pointer;
        }
</style>









<div style="width:100%;height:85px;">
    <div style="position:absolute;top:0;bottom:0;left:0;right:0;overflow-x:auto;overflow-y:hidden;height:85px">
        <div class="ScrollContent">
            <table style="height:85px;overflow:scroll;">
                <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                    <td colspan="2">
                        <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                    </td>
                </tr>
                        <tr style="height:25px">
                            <td>
                                <table>
                                    <tr>
                                        <td style="width:5px;"></td>
                                        <td><div style="color:#1B90CB;font-size:14px;">Filter By:</div></td>

                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr style="height:30px">
                            <td>
                                <table>
                                    <tr>
                                        <td style="width:5px;"></td>

                                        <td style="width:130px">
                                            <div class="RadioButton" style="width:130px">
                                                <input type="radio" [attr.id]="IsOpportunitesDateId" [attr.name]="ShipmentTypeRadio" (click)="IsOpportunitesDateClicked()" [checked]="IsOpportunitesDate==true" style="width:15px" />
                                                <label [attr.for]="IsOpportunitesDateId" style="font-size: 12px">
                                                    Opportunity Date
                                                </label>
                                            </div>

                                        </td>


                                        <td style="width:5px;"><div style="width:5px;"></div></td>

                                        <td style="width:170px">
                                            <div class="RadioButton" style="width:170px">

                                                <input type="radio" [attr.id]="IsStageDateId" [attr.name]="ShipmentTypeRadio" (click)="IsStageDateClicked() " [checked]="IsStageDate==true" style="width:15px" />
                                                <label [attr.for]="IsStageDateId" style="font-size: 12px">
                                                    Stage Changing Date
                                                </label>

                                            </div>

                                        </td>

                                        <td style="width:80px"><label>From Date:</label></td>
                                        <td style="width:120px">

                                            <div style="width:120px;">
                                                <LogDatePicker style="width:120px" [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                            </div>
                                        </td>
                                        <td style="width:25px;min-width:10px"></td>
                                        <td style="width:65px"><label>To Date:</label></td>
                                        <td style="width:120px">
                                            <div style="width:120px;">
                                                <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                            </div>
                                        </td>

                                        <td style="width:25px;min-width:10px"></td>

                                        <td style="width:50px;"><div style="width:50px;">Owner</div></td>

                                        <td style="width:200px;">
                                            <div style="width:200px;">

                                                <LogLov [ObjectFieldName]="'OwnerId'"
                                                        [ObjectTableName]="'OpportunityStage'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'User'"
                                                        [ShowInActive]="true"
                                                        [HideAddLink]="true"
                                                        [HideAdd]="true"
                                                        [HideMaintenanceIcon]="true"
                                                        >



                                                </LogLov>

                                            </div>
                                        </td>
                                        <td style="width:90px;min-width:90px"><label>Lead Sources: </label></td>
                                        <td style="width:120px">

                                            <div style="width:120px;">
                                                <ComboBoxWithInCheckBox style="width:120px;float:left;" [CheckBoxOnly]="'true'" [SelectedItem]="SelectedProdustsItem" (EditedItemSource)="EditedItemSource($event)" [ItemsSource]="FilterdAdditionalService" (SelectedItemChanged)="SelectedItemChanged($event)" [Binding]="'lastTitle'"></ComboBoxWithInCheckBox>
                                            </div>




                                        </td>

                                        <td style="width:120px"><div style="width:120px;margin-left:30px">Opportunity Type:</div></td>

                                        <td style="width:200px;">
                                            <div style="width:200px;">

                                                <LogLov [ObjectFieldName]="'OpportunityTypeId'"
                                                        [ObjectTableName]="'Opportunity'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'OpportunityType'"
                                                        [HideAddLink]="true"
                                                        [HideAdd]="true"
                                                        [HideMaintenanceIcon]="true"
                                                        >
                                                        



                                                </LogLov>

                                            </div>
                                        </td>



                                        <td style="width:10px;"><div style="width:10px;"></div></td>

                                        <td style="width:90px;">
                                            <button (click)="RunReport(true)" class="greenButton" style="width:90px;height:22px;border:1px solid green;border-radius:3px;">
                                                <div style="color:black;  text-align:center;vertical-align:central;font-size:12px;">Run Report</div>
                                            </button>

                                        </td>
                                        <td></td>
                                    </tr>
                                </table>
                            </td>
                         
                            </tr>
                </table>
                
                            



</div>
</div>
</div>
