
<table>
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr style="height:22px">
                    <td style="color:#1B90CB;font-size:14px;">Filter By:</td>
                </tr>

                <tr style="height:28px">
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <table>
                                      <tr>
                                        <td style="width:100px;">Create Date:</td>
                                        <td style="width:50px">From:</td>
                                        <td style="width:120px">
                                          <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                        </td>

                                        <td style="width:15px"></td>
                                        <td style="width:90px">To:</td>
                                        <td style="width:120px">
                                          <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                        </td>

                                        <td style="width:15px"></td>
                                        <td style="width:120px;">Opportunities Type:</td>
                                        <td style="width:200px;">
                                          <LogLov [ObjectFieldName]="'OpportunityTypeId'"
                                                  [ObjectTableName]="'Opportunity'"
                                                  [DataContext]="DataContext"
                                                  [LookUpTableName]="'OpportunityType'"
                                                  [HideAddLink]="true"
                                                  [HideAdd]="true"
                                                  [HideEdit]="true"
                                                  [HideMaintenanceIcon]="true">
                                          </LogLov>
                                        </td>

                                        <td style="width:15px"></td>
                                        <td style="width:90px">Business Unit: </td>
                                        <td style="width:200px">
                                          <LogLov [ObjectFieldName]="'BusinessUnitId'"
                                                  [ObjectTableName]="'Opportunity'"
                                                  [DataContext]="DataContext"
                                                  [LookUpTableName]="'BusinessUnit'"
                                                  [HideMaintenanceIcon]="true">
                                          </LogLov>
                                        </td>

                                        <td style="width:15px"></td>
                                        <td style="width:100px;">
                                          <label>Stage Count:</label>
                                        </td>

                                        <td style="width:80px">
                                          <RadioButton [Name]="'StageCountRadioFilter'" [IsChecked]="StageCountRadio == 'Actual'" (Checked)="SetStageCountRadio('Actual')" [Text]="'Actual Data'"></RadioButton>
                                        </td>

                                        <td style="width:5px;">
                                          <div></div>
                                        </td>

                                        <td style="width:70px">
                                          <RadioButton [Name]="'StageCountRadioFilter'" [IsChecked]="StageCountRadio == 'Adjusted'" (Checked)="SetStageCountRadio('Adjusted')" [Text]="'Adjusted'"></RadioButton>
                                        </td>

                                        <td style="width:15px"></td>
                                        <td style="width:90px;">
                                          <button (click)="RunReport(true)" class="GreenButton" style="width:90px;height:22px;">Run Report</button>
                                        </td>

                                        <td></td>
                                      </tr>
                                    </table>
                                </td>                               
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:28px">
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <table>
                                        <tr>
                                            <td style="width:270px;">
                                                <table *ngIf="IsCRMTenant">
                                                    <tr>
                                                        <td style="width:100px;">Reseller:</td>
                                                        <td style="width:170px;">
                                                            <LogLov [ObjectFieldName]="'ResellerId'"
                                                                    [DataContext]="DataContext"
                                                                    [ObjectTableName]="'Opportunity'"
                                                                    [LookUpTableName]="'Card'"
                                                                    [HideAddLink]="true"
                                                                    [HideAdd]="true"
                                                                    [HideEdit]="true"
                                                                    [HideMaintenanceIcon]="true"
                                                                    [HideColumns]="true">
                                                            </LogLov>
                                                        </td>
                                                        <td><div></div></td>
                                                    </tr>
                                                </table>
                                            </td>

                                            <td style="width:15px"></td>
                                            <td style="width:90px">Lead Sources: </td>
                                            <td style="width:120px">
                                                <ComboBoxWithInCheckBox [SelectionType]="'Lead Sources'" [SelectedItem]="SelectedProdustsItem" (EditedItemSource)="EditedItemSource($event)" [ItemsSource]="FilterdAdditionalService" (SelectedItemChanged)="SelectedItemChanged($event)" [Binding]="'lastTitle'"></ComboBoxWithInCheckBox>
                                            </td>

                                            <td style="width:15px"></td>
                                            <td style="width:120px">Country: </td>
                                            <td style="width:200px">
                                                <table>
                                                    <tr>
                                                        <td style="width:166px;">
                                                            <LogLov [ObjectFieldName]="'CountryId'"
                                                                    [ObjectTableName]="'Country'"
                                                                    [DataContext]="DataContext"
                                                                    [LookUpTableName]="'Country'"
                                                                    [HideColumns]="true"
                                                                    [HideAddLink]="true"
                                                                    [HideAdd]="true"
                                                                    [HideEdit]="true"
                                                                    [HideMaintenanceIcon]="true">
                                                            </LogLov>
                                                        </td>

                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>

                                            <td style="width:15px"></td>
                                            <td style="width:90px;">Salesman: </td>
                                            <td style="width:200px;">
                                                <LogLov [ObjectFieldName]="'OwnerId'"
                                                        [ObjectTableName]="'Opportunity'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'User'"
                                                        [HideAddLink]="true"
                                                        [HideAdd]="true"
                                                        [HideEdit]="true"
                                                        [HideMaintenanceIcon]="true">
                                                </LogLov>
                                            </td>


                                            <td style="width:15px"></td>
                                            <td style="width:150px">Include Cancelled Opportunities</td>
                                            <td style="width:50px;"><div></div></td>
                                            <td style="width:22px">
                                                <LogCheckBox [ObjectFieldName]="'IncludeCancelled'" [DataContext]="DataContext"></LogCheckBox>
                                            </td>
                                                                       
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>                                
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
