
<table>
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr style="height:22px">
                    <td style="color:#1B90CB;font-size:14px;">Filter By:</td>
                </tr>

                <tr style="height:28px">
                    <td>
                        <table>
                            <tr>
                                <td style="width:100px">
                                    <div class="RadioButton" style="width:100px">
                                        <input type="radio" [attr.id]="IsCreateDateId" [attr.name]="ShipmentTypeRadio" (click)="IsCreateDateClicked()" [checked]="IsCreateDate == true" style="width:15px" />
                                        <label [attr.for]="IsCreateDateId" style="font-size: 12px">
                                            Create Date
                                        </label>
                                    </div>
                                </td>

                                <td style="width:5px;"></td>
                                <td style="width:80px">
                                    <div class="RadioButton" style="width:80px">
                                        <input type="radio" [attr.id]="IsStageDateId" [attr.name]="ShipmentTypeRadio" (click)="IsStageDateClicked() " [checked]="IsStageDate==true" style="width:15px" />
                                        <label [attr.for]="IsStageDateId" style="font-size: 12px">
                                            Stage Date
                                        </label>
                                    </div>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:80px">From Date:</td>
                                <td style="width:130px">
                                    <LogDatePicker style="width:120px" [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:80px">To Date:</td>
                                <td style="width:120px">
                                    <LogDatePicker [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:120px;">Opportunities type:</td>
                                <td style="width:200px;">
                                    <LogLov [ObjectFieldName]="'OpportunityTypeId'"
                                            [ObjectTableName]="'Opportunity'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'OpportunityType'"
                                            [HideAddLink]="true"
                                            [HideAdd]="true"
                                            [HideEdit]="true"
                                            [HideMaintenanceIcon]="true">
                                    </LogLov>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:100px">Business Unit: </td>
                                <td style="width:200px">
                                    <LogLov [ObjectFieldName]="'BusinessUnitId'"
                                            [ObjectTableName]="'Opportunity'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'BusinessUnit'"
                                            [HideMaintenanceIcon]="true">
                                    </LogLov>
                                </td>

                                <td style="width:90px;">
                                    <button (click)="RunReport(true)" class="GreenButton" style="width:90px;height:22px;">Run Report</button>
                                </td>

                                <td></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:28px">
                    <td>
                        <table>
                            <tr>
                                <td style="width:185px;">
                                    <div></div>
                                </td>

                                <td style="width:225px;">
                                    <table *ngIf="IsCRMTenant">
                                        <tr>
                                            <td style="width:15px"></td>
                                            <td style="width:80px;">Reseller:</td>
                                            <td style="width:130px;">
                                                <LogLov [ObjectFieldName]="'ResellerId'"
                                                        [DataContext]="DataContext"
                                                        [ObjectTableName]="'Opportunity'"
                                                        [LookUpTableName]="'Card'"
                                                        [HideAddLink]="true"
                                                        [HideAdd]="true"
                                                        [HideEdit]="true"
                                                        [HideMaintenanceIcon]="true"
                                                        [HideColumns]="true">
                                                </LogLov>
                                            </td>                                           
                                        </tr>
                                    </table>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:80px">Lead Sources: </td>
                                <td style="width:120px">
                                    <ComboBoxWithInCheckBox [SelectionType]="'Lead Sources'" [SelectedItem]="SelectedProdustsItem" (EditedItemSource)="EditedItemSource($event)" [ItemsSource]="FilterdAdditionalService" (SelectedItemChanged)="SelectedItemChanged($event)" [Binding]="'lastTitle'"></ComboBoxWithInCheckBox>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:120px">Country: </td>
                                <td style="width:200px">
                                    <table>
                                        <tr>
                                            <td style="width:166px;">
                                                <LogLov [ObjectFieldName]="'CountryId'"
                                                        [ObjectTableName]="'Country'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Country'"
                                                        [HideColumns]="true"
                                                        [HideAddLink]="true"
                                                        [HideAdd]="true"
                                                        [HideEdit]="true"
                                                        [HideMaintenanceIcon]="true">
                                                </LogLov>
                                            </td>

                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:100px;">Salesman: </td>
                                <td style="width:200px;">
                                    <LogLov [ObjectFieldName]="'OwnerId'"
                                            [ObjectTableName]="'Opportunity'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'User'"
                                            [HideAddLink]="true"
                                            [HideAdd]="true"
                                            [HideEdit]="true"
                                            [HideMaintenanceIcon]="true">
                                    </LogLov>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
