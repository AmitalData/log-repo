
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr style="height:22px">
                    <td style="color:#1B90CB;font-size:14px;">Filter By:</td>
                </tr>

                <tr style="height:28px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:100px;">Bill To/ Vendor:</td>
                                <td style="width:200px;">
                                    <LogLov [ShowInActive]="true" [ObjectFieldName]="'CustomerId'"
                                            [ObjectTableName]="'Card'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Card'">
                                    </LogLov>
                                </td>

                                <td style="width:50px;">Partner:</td>
                                <td style="width:200px;">
                                    <LogLov [ShowInActive]="true" [ObjectFieldName]="'PartnerId'"
                                            [ObjectTableName]="'Card'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Card'">
                                    </LogLov>
                                </td>

                                <td style="width:100px">
                                    <div class="RadioButton" style="width:80px">
                                        <input type="radio" [attr.id]="IsValueDateId" [attr.name]="DateRadio" (click)="IsValueDateClicked()" [checked]="IsValueDate==true" style="width:15px" />
                                        <label [attr.for]="IsValueDateId" style="font-size: 12px">
                                            Value Date
                                        </label>
                                    </div>
                                </td>

                                <td style="width:5px;"></td>
                                <td style="width:100px">
                                    <div class="RadioButton" style="width:100px">
                                        <input type="radio" [attr.id]="IsCreateDateId" [attr.name]="DateRadio" (click)="IsCreateDateClicked()" [checked]="IsCreateDate == true" style="width:15px" />
                                        <label [attr.for]="IsCreateDateId" style="font-size: 12px">
                                            Create Date
                                        </label>
                                    </div>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:70px">From Date:</td>
                                <td style="width:130px">
                                    <LogDatePicker [NoObjectField]="true" [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:15px"></td>
                                <td style="width:60px">To Date:</td>
                                <td style="width:130px">
                                    <LogDatePicker [NoObjectField]="true" [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:15px"></td>

                                <td style="width:90px;">
                                    <button (click)="RunReport()" class="GreenButton" style="width:90px;height:22px;">{{RunReportTitle}}</button>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
