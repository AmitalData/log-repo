


<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }
     .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }
    .selected {
        background-color: blue;
        cursor: auto;
        pointer-events: none;
    }



    .notSelected {
        background-color: white;
    }

        .notSelected:hover {
            background-color: #F0F8FF;
            cursor: pointer;
        }
</style>













    <table>
        <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
            <td>
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>

        <tr>
            <td>
                <table ng-style="{'height' : (ValidationErrorsList != null && ValidationErrorsList.length) > 0?'30px':'60px' }" style="width:550px;">
                    <tr style="height:25px" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length == 0">
                        <td style="width:5px;"><div style="width:5px;"></div></td>
                        <td colspan="10"><div style="color:#1B90CB;font-size:14px;">Filter By:</div></td>
                    </tr>


                    <tr style="height:30px">
                        <td style="width:5px;"><div style="width:5px;"></div></td>

                        <td>
                            <table>
                                <tr>

                                    <td style="width:10px;"><div style="width:5px;"></div></td>

                                    <td style="width:150px" class="Label">Bill To/ Vendor:</td>
                                    <td><div style="width:15px;"></div></td>
                                    <td style="width:200px;">
                                        <div style="width:200px;">
                                            <LogLov [ObjectFieldName]="'CustomerId'"
                                                    [DataContext]="DataContext"
                                                    [LookUpTableName]="'Card'"
                                                    [DisplayMemberPath]="'EnglishName'"
                                                    [DependencyFilter1IsList]="'true'"
                                                    [ShowInActive]="true"
                                                    [DependencyFilter1Value]="'AG,CS,AL,SL,CC,VD,CG,CO,OT,SG,TR,WH'">
                                            </LogLov>
                                        </div>
                                    </td>

                                    <td style="width:10px;"><div></div></td>

                                    <td style="width:60px" class="Label">Partner:</td>
                                    <td><div style="width:15px;"></div></td>
                                    <td style="width:200px;">
                                        <div style="width:200px;">
                                            <LogLov [ObjectFieldName]="'PartnerId'"
                                                    [DataContext]="DataContext"
                                                    [LookUpTableName]="'Card'"
                                                    [DisplayMemberPath]="'EnglishName'"
                                                    [DependencyFilter1IsList]="'true'"
                                                    [ShowInActive]="true"
                                                    [DependencyFilter1Value]="'AG,CS,AL,SL,CC,VD,CG,CO,OT,SG,TR,WH'">


                                            </LogLov>
                                        </div>
                                    </td>

                            <td><div style="width:20px;"></div></td>


                            <td></td>
                                </tr>
                            </table>
                        </td>



                        <td style="width:50px;"><div style="width:50px;"></div></td>

                        <td style="width:90px;">
                            <app-run-report-toggle [isRTL]="true" [IsSchedulerReport]="false" (runReport)="RunReport($event)"></app-run-report-toggle>
                        </td>

                        <td></td>

                    </tr>

                    <tr style="height: 50px;"><td></td></tr>
                </table>
                </td>
</tr>
</table>
