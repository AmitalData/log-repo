<style>
    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(20% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 70%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 70%);
        background: -webkit-gradient(linear,20% 0%,50% 70%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 20%, rgb(106, 190, 163) 70%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 70%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }

        .greenButton:hover {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgb(0, 255, 33) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        }

        .greenButton:active {
            -webkit-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            -moz-box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
            box-shadow: 0px 0px 5px 1px rgba(0,148,118,1);
        }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td style="color:#1B90CB; font-size:15px; line-height: 15px;">{{'Accounting.General.O.FilterBy' | TextCodeTranslationPipe}}</td>
    </tr>
    <tr style="height:10px"></tr>
    <tr style="height: 32px;">
        <td>
          <table>

            <tr>
              <td>
                <table>
                    <tr>
                        <!-- from date -->
                        <td style="width:10px"></td>
                        <td style="width: 75px;">
                          REF Date From:
                        </td>

                        <td style="width:150px;">
                          <LogDatePicker [NoObjectField]="true" [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                        </td>

                        <td style="width:20px;"></td>
                        <!-- ToDate -->
                        <td style="width:10px"></td>
                        <td style="width: 70px;">
                          REF To:
                        </td>

                        <td style="width:150px;">
                          <LogDatePicker [NoObjectField]="true" [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                        </td>

                        <td style="width:20px;"></td>
                        <!-- ToDate -->
                        <td style="width:10px"></td>

                        <td style="width:150px;">
                          <LogLabel [NoObjectField]="true" [Text] ="'Includes Transfer Glaccount'"
                          [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="width:20px;">
                          <CheckBox [IsChecked]="IncludesTransferGlaccount"
                                                          (Checked)="IncludesTransferGlaccount = $event"></CheckBox>
                        </td>

                        <td></td>


                    </tr>
                </table>
              </td>




            </tr>
            <tr style="height:10px"></tr>
            <tr>

              <td>
                <table>
                  <tr>
                    <td style="width:10px"></td>
                    <td style="width:70px"> </td>
                    <td style="width:210px">
                      <ul float-start class="FiltersMenu" [class.aboodRTLFilterMenu]="isRTL">
                        <li float-start   (click)="IsExternalEeconciledFilterItemClicked('all')"
                            [class.SelectedFilter]="IsExternalEeconciledFilter === 'all'">
                           All
                        </li>
                        <li float-start  (click)="IsExternalEeconciledFilterItemClicked('open')"
                            [class.SelectedFilter]="IsExternalEeconciledFilter === 'open'">
                            close
                        </li>
                        <li float-start (click)="IsExternalEeconciledFilterItemClicked('close')"
                            [class.SelectedFilter]="IsExternalEeconciledFilter === 'close'">
                            Open
                        </li>
                    </ul>
                    </td>
                    <td style="width: 20px;"></td>

                    <td style="width:210px">
                      <ul float-start class="FiltersMenu" [class.aboodRTLFilterMenu]="isRTL">
                        <li float-start  (click)="TypeFilterItemClicked('all')"
                            [class.SelectedFilter]="TypeFilter === 'all'">
                           All
                        </li>
                        <li float-start   (click)="TypeFilterItemClicked('open')"
                            [class.SelectedFilter]="TypeFilter === 'open'">
                            Bank only
                        </li>
                        <li float-start   (click)="TypeFilterItemClicked('close')"
                            [class.SelectedFilter]="TypeFilter === 'close'">
                            GLAccount only
                        </li>
                    </ul>
                    </td>

                    <td></td>
                  </tr>
                </table>
              </td>


            </tr>
            <tr style="height:10px"></tr>
            <tr>
              <td>
                <table>
                  <tr>
                    <td style="width:10px"></td>
                    <!-- <td style="width:30px">
                      <CheckBox [IsChecked]="UseBalanceFilter" (Checked)="UseBalanceFilter = $event"></CheckBox>

                    </td> -->
                    <td style="width:70px">Bank: </td>

                    <td style="width:200px; min-width: 200px;">
                                   <LogLov [ObjectFieldName]="'CustomerId'"
                                            [ObjectTableName]="'Card'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Card'">
                                    </LogLov>  
                    </td>

                    <td style="width:250px">
                      <LogLabel [NoObjectField]="true" [Text] ="'External Reconciliation Number'"
                      [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:200px; min-width: 200px;">
                      <LogTextBox [ObjectFieldName]="'ExternalReconciliationNumber'" [InputType]="'ntext'" [DataContext]="DataContext" [Text]="ExternalReconciliationNumber"
                      [NoObjectField]="true"   [HideColumns]="true"></LogTextBox>
                    </td>


                    <td style="width:70px"></td>
                    <td style="width:90px;text-align:left">
                      <button (click)="RunReport()" class="greenButton" style="width:90px;height:22px;border:1px solid green;border-radius:3px;">
                        <div style="color:black;  text-align:center;vertical-align:central;font-size:12px;">{{'Accounting.General.O.Run' | TextCodeTranslationPipe}}</div>
                      </button>

                    </td>
                    <td></td>
                  </tr>
                </table>
              </td>






            </tr>
            <tr style="height:10px"></tr>
          </table>
            
        </td>
    </tr>
</table>
