<style>
    .DocumentsDropDown {
        background: #f7f7f7;
        position: absolute;
        /*z-index: 99;*/
        top: 0px;
        bottom: 8px;

        width: 100%;
        border-right: 1px solid #8eabc1;
        border-left: 1px solid #8eabc1;
        border-bottom: 1px solid #8eabc1;
        border-bottom-right-radius: 5px;
        border-bottom-left-radius: 5px;
        overflow: auto;
        padding-bottom: 10px;
    }

    .DocsListButton {
        transition: .5s all;
        width: 215px;
        text-align: center;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
        border-right: 1px solid #e7ebee;
    }

    .DocsListButton:hover {
        background: #f4f4f4;
    }

    .DocsListButton:active {
        background: #f0f0f0;
    }

    .RelatedDocItem {
        cursor: pointer;
        user-select: none;
        padding: 5px;
        border-radius: 3px;
        border: solid 1px #BABABA;
        height: 90px;
        /*width: 100%;*/
        background: white;
        /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#E7F5FE, #62AAC4);
        /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#E7F5FE, #62AAC4);
        /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#E7F5FE, #62AAC4);
        /* For Firefox 3.6 to 15 */
        background: linear-gradient(#E7F5FE, #62AAC4);
        width: 200px;
        margin: auto;
    }

    .timeline {
        display: flex;
        flex-direction: column;
        margin-right: 10px;
    }


    .step-indicator {
        height: 10px;
        background-color: #0271ba;

        transition: width 0.5s;
    }

    .step-label {

        font-weight: bold;
        font-size: 10px;
        color: #312C31;

    }

    .TextTrimming {
        font-size: 10px;
        color: #312C31;
    }

    .failure-message {
        color: #9f1f1f;
        font-size: 12px;
        font-weight: bold;
    }

    .failed-text {
        color: #9f1f1f;
        font-weight: bold;
        text-decoration: underline;
    }

    .red-border {
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .progress-container {
        width: 100%;
        background-color: #f3f3f3;
        position: relative;
        overflow: hidden;
        height: 13px;
        border-radius: 5px;
    }

    .progress {
        width: 100%;
        height: 100%;
        background-color: #50b29d;
        position: absolute;
        left: -100%;
        animation: loading 2s linear infinite;
    }

    @keyframes loading {
        0% {
            left: -100%;
        }

        100% {
            left: 100%;
        }
    }

    .TabsContainer {
        display: flex;
        justify-content: flex-start;
        overflow-x: auto;
        border-bottom: 2px solid #ccc; 

    }

    .TabHeader {
        padding: 10px 20px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        color: #1B90CB;
        border: 1px solid transparent;
        border-bottom: none;
        transition: background-color 0.3s, color 0.3s;
        white-space: nowrap;
    }

    .TabHeader:hover {
        background-color: #f4f4f4;
    }

    .TabHeader.active {
        background-color: white;
        color: #0271ba;
        border: 1px solid #ccc;
        border-bottom: 2px solid white;
    }

    .TabContent {
        padding: 10px;
        background-color: #f7f7f7;
    }
</style>

<div class="DocumentsDropDown" [ngStyle]="LayoutDirection == 'rtl' ? {'left': '0'}:{'right': '0'} ">

    <table>

        <tr>
            <td style="vertical-align:top;">
                <ul style="width: 100%;">
                    <div [ngStyle]="LayoutDirection == 'rtl' ? {'text-align': 'right'}:{'text-align': 'left'} "
                        style="text-align: right; padding-top: 5px;padding-right: 5px;">
                        <img [title]="isPinned ? 'Pin' : 'Unpin'" [style.width.px]="20" [style.height.px]="20"
                            [style.cursor]="'pointer'"
                            [style.transform]="isPinned ? 'none':LayoutDirection == 'rtl'? 'rotate(90deg)': 'rotate(-90deg)'"
                            src="./Images/Buttons/pinned.png" (click)="togglePin()" />
                    </div>

                    <div class="TabsContainer" style="border-radius: 5px; overflow: hidden;" [ngStyle]="LayoutDirection == 'rtl' ? {'direction': 'rtl'} : {'direction': 'ltr'}">
                        <div *ngFor="let tab of MenuTypeNames | keyvalue" class="TabHeader"
                            [class.active]="CurrentSelectedTab === tab.key" (click)="selectTab(tab.key)"
                            style="padding: 8px 15px; font-size: 12px; border-radius: 3px;">

                            <span *ngIf="MenuTypeNames && MenuTypeNames[tab.key]">{{ MenuTypeNames[tab.key]}}</span>
                        </div>
                    </div>
                    <div class="TabContent">

                        <ul >
                            <li *ngIf="!groupedMenuItems[CurrentSelectedTab]?.length"
                                style="width: 100%; padding: 10px;  text-align: center;height: 20px;line-height: 20px; font-size: 18px; color: #1B90CB;">
                                {{'Accounting.General.O.NoReportsDisplay' | TextCodeTranslationPipe}} </li>

                            <li *ngFor="let item of groupedMenuItems[CurrentSelectedTab]" style="width: 100%; padding: 10px;padding-bottom: 0px;  font-size: 10px;
                                                 color: #312C31; ">

                                <div class="RelatedDocItem" [class.selectedticket]="SelectedMenuItem == item"
                                    [ngClass]="item.Id==currentProcessId ?  'red-border' : ''"
                                    (click)="item.StatusCode === 'D' && ViewMenuItem(item)">
                                    <table>

                                        <!--Header-->
                                        <tr>

                                            <td>
                                                <table>
                                                    <tr style="height: 10px;">
                                                        <td>
                                                            <div>
                                                                <img [title]="'Delete'" class="LeftCenter"
                                                                    style="width: 10px; height: 10px; cursor: pointer;"
                                                                    src="./Images/Buttons/Delete.over.png"
                                                                    (click)="$event.stopPropagation(); DeleteMenuItem(item)" />
                                                            </div>

                                                        </td>

                                                    </tr>
                                                    <tr style="height: 20px;">
                                                        <td>

                                                            <div class="TextTrimming"
                                                                style="font-weight: bold; text-align: center; padding-bottom: 3px;">
                                                                {{LayoutDirection == 'rtl'?
                                                                item.LocalName
                                                                :item.Name}}
                                                                 <img  *ngIf="item.ItemType === 2"   style="height:12px;width:12px;" src="./Images/Buttons/excelicon.png" />

                                                            </div>
                                                        </td>


                                                    </tr>


                                                    <tr>

                                                        <td>
                                                            <div class="TextTrimming"
                                                                style="text-align: center; padding-bottom: 3px;">
                                                                {{'Accounting.General.O.CreateDate' |
                                                                TextCodeTranslationPipe}}:
                                                                {{item.CreateDate |
                                                                DateTimeToDatePipe}}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr style="float: right;">

                                                        <td [hidden]="item.StatusCode=='D' || item.StatusCode=='F' || item.ItemType === 1"
                                                            style="width: 1px; vertical-align: top;">
                                                            <img style="width: 18px;height: 18px;" [title]="'Cancel'"
                                                                (click)="$event.stopPropagation();CancelMenuItem(item)"
                                                                src="./_Resources/Images/Icons/All/BlackDeleteIcon.png" />

                                                        </td>
                                                        <td [hidden]="item.StatusCode!=='D'"
                                                            style="width: 20px; vertical-align: top;">
                                                            <img [title]="'View Item'" style=" cursor: pointer;"
                                                                src="./Images/Successful_process@1x.png" />
                                                        </td>
                                                        <td [hidden]="item.StatusCode!=='F'"
                                                            style="width: 20px; vertical-align: top;">

                                                            <img [title]="item.ExceptionMessage && !item.ExceptionMessage.startsWith('Stopped manually by') ? item.ExceptionMessage :'Cancelled'"
                                                                style=" cursor: pointer;"
                                                                [src]="item.ExceptionMessage && !item.ExceptionMessage.startsWith('Stopped manually by') ? './Images/process_failed@1x.png' : './Images/process_cancelled.png'" />
                                                        </td>
                                                        <td style="width: 180px;">
                                                            <div style="margin-right:6px;overflow:hidden">
                                                                <div *ngIf="item.StatusCode !== 'F';">

                                                                    <div *ngIf="item.StatusCode !== 'D'"
                                                                        class="progress-container">
                                                                        <div class="progress"></div>
                                                                    </div>

                                                                </div>
                                                            </div>

                                                        </td>


                                                    </tr>

                                                </table>
                                            </td>
                                        </tr>



                                    </table>
                                </div>
                            </li>
                        </ul>
                    </div>
                </ul>
            </td>
        </tr>
    </table>





</div>
