<td style="width:20px;">
    <CheckBox [IsEnabled]="!isDisabled" (change)="checkChange()" [IsChecked]="field.IsChecked"></CheckBox>
</td>
<td>
    <label style="float:left; margin-left: 5px;">{{field.Text}}</label>
</td>

<ul>
    <ng-container *ngFor="let item of field.Fields">
        <DataProviderFieldsNestedList [margin]="margin+20" [checkAll]="field.IsChecked" [isDisabled]="!field.IsChecked"
            [style.marginLeft.px]="margin" [field]="item">
        </DataProviderFieldsNestedList>
    </ng-container>
</ul>
