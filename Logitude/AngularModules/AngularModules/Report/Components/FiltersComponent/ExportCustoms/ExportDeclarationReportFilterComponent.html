
<style>

    :host ::ng-deep .isBold .Label {
        font-size: 12px;
        font-weight: bold;
    }
</style>

<table *ngIf="isReady">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:60px;">
        <td>
            <table>
                <tr style="height:5px;">

                    <!-- סוג הובלה -->

                    <td style="width: 100px;">
                        <LogLabel class="isBold"
                                  [ObjectFieldName]="'TransportModeId'"
                                  [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 150px;">
                        <ul float-start class="FiltersMenu">
                            <li (click)="itemClicked('All')" (mouseover)="itemMouseOver('All')"
                                [class.SelectedFilter]="SelectedTransportModeId === 'All'">
                                הכל
                            </li>
                            <li (click)="itemClicked('A')" (mouseover)="itemMouseOver('A')" (mouseleave)="itemMouseLeave('A')"
                                [class.SelectedFilter]="SelectedTransportModeId === 'A'" title="Air">
                                <img [id]="TransportFilter_A" class="CenterCenter" src="./Images/TransportModes/A_g.png"
                                    style="top: 1px;" />
                            </li>
                            <li (click)="itemClicked('O')" (mouseover)="itemMouseOver('O')" (mouseleave)="itemMouseLeave('O')"
                                [class.SelectedFilter]="SelectedTransportModeId === 'O'" title="Ocean">
                                <img [id]="TransportFilter_O" class="CenterCenter" src="./Images/TransportModes/O_g.png"
                                    style="top: 1px;" />
                            </li>
                            <li (click)="itemClicked('L')" (mouseover)="itemMouseOver('L')" (mouseleave)="itemMouseLeave('L')"
                                [class.SelectedFilter]="SelectedTransportModeId === 'L'" title="Inland">
                                <img [id]="TransportFilter_I" class="CenterCenter" src="./Images/TransportModes/I_g.png"
                                    style="top: 1px;" />
                            </li>
                        </ul>
                    </td>

                   
                    <!-- תאריך יצירה -->
                    <td  style="width: 100px;" > 
                        <LogLabel class="isBold" [ObjectTableName]="ObjectTableName" 
                        [ObjectFieldName]="'CreateDateTime'" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width: 7px;" > 
                        <LogLabel  [ObjectTableName]="ObjectTableName" 
                        [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:60px;">מתאריך: </td>
                    <td style="width: 110px;" >

                        <LogDatePicker [ObjectFieldName]="'FromDate'" [ObjectTableName]="ObjectTableName"
                                [NoObjectField]="true" [ForceSubscribe]="true" [DataContext]="DataContext"
                                [HideColumns]="true" [SelectedDateValue]="FromDate"></LogDatePicker>
                    </td>


                    <td style="width:10px;">
                        <div></div>
                    </td> 

                    <!-- סטטוס הצהרה-->
                    <td style="width: 100px;">
                        <LogLabel class="isBold" [ObjectFieldName]="'DeclarationStatusTypeCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 150px;">
                        <LogLov [ObjectFieldName]="'DeclarationStatusTypeCode'"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [HideColumns]="true"
                            [LookUpTableName]="'Customs.DeclarationStatusType'"
                            [SelectedValue]="DeclarationStatusTypeCode"
                            [DisplayMemberPath]="'LocalName'">
                    </LogLov>
                    </td>

                    <!-- סוג הצהרה-->
                    <td style="width: 100px;">
                        <LogLabel class="isBold" [ObjectFieldName]="'DeclarationTypeCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 150px;">
                        <LogLov [ObjectFieldName]="'DeclarationTypeCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.LeadDocumentType'"
                                [SelectedValue]="DeclarationTypeCode">
                        </LogLov>
                    </td>
                    
                    <td style="width:10px;">
                        <div></div>
                    </td> 
                    <!-- פירוט חשבונות -->
                    <td style="width:60px; font-weight: bold; color: rgb(110, 113, 114);">פירוט חשבונות :</td>
                    <td style="width:10px;">
                        <div></div>
                    </td> 
                    <td style="width:5px;">
                        <div></div>
                    </td> 

                    <td style="width:120px">
                        <ul class="FiltersMenu">
                            <li style="width: 60px;"  (click)="showInvoicesClicked('True')"
                                [class.SelectedFilter]="ShowInvoices === 'True'">
                                True 
                            </li>
                            <li style="width: 60px;" (click)="showInvoicesClicked('False')"
                                [class.SelectedFilter]="ShowInvoices === 'False'">
                                False 
                            </li>
                            
                        </ul>
                    </td>

                    
                   
                    <td><div></div></td>
                </tr>
                <tr style="height:5px;">
                   <!-- לקוח -->
                   <td style="width: 100px;">
                    <LogLabel class="isBold"
                              [ObjectFieldName]="'CustomerId'"
                              [ObjectTableName]="ObjectTableName"
                              [DataContext]="DataContext"></LogLabel>
                   </td>
                
                    <td style="width:150px">
                        <LogLov [ObjectFieldName]="'CustomerId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [SelectedValue]="CustomerId"
                                [DisplayMemberPath]="'LocalName'"
                                [HideAddLink]="true"
                                [HideAdd]="true"
                                [LookUpTableName]="'Card'"
                                [DisplayFieldsFromList]="'Code,LocalName,EnglishName'">
                        </LogLov>
                    </td>

                   
                    <!-- תאריך יצירה / עד תאריך-->
                    <td style="width:10px;"><div></div></td>
 
                    <td style="width: 7px;" > 
                        <LogLabel  [ObjectTableName]="ObjectTableName" 
                        [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:60px;">עד תאריך: </td>
                    
                    <td style="width: 110px;" >
                    
                        <LogDatePicker [ObjectFieldName]="'ToDate'" [ObjectTableName]="ObjectTableName"
                                   [NoObjectField]="true" [ForceSubscribe]="true" [DataContext]="DataContext"
                                   [HideColumns]="true" [SelectedDateValue]="ToDate"></LogDatePicker>
                    </td>
                    <td style="width:10px;">
                        <div></div>
                    </td> 
                    <!-- ארץ יעד -->
                    <td style="width: 100px;">
                        <LogLabel class="isBold" [ObjectFieldName]="'DestinationCountryCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 150px;">
                        <LogLov [ObjectFieldName]="'DestinationCountryCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Customs.CustomsCountry'"
                                [DisplayMemberPath]="'LocalName'"
                                [SelectedValue]="DestinationCountryCode"
                                [HideColumns]="true">
                        </LogLov>

                    </td>

                    <!-- רפרנט-->
                    <td style="width: 100px;">
                        <LogLabel class="isBold" [ObjectFieldName]="'ReferentUserName'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 150px;">
                        <LogLov [ObjectFieldName]="'ReferentUserId'"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [HideColumns]="true"
                            [LookUpTableName]="'User'"
                            [SelectedValue]="ReferentUserId"
                            [DisplayMemberPath]="'LocalName'">
                    </LogLov>
                    </td>

                    <td style="width:10px;">
                        <div></div>
                    </td> 
                    <!-- פירוט משגורים -->
                    <td style="width:60px; font-weight: bold; color: rgb(110, 113, 114);">פירוט משגורים :</td>
                    <td style="width:10px;">
                        <div></div>
                    </td> 
                    <td style="width:5px;">
                        <div></div>
                    </td> 

                    <td style="width:120px">
                        <ul class="FiltersMenu">
                            <li style="width: 60px;"  (click)="showConsigmentsClicked('True')"
                                [class.SelectedFilter]="ShowConsignments === 'True'">
                                True 
                            </li>
                            <li style="width: 60px;" (click)="showConsigmentsClicked('False')"
                                [class.SelectedFilter]="ShowConsignments === 'False'">
                                False 
                            </li>
                            
                        </ul>
                    </td>

                    <td style="width:10px;">
                        <div></div>
                    </td> 
                    <!--run button-->
                    <td style="width: 90px;">
                        <button class="GreenButton" (click)="RunReport()">Run Report</button>
                    </td>
                    <td><div></div></td>
            
                </tr>

            </table>
        </td>
    </tr>
</table>
