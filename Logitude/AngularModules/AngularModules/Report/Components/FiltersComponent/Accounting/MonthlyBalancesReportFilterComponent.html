<style>
    .FiltersMenu li {
        /* width: fit-content !important; */
        width: 80px;
        padding: 0 7px;
        border-width: 1px;
        margin-right: -1px;
        /*background: #f7f7f7;*/
    }

    .FiltersMenu li:hover {
        opacity: 0.9;
    }

    .greenButton {
        outline: none;
        text-align: right;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        line-height: 21px;
        border: 1px solid #EDC093;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        background: -moz-linear-gradient(20% 0% -90deg, rgba(255, 255, 255, 1) 0%, rgb(0, 255, 33) 70%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 70%);
        background: -webkit-gradient(linear, 20% 0%, 50% 70%, color-stop(0, rgba(255, 255, 255, 1)), color-stop(1, rgba(237, 192, 147, 1)));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 20%, rgb(106, 190, 163) 70%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 70%);
        -moz-box-shadow: 0px 0px 6px 0px green;
        -moz-box-shadow: 0px 0px 6px 0px green;
        text-shadow: 1px 1px white;
    }

    .greenButton:hover {
        background: -moz-linear-gradient(50% 0% -90deg, rgba(255, 255, 255, 1) 0%, rgb(0, 255, 33) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: -webkit-gradient(linear, 50% 0%, 50% 100%, color-stop(0, rgba(255, 255, 255, 1)), color-stop(1, rgba(237, 192, 147, 1)));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgb(106, 190, 163) 100%);
    }

    .greenButton:active {
        -webkit-box-shadow: 0px 0px 5px 1px rgba(0, 148, 118, 1);
        -moz-box-shadow: 0px 0px 5px 1px rgba(0, 148, 118, 1);
        box-shadow: 0px 0px 5px 1px rgba(0, 148, 118, 1);
    }

    .FiltersMenuDisabled {
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        opacity: 1;
    }
</style>
<table *ngIf="isReady">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="5">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td style="width:10px"></td>
        <td colspan="3" style="color:#1B90CB; font-size:15px; line-height: 15px;">{{'Accounting.General.O.FilterBy' |
            TextCodeTranslationPipe}}</td>

        <td></td>

    </tr>
   
    <tr style="height: 32px;" class="FormFieldRow">
        <td style="width:10px"></td>
        <td style="width: 120px;">
            <LogLabel [NoObjectField]="true"  [ObjectTableName]="ObjectTableName"
                [DataContext]="DataContext" [Text]="'Accounting.O.Year'  | TextCodeTranslationPipe"></LogLabel>

        </td>
        <td style="width: 120px;">
            <LogTextBox [ObjectFieldName]="'NumberOfYear'" [ObjectTableName]="ObjectTableName" [IsNewEntityCall]="true"
                [InputType]="'integer'" [DataContext]="DataContext" [Text]="NumberOfYear" [NoObjectField]="true" >
            </LogTextBox>
        </td>

        <td></td>
        <td ></td>
        <td colspan="3" style="padding-right:100px;">
            <div style="width: 90px;">
                <app-run-report-toggle [isRTL]="true" [IsSchedulerReport]="IsSchedulerReport" (runReport)="RunReport($event)"></app-run-report-toggle>
            </div>
        </td>

    </tr>
    <tr style="height:10px"></tr>
    <tr style="height: 32px;">  
        <td style="width:10px"></td>
        <td style="width: 120px;">           
                <LogLabel [NoObjectField]="true"  [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [Text]="'GLAccount.F.ChartOfAccountsTypeCode'  | TextCodeTranslationPipe"></LogLabel>    
        </td>
        <td style="width: 150px;">
            <ComboBoxWithInCheckBox [AutoHeight]="true" [MinHeight]="150" [ItemsSource]="chartOfAccountsTypes" 
            [SelectedItem]="ChartOfAccountsTypeComboboxValue" (EditedItemSource)="OnChartOfAccountsTypeItemClicked($event)"
            [SelectionType]="showLocal?'קבוצה':'Product'"
            (SelectedItemChanged)="SelectedChartOfAccountsTypeChanged($event)" [Binding]="'LocalName'" [AlternativeBinding]="'EnglishName'"></ComboBoxWithInCheckBox>
        </td>
        <td>
            <LogLabel [NoObjectField]="true"  [ObjectTableName]="ObjectTableName"
                [DataContext]="DataContext" [Text]="'GLAccount.F.ChartOfAccountsId'  | TextCodeTranslationPipe"></LogLabel>
        </td>
        <td style="width: 150px;">
            <ComboBoxWithInCheckBox 
                    [SelectionType]="showLocal?'קבוצה':'Product'"
                    [SelectedItem]="ChartOfAccountsComboBoxValue" 
                    (EditedItemSource)="OnChartOfAccountsItemClicked($event)"
                    (SelectedItemChanged)="SelectedChartOfAccountsChanged($event)"
                    [Binding]="'LocalName'"
                    [AutoHeight]="true" [MinHeight]="150"                         
                    [AlternativeBinding]="'EnglishName'" 
                    [ItemsSource]="chartOfAccounts" #comboBoxWithCheckBoxChartOfAccountsComboBoxValue></ComboBoxWithInCheckBox>
        </td>
      
        
    </tr>
    <tr style="height: 32px;">

        <td style="width:10px"></td>
        <td style="width:70px">
            <LogLabel [NoObjectField]="true"  [ObjectTableName]="ObjectTableName"
            [DataContext]="DataContext" [Text]="'Accounting.O.Detailed' | TextCodeTranslationPipe"></LogLabel>

        </td>

        <td style="width:20px">
            <CheckBox [IsChecked]="DetailedForJobs" (Checked)="DetailedForJobs = $event"></CheckBox>
        </td>
        <td style="width:100px"></td>
        <td ></td>

    </tr>
</table>
