<style>
    .AbdullahTable{
        table-layout: fixed;
    }
        .AbdullahTable tr{
            height: 28px;
        }

        .spinner {
      margin: 100px auto 0;
      width: 70px;
      text-align: center;
      height: 100%;
    }

        .spinner > div {
            height: 100%;
            width: 14px;
            height: 14px;
            background-color: #83b7dd;

            border-radius: 100%;
            display: inline-block;
            -webkit-animation: sk-bouncedelay 1.4s infinite ease-in-out both;
            animation: sk-bouncedelay 1.4s infinite ease-in-out both;
        }

        .spinner .bounce1 {
          -webkit-animation-delay: -0.32s;
          animation-delay: -0.32s;
        }

        .spinner .bounce2 {
          -webkit-animation-delay: -0.16s;
          animation-delay: -0.16s;
        }

    @-webkit-keyframes sk-bouncedelay {
      0%, 80%, 100% { -webkit-transform: scale(0) }
      40% { -webkit-transform: scale(1.0) }
    }

    @keyframes sk-bouncedelay {
      0%, 80%, 100% { 
        -webkit-transform: scale(0);
        transform: scale(0);
      } 40% { 
        -webkit-transform: scale(1.0);
        transform: scale(1.0);
      }
    }

    .disabled{
        pointer-events: none;
        opacity: 0.6;
        cursor: default;
    }

</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td style="color:#1B90CB; font-size:15px; line-height: 15px;">Filter By:</td>
    </tr>

    <tr style="height: 32px;">
        <td>
            <table class="AbdullahTable" *ngIf="isReady">

                <tr>
                    <!-- AgingForDate -->
                    <td style="width: 150px; padding-right: 5px;" class="Label">
                        <LogLabel [ObjectTableName]="'GLAccount'" [TextCode]="'AgingReport.O.AgingForDate'" [ObjectFieldName]="'AgingForDate'" 
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 135px;">
                        <LogDatePicker [ObjectTableName]="'GLAccount'" [ObjectFieldName]="'AgingForDate'" [SelectedDateValue]="AgingForDate" 
                                       [DataContext]="DataContext" [HideColumns]="true" (OnBlurEvent)="ValidateDate()"></LogDatePicker>
                    </td>
                    <td style="width: 135px;"></td>

                    <td style="width: 35px;"></td>

                    <!-- Customer -->
                    <td style="width: 185px; padding-right: 5px;" class="Label">
                        <LogLabel [ObjectTableName]="'GLAccount'" [TextCode]="'AgingReport.O.Customer'" [ObjectFieldName]="'Customer'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 155px;">
                        <LogLov [ObjectFieldName]="'Customer'"
                                [ObjectTableName]="'GLAccount'"
                                [DataContext]="DataContext"
                                [DependencyFilter1Value]="false"
                                [DependencyFilter2Value]="'2'"
                                [LookUpTableName]="'GLAccount'"
                                [HideColumns]="false">
                        </LogLov>
                    </td>
                    <td style="width: 100px;"></td>

                    <td style="width: 100px; padding-right: 5px;" class="Label">
                        <div style="width: 90px;">
                            <button class="GreenButton" (click)="RunButtonClicked()">{{ 'AgingReport.O.RunReport' | TextCodeTranslationPipe }}</button>
                        </div>
                    </td>
                    <td></td>

                </tr>

                <tr>
                    <!-- SalesmanUserId -->
                    <td style="padding-right: 5px;" class="Label">
                        <LogLabel [ObjectFieldName]="'SalesmanUserId'" [ObjectTableName]="'GLAccount'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="">
                        <!--[ObjectFieldName]="'SalesmanUserId'"-->
                        <LogLov [ObjectFieldName]="'Salesman'"
                                [ObjectTableName]="'GLAccount'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'User'"
                                [QueryFilterItems]="SalesmanFilterItems"
                                [HideColumns]="true">
                        </LogLov>
                    </td>
                    <td style=""></td>

                    <td></td>

                    <!-- NumberOfMonths -->
                    <td style="width: 120px; padding-right: 5px;" class="Label">
                        <LogLabel [ObjectTableName]="'GLAccount'" [TextCode]="'AgingReport.O.NumberMonthsBackwards'" [ObjectFieldName]="'NumberOfMonths'" 
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 135px;">
                        <LogTextBox [ObjectFieldName]="'NumberOfMonths'" [InputType]="'unsinteger'" [DataContext]="DataContext" [Text]="NumberOfMonths"
                                    [NoObjectField]="true" [ObjectTableName]="'GLAccount'" [HideColumns]="false"></LogTextBox>

                    </td>

                </tr>

                <tr>
                    <!-- Collector -->
                    <td style="padding-right: 5px;" class="Label">
                        <LogLabel [ObjectFieldName]="'CollectorId'" [ObjectTableName]="'GLAccount'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="">
                        <LogLov [ObjectFieldName]="'Collector'"
                                [ObjectTableName]="'GLAccount'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'User'"
                                [HideColumns]="true">
                        </LogLov>
                    </td>
                    <td style=""></td>

                    <td></td>

                    <!-- CurrenciesDetailed -->
                    <td style="padding-right: 5px;" class="Label">
                        <LogLabel [ObjectTableName]="'GLAccount'" [TextCode]="'AgingReport.O.CurrenciesDetailed'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="">
                        <CheckBox [IsChecked]="CurrenciesDetailed"
                                  (Checked)="CurrenciesDetailed = $event"></CheckBox>
                    </td>
                    <td style=""></td>

                </tr>

                <tr>
                    <!-- Category -->
                    <td style="padding-right: 5px;" class="Label">
                        <LogLabel [ObjectFieldName]="'Category'" [ObjectTableName]="'GLAccount'" [Text]="'Category'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td >
                        <ComboBox [ItemsSource]="CategoriesList" (SelectedItemChanged)="SelectedItemChanged($event)" [IsDisabled]="IsCategoryDisabled"></ComboBox>
                    </td>
                    <td style="padding-left: 5px;">
                        <div [ngSwitch]="SelectedCategory" [class.disabled]="IsCategoryDisabled">

                            <!-- Category 1 -->
                            <LogLov *ngSwitchCase="'Category 1'" 
                                    [ObjectFieldName]="'Category1'"
                                    [ObjectTableName]="'GLAccount'"
                                    [DataContext]="DataContext"
                                    [DisplayMemberPath]="'LocalName'"
                                    [LookUpTableName]="'Category1'"
                                    [HideColumns]="true">
                            </LogLov>

                            <!-- Category 2 -->
                            <LogLov *ngSwitchCase="'Category 2'" 
                                    [ObjectFieldName]="'Category2'"
                                    [ObjectTableName]="'GLAccount'"
                                    [DataContext]="DataContext"
                                    [DisplayMemberPath]="'LocalName'"
                                    [LookUpTableName]="'Category2'"
                                    [HideColumns]="true">
                            </LogLov>

                            <!-- Category 3 -->
                            <LogLov *ngSwitchCase="'Category 3'" 
                                    [ObjectFieldName]="'Category3'"
                                    [ObjectTableName]="'GLAccount'"
                                    [DataContext]="DataContext"
                                    [DisplayMemberPath]="'LocalName'"
                                    [LookUpTableName]="'Category3'"
                                    [HideColumns]="true">
                            </LogLov>

                            <!-- Category 4 -->
                            <LogLov *ngSwitchCase="'Category 4'" 
                                    [ObjectFieldName]="'Category4'"
                                    [ObjectTableName]="'GLAccount'"
                                    [DataContext]="DataContext"
                                    [DisplayMemberPath]="'LocalName'"
                                    [LookUpTableName]="'Category4'"
                                    [HideColumns]="true">
                            </LogLov>

                            <!-- Category 5 -->
                            <LogLov *ngSwitchCase="'Category 5'" 
                                    [ObjectFieldName]="'Category5'"
                                    [ObjectTableName]="'GLAccount'"
                                    [DataContext]="DataContext"
                                    [DisplayMemberPath]="'LocalName'"
                                    [LookUpTableName]="'Category5'"
                                    [HideColumns]="true">
                            </LogLov>

                            <!-- Default -->
                            <div *ngSwitchDefault>
                                <!--<span style="font-style: italic; color: #d1d1d1;font-size: 10px;">Select category first...</span>-->
                                <ComboBox [ItemsSource]="[]" [IsDisabled]="true" ></ComboBox>
                            </div>

                        </div>


                        
                    </td>
                    <td style=""></td>

                </tr>

                <tr style="height: 15px;">
                    <td></td>
                </tr>

            </table>
            <div *ngIf="!isReady" style="padding-top: 20px;padding-left: 20px;">
                Loading...
            </div>
        </td>
    </tr>
</table>
