<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr style="height:30px;">
                    <td style="color:#1B90CB;font-size:14px;"> Filter By: </td>
                </tr>

                <tr style="height:30px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:70px;">Flight Date</td>
                                <td style="width:40px;">From:</td>
                                <td style="width:170px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:20px">
                                    <div></div>
                                </td>

                                <td style="width:70px;">To:</td>
                                <td style="width:170px;">
                                    <LogDatePicker [NoObjectField]="true"  [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:20px">
                                    <div></div>
                                </td>

                                <td style="width:70px;">Shipper:</td>
                                <td style="width:170px;">
                                    <LogLov [ObjectFieldName]="'ShipperId'"
                                            [SelectedValue]="ShipperId"
                                            [ObjectTableName]="'Shipment'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Card'" [NoObjectField]="true" 
                                            [DependencyFilter1Value]="CardDependencyProperty1"
                                            [DependencyFilter1IsList]="CardDependencyProperty1IsList"
                                            >
                                    </LogLov>
                                </td>

                                <!--run button-->
                                <td style="width:30px;">
                                    <div></div>
                                </td>

                                <td style="width:80px;">
                                    <button class="GreenButton" (click)="RunReport(true)">Run Report</button>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:30px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>
                                <td style="width:110px;">Origin:</td>
                                <td style="width:170px;">
                                    <LogLov [ObjectFieldName]="'MainCarriageFromPortId'"
                                            [SelectedValue]="MainCarriageFromPortId"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Port'" [NoObjectField]="true" 
                                            [DependencyFilter1Value]="'A'" [DisplayMemberPath]="'EnglishName'">
                                    </LogLov>
                                </td>

                                <td style="width:20px">
                                    <div></div>
                                </td>

                                <td style="width:70px;">Destination:</td>
                                <td style="width:170px;">
                                    <LogLov [ObjectFieldName]="'MainCarriageFinalDestinationPortId'"
                                            [SelectedValue]="MainCarriageFinalDestinationPortId"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Port'" [NoObjectField]="true" 
                                            [DependencyFilter1Value]="'A'" [DisplayMemberPath]="'EnglishName'">
                                    </LogLov>
                                </td>

                                <td style="width:20px">
                                    <div></div>
                                </td>

                                <td style="width:70px;">Subshipper:</td>
                                <td style="width:170px;">
                                    <LogTextBox [ObjectFieldName]="'Subshipper'" [InputType]="'text'" [DataContext]="DataContext"
                                                [NoObjectField]="true"  [HideColumns]="true"></LogTextBox>
                                </td>

                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
