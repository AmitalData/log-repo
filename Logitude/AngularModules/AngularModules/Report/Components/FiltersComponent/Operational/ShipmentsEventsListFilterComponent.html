


<table style="height:60px">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>


    <tr style="height:25px">
        <td>
            <table>
                <tr>

                    <td style="width:5px;"><div style="width:5px;"></div></td>
                    <td><div style="color:#1B90CB;font-size:14px;">Filter By:</div></td>
                </tr>
            </table>
        </td>

    </tr>

    <tr>
        <td>
            <table>
                <tr>

                    <!-- From Date -->
                    <td style="width: 70px; padding-right: 10px; font-weight: bold;" class="Label"><strong style="font-weight: bold;">Shipment Create Date</strong></td>
                    <td style="width: 30px; padding-right: 5px;" class="Label">From:</td>
                    <td style="width: 180px;">
                        <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [SelectedDateValue]="FromDate" [DataContext]="DataContext"></LogDatePicker>
                    </td>

                    <!-- To Date -->
                    <td style="width: 25px; padding-right: 5px;" class="Label">To:</td>
                    <td style="width: 180px;">
                        <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDate'" [SelectedDateValue]="ToDate" [DataContext]="DataContext"></LogDatePicker>
                    </td>


                    <!-- User -->
                    <td style="width: 50px;" class="Label">User:</td>
                    <td style="width: 180px;">
                        <LogLov [ShowInActive]="true" [NoObjectField]="true"
                                [ObjectFieldName]="'UserId'"
                                [SelectedValue]="UserId"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'User'">
                        </LogLov>
                    </td>

                    <td style="width: 50px;" class="Label">Event:</td>
                    <td style="width: 180px;">
                        <LogLov [ShowInActive]="true" [NoObjectField]="true"
                                [ObjectFieldName]="'EventTypeId'"
                                [SelectedValue]="EventTypeId"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'EventType'">
                                
                        </LogLov>
                    </td>


                    <td style="width:10px"></td>
                    <!--ManuallyAddedEventsOnly-->
                    <td style="width: 220px;">
                        <CheckBox [IsChecked]="ManuallyAddedEventsOnly" (Checked)="ManuallyAddedEventsOnly = $event" [Text]="'Manually Added Events Only'"></CheckBox>
                    </td>


                    <td style="width: 80px;">
                        <button class="GreenButton" (click)="RunReport(true)">{{RunReportTitle}}</button>
                    </td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
       
    </tr>
</table>
