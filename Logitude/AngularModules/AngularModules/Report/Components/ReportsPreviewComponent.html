
<div class="MediaFillAbsolute" style="background: white;">
    <div class="MarginAbsolute10" style="top: 5px;">
        <table [attr.Id]="ComponentId">

            <!-- Back Button + Title -->
            <tr style="height: 22px;" [hidden]="IsSchedulerReport">
                <td>
                    <table>
                        <tr>
                            <td style="width: 1px;">
                                <BackButton [Text]="'Reports List'" (click)="BackButtonClicked()"></BackButton>
                            </td>
                            <td style="width:10px"></td>
                            <td *ngIf="Report.Code != 'CUAD' && Report.Code != 'CUPA'" style="padding-left: 10px; font-size:18px; color:#1B90CB;">{{Title}}</td>

                            <td *ngIf="Report.Code == 'CUAD' || Report.Code == 'CUPA'" style="width:270px; padding-left: 10px; font-size:18px; color:#1B90CB;">{{Title}}</td>
                            <td *ngIf="Report.Code == 'CUAD' || Report.Code == 'CUPA'" style="width:20px;">
                                <img src="./Images/Watch.png" style="visibility:inherit; vertical-align: middle; position: absolute; top:0; bottom:0; left:0; right:0; margin: auto; transform:none;" />
                            </td>
                            <td *ngIf="Report.Code == 'CUAD' || Report.Code == 'CUPA'"><div></div></td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr style="height: 10px;" [hidden]="IsSchedulerReport">
                <td></td>
            </tr>

            <!-- Filters -->
            <tr style="height:1px;" [attr.Id]="FiltersAreaId">
                <td style="width:100%;max-width: 500px;">
                    <div  style="overflow-x:auto;overflow-y:auto" [ngStyle]="{'height':FilterConrolHeight>185 && IsSchedulerReport ? '185px' : FilterConrolHeight}">
                        <div #FiltersLocation class="LocationDirective"></div>
                    </div>
                </td>
            </tr>

            <tr style="height: 5px;">
                <td></td>
            </tr>

            <tr>
                <td>
                    <div id="{{'RunReportSucceededDiv ' | IdGeneratorAsyncPipe | async}}" *ngIf="IsRunReportSucceeded" style="width:0px;height:0px;"></div>
                    <div id="{{'RunReportFailedDiv ' | IdGeneratorAsyncPipe | async}}" *ngIf="IsRunReportFailed" style="width:0px;height:0px;"></div>

                    <div class="MediaFill" *ngIf="IsResourcesReady">
                        <StimulsoftViewer style="text-align:center;" [StimulsoftArgData]="StimulsoftArg"></StimulsoftViewer>
                    </div>

                    <div class="MediaFill" *ngIf="Report.Code == 'CUPA'">
                        <div class="LocationDirective" #CustomerChild></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>


<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="WidthBusyIndicator" 
    [LeftButtonText]="IsSchedulerReport? null: ('General.B.SendToBackground' | TextCodeTranslationPipe)" (leftButtonClicked)="SendToBackground()" 
    [RightButtonText]="'General.B.Cancel' | TextCodeTranslationPipe" (rightButtonClicked)="CancelReport()">
</BusyIndicator>
