<style>
    .TitleBackGround {
        background: #F0F0F0;
        /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#F0F0F0, #C5C7C7);
        /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#F0F0F0, #C5C7C7);
        /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#F0F0F0, #C5C7C7);
        /* For Firefox 3.6 to 15 */
        background: linear-gradient(#F0F0F0, #C5C7C7);
        /* Standard syntax (must be last) */

        width: 100%;
        height: 25px;
        border-radius: 5px 5px 0px 0px;
    }

    select {
        border: none !important;
    }

    .ListBoxItem {
        min-height: 25px;
        background-color: transparent;
    }

    .ListBoxItem:hover {
        background: #ffffff;
        /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#ffffff, #DDE8F5);
        /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#ffffff, #DDE8F5);
        /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#ffffff, #DDE8F5);
        /* For Firefox 3.6 to 15 */
        background: linear-gradient(#ffffff, #E6EBF0);
        /* Standard syntax (must be last) */
    }

    .ListBoxItem:focus {
        background-color: red;
    }

    .ListBoxItem:active {
        background-color: green;
    }

    .ViewOnly {
        height: 28px;
        margin-right: 20px;
        margin-top: 2px;
        border: 1px solid orange;
        border-radius: 3px;
        background-color: #FFFAB4;
    }
</style>


<table>

    <tr style="height:100%;vertical-align:top">
        <td>
            <table>
                <tr>
                    <td style="width: 45%;height:100%;">
                        <div style="height:100%;width:100%;border:solid 1px #BABABA;border-radius:5px">
                            <div class="TitleBackGround">
                                <div style="float:left;">
                                    <label style="margin:5px;vertical-align: middle;">{{'General.O.AvailableColumns' |
                                        TextCodeTranslationPipe}}</label>
                                </div>
                            </div>
                            <div style="height:23px;width:100%">
                                <div style="width:100%;height:100%;">
                                    <input [disabled]="!IsTextSearchEnabled" type="text" placeholder="Search"
                                        [formControl]="SearchTextValue"
                                        style="background-color:white;background: url(Images/Search.png) no-repeat scroll;background-position: right center;padding-right:30px;width:100%;height:100%;" />
                                </div>
                            </div>
                            <div style="height:5px"></div>

                            <div style="margin:5px;overflow-y:auto;overflow-x:no-display;max-height:400px">
                                <table style="vertical-align:top;top:0px;">
                                    <tr style="text-align:left;vertical-align:top"
                                        *ngFor="let item of DataProviderFields">
                                        <DataProviderFieldsNestedList (selectChangeEvent)="SelectChanges($event,'DataProviderFields')"
                                            [margin]="20" [field]="item"></DataProviderFieldsNestedList>
                                    </tr>
                                </table>
                            </div>

                        </div>
                    </td>

                    <td style="width: 10%; vertical-align: middle;">
                        <button (click)="btnAdd_Click()" class="Button" [disabled]="IsbtnAddDisabled"
                            style="width:80px;margin: 7px;">
                            {{'General.B.Add' | TextCodeTranslationPipe}}
                            <img *ngIf="RTL == false" src="./Images/Icons/ArrowRight.png"
                                style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                            <img *ngIf="RTL == true" src="./Images/Icons/ArrowLeft.png"
                                style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                        </button>
                        <button (click)="btnRemove_Click()" class="Button" [disabled]="IsbtnRemoveDisabled"
                            style="width:80px;margin: 7px;">
                            <img *ngIf="RTL == false" src="./Images/Icons/ArrowLeft.png"
                                style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                            <img *ngIf="RTL == true" src="./Images/Icons/ArrowRight.png"
                                style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                            {{'General.B.Remove' | TextCodeTranslationPipe}}
                        </button>
                    </td>

                    <td style="width: 45%;height:100%;">
                        <div style="height:50%;width:100%;border:solid 1px #BABABA;border-radius:5px">
                            <table>
                                <tr>
                                    <td style="height:25px;width:100%;">
                                        <div class="TitleBackGround"
                                            style="width:100%;height:100%;border-radius:5px 5px 0px 0px;">
                                            <div style="float:left;">
                                                <label style="margin:5px;vertical-align: middle;">Header Columns</label>
                                            </div>
                                            <div style="float:right;">
                                                <button (click)="btnUp_Click()" class="Button"
                                                    [disabled]="IsbtnUpDisabled"
                                                    style="width:26px;margin-right: 2px;margin-top:3px;float:right;">
                                                    <img src="./Images/Icons/ArrowUp.png"
                                                        style="height:16px;vertical-align:middle;" />
                                                </button>
                                                <button (click)="btnDown_Click()" class="Button"
                                                    [disabled]="IsbtnDownDisabled"
                                                    style="width:26px;margin-top:3px;margin-right: 5px; float:right;">
                                                    <img src="./Images/Icons/ArrowDown.png"
                                                        style="height:16px;vertical-align:middle;" />
                                                </button>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <div style="margin:5px;overflow-y:auto;overflow-x:no-display;max-height:190px">
                                        <table style="vertical-align:top;top:0px;">
                                            <tr style="text-align:left;vertical-align:top"
                                                *ngFor="let item of SelectedHeaderDataProviderFields">
                                                <DataProviderFieldsNestedList isDestinationFields="true"(selectChangeEvent)="SelectChanges($event,'SelectedHeaderDataProviderFields')" [margin]="20"
                                                    [field]="item"></DataProviderFieldsNestedList>
                                            </tr>
                                        </table>
                                    </div>
                                </tr>

                            </table>

                        </div>
                        <div style="height:50%;width:100%;border:solid 1px #BABABA;border-radius:5px;margin-top: 5px;">
                            <table>
                                <tr>
                                    <td style="height:25px;width:100%;">
                                        <div class="TitleBackGround"
                                            style="width:100%;height:100%;border-radius:5px 5px 0px 0px;">
                                            <div style="float:left;">
                                                <label style="margin:5px;vertical-align: middle;">Lists Columns</label>
                                            </div>
                                            <div style="float:right;">
                                                <button (click)="btnUp_Click()" class="Button"
                                                    [disabled]="IsListsbtnUpDisabled"
                                                    style="width:26px;margin-right: 2px;margin-top:3px;float:right;">
                                                    <img src="./Images/Icons/ArrowUp.png"
                                                        style="height:16px;vertical-align:middle;" />
                                                </button>
                                                <button (click)="btnDown_Click()" class="Button"
                                                    [disabled]="IsListsbtnDownDisabled"
                                                    style="width:26px;margin-top:3px;margin-right: 5px; float:right;">
                                                    <img src="./Images/Icons/ArrowDown.png"
                                                        style="height:16px;vertical-align:middle;" />
                                                </button>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <div style="margin:5px;overflow-y:auto;overflow-x:no-display;max-height:190px">
                                        <table style="vertical-align:top;top:0px;">
                                            <tr style="text-align:left;vertical-align:top"
                                                *ngFor="let item of SelectedListsDataProviderFields">
                                                <DataProviderFieldsNestedList isDestinationFields="true"(selectChangeEvent)="SelectChanges($event,'SelectedListsDataProviderFields')" [margin]="20"
                                                    [field]="item"></DataProviderFieldsNestedList>
                                            </tr>
                                        </table>
                                    </div>
                                </tr>

                            </table>

                        </div>
                    </td>
                </tr>
            </table>
        </td>


    </tr>

    <tr style="height: 10px;"></tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="PreviewButtonClicked()">Preview</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" id="{{'OkButton' | IdGeneratorAsyncPipe | async}}"
                            (click)="SaveButtonClicked(false)">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
