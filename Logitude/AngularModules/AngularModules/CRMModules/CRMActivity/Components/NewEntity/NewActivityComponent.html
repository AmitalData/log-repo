<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="FillParent">
                <ScrollViewer>
                    <div class="LocationDirective" #Child></div>
                </ScrollViewer>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'Cancel-DontAddActivity' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'Ok-AddActivity' | IdGeneratorAsyncPipe | async}}" class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                    <td *ngIf="TypeCode === 'CL'" style="width: 5px;">
                        <div></div>
                    </td>
                    <td *ngIf="TypeCode === 'CL'" style="width: 57px;">
                        <button id="{{'SaveAsComplete' | IdGeneratorAsyncPipe | async}}" class="GreenButton" (click)="SaveAsCompletedClicked()">Save as Completed</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
