<style>
    .CurvedArea2 {
        background: white;
        border-radius: 8px;
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        border: 0.5px solid #C8C8C8;
        box-shadow: 0px 0px 1px 1px #D1D1D1;
        -moz-box-shadow: 0px 0px 1px 1px #D1D1D1;
        -webkit-box-shadow: 0px 0px 1px 1px #D1D1D1;
    }

    .AppLeftMenuBackground2 {
        background: -moz-linear-gradient(0% 50% 0deg,rgba(247, 247, 247, 1) 0%,rgba(245, 245, 245, 1) 52.38%,rgba(238, 238, 238, 1) 72.96%,rgba(226, 226, 226, 1) 87.88%,rgba(209, 209, 209, 1) 100%);
        background: -webkit-linear-gradient(0deg, rgba(247, 247, 247, 1) 0%, rgba(245, 245, 245, 1) 52.38%, rgba(238, 238, 238, 1) 72.96%, rgba(226, 226, 226, 1) 87.88%, rgba(209, 209, 209, 1) 100%);
        background: -webkit-gradient(linear,0% 50%,100% 50%,color-stop(0,rgba(247, 247, 247, 1) ),color-stop(0.5238,rgba(245, 245, 245, 1) ),color-stop(0.7296,rgba(238, 238, 238, 1) ),color-stop(0.8788,rgba(226, 226, 226, 1) ),color-stop(1,rgba(209, 209, 209, 1) ));
        background: -o-linear-gradient(0deg, rgba(247, 247, 247, 1) 0%, rgba(245, 245, 245, 1) 52.38%, rgba(238, 238, 238, 1) 72.96%, rgba(226, 226, 226, 1) 87.88%, rgba(209, 209, 209, 1) 100%);
        background: linear-gradient(90deg, rgba(247, 247, 247, 1) 0%, rgba(245, 245, 245, 1) 52.38%, rgba(238, 238, 238, 1) 72.96%, rgba(226, 226, 226, 1) 87.88%, rgba(209, 209, 209, 1) 100%);
        border-radius: 8px 0 0 8px;
        -moz-border-radius: 8px 0 0 8px;
        -webkit-border-radius: 8px 0 0 8px;
    }

    .EmailBoxMultiLinesText {
        width: 100%;
        max-height: 50px;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        font-size: 11px;
        min-height: 24px;
        background:#EBEBEB;
    }
</style>

<table style="top:0; bottom:0; left:0; right:0; margin:auto;">
    <tr style="height: 5px;">
        <td></td>
    </tr>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td>
                        <div class="FillParent CurvedArea2">
                            <table>
                                <tr>
                                    <td style="width: 130px">
                                        <div class="FillParent AppLeftMenuBackground2">
                                            <table>
                                                <tr style="height:5px;">
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td style="vertical-align: top;">
                                                        <ul>
                                                            <li>
                                                                <div style="margin-left:6px;color: #1B90CB;font-size:15px">Partners</div>
                                                            </li>
                                                            <li class="DefaultMenuItem" *ngFor="let item of PartnersObslist"
                                                                (click)="SelectionChanged(item)"
                                                                [class.SelectedMenuItem]="item === SelectedPartnerItem">
                                                                <div style="position:absolute; left: -6px; top:0; bottom:0; margin:auto; height: 22px; line-height: 22px;">{{item.PartnerType}}</div>
                                                                <img *ngIf="item === SelectedPartnerItem" class="RightCenter" src="./Images/SelectedMenuArrow.png" style="margin-right: -1px;"/>
                                                            </li>
                                                        </ul>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>

                                    <td>
                                        <div class="FillParent">

                                            <div class="FillParent" style="margin-left:5px;margin-right:5px">
                                                <table>
                                                    <tr style="height:10px">
                                                        <td colspan="3">
                                                            <div>

                                                            </div>
                                                        </td>
                                                    </tr>

                                                    <tr class="TabTitleRow">
                                                        <td style="width:5px; vertical-align:middle; font-size:11px; "><div style="width:5px"></div></td>
                                                        <td style="width: 45px; vertical-align:middle; font-size:11px; color : #6E7172;">
                                                            <div style="margin-top:2px"> Search: </div>
                                                        </td>
                                                        <td style="width:200px; vertical-align: middle;">
                                                            <SearchTextBox [ObjectTableName]="ObjectTableName" [PlaceHolder]="'Search'" (SearchTextChangeEvent)="onSearchTextChangeEvent($event)"></SearchTextBox>
                                                        </td>

                                                        <td><div></div></td>
                                                    </tr>

                                                    <!-- Grid -->
                                                    <tr>
                                                        <td colspan="4">
                                                            <div class="FillParent">
                                                                <div class="ScrollViewer">
                                                                    <div class="ScrollContent">
                                                                        <table>
                                                                            <tr>
                                                                                <td style="height: 100%;">
                                                                                    <div style="height: 100%; width: 100%; position: relative;">
                                                                                        <logitude-grid [QueryChangeEvent]="onQueryChangeEvent" [rows]="items" [dataSource]="DataSource" [SearchFieldchangeevent]="SearchFieldchangeevent"
                                                                                                       [columns]="columns" [autoLoad]="true" [IsCustomTemplate]="true">
                                                                                        </logitude-grid>
                                                                                    </div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>

                                                    <tr style="height:5px">
                                                        <td colspan="4">
                                                            <div style="height:5px"></div>
                                                        </td>
                                                    </tr>

                                                    <tr style="height:85px;max-height:190px">
                                                        <td colspan="4" style="height:auto">
                                                            <div style="min-height:85px;max-height:190px">
                                                                <table style="height:auto;width:100%;">

                                                                    <!-- Required -->
                                                                    <tr>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td style="width:30px;text-align:left">Required:</td>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td>
                                                                            <div class="EmailBoxMultiLinesText" style="border:1px solid #ccc9c9;border-radius:3px;">
                                                                                <div style="padding-left:1px;display:inline-block;vertical-align:middle;">
                                                                                    <span style="padding-left:5px">{{RequiredBoxText}}</span>
                                                                                </div>
                                                                            </div>
                                                                        </td>

                                                                        <td style="width:10px"><div></div></td>
                                                                    </tr>

                                                                    <tr style="height:5px;"><td colspan="5"></td></tr>

                                                                    <!--Required (e-mail)-->
                                                                    <tr>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td style="width:30px;text-align:left">Required (e-mail):</td>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td>
                                                                            <LogTextBox  [NoObjectField]="true"  [HideColumns]="true" [ObjectFieldName]="'RequiredEmailBoxText'" [Text]="RequiredEmailBoxText" [DataContext]="DataContext"></LogTextBox>
                                                                        </td>

                                                                        <td style="width:10px"><div></div></td>
                                                                    </tr>

                                                                    <tr style="height:5px;"><td colspan="5"></td></tr>

                                                                    <!-- Optional -->
                                                                    <tr>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td style="width:30px;text-align:left">Optional:</td>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td>
                                                                            <div class="EmailBoxMultiLinesText" style="border:1px solid #ccc9c9;border-radius:3px;">
                                                                                <div style="padding-left:1px;display:inline-block;vertical-align:middle;">
                                                                                    <span style="padding-left:5px">{{OptionalBoxText}}</span>
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                        <td style="width:10px"><div></div></td>
                                                                    </tr>

                                                                    <tr style="height:5px;"><td colspan="5"></td></tr>

                                                                    <!--Optional (e-mail)-->
                                                                    <tr>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td style="width:30px;text-align:left">Optional (e-mail):</td>
                                                                        <td style="width:5px"><div></div></td>
                                                                        <td>
                                                                            <LogTextBox  [NoObjectField]="true"  [HideColumns]="true" [ObjectFieldName]="'OptionalEmailBoxText'" [Text]="OptionalEmailBoxText" [DataContext]="DataContext"></LogTextBox>
                                                                        </td>
                                                                        <td style="width:10px"><div></div></td>
                                                                    </tr>

                                                                    <tr style="height:5px;"><td colspan="5"></td></tr>
                                                                </table>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
