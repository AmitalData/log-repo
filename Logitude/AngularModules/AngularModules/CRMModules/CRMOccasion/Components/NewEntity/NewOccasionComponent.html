<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>

                <!-- Name -->
                <tr class="FormFieldRow">
                    <td style="width: 120px;">
                        <LogLabel [ObjectFieldName]="'Name'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogLabel>
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:450px">
                                    <LogTextBox [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [Text]="Name" [InputType]="'ntext'" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- OccasionTypeId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'OccasionTypeId'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogLabel>
                    </td>

                    <td style="width:250px">
                        <LogLov [ObjectFieldName]="'OccasionTypeId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'OccasionType'"
                                [SelectedValue]="OccasionTypeId" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- OccasionStatusId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'OccasionStatusId'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'OccasionStatusId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'OccasionStatus'"
                                [SelectedValue]="OccasionStatusId" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- IndustryId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'IndustryId'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'IndustryId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Industry'"
                                [SelectedValue]="IndustryId" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- OwnerId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'OwnerId'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'OwnerId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'User'"
                                [SelectedValue]="OwnerId" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- StartDateTime -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'StartDateTime'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <table>
                            <tr>
                                <td style="width:280px;">
                                    <table>
                                        <tr>
                                            <td>
                                                <LogDatePicker [ObjectFieldName]="'StartDateTime'" [SelectedDateValue]="StartDateTime" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>

                                            <td style="width: 2px;">
                                                <div></div>
                                            </td>

                                            <td>
                                                <LogDatePicker [ObjectFieldName]="'StartDateTime'" [SelectedDateValue]="StartDateTime" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'"></LogDatePicker>
                                            </td>
                                        </tr>
                                    </table>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- EndDateTime -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'EndDateTime'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <table>
                            <tr>
                                <td>
                                    <table>
                                        <tr>
                                            <td>
                                                <LogDatePicker [ObjectFieldName]="'EndDateTime'" [SelectedDateValue]="EndDateTime" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>

                                            <td style="width: 2px;">
                                                <div></div>
                                            </td>

                                            <td>
                                                <LogDatePicker [ObjectFieldName]="'EndDateTime'" [SelectedDateValue]="EndDateTime" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'"></LogDatePicker>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Location -->
                <tr class="FormFieldRow">
                    <td style="vertical-align:top;">
                        <LogLabel [ObjectFieldName]="'Location'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:250px;height:85px;">
                                    <div class="MediaFill">
                                        <LogTextBox [ObjectFieldName]="'Location'" [Text]="Location" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Goal -->
                <tr class="FormFieldRow">
                    <td style="vertical-align:top;">
                        <LogLabel [ObjectFieldName]="'Goal'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:250px;height:85px;">
                                    <div class="MediaFill">
                                        <LogTextBox [ObjectFieldName]="'Goal'" [Text]="Goal" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
