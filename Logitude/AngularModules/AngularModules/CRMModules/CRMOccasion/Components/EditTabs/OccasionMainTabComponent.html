
<style type="text/css">
    .borderlist {
        list-style-position: inside;
        border: 1px solid black;
        border-radius: 10px;
        padding: 5px;
        margin: 10px;
        border-color: #D1D1D1;
        overflow: hidden;
    }
</style>


<div class="TabHolder">
    <table>

        <!-- Header -->
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td>{{'Occasion.TH.Main' | TextCodeTranslationPipe}}</td>

                        <td style="width:160px">
                            <EntityFollowComponent [EntityId]="EntityId" [ObjectTableName]="'Occasion'"></EntityFollowComponent>
                        </td>

                        <td style="width:5px">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Counts -->
        <tr style="height:100px;">
            <td>
                <table>
                    <tr>
                        <td>
                            <div class="MediaFill">
                                <fieldset class="MediaFill GroupBox">
                                    <legend>
                                        <span>Contacts</span>
                                    </legend>

                                    <div style="top: 10px;">
                                        <table class="FixedTable">
                                            <tr style="vertical-align:central;text-align:center;">
                                                <td>
                                                    <div style="font-size:30px;text-align:center;color:#1B90CB;">
                                                        <span class="QueryLink" style="font-size:30px;text-align:center;color:#282E30;" (click)="ViewAllData('AllContacts')"> {{NumberAllContacts}} </span>
                                                    </div>
                                                    <div style="height:5px;"></div>
                                                    <div style="font-size:11px;text-align:center;color:#6E7172;vertical-align:middle;text-align:center;"> All </div>
                                                </td>

                                                <td>
                                                    <div style="font-size:30px;text-align:center;color:#1B90CB;">
                                                        <span class="QueryLink" style="font-size:30px;text-align:center;color:#282E30;" (click)="ViewAllData('InvitedContacts')"> {{NumberInvitedContacts}} </span>
                                                    </div>
                                                    <div style="height:5px;"></div>
                                                    <div style="font-size:11px;text-align:center;color:#6E7172;vertical-align:middle;text-align:center;"> Invited </div>
                                                </td>

                                                <td>
                                                    <div style="font-size:30px;text-align:center;color:#1B90CB;">
                                                        <span class="QueryLink" style="font-size:30px;text-align:center;color:#282E30;" (click)="ViewAllData('ParticipatedContacts')"> {{NumberOfParticipatedContacts}} </span>
                                                    </div>
                                                    <div style="height:5px;"></div>
                                                    <div style="font-size:11px;text-align:center;color:#6E7172;vertical-align:middle;text-align:center;"> Participated </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </fieldset>
                            </div>
                        </td>

                        <td style="width: 10px;">
                            <div></div>
                        </td>

                        <td>
                            <div class="MediaFill">
                                <fieldset class="MediaFill GroupBox">
                                    <legend>
                                        <span>Customers</span>
                                    </legend>

                                    <div style="top: 10px;">
                                        <table class="FixedTable">
                                            <tr style="vertical-align:central;text-align:center;">
                                                <td>
                                                    <div style="font-size:30px;text-align:center;color:#1B90CB;">
                                                        <span class="QueryLink" style="font-size:30px;text-align:center;color:#282E30;" (click)="ViewAllData('AllCustomers')"> {{NumberAllCustomers}} </span>
                                                    </div>
                                                    <div style="height:5px;"></div>
                                                    <div style="font-size:11px;text-align:center;color:#6E7172;vertical-align:middle;text-align:center;"> All </div>
                                                </td>

                                                <td>
                                                    <div style="font-size:30px;text-align:center;color:#1B90CB;">
                                                        <span class="QueryLink" style="font-size:30px;text-align:center;color:#282E30;" (click)="ViewAllData('InvitedCustomers')"> {{NumberInvitedCustomers}} </span>
                                                    </div>
                                                    <div style="height:5px;"></div>
                                                    <div style="font-size:11px;text-align:center;color:#6E7172;vertical-align:middle;text-align:center;"> Invited </div>
                                                </td>

                                                <td>
                                                    <div style="font-size:30px;text-align:center;color:#1B90CB;">
                                                        <span class="QueryLink" style="font-size:30px;text-align:center;color:#282E30;" (click)="ViewAllData('ParticipatedCustomers')"> {{NumberOfParticipatedCustomers}} </span>
                                                    </div>
                                                    <div style="height:5px;"></div>
                                                    <div style="font-size:11px;text-align:center;color:#6E7172;vertical-align:middle;text-align:center;"> Participated </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </fieldset>
                            </div>
                        </td>

                        <td style="width: 430px;">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style=" height:5px;">
            <td>
                <div></div>
            </td>
        </tr>
        <tr>
            <td>
                <table>
                    <tr>
                        <td>
                            <table>
                                <tr style="height:25px;">
                                    <td>
                                        <table>
                                            <tr>
                                                <td style="width:300px; float:left;">
                                                    <SearchTextBox [ObjectTableName]="ObjectTableName" (SearchTextChangeEvent)="SearchTextKeyUp($event)" [PlaceHolder]="'Search'"></SearchTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                                <td style="float:right;"></td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr style="height: 5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                                <tr class="SectionHeader" style="height:32px;">
                                    <td>
                                        <table>
                                            <tr style="height:5px;">
                                                <td colspan="3">
                                                    <div></div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding-left:10px;float:left;vertical-align:central;width: 20px;">
                                                    <LogCheckBox [ObjectFieldName]="'IsCheckedAllContacts'" [NoObjectField]="true" [Checked]="IsCheckedAllContacts" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                                </td>

                                                <td>
                                                    <div></div>
                                                </td>

                                                <td style="float:right;vertical-align:central;">
                                                    <button class="Button" (click)="AddContactsClicked()">Add Contacts</button>
                                                </td>

                                                <td style="width:3px;">
                                                    <div></div>
                                                </td>
                                            </tr>

                                            <tr style="height:5px;">
                                                <td colspan="4">
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <tr style="height: 5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr>
                                    <td>
                                        <div class="MediaFill">
                                            <SectionBox [Scrolling]="true" [HeaderHeight]="1">
                                                <SectionBody>
                                                    <div>
                                                        <div class="borderlist" *ngFor="let item of OccasionLinesList">
                                                            <table>

                                                                <tr>
                                                                    <td></td>
                                                                    <td></td>
                                                                    <td></td>
                                                                    <td></td>
                                                                    <td></td>
                                                                    <td></td>
                                                                </tr>
                                                            </table>
                                                        </div>
                                                    </div>
                                                </SectionBody>
                                            </SectionBox>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <td style="width:10px;">
                            <div></div>
                        </td>

                        <td style="width:420px;">
                            <div class="MediaFill">
                                <SocialComponent [QueryName]="'Following'" [SubQueryName]="'All'" [IsEntityMode]="true" [ScreenCode]="'OCMN'"></SocialComponent>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
