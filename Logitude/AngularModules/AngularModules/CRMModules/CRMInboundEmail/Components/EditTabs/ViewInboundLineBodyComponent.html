<table>

    <tr style="height:5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <textarea style="width:100%; border: none;border-width:0px; outline: none;-webkit-box-shadow: none;-moz-box-shadow: none;box-shadow: none;"
                          [ngModel]="Description"
                          [readonly]="true"></textarea>
            </div>
        </td>
    </tr>

    <tr style="height:5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px; vertical-align: middle">
                        <button class="Button" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
