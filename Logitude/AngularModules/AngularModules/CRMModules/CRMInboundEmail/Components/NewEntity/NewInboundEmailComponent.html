<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <!-- Recepient -->
                <tr class="FormFieldRow">
                    <td style="width:100px;">
                        <label> Recepient </label>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'Recepient'" [Text]="Recepient" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                    </td>
                    <td style="width:10px;">
                        <div></div>
                    </td>
                </tr>

                <!-- Subject -->
                <tr class="FormFieldRow">
                    <td style="width:100px;">
                        <label> Subject </label>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'Subject'" [Text]="Subject" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                    </td>
                    <td style="width:10px;">
                        <div></div>
                    </td>
                </tr>

                <!-- Body -->
                <tr class="FormFieldRow">
                    <td colspan="3" style="float:left;">
                        <label style="float:left;"> Body </label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <div class="MediaFill">
                            <LogTextBox [ObjectFieldName]="'Body'" [Text]="Body" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                        </div>
                    </td>
                    <td style="width:10px;">
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
               
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
