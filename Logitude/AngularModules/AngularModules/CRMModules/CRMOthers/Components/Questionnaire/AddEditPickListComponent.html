<table style="height:100%;vertical-align:top">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:30px;vertical-align:top;">
        <td>
            <table>
                <tr>
                    <td style="width:10px"></td>
                    <td   style="width:100px">Code<div></div></td>
                    <td><input [disabled]="!IsNewMode" style="width:150px;height:22px;" type="text" [(ngModel)]="PickListCode" /></td>
                    <td></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:10px;vertical-align:top;">
        <td></td>
    </tr>
          
    <tr style="height:100%;vertical-align:top;">

        <td>
            <table>
                <tr>

                    <td>
                        <logitude-edit-grid (SelectedItemChanged)="rowChanged($event)"  [HeaderHeight]="25" GridHeight="100%" [ItemSource]="ItemsSource">


                            <!-- Quantity -->
                            <log-column  style="border-right:0px solid white" [width]="'652'" [header]="'Value'">
                                <log-cell-template template="let item" #logcelltemplate>

                                    <div  *ngIf="logcelltemplate.IsDisplayMode" style="text-align: left;">
                                        {{item.Value}}
                                    </div>

                                    <div  *ngIf="logcelltemplate.IsEditMode">
                                        <LogTextBox  [FocusOnMe]="'true'" [ObjectFieldName]="'Value'" [Text]="item.Value" [DataContext]="item" [ObjectTableName]="'CustomPickList'" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </log-cell-template>
                            </log-column>


                            <log-column>
                                <log-cell-template template="let item" [TabIndex]="-1">
                                    <div style="height: 100%;width:100%; position: relative;">
                                        <div class="LeftCenter" style="height: 20px;">
                                            <table>
                                                <tr>
                                                   
                                                    <td>
                                                        <IconButton [Name]="'Delete'" [IsSmall]="true"  (click)="RemovePickListClicked(item)" ></IconButton>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </log-cell-template>
                            </log-column>


                        </logitude-edit-grid>


                   




                    </td>

                    <td style="width:10px;"></td>
                    <td style="width:70px;">

                        <table>
                            <tr style="height:22px">
                                <td><div><button  [disabled]="!PickListCode" class="Button" (click)="AddPickListClicked()">Add</button></div></td>

                            </tr>
                         
                            <tr>
                                <td><div></div></td>
                            </tr>
                        </table>


                    </td>
                 
                </tr>
            </table>
        </td>



    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
