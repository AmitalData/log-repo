<table>
    <tr style="vertical-align:top;">
        <td>
            <div style="border:0px;" class="MediaFill">
                <div class="MediaFillRelative">
                    <div class="MediaFillAbsolute" style="top: 5px; border-right:2px solid #E4E3E1;border-left:2px solid #E4E3E1;border-bottom:2px solid #E4E3E1;border-radius:6px;">
                        <table>
                            <tr style="height:25px">
                                <td>
                                    <div style="background-color:#EDEDED;height:25px;border-top:2px solid #E4E3E1;border-bottom:2px solid #E4E3E1;border-top-Right-radius:6px; border-top-left-radius:6px;color:black">

                                        <table>
                                            <tr>
                                                <td>
                                                    <div></div>
                                                </td>

                                                <td style="width:125px">
                                                    <LogCheckBox [Text]="'Include Inactive'" [ObjectFieldName]="'IncludeInactive'" [DataContext]="DataContext" [NoObjectField]="true" [Checked]="IncludeInactive" (ValueChanged)="IncludeInactiveChecked($event)"></LogCheckBox>
                                                </td>

                                                <td style="width:20px">
                                                    <div style="width:20px"> </div>
                                                </td>

                                                <td class="CellStretched" style="width:25px; min-width:25px; max-width:25px; position: relative;">
                                                    <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddSLA()"></IconButton>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                            </tr>

                            <tr style="height:3px">
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <ScrollViewer>
                                        <div class="SimpleGridView">
                                            <div class="SimpleGridViewHeader">
                                                <table>
                                                    <tr>
                                                        <td style="width: 80px; min-width: 80px;">Order</td>
                                                        <td style="width: 120px; min-width: 120px;">Name</td>
                                                        <td style="width: 130px; min-width:130px">Description</td>
                                                        <td style="width: 90px; min-width: 90px">Create Date</td>
                                                        <td style="width: 110px; min-width: 110px">Create By</td>
                                                        <td style="width: 90px; min-width: 90px">Update Date</td>
                                                        <td style="width: 110px; min-width: 110px">Update By</td>
                                                        <td style="width: 50px; min-width: 50px">inactive</td>
                                                        <td style="width: 30px; min-width: 30px"></td>
                                                        <td style="width: 100%; min-width: 100%"></td>
                                                    </tr>
                                                </table>
                                            </div>

                                            <div class="SimpleGridViewBody">
                                                <table>
                                                    <tr class="SimpleGridViewRow RowHover" *ngFor="let item of SLAList">
                                                        <td>
                                                            <table>
                                                                <tr style="height:25px;">
                                                                    <td class="GridViewCell" style="width: 80px; min-width: 80px; max-width: 80px; position: relative;">
                                                                        {{item.Order}}
                                                                    </td>

                                                                    <td [attr.title]="item.Name" class="GridViewCell TextTrimming" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                                                        {{item.Name}}
                                                                    </td>

                                                                    <td class="GridViewCell TextTrimming" style="width:130px; min-width:130px; max-width:130px; position: relative;">
                                                                        {{item.Description}}
                                                                    </td>

                                                                    <td class="GridViewCell" style="width: 90px; min-width: 90px; max-width: 90px; position: relative;">
                                                                        {{item.CreateDate | DateTimeToDatePipe}}
                                                                    </td>

                                                                    <td class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px; position: relative;">
                                                                        {{item.CreatedByUserName}}
                                                                    </td>

                                                                    <td class="GridViewCell" style="width: 90px; min-width: 90px; max-width: 90px; position: relative;">
                                                                        {{item.UpdateDate | DateTimeToDatePipe}}
                                                                    </td>

                                                                    <td class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px; position: relative;">
                                                                        {{item.UpdatedByUserName}}
                                                                    </td>

                                                                    <td class="CellStretched" style="width:50px; min-width:50px; max-width:50px; position: relative;">
                                                                        <div style="width:50px">
                                                                            <img *ngIf="item.Inactive" class="CenterCenter" style="width:20px;height:20px" src="./Images/Icons/MiniGreenTick.png" />
                                                                        </div>
                                                                    </td>

                                                                    <td class="CellStretched" style="width:30px; min-width:30px; max-width:30px; position: relative;">
                                                                        <div class="EditButton" (click)="EditSLA(item)" style="display:inline;width:18px;">
                                                                            <IconButton [Name]="'Edit'" [IsSmall]="true" style="display: block;margin-left:7px"></IconButton>
                                                                        </div>
                                                                    </td>

                                                                    <td class="CellStretched" style="width:100%;min-width:100%;max-width:100%;position:relative">
                                                                        <div class="CenterCenter" style="width:100%;vertical-align:middle;"></div>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td colspan="11"></td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </ScrollViewer>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom" colspan="4">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
