<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width:100px;">
                        <LogLabel [ObjectFieldName]="'Mailbox'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:200px;">
                        <LogTextBox [ObjectFieldName]="'Mailbox'" [Text]="Mailbox" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'IsDefault'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <table>
                            <tr>
                                <td style="width:25px;">
                                    <LogCheckBox [ObjectFieldName]="'IsDefault'" [Checked]="IsDefault" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                </td>
                                <td style="width: 15px;" *ngIf="IsDefaultInfoIconVisible">
                                    <img src="./Images/Info.png" style="width: 15px; height:15px; float: left;" [title]="'If you want to mark another mailbox as default the edit that one'" />
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>                       
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow" *ngIf="!IsNewEntity">
                    <td>
                        <LogLabel [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogCheckBox [ObjectFieldName]="'Inactive'" [Checked]="Inactive" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom" colspan="4">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
