<table>
    <tr class="FormFieldRow">
        <td>
            <div></div>
        </td>

        <td style="width:25px; min-width:25px; max-width:25px;">
            <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddMailBox()"></IconButton>
        </td>
    </tr>

    <tr style="height:3px">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 120px; min-width: 120px; max-width:120px;">Mailbox</td>
                                <td style="width: 90px; min-width: 90px ; max-width:90px;">Create Date</td>
                                <td style="width: 110px; min-width: 110px ; max-width:110px;">Create By</td>
                                <td style="width: 90px; min-width: 90px; max-width:90px;">Update Date</td>
                                <td style="width: 110px; min-width: 110px; max-width:110px;">Update By</td>
                                <td style="width: 50px; min-width: 50px; max-width:50px;">Default</td>
                                <td style="width: 50px; min-width: 50px; max-width:50px;">Inactive</td>
                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow" *ngFor="let item of MailBoxesList">
                                <td class="GridViewCell TextTrimming" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                    {{item.Mailbox}}
                                </td>

                                <td class="GridViewCell" style="width: 90px; min-width: 90px; max-width: 90px; position: relative;">
                                    {{item.CreateDate | DateTimeToDatePipe}}
                                </td>

                                <td class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px; position: relative;">
                                    {{item.CreatedByUserName}}
                                </td>

                                <td class="GridViewCell" style="width: 90px; min-width: 90px; max-width: 90px; position: relative;">
                                    {{item.UpdateDate | DateTimeToDatePipe}}
                                </td>

                                <td class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px; position: relative;">
                                    {{item.UpdatedByUserName}}
                                </td>

                                <td class="CellStretched" style="width:50px; min-width:50px; max-width:50px; position: relative;">
                                    <div style="width:50px">
                                        <img *ngIf="item.IsDefault" class="CenterCenter" style="width:20px;height:20px" src="./Images/Icons/MiniGreenTick.png" />
                                    </div>
                                </td>

                                <td class="CellStretched" style="width:50px; min-width:50px; max-width:50px; position: relative;">
                                    <div style="width:50px">
                                        <img *ngIf="item.Inactive" class="CenterCenter" style="width:20px;height:20px" src="./Images/Icons/MiniGreenTick.png" />
                                    </div>
                                </td>

                                <!-- Tools -->
                                <td class="CellTools">
                                    <span class="CellSeparator"></span>
                                    <IconButton [Name]="'Delete'" [IsSmall]="true" [Left]="3" (click)="DeletePackage(item)"></IconButton>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="8">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
