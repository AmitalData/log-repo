<style type="text/css">
    .Box {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        overflow: hidden;
    }

    .BoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }
</style>
<div class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>{{'EmployeeGroup.TH.General' | TextCodeTranslationPipe}}</td>
        </tr>

        <tr>
            <td>
                <table>
                    <tr style="height:1px;">
                        <td>
                            <table>
                                <!-- Name -->
                                <tr class="FormFieldRow">
                                    <td style="width:100px;">
                                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td style="width:230px;">
                                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                    <td><div></div></td>
                                </tr>
                                <!-- Description -->
                                <tr class="FormFieldRow">
                                    <td style="vertical-align:top;">
                                        <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td style="height:85px;">
                                        <div class="FillParent">
                                            <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                        </div>
                                    </td>
                                    <td><div></div></td>
                                </tr>
                                <!-- ManagerUserId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ManagerUserId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogLov [ObjectFieldName]="'ManagerUserId'"
                                                [SelectedValue]="ManagerUserId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'User'">
                                        </LogLov>
                                    </td>
                                    <td><div></div></td>
                                </tr>
                                <!-- EscalationNotify -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'EscalationNotify'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <div>
                                            <EmailSearchTextBox [EmailsText]="EscalationNotify" [Watermark]="'Add Users'" [IsUsersList]="true" (EmailsTextChanged)="EscalationNotify = $event"></EmailSearchTextBox>
                                        </div>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <!-- Inactive -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'Inactive'" [Checked]="Inactive" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                    <td><div></div></td>
                                </tr>
                                <tr><td colspan="3"><div></div></td></tr>
                            </table>
                        </td>
                    </tr>
                    <tr style="height:10px;"><td><div></div></td></tr>
                    <tr>
                        <td style="width:100%;">
                            <div class="Box">
                                <table>
                                    <tr class="BoxHeader">
                                        <td style="color:#45494A;font-size:14px;float:left;width:65px;">Members</td>
                                        <td style="width: 20px; padding: 3px;float:right;">
                                            <IconButton [Width]="18" [Height]="16" [Name]="'Add'" (click)="NewGroupLine()"></IconButton>
                                        </td>
                                        <td style="width:5px;">
                                            <div></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <table>
                                                <tr style="height:22px;">
                                                    <td>
                                                        <div style="margin-top:3px;margin-bottom:3px;margin-left:3px;height:22px;border:solid;border-width:1px;border-radius:3px;border-color:#D1D1D1;">
                                                            <table>
                                                                <tr>
                                                                    <td style="width:10px;"><div></div></td>
                                                                    <td style="width:200px;text-align:left;"> Users</td>
                                                                    <td style="text-align:left;"> Default Owner</td>
                                                                </tr>
                                                            </table>
                                                        </div>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <div class="SimpleGridView">
                                                            <div style="top:2px;" class="SimpleGridViewBody">
                                                                <table>
                                                                    <tr *ngFor="let item of EmployeeGroupLines" style="height:35px">
                                                                        <td>
                                                                            <div style="margin-bottom:3px;margin-left:3px;height:35px;border:solid;border-width:1px;border-radius:3px;border-color:#D1D1D1;vertical-align:middle;text-align:center;">
                                                                                <table>
                                                                                    <tr style="height:5px;"><td><div></div></td></tr>
                                                                                    <tr>
                                                                                        <td style="width:10px;min-width:10px;max-width:10px;"><div></div></td>
                                                                                        <td class="GridViewCell" style="width:200px;min-width:200px;max-width:200px;vertical-align:middle;text-align:left;">
                                                                                            <LogLov [ObjectFieldName]="'UserId'"
                                                                                                    [SelectedValue]="item.UserId"
                                                                                                    [ObjectTableName]="'EmployeeGroupLine'"
                                                                                                    [DataContext]="item.DataContext"
                                                                                                    [LookUpTableName]="'User'">
                                                                                            </LogLov>
                                                                                        </td>
                                                                                        <td sclass="GridViewCell" tyle="width:60px;min-width:60px;max-width:60px;vertical-align:middle;">
                                                                                            <div class="CellTools">
                                                                                                <table>
                                                                                                    <tr>
                                                                                                        <td style="width:5px;"><div></div></td>
                                                                                                        <td style="width:25px;">
                                                                                                            <LogCheckBox [ObjectFieldName]="'IsDefaultOwner'" [Checked]="item.IsDefaultOwner" [ObjectTableName]="'EmployeeGroupLine'" [DataContext]="item.DataContext"></LogCheckBox>
                                                                                                        </td>
                                                                                                        <td style="width:5px;"><div></div></td>
                                                                                                        <td style="width:25px;">
                                                                                                            <IconButton [Width]="18" [Height]="16" [Name]="'Delete'" (click)="DeleteGroupLine(item)"></IconButton>
                                                                                                        </td>
                                                                                                        <td><div></div></td>
                                                                                                    </tr>
                                                                                                </table>
                                                                                            </div>
                                                                                        </td>
                                                                                        <td class="GridViewCell" style="width:25px;min-width:25px;max-width:25px;padding:3px;vertical-align:middle;"><div></div></td>
                                                                                    </tr>
                                                                                    <tr>
                                                                                        <td colspan="3">
                                                                                            <div></div>
                                                                                        </td>
                                                                                    </tr>
                                                                                </table>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                    <tr>
                                                                        <td>
                                                                            <div></div>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
