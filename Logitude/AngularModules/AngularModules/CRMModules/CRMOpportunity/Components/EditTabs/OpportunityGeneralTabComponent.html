
<style type="text/css">
    .NoteItemBox {

        background: #FFFADC;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        overflow-x: hidden;
    }

    .NotesTextArea {
        padding: 2px;
        padding-left: 4px;
        font-size: 12px;
        color: #45494A;
        background: #FFFADC;
        border: hidden;
        overflow: auto;
        outline: none;
        -webkit-box-shadow: none;
        -moz-box-shadow: none;
        box-shadow: none;
    }

    #NotesGroup {
        -moz-box-shadow: 0 0 5px #888;
        -webkit-box-shadow: 0 0 5px#888;
        box-shadow: 0 0 5px #888;
        padding: 10px;
