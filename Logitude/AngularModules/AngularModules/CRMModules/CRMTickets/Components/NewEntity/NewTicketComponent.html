
<style type="text/css">
    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }
</style>

<table *ngIf="IsVisible">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>

                                <!-- Entity Type -->
                                <tr class="FormFieldRow">
                                    <td style="width:153px;">
                                        <LogLabel [ObjectFieldName]="'EntityType'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        <!--<LogLabel [NoObjectField]="true" [Text]="'Entity Type'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>-->
                                    </td>

                                    <td style="width:260px;">
                                        <LogLov [ObjectFieldName]="'EntityType'"
                                                [ObjectTableName]="ObjectTableName"
                                                [SelectedValue]="EntityType"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'ObjectTable'"
                                                (SelectedItemChanged)="$event ? EntityObjectTableName = $event.Name : EntityObjectTableName = null"
                                                [DependencyFilter3Value]="true" [HideColumns]="true"></LogLov>

                                                  [Binding]="'Name'"></ComboBox>-->
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                                    <li class="LogitudeQuickSearchItem" style="height:25px;" *ngFor="let item of QuickSearchItems" (mousedown)="QuickSearchTextChanged(item)">

                                                                </td>

                                                                <td>
                                                                    <div></div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </li>
                                                </ul>
                                            </QuickSearchTextBox>
                                        </div>

                                        <div *ngIf="EntityObjectTableName =='Quote'">

                                                    <li class="LogitudeQuickSearchItem" style="height:25px;" *ngFor="let item of QuickSearchItems" (mousedown)="QuickSearchTextChanged(item)">

                                                            <tr>

                                                                        <img class="CenterCenter" [attr.src]="'./Images/Icons/' + item.TransportModeId + '.png'" />
                                                                    </div>
                                                                </td>

                                                                <td style="width: 2px;">
                                                                    <div></div>
                                                                </td>

                                                                <td class="TextTrimming" style="width: 85px; min-width: 85px; max-width: 85px; font-size: 10px; color: #6E7172;">{{item.QuoteNumber}}</td>

                                                                <td class="TextTrimming" style="width: 100px; min-width:100px; max-width:100px;" title="Customer">
                                                                    <span style="font-size: 10px; color: #1B90CB;" class="TextTrimming">{{item.CustomerName}}</span>
                                                                </td>

                                                                <td>
                                                                    <div></div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </li>
                                                </ul>
                                            </QuickSearchTextBox>
                                        </div>
                                    </td>

                                    <td>
                                        <table>
                                            <tr>
                                                <td width="5px;"> </td>

                                                <td width="16px;">
                                                    <img style="width: 14px; height: 14px; cursor: pointer;" src="./Images/LOVSearch.png" (click)="ChooseEntity()" />
                                                </td>
                                                <td width="5px;"> </td>

                                                <td *ngIf="EntityObjectTableName =='Quote'" width="16px;">
                                                    <IconButton [Name]="'Add'" (click)="AddButtonClicked()"></IconButton>
                                                </td>
                                                <td><div></div></td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- InternalMode -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'InternalMode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'InternalMode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Company Id -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'CompanyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td colspan="2">
                                        <table>
                                            <tr>
                                                <td style="width:290px;">
                                                    <LogLov [ObjectFieldName]="'CompanyId'"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [SelectedValue]="CompanyId"
                                                            [LookUpTableName]="'Card'" [HideAdd]="true" [HideAddLink]="true" [HideEdit]="true">
                                                    </LogLov>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- CustomerContactId -->
                                <tr *ngIf="InternalMode == true" class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'CustomerContactId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td colspan="2">
                                        <table>
                                            <tr>
                                                <td style="width:260px;">
                                                    <LogLov [ObjectFieldName]="'CustomerContactId'"
                                                            [SelectedValue]="CustomerContactId"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'Contact'"
                                                            [DependencyFilter1Value]="CompanyId" [HideColumns]="true">
                                                    </LogLov>
                                                </td>
                                                <td style="width:5px;">
                                                    <div></div>
                                                </td>
                                                <td *ngIf="InternalMode" style="width: 20px;">
                                                     <IconButton  [Name]="'Add'" [IsSmall]="true" (click)="AddContact()" [disabled]="!IsAddContactEnabled"></IconButton>
                                                </td>

                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Contact Id -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ContactId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td colspan="2">
                                        <table>
                                            <tr>
                                                <td style="width:260px;">
                                                    <LogLov [ObjectFieldName]="'ContactId'"
                                                            [SelectedValue]="ContactId"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'Contact'"
                                                            [DependencyFilter1Value]="CompanyIdCustomFilter" [DependencyFilter2Value]="ContactIdCustomFilter" [HideColumns]="true">
                                                    </LogLov>
                                                </td>
                                                <td style="width:5px;">
                                                    <div></div>
                                                </td>
                                                <td *ngIf="!InternalMode" style="width: 20px;">
                                                        <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddContact()" [disabled]="!IsAddContactEnabled"></IconButton>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Subject -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Subject'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td colspan="2">
                                        <table>
                                            <tr>
                                                <td  style="width:370px;">
                                                    <LogTextBox [ObjectFieldName]="'Subject'" [Text]="Subject" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                </td>
                                                <td><div></div></td>
                                            </tr>
                                        </table>
                                    </td>

                                </tr>

                                <!-- TicketDescription -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'TicketDescription'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td colspan="2">
                                        <table>
                                            <tr>
                                                <td style="width:370px;height:85px;">
                                                    <div class="MediaFill">
                                                        <LogTextBox [ObjectFieldName]="'TicketDescription'" [Text]="TicketDescription" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                                    </div>
                                                </td>
                                                <td><div></div></td>
                                            </tr>
                                        </table>
                                       
                                    </td>

                                </tr>

                                <!-- Main Classification-->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'MainClassificationId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'MainClassificationId'"
                                                [SelectedValue]="MainClassificationId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'TicketClassification'"
                                                [DependencyFilter1Value]="FirstClassificationId" [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Secondery Classification-->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'SecondaryClassificationId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'SecondaryClassificationId'"
                                                [SelectedValue]="SecondaryClassificationId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'TicketClassification'"
                                                [DependencyFilter1Value]="SecondClassificationId" [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Severity-->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'SeverityId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'SeverityId'"
                                                [SelectedValue]="SeverityId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'TicketSeverity'" [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Employee Group-->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'EmployeeGroupId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'EmployeeGroupId'"
                                                [SelectedValue]="EmployeeGroupId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'EmployeeGroup'" [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Owner-->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'OwnerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'OwnerId'"
                                                [SelectedValue]="OwnerId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'User'"
                                                [DependencyFilter2Value]="EmployeeGroupId"
                                                [HideAddLink]="true" [HideAdd]="true" [HideEdit]="true" [HideColumns]="true">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                </tr>

                                <tr style="height:35px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <!-- Additional Fields -->
                                <tr>
                                    <td colspan="3">
                                        <table>
                                            <tr style="height: 1px;">
                                                <td class="SectionTitle">Additional Fields</td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="FillParent">
                                                        <div class="LocationDirective" #Child></div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="3">
                                        <div> </div>
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <td style="width: 10px;">
                            <div></div>
                        </td>

                        <!-- Support Notes-->
                        <td *ngIf="SupportNotesVisibility" style="width:230px;min-height:65px;">
                            <table>
                                <tr class="FormFieldRow">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr style="height:65px;">
                                    <td>
                                        <div class="MediaFill" style="margin-top:3px;margin-left:3px; padding:3px; height:65px;min-height:65px;width:230px; background:#FFFADC;border :1px solid #83A5D2">
                                            <ScrollViewer>
                                                <label style="white-space: pre-line; word-wrap: break-word; text-wrap: normal;">{{SupportNotes}}</label>
                                            </ScrollViewer>
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                            </table>
                        </td>

                        <td style="width:120px;">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Create</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
