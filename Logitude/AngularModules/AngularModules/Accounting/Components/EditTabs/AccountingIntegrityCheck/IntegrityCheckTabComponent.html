<style>
    .excel  {    
        display: inline-block;
        vertical-align: middle;
        margin-right: 10px;
    }
</style>
<table>
    <tr>
        <td>
            <div class="TableHolder">
                <table>

                    <!-- Header -->
                    <tr class="TabTitleRow">
                        <td>
                            {{'General.O.General' | TextCodeTranslationPipe}}
                        </td>
                        <!-- <div *ngIf="ShowErrorMsg" style="position: absolute;width: 100%;text-align: center;left: 0;right: 0;">
                            <div class="DisbleBox" style="margin: 0 auto;">
                                {{GetErrorMsg()}}
                            </div>
                        </div> -->

                    </tr>

                    <!-- Fields -->
                    <tr>
                        <td >
                            <table>
                                <tr style="height: 50px;">

                                    <td style="width: 60px;padding: 0 10px; color:rgb(110, 113, 114)" [style.text-align]="isRTL ? 'right' : 'left'">{{'Accounting.General.O.Datefrom'  | TextCodeTranslationPipe}}</td>

                                    <td style="width: 100px; ">
                                        <LogDatePicker [ObjectFieldName]="'FromMonthInclusive'" [ObjectTableName]="ObjectTableName"
                                                       [NoObjectField]="true" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td style="width:15px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 30px; color:rgb(110, 113, 114)" [style.text-align]="isRTL ? 'right' : 'left'">
                                        {{'Accounting.General.O.To' | TextCodeTranslationPipe }}
                                    </td>

                                    <td style="width: 100px;">
                                        <LogDatePicker [ObjectFieldName]="'ToMonthInclusive'" [ObjectTableName]="ObjectTableName"
                                                       [NoObjectField]="true" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>
                                    <td style="width:15px;">
                                        <div></div>
                                    </td>
                                    <td style="width: 40px">
                                        <div *ngIf="ShouldFix">
                                            <button style="display: inline-block;width:100px;" class="Button" [disabled]="Fixing" (click)="RunService()"> {{'Accounting.General.O.Fix'  | TextCodeTranslationPipe}}</button>
                                        </div>
                                    </td>
                                    <td style="width: 10px"></td>

                                </tr>
                                <tr>
                                    <!-- ResultXML -->
                                    <td style="vertical-align:top;width: 130px;" [style.text-align]="isRTL ? 'right' : 'left'">
                                        <LogLabel [ObjectFieldName]="'ResultXML'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td colspan="7" style="vertical-align: top" [style.text-align]="isRTL ? 'right' : 'left'">
                                        <div style="width: 650px;">
                                            <LogTextBox [ObjectFieldName]="'ResultXML'" [InputType]="'nText'" [DataContext]="DataContext"
                                                        [RowsCount]="30" [ObjectTableName]="ObjectTableName" [IsMultiline]="true"
                                                        [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </td>

                                    <td style="width:15px;">
                                        <div></div>
                                    </td>
                                    <td style="width: 40px;vertical-align: top" [style.text-align]="isRTL ? 'right' : 'left'">
                                        <div>
                                            <button [disabled]="entityPM.StatusCode != '3'" style="display: inline-block;width:100px;" class="Button" (click)="ViewResultXMLButtonClicked()">View</button>
                                            <IconButton class="excel" [Name]="'Excel'" (click)="Export2ExcelClicked()" [disabled]="false"></IconButton>
                                        </div>
                                    </td>
                                    <td>
                                        <div></div>
                                    </td>

                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </div>
        </td>
    </tr>

</table>
