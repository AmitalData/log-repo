    .tab-footer {

    .CellStretched {

    .footer-title {

        /*text-align: center;*/

    .footer-summery::after {
        clear: both;
    }

    .footer-summery {
        padding-left: 150px;
    }

        <tr>
            <td colspan="5" style="height: 100%;padding-bottom: 80px;">
                <div class="GeneratedGridContainer">
                    <logitude-edit-grid GridWidth="100%"
                                    GridHeight="100%"
                                    [ItemSource]="DataContext.CalculatedChartsOfAccountsLineItemList"
                                    [HeaderHeight]="25"
                                    [UseVirtuallization]="true"
                                    [IsReadOnly]="false"
                                    (RowEnded)="OnRowEnded($event)"
                                    (Ondblclick)="OnFocus()">

                     <!--Line-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'100'" [header]="'CalculatedChartsOfAccountsLine.F.Line' | TextCodeTranslationPipe" [binding]="'Line'">
                        <ng-template let-item>
                        <log-cell-template [IgnoreMods]="true" [TabIndex]="-1" #logcelltemplate>
                            <div   [style.text-align]="isRTL ? 'right' : 'left'">
                                <span>{{item.Line}}</span>
                            </div>
                        </log-cell-template>
                    </ng-template>
                    </log-column>

                    
                <!--LineTypeCode-->
                  <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'100'" [header]="'CalculatedChartsOfAccountsLine.F.LineTypeCode' | TextCodeTranslationPipe" [binding]="'LineTypeCode'">
                    <ng-template let-item>
                      <log-cell-template   #logcelltemplate>
                        <div  *ngIf="logcelltemplate.IsDisplayMode"  [style.text-align]="isRTL ? 'right' : 'left'">
                            <span>{{item.LineTypetName}}</span>
                        </div>
                        <div *ngIf="logcelltemplate.IsEditMode">
                            <LogLov 
                                   [ObjectFieldName]="'LineTypeCode'"
                                   [ObjectTableName]="ObjectTableName"
                                   [DataContext]="DataContext"
                                   [LookUpTableName]="'CalculatedChartsLineType'"
                                   [HideColumns]="true">
                           </LogLov>
                        </div>
                      </log-cell-template>
                   </ng-template>
                </log-column>


                     <!--ChartOfAccount-->
                  <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'100'" [header]="'CalculatedChartsOfAccountsLine.F.ChartOfAccountId' | TextCodeTranslationPipe" [binding]="'ChartOfAccountId'">
                        <ng-template let-item>
                          <log-cell-template   #logcelltemplate>
                            <div  *ngIf="logcelltemplate.IsDisplayMode"  [style.text-align]="isRTL ? 'right' : 'left'">
                                <span>{{item.ChartOfAccountName}}</span>
                            </div>
                            <div *ngIf="logcelltemplate.IsEditMode">
                                <LogLov 
                                       [ObjectFieldName]="'ChartOfAccountId'"
                                       [ObjectTableName]="ObjectTableName"
                                       [DataContext]="DataContext"
                                       [LookUpTableName]="'ChartOfAccount'"
                                       [HideColumns]="true">
                               </LogLov>
                            </div>
                          </log-cell-template>
                       </ng-template>
                    </log-column>

                  <!--GLAccount-->
                  <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'100'" [header]="'CalculatedChartsOfAccountsLine.F.GLAccountId' | TextCodeTranslationPipe" [binding]="'GLAccountId'">
                    <ng-template let-item>
                      <log-cell-template   #logcelltemplate>
                        <div  *ngIf="logcelltemplate.IsDisplayMode"  [style.text-align]="isRTL ? 'right' : 'left'">
                            <span>{{item.GLAccountName}}</span>
                        </div>
                        <div *ngIf="logcelltemplate.IsEditMode">
                            <LogLov 
                                   [ObjectFieldName]="'GLAccountId'"
                                   [ObjectTableName]="ObjectTableName"
                                   [DataContext]="DataContext"
                                   [LookUpTableName]="'GLAccount'"
                                   [HideColumns]="true">
                           </LogLov>
                        </div>
                      </log-cell-template>
                   </ng-template>
                </log-column>

                    
                    <!--CreateDateTime-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'95'" [header]="'CalculatedChartsOfAccountsLine.F.CreateDateTime' | TextCodeTranslationPipe">
                        <ng-template let-item>
                        <log-cell-template   #logcelltemplate>
                            <div [style.text-align]="isRTL ? 'right' : 'left'"> {{item.CreateDateTime | DateTimeToDatePipe}} </div>
                        </log-cell-template>
                    </ng-template>
                    </log-column>


                       <!--CreatedByUserName-->
                   <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'80'"  [header]="'CalculatedChartsOfAccountsLine.F.CreatedByUserId' | TextCodeTranslationPipe">
                        <ng-template let-item>
                        <log-cell-template   #logcelltemplate>
                            <div [style.text-align]="isRTL ? 'right' : 'left'">
                                <span>{{item.CreatedByUserName}}</span>
                            </div>
                        </log-cell-template>
                    </ng-template>
                    </log-column>


                         <!--UpdatedDateTime-->
                         <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'95'" [header]="'CalculatedChartsOfAccountsLine.F.UpdatedDateTime' | TextCodeTranslationPipe">
                            <ng-template let-item>
                            <log-cell-template   #logcelltemplate>
                                <div [style.text-align]="isRTL ? 'right' : 'left'"> {{item.UpdatedDateTime | DateTimeToDatePipe}} </div>

                        </log-column>

                        
           
                    <!--UpdatedByUser-->

                        <ng-template let-item>

                            <div [style.text-align]="isRTL ? 'right' : 'left'">
                                <span>{{item.UpdatedByUserName}}</span>
                            </div>
                        </log-cell-template>
                    </ng-template>
                    </log-column>

               
                    <!--IsCancelled-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'95'" [header]="'CalculatedChartsOfAccountsLine.F.IsCancelled' | TextCodeTranslationPipe">
                        <ng-template let-item>
                        <log-cell-template   #logcelltemplate>
                            <div [style.text-align]="isRTL ? 'right' : 'left'"> 
                                <img *ngIf="item.IsCancelled" src="./Images/CheckBoxIcon.png" />    
                            </div>
                        </log-cell-template>
                    </ng-template>
                    </log-column>

                    <!--NULL-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'30'" [header]="' '" class="CellTools">
                        <ng-template let-item>
                        <log-cell-template   #logcelltemplate>
                            <div [style.text-align]="isRTL ? 'right' : 'left'" style="margin-top:4px;">
                                <IconButton [Name]="'Delete'" [IsSmall]="true" [Left]="3" (click)="RemoveLine(item)"></IconButton>
                            </div>
                        </log-cell-template>
                    </ng-template>
                    </log-column>

                </logitude-edit-grid>
