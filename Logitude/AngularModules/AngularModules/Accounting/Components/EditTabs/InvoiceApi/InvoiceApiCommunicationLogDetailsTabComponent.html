<div>
    <table>

        <tr style="height:10px">
            <td colspan="3">
                <div></div>
            </td>
        </tr>


        <tr style="height:20px">
            <td style="width:10px;">
                <div></div>
            </td>

            <td>
                <div style="height:23px;display: flex; justify-content: center; gap: 10px;" [ngStyle]="{'text-align': isRTL ? 'left' : 'right', 'float': isRTL ? 'right' : 'left'}"
                >

                    <IconButton [Name]="'Refresh'"
                        (click)="RefreshButtonClicked()"></IconButton>

                    <button 
                        style="width:45px" class="Button" (click)="ViewXMLClicked()"
                        [disabled]="!(EntityPM.Step > '4' || (EntityPM.Step === '4' && EntityPM.StatusCode === '4'))">
                        View
                    </button>
                </div>

            </td>

            <td style="width:10px;">
                <div></div>
            </td>
        </tr>

        <tr>
            <td style="width:10px;">
                <div></div>
            </td>
            <td style="position:relative;"></td>

            <td style="width:10px;">
                <div></div>
            </td>
        </tr>


        <tr>
            <td colspan="3">
                <!---->
                <div class="GridView" style="width:420px ; height: 500px;padding: 10px;">


                    <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                        <!--(RowDataLoaded)="OnRowLoaded($event)"-->
                        <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="InvoiceApiStepList">



                            <!-- StepNumber -->
                            <log-column [header]="'InvoiceApiCommunicationLog.F.Step' | TextCodeTranslationPipe"
                                [width]="'50'" [Alignment]="'right'" [binding]="'StepNumber'">
                                <ng-template let-item>
                                    <log-cell-template #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.Step}}</span>
                                        </div>
                                    </log-cell-template>
                                </ng-template>
                            </log-column>

                            <!-- StepName -->
                            <log-column [header]="'CommunicationLogSteps.O.Name' | TextCodeTranslationPipe"
                                [binding]="'Name'" [width]="'150'" [Alignment]="'right'">
                                <ng-template let-item>
                                    <log-cell-template #logcelltemplate>
                                        <div>
                                            <span class="RightCenter">{{ isRTL ? item.LocalName : item.Name }}</span>
                                        </div>
                                    </log-cell-template>
                                </ng-template>
                            </log-column>

                            <!-- Status -->
                            <log-column [header]="'InvoiceApiCommunicationLog.F.StatusCode' | TextCodeTranslationPipe"
                                [width]="'70'" [Alignment]="'center'" [binding]="'Status'">
                                <ng-template let-item>
                                    <log-cell-template #logcelltemplate>
                                        <div class="RightCenter">
                                            <span class="RightCenter">{{item.Status }}</span>
                                        </div>
                                    </log-cell-template>
                                </ng-template>
                            </log-column>





                            <!-- Buttons -->
                            <log-column [width]="'80'" [visibility]="'visible'" [Alignment]="'center'">
                                <ng-template let-item>
                                    <log-cell-template>
                                        <div style="display: flex; justify-content: center; gap: 10px;">

                                            <button style="width:70px" class="Button" (click)="ResendClicked()"
                                                [disabled]="!item.AllowedResend">
                                                Reanalyze 
                                            </button>
                                        </div>
                                    </log-cell-template>
                                </ng-template>
                            </log-column>




                        </logitude-edit-grid>
                    </div>



                </div>
            </td>
        </tr>

    </table>
</div>
