


<div class="TableHolder">
    <table>
        <tr class="TabTitleRow">
            <td>{{ 'BankCode.TH.General' | TextCodeTranslationPipe}} </td>
        </tr>

        <tr>
            <td style="width:330px">
                <table>

                    <tr class="FormFieldRow" style="height:32px">
                        <td style="width:120px">
                            <LogLabel [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'Code'" [InputType]="'text'" [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                        <td><div></div></td>
                    </tr>



                    <tr class="FormFieldRow">
                        <td>
                            <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td>
                            <LogTextBox [ObjectFieldName]="'LocalName'" [InputType]="'ntext'" [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                        <td><div></div></td>
                    </tr>


                    <tr class="FormFieldRow">
                        <td>
                            <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td>
                            <LogTextBox [ObjectFieldName]="'EnglishName'" [InputType]="'text'" [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                        <td><div></div></td>
                    </tr>
                    <tr class="FormFieldRow">
                        <td>
                            <LogLabel [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td>
                            <LogCheckBox [ObjectFieldName]="'Inactive'" [Checked]="Inactive" [ObjectTableName]="ObjectTableName" [DataContext]="this" (ValueChanged)="InactiveChecked($event)"></LogCheckBox>

                        </td>
                        <td><div></div></td>
                    </tr>
                    <tr></tr>
                </table>

            </td>

         <td style="width:50px"></td>

            <td>
                <table>
                    <!-- Logo -->
                    <tr class="FormFieldRow">
                        <td style="width:70px; vertical-align:top">
                            <LogLabel [ObjectFieldName]="'LogoId'" [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="vertical-align:top">
                            <div style="width:100px;height:100px">
                                <ImageComponent [WidthImage]="'95px'" [HeightImage]="'95px'" [ImageId]="ImageId" [EntityId]="EntityId" [EntityName]="ObjectTableName" (UploadCompleted)="ImageUploadedCompleted($event)" style="height:72px;width:72px"> </ImageComponent>
                            </div>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>

            </td>
            <td></td>
        </tr>

    

        <tr></tr>



    </table>

    </div>
