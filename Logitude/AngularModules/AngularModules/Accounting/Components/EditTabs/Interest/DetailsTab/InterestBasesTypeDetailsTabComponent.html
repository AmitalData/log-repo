<style type="text/css">
    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }
</style>
<div class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>{{'Accounting.General.O.Details' | TextCodeTranslationPipe}}</td>
        </tr>
        <tr style="height: 1px;vertical-align:top">
            <td>
                <table>
                    <tr>
                        <td style="width: 700px;">
                            <table>
                                <tr>
                                    <td>
                                        <table>
                                            <!-- Code -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 160px;">
                                                    <LogLabel [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td>
                                                    <LogTextBox [Text]="Code" [ObjectFieldName]="'Code'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                            <!-- EnglishName -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 160px;">
                                                    <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td>
                                                    <LogTextBox [Text]="EnglishName" [ObjectFieldName]="'EnglishName'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                            <!-- LocalName -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 160px;">
                                                    <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td>
                                                    <LogTextBox [Text]="LocalName" [ObjectFieldName]="'LocalName'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td>
                                        <table>
                                            <!-- Description -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 160px;">
                                                    <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td>
                                                    <LogTextBox [Text]="Description" [ObjectFieldName]="'Description'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [IsMultiline]="true" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                            <tr><td></td></tr>
                                        </table>
                                    </td>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                                <tr>
                                    <td></td>
                                </tr>
                            </table>
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td style="width: 100px;">
                            {{'InterestBasesPeriod' | TextCodeTranslationPipe}}
                        </td>
                        <td>
                            <div></div>
                        </td>
                        <td>
                            <IconButton [Name]="'Add'" [IsSmall]="true" [Left]="3" [disabled]="EntityPM.InActive" (click)="AddPeriodClicked()"></IconButton>
                         </td>
                    </tr>
                </table>
            </td>

        </tr>
        <tr>
            <td>
                <logitude-edit-grid GridWidth="100%" [HeaderHeight]="25" GridHeight="100%" [ItemSource]="InterestBasesPeriodsList">

                    <!--InterestBaseStartDate-->
                    <log-column [width]="'300'" [header]="'InterestBaseStartDate'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="float:left;"> {{item.InterestBaseStartDate | DateTimeToDatePipe}} </div>
                        </log-cell-template>
                    </log-column>

                    <!--InterestRate-->
                    <log-column [width]="'300'" [header]="'InterestRate'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="float:left;"> {{item.InterestRate}} </div>
                        </log-cell-template>
                    </log-column>

                    <!--UpdatedByUserId-->
                    <log-column [width]="'300'" [header]="'UpdatedByUserId'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="float:left;"> {{item.UpdatedByUserId}} </div>
                        </log-cell-template>
                    </log-column>

                    <!--UpdateDate-->
                    <log-column [width]="'300'" [header]="'UpdateDate'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="float:left;"> {{item.UpdateDate | DateTimeToDatePipe}} </div>
                        </log-cell-template>
                    </log-column>

                    <!--NULL-->
                    <log-column [width]="'300'" [header]="' '" class="CellTools">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="margin-top:4px;">
                                <IconButton [Name]="'Edit'" [IsSmall]="true" [Left]="3" [disabled]="EntityPM.InActive" (click)="EditPeriodClicked(item)"></IconButton>
                            </div>
                        </log-cell-template>
                    </log-column>

                </logitude-edit-grid>
            </td>
        </tr>
        <tr>
            <td>
                <div></div>
            </td>
        </tr>
    </table>
</div>
