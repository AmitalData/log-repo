                <logitude-edit-grid GridWidth="100%" [HeaderHeight]="25" GridHeight="100%" [ItemSource]="InterestBasesPeriodsList">

                    <!--InterestBaseStartDate-->
                    <log-column [width]="'120'" [header]="InterestBaseStartDateHeader">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="float:left;"> {{item.InterestBaseStartDate | DateTimeToDatePipe}} </div>

                    <log-column [width]="'120'" [header]="InterestRateHeader">

                        </log-cell-template>

                        <log-cell-template template="let item" #logcelltemplate>

                        </log-cell-template>

                            <div style="margin-top:4px;">
