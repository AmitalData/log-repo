<style>
    .subTitle{
        color: #1b90cb;
        font-size: 16px;
    }
</style>
<table>
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr class="TabTitleRow">
                        <td>{{'CashBook.TH.General' | TextCodeTranslationPipe}} </td>
                    </tr>

                    <tr style="height: 15px;"><td><div style="width: 15px;"></div></td></tr>

                    <tr>
                        <td style="width: 400px">
                            <table>
                                <tr class="FormFieldRow">
                                    <td>
                                        <table>
                                            <!-- CashBookTypeCode -->
                                            <tr class="FormFieldRow">
                                                <td>
                                                    <LogLabel [ObjectFieldName]="'CashBookTypeCode'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td  [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                                    <LogLov [ObjectFieldName]="'CashBookTypeCode'"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'CashBookType'"
                                                            [HideColumns]="true">
                                                    </LogLov>
                                                </td>
                                                <td><div></div></td>
                                            </tr>

                                            <!-- EnglishName -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 180px;">
                                                    <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width: 200px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                                    <LogTextBox [ObjectFieldName]="'EnglishName'" [InputType]="'text'" [DataContext]="DataContext"
                                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                                </td>
                                                <td><div></div></td>
                                            </tr>


                                            <!-- LocalName -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 180px;">
                                                    <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width: 200px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                                    <LogTextBox [ObjectFieldName]="'LocalName'" [InputType]="'ntext'" [DataContext]="DataContext"
                                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                                </td>
                                                <td><div></div></td>
                                            </tr>


                                            <!-- CurrencyId -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 180px;">
                                                        <LogLabel [ObjectFieldName]="'CurrencyId'" [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width: 200px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                                    <LogLov [ObjectFieldName]="'CurrencyId'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [SelectedValue]="CurrencyId"
                                                        [LookUpTableName]="'Currency'"
                                                        [HideColumns]="true">
                                                    </LogLov>
                                                </td>
                                                <td><div></div></td>
                                            </tr>

                                            <!-- AccountNumber -->
                                            <tr class="FormFieldRow">
                                                <td style="width: 180px;">
                                                    <LogLabel [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width: 200px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                                    <LogTextBox [ObjectFieldName]="'AccountNumber'" [InputType]="'text'" [DataContext]="DataContext"
                                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                                </td>
                                                <td><div></div></td>
                                            </tr>


                                            <tr><td><div></div></td></tr>
                                        </table>

                                    </td>
                                </tr>
                            </table>
                        </td>
                        <td><div></div></td>
                    </tr>

                </table>
            </div>
        </td>
    </tr>
</table>
