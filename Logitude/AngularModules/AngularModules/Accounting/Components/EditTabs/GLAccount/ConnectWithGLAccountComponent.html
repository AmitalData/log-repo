


<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"  [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
    <tr style="height:20px"></tr>
    <tr>
        <td style="width:30px"></td>
        <td>
            <table>

                <tr style="height:80px; ">

                    <td>
                        <table>


                            <tr style="height:35px">

                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'GLAccountId'"   [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:200px;">
                                    <LogLov 
                                    [ObjectFieldName]="'GLAccountId'"
                                    [SelectedValue]="GLAccountId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'GLAccount'" 
                                    [QueryFilterItems]="GLAccountCurrencyFilterItems"
                                    (SelectedItemChanged)="selectedGLAccount = $event"
                                    [HideLastColumn]="true"
                                    [StartSearchFromChar]="3"
                                    [StartSearchFromNumber]="6"
                                    >
                                    </LogLov>
                                </td>

                                <td style="width:50px"><div></div></td>
                            </tr>
 
                            <tr></tr>
                        </table>
                    </td>
                </tr>

                <tr></tr>

                <tr style="height: 32px;">
                    <td colspan="4" style="vertical-align: bottom">

                        <table style="height: 22px;">
                            <tr>
                                <td>
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>


</table>
