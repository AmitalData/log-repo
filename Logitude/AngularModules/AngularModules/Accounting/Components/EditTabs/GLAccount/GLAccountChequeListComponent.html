

<table>
    <tr>
        <td>
            <div class="TableHolder">
              
                <table>


                    <td style="width:85px; padding-right: 15px;" colspan="6">
                        <div style="color: #3b95d5;font-size:16px">{{'ARPaymentCheque.O.Cheques'  | TextCodeTranslationPipe}} ({{DataSource.rowCount}})</div>
                    </td>

                    <!-- Transactions Grid -->
                    <tr>
                        <td colspan="5" style="height: 100%; padding-bottom: 87px;">
                            <div class="GeneratedGridContainer">
                                <logitude-grid-v2 *ngIf="UsingLogGridV2" GridWidth="100%" GridHeight="100%" [ObjectTable]="ObjectTableName"
                                                  [dataSource]="DataSource" [MenuHeaderchangeevent]="MenuHeaderchangeevent" [columns]="columns"
                                                  [autoLoad]="true" [QueryChangeEvent]="onQueryChangeEvent"
                                                  [IsCustomTemplate]="true">
                                </logitude-grid-v2>

                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td style="width: 80px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>

                    </tr>
                </table>
            </div>
        </td>
    </tr>

</table>
