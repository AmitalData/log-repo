
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4"> 
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr *ngIf="WarningErrorsList != null && WarningErrorsList.length > 0" style="height:1px;">
        <td>
            <WarningSummary [ItemsSource]="WarningErrorsList"></WarningSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table *ngIf="IsResourcesReady">
                <tr class="FormFieldRow">

                    <td style="width:80px;vertical-align:top;height:40px">
                        <LogLabel [ObjectFieldName]="'Reference1'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>


                    <td style="width:260px;height:40px">
                        <LogTextBox [ObjectFieldName]="'Reference1'" [DataContext]="DataContext"
                                    [ObjectTableName]="ObjectTableName"></LogTextBox>
                    </td>
                    <td style="height:10px"></td>
                </tr>

                <tr class="FormFieldRow">

                    <td style="width:80px;vertical-align:top;height:40px">
                        <LogLabel [ObjectFieldName]="'Reference2'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>


                    <td style="width:260px;height:40px">
                        <LogTextBox [ObjectFieldName]="'Reference2'" [DataContext]="DataContext"
                                    [ObjectTableName]="ObjectTableName"></LogTextBox>
                    </td>
                    <td style="height:10px"></td>
                </tr>

                <tr class="FormFieldRow">

                    <td style="width:80px;vertical-align:top;height:40px">
                        <LogLabel [ObjectFieldName]="'Reference3'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>


                    <td style="width: 260px;height:40px">
                        <LogTextBox [ObjectFieldName]="'Reference3'" [DataContext]="DataContext"
                                    [ObjectTableName]="ObjectTableName"></LogTextBox>
                    </td>
                    <td style="height:10px"></td>
                </tr>

                <tr class="FormFieldRow"></tr>

                <tr class="FormFieldRow">

                    <td style="width:80px;vertical-align:top;height:60px">
                        <LogLabel [Text]="'Journal.M.Note' | TextCodeTranslationPipe" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>


                    <td style="width: 140px;height:100px" colspan="2">
                        <LogTextBox [ObjectFieldName]="'Notes'" [InputType]="'ntext'" [DataContext]="DataContext"
                                    [ObjectTableName]="ObjectTableName" [IsMultiline]="true"></LogTextBox>
                    </td>

                    <td style="height:10px"></td>

                </tr>
                <tr><td></td></tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
