<style type="text/css">
    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }
</style>
<div class="TabHolder">
    <table>
        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="4">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
            </td>
        </tr>
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td>
                            <div>
                                <IconButton [style.float]="isRTL ? 'right' : 'left'" [Name]="'Add'" [IsSmall]="true"
                                    [Left]="3" (click)="AddLine()"></IconButton>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>
                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ChequeCounterSerials"
                    [HeaderHeight]="25" [UseVirtuallization]="true" [IsReadOnly]="false"
                    (RowEnded)="OnRowEnded($event)">

                    <!--SeriesId-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'100'" [header]="SeriesIdHeader"
                        [binding]="'SeriesId'">
                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate [IsEnabled]="item.SeriesId>=currentSeriesId">
                                <div [style.text-align]="isRTL ? 'right' : 'left'">
                                    <span>{{item.SeriesId}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!--ChequeCounterBegin-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'95'"
                        [header]="ChequeCounterBeginHeader" [binding]="'ChequeCounterBegin'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="item.SeriesId>=currentSeriesId">
                                <div *ngIf="logcelltemplate.IsDisplayMode"
                                    [style.text-align]="isRTL ? 'right' : 'left'">
                                    <span>{{item.ChequeCounterBegin}}</span>
                                </div>
                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogTextBox [ObjectFieldName]="'ChequeCounterBegin'" [InputType]="'integer'"
                                        [DataContext]="item" [ObjectTableName]="'ChequeCounterSerial'"
                                        [HideColumns]="true"></LogTextBox>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!--ChequeCounterEnd-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'95'" [header]="ChequeCounterEndHeader"
                        [binding]="'ChequeCounterEnd'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="item.SeriesId>=currentSeriesId">
                                <div *ngIf="logcelltemplate.IsDisplayMode"
                                    [style.text-align]="isRTL ? 'right' : 'left'">
                                    <span> {{item.ChequeCounterEnd}} </span>
                                </div>

                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogTextBox [ObjectFieldName]="'ChequeCounterEnd'" [InputType]="'integer'"
                                        [DataContext]="item" [ObjectTableName]="'ChequeCounterSerial'"
                                        [HideColumns]="true"></LogTextBox>
                                </div>

                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <!--NULL-->
                    <log-column [Alignment]="isRTL ? 'right' : 'left'" [width]="'30'" [header]="' '" class="CellTools">
                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" [IsEnabled]="item.SeriesId>=currentSeriesId" #logcelltemplate>
                                <div [style.text-align]="isRTL ? 'right' : 'left'" style="margin-top:4px;">
                                    <IconButton [Name]="'Delete'" [IsSmall]="true" [Left]="3"
                                        (click)="RemoveLine(item)" [disabled]="item.SeriesId<currentSeriesId"></IconButton>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                </logitude-edit-grid>
            </td>
        </tr>
        <tr style="height: 32px;">
            <td colspan="4" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' |
                                TextCodeTranslationPipe}}</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button id="{{'CREATEINTERESTBASES' | IdGeneratorAsyncPipe | async}}" class="RedButton"
                                (click)="OkButtonClicked()">{{'Accounting.General.B.OK' |
                                TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
