<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }
</style>
<table>
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr class="TabTitleRow">
                        <td>{{'TaxDeductionReport.TH.Log' | TextCodeTranslationPipe}} </td>
                    </tr>

                    <tr style="height: 15px;"><td><div style="width: 15px;"></div></td></tr>

                    <tr>
                        <td>
                            <table>
                                <tr class="FormFieldRow">
                                    <td>
                                        <table>
                                            <!-- IsAdditionalReportExist -->
                                            <tr class="FormFieldRow">
                                                <td style="vertical-align:top;width: 150px;" [style.text-align]="isRTL ? 'right' : 'left'">
                                                    <LogLabel [ObjectFieldName]="'IsAdditionalReportExist'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td [style.text-align]="isRTL ? 'right' : 'left'" style="vertical-align:top;width:150px;">
                                                    <LogCheckBox [ObjectFieldName]="'IsAdditionalReportExist'" [Checked]="IsAdditionalReportExist" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>

                                                </td>
                                                <td></td>

                                            </tr>

                                            <!-- Email -->
                                            <tr class="FormFieldRow">
                                                <td style="vertical-align:top;width: 150px;" [style.text-align]="isRTL ? 'right' : 'left'">
                                                    <LogLabel [ObjectFieldName]="'Email'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td [style.text-align]="isRTL ? 'right' : 'left'" style="width:200px;">
                                                    <LogTextBox [ObjectFieldName]="'Email'" [InputType]="'Text'" [DataContext]="DataContext"
                                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                                </td>
                                                <td></td>
                                            </tr>

                                            <!-- Month -->
                                            <tr class="FormFieldRow">
                                                <td style="vertical-align:top;width: 150px;" [style.text-align]="isRTL ? 'right' : 'left'">
                                                    <LogLabel [ObjectFieldName]="'Month'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td [style.text-align]="isRTL ? 'right' : 'left'" style="width:200px;" *ngIf="entityPM.ByMonth">
                                                    {{entityPM.Month | DateTimePipe:'MY'}}
                                                </td>
                                                <td [style.text-align]="isRTL ? 'right' : 'left'" style="width:200px;" *ngIf="!entityPM.ByMonth">
                                                  All Months
                                                </td>
                                                <td></td>
                                            </tr>
                                            <tr class="FormFieldRow">


                                                <td *ngIf="Faild" [style.text-align]="isRTL ? 'right' : 'left'">
                                                    <button style="display: inline-block;width:100px;" class="Button" [disabled]="Building" (click)="RunService()">{{'Accounting.O.Rebuild' | TextCodeTranslationPipe}}</button>
                                                </td>
                                                <td></td>
                                            </tr>

                                            <tr><td><div></div></td></tr>
                                        </table>

                                    </td>
                                </tr>
                         

                        
                                
                            </table>
                        </td>
                    </tr>

                </table>
            </div>
        </td>
    </tr>
</table>
