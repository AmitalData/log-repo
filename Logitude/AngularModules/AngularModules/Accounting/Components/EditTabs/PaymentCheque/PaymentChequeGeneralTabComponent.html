                                                    <tr>

                                                            <LogLabel [ObjectFieldName]="'LocalAmount'" [ObjectTableName]="ObjectTableName"

                    <tr style="height:70%">
                        <td colspan="3">
                            <table>
                                <tr>
                                    <td style="width: 25px;height: 20px;padding: 5px;padding-bottom: 3px;">
                                        <div><IconButton [IsSmall]="true" [Name]="'Add'" (click)="Add()" [IsEnabled]="AddLineEnabled" style="float:left;"></IconButton></div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="CellContent" style="">
                                            <logitude-edit-grid GridWidth="100%"
                                                                GridHeight="100%"
                                                                [IsReadOnly]="!AddLineEnabled"
                                                                [ItemSource]="Lines">

                                                <log-column [header]="'#'" [width]="'30'" [Editable]="false" [Alignment]="'right'">

                                                    <log-cell-template template="let item" #logcelltemplate>
                                                        <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:right">
                                                            <span>{{item.SequenceNumeric}}</span>
                                                        </div>

                                                    </log-cell-template>
                                                </log-column>


                                                <log-column [header]="'PaymentChequeLine.F.Notes' | TextCodeTranslationPipe" [width]="'110'" [Editable]="true" [Alignment]="'center'">

                                                    <log-cell-template template="let item" #logcelltemplate>
                                                        <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:right">
                                                            <span>{{item.Note}}</span>
                                                        </div>
                                                        <div *ngIf="logcelltemplate.IsEditMode">
                                                            <LogTextBox [ObjectFieldName]="'Note'" [DataContext]="item" [FocusOnMe]="true" [InputType]="'ntext'"
                                                                        [Text]="item.Note" [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>



                                                        </div>
                                                    </log-cell-template>
                                                </log-column>




                                                <log-column [header]="AmountHeader" [binding]="'Amount'" [width]="'110'" [Editable]="true" [Alignment]="'center'">

                                                    <log-cell-template template="let item" #logcelltemplate>
                                                        <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode" style="text-align:right">
                                                            <span>{{item.Amount | NumbersPipe:'N2'}}</span>
                                                        </div>
                                                        <div *ngIf="logcelltemplate.IsEditMode">
                                                            <LogTextBox [ObjectFieldName]="'Amount'" [DataContext]="item" [FocusOnMe]="true" [InputType]="'double'"
                                                                        [Text]="item.Amount" [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>



                                                        </div>
                                                    </log-cell-template>
                                                </log-column>

                                                <log-column [width]="'22'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                                    <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                                        <div style="width: 18px; float: left; height:20px; padding-top: 2px;">
                                                            <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="item.DeleteButtonClicked()" [IsEnabled]="AddLineEnabled"></IconButton>
                                                        </div>



                                                    </log-cell-template>
                                                </log-column>


                                            </logitude-edit-grid>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                        </td>


                    </tr>

</table>
