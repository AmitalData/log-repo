<style>

    .NoRows{
        text-align: center;
        color: #a0a0a0;
        font-size: 15px;
        font-style: italic;
        font-family: verdana;
        vertical-align: middle;
        position: relative;
        height: 100px;
    }
    .tab-footer {
        background: #f7f7f7;
        height: 85px;
        border-radius: 7px;
        border-bottom-left-radius: unset;
        margin-right: -1px;
        padding: 7px 10px;
        -webkit-box-shadow: 0px -3px 4px -1px rgba(0,0,0,0.31);
        -moz-box-shadow: 0px -3px 4px -1px rgba(0,0,0,0.31);
        box-shadow: 0px -3px 4px -1px rgba(0,0,0,0.31);
    }

    .SimpleGridHeaderRow td, .CellStretched {
        text-overflow: ellipsis;
        overflow: hidden;
    }



    .Disabled {
        background: #d80070;
        opacity: 0.5;
    }

    .footer-title {
        color: #1692ef;
        font-size: 15px;
    }

    .footer-cell {
        float: left;
        padding: 5px;
        margin: 0px 10px;
        width: 150px;
        text-align: center;
        overflow: auto;
    }

    .footer-summery::before, .footer-summery::after {
        clear: both;
    }

    .footer-summery {
        padding-left: 150px;
    }

    .border-left {
        border-left: 1px solid #dadada;
    }

    .SimpleGridHeaderRow td, .CellStretched {
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .red {
        color: #d60000 !important;
    }
    .CellStretched{
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 0px 5px !important;
    }
    .SimpleGridViewRow:hover{
        background: #efefef !important;
    }
</style>
