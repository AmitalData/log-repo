<table style="height: 24px">
    <tr>
        <td>
            <div class="ShortTitleMainControl" [style.float]="isRTL ? 'right' : 'left'">
                <div class="ShortTitleDiv" *ngIf="(EntityPM.AccountTypeCode=='3' || EntityPM.AccountTypeCode=='2') && IsConnectedCard && isRTL " style="padding-left: 5px; font-size: 18px; color: #333333;font-family: Arial;">
                    <a href="#" style="font-size:12px" (click)="OpenCardScreen()">{{'Accounting.General.O.MoreData'| TextCodeTranslationPipe}}</a>
                </div>
                <div class="ShortTitleDiv" style="padding-left: 5px; font-size: 18px; color: #333333;font-family: Arial;">
                    {{EntityPM.LocalName}}
                </div>
                <div class="ShortTitleDiv" *ngIf="(EntityPM.AccountTypeCode=='3'|| EntityPM.AccountTypeCode=='2') && IsConnectedCard && !isRTL" style="padding-left: 5px; font-size: 18px; color: #333333;font-family: Arial;">
                    <a href="#" style="font-size:12px" (click)="OpenCardScreen()">{{'Accounting.General.O.MoreData'| TextCodeTranslationPipe}}</a>
                </div>
            </div>

            <!-- Cancelled -->
            <div *ngIf="EntityPM.Inactive" class="ShortTitleControl" float-start style="padding: 0px 5px;background: #e66464;"><span style="color: white;"> {{'Accounting.O.Inactive' | TextCodeTranslationPipe}}</span></div>
        </td>
    </tr>
</table>
