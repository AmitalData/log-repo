


<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>




            <div style="padding-top: 5px;">
                <table class="FixedTable">

                    <tr class="FormFieldRow">
                        <td>
                            <table class="acc-table">



                                <!-- ChartOfAccounts -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ChartOfAccountsId'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'ChartOfAccountsId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'ChartOfAccount'"
                                                [SelectedValue]="ChartOfAccountsId"
                                                [DependencyFilter1Value]="null"
                                                [DependencyFilter2Value]="MyChartOfAccountsTypeCode"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>
                                    <td><div></div></td>
                                </tr>


                            </table>
                        </td>

                        <td style="width: 20px;"><div></div></td>


                    </tr>

                    <tr>
                        <td>
                            <div></div>
                        </td>
                    </tr>

                </table>
            </div>


        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>


</table>
