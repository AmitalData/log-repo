
<style>
    .select {
        display: block;
        outline: none;
        width: 100%;
        height: 22px;
        border: 1px solid #6A8299;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        position: relative;
        cursor: pointer;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
    }

    .SelectDisabled {
        display: block;
        height: 22px;
        max-height: 22px;
        line-height: 22px;
        outline: none;
        width: 100%;
        background: white;
        /*border: 1px solid #AAAAAA;*/
        font-size: 11px;
        color: #45494A;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        opacity: 0.5;
        pointer-events: none;
    }
</style>


<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">
                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Revenues: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="RevenuesSelectedChange($event)" 
                        [SelectedItem]="RevenuesSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Expenses: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="ExpensesSelectedChange($event)" 
                        [SelectedItem]="ExpensesSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Customers: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="CustomersSelectedChange($event)" 
                        [SelectedItem]="CustomersSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Vendors: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="VendorsSelectedChange($event)" 
                        [SelectedItem]="VendorsSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Banks: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="BanksSelectedChange($event)" 
                        [SelectedItem]="BanksSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Works: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="WorksSelectedChange($event)" 
                        [SelectedItem]="WorksSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width: 150px;">
                        <label> Debtors And Creditors: </label>
                    </td>
                    <td style="width:100px">
                        <ComboBox style="width:100px;" [ItemsSource]="ChartOfAccountsTypesOrders" (SelectedItemChanged)="DebtorsAndCreditorsSelectedChange($event)" 
                        [SelectedItem]="DebtorsAndCreditorsSelectedItem"
                        ></ComboBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>
                
                <tr>
                    <td colspan="3">
                        <div> </div>
                    </td>
                </tr>

            </table>
        </td>

    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
