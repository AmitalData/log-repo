<style type="text/css">
    progress {
        text-align: center;
        height: 1.5em;
        width: 100%;
        -webkit-appearance: none;
        border: none;

        /* Set the progressbar to relative */
        position: relative;
    }

    progress:before {
        content: attr(data-label);
        font-size: 0.8em;
        vertical-align: 0;

        /*Position text over the progress bar */
        position: absolute;
        left: 0;
        right: 0;
    }

    progress::-webkit-progress-bar {
        background-color: #c9c9c9;
    }

    progress::-webkit-progress-value {
        background-color: #7cc4ff;
    }

    progress::-moz-progress-bar {
        background-color: #7cc4ff;
    }

    .RowsValidationErrorsList {
        border: 1px solid #DA6F6F;
        border-radius: 5px;
        background: rgba(247, 227, 227, 1);
        direction: LTR;
        padding: 5PX;
    }

    .RowsValidationErrorsList li:before {
        background: url(./Images/ValidationError.png);
        display: inline-block;
        width: 15px;
        height: 15px;
        content: "";
        vertical-align: MIDDLE;
        position: ABSOLUTE;
    }

    .RowsValidationErrorsList li .content {
        white-space: normal;
        width: 100%;
        height: auto;
        word-wrap: break-word;
        vertical-align: MIDDLE;
        padding-left: 23PX;
    }
    .success {
        direction:ltr;
    }
</style>
<div *ngIf="ShowSuccessRow" class="success GreenInfo">{{SuccessRow}}</div>
<div *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
    <table>
        <tr style="height:1px;">
            <td>
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>
    </table>
</div>
<div class="RowsValidationErrorsList" *ngIf="RowsValidationErrorsList != null && RowsValidationErrorsList.length > 0">
    <ul>
        <li *ngFor="let item of RowsValidationErrorsList">
            <div class="content">{{item}}</div>
        </li>
    </ul>
</div>
<table style="height: 150px;">

    <tr class="FormFieldRow">
        <td style="width:45px;">
            <LogLabel [NoObjectField]="true" [Text]="'קובץ'" [DataContext]="DataContext"></LogLabel>
        </td>
        <td style="width:60px;text-align:left">
            <button [disabled]="!UploadButtonIsEnabled" style="width:55px;" class="Button"
                (click)="OpenUpLoadFile()">Upload</button>
            <input accept=".csv,.CSV" [attr.id]="UploadFileId" type="file" [(ngModel)]="FileData"
                (change)="UploadFile($event)" style="display:none;width:65px" class="upload" />
        </td>
        <td style="width:100px; background-color:white">
            <div *ngIf="IsShowProgressBar" style="height:20px;border:1px solid gray;border-radius:3px">
                <progress id="myBar" max="100" value="20" data-label="20%"></progress>
            </div>
        </td>
    </tr>
</table>
<div style="float:left;">
    <table>
        <tr>
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td style="width: 57px;">
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>
                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">סגור</button>
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>
                        <td style="width: 57px;">
                            <button [disabled]="UploadButtonIsEnabled" class="RedButton"
                                (click)="OkButtonClicked()">אישור</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
