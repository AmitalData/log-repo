       <IconButton [IsSmall]="true" [style.float]="isRTL ? 'left' : 'right'" [Name]="'Edit'"
           (click)="OpenAccountingNote(null)"></IconButton>
  
 
        <img *ngIf="!isNotesLoading &&  accountingNotesList.length == 0"

             [Head]="'APInvoiceLine.F.Notes' | TextCodeTranslationPipe" 
             
              [Body]=""
             >
        </CellTooltip> 
   


</div>
