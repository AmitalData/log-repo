

<!-- InvoiceSeries -->
<div [style.text-align]="isRTL ? 'right' : 'left'" class="TextTrimming"
    *ngIf="fieldName == 'InvoiceSeries'">
    {{ rowData[fieldName]}}
</div>


<!-- InvoiceNumberPart -->
<div class="TextTrimming" *ngIf="fieldName == 'InvoiceNumberPart'"
    style="text-align: left; padding: 0px 2px;direction: ltr;">
    {{  rowData[fieldName] }}
</div>

<!-- InvoiceDate -->
<div class="TextTrimming" *ngIf="fieldName == 'InvoiceDate'"
    [style.text-align]="isRTL ? 'right' : 'left'" >
    {{ rowData[fieldName] | DateTimePipe:'SD' }}
</div>

<!-- InvoiceNumber -->
<div class="TextTrimming" *ngIf="fieldName == 'InvoiceNumber'"
    style="text-align: left; padding: 0px 2px;direction: ltr;">
    {{  rowData[fieldName] }}
</div>


<!-- InvoiceNumberPart -->
<div class="TextTrimming" *ngIf="fieldName == 'SequenceStatus'"
    style="text-align: left; padding: 0px 2px;direction: ltr;">
    {{  rowData[fieldName] }}
</div>
