 <style>
        .WarningSummary span {
        text-align: left;
        width: calc(100% - 25px);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .WarningSummary .ValidationItem {
        display: block;
        float: left;
        width: 50%;
        height: 18px;
        line-height: 20px;
        position: relative;
    }

    .WarningSummary ul {
        max-height: 80px;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
    }

    .WarningSummary {
        height: 100%;
        width: 100%;
        border: 1px solid Orange;
        border-radius: 5px;
        background: #FFFBDA;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        overflow: hidden;
    }
 </style>
<div  class="TabHolder">
    <table style="margin-top: 20px;">
        <tr>
            <td >
                <table>
                    <tr *ngIf="InvoicesAndReportsNotPrinted != null && InvoicesAndReportsNotPrinted.length > 0" style="height:1px;">
                        <td>
                            <table style="min-height: 25px;">
                                <tr>
                                    <td>
                                        <div style="height: 150px;" class="WarningSummary">
                                            <table>
                                                <tr>
                                                    <td *ngIf="!HideHeader" style="width: 120px; vertical-align: top; text-align: left; padding-left: 8px; padding-top: 4px; color: #D8770E; font-size: 12px;">
                                                        {{ErrorsCount}} Warnings Found:
                                                    </td>
                        
                                                    <td style="position: relative; vertical-align:top; padding-top: 2px;">
                                                        <ul style="height: 100%;max-height: 100%;overflow: hidden;">
                                                            <li [style.height]="InvoicesAndReportsNotPrinted.length > 1? '75px': '150px'" class="ValidationItem" [ngStyle]="{width: ItemWidth}" *ngFor="let item of InvoicesAndReportsNotPrinted">
                                                                <img style="margin: 0px 3px;" class="LeftCenter" src="./Images/WarningIcon.png" />
                                                              <span  class="LeftCenter" style="margin-left: 20px;white-space:normal;overflow-y: auto;">{{item}}</span>  
                                                            </li>
                                                        </ul>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                        
                                <tr style="height: 5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
 
            </td>
 
        </tr>
        <tr style="height: 32px;">
            <td colspan="2" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>
        
                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>
        
                        <td style="width: 5px;">
                            <div></div>
                        </td>
        
                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked(OpenBalance)">{{'ARInvoice.B.Print' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr style="height: 10px;"><td><div></div></td></tr>

</table>
</div>
