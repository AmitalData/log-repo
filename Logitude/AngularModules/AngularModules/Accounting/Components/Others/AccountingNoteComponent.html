<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td>
                        <div class="MediaFill">

                            <LogTextBox [ObjectFieldName]="'Notes'" [Text]="Notes" [ObjectTableName]="ObjectTableName" [RowsCount]="13"
                                [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>


                            <div *ngIf="entityPM" class="footer" style="margin-top: 27px;">
                                <div float-start style="padding: 0px 10px; width:100%;">
                                    <div float-start  style="color: dimgray;font-size:11px; width: 80px;">Updated By: </div>
                                    <div float-start style="font-size:12px;width: 200px;" class="TextTrimming">
                                        <span float-start>{{ entityPM.UpdatedByUserId }}</span> <span float-start style="font-size:10px; line-height: 19px;padding: 0 5px;">({{ entityPM.UpdateDate | DateTimePipe:'DT' }})</span>
                                    </div>
                                </div>
                                <!-- <div float-start style="padding: 0px 10px; width:100%;" >
                                    <div float-start  style="color: dimgray;font-size:11px; width: 80px;">Updated Date: </div>
                                    <div float-start style="font-size:12px;">{{ entityPM.UpdateDate | DateTimePipe:'DT' }}</div>
                                </div> -->
                            </div>

                        </div>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
