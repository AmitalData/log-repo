<style>
    .html5-progress-bar {
        padding: 15px 15px;
        border-radius: 3px;
        background-color: #fff;
        box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, .2);
    }

        .html5-progress-bar progress {
            background-color: #f3f3f3;
            border: 0;
            width: 80%;
            height: 18px;
            border-radius: 9px;
        }

            .html5-progress-bar progress::-webkit-progress-bar {
                background-color: #f3f3f3;
                border-radius: 9px;
            }

            .html5-progress-bar progress::-webkit-progress-value {
                background: #cdeb8e;
                background: -moz-linear-gradient(top, #cdeb8e 0%, #a5c956 100%);
                background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#cdeb8e), color-stop(100%,#a5c956));
                background: -webkit-linear-gradient(top, #cdeb8e 0%,#a5c956 100%);
                background: -o-linear-gradient(top, #cdeb8e 0%,#a5c956 100%);
                background: -ms-linear-gradient(top, #cdeb8e 0%,#a5c956 100%);
                background: linear-gradient(to bottom, #cdeb8e 0%,#a5c956 100%);
                filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#cdeb8e', endColorstr='#a5c956',GradientType=0 );
                border-radius: 9px;
            }

            .html5-progress-bar progress::-moz-progress-bar {
                background: #cdeb8e;
                background: -moz-linear-gradient(top, #cdeb8e 0%, #a5c956 100%);
                background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#cdeb8e), color-stop(100%,#a5c956));
                background: -webkit-linear-gradient(top, #cdeb8e 0%,#a5c956 100%);
                background: -o-linear-gradient(top, #cdeb8e 0%,#a5c956 100%);
                background: -ms-linear-gradient(top, #cdeb8e 0%,#a5c956 100%);
                background: linear-gradient(to bottom, #cdeb8e 0%,#a5c956 100%);
                filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#cdeb8e', endColorstr='#a5c956',GradientType=0 );
                border-radius: 9px;
            }

        .html5-progress-bar .progress-value {
            padding: 0px 5px;
            line-height: 20px;
            margin-left: 5px;
            font-size: .8em;
            color: #555;
            height: 18px;
            float: right;
        }


        .errors-box{
            border-radius: 8px;
            padding: 5px 10px;
            background: rgb(249 224 224);
            border: 1px solid #c15757;
            color: #420000;
            height: 110px;
            overflow: auto;
        }


        .errors-box li{
            margin-bottom: 10px;

            white-space: -moz-pre-wrap !important;
            white-space: -webkit-pre-wrap;
            white-space: -pre-wrap;
            white-space: -o-pre-wrap;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            white-space: normal;

        }
</style>
<table>

    <tr *ngIf="Errors.length>0">
        <td colspan="2" style="text-align:start;">
           <!-- <ValidationSummary [ItemsSource]="Errors" [SingleLine]="true"></ValidationSummary> -->
           <div class="errors-box">
               <ul style="width: 440px;">
                   <li *ngFor="let error of Errors" >{{error}}</li>
               </ul>
           </div>
           <button class="RedButton" style="width: 70px;display: block;width: 70px;margin: 0 auto; margin-top: 22px;"  (click)="CloseWindow()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
        </td>
    </tr>

    <tr *ngIf="Errors.length==0">
        <td colspan="2" style="text-align:center;">

            <!-- Label -->
            <div style="height: 20px;margin-top: 8px" [style.color]="GetLabelColor()">
                <span>{{LabelText}}</span>
            </div>

            <!-- Buttons -->
            <div *ngIf="!Loading" style="margin-top: 8px;">
                <button style="width: 70px;display: inline-block;" class="Button" (click)="RunService(true)">{{'General.O.CreateFile' | TextCodeTranslationPipe}}</button>
                <!-- <div *ngIf="Success||Failed" style="width: 30px;display: inline-block;"></div> -->
                <div *ngIf="Success" style="width: 30px;display: inline-block;"></div>
                <button *ngIf="Success" style="width: 70px;display: inline-block;"
                        [class.RedButton]="Success" (click)="DownloadButtonClicked()">{{'TaxReport.B.Download' | TextCodeTranslationPipe}}</button>

                <!-- <button *ngIf="Failed" style="width: 70px;display: inline-block;"
                        class="Button" (click)="ShowError()"> {{'General.O.ShowError' | TextCodeTranslationPipe}} </button> -->
            </div>

            <!-- Progress Bar -->
            <div *ngIf="Loading" style="height: 18px; margin-top: 10px;">
                <progress style="width: 250px;" id="progressbar"></progress>
            </div>

        </td>
    </tr>


    <tr>
        <td><div></div></td>
    </tr>

</table>
