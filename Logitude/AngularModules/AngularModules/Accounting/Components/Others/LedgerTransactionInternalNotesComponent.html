<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList">

            </ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td>
                        <div class="MediaFill">
                            <LogTextBox [ObjectFieldName]="'InternalNote'" [InputType]="'ntext'"
                                [ObjectTableName]="ObjectTableName" [RowsCount]="13" [DataContext]="DataContext"
                                [IsMultiline]="true" [HideColumns]="true" [Text]="InternalNote">
                            </LogTextBox>

                            <div *ngIf="EntityPM" class="footer" style="margin-top: 10px;">
                                <div float-start style="padding: 0px 10px; width:100%;">
                                    <div float-start style="color: dimgray;font-size:11px; width: fit-content;">
                                        {{'AccountingNote.F.UpdatedByUserName' | TextCodeTranslationPipe}}
                                    </div>
                                    <div float-start style="font-size:12px;width: 230px;padding: 0 10px;"
                                        class="TextTrimming">
                                        <span float-start>{{ EntityPM.UpdatedByUserName }}</span>
                                        <span float-start style="font-size:10px; line-height: 17px;padding: 0 5px;">
                                            ({{EntityPM.UpdateDateTime | DateTimePipe:'DT' }})
                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button"
                            (click)="CancelButtonClicked()">{{'General.B.Cancel'|TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton"
                            (click)="OkButtonClicked()">{{'General.B.Ok'|TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
