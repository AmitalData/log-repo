 
<div class="TabHolder">
    <table>
        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="4">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
            </td>
        </tr>
        <tr class="TabTitleRow">
            <td>
                {{GridHeaderText}}
            </td>
        </tr>
        <tr style="height: 1px;vertical-align:top">
            <td>
                
            </td>
        </tr>
        <tr style="height: 32px;"><td><div></div></td></tr>
        <tr>
            <td colspan="5" style="height: 100%;">
                <div class="GeneratedGridContainer">
                    <logitude-grid GridWidth="100%" GridHeight="100%"
                                   [ObjectTable]="'CargoTrackingIncrementalStat'"
                                   [dataSource]="DataSource"
                                   [columns]="columns"
                                   [autoLoad]="true"
                                   [IsCustomTemplate]="true"
                           
                                   >
                    </logitude-grid>
                </div>
            </td>
        </tr>
    </table>
    </div>
