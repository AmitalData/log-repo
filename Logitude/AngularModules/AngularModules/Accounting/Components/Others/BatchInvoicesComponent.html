<style>


    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>



<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="15">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td style="width: 35px;height:23px;">
            <div>
                <CheckBox [IsChecked]="AllSelected" (Checked)="AllSelected = $event " [IsEnabled]="IsSelectAllEnabled"></CheckBox>

            </div>
        </td>
        <!--<td *ngIf="IsSelectedItemsTextVisibile" style="width:90px">
            <div style="width: 100%;text-align:center;  height:30px;">
                <div class="DisbleBox">

                    {{SelectedItemsCountText}}


                </div>
            </div>
        </td>-->
        <td style="width: 75px;">
            {{'Accounting.O.FromDate' | TextCodeTranslationPipe}}
        </td>

        <td style="width:120px;">
            <LogDatePicker [ObjectFieldName]="'FromDate'" [ObjectTableName]="ObjectTableName"
                           [NoObjectField]="true" [ForceSubscribe]="true" [DataContext]="DataContext"
                           [HideColumns]="true" [SelectedDateValue]="FromDate"></LogDatePicker>
        </td>


        <!-- ToDate -->
        <td style="width:10px"></td>
        <td style="width: 70px;">
            {{'Accounting.General.O.ToDate' | TextCodeTranslationPipe}}
        </td>

        <td style="width:120px;">
            <LogDatePicker [ObjectFieldName]="'ToDate'" [ObjectTableName]="ObjectTableName"
                           [NoObjectField]="true" [ForceSubscribe]="true" [DataContext]="DataContext"
                           [HideColumns]="true" [SelectedDateValue]="ToDate"></LogDatePicker>
        </td>
        <td style="width:10px"></td>

        <td style="width: 30px;">
            <IconButton [Name]="'Refresh'" (click)="Refresh()"></IconButton>
        </td>

        <!-- Category -->
        <td style="width:70px">
            <LogLabel [ObjectFieldName]="'Category'" [ObjectTableName]="'GLAccount'"
                      [Text]="'Category'" [DataContext]="DataContext"></LogLabel>
        </td>
        <td style="width:120px">
            <ComboBox [ItemsSource]="CategoriesList"
                      [SelectedItem]="SelectedCategory" (SelectedItemChanged)="SelectedCategory=$event" ></ComboBox>
        </td>
        <td style="width:120px;padding-left: 5px;">
            <div [ngSwitch]="SelectedCategory" [class.disabled]="IsCategoryDisabled">

                <!-- Category 1 -->
                <LogLov *ngSwitchCase="'Category 1'" [ObjectFieldName]="'Category1'"
                        [ObjectTableName]="'GLAccount'" [DataContext]="DataContext"
                        [DisplayMemberPath]="'LocalName'" [LookUpTableName]="'Category1'"
                        [HideColumns]="true">
                </LogLov>

                <!-- Category 2 -->
                <LogLov *ngSwitchCase="'Category 2'" [ObjectFieldName]="'Category2'"
                        [ObjectTableName]="'GLAccount'" [DataContext]="DataContext"
                        [DisplayMemberPath]="'LocalName'" [LookUpTableName]="'Category2'"
                        [HideColumns]="true">
                </LogLov>

                <!-- Category 3 -->
                <LogLov *ngSwitchCase="'Category 3'" [ObjectFieldName]="'Category3'"
                        [ObjectTableName]="'GLAccount'" [DataContext]="DataContext"
                        [DisplayMemberPath]="'LocalName'" [LookUpTableName]="'Category3'"
                        [HideColumns]="true">
                </LogLov>

                <!-- Category 4 -->
                <LogLov *ngSwitchCase="'Category 4'" [ObjectFieldName]="'Category4'"
                        [ObjectTableName]="'GLAccount'" [DataContext]="DataContext"
                        [DisplayMemberPath]="'LocalName'" [LookUpTableName]="'Category4'"
                        [HideColumns]="true">
                </LogLov>

                <!-- Category 5 -->
                <LogLov *ngSwitchCase="'Category 5'" [ObjectFieldName]="'Category5'"
                        [ObjectTableName]="'GLAccount'" [DataContext]="DataContext"
                        [DisplayMemberPath]="'LocalName'" [LookUpTableName]="'Category5'"
                        [HideColumns]="true">
                </LogLov>

                <!-- Default -->
                <div *ngSwitchDefault>
                    <!--<span style="font-style: italic; color: #d1d1d1;font-size: 10px;">Select category first...</span>-->
                    <ComboBox [ItemsSource]="[]" [IsDisabled]="true"></ComboBox>
                </div>

            </div>

        </td>
      <td style="width:10px"></td>

    <td style="width: 35px;height:23px;">
        <div>
            <CheckBox [IsChecked]="ShowInProgressReports" (Checked)="ShowInProgressReports = $event "></CheckBox>

        </div>
    </td>
        {{'InterestReport.O.ShowInvoicingInProgressReports' | TextCodeTranslationPipe}}
    <td style=" "></td>

    </tr>
    <tr style="height:5px"></tr>
    <tr>
        <td colspan="15" style="height: 100%; padding-bottom: 3px; vertical-align: top;">
            <div class="GeneratedGridContainer" style="height: calc(100% - 20px)" *ngIf="LoadGrids">
                <logitude-grid GridWidth="100%" GridHeight="100%" [ObjectTable]="'InterestReport'"
                               [dataSource]="DataSource" [FireCheckBoxChecked]="FireCheckBoxChecked"
                               [MenuHeaderchangeevent]="MenuHeaderchangeevent" [columns]="Columns" [autoLoad]="true"
                               [QueryChangeEvent]="onQueryChangeEvent" [IsCustomTemplate]="true"
                               [PassAdditionalDataToTemplates]="true" [MarkIsChecked]="MarkIsChecked"
                               (DataLoaded)="OnDataLoaded($event)" (CheckBoxChecked)="onCheckBoxChecked($event)" [IsAllRecordsChecked]="AllSelected" [CustomColumnsReady]="ColumnsReady">
                </logitude-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td colspan="15" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 70%">
                        <div></div>
                    </td>
                    <td style="width:70px">
                        <button class="RedButton" (click)="CloseWithoutInvoice()">{{CloseWithoutInvoiceText}}</button>
                    </td>
                    <td style="width: 15px;"></td>
                    <td style="width: 57px;">
                        <button class="GreenButton" (click)="CheckNumberOfInterestReportInvoicingWithoutInvoice()">{{CreateInvoiceText}}</button>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

</table>
