<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:50px">
        <td>
            <table>
                <tr>
                    <td style="width:20px">
                        <CheckBox [IsChecked]="AmountsAndCurrencies" (Checked)="AmountsAndCurrencies = $event"></CheckBox>
                    </td>

                    <td style="width:150px">
                        Amounts/Currencies
                    </td>
                    <td style="width:20px">
                        <CheckBox [IsChecked]="Dates" (Checked)="Dates = $event"></CheckBox>
                    </td>

                    <td>Dates</td>
                    <td style="width:20px">
                        <CheckBox [IsChecked]="ReferencesAndNotes" (Checked)="ReferencesAndNotes = $event"></CheckBox>
                    </td>
                    <td>References/Notes</td>


                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:50px">
        <td>
            <table>
                <tr class="FormFieldRow">

                    <td style="width: 150px;text-align:center">{{'Accounting.General.O.AccountingDate' | TextCodeTranslationPipe}}</td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'AccountingDate'" [ObjectTableName]="ObjectTableName"
                                       [DataContext]="DataContext" [HideColumns]="true" [ForceFocus]="forceFocus"></LogDatePicker>
                    </td>


                    <td style="width:20px"></td>
                    <td style="width: 150px;text-align: center">{{'Journal.F.DocumentDate' | TextCodeTranslationPipe}}</td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'DocumentDate'" [ObjectTableName]="ObjectTableName"
                                       [DataContext]="DataContext" [HideColumns]="true" [ForceFocus]="forceFocus"></LogDatePicker>
                    </td>
                    <td style="width:20px"></td>


                    <td style="width: 150px;text-align:center">{{'Journal.F.DueDate' | TextCodeTranslationPipe}}</td>

                    <td style="width: 180px;">
                        <LogDatePicker [ObjectFieldName]="'DueDate'" [ObjectTableName]="ObjectTableName"
                                       [DataContext]="DataContext" [HideColumns]="true" [ForceFocus]="forceFocus"></LogDatePicker>
                    </td>
                    <td>
                        <div></div>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button  class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
