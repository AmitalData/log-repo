
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td style="width: 400px">
            <table>
                <tr class="FormFieldRow">
                    <td>
                        <table>
                            <!-- InterestCalculationDate -->
                            <tr class="FormFieldRow">
                                <td style="width: 170px;">
                                    <LogLabel [ObjectFieldName]="'InterestCalculationDate'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 140px;">
                                    <LogDatePicker [ObjectFieldName]="'InterestCalculationDate'" [ObjectTableName]="ObjectTableName"
                                                   [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                </td>
                                <td><div></div></td>
                            </tr>
                            <!-- CustomerId -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'CustomerId'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td>
                                    <LogLov [ObjectFieldName]="'CustomerId'"
                                            [SelectedValue]="CustomerId"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Card'"
                                            [DependencyFilter1Value]="'CS'"
                                            [HideLastColumn]="true"
                                            [QueryFilterItems]="GLAccountsFilterItems"
                                            [StartSearchFromChar]="3"
                                            [StartSearchFromNumber]="5">
                                    </LogLov>
                                </td>
                                <td><div></div></td>
                            </tr>


                            <tr><td><div></div></td></tr>
                        </table>

                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'cancel-AddInterestReport' | IdGeneratorAsyncPipe | async}}"  class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'ok-AddInterestReport' | IdGeneratorAsyncPipe | async}}"  class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
