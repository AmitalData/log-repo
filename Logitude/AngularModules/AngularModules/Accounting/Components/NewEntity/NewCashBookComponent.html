    <table>
        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="4">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true" ></ValidationSummary>
            </td>
        </tr>

        <tr>
            <td style="width: 450px">
                <table>
                    <tr class="FormFieldRow">
                        <td>
                            <table>
                                <!-- Code -->
                                <!--<tr class="FormFieldRow">
                                    <td style="width: 110px;">
                                        <LogLabel [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width: 200px;">
                                        <LogTextBox [ObjectFieldName]="'Code'" [InputType]="'text'" [DataContext]="DataContext"
                                                    [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                    </td>
                                    <td><div></div></td>
                                </tr>-->

                                <!-- LocalName -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                        <LogTextBox [ObjectFieldName]="'LocalName'" [InputType]="'ntext'" [DataContext]="DataContext"
                                                    [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <!-- EnglishName -->
                                <tr class="FormFieldRow">
                                    <td style="width: 150px;">
                                        <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width: 200px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                        <LogTextBox [ObjectFieldName]="'EnglishName'" [InputType]="'text'" [DataContext]="DataContext"
                                                    [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <!-- CashBookTypeCode -->
                                <tr class="FormFieldRow">
                                    <td style="width: 85px;">
                                        <LogLabel [ObjectFieldName]="'CashBookTypeCode'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width: 200px;" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                        <LogLov [ObjectFieldName]="'CashBookTypeCode'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [DisplayMemberPath]="'LocalName'"
                                                [LookUpTableName]="'CashBookType'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <!-- CurrencyId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'CurrencyId'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                        <LogLov [ObjectFieldName]="'CurrencyId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Currency'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <!-- AccountId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'AccountId'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogLov [ObjectFieldName]="'AccountId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'GLAccount'"
                                                [DependencyFilter1Value]="false"
                                                [DependencyFilter2Value]="'1'"
                                                [QueryFilterItems]="GLAccountsFilterItems"
                                                (SelectedItemChanged)="OnLovItemChanged($event)"
                                                [HideColumns]="false"
                                                [StartSearchFromChar]="3"
                                                [StartSearchFromNumber]="6">
                                        </LogLov>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <!-- BranchId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BranchId'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="" [style.padding-right]="isRTL ? 'initial' : '36px'" [style.padding-left]="isRTL ? '36px' : 'initial'">
                                        <LogLov [ObjectFieldName]="'BranchId'"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Branch'"
                                                [HideColumns]="true">
                                        </LogLov>
                                    </td>
                                    <td><div></div></td>
                                </tr>

                                <tr><td><div></div></td></tr>
                            </table>

                        </td>
                    </tr>
                </table>
            </td>

            <td style="width: 80px;"><div></div></td>

            <td>
                <table>
                    <tr class="FormFieldRow">
                        <td>
                            <table>

                                <!-- InActive -->
                                <!--<tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <CheckBox [IsChecked]="Inactive" (Checked)="Inactive = $event"></CheckBox>
                                    </td>
                                    <td><div></div></td>
                                </tr>-->

                                <tr><td><div></div></td></tr>
                            </table>
                        </td>
                    </tr>
                </table>


            </td>
        </tr>

        <tr style="height: 32px;">
            <td colspan="4" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>
