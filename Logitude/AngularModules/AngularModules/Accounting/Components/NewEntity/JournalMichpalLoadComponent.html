<!-- PrintRequestComponent view  -->
<style>
    .MessageBox {
        width: 200px;
        height: 30px;
        padding: 2px 10px;
        margin: 5px;
        color: green;
        font-family: sans-serif;
        font-size: 12px;
        text-align: center;
    }

    .MyTR {
        height: 20px;
    }
</style>

<div>


    <div class="class-request-content" *ngIf="!hasError">
        <table style="width: 350px;height: 120px;padding-top: 10px;">



            <tr style="height:35px">
                <td style="width:40px;text-align:right"><span style="font-size:11px;color:dimgray">קובץ:</span></td>
                <td style="width:150px; ">
                    <LogTextBox [ObjectFieldName]="'FileName'"  [ObjectTableName]="objectTableName"
                                [HideColumns]="true" [Text]="fileName" [DataContext]="dataContext"></LogTextBox>
                </td>

                <td style="width:10px;"><div></div></td>

                <td style="width:60px;text-align:left">
                    <button  style="width:55px;" class="Button" (click)="openUploadFile()">Upload</button>
                    <input  [attr.id]="uploadFileId" type="file" [(ngModel)]="FileData" (change)="uploadFile($event)" style="display:none;width:65px" class="upload" />
                </td>

                <td><div></div></td>
            </tr>

            <tr>
                <td><div></div></td>
            </tr>
        </table>
    </div>

    <div *ngIf="hasError" style="overflow:auto; height:300px;">
        <table>
            <tr class="MyTR">
                <td>
                    <span>{{'General.O.ErrorsFound' | TextCodeTranslationPipe}}</span>
                </td>
            </tr>
            <tr style="height:100px">
                <td>
                    <LogTextBox [ObjectFieldName]="'errorLog'"
                                [Text]="errorLog" [ObjectTableName]="objectTableName"
                                [HideColumns]="true"
                                [IsMultiline]="true" [DataContext]="dataContext"></LogTextBox>

                </td>
            </tr>
            <tr>
                <td><div></div></td>
            </tr>
        </table>

    </div>



    <div *ngIf="createdJournal" style="overflow:auto; height:50px;">
        <table>           
           <tr>
                <td>
                    <a *ngIf="newJournalNumber"
                       href="javascript:;" (click)="openJournal()">
                        {{'Journal.O.JournalCreated' | TextCodeTranslationPipe}}: {{ newJournalNumber }}
                    </a>
                </td>
            </tr> 
            <tr>
                <td><div></div></td>
            </tr>
        </table>

    </div>


</div>
