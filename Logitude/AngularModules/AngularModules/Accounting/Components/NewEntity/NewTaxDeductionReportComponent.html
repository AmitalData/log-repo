
<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="5">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
    <tr style="height: 60px;"><td colspan="2">
    <ul class="FiltersMenu">
        <li (click)="FilterItemClicked('Periodic')" style="width: 80px; height: 22px;"
            [class.SelectedFilter]="FilterSelectedValue === TimePeriod.Periodic">
            {{'TaxDeductionReport.O.Periodic' | TextCodeTranslationPipe}}
        </li>
        <li (click)="FilterItemClicked('Month')" style="width: 80px; height: 22px;"
            [class.SelectedFilter]="FilterSelectedValue === TimePeriod.Month">
            {{'TaxDeductionReport.O.ByMonth' | TextCodeTranslationPipe}}
        </li>
        <li (click)="FilterItemClicked('Year')" style="width: 80px; height: 22px;"
            [class.SelectedFilter]="FilterSelectedValue === TimePeriod.Year">
            {{'TaxDeductionReport.O.ByYear' | TextCodeTranslationPipe}}
        </li>

    </ul>
</td>   </tr>
    <tr style="height:32px" >
        <td style="width:100px">
            <LogLabel [ObjectFieldName]="'TaxYear'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>
        </td>

        <td style="width:150px">
            <LogTextBox [HideColumns]="true" [ObjectFieldName]="'TaxYear'" [InputType]="'integer'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogTextBox>
        </td>

        <td></td>
    </tr>
    <tr style="height:32px" *ngIf="FilterSelectedValue == TimePeriod.Periodic">
        <td style="width:100px">
            <LogLabel [ObjectFieldName]="'FromMonth'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td style="width:150px">
            <ComboBox [ItemsSource]="MonthsList" [Binding]="'Name'" [SelectedItem]="SelectedFromMonth" (SelectedItemChanged)="SelectedFromMonth=$event"></ComboBox>
        </td>

        <td></td>
    </tr>
    <tr style="height:32px" *ngIf="FilterSelectedValue == TimePeriod.Month || FilterSelectedValue == TimePeriod.Periodic">
        <td style="width:100px">
            <LogLabel [ObjectFieldName]="'Month'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>
        </td>

        <td style="width:150px">
            <ComboBox [ItemsSource]="MonthsList" [Binding]="'Name'" [SelectedItem]="SelectedMonth" (SelectedItemChanged)="SelectedMonth=$event"></ComboBox>
        </td>

        <td></td>
    </tr>

    <tr style="height:32px" *ngIf="FilterSelectedValue == 'Year'">
        <td style="width:100px">
            <LogLabel [ObjectFieldName]="'IsAdditionalReportExist'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>
        </td>
        <td style="width:60px">
            <CheckBox [IsChecked]="IsAdditionalReportExist" (Checked)="IsAdditionalReportExist = $event"></CheckBox>


        </td>

        <td></td>
    </tr>
    <tr style="height:32px" *ngIf="FilterSelectedValue == 'Year'">
        <td style="width:100px">
            <LogLabel [ObjectFieldName]="'Email'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>
        </td>
        <td style="width:150px">
            <LogTextBox [Text]="Email" [HideColumns]="true" [ObjectFieldName]="'Email'" [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName">

            </LogTextBox>
        </td>

        <td></td>
    </tr>
    <tr></tr>
    <tr style="height: 32px;">
        <td colspan="5" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.O.Run' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
