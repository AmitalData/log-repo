
<style type="text/css">
    .SquareIcon {
        width: 10px;
        height: 10px;
        line-height: 10px;
        -webkit-border-radius: 2px;
        -moz-border-radius: 2px;
        border-radius: 2px;
    }
</style>

<table>
    <!-- SearchBar -->
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 21px; vertical-align:middle;">
                        <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()"></IconButton>
                    </td>

                    <td style="width: 15px; vertical-align:middle;">
                        <div></div>
                    </td>

                    <td style="width: 45px; vertical-align:middle; font-size:11px; color : #6E7172;">Search:</td>

                    <td style="width: 300px;">
                        <SearchBox [ObjectTableName]="'Journal'" [IsQuickSearch]="true" (ItemClicked)="EditJournal($event)"></SearchBox>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 8px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td style="width:265px;">
                        <table>
                            <tr class="SectionHeader">
                                <td>
                                    <label>Main Queries</label>
                                </td>
                            </tr>

                            <tr style="height:5px;">
                                <td></td>
                            </tr>

                            <tr>
                                <td>
                                    <div class="ScrollViewer">
                                        <div class="ScrollContent">

                                            <!-- Manual Journals -->
                                            <div class="QueriesSection" style="color: #58B8FF;">
                                                <div>Manual Journals</div>
                                                <div style="height:22px; width: 45px; box-sizing: border-box; -moz-box-sizing: border-box; -webkit-box-sizing: border-box; position: absolute; top:2px; right:2px;">
                                                    <button class="Button" (click)="RunNewJournalWizard()">New</button>
                                                </div>
                                                <div>
                                                    <table>
                                                        <tr>
                                                            <td>
                                                                <table>
                                                                    <tr>
                                                                        <td style="width:190px;">
                                                                            <p class="QueryLink" (click)="ViewAccountingQuery('Draft_Journals')"> Draft Journals  </p>
                                                                        </td>
                                                                    </tr>
                                                                    <tr>
                                                                        <td style="width:190px;">
                                                                            <p class="QueryLink" (click)="ViewAccountingQuery('Non_Approved_Journals')"> Waiting for approval Journals  </p>
                                                                        </td>
                                                                    </tr>
                                                                    <tr>
                                                                        <td style="width:190px;">
                                                                            <p class="QueryLink" (click)="ViewAccountingQuery('Approved_Journals')"> Approved Journals </p>
                                                                        </td>
                                                                    </tr>
                                                                    <tr>
                                                                        <td style="width:190px;">
                                                                            <p class="QueryLink" (click)="ViewAccountingQuery('All_journals')"> All Journals </p>
                                                                        </td>
                                                                    </tr>
                                                                    <tr>
                                                                        <td style="width:190px;">
                                                                            <p class="QueryLink" (click)="ViewAccountingQuery('Auto_Created_Journals')"> Auto Created Journals  </p>
                                                                        </td>
                                                                    </tr>

                                                                    <tr>
                                                                        <td><div></div></td>
                                                                    </tr>
                                                                </table>


                                                            </td>
                                                        </tr>

                                                    </table>
                                                </div>
                                            </div>

                                            <!-- Auto Created Journals -->
                                            <!--<div class="QueriesSection" style="color: #58B8FF;">
                                                <div>Auto Created Journals</div>
                                                <div>
                                                    <table>
                                                        <tr>
                                                            <td>
                                                                <table>
                                                                    <tr>
                                                                    </tr>
                                                                    
                                                                    <tr>
                                                                        <td><div></div></td>
                                                                    </tr>
                                                                </table>


                                                            </td>
                                                        </tr>

                                                    </table>
                                                </div>
                                            </div>-->

                                            <div class="QueriesSection" *ngIf="IsQueryVisible_MyViewsGroup">
                                                <div>My Views</div>
                                                <div style="height:80px;">
                                                    <UsersQueryList [ReloadUserQueries]="ReloadUserQueries" [ObjectTableName]="'Journal'" [BackButtonTitle]="'Full Accounting'" (BackCompletedEvent)="onUserQueriesBackComplete($event)"></UsersQueryList>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </td>
                            </tr>

                        </table>
                    </td>

                    <td style="width:15px;">
                        <div></div>
                    </td>

                    <td>
                        <table>
                            <tr style="">
                                <td>
                                    <table>
                                        <tr class="SectionHeader">
                                            <td>
                                                <label>{{RecentJournalsCount}} Recent Journals</label>
                                            </td>
                                        </tr>

                                        <tr style="height:5px;">
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td>
                                                <div class="ScrollViewer">
                                                    <div class="ScrollContent">
                                                        <ul>
                                                            <li class="RecentEntityItem" *ngFor="let item of RecentJournalsList" (click)="EditJournal(item)">
                                                                <table>
                                                                    <tr>
                                                                        <td style="width: 5px;">
                                                                            <div></div>
                                                                        </td>

                                                                        <td style="width:110px; position: relative;" rowspan="2">
                                                                            <div style="position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;" title="{{item.LastActivityTypeName}}">
                                                                                <div *ngIf="item.LastActivityTypeName == 'New'" style="width: 20px; height: 20px; background: url('Images/RecentEntity/Added.png') center center no-repeat; background-size: contain;"></div>
                                                                                <div *ngIf="item.LastActivityTypeName == 'View'" style="width: 20px; height: 20px; background: url('Images/RecentEntity/Viewed.png') center center no-repeat; background-size: contain;"></div>
                                                                                <div *ngIf="item.LastActivityTypeName == 'Update'" style="width: 20px; height: 20px; background: url('Images/RecentEntity/Edited.png') center center no-repeat; background-size: contain;"></div>
                                                                            </div>

                                                                            <div style="position: absolute; left: 3px; bottom: 1px; color: #282E30;">{{item.LastActivityDate | DateTimeToDatePipe}}</div>
                                                                        </td>

                                                                        <td rowspan="2" style="width:300px; font-size: 16px;color: #1B90CB;">No. {{item.JournalNumber}}</td>

                                                                        <!--<td style="width:7px; height: 100%;" rowspan="2">
                                                                            <div style="width:1px; height: calc(100% - 5px); background: #DADADA; margin:auto;"></div>
                                                                        </td>-->

                                                                        <td style="width: 50px;">
                                                                            <div style="color: #262626;">Type: </div>
                                                                        </td>

                                                                        <td>
                                                                            <div>{{item.TypeName}}</div>
                                                                        </td>
                                                                        <td>
                                                                            <div></div>
                                                                        </td>
                                                                    </tr>

                                                                    <tr>
                                                                        <td style="width: 5px;">
                                                                            <div></div>
                                                                        </td>

                                                                        <td style="width: 50px;">
                                                                            <div style="color: #262626;">Status: </div>
                                                                        </td>

                                                                        <td>
                                                                            <div>{{item.StatusName}}</div>
                                                                        </td>
                                                                        <td>
                                                                            <div></div>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </li>
                                                        </ul>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr style="height:5px;">
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
