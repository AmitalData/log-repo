
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:1px;">
        <td style="height: 100%;">
            <div class="FillParent">
                <div class="ScrollViewer">
                    <div class="ScrollContent">
                        <table>
                            <tr style="height:1px; vertical-align:top;">
                                <td style="width:400px;">
                                    <table>
                                        <tr class="FormFieldRow">
                                            <td style="width:120px;">
                                                <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width:250px;">
                                                <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow" style="height:80px;">
                                            <td style="vertical-align:top">
                                                <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="height:80px;">
                                                <div class="FillParent">
                                                    <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                </div>
                                            </td>
                                            <td>
                                                <div>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>

                                <td>
                                    <table>
                                        <tr class="FormFieldRow" style="height:80px;">
                                            <td colspan="3">
                                                <div style="margin: 10px;">
                                                    <div style="font-size: 13px; color: #6E7172;">Access</div>
                                                    <div style="margin-top: 5px; margin-left:5px;">
                                                        <div class="RadioButton" *ngFor="let item of PermissionLevelsList" [attr.id]="'PermissionRadio_Div_' + SessionIndex + item.Code" style="height:22px;">
                                                            <input [attr.id]="'PermissionRadio_' + SessionIndex + item.Code" [attr.name]="'PermissionsRadio' + SessionIndex" type="radio" [checked]="PermissionLevelCode == item.Code" (click)="PermissionLevelCode = item.Code" />
                                                            <label [attr.for]="'PermissionRadio_' + SessionIndex + item.Code" style="text-indent: 20px; font-size: 12px" [ngStyle]="{color: PermissionLevelCode == item.Code ? '#287828':'#282E30'}">
                                                                {{item.Name}}

                                                                <Hyperlink *ngIf="PermissionLevelCode == 'SPF' && item.Code == 'SPF'" style="margin-left:5px;" (click)="ChooseUsersClicked()" [FontSize]="12" [Text]="'Choose'"></Hyperlink>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr style="height:1px; vertical-align:top;">
                                <td colspan="2">
                                    <table>
                                        <tr style="height:25px;">
                                            <td style="font-size: 11px;" *ngIf="!GlobalFilters || GlobalFilters.length == 0">
                                                <Hyperlink (click)="AddFilterClicked()">Add Filters</Hyperlink>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td *ngIf="GlobalFilters && GlobalFilters.length > 0" style="vertical-align: top;">
                                                <table>
                                                    <tr class="FormFieldRow" style="height:28px;" *ngFor="let item of GlobalFilters">
                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width:1px;">
                                                                        <IconButton [Left]="3" [Name]="'Minus'" [IsSmall]="true" (click)="item.DeleteFilterClick()"></IconButton>
                                                                    </td>

                                                                    <td style="width:2px;">
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="width:130px;">
                                                                        <ComboBox [ItemsSource]="FilterTypes"
                                                                                  [SelectedItem]="item.SelectedFilterType"
                                                                                  [Binding]="'Name'"
                                                                                  (SelectedItemChanged)="item.SelectedFilterType = $event">
                                                                        </ComboBox>
                                                                    </td>

                                                                    <td style="width:2px;">
                                                                        <div></div>
                                                                    </td>

                                                                    <td *ngIf="item.SelectedFilterType && item.IsCommonFilter" style="width:120px;">
                                                                        <ComboBox [ItemsSource]="CommonFilterFields"
                                                                                  [SelectedItem]="item.SelectedCommonFilterField"
                                                                                  [Binding]="'Name'"
                                                                                  [WaterMark]="'Field'"
                                                                                  (SelectedItemChanged)="item.SelectedCommonFilterField = $event">
                                                                        </ComboBox>
                                                                    </td>

                                                                    <td *ngIf="item.SelectedFilterType && !item.IsCommonFilter" style="width:120px;">
                                                                        <LogLov [ObjectFieldName]="'DataSetId'"
                                                                                [SelectedValue]="item.DataSetId"
                                                                                [ObjectTableName]="item.ObjectTableName"
                                                                                [DataContext]="item.DataContext"
                                                                                [LookUpTableName]="'AnalyticsFactsMetaData'"
                                                                                [HideColumns]="true"
                                                                                [DisplayMemberPath]="'Name'"
                                                                                [IgnoreFeatureCheck]="true"
                                                                                [PlaceHolder]="'Dataset'">
                                                                        </LogLov>
                                                                    </td>

                                                                    <td style="width:2px;">
                                                                        <div></div>
                                                                    </td>

                                                                    <td *ngIf="item.SelectedFilterType && !item.IsCommonFilter" style="width:120px;">
                                                                        <LogLov [SelectedValue]="item.DataSetFieldId"
                                                                                [ObjectTableName]="item.ObjectTableName"
                                                                                [DataContext]="item.DataContext"
                                                                                [LookUpTableName]="'AnalyticsFactsFieldsMetaData'"
                                                                                [DependencyFilter3Value]="item.DataSetId"
                                                                                [HideColumns]="true"
                                                                                [DisplayMemberPath]="'DisplayName'"
                                                                                (SelectedItemChanged)="item.FieldChanged($event)"
                                                                                [NoValidation]="true"
                                                                                [IsFreeText]="true"
                                                                                [PlaceHolder]="'Field'"
                                                                                [ObjectFieldName]="'DataSetFieldId'">
                                                                        </LogLov>
                                                                    </td>

                                                                    <td style="width:2px;">
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="width:150px;">
                                                                        <ComboBox [ItemsSource]="item.Operators"
                                                                                  [SelectedItem]="item.SelectedOperator"
                                                                                  [Binding]="'Name'"
                                                                                  [WaterMark]="'Operator'"
                                                                                  (SelectedItemChanged)="item.SelectedOperator = $event">
                                                                        </ComboBox>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <tr style="height:25px;">
                                            <td style="font-size: 11px;" *ngIf="GlobalFilters && GlobalFilters.length > 0 && GlobalFilters.length < 6">
                                                <Hyperlink (click)="AddFilterClicked()">Add Filters</Hyperlink>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td style="width: 57px;" *ngIf="!isNew">
                        <button class="ActualRedButton" (click)="DeleteButtonClicked()">Delete</button>
                    </td>

                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>


                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
