
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:1px;">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width:120px;">
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:250px;">
                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow" style="height:80px;">
                    <td style="vertical-align:top">
                        <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="height:80px;">
                        <div class="FillParent">
                            <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                        </div>
                    </td>
                    <td>
                        <div>
                        </div>
                    </td>
                </tr>

                <tr class="FormFieldRow" style="height:80px;">
                    <td colspan="3">
                        <div style="margin: 10px;">
                            <div style="font-size: 13px; color: #6E7172;">Access</div>
                            <div style="margin-top: 5px; margin-left:5px;">
                                <div class="RadioButton" *ngFor="let item of PermissionLevelsList" [attr.id]="'PermissionRadio_Div_' + SessionIndex + item.Code" style="height:22px;">
                                    <input [attr.id]="'PermissionRadio_' + SessionIndex + item.Code" [attr.name]="'PermissionsRadio' + SessionIndex" type="radio" [checked]="PermissionLevelCode == item.Code" (click)="PermissionLevelCode = item.Code" />
                                    <label [attr.for]="'PermissionRadio_' + SessionIndex + item.Code" style="text-indent: 20px; font-size: 12px" [ngStyle]="{color: PermissionLevelCode == item.Code ? '#287828':'#282E30'}">
                                        {{item.Name}}

                                        <Hyperlink *ngIf="PermissionLevelCode == 'SPF' && item.Code == 'SPF'" style="margin-left:5px;" (click)="ChooseUsersClicked()" [FontSize]="12" [Text]="'Choose'"></Hyperlink>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;" *ngIf="!isNew">
                        <button class="Button" (click)="DeleteButtonClicked()">Delete</button>
                    </td>

                    <td style="width: 5px;" *ngIf="!isNew">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
