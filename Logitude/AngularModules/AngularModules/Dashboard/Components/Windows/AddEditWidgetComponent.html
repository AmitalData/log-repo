
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:1px;">
        <td style="height: 100%;">
            <div class="FillParent">
                <div class="ScrollViewer">
                    <div class="ScrollContent">
                        <table>
                            <tr style="height: 0;">
                                <td style="width:400px; vertical-align:top;">
                                    <table style="display: table-cell;" cellspacing="0">
                                        <tr class="FormFieldRow">
                                            <td style="width:120px;">
                                                <LogLabel [ObjectFieldName]="'Title'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width:250px;">
                                                <LogTextBox [ObjectFieldName]="'Title'" [Text]="Title" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'EntityId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td>
                                                <LogLov [ObjectFieldName]="'EntityId'"
                                                        [SelectedValue]="EntityId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'AnalyticsFactsMetaData'"
                                                        [HideColumns]="true"
                                                        [DisplayMemberPath]="'Name'"
                                                        [IgnoreFeatureCheck]="true">
                                                </LogLov>
                                            </td>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'GroupById'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td>
                                                <LogLov [ObjectFieldName]="'GroupById'"
                                                        [SelectedValue]="GroupById"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'AnalyticsFactsFieldsMetaData'"
                                                        [DependencyFilter2Value]="true"
                                                        [DependencyFilter3Value]="EntityId"
                                                        [HideColumns]="true"
                                                        [DisplayMemberPath]="'DisplayName'">
                                                </LogLov>
                                            </td>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                    </table>
                                </td>

                                <td style="vertical-align:top">
                                    <img width="180" [attr.src]="ChartImageSrc" />
                                </td>
                            </tr>
                            
                            <tr *ngFor="let item of WidgetMeasuresList" style="height: 0;">
                                <td colspan="2">
                                    <div style="display: flex;">   
                                        <LogLabel [ObjectFieldName]="'MeasureFieldId'" [ObjectTableName]="item.ObjectTableName" [DataContext]="item.DataContext" style="width: 120px;"></LogLabel>
                                        <div style="display: flex;">   
                                            <LogLov [ObjectFieldName]="'MeasureCode'"
                                                    [SelectedValue]="item.MeasureCode"
                                                    [ObjectTableName]="item.ObjectTableName"
                                                    [DataContext]="item.DataContext"
                                                    [LookUpTableName]="'MeasureType'"
                                                    [HideColumns]="true"
                                                    style="width: 80px;">
                                            </LogLov>

                                            <div style="width: 2px;"></div>
                                            
                                            <LogLov [ObjectFieldName]="'MeasureFieldId'"
                                                    [SelectedValue]="item.MeasureFieldId"
                                                    [ObjectTableName]="item.ObjectTableName"
                                                    [DataContext]="item.DataContext"
                                                    [LookUpTableName]="'AnalyticsFactsFieldsMetaData'"
                                                    [DependencyFilter1Value]="true"
                                                    [HideColumns]="true"
                                                    [DisplayMemberPath]="'DisplayName'"
                                                    (SelectedItemChanged)="item.SelectedField = $event"
                                                    style="width: 150px;">
                                            </LogLov>

                                            <div *ngIf="item.SelectedField && (item.SelectedField.DataTypeCode == 'DateTime' || item.SelectedField.DataTypeCode == 'Date')" style="margin-left: 2px; width: 70px;">
                                                <ComboBox  (SelectedItemChanged)="item.DateGroupCode = $event"
                                                           [ItemsSource]="item.DateGroupCodes" 
                                                           [SelectedItem]="item.DateGroupCode"
                                                           style="width: 70px;">
                                                </ComboBox>

                                            </div>

                                        </div>
                                        <div style="margin-top: 2px;">
                                            <IconButton *ngIf="IsAddNewMeasureVisible" [Left]="3" [Name]="'Add'" [IsSmall]="true" (click)="AddNewMeasureClicked()"></IconButton>
                                            <IconButton *ngIf="item.IsDeleteMeasureVisible" [Left]="3" [Name]="'Delete'" [IsSmall]="true" (click)="item.DeleteMeasureClicked()"></IconButton>
                                        </div>
                                    </div>
                                </td>
                   
                            </tr>

                            <tr style="height: 10px;">
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                            
                            <tr *ngIf="EntityId" style="height: 0;">
                                <td colspan="2" style="height: 250px;">
                                    <div style="overflow-x: auto; overflow-y: hidden; height: 100%; width: 100%;">
                                        <WidgetFilter [IsRoot]="true" [EntityId]="EntityId" [DataSource]="RootFilter"></WidgetFilter>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
