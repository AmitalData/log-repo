
<table>
    <tr style="height:1px;">
        <td>
            <table>
                <tr>
                    <td><div></div></td>

                    <td style="width: 250px;">
                        <SearchTextBox [ObjectTableName]="'Contact'" [PlaceHolder]="'Search'" (SearchTextChangeEvent)="onSearchTextChangeEvent($event)"></SearchTextBox>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:5px;">
        <td><div></div></td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div style="vertical-align:top;" class="GeneratedGridContainer">
                    <div style="vertical-align:top;" class="GeneratedGridContainer">
                        <logitude-grid style="vertical-align:top;"  GridWidth="100%" GridHeight="100%"
                                       [QueryChangeEvent]="onQueryChangeEvent"                                      
                                       [dataSource]="DataSource"
                                       [ReloadData]="true"
                                       [columns]="Columns"
                                       [autoLoad]="true"
                                       [rows]="Items"
                                       [CheckboxProp]="'ContactId'"
                                       [searchFields]="SearchText"
                                       [SearchFieldchangeevent]="SearchFieldChangeEvent"
                                       (RemovedListItemsEvent)="OnSetRemoved($event)">
                        </logitude-grid>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
