
<div class="MediaFillRelative">
    <div class="ScrollViewer">
        <div class="ScrollContent">
            <table>
                <tr style="height:28px;" class="Label BlueTitle">
                    <td style="left:10px;">Common Filters</td>
                </tr>

                <tr class="FormFieldRow" style="height:28px;" *ngFor="let item of CommonFilters">
                    <td>
                        <table>
                            <tr>
                                <td style="width:15px;">
                                    <div></div>
                                </td>

                                <td style="width:130px;">
                                    <ComboBox [ItemsSource]="FilterTypes"
                                              [SelectedItem]="item.SelectedFilterType"
                                              [Binding]="'Name'"
                                              (SelectedItemChanged)="item.SelectedFilterType = $event"
                                              [IsDisabled]="true">
                                    </ComboBox>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td *ngIf="item.SelectedFilterType" style="width:120px;">
                                    <ComboBox [ItemsSource]="CommonFilterFields"
                                              [SelectedItem]="item.SelectedCommonFilterField"
                                              [Binding]="'Name'"
                                              [WaterMark]="'Field'"
                                              (SelectedItemChanged)="item.SelectedCommonFilterField = $event"
                                              [IsDisabled]="true">
                                    </ComboBox>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td style="width:150px;">
                                    <ComboBox [ItemsSource]="item.Operators"
                                              [SelectedItem]="item.SelectedOperator"
                                              [Binding]="'Name'"
                                              [WaterMark]="'Operator'"
                                              (SelectedItemChanged)="item.SelectedOperator = $event"
                                              [IsDisabled]="true">
                                    </ComboBox>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td style="width:120px;">
                                    <LogTextBox [NoValidation]="true"
                                                [HideLastColumn]="true"
                                                [Text]="item.TextFieldValue"
                                                [IsFreeText]="true"
                                                (ValueChanged)="item.TextBoxValueChange($event)"
                                                style="height:22px"
                                                [DataContext]="item"
                                                HideLastColumn="true"
                                                HideColumns="true"
                                                DontAllowAutoSelect="true"
                                                [InputType]="item.GetTextInputType()"></LogTextBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:28px;" class="Label BlueTitle">
                    <td style="left:10px;">Dataset Filters</td>
                </tr>

                <tr class="FormFieldRow" style="height:28px;" *ngFor="let item of DatasetFilters">
                    <td>
                        <table>
                            <tr>
                                <td style="width:15px;">
                                    <div></div>
                                </td>

                                <td style="width:130px;">
                                    <ComboBox [ItemsSource]="FilterTypes"
                                              [SelectedItem]="item.SelectedFilterType"
                                              [Binding]="'Name'"
                                              (SelectedItemChanged)="item.SelectedFilterType = $event"
                                              [IsDisabled]="true">
                                    </ComboBox>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td *ngIf="item.SelectedFilterType" style="width:120px;">
                                    <LogLov [ObjectFieldName]="'DataSetId'"
                                            [SelectedValue]="item.DataSetId"
                                            [ObjectTableName]="item.ObjectTableName"
                                            [DataContext]="item.DataContext"
                                            [LookUpTableName]="'AnalyticsFactsMetaData'"
                                            [HideColumns]="true"
                                            [DisplayMemberPath]="'Name'"
                                            [IgnoreFeatureCheck]="true"
                                            [PlaceHolder]="'Dataset'">
                                    </LogLov>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td *ngIf="item.SelectedFilterType" style="width:120px;">
                                    <LogLov [SelectedValue]="item.DataSetFieldId"
                                            [ObjectTableName]="item.ObjectTableName"
                                            [DataContext]="item.DataContext"
                                            [LookUpTableName]="'AnalyticsFactsFieldsMetaData'"
                                            [DependencyFilter3Value]="item.DataSetId"
                                            [HideColumns]="true"
                                            [DisplayMemberPath]="'DisplayName'"
                                            [NoValidation]="true"
                                            [IsFreeText]="true"
                                            [PlaceHolder]="'Field'"
                                            [ObjectFieldName]="'DataSetFieldId'">
                                    </LogLov>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td style="width:150px;">
                                    <ComboBox [ItemsSource]="item.Operators"
                                              [SelectedItem]="item.SelectedOperator"
                                              [Binding]="'Name'"
                                              [WaterMark]="'Operator'"
                                              (SelectedItemChanged)="item.SelectedOperator = $event"
                                              [IsDisabled]="true">
                                    </ComboBox>
                                </td>

                                <td style="width:2px;">
                                    <div></div>
                                </td>

                                <td style="width:120px;">
                                    <LogTextBox [NoValidation]="true"
                                                [HideLastColumn]="true"
                                                [Text]="item.TextFieldValue"
                                                [IsFreeText]="true"
                                                (ValueChanged)="item.TextBoxValueChange($event)"
                                                style="height:22px"
                                                [DataContext]="item"
                                                HideLastColumn="true"
                                                HideColumns="true"
                                                DontAllowAutoSelect="true"
                                                [InputType]="item.GetTextInputType()"></LogTextBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
