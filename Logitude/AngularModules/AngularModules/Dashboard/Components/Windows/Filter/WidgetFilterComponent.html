<style type="text/css">
    .LinkBtn {
        text-decoration: underline;
        float: left;
        color: blue;
        font-size: 11px;
        text-indent: 3px;
    }

    .LinkBtn:hover {
        text-decoration: underline;
        float: left;
        color: lightskyblue;
        font-size: 11px;
        cursor: pointer;
    }

    .GroupItem {
        min-width: 70px;
        min-height: 65px;
        margin: 5px;
        display: inline-block;
    }

    .OperatorItem {
        min-width: 45px;
        min-height: 65px;
        margin: 5px;
        display: inline-block;

    }

    .Operator {
        min-width: 45px;
        min-height: 20px;
        margin: 5px;
        display: inline-block;
    }

    .Filters {
        display: table-cell;
        border-left: 1px solid gray;
    }

    .FilterItem {
        min-width: 55px;
        min-height: 20px;
        margin: 5px;
    }

    .ImgHolder {
        flex-direction: row;
        box-sizing: border-box;
        display: flex;
        place-content: center;
        align-items: center;

    }
</style>
<table>
    <tr>
        <td style="width:6px;">
            <div></div>
        </td>
        <td>
            <table>
                <tr>

                    <td style="width: 130px;height:45px;" *ngIf="IsRoot && (!FilterItems || FilterItems.length == 0)">
                        <label style="padding-left:20%;color: #C9C9C9;">
                            No Filters Added.
                        </label>
                    </td>
                    <td *ngIf="IsRoot && (!FilterItems || FilterItems.length == 0)">
                        <span class="LinkBtn" (click)="AddEmptyFilter()"> Add Filter</span>
                    </td>

                    <td *ngIf="FilterItems && FilterItems.length > 0">
                        <div style="display: flex; width: 0px;" *ngFor="let item of FilterItems; let i=index;">
                            <div *ngIf="IsRoot || FilterItems.length != 1" class="ImgHolder">
                                <img class="DeleteButton" src="./Images/Trash-can.png" style="cursor: pointer;"
                                    (click)="onDeleteFilterClick(item)" />
                            </div>
                            <div *ngIf="!item.IsGroup" style="width:650px;">
                                <div>
                                    <table style="height:30px;">
                                        <tr style="height:30px;" class="MyFilterItem">
                                            <!-- <td style="width:170px;max-width:170px;min-width:87px;">
                                                <LogLov (SelectedItemChanged)="item.FieldChanged($event)"
                                                        [ObjectFieldName]="'ObjectFieldCode'"
                                                        [QueryFilterItems]="item.MainEntityFieldsFilterItems"
                                                        [ObjectTableName]="'ObjectField'"
                                                        [DataContext]="item"
                                                        [LookUpTableName]="'ObjectField'"
                                                        [NoValidation]="true"
                                                        [IsFreeText]="true"
                                                        [SelectedValue]="item.ObjectFieldCode"
                                                        [HideColumns]="true"
                                                        [HideLastColumn]="true"
                                                        [PlaceHolder] ="'Field'"
                                                        [IsDisabled]="!item.MainEntityName"
                                                        [DisplayMemberPath]="'FullNameTextCodeDefaultText'">
                                                </LogLov>
                                            </td>
                                            <td style="width:7px;">
                                                <div style="width:7px;"></div>
                                            </td>
                                            <td style="width:170px;max-width:170px;min-width:87px;">
                                                <ComboBox style="width:100px;" [ItemsSource]="item.Operators" [SelectedItem]="item.SelectedOperator" [Binding]="'Name'" [WaterMark]="'Operator'" [IsDisabled]="!item.FieldName" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>
                                            </td>
                                            <td *ngIf="item.ShowOtherEntity" style="width:7px;">
                                                <div style="width:7px;"></div>
                                            </td>
                                            <td *ngIf="item.ShowOtherEntity" style="width:170px;max-width:170px;min-width:87px;">
                                                <ComboBox style="width:170px;display:table-cell;" [ItemsSource]="AllObjectTables" [SelectedItem]="item.SecondaryEntityName" (SelectedItemChanged)="item.SecondaryEntityChanged($event)" [WaterMark]="'Table'" [IsDisabled]="!item.Operator"></ComboBox>
                                            </td>
                                            <td style="width:7px;">
                                                <div style="width:7px;"></div>
                                            </td>

                                            <td style="width:170px;max-width:170px;min-width:87px;" *ngIf="!item.ShowOtherEntity && item.Operator && (item.Operator != 'IsEmpty' && item.Operator != 'IsNotEmpty') && (!item.FieldDataType || item.FieldDataType == '' ||item.FieldDataType == 'Text' || item.FieldDataType == 'nText' || item.FieldDataType == 'Integer' || item.FieldDataType == 'Double' || item.FieldDataType == 'SigDouble' ||item.FieldDataType == 'Decimal')">
                                                <div>
                                                    <LogTextBox [NoValidation]="true" [HideLastColumn]="true" [Text]="item.FieldValue" [IsFreeText]="true" (ValueChanged)="item.TextBoxCondationValueChange($event)" style="height:22px" [ObjectFieldName]="item.ObjectFieldName" [ObjectTableName]="item.ObjectTableName" [DataContext]="item" HideLastColumn="true" HideColumns="true" DontAllowAutoSelect="true"></LogTextBox>
                                                </div>
                                            </td>

                                  
                                            <td style="width:170px;max-width:170px;min-width:87px;" *ngIf="!item.ShowOtherEntity && item.Operator && item.FieldDataType == 'Boolean' && item.Operator == 'Equal'">
                                                <ComboBox style="width:107px;" (SelectedItemChanged)="item.BooleanListValueChanged($event)" [ItemsSource]="item.BooleanList" [SelectedItem]="item.IsChecked" [WaterMark]="'Value'"></ComboBox>
                                            </td>

                                            <td style="width:170px;max-width:170px;min-width:87px;" *ngIf="!item.Operator || item.Operator == 'IsEmpty' || item.Operator == 'IsNotEmpty'">
                                                <div></div>
                                            </td>

                                            <td style="width:170px;max-width:170px;min-width:87px;" *ngIf="!item.ShowOtherEntity && item.Operator && (item.Operator != 'IsEmpty' && item.Operator != 'IsNotEmpty') && (item.FieldDataType == 'DateTime' || item.FieldDataType == 'Date')">
                                                <LogDatePicker [InputType]="'date'" [HideColumns]="true" [IsFreeValue]="true" [NoValidation]="true" [SelectedDateValue]="item.FieldValue" (ValueChanged)="item.DatePickerCondationValueChange($event)" [ObjectFieldName]="item.ObjectFieldName" [ObjectTableName]="item.ObjectTableName" [DataContext]="item"></LogDatePicker>
                                            </td>

                                            <td style="width:170px;max-width:170px;min-width:87px;" *ngIf="!item.ShowOtherEntity && item.Operator && (item.Operator != 'IsEmpty' && item.Operator != 'IsNotEmpty') && item.FieldDataType == 'LookUp'">
                                                <LogLov (SelectedItemChanged)="item.LogLovCondationValueChange($event)"
                                                        [ObjectFieldName]="'FieldValue'"
                                                        [ObjectTableName]="item.ObjectTableName"
                                                        [DataContext]="item"
                                                        [IsFreeText]="true"
                                                        [NoValidation]="true"
                                                        [HideColumns]="true"
                                                        [HideLastColumn]="true"
                                                        [SelectedValue]="item.FieldValue"
                                                        [LookUpTableName]="item.ObjectFieldLookUpTableName"
                                                        [PlaceHolder] ="'Value'"
                                                        [SelectedItemObject]="item.FieldValue">
                                                </LogLov>
                                            </td>

                                            <td style="width:170px;max-width:170px;min-width:87px;" *ngIf="!item.ShowOtherEntity && item.Operator && (item.Operator != 'IsEmpty' && item.Operator != 'IsNotEmpty') && item.FieldDataType == 'PickList'">
                                                <PickList [ObjectFieldName]="item.FieldName"
                                                          [ObjectTableName]="item.ObjectTableName"
                                                          [SelectedValue]="item.FieldValue"
                                                          [DataContext]="item"
                                                          [IsFreeText]="true"
                                                          [NoValidation]="true"
                                                          [HideLastColumn]="true"
                                                          [HideColumns]="true"
                                                          [PlaceHolder] ="'Value'"
                                                          (SelectedItemChanged)="item.LogLovCondationValueChange($event)">
                                                </PickList>
                                            </td>

                                            <td *ngIf="item.ShowOtherEntity && item.Operator && (item.Operator != 'IsEmpty' && item.Operator != 'IsNotEmpty')" style="width:170px;max-width:170px;min-width:87px;">
                                                <LogLov (SelectedItemChanged)="item.ValueChanged($event)"
                                                        [ObjectFieldName]="'ObjectFieldCode'"
                                                        [QueryFilterItems]="item.SecondaryEntityFieldsFilterItems"
                                                        [ObjectTableName]="'ObjectField'"
                                                        [DataContext]="item"
                                                        [LookUpTableName]="'ObjectField'"
                                                        [NoValidation]="true"
                                                        [IsFreeText]="true"
                                                        [SelectedValue]="item.ObjectFieldCode"
                                                        [HideColumns]="true"
                                                        [HideLastColumn]="true"
                                                        [PlaceHolder] ="'Value'"
                                                        [DisplayMemberPath]="'FullNameTextCodeDefaultText'">
                                                </LogLov>
                                            </td>

                                            <td *ngIf="!item.ShowOtherEntity" style="width:127px;">
                                                <div style="width:127px;"></div>
                                            </td> -->

                                            <td colspan="5">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                    <WidgetFilter [DataSource]="item" [EntityId]="EntityId">
                                    </WidgetFilter>
                                </div>
                            </div>
                            <div class="GroupItem" *ngIf="item.IsGroup == true" style="width:620px;">
                                <div class="OperatorItem">
                                    <div style="display: table-cell;vertical-align: middle;">
                                        <div class="Operator">
                                            <ComboBox *ngIf="item" (SelectedItemChanged)="item.AndOrOpsChanged($event)"
                                                [ItemsSource]="item.AndOrOps" [SelectedItem]="item.AndOr"></ComboBox>
                                        </div>
                                    </div>
                                    <div class="Filters">
                                        <div class="FilterItem">
                                            <WidgetFilter [DataSource]="item" [EntityId]="EntityId">
                                            </WidgetFilter>
                                            <div *ngIf="FilterItems.length > 0 && item.IsGroup == true"
                                                style="margin-top: 10px;margin-left: 6px;">
                                                <table>
                                                    <tr>
                                                        <td style="width:1%;"></td>
                                                        <td style="width:1%;"><span class="LinkBtn"
                                                                (click)="AddFilterToGroup(item)">Add Filter</span></td>
                                                        <td style="width:1%;"></td>
                                                        <td style="width:10%;"><span class="LinkBtn"
                                                                (click)="AddGroup(item)">Add Group</span></td>
                                                        <td style="width:4%;"></td>
                                                        <td style="width:30%;"></td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="4"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
