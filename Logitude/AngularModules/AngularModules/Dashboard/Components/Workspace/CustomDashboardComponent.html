<div style="height: 100%;" class="Dashboard-body">
    <div class="FormFieldRow">
        <table>
            <tr style="height:22px;">
                <td style="width: 1px; font-size: 18px; color: #292D30; font-weight: 600; line-height: 120%;">
                    Dashboard
                </td>

                <td *ngIf="dashbaordCount > 0">
                    <div></div>
                </td>

                <td style="width:200px; height:22px;" *ngIf="dashbaordCount > 0">
                    <LogLov [ObjectFieldName]="'SelectedDashboardId'"
                            [ObjectTableName]="'Dashboard'"
                            [NoObjectField]="true"
                            [SelectedValue]="SelectedDashboardId"
                            [DataContext]="DataContext"
                            [LookUpTableName]="'Dashboard'"
                            [HideColumns]="true"
                            (SelectedItemChanged)="SelectedDashboard = $event">
                    </LogLov>
                </td>

                <td class="Table-cell10" *ngIf="dashbaordCount > 0">
                    <div></div>
                </td>

                <td style="width: 117px; min-width: 117px; height: 22px;" *ngIf="dashbaordCount > 0">
                    <button class="Dashboard-create-button" (click)="AdDashboardClicked()">
                        <svg width="10" height="10" viewBox="0 0 5 5"style="display: inline-block; vertical-align: middle;">
                            <path fill="#F3942F" d="M2 1 h1 v1 h1 v1 h-1 v1 h-1 v-1 h-1 v-1 h1 z" />
                        </svg>
                    Create dashboard</button>
                </td>
            </tr>
        </table>
    </div>

    <div style="height:10px;" *ngIf="dashbaordCount > 0"></div>

    <div class="DashboardTab">
        <div class="DashboardTabHead">
            <ul>
                <li *ngFor="let item of DashboardsTabs" [class.DashboardTabSelected]="item.IsSelected" (click)="SelectionChanged(item)">
                    <div class="DashboardInnerTab TextTrimming" [class.InnerTabSelected]="item.IsSelected">
                        {{item.Name}}
                    </div>
                </li>
            </ul>
        </div>

        <div class="DashboardTabBody" [ngStyle]="{'top': dashbaordCount > 0 ? '19px': '0'}">
            <div *ngIf="dashbaordCount > 0">
                <div class="MediaFillAbsolute" *ngFor="let item of DashboardsTabs;" [hidden]="!item.IsSelected">
                    <div LocationDirective Code="DashboardTabLocation" ItemCode="{{item.DashboardId}}"></div>
                </div>
            </div>
        </div>

        <div class="DashboardTabBody" style="top: 0;" *ngIf="dashbaordCount == 0">
            <div class="dl-info-card">

                <div class="dl-info-image-cotainer">
                    <img class="TopCenter" style="position: unset;width: 290px; height: 202px;"
                        src="./Images/Charts/Empty-Dashboard3.png" />
                </div>

                <div style="margin-top: 20px;">
                    <div class="dl-info-center-div">
                        <p class="dl-info-header-text"> You don’t have any information here</p>
                    </div>
                    <div class="dl-info-center-div">
                        <p class="dl-info-description-text">There are currently no dashboards.<br> It is time to add a new
                            one</p>
                    </div>
                </div>

                <td class="dl-info-center-div" style="margin-top: 12px;">
                    <button class="Button" (click)="AdDashboardClicked()">
                        <svg width="20" height="20" viewBox="0 0 5 5"
                            style="display: inline-block; vertical-align: middle;">
                            <path fill="#4D8ABB" d="M2 1 h1 v1 h1 v1 h-1 v1 h-1 v-1 h-1 v-1 h1 z" />
                        </svg>
                        Add new dashboard</button>
                </td>

            </div>
        </div>
    </div>
</div>
