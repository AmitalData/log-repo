             <!-- Shipment order -->
             <table *ngIf="ObjectTableName == 'ShipmentOrder'">
                <tr>
                    <td>
                        <div class="MediaFill">

                            <div *ngIf="FieldName == 'TransportModeId'" class="MediaFillRelative">
                                <img class="CenterCenter" [attr.src]="'./Images/Icons/' + FieldValue + '.png'" [title]="Entity['TransportModeName']" />
                            </div>

                            <div *ngIf="FieldName == 'DirectionId'" class="MediaFillRelative">
                                <img class="CenterCenter" [attr.src]="'./Images/Directions/' + FieldValue + '.png'" [title]="Entity['DirectionName']" />
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
