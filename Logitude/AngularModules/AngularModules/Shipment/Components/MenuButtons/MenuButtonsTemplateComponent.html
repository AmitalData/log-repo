
<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="'true'"></ValidationSummary>
        </td>
    </tr>

    <tr *ngIf="ValidationWarningsList != null && ValidationWarningsList.length > 0" style="height:1px;">
        <td colspan="2">
            <WarningSummary [ItemsSource]="ValidationWarningsList" [SingleLine]="'true'"></WarningSummary>
        </td>
    </tr>

    <tr class="FormFieldRow" *ngIf="IsReasonStackPanel">
        <td style="width: 110px;">
            <LogLabel [Text]="'Decline Reason'" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <LogLov [ObjectFieldName]="'QuoteClosingReasonId'"
                    [ObjectTableName]="'QuoteClosingReason'"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'Quote'">
            </LogLov>
        </td>
    </tr>

    <tr *ngIf="IsConvertShipmentType" style="height:10px;"><td><div></div></td></tr>

    <tr *ngIf="IsConvertShipmentType" style="height:1px;">
        <td colspan="2" class="Value">
            Changing the shipment type will result in deleting all the shipment packages.
        </td>
    </tr>

    <tr *ngIf="IsConvertShipmentType" style="height:10px;"><td><div></div></td></tr>

    <tr class="FormFieldRow" *ngIf="IsNotesStackPanelVisible">
        <td colspan="2">
            <table>
                <tr style="height: 1px;">
                    <td style="color:black">
                        {{NotesHeader}}
                    </td>
                </tr>

                <tr style="height: 90px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 350px; height: 90px;">
                                    <div style="height: 90px;">
                                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'EventNotes'" [IsMultiline]="true" [DataContext]="DataContext"></LogTextBox>
                                    </div>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr><td colspan="2"></td></tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'CancelAction' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'ConfirmAction' | IdGeneratorAsyncPipe | async}}" class="RedButton" (click)="OkButtonClicked()" [disabled]="!EnabledOkButton">Confirm</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
