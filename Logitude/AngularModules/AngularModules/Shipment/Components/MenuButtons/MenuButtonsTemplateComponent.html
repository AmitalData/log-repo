
<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="'true'"></ValidationSummary>
        </td>
    </tr>

    <tr *ngIf="ActionStepsStateList != null && ActionStepsStateList.length > 0" style="height:1px;">

        <td colspan="2" style="vertical-align:top;height:1px">
            <ul style="margin-top:10px" class="SimpleGridViewBody">
                <li *ngFor="let item of ActionStepsStateList" class="SimpleGridViewRow RowHover RowSelected">
                    <table>
                        <tr>
                            <td style="width:10px"></td>
                            <td class="GridViewCell">
                                <div>
                                    {{item.Message}}
                                    <img *ngIf="item.state == 'Error' || item.state == 'Failed'  " src="./Images/SimplogIcons/ErrorIcon.png" width="20" height="20" />
                                    <img *ngIf="item.state == 'Warning' " src="./Images/SimplogIcons/Warning.png" width="20" height="20" />
                                    <img *ngIf="item.state == 'Succeeded' " src="./Images/SimplogIcons/tick.png" width="20" height="20" />

                                </div>

                            </td>

                            <td></td>
                        </tr>
                    </table>


                </li>
            </ul>

        </td>
        <td style="height:50px"><div style="height:50px"></div></td>
    </tr>

    <tr *ngIf="ValidationWarningsList != null && ValidationWarningsList.length > 0" style="height:1px;">
        <td colspan="2">
            <WarningSummary [ItemsSource]="ValidationWarningsList" [SingleLine]="'true'"></WarningSummary>
        </td>
    </tr>

    <tr class="FormFieldRow" *ngIf="IsReasonStackPanel">
        <td style="width: 110px;">
            <LogLabel [Text]="'Decline Reason'" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <LogLov [ObjectFieldName]="'QuoteClosingReasonCode'"
                    [ObjectTableName]="'QuoteClosingReason'"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'Quote'">
            </LogLov>
        </td>
    </tr>

    <tr *ngIf="IsConvertShipmentType" style="height:10px;"><td><div></div></td></tr>

    <tr *ngIf="IsConvertShipmentType" style="height:1px;">
        <td colspan="2" class="Value">
            Changing the shipment type will result in deleting all the shipment packages.
        </td>
    </tr>

    <tr *ngIf="IsConvertShipmentType" style="height:10px;"><td><div></div></td></tr>

    <tr class="FormFieldRow" *ngIf="IsNotesStackPanelVisible">
        <td colspan="2">
            <table>
                <tr style="height: 1px;">
                    <td style="color:black">
                        {{NotesHeader}}
                    </td>
                </tr>

                <tr style="height: 80px;">
                    <td style="width:50%">
                        <div class="FillParent">
                            <LogTextBox [ObjectFieldName]="'EventNotes'" [IsMultiline]="true" [DataContext]="DataContext"></LogTextBox>
                        </div>
                    </td>
                    <td></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr><td colspan="2"></td></tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'CancelAction' | IdGeneratorPipe}}" class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'ConfirmAction' | IdGeneratorPipe}}" class="RedButton" (click)="OkButtonClicked()" [disabled]="!EnabledOkButton">Confirm</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
