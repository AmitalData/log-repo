
<style type="text/css">
    .NotesBox p {
        font-size: 11px;
        color: #6E7172;
        white-space: normal;
        word-wrap: break-word;
        text-wrap: normal;
        text-overflow: ellipsis;
    }

    .NotesBox {
        background: #FFFADC;
        border: 1px solid #AAAAAA;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        padding: 5px;
        line-height: 12px;
        text-align: left;
        overflow-x: hidden;
        overflow-y: scroll;
        margin-right: 36px;
    }

    .SectionTitle > span {
        font-size: 14px;
        user-select: text;
        -webkit-user-select: auto;
    }

    .SectionTitle td {
        font-size: 14px;
        user-select: text;
    }

    .SectionTitle {
        height: 20px;
        line-height: 20px;
        font-size: 14px;
        color: #1B90CB;
        user-select: text;
        -webkit-user-select: text;
    }

    .GreenAddButtonDisabled {
        pointer-events: none;
    }

    .GreenAddButton:hover {
        background: url('./Images/Buttons/AddGreenSolid.png') center center;
        background-size: contain;
    }

    .GreenAddButton {
        width: 12px;
        height: 12px;
        background: url('./Images/Buttons/AddGreenBrush.png') center center;
        background-size: contain;
        cursor: pointer;
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="'true'"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="ScrollViewer" style="padding: 10px; padding-top: 5px; top: 3px; right: 3px; bottom: 3px;">
                <div class="ScrollContent">

                    <!-- Direction -->
                    <div>
                        <div style="height:32px;">
                            <table>
                                <tr>
                                    <td style="font-size:14px; color: #1B90CB; width:115px;">{{'Shipment.F.DirectionId' | TextCodeTranslationPipe}}</td>

                                    <td style="width:110px;" *ngFor="let item of DirectionsList">
                                        <div class="RadioButton">
                                            <input [attr.id]="'DirectionRadio_' + SessionIndex + item.Code" [attr.name]="'DirectionsRadio' + SessionIndex" type="radio" [checked]="DirectionId == item.Code" (click)="DirectionId = item.Code" />
                                            <label [attr.for]="'DirectionRadio_' + SessionIndex + item.Code" style="text-indent: 40px; font-size: 12px" [ngStyle]="{color: DirectionId == item.Code ? '#287828':'#282E30'}">
                                                <img class="LeftCenter" style="margin-left: 20px;" [attr.src]="'./Images/Directions/' + item.Code + '.png'" />
                                                {{item.Name}}
                                            </label>
                                        </div>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>

                        <div style="height:1px; width: 100%; background: #999999; opacity:0.3; margin-top: 5px; margin-bottom: 5px;"></div>
                    </div>

                    <div [ngStyle]="{opacity: ScreenOpacity}">
                        <!-- Shipper -->
                        <div>
                            <div class="SectionTitle">
                                <table>
                                    <tr>
                                        <td>{{'Shipment.F.Shipper' | TextCodeTranslationPipe}}</td>
                                    </tr>
                                </table>
                            </div>

                            <table>
                                <tr class="FormFieldRow">
                                    <td style="width:115px;">
                                        <LogLabel [ObjectFieldName]="FromPartnerIdProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Shipment.S.NewShipment.Name'"></LogLabel>
                                    </td>
                                    <td style="width:220px;">
                                        <LogLov [ObjectFieldName]="FromPartnerIdProperty"
                                                [SelectedValue]="FromPartnerId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Card'"
                                                [DisplayMemberPath]="'EnglishName'"
                                                [DependencyFilter1Value]="CardDependencyProperty1"
                                                [DependencyFilter1IsList]="CardDependencyProperty1IsList">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div class="MediaFill">
                                            <div class="LeftCenter" style="width: 12px; height: 12px;">
                                                <div class="GreenAddButton" [class.GreenAddButtonDisabled]="!IsScreenEnabled" (mousedown)="AddPartnerClicked('S')"></div>
                                            </div>
                                        </div>
                                    </td>

                                    <td style="width:115px;">
                                        <div></div>
                                    </td>
                                    <td style="width:220px;">
                                        <div></div>
                                    </td>
                                </tr>

                                <tr *ngIf="FromPartnerId">
                                    <td colspan="5">
                                        <table>
                                            <tr class="FormFieldRow">
                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'FromAddressIdProperty'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td colspan="2">
                                                    <table>
                                                        <tr>
                                                            <td style="width:202px;">
                                                                <LogLov [ObjectFieldName]="FromAddressIdProperty"
                                                                        [SelectedValue]="FromAddressId"
                                                                        [ObjectTableName]="ObjectTableName"
                                                                        [DataContext]="DataContext"
                                                                        [LookUpTableName]="'Address'"
                                                                        [DependencyFilter1Value]="FromPartnerId"
                                                                        [HideLastColumn]="true"
                                                                        [HideMaintenanceIcon]="true">
                                                                </LogLov>
                                                            </td>

                                                            <td>
                                                                <div style="margin-left: 2px;">
                                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditAddressClicked('S')" [disabled]="!ShipperAddressId || !IsScreenEnabled"></IconButton>
                                                                    <IconButton [Name]="'Add'" [IsSmall]="true" [Left]="3" (click)="AddAddressClicked('S')" [disabled]="!IsScreenEnabled"></IconButton>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>

                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'ShipperContactId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width:220px;">
                                                    <LogLov [ObjectFieldName]="'ShipperContactId'"
                                                            [SelectedValue]="ShipperContactId"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'Contact'"
                                                            [DependencyFilter1Value]="ShipperId">
                                                    </LogLov>
                                                </td>
                                            </tr>

                                            <tr class="FormFieldRow" style="height: 80px;">
                                                <td style="width:115px;">
                                                    <div></div>
                                                </td>

                                                <td style="width:220px;">
                                                    <AddressTemplate [Address]="ShipperAddressList" [Right]="36"></AddressTemplate>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>

                                                <td style="width:115px; vertical-align: top; padding-left: 10px; padding-top: 10px;" class="TextTrimming">
                                                    <label class="Label">{{'Shipment.S.NewShipment.ShipperNotes' | TextCodeTranslationPipe}}</label>
                                                </td>

                                                <td style="width:220px; height: 80px;">
                                                    <div class="NotesBox" style="height: 70px;">
                                                        <p>
                                                            {{EntityPM.ShipperNote}}
                                                        </p>
                                                    </div>
                                                </td>
                                            </tr>

                                            <tr class="FormFieldRow">
                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'ShipperReference1'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width:220px;">
                                                    <LogTextBox [ObjectFieldName]="'ShipperReference1'" [Text]="ShipperReference1" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'ShipperReference2'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width:220px;">
                                                    <LogTextBox [ObjectFieldName]="'ShipperReference2'" [Text]="ShipperReference2" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <div style="height:1px; width: 100%; background: #999999; opacity:0.3; margin-top: 5px; margin-bottom: 5px;"></div>
                        </div>

                        <!-- Consignee -->
                        <div>
                            <div class="SectionTitle">
                                <table>
                                    <tr>
                                        <td>{{'Shipment.F.Consignee' | TextCodeTranslationPipe}}</td>
                                    </tr>
                                </table>
                            </div>

                            <table>
                                <tr class="FormFieldRow">
                                    <td style="width:115px;">
                                        <LogLabel [ObjectFieldName]="ToPartnerIdProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Shipment.S.NewShipment.Name'"></LogLabel>
                                    </td>
                                    <td style="width:220px;">
                                        <LogLov [ObjectFieldName]="ToPartnerIdProperty"
                                                [SelectedValue]="ToPartnerId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Card'"
                                                [DependencyFilter1Value]="CardDependencyProperty1"
                                                [DependencyFilter1IsList]="CardDependencyProperty1IsList">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div class="MediaFill">
                                            <div class="LeftCenter" style="width: 12px; height: 12px;">
                                                <div class="GreenAddButton" [class.GreenAddButtonDisabled]="!IsScreenEnabled" (mousedown)="AddPartnerClicked('C')"></div>
                                            </div>
                                        </div>
                                    </td>

                                    <td style="width:115px;">
                                        <div></div>
                                    </td>

                                    <td style="width:220px;">
                                        <div></div>
                                    </td>
                                </tr>

                                <tr *ngIf="ToPartnerId">
                                    <td colspan="5">
                                        <table>
                                            <tr class="FormFieldRow">
                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="ToAddressIdProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td colspan="2">
                                                    <table>
                                                        <tr>
                                                            <td style="width:202px;">
                                                                <LogLov [ObjectFieldName]="ToAddressIdProperty"
                                                                        [SelectedValue]="ToAddressId"
                                                                        [ObjectTableName]="ObjectTableName"
                                                                        [DataContext]="DataContext"
                                                                        [LookUpTableName]="'Address'"
                                                                        [DependencyFilter1Value]="ToPartnerId"
                                                                        [HideLastColumn]="true"
                                                                        [HideMaintenanceIcon]="true">
                                                                </LogLov>
                                                            </td>

                                                            <td>
                                                                <div style="margin-left: 2px;">
                                                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditAddressClicked('C')" [disabled]="!ConsigneeAddressId || !IsScreenEnabled"></IconButton>
                                                                    <IconButton [Name]="'Add'" [IsSmall]="true" [Left]="3" (click)="AddAddressClicked('C')" [disabled]="!IsScreenEnabled"></IconButton>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>

                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'ConsigneeContactId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width:220px;">
                                                    <LogLov [ObjectFieldName]="'ConsigneeContactId'"
                                                            [SelectedValue]="ConsigneeContactId"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'Contact'"
                                                            [DependencyFilter1Value]="ConsigneeId">
                                                    </LogLov>
                                                </td>
                                            </tr>

                                            <tr class="FormFieldRow" style="height: 80px;">
                                                <td style="width:115px;">
                                                    <div></div>
                                                </td>
                                                <td style="width:220px;">
                                                    <AddressTemplate [Address]="ConsigneeAddressList" [Right]="36"></AddressTemplate>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>

                                                <td style="width:115px; vertical-align: top; padding-left: 10px; padding-top: 10px;" class="TextTrimming">
                                                    <label class="Label">{{'Shipment.S.NewShipment.ConsigneeNotes' | TextCodeTranslationPipe}}</label>
                                                </td>

                                                <td style="width:220px; height: 80px; vertical-align: middle;">
                                                    <div class="NotesBox" style="height: 70px;">
                                                        <p>
                                                            {{EntityPM.ConsigneeNote}}
                                                        </p>
                                                    </div>
                                                </td>
                                            </tr>

                                            <tr class="FormFieldRow">
                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'ConsigneeReference1'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width:220px;">
                                                    <LogTextBox [ObjectFieldName]="'ConsigneeReference1'" [Text]="ConsigneeReference1" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                                <td>
                                                    <div></div>
                                                </td>
                                                <td style="width:115px;">
                                                    <LogLabel [ObjectFieldName]="'ConsigneeReference2'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width:220px;">
                                                    <LogTextBox [ObjectFieldName]="'ConsigneeReference2'" [Text]="ConsigneeReference2" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <div *ngIf="EntityPM.ShipmentLevelCode != 'C'" style="height:1px; width: 100%; background: #999999; opacity:0.3; margin-top: 5px; margin-bottom: 5px;"></div>
                        </div>

                        <!-- Customer -->
                        <div *ngIf="EntityPM.ShipmentLevelCode != 'C'">
                            <div class="SectionTitle" style="height:40px; line-height:40px;">
                                <table>
                                    <tr>
                                        <td style="width:105px;">{{'Shipment.S.NewShipment.MyCustomer' | TextCodeTranslationPipe}}</td>

                                        <td style="width:10px; vertical-align: middle;">
                                            <div style="width: 10px;">
                                                <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;" *ngIf="IsCustomerRequired"></div>
                                            </div>
                                        </td>

                                        <td style="width:220px;">
                                            <LogLov [ObjectFieldName]="'ShipmentCustomerTypeCode'"
                                                    [SelectedValue]="ShipmentCustomerTypeCode"
                                                    [ObjectTableName]="ObjectTableName"
                                                    [DataContext]="DataContext"
                                                    [LookUpTableName]="'ShipmentCustomerType'"
                                                    [DependencyFilter1Value]="true">
                                            </LogLov>
                                        </td>

                                        <td style="width:220px;">
                                            <LogLov [ObjectFieldName]="'CustomerId'"
                                                    [SelectedValue]="CustomerId"
                                                    [ObjectTableName]="ObjectTableName"
                                                    [DataContext]="DataContext"
                                                    [LookUpTableName]="'Card'"
                                                    [DisplayMemberPath]="'EnglishName'"
                                                    [DependencyFilter1Value]="CustomerDependencyProperty1"
                                                    [DependencyFilter1IsList]="CustomerDependencyProperty1IsList"
                                                    [HideAddLink]="true"
                                                    [HideAdd]="true">
                                            </LogLov>
                                        </td>

                                        <td style="width:3px;">
                                            <div></div>
                                        </td>

                                        <td>
                                            <div class="MediaFill">
                                                <div class="LeftCenter" style="width: 12px; height: 12px;">
                                                    <div class="GreenAddButton" [class.GreenAddButtonDisabled]="!IsScreenEnabled" (mousedown)="AddPartnerClicked('T')"></div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div *ngIf="IsOldInlandDomestic" style="height:1px; width: 100%; background: #999999; opacity:0.3; margin-top: 5px; margin-bottom: 5px;"></div>
                        </div>

                        <!-- Ports -->
                        <div *ngIf="IsOldInlandDomestic">
                            <div class="SectionTitle">
                                <table>
                                    <tr>
                                        <td>Main Carriage</td>
                                    </tr>
                                </table>
                            </div>

                            <table>
                                <tr class="FormFieldRow">
                                    <td style="width:115px;">
                                        <LogLabel [ObjectFieldName]="'MainCarriageFromPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="FromTextCode"></LogLabel>
                                    </td>
                                    <td style="width:220px;">
                                        <LogLov [ObjectFieldName]="'MainCarriageFromPortId'"
                                                [SelectedValue]="MainCarriageFromPortId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Port'"
                                                [DependencyFilter1Value]="TransportModeId">
                                        </LogLov>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                    <td style="width:115px;">
                                        <LogLabel [ObjectFieldName]="'MainCarriageToPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="ToTextCode"></LogLabel>
                                    </td>

                                    <td style="width:220px;">
                                        <LogLov [ObjectFieldName]="'MainCarriageToPortId'"
                                                [SelectedValue]="MainCarriageToPortId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Port'"
                                                [DependencyFilter1Value]="TransportModeId">
                                        </LogLov>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="!EnabledOkButton">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
