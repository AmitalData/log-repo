
<style type="text/css">
    .RedInfo {
        padding: 2px 5px;
        border: 1px solid #DA6F6F;
        background: rgba(247, 227, 227, 1);
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        font-size: 12px;
        color: #D8770E;
        height: 24px;
    }
</style>

<table style="height: 24px;">
    <tr>
        <td style="float:left">
            <div class="ShortTitleMainControl" style="float: left;" [ngStyle]="{background: Background}">
                <div class="ShortTitleDiv">
                    <span><img style="vertical-align: middle; margin:0;" [attr.src]="DirectionImageSRC" /></span>
                    <span><img style="vertical-align: middle; margin:0; padding-left: 5px;" [attr.src]="TransportModeImageSRC" /></span>
                </div>

                <div class="ShortTitleDiv" attr.data-cy="{{'ShipmentNumber' | IdGeneratorPipe}}" style="padding-left: 5px; font-size: 18px; color: #1B90CB;">
                    {{EntityPM.ShipmentNumber}}:
                </div>

                <div [title]="PartnerName" class="ShortTitleDiv TextTrimming" style="padding-left: 5px; font-size: 18px; color: #1B90CB; max-width: 180px;">
                    {{PartnerName}}
                </div>

                <div class="ShortTitleDiv" style="padding-left: 5px;" *ngIf="IsRankVisible">
                    <span><img style="width: 20px; height: 20px; vertical-align: middle; margin:0; margin-left: -0px;" [attr.src]="RankSource1" [attr.title]="CustomerRankName" /></span>
                    <span><img style="width: 20px; height: 20px; vertical-align: middle; margin:0; margin-left: -3px;" [attr.src]="RankSource2" [attr.title]="CustomerRankName" /></span>
                    <span><img style="width: 20px; height: 20px; vertical-align: middle; margin:0; margin-left: -3px;" [attr.src]="RankSource3" [attr.title]="CustomerRankName" /></span>
                </div>
            </div>

            <div class="ShortTitleControl" style="float:left; background: red; color: white; margin-left: 5px;" *ngIf="IsCancelled">
                Cancelled
            </div>
        </td>

        <td style="float:left; left:3px;" *ngIf="IsUnassigedValidationVisible">
            <div class="RedInfo">
                <div style="float: left; color:black; font-size:11px;">{{UnassigedValidationMessage}}</div>
                <div style="margin-left: 10px; float: left; width: 50px;">
                    <button class="Button" style="height:18px;" (click)="UpdateUnassigedDataClicked()">Update</button>
                </div>
            </div>
        </td>

        <td>
            <div></div>
        </td>
    </tr>
</table>
