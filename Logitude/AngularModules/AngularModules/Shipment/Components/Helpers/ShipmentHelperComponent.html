
<table style="height: 24px;">

    <tr>

        <td *ngIf="IsSendToCustomVisible" style="padding-left: 10px; padding-right: 5px;">
            <button class="Button" (click)="SendToCustomsClicked()">Send to Customs</button>
        </td>

        <td *ngIf="IsShareManifestButtonVisible" style="padding-right: 5px;width:80px">
            <!--<button [disabled]="EntityPM && EntityPM.IsManifestSentToAgent"  class="Button" (click)="ShareManifestClicked()">Share Manifest</button>-->
            <div style="width:80px" tabindex="0" class="ToggleButton">
                <img style="width:18px;height:18px;margin-right:55px" src="./_Resources/Images/Icons/Share/share.png" />
                <label style="margin-left:18px">Share</label>
                <img src="./Images/ToggleIcon.png" />
                <div style="right:-20px;width:80px" class="ToggleButtonMenu">
                    <button [disabled]="EntityPM && EntityPM.IsManifestSentToAgent" (click)="ShareManifestClicked()">Manifest</button>
                    <button *ngIf="IsShareDocumentsButtonVisible" (click)="ShareDocumentsClicked()">Documents</button>

                </div>
            </div>
        </td>

        <td style="padding-right: 5px;" *ngIf="IsShippingInstructionsVisible">
            <button class="Button" (click)="ShippingInstructionsClicked()">Send Shipping Instructions</button>
        </td>

        <td *ngIf="IsAWBWizardButtonVisible">
            <button class="Button" (click)="AWBButtonClicked()">{{AWBWizardButtonLabel}}</button>
        </td>

        <td style="padding-left: 10px; padding-right: 5px;">
            <HelperNotes [Title]="'Notes'" [EntityTitle]="EntityTitle" [Text]="Notes" (TextChanged)="Notes = $event" [ShipmentPM]="EntityPM"></HelperNotes>
        </td>

        <td *ngIf="IsFollowupsVisible">
            <HelperFollowups [ShipmentPM]="EntityPM"></HelperFollowups>
        </td>

    </tr>
</table>
