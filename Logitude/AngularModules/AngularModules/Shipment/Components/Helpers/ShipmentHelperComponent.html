
<table style="height: 24px;">

    <tr>
        <td *ngIf="IsAnalyzeChampXMLButtonVisible" style="padding-left: 10px; padding-right: 5px;">
            <button class="Button" (click)="AnalyzeChampXMLClicked()">Analyze Champ XML</button>
        </td>

        <td *ngIf="IsSendToCustomVisible" style="padding-left: 10px; padding-right: 5px;">
            <button class="Button" (click)="SendToCustomsClicked()">Send to Customs</button>
        </td>

        <td *ngIf="IsShareManifestButtonVisible" style="padding-right: 5px;width:130px">
            <div style="width:130px" tabindex="0" class="ToggleButton">
                <img style="width:18px;height:18px;margin-right:105px" src="./_Resources/Images/Icons/Share/share.png" />
                <label style="margin-left:20px">Sharing Actions</label>
                <img src="./Images/ToggleIcon.png" />
                <div style="right:-2px;width:130px" class="ToggleButtonMenu">
                    <button [disabled]="EntityPM && EntityPM.IsManifestSentToAgent" (click)="ShareManifestClicked()">Share Manifest</button>
                    <button *ngIf="IsShareDocumentsButtonVisible" (click)="ShareDocumentsClicked()">Share Documents</button>
                    <button [disabled]="EntityPM && !EntityPM.IsManifestSentToAgent" *ngIf="IsUpdateSharedAgentButtonVisible" (click)="UpdateSharedAgentClicked()">Update Shared Agent</button>

                </div>
            </div>
        </td>

        <td style="padding-right: 5px;" *ngIf="IsSendBookingVisible">
            <button class="Button" (click)="SendBookingClicked()">Send e-booking</button>
        </td>

        <td style="padding-right: 5px;" *ngIf="IsShippingInstructionsVisible">
            <button class="Button" (click)="ShippingInstructionsClicked()">Send Shipping Instructions</button>
        </td>

        <td style="padding-right: 5px;" *ngIf="IsSimulatorVisible">
            <button class="Button" (click)="ShipmentContainersSimulatorClicked()">Container Statuses Simulator</button>
        </td>

        <td style="padding-right: 5px;" *ngIf="IsShipmentContainersVisible">
            <button class="Button" (click)="ContainersRequestStatusClicked()">Containers Request Status</button>
        </td>

        <td *ngIf="IsAWBWizardButtonVisible">
            <button class="Button" (click)="AWBButtonClicked()">{{AWBWizardButtonLabel}}</button>
        </td>

        <td *ngIf="IsImportAWBWizardButtonVisible" style="padding-left: 10px; padding-right: 5px;">
            <button class="Button" (click)="AWBImportButtonClicked()">{{AWBImportWizardButtonLabel}}</button>
        </td>

        <td style="padding-left: 10px; padding-right: 5px;">
            <HelperNotes [Title]="'Notes'" [EntityTitle]="EntityTitle" [Text]="Notes" (TextChanged)="Notes = $event" [ShipmentPM]="EntityPM"></HelperNotes>
        </td>

        <td *ngIf="IsFollowupsVisible">
            <HelperFollowups [ShipmentPM]="EntityPM"></HelperFollowups>
        </td>

    </tr>
</table>
