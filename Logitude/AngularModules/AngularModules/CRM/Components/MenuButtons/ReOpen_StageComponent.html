
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="3">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr class="FormFieldRow">
        <td style="width: 120px;vertical-align:bottom">
            <LogLabel [ObjectFieldName]="'StageId'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"></LogLabel>
        </td>
        <td style="width:200px;vertical-align:bottom">
            <LogLov [ObjectFieldName]="'StageId'"
                    [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'Stage'"
                    [SelectedValue]="StageId"
                    [DependencyFilter1Value]="IsSelectable">
            </LogLov>
        </td>
        <td></td>
    </tr>



    <tr style="height: 32px;">
        <td style="vertical-align: bottom" colspan="3">
            <table style="height: 22px;">
                <tr>

                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button id="{{'Cancel-ReOpen' | IdGeneratorPipe}}"  class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'OK-ReOpen' | IdGeneratorPipe}}"  class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>






</table>
