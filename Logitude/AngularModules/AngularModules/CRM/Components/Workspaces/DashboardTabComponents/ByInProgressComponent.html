<style type="text/css">
    .SquareIcon {
        width: 10px;
        height: 10px;
        line-height: 10px;
        -webkit-border-radius: 2px;
        -moz-border-radius: 2px;
        border-radius: 2px;
    }
    .SectionHeader sc td, .SectionHeader sc label{
        font-size:13px
    }

    .amcharts-pie-slice {
  cursor: pointer;
}

</style>
<div class="TabHolder">
    <table>
        <tr style="height:40px">
            <td>
                <table>
                    <tr>
                        <td style="width:20px">
                            <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()"></IconButton>
                        </td>
                        <td></td>                                    
                        <td style="width:150px;">
                            <ComboBox [ItemsSource]="BusinessUnitFilterList" [Binding]="'Name'" [SelectedItem]="SelectedBusinessUnitFilter" (SelectedItemChanged)="SelectedBusinessUnitFilter = $event"></ComboBox>
                        </td>

                        <td style="width:5px;">
                            <div></div>
                        </td>

                        <td style="width:200px;" *ngIf="SelectedBusinessUnitFilter">
                            <ComboBox *ngIf="SelectedBusinessUnitFilter.Code != 'A'" [IsDisabled]="SelectedBusinessUnitFilter.Code == 'M'" [ItemsSource]="UsersFilterList" [Binding]="'Name'" [SelectedItem]="SelectedUserFilter" (SelectedItemChanged)="SelectedUserFilter = $event"></ComboBox>
                            <LogLov *ngIf="SelectedBusinessUnitFilter.Code == 'A'"
                                    [ObjectFieldName]="'ListOfValuesUserId'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'User'"
                                    [HideColumns]="true">
                            </LogLov>
                        </td>
                    </tr>
                </table>
            </td>

        </tr>
        <tr style="min-height:50%">
            <td>
                <table>
                    <tr>
                        <td>
                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <label>Potential Customers by Salesman (Top 10)</label>
                                    </td>
                                </tr>
                                <tr style="height:10px"></tr>
                                <tr>

                                    <td class="CellStretch">

                                        <table>
                                            <tr style="height:1px">
                                                <td>
                                                    <div [attr.id]="NewCustomersDashboardId" style="height:90%;width:100%" class="CellContent" (click)="NewCustomerClicking()"></div>
                                                </td>
                                            </tr>

                                            <tr *ngIf="!NewCustomerDashboardListExistance">
                                                <td style="vertical-align:top">
                                                    <div style="text-align:center;vertical-align:central;margin-top:10px;width:100%;overflow-y:hidden">
                                                        <label style="font-size:small;color:gray;text-align:center;vertical-align:central;width:100%;height:100%">No Customers</label>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>

                                    </td>

                                </tr>
                            </table>
                        </td>

                        <td style="width:10px"></td>

                        <td style="width:350px">
                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <label>Opportunities by Salesman</label>
                                    </td>
                                </tr>
                                <tr style="height:10px"></tr>
                                <tr>

                                    <td class="CellStretch">

                                        <table>
                                            <tr style="height:1px">
                                                <td>
                                                    <table>
                                                        <tr>
                                                            <td>
                                                                <div [attr.id]="NewOpportunitiesDashboardId" style="height:100%;width:100%" class="CellContent" (click)="NewOpportunityClicking()"></div>
                                                            </td>
                                                            <td style="width:100px;min-width:100px;overflow-y:auto">
                                                                <div class="MediaFill">
                                                                    <ScrollViewer [Small]="true">
                                                                        <div [attr.id]="NewOpportunityBySalesmanLegendId" style="position:relative;width:100%;float:left"></div>
                                                                    </ScrollViewer>
                                                                </div>
                                                            </td>

                                                        </tr>
                                                    </table>
                                                </td>                                                   
                                            </tr>

                                            <tr *ngIf="!NewOpportunitiesDashboardIdExistance">
                                                <td style="vertical-align:top">
                                                    <div style="text-align:center;vertical-align:central;margin-top:10px;width:100%;overflow-y:hidden">
                                                        <label style="font-size:small;color:gray;text-align:center;vertical-align:central;width:100%;height:100%">No Opportunities</label>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>

                                    </td>

                                </tr>
                            </table>

                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="min-height:50%">
            <td>
                <table>
                    <tr>
                        <td>

                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <table>
                                            <tr>
                                                <td>
                                                    <label>Activities by Salesman (Top 10)</label>
                                                </td>

                                                <td><div></div></td>

                                                <td style="width: 50px; vertical-align:middle;">
                                                    <div class="SquareIcon" style="background: #DA7B38; display:inline-block;"></div>
                                                    <span style="font-size: 11px; color: #282E30; text-indent: 15px;">Task</span>
                                                </td>

                                                <td style="width: 80px; vertical-align:middle;">
                                                    <div class="SquareIcon" style="background: #21782E; display:inline-block;"></div>
                                                    <span style="font-size: 11px; color: #282E30; text-indent: 15px;">Phone Call</span>
                                                </td>

                                                <td style="width: 90px; vertical-align:middle;">
                                                    <div class="SquareIcon" style="background: #487E9F; display:inline-block;"></div>
                                                    <span style="font-size: 11px; color: #282E30; text-indent: 15px;">Appointment</span>
                                                </td>

                                                <td style="width:5px;"><div></div></td>
                                            </tr>
                                        </table>
                                    </td>




                                </tr>
                                <tr style="height:10px">
                                    <td></td>
                                </tr>
                                <tr>

                                    <td class="CellStretch">

                                        <table>
                                            <tr style="height:1px">

                                                <td>
                                                    <div [attr.id]="NewActivitiesDashboardId" style="height:90%;width:100%" class="CellContent" (click)="NewActivityClicking()"></div>
                                                </td>
                                            </tr>

                                            <tr *ngIf="!NewActivitiesDashboardIdExistance">
                                                <td style="vertical-align:top">
                                                    <div style="text-align:center;vertical-align:central;margin-top:10px;width:100%;overflow-y:hidden">
                                                        <label style="font-size:small;color:gray;text-align:center;vertical-align:central;width:100%;height:100%">No Activities</label>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>

                                    </td>

                                </tr>
                            </table>




                        </td>

                        <td style="width:10px"></td>

                        <td style="width:350px">


                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <label>Quotes by Salesman</label>
                                    </td>
                                </tr>
                                <tr style="height:10px"></tr>
                                <tr>

                                    <td class="CellStretch">

                                        <table>
                                            <tr style="height:1px">
                                                <td>
                                                    <table>
                                                        <tr>
                                                            <td>
                                                                <div [attr.id]="NewQuotesDashboardId" style="height:100%;width:100%" class="CellContent" (click)="NewQuotesClicking()"></div>
                                                            </td>
                                                            <td style="width:100px;min-width:100px;overflow-y:auto">
                                                                <div class="MediaFill">
                                                                    <ScrollViewer [Small]="true">
                                                                        <div [attr.id]="NewQuotesBySalesmanLegendId" style="position:relative;width:100%;float:left"></div>
                                                                    </ScrollViewer>
                                                                </div>
                                                            </td>

                                                        </tr>
                                                    </table>
                                                </td>                                                           
                                            </tr>

                                            <tr *ngIf="!NewQuotesDashboardIdExistance">
                                                <td style="vertical-align:top">
                                                    <div style="text-align:center;vertical-align:central;margin-top:10px;width:100%;overflow-y:hidden">
                                                        <label style="font-size:small;color:gray;text-align:center;vertical-align:central;width:100%;height:100%">No Quotes</label>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>

                                    </td>

                                </tr>
                            </table>


                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
