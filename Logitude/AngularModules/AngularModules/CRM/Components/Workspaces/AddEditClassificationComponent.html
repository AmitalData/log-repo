<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">
                <!-- Name -->
                <tr class="FormFieldRow">
                    <td style="width:110px;">
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:230px;">
                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="DataContext.Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- EmployeeGroupId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'EmployeeGroupId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'EmployeeGroupId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [SelectedValue]="DataContext.EmployeeGroupId"
                                [LookUpTableName]="'EmployeeGroup'" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- DefaultSeverityId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'DefaultSeverityId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'DefaultSeverityId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [SelectedValue]="DataContext.DefaultSeverityId"
                                [LookUpTableName]="'TicketSeverity'" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- ManagerUserId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'ManagerUserId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'ManagerUserId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [SelectedValue]="DataContext.ManagerUserId"
                                [LookUpTableName]="'User'" [HideColumns]="true">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- EscalationNotify -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'EscalationNotify'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:310px;">
                                    <div class="MediaFill">
                                        <EmailSearchTextBox [EmailsText]="DataContext.EscalationNotify" [Watermark]="'Add Users'" [IsUsersList]="true" (EmailsTextChanged)="DataContext.EscalationNotify = $event"></EmailSearchTextBox>
                                    </div>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Inactive -->
                <tr *ngIf="!IsNew" class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogCheckBox [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                    </td>

                    <td> <div></div></td>
                </tr>

                <tr><td colspan="3"><div></div></td></tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
