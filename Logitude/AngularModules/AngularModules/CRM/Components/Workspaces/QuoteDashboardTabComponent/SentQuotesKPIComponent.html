<table>
    <tr>
        <td>
            <div class="MediaFill">
                <SectionBox>
                    <SectionHead>
                        <table>
                            <tr>
                                <td>
                                    <label>Sent Quotes KPI</label>
                                </td>
                            </tr>
                        </table>
                    </SectionHead>
                    <SectionBody>
                        <div  class="MediaFill" [id]="SentQuotesKPIChartID" (mousedown)="OnChartMouseDown($event,'null')">
                            <div *ngIf="!NoQuotesData" class="MediaFill">
                                <div #SentQuotesKPIDashboard></div>
                                <div [attr.id]="SentQuotesKPIDashboardId" style="height:95%;width:100%" (click)="Click_SentQuotesKPIBar()"></div>
                            </div>
                            <div *ngIf="NoQuotesData" class="MediaFill NoDataText">
                                No Sent Quotes
                            </div>
                        </div>
                    </SectionBody>
                </SectionBox>
            </div>
        </td>
    </tr>
</table>
