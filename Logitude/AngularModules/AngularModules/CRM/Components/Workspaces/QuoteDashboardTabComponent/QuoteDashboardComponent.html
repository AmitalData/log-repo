
<div class="TabHolder" style="overflow-x:auto;overflow-y:auto;padding-right:10px">
    <table style="min-width:1200px; min-height:600px">

        <tr style="height:1px;">
            <td>
                <table>
                    <tr>
                        <td style="width:20px">
                            <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()"></IconButton>
                        </td>

                        <td>
                            <div></div>
                        </td>

                        <td style="width:550px">
                            <table>
                                <tr>
                                    <td style="width:80px">
                                        Create Date
                                    </td>

                                    <td style="width:3px">
                                        <div></div>
                                    </td>

                                    <td>
                                        <ComboBox [ItemsSource]="DateFilterList" [Binding]="'Name'" [SelectedItem]="SelectedDateFilter" (SelectedItemChanged)="SelectedDateFilter = $event"></ComboBox>
                                    </td>

                                    <td style="width:3px">
                                        <div></div>
                                    </td>

                                    <td style="width:120px">
                                        <LogDatePicker [NoObjectField]="true" [SelectedDateValue]="FromDate" [HideColumns]="true" [ObjectFieldName]="'FromDate'" [DataContext]="DataContext"></LogDatePicker>
                                    </td>

                                    <td style="width:3px">
                                        <div></div>
                                    </td>

                                    <td style="width:120px">
                                        <LogDatePicker [NoObjectField]="true" [SelectedDateValue]="ToDate" [HideColumns]="true" [ObjectFieldName]="'ToDate'" [DataContext]="DataContext"></LogDatePicker>
                                    </td>

                                    <td style="width:3px">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <td style="width:5px;">
                            <div></div>
                        </td>

                        <td style="width:150px;">
                            <ComboBox [ItemsSource]="BusinessUnitFilterList" [Binding]="'Name'" [SelectedItem]="SelectedBusinessUnitFilter" (SelectedItemChanged)="SelectedBusinessUnitFilter = $event"></ComboBox>
                        </td>

                        <td style="width:5px;">
                            <div></div>
                        </td>

                        <td style="width:200px;" *ngIf="SelectedBusinessUnitFilter">
                            <ComboBox *ngIf="SelectedBusinessUnitFilter.Code != 'A'" [IsDisabled]="SelectedBusinessUnitFilter.Code == 'M'" [ItemsSource]="UsersFilterList" [Binding]="'Name'" [SelectedItem]="SelectedUserFilter" (SelectedItemChanged)="SelectedUserFilter = $event"></ComboBox>
                            <LogLov *ngIf="SelectedBusinessUnitFilter.Code == 'A'"
                                    [ObjectFieldName]="'ListOfValuesUserId'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'User'"
                                    [HideColumns]="true">
                            </LogLov>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 10px;">
            <td>
                <div></div>
            </td>
        </tr>

        <tr>
            <td>
                <div class="MediaFill">
                    <table>
                        <tr>
                            <!--Open Quote by Stage-->
                            <td style="width:33%;">
                                <div class="MediaFill">
                                    <div class="LocationDirective" LocationDirective Code="OQS"></div>
                                </div>
                            </td>

                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <!--Quote Conversion-->
                            <td>
                                <div class="MediaFill">
                                    <div class="LocationDirective" LocationDirective Code="QCV"></div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>

        <tr style="height: 5px;">
            <td>
                <div></div>
            </td>
        </tr>

        <tr>
            <td>
                <div class="MediaFill">
                    <table>
                        <tr>
                            <!--Quotes by Countries-->
                            <td>
                                <div class="MediaFill">
                                    <div class="LocationDirective" LocationDirective Code="QOC"></div>
                                </div>
                            </td>

                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td>
                                <div class="MediaFill">
                                    <div class="LocationDirective" LocationDirective Code="TFS"></div>
                                </div>
                            </td>

                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td>
                                <div class="MediaFill">
                                    <div class="LocationDirective" LocationDirective Code="KPI"></div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>
</div>
