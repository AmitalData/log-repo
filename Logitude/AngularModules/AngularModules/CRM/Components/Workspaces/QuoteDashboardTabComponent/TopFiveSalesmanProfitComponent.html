<table>
    <tr>
        <td>
            <div class="MediaFill" style="min-width: 450px;">
                <ScrollViewer [Small]="true">
                    <SectionBox>
                        <SectionHead>
                            <table>
                                <tr class="SectionHeader" style="height:27px">
                                    <td>
                                        <label>Top 5 Salesmen (Profit)</label>
                                    </td>
                                    <td></td>

                                    <td style="width:80px">
                                        <ul class="FiltersMenu">
                                            <li (click)="ChangeCurrency(ProfitCurrencyCode)" [class.SelectedFilter]="SelectedCurrency === '2'" style="width:33px;">
                                                {{ProfitCurrencyCode}}
                                            </li>
                                            <li (click)="ChangeCurrency(LocalCurrencyCode)" [class.SelectedFilter]="SelectedCurrency === '1'" style="width:33px;">
                                                {{LocalCurrencyCode}}
                                            </li>
                                        </ul>
                                    </td>

                                </tr>
                            </table>
                        </SectionHead>
                        <SectionBody>
                            <table>
                                <tr>
                                    <td>
                                        <div class="MediaFill">
                                            <table>
                                                <tr>
                                                    <td>
                                                        <div class="MediaFill">
                                                            <div [attr.id]="PerformanceChartId" class="MediaFill"></div>
                                                        </div>                                                        
                                                    </td>
                                                </tr>

                                                <tr style="height:60px !important;">
                                                    <td>
                                                        <div class="MediaFill">
                                                            <div [attr.id]="LegendDiv" class="MediaFill"></div>
                                                        </div>                                                        
                                                    </td>
                                                </tr>
                                            </table>

                                            <div *ngIf="IsNoDataVisible" class="NoDataText">No Data</div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </SectionBody>
                    </SectionBox>
                </ScrollViewer>
            </div>            
        </td>
    </tr>
</table>
