
<table>
    <tr>
        <td>
            <div class="MediaFill">
                <SectionBox>
                    <SectionHead>
                        <table>
                            <tr>
                                <td>
                                    <label>Quote Conversion by Product</label>
                                </td>
                            </tr>
                        </table>
                    </SectionHead>

                    <SectionBody>
                        <table>
                            <tr style="height:1px">
                                <td>
                                    <table>
                                        <tr>
                                            <td>
                                                <div style="cursor:pointer;" [attr.id]="QuoteConversionId" class="MediaFill" (click)="BarClicking()"></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr *ngIf="NoQuotes">
                                <td class="NoDataText">
                                    No Quotes
                                </td>
                            </tr>
                        </table>
                    </SectionBody>
                </SectionBox>
            </div>
        </td>
    </tr>
</table>
