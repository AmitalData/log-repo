<style type="text/css">
    .SquareIcon {
        width: 15px;
        height: 15px;
        line-height: 10px;
        -webkit-border-radius: 2px;
        -moz-border-radius: 2px;
        border-radius: 2px;
    }
</style>

<table>
    <tr>
        <td>
            <div class="MediaFill">
                <SectionBox>
                    <SectionHead>
                        <table>
                            <tr>
                                <td>
                                    <label>Quote Conversion by Salesman/Product</label>
                                </td>
                            </tr>
                        </table>
                    </SectionHead>

                    <SectionBody>
                        <div class="MediaFill" [id]="ChartID" (mousedown)="OnMyMouseDown($event,'null')">
                            <div class="MediaFill">
                                <table>
                                    <tr style="height:100%;width:100%">
                                        <td>
                                            <div [attr.id]="QuoteConversionId" style="height:95%;width:100%" (click)="BarClicking()"></div>
                                        </td>

                                        <!--<td style="width:60px;">
                                            <div class="MediaFill">
                                                <ScrollViewer [Small]="true">
                                                    <div [attr.id]="legenddiv" style="width:100%;"></div>
                                                </ScrollViewer>
                                            </div>
                                        </td>-->
                                    </tr>

                                    <tr style="height:25px;">
                                        <td>
                                            <table>
                                                <tr>
                                                    <td style="width:20px;">
                                                        <div>
                                                        </div>
                                                    </td>

                                                    <td style="width: 60px; vertical-align:middle;" *ngFor="let item of ProductTypes">
                                                        <div class="SquareIcon" style="display:inline-block;" [ngStyle]="{background: chartColrs['Color_' + item]}"></div>
                                                        <span style="width:45px; max-width:45px; font-size: 11px; color: #282E30; text-indent: 15px;" class="TextTrimming">{{item}}</span>
                                                    </td>

                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>                                        
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </SectionBody>
                </SectionBox>
            </div>
        </td>
    </tr>
</table>
