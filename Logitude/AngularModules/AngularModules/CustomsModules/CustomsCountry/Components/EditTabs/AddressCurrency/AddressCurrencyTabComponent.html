<style>
    .FormFieldRow {
        height: 30px;
    }

    .subTitle {
        color: #1b90cb;
        font-size: 15px;
        padding-top: 10px;
        padding-bottom: 2px;
    }
</style>
<table *ngIf="isLoad">
    <tr *ngIf="ValdationErrorList != null && ValdationErrorList.length > 0" style="height:1px;">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValdationErrorList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <div class="TableHolder">
                <table>

                    <!-- Toolbar-->
                    <tr>
                        <td colspan="2">
                            <div class="subTitle">{{'Customs.AddressCurrency.O.CurrencyType' | TextCodeTranslationPipe}}</div>
                        </td>
                        <td style="display:flex;justify-content: end;align-items: center;">
                          
                           
                            <div style="margin-left: 5px;">
                              <button class="RedButton" style="height:21px" (click)="OkButtonClicked()">{{'General.B.Save' | TextCodeTranslationPipe}} מטבעות ארץ</button>
                           </div> 
                           <div>
                             <IconButton [Name]="'Add'" [IsSmall]="false" (click)="AddButonClicked()"></IconButton>
                           </div> 
                        </td>                       
                    </tr>
                   
                    <!-- Grid -->
                    <tr>
                        <td colspan="3" style="height: 100%;">

                            <div style="height: 100%;">

                                <table style="height: 100%;">
                                    <tr>
                                        <td>
                                            <!-- Grid -->
                                            <table>

                                                <tr>
                                                    <td colspan="2" style="height: 100%;">
                                                        <div class="CellContent">
                                                            <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                                                [ItemSource]="AddressCurrencyList">



                                                                <!-- LineNumber -->
                                                                <log-column
                                                                    [header]="'Customs.AddressCurrency.F.LineNumber' | TextCodeTranslationPipe"
                                                                    [width]="'180'" [Alignment]="'right'"
                                                                    [binding]="'LineNumber'">
                                                                    <ng-template let-item>
                                                                        <log-cell-template #logcelltemplate>
                                                                            <div style="text-align: right;"
                                                                                class="TextTrimming"
                                                                                >
                                                                                <span>{{item.LineNumber}}</span>
                                                                            </div>
                                                                    
                                                                        </log-cell-template>
                                                                    </ng-template>
                                                                </log-column>
                                                                <!-- Currency -->
                                                                <log-column
                                                                    [header]="'Customs.AddressCurrency.F.Currency' | TextCodeTranslationPipe"
                                                                    [width]="'130'" [Alignment]="'right'"
                                                                    [binding]="'Currency'">
                                                                    <ng-template let-item>
                                                                        <log-cell-template #logcelltemplate>
                                                                            <div style="text-align: right;"
                                                                                class="TextTrimming"
                                                                                *ngIf="logcelltemplate.IsDisplayMode">
                                                                                <span>{{item.CurrencyTypeName}}</span>
                                                                            </div>
                                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                                <LogLov
                                                                                    [ObjectFieldName]="'Currency'"
                                                                                    [ObjectTableName]="'Customs.AddressCurrency'"
                                                                                    [DataContext]="item"
                                                                                    [HideColumns]="true"
                                                                                    [LookUpTableName]="'Customs.CurrencyType'"
                                                                                    (SelectedItemChanged)="item.SetLocalName($event, 'CurrencyTypeName')"
                                                                                    [FocusOnMe]="true">
                                                                                </LogLov>

                                                                            </div>
                                                                        </log-cell-template>
                                                                    </ng-template>
                                                                </log-column>
                                                                <!-- Buttons -->
                                                                <log-column [width]="'40'" [Alignment]="'right'">
                                                                    <ng-template let-item>
                                                                        <log-cell-template [TabIndex]="-1"
                                                                            [IgnoreMods]="true">
                                                                            <span class="CellSeparator"
                                                                                [style.float]="'right'"></span>
                                                                            <IconButton [Name]="'Delete'"
                                                                                [IsSmall]="true"
                                                                                (click)="RemoveRow(item)"
                                                                                style="display: block; float: right; margin-right:3px; margin-top:2px;">
                                                                            </IconButton>
                                                                        </log-cell-template>
                                                                    </ng-template>
                                                                </log-column>

                                                            </logitude-edit-grid>
                                                        </div>

                                                    </td>
                                                </tr>

                                            </table>

                                        </td>
                                    </tr>
                                </table>

                            </div>
                        </td>
                    </tr>

                    <!-- footer -->
                   

                </table>
            </div>
        </td>
    </tr>

</table>
