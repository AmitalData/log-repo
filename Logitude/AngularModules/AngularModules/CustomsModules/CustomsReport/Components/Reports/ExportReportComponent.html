<style>
    .tbl1Label {
        width: 130px;
    }

    .tbl1Col0 {
        width: 1px;
    }

    .tbl1Col1 {
        width: 200px;
        padding-right: 26px;
    }

    .tbl1Col1Time {
        padding-right: 15px;
    }

    .tbl1LastCol {
        width: 3px;
    }

    .tbl2Label {
        width: 130px;
    }

    .tbl3Label {
        width: 150px;
    }

    .my-checkbox-class {

        color: rgb(138, 138, 92);
    }
    .btnS{
        top: 200px;
    position: relative;
    }
</style>
<div>
    <table>
        <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
            <td colspan="4" style="padding: 3px;">
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>
        <tr *ngIf="ValidationErrorsList == null" style="height: 30px;">
            <td>
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'FromExport'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [Text]="'מתאריך'">
                </LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromExport'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 20px;">
                <div></div>
            </td>
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'ToDateExport'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                    [Text]="'עד תאריך'"></LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDateExport'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 10px;"> 
                <div></div>
            </td>
        </tr>
       
        <tr class="btnS">
            <td colspan="6">
                <div></div>
            </td>
            <td>
                <table>
                    <tr>
                           
                        <td width="57px">
                            <button class="Button" [disabled]="!ExportAsExcelButtonIsEnabled"
                                (click)="ExportExcel()"><img class="CenterCenter" title="Export To Excel"
                                    src="./Images/Buttons/excelicon.png" /></button>
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>
                        <td width="57px">
                            <button class="Button" (click)="CancelButtonClicked()">סגור</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
