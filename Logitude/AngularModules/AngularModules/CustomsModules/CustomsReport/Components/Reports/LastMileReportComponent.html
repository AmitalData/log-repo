<style>
    .tbl1Label {
        width: 120px;
    }

    .tbl1Col0 {
        width: 30px;
    }

    .tbl1Col1 {
        width: 200px;
        padding-right: 36px;
    }

    .tbl1Col1Time {
        padding-right: 15px;
    }

    .tbl1LastCol {
        width: 3px;
    }

    .tbl2Label {
        width: 130px;
    }

    .tbl3Label {
        width: 150px;
    }

    .my-checkbox-class {

        color: rgb(138, 138, 92);
    }
</style>
<div *ngIf="EntityResource">
    <table>
        <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
            <td colspan="4" style="padding: 3px;">
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>
        <tr *ngIf="ValidationErrorsList == null" style="height: 30px;">
            <td>
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'FromLastMile'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [TextCode]="'Customs.DeclarationCourierStatus.O.FromLastMile'">
                </LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromLastMile'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 20px;">
                <div></div>
            </td>
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'ToDateLastMile'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                    [TextCode]="'Customs.DeclarationCourierStatus.O.ToDateLastMile'"></LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDateLastMile'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 10px;">
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'FromDateHatra'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [TextCode]="'Customs.DeclarationCourierStatus.O.FromDateHatra'">
                </LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDateHatra'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 20px;">
                <div></div>
            </td>
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'ToDateHatra'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [TextCode]="'Customs.DeclarationCourierStatus.O.ToDateHatra'">
                </LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDateHatra'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 10px;">
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [ObjectFieldName]="'Trucker'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"></LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <td class="tbl1Col1">
                <LogLov [ObjectFieldName]="'Trucker'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                    [SelectedValue]="Trucker" [DisplayMemberPath]="'LocalName'" [HideAddLink]="true"
                    [LookUpTableName]="'Card'" [DependencyFilter1Value]="'TR'"
                    [DisplayFieldsFromList]="'Code,LocalName'" [HideColumns]="true" [RunToggleMode]="true">
                </LogLov>
            </td>

        </tr>
        <tr>
            <td>
                <div style="height: 50px;"></div>
            </td>
        </tr>
        <tr>
            <td>
                <div></div>
            </td>
            <td>
                <div></div>
            </td>
            <td>
                <table>
                    <tr>
                        <td style="width: 10px;">
                            <div></div>
                        </td>
                        <td width="57px">
                            <button class="Button" [disabled]="!ExportAsExcelButtonIsEnabled"
                                (click)="ExportExcel()"><img class="CenterCenter" title="Export To Excel"
                                    src="./Images/Buttons/excelicon.png" /></button>
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>
                        <td width="57px">
                            <button class="Button" (click)="CancelButtonClicked()">סגור</button>
                        </td>
                        <td style="width: 10px;">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
            <td>
                <div></div>
            </td>
        </tr>
    </table>
</div>
