<style>
    .tbl1Label {
        width: 100px;
    }

    .tbl1Col0 {
        width: 50px;
    }

    .tbl1Col1 {
        width: 200px;
        padding-right: 36px;
    }

    .tbl1Col1Time {
        padding-right: 15px;
    }

    .tbl1LastCol {
        width: 3px;
    }

    .tbl2Label {
        width: 130px;
    }

    .tbl3Label {
        width: 150px;
    }

    .my-checkbox-class {

        color: rgb(138, 138, 92);
    }
</style>
<div *ngIf="EntityResource">
    <table>
        <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
            <td colspan="4" style="padding: 3px;">
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>
        <tr *ngIf="ValidationErrorsList == null"style="height: 30px;">
            <td>
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'FromRequestCreateDate'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                    [TextCode]="'Customs.DeclarationCourierStatus.O.FromDateLanding'"></LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromRequestCreateDate'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 20px;">
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'ToRequestCreateDate'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                    [TextCode]="'Customs.DeclarationCourierStatus.O.ToDateLanding'"></LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <!--style="width: 180px; padding-right: 15px;"-->
            <td class="tbl1Col1">
                <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToRequestCreateDate'"
                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                    [HideColumns]="true"></LogDatePicker>

            </td>
            <td style="width: 10px;">
                <div></div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'Integrator'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [TextCode]="'Customs.DeclarationCourierStatus.O.Integrator'"></LogLabel>
            </td>
            <td class="tbl1Col0">
                <div></div>
            </td>
            <td colspan="2">
                <div style="padding-right: 35px;">
                    <LogLov [ObjectFieldName]="'Integrator'" [ObjectTableName]="'Customs.Declaration'"
                        [DataContext]="DataContext" [DependencyFilter1Value]="'CS'" [LookUpTableName]="'Card'"
                        [DisplayFieldsFromList]="'Code,LocalName,EnglishName,CityName,CountryName,PartnerTypeName'">
                    </LogLov>
                </div>
            </td>
        </tr>
        <tr class="FormFieldRow">
            <td class="tbl1Label">
                <LogLabel [NoObjectField]="true" [ObjectFieldName]="'ReportType'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext" [TextCode]="'Customs.DeclarationCourierStatus.O.ReportType'"></LogLabel>
            </td>
            <td class="tbl1Col0"></td>
            <td class="tbl1Col1">
                <ComboBox [ItemsSource]="_ReportTypes" [SelectedItem]="SelectedReportType" [Binding]="'Value'"
                    (SelectedItemChanged)="KeywordtypeCodeClicked($event.Key)"></ComboBox>
            </td>
        </tr>
        <tr>
            <td>
                <div style="height: 50px;"></div>
            </td>
        </tr>
        <tr>
            <td>
                <div></div>
            </td>
            <td>
                <div></div>
            </td>
            <td>
                <table>
                    <tr>
                        <td style="width: 10px;">
                            <div></div>
                        </td>
                        <td width="57px">
                            <button class="Button" [disabled]="!ExportAsExcelButtonIsEnabled" (click)="ExportExcel()"><img class="CenterCenter" title="Export To Excel" src="./Images/Buttons/excelicon.png" /></button>
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>
                        <td width="57px">
                            <button class="Button" (click)="CancelButtonClicked()">סגור</button>
                        </td>   
                        <td style="width: 10px;">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
            <td>
                <div></div>
            </td>
        </tr>
    </table>
</div>
