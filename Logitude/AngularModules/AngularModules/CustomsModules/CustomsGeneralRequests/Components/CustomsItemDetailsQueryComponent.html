











<!-- DeclarationStatusComponent view  -->
<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 3px 3px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }

    .LogLovContainer {
        height: 100%;
        width: 100%;
        background: white;
        font-size: 11px;
        color: #45494A;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
    }

    .LogLOVControl {
        display: block;
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        line-height: 22px;
        width: 100%;
        position: relative;
    }

    .LogLovInputDiv {
        height: 100%;
        width: 100%;
        line-height: 22px;
        width: 100%;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        text-decoration: none;
        vertical-align: middle;
    }
</style>

<div>

    <custom-message-wrapper [CustomSendOptionsButtonCanForcePersonalSign]="false" >

        <!-- Request -->
        <div class="class-request-content">
            <table style="width: 400px;height: 46px;padding-top: 10px;">
                <!-- Request Fields -->
                
               

                <!--ByDeclarationRadio-->
                <tr class="FormFieldRow"   style="width: 90% ; height : 55%">
                    <td>
                        <table style="width: 370px; ">
                            <tr class="FormFieldRow">
                                <td style="width: 100px">
                                    <LogLabel [NoObjectField]="true" [ObjectFieldName]="'ValidToDate'"
                                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'תאריך שליפה'">
                                </LogLabel>                                </td>
                                <td style="width: 120px; ">
                                    <!-- Request.ValidToDate-->
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ValidToDate'"
                                    [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext"
                                    [HideColumns]="true"></LogDatePicker>
                                </td>

                                <td><div></div></td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 100px">
                                    <LogLabel [NoObjectField]="true" [ObjectFieldName]="'CustomsBookType'"
                                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'סוג ספר מכס'">
                                </LogLabel>                                </td>
                                <td style="width: 120px; ">
                                    <!-- Request.DeclarationNumber-->
                                    <LogLov [ObjectFieldName]="'CustomsBookType'" [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext" [HideColumns]="true"
                                    [LookUpTableName]="'Customs.CustomsBookType'" [DisplayMemberPath]="'LocalName'">
                                </LogLov>

                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 100px">
                                    <LogLabel [Text]="'פרט מכס'" [ObjectFieldName]="'Classification'" [NoObjectField]="true"
                                    #logcelltemplate [ObjectTableName]="'Customs.Classification'" [DataContext]="DataContext">
                                </LogLabel>                            </td>
                                <td style="width: 120px;">
                                    <!-- Request.Classification-->
                                    <LogTextBox [ObjectFieldName]="'Classification'" [InputType]="'text'" #ClassificationTextBox
                                    [DataContext]="DataContext" [ObjectTableName]="'Customs.Classification'"
                                    [HideColumns]="true"
                                    (LostFocus)="OnClassificationLostFocus(logcelltemplate,ClassificationTextBox)"
                                    (KeyUp)="ClassificationKeyUp($event,logcelltemplate,ClassificationTextBox)"
                                    [Text]="Classification"></LogTextBox>
                               

                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                
               
                
                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

        <!-- Response -->
        <div class="class-response-content">
            <table style="width: 400px;height: 250px;padding-top: 10px;">

              
                

                <tr class="FormFieldRow" style="width: 100% ; height : 55%">
                    <td style="width: 400px;">
                        <table>
                            <tr class="FormFieldRow" style="height:15px">
                                <td><div></div></td>
                            </tr>
                            <tr class="FormFieldRow">
                                <!-- CustomsBookTypeName -->
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'CustomsBookTypeName'" [DataContext]="DataContext"
                                    [Text]="'שם ספר מכס'"> </LogLabel>                                </td>
                                <td style="width: 200px;">
                                    <LogTextBox [ObjectFieldName]="'CustomsBookTypeName'" [Text]="CustomsBookTypeName"
                                    [DataContext]="DataContext"> </LogTextBox>
                                </td>

                                <td><div></div></td>

                                                             

                                <td><div></div></td>
                            </tr>
                            <tr class="FormFieldRow">
                              

                                <!-- FullClassification -->
                                <td style="width: 90px;">
                                    <LogLabel [ObjectFieldName]="'FullClassification'" [DataContext]="DataContext"
                                    [Text]="'פרט מכס'"> </LogLabel>                                </td>
                                <td style="width: 150px;">
                                    <LogTextBox [ObjectFieldName]="'FullClassification'" [Text]="FullClassification"
                                    [DataContext]="DataContext"> </LogTextBox>                                </td>

                                <td><div></div></td>
                            </tr>
                            

                            <tr class="FormFieldRow">
                                <!-- GoodsDescription -->
                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'GoodsDescription'" [DataContext]="DataContext"
                                    [Text]="'תאור'"> </LogLabel>                                </td>
                                <td  style="width: 150px
                                ">
                                    <LogTextBox [ObjectFieldName]="'GoodsDescription'" [Text]="GoodsDescription"
                                    [DataContext]="DataContext" [IsMultiline]="true"> </LogTextBox>                                </td>


                               
                                <td><div></div></td>
                                <!-- <td rowspan="2" style="vertical-align: top;padding-top: 2px;">
                                    <LogTextBox [ObjectFieldName]="'CargoDescription'"
                                        [ObjectTableName]="'Customs.Consignment'" [HideColumns]="true"
                                        [IsMultiline]="true" [DataContext]="DataContext"></LogTextBox>
                                </td> -->

                               
                            </tr>

                            <tr class="FormFieldRow" style="height: 10px;">
                               

                               
                            </tr>
                            <tr class="FormFieldRow">
                               

                                <!-- StatisticMeasurementUnitCode -->
                                <td style="width: 90px;">
                                    <LogLabel [ObjectFieldName]="'StatisticMeasurementUnitCode'" [DataContext]="DataContext"
                                    [Text]="'קוד יחידת מידה'"> </LogLabel>                                </td>
                                <td style="width: 150px;">
                                    <LogTextBox [ObjectFieldName]="'StatisticMeasurementUnitCode'"
                                    [Text]="StatisticMeasurementUnitCode" [DataContext]="DataContext"> </LogTextBox>                                </td>

                                <td><div></div></td>
                            </tr>
                           
                           
                            

                            <tr class="FormFieldRow">
                                <!-- IsDiscountCode -->
                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'IsDiscountCode'" [DataContext]="DataContext"
                                    [Text]="'פרט הינו קוד הנחה'"> </LogLabel>                                </td>
                                <td style="width: 150px;">
                                    <LogCheckBox [ObjectFieldName]="'IsDiscountCode'"  [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                </td>

                                <td><div></div></td>
                            </tr>

                            <tr><td><div></div></td></tr>
                        </table>
                    </td>
                </tr>

               
                
            </table>
        </div>
        

    </custom-message-wrapper>
</div>
