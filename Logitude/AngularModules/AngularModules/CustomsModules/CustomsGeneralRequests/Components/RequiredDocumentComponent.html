<style>
    .MyTB {
        width: 200px;
        padding-right: 6px;
    }
</style>
<div>

    <!-- RequiredDocumentComponent  view-->
    <custom-message-wrapper [CustomSendOptionsButtonCanForcePersonalSign]="false"
                            [IsShowCustomResponseContent]="false"
                            [IsShowCustomToolBar]="false">
        <div class="class-request-content">
            <div style="width: 350px; height:300px; padding-top: 10px;">
                <fieldset disabled>

                    <table>

                        <tr *ngIf="VerificationDecisionType != '4'" style="width: 100%;height:25px;">
                            <td colspan="4" style="width: 300px; font-size: 13px; color: green;">
                                {{Title}}
                            </td>
                        </tr>
                        <tr *ngIf="VerificationDecisionType == '4'" style="width: 100%;height:25px;">
                            <td colspan="4" style="width: 300px; font-size: 13px; color: red;">
                                {{Title}}
                            </td>
                        </tr>

                        <tr *ngIf="DocumentTypeVisibility == 'Visible'" class="FormFieldRow">
                            <td style="width: 130px">
                                <LogLabel [NoObjectField]="true"
                                          [ObjectFieldName]="'DocumentTypeName'"
                                          [ObjectTableName]="ObjectTableName"
                                          [DataContext]="DataContext"
                                          [TextCode]="'Customs.GuaranteeFileFilterQuery.F.DocumentTypeName'">
                                </LogLabel>
                            </td>
                            <td style="width:5px"></td>

                            <td class="MyTB">
                                <LogTextBox [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [ObjectFieldName]="'DocumentTypeName'"
                                            [Text]="DocumentTypeName"></LogTextBox>
                            </td>

                            <td> <div></div> </td>
                        </tr>

                        <tr class="FormFieldRow">
                            <td style="width: 130px">
                                <LogLabel [NoObjectField]="true"
                                          [ObjectFieldName]="'DocumentNumber'"
                                          [ObjectTableName]="ObjectTableName"
                                          [DataContext]="DataContext"
                                          [TextCode]="'Customs.AddAttachmentResponse.O.CustomDocument'">
                                </LogLabel>
                            </td>
                            <td style="width:10px"></td>

                            <td class="MyTB">
                                <LogTextBox [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [ObjectFieldName]="'DocumentNumber'"
                                            [Text]="DocumentNumber"></LogTextBox>
                            </td>

                            <td> <div></div> </td>
                        </tr>

                        <tr class="FormFieldRow">
                            <td style="width: 130px">
                                <LogLabel [NoObjectField]="true"
                                          [ObjectFieldName]="'DocumentWorkerName'"
                                          [ObjectTableName]="ObjectTableName"
                                          [DataContext]="DataContext"
                                          [TextCode]="'Customs.RequiredDocumentResponse.O.DocumentWorkerName'">

                                </LogLabel>
                            </td>
                            <td style="width:10px"></td>

                            <td class="MyTB">
                                <LogTextBox [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [ObjectFieldName]="'DocumentWorkerName'"
                                            [Text]="DocumentWorkerName"></LogTextBox>
                            </td>

                            <td> <div></div> </td>
                        </tr>

                        <tr class="FormFieldRow">
                            <td style="width: 130px">
                                <LogLabel [NoObjectField]="true"
                                          [ObjectFieldName]="'Remarks'"
                                          [ObjectTableName]="ObjectTableName"
                                          [DataContext]="DataContext"
                                          [TextCode]="'Customs.RequiredDocumentResponse.O.CustomRemarks'">

                                </LogLabel>
                            </td>
                            <td style="width:10px"></td>

                            <td class="MyTB">
                                <LogTextBox [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [ObjectFieldName]="'Remarks'"
                                            [Text]="Remarks"></LogTextBox>
                            </td>

                            <td> <div></div> </td>
                        </tr>

                        <tr *ngIf="ReplacingDocumentIdVisibility != 'Collapsed'" class="FormFieldRow">
                            <td style="width: 130px">
                                <LogLabel [NoObjectField]="true"
                                          [ObjectFieldName]="'ReplacingDocumentId'"
                                          [ObjectTableName]="ObjectTableName"
                                          [DataContext]="DataContext"
                                          [Text]="'סימוכין מסמך נדרש מחליף'">
                                </LogLabel>
                            </td>
                            <td style="width:10px"></td>

                            <td class="MyTB">
                                <LogTextBox [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [ObjectFieldName]="'ReplacingDocumentId'"
                                            [Text]="ReplacingDocumentId"></LogTextBox>
                            </td>

                            <td> <div></div> </td>
                        </tr>

                        <!--Connected Entities-->
                        <tr style="width: 100%;height:25px;">
                            <td style="width: 130px; font-size: 13px; color: #1B90CB;">
                                {{'Customs.RequiredDocumentResponse.O.ConnectedEntities'| TextCodeTranslationPipe}}
                            </td>
                        </tr>
                        <tr class="FormFieldRow" style="height: 70px; width: 100%; top: 10px;">
                            <td colspan="4">
                                <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="DocumentConnectedEntitiesList">

                                        <!-- EntityTypeName -->
                                        <log-column [header]="'סוג ישות'"
                                                    [binding]="'EntityTypeName'" [width]="'100'" [Alignment]="'right'">
                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                <div class="TextTrimming" style="text-align:right">
                                                    <span>{{item.EntityTypeName}}</span>
                                                </div>
                                            </log-cell-template>
</ng-template>
                                        </log-column>

                                        <!-- EntityNumber -->
                                        <log-column [header]="'מספר ישות'"
                                                    [binding]="'EntityNumber'" [width]="'150'" [Alignment]="'right'">
                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                <div class="TextTrimming" style="text-align:right">
                                                    <span>{{item.EntityNumber}}</span>
                                                </div>
                                            </log-cell-template>
</ng-template>
                                        </log-column>


                                    </logitude-edit-grid>
                                </div>
                            </td>
                        </tr>

                        <tr><td></td><td></td></tr>
                    </table>

                </fieldset>
            </div>
        </div>

        <div class="class-response-ToolBar" style="height:22px;">
            <div style="width: 57px;margin-left:10px;float: left;">
                <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
            </div>
        </div>

    </custom-message-wrapper>




</div>
