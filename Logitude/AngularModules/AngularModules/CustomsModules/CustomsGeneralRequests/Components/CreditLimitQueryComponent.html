<!-- CreditLimitQueryComponent view  -->
<div>

    <custom-message-wrapper [CustomSendOptionsButtonCanForcePersonalSign]="false">

        <!-- Request -->
        <div class="class-request-content">
            <table style="width: 550px;height: 46px;padding-top: 10px;">

                <!-- Request Fields -->
                <tr class="FormFieldRow" style="vertical-align: top">
                    <td>
                        <table style="width: 550px; padding-top: 10px;">
                            <!-- Date (From\To) -->
                            <tr class="FormFieldRow">
                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'StartDate'"
                                              [DataContext]="DataContext"
                                              [TextCode]="'Customs.General.O.FaultQueryDates'">
                                    </LogLabel>
                                </td>
                                <td style="width:120px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'StartDate'" [ObjectTableName]="ObjectTableName"
                                                   [InputType]="'date'" [DataContext]="DataContext"
                                                   [HideColumns]="true"></LogDatePicker>
                                </td>

                                <td style="width:10px;"><div></div></td>

                                <td style="width: 120px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'EndDate'" [ObjectTableName]="ObjectTableName"
                                                   [InputType]="'date'" [DataContext]="DataContext"
                                                   [HideColumns]="true"></LogDatePicker>
                                </td>

                                <td><div></div></td>
                            </tr>

                            <!-- Agent Code(Vat) -->
                            <tr class="FormFieldRow" style="height:1px">
                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'AgentCode'" [DataContext]="DataContext" [TextCode]="'Customs.CreditQuery.O.AgentVat'"></LogLabel>
                                </td>
                                <td style="width: 120px;">
                                    <LogTextBox [ObjectFieldName]="'AgentCode'" [Text]="AgentCode" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                </td>

                                <td><div></div></td>
                            </tr>

                            <!-- Agent Number -->
                            <tr class="FormFieldRow">
                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'AgentNo'" [DataContext]="DataContext" [TextCode]="'Customs.SpecialActivityRequest.O.ApplicantAgentNumber'"></LogLabel>
                                </td>
                                <td style="width: 120px;">
                                    <LogTextBox [ObjectFieldName]="'AgentNo'" [Text]="AgentNo" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                </td>

                                <td><div></div></td>
                            </tr>

                            <!--Importer-->
                            <tr class="FormFieldRow">
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'ImporterCode'" [DataContext]="DataContext" [TextCode]="'Customs.CreditQuery.O.ImporterVat'"></LogLabel>
                                </td>
                                <td style="width: 120px;">
                                    <SearchBox [ObjectTableName]="'Customs.Client'"
                                               [IsQuickSearch]="true"
                                               [DropDownWidth]="143"
                                               [DisplayText]="ImporterCode"
                                               [DisplayMember]="'Code'"
                                               [ItemHeight]="33"
                                               [HideIcons]="true"
                                               [Watermark]="''"
                                               (TextChanged)="ImporterTextChanged($event)"
                                               (ItemClicked)="ImporterClicked($event)"></SearchBox>
                                </td>
                                <td colspan="2" style="width: 120px; min-width: 120px; max-width: 120px; text-align: right; padding-right: 5px;" >
                                    <div style="color: #646464; font-size: 11px;">{{ImporterName}}</div>
                                </td>

                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

        <!-- Response -->
        <div class="class-response-content" style="width: 500px;height: 320px;">
            <table style="width: 500px;height: 320px;padding-top: 10px;">

                <!--Balance Details List-->
                <tr style="width: 100%">
                    <td style="width: 200px;height:25px; font-size: 12px; color: #1B90CB;">
                        {{'Customs.General.O.CreditQueryResults'| TextCodeTranslationPipe}}
                    </td>
                </tr>
                <tr class="FormFieldRow" style="height:1px">
                    <td colspan="5" style="width: 100% ; height : 30%">
                        <div div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="BalanceDetailsResultList">

                                <!-- TemporaryCeiling -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.CreditQueryResults.O.DailyCieling' | TextCodeTranslationPipe"
                                            [binding]="'TemporaryCeiling'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.TemporaryCeiling }}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- UsedBalance -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.CreditQueryResults.O.UsedBalance' | TextCodeTranslationPipe"
                                            [binding]="'UsedBalance'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.UsedBalance}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- FreeBalance -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.CreditQueryResults.O.FreeBalance' | TextCodeTranslationPipe"
                                            [binding]="'FreeBalance'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.FreeBalance}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>

                <!--Bank Accounts List-->
                <tr style="width: 100%">
                    <td style="width: 200px;height:25px; font-size: 12px; color: #1B90CB;">
                        {{'Customs.General.O.CreditQueryResultsBankAccount'| TextCodeTranslationPipe}}
                    </td>
                </tr>
                <tr class="FormFieldRow" style="height:1px">
                    <td colspan="5" style="width: 100% ; height : 30%">
                        <div div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="BankAccountsResultList">

                                <!-- BankAccount -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.CreditQueryResults.O.BankAccount' | TextCodeTranslationPipe"
                                            [binding]="'BankAccount'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.BankAccount }}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- UsedBalanceForBankAccount -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.CreditQueryResults.O.UsedBalanceForBankAccount' | TextCodeTranslationPipe"
                                            [binding]="'UsedBalanceForBankAccount'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.UsedBalanceForBankAccount}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

    </custom-message-wrapper>
</div>
