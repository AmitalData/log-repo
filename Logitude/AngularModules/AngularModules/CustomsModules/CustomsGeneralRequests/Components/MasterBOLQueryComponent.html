<!-- MasterBOLQueryComponent view  -->
<div>

    <custom-message-wrapper [CustomSendOptionsButtonCanForcePersonalSign]="false">

        <!-- Request -->
        <div class="class-request-content">
            <table style="width: 550px;height: 46px;padding-top: 10px;">

                <!-- Request Fields -->
                <tr class="FormFieldRow" style="vertical-align: top">
                    <td>
                        <table style="width: 550px; padding-top: 10px;">
                            <tr class="FormFieldRow">
                                <td style="width: 100px">
                                    <LogLabel [ObjectFieldName]="'CustomFileNo'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td style="width: 160px;">
                                    <LogTextBox [ObjectFieldName]="'CustomFileNo'" [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                                (LostFocus)="CustomFileNoTextChanged($event)"
                                                [Text]="CustomFileNo"></LogTextBox>
                                </td>

                                <td><div></div></td>
                            </tr>
                            <tr class="FormFieldRow" style="height:1px">
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'Date'" [DataContext]="DataContext" [TextCode]="'Customs.MasterBOLQuery.O.Date'"></LogLabel>
                                </td>
                                <td style="width: 160px;">
                                    <LogTextBox [ObjectFieldName]="'Date'" [Text]="Date" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'MasterBillOfLading'" [DataContext]="DataContext" [TextCode]="'Customs.MasterBOLQuery.O.Master'"></LogLabel>
                                </td>
                                <td style="width: 160px;">
                                    <LogTextBox [ObjectFieldName]="'MasterBillOfLading'" [Text]="MasterBillOfLading" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'InternalIdentifier'" [DataContext]="DataContext" [TextCode]="'Customs.MasterBOLQuery.O.InternalIdentifier'"></LogLabel>
                                </td>
                                <td style="width: 160px;">
                                    <LogTextBox [ObjectFieldName]="'InternalIdentifier'" [Text]="InternalIdentifier" [DataContext]="DataContext"></LogTextBox>
                                </td>

                                <td style="width: 5px;"><div></div></td>

                                <td style="width: 140px;">
                                    <LogLabel [ObjectFieldName]="'ReturnAllInernalCargos'" [DataContext]="DataContext" [TextCode]="'Customs.MasterBOLQuery.O.ReturnAllInernalCargos'"></LogLabel>
                                </td>
                                <td style="width: 50px;">
                                    <LogCheckBox [ObjectFieldName]="'ReturnAllInernalCargos'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [Checked]="ReturnAllInernalCargos"></LogCheckBox>
                                </td>

                                <td style="width: 5px;"><div></div></td>

                                <td style="width: 120px;">
                                    <LogLabel [ObjectFieldName]="'ExactMatch'" [DataContext]="DataContext" [TextCode]="'Customs.MasterBOLQuery.O.ExactMatch'"></LogLabel>
                                </td>
                                <td style="width: 50px;">
                                    <LogCheckBox [ObjectFieldName]="'ExactMatch'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"[Checked]="ExactMatch"></LogCheckBox>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

        <!-- Response -->
        <div class="class-response-content" style="width: 500px;height: 300px;">
            <table style="width: 500px;height: 310px;padding-top: 10px;">

                <!--Internal Cargos List-->
                <tr class="FormFieldRow" style="height:1px">
                    <td colspan="5" style="width: 100% ; height : 100%">
                        <div div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="InternalCargosList">

                                <!-- CargoIdentifierKey3 -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.MasterBOLQuery.O.CargoIdentifierKey3' | TextCodeTranslationPipe"
                                            [binding]="'CargoIdentifierKey3'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.CargoIdentifierKey3}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- PacakgesQuantity -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.MasterBOLQuery.O.PacakgesQuantity' | TextCodeTranslationPipe"
                                            [binding]="'PacakgesQuantity'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.PacakgesQuantity}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- TotalWheight -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.MasterBOLQuery.O.TotalWeight' | TextCodeTranslationPipe"
                                            [binding]="'TotalWheight'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.TotalWheight }}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- Submitter -->
                                <log-column [width]="'100'" [Alignment]="'right'"
                                            [header]="'Customs.MasterBOLQuery.O.Submitter' | TextCodeTranslationPipe"
                                            [binding]="'Submitter'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.Submitter }}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- Edit Button -->
                                <log-column *ngIf="IsFromDeclaration" [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                    <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                        <span class="CellSeparator" style="float: right;"></span>
                                        <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                            <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

    </custom-message-wrapper>
</div>
