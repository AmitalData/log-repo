
<table *ngIf="isLoad">

    <tr style="height:5px">
        <td style=" font-size: 18px;  color: #1B90CB;position: absolute;left: 15px; top:-28px;"> {{UpdateDate|DateTimePipe:'D'}}</td>
     </tr>
 
    <tr>
        <td>
            <fieldset [disabled]="!IsControlEnabled">
                <div class="TableHolder">
                    <table style="width: 420px; height: 500px;padding-top: 10px;">
                        <tr style="height: 100%; width: 100%; top:0px">
                            <td>
                                <div>
                                    <table style="width: 420px; height: 500px;padding-top: 10px;">
                                        <tr class="FormFieldRow" style="width: 100%; height:100%">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                                                        [ItemSource]="CustomerIndicationList" [IsReadOnly]="IsControlEnabled">

                                                        <!-- CustomerIndicationType -->
                                                        <log-column [width]="'145'" [Alignment]="'right'"
                                                        [header]="'Customs.ClientIndication.F.CustomerIndicationTypeName' | TextCodeTranslationPipe"
                                                                    [binding]="'CustomerIndicationTypeName'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <span title="{{item.CustomerIndicationTypeName}}">{{item.CustomerIndicationTypeName }}</span>
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- IsActive -->
                                                        <log-column [width]="'70'" [Alignment]="'right'"
                                                        [header]="'Customs.ClientIndication.F.IsActive' | TextCodeTranslationPipe"
                                                                    [binding]="'IsActive'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <!--<span>{{item.IsActive }}</span>-->
                                                                        <img *ngIf="item.IsActive == true" src="./Images/CheckBoxIcon.png" />
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- StartDate -->
                                                        <log-column [width]="'90'" [Alignment]="'right'"
                                                        [header]="'Customs.ClientIndication.F.StartDate' | TextCodeTranslationPipe"
                                                        [binding]="'StartDate'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <span *ngIf="!this.IsClientIndication">{{item.StartDate }}</span>
                                                                        <span *ngIf="this.IsClientIndication">{{item.StartDate|DateTimeToDatePipe }}</span>
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- EndDate -->
                                                        <log-column [width]="'90'" [Alignment]="'right'"
                                                        [header]="'Customs.ClientIndication.F.EndDate' | TextCodeTranslationPipe"
                                                        [binding]="'EndDate'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <span *ngIf="!this.IsClientIndication">{{item.EndDate }}</span>
                                                                        <span *ngIf="this.IsClientIndication">{{item.EndDate|DateTimeToDatePipe }}</span>
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>


                                                    </logitude-edit-grid>
                                                </div>
                                            </td>
 
                                        </tr>

                                        <tr><td><div></div></td></tr>
                                    </table>
                                </div>
                            </td>
                        </tr>

                    </table>
                </div>
            </fieldset>
        </td>
    </tr>

    <tr style="height: 40px;">
        <td colspan="2">
            <table>
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;vertical-align: bottom;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
