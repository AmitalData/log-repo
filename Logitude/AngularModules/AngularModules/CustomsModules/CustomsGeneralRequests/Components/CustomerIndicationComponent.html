
<table>
    <tr>
        <td>
            <fieldset [disabled]="!IsControlEnabled">
                <div class="TableHolder">
                    <table style="width: 400px; height: 350px;padding-top: 10px;">
                        <tr style="height: 100%; width: 100%; top:0px">
                            <td>
                                <div>
                                    <table style="width: 400px; height: 350px;padding-top: 10px;">
                                        <tr class="FormFieldRow" style="width: 100%; height:100%">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                                                        [ItemSource]="CustomerIndicationList" [IsReadOnly]="IsControlEnabled">

                                                        <!-- CustomerIndicationType -->
                                                        <log-column [width]="'120'" [Alignment]="'right'"
                                                                    [header]="'אינדיקציה'"
                                                                    [binding]="'CustomerIndicationTypeName'">
                                                            <log-cell-template template="let item" #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <span>{{item.CustomerIndicationTypeName }}</span>
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
                                                        </log-column>

                                                        <!-- IsActive -->
                                                        <log-column [width]="'70'" [Alignment]="'right'"
                                                                    [header]="'סטטוס'"
                                                                    [binding]="'IsActive'">
                                                            <log-cell-template template="let item" #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <!--<span>{{item.IsActive }}</span>-->
                                                                        <img *ngIf="item.IsActive == true" src="./Images/CheckBoxIcon.png" />
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
                                                        </log-column>

                                                        <!-- StartDate -->
                                                        <log-column [width]="'90'" [Alignment]="'right'"
                                                                    [header]="'מתאריך'"
                                                                    [binding]="'StartDate'">
                                                            <log-cell-template template="let item" #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <span>{{item.StartDate }}</span>
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
                                                        </log-column>

                                                        <!-- EndDate -->
                                                        <log-column [width]="'90'" [Alignment]="'right'"
                                                                    [header]="'עד תאריך'"
                                                                    [binding]="'EndDate'">
                                                            <log-cell-template template="let item" #logcelltemplate>
                                                                <div style="width:100%;height:100%;">
                                                                    <div class="RightCenter">
                                                                        <span>{{item.EndDate }}</span>
                                                                    </div>
                                                                </div>
                                                            </log-cell-template>
                                                        </log-column>


                                                    </logitude-edit-grid>
                                                </div>
                                            </td>

                                            <td> <div></div> </td>
                                        </tr>

                                        <tr><td><div></div></td></tr>
                                    </table>
                                </div>
                            </td>
                        </tr>

                    </table>
                </div>
            </fieldset>
        </td>
    </tr>

    <tr style="height: 40px;">
        <td colspan="2">
            <table>
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;vertical-align: bottom;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
