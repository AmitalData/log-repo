<!-- CourierBOLQueryComponent view  -->
<div>
    <custom-message-wrapper>

        <!-- Request -->
        <div class="class-request-content">
            <table style="width: 560px;height: 46px;padding-top: 10px;">

                <!-- Request Fields -->
                <tr class="FormFieldRow" style="vertical-align: top">
                    <td>
                        <table style="width: 370px; padding-top: 10px;">
                            <tr class="FormFieldRow">
                                <td style="width: 100px">
                                    <LogLabel [ObjectFieldName]="'CustomFileNo'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td style="width: 150px;">
                                    <LogTextBox [ObjectFieldName]="'CustomFileNo'" [InputType]="'text'" [DataContext]="DataContext" [ObjectTableName]="ObjectTableName"
                                                (LostFocus)="CustomFileNoTextChanged($event)"
                                                [Text]="CustomFileNo"></LogTextBox>
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="height:1px">
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'CourierBOL'" [DataContext]="DataContext" [TextCode]="'Customs.CourierBOLQuery.F.CourierBOL'"></LogLabel>
                                </td>
                                <td style="width: 150px;">
                                    <LogTextBox [ObjectFieldName]="'CourierBOL'" [Text]="CourierBOL" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 100px;">
                                    <LogLabel [ObjectFieldName]="'CourierVAT'" [DataContext]="DataContext" [TextCode]="'Customs.CourierBOLQuery.F.CourierVAT'"></LogLabel>
                                </td>
                                <td style="width: 150px;">
                                    <LogTextBox [ObjectFieldName]="'CourierVAT'" [Text]="CourierVAT" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

        <!-- Response -->
        <div class="class-response-content">
            <table style="width: 600px;height: 250px;padding-top: 10px;">
                <tr style="width: 100%">
                    <td style="width: 200px;height:25px; font-size: 12px; color: #1B90CB;">
                        {{'Customs.CourierBOLQuery.O.CourierBOLQueryResult'| TextCodeTranslationPipe}}
                    </td>
                </tr>

                <!--CourierBOLDetailsList-->
                <tr class="FormFieldRow" style="height:1px">
                    <td colspan="5" style="width: 100% ; height : 90%">
                        <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="CourierBOLDetailsObservableList">

                                <!-- CargoIdentifierType -->
                                <log-column [width]="'110'" [Alignment]="'right'"
                                            [header]="'Customs.CourierBOLQuery.F.cargoIdentiferTypeId' | TextCodeTranslationPipe"
                                            [binding]="'CargoIdentifierType'">
                                    <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.cargoIdentifierType}}</span>
                                        </div>
                                    </log-cell-template>
</ng-template>
                                </log-column>

                                <!-- CargoIdentifierKey1 -->
                                <log-column [width]="'180'" [Alignment]="'right'"
                                            [header]="'Customs.CourierBOLQuery.F.cargoIdentifierKey1' | TextCodeTranslationPipe"
                                            [binding]="'CargoIdentifierKey1'">
                                    <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.cargoIdentifierKey1}}</span>
                                        </div>
                                    </log-cell-template>
</ng-template>
                                </log-column>

                                <!-- CargoIdentifierKey2 -->
                                <log-column [width]="'120'" [Alignment]="'right'"
                                            [header]="'Customs.CourierBOLQuery.F.CourierVAT' | TextCodeTranslationPipe"
                                            [binding]="'CargoIdentifierKey2'">
                                    <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                        <div class="RightCenter">
                                            <span>{{item.cargoIdentifierKey2 }}</span>
                                        </div>
                                    </log-cell-template>
</ng-template>
                                </log-column>

                                <!-- CargoIdentifierKey3 -->
                                <log-column [width]="'120'" [Alignment]="'right'"
                                            [header]="'Customs.CourierBOLQuery.F.cargoIdentifierKey3' | TextCodeTranslationPipe"
                                            [binding]="'CargoIdentifierKey3'">
                                    <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                        <div style="width:100%;height:100%;">
                                            <div class="RightCenter">
                                                <span>{{item.cargoIdentifierKey3 }}</span>
                                            </div>
                                        </div>
                                    </log-cell-template>
</ng-template>
                                </log-column>     
                                
                                <!-- Edit Button -->
                                <log-column *ngIf="IsFromDeclaration" [width]="'40'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                    <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                        <span class="CellSeparator" style="float: right;"></span>
                                        <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                            <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                        </div>
                                    </log-cell-template>
</ng-template>
                                </log-column>                          

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>

            </table>
        </div>

    </custom-message-wrapper>
</div>
