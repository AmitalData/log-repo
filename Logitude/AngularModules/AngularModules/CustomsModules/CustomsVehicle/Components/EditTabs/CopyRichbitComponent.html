<style>
    .FieldRow {
        height: 30px;
    }

    .subTitle {
        color: #1b90cb;
        font-size: 15px;
        padding-top: 10px;
        padding-bottom: 2px;
    }
</style>
<table >

    <tr>
        <td>
            <div class="TableHolder">
                <table>

                    <!-- Filters Fields -->
                    <tr>
                        <td colspan="4">
                            <table>
                                <tr>
                                    <td colspan="4">
                                        <table>
                                           

                                            <tr class="FieldRow">
                                                <!-- ImporterIdentityId -->
                                                <td style="width: 100px;padding-right:1px;">
                                                    <LogLabel [ObjectFieldName]="'ImporterIdentityId'"
                                                        [ObjectTableName]="'Customs.Vehicle'"
                                                        [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 150px;">
                                                    <LogLov tabindex="1" [ObjectFieldName]="'ImporterIdentityId'"
                                                        [ObjectTableName]="'Customs.Vehicle'"
                                                        [DataContext]="DataContext" [LookUpTableName]="'Customs.Client'"
                                                        [SelectedValue]="ImporterIdentityId" [HideColumns]="true">
                                                    </LogLov>

                                                </td>
                                                <td style="width: 60px;"><div></div></td>
                                                <!-- RichbitFileNumber -->
                                                <td style="width: 100px;padding-right:1px;">
                                                    <LogLabel [ObjectFieldName]="'RichbitFileNumber'"
                                                        [ObjectTableName]="'Customs.Vehicle'"
                                                        [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 150px;">
                                                    <LogTextBox [ObjectFieldName]="'RichbitFileNumber'"
                                                        [ObjectTableName]="'Customs.Vehicle'"
                                                        [DataContext]="DataContext" [HideColumns]="true"
                                                        [Text]="RichbitFileNumber"></LogTextBox>
                                                </td>
                                                <td style="width: 60px;"><div></div></td>
                                                <!-- VehicleChassisNumber -->
                                                <td style="width: 100px;padding-right:1px; color:#6E7172">
                                                   <span >{{VehicleChassisNumberText}}</span>
                                                </td>
                                                <td style="width: 150px;">
                                                    <LogTextBox [ObjectFieldName]="'VehicleChassisNumber2'"
                                                        [ObjectTableName]="'Customs.Vehicle'"
                                                        [DataContext]="DataContext" [HideColumns]="true"
                                                        [Text]="VehicleChassisNumber2"></LogTextBox>
                                                </td>



                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                            </table>
                        </td>

                    </tr>


                    <!-- Grid -->
                    <tr>
                        <td colspan="4" style="height: 100%;">

                            <div style="height: 100%;">

                                <table style="height: 100%;">
                                    <tr>
                                        <td>
                                            <!-- Grid -->
                                            <logitude-grid GridWidth="100%" GridHeight="100%"
                                                [ObjectTable]="'Customs.Vehicle'" [dataSource]="DataSource"
                                                (rowSelectedEvent)="OnRowSelected($event)"
                                                [IsGradiantSelectedColor]="true" [SelectedRow]="SelectedRow"
                                                [columns]="columns" [autoLoad]="true" [QueryChangeEvent]="onQueryChangeEvent">
                                            </logitude-grid>
                                        </td>
                                    </tr>
                                </table>

                            </div>
                        </td>
                    </tr>
                   
                    <tr style="height: 30px;">
                        <td>
                            <div></div>
                        </td>
                
                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' |TextCodeTranslationPipe}}</button>
                        </td>
                
                       
                    </tr>

                </table>
            </div>
        </td>
    </tr>
    
</table>
