<style>
    .FormFieldRow {
        height: 32px;
    }
    .col2Label{
        width: 150px;

                        <td style="width: 200px;">

                            <CheckBox (Checked)="IsABS = $event" [IsChecked]="IsABS"></CheckBox>

                        </td>
                        <td style="width: 200px;">
                            <LogTextBox [ObjectFieldName]="'AirBagsNumber'"

                        </td>
