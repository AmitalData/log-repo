<style>
    .FlipImgHoriz {
        transform: rotate(180deg);
    }
</style>
<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td colspan="6">
            <div class="FillParent CurvedArea">
                <table>
                    <tr>
                        <td style="width: 120px">
                            <div class="FillParent AppLeftMenuBackgroundRTL">
                                <table>
                                    <tr style="height:5px;">
                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td style="vertical-align: top;">
                                            <ul>
                                                <li class="DefaultMenuItem" *ngFor="let item of TabsItemsSource" (click)="SelectedTabCode = item.code" [class.SelectedMenuItem]="item.code === SelectedTabCode"
                                                    [style.text-align]='right' id="{{item.code |IdGeneratorPipe}}">
                                                    <div style="position:absolute; top:0; bottom:0; margin:auto; height: 22px; line-height: 22px; right: 5px; padding-left: 5px;">{{item.textCode | TextCodeTranslationPipe}}</div>
                                                    <img *ngIf="SelectedTabCode == item.code" class="LeftCenter FlipImgHoriz" src="./Images/SelectedMenuArrow.png" style="margin-right: -1px;" />



                                                </li>

                                            </ul>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </td>

                        <td>
                            <div class="FillParent">
                                <div class="ScrollViewer">
                                    <div class="ScrollContent">
                                        <div class="FillParent" style="padding:7px;">

                                            
                                            <div class="MediaStretch" [hidden]="SelectedTabCode != 'General'" id="General">
                                                <div LocationDirective Code="General" id="GeneralComponent"></div>
                                            </div>

                                            
                                            <div class="MediaStretch" [hidden]="SelectedTabCode != 'VehicleMoreDetailsTabComponent'">
                                                <div LocationDirective Code="VehicleMoreDetailsTabComponent"></div>
                                            </div>
                                            
                                            <div class="MediaStretch" [hidden]="SelectedTabCode != 'VehiclesOwnersAndSafetyTabComponent'">
                                                <div LocationDirective Code="VehiclesOwnersAndSafetyTabComponent"></div>
                                            </div>
                                            


                                        </div>
                                    </div>
                                </div>
                            </div>

                        </td>
                    </tr>
                </table>
            </div>

        </td>
    </tr>

    <tr style="height: 40px;">
        <td>
            <div></div>
        </td>

        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
        </td>

        <td style="width: 10px;vertical-align: bottom;">
            <div></div>
        </td>

        <td style="width: 57px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Save' | TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;vertical-align: bottom;">
            <div></div>
        </td>
        <td style="width: 157px;vertical-align: bottom;">
            <custom-send-options 
                                 (SendButtonClicked)="OnCustomSendOptionsButtonClick($event)"
                                 ></custom-send-options>
            
        </td>
    </tr>

</table>
