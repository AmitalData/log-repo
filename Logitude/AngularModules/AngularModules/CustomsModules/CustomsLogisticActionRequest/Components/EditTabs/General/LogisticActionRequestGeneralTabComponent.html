<table dir="rtl">
    <tr>
        <td class="AppLeftMenuBackgroundRTL" style="width: 150px;">
            <table style="height:250px">
                <tr style="height:30px">
                    <td>
                        <LogLabel [NoObjectField]="true" [Text]="'יבוא/יצוא'" [ObjectFieldName]="'Direction'"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div class="RadioButton">
                                    <input [id]="'TariffRadio'" type="radio" name="TariffRadio" [disabled]="true"
                                        checked />
                                    <label style="font-size:12px;"> 
                                        {{'Customs.General.O.Export' | TextCodeTranslationPipe}}
                                     </label>
                                    <img style="left:-15px" class="CenterCenter" src="./Images/Directions/E.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:50px">
                    <td>
                        <LogLabel [ObjectFieldName]="'TransportModeId'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div class="RadioButton">
                                    <input type="radio" id="air" value="air" name="TransportMode"
                                        (click)="TransportModeClicked('A')" />
                                    <label for="air" style="font-size:12px;">
                                        {{'Customs.General.O.Air' | TextCodeTranslationPipe}}
                                    </label>
                                    <img style="left:-25px" class="CenterCenter" src="./Images/TransportModes/A.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div class="RadioButton">
                                    <input id="ocean" type="radio" value="ocean" (click)="TransportModeClicked('O')"
                                        name="TransportMode" />
                                    <label for="ocean" style="font-size:12px;">
                                        {{'Customs.General.O.Ocean' | TextCodeTranslationPipe}}
                                    </label>
                                    <img style="left:-25px" class="CenterCenter" src="./Images/TransportModes/O.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div class="RadioButton">
                                    <input type="radio" id="land" value="land" (click)="TransportModeClicked('L')"
                                        name="TransportMode" />
                                    <label for="land" style="font-size:12px;">
                                        {{'Customs.General.O.Land' | TextCodeTranslationPipe}}
                                     </label>
                                    <img style="left:-25px" class="CenterCenter" src="./Images/TransportModes/I.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:150px">
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
        <td >
            <table style="width: 90%;">
                <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                    <td colspan="2">
                        <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
                    </td>
                </tr>
                <tr [class.disabled]="!entityPM?.TransportmodeId">
                    <td colspan="2" style="vertical-align: top;">
                        <table style="height: 500px;padding-top: 10px;float:right;">
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.ExportFileNo' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                            [ObjectFieldName]="'ExportFileNo'" 
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext" 
                                            [HideColumns]="true"
                                            (LostFocus)="onBlurExportFileNo()"                                         
                                        ></LogTextBox>
                                    </div>
                                </td>

                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.ExporterNumber' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <SearchBox [ObjectTableName]="'Customs.Client'"
                                                           [IsQuickSearch]="true"
                                                           [DropDownWidth]="143"
                                                           [DisplayText]="ExporterNumber"
                                                           [SearchText]="ExporterNumber"
                                                           [DisplayMember]="'Code'"
                                                           [ItemHeight]="36"
                                                           [HideIcons]="true"
                                                           [Watermark]="''"
                                                           (TextChanged)="ImporterTextChanged('Importer', $event)"
                                                           (ItemClicked)="ImporterClicked('Importer',$event)"></SearchBox>
                                    </div>
                                </td>
                                <td style="width: 25px;"><IconButton [IsSmall]="true" [Name]="'Edit'" (click)="EditImporter()"></IconButton></td>
                            </tr>
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                    {{'Customs.LogisticActionRequest.F.RequestDate' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogDatePicker 
                                            [ObjectFieldName]="'RequestDate'" 
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                        ></LogDatePicker>
                                    </div>
                                </td>
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.RequestType' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogLov 
                                            [ObjectFieldName]="'RequestType'" 
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'Customs.LogisticActionRequestType'"
                                            [SelectedValue]="RequestType"
                                        ></LogLov>
                                        </div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.CargoIdentifierType' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogLov 
                                        [ObjectFieldName]="'CargoIdentifierType'"                                             
                                        [DataContext]="DataContext" 
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [LookUpTableName]="'Customs.CargoIdentifireType'"
                                        [SelectedValue]="CargoIdentifierType"
                                    ></LogLov>
                                    </div>
                                </td>

                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.CargoIdentifierKey1' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                            [ObjectFieldName]="'CargoIdentifierKey1'" 
                                            [InputType]="'integertext'"                                            
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [Text]="CargoIdentifierKey1"
                                            ></LogTextBox>
                                        </div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.CargoIdentifierKey2' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                            [ObjectFieldName]="'CargoIdentifierKey2'" 
                                            [InputType]="'integertext'"                                            
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [Text]="CargoIdentifierKey2"
                                            ></LogTextBox>
                                        </div>
                                    </td>
                                    
                                    <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.CargoIdentifierKey3' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                        [ObjectFieldName]="'CargoIdentifierKey3'" 
                                        [DataContext]="DataContext" 
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="CargoIdentifierKey3"
                                        ></LogTextBox>
                                    </div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.PackagingTypeCode' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogLov 
                                            [ObjectFieldName]="'PackagingTypeCode'" 
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'Customs.PackingType'"
                                            [SelectedValue]="PackagingTypeCode"
                                        ></LogLov>
                                    </div>
                                </td>

                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.Quantity' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                            [ObjectFieldName]="'Quantity'" 
                                            [InputType]="'integertext'"                                            
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                        ></LogTextBox>
                                    </div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.DeliverySiteID' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogLov 
                                            [ObjectFieldName]="'DeliverySiteID'" 
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'Customs.DeliverySiteType'"
                                            [SelectedValue]="DeliverySiteID"
                                        ></LogLov>
                                    </div>
                                </td>

                                <td style="text-align: right;">
                                    
                                </td>
                                <td style="width:130px">                                  
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.RequestReason' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td  rowspan="1" colspan="3" style="top: 7px;">                                    
                                    <LogTextBox 
                                        [ObjectFieldName]="'RequestReason'" 
                                        [DataContext]="DataContext" 
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [IsMultiline]="true" 
                                        [Text]="RequestReason"
                                    ></LogTextBox>                                    
                                </td>
                            </tr>

                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td colspan="4" style="text-align: center;">
                                    <hr style="height: 1px;background: lightgray;margin-right: 20px; margin-left: -26px;">
                                </td>
                            </tr>

                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="font-size: 18px; padding-right: 20px; color: #1b90cb;">{{'Customs.LogisticActionRequest.O.CustomsResponse' | TextCodeTranslationPipe}}</td>
                                <td style="width:10px;"><div></div></td>                    
                                <td><div></div></td>
                                <td><div></div></td>
                            </tr>
                            
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.RequestCancelStatus' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                            [ObjectFieldName]="'RequestCancelStatus'" 
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                        ></LogTextBox>
                                    </div>
                                </td>
                                <td style="text-align: right;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.RequestNumber' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td style="width:130px">
                                    <div style="width:135px">
                                        <LogTextBox 
                                            [ObjectFieldName]="'RequestNumber'" 
                                            [DataContext]="DataContext" 
                                            [ObjectTableName]="ObjectTableName"
                                            [HideColumns]="true"
                                        ></LogTextBox>
                                    </div>
                                </td>
                            </tr>
                        
                            <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                <td style="text-align: right;vertical-align: top;top: 8px;">
                                    <label style="font-size:12px; padding-right:20px;text-align: right;">
                                        {{'Customs.LogisticActionRequest.F.DecisionRmarks' | TextCodeTranslationPipe}}:
                                    </label>
                                </td>
                                <td  rowspan="1" colspan="3" style="">                                    
                                    <LogTextBox 
                                        [ObjectFieldName]="'DecisionRmarks'" 
                                        [DataContext]="DataContext" 
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [IsMultiline]="true" 
                                    ></LogTextBox>                                    
                                </td>
                                <!-- <td style="text-align: right;"></td>                     -->
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <table>
                            <tr>
                                <td>
                                    <button class="Button" (click)="ViewDocumentsComponent()" style="width: 50px; top: 4px; margin-right: 25px;">
                                        {{'General.MH.Documents' | TextCodeTranslationPipe}}
                                    </button>
                                </td>
                                <td style="width: 57px;vertical-align: bottom;">
                                    <button class="Button" (click)="CancelButtonClicked()">
                                        {{'Customs.General.B.Cancel' | TextCodeTranslationPipe}}
                                    </button>
                                </td>
                                <td style="width: 10px;vertical-align:bottom">
                                    <div></div>
                                </td>
                                <td style="width: 57px;vertical-align: bottom;">
                                    <button class="RedButton" (click)="OkButtonClicked()"
                                        [disabled]="!OKButtonEnabled">{{'General.B.Save' |
                                        TextCodeTranslationPipe}}</button>
                                </td>
                                <td style="width: 10px;vertical-align: bottom;">
                                    <div></div>
                                </td>
                                <td style="width:110px;  vertical-align: bottom;">
                                    <custom-send-options [IsDisabled]="!SendButtonEnabled" [AvoidDoubleClick]="true"
                                        #MyCustomSendOptionsComponent
                                        (SendButtonClicked)="OnCustomSendOptionsButtonClick($event)">
                                    </custom-send-options>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
