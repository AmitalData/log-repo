<table>
    <tr style="height:32px" class="FormFieldRow">
        <td style="width: 150px;">
            <LogLabel [TextCode]="'Customs.LogisticActionRequest.F.ExporterIdentifierType'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"></LogLabel>
        </td>

        <td style="width: 160px;">
            <LogLov [ObjectFieldName]="'ExporterIdentifierType'"
                    [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'Customs.CustomerIdentifyType'"
                    [DisplayMemberPath]="'LocalName'"
                    [SelectedValue]="ExporterIdentifierType"
                    [HideColumns]="true">
            </LogLov>
        </td>
    </tr>
    
    <tr style="height: 32px;">
        <td style="width: 150px;">
            <LogLabel [TextCode]="'Customs.LogisticActionRequest.F.PassportNumber'" [ObjectTableName]="ObjectTableName"
            [DataContext]="DataContext"></LogLabel>
        </td>
        
        <td style="width: 160px;">
            <LogTextBox 
            [ObjectFieldName]="'PassportNumber'" 
            [ObjectTableName]="ObjectTableName"
            [DataContext]="DataContext" 
            [HideColumns]="true"
            [InputType]="'integertext'"                                            
            ></LogTextBox>
        </td>
    </tr>
    
    <tr style="height: 32px;">
        <td style="width: 150px;">
            <LogLabel [TextCode]="'Customs.LogisticActionRequest.F.PassportCountry'" [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"></LogLabel>
        </td>    
    
        <td style="width: 160px;">
            <LogLov 
                [ObjectFieldName]="'PassportCountry'" 
                [DataContext]="DataContext" 
                [ObjectTableName]="ObjectTableName"
                [HideColumns]="true"
                [LookUpTableName]="'Customs.CustomsCountry'"
                [SelectedValue]="PassportCountry"
            ></LogLov>
        </td>

        <!-- <td style="width:40px"><div></div></td>
        <td><div></div></td> -->
    </tr>

    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    
                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Save' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
