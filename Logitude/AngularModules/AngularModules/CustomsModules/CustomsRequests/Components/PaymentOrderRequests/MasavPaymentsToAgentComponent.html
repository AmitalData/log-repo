<!-- MasavPaymentsToAgentComponent view  -->
<div>

  <custom-message-wrapper [CustomSendOptionsButtonCanForcePersonalSign]="false">

    <!-- Request -->
    <div class="class-request-content" *ngIf="RequestParams">
      <table style="width: 550px;height: 36px;padding-top: 10px;">

        <!-- Request Fields -->
        <tr class="FormFieldRow" style="vertical-align: top">
          <td>
            <table style="width: 550px; padding-top: 10px;">
              <!-- Payment Date -->
              <tr class="FormFieldRow">
                <td style="width: 100px;">
                  <LogLabel [ObjectFieldName]="'PaymentDate'"
                            [DataContext]="DataContext"
                            [TextCode]="'Customs.MasavPaymentsToAgentQuery.O.PaymentDate'">
                  </LogLabel>
                </td>
                <td style="width:120px;">
                  <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'PaymentDate'" [ObjectTableName]="ObjectTableName"
                                 [InputType]="'date'" [DataContext]="DataContext"
                                 [HideColumns]="true"></LogDatePicker>
                </td>

                <td>
                  <div></div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td>
            <div></div>
          </td>
        </tr>
      </table>
    </div>

    <!-- Response -->
    <div class="class-response-content">
      <table style="width: 800px; height: 420px;padding-top: 10px;">

        <!--Agent Masav Payment Result List-->
        <tr class="FormFieldRow" style="width: 800px; height:1px">
          <td colspan="5" style="width: 100% ; height : 100%">
            <div div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
              <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="AgentMasavPaymentResultList"
                                  (RowDataLoaded)="OnRowLoaded($event)" [groupby]="'AgentMasavPaymentResultHeader'">

                <!-- RelatedEntityList -->
                <log-row-details style="width: 700px;">
                  <row-template>
                    <ng-template let-item>
                      <div style="min-height: 80px; width: 100%; background: #E8F7FF; position: relative;" [style.height.px]="item.RowDetailsHeights">
                        <div style="position: absolute; top: 10px; right: 10px; bottom: 10px; left: 10px;">
                          <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="item.RelatedEntityListObs">
                            <!-- Entity Type -->
                            <log-column [width]="'100'" [Alignment]="'right'"
                                        [header]="'Customs.MasavPaymentsToAgentQuery.O.EntityType' | TextCodeTranslationPipe"
                                        [binding]="'EntityTypeName'">
                              <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                  <div style="width:100%;height:100%;">
                                    <div class="RightCenter">
                                      <span>{{item.EntityTypeName }}</span>
                                    </div>
                                  </div>
                                </log-cell-template>
                              </ng-template>
                            </log-column>

                            <!-- EntityIdExternalReferenceID -->
                            <log-column [width]="'100'" [Alignment]="'right'"
                                        [header]="'Customs.MasavPaymentsToAgentQuery.O.EntityIdExternalReferenceID' | TextCodeTranslationPipe"
                                        [binding]="'EntityIdExternalReferenceID'">
                              <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                  <div style="width:100%;height:100%;">
                                    <div class="RightCenter">
                                      <span>{{item.EntityIdExternalReferenceID }}</span>
                                    </div>
                                  </div>
                                </log-cell-template>
                              </ng-template>
                            </log-column>

                            <!-- EntityIdKey1 -->
                            <log-column [width]="'120'" [Alignment]="'right'"
                                        [header]="'Customs.MasavPaymentsToAgentQuery.O.EntityIdKey1' | TextCodeTranslationPipe"
                                        [binding]="'EntityIdKey1'">
                              <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                  <div style="width:100%;height:100%;">
                                    <div class="RightCenter">
                                      <span>{{item.EntityIdKey1 }}</span>
                                    </div>
                                  </div>
                                </log-cell-template>
                              </ng-template>
                            </log-column>

                            <!-- EntityIdKey2 -->
                            <log-column [width]="'120'" [Alignment]="'right'"
                                        [header]="'Customs.MasavPaymentsToAgentQuery.O.EntityIdKey2' | TextCodeTranslationPipe"
                                        [binding]="'EntityIdKey2'">
                              <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                  <div style="width:100%;height:100%;">
                                    <div class="RightCenter">
                                      <span>{{item.EntityIdKey2 }}</span>
                                    </div>
                                  </div>
                                </log-cell-template>
                              </ng-template>
                            </log-column>

                            <!-- EntityIdKey3 -->l
                            <log-column [width]="'120'" [Alignment]="'right'"
                                        [header]="'Customs.MasavPaymentsToAgentQuery.O.EntityIdKey3' | TextCodeTranslationPipe"
                                        [binding]="'EntityIdKey3'">
                              <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                  <div style="width:100%;height:100%;">
                                    <div class="RightCenter">
                                      <span>{{item.EntityIdKey3 }}</span>
                                    </div>
                                  </div>
                                </log-cell-template>
                              </ng-template>
                            </log-column>

                          </logitude-edit-grid>
                        </div>
                      </div>
                    </ng-template>
                  </row-template>
                </log-row-details>

                <!-- PaymentProcess -->
                <log-column [width]="'100'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.PaymentProcess' | TextCodeTranslationPipe"
                            [binding]="'PaymentProcessName'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      <div class="RightCenter">
                        <span>{{item.PaymentProcessName }}</span>
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

                <!-- PaymentType -->
                <log-column [width]="'80'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.PaymentType' | TextCodeTranslationPipe"
                            [binding]="'PaymentTypeName'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      <div class="RightCenter">
                        <span>{{item.PaymentTypeName }}</span>
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

                <!-- PaymentID -->
                <log-column [width]="'100'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.PaymentID' | TextCodeTranslationPipe"
                            [binding]="'PaymentID'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      <div class="RightCenter">
                        <span>{{item.PaymentID}}</span>
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

                <!-- EntityIdExternalReferenceID -->
                <log-column [width]="'100'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.EntityIdExternalReferenceID' | TextCodeTranslationPipe"
                            [binding]="'EntityIdExternalReferenceID'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      <div class="RightCenter">
                        <span>{{item.EntityIdExternalReferenceID}}</span>
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

                <!-- PaymentMethodAmount -->
                <log-column [width]="'100'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.PaymentMethodAmount' | TextCodeTranslationPipe"
                            [binding]="'PaymentMethodAmount'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      <div class="RightCenter">
                        <span>{{item.PaymentMethodAmount}}</span>
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

                <!-- External -->
                <log-column [width]="'170'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.ExternalID' | TextCodeTranslationPipe"
                            [binding]="'ExternalName'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      <div class="RightCenter">
                        <span>{{item.ExternalName}}</span>
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

                <!-- AgentAccountPosession -->
                <log-column [width]="'60'" [Alignment]="'right'"
                            [header]="'Customs.MasavPaymentsToAgentQuery.O.AgentAccountPosession' | TextCodeTranslationPipe"
                            [binding]="'AgentAccountPosessionV'">
                  <ng-template let-item>
                    <log-cell-template #logcelltemplate>
                      >
                      <div class="RightCenter">
                        >
                        <!--
                        <span>{{item.AgentAccountPosessionV}}</span>
                             -->
                        <img *ngIf="item.AgentAccountPosessionV == 'Visible'" title="AgentAccountPosessionV" src="./Images/CheckBoxIcon.png" />
                      </div>
                    </log-cell-template>
                  </ng-template>
                </log-column>

              </logitude-edit-grid>
            </div>
          </td>
        </tr>

        <tr>
          <td>
            <div></div>
          </td>
        </tr>
      </table>
    </div>

  </custom-message-wrapper>
</div>
