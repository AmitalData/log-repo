<style>
    .CustomMultiLinesText {
        width: 350px;
        height: 300px;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        font-size: 16px;
        border: 1px solid LightGray;
        border-radius: 3px;
        background-color: #EBEBEB;
    }

        .CustomMultiLinesText:hover {
            border: 1px solid #3BB3E2;
        }
</style>


<table style="height:100%;width:100%">

    <tr><td style="text-align:left;height:10px"><div></div></td> </tr>

    <tr style="vertical-align:top; height:300px; width:350px">
        <td style="height:300px; width:350px; margin-left:5px;" colspan="4">

            <div style="margin:10px;vertical-align:top;" class="CustomMultiLinesText">
                <div style="height:280px; width:320px;font-family:'Lucida Sans Unicode'; white-space: normal;word-wrap: break-word;margin-top:5px;margin-bottom:5px; margin-left:10px;margin-right:10px;font-size:15px">
                    <table style="height:100%; width:100%; padding-top: 10px;">
                        <tr class="FormFieldRow" style="height:1px">
                            <td colspan="5" style="height:280px; width:320px">
                                <div class="GeneratedGridContainer" style="width: 100% ;height:90%;">

                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="VehiclesDetailsList">

                                        <!-- CargoIdentityQualifierID -->
                                        <log-column [header]="'Customs.ExportDeclarationDataQuery.F.CargoIdentityQualifierID' | TextCodeTranslationPipe"
                                                    [width]="'90'" [Alignment]="'right'"
                                                    [binding]="'CargoIdentityQualifierID'">
                                            <log-cell-template template="let item" #logcelltemplate>
                                                <div class="TextTrimming RightCenter">
                                                    <span>{{item.CargoIdentityQualifierID}}</span>
                                                </div>
                                            </log-cell-template>
                                        </log-column>

                                        <!-- RichbitNumber -->
                                        <log-column [header]="'Customs.ExportDeclarationDataQuery.F.RichbitNumber' | TextCodeTranslationPipe"
                                                    [binding]="'RichbitNumber'"
                                                    [width]="'100'" [Alignment]="'right'">
                                            <log-cell-template template="let item" #logcelltemplate>
                                                <div class="RightCenter">
                                                    <span>{{item.RichbitNumber}}</span>
                                                </div>
                                            </log-cell-template>
                                        </log-column>

                                        <!-- VehicleExternalIDNum -->
                                        <log-column [header]="'Customs.ExportDeclarationDataQuery.F.VehicleExternalID' | TextCodeTranslationPipe"
                                                    [binding]="'VehicleExternalIDNum'"
                                                    [width]="'100'" [Alignment]="'right'">
                                            <log-cell-template template="let item" #logcelltemplate>
                                                <div class="RightCenter">
                                                    <span>{{item.VehicleExternalIDNum}}</span>
                                                </div>
                                            </log-cell-template>
                                        </log-column>

                                    </logitude-edit-grid>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

        </td>
    </tr>


    <tr><td style="text-align:left;height:10px"><div></div></td> </tr>

    <tr style="height:100%"><td><div></div></td> </tr>
</table>
