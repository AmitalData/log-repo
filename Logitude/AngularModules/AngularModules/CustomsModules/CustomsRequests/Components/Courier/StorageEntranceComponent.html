<!-- StorageEntranceComponent view  -->
<style>
    .MessageBox {
        width: 200px;
        height: 30px;
        padding: 2px 10px;
        margin: 5px;
        color: green;
        font-family: sans-serif;
        font-size: 12px;
        text-align: center;
    }
</style>

<div>

    <custom-message-wrapper [CustomSendOptionsButtonCanForcePersonalSign]="false"
                            [IsShowCustomResponseContent]="false">

        <!-- Request -->
        <div class="class-request-content">
            <table style="width: 750px;height: 350px;padding-top: 10px;">
                <!-- Request Fields -->
                <tr style="width: 750px; height:300px">
                    <td colspan="5" style="width: 750px; height:300px">
                        <table style="width: 750px; height:300px">
                            <tr style="height: 30px">
                                <td> <div></div> </td>
                                <td style="height: 20px;">
                                    <div>
                                        <IconButton [IsSmall]="true"
                                                    [Name]="'Add'"
                                                    (click)="AddStorageEntranceCommand()"
                                                    style="float:left;"></IconButton>
                                    </div>
                                </td>
                            </tr>
                            <tr class="FormFieldRow" style="width: 750px; height:250px">
                                <td colspan="2" style="width: 750px ; height: 200px">

                                    <div class="CellContent" style="width: 100% ; height : 100%">
                                        <logitude-edit-grid GridWidth="100%" GridHeight="100%" 
                                                            [ItemSource]="StorageEntranceObservableList"
                                                            (RowEnded)="OnRowEnded($event)">

                                            <!--DeclarationNumber -->
                                            <log-column [header]="'מספר הצהרה'"
                                                        [width]="'100'" [Alignment]="'right'" [binding]="'DeclarationNumber'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.DeclarationNumber}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox [ObjectFieldName]="'DeclarationNumber'" [DataContext]="item" [InputType]="'integer'"
                                                                    [FocusOnMe]="true" [ObjectTableName]="ObjectTableName"
                                                                    [Text]="item.DeclarationNumber" [HideColumns]="true"
                                                                    (LostFocus)="item.DeclarationNumberTextChanged($event)"></LogTextBox>

                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!--ConsignmentNumber-->
                                            <log-column [header]="'מספר משגור'"
                                                        [width]="'100'" [Alignment]="'right'" [binding]="'ConsignmentNumber'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.ConsignmentNumber}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox [ObjectFieldName]="'ConsignmentNumber'" [DataContext]="item"
                                                                    [FocusOnMe]="true" [ObjectTableName]="ObjectTableName"
                                                                    [Text]="item.ConsignmentNumber" [HideColumns]="true"></LogTextBox>

                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!--ManifestNumber-->
                                            <log-column [header]="'שטר מטען בלדר'"
                                                        [width]="'120'" [Alignment]="'right'" [binding]="'ManifestNumber'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.ManifestNumber}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox [ObjectFieldName]="'ManifestNumber'" [DataContext]="item"
                                                                    [FocusOnMe]="true" [ObjectTableName]="ObjectTableName"
                                                                    [Text]="item.ManifestNumber" [HideColumns]="true"></LogTextBox>
                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!--EntryDate-->
                                            <log-column [header]="'תאריך קליטה'"
                                                        [width]="'100'" [Alignment]="'right'" [binding]="'EntryDate'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.EntryDate | DateTimePipe:'D'}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogDatePicker [ObjectFieldName]="'EntryDate'" [ObjectTableName]="ObjectTableName"
                                                                       [InputType]="'date'" [DataContext]="item"
                                                                       [HideColumns]="true"></LogDatePicker>
                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!--Quantity-->
                                            <log-column [header]="'כמות'"
                                                        [width]="'70'" [Alignment]="'right'" [binding]="'Quantity'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.Quantity | NumbersPipe:'n0'}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox [ObjectFieldName]="'Quantity'" [DataContext]="item" [InputType]="'integer'"
                                                                    [FocusOnMe]="true" [ObjectTableName]="ObjectTableName"
                                                                    [Text]="item.Quantity" [HideColumns]="true"></LogTextBox>
                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!--GrossWeight-->
                                            <log-column [header]="'משקל'"
                                                        [width]="'75'" [Alignment]="'right'" [binding]="'GrossWeight'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.GrossWeight | NumbersPipe:'N2'}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox [ObjectFieldName]="'GrossWeight'" [DataContext]="item" [InputType]="'decimal'"
                                                                    [FocusOnMe]="true" [ObjectTableName]="ObjectTableName"
                                                                    [Text]="item.GrossWeight" [HideColumns]="true"></LogTextBox>
                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!--PackageTypeCode-->
                                            <log-column [header]="'סוג אריזה'"
                                                        [width]="'120'" [Alignment]="'right'" [binding]="'PackageTypeCode'">
                                                <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                    <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.PackageTypeName}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogLov [ObjectFieldName]="'PackageTypeCode'"
                                                                [ObjectTableName]="'Customs.PackingType'"
                                                                [DataContext]="item"
                                                                [LookUpTableName]="'Customs.PackingType'"
                                                                (SelectedItemChanged)="item.SetLocalName($event,'PackageTypeName')"
                                                                [HideColumns]="true"
                                                                [FocusOnMe]="true"
                                                                [SelectedValue]="item.PackageTypeCode">
                                                        </LogLov>
                                                    </div>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                            <!-- Delete Button-->
                                            <log-column [width]="'30'" [Alignment]="'right'" [visibility]="'visibile'">
                                                <ng-template let-item>
<log-cell-template  [IgnoreMods]="true">
                                                    <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteStorageEntranceCommand(item)"
                                                                style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                                                </log-cell-template>
</ng-template>
                                            </log-column>

                                        </logitude-edit-grid>
                                    </div>
                                </td>
                            </tr>

                            <tr><td><div></div></td></tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td><div></div></td>
                </tr>
            </table>
        </div>

        <!-- Response -->
        <div class="class-response-content">
            <table style="width: 0px;height: 0px;">
                <tr class="FormFieldRow" style="width: 50% ; height : 5%" *ngIf="ResponseMessage != null">
                    <td style="width: 100px;">
                        <LogLabel [ObjectFieldName]="'ResultTitle'" [DataContext]="DataContext" [TextCode]="'Customs.Declaration.O.PrintRequest'"></LogLabel>
                    </td>

                    <td><div></div></td>
                </tr>
            </table>
        </div>

    </custom-message-wrapper>
</div>
