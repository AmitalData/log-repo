<div class="class-response-content">
    <table style="width: 600px;height: 300px;padding-top: 10px;">

        <tr class="FormFieldRow" style="height:1px">
            <!--background-color :aquamarine;-->
            <td colspan="5" style="width: 100% ; height : 100%">
                <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="DeclarationRemarksQueryObservableList">

                        <!-- StatusName -->
                        <log-column [header]="'תאריך'"
                                    [binding]="'CurrencyTypeId'"
                                    [width]="'80'" [Alignment]="'Right'">
                            <log-cell-template template="let item" #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.StatusDate}}</span>
                                </div>
                            </log-cell-template>
                        </log-column>

                        <!-- StatusDate -->
                        <log-column [header]="'שעה'"
                                    [width]="'80'" [Alignment]="'Right'"
                                    [binding]="'StatusDate'">
                            <log-cell-template template="let item" #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.StatusTime}}</span>
                                </div>
                            </log-cell-template>
                        </log-column>
                        <!-- StatuseTime -->
                        <log-column [header]="'סטטוס'"
                                    [width]="'100'" [Alignment]="'Right'"
                                    [binding]="'StatuseTime'">
                            <log-cell-template template="let item" #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.StatusName}}</span>
                                </div>
                            </log-cell-template>
                        </log-column>
                        <!--<log-column [header]="'הערות'"
                                    [binding]="'StatusComment'"
                                    [width]="'200'" [Alignment]="'Right'">
                            <log-cell-template template="let item" #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.StatusComment}}</span>
                                </div>
                            </log-cell-template>
                        </log-column>-->

                        <log-column [header]="'הערות'"
                                    [binding]="'StatusComment'" [width]="'300'" [Alignment]="'right'">
                            <log-cell-template template="let item" #logcelltemplate>
                                <div class="TextTrimming" style="text-align:right">
                                    <span>{{item.StatusComment}}</span>
                                </div>
                                <div style="height: 100%; width: 100%;">
                                    <LogTextBox [ObjectFieldName]="'StatusComment'" [InputType]="'ntext'" [DataContext]="item"
                                                [HideColumns]="true"
                                                [IsMultiline]="true" [NoObjectField]="true"></LogTextBox>
                                </div>
                            </log-cell-template>
                        </log-column>


                        <!--<log-column [header]="'הערות'"
                                    [binding]="'StatusComment'"
                                    [width]="'100'" [Alignment]="'Right'">
                            <log-cell-template template="let item" #logcelltemplate>
                                <div class="RightCenter">
                                     <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Id'" [NoObjectField]="true" [Text]="item.StatusComment" [DataContext]="item" [ObjectTableName]="'Customs.Declaration'" [HideColumns]="true"></LogTextBox>

                                </div>
                            </log-cell-template>
                        </log-column>-->
                    </logitude-edit-grid>
                </div>
            </td>
        </tr>
    </table>

</div>
