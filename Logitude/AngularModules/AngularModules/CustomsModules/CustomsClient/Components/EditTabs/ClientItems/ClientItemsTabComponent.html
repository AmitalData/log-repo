<style>
    .subTitle {
        color: #1990d0;
        font-size: 16px;
        padding-left: 5px;
    }

    .FormFieldRow {
        height: auto !important;
    }



    .InnerGrid td,
    .InnerGrid li span {
        color: #00338b;
        font-size: 10px;
        line-height: 1.5;
    }
</style>
<table *ngIf="load">
    <!-- subtitle -->
    <tr style="height: 30px; padding-bottom: 3px;">

        <td colspan="4" style="width: 620px; padding: 2px;">
            <div>
                <div style=" width: 150;" [style.float]=" 'left' ">
                    <SearchTextBox [ObjectTableName]="'Customs.ClientItem'"
                        [PlaceHolder]="'Customs.Client.O.ItemOrClassificationSearch' | TextCodeTranslationPipe"
                        (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
                </div>
            </div>

        </td>
        <td width="10%"></td>
    </tr>
    <tr>
        <td colspan="3" style="height: 100%;width: 100%;">

            <div style="height: 100%;">

                <table style="height: 100%;width: 100%;">
                    <tr>
                        <td>
                            <!-- Grid -->
                            <table>

                                <tr>
                                    <td colspan="2" style="height: 100%;width: 100%;">
                                        <div class="CellContent">
                                            <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                                [ItemSource]="ItemsList">
                                                <!-- SequenceNumeric -->
                                                <log-column [width]="'40'" [Alignment]="'right'"
                                                    [header]="SequenceNumeric">
                                                    <ng-template let-item>
                                                        <log-cell-template [TabIndex]="-1" [IgnoreMods]="true">
                                                            <span class="CellSeparator"
                                                                [style.float]="'right'">{{item.SequenceNumeric}}</span>

                                                        </log-cell-template>
                                                    </ng-template>
                                                </log-column>
                                                <!-- ItemCode -->
                                                <log-column
                                                    [header]="'Customs.ClientItem.F.ItemCode' | TextCodeTranslationPipe"
                                                    [width]="'160'" [Alignment]="'right'" [binding]="'ItemCode'">
                                                    <ng-template let-item>
                                                        <log-cell-template #logcelltemplate>
                                                            <div style="text-align: right;" class="TextTrimming"
                                                                *ngIf="true">
                                                                <span>{{item.ItemCode}}</span>
                                                            </div>
                                                            <div *ngIf="false">
                                                                <LogTextBox [ObjectFieldName]="'ItemCode'"
                                                                    [InputType]="'ntext'" [DataContext]="item"
                                                                    [ObjectTableName]="'Customs.ClientItem'"
                                                                    [HideColumns]="true" [FocusOnMe]="true">
                                                                </LogTextBox>
                                                            </div>
                                                        </log-cell-template>
                                                    </ng-template>
                                                </log-column>
                                                <!-- ItemDescription -->
                                                <log-column
                                                    [header]="'Customs.ClientItem.F.ItemDescription' | TextCodeTranslationPipe"
                                                    [width]="'250'" [Alignment]="'right'" [binding]="'ItemDescription'">
                                                    <ng-template let-item>
                                                        <log-cell-template #logcelltemplate>
                                                            <div style="text-align: right;" class="TextTrimming"
                                                                *ngIf="logcelltemplate.IsDisplayMode">
                                                                <span>{{item.ItemDescription}}</span>
                                                            </div>
                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                <LogTextBox [ObjectFieldName]="'ItemDescription'"
                                                                    [InputType]="'ntext'" [DataContext]="item"
                                                                    [ObjectTableName]="'Customs.ClientItem'"
                                                                    [HideColumns]="true" [FocusOnMe]="true">
                                                                </LogTextBox>
                                                            </div>
                                                        </log-cell-template>
                                                    </ng-template>
                                                </log-column>
                                                <!-- ClassificationCode -->
                                                <log-column
                                                    [header]="'Customs.ClientItem.F.ClassificationCode' | TextCodeTranslationPipe"
                                                    [width]="'190'" [Alignment]="'right'"
                                                    [binding]="'ClassificationCode'">
                                                    <ng-template let-item>
                                                        <log-cell-template #logcelltemplate>
                                                            <div style="text-align: right;" class="TextTrimming"
                                                                *ngIf="logcelltemplate.IsDisplayMode">
                                                                <span>{{item.ClassificationCode}}</span>
                                                            </div>
                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                <LogTextBox [ObjectFieldName]="'ClassificationCode'"
                                                                    [InputType]="'ntext'" [DataContext]="item"
                                                                    [ObjectTableName]="'Customs.ClientItem'"
                                                                    [HideColumns]="true" [FocusOnMe]="true">
                                                                </LogTextBox>
                                                            </div>
                                                        </log-cell-template>
                                                    </ng-template>
                                                </log-column>
                                                <!-- CommunicationTypeCode -->
                                                <log-column
                                                    [header]="'Customs.ClientItem.F.OriginCountryCode' | TextCodeTranslationPipe"
                                                    [width]="'130'" [Alignment]="'right'"
                                                    [binding]="'OriginCountryCode'">
                                                    <ng-template let-item>
                                                        <log-cell-template #logcelltemplate>
                                                            <div style="text-align: right;" class="TextTrimming"
                                                                *ngIf="logcelltemplate.IsDisplayMode">
                                                                <span>{{item.OriginCountryName}}</span>
                                                            </div>
                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                <LogLov [ObjectFieldName]="'OriginCountryCode'"
                                                                    [ObjectTableName]="'Customs.ClientItem'"
                                                                    [DataContext]="item" [HideColumns]="true"
                                                                    [LookUpTableName]="'Customs.CustomsCountry'"
                                                                    (SelectedItemChanged)="item.SetLocalName($event, 'OriginCountryName')"
                                                                    [FocusOnMe]="true">
                                                                </LogLov>

                                                            </div>
                                                        </log-cell-template>
                                                    </ng-template>
                                                </log-column>


                                                <log-column [width]="'50'" [Alignment]="'right'">
                                                    <ng-template let-item>
                                                        <log-cell-template #logcelltemplate>

                                                        </log-cell-template>
                                                    </ng-template>
                                                </log-column>



                                            </logitude-edit-grid>
                                        </div>

                                    </td>
                                </tr>

                            </table>

                        </td>
                    </tr>
                </table>

            </div>
        </td>
    </tr>
</table>
