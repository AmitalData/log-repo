<style>
  .NotesBox {
    border: 1px solid gray;
    border-radius: 5px;
    padding: 2px 10px;
    margin: 5px;
    color: gray;
    font-family: sans-serif;
  }

  .DisbleBox {
    display: inline-block;
    border: 1px solid #ffd800;
    border-radius: 5px;
    background: #faf5c0;
    padding: 2px 10px;
    margin: 5px;
    color: gray;
    font-family: sans-serif;
  }
</style>

<table>

  <!-- ValidationSummary  -->
  <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
    <td colspan="3">
      <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
    </td>
  </tr>

  <tr>
    <td>
      <!--[disabled]="!IsControlEnabled"-->
      <fieldset>
        <div class="TableHolder">
          <table style="width: 550px; height: 400px;padding-top: 10px;">

            <!-- ClientDrivingLicense List -->
            <tr style="height: 200px; width: 500px;">
              <td style="height: 200px; width: 500px;">
                <div style="height: 200px; width: 500px;">
                  <table style="height: 200px; width: 500px;">
                    <tr style="height: 30px">
                      <td class="TabTitleRow" style="width:150px">
                        {{'Customs.ClientDrivingLicense'| TextCodeTranslationPipe}}
                      </td>

                      <td> <div></div> </td>
                      <td style="height: 20px;padding: 5px;padding-bottom: 0px;">
                        <div>
                          <IconButton [IsSmall]="true"
                                      [Name]="'Add'"
                                      (click)="AddClientDrivingLicense()"
                                      style="float:left;"></IconButton>
                        </div>
                      </td>
                    </tr>

                                        <tr style="height: 170px; overflow: auto;">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" 
                                                                        [ItemSource]="ClientDrivingLicenseList"
                                                                       (SelectedItemChanged)="OnRowSelected($event)"
                                                    [SelectedRow]="SelectedRow">

                                                        <!-- DrivingLicenseNumber -->
                                                        <log-column [header]="'Customs.ClientDrivingLicense.F.DrivingLicenseNumber' | TextCodeTranslationPipe"
                                                                    [width]="'160'" [Alignment]="'right'" [binding]="'DrivingLicenseNumber'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate  (CellClicked)="onCellSelected($event,item)">
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.DrivingLicenseNumber}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode" >
                                                                    <LogTextBox [ObjectFieldName]="'DrivingLicenseNumber'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                                [FocusOnMe]="true" [DataContext]="item" [Text]="DrivingLicenseNumber"
                                                                                
                                                                                ></LogTextBox>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- DrivingLicenseCountryID-->
                                                        <log-column [header]="'Customs.ClientDrivingLicense.F.DrivingLicenseCountryID' | TextCodeTranslationPipe"
                                                                    [width]="'120'" [Alignment]="'right'" [binding]="'DrivingLicenseCountryID'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onCellSelected($event,item)">
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.DrivingLicenseCountryName}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                                    <LogLov [ObjectFieldName]="'DrivingLicenseCountryID'"
                                                                            [ObjectTableName]="'Customs.CustomsCountry'"
                                                                            [DataContext]="item"
                                                                            [LookUpTableName]="'Customs.CustomsCountry'"
                                                                            (SelectedItemChanged)="item.SetLocalName($event,'DrivingLicenseCountryName')"
                                                                            [HideColumns]="true"
                                                                            [FocusOnMe]="true"
                                                                            [SelectedValue]="item.DrivingLicenseCountryID">
                                                                    </LogLov>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- DriverLicenseValidityDate -->
                                                        <log-column [header]="'Customs.ClientDrivingLicense.F.DriverLicenseValidityDate' | TextCodeTranslationPipe"
                                                                    [width]="'100'" [Alignment]="'right'" [binding]="'DriverLicenseValidityDate'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onCellSelected($event,item)">
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.DriverLicenseValidityDate | DateTimeToDatePipe}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                                    <LogDatePicker [ObjectFieldName]="'DriverLicenseValidityDate'" [ObjectTableName]="ObjectTableName"
                                                                                   [InputType]="'date'" [DataContext]="item"
                                                                                   [HideColumns]="true" [FocusOnMe]="'true'"></LogDatePicker>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- Delete Button-->
                                                        <log-column [width]="'30'" [Alignment]="'right'">
                                                            <ng-template let-item>
<log-cell-template  [TabIndex]="-1" [IgnoreMods]="true" (CellClicked)="onCellSelected($event,item)">
                                                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="RemoveClientDrivingLicense(item)"
                                                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                          </logitude-edit-grid>
                        </div>
                      </td>

                      <td> <div></div> </td>
                    </tr>

                    <tr><td><div></div></td></tr>
                  </table>
                </div>
              </td>
            </tr>

            <!-- ClientDrivingLicenseType -->
            <tr style="height: 200px; width: 250px; top:0px">
              <td style="height: 200px; width: 250px;">
                <div style="height: 200px; width: 250px;">
                  <table style="height: 200px; width: 250px;">
                    <tr style="height: 30px">
                      <td class="TabTitleRow" style="width:150px">
                        {{'Customs.ClientDrivingLicenseType'| TextCodeTranslationPipe}}
                      </td>

                                            <td> <div></div> </td>
                                            <td style="height: 20px;padding: 5px;padding-bottom: 0px;">
                                                <div>
                                                    <IconButton [IsSmall]="true"
                                                                [Name]="'Add'"
                                                                (click)="AddClientDrivingLicenseType()"
                                                                style="float:left;"></IconButton>
                                                </div>
                                            </td>
                                        </tr>
                                   
                                        <tr style="height: 170px; overflow: auto;">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                                                        [ItemSource]="ClientDrivingLicenseTypeList"
                                                    >

                                                        <!-- DriversLicenseTypeCode -->
                                                        <log-column [header]="'Customs.ClientDrivingLicenseType.F.DriversLicenseTypeCode' | TextCodeTranslationPipe"
                                                                    [width]="'150'" [Alignment]="'right'" [binding]="'DriversLicenseTypeCode'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.DriversLicenseTypeCode}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode" >
                                                                    <LogTextBox [ObjectFieldName]="'DriversLicenseTypeCode'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                                [FocusOnMe]="true" [DataContext]="item" [Text]="DriversLicenseTypeCode"
                                                                                (LostFocus)="item.OnDriversLicenseLostFocus($event)"></LogTextBox>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                            <!-- Delete Button-->
                            <log-column [width]="'30'" [Alignment]="'right'">
                              <ng-template let-item>
<log-cell-template  [TabIndex]="-1" [IgnoreMods]="true">
                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="RemoveClientDrivingLicenseType(item)"
                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                              </log-cell-template>
</ng-template>
                            </log-column>

                          </logitude-edit-grid>
                        </div>
                      </td>

                      <td> <div></div> </td>
                    </tr>

                    <tr><td><div></div></td></tr>
                  </table>
                </div>
              </td>
            </tr>

                    </table>
                </div>
            </fieldset>
        </td>
    </tr>
</table>
