
<style type="text/css">
    .TabCloseIcon:hover {
        background: url('./Images/Tab.X.Blue.png') no-repeat;
    }

    .TabCloseIcon {
        background: url('./Images/Tab.X.Gray.png') no-repeat;
    }

    /* HOVER */
    .LogTabControl .TabControlHead li:not(.Selected):not(.NewTabItem):hover .InnerChild {
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#ffffff+0,ffffff+18,b3d2f2+94,ffffff+95,ffffff+100 */
        background: #ffffff; /* Old browsers */
        background: -moz-linear-gradient(top, #ffffff 0%, #ffffff 18%, #b3d2f2 94%, #ffffff 95%, #ffffff 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #ffffff 0%,#ffffff 18%,#b3d2f2 94%,#ffffff 95%,#ffffff 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #ffffff 0%,#ffffff 18%,#b3d2f2 94%,#ffffff 95%,#ffffff 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffffff', endColorstr='#ffffff',GradientType=0 ); /* IE6-9 */
    }

    /* ACTIVE */
    .LogTabControl .TabControlHead li:not(.Selected):not(.NewTabItem):active .InnerChild {
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#c2d7ed+0,eff2f4+16,b4d0ed+94,ffffff+95,ffffff+100 */
        background: #c2d7ed; /* Old browsers */
        background: -moz-linear-gradient(top, #c2d7ed 0%, #eff2f4 16%, #b4d0ed 94%, #ffffff 95%, #ffffff 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #c2d7ed 0%,#eff2f4 16%,#b4d0ed 94%,#ffffff 95%,#ffffff 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #c2d7ed 0%,#eff2f4 16%,#b4d0ed 94%,#ffffff 95%,#ffffff 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#c2d7ed', endColorstr='#ffffff',GradientType=0 ); /* IE6-9 */
    }

    .LogTabControl .TabControlHead li:not(.Selected):not(.NewTabItem):hover {
        background: #448DCA;
    }

    .LogTabControl .TabControlHead li:not(.NewTabItem) .InnerChild {
        height: 100%;
        width: 100%;
        color: black;
        font-size: 13px;
        text-align: left;
        padding-left: 5px;
        padding-right: 3px;
        background: transparent;
    }

    .LogTabControl .TabControlHead li:not(.NewTabItem) {
        height: 23px;
        width: 95px;
        line-height: 23px;
        border: 1px solid #b1b1b1;
        display: inline-block;
        float: left;
        cursor: default;
        overflow: hidden;
        border-radius: 4px 4px 0px 0px;
        -moz-border-radius: 4px 4px 0px 0px;
        -webkit-border-radius: 4px 4px 0px 0px;
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#ffffff+0,ffffff+21,e2e2e2+94,e2e2e2+94,ffffff+95,ffffff+100 */
        background: #ffffff; /* Old browsers */
        background: -moz-linear-gradient(top, #ffffff 0%, #ffffff 21%, #e2e2e2 94%, #e2e2e2 94%, #ffffff 95%, #ffffff 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #ffffff 0%,#ffffff 21%,#e2e2e2 94%,#e2e2e2 94%,#ffffff 95%,#ffffff 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #ffffff 0%,#ffffff 21%,#e2e2e2 94%,#e2e2e2 94%,#ffffff 95%,#ffffff 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffffff', endColorstr='#ffffff',GradientType=0 ); /* IE6-9 */
    }

    .LogTabControl .TabControlHead li:not(.Selected) {
        height: 23px;
        margin-top: 2px;
        border-bottom: 1px solid #b9b9b9;
    }

    .LogTabControl .TabControlHead li.Selected {
        pointer-events: none;
        height: 25px;
        line-height: 25px;
        margin-bottom: -1px;
        background: white;
        border: 1px solid #6dbdd1;
        border-bottom: 1px solid white;
        transition: margin 0.2s;
    }

    .LogTabControl .TabControlBody {
        position: absolute;
        left: 0;
        right: 0;
        top: 25px;
        bottom: 0;
        background: white;
        border: 1px solid #b9b9b9;
        border-top: none;
    }

    .LogTabControl .TabControlHead ul {
        width: 100%;
        height: 100%;
        padding-left: 8px;
        padding-right: 0px;
    }

    .LogTabControl .TabControlHead {
        width: 100%;
        height: 25px;
        position: relative;
        border-bottom: 1px solid #a3aeb9;
    }

    .LogTabControl {
        width: 100%;
        height: 100%;
        position: relative;
    }

    .FormFieldRow{
        height: 30px;
    }
    .subTitle{
        color: #1b90cb;
        font-size: 15px;
        padding-top: 10px;
        padding-bottom: 2px;
    }
</style>
