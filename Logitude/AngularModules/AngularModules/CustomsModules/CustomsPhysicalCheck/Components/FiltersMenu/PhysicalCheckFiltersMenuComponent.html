<table>
    <tr>
        <td >
            <ul class="FiltersMenu">
                <li (click)="FilterClicked('I')" [class.SelectedFilter]="_SelectedValue === 'I'" title="יבוא">
                    <img class="CenterCenter" src="./Images/Directions/I_g.png" style="top: 1px;" />
                </li>
                <li (click)="FilterClicked('E')" [class.SelectedFilter]="_SelectedValue === 'E'" title="יצוא">
                    <img class="CenterCenter" src="./Images/Directions/E_g.png" style="top: 1px;" />
                </li>
                <li (click)="FilterClicked('A')" [class.SelectedFilter]="_SelectedValue === 'A'">
                    {{'Customs.General.O.All' | TextCodeTranslationPipe }}
                </li>
            </ul>

        </td>
        <td>
            <ul class="FiltersMenu">
               
                <li (click)="itemClicked('A')" (mouseover)="itemMouseOver('A')" (mouseleave)="itemMouseLeave('A')"
                    [class.SelectedFilter]="transportmodeId === 'A'" title="אוויר">
                    <img [id]="TransportFilter_A" class="CenterCenter" src="./Images/TransportModes/A_g.png"
                        style="top: 1px;" />
                </li>
                <li (click)="itemClicked('O')" (mouseover)="itemMouseOver('O')" (mouseleave)="itemMouseLeave('O')"
                    [class.SelectedFilter]="transportmodeId === 'O'" title="ים">
                    <img [id]="TransportFilter_O" class="CenterCenter" src="./Images/TransportModes/O_g.png"
                        style="top: 1px;" />
                </li>
                <li (click)="itemClicked('L')" (mouseover)="itemMouseOver('L')" (mouseleave)="itemMouseLeave('L')"
                    [class.SelectedFilter]="transportmodeId === 'L'" title="יבשתי">
                    <img [id]="TransportFilter_I" class="CenterCenter" src="./Images/TransportModes/I_g.png"
                        style="top: 1px;" />
                </li>
                <li (click)="itemClicked('All')" (mouseover)="itemMouseOver('All')"
                [class.SelectedFilter]="transportmodeId === 'All'">
                All
            </li>
            </ul>
        </td>
    </tr>
</table>
