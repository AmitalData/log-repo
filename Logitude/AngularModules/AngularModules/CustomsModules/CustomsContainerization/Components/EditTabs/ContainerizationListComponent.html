<!--<p>Containerization !!!!</p>-->
<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        /*fbebbc*/
        padding: 4px 10px;
        color: gray;
        font-family: sans-serif;
        max-width: 660px;
        white-space: normal;
    }

    .TextTrimming {
        user-select: none;

    }
</style>
<table>
    <tr style="height:32px">
        <td>
            <div *ngIf="YellowMessage"
                style="margin: 0 auto;position: absolute;width: 100%;text-align: center;left: 0;right: 0;">
                <div class="DisbleBox">
                    {{YellowMessage}}
                </div>
            </div>
        </td>
    </tr>
    <tr style="height :15px;">
        <!--<td style="font-size: 18px; color: #1B90CB;">
            <div>הצהרות בהמכלה </div>
        </td>-->
        <!-- <td class="TabTitleRow" style="padding-right:5px">הצהרות בהמכלה </td> -->
    </tr>

    <tr *ngIf="this.ContainerizationDeclarationList">
        <!--background-color :aquamarine;-->
        <td colspan="14" style="width: 100% ; height : 100%">
            <div class="GeneratedGridContainer" style="width: 100% ;height:100%;">
                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ContainerizationDeclarationList">
                    <log-column [header]="'Customs.Containerization.O.CreateDateDec' | TextCodeTranslationPipe"
                        [width]="'120'" [Alignment]="'right'" [binding]="'ContainerizationDate'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ContainerizationDate | DateTimeToDatePipe}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.F.CargoTypeCode' | TextCodeTranslationPipe"
                        [width]="'100'" [Alignment]="'right'" [binding]="'CargoTypeCode'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.CargoTypeCode }}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.O.ManifestNumberOne' | TextCodeTranslationPipe"
                        [width]="'100'" [Alignment]="'right'" [binding]="'ManifestNumber'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ManifestNumber}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.O.SecondCargoID' | TextCodeTranslationPipe"
                        [width]="'100'" [Alignment]="'right'" [binding]="'SecondCargoID'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.SecondCargoID}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.O.ThirdCargoID' | TextCodeTranslationPipe"
                        [width]="'120'" [Alignment]="'right'" [binding]="'ThirdCargoID'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ThirdCargoID}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.F.ContainerizationNumber' | TextCodeTranslationPipe"
                        [width]="'120'" [Alignment]="'right'" [binding]="'ContainerizationNumber'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ContainerizationNumber}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.O.ExportFile' | TextCodeTranslationPipe"
                        [width]="'100'" [Alignment]="'right'" [binding]="'ExportFile'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ExportFile}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [width]="'45'" [Alignment]="'center'">
                        <log-header-template>
                            <ng-template>
                                <div style="position:relative;width:100%; height: 100%;">
                                    <img class="CenterCenter" style="width:25px;height:20px;margin-top:2px;margin-right:9px;"
                                        src="./Images/Icons/Transports.png" />
                                </div>
                            </ng-template>
                        </log-header-template>
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div style="position:relative;width:100%; height: 100%;">
                                        <div *ngIf="item.TransportModeForExport ==='A'">
                                            <img class="CenterCenter" style="width:20px;height:20px;margin-top:2px;margin-right:11px;"
                                                src="./Images/Airline.png" />
                                        </div>
                                        <div *ngIf="item.TransportModeForExport ==='L'">
                                            <img class="CenterCenter" style="width:20px;height:20px;margin-top:2px;margin-right:11px;"
                                                src="./Images/Trucker.png" />
                                        </div>
                                        <div *ngIf="item.TransportModeForExport ==='O'">
                                            <img class="CenterCenter" style="width:20px;height:20px;margin-top:2px;margin-right:11px;"
                                                src="./Images/Vessel.png" />
                                        </div>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Declaration.F.CustomerName' | TextCodeTranslationPipe"
                        [width]="'120'" [Alignment]="'right'" [binding]="'CustomerName'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ImporterName}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column
                        [header]="'Customs.Containerization.F.ContainerizationStatusName' | TextCodeTranslationPipe"
                        [width]="'120'" [Alignment]="'right'" [binding]="'ContainerizationStatusName'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.ContainerizationStatusName}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.F.HataraStatusName' | TextCodeTranslationPipe"
                        [width]="'100'" [Alignment]="'right'" [binding]="'HataraStatusName'">
                        <ng-template let-item>
                            <div (click)="rowClicked(item)">
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.HataraStatusName}}</span>
                                    </div>
                                </log-cell-template>
                            </div>
                        </ng-template>
                    </log-column>
                </logitude-edit-grid>
            </div>

        </td>
    </tr>

    <tr>
    </tr>
</table>
