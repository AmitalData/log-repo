<!--<p>Containerization !!!!</p>-->
<style>
.DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0; /*fbebbc*/
        padding: 4px 10px;
        color: gray;
        font-family: sans-serif;
        max-width: 660px;
        white-space: normal;
    }
</style>
<table>
   <tr style="height:32px">
        <td>
            <div *ngIf="YellowMessage" style="margin: 0 auto;position: absolute;width: 100%;text-align: center;left: 0;right: 0;">
                <div class="DisbleBox">
                    {{YellowMessage}}
                </div>
            </div>
        </td>
    </tr>
    <tr style="height :15px;">
        <!--<td style="font-size: 18px; color: #1B90CB;">
            <div>הצהרות בהמכלה </div>
        </td>-->
        <td class="TabTitleRow" style="padding-right:5px">הצהרות בהמכלה </td>
    </tr>

    <tr *ngIf="this.ContainerizationDeclarationList">
        <!--background-color :aquamarine;-->
        <td colspan="5" style="width: 100% ; height : 100%">
            <div class="GeneratedGridContainer"
                 style="width: 100% ;height:100%;">

                <logitude-edit-grid GridWidth="100%"
                                    GridHeight="100%"
                                    (RowDataLoaded)="OnRowLoaded($event)"
                                    [ItemSource]="ContainerizationDeclarationList">

                    <!-- DeclarationNumber -->
                    <log-column [header]="'Customs.Containerization.O.RowNumber' | TextCodeTranslationPipe"
                                [width]="'30'" [Alignment]="'right'"
                                [binding]="'RowNumber'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="TextTrimming RightCenter">
                                    <span>{{item.RowNumber}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!-- DeclarationNumber -->
                    <log-column [header]="'Customs.Declaration.F.DeclarationNumber' | TextCodeTranslationPipe"
                                [width]="'110'" [Alignment]="'right'"
                                [binding]="'DeclarationNumber'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="TextTrimming RightCenter">
                                    <span>{{item.DeclarationNumber}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>








                    <!-- ExportFile -->
                    <log-column [header]="'Customs.Containerization.O.ExportFile' | TextCodeTranslationPipe"
                                [binding]="'ExportFile'"
                                [width]="'120'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.ExportFile}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>


                    <log-column [header]="'Customs.Containerization.O.ImporterName' | TextCodeTranslationPipe"
                                [binding]="'ImporterName'"
                                [width]="'120'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.CustomerName}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.O.CargoTypeName' | TextCodeTranslationPipe"
                                [binding]="'CargoTypeName'"
                                [width]="'120'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.CargoTypeName}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <!-- ManifestNumber -->
                    <log-column [header]="'Customs.Containerization.O.ManifestNumber' | TextCodeTranslationPipe"
                                [binding]="'ManifestNumber'"
                                [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.ManifestNumber}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>


                    <!-- SecondCargoID -->
                    <log-column [header]="'Customs.Declaration.F.SecondCargoID' | TextCodeTranslationPipe"
                                [binding]="'SecondCargoID'"
                                [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.SecondCargoID}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>


                    <!-- ThirdCargoID -->
                    <log-column [header]="'Customs.Declaration.F.ThirdCargoID' | TextCodeTranslationPipe"
                                [binding]="'ThirdCargoID'"
                                [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.ThirdCargoID}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <!-- DeclarationStatusTypeName -->
                    <log-column [header]="'Customs.Declaration.F.DeclarationStatusTypeName' | TextCodeTranslationPipe"
                                [binding]="'DeclarationStatusTypeName'"
                                [width]="'210'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <span>{{item.DeclarationStatusTypeName}}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.Containerization.O.PaymentDate' | TextCodeTranslationPipe"
                                [binding]="'PaymentDate'"
                                [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div class="RightCenter">
                                    <div style="text-align:center" *ngIf="item.PaymentDate!=null">
                                        <img title="הגשה" src="./Images/CheckBoxIcon.png" />
                                    </div>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>


                    <log-column [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>

                                <span class="CellSeparator" style="float: right;"></span>

                                <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                    <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                </div>
                                <div style="width: 22px; float: right; height:20px; padding-top: 2px;display:block">
                                    <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteButtonClicked(item)" [IsEnabled]="!IsDisplayOnly"></IconButton>
                                </div>
                                <!--<div style="width: 22px;  height:20px;float:left; padding-top: 2px;">
                                    <CheckBox [IsChecked]="IsPrimary" ></CheckBox>
                                    <LogCheckBox [Checked]="item.IsPrimarySupplierInvoice" [ObjectTableName]="'Customs.SupplierInvoice'" [ObjectFieldName]="'IsPrimarySupplierInvoice'" [DataContext]="item" (ValueChanged)="IsPrimarySupplierInvoiceChecked($event,item)"></LogCheckBox>
                                </div>-->

                            </log-cell-template>
                        </ng-template>
                    </log-column>
                </logitude-edit-grid>

            </div>

        </td>
    </tr>

    <tr>
    </tr>
</table>
