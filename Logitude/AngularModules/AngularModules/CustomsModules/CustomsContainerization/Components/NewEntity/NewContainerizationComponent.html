<style>
    .FormFieldRow {
        height: 30px;
    }

    .subTitle {
        color: #1b90cb;
        font-size: 15px;
        padding-top: 10px;
        padding-bottom: 2px;
    }
    .ToggleButton {
        border: none !important;
    }

    .ActionButton {
        display: block;
        outline: none;
        text-align: center;
        font-size: 11px;
        color: #45494A;
        width: 100%;
        height: 22px;
        /*border: 1px solid #6A8299;*/
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        text-shadow: 1px 1px white;
        position: relative;
        cursor: pointer;
        height: 22px;
        padding: 0 5px;
    }

        .ActionButton:hover:not(:disabled) {
            background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
            background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
            background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
            background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        }

        .ActionButton:focus:not(:disabled) {
            border: 1px solid #3BB3E2;
            -webkit-box-shadow: 0px 0px 6px 0px #3BB3E2;
            -moz-box-shadow: 0px 0px 6px 0px #3BB3E2;
            box-shadow: 0px 0px 6px 0px #3BB3E2;
        }

    .ActionButton {
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
    }
    :host() ::ng-deep .StyleMess .ValidationSummary td:nth-child(2) {
        width: 1100px!important;

     }
</style>

<tr style="height: 28px;">
    <td colspan="5">
        <ValidationSummary class="StyleMess"  *ngIf="containerizationExtendedListService.IsError" [ItemsSource]="containerizationExtendedListService.ErrorsList" [SingleLine]="true"></ValidationSummary>
    </td>
</tr>

<table *ngIf="isLoad">

    <tr>
        <td>           
            <div class="TableHolder">
                <table>

                    <!-- Filters Fields [style.pointer-events]="AllowPointerEvents"-->
                    <tr>
                        <td colspan="2" style="width: 1200px;">
                            <table style="table-layout: fixed;">
                                <tr>
                                    <td><div></div></td>
                                </tr>
                                <tr class="FormFieldRow">
                                    <td style="height:26px; ">
                                        <div style="border:1px solid #6A8299;width:47px;border-radius: 3px;max-height: 26px;">
                                            <table>
                                                <tr>
                                                    <td>
                                                        <div class="ActionButton" style="width: 35px;height:23px; ">
                                                            <CheckBox style="pointer-events:none;" [IsChecked]="containerizationExtendedListService.connectedSelectAll" (Checked)="IsSelected =$event "></CheckBox>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="ToggleButton" tabindex="-1" style="width: 20px;height:23px;left:10px ">
                                                            <img src="./Images/ToggleIcon.png" style="float:left;" />
                                                            <div class="ToggleButtonMenu" style="width: 70px;top:26px; right:0px ;text-align:right">
                                                                <button style="text-align:right" (click)="OnAllBtnClicked()">{{'Customs.CourierMaster.O.All' | TextCodeTranslationPipe}}</button>
                                                                <button style="text-align:right" (click)="OnNoneBtnClicked()">{{'Customs.CourierMaster.O.None' | TextCodeTranslationPipe}}</button>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                    <td style="text-align:right !important; left:120px">
                                        <div style="color: #555555;">
                                            <!--{{'Customs.Declaration.F.ExportFile' |TextCodeTranslationPipe}}--> תיק יצוא:
                                        </div>
                                    </td>
                                    <td style="left:260px;">
                                        <LogTextBox [ObjectFieldName]="'ExportFile'" [InputType]="'text'" [DataContext]="DataContext"
                                                    [ObjectTableName]="objectTableNameDec" [HideColumns]="true" [Text]="ExportFile" (ValueChanged)="OnValueChange($event)"></LogTextBox>
                                    </td>


                                    <td style="width: 60px;"><div></div></td>
                                    <td style="text-align:right !important; left:500px">
                                        <ul class="FiltersMenu">
                                            <li (click)="itemClicked('All')" (mouseover)="itemMouseOver('All')" [class.SelectedFilter]="SelectedValue === 'All'">
                                                All
                                            </li>
                                            <li (click)="itemClicked('A')" (mouseover)="itemMouseOver('A')" (mouseleave)="itemMouseLeave('A')" [class.SelectedFilter]="SelectedValue === 'A'" title="Air">
                                                <img [id]="TransportFilter_A" class="CenterCenter" src="./Images/TransportModes/A_g.png" style="top: 1px;" />
                                            </li>
                                            <li (click)="itemClicked('O')" (mouseover)="itemMouseOver('O')" (mouseleave)="itemMouseLeave('O')" [class.SelectedFilter]="SelectedValue === 'O'" title="Ocean">
                                                <img [id]="TransportFilter_O" class="CenterCenter" src="./Images/TransportModes/O_g.png" style="top: 1px;" />
                                            </li>
                                            <li (click)="itemClicked('L')" (mouseover)="itemMouseOver('L')" (mouseleave)="itemMouseLeave('L')" [class.SelectedFilter]="SelectedValue === 'L'" title="Inland">
                                                <img [id]="TransportFilter_I" class="CenterCenter" src="./Images/TransportModes/I_g.png" style="top: 1px;" />
                                            </li>
                                        </ul>
                                    </td>
                                    <td style="width:130px;">
                                        <SearchTextBox [PlaceHolder]="'הצהרה/מזהה מטען/לקוח'" [ObjectTableName]="objectTableNameDec" (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
                                    </td>

                                </tr>
                            </table>
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <!-- Grid -->
                    <tr>
                        <td colspan="4" style="height: 100%;">

                            <div style="height: 100%;">

                                <table style="height: 100%;">
                                    <tr>
                                        <td>
                                            <div class="GeneratedGridContainer" style="padding:5px;vertical-align:top;top:0;position:absolute">
                                                <logitude-grid GridWidth="100%" GridHeight="100%"
                                                               [ObjectTable]="objectTableNameDec"
                                                               [dataSource]="DataSource"
                                                               [columns]="columns"
                                                               (AfterViewInitCompleted)="ViewInitCompleted($event)"
                                                               [QueryChangeEvent]="onQueryChangeEvent"
                                                               (CheckBoxChecked)="onCheckBoxChecked($event)"
                                                               [SelectedRow]="SelectedRow"
                                                               [IsCustomTemplate]="false"
                                                               [MenuHeaderchangeevent]="MenuHeaderchangeevent">
                                                </logitude-grid>
                                            </div>
                                        </td>
                                    </tr>
                                </table>

                            </div>
                        </td>
                    </tr>

                    <!-- footer -->
                    <tr style="height: 60px;">
                        <td><div></div></td>
                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' |TextCodeTranslationPipe}}</button>
                        </td>
                        <td style="width:5px"><div></div></td>
                        <td style="width: 57px;">
                            <button style="float: left; " class="GreenButton" [disabled]="!containerizationExtendedListService.SelectedDeclarations" (click)="SendButtonClicked()">המשך</button>
                        </td>
                        <!--<td style="width: 5px;">
        <div></div>
    </td>

    <td style="width: 57px;">
        <button class="RedButton" [disabled]="IsDisplayOnly" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
    </td>-->
                    </tr>
                </table>
            </div>
        </td>
    </tr>

</table>
