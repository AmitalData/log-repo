<style>

    .noBorder {
        border: none !important;
    }

    .col1Label {
        width: 100px;
    }

    .col1Text {
        width: 127px;
    }
</style>

<table style="border: 1px solid #3bb3e2;border-top:none">
    <tr>
        <!-->td style="width:10px"></td>
        <td-->
        <td colspan="4">
            <div class="TableHolder" style="width: 680px;" *ngIf="EntityPM">
                <table>
                    <tr>
                        <td colspan="2">
                            <table>
                                <tr style="height:25px">

                                    <!-->td width="10px;">
                                        <div *ngIf="RequestFileRedIconVisibility" style="width:7px;height:7px; border-radius:50%; background:red">

                                        </div>
                                    </td-->
                                    <td class="col1Label">
                                        <LogLabel [ObjectFieldName]="'ImporterCode'" [ObjectTableName]="'Customs.DecCargoSplitCon'"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td class="col1Text" style="text-align: right;">
                                        <!--<LogTextBox [ObjectFieldName]="'ImporterCode'" [ObjectTableName]="'Customs.DecCargoSplitCon'" [Text]="ImporterCode"
                                                    [HideColumns]="true" [DataContext]="DataContext"></LogTextBox>-->
                                        <SearchBox #ImporterSearchBox [ObjectTableName]="'Customs.Client'"
                                                   [IsQuickSearch]="true"
                                                   [DropDownWidth]="143"
                                                   [DisplayText]="ImporterCode"
                                                   [SearchText]="ImporterCode"
                                                   [DisplayMember]="'Code'"
                                                   [ItemHeight]="36"
                                                   [HideIcons]="true"
                                                   [Watermark]="''"
                                                   [IsDisabled]="!IsImporerCodeEnabled"
                                                   (LostFocus)="ImporterLostFocus($event, ImporterSearchBox)"
                                                   (ItemClicked)="ImporterClicked($event)"></SearchBox>
                                    </td>

                                    <td style="width: 15px;"><div></div></td>

                                    <td class="col1Label">
                                        <LogLabel [ObjectFieldName]="'ConditionCode'" [ObjectTableName]="'Customs.DecCargoSplitCon'"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td style="width: 10px;"><div></div></td>

                                    <td class="col1Text">
                                        <LogLov [ObjectFieldName]="'ConditionCode'"
                                                [ObjectTableName]="'Customs.DecCargoSplitCon'"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Customs.TreatmentWay'"
                                                [HideColumns]="true"
                                                [SelectedValue]="ConditionCode">
                                        </LogLov>
                                    </td>
                                    <td></td>
                                </tr>

                                <tr style="height:25px">
                                    <td class="col1Label">
                                        <LogLabel [ObjectFieldName]="'ProcedureCurrentCode'" [ObjectTableName]="'Customs.DecCargoSplitCon'"
                                                  [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td class="col1Text">
                                        <LogLov [ObjectFieldName]="'ProcedureCurrentCode'"
                                                [ObjectTableName]="'Customs.DecCargoSplitCon'"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Customs.GovernmentProcedureType'"
                                                [HideColumns]="true"
                                                [ManipulateData]="true"
                                                [QueryFilterItems]="PreceduralFilterItems"
                                                [SelectedValue]="ProcedureCurrentCode">
                                        </LogLov>
                                    </td>

                                    <td></td>
                                </tr>
                            </table>
                        </td>
                        <td></td>
                    </tr>

                    <tr style="height: 15px;"><td><div></div> </td></tr>

                    <tr>
                        <td class="TabTitleRow">{{'Customs.Declaration.O.ConsignmentPackages' | TextCodeTranslationPipe}}</td>
                        <td style="width: 25px;height: 20px;">
                            <div><IconButton [IsEnabled]="!IsDisplayOnly" [IsSmall]="true" [Name]="'Add'" (click)="AddItem()" style="float:left;"></IconButton></div>
                        </td>
                    </tr>
                    <tr>
                        <!-->td>
                        <table>
                            <tr style="width:450px; height:85px;">
                                <td style="width: 450px; height: 85px;">
                                    <div style="width: 450px; height: 85px;">
                                        <div class="GeneratedGridContainer" style="height : 85px;"-->
                        <td colspan="2" style="height: 100%;">
                            <div class="CellContent">
                                <!--[Disabled]="IsDisplayOnly" [IsDisplayMode]="true" [Editable]="false" [IsEnabled]="true"  -->
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="ItemsList"
                                                    (RowEnded)="OnRowEnded($event)"
                                                    (Ondblclick)="OnFocus()"
                                                    (SelectedItemChanged)="OnRowSelected($event)"
                                                    [SelectedRow]="SelectedRow">

                                    <log-column [header]="'Customs.DecCargoSplitConsItem.F.ParentCargoConsinmentItem' | TextCodeTranslationPipe"
                                                [binding]="'ParentCargoConsinmentItem'"
                                                [width]="'100'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IsEnabled]="!IsDisplayOnly" #logcelltemplate>
                                                <div style="width:100%;height:100%;text-align: right;">
                                                    <div *ngIf="DeclarationDirection != 'E'">
                                                        <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                            <span>{{item.ParentCargoConsinmentItem}}</span>
                                                        </div>
                                                        <div *ngIf="logcelltemplate.IsEditMode">
                                                            <LogTextBox #ParentCargoConsinmentItemTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'ParentCargoConsinmentItem'" [InputType]="'integer'" [DataContext]="item"
                                                                        [ObjectTableName]="'Customs.DecCargoSplitConsItem'" [HideColumns]="true"
                                                                        (LostFocus)="item.OnParentCargoConsinmentItemLostFocus(logcelltemplate,ParentCargoConsinmentItemTextBox)" [DebounceTime]="1" (KeyUp)="item.ParentCargoConsinmentItemKeyUp($event,logcelltemplate,ParentCargoConsinmentItemTextBox)"></LogTextBox>
                                                        </div>
                                                    </div>
                                                    <div *ngIf="DeclarationDirection == 'E'">
                                                        <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                            <span>{{item.ParentCargoConsinmentItem}}</span>
                                                        </div>
                                                        <div *ngIf="logcelltemplate.IsEditMode">
                                                            <select class="LogLovContainer LogLOVControl LogLovInputDiv" style="width: 90px; cursor:pointer;" #selectControl (change)="ParentCargoConsinmentItemSelectionChanged(item,selectControl.value)">
                                                                <option *ngFor="let c of ParentCargoConsinmentItemList" [selected]="c==item.ParentCargoConsinmentItem">{{c}}</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column [header]="'Customs.DecCargoSplitConsItem.F.GrossMassMeasure' | TextCodeTranslationPipe"
                                                [binding]="'GrossMassMeasure'"
                                                [width]="'100'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IsEnabled]="!IsDisplayOnly" #logcelltemplate>

                                                <div style="text-align: right;width:100%;height:100%;">
                                                    <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.GrossMassMeasure | NumbersPipe:'N2'}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox #GrossMassMeasureTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'GrossMassMeasure'" [InputType]="'double'" [DataContext]="item"
                                                                    [ObjectTableName]="'Customs.DecCargoSplitConsItem'" [HideColumns]="true"
                                                                    (LostFocus)="item.OnGrossMassMeasureLostFocus(logcelltemplate,GrossMassMeasureTextBox)" [DebounceTime]="1" (KeyUp)="item.GrossMassMeasureKeyUp($event,logcelltemplate,GrossMassMeasureTextBox)">
                                                        </LogTextBox>
                                                    </div>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Customs.DecCargoSplitConsItem.F.CargoDescription' | TextCodeTranslationPipe"
                                                [binding]="'CargoDescription'"
                                                [width]="'142'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IsEnabled]="!IsDisplayOnly" #logcelltemplate>
                                                <div style="width:100%;height:100%;text-align: right;">
                                                    <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                        <span>{{item.CargoDescription}}</span>
                                                    </div>
                                                    <div *ngIf="logcelltemplate.IsEditMode">
                                                        <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'CargoDescription'" [Text]="item.CargoDescription" [InputType]="'ntext'" [DataContext]="item"
                                                                    [ObjectTableName]="'Customs.DecCargoSplitConsItem'" [HideColumns]="true"></LogTextBox>
                                                    </div>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Customs.DecCargoSplitConsItem.F.RequestReasonCode' | TextCodeTranslationPipe"
                                                [binding]="'RequestReasonCode'"
                                                [width]="'222'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IsEnabled]="!IsDisplayOnly" #logcelltemplate>
                                                <div style="text-align: right;" class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                    <span>{{item.RequestReasonName}}</span>
                                                </div>
                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogLov [ObjectFieldName]="'RequestReasonCode'"
                                                            [ObjectTableName]="'Customs.DecCargoSplitConsItem'"
                                                            [DataContext]="item"
                                                            [LookUpTableName]="'Customs.SplitOrMergeReason'"
                                                            [HideColumns]="true"
                                                            (SelectedItemChanged)="item.SetLocalName($event, 'RequestReasonName')"
                                                            [FocusOnMe]="'true'">
                                                    </LogLov>

                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [width]="'54'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" [IsEnabled]="true" #logcelltemplate>

                                                <span class="CellSeparator" style="float: right;"></span>

                                                <div style="width: 22px; float: right; height:20px; padding-top: 2px; padding-right: 4px; display:block">
                                                    <!--<IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>-->

                                                    <IconButton [Name]="'Edit'" [IsEnabled]="true" [IsSmall]="true" *ngIf="!(item.EntityPM.DecCargoSplitConsPackDets != null && item.EntityPM.DecCargoSplitConsPackDets.length > 0)" (click)="EditButtonClicked(item)">
                                                        <img class="greenTickImg" src="./Images/Buttons/EditWithGreenTick.png" />
                                                    </IconButton>
                                                    <!--<button class="Button" style="padding-left: 6px; height:18px; width: 18px;right:4px;" *ngIf="item.EntityPM.DecCargoSplitConsPackDets != null && item.EntityPM.DecCargoSplitConsPackDets.length > 0" (click)="EditButtonClicked(item)" tabindex="-1">
                                                        <img class="greenTickImg" src="./Images/Buttons/EditWithGreenTick.png" />
                                                    </button>-->
                                                    <button class="Button" style="height:18px; width: 18px; right:0px; margin-right: 0px; " *ngIf="item.EntityPM.DecCargoSplitConsPackDets != null && item.EntityPM.DecCargoSplitConsPackDets.length > 0" (click)="EditButtonClicked(item)" tabindex="-1">
                                                        <img class="greenTickImg" src="./Images/Buttons/EditWithGreenTick.png" style="margin-right: -4px; margin-top: 1px" />
                                                    </button>
                                                </div>

                                                <!--<div style="float: right; padding-top:3px;  border-radius: 3px;">
                                                    <button class="Button" style="height:18px; width: 21px;right:8px" (click)="item.VehicleButtonClicked(item)" tabindex="-1">
                                                        <img style="left: 1px; position:absolute;top:1px; width:17px;height:15px" src="./Images/car.png" />
                                                        <img *ngIf="item.VehicleOkVisiblity" class="certOkImg" style="position: absolute;top:1px;left:3px; opacity: 0.8;" src="./Images/Buttons/EditWithGreenTick.png" />
                                                    </button>
                                                </div>-->


                                                <div style="width: 22px; float: right; height:20px; padding-top: 2px;display:block">
                                                    <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteButtonClicked(item)" [IsEnabled]="!IsDisplayOnly"></IconButton>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
</table>
