<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td style="width: 370px; padding-top: 10px;">
            <table>
                <tr>
                    <td>
                        <table>

                            <!-- CustomFileNo -->

                            <tr class="FormFieldRow">

                                <td style="width: 120px">
                                    <LogLabel [ObjectFieldName]="'CustomFileNo'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td style="padding-left: 36px;">
                                    <LogTextBox [ObjectFieldName]="'CustomFileNo'" [InputType]="'text'" [DataContext]="DataContext"
                                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                                </td>

                                <td><div></div></td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 120px">
                                    <LogLabel [ObjectFieldName]="'ActionTypeCode'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 180px">
                                    <LogLov [ObjectFieldName]="'ActionTypeCode'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [SelectedValue]="ActionTypeCode"
                                            [DependencyFilter1Value]="'CS'"
                                            [HideAddLink]="true"
                                            [LookUpTableName]="'ActionCode'"
                                            [DisplayMemberPath]="'LocalName'"
                                            [DisplayFieldsFromList]="'Code,LocalName'">
                                    </LogLov>
                                </td>
                                <td><div></div></td>
                            </tr>

                            <tr><td><div></div></td></tr>
                        </table>

                    </td>
                </tr>
            </table>
        </td>

        <td><div></div></td>


    </tr>

    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
