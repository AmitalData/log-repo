<style>
    .subTitle {
        color: #1b90cb;
        font-size: 15px;
    }

    .FlipImgHoriz {
        transform: rotate(180deg);
    }

    .Warning {
        max-width: 400px;
        color: #696969;
        text-align: left;
        background: #fff5ce;
        border: 1px solid #ffd598;
        border-radius: 5px;
        padding: 2px 10px;
        margin: 5px;
        margin: auto;
        white-space: normal;
    }

    .Warning:hover {
        transition: 0.3s all;
        background: #fcf2c8;
        color: black;
        cursor: default;

    }

    .FormFieldRow {
        height: 32px;
    }
</style>
<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="10">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- Filters Fields-->
    <tr>
        <td colspan="10" style="">

            <table style="table-layout: fixed;" *ngIf="EntityPM">

                <tr style="height: 20px;">
                    <td style="width: 130px;"></td>
                    <td style="width: 170px;"></td>
                    <td></td>
                </tr>


                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'InternalCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"> </LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'InternalCode'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.InternalCode || ''" [DataContext]="DataContext"
                            [HideColumns]="true" (ValueChanged)="onInputChange($event, 'InternalCode')"></LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BankCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'BankCode'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.BankCode || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'nText'"
                            (ValueChanged)="onInputChange($event ,'BankCode')"></LogTextBox>
                    </td>
                    <td></td>

                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BranchCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'BranchCode'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.BranchCode || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event, 'BranchCode')"></LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">

                    <td>
                        <LogLabel [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.AccountNumber || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event,'AccountNumber')"></LogTextBox>
                    </td>

                    <td></td>

                </tr>
                <tr class="FormFieldRow">

                    <td>
                        <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName "
                            [Placeholder]="this.EntityPM.LocalName || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event ,'LocalName')"></LogTextBox>
                    </td>

                    <td></td>

                </tr>
                <tr class="FormFieldRow">

                    <td>
                        <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName "
                            [Placeholder]="this.EntityPM.EnglishName || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event ,'EnglishName')"></LogTextBox>
                    </td>

                    <td></td>

                </tr>
                <tr class="FormFieldRow">

                    <td>
                        <LogLabel [ObjectFieldName]="'BankAddress'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'BankAddress'" [ObjectTableName]="ObjectTableName "
                            [Placeholder]="this.EntityPM.BankAddress || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event ,'BankAddress')"></LogTextBox>
                    </td>

                    <td></td>

                </tr>
                <tr class="FormFieldRow">

                    <td>
                        <LogLabel [ObjectFieldName]="'PayerTypeCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'PayerTypeCode'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.PayerTypeCode || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event,'PayerTypeCode')">
                        </LogTextBox>
                    </td>

                    <td></td>

                </tr>
                <tr class="FormFieldRow">

                    <!-- InActive -->
                    <td>
                        <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogCheckBox [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" [Checked]="this.EntityPM.InActive"
                            (ValueChanged)="onInputChange($event,'InActive')"></LogCheckBox>
                    </td>

                    <td></td>

                    <td></td>
                </tr>
                <table style="width:500px">
                    <tr class="FieldRow" style="height : 120px">
                        <td colspan="2">
                            <div class="GeneratedGridContainer" style="height : 100%;">
                                <logitude-edit-grid GridWidth="30%" GridHeight="100%"
                                    [ItemSource]="CustomBankCardItems">
                                    <log-column
                                        [header]="'Customs.CertificateOfOrigin.O.number' | TextCodeTranslationPipe"
                                        [binding]="'ItemSerial'" [width]="'150'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" [IsEnabled]="!IsDisplayOnly"
                                                #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.CardId}}</span>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'Customs.CertificateOfOrigin.O.number' | TextCodeTranslationPipe"
                                        [binding]="'ItemSerial'" [width]="'150'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" [IsEnabled]="!IsDisplayOnly"
                                                #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.CardName}}</span>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>

                </table>
            </table>

        </td>

    </tr>

    <tr *ngIf="isWindowMode" style="height: 20px;">
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel'
                |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;">
            <div></div>
        </td>
        <td style="width: 50px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Save' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
