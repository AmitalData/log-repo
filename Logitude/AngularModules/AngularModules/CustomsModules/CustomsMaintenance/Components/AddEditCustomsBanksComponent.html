<style>
    *{
        user-select: none
    }
 
    .subTitle {
        color: #1b90cb;
        font-size: 15px;
    }

    .FlipImgHoriz {
        transform: rotate(180deg);
    }

    .Warning {
        max-width: 400px;
        color: #696969;
        text-align: left;
        background: #fff5ce;
        border: 1px solid #ffd598;
        border-radius: 5px;
        padding: 2px 10px;
        margin: 5px;
        margin: auto;
        white-space: normal;
    }

    .Warning:hover {
        transition: 0.3s all;
        background: #fcf2c8;
        color: black;
        cursor: default;

    }

    .FormFieldRow {
        height: 32px;
    }
</style>


<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="10">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- Filters Fields-->
    <tr>
        <td colspan="10" style="">
            <table style="table-layout: fixed; user-select: none ; " *ngIf="EntityPM" >
                <tr style="height: 20px;">
                    <td style="width: 130px;"></td>
                    <td style="width: 170px;"></td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'InternalCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"> </LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'InternalCode'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.InternalCode || ''" [DataContext]="DataContext"
                            [HideColumns]="true" (ValueChanged)="onInputChange($event, 'InternalCode')"></LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BankCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'BankCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" [LookUpTableName]="'Customs.Bank'" [HideColumns]="true"
                            [SelectedValue]="'this.EntityPM.BankCode'"
                            (SelectedItemChanged)="onInputChange($event ,'BankCode')">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BranchCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'BranchCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" [LookUpTableName]="'Customs.CustomsBranch'"
                            [DependencyFilter1Value]="this.EntityPM.BankCode" [HideColumns]="true"
                            [SelectedItemObject]="this.EntityPM.BranchCode"
                            [SelectedValue]="'0'"
                            (SelectedItemChanged)="onInputChange($event?.Id,'BranchCode')">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName"
                            [Placeholder]="this.EntityPM.AccountNumber || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'nText'"
                            (ValueChanged)="onInputChange($event,'AccountNumber')"></LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName "
                            [Placeholder]="this.EntityPM.LocalName || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'nText'"
                            (ValueChanged)="onInputChange($event ,'LocalName')"></LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName "
                            [Placeholder]="this.EntityPM.EnglishName || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'Text'"
                            (ValueChanged)="onInputChange($event ,'EnglishName')"></LogTextBox>
                    </td>

                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BankAddress'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'BankAddress'" [ObjectTableName]="ObjectTableName "
                            [Placeholder]="this.EntityPM.BankAddress || ''" [DataContext]="DataContext"
                            [HideColumns]="true" [InputType]="'nText'"
                            (ValueChanged)="onInputChange($event ,'BankAddress')"></LogTextBox>
                    </td>
                    <td></td>

                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'PayerTypeCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'PayerTypeCode'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" [LookUpTableName]="'Customs.CustomerActivityType'"
                            [HideColumns]="true" [UseDefaultPosition]="true"
                            [SelectedValue]="this.EntityPM.PayerTypeCode"
                            (ValueChanged)="onInputChange($event ,'PayerTypeCode')">
                        </LogLov>
                    </td>

                    <td></td>

                </tr>
                <tr class="FormFieldRow">
                    <!-- InActive -->
                    <td>
                        <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogCheckBox [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" [Checked]="this.EntityPM.InActive"
                            (ValueChanged)="onInputChange($event,'InActive')"></LogCheckBox>
                    </td>
                    <td></td>
                    <td></td>
                </tr>
                <table style="width:444px; margin-top: 15px;">
                    <tr style="height: 28px; padding-top: 10px;">

                        <td style="width: 30px; float: left;">
                            <IconButton [Name]="'Add'" (click)="AddBankCardLine()"
                                [IsEnabled]="this.EntityPM.PayerTypeCode !== '3'">
                            </IconButton>
                        </td>
                    </tr>

                    <!-- Edit Grid -->
                    <tr>
                        <td colspan="3" style="height: 100%;">
                            <div class="CellContent">
                                                                                    
                               
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [Disabled]="this.EntityPM.PayerTypeCode === '3'"
                                    [ItemSource]="CustomBankCardItems" [Disabled]="this.EntityPM.PayerTypeCode === '3'">

                                    <log-column
                                        [header]="('Customs.CustomBank.O.CustomerNumber' | TextCodeTranslationPipe) || 'מספר לקוח'"
                                        [width]="'200'" [Alignment]="'right'" [binding]="'ItemSerial'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate>
                                                <div style="text-align: right;" class="TextTrimming"
                                                    *ngIf="logcelltemplate.IsDisplayMode">
                                                    <span>{{this.cardTempData[item.CardId]}}</span>
                                                </div>
                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [ObjectFieldName]="'Code'" [ObjectTableName]="'Card'"
                                                        [DataContext]="DataContext"
                                                        (ValueChanged)="onCardChange($event,item, 'Code')"
                                                        [HideColumns]="true"
                                                        [InputType]="'nText'"
                                                        >
                                                    </LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="('CustomerName' | TextCodeTranslationPipe) || 'שם לקוח'"
                                        [width]="'200'" [Alignment]="'right' " [binding]="'CardName'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate>
                                                <div style="text-align: right;" class="TextTrimming"
                                                    *ngIf="logcelltemplate.IsDisplayMode">
                                                    <span>{{item.cardName}}</span>
                                                </div>
                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [ObjectFieldName]="'LocalName'"
                                                        [ObjectTableName]="'Card'" [DataContext]="item"
                                                        [HideColumns]="true"
                                                        (ValueChanged)="onCardChange($event,item, 'LocalName')"
                                                        [InputType]="'nText'">
                                                    </LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [width]="'20'" [visibility]="'visibile'" [Alignment]="'center'"
                                        [IgnoreColumn]="true" [Editable]="true">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" [TabIndex]="-1">
                                                <div style="width: 02px; float: center; height:20px; padding-top: 2px; display:block"
                                                    class="removePackageButton">
                                                    <IconButton [Name]="'Delete'" [IsSmall]="true" [IsIconOnly]="true"
                                                        style="display: block; float: center; margin: 3px;"
                                                        (click)="RemoveBankCardLine(item)"></IconButton>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </table>
        </td>
    </tr>

    <tr *ngIf="isWindowMode" style="height: 20px;">
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel'
                |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;">
            <div></div>
        </td>
        <td style="width: 50px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Save' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
