
<style>
    .CustomLink:hover {
        cursor: pointer;
        color: #1B90CB;
        text-decoration: underline;
    }

    .CustomLink {
        color: #0026ff;
        text-decoration: none;
    }


    .simple-element {
        position: relative;
        display: block;
        background-color: transparent;
        height: 100%;
    }

    .Counter {
        display: inline-block;
        height: 30px;
        font-size: 20px;
        color: #548AEA;
        vertical-align: top;
    }
    /* Dropdown Button */
    .dropbtn {
        box-sizing: border-box;
        height: 22px;
        line-height: 22px;
        border: 1px solid #6a8299;
        border-radius: 3px;
        box-sizing: border-box;
        color: #45494a;
        cursor: pointer;
        display: block;
        font-size: 11px;
        height: 22px;
        outline: medium none;
        position: relative;
        text-align: center;
        text-shadow: 1px 1px white;
        width: 100%;
    }

        /* Dropdown button on hover & focus */
        .dropbtn:hover, .dropbtn:focus {
            background-color: #3e8e41;
        }

    /* The container <div> - needed to position the dropdown content */
    .dropdown {
        position: relative;
        display: inline-block;
        margin: 7px;
    }

    /* Dropdown Content (Hidden by Default) */
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        width: 206px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 2147483647;
        height: 246px;
    }

        /* Links inside the dropdown */
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

            /* Change color of dropdown links on hover */
            .dropdown-content a:hover {
                background-color: #f1f1f1;
            }

    .dropcontent {
    }

    /* Show the dropdown menu (use JS to add this class to the .dropdown-content container when the user clicks on the dropdown button) */
    .showDDButton {
        display: block;
        right: 0;
    }

    .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Chrome/Safari/Opera */
        -khtml-user-select: none; /* Konqueror */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently
                                  not supported by any browser */
    }
</style>
<div style="position: absolute; top:0px; bottom:0; left:0; right:0; margin:auto; padding: 10px; background: white;border-radius:0 5px 5px 0;">
    <table class="noselect">
        <tr style="height: 21px;">
            <td style="height: 21px;">
                <table>
                    <tr>

                        <!--<td style="width: 60px;padding-right:10px;">
                            <BackButton [Text]="BackBtnTitle" (click)="BackButtonClicked()"></BackButton>
                        </td>-->

                        <td style="width: 200px; vertical-align: middle;padding-right:10px;">
                            <SearchTextBox [ObjectTableName]="ObjectTableName"
                                           (SearchTextChangeEvent)="onSearchTextChangeEvent($event)">

                            </SearchTextBox>
                        </td>

                        <td style="width: 1px;padding-right:10px;">
                            <span class="Counter" style="font-size: 17px; color: #1B90CB;">
                                <strong>
                                    {{rowCount}} {{ _CustomsClosedTable.CustomsLocalName }}
                                </strong>
                            </span>
                        </td>

                        
                        <td></td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 10px;">
            <td style="height: 10px;">
                <div></div>
                <!--<sample-element style="height:500px;" class="jumbotron simple-element"></sample-element>-->
            </td>
        </tr>



        <tr *ngIf="IsShowTipArea" style="height:120px;">

            <!--[ShowTipEvent]="ShowTipEvent"-->

        </tr>



        <tr style="height: 10px;">
            <td style="height: 10px;">
                <div></div>
            </td>
        </tr>

        <tr>
            <td colspan="7" class="CellStretch">
                <div class="CellContent">
                    

                    <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                        <!--(RowDataLoaded)="OnRowLoaded($event)"-->
                        <logitude-edit-grid GridWidth="100%"
                                            GridHeight="100%"
                                            
                                            [ItemSource]="_ObservableList">
                          
                            <!-- MessageDate -->
                            <log-column [header]="'Customs.CustomsClosedTable.F.Id' | TextCodeTranslationPipe"
                                        [width]="'100'" [Alignment]="'right'"
                                        [binding]="'Content'">
                                <log-cell-template template="let item" #logcelltemplate>
                                    <div class="TextTrimming RightCenter">
                                        <span>{{item.idField}}</span>
                                    </div>
                                </log-cell-template>
                            </log-column>

                            <!-- MessageID -->
                            <log-column [header]="'Customs.CustomsClosedTable.F.CustomsLocalName' | TextCodeTranslationPipe"
                                        [binding]="'nameField'"
                                        [width]="'190'" [Alignment]="'right'">
                                <log-cell-template template="let item" #logcelltemplate>
                                    <div class="RightCenter">
                                        <span>{{item.nameField}}</span>
                                    </div>
                                </log-cell-template>
                            </log-column>

                           


                        </logitude-edit-grid>
                    </div>

                    
                </div>
            </td>
        </tr>
    </table>
</div>
