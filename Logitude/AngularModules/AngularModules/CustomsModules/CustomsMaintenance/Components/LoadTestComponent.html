

<style>
    .CustomMultiLinesText {
        width: 600px;
        max-height: 700px;
        height: 200px;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        font-size: 16px;
        border: 1px solid LightGray;
        border-radius: 3px;
        background-color: #EBEBEB;
    }

        .CustomMultiLinesText:hover {
            border: 1px solid #3BB3E2;
        }
</style>





<div style="position: absolute; top:0px; bottom:0; left:0; right:0; margin:auto; padding: 10px; background: white;border-radius:0 5px 5px 0;">
    <table class="noselect" *ngIf="Loaded">
        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="3">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
            </td>
        </tr>
        <tr>
            <td>
                <!-- 1s Table -->
                <table style="width:300px;">
                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'Consignee'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"
                                      [Text]="'Consignee'"
                                      >

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            <LogTextBox [ObjectFieldName]="'Consignee'"
                                        [InputType]="text"
                                        [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="Consignee"></LogTextBox>


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>

                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'CopyFromDecId'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"
                                      [Text]="'Copy From DecId'">

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            <LogTextBox [ObjectFieldName]="'CopyFromDecId'"
                                        [InputType]="text"
                                        [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="CopyFromDecId"></LogTextBox>


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>


                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'COM_ID'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"
                                      [Text]="'Filing Copy'">

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            <LogTextBox [ObjectFieldName]="'COM_ID'"
                                        [InputType]="text"
                                        [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="COM_ID"></LogTextBox>


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>
                    
                    <tr></tr>

                </table>
            </td>
            <td>
                <!-- 2s Table -->
                <table style="width:300px;">
                    <!--CustomerId-->
                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'CustomerId'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"
                                      [Text]="'CustomerId'"
                                      >

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            <LogTextBox [ObjectFieldName]="'CustomerId'"
                                        [InputType]="text"
                                        [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="CustomerId"></LogTextBox>


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>

            
                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                           
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                           


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>



                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'Max'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext"
                                      [Text]="'Max Time'">

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            <LogTextBox [ObjectFieldName]="'Max'"
                                        [InputType]="text"
                                        [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="Max"></LogTextBox>


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>

                    <!--placeholder-->
                    <tr class="FormFieldRow"></tr>

                    <tr></tr>
                </table>
            </td>
            <td></td>
        </tr>

        <!--split Zones-->
        <tr class="FormFieldRow"></tr>

        <tr>
            <td colspan="3">
                <table>
                    <tr class="FormFieldRow">
                       

                        <td colspan="4"  >

                            <div style="margin:10px;vertical-align:top;" class="CustomMultiLinesText">
                                
                                <!--word-wrap: break-word;-->
                                <div style="font-family:'Lucida Sans Unicode'; white-space: normal;;margin-top:5px;margin-bottom:5px; margin-left:10px;margin-right:10px;font-size:15px">
                                    {{_current}}
                                    <br>
                                        {{LogProccess}}
                                </div>
                            </div>


                        </td>

                        

                    </tr>

                </table>
            </td>
        </tr>



        <tr class="FormFieldRow">
            <td colspan="3"></td>
        </tr>
        <!-- footer -->
        <tr class="FormFieldRow">
            <td colspan="3">
                <table>
                    <tr>
                        <td></td>
                        <td style="width: 57px;">
                            <button *ngIf="CanStartAgain" class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                        </td>



                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button *ngIf="CanStartAgain" class="RedButton" (click)="OkButtonClicked()">Start</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
