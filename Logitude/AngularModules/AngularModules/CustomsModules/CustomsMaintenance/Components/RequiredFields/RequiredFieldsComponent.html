
<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .SystemDefaultsBoxHeader {
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
        height: 20px;
        font-size: 12px;
        color: #2c7194;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        user-select: none;
    }

    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .CellStretched {
        padding: 0px 5px !important;
    }

    .promptBox {
        text-align: center;
        padding: 10px;
        background: #fff4cd;
        width: 500px;
        height: 85px;
        color: #545454;
        border-radius: 5px;
    }

    .sometd::before {
        content: none;
    }

    /* TextsList */
    .TextsList {
        list-style: none;
        overflow: auto;
        height: 100%;
    }

        .TextsList li {
            padding: 2px 5px;
            user-select: none;
            cursor: pointer;
            border: 1px solid transparent; /* works on chrome */
            /*font-size: 13px;*/
        }

            .TextsList li:hover:not(.selected) {
                color: #08a2ce;
            }

            .TextsList li.selected {
                border: 1px solid #85cbed;
                border-radius: 3px;
                cursor: default;
                /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#e4f5fe+0,85cbed+100 */
                background: #e4f5fe; /* Old browsers */
                background: -moz-linear-gradient(top, #e4f5fe 0%, #85cbed 100%); /* FF3.6-15 */
                background: -webkit-linear-gradient(top, #e4f5fe 0%,#85cbed 100%); /* Chrome10-25,Safari5.1-6 */
                background: linear-gradient(to bottom, #e4f5fe 0%,#85cbed 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
                filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#e4f5fe', endColorstr='#85cbed',GradientType=0 ); /* IE6-9 */
            }


    .NoFieldMsg {
        width: 100%;
        text-align: center;
        padding: 15px 0px;
        font-size: 16px;
        color: #8f8f8f;
        user-select: none;
        cursor: default;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="ScrollViewer">
                <div class="ScrollContent">
                    <div class="TableHolder" style="padding: 0px;">
                        <table>
                            <tr>

                                <!-- Table 1 -->
                                <td style="width: 50%;">
                                    <table>
                                        <tr>
                                            <td style="height: 100%">
                                                <div class="SystemDefaultsBox">
                                                    <table>
                                                        <tr>
                                                            <td class="SystemDefaultsBoxHeader">{{ 'Customs.General.O.ObjectTables' | TextCodeTranslationPipe }}</td>
                                                        </tr>

                                                        <tr>
                                                            <td style="padding-left: 5px; padding-right: 5px;background: #eef3f9;border-bottom-left-radius: 5px;border-bottom-right-radius: 5px;">

                                                                <table>
                                                                    <tr style="height: 40px;">
                                                                        <td class="sometd">
                                                                            <SearchTextBox [PlaceHolder]="'General.O.Search' | TextCodeTranslationPipe"
                                                                                           (SearchTextChangeEvent)="TableNameSearchTextChanged($event)"></SearchTextBox>
                                                                        </td>
                                                                    </tr>
                                                                    <tr>
                                                                        <td style="vertical-align: top;">
                                                                            <ul class="TextsList">
                                                                                <li *ngFor="let table of TablesList"
                                                                                    [class.selected]="SelectedTable == table"
                                                                                    (click)="TableNameClicked(table)">{{table.TranslatedName}}</li>
                                                                            </ul>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </td>

                                                        </tr>

                                                    </table>
                                                </div>
                                            </td>

                                        </tr>
                                    </table>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <!-- Table 2 -->
                                <td style="width: 49%;">
                                    <table>
                                        <tr>
                                            <td style="height: 100%">
                                                <div class="SystemDefaultsBox">
                                                    <table>
                                                        <tr>
                                                            <td class="SystemDefaultsBoxHeader">{{ 'Customs.General.O.RequiredFields' | TextCodeTranslationPipe }}</td>
                                                        </tr>

                                                        <tr>
                                                            <td style="padding: 5px;background: #eef3f9;vertical-align: top;border-bottom-left-radius: 5px;border-bottom-right-radius: 5px;">
                                                                <table>
                                                                    <tr>
                                                                        <td style="vertical-align: top;">
                                                                            <ul class="TextsList">
                                                                                <div *ngIf="IsNoFields" class="NoFieldMsg">לא נבחרו שדות חובה</div>
                                                                                <li *ngFor="let field of FieldsList">{{field.ObjectFieldName}}</li>
                                                                            </ul>
                                                                        </td>
                                                                    </tr>
                                                                    <tr style="height: 30px;">
                                                                        <td class="sometd">
                                                                            <button class="Button" (click)="AddRemoveFieldsButtonClicked()">{{ 'Customs.General.O.AddRemoveRequiredFields' | TextCodeTranslationPipe }}</button>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </td>

                                                        </tr>

                                                    </table>
                                                </div>
                                            </td>

                                        </tr>
                                    </table>
                                </td>

                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <!--<td style="width: 57px;">
                        <button class="Button" (click)="OkButtonClicked()">Ok</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>-->

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{ 'General.B.Cancel' | TextCodeTranslationPipe }}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
