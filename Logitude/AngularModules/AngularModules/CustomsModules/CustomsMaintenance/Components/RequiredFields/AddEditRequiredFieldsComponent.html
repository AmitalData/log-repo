<style type="text/css">
    
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <!-- Search -->
    <tr style="height: 32px;">
        <td style="height: 32px; width: 220px;">
            <SearchTextBox [ObjectTableName]="'table'"
                           (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
        </td>
        <td></td>
    </tr>

    <tr>
        <td colspan="2" style="height: 100%; padding-top: 5px;">
            <div class="CellContent">
                <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                    [ItemSource]="FieldsList"
                                    [UseVirtuallization]="true"
                                    (SelectedItemChanged)="OnRowSelected($event)"
                                    [SelectedRow]="SelectedRow">

                    <!-- Name -->
                    <log-column [header]="'שם'" [width]="'250'" [Alignment]="'right'" [binding]="'Name'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate>
                                <div style="text-align: right;" class="TextTrimming">
                                    <span>{{ item.Name | TextCodeTranslationPipe }}</span>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>



                    <log-column [header]="'חובה ליבוא'" [width]="'65'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template [TabIndex]="-1" [IgnoreMods]="true">
                                <!--{{ item.Active }}-->
                                <CheckBox (Checked)="item.IsImport=$event;  CheckBoxChanged($event, item)" [IsChecked]="item.IsImport"></CheckBox>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <log-column [header]="'חובה ליצוא'" [width]="'65'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template [TabIndex]="-1" [IgnoreMods]="true">
                                <!--{{ item.Active }}-->
                                <CheckBox (Checked)="item.IsExport=$event; CheckBoxChanged($event, item)" [IsChecked]="item.isExport"></CheckBox>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <!-- Active -->
                    <!--<log-column [header]="'פעיל'" [width]="'45'" [Alignment]="'right'">
        <ng-template let-item>
            <log-cell-template [TabIndex]="-1" [IgnoreMods]="true">
                 <CheckBox (Checked)="CheckBoxChanged($event, item)" [IsChecked]="item.Active"></CheckBox>
            </log-cell-template>
        </ng-template>
    </log-column>-->

                </logitude-edit-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom" colspan="2">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{ 'General.B.Cancel' | TextCodeTranslationPipe }}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{ 'General.B.Ok' | TextCodeTranslationPipe }}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
