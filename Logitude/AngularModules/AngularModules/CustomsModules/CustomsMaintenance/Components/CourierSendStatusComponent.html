
<style>
</style>
<div style="position: absolute; top:0px; bottom:0; left:0; right:0; margin:auto; padding: 10px; background: white;border-radius:0 5px 5px 0;">
    <table class="noselect" >
        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="3">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
            </td>
        </tr>
        <tr>
            <td>
                <!-- 1s Table -->
                <table style="width:300px;">
                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'CourierMasterId'"
                                      [Text]="'CourierMasterId'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext">

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            <LogTextBox [ObjectFieldName]="'CourierMasterId'"                                        
                                        [DataContext]="DataContext"
                                        [ObjectTableName]="ObjectTableName"
                                        [HideColumns]="true"
                                        [Text]="'CourierMasterId'"></LogTextBox>


                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>



                    <!-- DCAPartnerVault -->
                    <tr class="FormFieldRow">
                        <td class="tbl1Label">
                            <LogLabel [NoObjectField]="true"
                                      [ObjectFieldName]="'SendOption'"
                                      [Text]="'Send Option'"
                                      [ObjectTableName]="ObjectTableName"
                                      [DataContext]="DataContext">

                            </LogLabel>
                        </td>
                        <td class="tbl1Col0"></td>

                        <td class="tbl1Col1">

                            
                            <ComboBox [ItemsSource]="_SendOptionList" [Binding]="'Value'" [SelectedItem]="SelectedSendOption" (SelectedItemChanged)="SelectedSendOption = $event"></ComboBox>

                        </td>

                        <td><div></div></td>

                        <td class="tbl1LastCol"><div></div></td>

                    </tr>



                    <tr></tr>

                </table>
            </td>
    
            <td></td>
        </tr>

        <!--split Zones-->
        <tr class="FormFieldRow"></tr>

    



        <tr class="FormFieldRow">
            <td colspan="3"></td>
        </tr>
        <!-- footer -->
        <tr class="FormFieldRow">
            <td colspan="3">
                <table>
                    <tr>
                        <td></td>
                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                        </td>



                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Save' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
