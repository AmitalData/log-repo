<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- HeaderScreen -->
    <tr style="height: 70px;">
        <td colspan="4">
            <div style="height: 70px;" class="HeaderScreen">
                <table *ngIf="CourierMasterPM">
                    <tr>
                        <!-- col 1 -->
                        <td style="height: 100%; width: 250px">
                            <table style="table-layout: fixed;">

                                <!-- MAWB -->
                                <tr style="height: 28px;">
                                    <td class="HeaderScreenLable" style="width: 90px;">
                                        <LogLabel [ObjectFieldName]="'MAWB'" [ObjectTableName]="'Customs.CourierMaster'" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td class="HeaderScreenValue">
                                        <div class="TextTrimming" style="width: 100%; position: relative;">
                                            {{CourierMasterPM.MAWB}}
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2">
                                        <div></div>
                                    </td>
                                </tr>

                            </table>
                        </td>
                        <td style="height: 100%; width: 10px">
                            <div style="width: 1px; height: 90%; margin:auto; background: #DADADA;"></div>
                        </td>

                        <!-- col 2 -->
                        <td style="height: 100%; width: 215px">
                            <table style="table-layout: fixed;">

                                <!-- HAWB -->
                                <tr style="height: 28px;">
                                    <td class="HeaderScreenLable" style="width: 100px;">
                                        <LogLabel [ObjectFieldName]="'HAWB'" [ObjectTableName]="'Customs.CourierMaster'" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td class="HeaderScreenValue">
                                        <div class="TextTrimming" style="width: 100%; position: relative;">
                                            {{CourierMasterPM.HAWB}}
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2">
                                        <div></div>
                                    </td>
                                </tr>

                            </table>
                        </td>
                        <td style="height: 100%; width: 10px">
                            <div style="width: 1px; height: 90%; margin:auto; background: #DADADA;"></div>
                        </td>

                        <!-- col 3 -->
                        <td style="height: 100%; width: 215px">
                            <table style="table-layout: fixed;">

                                <!-- TaxationDateTime -->
                                <tr style="height: 28px;">
                                    <td class="HeaderScreenLable" style="width: 110px;">
                                        <LogLabel [ObjectFieldName]="'TaxationDateTime'" [ObjectTableName]="'Customs.Declaration'" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td class="HeaderScreenValue">
                                        <div class="TextTrimming" style="width: 100%; position: relative;">
                                            {{CourierMasterPM.TaxationDateTime | DateTimeToDatePipe}}
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2">
                                        <div></div>
                                    </td>
                                </tr>

                            </table>
                        </td>
                        <td style="height: 100%; width: 10px">
                            <div style="width: 1px; height: 90%; margin:auto; background: #DADADA;"></div>
                        </td>

                        <!-- col 4 -->
                        <td style="height: 100%;">
                            <table style="table-layout: fixed;">

                                <!-- DeclarationStatusTypeName -->
                                <tr style="height: 28px;">
                                    <td class="HeaderScreenLable" style="width: 90px;">
                                        <LogLabel [ObjectFieldName]="'DeclarationStatusTypeName'" [ObjectTableName]="'Customs.Declaration'" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td class="HeaderScreenValue">
                                        <div class="TextTrimming" style="width: 100%; position: relative; font-weight: bold;" [style.color]="GetDeclarationStatusColor(DeclarationPM.DeclarationStatusTypeCode)">
                                            {{CourierMasterPM.DeclarationStatusTypeName}}
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2">
                                        <div></div>
                                    </td>
                                </tr>

                            </table>
                        </td>
                        <td></td>

                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height:40px; width:700px">
        <td>

            <table>
                <tr>
                    <td style="width:110px">
                        <LogLabel [ObjectFieldName]="'UpdateCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width: 150px; ">
                        <select (change)="ResetUpdateCodeListChangeSelected($event.target.value)"
                                style="width:150px;border:1px solid gray;border-radius:3px">
                            <option *ngFor="let item of UpdateCodeList" [value]="item.EnumId">{{item.Name}}</option>
                        </select>
                    </td>
                </tr>
            </table>
        </td>

        <td><div></div></td>
    </tr>

    <tr style="height:40px; width:700px">
        <td>
            <table>
                <tr>
                    <td style="width:110px">
                        <LogLabel [ObjectFieldName]="'GatewayPortCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:150px">
                        <LogLov [ObjectFieldName]="'GatewayPortCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [SelectedValue]="GatewayPortCode"
                                [LookUpTableName]="'Customs.InternationalSite'">
                        </LogLov>
                    </td>
                    <td style="width:30px"></td>
                </tr>
            </table>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width:110px">
                        <LogLabel [ObjectFieldName]="'OriginPortCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:150px">
                        <LogLov [ObjectFieldName]="'OriginPortCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [SelectedValue]="OriginPortCode"
                                [LookUpTableName]="'Customs.InternationalSite'">
                        </LogLov>
                    </td>
                </tr>
            </table>
        </td>

        <td></td>
        <td><div></div></td>
    </tr>

    <tr style="height:40px; width:700px">
        <td>
            <table>
                <tr>
                    <td style="width:110px">
                        <LogLabel [ObjectFieldName]="'TransportationTypeCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:150px">
                        <LogLov [ObjectFieldName]="'TransportationTypeCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [SelectedValue]="TransportationTypeCode"
                                [LookUpTableName]="'Customs.InternationalSite'">
                        </LogLov>
                    </td>
                    <td style="width:30px"></td>
                </tr>
            </table>
        </td>

        <td><div></div></td>
    </tr>

    <tr style="height: 40px;">
        <td>
            <div></div>
        </td>
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 67px;vertical-align: bottom; padding-right: 10px;">
            <button class="RedButton" (click)="OkButtonClicked()" [disabled]="!OkButtonEnabled">{{'General.B.Save' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
