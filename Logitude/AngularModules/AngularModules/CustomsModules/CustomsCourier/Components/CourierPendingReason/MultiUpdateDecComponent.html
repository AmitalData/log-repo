<div *ngIf="IsReady">
    <table>
        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="7">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
            </td>
        </tr>
        <tr style="height:30px">
            <td>
                <div></div>
            </td>
        </tr>
        <tr style="height:32px">
            <td>
                <table>
                    <tr>
                        <td style="width:140px">
                            <LogLabel [ObjectFieldName]="'ProcessTypeCode'" [ObjectTableName]="'Customs.SupplierInvoiceItemProcesType'"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:160px">
                            <LogLov tabindex="1" [ObjectFieldName]="'ProcessTypeCode'"
                                    [ObjectTableName]="'Customs.SupplierInvoiceItemProcesType'"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Customs.ItemGovernmentProcedureType'"
                                    [HideColumns]="true"
                                    [SelectedValue]="ProcessTypeCode">
                            </LogLov>
                        </td>
                        <td><div></div></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr style="height:15px">
            <td>
                <div></div>
            </td>
        </tr>
        <tr>
            <td>
                <table>
                    <tr>
                        <td style="width:140px">
                            <LogLabel [ObjectFieldName]="'TaxExemptCode'" [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:160px">
                            <SearchBox tabindex="1" [ObjectTableName]="'Customs.CustomsItems'"
                                       [IsQuickSearch]="true"
                                       [DropDownWidth]="144"
                                       [ItemHeight]="20"
                                       [DisplayText]="CustomsItem"
                                       [ErrorMessage]="CustomItemErrorMessage"
                                       [MaxPopupItemsCount]="10"
                                       (ItemClicked)="CustomsItemClicked($event)"
                                       (TextChanged)="CustomsItemTextChanged($event)"
                                       [IsDisabled]="IsDisplayOnly"
                                       [HideIcons]="true"
                                       (LostFocus)="CustomsItemLostFocus($event)"></SearchBox>

                        </td>
                        <td><div></div></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr style="height:15px">
            <td>
                <div></div>
            </td>
        </tr>
        <tr>
            <td>
                <table>
                    <tr>
                        <td style="width:140px">
                            <LogLabel [ObjectFieldName]="'ClassificationCode'" [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:160px">
                            <LogTextBoxV2 #ClassificationTextBox [ObjectFieldName]="'ClassificationCode'" [Text]="ClassificationCode"
                                          [InputType]="'integertext'" [HideColumns]="true" [DataContext]="DataContext" [FocusOnMe]="true" [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                          (LostFocus)="OnClassificationLostFocus(ClassificationTextBox)" [DebounceTime]="1" (KeyUp)="ClassificationKeyUp($event,ClassificationTextBox)"></LogTextBoxV2>

                        </td>
                        <td><div></div></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr style="height:32px;">
            <td><div></div></td>
        </tr>

        
        <tr style="height:32px">
            <td>
               
            </td>
        </tr>
        <tr style="height:50px;">
            <td colspan="1" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly" id="SaveItem">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
