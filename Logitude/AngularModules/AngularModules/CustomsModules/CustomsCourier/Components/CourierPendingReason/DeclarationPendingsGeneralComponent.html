

<table *ngIf="IsVisibile">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="7">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>


    <tr style="height:5px"></tr>
    <tr>

        <td></td>
        <td></td>

        <td></td>
        <td></td>

        <td></td>
        <td style=""></td>


        <td style="width: 25px;height: 20px;padding: 5px;padding-bottom: 0px;">
            <div><IconButton [IsEnabled]="!IsDisplayOnly" [IsSmall]="true" [Name]="'Add'" (click)="Add()" style="float:left;"></IconButton></div>
        </td>
    </tr>
    <tr style="height:5px"></tr>
    <tr style="height:100%;bottom:5px">
        <td colspan="7">
            <table>
                <tr>
                    <td style="width:10px"></td>
                    <td colspan="5" style="padding-right:10px">

                        <div class="CellContent" style="bottom: 5px;padding:5px">
                            <logitude-edit-grid GridWidth="100%"
                                                GridHeight="100%"
                                                (RowEnded)="OnRowEnded($event)"
                                                (Ondblclick)="OnFocus()"
                                                [IsReadOnly]="IsDisplayOnly"
                                                [ItemSource]="ItemsSource"
                                                (SelectedItemChanged)="OnRowSelected($event)"
                                                [SelectedRow]="SelectedRow">



                                <log-column [header]="'Customs.DeclarationCourierStatus.F.CourierPendingReasonCode' | TextCodeTranslationPipe" [binding]="'CourierPendingReasonCode'" [width]="'130'" [Alignment]="'right'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div style="text-align:right" class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                            <span>{{item.CourierPendingReasonName}}</span>
                                        </div>
                                        <div *ngIf="logcelltemplate.IsEditMode">
                                            <LogLov #CourierPendingReasonLovBox
                                                    [ObjectFieldName]="'CourierPendingReasonCode'"
                                                    [ObjectTableName]="ObjectTableName"
                                                    [DataContext]="item"
                                                    [LookUpTableName]="'Customs.CourierPendingReason'"
                                                    (SelectedItemChanged)="item.SetLocalName($event, 'CourierPendingReasonName')"
                                                    [FocusOnMe]="'true'"
                                                    [HideColumns]="true"
                                                    (LostFocus)="item.OnCourierPendingReasonLostFocus(logcelltemplate,CourierPendingReasonLovBox)"
                                                    (KeyUp)="item.CourierPendingReasonKeyUp($event,logcelltemplate,CourierPendingReasonLovBox)">
                                            </LogLov>

                                        </div>
                                    </log-cell-template>
                                </log-column>





                                <log-column [header]="'Customs.DeclarationCourierStatus.F.PendingRemarks' | TextCodeTranslationPipe" [binding]="'PendingRemarks'" [width]="'150'" [Editable]="true" [Alignment]="'right'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode">
                                            <span>{{item.PendingRemarks}}</span>
                                        </div>
                                        <div *ngIf="logcelltemplate.IsEditMode">
                                            <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'PendingRemarks'" [InputType]="'ntext'" [DataContext]="item"
                                                        [Text]="item.PendingRemarks" [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>

                                        </div>
                                    </log-cell-template>
                                </log-column>
                                <!--
    <log-column [header]="'Customs.DeclarationPending.F.Status' | TextCodeTranslationPipe" [binding]="'Status'" [width]="'130'" [Editable]="true" [Alignment]="'right'">
        <log-cell-template template="let item" #logcelltemplate>
            <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode">
                <span>{{item.Status}}</span>
            </div>
            <div *ngIf="logcelltemplate.IsEditMode">
                <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Status'" [DataContext]="item"
                            [Text]="item.Status" [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>

            </div>
        </log-cell-template>
    </log-column>
        -->

                                <log-column [width]="'40'" [Editable]="true" [Alignment]="'right'" [visibility]="'collapsed'">
                                    <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                        <div style="width: 30px; float: right; height:20px;padding-top:3px">
                                            <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="item.DeleteButtonClicked()" [IsEnabled]="!IsDisplayOnly"></IconButton>
                                        </div>
                                    </log-cell-template>
                                </log-column>
                            </logitude-edit-grid>
                        </div>
                    </td>

                </tr>
            </table>
        </td>



    </tr>

    <tr style="height: 32px;">
        <td colspan="7" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
