
<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="ScrollViewer">
                <div class="ScrollContent">
                    <div class="TableHolder" style="padding-top: 5px;">
                        <table>

                            <tr style="height: 30px;"><td><div></div></td></tr>

                            <!-- StorageSiteCode -->
                            <tr class="FormFieldRow">
                                <td style="width:110px">
                                    <LogLabel [ObjectFieldName]="'StorageSiteCode'" [ObjectTableName]="ObjectTableName"
                                              [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td style="width:150px">
                                    <LogLov [ObjectFieldName]="'StorageSiteCode'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [SelectedValue]="StorageSiteCode"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'Customs.DeliverySiteType'">
                                    </LogLov>
                                </td>

                                <td><div></div></td>
                            </tr>


                            <tr><td><div></div></td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="OkButtonClicked()">שמור</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
