<style>
    .tbl1Label {
        width: 130px;
    }

    .tbl1Col0 {
        width: 3px;
    }

    .tbl1Col1 {
        padding-right: 15px;
    }

    .tbl1Col1Time {
        padding-right: 15px;
    }

    .tbl1LastCol {
        width: 3px;
    }

    .tbl2Label {
        width: 130px;
    }

    .tbl3Label {
        width: 150px;
    }

    .my-checkbox-class {
        color: rgb(138, 138, 92);
    }

    .StatisticsTable-td {
        vertical-align: top;
    }
    
    .StatisticsTable-td > div {
        margin-top: 6px;
    }

    .Statistics {
        text-align: right;
        text-indent: 5px;
    }

    .StatisticsTable {
        border-collapse: collapse;
        table-layout: fixed;
    }

        .StatisticsTable tbody {
            overflow: auto;
            width: 100%;
            height: 90px;
            display: block
        }
        .StatisticsTable thead th {
            border: 1px solid #DADADA;
            text-indent: 5px;
            cursor: pointer;
            background: linear-gradient( 180deg, rgba(247, 247, 247, 1) 0%, rgba(245, 245, 245, 1) 52.38%, rgba(238, 238, 238, 1) 72.96%, rgba(226, 226, 226, 1) 87.88%, rgba(209, 209, 209, 1) 100%);
            color: #1B90CB;
        }
</style>

<table *ngIf="_TranslationLoaded ||  false" style="padding-top: 10px;width:100%">

    <tr *ngIf="entityArgs.ObjectTableName" class="FormFieldRow">
        <!-- id from EditControl then padding !!!!-->
        <td colspan="7"></td>
    </tr>
    <tr *ngIf="FiltersSectionVisibility">
      
        <td *ngIf="StatisticsVisibility" class="StatisticsTable-td">
            <div style="width:90%;position:absolute;top:5%;">
                <table class="StatisticsTable">
                    <thead style="width: 100%; display:table;">
                        <tr>
                            <th style="width:30%" class="Statistics"><h2>סוג בקשה</h2></th>
                            <th style="width:15%" class="Statistics"><h2>כמות</h2></th>
                            <th style="width:20%" class="Statistics"><h2>תעדוף</h2></th>
                        </tr>
                    </thead>
                    <tbody *ngIf="IsTherecustomsRequestsSheetSummary">
                        <tr style="display: table; width: 100%; table-layout: fixed; height: 20px; border-bottom:1px solid #A7A9AC;" *ngFor="let item of customsRequestsSheetSummary">
                            <td class="Statistics"  style="width:30%">{{item.InterfaceTypeName}}</td>
                            <td class="Statistics"  style="width:15%">{{item.count}}</td>
                            <td class="Statistics"  style="width:20%"> 
                                <button class="Button"
                                style="width:60px;" 
                                (click)="ChangePriority(item)">
                            תעדוף
                           </button>
                            </td>                           
                        </tr>
                    </tbody>
                    <tbody *ngIf="!IsTherecustomsRequestsSheetSummary">
                        <tr> <td> <div></div> </td> <td> <div></div></td></tr>
                    </tbody>
                
                </table>
            </div>
        </td>
    </tr>




   
    

</table>
