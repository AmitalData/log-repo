<style>
    .tbl1Label {
        width: 130px;
    }

    .tbl1Col0 {
        width: 3px;
    }

    .tbl1Col1 {
        padding-right: 15px;
    }

    .tbl1Col1Time {
        padding-right: 15px;
    }

    .tbl1LastCol {
        width: 3px;
    }

    .tbl2Label {
        width: 130px;
    }

    .tbl3Label {
        width: 150px;
    }

    .my-checkbox-class {
        color: rgb(138, 138, 92);
    }

    .StatisticsTable-td {
        vertical-align: top;
    }
    
    .StatisticsTable-td > div {
        margin-top: 6px;
    }

    .Statistics {
        text-align: right;
        text-indent: 5px;
    }

    .StatisticsTable {
        border-collapse: collapse;
        table-layout: fixed;
    }

        .StatisticsTable tbody {
            /* overflow: auto; */
            width: 100%;
            height: 100%;
            display: block
        }
        .StatisticsTable thead th {
            border: 1px solid #DADADA;
            text-indent: 5px;
            background: linear-gradient( 180deg, rgba(247, 247, 247, 1) 0%, rgba(245, 245, 245, 1) 52.38%, rgba(238, 238, 238, 1) 72.96%, rgba(226, 226, 226, 1) 87.88%, rgba(209, 209, 209, 1) 100%);
            color: #1B90CB;
        }
        .LogitudeIconButton {
        display: block !important;
        float: left !important;
        width: 19px;
        height: 19px;
        outline: none;
        border: 1px solid #6A8299;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;     
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        cursor: pointer;
    }
    .LogitudeIconButton img {
        position: absolute;
        top: 1px;
        bottom: 0;
        margin: auto;
    }
    .FlipImgHoriz{
        -moz-transform: scaleX(-1);
        -o-transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
        transform: scaleX(-1);
        filter: FlipH;
        -ms-filter: "FlipH";
    }
    .PriorityButton{
        float: none!important;
        margin-right: 9px!important;
    }
</style>
<button class="LogitudeIconButton" style="top:1.2%;left: 1%;" (click)="RefreshButtonClicked()"> <img class="FlipImgHoriz" style="visibility: inherit; top: 0px; right: 1px; left: 0px; width: initial;" src="./Images/Buttons/Refresh.png" /></button>
<table *ngIf="_TranslationLoaded ||  false" style="padding-top: 10px;width:100%">

    <tr *ngIf="entityArgs.ObjectTableName" class="FormFieldRow">
        <!-- id from EditControl then padding !!!!-->
        <td colspan="7"></td>
    </tr>
    <tr *ngIf="FiltersSectionVisibility">
      
        <td *ngIf="StatisticsVisibility" class="StatisticsTable-td">
            <div style="width:100%;position:absolute;top:1%;">
                <table class="StatisticsTable">
                    <thead style="width: 100%; display:table; height: 28px;">
                        <tr>
                            <th style="width:40%" class="Statistics"><h2>סוג בקשה</h2></th>
                            <th style="width:18%" class="Statistics"><h2>בקשות בטיסה</h2></th>
                            <th style="width:18%" class="Statistics"><h2>סה"כ בקשות</h2></th>
                            <th style="width:15%" class="Statistics"><h2>מס' תעדוף</h2></th>
                            <th style="width:15%" class="Statistics"><h2>תעדוף</h2></th>
                            <!-- <th style="width:10%" class="Statistics"></th> -->
                        </tr>
                    </thead>
                    <tbody *ngIf="IsTherecustomsRequestsSheetSummary">
                        <tr style="display: table; width: 100%; table-layout: fixed; height: 28px; border-bottom:1px solid #A7A9AC;" *ngFor="let item of customsRequestsSheetSummary">
                           <td class="Statistics"  style="width:40%">{{item.InterfaceTypeName}}</td> <!--   -->
                           <td class="Statistics"  style="width:18%">{{item.count}}</td>
                           <td class="Statistics"  style="width:18%">{{item.totalCount}}</td>
                           <td class="Statistics"  style="width:15%">{{item.TenantPriority}}</td>
                           <td class="Statistics">
                               <button class="LogitudeIconButton PriorityButton"
                               
                                (click)="ChangePriority(item)">
                                <img class="FlipImgHoriz" style="visibility: inherit; top: 0px; right: 1px; left: 0px; width: initial;" src="./Images/Buttons/Edit.png" />
                           </button>
                            </td>   
                            <!-- <td class="Statistics"  style="width:10%"></td>                         -->
                        </tr>
                    </tbody>
                    <tbody *ngIf="!IsTherecustomsRequestsSheetSummary">
                        <tr> <td> <div></div> </td> <td> <div></div></td></tr>
                    </tbody>
                
                </table>
            </div>
        </td>
    </tr>




   
    

</table>
