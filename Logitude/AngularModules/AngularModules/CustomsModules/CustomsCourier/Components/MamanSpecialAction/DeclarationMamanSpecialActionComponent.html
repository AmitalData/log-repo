
<div class="TableHolder">
    <table style="width: 100%; height: 100px;padding-top: 10px;">


        <tr *ngIf="_TerminalSuspentionNumber!=null">
            <td>
                <div>
                    <table style="margin-right:16px;margin-bottom:10px;">

                        <tr>
                            <td>
                                <!--opacity:0.5;-->
                                <div style="font-size:15px;font-weight:bold;margin-right:-14px">מס' תעודת עיכוב :{{_TerminalSuspentionNumber}} </div>
                            </td>

                            <td style="width: 57px;"></td>

                            <td style="width: 5px;">
                                <div></div>
                            </td>

                            <td></td>
                        </tr>
                        <tr style="width:10px"></tr>
                    </table>
                </div>
            </td>
        </tr>

        <tr>
            <td>

                <div style="border: 1px solid #3BB3E2; padding: 1rem">

                    <table style="width: 100%;height: 200px; padding-top: 10px;">
                        <tr>
                            <td colspan="12" style="width: 100%; height:200px">
                                <table>
                                    <tr style="width: 100%; height:200px">
                                        <td colspan="3" style="width: 100% ; height : 100%">
                                            <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">
                                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="_FetchDeclarationMamanSpecialActionList">

                                                    <!-- MamanSpecialActionCode -->
                                                    <log-column [header]="'Customs.DeclarationMamanSpecialAction.F.MamanSpecialActionCode' | TextCodeTranslationPipe"
                                                                [width]="'140'" [Alignment]="'right'" [binding]="'MamanSpecialActionCode'" [Editable]="true">
                                                        <log-cell-template template="let item" #logcelltemplate>
                                                            <div class="TextTrimming RightCenter">
                                                                <span>{{item.MamanSpecialActionCode}}</span>
                                                            </div>

                                                        </log-cell-template>
                                                    </log-column>




                                                    <!-- MamanSpecialActionStatusCode -->
                                                    <log-column [header]="'Customs.DeclarationMamanSpecialAction.F.MamanSpecialActionStatusCode' | TextCodeTranslationPipe"
                                                                [width]="'140'" [Alignment]="'right'" [binding]="'MamanSpecialActionStatusName'" [Editable]="true">
                                                        <log-cell-template template="let item" #logcelltemplate>
                                                            <div class="TextTrimming RightCenter">
                                                                <span>{{item.MamanSpecialActionStatusName}}</span>
                                                            </div>

                                                        </log-cell-template>
                                                    </log-column>


                                                    <!-- MamanSpecialActionsErrorXml -->
                                                    <log-column [header]="'Customs.DeclarationMamanSpecialAction.F.MamanSpecialActionsErrorXml' | TextCodeTranslationPipe"
                                                                [width]="'430'" [Alignment]="'right'" [binding]="'MamanSpecialActionsErrorXml'" [Editable]="true">
                                                        <log-cell-template template="let item" #logcelltemplate>
                                                            <div class="TextTrimming RightCenter">
                                                                <span>{{item.MamanSpecialActionsErrorXml}}</span>
                                                            </div>
                                                        </log-cell-template>
                                                    </log-column>




                                                </logitude-edit-grid>
                                            </div>
                                        </td>
                                    </tr>

                                    <tr><td><div></div></td></tr>
                                </table>
                            </td>
                        </tr>
                    </table>

                </div>

            </td>
        </tr>

        <tr>
            <td>
                <div>
                    <table>
                        <tr class="FormFieldRow">
                            <td>
                                <div></div>
                            </td>

                            <td style="width: 57px;"></td>

                            <td style="width: 5px;">
                                <div></div>
                            </td>

                            <td style="width: 57px;">
                                <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>
</div>
