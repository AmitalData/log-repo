<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 3px 3px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>

<table class="noselect">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- Filters Fields-->
    <tr>
        <td colspan="4" style="">

            <table style="table-layout: fixed;" *ngIf="EntityPM">
                <tr style="height: 10px;">
                    <td style="width: 130px;"></td>
                    <td style="width: 170px;"></td>
                    <td></td>
                </tr>

                <!-- MamanLabelText1 -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'MamanLabelText1'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext" ></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'MamanLabelText1'" [ObjectTableName]="ObjectTableName" [Text]="MamanLabelText1"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <!-- MamanLabelText2 -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'MamanLabelText2'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext" ></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'MamanLabelText2'" [ObjectTableName]="ObjectTableName" [Text]="MamanLabelText2"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <!-- MamanLabelText3 -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'MamanLabelText3'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'MamanLabelText3'" [ObjectTableName]="ObjectTableName" [Text]="MamanLabelText3"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <!-- MamanLabelText4 -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'MamanLabelText4'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'MamanLabelText4'" [ObjectTableName]="ObjectTableName" [Text]="MamanLabelText4"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <!-- MamanLabelText5 -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'MamanLabelText5'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'MamanLabelText5'" [ObjectTableName]="ObjectTableName" [Text]="MamanLabelText5"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <tr>
                    <td></td>
                </tr>

            </table>

        </td>
    </tr>

    <tr *ngIf="isWindowMode" style="height: 40px;">
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;"><div></div></td>
        <td style="width: 50px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
