<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 3px 3px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
        word-wrap: break-word;
        word-break: break-all;
        white-space: normal;
    }
</style>

<table *ngIf="Loaded">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- Filters Fields-->
    <tr>
        <td colspan="4" style="">

            <table style="table-layout: fixed;" >
                <tr style="height: 10px;">
                    <td style="width: 130px;"></td>
                    <td style="width: 170px;"></td>
                    <td></td>
                </tr>

                <!-- WarningMessage -->
                <tr class="FormFieldRow" style="width: 100% ;" *ngIf="WarningMessage != null">
                    <td colspan="3">
                        <table>
                            <tr class="FormFieldRow">
                                <td style="width: 10px; "><div></div></td>
                                <!-- [SingleLine]="false" [IsMultiline]="true" [IsDisabled]="true" white-space:pre-wrap; word-wrap:break-word-->

                                <td style="width: 500px; ">

                                    <div style="width: 100%; height:22px; text-align:right; ">
                                        <div class="DisbleBox">
                                            {{WarningMessage}}
                                        </div>
                                    </div>
                                </td>

                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr class="FormFieldRow"> </tr>

                <!-- KeywordtypeCode -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'KeywordtypeCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"
                                  
                                  ></LogLabel>
                    </td>
                    <td>
                        <!--[SelectedItem]="SelectedKeywordtypeCode"-->
                        <ComboBox [ItemsSource]="_KeywordtypeCodes"  [IsDisabled]="FromList" [SelectedItem]="SelectedItemKeywordtypeCode"  [Binding]="'Value'" (SelectedItemChanged)="KeywordtypeCodeClicked($event.Key)"></ComboBox>
                    </td>
                    <td></td>
                </tr>

                <!-- KeywordsList -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'KeywordsList'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'KeywordsList'" [ObjectTableName]="ObjectTableName" [Text]="KeywordsList"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'" [IsMultiline]="true"  ></LogTextBox>
                    </td>
                    <td></td>
                </tr>


                <tr>
                    <td></td>
                </tr>

            </table>

        </td>
    </tr>

    <tr style="height: 40px;">
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;"><div></div></td>
        <td style="width: 50px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
