<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 3px 3px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
        word-wrap: break-word;
        word-break: break-all;
        white-space: normal;
    }
</style>

<table *ngIf="Loaded">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- Filters Fields-->
    <tr>
        <td colspan="4" style="">

            <table style="table-layout: fixed;" *ngIf="EntityPM">
                <tr style="height: 10px;">
                    <td style="width: 130px;"></td>
                    <td style="width: 170px;"></td>
                    <td></td>
                </tr>


                <tr class="FormFieldRow"> </tr>

                <!-- CourierPendingReasonCode -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'CourierPendingReasonCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'CourierPendingReasonId'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Customs.CourierPendingReason'"
                                [HideColumns]="true"
                                [FocusOnMe]="true"
                                [SelectedValue]="CourierPendingReasonId">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>

                <!-- KeywordsList -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'KeywordsList'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'KeywordsList'" [ObjectTableName]="ObjectTableName" [Text]="KeywordsList"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <!-- KeywordsList -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'SearchByFieldCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <ComboBox [ItemsSource]="SearchByFieldCodes" [SelectedItem]="SelectedItemSearchByField" [Binding]="'Value'" (SelectedItemChanged)="SearchByFieldCodeClicked($event.Key)"></ComboBox>

                        
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'SearchType'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <ComboBox [ItemsSource]="SearchTypes" [SelectedItem]="SelectedItemSearchType" [Binding]="'Value'" (SelectedItemChanged)="SearchTypeClicked($event.Key)"></ComboBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'ExceptKeywords'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'ExceptKeywords'" [ObjectTableName]="ObjectTableName" [Text]="ExceptKeywords"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'nText'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                </tr>

            </table>

        </td>
    </tr>

    <tr *ngIf="isWindowMode" style="height: 40px;">
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;"><div></div></td>
        <td style="width: 50px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
