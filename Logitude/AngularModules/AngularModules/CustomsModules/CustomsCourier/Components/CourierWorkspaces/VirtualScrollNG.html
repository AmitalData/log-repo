<div class="card">
    <h5>Virtual Scroll with Lazy Loading from a Remote Datasource (10000 Rows)</h5>
    <!--[scrollable]="true"  [virtualScroll]="true" [virtualRowHeight]="34"   scrollHeight="250px" -->
    <p-table [columns]="cols"
             [value]="virtualCars" [lazy]="true" (onLazyLoad)="loadCarsLazy($event)"
             [paginator]="true" [rows]="10" [totalRecords]="TotalRecords" [loading]="loading" >


        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{col.header}}
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr style="height:34px">
                <td *ngFor="let col of columns">
                    {{rowData[col.field]}}
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody" let-columns="columns">
            <tr style="height:34px">
                <td *ngFor="let col of columns">
                    <div class="loading-text"></div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
