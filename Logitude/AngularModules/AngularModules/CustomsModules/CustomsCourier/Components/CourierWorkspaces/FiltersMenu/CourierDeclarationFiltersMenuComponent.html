<div style="width: 400px;">

                    [TextCode]="'Customs.DeclarationCourierStatus.O.Integrator'"></LogLabel>
            </td>
            <td colspan="2">
                <div>
                    <LogLov [ObjectFieldName]="'IntegratorCode'" [ObjectTableName]="'Customs.Declaration'"
