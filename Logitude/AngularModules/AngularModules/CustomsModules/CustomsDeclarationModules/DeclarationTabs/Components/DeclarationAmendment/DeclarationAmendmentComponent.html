
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.DeclarationAmendment'| TextCodeTranslationPipe}}
                        </td>
                    </tr>


                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="amendmentObslist">
                                    <!-- AmendmentRequestNumber -->
                                    <log-column [header]="'Customs.Declaration.F.AmendmentRequestNumber' | TextCodeTranslationPipe" [binding]="'AmendmentRequestNumber'" [width]="'90'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.AmendmentRequestNumber}}</span>
                                            </div>

                                        </log-cell-template>
                                    </log-column>

                                    <!-- VersionId -->
                                    <log-column [header]="'Customs.Declaration.F.VersionId' | TextCodeTranslationPipe"
                                                [binding]="'VersionId'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.VersionId}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- AmendmentCorrectedByUserName -->
                                    <log-column [header]="'Customs.Declaration.F.AmendmentCorrectedByUserName' | TextCodeTranslationPipe" [binding]="'AmendmentCorrectedByUserName'" [width]="'80'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.AmendmentCorrectedByUserName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- AmendmentStatusName -->
                                    <log-column [header]="'Customs.Declaration.F.AmendmentStatusName' | TextCodeTranslationPipe" [binding]="'AmendmentStatusName'" [width]="'140'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.AmendmentStatusName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Edit Button -->
                                    <log-column [width]="'100'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <span class="CellSeparator" style="float: right;">החלפת בקשה לתיקון</span>
                                            <!-- <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
             <IconButton [Name]="'Edit'" [IsSmall]="true"  ></IconButton>
    </div>-->
                                        </log-cell-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
