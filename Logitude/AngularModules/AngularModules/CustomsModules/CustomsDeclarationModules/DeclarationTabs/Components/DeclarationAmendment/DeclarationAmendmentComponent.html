
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.DeclarationAmendment'| TextCodeTranslationPipe}}
                            <button [disabled]="!CanOpenNewAmendment" style="width:100px;margin-top: 5px;margin-bottom: 5px;" class="Button" (click)="OpenNewAmendment()">    {{'Customs.Declaration.O.OpenDeclarationAmendment'| TextCodeTranslationPipe}}</button>
    

                        </td>


                        <!--<td style="left:0px;float:left">   </td>-->
                            <!--[disabled] ="!CanOpenNewAmendment"-->


                     
                    </tr>


                    <!--(rowSelectedEvent)= "OnRowSelected($event)"-->
                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-grid GridWidth="100%" GridHeight="100%"
                                               [ObjectTable]="ObjectTableName"
                                               [dataSource]="DataSource"
                                               [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                               [columns]="columns"
                                               [QueryChangeEvent]="onQueryChangeEvent"
                                               [IsCustomTemplate]="true">
                                    >
                                </logitude-grid>
                                <div>
                                </div>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
