
    <table *ngIf="this.EntityPM"
           style="margin:5px">

        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="10">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
            </td>
        </tr>

        <tr style="height:32px" class="FormFieldRow">


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'ExportUnloadingPortCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <!--(SelectedItemChanged)="CustomsShip = $event"-->
                <LogLov [ObjectFieldName]="'ExportUnloadingPortCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.InternationalSite'"
                        [DisplayMemberPath]="'LocalName'"
                        [SelectedValue]="ExportUnloadingPortCode"
                        [HideColumns]="true">
                </LogLov>
            </td>





            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'ExportLoadingPortCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogLov [ObjectFieldName]="'ExportLoadingPortCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.UnloadingSiteType'"
                        [DisplayMemberPath]="'LocalName'"
                        [SelectedValue]="ExportLoadingPortCode"
                        [HideColumns]="true">
                </LogLov>


            </td>



            <!--DestinationCountryCode-->
            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'FinalDestinationPortCode'"
                          [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogLov [ObjectFieldName]="'FinalDestinationPortCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.InternationalSite'"
                        [DisplayMemberPath]="'LocalName'"
                        [SelectedValue]="FinalDestinationPortCode"
                        [HideColumns]="true">
                </LogLov>


            </td>


            <!--IsExporterConfirmation-->
            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
            </td>

            <!--(ValueChanged)="IsExporterConfirmationChecked($event)"-->
            <td style="width: 160px;">
            </td>



            <td style="width:40px">
                <div></div>
            </td>
            <td>
                <div></div>
            </td>
        </tr>




        <tr style="height:32px" class="FormFieldRow">


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'DeliverySiteCode'"
                          [ObjectTableName]="ObjectTableName"
                          [Text]="'אתר מסירה'"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">

                <LogLov [ObjectFieldName]="'DeliverySiteCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.DeliverySiteType'"
                        [DisplayMemberPath]="'LocalName'"
                        [SelectedValue]="DeliverySiteCode"
                        [HideColumns]="true">
                </LogLov>
            </td>





            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'ExportRecieverWareHouseCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogLov [ObjectFieldName]="'ExportRecieverWareHouseCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.DeliverySiteType'"
                        [DisplayMemberPath]="'LocalName'"
                        [SelectedValue]="ExportRecieverWareHouseCode"
                        [HideColumns]="true">
                </LogLov>

            </td>



            <!--DestinationCountryCode-->
            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'IsDangerousGoods'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogCheckBox [ObjectFieldName]="'IsDangerousGoods'"
                             [Checked]="DataContext.IsDangerousGoods"
                             [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>


            </td>



            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
            </td>

            <!--(ValueChanged)="IsExporterConfirmationChecked($event)"-->
            <td style="width: 160px;">
            </td>



            <td style="width:40px">
                <div></div>
            </td>
            <td>
                <div></div>
            </td>
        </tr>


        <tr>
            <td>
                <div></div>
            </td>
        </tr>

        <tr style="height: 32px;">
            <td colspan="10" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 700px;">
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Save' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>


    </table>
