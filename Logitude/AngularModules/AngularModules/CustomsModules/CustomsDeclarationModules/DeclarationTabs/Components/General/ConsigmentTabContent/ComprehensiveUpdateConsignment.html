<table  style="margin:5px">


    <tr style="height:32px" class="FormFieldRow">

        <!--LoadingPortCode-->

            <LogLabel [ObjectFieldName]="'ExportLoadingPortCode'"

            </LogLabel>
        </td>

        <td style="width: 160px;">
            <LogLov [ObjectFieldName]="'ExportLoadingPortCode'"
                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                [LookUpTableName]="'Customs.LoadingSiteType'"
                [DisplayMemberPath]="'LocalName'"
                [SelectedValue]="ExportLoadingPortCode" [HideColumns]="true">
            </LogLov>


        </td>



        <td style="width:10px">
            <div></div>
        </td>
        <!--DeliverySiteCode-->

        <td style="width: 150px;">
            <LogLabel [ObjectFieldName]="'StorageSiteCodeExport'"
                [ObjectTableName]="ObjectTableName"
                [DataContext]="DataContext"></LogLabel>
        </td>

        <td style="width: 160px;">

            <LogLov [ObjectFieldName]="'StorageSiteCodeExport'"
                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"

                [DisplayMemberPath]="'LocalName'" [SelectedValue]="StorageSiteCodeExport"
                [HideColumns]="true">
            </LogLov>
        </td>


        <td style="width:10px">
            <div></div>
        </td>
     

        <td style="width:40px">
            <div></div>
        </td>
        <td>
            <div></div>
        </td>

    <tr style="height:32px" class="FormFieldRow">

      
        <!--FinalDestinationPortCode-->

        <td style="width: 150px;">
            <LogLabel [ObjectFieldName]="'FinalDestinationPortCode'"

        </td>

        <td style="width: 160px;">
            <LogLov [ObjectFieldName]="'FinalDestinationPortCode'"
                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                [LookUpTableName]="'Customs.InternationalSite'"
                [DisplayMemberPath]="'LocalName'"
                [SelectedValue]="FinalDestinationPortCode" [HideColumns]="true">
            </LogLov>


        </td>

        <td style="width:10px">
            <div></div>
        </td>
        <!--ShipCode-->
        <td style="vertical-align: top;padding-top: 2px; width: 160px;">
            <LogLabel [ObjectFieldName]="'ShipCode'" [ObjectTableName]="'Customs.Consignment'"
                [DataContext]="DataContext"></LogLabel>
        </td>

        <td style="vertical-align: top;padding-top: 2px;width: 160px;">
            <LogLov [ObjectFieldName]="'ShipCode'" [ObjectTableName]="'Customs.Consignment'" [DataContext]="DataContext"
                [LookUpTableName]="'Customs.CustomsShip'" [DisplayMemberPath]="'LocalName'" [SelectedValue]="ShipCode"

        </td>

        <td style="width:10px">
            <div></div>
        </td>
        


        <td style="width:40px">
            <div></div>
        </td>
        <td>
            <div></div>
        </td>
    </tr>
    <tr style="height:32px" class="FormFieldRow">

       
        <!--ExportUnloadingPortCode-->
        <td style="width: 150px;">
            <LogLabel [ObjectFieldName]="'ExportUnloadingPortCode'" [ObjectTableName]="ObjectTableName"
                [DataContext]="DataContext">
            </LogLabel>
        </td>
        <td style="width: 160px;">
            <LogLov [ObjectFieldName]="'ExportUnloadingPortCode'"
                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"

                [SelectedValue]="ExportUnloadingPortCode" [HideColumns]="true">

        </td>
       


        <td style="width:40px">
            <div></div>
        </td>
        <td>
            <div></div>
        </td>

    <tr style="height: 32px;">
        <td colspan="10" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 700px;">
                    </td>
                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |
                            TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" >{{'General.B.Save' | TextCodeTranslationPipe}}</button>
                           
                    </td>
                    <td style="width: 10px;">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>

    <tr style="height: 5px;">
        <td>

        </td>
