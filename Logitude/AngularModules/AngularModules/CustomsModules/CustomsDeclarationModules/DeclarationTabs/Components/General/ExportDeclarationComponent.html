
    <table style="margin:5px">

        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="10">
                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
            </td>
        </tr>

        <tr style="height:32px" class="FormFieldRow">


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'LoadingDateTime'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">

                <LogDatePicker [ObjectFieldName]="'LoadingDateTime'" [ObjectTableName]="ObjectTableName"
                               [DataContext]="DataContext" [HideColumns]="true" [SelectedDateValue]="LoadingDateTime"></LogDatePicker>

            </td>





            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'ShipCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogLov [ObjectFieldName]="'ShipCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.CustomsShip'"
                        [DisplayMemberPath]="'LocalName'"
                        (SelectedItemChanged)="CustomsShip = $event"
                        [SelectedValue]="ShipCode"
                        [HideColumns]="true">
                </LogLov>


            </td>



            <!--DestinationCountryCode-->
            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'DestinationCountryCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogLov [ObjectFieldName]="'DestinationCountryCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.CustomsCountry'"
                        [DisplayMemberPath]="'LocalName'"
                        (SelectedItemChanged)="DestinationCountry = $event"
                        [SelectedValue]="DestinationCountryCode"
                        [HideColumns]="true">
                </LogLov>


            </td>


            <!--IsExporterConfirmation-->
            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'IsExporterConfirmation'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <!--(ValueChanged)="IsExporterConfirmationChecked($event)"-->
            <!--(ValueChanged)="IsExporterConfirmationChecked($event)"-->
            <td style="width: 160px;">
                <LogCheckBox [ObjectFieldName]="'IsExporterConfirmation'"
                             [Checked]="DataContext.IsExporterConfirmation"
                             [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>



            </td>



            <td style="width:40px">
                <div></div>
            </td>
            <td>
                <div></div>
            </td>
        </tr>




        <tr style="height:32px" class="FormFieldRow">


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'RecipientName'" [ObjectTableName]="DeclarationExportRecipientTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">

                <LogTextBox [ObjectFieldName]="'RecipientName'" [ObjectTableName]="ObjectTableName"
                            [HideColumns]="true" [DataContext]="DataContext" [Text]="RecipientName"></LogTextBox>

            </td>





            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'RecipientAddress'" [ObjectTableName]="DeclarationExportRecipientTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogTextBox [ObjectFieldName]="'RecipientAddress'" [ObjectTableName]="ObjectTableName"
                            [HideColumns]="true" [DataContext]="DataContext" [Text]="RecipientAddress"></LogTextBox>


            </td>



            <!--DestinationCountryCode-->
            <td style="width:10px">
                <div></div>
            </td>


            <td style="width: 150px;">
                <LogLabel [ObjectFieldName]="'RecipientIssueCountryCode'" [ObjectTableName]="DeclarationExportRecipientTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>

            <td style="width: 160px;">
                <LogLov [ObjectFieldName]="'RecipientIssueCountryCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [LookUpTableName]="'Customs.CustomsCountry'"
                        [DisplayMemberPath]="'LocalName'"
                        (SelectedItemChanged)="_RecipientIssueCountry = $event"
                        [SelectedValue]="RecipientIssueCountryCode"
                        [HideColumns]="true">
                </LogLov>


            </td>



            <td style="width:10px">
                <div></div>
            </td>


            <td>
                <LogLabel [ObjectFieldName]="'ProcedureCurrentCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>
            <td>
                <LogLov [ObjectFieldName]="'ProcedureCurrentCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [HideColumns]="true"
                        [LookUpTableName]="'Customs.GovernmentProcedureType'"
                        [ManipulateData]="true"
                        [QueryFilterItems]="PreceduralFilterItems"
                        [SelectedValue]="ProcedureCurrentCode">
                </LogLov>
            </td>

            <td style="width:10px">
                <div></div>
            </td>


            <!--(ValueChanged)="IsExporterConfirmationChecked($event)"-->
            <td style="width: 160px;">
            </td>



            <td style="width:40px">
                <div></div>
            </td>
            <td>
                <div></div>
            </td>
        </tr>


        <tr style="height:32px" class="FormFieldRow">
            <!--<td>
                <div></div>
            </td>-->

            <td>
                <LogLabel [ObjectFieldName]="'ExportAutonomyRegionTypeCode'" [ObjectTableName]="ObjectTableName"
                          [DataContext]="DataContext"></LogLabel>
            </td>
            <td>
                <LogLov [ObjectFieldName]="'ExportAutonomyRegionTypeCode'"
                        [ObjectTableName]="ObjectTableName"
                        [DataContext]="DataContext"
                        [HideColumns]="true"
                        [LookUpTableName]="'Customs.AutonomyRegionType'"
                         [SelectedValue]="ExportAutonomyRegionTypeCode">
                </LogLov>
            </td>
        </tr>

        <tr style="height: 32px;">
            <td colspan="10" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 700px;">
                        </td>
                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' | TextCodeTranslationPipe}}</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Save' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>


    </table>
