
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.CargoSeal'| TextCodeTranslationPipe}}
                        </td>
                    </tr>


                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="CargoSealObslist">
                                    <!-- CargoRowNumber -->
                                    <log-column [header]="'Customs.CargoSealIdentifier.F.CargoRowNumber' | TextCodeTranslationPipe" [binding]="'CargoRowNumber'" [width]="'90'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CargoRowNumber}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- ContainerNumber -->
                                    <log-column [header]="'Customs.CargoSealIdentifier.F.ContainerNumber' | TextCodeTranslationPipe"
                                                [binding]="'ContainerNumber'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ContainerNumber}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>




                                    <!-- SealNumber -->
                                    <log-column [header]="'Customs.CargoSeal.F.SealNumber' | TextCodeTranslationPipe"
                                                [binding]="'SealNumber'" [width]="'100'" [Alignment]="'right'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.SealNumber}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- SealTypeCode -->
                                    <!--<log-column [header]="'Customs.CargoSeal.F.SealTypeCode' | TextCodeTranslationPipe"
                                                [width]="'100'" [Alignment]="'right'" [binding]="'SealTypeCode'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.SealTypeName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>-->

                                    <!-- SealCompletenessStateCode -->
                                    <log-column [header]="'Customs.CargoSeal.F.SealCompletenessStateCode' | TextCodeTranslationPipe"
                                                [width]="'100'" [Alignment]="'right'" [binding]="'SealCompletenessStateCode'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.SealCompletenessStateName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- UpdateReasonCode -->
                                    <!--<log-column [header]="'Customs.CargoSeal.F.UpdateReasonCode' | TextCodeTranslationPipe"
                                                [width]="'100'" [Alignment]="'right'" [binding]="'UpdateReasonCode'">
                                        <log-cell-template template="let item" #logcelltemplate>
                                            <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.UpdateReasonName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>-->


                                    <!-- Edit Button -->
                                    <log-column [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <span class="CellSeparator" style="float: right;"></span>
                                            <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
