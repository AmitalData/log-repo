<!-- Notification Reply Tab view  -->
<style>
    .BorderBox {
        border-top: 1px solid #838889; 
    }
    .TextAreaBox{
        text-align:right; 
        border-bottom: 1px solid gray;
    }
    .DateBox{ 
        vertical-align: central;
        font-size: 12px;
        font-weight: bold;
        color: #838889;
        position: relative;
        padding: 0 20px;
    }
    

.DisbleBox{
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
     }

.GrayBox {
        margin: 0 auto;
        background: #f9f9f9;
        border: 2px solid #e0e0e0;
        margin-top: 15px;
        padding: 10px;
    }

</style>
<table>
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <!-- WarningMessage -->
                    <tr class="FormFieldRow" style="width: 100% ; height : 22px" *ngIf="MessageBorderVisibility">
                        <td>
                            <table>
                                <tr class="FormFieldRow">
                                    <td >
                                        <div style="width: 100%; height:22px; text-align:center">
                                            <div class="DisbleBox">
                                                {{MessageBorderText}}
                                            </div>
                                        </div>
                                    </td>

                                    <td><div></div></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr class="FormFieldRow" style="text-align:center; " *ngIf="!MessageBorderVisibility">
                        <td>
                            <table>
                                <tr class="FormFieldRow" *ngFor="let notificationsGroupItem of NotificationsGroupsList">
                                    <td>
                                        <table>
                                            <!-- Notifications Groups List (By CreateDate) -->
                                            <tr style="height:20px; width:100%">
                                                <td>
                                                    <table>
                                                        <tr>
                                                            <td style="height:20px; width:45%">
                                                                <div class="BorderBox" style="height:20px; text-align: center; margin: 20px;"> </div>
                                                            </td>

                                                            <td style="height:20px; width:10%">
                                                                <div style="height:25px; text-align: center">
                                                                    <div class="DateBox">
                                                                        {{notificationsGroupItem.CreateDate | DateTimePipe:'D'}}
                                                                    </div>
                                                                </div>
                                                            </td>

                                                            <td style="height:20px; width:45%">
                                                                <div class="BorderBox" style="height:20px; text-align: center; margin: 20px;"> </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>

                                            <tr style="height: 10px;"><td></td></tr>

                                            <!-- Notifications List -->
                                            <tr style="height:20px; width:100%">
                                                <td>
                                                    <div class="GrayBox">
                                                        <table style="width: 100%; padding-top: 10px;">
                                                            <tr class="FormFieldRow" *ngFor="let notificationsItem of notificationsGroupItem.NotificationsList" style="width:100%">
                                                                <td>
                                                                    <table>
                                                                        <!-- NotificationData -->
                                                                        <tr>
                                                                            <td>
                                                                                <table>
                                                                                    <tr>
                                                                                        <td style="width: 100%;">
                                                                                            <div style="width: 100%; height:20px; ">
                                                                                                <div class="FormFieldRow TextTrimming" style="text-align:right; width:1024px;" title="{{notificationsItem.NotificationData}}">
                                                                                                    {{notificationsItem.NotificationData}}
                                                                                                </div>
                                                                                            </div>
                                                                                        </td>
                                                                                    </tr>
                                                                                </table>
                                                                            </td>
                                                                        </tr>
                                                                        <tr>
                                                                            <td>
                                                                                <table>
                                                                                    <tr>
                                                                                        <td style="height:20px; width:100%">
                                                                                            <div class="BorderBox" style="height:20px; text-align: center"> </div>
                                                                                        </td>
                                                                                    </tr>
                                                                                </table>
                                                                            </td>
                                                                        </tr>

                                                                        <!-- ResponseList -->
                                                                        <tr class="FormFieldRow" *ngFor="let notificationResponseItem of notificationsItem.ResponseList">
                                                                            <td style="width: 100%; height: 20px">
                                                                                <table>
                                                                                    <tr>
                                                                                        <td>
                                                                                            <table>
                                                                                                <tr>
                                                                                                    <td style="width: 5%;">
                                                                                                        <img title="Arrow" class="CenterCenter" sizes="20px" style="cursor: pointer;" src="./Images/CellIcons/Arrow.png" />
                                                                                                    </td>
                                                                                                    <td style="width: 2%;"><div></div></td>
                                                                                                    <td style="width: 81%; height: 20px">
                                                                                                        <div>
                                                                                                            <div class="FormFieldRow" style="text-align:right; width: 100%;overflow-y: auto; word-break: break-all; white-space: normal;" >
                                                                                                                {{notificationResponseItem.ResponseToCustoms}}
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                    <td style="width: 5%;">
                                                                                                        <div>
                                                                                                            <div class="FormFieldRow TextTrimming">
                                                                                                                {{notificationResponseItem.RepliedByUserName}}
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                    <td style="width: 2%;"><div></div></td>
                                                                                                    <td style="width: 5%;">
                                                                                                        <div>
                                                                                                            <div class="FormFieldRow TextTrimming">
                                                                                                                {{notificationResponseItem.ReplyDateTime | DateTimePipe:'D'}}
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                </tr>
                                                                                            </table>
                                                                                        </td>
                                                                                    </tr>

                                                                                    <tr>
                                                                                        <td>
                                                                                            <table>
                                                                                                <tr>
                                                                                                    <td style="height:20px; width:100%">
                                                                                                        <div class="BorderBox" style="height:20px; text-align: center"> </div>
                                                                                                    </td>
                                                                                                </tr>
                                                                                            </table>
                                                                                        </td>
                                                                                    </tr>

                                                                                </table>
                                                                            </td>
                                                                        </tr>

                                                                        <!-- NotificationReply -->
                                                                        <tr>
                                                                            <td>
                                                                                <table>
                                                                                    <tr>
                                                                                        <td style="width: 85%;">
                                                                                            <div style="width: 100%; height:95%; text-align:center;">
                                                                                                <textarea [(ngModel)]="notificationsItem.NotificationReply" style="box-shadow:none; background: #faf5c0;"></textarea>
                                                                                            </div>
                                                                                        </td>

                                                                                        <td style="width: 10px;"><div></div></td>

                                                                                        <td style="width:90px;  vertical-align: central;">
                                                                                            <custom-send-options *ngIf="notificationsItem.entityPM.ResponseToMessage" #NotificationReplyTabComponent (SendButtonClicked)="notificationsItem.OnCustomSendOptionsButtonClick($event)"></custom-send-options>
                                                                                        </td>
                                                                                    </tr>
                                                                                </table>
                                                                            </td>
                                                                        </tr>
                                                                    </table>
                                                                </td>
                                                            </tr>

                                                        </table>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>                                     
                        </td>
                    </tr>
                    
                    <tr><td></td></tr>
                </table>
            </div>
        </td>
    </tr>
</table>
