
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.PhysicalCheck'| TextCodeTranslationPipe}}
                        </td>
                    </tr>

                    <tr>
                        <td colspan="5" style="height: 100%;">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    (SelectedItemChanged)="EditButtonClicked($event)"
                                                    [ItemSource]="physicalCheckList">
                                    <!-- DeclarationNo -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.DeclarationNo' | TextCodeTranslationPipe" [binding]="'DeclarationNo'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.DeclarationNo}}</span>
                                            </div>

                                        </log-cell-template>
                                    </log-column>

                                    <!-- Customer -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.CustomerCode' | TextCodeTranslationPipe" [binding]="'CustomerName'" [width]="'140'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomerName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- StorageSite -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.StorageSiteCode' | TextCodeTranslationPipe" [binding]="'StorageSiteName'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.StorageSiteName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- CheckSite -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.CheckSiteCode' | TextCodeTranslationPipe" [binding]="'CheckSiteName'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CheckSiteName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- QueueType -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.QueueTypeCode' | TextCodeTranslationPipe" [binding]="'QueueTypeName'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.QueueTypeName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- CheckId -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.CheckId' | TextCodeTranslationPipe" [binding]="'CheckId'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CheckId}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- LimitDate -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.LimitDate' | TextCodeTranslationPipe" [binding]="'LimitDate'" [width]="'100'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.LimitDate | DateTimeToDatePipe}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- ContainerNubmer -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.ContainerNubmer' | TextCodeTranslationPipe" [binding]="'ContainerNubmer'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ContainerNubmer}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Operation -->
                                    <log-column [header]="'Customs.PhysicalCheck.F.OperationCode' | TextCodeTranslationPipe" [binding]="'OperationName'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.OperationName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
