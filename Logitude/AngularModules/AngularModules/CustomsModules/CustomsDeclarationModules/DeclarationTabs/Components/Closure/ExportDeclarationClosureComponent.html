<style>
    .subTitle {
        color: #4b90cb;
        font-size: 17px;
        padding-left: 5px;
    }

    .FormFieldRow {
        height: auto !important;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }

    .noselect {
        -webkit-touch-callout: none;
        /* iOS Safari */
        -webkit-user-select: none;
        /* Chrome/Safari/Opera */
        -khtml-user-select: none;
        /* Konqueror */
        -moz-user-select: none;
        /* Firefox */
        -ms-user-select: none;
        /* Internet Explorer/Edge */
        user-select: none;
        /* Non-prefixed version, currently
                                  not supported by any browser */
    }


    /* Filters Overide styles */

    .FiltersMenu li {
        float: right !important;
        border-width: 1px 1px 1px 0px !important;
    }

    .FiltersMenu li:first-child {
        border-radius: 0px 3px 3px 0px !important;
    }

    .FiltersMenu li:last-child {
        border-radius: 3px 0px 0px 3px !important;
        border-left: 1px solid #6A8299 !important;
    }

    .FiltersMenu li:active:not(.SelectedFilter) {
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#c4c6c6+0,dbdbdb+19,bcbec0+79,a2a4a5+100 */
        background: #c4c6c6;
        /* Old browsers */
        background: -moz-linear-gradient(top, #c4c6c6 0%, #dbdbdb 19%, #bcbec0 79%, #a2a4a5 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #c4c6c6 0%, #dbdbdb 19%, #bcbec0 79%, #a2a4a5 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #c4c6c6 0%, #dbdbdb 19%, #bcbec0 79%, #a2a4a5 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#c4c6c6', endColorstr='#a2a4a5', GradientType=0);
        /* IE6-9 */
    }

    /* List Styles */
    .ConstraintList li {
        position: relative;
        border: 1px solid #DADADA;
        border-radius: 4px;
        -moz-border-radius: 4px;
        -webkit-border-radius: 4px;
        margin-bottom: 3px;
        z-index: 0;
    }

    .ConstraintList li:hover {
        cursor: auto;
        background: rgba(232, 247, 255, 1);
        border: 1px solid #3BB3E2;
        background: -moz-linear-gradient(50% 106.14% 90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: -webkit-gradient(linear, 50% 106.14%, 50% -10.13%, color-stop(0, rgba(133, 203, 237, 1)), color-stop(0.2259, rgba(150, 211, 240, 1)), color-stop(0.6737, rgba(196, 231, 248, 1)), color-stop(0.9968, rgba(232, 247, 255, 1)));
        background: -o-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        /*transition: 0.3s;*/
    }

    .ListItem-right {
        padding: 10px;
        display: inline-block;
        width: 150px;
        /*background: #ffa9e0;*/
        background: white;
        position: absolute;
        height: 100%;
        border-radius: 0px 3px 3px 0px;
    }

    .ListItem-right a {
        font-size: 13px;
        color: #1b90cb;
    }

    .ListItem-right a:hover {
        color: #73a9d8;
    }

    .ListItem-middle {
        vertical-align: top;
        width: calc(100% - 660px);
        margin-right: 150px;
        padding: 10px;
        display: inline-block;
        /*background: rgba(232, 247, 255, 1);*/
    }

    .ListItem-left {
        vertical-align: top;
        min-height: 60px;
        display: inline-block;
        /*background: #ffd800;*/
        width: 510px;
        padding: 10px;
        min-height: 60px;
        /*background: #e2e2e2;*/
        z-index: 1;
    }

    .leftDarkBackground {
        width: 510px;
        background: #e2e2e2;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: -1;
        border-radius: 3px 0px 0px 3px;
        pointer-events: none;
    }

    /* Others */
    .hidden {
        opacity: 0;
        visibility: collapse;
    }


    .TextTrimming {
        vertical-align: top !important;
    }

    .TabCloseIcon:hover {
        background: url('./Images/Tab.X.Blue.png') no-repeat;
    }

    .TabCloseIcon {
        background: url('./Images/Tab.X.Gray.png') no-repeat;
    }

    /* HOVER */
    .LogTabControl .TabControlHead li:not(.Selected):not(.NewTabItem):hover .InnerChild {
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#ffffff+0,ffffff+18,b3d2f2+94,ffffff+95,ffffff+100 */
        background: #ffffff;
        /* Old browsers */
        background: -moz-linear-gradient(top, #ffffff 0%, #ffffff 18%, #b3d2f2 94%, #ffffff 95%, #ffffff 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #ffffff 0%, #ffffff 18%, #b3d2f2 94%, #ffffff 95%, #ffffff 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #ffffff 0%, #ffffff 18%, #b3d2f2 94%, #ffffff 95%, #ffffff 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#ffffff', endColorstr='#ffffff', GradientType=0);
        /* IE6-9 */
    }

    /* ACTIVE */
    .LogTabControl .TabControlHead li:not(.Selected):not(.NewTabItem):active .InnerChild {
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#c2d7ed+0,eff2f4+16,b4d0ed+94,ffffff+95,ffffff+100 */
        background: #c2d7ed;
        /* Old browsers */
        background: -moz-linear-gradient(top, #c2d7ed 0%, #eff2f4 16%, #b4d0ed 94%, #ffffff 95%, #ffffff 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #c2d7ed 0%, #eff2f4 16%, #b4d0ed 94%, #ffffff 95%, #ffffff 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #c2d7ed 0%, #eff2f4 16%, #b4d0ed 94%, #ffffff 95%, #ffffff 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#c2d7ed', endColorstr='#ffffff', GradientType=0);
        /* IE6-9 */
    }

    .LogTabControl .TabControlHead li:not(.Selected):not(.NewTabItem):hover {
        background: #448DCA;
    }

    .LogTabControl .TabControlHead li:not(.NewTabItem) .InnerChild {
        height: 100%;
        width: 100%;
        color: black;
        font-size: 13px;
        text-align: left;
        padding-left: 5px;
        padding-right: 3px;
        background: transparent;
    }

    .LogTabControl .TabControlHead li:not(.NewTabItem) {
        height: 23px;
        width: 95px;
        line-height: 23px;
        border: 1px solid #b1b1b1;
        display: inline-block;
        float: left;
        cursor: default;
        overflow: hidden;
        border-radius: 4px 4px 0px 0px;
        -moz-border-radius: 4px 4px 0px 0px;
        -webkit-border-radius: 4px 4px 0px 0px;
        /* Permalink - use to edit and share this gradient: http://colorzilla.com/gradient-editor/#ffffff+0,ffffff+21,e2e2e2+94,e2e2e2+94,ffffff+95,ffffff+100 */
        background: #ffffff;
        /* Old browsers */
        background: -moz-linear-gradient(top, #ffffff 0%, #ffffff 21%, #e2e2e2 94%, #e2e2e2 94%, #ffffff 95%, #ffffff 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #ffffff 0%, #ffffff 21%, #e2e2e2 94%, #e2e2e2 94%, #ffffff 95%, #ffffff 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #ffffff 0%, #ffffff 21%, #e2e2e2 94%, #e2e2e2 94%, #ffffff 95%, #ffffff 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#ffffff', endColorstr='#ffffff', GradientType=0);
        /* IE6-9 */
    }

    .LogTabControl .TabControlHead li:not(.Selected) {
        height: 23px;
        margin-top: 2px;
        border-bottom: 1px solid #b9b9b9;
    }

    .LogTabControl .TabControlHead li.Selected {
        pointer-events: none;
        height: 25px;
        line-height: 25px;
        margin-bottom: -1px;
        background: white;
        border: 1px solid #6dbdd1;
        border-bottom: 1px solid white;
        transition: margin 0.2s;
    }

    .LogTabControl .TabControlBody {
        position: absolute;
        left: 0;
        right: 0;
        top: 25px;
        bottom: 0;
        background: white;
        border: 1px solid #b9b9b9;
        border-top: none;
    }

    .LogTabControl .TabControlHead ul {
        width: 100%;
        height: 100%;
        padding-left: 8px;
        padding-right: 0px;
    }

    .LogTabControl .TabControlHead {
        width: 100%;
        height: 25px;
        position: relative;
        border-bottom: 1px solid #a3aeb9;
    }

    .LogTabControl {
        width: 100%;
        height: 100%;
        position: relative;
    }
</style>
<table *ngIf="EntityPM">
    <tr>
        <td>
            <div class="TableHolder">
                <div style="position: absolute; top: 0;" class="LogTabControl">

                    <div class="TabControlHead">
                        <ul>
                            <li *ngFor="let tab of TabsSource" style="width: auto; min-width: 75px;"
                                [class.Selected]="tab.isSelected" [style.float]="LayoutDirection ? 'right' : 'left'"
                                (click)="SelectionChanged(tab)">

                                <div style="position: relative; width: 100%;" class="InnerChild"
                                    [style.text-align]="'center'">
                                    <div class="TextTrimming" style="font-size: 11px;">
                                        <p> {{tab.Header}}</p>
                                        <img *ngIf="EntityPM.AmendmentErrorXml &&  tab.Name=='Errors'"
                                            class="LeftCenter" style="width:10px;height:10px;margin-top:6px;left:2px"
                                            title="Yes" src="./Images/CheckBoxIcon.png" />
                                    </div>
                                </div>

                            </li>
                        </ul>
                    </div>

                    <div class="TabControlBody" style="background: white;">
                        <div class="MediaFillAbsolute">
                            <div style="height: 100%;padding: 15px;" [ngSwitch]="SelectedTab">
                                <div *ngSwitchCase="'References'" style="height: 100%;">
                                    <table>
                                        <tr>
                                            <td>
                                                <logitude-edit-grid GridWidth="100%" GridHeight="100%"
                                                    [ItemSource]="ReferenceList" [UseVirtuallization]="true"
                                                    [IsDarkHeader]="true">

                                                    <log-column
                                                        [header]="'Customs.Declaration.O.ReferenceType' | TextCodeTranslationPipe"
                                                        [width]="'120'" [Alignment]="'right'"
                                                        [binding]="'ReferenceTypeName'">

                                                        <ng-template let-item>
                                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                                <div style="text-align: right;" class="TextTrimming">
                                                                    <span>{{item.ReferenceTypeName}}</span>
                                                                </div>
                                                            </log-cell-template>
                                                        </ng-template>

                                                    </log-column>


                                                    <log-column
                                                        [header]="'Customs.Declaration.O.RefernceStatus' | TextCodeTranslationPipe"
                                                        [width]="'120'" [Alignment]="'right'"
                                                        [binding]="'RefernceStatusName'">

                                                        <ng-template let-item>
                                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                                <div style="text-align: right;" class="TextTrimming">
                                                                    <span>{{item.RefernceStatusName}}</span>
                                                                </div>
                                                            </log-cell-template>
                                                        </ng-template>

                                                    </log-column>

                                                    <log-column
                                                        [header]="'Customs.Declaration.O.RefernceID' | TextCodeTranslationPipe"
                                                        [width]="'120'" [Alignment]="'right'" [binding]="'RefernceID'">

                                                        <ng-template let-item>
                                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                                <div style="text-align: right;" class="TextTrimming">
                                                                    <span>{{item.RefernceID}}</span>
                                                                </div>
                                                            </log-cell-template>
                                                        </ng-template>

                                                    </log-column>

                                                    <log-column
                                                        [header]="'Customs.Declaration.O.RefernceInputType' | TextCodeTranslationPipe"
                                                        [width]="'120'" [Alignment]="'right'"
                                                        [binding]="'RefernceInputTypeName'">

                                                        <ng-template let-item>
                                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                                <div style="text-align: right;" class="TextTrimming">
                                                                    <span>{{item.RefernceInputTypeName}}</span>
                                                                </div>
                                                            </log-cell-template>
                                                        </ng-template>

                                                    </log-column>

                                                    <log-column
                                                        [header]="'Customs.Declaration.O.Remarks' | TextCodeTranslationPipe"
                                                        [width]="'150'" [Alignment]="'right'" [binding]="'Remarks'">

                                                        <ng-template let-item>
                                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                                <div style="text-align: right;" class="TextTrimming">
                                                                    <span>{{item.Remarks}}</span>
                                                                </div>
                                                            </log-cell-template>
                                                        </ng-template>

                                                    </log-column>

                                                    <log-column [width]="'30'" [Alignment]="'right'">
                                                        <ng-template let-item>
                                                            <log-cell-template #logcelltemplate>
                                                                <div *ngIf="item.Remarks != null ">
                                                                    <button class="Button"
                                                                        (click)="ExpandComment(item , $event)"><img
                                                                            class="CenterCenter" title="לצפייה בהערה"
                                                                            src="./Images/Icons/expand.png" /></button>
                                                                </div>
                                                            </log-cell-template>
                                                        </ng-template>
                                                    </log-column>


                                                </logitude-edit-grid>

                                            </td>
                                        </tr>
                                    </table>

                                </div>

                                <div *ngSwitchCase="'Errors'" style="height: 100%;">
                                    <CustomsAnswer [IsAmendmentErrors]="'true'"></CustomsAnswer>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </td>
    </tr>
</table>
