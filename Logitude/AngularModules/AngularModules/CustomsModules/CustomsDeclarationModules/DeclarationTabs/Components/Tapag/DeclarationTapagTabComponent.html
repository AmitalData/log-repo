
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.Tapags'| TextCodeTranslationPipe}}
                        </td>
                    </tr>


                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="tapagObslist">
                                    <!-- TapagType -->
                                    <log-column [header]="'Customs.Tapag.F.TapagTypeName' | TextCodeTranslationPipe" [binding]="'TapagTypeName'" [width]="'90'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.TapagTypeName}}</span>
                                            </div>

                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- TapagFile -->
                                    <log-column [header]="'Customs.Tapag.F.CustomsTapagFile' | TextCodeTranslationPipe" 
                                                [binding]="'CustomsTapagFile'" [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomsTapagFile}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- Numeral -->
                                    <log-column [header]="'Customs.Tapag.F.CustomsNumeral' | TextCodeTranslationPipe" [binding]="'CustomsNumeral'" [width]="'80'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomsNumeral}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- LeadingFileNumber -->
                                    <log-column [header]="'Customs.Tapag.F.LeadingFileNumber' | TextCodeTranslationPipe" [binding]="'LeadingFileNumber'" [width]="'140'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.LeadingFileNumber}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- RequestFileNumber -->
                                    <log-column [header]="'Customs.TapagConnectionTable.F.RequestFileNumber' | TextCodeTranslationPipe" [binding]="'RequestFileNumber'" [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.RequestFileNumber}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- CreateDate -->
                                    <log-column [header]="'Customs.Tapag.F.CreateDate' | TextCodeTranslationPipe" [binding]="'CreateDate'" [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CreateDate | DateTimePipe:'DT'}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- ValidityDate -->
                                    <log-column [header]="'Customs.Tapag.F.ValidityDate' | TextCodeTranslationPipe" [binding]="'ValidityDate'" [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ValidityDate | DateTimePipe:'DT'}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- IsClosed -->
                                    <log-column [header]="'Customs.PaymentOrder.F.IsClosed' | TextCodeTranslationPipe" [binding]="'IsClosed'" [width]="'50'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <img *ngIf="item.IsClosed" title="IsClosed" src="./Images/CheckBoxIcon.png" />
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- Edit Button -->
                                    <log-column [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <span class="CellSeparator" style="float: right;"></span>
                                            <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
