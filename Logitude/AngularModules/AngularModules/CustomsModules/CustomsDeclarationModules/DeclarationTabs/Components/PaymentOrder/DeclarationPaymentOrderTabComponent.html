
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table>
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.PaymentOrder'| TextCodeTranslationPipe}}
                        </td>
                    </tr>


                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">                           
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="paymentOrderlist">
                                    <!-- PaymentNumber -->
                                    <log-column [header]="'Customs.PaymentOrder.F.PaymentNumber' | TextCodeTranslationPipe" [binding]="'PaymentNumber'" 
                                                [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.PaymentNumber}}</span>
                                            </div>

                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- CreateDate -->
                                    <log-column [header]="'Customs.PaymentOrder.F.CreateDate' | TextCodeTranslationPipe" [binding]="'CreateDate'" 
                                                [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CreateDate | DateTimeToDatePipe}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- LastPayDate -->
                                    <log-column [header]="'Customs.PaymentOrder.F.LastPayDate' | TextCodeTranslationPipe" [binding]="'LastPayDate'" 
                                                [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.LastPayDate | DateTimeToDatePipe}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- Customer -->
                                    <log-column [header]="'Customs.PaymentOrder.F.CustomerId' | TextCodeTranslationPipe" [binding]="'CustomerName'" [width]="'150'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomerName}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- PaymentProcess -->
                                    <log-column [header]="'Customs.PaymentOrder.F.PaymentProcessCode' | TextCodeTranslationPipe" [binding]="'PaymentProcessName'" [width]="'110'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.PaymentProcessName}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- TotalSumToPay -->
                                    <log-column [header]="'Customs.PaymentOrder.F.TotalSumToPay' | TextCodeTranslationPipe" [binding]="'TotalSumToPay'" [width]="'100'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.TotalSumToPay}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- PaymentStatus -->
                                    <log-column [header]="'Customs.PaymentOrder.F.PaymentStatusCode' | TextCodeTranslationPipe" [binding]="'PaymentStatusName'" [width]="'100'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.PaymentStatusName}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- Importer -->
                                    <log-column [header]="'Customs.PaymentOrder.F.ImporterId' | TextCodeTranslationPipe" [binding]="'ImporterName'" [width]="'100'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ImporterName}}</span>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- IsClosed -->
                                    <log-column [header]="'Customs.PaymentOrder.F.IsClosed' | TextCodeTranslationPipe" [binding]="'IsClosed'" [width]="'70'" [Alignment]="'right'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <div style="text-align:right">
                                                <img *ngIf="item.IsClosed" title="IsClosed" src="./Images/CheckBoxIcon.png" />
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                    <!-- Edit Button -->
                                    <log-column [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                                            <span class="CellSeparator" style="float: right;"></span>
                                            <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                            </div>
                                        </log-cell-template>
</ng-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
