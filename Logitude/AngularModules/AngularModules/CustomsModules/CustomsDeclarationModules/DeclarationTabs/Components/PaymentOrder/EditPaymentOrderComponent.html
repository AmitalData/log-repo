
<style>
    .FlipImgHoriz {
        transform: rotate(180deg);
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td colspan="3">
            <table>


                <tr style="height: 40%;">

                    <td>



                        <div class="FillParent CurvedArea">
                            <table>
                                <tr>
                                    <td style="width: 100px">
                                        <div class="FillParent AppLeftMenuBackgroundRTL">
                                            <table>
                                                <tr style="height:5px;">
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td style="vertical-align: top;">
                                                        <ul>
                                                            <li class="DefaultMenuItem" *ngFor="let item of TabsItemsSource" (click)="SelectedTabCode = item.code" [class.SelectedMenuItem]="item.code === SelectedTabCode"
                                                                [style.text-align]="LayoutDirection=='rtl' ? 'right' : 'left'">
                                                                <!--<img *ngIf="item != SelectedMenu" style="position:absolute; top:0; bottom:0; margin:auto;" [attr.src]="item.IconSource" [ngStyle]="LayoutDirection == 'rtl' ? {'right': '10px;'} : {'left': '10px;'}" />
                                                                <img *ngIf="item == SelectedMenu" style="position:absolute; top:0; bottom:0; margin:auto;" [attr.src]="item.IconSelectedSource" [ngStyle]="LayoutDirection == 'rtl' ? {'right': '11px;'} : {'left': '11px;'}" />-->
                                                                <div style="position:absolute; top:0; bottom:0; margin:auto; height: 22px; line-height: 22px;" [ngStyle]="LayoutDirection == 'rtl' ? {'right': '5px;','padding-right':'5px'} : {'left': '25px'}">{{item.textCode | TextCodeTranslationPipe}}</div>
                                                                <img *ngIf="SelectedTabCode == item.code" [className]="LayoutDirection == 'rtl' ? 'LeftCenter' : 'RightCenter'" [class.FlipImgHoriz]="LayoutDirection" src="./Images/SelectedMenuArrow.png" style="margin-right: -1px;" />

                                                                <!--<img class="RightCenter" *ngIf="SelectedTabCode == item.code" src="./Images/SelectedMenuArrow.png" style="margin-right: -1px" />

                                                                <div>{{item.textCode | TextCodeTranslationPipe}}</div>-->


                                                            </li>

                                                        </ul>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>

                                    <td>
                                        <div class="FillParent">
                                            <div class="ScrollViewer">
                                                <div class="ScrollContent">
                                                    <div class="FillParent" style="padding:7px;">

                                                        <!-- GENERAL -->
                                                        <div class="MediaStretch" [hidden]="SelectedTabCode != 'GENERAL'">
                                                            <div LocationDirective Code="GENERAL"></div>
                                                        </div>

                                                        <!-- EVENTS -->
                                                        <div class="MediaStretch" [hidden]="SelectedTabCode != 'EVENTS'">
                                                            <div LocationDirective Code="EVENTS"></div>
                                                        </div>

                                                        <!-- COMMUNICATIONS -->
                                                        <div class="MediaStretch" [hidden]="SelectedTabCode != 'COMMUNICATIONS'">
                                                            <div LocationDirective Code="COMMUNICATIONS"></div>
                                                        </div>

                                                        <!-- REQUEST -->
                                                        <div class="MediaStretch" [hidden]="SelectedTabCode != 'REQUEST'">
                                                            <div LocationDirective Code="REQUEST"></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
