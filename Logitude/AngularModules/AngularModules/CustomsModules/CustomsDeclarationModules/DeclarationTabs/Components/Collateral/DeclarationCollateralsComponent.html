
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                     
                            
                                    <td class="TabTitleRow" style="width:150px">
                                        {{'General.MH.CustomsCollateral'| TextCodeTranslationPipe}}
                                    </td>

                                    <td style="left:0px;float:left">
                                        <button style="width:100px" class="Button" *ngIf="_customsCollateralAnswerSharedDataService.IsDisplayButtonSend" (click)="OpenEditCollateralAnswerWindow()">    {{'Customs.Declaration.O.MultiCollateralsAnswer'| TextCodeTranslationPipe}}</button>

                                    </td>
                      
                    </tr>


                    <tr class="FormFieldRow" style="height:1px">
                        <td colspan="5" style="width: 100% ; height : 100%">
                            <div class="CellContent" style="bottom: 5px;padding:5px">



                                <logitude-edit-grid *ngIf="!NewView"
                                                    GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="collateralObslist">
                                    <log-column [header]="" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <!--<div style="text-align:right">
                                <span>{{item.CollateralRequestNumber}}</span>
                            </div>-->
                                         
                                        </log-cell-template>
                                    </log-column>

                                    <!-- CollateralRequestNumber -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.CollateralRequestNumber' | TextCodeTranslationPipe" [binding]="'CollateralRequestNumber'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CollateralRequestNumber}}</span>
                                            </div>

                                        </log-cell-template>
                                    </log-column>

                                    <!-- CollateralRequestStatusName -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.CollateralRequestStatusName' | TextCodeTranslationPipe"
                                                [binding]="'CollateralRequestStatusName'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CollateralRequestStatusName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- RequestValidityDate -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.RequestValidityDate' | TextCodeTranslationPipe" [binding]="'RequestValidityDate'" [width]="'100'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.RequestValidityDate | DateTimePipe:'D'}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- CustomsEntityTypeName -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.CustomsEntityTypeName' | TextCodeTranslationPipe" [binding]="'CustomsEntityTypeName'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomsEntityTypeName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- CustomerName -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.CustomerName' | TextCodeTranslationPipe" [binding]="'CustomerName'" [width]="'140'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomerName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- EntityIdKey1 -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.EntityIdKey1' | TextCodeTranslationPipe" [binding]="'EntityIdKey1'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.EntityIdKey1}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- EntityIdKey2 -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.EntityIdKey2' | TextCodeTranslationPipe" [binding]="'EntityIdKey2'" [width]="'100'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.EntityIdKey2}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- EntityIdKey3 -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.EntityIdKey3' | TextCodeTranslationPipe" [binding]="'EntityIdKey3'" [width]="'100'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.EntityIdKey3}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- IsClosed -->
                                    <log-column [header]="'Customs.CustomsCollateral.F.IsClosed' | TextCodeTranslationPipe" [binding]="'IsClosed'" [width]="'50'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <img *ngIf="item.IsClosed" title="IsClosed" src="./Images/CheckBoxIcon.png" />
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- Edit Button -->
                                    <log-column [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <span class="CellSeparator" style="float: right;"></span>
                                            <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                </logitude-edit-grid>

                                
                                <logitude-grid *ngIf="NewView"
                                               (rowSelectedEvent)="OnRowSelected($event)"
                                               [dataSource]="DataSource"
                                               [ObjectTable]="DeclarationCollateralsVListViewObjectTableName"
                                               [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                               [columns]="columns"
                                               [QueryChangeEvent]="onQueryChangeEvent"
                                               
                                               [IsCustomTemplate]="true">
                                </logitude-grid>



                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
