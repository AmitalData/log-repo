
<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table *ngIf="IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr style="height:25px">
                        <td class="TabTitleRow" style="width:150px">
                            {{'Customs.Declaration.TH.CargoSplit'| TextCodeTranslationPipe}}
                        </td>
                    </tr>

                    <tr>
                        <td colspan="5" style="height: 100%;">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%"
                                                    GridHeight="100%"
                                                    [ItemSource]="DeclarationCargoSplitList">

                                    <!--(SelectedItemChanged)="EditButtonClicked($event)"-->

                                    <!-- RequestNumber -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.RequestNumber' | TextCodeTranslationPipe" [binding]="'RequestNumber'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.RequestNumber}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- RequestDate -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.RequestDate' | TextCodeTranslationPipe" [binding]="'RequestDate'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.RequestDate | DateTimeToDatePipe}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- ManifestNumber -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.ManifestNumber' | TextCodeTranslationPipe" [binding]="'ManifestNumber'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ManifestNumber}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- SecondCargoID -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.SecondCargoID' | TextCodeTranslationPipe" [binding]="'SecondCargoID'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.SecondCargoID}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- ThirdCargoID -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.ThirdCargoID' | TextCodeTranslationPipe" [binding]="'ThirdCargoID'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ThirdCargoID}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- ActionTypeCode -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.ActionTypeCode' | TextCodeTranslationPipe" [binding]="'ActionTypeName'" [width]="'110'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.ActionTypeName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- RequestReason -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.RequestReason' | TextCodeTranslationPipe" [binding]="'RequestReasonName'" [width]="'140'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.RequestReasonName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                    <!-- CustomFileNo -->
                                    <log-column [header]="'Customs.DeclarationCargoSplit.F.CustomFileNo' | TextCodeTranslationPipe" [binding]="'CustomFileNo'" [width]="'120'" [Alignment]="'right'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <div style="text-align:right">
                                                <span>{{item.CustomFileNo}}</span>
                                            </div>

                                        </log-cell-template>
                                    </log-column>

                                    <!-- Edit Button -->
                                    <log-column [width]="'55'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                        <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                            <span class="CellSeparator" style="float: right;"></span>
                                            <div style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditButtonClicked(item)"></IconButton>
                                            </div>
                                        </log-cell-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>

                    </tr>

                </table>

            </div>
        </td>
    </tr>
</table>
