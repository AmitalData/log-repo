<style>

</style>
<table *ngIf="DecalarationData != null && IsLoaded">
    <tr style="height:100%;">
        <td style="vertical-align:top">
            <div *ngIf="generalErrors?.length > 0">
                <ValidationSummary [ItemsSource]="generalErrors" [SingleLine]="true"></ValidationSummary>
            </div>
            <div style="vertical-align:top; margin:5px">
                <table>
                     <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.ItemNo'"
                                [ObjectFieldName]="'ItemNo'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'ItemNo'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.ProductFileNumber'"
                                [ObjectFieldName]="'ProductFileNumber'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'ProductFileNumber'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true" [ForceDisabled]="true"></LogTextBox>
                        </td>
                    </tr>
                     <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.ItemName'"
                                [ObjectFieldName]="'ItemName'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'ItemName'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.ManufactureCountryCode'"
                                [ObjectFieldName]="'ManufactureCountryCode'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogLov [ObjectFieldName]="'ManufactureCountryCode'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext" [LookUpTableName]="'Customs.CustomsCountry'"
                                [SelectedValue]="ManufactureCountryCode" [HideColumns]="true" [CustomizedWidth]="180">
                            </LogLov>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.ManufacturerName'"
                                [ObjectFieldName]="'ManufacturerName'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'ManufacturerName'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                    </tr>
                     <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.InvoiceQuantityType'"
                                [ObjectFieldName]="'InvoiceQuantityType'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'InvoiceQuantityType'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true" [ForceDisabled]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.InvoiceQuantity'"
                                [ObjectFieldName]="'InvoiceQuantity'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'InvoiceQuantity'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true" [ForceDisabled]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.StatisticQuantity'"
                                [ObjectFieldName]="'StatisticQuantity'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'StatisticQuantity'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true" [ForceDisabled]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.StatisticQuantityType'"
                                [ObjectFieldName]="'StatisticQuantityType'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'StatisticQuantityType'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true" [ForceDisabled]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.Remarks'"
                                [ObjectFieldName]="'Remarks'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogTextBox [ObjectFieldName]="'Remarks'" [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
                        </td>
                    </tr>
                    <tr class="FieldRow">
                        <td>
                            <LogLabel [TextCode]="'Customs.SupplierInvoiceItemsReqList.F.DutchRequested'"
                                [ObjectFieldName]="'DutchRequested'" [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:200px">
                            <LogCheckBox [ObjectFieldName]="'DutchRequested'" [Checked]="DutchRequested"
                                [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                                [Value]="DutchRequested"></LogCheckBox>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
        <td></td>
    </tr>
    <tr style="height:10px"></tr>
    <tr style="height:100%; display: flex; justify-content: flex-end; align-items: flex-end;">
        <td style="width: 120px;">
            <div style="display: flex; align-items: flex-end; justify-content: space-around;">
                <div style="width: 57px;vertical-align: bottom;">
                    <button class="Button" (click)="CancelSupplierInvoiceItemsReqList()">
                        {{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}
                    </button>
                </div>
                <div style="width: 57px;vertical-align: bottom;">
                    <button class="RedButton" (click)="SaveAndSearchSupplierInvoiceItemsReqList()"
                        [disabled]="IsDisplayOnly">{{'General.B.Save' | TextCodeTranslationPipe}}
                    </button>
                </div>
            </div>
        </td>
    </tr>
</table>
