<table *ngIf="EntityPM != null && IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table class="innerTable">
                    <tr class="headerRow">
                        <td class="TabTitleRow SIIRequestHeader">
                            {{'Customs.Declaration.TH.SIIRequest'| TextCodeTranslationPipe}}
                        </td>
                        <td class="centeredContent">
                            <div *ngIf="!IsDisplayOnly" class="centeredDiv">
                                <div *ngIf="IsDisplayMessage" class="DisbleBox">
                                    {{DisplayOnlyMessage}}
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="newRequestCell">
                            <div>
                                <button [disabled]="!IsAllowChange" class="Button newRequestButton"
                                    (click)="onOpenNewRequest()">
                                    {{'Customs.SIIRequest.O.NewRequest'| TextCodeTranslationPipe}}
                                </button>
                            </div>
                        </td>
                        <td class="filterRow">
                            <div class="filterContainer">
                                <label for="requestStatusFilter">
                                    {{ 'Customs.SIIRequest.Filter.Status' | TextCodeTranslationPipe }}
                                </label>
                                <select id="selectedValueQueryBox"
                                    class="LogLovContainer LogLOVControl LogLovInputDiv querySelectBox"
                                    (change)="editRequestFilterClosed($event.target.value)">
                                    <option *ngFor="let item of querySelectionList" [value]="item.value">{{item.name}}
                                    </option>
                                </select>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" class="gridContainer">
                            <div class="CellContent">
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ItemsSource"
                                    (SelectedItemChanged)="OnRowSelected($event)" [SelectedRow]="SelectedRow">
                                    <log-column [header]="'#'" [binding]="'ListCounter'" [width]="'35'"
                                        [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div class="textRight">
                                                    {{ item.ListCounter }}
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Customs.SIIRequest.F.RequestNo' | TextCodeTranslationPipe"
                                        [binding]="'RequestNo'" [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div class="textRight">
                                                    {{ item.RequestNo }}
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column [header]="'Customs.SIIRequest.F.Remarks' | TextCodeTranslationPipe"
                                        [binding]="'Remarks'" [width]="'300'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div class="textRight">
                                                    {{ item.Remarks }}
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column [header]="'Customs.SIIRequest.F.RequestDate' | TextCodeTranslationPipe"
                                        [binding]="'RequestDate '" [width]="'300'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div class="textRight">
                                                    {{ item.RequestDate | date:'dd/MM/yyyy' }}
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column [header]="'Customs.SIIRequest.F.Status' | TextCodeTranslationPipe"
                                        [binding]="'Status'" [width]="'80'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div class="textRight">
                                                    {{ item.Status }}
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [width]="'35'" [Editable]="true" [Alignment]="'right'"
                                        [visibility]="'visibile'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <span class="CellSeparator floatRight"></span>
                                                <div class="editButtonContainer">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true"
                                                        (click)="onEditRequest(item)"></IconButton>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
</table>
