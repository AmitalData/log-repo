<table *ngIf="EntityPM != null && IsLoaded">
    <tr>
        <td>
            <div class="TableHolder">
                <table class="innerTable">
                    <tr class="headerRow">
                        <td class="TabTitleRow SIIRequestHeader">
                            {{'Customs.Declaration.TH.SIIRequest'| TextCodeTranslationPipe}}
                        </td>
                        <td class="centeredContent">
                            <div *ngIf="!IsDisplayOnly" class="centeredDiv">
                                <div *ngIf="IsDisplayMessage" class="DisbleBox">
                                    {{DisplayOnlyMessage}}
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="newRequestCell">
                            <div>
                                <button [disabled]="!IsAllowChange" class="Button newRequestButton"
                                    (click)="onOpenNewRequest()">
                                    {{'Customs.SIIRequest.O.NewRequest'| TextCodeTranslationPipe}}
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" class="gridContainer">
                            <div class="CellContent">
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ItemsSource"
                                                    (SelectedItemChanged)="OnRowSelected($event)" [SelectedRow]="SelectedRow">
                                    <log-column [header]="'#'" [binding]="'ListCounter'" [width]="'35'"
                                                [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div class="textRight">
                                                    {{ item.ListCounter }}
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Customs.SIIRequest.F.RequestNo' | TextCodeTranslationPipe"
                                                [binding]="'RequestNo'" [width]="'120'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                {{ item.RequestNo }}
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <!-- TODO: Replace to code after update action-->
                                    <!-- [header]="'Customs.SIIRequest.F.Remarks' | TextCodeTranslationPipe" -->
                                    <log-column [header]="'הערות'" [binding]="'Remarks'" [width]="'200'"
                                                [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                {{ item.Remarks }}
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Customs.SIIRequest.F.Status' | TextCodeTranslationPipe"
                                                [binding]="'Status'" [width]="'80'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                {{ item.Status }}
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [width]="'35'" [Editable]="true" [Alignment]="'right'"
                                                [visibility]="'visibile'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <span class="CellSeparator floatRight"></span>
                                                <div class="editButtonContainer">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true"
                                                                (click)="onEditRequest(item)"></IconButton>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                </logitude-edit-grid>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>
