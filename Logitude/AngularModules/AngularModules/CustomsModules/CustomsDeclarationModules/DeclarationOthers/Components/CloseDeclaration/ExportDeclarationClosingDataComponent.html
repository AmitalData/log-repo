<table>
    <tr style="height :50px;">
        <td class="TabTitleRow">
            <div style="font-size: medium">נתונים תפעוליים</div>
        </td>
    </tr>
    <tr style="height:80px">
        <td style="border: 1px solid #3BB3E2; padding: 1px">
            <table *ngIf="IsReady">
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [Text]="'שטר מטען ראשי'" [ObjectFieldName]="'MainAWB'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'MainAWB'" [DataContext]="DataContext"
                                        [InputType]="'text'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [Text]="MainAWB"></LogTextBox>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td width="15px"></td>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [Text]="'שטר מטען פנימי'" [ObjectFieldName]="'Smp'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'Smp'" [DataContext]="DataContext"
                                    [InputType]="'text'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [Text]="Smp" 
                                    ></LogTextBox>
                                </td>
                            </tr>

                        </table>
                    </td>
                    <td width="20%"></td>
                </tr>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [Text]="'אתר טעינה'" [ObjectFieldName]="'ChargingSite'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'ChargingSite'" [DataContext]="DataContext"
                                    [InputType]="'text'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [Text]="ChargingSite"></LogTextBox>
                                </td>
                            </tr>

                        </table>
                    </td>
                    <td width="15px"></td>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [Text]="DecPM.TransportModeId == 'O' ? ActualSailingDate : ActualTakeOffDate" [ObjectFieldName]="'FlightDate'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'FlightDate'" [DataContext]="DataContext"
                                    [InputType]="'text'" [HideColumns]="true" [ObjectTableName]="ObjectTableName" [Text]="FlightDate"></LogTextBox>
                                </td>
                            </tr>

                        </table>
                    </td>
                    <td width="20%"></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height :50px;">
        <td class="TabTitleRow">
            <div style="font-size: medium">נתוני סגירה</div>
        </td>
    </tr>
    <tr style="height:200px">
        <td style="border: 1px solid #3BB3E2; padding: 3px;">
            <table *ngIf="IsReady" style="height:170px;margin-bottom:5px">

                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'FinalCargoTypeCode'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'FinalCargoTypeCode'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [LookUpTableName]="'Customs.CargoIdentifireType'"
                                        [DisplayMemberPath]="'LocalName'" [SelectedValue]="FinalCargoTypeCode"
                                        [HideColumns]="true">
                                    </LogLov>
                                </td>
                            </tr>

                        </table>
                    </td>
                    <td width="15px"></td>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'FinalManifestNumber'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'FinalManifestNumber'" [InputType]="'text'"
                                        [DataContext]="DataContext" [ObjectTableName]="ObjectTableName" [Placeholder]="ManifestNumberPlaceholder" 
                                        [HideColumns]="true" [Text]="FinalManifestNumber"></LogTextBox>
                                </td>
                            </tr>

                        </table>
                    </td>

                    <td width="20%"></td>
                </tr>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'FinalSecondCargoId'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'FinalSecondCargoId'" [InputType]="'text'"
                                        [DataContext]="DataContext" [ObjectTableName]="ObjectTableName" [Placeholder]="SecondCargoIdPlaceholder"
                                        [HideColumns]="true" [Text]="FinalSecondCargoId"></LogTextBox>
                                </td>
                            </tr>

                        </table>
                    </td>

                    <td width="15px"></td>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'FinalThirdCargoId'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        
                                </td>
                                <td>
                                    <LogTextBox [ObjectFieldName]="'FinalThirdCargoId'" [InputType]="'text'"
                                        [DataContext]="DataContext" [ObjectTableName]="ObjectTableName" [Placeholder]="ThirdCargoIdPlaceholder"
                                        [HideColumns]="true" [Text]="FinalThirdCargoId"></LogTextBox>
                                </td>
                            </tr>

                        </table>
                    </td>

                    <td width="20%"></td>

                </tr>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'LoadingDateTime'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogDatePicker [ObjectFieldName]="'LoadingDateTime'"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                                                   [SelectedDateValue]="LoadingDateTime"
                                        [InputType]="'date'" [HideColumns]="true"></LogDatePicker>
                                </td>
                            </tr>

                        </table>
                    </td>

                    <td width="15px"></td>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'FinalLoadingSite'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'FinalLoadingSite'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [LookUpTableName]="'Customs.UnloadingSiteType'"
                                        [DisplayMemberPath]="'LocalName'" [SelectedValue]="FinalLoadingSite"
                                        [HideColumns]="true">
                                    </LogLov>
                                </td>
                            </tr>

                        </table>
                    </td>
                    <td width="20%"></td>

                </tr>

                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <LogLabel [ObjectFieldName]="'FinalShipCode'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogLabel>
                                </td>
                                <td>
                                    <LogLov [ObjectFieldName]="'FinalShipCode'" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [LookUpTableName]="'Customs.CustomsShip'"
                                        [DisplayMemberPath]="'LocalName'" [SelectedValue]="FinalShipCode"
                                        [HideColumns]="true">
                                    </LogLov>
                                </td>
                            </tr>

                        </table>
                    </td>
                    <td width="15px"></td>

                    <td></td>
                    <td width="20%"></td>

                </tr>
            </table>

            </td>
        </tr>
    <tr style="height: 30px;">
        <td>
            <div>
                <table>
                    <tr>
                        <td class="SummaryTitle">{{'Customs.Declaration.O.ModificationsExport' | TextCodeTranslationPipe}}</td>
                        <td><IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddModificationButton()" [IsEnabled]="!IsReadOnly"></IconButton></td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr>
        <td style="height: 100%;">
            <div class="CellContent" *ngIf="IsReady">
                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [Disabled]="IsReadOnly" [ItemSource]="ModificationsList" >

                    <!-- TypeCode -->
                    <log-column [header]="'Customs.SupplierInvoiceModification.F.TypeCode' | TextCodeTranslationPipe" [width]="'80'" [Alignment]="'right'" [binding]="'TypeCode'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="!IsReadOnly">
                                <div style="text-align: right;" class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                    <span>{{item.TypeName}}</span>
                                </div>
                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogLov [ObjectFieldName]="'TypeCode'"
                                            [ObjectTableName]="'Customs.SupplierInvoiceModification'"
                                            [DataContext]="item"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'Customs.ModificationAndDiscountType'"
                                            (SelectedItemChanged)="item.SetLocalName($event, 'TypeName')"
                                            [QueryFilterItems]="TypeCodeFilterItems"
                                            [FocusOnMe]="true">
                                    </LogLov>

                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!-- CurrencyTypeCode -->
                    <log-column [header]="'Customs.SupplierInvoiceModification.F.CurrencyTypeCode' | TextCodeTranslationPipe" [width]="'80'" [Alignment]="'right'" [binding]="'CurrencyTypeCode'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="!IsReadOnly">
                                <div style="text-align: right;" class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                    <span>{{item.CurrencyTypeName}}</span>
                                </div>
                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <LogLov [ObjectFieldName]="'CurrencyTypeCode'"
                                            [ObjectTableName]="'Customs.SupplierInvoiceModification'"
                                            [DataContext]="item"
                                            [HideColumns]="true"
                                            [LookUpTableName]="'Customs.CurrencyType'"
                                            (SelectedItemChanged)="item.SetLocalName($event, 'CurrencyTypeName')"
                                            [FocusOnMe]="true">
                                    </LogLov>

                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!-- Amount -->
                    <log-column [header]="'Customs.SupplierInvoiceModification.F.Amount' | TextCodeTranslationPipe" [width]="'70'" [Alignment]="'right'" [binding]="'Amount'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="!IsReadOnly">
                                <div style="text-align: right;" class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                    <span>{{item.Amount | NumbersPipe:'n2'}}</span>
                                </div>
                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <!--<input type="text"  style="width:120px"  [(ngModel)]="item.TextValue"     (blur)="item.onBlur()"  [id]="InputId"  (paste)="item.OnPaste($event)"  (keydown)="item.OnKeyDown($event)" />-->
                                    <LogTextBox [ObjectFieldName]="'Amount'" [InputType]="'double'" [DataContext]="item" (LostFocus)="item.OnAmountLostFocus()"
                                                [ObjectTableName]="'Customs.SupplierInvoiceModification'" [HideColumns]="true" [FocusOnMe]="true" [AllowPercentage]="true" (OriginalText)="item.AmountOriginalText($event)"></LogTextBox>
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <log-column [header]="'Customs.SupplierInvoice.F.InvoiceNumber' | TextCodeTranslationPipe" [width]="'90'" [Alignment]="'right'" [binding]="'InvoiceNumber'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [IsEnabled]="!IsReadOnly">
                                <div style="text-align: right;" class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                    <span>{{item.InvoiceNumber}}</span>
                                </div>
                                <div *ngIf="logcelltemplate.IsEditMode">
                                    <ComboBox [ItemsSource]="InvoicesNumbersList" [IsDisabled]="item.ModificationPM.ChangeSetOp != 'Insert'" (SelectedItemChanged)="item.InvoicesSelectionChanged($event)"
                                              [Binding]="'InvoiceNumber'" [SelectedItem]="item.selectedInvoice"></ComboBox>

                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                    <!-- Buttons -->
                    <log-column [width]="'30'" [Alignment]="'right'">
                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true">
                                <span class="CellSeparator" style="float: right;"></span>
                                <IconButton [IsEnabled]="!IsReadOnly" [Name]="'Delete'" [IsSmall]="true" (click)="RemoveModification(item)"
                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                </logitude-edit-grid>
            </div>

        </td>
    </tr>            
        <tr style="height: 70px;">
            <td>
                <table>
                    <tr style="padding-top: 40px;">
                        <td style="width: 70%;">
                            <button class="Button" (click)="ViewDocumentsComponent()"  style="margin-right: 10px; width: 57px;">{{'Customs.Declaration.TH.Documents' |TextCodeTranslationPipe}}</button>
                        </td>
                        <td>
                            <table>
                                <tr>
                                    <td style="width: 57px;">
                                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                                    </td>
                                    <td style="width: 67px; padding-right: 10px;">
                                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsReadOnly">{{'General.B.Save' |TextCodeTranslationPipe}}</button>
                                    </td>

                                    <td style="padding-right: 10px;">
                                        <div style="display: inline-block; width: 110px; vertical-align: bottom;">
                                            <custom-send-options [IsDisabled]="IsReadOnly || (this.DecPM.AmendmentDontDisplayInList  && this.DecPM.IsExportClosed)"
                                                                 [AvoidDoubleClick]="true"
                                                                 [HaveTestCase]="'true'"
                                                                 #MyCustomSendOptionsComponent
                                                                 (SendButtonClicked)="SendButtonClicked($event)">
                                            </custom-send-options>
                                        </div>
                                    </td>  
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>

        </tr>
</table>
