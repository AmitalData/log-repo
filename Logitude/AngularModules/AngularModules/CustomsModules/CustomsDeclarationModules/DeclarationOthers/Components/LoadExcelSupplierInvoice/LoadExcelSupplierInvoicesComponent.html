<style>
progress {
  text-align: center;
  height: 1.5em;
  width: 100%;
  -webkit-appearance: none;
  border: none;

  /* Set the progressbar to relative */
  position:relative;
}
progress:before {
  content: attr(data-label);
  font-size: 0.8em;
  vertical-align: 0;

  /*Position text over the progress bar */
  position:absolute;
  left:0;
  right:0;
}
progress::-webkit-progress-bar {
  background-color: #c9c9c9;
}
progress::-webkit-progress-value {
  background-color: #7cc4ff;
}
progress::-moz-progress-bar {
  background-color: #7cc4ff;
}
</style>

<table style="height: 150px;">
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="'CustomerId'" [ObjectTableName]="'Customs.Declaration'"
                      [DataContext]="DataContext"></LogLabel>
        </td>
        <td><div></div></td>
        <td colspan="1">
            <LogLov [ObjectFieldName]="'CustomerId'"
                    [ObjectTableName]="'Customs.Declaration'"
                    [SelectedValue]="CustomerId"
                    [DataContext]="DataContext"
                    [HideAddLink]="true"
                    [HideColumns]="false"
                    [LookUpTableName]="'Card'"
                    [DisplayFieldsFromList]="'Code,LocalName,EnglishName,CityName,CountryName,PartnerTypeName'">
            </LogLov>

        </td>
        <td><div></div></td>
        <td><div></div></td>
        <td><div></div></td>
        <td><div></div></td>
        <td><div></div></td>



    </tr>
    <tr class="FormFieldRow">
        <td>
            <LogLabel [NoObjectField]="true"
                      [Text]="'פרטנר'"
                      [DataContext]="DataContext"></LogLabel>
        </td>
        <td><div></div></td>
        <td colspan="1">
            <LogLov [NoObjectField]="true"
                    [SelectedValue]="PartnerId"
                    [DataContext]="DataContext"
                    [HideAddLink]="true"
                    [HideColumns]="false"
                    [LookUpTableName]="'Card'"
                    [DisplayFieldsFromList]="'Code,LocalName,EnglishName,CityName,CountryName,PartnerTypeName'">

        <td><div></div></td>
        <td><div></div></td>



    </tr>

    <tr class="FormFieldRow">
        <td style="width:45px;">
            <LogLabel [NoObjectField]="true"
                      [Text]="'קובץ'"
                      [DataContext]="DataContext"></LogLabel>
        </td>
        <td><div></div></td>
        <td style="width:170px;">
            <LogTextBoxV2 [NoObjectField]="true" [IsFreeText]="true"

        </td>
        <td style="width:60px;text-align:left">
            <button [disabled]="!UploadButtonIsEnabled" style="width:55px;" class="Button" (click)="OpenUpLoadFile()">Upload</button>

        <td style="width:100px; background-color:white">
            <div *ngIf="IsShowProgressBar" style="height:20px;border:1px solid gray;border-radius:3px">

        </td>
        <td style="width:4px;"></td>
        <td style="width:50px;">
            <button class="Button" (click)="DeleteFileButtonClicked()" *ngIf="filterImageParameter != null ">הסר קובץ</button>
        </td>
        <td><div></div></td>
    </tr>
</table>
