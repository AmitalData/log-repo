<style>
    .SideTD {
        width: 20%;
    }

    tr.SideTR {
        height: 30px;
    }
</style>

<table dir="rtl">
    <tr>
        <td class="AppLeftMenuBackgroundRTL" style="width:20%">
            <table style="height:250px">
                <tr style="height:30px">
                    <td>
                        <LogLabel [NoObjectField]="true" [Text]="'יבוא/יצוא'" [ObjectFieldName]="'Direction'" [DataContext]="DataContext"></LogLabel>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div>
                                    <RadioButton [Name]="'TariffRadio'" [IsChecked]="true" [IsEnabled]="false" [Text]="'Customs.General.O.Export' | TextCodeTranslationPipe"></RadioButton>
 
                                    <img style="left:30px " [id]="DirectionFilter_E" class="CenterCenter" src="./Images/Directions/E.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:50px">
                    <td>
                        <LogLabel [ObjectFieldName]="'TransportModeId'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div>

                                    <RadioButton [Name]="'air'" [IsChecked]="isTransportA"  (Checked)="TransportModeClicked('A')" [Text]="'Customs.General.O.Air' | TextCodeTranslationPipe"></RadioButton>
                                    
                                    <img style="left:30px " class="CenterCenter" src="./Images/TransportModes/A.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div>
                                    <RadioButton [Name]="'ocean'" [IsChecked]="isTransportO" (Checked)="TransportModeClicked('O')" [Text]="'Customs.General.O.Ocean' | TextCodeTranslationPipe"></RadioButton>

                                    <img style="left:30px" class="CenterCenter" src="./Images/TransportModes/O.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:30px">
                    <td title="Export" style="vertical-align:top;">
                        <div style="margin-top:8px">
                            <div style="position: relative;">
                                <div>
                                    <RadioButton [Name]="'land'" [IsChecked]="isTransportL" (Checked)="TransportModeClicked('L')" [Text]="'Customs.General.O.Land' | TextCodeTranslationPipe"></RadioButton>

                                    <img style="left:30px " class="CenterCenter" src="./Images/TransportModes/I.png" />
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr style="height:150px"><td> <div></div> </td> </tr>
            </table>
        </td>
        <td style="width:80%;">
            <table>
                <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                    <td colspan="4">
                        <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
                    </td>
                </tr>
                <tr>
                    <td style="width:50px"> <div></div>  </td>
                    <td style="width:250px;padding-top: 10px;">
                        <table>
                            <tr>
                                <td>
                                    <table>
                                        <tr style="height:80px"><td><div></div></td> </tr>
                                        <!-- CustomFileNo -->
                                        <tr class="FormFieldRow" style="width:200px;text-align: right;">
                                            <td style="text-align: right;">
                                                <!--<LogLabel style="font-size:12px; padding-left:20px"
                                                          [ObjectFieldName]="'ExportFile'"
                                                          [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="DataContext"></LogLabel>-->
                                              <label style="font-size:12px; padding-left:20px;text-align: right;">מספר תיק יצוא:</label> 
                                            </td>
                                            <td  style="width:130px">
                                                <div style="width:135px">
                                                    <LogTextBox [ObjectFieldName]="'ExportFile'"
                                                                [InputType]="'integertext'"
                                                                [DataContext]="DataContext"
                                                                [ObjectTableName]="ObjectTableName"
                                                                [HideColumns]="true"></LogTextBox>
                                                </div>
                                          
                                            </td>
                                        </tr>
                                        <!--<tr style="width:10px;">
                                        </tr>-->
                                        <tr class="FormFieldRow" style="text-align: right;">
                                            <td>
                                                <LogLabel style="font-size:12px; padding-left:20px"
                                                          [ObjectFieldName]="'CustomerId'"
                                                          [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="DataContext"></LogLabel>
               


                                            </td>
                                            <!--<td style="width: 25px; padding-right: 5px;">
                                                <IconButton [Name]="'Add'" (click)="AddCustomerClicked()" [IsIconOnly]="true"></IconButton>
                                            </td>-->
                                            <td  style="width:150px">
                                                <LogLov [ObjectFieldName]="'CustomerId'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [SelectedValue]="CustomerId"
                                                        [DisplayMemberPath]="'LocalName'"
                                                        [HideAddLink]="true"
                                                        [HideAdd]="true"
                                                        [LookUpTableName]="'Card'"
                                                        [DisplayFieldsFromList]="'Code,LocalName,EnglishName'">
                                                </LogLov>
                                            </td>
                                            <!--<td><div></div></td>-->
                                        </tr>
                                        <tr style="height:200px"><td><div></div></td> </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td> <div></div>  </td>
                    <td><div></div></td>


                </tr>

                <tr style="height: 32px;">
                    <td colspan="4" style="vertical-align: bottom">
                        <table style="height: 22px;">
                            <tr>
                                <td>
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button id="{{'NewExportDeclarationCancelButton' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
 
                                    <button id="{{'NewExportDeclarationOkButton' | IdGeneratorAsyncPipe | async}}" [disabled]="isOkButtonClicked"  class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                                 </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
