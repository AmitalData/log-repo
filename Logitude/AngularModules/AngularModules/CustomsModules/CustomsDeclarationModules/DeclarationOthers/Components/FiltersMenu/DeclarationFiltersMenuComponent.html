<table>
    <tr>
        <td></td>
        <td *ngIf="isExport" style="width: 140px;">
            <button class="Button" style="width: 126px;" (click)="openFiltersWindow()">
                {{titleExportFilterMenu}}
                <img *ngIf="exportFilterData?.filterActive" width="20" height="20" style="vertical-align: middle;" src="./Images/Icons/MiniGreenTick.png" />
            </button>
        </td>
        <td style="width:117px; vertical-align:middle;">
            <ul class="FiltersMenu">
                <li (click)="itemClicked('All')" (mouseover)="itemMouseOver('All')"
                    [class.SelectedFilter]="SelectedValue === 'All'">
                    הכל
                </li>
                <li (click)="itemClicked('A')" (mouseover)="itemMouseOver('A')" (mouseleave)="itemMouseLeave('A')"
                    [class.SelectedFilter]="SelectedValue === 'A'" title="Air">
                    <img [id]="TransportFilter_A" class="CenterCenter" src="./Images/TransportModes/A_g.png"
                        style="top: 1px;" />
                </li>
                <li (click)="itemClicked('O')" (mouseover)="itemMouseOver('O')" (mouseleave)="itemMouseLeave('O')"
                    [class.SelectedFilter]="SelectedValue === 'O'" title="Ocean">
                    <img [id]="TransportFilter_O" class="CenterCenter" src="./Images/TransportModes/O_g.png"
                        style="top: 1px;" />
                </li>
                <li (click)="itemClicked('L')" (mouseover)="itemMouseOver('L')" (mouseleave)="itemMouseLeave('L')"
                    [class.SelectedFilter]="SelectedValue === 'L'" title="Inland">
                    <img [id]="TransportFilter_I" class="CenterCenter" src="./Images/TransportModes/I_g.png"
                        style="top: 1px;" />
                </li>
            </ul>
        </td>
    </tr>
</table>
