<table>

    <tr>
        <td class="TabTitleRow" style="font-weight:bold">{{'General.MH.Vehicles' | TextCodeTranslationPipe}}</td>
        <td></td>
    </tr>
    <tr style="height:5px"></tr>

    <tr style="height:100%;bottom:5px">
        <td colspan="2">
            <div class="CellContent" style="bottom: 5px;padding:5px">
                <logitude-edit-grid GridWidth="100%"
                                    GridHeight="100%"
                                    (SelectedItemChanged)="OnRowSelected($event)"
                                  [EnableMultiSelection]="true"
                                    [SelectedRow]="SelectedRow"
                                     [SelectedRows]="tempSelectedRows"
                                    [ItemSource]="vehicles">



                    <log-column [header]="'Customs.Vehicle.F.VehicleChassisNumber' | TextCodeTranslationPipe" [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.VehicleChassisNumber}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>


                    <log-column [header]="'Customs.Vehicle.F.RichbitFileNumber' | TextCodeTranslationPipe" [width]="'115'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.RichbitFileNumber}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>

                    <log-column [header]="'Customs.Vehicle.F.ImporterName' | TextCodeTranslationPipe" [width]="'110'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.ImporterName}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>

                    <log-column [header]="'Customs.Vehicle.F.ModelCode' | TextCodeTranslationPipe" [width]="'140'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.ModelCode}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>


                    <log-column [header]="'Customs.Vehicle.F.VehicleWindowNumber' | TextCodeTranslationPipe" [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.VehicleWindowNumber}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>

                    <log-column [header]="'Customs.Vehicle.F.VehiclePoolTypeName' | TextCodeTranslationPipe" [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.VehiclePoolTypeName}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>

                    <log-column [header]="'Customs.Vehicle.F.VehicleManufacturerName' | TextCodeTranslationPipe" [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.VehicleManufacturerName}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>

                    <log-column [header]="'Customs.Vehicle.F.StatusName' | TextCodeTranslationPipe" [width]="'90'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.StatusName}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>


                </logitude-edit-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td colspan="2" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
