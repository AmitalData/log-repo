<table *ngIf="finishedLoad">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table style="height: 80px;">

                <tr style="height: 15px;">
                    <td>
                        <LogLabel [ObjectFieldName]="'ClassificationTypeCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'ClassificationTypeCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.ClassificationType'">
                        </LogLov>
                    </td>
                    <td style="width:7px"></td>

                    <td>
                        <LogLabel [ObjectFieldName]="'TransactionNatureCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'TransactionNatureCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.TransactionNatureType'">
                        </LogLov>
                    </td>
                    <td style="width:7px"></td>
                    <td>
                        <LogLabel [ObjectFieldName]="'ClaimReasonCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'ClaimReasonCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.ClaimReasonType'">
                        </LogLov>
                    </td>
                </tr>

                <tr style="height: 25px;">
                    <td colspan="3">
                    </td>
                </tr>

                <tr style="height: 15px;">
                    <td>
                        <LogLabel [ObjectFieldName]="'StatementTypeCode'" [ObjectTableName]="ObjectTableNameSuppInvoiceItemsAbachStatement"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'StatementTypeCode'"
                                [ObjectTableName]="ObjectTableNameSuppInvoiceItemsAbachStatement"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.NbcDeclarationType'">
                        </LogLov>
                    </td>
                    <td style="width:7px"></td>
                    <td>
                        <LogLabel [ObjectFieldName]="'IsStatementInd'" [ObjectTableName]="ObjectTableNameSuppInvoiceItemsAbachStatement"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <CheckBox style="float: right; margin-left: 8px;"
                                  
                                  [Text]="'Customs.Declaration.F.IsStatementInd' | TextCodeTranslationPipe"
                                  [IsChecked]="IsStatementInd"
                                  (Checked)="IsStatementInd = $event"></CheckBox>

                        <!--<LogTextBox [ObjectFieldName]="'StatementInd'" [ObjectTableName]="ObjectTableNameSuppInvoiceItemsAbachStatement"
                        [Text]="StatementInd"
                        [HideColumns]="true" [DataContext]="DataContext"></LogTextBox>-->

                    </td>

                </tr>

                <tr style="height: 25px;">
                    <td colspan="3">
                    </td>
                </tr>

                <tr style="height: 15px;">
                    <td>
                        <LogLabel [ObjectFieldName]="'IdentifierID'" [ObjectTableName]="ObjectTableNameSupplierInvoiceItemVehicle"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'IdentifierID'" [ObjectTableName]="ObjectTableNameSupplierInvoiceItemVehicle"
                                    [Text]="IdentifierID"
                                    [HideColumns]="true" [DataContext]="DataContext"></LogTextBox>
                    </td>
                    <td style="width:7px"></td>
                    <td>
                        <LogLabel [ObjectFieldName]="'VehicleTypeCode'" [ObjectTableName]="ObjectTableNameSupplierInvoiceItemVehicle"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'VehicleTypeCode'"
                                [ObjectTableName]="ObjectTableNameSupplierInvoiceItemVehicle"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.CargoIdentityQualifier'">
                        </LogLov>

                    </td>

                </tr>
                <tr style="height: 25px;">
                    <td colspan="3">
                    </td>
                </tr>

                <tr style="height: 15px;">
                    <td>
                        <LogLabel [ObjectFieldName]="'AdditionalPriceTypeCode'" [ObjectTableName]="ObjectTableNameSupplierInvoiceItemsPrice"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'AdditionalPriceTypeCode'"
                                [ObjectTableName]="ObjectTableNameSupplierInvoiceItemsPrice"
                                [DataContext]="DataContext"
                                [HideColumns]="true"
                                [LookUpTableName]="'Customs.AmountType'">
                        </LogLov>
                    </td>
                    <td style="width:7px"></td>
                    <td>
                        <LogLabel [ObjectFieldName]="'AdditionalPrice'" [ObjectTableName]="ObjectTableNameSupplierInvoiceItemsPrice"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'AdditionalPrice'" [ObjectTableName]="ObjectTableNameSupplierInvoiceItemsPrice" [Text]="AdditionalPrice"
                                    [InputType]="'sigdouble'" [DigitsAfterPoint]="2" [HideColumns]="true" [DataContext]="DataContext"> </LogTextBox>

                    </td>

                </tr>



                <!-- #region cancel and ok buttons -->
                <tr style="height: 32px;">
                    <td colspan="9" style="vertical-align: bottom ; left:5px;">
                        <table style="height: 22px;">
                            <tr>
                                <td>
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="width: 57px;">
                                    <button class="RedButton" (click)="OkButtonClicked()" >{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
