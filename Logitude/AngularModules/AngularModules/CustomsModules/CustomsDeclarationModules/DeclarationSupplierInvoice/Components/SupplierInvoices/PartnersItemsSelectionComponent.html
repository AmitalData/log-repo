

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td style="width:200px">
            <SearchBox [SearchText]="searchText" (TextChanged)="Search($event)"
                       [Watermark]="'Customs.Declaration.O.SearchItems' | TextCodeTranslationPipe"></SearchBox>
        </td>
        <td style="">
        </td>
    </tr>

    <tr style="height:5px"></tr>

    <tr style="height:100%;bottom:5px">
        <td colspan="2">
            <div class="CellContent" style="bottom: 5px;padding:5px">
                <logitude-edit-grid GridWidth="100%"
                                    GridHeight="100%"
                                    (SelectedItemChanged)="OnRowSelected($event)"
                                    (RowDoubleClick)="OnRowDoubleClick($event)"
                                    [SelectedRow]="SelectedRow"
                                    [ItemSource]="ItemsSource">



                    <log-column [header]="'Customs.CustomsPartnersItem.F.ItemCode' | TextCodeTranslationPipe" [width]="'120'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.ItemCode}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>

                    <log-column [header]="'תאור פריט'" [width]="'250'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.Name}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>


                    <log-column [header]="'Customs.CustomsPartnersItem.F.ClassificationCode' | TextCodeTranslationPipe" [width]="'120'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.ClassificationCode}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>


                    <log-column [header]="'Customs.CustomsPartnersItem.F.VendorId' | TextCodeTranslationPipe" [width]="'140'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.VendorId}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>


                    <!--<log-column [header]="'Customs.CustomsPartnersItem.F.VendorName' | TextCodeTranslationPipe" [width]="'105'" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate [TabIndex]="-1">
                            <div style="text-align:right" class="TextTrimming">
                                <span>{{item.VendorName}}</span>
                            </div>
                        </log-cell-template>
</ng-template>
                    </log-column>-->


                </logitude-edit-grid>        
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td colspan="2" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
