
<style>
      .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;/*fbebbc*/
        padding: 4px 10px;
        color: gray;
        font-family: sans-serif;
        max-width: 660px;
        white-space: normal;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="7">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
 
    <tr style="height:32px">

        <td colspan="3" style="color:#6E7172;right:10px">
       
            {{'Customs.Declaration.O.MultiProcessCode' |TextCodeTranslationPipe }}
            </td>
    </tr>
    <tr style="height:32px"> 
        <td>
            <table>
                <tr>
                    <td style="width:100px">
                        <LogLabel [ObjectFieldName]="'ProcessTypeCode'" [ObjectTableName]="'Customs.SupplierInvoiceItemProcesType'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:160px">
                        <LogLov tabindex="1" [ObjectFieldName]="'ProcessTypeCode'"
                                [ObjectTableName]="'Customs.SupplierInvoiceItemProcesType'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Customs.ItemGovernmentProcedureType'"
                                [HideColumns]="true"
                                [SelectedValue]="ProcessTypeCode">
                        </LogLov>
                    </td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
       
    </tr>
    <tr style="height:32px">
        <td>
            <table>
                <tr>
                    <td style="width:20px">
                        <RadioButton [Name]="'UpdateAll'" [IsChecked]="UpdateAll" (Checked)="UpdateAllRadio(true)"></RadioButton>

                    </td>

                    <td style="width:60px; color:#6E7172">
                       
                        {{'Customs.Declaration.O.UpdateAll' |TextCodeTranslationPipe }}
                    </td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
     
    </tr>
    <tr style="height:32px">
        <td>
            <table>
                <tr>
                    <td style="width:20px">
                        <RadioButton [Name]="'UpdateSelected'" [IsChecked]="UpdateSelected" (Checked)="UpdateSelectedRadio(true)"></RadioButton>

                    </td>

                    <td style="width:60px;color:#6E7172">
                     
                        {{'Customs.Declaration.O.UpdateSelected' |TextCodeTranslationPipe }}
                    </td>
                    <td style="width:5px"></td>
                    <td style="width:100px">
                        <table>
                            <tr>
                              <!-- <td style="width:20px;color:#6E7172"><span>מ: </span></td>-->
                                <td style="width:100px">
                                    <LogTextBox [ObjectFieldName]="'FromNumber'" [Text]="FromNumber"
                                                [InputType]="'integer'" [HideColumns]="true" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                        </table>

                    </td>
                    <td style="width:20px"></td>
                    <td style="width:130px">
                        <table>
                            <tr>
                                <td style="width:20px;color:#6E7172"> <span>עד </span></td>
                                <td style="width:100px">
                                    <LogTextBox [ObjectFieldName]="'ToNumber'" [Text]="ToNumber"
                                                [InputType]="'integer'" [HideColumns]="true" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                        </table>
                    </td>



                 
                    <td style="width: 300px;">
                        <div *ngIf="IsAddMessageVisible" class="DisbleBox" style="background: #fbebbc; color: #4e4e4e;  font-size: 10px;float: left;max-width: 280px;">
                            {{ AddMessage }}
                        </div>
                    </td>
                    <td style="width:5px"><div></div></td>
                    <td style="width:30px">
                        <button class="Button" (click)="AddLines()" [disabled]="!IsAddButtonEnabled">{{'Customs.General.B.Add' |TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>

    </tr>

    <tr>
        <td colspan="5">
            <div class="CellContent" style="bottom: 5px;padding:5px">
                <logitude-edit-grid GridWidth="100%"
                                    GridHeight="100%"
                                    [IsReadOnly]="IsDisplayOnly"
                                    [ItemSource]="ItemsSource">



                    <log-column [header]="'מספר'" [width]="'70'" [Alignment]="'right'" [Editable]="true">
                        <ng-template let-item>
<log-cell-template  #logcelltemplate>
                            <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode">
                                <span>{{item.Number}}</span>
                            </div>
                            <div *ngIf="logcelltemplate.IsEditMode">
                                <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Number'" [DataContext]="item" [InputType]="'integer'"
                                            [Text]="item.Number" [HideColumns]="true"></LogTextBox>


                            </div>
                        </log-cell-template>
</ng-template>


                    </log-column>

                    <log-column [width]="'50'" [Editable]="true" [Alignment]="'right'">
                        <ng-template let-item>
<log-cell-template [IgnoreMods]="true"  #logcelltemplate>
                            <div style="width: 30px; float: right; height:20px;padding-top:3px">
                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="item.DeleteButtonClicked()" [IsEnabled]="!IsDisplayOnly"></IconButton>
                            </div>



                        </log-cell-template>
</ng-template>
                    </log-column>






                </logitude-edit-grid>
            </div>

        </td>
    </tr>
    <tr style="height: 32px;">

        <td colspan="5" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()" >{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
