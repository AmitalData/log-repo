
<table>
   

    <tr style="height:40px">
        <td>
            <table>
                <tr>
                    <td style="width:200px; ">
                        <SearchTextBox [PlaceHolder]="'מספר ספק , שם ספק'"  [SearchText]="searchText"  (SearchTextChangeEvent)="Search($event)"  ></SearchTextBox>
                
                        </td>

                    <td rowspan="2" style="width:220px; right:10px; top:3px">
                        <table>
                            <tr>
                                <td>
                                    <div style="width:auto;">
                                        <CheckBox style="float:right" [IsChecked]="IsChecked" (Checked)="IsChecked = $event"  [IsEnabled]="!_HavePeriodDecResult"></CheckBox>
                                        <label style="float:right; padding-right:5px;padding-left:5px">הצג רק ספקים עם תצהיר ליבואן</label>

                                    </div>

                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div style="width:auto;">
                                        <CheckBox style="float:right" [IsChecked]="ShowOnlyValid" (Checked)="ShowOnlyValid = $event" [IsEnabled]="!_HavePeriodDecResult"></CheckBox>
                                        <label style="float:right; padding-right:5px;padding-left:5px"> הצג רק תצהירים בתוקף </label>

                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td></td>

                    <td style="width: 120px; padding-left: 15px;text-align:left">
                        <button class="GreenButton" style="width:110px;" (click)="UpdateImporterDeposition()">{{'עדכן תצהירים מהמכס'}} </button>
                    </td>

                    <td style="width:20px;">
                        <div></div>
                    </td>
                </tr>

                <tr style="height:10px"></tr>
            </table>
        </td>
    </tr>
    <tr style="height:10px"></tr>
    <tr style="height:200px">
      
        <td colspan="3" style="height: 100%;">
            <div class="CellContent" style="bottom: 5px;padding:5px;" >

                <!--[QueryChangeEvent]="onQueryChangeEvent"-->
                <div class="GeneratedGridContainer" style="width: 100% ; height : 100%">

                    <logitude-grid GridWidth="100%" GridHeight="100%" 
                                   [ObjectTable]="'Customs.CustomsVendor'"
                                   [dataSource]="DataSource"
                                   (AfterViewInitCompleted)="ViewInitCompleted($event)"
                                   (rowSelectedEvent)="OnItemRowSelected($event)"
                                   [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                   [columns]="columns"
                                   [SelectedRow]="SelectedRow"
                                   [IsCustomTemplate]="true"
                                   [IsGradiantSelectedColor]="true"
                                   *ngIf="!_HavePeriodDecResult" >
                    </logitude-grid>


                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="_PeriodDeclarationList"
                                        *ngIf="_HavePeriodDecResult">


                        <!-- VendorNumber -->
                        <log-column [width]="'100'" [Alignment]="'right'"
                                    [header]="'Customs.CustomsVendor.F.VendorNumber' | TextCodeTranslationPipe"
                                    [binding]="'VendorID'">
                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onPeriodDeclarationCellSelected($event,item)">
                                <div class="RightCenter">
                                    <span>{{item.VendorID}}</span>
                                </div>
                            </log-cell-template>
</ng-template>
                        </log-column>

                        <!-- VendorName -->
                        <log-column [width]="'200'" [Alignment]="'right'"
                                    [header]="'Customs.CustomsVendor.F.VendorName' | TextCodeTranslationPipe"
                                    [binding]="'VendorName'">
                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onPeriodDeclarationCellSelected($event,item)">
                                <div class="RightCenter">
                                    <span>{{item.VendorName }}</span>
                                </div>
                            </log-cell-template>
</ng-template>
                        </log-column>

                        <!-- CountryCode -->
                        <log-column [width]="'100'" [Alignment]="'right'"
                                    [header]="'Customs.CustomsVendor.F.CountryCode' | TextCodeTranslationPipe"
                                    [binding]="'CountryCode'">
                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onPeriodDeclarationCellSelected($event,item)">
                                <div class="RightCenter">
                                    <span>{{item.DBCountryCode }}</span>
                                </div>
                            </log-cell-template>
</ng-template>
                        </log-column>

                        <!-- ImporterDespositionNumber -->
                        <!--[header]="'Customs.ImporterDeclarationQuery.O.PeriodDeclarationID' | TextCodeTranslationPipe"-->
                        <log-column [width]="'100'" [Alignment]="'right'"
                                    [header]="'תצהיר'"
                                    [binding]="'PeriodDeclarationID'">
                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onPeriodDeclarationCellSelected($event,item)">
                                <div class="RightCenter">
                                    <span>{{item.PeriodDeclarationID}}</span>
                                </div>
                            </log-cell-template>
</ng-template>
                        </log-column>


                        <!-- Expiration Date -->
                        <!--[header]="'Customs.ImporterDeclarationQuery.O.ExpirationDate' | TextCodeTranslationPipe"-->
                        <log-column [width]="'100'" [Alignment]="'right'"
                                    [header]="'תוקף תצהיר'"
                                    [binding]="'ExpirationDate'">
                            <ng-template let-item>
<log-cell-template  #logcelltemplate (CellClicked)="onPeriodDeclarationCellSelected($event,item)">
                                <div style="width:100%;height:100%;color: limegreen;">
                                    <div class="RightCenter">
                                        <span>{{item.ExpirationDate }}</span>
                                    </div>
                                </div>
                            </log-cell-template>
</ng-template>
                        </log-column>


                        <!-- Update -->
                        <log-column [width]="'100'" [Alignment]="'right'"
                                    [header]=""
                                    [binding]="'ExpirationDate'">
                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                <div style="width:100%;height:100%;"  *ngIf="!item.DBVendorID" >
                                    <div class="RightCenter">
                                        <span><button class="Button" (click)="SearchAddVendorRequest(item)">הוסף ספק</button></span>
                                    </div>
                                </div>
                            </log-cell-template>
</ng-template>
                        </log-column>



                    </logitude-edit-grid>

                </div>




            </div>
        </td>  
        
    </tr>

    <tr style="height:30px">
        <td colspan="5" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="Button" (click)="NewVendorButtonClicked()" [disabled]="IsDisplayOnly">הקמת ספק חדש</button>
                    </td>
                   

                    <td style="width: 5px;">
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                   
                </tr>
            </table>
        </td>
    </tr>

</table>
