

<table *ngIf="IsVisibile">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="7">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
  

    <tr style="height:5px"></tr>
    <tr>
        <td>
            
        </td>

        <td style="width: 25px;height: 20px;padding: 5px;padding-bottom: 0px;">
            <div><IconButton [IsEnabled]="!IsDisplayOnly&&!IsReleaseFileDisplay" [IsSmall]="true" [Name]="'Add'" (click)="Add(null)" style="float:left;"></IconButton></div>
        </td>
    </tr>
    <tr style="height:5px"></tr>
    <tr style="height:100%;bottom:5px">
        <td colspan="7">
            <table>
                <tr>
                    <td style="width:10px"></td>
                    <td colspan="5" style="padding-right:10px">

                        <div class="CellContent" style="bottom: 5px;padding:5px">
                            <logitude-edit-grid GridWidth="100%"
                                                GridHeight="100%"
                                                (RowEnded)="OnRowEnded($event)"
                                                (Ondblclick)="OnFocus()"
                                                [ItemSource]="ItemsSource">



                                <log-column [header]="'Customs.SupplierInvoiceItemVehicle.F.SequenceNumeric' | TextCodeTranslationPipe" [width]="'90'" [Alignment]="'right'">
                                    <log-cell-template template="let item" #logcelltemplate [TabIndex]="-1">
                                        <div style="text-align:right" class="TextTrimming">
                                            <span>{{item.SequenceNumeric}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>



                                <log-column [header]="'Customs.SupplierInvoiceItemVehicle.F.RichbitFileNumber' | TextCodeTranslationPipe" [binding]="'RichbitFileNumber'" [width]="'140'" [Editable]="true" [Alignment]="'right'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode || IsReleaseFileDisplay">
                                            <span>{{item.RichbitFileNumber}}</span>
                                        </div>
                                        <div *ngIf="logcelltemplate.IsEditMode && !IsReleaseFileDisplay">
                                            <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'RichbitFileNumber'" [DataContext]="item"
                                                        [Text]="item.RichbitFileNumber" [ObjectTableName]="'Customs.SupplierInvoiceItemVehicle'" 
                                                        #RichbitFileNumbernTextBox (LostFocus)="item.OnRichbitFileNumbernLostFocus(logcelltemplate,RichbitFileNumbernTextBox)" [DebounceTime]="1"
                                                         [HideColumns]="true"></LogTextBox>


                                        </div>
                                    </log-cell-template>


                                </log-column>



                                <log-column [header]="'Customs.Vehicle.O.RichbitFileStatus' | TextCodeTranslationPipe" [binding]="'AttachmentTypeCode'" [width]="'140'" [Editable]="true" [Alignment]="'right'">
                                    <log-cell-template template="let item" #logcelltemplate [TabIndex]="-1" [IgnoreMods]="true">
                                        <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode">
                                            <span>{{item.RichbitFileStatus}}</span>
                                        </div>
                                       
                                    </log-cell-template>


                                </log-column>
                                <log-column [header]="'Customs.SupplierInvoiceItemVehicle.F.VehicleChassisNumber' | TextCodeTranslationPipe" [binding]="'VehicleChassisNumber'" [width]="'140'" [Editable]="true" [Alignment]="'right'">
                                    <log-cell-template template="let item" #logcelltemplate>
                                        <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode || (IsReleaseFileDisplay)">
                                            <span>{{item.VehicleChassisNumber}}</span>
                                        </div>
                                        <div *ngIf="logcelltemplate.IsEditMode && (!IsReleaseFileDisplay)">
                                            <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'VehicleChassisNumber'" [DataContext]="item"
                                                        [Text]="item.VehicleChassisNumber" [ObjectTableName]="'Customs.SupplierInvoiceItemVehicle'" [HideColumns]="true"
                                                        (LostFocus)="item.OnVehicleChassisNumberLostFocus(logcelltemplate,VehicleChassisNumberTextBox)" [DebounceTime]="1"
                                                        #VehicleChassisNumberTextBox ></LogTextBox>


                                        </div>
                                    </log-cell-template>


                                </log-column>

                                <log-column [header]="'Customs.SupplierInvoiceItemVehicle.F.ExcludeFromInterface' | TextCodeTranslationPipe" [binding]="'ExcludeFromInterface'" [width]="'50'" [Editable]="true" [Alignment]="'right'">
                                    <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                        <div class="TextTrimming" style="text-align:right; padding-top: 3px;padding-right: 5px;">
                                            <LogCheckBox [ObjectFieldName]="'ExcludeFromInterface'" [Checked]="ExcludeFromInterface" [ObjectTableName]="'Customs.SupplierInvoiceItemVehicle'" [DataContext]="item"></LogCheckBox>
                                        </div>
                                    </log-cell-template>
                                </log-column>
                             



                                <log-column [width]="'50'" [Editable]="true" [Alignment]="'right'" [visibility]="'visibile'">
                                    <log-cell-template [IgnoreMods]="true" template="let item" #logcelltemplate>
                                        <div style="width: 30px; float: right; height:20px;padding-top:3px">
                                            <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="item.DeleteButtonClicked()" [IsEnabled]="!IsDisplayOnly&&!IsReleaseFileDisplay"></IconButton>
                                        </div>



                                    </log-cell-template>
                                </log-column>






                            </logitude-edit-grid>
                        </div>
                    </td>

                </tr>
            </table>
        </td>



    </tr>

    <tr style="height: 32px;">
        <td colspan="7" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td style="width: 57px;" *ngIf="VehiclesFilesButtonVisibility">
                        <button class="Button" (click)="VehiclesFilesButtonClicked()" [disabled]="IsDisplayOnly||IsReleaseFileDisplay">{{'Customs.Vehicle.O.VehiclesFiles' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;" *ngIf="SearchButtonVisibility">
                        <button class="Button" (click)="SearchButtonClicked()"  [disabled]="IsDisplayOnly||IsReleaseFileDisplay">{{'Customs.Vehicle.O.Search' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
