<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>

<table *ngIf="IsLoaded">
    <tr>
        <td>
            <fieldset [disabled]="!IsControlEnabled">
                <div class="TableHolder">
                    <table style="width: 600px;height: 400px;padding-top: 10px;">

                        <!--Disble Alert-->
                        <tr class="FormFieldRow">
                            <td colspan="5">
                                <table>
                                    <tr class="FormFieldRow">
                                        <td>
                                            <div style="width: 100%; height:22px; text-align:center">
                                                <div class="DisbleBox">
                                                    {{'Customs.Deposit.O.DisplayOnly'| TextCodeTranslationPipe}}
                                                </div>
                                            </div>
                                        </td>

                                        <td><div></div></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr class="FormFieldRow"> <td><div></div></td> </tr>

                        <!--General Details-->
                        <tr style="width: 600px; height: 46px;">
                            <td>
                                <fieldset [disabled]="true">
                                    <table>
                                        <tr class="FormFieldRow">
                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'RequestID'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 100px;">
                                                <LogTextBox [ObjectFieldName]="'RequestID'" [Text]="RequestID" [DataContext]="DataContext" [HideColumns]="true"> </LogTextBox>
                                            </td>

                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'RequestTypeCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogLov [ObjectFieldName]="'RequestTypeCode'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Customs.RequestType'"
                                                        [HideColumns]="true"
                                                        [SelectedValue]="RequestTypeCode">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'RequestDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogDatePicker [ObjectFieldName]="'RequestDate'" [ObjectTableName]="ObjectTableName"
                                                               [DataContext]="DataContext" [HideColumns]="true"
                                                               [SelectedDateValue]="RequestDate"></LogDatePicker>
                                            </td>


                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'ApprovedProfessionCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogLov [ObjectFieldName]="'ApprovedProfessionCode'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Customs.ApprovedProfession'"
                                                        [HideColumns]="true"
                                                        [SelectedValue]="ApprovedProfessionCode">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'DecisionCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 100px;">
                                                <LogLov [ObjectFieldName]="'DecisionCode'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Customs.DecisionType'"
                                                        [HideColumns]="true"
                                                        [SelectedValue]="DecisionCode">
                                                </LogLov>
                                            </td>

                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'DecisionNoteForLetter'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px; vertical-align: top;padding-top: 2px; height: 23px;">
                                                <LogTextBox [ObjectFieldName]="'DecisionNoteForLetter'" [ObjectTableName]="ObjectTableName" [Text]="DecisionNoteForLetter"
                                                            [HideColumns]="true" [IsMultiline]="true" [DataContext]="DataContext"></LogTextBox>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'TotalComponentAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogTextBox [ObjectFieldName]="'TotalComponentAmount'" [Text]="TotalComponentAmount" [DataContext]="DataContext" [HideColumns]="true"> </LogTextBox>
                                            </td>

                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'TotalEstimatedAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogTextBox [ObjectFieldName]="'TotalEstimatedAmount'" [Text]="TotalEstimatedAmount" [DataContext]="DataContext" [HideColumns]="true"> </LogTextBox>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'TotalFinancialPenaltyAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogTextBox [ObjectFieldName]="'TotalFinancialPenaltyAmount'" [Text]="TotalFinancialPenaltyAmount" [DataContext]="DataContext" [HideColumns]="true"> </LogTextBox>
                                            </td>

                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'TotalInterestAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogTextBox [ObjectFieldName]="'TotalInterestAmount'" [Text]="TotalInterestAmount" [DataContext]="DataContext" [HideColumns]="true"> </LogTextBox>
                                            </td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td style="width: 100px;">
                                                <LogLabel [ObjectFieldName]="'TotalLinkingAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 120px;">
                                                <LogTextBox [ObjectFieldName]="'TotalLinkingAmount'" [Text]="TotalLinkingAmount" [DataContext]="DataContext" [HideColumns]="true"> </LogTextBox>
                                            </td>

                                            <td><div></div></td>
                                        </tr>

                                        <tr><td><div></div></td></tr>
                                    </table>
                                </fieldset>
                            </td>
                        </tr>

                        <tr>
                            <td><div></div></td>
                        </tr>
                    </table>
                </div>
            </fieldset>
        </td>
    </tr>

    <!-- Ok/Cancel Buttons-->
    <tr style="height: 32px;">
        <td colspan="4" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
