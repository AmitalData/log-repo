<style>
    .CustomMultiLinesText {
        width: 270px;
        height: 300px;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        font-size: 16px;
        border: 1px solid LightGray;
        border-radius: 3px;
        background-color: #EBEBEB;
    }

    .CustomMultiLinesText:hover {
        border: 1px solid #3BB3E2;
    }

</style>


<table style="height:100%;width:100%">

    <tr><td style="text-align:left;height:10px"><div></div></td> </tr>

    <tr style="vertical-align:top;">
        <td style="margin-left:5px;" colspan="4">

            
                <div style="margin:10px;vertical-align:top;" class="CustomMultiLinesText">
                    <div style="white-space: normal;word-wrap: break-word;margin-top:5px;margin-bottom:5px; margin-left:10px;margin-right:10px;font-size:15px">
                        <table style="width: 90%; padding-top: 10px;">
                            <tr class="FormFieldRow" *ngFor="let customFileItem of AccountingCustomFilesList">
                                <td>
                                    <div>
                                        <span style="cursor: pointer;" (click)="OnSelectedFile(customFileItem)">{{customFileItem}}</span>
                                        
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

        </td>
    </tr>


    <tr><td style="text-align:left;height:10px"><div></div></td> </tr>

    <tr style="height:100%"><td><div></div></td> </tr>
</table>
