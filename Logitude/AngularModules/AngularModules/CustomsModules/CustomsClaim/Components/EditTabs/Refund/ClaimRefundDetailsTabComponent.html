<table *ngIf="IsLoaded">
    <tr>
        <td>
            <fieldset [disabled]="!IsControlEnabled">
                <div class="TableHolder">
                    <table style="width: 100%; height: 100px;padding-top: 10px;">

                        <!--Refund General Details -->
                        <tr style="width: 700px">
                            <td style="width: 200px;height:25px; font-size: 12px; color: #1B90CB;">
                                {{'Customs.Claim.TH.RefundDetails'| TextCodeTranslationPipe}}
                            </td>
                        </tr>
                        <tr style="width: 700px">
                            <td style="width: 700px">
                                <div style="width: 700px">
                                    <table style="width: 700px">
                                        <tr class="FormFieldRow">
                                            <td style="width: 120px; ">
                                                <LogLabel [ObjectFieldName]="'BeneficiaryActivityTypeCode'" [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <!--[ObjectTableName]="'Customs.CustomerActivityType'"-->

                                            <td style="width: 170px;">
                                                <LogLov [ObjectFieldName]="'BeneficiaryActivityTypeCode'"
                                                        [ObjectTableName]="'Customs.CustomerActivityType'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Customs.CustomerActivityType'"
                                                        [SelectedValue]="BeneficiaryActivityTypeCode"
                                                        [HideLastColumn]="true"
                                                        [HideColumns]="true">
                                                </LogLov>
                                            </td>

                                            <td><div style="width:20px"></div></td>
                                            <td><div style="width:10px"></div></td>

                                            <td style="width: 120px; ">
                                                <LogLabel [ObjectFieldName]="'BeneficiaryExternalID'" [ObjectTableName]="ObjectTableName"
                                                          [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 170px;">
                                                <LogTextBox [ObjectFieldName]="'BeneficiaryExternalID'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                            [DataContext]="DataContext" [AddCommasToNumbers]="false" [Text]="BeneficiaryExternalID"></LogTextBox>
                                            </td>                                          

                                            <td><div></div></td>
                                        </tr>

                                        <tr class="FormFieldRow">
                                            <td style="width: 120px;">
                                                <LogLabel [ObjectFieldName]="'AccountCountryCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>
                                            <td style="width: 170px;">
                                                <LogLov [ObjectFieldName]="'AccountCountryCode'"
                                                        [ObjectTableName]="'Customs.CustomsCountry'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Customs.CustomsCountry'"
                                                        [SelectedValue]="AccountCountryCode"
                                                        [HideLastColumn]="true"
                                                        [HideColumns]="true">
                                                </LogLov>
                                            </td>

                                            <td><div></div></td>
                                        </tr>
                                    </table>
                                </div>
                            </td>

                            <td><div></div></td>
                        </tr>

                        <!--Refund Israel Bank Details -->
                        <tr style="width: 700px">
                            <td style="width: 200px;height:25px; font-size: 12px; color: #1B90CB;">
                                {{'Customs.Claim.TH.RefundIsraelBankDetails'| TextCodeTranslationPipe}}
                            </td>
                        </tr>
                        <tr style="width: 700px">
                            <td style="width: 700px">
                                <fieldset [disabled]="!IsraelBankFieldsEnabled">
                                    <div style="width: 700px">
                                        <table style="width: 700px">
                                            <tr class="FormFieldRow">
                                                <td style="width: 120px; ">
                                                    <LogLabel [NoObjectField]="true"
                                                              [ObjectFieldName]="'InternalBankId'"
                                                              [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"
                                                              [TextCode]="'Customs.PaymentQuery.O.InternalBankId'"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <ComboBox [ItemsSource]="banksList"
                                                              [SelectedItem]="SelectedBankIndex"
                                                              (SelectedItemChanged)="SelectedBankIndex = $event"
                                                              [Binding]="'LocalName'" [IsDisabled]="!IsraelBankFieldsEnabled"></ComboBox>
                                                </td>
                                                <td style="width: 20px; height: 20px;padding: 5px;padding-bottom: 0px;">
                                                    <div>
                                                        <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteBankDetailsCommand(item)"
                                                                    [IsEnabled]="IsraelBankFieldsEnabled"
                                                                    style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                                                    </div>
                                                </td>

                                                <td><div style="width:10px"></div></td>

                                                <td style="width: 120px; ">
                                                    <LogLabel [ObjectFieldName]="'BankTypeCode'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogTextBox [ObjectFieldName]="'BankTypeCode'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                [DataContext]="DataContext" [AddCommasToNumbers]="false" [Text]="BankTypeCode"></LogTextBox>
                                                </td>

                                                <td><div></div></td>
                                            </tr>

                                            <tr class="FormFieldRow">
                                                <td style="width: 120px;">
                                                    <LogLabel [ObjectFieldName]="'AccountBranchCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogLov [ObjectFieldName]="'AccountBranchCode'"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'Customs.CustomsBranch'"
                                                            [SelectedValue]="AccountBranchCode"
                                                            [HideLastColumn]="true"
                                                            [HideColumns]="true">
                                                    </LogLov>
                                                </td>

                                                <td><div style="width:20px"></div></td>
                                                <td><div style="width:10px"></div></td>

                                                <td style="width: 120px; ">
                                                    <LogLabel [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogTextBox [ObjectFieldName]="'AccountNumber'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                [DataContext]="DataContext" [AddCommasToNumbers]="false" [Text]="AccountNumber"></LogTextBox>
                                                </td>

                                                <td><div></div></td>
                                            </tr>
                                        </table>
                                    </div>
                                </fieldset>
                            </td>

                            <td><div></div></td>
                        </tr>

                        <!--Refund Foreign Bank Details -->
                        <tr style="width: 700px">
                            <td style="width: 200px;height:25px; font-size: 12px; color: #1B90CB;">
                                {{'Customs.Claim.TH.RefundForeignBankDetails'| TextCodeTranslationPipe}}
                            </td>
                        </tr>
                        <tr style="width: 700px">
                            <td style="width: 700px">
                                <fieldset [disabled]="!ForeignBankFieldsEnabled">
                                    <div style="width: 700px">
                                        <table style="width: 700px">
                                            <tr class="FormFieldRow">
                                                <td style="width: 120px; ">
                                                    <LogLabel [ObjectFieldName]="'AccountCurrencyTypeCode'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogLov [ObjectFieldName]="'AccountCurrencyTypeCode'"
                                                            [ObjectTableName]="ObjectTableName"
                                                            [DataContext]="DataContext"
                                                            [LookUpTableName]="'Customs.CurrencyType'"
                                                            [SelectedValue]="AccountCurrencyTypeCode"
                                                            [HideLastColumn]="true"
                                                            [HideColumns]="true">
                                                    </LogLov>
                                                    <!--[CustomFilterValue]="StorageFilterValue"-->
                                                </td>

                                                <td><div style="width:20px"></div></td>
                                                <td><div style="width:10px"></div></td>

                                                <td style="width: 120px; ">
                                                    <LogLabel [ObjectFieldName]="'ForeignBank'" [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogTextBox [ObjectFieldName]="'ForeignBank'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                [DataContext]="DataContext" [AddCommasToNumbers]="false" [Text]="ForeignBank"></LogTextBox>
                                                </td>

                                                <td><div></div></td>
                                            </tr>

                                            <tr class="FormFieldRow">
                                                <td style="width: 120px;">
                                                    <LogLabel [ObjectFieldName]="'ForeignBranch'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogTextBox [ObjectFieldName]="'ForeignBranch'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                [DataContext]="DataContext" [AddCommasToNumbers]="false" [Text]="ForeignBranch"></LogTextBox>
                                                </td>

                                                <td><div style="width:20px"></div></td>
                                                <td><div style="width:10px"></div></td>

                                                <td style="width: 120px;">
                                                    <LogLabel [ObjectFieldName]="'AccountCountryCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>
                                                <td style="width: 170px;">
                                                    <LogTextBox [ObjectFieldName]="'ForeignAccountNumber'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                [DataContext]="DataContext" [AddCommasToNumbers]="false" [Text]="ForeignAccountNumber"></LogTextBox>
                                                </td>

                                                <td><div></div></td>
                                            </tr>
                                        </table>
                                    </div>
                                </fieldset>
                            </td>

                            <td><div></div></td>
                        </tr>

                    </table>
                </div>
            </fieldset>
        </td>
    </tr>
</table>
