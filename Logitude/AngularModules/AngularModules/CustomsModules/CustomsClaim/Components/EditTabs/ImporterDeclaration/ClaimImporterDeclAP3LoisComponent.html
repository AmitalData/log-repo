
<table>
    <tr>
        <td>
            <fieldset [disabled]="!IsControlEnabled">
                <div class="TableHolder">
                    <table style="width: 250px; height: 350px;padding-top: 10px;">
                        <tr style="height: 100%; width: 100%; top:0px">
                            <td>
                                <div>
                                    <table>
                                        <tr style="height: 30px">
                                            <td class="TabTitleRow" style="width:150px">
                                                {{'Customs.ClaimImporterDeclarsP3Loi.F.ImporterLoiDeclarationTypeCode'| TextCodeTranslationPipe}}
                                            </td>

                                            <td> <div></div> </td>
                                            <td style="height: 20px;padding: 5px;padding-bottom: 0px;">
                                                <div>
                                                    <IconButton [IsSmall]="true"
                                                                [Name]="'Add'"
                                                                (click)="AddNewImporterDeclarsP3LoiCommand()"
                                                                style="float:left;"></IconButton>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr style="height: 300px; overflow: auto;">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [FooterTop]="FooterMethods"
                                                                        [ItemSource]="ClaimImporterDeclarsP3Loilist" [IsReadOnly]="!IsControlEnabled">

                                                        <!-- DeclarationNumber -->
                                                        <log-column [header]="'Customs.ClaimImporterDeclarsP3Loi.F.DeclarationNumber' | TextCodeTranslationPipe"
                                                                    [width]="'180'" [Alignment]="'right'" [binding]="'DeclarationNumber'">
                                                            <log-cell-template template="let item" #logcelltemplate>
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.DeclarationNumber}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                                    <LogTextBox [ObjectFieldName]="'DeclarationNumber'" [DataContext]="item"
                                                                                [FocusOnMe]="true" [ObjectTableName]="ObjectTableName" [InputType]="'integer'"
                                                                                [Text]="item.DeclarationNumber" [HideColumns]="true"></LogTextBox>
                                                                </div>
                                                            </log-cell-template>
                                                        </log-column>

                                                        <!-- Delete Button-->
                                                        <log-column [width]="'40'" [Alignment]="'right'">
                                                            <log-cell-template template="let item" [TabIndex]="-1" [IgnoreMods]="true">
                                                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteImporterDeclarsP3LoiCommand(item)"
                                                                            [IsEnabled]="!IsDisplayOnly"
                                                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                                                            </log-cell-template>
                                                        </log-column>

                                                    </logitude-edit-grid>
                                                </div>
                                            </td>

                                            <td> <div></div> </td>
                                        </tr>

                                        <tr><td><div></div></td></tr>
                                    </table>
                                </div>
                            </td>
                        </tr>

                    </table>
                </div>
            </fieldset>
        </td>
    </tr>

    <tr style="height: 40px;">
        <td colspan="2">
            <table>
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;vertical-align: bottom;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 67px;vertical-align: bottom; padding-right: 10px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Save' |TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>


    </tr>

</table>
