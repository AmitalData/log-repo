<style>
    .NotesBox {
        border: 1px solid gray;
        border-radius: 5px;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>

<table *ngIf="IsLoaded">
    <tr>
        <td>
            <fieldset [disabled]="!IsControlEnabled">
                <div class="TableHolder">
                    <table style="width: 550px; height: 400px;padding-top: 10px;">
                        <!-- ValidationSummary  -->
                        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                            <td colspan="4">
                                <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
                            </td>
                        </tr>
                        <tr class="FormFieldRow"><td><div></div></td></tr>

                        <!-- ImporterAffidavit  תצהיר יבואן -->
                        <tr style="width: 550px; height: 70px">
                            <td style="width: 550px; height: 70px">
                                <div style="width: 550px; height: 70px;">
                                    <table style="width: 550px; height: 70px">
                                        <tr class="FormFieldRow">
                                            <td style="width: 300px; height:100px">
                                                <div style="width: 100%; height:100%; text-align:center;">
                                                    <textarea [(ngModel)]="ImporterAffidavit"></textarea>
                                                </div>
                                            </td>

                                            <td><div></div></td>
                                        </tr>
                                    </table>
                                </div>
                            </td>

                            <td><div></div></td>
                        </tr>

                        <tr class="FormFieldRow"><td><div></div></td></tr>

                        <!-- Claims Importer Declaration -->
                        <tr style="height: 200px; width: 500px;">
                            <td style="height: 200px; width: 500px;">
                                <div style="height: 200px; width: 500px;">
                                    <table style="height: 200px; width: 500px;">
                                        <tr style="height: 30px">
                                            <td class="TabTitleRow" style="width:150px">
                                                {{'Customs.ClaimImporterDeclarsPage3'| TextCodeTranslationPipe}}
                                            </td>

                                            <td> <div></div> </td>
                                            <td style="height: 20px;padding: 5px;padding-bottom: 0px;">
                                                <div>
                                                    <IconButton [IsSmall]="true"
                                                                [Name]="'Add'"
                                                                (click)="AddImporterDeclareCommand()"
                                                                style="float:left;"></IconButton>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr style="height: 170px; overflow: auto;">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [FooterTop]="FooterMethods"
                                                                        [ItemSource]="ClaimImporterDeclAlist">

                                                        <!-- ImporterLoiDeclarationTypeCode -->
                                                        <log-column [header]="'Customs.ClaimImporterDeclarsPage3.F.ImporterLoiDeclarationTypeCode' | TextCodeTranslationPipe"
                                                                    [width]="'300'" [Alignment]="'right'" [binding]="'ImporterLoiDeclarationTypeCode'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div class="TextTrimming RightCenter" [attr.title]="getItemTitle(item)" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.ImporterDeclarationTypeName}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                                    <LogLov [ObjectFieldName]="'ImporterLoiDeclarationTypeCode'"
                                                                            [ObjectTableName]="'Customs.ImporterDeclarationType'"
                                                                            [DataContext]="item"
                                                                            [LookUpTableName]="'Customs.ImporterDeclarationType'"
                                                                            (SelectedItemChanged)="item.SetLocalName($event,'ImporterDeclarationTypeName')"
                                                                            [HideColumns]="true"
                                                                            [FocusOnMe]="true"
                                                                            [SelectedValue]="item.ImporterLoiDeclarationTypeCode">
                                                                    </LogLov>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- MyDeclarationList -->
                                                        <log-column [header]="'Customs.Declaration.O.Declarations' | TextCodeTranslationPipe"
                                                                    [width]="'120'" [Alignment]="'right'" [binding]="'MyDeclarationList'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.MyDeclarationList}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                                    <LogTextBox [ObjectFieldName]="'MyDeclarationList'" [ObjectTableName]="ObjectTableName" [HideColumns]="true"
                                                                                (LostFocus)="item.ImporterDeclarationLostFocus($event)"
                                                                                [FocusOnMe]="true" (keypress)="IsNumberKey($event)"
                                                                                [DataContext]="item" [Text]="item.MyDeclarationList"></LogTextBox>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- Delete Button-->
                                                        <log-column [width]="'50'" [Alignment]="'right'">
                                                            <ng-template let-item>
<log-cell-template  [TabIndex]="-1" [IgnoreMods]="true">
                                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditImporterDeclareCommand(item)"
                                                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>

                                                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteImporterDeclareCommand(item)"
                                                                            [IsEnabled]="!IsDisplayOnly"
                                                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                    </logitude-edit-grid>
                                                </div>
                                            </td>

                                            <td> <div></div> </td>
                                        </tr>

                                        <tr><td><div></div></td></tr>
                                    </table>
                                </div>
                            </td>
                        </tr>

                        <!-- Claims Importer Declaration A -->
                        <tr style="height: 200px; width: 250px; top:0px">
                            <td style="height: 200px; width: 250px;">
                                <div style="height: 200px; width: 250px;">
                                    <table style="height: 200px; width: 250px;">
                                        <tr style="height: 30px">
                                            <td class="TabTitleRow" style="width:150px">
                                                {{'Customs.Claims.O.ClaimImporterDeclarsPage3A'| TextCodeTranslationPipe}}
                                            </td>

                                            <td> <div></div> </td>
                                            <td style="height: 20px;padding: 5px;padding-bottom: 0px;">
                                                <div>
                                                    <IconButton [IsSmall]="true"
                                                                [Name]="'Add'"
                                                                (click)="AddCommercialSaleCommand()"
                                                                style="float:left;"></IconButton>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr style="height: 170px; overflow: auto;">
                                            <td colspan="5">
                                                <div class="CellContent">
                                                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [FooterTop]="FooterMethods"
                                                                        [ItemSource]="CommercialSalelist">

                                                        <!-- CommercialSale -->
                                                        <log-column [header]="'Customs.ClaimImporterDeclarsPage3A.F.CommercialSaleTypeCode' | TextCodeTranslationPipe"
                                                                    [width]="'180'" [Alignment]="'right'" [binding]="'CommercialSaleTypeCode'">
                                                            <ng-template let-item>
<log-cell-template  #logcelltemplate>
                                                                <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                                    <span>{{item.CommercialSaleTypeName}}</span>
                                                                </div>
                                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                                    <LogLov [ObjectFieldName]="'CommercialSaleTypeCode'"
                                                                            [ObjectTableName]="'Customs.CommercialSale'"
                                                                            [DataContext]="item"
                                                                            [LookUpTableName]="'Customs.CommercialSale'"
                                                                            (SelectedItemChanged)="item.SetLocalName($event,'CommercialSaleTypeName')"
                                                                            [HideColumns]="true"
                                                                            [FocusOnMe]="true"
                                                                            [SelectedValue]="item.CommercialSaleTypeCode">
                                                                    </LogLov>
                                                                </div>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                        <!-- Delete Button-->
                                                        <log-column [width]="'30'" [Alignment]="'right'">
                                                            <ng-template let-item>
<log-cell-template  [TabIndex]="-1" [IgnoreMods]="true">
                                                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteCommercialSaleCommand(item)"
                                                                            [IsEnabled]="!IsDisplayOnly"
                                                                            style="display: block; float: right; margin-right:3px; margin-top:2px;"></IconButton>
                                                            </log-cell-template>
</ng-template>
                                                        </log-column>

                                                    </logitude-edit-grid>
                                                </div>
                                            </td>

                                            <td> <div></div> </td>
                                        </tr>

                                        <tr><td><div></div></td></tr>
                                    </table>
                                </div>
                            </td>
                        </tr>

                    </table>
                </div>
            </fieldset>
        </td>
    </tr>
</table>
