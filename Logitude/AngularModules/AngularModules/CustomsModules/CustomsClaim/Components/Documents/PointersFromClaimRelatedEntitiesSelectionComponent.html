
<style>
    .subTitle {
        color: #4b90cb;
        font-size: 16px;
        padding-left: 5px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table>
    <tr *ngIf="IsDisplayOnly" style="height:22px">
        <td>
            <div style="width:100%;text-align:center;margin:0 auto;">
                <div class="DisbleBox">
                    {{DisplayOnlyMessage}}
                </div>
            </div>
        </td>
    </tr>

    <!-- SupplierInvoicesList -->
    <tr style="height: 28px;">
        <td class="subTitle">{{'Customs.Claim.O.RelatedEntites' | TextCodeTranslationPipe}}</td>
    </tr>
    <tr>
        <td>
            <div class="CellContent">
                <logitude-edit-grid GridWidth="100%"
                                    GridHeight="100%" [EnableMultiSelection]="true"
                                    (SelectedItemChanged)="OnRowSelected($event)"
                                    [SelectedRow]="SelectedRow"
                                    [ItemSource]="ClaimRelatedEntitiesList"
                                    [SelectedRows]="SelectedClaimRelatedEntities.Collection"
                                    [Disabled]="IsDisplayOnly">

                    <!-- ClaimEntityTypeCode -->
                    <log-column [header]="'Customs.ClaimsRelatedEntity.F.ClaimEntityTypeName' | TextCodeTranslationPipe" [width]="'50'" [Alignment]="'right'" [binding]="'ClaimEntityTypeName'">
                        <log-cell-template template="let item" #logcelltemplate [IgnoreMods]="true">
                            <div style="text-align: right;" class="TextTrimming">
                                <span>{{item.ClaimEntityTypeName}}</span>
                            </div>
                        </log-cell-template>
                    </log-column>

                    <!-- ClaimEntityNumber -->
                    <log-column [header]="'Customs.ClaimsRelatedEntity.F.ClaimEntityNumber' | TextCodeTranslationPipe" [width]="'120'" [Alignment]="'right'" [binding]="'ClaimEntityNumber'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="text-align: right;" class="TextTrimming">
                                <span>{{item.ClaimEntityNumber}}</span>
                            </div>

                        </log-cell-template>
                    </log-column>

                    <!-- TapagNumber -->
                    <log-column [header]="'Customs.ClaimsRelatedEntity.F.TapagNumber' | TextCodeTranslationPipe" [width]="'120'" [Alignment]="'right'" [binding]="'TapagNumber'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="text-align: right;" class="TextTrimming">
                                <span>{{item.TapagNumber}}</span>
                            </div>

                        </log-cell-template>
                    </log-column>

                    <!-- IsFinancialRefundDemand -->
                    <log-column [header]="'Customs.ClaimsRelatedEntity.F.IsFinancialRefundDemand' | TextCodeTranslationPipe" [width]="'100'" [Alignment]="'right'" [binding]="'IsFinancialRefundDemand'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="text-align: right;" class="TextTrimming">
                                <img *ngIf="item.IsFinancialRefundDemand" src="./Images/CheckBoxIcon.png" class="CenterCenter" />
                            </div>

                        </log-cell-template>
                    </log-column>

                    <!-- ClaimAmount -->
                    <log-column [header]="'Customs.ClaimsRelatedEntity.F.ClaimAmount' | TextCodeTranslationPipe" [width]="'100'" [Alignment]="'right'" [binding]="'ClaimAmount'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="text-align: right;" class="TextTrimming">
                                <span>{{item.ClaimAmount | NumbersPipe:'n2'}}</span>
                            </div>

                        </log-cell-template>
                    </log-column>

                    <!--ContinuousMessagesTypeCode-->
                    <log-column [header]="'Customs.ClaimsRelatedEntity.F.ContinuousMessagesTypeCode' | TextCodeTranslationPipe" [width]="'100'" [Alignment]="'right'" [binding]="'ContinuousMessagesTypeCode'">
                        <log-cell-template template="let item" #logcelltemplate>
                            <div style="text-align: right;" class="TextTrimming">
                                <span>{{item.ContinuousMessagesTypeCode}}</span>
                            </div>

                        </log-cell-template>
                    </log-column>


                </logitude-edit-grid>
            </div>

        </td>
    </tr>


    <tr style="height: 40px;">
        <td>
            <table>
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;vertical-align: bottom;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'Customs.General.B.Cancel' |TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 67px;vertical-align: bottom; padding-right: 10px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' |TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>


    </tr>

</table>
