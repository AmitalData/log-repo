<table *ngIf="_IsReady">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="2">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr style="height:5px"></tr>
    <tr>
        <td style="width:80px;">
            <LogLabel [NoObjectField]="true"
                      [ObjectFieldName]="'FollowUpDate'"
                      [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"
                      [TextCode]="'Customs.DeclarationReferantData.O.FollowUpDate'">
            </LogLabel>
        </td>
        <td style="width:120px;">
            <LogDatePicker [UseDefaultPosition]="true" [ObjectFieldName]="'FollowUpDate'" [ObjectTableName]="ObjectTableName"
                           [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
        </td>
        <td><div></div></td>
        <td><div></div></td>
        <td><div></div></td>
        <td><div></div></td>
        <td style="width: 25px;height: 20px;padding: 5px;padding-bottom: 0px;">
            <div><IconButton [IsEnabled]="!IsDisplayOnly" [IsSmall]="true" [Name]="'Add'" (click)="Add()" style="float:left;"></IconButton></div>
        </td>
    </tr>
    <tr style="height:5px"></tr>
    <tr style="height:100%;bottom:5px">
        <td colspan="7">
            <table>
                <tr>
                    <td colspan="7" style="width:100%">
                        <div class="CellContent" style="bottom: 5px;padding:5px">
                            <logitude-edit-grid GridWidth="100%"
                                                GridHeight="100%"
                                                (RowEnded)="OnRowEnded($event)"
                                                (Ondblclick)="OnFocus()"
                                                [ItemSource]="ReferantExceptionItemsSource"
                                                (SelectedItemChanged)="OnRowSelected($event)"
                                                [IsReadOnly]="IsDisplayOnly"
                                                [SelectedRow]="SelectedRow">
                                <!-- ExceptionReasonsCode -->
                                <log-column [header]="'Customs.DeclarationReferantData.O.ExceptionReasonsCode '| TextCodeTranslationPipe" [binding]="'ExceptionReasonsCode'" [width]="'130'" [Alignment]="'center'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IsEnabled]="!item.ShowCode">
                                            <div class="TextTrimming RightCenter" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.ExceptionReasonName}}</span>
                                            </div>
                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                <LogLov #ReferantReasonLovBox
                                                        [ObjectFieldName]="'ExceptionReasonsCode'"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="item"
                                                        [LookUpTableName]="'Customs.ExceptionReason'"
                                                        (SelectedItemChanged)="item.SetLocalName($event, 'ExceptionReasonName')"
                                                        [FocusOnMe]="'true'"
                                                        [HideColumns]="true"
                                                        [UseDefaultPosition]="true"
                                                        [QueryFilterItems]="isActiveFilterItems">

                                                </LogLov>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>
                                <log-column [header]="'Customs.DeclarationReferantData.O.ExceptionRemarks ' | TextCodeTranslationPipe" [binding]="'ExceptionRemarks'"  [width]="'150'" [Editable]="true" [Alignment]="'right'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.ExceptionRemarks}}</span>
                                            </div>
                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                <LogTextBox [ObjectFieldName]="'ExceptionRemarks'" [InputType]="'ntext'" [DataContext]="item"
                                                            [ObjectTableName]="ObjectTableName" [HideColumns]="true" [IsMultiline]="true"></LogTextBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Status --> <!-- [Text]="item.Status" -->
                                <log-column [header]="'Customs.DeclarationReferantData.O.Status ' | TextCodeTranslationPipe" [width]="'100'" [Alignment]="'center'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div class="TextTrimming" style="text-align:right" *ngIf="logcelltemplate.IsDisplayMode">
                                                <span>{{item.SelectedItemStatus.Value}}</span>
                                            </div>
                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                <ComboBox [ItemsSource]="item._StatusItems" [Binding]="'Value'" [SelectedItem]="item.SelectedItemStatus" (SelectedItemChanged)="item.StatusChanged($event)"></ComboBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>
                                <log-column [width]="'35'" [Editable]="true" [Alignment]="'center'" [visibility]="'collapsed'">
                                    <ng-template let-item>
                                        <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                            <div style="   width: 30px;
        float: right;
        height: 20px;
        padding-top: 3px">
                                                <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteButtonClicked(item)" [IsEnabled]="!IsDisplayOnly"></IconButton>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>
                            </logitude-edit-grid>

                        </div>
                    </td>
                </tr>

    <tr style="height: 32px;">
        <td colspan="7" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" *ngIf="this.exceptionReasonSharedDataService.IsDirty" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                        <button class="Button" *ngIf="!this.exceptionReasonSharedDataService.IsDirty" (click)="OkButtonClicked()" [disabled]="IsDisplayOnly">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>


</table>
