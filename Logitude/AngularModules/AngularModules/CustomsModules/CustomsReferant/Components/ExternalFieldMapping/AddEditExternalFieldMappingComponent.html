<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 3px 3px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>

<table *ngIf="Loaded">

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <!-- Filters Fields-->
    <tr>
        <td colspan="4" style="">

            <table style="table-layout: fixed;" *ngIf="EntityPM">
                <tr style="height: 10px;">
                    <td style="width: 130px;"></td>
                    <td style="width: 170px;"></td>
                    <td></td>
                </tr>

                <!-- WarningMessage -->
                <tr class="FormFieldRow" style="width: 100% ;"*ngIf="WarningMessage != null">
                    <td colspan="3">
                        <table>
                            <tr class="FormFieldRow">
                                <td style="width: 10px; "><div></div></td>

                                <td style="width: 500px;">
                                    <div style="width: 100%; height:22px; text-align:center">
                                        <div class="DisbleBox">
                                            {{WarningMessage}}
                                        </div>
                                    </div>
                                </td>

                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr class="FormFieldRow"> </tr>

                <!-- Code -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'StatusFieldType'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                                [ObjectFieldName]="'StatusFieldType'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Customs.StatusFieldType'"
                                [HideColumns]="true"
                                [FocusOnMe]="true"
                                [SelectedValue]="StatusFieldType">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow" *ngIf="isWindowMode">
                    <td>
                        <LogLabel [ObjectFieldName]="'StatusCode'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                                [ObjectFieldName]="'StatusCode'"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'GTBFUSTATU'"
                                [HideColumns]="true"
                                [FocusOnMe]="true"
                                [SelectedValue]="StatusCode">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'StatusName'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'StatusName'" [ObjectTableName]="ObjectTableName" [Text]="StatusName"
                                    [DataContext]="DataContext" [HideColumns]="true" [InputType]="'Text'"></LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <!-- InActive -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogCheckBox [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="InActive"></LogCheckBox>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                </tr>
            </table>

        </td>
    </tr>

    <tr *ngIf="isWindowMode" style="height: 40px;">
        <td>
            <div></div>
        </td>
        <td style="width: 57px;vertical-align: bottom;">
            <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Close' |TextCodeTranslationPipe}}</button>
        </td>
        <td style="width: 10px;"><div></div></td>
        <td style="width: 50px;vertical-align: bottom;">
            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' |TextCodeTranslationPipe}}</button>
        </td>
    </tr>

</table>
