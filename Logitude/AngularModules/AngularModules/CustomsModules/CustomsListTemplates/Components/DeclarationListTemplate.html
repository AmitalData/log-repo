


<div   *ngIf="rowData && fieldName && fieldName != 'TaxationDateTime'"  style="text-align: right; color: #747474;" >

    {{ rowData[fieldName]   }}

</div>

<div  *ngIf="fieldName == 'TaxationDateTime'" style="text-align: right; color: #747474;">

    {{ rowData.TaxationDateTime | DateTimePipe:'DT' }}

</div>

<div class="TextTrimming" *ngIf="fieldName == 'CourierPendingReasonName'" style="text-align:right;">
    <span data-toggle="tooltip" data-placement="bottom" title="{{CourierPendingReasonListToolTip}}">{{CourierPendingReasonListText}}</span>
</div>
