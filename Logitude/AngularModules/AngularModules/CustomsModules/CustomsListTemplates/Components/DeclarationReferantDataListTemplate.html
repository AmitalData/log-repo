            <!--DeclarationReferantData-->
     <!-- DeclarationStatusTypeName -->
    <div *ngIf="FieldName == 'DeclarationStatusTypeName'" style="position:relative;width:100%; height: 100%;">
        <div style="position: absolute;top: 0;bottom: 0px; left: 0px; right: 0px;text-align:right">


            <div *ngIf="!IsHeaderScreenTemplate">
                <!-- <div style="display: inline-block;" *ngIf="Entity['HasConstraint']">-->
                <img *ngIf="Entity['HasConstraint']" style="width:20px" src="./Images/Warning_icon.png" />

                <div class="TextTrimming"
                     style="display: inline; "
                     [ngStyle]="{color: Entity.DeclarationStatusTypeCode | StringToColorPipe:'DeclarationStatusTypeCode'}">
                    <span style="font-weight: bold;">{{Entity[FieldName]}}</span>
                </div>
            </div>


            <div *ngIf="IsHeaderScreenTemplate">
                <div class="TextTrimming"
                     style="display: inline; position: absolute;left: 0px; padding-top: 1px;"
                     [ngStyle]="{color: Entity.DeclarationStatusTypeCode | StringToColorPipe:'DeclarationStatusTypeCode'}"
                     [style.right]="Entity['HasConstraint'] ? '25px' : '0px'">
                    <span style="font-weight: bold;">{{Entity[FieldName]}}</span>
                </div>
                <div *ngIf="Entity['HasConstraint']">
                    <img style="width:20px" src="./Images/Warning_icon.png" />
                </div>
            </div>

        </div>
    </div>

    <div *ngIf="FieldName == 'ArrivalDate'" style="position:relative;width:100%; height: 100%;">
        <div class="TextTrimming"
             style="display: inline; position: absolute;right: 0px; padding-top: 1px;">

            <div *ngIf="!IsHeaderScreenTemplate" class="TextTrimming"
                 [ngStyle]="{color: Entity.ATAOrETA | StringToColorPipe : 'ArrivalDate'}">
                <span>{{Entity[FieldName] | DateTimePipe:'D'}}</span>
            </div>

        </div>
    </div>


    <div *ngIf="FieldName == 'PreClassification'" style="position:relative;width:100%; height: 100%;" (click)="PreShowCFIFILEMMoveSIToOCRScreen(Entity['PreClassification'])">

        <div *ngIf="!IsHeaderScreenTemplate" style="display: inline; position: absolute;right: 0px;">
            <div *ngIf="Entity['PreClassification']=='V'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Successful_process@2x.png" />
            </div>
            <div *ngIf="Entity['PreClassification']=='X'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/process_failed@2x.png" />
            </div>
            <div *ngIf="Entity['PreClassification']=='P'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/in_progress@2x.png" />
            </div>
            <div *ngIf="Entity['PreClassification']=='E'">
                <img class="CenterCenter" style="width:40px;height:20px;margin-top:6px" src="./Images/Successful_processRemark_button@2x.png" />
            </div>

        </div>
    </div>


    <div *ngIf="FieldName == 'ClassificationStatus'" style="position:relative;width:100%; height: 100%;" (click)="OpenRemarks()">

        <div *ngIf="!IsHeaderScreenTemplate" style="display: inline; position: absolute;right: 0px;">
            <div *ngIf="Entity['ClassificationStatus']=='V' && Entity['IsClassificationRemarks']==false">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Successful_process@2x.png" />
            </div>
            <div *ngIf="Entity['ClassificationStatus']=='X' && Entity['IsClassificationRemarks']==false">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/process_failed@2x.png" />
            </div>
            <div *ngIf="Entity['ClassificationStatus']=='P'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/in_progress@2x.png" />
            </div>
            <div *ngIf="Entity['ClassificationStatus']=='V' && Entity['IsClassificationRemarks']==true">
                <img class="CenterCenter" style="width:40px;height:20px;margin-top:6px" src="./Images/Successful_processRemark_button@2x.png" />
            </div>
            <div *ngIf="Entity['ClassificationStatus']=='X' && Entity['IsClassificationRemarks']==true">
                <img class="CenterCenter" style="width:40px;height:20px;margin-top:6px" src="./Images/process_failed_button@2x.png" />
            </div>

        </div>
    </div>
    <div *ngIf="FieldName == 'ExceptionReasonsList'" style="position:relative;width:100%; height: 100%;">
        <div *ngIf="!IsHeaderScreenTemplate" style="display: inline; position: absolute;right: 0px;">
            <div *ngIf="Entity['ExceptionReasonsList']!=null">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/irregular@2x.png" />
            </div>
        </div>
    </div>
    <div *ngIf="FieldName == 'ControllerStatus'" style="position:relative;width:100%; height: 100%;" (click)="OpenRemarks()">

        <div *ngIf="!IsHeaderScreenTemplate" style="display: inline; position: absolute;right: 0px;">
            <div *ngIf="Entity['ControllerStatus']=='V' && Entity['IsControllerRemarks']==false">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Successful_process@2x.png" />
            </div>
            <div *ngIf="Entity['ControllerStatus']=='X'&& Entity['IsControllerRemarks']==false">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/process_failed@2x.png" />
            </div>
            <div *ngIf="Entity['ControllerStatus']=='P'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/in_progress@2x.png" />
            </div>
            <div *ngIf="Entity['ControllerStatus']=='V' && Entity['IsControllerRemarks']==true">
                <img class="CenterCenter" style="width:40px;height:20px;margin-top:6px" src="./Images/Successful_processRemark_button@2x.png" />
            </div>
            <div *ngIf="Entity['ControllerStatus']=='X' && Entity['IsControllerRemarks']==true">
                <img class="CenterCenter" style="width:40px;height:20px;margin-top:6px" src="./Images/process_failed_button@2x.png" />
            </div>

        </div>
    </div>
    <div *ngIf="FieldName == 'CollectionOfMoneyStatus'" style="position:relative;width:100%; height: 100%;">

        <div *ngIf="!IsHeaderScreenTemplate" style="display: inline; position: absolute;right: 0px;">
            <div *ngIf="Entity['CollectionOfMoneyStatus']=='V'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Successful_process@2x.png" />
            </div>
            <div *ngIf="Entity['CollectionOfMoneyStatus']=='P'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/in_progress@2x.png" />
            </div>
        </div>
    </div>
    <div *ngIf="FieldName == 'WithPaper'" style="position:relative;width:100%; height: 100%;">

        <div *ngIf="!IsHeaderScreenTemplate">
            <div *ngIf="Entity['WithPaper']==true">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Manual_process@2x.png" />
            </div>

        </div>
    </div>

    <div *ngIf="FieldName == 'TransportModeId'" style="position:relative;width:100%; height: 100%;">

        <div *ngIf="!IsHeaderScreenTemplate">
            <div *ngIf="Entity['TransportModeId']=='A'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Airline.png" />
            </div>
            <div *ngIf="Entity['TransportModeId']=='L'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Trucker.png" />
            </div>
            <div *ngIf="Entity['TransportModeId']=='O'">
                <img class="CenterCenter" style="width:20px;height:20px;margin-top:6px" src="./Images/Vessel.png" />
            </div>
        </div>
    </div>


    <div *ngIf="FieldName == 'Actions'" (click)="ButtonClick($event)">
        <div (click)="ButtonClick($event)">
            <courier-filter-button #MyDropdownMenuFilterComponent
                                   [IsDisabled]="IsDisplayOnly">
                <div class="class-filter-content">
                    <div>
                        <img style="width: 14px; height: 14px; position: center;" src="./Images/Icons/Actions.png" />
                    </div>
                </div>

                <div dir="RTL" class="class-dropdownfilter-content" (click)="MyDropdownMenuFilterComponent.DropdownDisplayClose()">
                    <ul class="P-button-drop-menu" style="text-align:right">
                        <li (click)="MyDropdownMenuFilterComponent.DropdownDisplayClose();ShowDeclaration($event);  ">
                            <span>כניסה להצהרה</span>
                        </li>
                        <li (click)="MyDropdownMenuFilterComponent.DropdownDisplayClose(); ShowCFIFILEMMoveToQueueScreen();">
                            <span>העברה לתור</span>
                        </li>

                        <li (click)="MyDropdownMenuFilterComponent.DropdownDisplayClose();  ShowGFUUSTS();">
                            <span>הזנת סטטוס</span>
                        </li>
                        <li (click)="MyDropdownMenuFilterComponent.DropdownDisplayClose(); ShowCFIFILEMMoveSIToOCRScreen();">
                            <span>העברת חשבונות ספק ל-OCR</span>
                        </li>
                    </ul>
                </div>
            </courier-filter-button>
        </div>
    </div>
