<style>
</style>
<div>

    <div class="TextTrimming RightCenter"
         *ngIf="fieldName == 'IsClosed'">
        <div style="text-align:right">
            <img *ngIf="_CustomsCollateralRecord.IsClosed" title="Is Closed" src="./Images/CheckBoxIcon.png" />
        </div>

    </div>

    <div class="TextTrimming RightCenter"
         *ngIf="fieldName == 'RequestValidityDate'">
        <span>{{_CustomsCollateralRecord.RequestValidityDate  | DateTimeToDatePipe  }}</span>

    </div>


    <div class="TextTrimming RightCenter"
         *ngIf="fieldName == 'IsChecked'">
        <div class="TextTrimming" style="cursor:pointer">
            <div style="width: 16px; height:16px; margin-top:10px">
                <input  [disabled] ="_CustomsCollateralRecord.IsClosed ||( _CustomsCollateralRecord.CollateralRequestStatusCode != '1' && _CustomsCollateralRecord.CollateralRequestStatusCode != '' && _CustomsCollateralRecord.CollateralRequestStatusCode != null)  " class="CenterCenter" style="box-shadow:none ;width: 16px; height:16px; text-align:center"
                       type="checkbox" (click)="OnCheckedWithSystemEvent($event , _CustomsCollateralRecord.Id)" />
            </div>
        </div>

    </div>
</div>
