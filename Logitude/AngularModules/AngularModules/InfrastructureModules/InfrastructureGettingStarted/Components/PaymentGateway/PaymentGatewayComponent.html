
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:10px;">
        <td>
            <div></div>
        </td>
    </tr>
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="PaymentGatewayPartner"
                      [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <LogLov [ObjectFieldName]="'PaymentGatewayPartnerCode'"
                     [SelectedValue]="PaymentGatewayPartnerCode"
                    [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'PaymentGatewayPartner'"
                    [HideColumns]="true">
            </LogLov>
        </td>
        <td><div></div></td>
    </tr>
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="'PaymentGatewayConnectionString'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <LogTextBox [ObjectFieldName]="'PaymentGatewayConnectionString'" [InputType]="'string'" [DataContext]="DataContext"
                        [ObjectTableName]="ObjectTableName" [HideColumns]="true"></LogTextBox>
        </td>
        <td><div></div></td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
