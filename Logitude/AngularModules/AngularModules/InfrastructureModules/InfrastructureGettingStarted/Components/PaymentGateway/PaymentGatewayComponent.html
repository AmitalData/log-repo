
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="3">
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

   <tr style="height: 30px;">
        <td colspan="3" >
            <div></div>
        </td>
    </tr>
    <tr class="FormFieldRow" style="height: 50px;">
        <td style="width:15px;">
            <LogLabel [ObjectFieldName]="'PaymentGatewayPartnerCode'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext" [Text]="'Partner'"></LogLabel>

        </td>

        <td style="width:100px;">
            <LogLov [ObjectFieldName]="'PaymentGatewayPartnerCode'"
                    [SelectedValue]="PaymentGatewayPartnerCode"
                    [ObjectTableName]="ObjectTableName"
                    [DataContext]="DataContext"
                    [LookUpTableName]="'PaymentGatewayPartner'"
                    [HideColumns]="true">
            </LogLov>
        </td>
        <td style="width:120px;"><div></div></td>

    </tr>
    <tr class="FormFieldRow" style="height: 20px;">
        <td>
            <LogLabel [ObjectFieldName]="'PaymentGatewayConnectionString'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>

        </td>

        <td>
            <LogTextBox [ObjectFieldName]="'PaymentGatewayConnectionString'" [Text]="PaymentGatewayConnectionString" [DataContext]="DataContext"
                        [ObjectTableName]="ObjectTableName" [HideColumns]="true" [HideLastColumn]="true"></LogTextBox>
        </td>
        <td style="width:100px;"><div></div></td>

    </tr>
    <tr>
        <td colspan="3">
            <div></div>
        </td>
    </tr>

    <tr style="height: 20px;">
        <td><div></div></td>
        <td><div></div></td>
        <td style="vertical-align: bottom;">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
