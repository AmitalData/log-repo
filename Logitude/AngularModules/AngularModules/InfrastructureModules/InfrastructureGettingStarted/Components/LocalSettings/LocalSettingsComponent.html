
<style>
    .select {
        display: block;
        outline: none;
        width: 100%;
        height: 22px;
        border: 1px solid #6A8299;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        position: relative;
        cursor: pointer;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
    }

    .SelectDisabled {
        display: block;
        height: 22px;
        max-height: 22px;
        line-height: 22px;
        outline: none;
        width: 100%;
        background: white;
        /*border: 1px solid #AAAAAA;*/
        font-size: 11px;
        color: #45494A;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        opacity: 0.5;
        pointer-events: none;
    }
</style>


<table *ngIf="IsVisible">

    <tr *ngIf="DemoMessageVisibility" style="height:1px;">
        <td>
            <div style="margin:1px">
                <label style="margin: 2px 0px 0px 5px">This is a demo tenant, therefore you can't edit the system settings </label>
            </div>
        </td>
    </tr>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">

                <!-- Language -->
                <tr class="FormFieldRow">
                    <td style="width: 130px;">
                        <label> Language: </label>
                    </td>

                    <td style="width:150px">
                        <ComboBox [IsDisabled]="IsHitTestVisible" style="width:150px;" [ItemsSource]="LanguagesList" (SelectedItemChanged)="LanguageSelectedChange($event)" [SelectedItem]="LanguageSelectedItem" [Binding]="'Description'"></ComboBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Time Zone -->
                <tr class="FormFieldRow">
                    <td>
                        <label> Time Zone: </label>
                    </td>

                    <td>
                        <ComboBox [IsDisabled]="IsHitTestVisible" style="width:150px;" [ItemsSource]="TimeZonesList" (SelectedItemChanged)="TimeZoneSelectedItem = $event" [SelectedItem]="TimeZoneSelectedItem" [Binding]="'TimeZoneName'"></ComboBox>
                    </td>

                    <td style="padding-left: 5px;">
                        <label style="color:gray;font-family:Arial;"> All the dates in the system are related to the time zone.</label>
                    </td>
                </tr>

                <!-- Date TimeFormat -->
                <tr class="FormFieldRow">
                    <td>
                        <label>Date Time Format: </label>
                    </td>

                    <td>
                        <ComboBox [IsDisabled]="IsHitTestVisible" style="width:200px;" [ItemsSource]="DateTimeFormatsList" [SelectedItem]="DateTimeFormatSelectedItem" (SelectedItemChanged)="DateTimeFormatSelectedChange($event)" [Binding]="'DisplayName'"></ComboBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow"  *ngIf="false">
                    <td>
                        Number Format :
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:187px">
                                    <LogLov [ObjectFieldName]="'NumberFormatCode'"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'NumberFormat'"
                                            [HideColumns]="false">
                                    </LogLov>
                                </td>
                                <td>

                                </td>
                            </tr>
                        </table>
                      
                    </td>
                </tr>

                <!-- DayLight Settings -->
                <tr class="FormFieldRow">
                    <td colspan="2">
                        <table>
                            <tr>
                                <td width="16px">
                                    <LogCheckBox [ObjectFieldName]="'ShowDayLightSettings'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                                </td>

                                <td style="padding-left: 5px;">
                                    <label style="font-size:12px;color:#1B90CB;"> Daylight Settings </label>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr *ngIf="ShowDayLightSettings">
                    <td colspan="2">
                        <table>
                            <tr>
                                <td width="20px"></td>

                                <td>
                                    <table>
                                        <!-- DayLight Start Date -->
                                        <tr class="FormFieldRow">
                                            <td style="width: 130px;">
                                                <label> DayLight Start Date: </label>
                                            </td>

                                            <td>
                                                <LogDatePicker [ObjectFieldName]="'DayLightStartDate'" [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>
                                        </tr>

                                        <!-- DayLight End Date -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <label> DayLight End Date: </label>
                                            </td>

                                            <td>
                                                <LogDatePicker [ObjectFieldName]="'DayLightEndDate'" [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                            </td>
                                        </tr>

                                        <!-- DayLight Offset  -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <label> DayLight Offset: </label>
                                            </td>

                                            <td>
                                                <LogTextBox [ObjectFieldName]="'DayLightOffset'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>
                                        </tr>




                                        <tr>
                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                    </table>
                                </td>

                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>

                <tr>
                    <td colspan="3">
                        <div> </div>
                    </td>
                </tr>

            </table>
        </td>

    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
