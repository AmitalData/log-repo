<style type="text/css">
    .Box {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .BoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }
</style>

<table *ngIf="IsVisible">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="3">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:10px;">
        <td colspan="3"> <div></div></td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table class="FixedTable">
                    <tr style="height:135px;">
                        <td>
                            <table>
                                <tr>
                                    <td style="height: 100%">
                                        <div class="Box">
                                            <table>
                                                <tr class="BoxHeader">
                                                    <td>Address1</td>
                                                </tr>
                                                <tr>
                                                    <td style="padding-left: 5px; padding-right: 5px;padding-top:5px;padding-bottom:5px;">
                                                        <table class="FixedTable">
                                                            <!-- Address1 -->
                                                            <tr class="FormFieldRow">
                                                                <td>
                                                                    <div style="height: 100%; width: 100%;margin:5px;">
                                                                        <LogTextBox [IsMultiline]="true" [ObjectFieldName]="'InvoiceAddress1'" [Text]="InvoiceAddress1" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                        <td style="width:15px"> </td>
                        <td>
                            <table>
                                <tr>
                                    <td style="height: 100%">
                                        <div class="Box">
                                            <table>
                                                <tr class="BoxHeader">
                                                    <td>Address2</td>
                                                </tr>
                                                <tr>
                                                    <td style="padding-left: 5px; padding-right: 5px;padding-top:5px;padding-bottom:5px;">
                                                        <table class="FixedTable">
                                                            <!-- Address2 -->
                                                            <tr class="FormFieldRow">
                                                                <td>
                                                                    <div style="height: 100%; width: 100%;margin:5px;">
                                                                        <LogTextBox [IsMultiline]="true" [ObjectFieldName]="'InvoiceAddress2'" [Text]="InvoiceAddress2" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height:15px;"><td colspan="3"><div></div></td></tr>

                    <tr style="height:135px;">
                        <td>
                            <table>
                                <tr>
                                    <td style="height: 100%">
                                        <div class="Box">
                                            <table>
                                                <tr class="BoxHeader">
                                                    <td>Accounting Settings</td>
                                                </tr>
                                                <tr>
                                                    <td style="padding-left: 5px; padding-right: 5px;">
                                                        <table class="FixedTable">
                                                            <!-- Accounting Settings -->
                                                            <tr class="FormFieldRow">
                                                                <td>
                                                                    <table>
                                                                        <tr class="FormFieldRow">
                                                                            <td style="width: 270px;">
                                                                                <LogLabel [DataContext]="DataContext" [Text]="'Void invoice'"></LogLabel>
                                                                            </td>

                                                                            <td>
                                                                                <LogCheckBox [ObjectFieldName]="'Voidinvoice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                            </td>
                                                                        </tr>

                                                                        <tr class="FormFieldRow">
                                                                            <td>
                                                                                <LogLabel [DataContext]="DataContext" [Text]="'Allow manual numbers'"></LogLabel>
                                                                            </td>

                                                                            <td>
                                                                                <LogCheckBox [ObjectFieldName]="'AllowManualInvoiceNumber'" [ObjectTableName]="'AccountingSetting'" [DataContext]="DataContext"></LogCheckBox>
                                                                            </td>
                                                                        </tr>

                                                                        <tr class="FormFieldRow">
                                                                            <td>
                                                                                <LogLabel [DataContext]="DataContext" [Text]="'Bill To VAT is required'"></LogLabel>
                                                                            </td>

                                                                            <td>
                                                                                <LogCheckBox [ObjectFieldName]="'IsVatNumberMandatoryInAR'" [ObjectTableName]="'AccountingSetting'" [DataContext]="DataContext"></LogCheckBox>
                                                                            </td>
                                                                        </tr>

                                                                        <tr class="FormFieldRow">
                                                                            <td>
                                                                                <LogLabel [DataContext]="DataContext" [Text]="'Chronological'"></LogLabel>
                                                                            </td>

                                                                            <td>
                                                                                <LogCheckBox [ObjectFieldName]="'IsARInvoiceChronologicalDates'" [ObjectTableName]="'AccountingSetting'" [DataContext]="DataContext" [IsDisabled] ="AllowManualInvoiceNumber"></LogCheckBox>
                                                                            </td>
                                                                        </tr>

                                                                        <tr><td colspan="2"></td></tr>
                                                                    </table>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>

                                </tr>
                            </table>
                        </td>
                        <td style="width:15px"> </td>
                        <td>
                            <table>
                                <tr>
                                    <td style="height: 100%">
                                        <div class="Box">
                                            <table>
                                                <tr class="BoxHeader">
                                                    <td>Bank Details</td>
                                                </tr>

                                                <tr>
                                                    <td style="padding-left: 5px; padding-right: 5px;padding-top:5px;padding-bottom:5px;">
                                                        <table class="FixedTable">
                                                            <!-- Bank Details -->
                                                            <tr class="FormFieldRow">
                                                                <td>
                                                                    <div style="height: 100%; width: 100%;margin:5px;">
                                                                        <LogTextBox [IsMultiline]="true" [ObjectFieldName]="'BankDetails'" [Text]="BankDetails" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr><td colspan="3"><div></div></td></tr>
                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
