
<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        overflow: hidden;
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .acc-table td {
        height: 25px;
    }
</style>

<table>
    <tr>
        <td>
            <div class="MediaFill">
                <div class="SystemDefaultsBox">
                    <table>
                        <tr class="SystemDefaultsBoxHeader">
                            <td>Settings</td>
                        </tr>

                        <tr>
                            <td style="padding-left: 5px; padding-right: 5px;">
                                <table>

                                    <!-- EnableMultiPercentageVATTypes -->
                                    <tr class="FormFieldRow">
                                        <td style="width: 220px;">
                                            <LogLabel [ObjectFieldName]="'EnableMultiPercentageVATTypes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td style="width: 250px;">
                                            <LogCheckBox [ObjectFieldName]="'EnableMultiPercentageVATTypes'" [Checked]="DataContext.EnableMultiPercentageVATTypes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- NotifyPastDateOnInvoiceEdit -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'NotifyPastDateOnInvoiceEdit'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogCheckBox [ObjectFieldName]="'NotifyPastDateOnInvoiceEdit'" [Checked]="DataContext.NotifyPastDateOnInvoiceEdit" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- RegistryDateType -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'RegistryDateTypeCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogLov [ObjectFieldName]="'RegistryDateTypeCode'"
                                                    [ObjectTableName]="ObjectTableName"
                                                    [DataContext]="DataContext"
                                                    [LookUpTableName]="'RegistryDateType'">
                                            </LogLov>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- EnableMultiCurrencyARPayments -->
                                    <tr class="FormFieldRow" *ngIf="IsEnableMultiCurrencyARPaymentsVisible">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'EnableMultiCurrencyARPayments'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogCheckBox [ObjectFieldName]="'EnableMultiCurrencyARPayments'" [Checked]="DataContext.EnableMultiCurrencyARPayments" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- EnableNegativeOffsetARPayments -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'EnableNegativeOffsetARPayments'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogCheckBox [ObjectFieldName]="'EnableNegativeOffsetARPayments'" [Checked]="DataContext.EnableNegativeOffsetARPayments" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- EnableInvoiceStocksManagement -->
                                    <tr class="FormFieldRow" *ngIf="IsEnableInvoiceStocksManagementVisible">
                                        <td colspan="3">
                                            <table>
                                                <tr>
                                                    <td style="width: 218px;">
                                                        <LogLabel [ObjectFieldName]="'EnableInvoiceStocksManagement'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 20px;">
                                                        <LogCheckBox [HideColumns]="true" [ObjectFieldName]="'EnableInvoiceStocksManagement'" [Checked]="DataContext.EnableInvoiceStocksManagement" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                    </td>

                                                    <td>
                                                        <div>
                                                            <Hyperlink (click)="DataContext.ManageStocksClicked()" [IsEnabled]="DataContext.EnableInvoiceStocksManagement" [Text]="'Manage Stocks'"></Hyperlink>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <!-- AllowManualARPaymentNumber -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'AllowManualARPaymentNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogCheckBox [ObjectFieldName]="'AllowManualARPaymentNumber'" [Checked]="DataContext.AllowManualARPaymentNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>

                                </table>
                            </td>

                        </tr>
                    </table>
                </div>


            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
