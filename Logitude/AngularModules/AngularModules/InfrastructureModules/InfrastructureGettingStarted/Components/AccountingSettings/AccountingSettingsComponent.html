
<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        overflow: hidden;
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .acc-table td {
        height: 25px;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;" *ngIf="IsDemoTenant">
        <td>
            <div class="OrangeInfo" style="margin: 5px;">
                This is a demo tenant, therefore you can't edit the system settings
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <table *ngIf="IsResourcesReady">

                        <tr style="height:1px;">

                                                    <tr>

                                                                <!-- AllowVoidARI -->

                                                                        <LogCheckBox [ObjectFieldName]="'AllowVoidARI'" [Checked]="AllowVoidARI" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>

                                                                </tr>

                                                                    </td>
                                                                </tr>

                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'AllowMinusInvoicelines'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>

                                                                    <td>
                                                                        <LogCheckBox [ObjectFieldName]="'AllowMinusInvoicelines'" [Checked]="AllowMinusInvoicelines" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                    </td>

                                                                    <td>

                                                                        <LogCheckBox [ObjectFieldName]="'AllowPositiveAmountsInTheCreditNote'" [Checked]="AllowPositiveAmountsInTheCreditNote" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>

                                                                <!-- IsSingleTaxPerInvoice -->
                                                                <tr>
                                                                    <td>
                                                                        <LogLabel [ObjectFieldName]="'IsSingleTaxPerInvoice'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td>
                                                                        <LogCheckBox *ngIf="ShowRealSingleTaxCheckBox" [ObjectFieldName]="'IsSingleTaxPerInvoice'" [Checked]="IsSingleTaxPerInvoice" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>

                                                                        <table *ngIf="ShowDummySingleTaxCheckBox">
                                                                            <tr>
                                                                                <td>
                                                                                    <CheckBox [IsChecked]="true" [IsEnabled]="false"></CheckBox>
                                                                                </td>

                                                                                <td style="width:18px;">

                                                                                </td>

                                                                        </table>

                                                                <!-- Advanced Settings -->
                                                                <tr>
                                                                    <td colspan="2">
                                                                        <div style="float:right;">
                                                                            <Hyperlink [DataCy]="'AdvancedARHyperlinkId'" [IsEnabled]="!IsDemoTenant" (click)="ViewAdvancedARSettings()" [Text]="'Advanced Settings'"></Hyperlink>

                                                    </tr>

                                                </table>
                                            </div>

                                                                    <td colspan="2">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>

                                                            </table>
                                                        </td>

                                                    </tr>

                                                </table>
                                            </div>
                                        </td>

                                        <td style="width: 4px;">
                                            <div></div>
                                        </td>

                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <!-- Accounting Payables -->
                        <tr style="height:1px;">
                            <td style="padding: 5px;">
                                <table>
                                    <tr>
                                        <td style="height: 100%">

                                                                                <td>

                                                                                <td>
