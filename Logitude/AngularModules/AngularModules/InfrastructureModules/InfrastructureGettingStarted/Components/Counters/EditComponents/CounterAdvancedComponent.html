
<style type="text/css">
    .CounterItemBackground {
        background: -moz-linear-gradient(50% 106.14% 90deg,rgba(133, 203, 237, 1) 0%,rgba(150, 211, 240, 1) 22.59%,rgba(196, 231, 248, 1) 67.37%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 100%);
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <table *ngIf="IsResourcesReady">

                    <!-- Header -->
                    <tr style="height: 1px;">
                        <td style="border: 1px solid #D1D1D1; padding: 5px;">
                            <table>
                                <tr>
                                    <td style="width: 1px;">
                                        <table>
                                            <tr style="height: 20px;">
                                                <td>
                                                    <RadioButton [IsEnabled]="!IsCounterUsed" [Name]="'CounterDirectionRadio'" [IsChecked]="SameForAllDirectios == true" (Checked)="SameForAllDirectios = true" [Text]="'Same for (Import,Export,Domestic,Drop,Customs)'"></RadioButton>
                                                </td>
                                            </tr>

                                            <tr style="height: 20px;">
                                                <td>
                                                    <RadioButton [IsEnabled]="!IsCounterUsed || !HasAllTransportsFeature" [Name]="'CounterDirectionRadio'" [IsChecked]="SameForAllDirectios == false" (Checked)="SameForAllDirectios = false" [Text]="'Different for (Import,Export,Domestic,Drop,Customs)'"></RadioButton>
                                                </td>
                                            </tr>

                                            <tr style="height: 20px;" *ngIf="SameForAllDirectios == false || SameForAllTransports == false">
                                                <td>
                                                    <CheckBox [IsEnabled]="!IsCounterUsed" [IsChecked]="UniquePerPrefix" (Checked)="UniquePerPrefix = $event" [Text]="'Unique Per Prefix'"></CheckBox>
                                                </td>
                                            </tr>
                                            <tr style="height: 20px;" *ngIf="HasBranchCounterCodeFeature && HasSeparatePerBranchCounterCodeFeature">
                                                <td>
                                                    <CheckBox [IsEnabled]="!IsCounterUsed" [IsChecked]="SeperatePerBranch" (Checked)="SeperatePerBranch = $event" [Text]="'Seperate Per Branch'"></CheckBox>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td style="width: 15px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 1px;">
                                        <table>
                                            <tr style="height: 20px;">
                                                <td>
                                                    <RadioButton [IsEnabled]="!IsCounterUsed" [Name]="'CounterTransportRadio'" [IsChecked]="SameForAllTransports == true" (Checked)="SameForAllTransports = true" [Text]="'Same for all transport modes'"></RadioButton>
                                                </td>
                                            </tr>

                                            <tr style="height: 20px;">
                                                <td>
                                                    <RadioButton [IsEnabled]="!IsCounterUsed || !HasAllTransportsFeature" [Name]="'CounterTransportRadio'" [IsChecked]="SameForAllTransports == false" (Checked)="SameForAllTransports = false" [Text]="'Different for all transport modes'"></RadioButton>
                                                </td>
                                            </tr>

                                            <tr style="height: 20px;" *ngIf="SameForAllDirectios == false || SameForAllTransports == false">
                                                <td>
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height: 10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div class="MediaFill" style="border: 1px solid #D1D1D1; padding: 5px;">

                                <!-- SameForAll -->
                                <table *ngIf="SameForAllDirectios == true && SameForAllTransports == true">

                                    <!-- Prefix -->
                                    <tr class="FormFieldRow">
                                        <td style="width: 100px;">
                                            <LogLabel [ObjectFieldName]="'Prefix'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td style="width: 150px;">
                                            <LogTextBox [ObjectFieldName]="'Prefix'" [Text]="Prefix" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- CounterSize -->
                                    <tr class="FormFieldRow">
                                        <td style="width: 100px;">
                                            <LogLabel [ObjectFieldName]="'CounterSize'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogTextBox [ObjectFieldName]="'CounterSize'" [Text]="CounterSize" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- StartNumber -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'StartNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogTextBox [ObjectFieldName]="'StartNumber'" [Text]="StartNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideLastColumn]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- SampleValue -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [Text]="'Format'"  [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td colspan="2">
                                            <div class="Value" style="text-align: left;">{{SampleValue}}</div>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr style="height: 5px;">
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr style="height: 1px;">

                                        <td colspan="3">

                                            <!--<div class="NoDataTextStyle" style="text-align: left;">The created numbers have the following format:</div>
        <div class="Value" style="padding-left: 15px;">[Prefix]Number</div>
                                            <br />-->
                                            <div class="NoDataTextStyle" style="text-align:left;margin-left:10px;">You can add [MM],[YY] or [YYYY] to the prefix. it will be translated due to the current date</div>
                                            <div *ngIf="CounterPM.Code == 'MAST'  || CounterPM.Code == 'SHIP'" class="NoDataTextStyle" style="text-align:left;margin-left:10px;">You can also add [B] to bring the branch code</div>
                                        </td>

                                        <!--<td></td>
                                        <td>
                                            <div></div>
                                        </td>-->

                                    </tr>

                                    <tr>
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>

                                <table *ngIf="SameForAllDirectios == false || SameForAllTransports == false">
                                    <tr>
                                        <td>
                                            <div class="MediaFill">
                                                <table>

                                                    <!-- StartNumber -->
                                                    <tr class="FormFieldRow" *ngIf="!UniquePerPrefix">
                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 100px;">
                                                                        <LogLabel [ObjectFieldName]="'StartNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                    </td>

                                                                    <td style="width: 150px;">
                                                                        <LogTextBox [ObjectFieldName]="'StartNumber'" [Text]="StartNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td *ngFor="let itemColumn of ItemsSource" style="width: 285px;">
                                                                        <div class="MediaFill">
                                                                            <div style="position: absolute; left: 0px; top: 0px; right: 10px; bottom: 0px;">
                                                                                <table>
                                                                                    <tr style="height: 30px; border: 1px solid #D1D1D1; border-bottom: 0px;" class="CounterItemBackground" *ngIf="!SameForAllDirectios">
                                                                                        <td class="Value" style="padding-left: 10px;">{{itemColumn.Name}}</td>
                                                                                    </tr>

                                                                                    <tr *ngFor="let item of itemColumn.ItemsSource" style="height: 120px;">
                                                                                        <td>
                                                                                            <table>
                                                                                                <tr style="border: 1px solid #D1D1D1;">
                                                                                                    <td>
                                                                                                        <div class="MediaFill">
                                                                                                            <div class="MarginAbsolute5" style="top: 0px; bottom: 0px;">
                                                                                                                <table>

                                                                                                                    <!-- Prefix -->
                                                                                                                    <tr>
                                                                                                                        <td style="width: 100px;">
                                                                                                                            <LogLabel [ObjectFieldName]="'Prefix'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                                                        </td>

                                                                                                                        <td>
                                                                                                                            <LogTextBox [ObjectFieldName]="'Prefix'" [Text]="item.Prefix" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                                                        </td>
                                                                                                                    </tr>
                                                                                                                    <!-- CounterSize -->
                                                                                                                    <tr>
                                                                                                                        <td style="width: 100px;">
                                                                                                                            <LogLabel [ObjectFieldName]="'CounterSize'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                                                        </td>

                                                                                                                        <td>
                                                                                                                            <LogTextBox [ObjectFieldName]="'CounterSize'" [Text]="item.CounterSize" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                                                        </td>
                                                                                                                    </tr>
                                                                                                                    <!-- StartNumber -->
                                                                                                                    <tr>
                                                                                                                        <td>
                                                                                                                            <LogLabel [ObjectFieldName]="'StartNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                                                        </td>

                                                                                                                        <td>
                                                                                                                            <LogTextBox [ObjectFieldName]="'StartNumber'" [Text]="item.StartNumber" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                                                        </td>
                                                                                                                    </tr>

                                                                                                                    <!-- Valid for -->
                                                                                                                    <tr>
                                                                                                                        <td class="Label" style="padding-left: 10px;">
                                                                                                                            Valid for:
                                                                                                                        </td>

                                                                                                                        <td>
                                                                                                                            <table>
                                                                                                                                <tr>
                                                                                                                                    <td>
                                                                                                                                        <CheckBox [IsEnabled]="false" [IsChecked]="item.Parameter == 'A' || SameForAllTransports" [Text]="'Air'"></CheckBox>
                                                                                                                                    </td>

                                                                                                                                    <td>
                                                                                                                                        <CheckBox [IsEnabled]="false" [IsChecked]="item.Parameter == 'O' || SameForAllTransports" [Text]="'Ocean'"></CheckBox>
                                                                                                                                    </td>

                                                                                                                                    <td>
                                                                                                                                        <CheckBox [IsEnabled]="false" [IsChecked]="item.Parameter == 'I' || SameForAllTransports" [Text]="'Inland'"></CheckBox>
                                                                                                                                    </td>
                                                                                                                                </tr>
                                                                                                                            </table>
                                                                                                                        </td>
                                                                                                                    </tr>
                                                                                                                </table>
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                </tr>

                                                                                                <tr style="height: 10px;">
                                                                                                    <td></td>
                                                                                                </tr>
                                                                                            </table>
                                                                                        </td>
                                                                                    </tr>

                                                                                    <tr>
                                                                                        <td>
                                                                                            <div></div>
                                                                                        </td>
                                                                                    </tr>
                                                                                </table>
                                                                            </div>
                                                                        </div>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
