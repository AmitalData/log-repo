
<style type="text/css">
    .CounterItemBackground {               
        background: -moz-linear-gradient(50% 106.14% 90deg,rgba(133, 203, 237, 1) 0%,rgba(150, 211, 240, 1) 22.59%,rgba(196, 231, 248, 1) 67.37%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 100%);
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <table *ngIf="IsResourcesReady">

                    <!-- Header -->
                    <tr style="height: 1px;">
                        <td style="border: 1px solid #D1D1D1; padding: 5px;">
                            <table>
                                <tr style="height: 20px;">
                                    <td>
                                        <RadioButton [IsEnabled]="!IsCounterUsed" [Name]="'SameDiffCustomRadio'" [IsChecked]="SameForAllTypes == true && !IsCustomizedCounter" (Checked)="SameForAllTypesChecked()" [Text]="SameRadioButtonLabel"></RadioButton>
                                    </td>
                                </tr>

                                <tr style="height: 20px;">
                                    <td>
                                        <RadioButton [IsEnabled]="!IsCounterUsed" [Name]="'SameDiffCustomRadio'" [IsChecked]="SameForAllTypes == false && !IsCustomizedCounter" (Checked)="DiffForEachTypesChecked()" [Text]="DiffRadioButtonLabel"></RadioButton>
                                    </td>
                                </tr>

                                <tr style="height: 20px;" *ngIf="HasCustomizedCounterFeature">
                                    <td>
                                        <RadioButton [IsEnabled]="!IsCounterUsed" [Name]="'SameDiffCustomRadio'" [IsChecked]="SameForAllTypes == false && IsCustomizedCounter" (Checked)="IsCustomizedCounterChecked()" [Text]="CustomizedRadioButtonLabel"></RadioButton>
                                    </td>
                                </tr>

                                <tr style="height: 20px;" *ngIf="SameForAllTypes == false">
                                    <td>
                                        <CheckBox [IsEnabled]="!IsCounterUsed" [IsChecked]="UniquePerPrefix" (Checked)="UniquePerPrefix = $event" [Text]="'Unique Per Prefix'"></CheckBox>
                                    </td>
                                </tr>
                                <tr style="height: 20px;" *ngIf="SameForAllTypes == false && !IsCustomizedCounter">
                                    <td>
                                        <CheckBox [IsEnabled]="!IsCounterUsed" [IsChecked]="ActivateConsolidationCreditNoteCounter" (Checked)="ActivateConsolidationCreditNoteCounter = $event" [Text]="'Activate Consolidation Credit Note Counter'"></CheckBox>
                                    </td>
                                </tr>

                                <tr style="height: 20px;" *ngIf="HasBranchCounterCodeFeature && HasSeparatePerBranchCounterCodeFeature && !IsCustomizedCounter">
                                    <td>
                                        <CheckBox [IsEnabled]="!IsCounterUsed" [IsChecked]="SeperatePerBranch" (Checked)="SeperatePerBranch = $event" [Text]="'Seperate Per Branch'"></CheckBox>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height: 10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div class="MediaFill" style="border: 1px solid #D1D1D1; padding: 5px;">

                                <!-- SameForAll -->
                                <table *ngIf="SameForAllTypes == true && !IsCustomizedCounter">

                                    <!-- Prefix -->
                                    <tr class="FormFieldRow">
                                        <td style="width: 100px;">
                                            <LogLabel [ObjectFieldName]="'Prefix'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td style="width: 150px;">
                                            <LogTextBox [ObjectFieldName]="'Prefix'" [Text]="Prefix" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- CounterSize -->
                                    <tr class="FormFieldRow">
                                        <td style="width: 100px;">
                                            <LogLabel [ObjectFieldName]="'CounterSize'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td style="width: 150px;">
                                            <LogTextBox [ObjectFieldName]="'CounterSize'" [Text]="CounterSize" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- StartNumber -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [ObjectFieldName]="'StartNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td>
                                            <LogTextBox [ObjectFieldName]="'StartNumber'" [Text]="StartNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- Suffix -->
                                    <tr class="FormFieldRow">
                                        <td style="width: 100px;">
                                            <LogLabel [ObjectFieldName]="'Suffix'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td style="width: 150px;">
                                            <LogTextBox [ObjectFieldName]="'Suffix'" [Text]="Suffix" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!-- SampleValue -->
                                    <tr class="FormFieldRow">
                                        <td>
                                            <LogLabel [Text]="'Format'" [DataContext]="DataContext"></LogLabel>
                                        </td>

                                        <td colspan="2">
                                            <div class="Value" style="text-align: left;">{{SampleValue}}</div>
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr style="height: 10px;">
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>

                                    <!--<tr style="height: 1px;">
            <td colspan="3">
                <div class="NoDataTextStyle" style="text-align: left;">The created numbers have the following format:</div>
                <div class="Value" style="padding-left: 15px;">[Prefix]Number[Suffix]</div>
            </td>
        </tr>-->

                                    <tr>
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>

                                <!-- Different | List -->
                                <table *ngIf="SameForAllTypes == false && !IsCustomizedCounter">

                                    <!-- StartNumber -->
                                    <tr class="FormFieldRow" *ngIf="!UniquePerPrefix">
                                        <td>
                                            <table>
                                                <tr>
                                                    <td style="width: 100px;">
                                                        <LogLabel [ObjectFieldName]="'StartNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 150px;">
                                                        <LogTextBox [ObjectFieldName]="'StartNumber'" [Text]="StartNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                    </td>

                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>
                                            <div class="MediaFill">
                                                <div class="MarginAbsolute10" style="top: 5px;">
                                                    <ScrollViewer>
                                                        <ul>
                                                            <li style="height: 100px; margin-bottom: 5px;" *ngFor="let item of ItemsSource">
                                                                <table [style.opacity]="item.EntityPM.InActive ? '0.5':'1'" [style.pointer-events]="item.EntityPM.InActive ? 'none':'auto'">
                                                                    <tr>
                                                                        <td style="width: 130px; border: 1px solid #D1D1D1; text-align: center; padding: 5px;" class="CounterItemBackground">
                                                                            {{item.Name}}
                                                                        </td>

                                                                        <td style="width: 5px;">
                                                                            <div></div>
                                                                        </td>

                                                                        <td style="width: 260px; border: 1px solid #D1D1D1; padding: 3px; background: rgba(199,228,255,0.5);">
                                                                            <table>

                                                                                <!-- Prefix -->
                                                                                <tr>
                                                                                    <td style="width: 100px;">
                                                                                        <LogLabel [ObjectFieldName]="'Prefix'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                    </td>

                                                                                    <td style="width: 150px;">
                                                                                        <LogTextBox [ObjectFieldName]="'Prefix'" [Text]="item.Prefix" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                    </td>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>

                                                                                <!-- CounterSize -->
                                                                                <tr>
                                                                                    <td style="width: 100px;">
                                                                                        <LogLabel [ObjectFieldName]="'CounterSize'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                    </td>

                                                                                    <td style="width: 150px;">
                                                                                        <LogTextBox [ObjectFieldName]="'CounterSize'" [Text]="item.CounterSize" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                    </td>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>

                                                                                <!-- StartNumber -->
                                                                                <tr>
                                                                                    <td>
                                                                                        <LogLabel [ObjectFieldName]="'StartNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                    </td>

                                                                                    <td>
                                                                                        <LogTextBox [ObjectFieldName]="'StartNumber'" [Text]="item.StartNumber" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                    </td>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>

                                                                                <!-- Suffix -->
                                                                                <tr>
                                                                                    <td style="width: 100px;">
                                                                                        <LogLabel [ObjectFieldName]="'Suffix'" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext"></LogLabel>
                                                                                    </td>

                                                                                    <td style="width: 150px;">
                                                                                        <LogTextBox [ObjectFieldName]="'Suffix'" [Text]="item.Suffix" [ObjectTableName]="ObjectTableName" [DataContext]="item.DataContext" [HideColumns]="true"></LogTextBox>
                                                                                    </td>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>
                                                                            </table>
                                                                        </td>

                                                                        <td>
                                                                            <div></div>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </li>
                                                        </ul>
                                                    </ScrollViewer>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </table>


                                <div class="MediaFill" *ngIf="IsCustomizedCounter">
                                    <div class="LocationDirective" #CustomizedCounterComponent></div>
                                </div>

                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
