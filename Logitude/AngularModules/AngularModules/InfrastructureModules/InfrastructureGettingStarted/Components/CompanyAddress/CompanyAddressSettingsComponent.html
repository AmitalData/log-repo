
<table *ngIf="IsVisibile">
    <tr *ngIf="DemoMessageVisibility" style="height:1px;">
        <td>
            <div style="margin:1px">
                <label style="margin: 2px 0px 0px 5px">This is a demo tenant, therefore you can't edit the system settings </label>
            </div>
        </td>
    </tr>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="TabControl">
                    <div class="TabControlHead">
                        <ul>
                            <li [class.Selected]="SelectedTabCode === '0'" (click)="SelectedTabCode = '0'">
                                <div class="InnerChild">Address</div>
                            </li>

                            <li [class.Selected]="SelectedTabCode === '1'" (click)="SelectedTabCode = '1'" *ngIf="IsLocalAddressTabVisible">
                                <div class="InnerChild">Local Address</div>
                            </li>

                            <li [class.Selected]="SelectedTabCode === '2'" (click)="SelectedTabCode = '2'">
                                <div class="InnerChild">Invoice Signature</div>
                            </li>
                        </ul>
                    </div>

                    <div class="TabControlBody">
                        <!--Address-->
                        <table [hidden]="SelectedTabCode != '0'" style="margin-left:10px;">
                            <tr>
                                <td>
                                    <table class="FixedTable">
                                        <tr>
                                            <td style="width: 460px">
                                                <table>

                                                    <tr class="FormFieldRow">
                                                        <td colspan="2">
                                                            <div>
                                                                <!--<label style="font-size:11px; font-family:Arial; color:gray;"> {{'Tenant.AddressIdHelpText' | TextCodeTranslationPipe}} </label>-->
                                                                <label style="font-size:11px; font-family:Arial; color:gray;">Your company’s address details will appear on airwaybills and other documents and outgoing messages.</label>
                                                            </div>
                                                        </td>
                                                    </tr>

                                                    <!-- Name -->
                                                    <tr class="FormFieldRow">
                                                        <td style="width: 110px;">
                                                            <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td style="width: 350px;">
                                                            <LogTextBox [ObjectFieldName]="'Company'" [Text]="Company" [InputType]="'ntext'" [ObjectTableName]="TenantObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                        </td>
                                                    </tr>

                                                    <!-- Address1 -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'Address1'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <LogTextBox [ObjectFieldName]="'Address1'" [Text]="Address1" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                        </td>
                                                    </tr>

                                                    <!-- Address2 -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'Address2'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <LogTextBox [ObjectFieldName]="'Address2'" [Text]="Address2" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                        </td>
                                                    </tr>

                                                    <!-- City -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'City'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 214px">
                                                                        <LogTextBox [HideColumns]="true" [Text]="City" [ObjectFieldName]="'City'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>

                                                                    <td style="width: 5px;">
                                                                        <div></div>
                                                                    </td>
                                                                    <td style="vertical-align:middle;">
                                                                        <span style="float:left;" class="hyperlink" (click)="SelectCityCommand()" [class.HyperlinkDisabled]="DemoMessageVisibility">Select</span>
                                                                    </td>
                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <!-- Country -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'CountryId'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 250px">
                                                                        <LogLov [ObjectFieldName]="'CountryId'"
                                                                                [ObjectTableName]="AddressObjectTableName"
                                                                                [SelectedValue]="CountryId"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'Country'"
                                                                                (SelectedItemChanged)="Country = $event">
                                                                        </LogLov>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <!-- State -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'StateId'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 250px">
                                                                        <LogLov [ObjectFieldName]="'StateId'"
                                                                                [SelectedValue]="StateId"
                                                                                [ObjectTableName]="AddressObjectTableName"
                                                                                [DataContext]="DataContext"
                                                                                [LookUpTableName]="'State'"
                                                                                (SelectedItemChanged)="State = $event"
                                                                                [DependencyFilter1Value]="CountryId">
                                                                        </LogLov>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <!-- Zip Code -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'ZipCode'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 200px">
                                                                        <LogTextBox [ObjectFieldName]="'ZipCode'" [Text]="ZipCode" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <!-- Signature -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'Signature'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 200px">
                                                                        <LogTextBox [ObjectFieldName]="'Signature'" [Text]="Signature" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td></td>
                                                    </tr>

                                                </table>

                                            </td>

                                            <td style="width: 10px;">
                                                <div></div>
                                            </td>

                                            <td>
                                                <table>

                                                    <tr class="FormFieldRow">
                                                        <td></td>
                                                    </tr>
                                                    <tr class="FormFieldRow">
                                                        <td></td>
                                                    </tr>
                                                    <tr class="FormFieldRow">
                                                        <td></td>
                                                    </tr>
                                                    <tr class="FormFieldRow">
                                                        <td></td>
                                                    </tr>
                                                    <tr class="FormFieldRow">
                                                        <td></td>
                                                    </tr>

                                                    <!-- Phone Number -->
                                                    <tr class="FormFieldRow">
                                                        <td style="width: 80px;">
                                                            <LogLabel [ObjectFieldName]="'PhoneNumber'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td style="width: 200px;">
                                                            <LogTextBox [ObjectFieldName]="'PhoneNumber'" [Text]="PhoneNumber" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                        </td>
                                                    </tr>

                                                    <!-- Fax Number -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'FaxNumber'" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <LogTextBox [ObjectFieldName]="'FaxNumber'" [Text]="FaxNumber" [ObjectTableName]="AddressObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td colspan="2">
                                                            <div></div>
                                                        </td>
                                                    </tr>

                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <!--Local Address-->
                        <table [hidden]="SelectedTabCode != '1'" style="margin-left:10px;">
                            <tr>

                                    <table class="FixedTable" *ngIf="IsLocalAddressTabVisible">

                                                        </td>

                                                    <tr class="FormFieldRow">
                                                        <td>

                                                        </td>

                                                        <td>
                                                            <LogTextBox [ObjectFieldName]="'Address2'" [Text]="LocalAddressDataContext.Address2" [ObjectTableName]="LocalAddressDataContext.ObjectTableName" [DataContext]="LocalAddressDataContext" [HideColumns]="true"></LogTextBox>
                                                        </td>
                                                    </tr>

                                                    <!-- City -->
                                                    <tr class="FormFieldRow">
                                                        <td>

                                                                        <span style="float:left;" class="hyperlink" (click)="LocalAddressDataContext.SelectCityCommand()" [class.HyperlinkDisabled]="LocalAddressDataContext.DemoMessageVisibility">Select</span>
                                                                    </td>
                                                                    <td>
                                                                        <div></div>

                                                            </table>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 250px">
                                                                        <LogLov [ObjectFieldName]="'CountryId'"
                                                                                [ObjectTableName]="LocalAddressDataContext.ObjectTableName"
                                                                                [SelectedValue]="LocalAddressDataContext.CountryId"
                                                                                [DataContext]="LocalAddressDataContext"
                                                                                [LookUpTableName]="'Country'"
                                                                                (SelectedItemChanged)="LocalAddressDataContext.Country = $event">
                                                                        </LogLov>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <!-- State -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'StateId'" [ObjectTableName]="LocalAddressDataContext.ObjectTableName" [DataContext]="LocalAddressDataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 250px">
                                                                        <LogLov [ObjectFieldName]="'StateId'"
                                                                                [SelectedValue]="LocalAddressDataContext.StateId"
                                                                                [ObjectTableName]="LocalAddressDataContext.ObjectTableName"
                                                                                [DataContext]="LocalAddressDataContext"
                                                                                [LookUpTableName]="'State'"
                                                                                (SelectedItemChanged)="LocalAddressDataContext.State = $event"
                                                                                [DependencyFilter1Value]="LocalAddressDataContext.CountryId">
                                                                        </LogLov>
                                                                    </td>

                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <!-- Zip Code -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [ObjectFieldName]="'ZipCode'" [ObjectTableName]="LocalAddressDataContext.ObjectTableName" [DataContext]="LocalAddressDataContext"></LogLabel>
                                                        </td>

                                                        <td>
                                                            <table>
                                                                <tr>
                                                                    <td style="width: 200px">
                                                                        <LogTextBox [ObjectFieldName]="'ZipCode'" [Text]="LocalAddressDataContext.ZipCode" [ObjectTableName]="LocalAddressDataContext.ObjectTableName" [DataContext]="LocalAddressDataContext"></LogTextBox>
                                                                    </td>

                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td></td>
                                                    </tr>

                                                </table>

                                            </td>

                                            <td style="width: 10px;">
                                                <div></div>
                                            </td>

                                            <td>
                                                <table>

                                                    <tr class="FormFieldRow">
                                                        <td></td>
                                                    </tr>
                                                    <tr class="FormFieldRow">
                                                        <td></td>

                                                        <td style="width: 80px;">
                                                            <LogLabel [ObjectFieldName]="'PhoneNumber'" [ObjectTableName]="LocalAddressDataContext.ObjectTableName" [DataContext]="LocalAddressDataContext"></LogLabel>

                        <!-- Invoice Signature -->
                        <table [hidden]="SelectedTabCode != '2'" style="margin-left:10px;">
                            <tr>
                                <td>
                                    <table class="FixedTable">
                                        <tr>
                                            <td style="width: 460px">
                                                <table>
                                                    <!-- InvoicePrintNotes -->
                                                    <tr class="FormFieldRow" >
                                                        <td style="width: 130px;padding-top: 20px;">
                                                            <LogLabel [ObjectFieldName]="'InvoicePrintNotes'" [ObjectTableName]="TenantObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td style="width: 400px; padding-left: 20px;">
                                                            <LogTextBox [ObjectFieldName]="'InvoicePrintNotes'" [Text]="InvoicePrintNotes" [InputType]="'text'" [IsMultiline]="true" [ObjectTableName]="TenantObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                        </td>

                                                        <td></td>
                                                    </tr>

                                                    <tr style="height: 32px;"></tr>

                                                    <!-- InvoicePrintNotesLocal -->
                                                    <tr class="FormFieldRow">
                                                        <td style="padding-top: 20px">
                                                            <LogLabel [ObjectFieldName]="'InvoicePrintNotesLocal'" [ObjectTableName]="TenantObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td style="padding-left: 20px;">
                                                            <LogTextBox [ObjectFieldName]="'InvoicePrintNotesLocal'" [Text]="InvoicePrintNotesLocal" [InputType]="'ntext'" [IsMultiline]="true" [ObjectTableName]="TenantObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>

                                                        <td></td>
                                                    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" id="{{'CancelButton' | IdGeneratorAsyncPipe | async}}" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>
