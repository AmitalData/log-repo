<style>
    .slidecontainer {
        width: 80px;
        height: 22px;
        background-color: var(--sliderBackground);
    }
    .slidecontainer2 {
        width: 80px;
        height: 22px;
        background-color: var(--sliderBackground2);
    }
    .slider {
       border:none;
       box-shadow:none;
        width: 80px;
        height: 28px;
        margin-top :5px;
        cursor: default;
       background :#c0c0c0;
    }
    .disabled {
        pointer-events: none;
        opacity: 0.7;
        cursor: default;
    }
   
        
    /*.coloPicker input {
        position: relative;
        display: inline-block;
    }*/
    .colorPicker {
        width: 30px;
        border: none;
        box-shadow: none;
        position: absolute;
        right: 4px;
        top: 5px;
        background: none;
    }
    
</style>

<div style="height:100%;width:100%">


    <table style="height:100%;vertical-align:top" *ngIf="IsVisibile">


        <tr style="height:20px;">
            <td>
                <div style="height:5px">
                    <span style="vertical-align:central;text-align:left;margin-left:10px;font-size:16px;color:#1B90CB">Cargo Tracking Branding</span>

                </div>
            </td>
        </tr>

        <tr style="height:10px"><td><div></div></td></tr>



        <!--Fields Grid-->


        <tr style="height:100%;vertical-align:top;">
            <td>
                <table>

                    <tr style="vertical-align:top;height:33px">
                        <td style="width:8px"><div></div></td>
                        <td style="width:200px;"><LogLabel [ObjectFieldName]="'EnableBranding'" [ObjectTableName]="'TenantManagement'" [DataContext]="EntityPM"></LogLabel></td>
                        <td style="text-align:left">
                            <CheckBox [IsEnabled]="true" (Checked)="EnableBrandingChange($event)" [IsChecked]="EnableBranding"></CheckBox>
                        </td>
                        <td><div></div></td>
                    </tr>
                    <tr style="vertical-align:top;height:33px">
                        <td style="width:8px"><div></div></td>
                        <td style="width:200px;">  <LogLabel [ObjectFieldName]="'MainColor'" [ObjectTableName]="'TenantManagement'" [DataContext]="EntityPM"></LogLabel></td>

                        <td style="width:160px">
                            <LogTextBox style="width:200px" [HideColumns]="true" [ObjectFieldName]="'MainColor'" [ObjectTableName]="'TenantManagement'" [Text]="MainColor" [DataContext]="DataContext"></LogTextBox>
                            <input  [class.disabled]="!EnableBranding" type="color" class="colorPicker" id="color" value="" style="width:30px;">
                        </td>
                        <!--<td style="width:40px"  [class.disabled]="!EnableBranding" > </td>-->

                        <td [class.disabled]="!EnableBranding" style="width:80px"
                            >
    <input [(ngModel)]="SliderValue" class="slider" id="slider" min="0" max="1" step="0.1" type="range" />
     </td><td><div class="slidecontainer"></div></td>
                        <td><div></div></td>
                    </tr>
                    <tr style="vertical-align:top;height:33px">
                        <td style="width:8px"><div></div></td>
                        <td style="width:200px;">  <LogLabel [ObjectFieldName]="'SecondaryColor'" [ObjectTableName]="'TenantManagement'" [DataContext]="EntityPM"></LogLabel></td>
                        <td style="width:160px">
                            <LogTextBox style="width:160px" [HideColumns]="true" [ObjectFieldName]="'SecondaryColor'" [Text]="SecondaryColor" [ObjectTableName]="'TenantManagement'" [DataContext]="DataContext"></LogTextBox>
                            <input type="color" class="colorPicker" id="secondarycolor"  [class.disabled]="!EnableBranding" value="" style="width:30px;">
                        </td>
                        <!--<td style="width:40px">  </td>-->

                        <td [class.disabled]="!EnableBranding" style="width:80px"
                           >
    <input [(ngModel)]="SecondarySliderValue" class="slider" id="slider" min="0" max="1" step="0.1" type="range" />
 </td><td><div class="slidecontainer2"></div></td>
                        <td><div></div></td>
                    </tr>



                    <tr style="vertical-align:top;height:33px">
                        <td style="width:8px"><div></div></td>
                        <td style="width:200px;">  <LogLabel [ObjectFieldName]="'ContactEmail'" [ObjectTableName]="'TenantManagement'" [DataContext]="EntityPM"></LogLabel></td>
                        <td style="width:160px"><LogTextBox style="width:160px" [HideColumns]="true" [ObjectFieldName]="'ContactEmail'" [ObjectTableName]="'TenantManagement'" [DataContext]="DataContext"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>


                    <tr style="vertical-align:top;height:33px">
                        <td style="width:8px"><div></div></td>
                        <td style="width:200px;">  <LogLabel [ObjectFieldName]="'CustomerURL'" [ObjectTableName]="'TenantManagement'" [DataContext]="EntityPM"></LogLabel></td>
                        <td style="width:160px"><LogTextBox [HideColumns]="true" [ObjectFieldName]="'CustomerURL'" [ObjectTableName]="'TenantManagement'" [DataContext]="DataContext"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>

                    <tr>
                        <td style="width:8px"><div></div></td>
                        <td style="width:180px;height:22px; vertical-align:top">
                            <LogLabel [ObjectFieldName]="'BackgroundId'" [ObjectTableName]="'TenantManagement'"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="vertical-align:top">
                            <div style="width:200px;height:100px">
                                <ImageComponent [KeepOriginalSize]="'true'" 
                                                [WidthImage]="'200px'" 
                                                [class.disabled]="!EnableBranding" 
                                                [HeightImage]="'95px'" 
                                                [ImageId]="BackgroundId" 
                                                [EntityId]="EntityId" 
                                                [EntityName]="'TenantManagement'" 
                                                (UploadCompleted)="BackgroundImageUploadedCompleted($event)" 
                                                style="height:72px;width:72px"> 
                                </ImageComponent>
                            </div>
                        </td><td><div></div></td>
                    </tr>
                    <tr style="height:10px"><td colspan="3"><div></div></td></tr>
                    <tr>
                        <td style="width:8px"><div></div></td>
                        <td style="width:180px;height:22px; vertical-align:top">
                            <LogLabel [ObjectFieldName]="'ComapnylogoId'" [ObjectTableName]="'TenantManagement'"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="vertical-align:top">
                            <div style="width:200px;height:100px">
                                <ImageComponent  [ImageResizeWidth]="327" 
                                                 [ImageResizeHeight]="83" 
                                                 [WidthImage]="'200px'" 
                                                 [class.disabled]="!EnableBranding" 
                                                 [HeightImage]="'95px'" 
                                                 [ImageId]="ComapnylogoId" 
                                                 [EntityId]="EntityId" 
                                                 [EntityName]="'TenantManagement'" 
                                                 (UploadCompleted)="ComapnylogoUploadedCompleted($event)" 
                                                 style="height:72px;width:72px"> 
                                </ImageComponent>
                            </div>
                        </td><td><div></div></td>
                    </tr>
                    <tr style="height:10px"><td colspan="3"><div></div></td></tr>
                    <tr>
                        <td style="width:8px"><div></div></td>
                        <td style="width:180px;height:22px; vertical-align:top">
                            <LogLabel [ObjectFieldName]="'BrowserIconId'" [ObjectTableName]="'TenantManagement'"
                                      [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="vertical-align:top">
                            <div style="width:200px;height:100px">
                                <ImageComponent [ImageResizeWidth]="28" 
                                                [ImageResizeHeight]="30"
                                                [WidthImage]="'200px'" 
                                                [class.disabled]="!EnableBranding" 
                                                [HeightImage]="'95px'" 
                                                [ImageId]="BrowserIconId" 
                                                [EntityId]="EntityId" 
                                                [EntityName]="'TenantManagement'" 
                                                (UploadCompleted)="BrowserIconUploadedCompleted($event)" 
                                                style="height:72px;width:72px"> 
                                </ImageComponent>
                            </div>
                        </td><td><div></div></td>
                    </tr>


                    <tr><td colspan="4"></td></tr>
                </table>

            </td>

        </tr>







    </table>





</div>
