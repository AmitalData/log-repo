<div class="popup-lyout">
  <div class="body-container">
    <div class="popup-cell">
      <label class="Label">Timeout (hrs)</label>
    </div>
    <div class="popup-cell">
      <LogTextBox InputType="double" DigitsAfterPoint="5" [ObjectFieldName]="'cargoTokenTimeout'" [ObjectTableName]="'TenantManagement'"
        [Text]="cargoTokenTimeout" [DataContext]="this">
      </LogTextBox>
    </div>
  
  
  </div>
  <div class="footer-container">
    <div>
      <button class="Button" (click)="CancelButtonClicked()">{{'Accounting.General.B.Cancel' | TextCodeTranslationPipe}}</button>
    </div>
    <div style="width: 60px;">
      <button class="RedButton" (click)="OkButtonClicked()">{{'Accounting.General.B.OK' | TextCodeTranslationPipe}}</button>
    </div>
  </div>
</div>
