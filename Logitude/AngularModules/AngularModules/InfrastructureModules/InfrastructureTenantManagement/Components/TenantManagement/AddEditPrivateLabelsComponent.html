<style>
    .subTitle {
        color: #1b90cb;
        font-size: 15px;
    }

    .FlipImgHoriz {
        transform: rotate(180deg);
    }

    .Warning {
        max-width: 400px;
        color: #696969;
        text-align: left;
        background: #fff5ce;
        border: 1px solid #ffd598;
        border-radius: 5px;
        padding: 2px 10px;
        margin: 5px;
        margin: auto;
        white-space: normal;
    }

        .Warning:hover {
            transition: 0.3s all;
            background: #fcf2c8;
            color: black;
            cursor: default;
        }

    .FormFieldRow {
        height: 32px;
    }

    .slidecontainer {
        width: 80px;
        height: 22px;
        background-color: var(--sliderBackground);
    }

    .slidecontainer2 {
        width: 80px;
        height: 22px;
        background-color: var(--sliderBackground2);
    }

    .color-picker-wrapper {
        border: 1px solid #464646;
        height: 21px;
        margin-top: 3px;
    }

    .colorPicker {
        width: 65px;
        height: 22px;
        max-height: 99px;
        box-shadow: none;
        background: none;
        border-radius: 0;
        /* margin-top: 2px; */
        border: none !important;
        cursor: pointer;
    }


    .range input::-ms-track {
        width: 100%;
        cursor: pointer;
        background: transparent;
        border-color: transparent;
        color: transparent;
    }

    .range-labels {
        /* margin: 38px 0 0 -30px; */
        position: absolute;
        top: 0;
        padding: 0;
        list-style: none;
    }

        .range-labels li {
            position: relative;
            float: left;
            /* width: 90.25px; */
            text-align: center;
            color: #b2b2b2;
            font-size: 14px;
            cursor: pointer;
        }

            .range-labels li::before {
                position: absolute;
                top: -25px;
                right: 0;
                left: 0;
                content: "";
                margin: 0 auto;
                width: 9px;
                height: 9px;
                background: #b2b2b2;
                border-radius: 50%;
            }

        .range-labels .active {
            color: #37adbf;
        }

    ::-webkit-color-swatch {
        border: none !important;
        margin: -4px -2px;
        height: 19px;
    }

    div.scroll {
        overflow: scroll;
    }

    .ImageName{ 
        position: absolute;
        top: 44px;
    }

    .removeLine {
        display: block;
       margin-left: 63px;
    }

</style>

 

<table>
