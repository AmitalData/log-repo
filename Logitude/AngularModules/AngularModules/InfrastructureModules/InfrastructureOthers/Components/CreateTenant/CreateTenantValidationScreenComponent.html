<table>
    <tr style="height:10px"><td><div style="height:10px"></div></td></tr>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary  [SingleLine]="true" [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:5px">
        <td>
          <div style="height:5px"></div>
        </td>
    </tr>


    <tr  style="height:20px;">
        <td>
            <div style="height:5px;margin-left:5px;font-size:14px">Please fill in the missing fields</div>
        </td>
    </tr>


    <tr>
        <td></td>
    </tr>


    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="CloseButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
