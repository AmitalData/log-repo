
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <table>

                    <tr class="FormFieldRow">
                        <td>
                            <label style="margin-left:10px;">WebHook Page URL</label> 
                        </td>

                        <td>
                            <LogTextBox [ObjectFieldName]="'PageURL'" [Text]="PageURL" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>


                    <tr class="FormFieldRow">
                        <td>
                            <label style="margin-left:10px;">Access Key</label>
                        </td>

                        <td>
                            <table>
                                <tr>
                                    <td>
                                        <input type="text" [attr.value]="AccessKey" readonly style="background: #E6E7E8; font-size: 12px;">
                                    </td>

                                    <td style="width: 2px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 80px;">
                                        <ComboBox (SelectedItemChanged)="OperationChanged($event)" [ItemsSource]="Operators" [SelectedItem]="Operation"></ComboBox>
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="Operators" [SelectedItem]="Operation" [Binding]="'Name'" (SelectedItemChanged)="OperationValueChanged($event)"></ComboBox>-->
                                    </td>

                                    <td style="width: 36px;">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                            
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                    <!-- Description -->
                    <tr class="FormFieldRow">
                        <td style="width: 150px;">
                            <label style="margin-left:10px;">Content To Push</label>
                        </td>

                        <td style="width: 450px;">
                            <!--<LogTextBox style="height:500px" [ObjectFieldName]="'ContentToPush'" [Text]="ContentToPush" [IsMultiline]="true" [IsFreeText]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>-->
                            <textarea wrap="hard"
                                      [(ngModel)]="ContentToPush"
                                      style="font-size:12px; font-family:inherit;height:380px;width:380px;"></textarea>
                        </td>

                            <td>
                                <div></div>
                            </td>
                        </tr>




                        <tr>
                            <td colspan="3">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>

        <tr style="height: 32px;">
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">Close</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
