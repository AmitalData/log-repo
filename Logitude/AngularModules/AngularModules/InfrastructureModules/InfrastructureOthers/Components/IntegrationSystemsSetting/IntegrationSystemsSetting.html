






<table>


    <tr style="height:100%;vertical-align:top">

        <td>
            <table style="vertical-align:top">

                <tr class="FormFieldRow">
                    <td style="width:250px">
                        <LogLabel [Text]="'Export Quotations To Integrated System'"
                                  [NoObjectField]="true"
                                  [DataContext]="DataContext"></LogLabel>


                    </td>

                    <td style="width:30px">
                        <CheckBox [IsChecked]="ExportQuotationsoIntegratedSys"
                                  (Checked)="ExportQuotationsoIntegratedSys = $event"></CheckBox>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>

                <tr class="FormFieldRow" *ngIf="DisplayQuotationTransferTriggers">
                    <td style="width:250px">
                        <LogLabel [Text]="'Transfer Quotations to Unifreight'"
                                  [NoObjectField]="true"
                                  [DataContext]="DataContext"></LogLabel>


                    </td>


                    <td style="width: 200px;">
                        <ComboBox [ItemsSource]="QuotationTransferTriggersList" [Binding]="'Name'" [SelectedItem]="SelectedTransferToUnfreightTriggerType" (SelectedItemChanged)="SelectedTransferToUnfreightTriggerType = $event" ></ComboBox>
                    </td>

                    <td>
                        <div></div>
                    </td>

                </tr>

                <tr>
                    <td><div></div></td>
                </tr>

            </table>
        </td>




    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>

                            <button class="Button" (click)="CloseButtonClicked()">Cancel</button>


                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
