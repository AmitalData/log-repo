<table>



    <tr style="height:100%">
        <td class="CellStretch">
            <div class="SimpleGridView">
                <div class="SimpleGridViewHeader">
                    <table>
                        <tr>

                            <td style="width: 150px; min-width: 150px; max-width: 150px;">{{'TermsofUseSignature.F.SignedDatetime' | TextCodeTranslationPipe}}</td>
                            <td style="width: 120px; min-width: 120px; max-width: 120px;">{{'TermsofUseSignature.F.TermsofUseVersion' | TextCodeTranslationPipe}}</td>
                            <td style="width: 60px; min-width: 60px; max-width: 60px;"></td>


                            <td class="LastChild" style="min-width: 20px;">
                                <div></div>
                            </td>

                        </tr>
                    </table>
                </div>


                <div class="SimpleGridViewBody">
                    <table>
                        <tr (click)="TermsofUseSignatureSelectedViewModel=item" [class.RowSelected]="item === TermsofUseSignatureSelectedViewModel" class="SimpleGridViewRow RowHover" *ngFor="let item of TermsofUseSignaturePMLists">

                            <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; position: relative;">
                                <div style="display:inline-block">
                                
                                    <span>{{item.SignedDatetime | DateTimeToDatePipe}}</span>
                                    <span style="margin-left:5px">{{item.SignedDatetime | DateTimeToTimePipe}}</span>

                                </div>
                            </td>

                            <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                {{item.TermsofUseVersion}}
                            </td>

                            <td class="GridViewCell" style="width: 60px; min-width: 60px; max-width: 60px;">
                                <div style="font-size:11px;text-align:left"><a (click)="ViewFile(item)" style="margin-left:0px;color:#0094ff;font-size:12px;text-align:left">View File</a></div>
                            </td>


                            <td class="LastChild" style="min-width: 20px;">
                                <div></div>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </div>





            </div>

        </td>


    </tr>

</table>
