<style>
    .Body {
        overflow: auto;
    }
</style>

<table>
    <tr style="height:30px">
        <td>
            <div style="width: 100%; margin-left: 93% ">
                <button style="width:55px;" class="Button" (click)="OpenUpLoadTemplateFile()">Upload</button>
                <!--accept=".xml,.XML"-->
                <input [attr.accept]="'.PDF'" [attr.id]="VersionDocumentId" type="file" (change)="UpLoadTemplateFileMethod($event)" style="display:none" class="upload" />

            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div class="SimpleGridView">
                <div class="SimpleGridViewHeader">

                    <table>
                        <tr>

                            <td style="width: 150px; min-width: 150px; max-width: 150px;">Upload Date</td>
                            <td style="width: 120px; min-width: 120px; max-width: 120px;">Version Number</td>
                            <td style="width: 60px; min-width: 60px; max-width: 60px;"></td>


                            <td class="LastChild" style="min-width: 20px;">
                                <div></div>
                            </td>

                        </tr>
                    </table>
                </div>


                <div class="SimpleGridViewBody">
                    <table>
                        <tr (click)="TermsofUseSelectedViewModel=item" [class.RowSelected]="item === TermsofUseSelectedViewModel" class="SimpleGridViewRow RowHover" *ngFor="let item of TermsofUsePMLists">

                            <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; position: relative;">
                                <div style="display:inline-block">

                                    <span>{{item.Date | DateTimeToDatePipe}}</span>
                                    <span style="margin-left:5px">{{item.Date | DateTimeToTimePipe}}</span>

                                </div>
                            </td>

                            <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                {{item.VersionNumber}}
                            </td>

                            <td class="GridViewCell" style="width: 60px; min-width: 60px; max-width: 60px;">
                                <div style="font-size:11px;text-align:left"><a (click)="ViewFile(item)" style="margin-left:0px;color:#0094ff;font-size:12px;text-align:left">View File</a></div>
                            </td>


                            <td class="LastChild" style="min-width: 20px;">
                                <div></div>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </div>

            </div>
        </td>
    </tr>
</table>
