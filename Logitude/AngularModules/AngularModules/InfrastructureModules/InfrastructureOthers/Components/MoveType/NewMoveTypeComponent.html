
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>



    <tr style="height:40px">
        <td style="width:100px">

            <LogLabel [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>

        </td>
        <td style="width:200px">

            <LogTextBox [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>



        </td>
        <td style="width:200px">

            <div class="RadioButton">
                <input id="IsAir" type="radio" name="CustomerRadio" (click)="TransportMode='A'" />
                <label for="IsAir">Air:</label>
            </div>
            <img class="CenterCenter" src="./Images/TransportModes/A.png" />


        </td>
        <td><div></div></td>
    </tr>

    <tr style="height:40px">
        <td>

            <LogLabel [ObjectFieldName]="'MoveTypeEnglishName'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>

        </td>
        <td>

            <LogTextBox [ObjectFieldName]="'MoveTypeEnglishName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>


        </td>
        <td>

            <div class="RadioButton">
                <input id="IsInland" type="radio" name="CustomerRadio" (click)="TransportMode='I'" />
                <label for="IsInland">Inland:</label>

            </div>
            <img class="CenterCenter" src="./Images/TransportModes/I.png" />


        </td>
        <td><div></div></td>


    </tr>

    <tr style="height:40px">
        <td>
            <LogLabel [ObjectFieldName]="'MoveTypeLocalName'" [ObjectTableName]="ObjectTableName"
                      [DataContext]="DataContext"></LogLabel>


        </td>
        <td>

            <LogTextBox [ObjectFieldName]="'MoveTypeLocalName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>


        </td>
        <td>

            <div class="RadioButton">
                <input id="IsOcean" type="radio" name="CustomerRadio" (click)="TransportMode='O'" />
                <label for="IsOcean">Ocean:</label>

            </div>
            <img class="CenterCenter" src="./Images/TransportModes/O.png" />


        </td>
        <td><div></div></td>


    </tr>


    <tr><td colspan="4"><div></div></td></tr>


    <tr style="height: 32px;">
        <td style="vertical-align: bottom;" colspan="4">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
