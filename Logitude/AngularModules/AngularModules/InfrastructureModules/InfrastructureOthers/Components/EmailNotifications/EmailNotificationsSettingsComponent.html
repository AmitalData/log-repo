
<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        overflow: hidden;
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 14px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .acc-table td {
        height: 25px;
    }
</style>

<table>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
 

    <tr>
        <td>
            <div class="MediaFill">
               
                    <table *ngIf="IsResourcesReady">

                        <tr style="height:50%;">

                            <!-- Owner Notifications -->
                            <td style="padding: 5px;">
                                <table>
                                    <tr>
                                        <td style="height: 100%">
                                            <div class="SystemDefaultsBox">
                                                <table>
                                                    <tr class="SystemDefaultsBoxHeader">
                                                        <td colspan="2">Owner Notifications</td>
                                                    </tr>
                                                    <tr style="color:#6E7172;height:22px;">
                                                        <td colspan="2" style="padding:5px;">Notification sent when edited by another user than the owner.</td>
                                                    </tr>
                                                    <tr>
                                                        <td style="width:7px;"></td>
                                                        <td style="padding-right: 5px;">
                                                            <table  class="FixedTable">

                                                                <tr class="FormFieldRow">
                                                                    <td colspan="2">
                                                                        <table class="acc-table">

                                                                            <tr *ngFor="let item of OwnerAlerts; let i=index;">
                                                                                  <td style="width: 16px;">
                                                                                    <LogCheckBox [ObjectFieldName]="'IsActive'" [Checked]="item.IsActive" [DataContext]="item" [HideColumns]="true"></LogCheckBox>
                                                                                </td>

                                                                                <td style="padding-left:10px">
                                                                                    <div style="color:#6E7172">{{item.Description}}</div>
                                                                                </td>
                                                                            </tr>
                                                                        


                                                                         </table>
                                                                    </td>
                                                                </tr>

                                                                <tr>
                                                                    <td colspan="2">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>

                                                            </table>
                                                        </td>

                                                    </tr>

                                                </table>
                                            </div>
                                        </td>

                                        <td style="width: 4px;">
                                            <div></div>
                                        </td>

                                    </tr>
                                </table>
                            </td>

                      
                        </tr>

                        <!-- General Notifications -->
                        <tr style="height:50%;">
                            <td style="padding: 5px;">
                               
                                    <table>
                                        <tr>
                                            <td style="height: 100%">
                                                <div class="SystemDefaultsBox">
                                                    <table>
                                                        <tr class="SystemDefaultsBoxHeader">
                                                            <td colspan="2">General Notifications</td>
                                                        </tr>
                                                       
                                                        <tr style="color:#6E7172;height:5px;">
                                                            <td colspan="2"></td>
                                                        </tr>
                                                        <tr style="padding-top:7px;">
                                                            <td style="width:7px;"></td>
                                                            <td style="padding-right: 5px;padding-top:5px">
                                                              <ScrollViewer>
                                                                <table class="FixedTable">

                                                                    <tr class="FormFieldRow">
                                                                        <td colspan="2">
                                                                            <table class="acc-table">

                                                                                <tr *ngFor="let item of GeneralAlerts; let i=index;">
                                                                                    <td style="width: 16px;">
                                                                                        <LogCheckBox [ObjectFieldName]="'IsActive'" [Checked]="item.IsActive" [DataContext]="item" [HideColumns]="true"></LogCheckBox>
                                                                                    </td>

                                                                                    <td style="padding-left:10px;width:150px">
                                                                                        <div style="color:#6E7172">{{item.Description}}</div>
                                                                                    </td>

                                                                                    <td style="width:20px">
                                                                                         
                                                                                    </td>

                                                                                    <td style="width:70%">
                                                                                         <table>
                                                                                             <tr>
                                                                                                 <td><input  readonly="readonly" type="text"  [(ngModel)]="item.To" /></td>
                                                                                                 <td style="width:40px">
                                                                                                     <img (click)="ShowSendToEmail(item)" style="width: 14px; height: 14px; cursor: pointer;"
                                                                                                          src="./Images/LOVSearch.png" [ngStyle]="imgNgStyle" />
                                                                                                 </td>
                                                                                             </tr>
                                                                                             
                                                                                         </table>
                                                                                    </td>
                                                                                    
                                                                                </tr>



                                                                            </table>
                                                                        </td>
                                                                    </tr>

                                                                    <tr>
                                                                        <td colspan="2">
                                                                            <div></div>
                                                                        </td>
                                                                    </tr>

                                                                </table>
                                                              </ScrollViewer>
                                                            </td>

                                                        </tr>


                                                    </table>
                                                </div>
                                            </td>

                                            <td style="width: 4px;">
                                                <div></div>
                                            </td>

                                        </tr>
                                    </table>
                               
</td>
                        </tr>
 

                    </table>
                 
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
