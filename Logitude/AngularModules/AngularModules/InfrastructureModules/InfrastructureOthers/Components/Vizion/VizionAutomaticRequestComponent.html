
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td style="height: 150px; vertical-align: top;">
                                    <div style="height: 150px; width: 100%;">
                                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'ShipmentsNumbersText'" [Text]="ShipmentsNumbersText" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td style="height:10px;">
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td style="height: 150px; vertical-align: top;">
                                    <div style="height: 150px; width: 100%;">
                                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'ShipmentsNumbersRequestText'"  [Text]="ShipmentsNumbersRequestText" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width:20px;">
                        <div></div>
                    </td>

                    <td style="width:400px;">
                        <div class="MediaFill">
                            <div class="SimpleGridView">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr>
                                            <td style="width: 200px; max-width: 200px; min-width: 200px; ">Shipment Number</td>
                                            <td style="width: 150px; max-width:150px; min-width:150px;">No. Containers</td>
                                            <td class="LastChild">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody">
                                    <table>
                                        <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ShipmentsItemsSource">                                            
                                            <td class="GridViewCell" style="width: 200px; max-width: 200px; min-width: 200px; ">
                                                {{item.ShipmentNumber}}
                                            </td>

                                            <td class="GridViewCell" style="width: 150px; max-width: 150px; min-width: 150px; ">
                                                {{item.NumberOfContainers}}
                                            </td>

                                            <td class="CellTools">
                                                <div>                                                   
                                                </div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="3">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom;">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 65px;">
                        <button class="RedButton" (click)="SendRequestClicked()">Send Request</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
