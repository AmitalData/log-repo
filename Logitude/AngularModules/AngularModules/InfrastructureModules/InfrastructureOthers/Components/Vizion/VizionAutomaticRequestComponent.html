
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td style="height: 150px; vertical-align: top;">
                                    <div style="height: 150px; width: 100%;">
                                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'ShipmentsNumbersText'" [Text]="ShipmentsNumbersText" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td style="height:10px;">
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td style="height: 150px; vertical-align: top;">
                                    <div style="height: 150px; width: 100%;">
                                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'ShipmentsNumbersRequestText'" [Text]="ShipmentsNumbersRequestText" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width:20px;">
                        <div></div>
                    </td>

                    <td style="width:400px;">
                        <div class="TabControl">
                            <div class="TabControlHead">
                                <ul>
                                    <li [class.Selected]="SelectedTabCode == 'REQ'" (click)="SelectedTabCode = 'REQ'">
                                        <div class="InnerChild" style="color: #282E30;">
                                            Request Data
                                        </div>
                                    </li>

                                    <li [class.Selected]="SelectedTabCode == 'LOG'" (click)="SelectedTabCode = 'LOG'">
                                        <div class="InnerChild" style="color: #282E30;">
                                            Logs
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="TabControlBody">
                                <div class="MediaFill" [hidden]="SelectedTabCode != 'REQ'">
                                    <div class="SimpleGridView">
                                        <div class="SimpleGridViewHeader">
                                            <table>
                                                <tr>
                                                    <td style="width: 200px; max-width: 200px; min-width: 200px; ">Shipment Number</td>
                                                    <td style="width: 150px; max-width:150px; min-width:150px;">No. Containers</td>
                                                    <td class="LastChild">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>

                                        <div class="SimpleGridViewBody">
                                            <table>
                                                <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ShipmentsItemsSource">
                                                    <td class="GridViewCell" style="width: 200px; max-width: 200px; min-width: 200px; ">
                                                        {{item.ShipmentNumber}}
                                                    </td>

                                                    <td class="GridViewCell" style="width: 150px; max-width: 150px; min-width: 150px; ">
                                                        {{item.NumberOfContainers}}
                                                    </td>

                                                    <td class="CellTools">
                                                        <div>
                                                        </div>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td colspan="3">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                                <div class="MediaFill" [hidden]="SelectedTabCode != 'LOG'">
                                    <div class="SimpleGridView">
                                        <div class="SimpleGridViewHeader">
                                            <table>
                                                <tr>
                                                    <td style="width: 20px; max-width: 20px; min-width: 20px;"></td>
                                                    <td style="width: 120px; max-width: 120px; min-width: 120px;">Shipment Number</td>
                                                    <td style="width: 120px; max-width: 120px; min-width: 120px;">Container Number</td>
                                                    <td style="width: 60px; max-width: 60px; min-width: 60px; ">Error</td>
                                                    <td class="LastChild">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>

                                        <div class="SimpleGridViewBody">
                                            <table>
                                                <tr class="SimpleGridViewRow RowHover" *ngFor="let item of LogsItemsSource">
                                                    <td class="GridViewCell" style="width: 20px; max-width: 20px; min-width: 20px; ">
                                                        <img *ngIf="item.SentSuccesfully" src="./Images/GreenTick.png" class="CenterCenter" />
                                                        <img *ngIf="!item.SentSuccesfully" src="./Images/RedX2.png" class="CenterCenter" />
                                                    </td>

                                                    <td class="GridViewCell" style="width: 120px; max-width: 120px; min-width: 120px;">
                                                        {{item.ShipmentNumber}}
                                                    </td>

                                                    <td class="GridViewCell" style="width: 120px; max-width: 120px; min-width: 120px;">
                                                        {{item.ContainerNumber}}
                                                    </td>

                                                    <td class="GridViewCell" style="width: 60px; max-width: 60px; min-width: 60px; " [title]="item.ErrorMessage">
                                                        <img *ngIf="item.ErrorMessage" src="./Images/ValidationError.png" class="CenterCenter" />
                                                    </td>

                                                    <td class="CellTools">
                                                        <div>
                                                        </div>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td colspan="5">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom;">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 65px;">
                        <button class="RedButton" (click)="SendRequestClicked()">Send Request</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
