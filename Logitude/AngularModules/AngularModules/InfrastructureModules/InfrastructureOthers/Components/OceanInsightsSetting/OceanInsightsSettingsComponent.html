
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="4">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table *ngIf="IsVisible">
                <tr>
                    <td>
                        <div class="MediaFill">
                            <div class="TabControl">
                                <div class="TabControlHead">
                                    <ul>
                                        <li [class.Selected]="SelectedTabCode === 'G'" (click)="SelectedTabCode = 'G'" *ngIf="IsVisibleForTenantZero">
                                            <div class="InnerChild">General</div>
                                        </li>

                                        <li [class.Selected]="SelectedTabCode === 'P'" (click)="SelectedTabCode = 'P'">
                                            <div class="InnerChild">Permissions</div>
                                        </li>
                                    </ul>
                                </div>

                                <div class="TabControlBody">

                                    <!-- General -->
                                    <table [hidden]="SelectedTabCode != 'G'" *ngIf="IsVisibleForTenantZero">
                                        <tr>
                                            <td style="width: 10px;">
                                                <div></div>
                                            </td>

                                            <td>
                                                <table>
                                                    <!-- OITenantNumber -->
                                                    <tr class="FormFieldRow">
                                                        <td style="width:200px;">
                                                            <LogLabel [Text]="'Ocean Insight Tenant'" [NoObjectField]="true" [DataContext]="DataContext"></LogLabel>
                                                        </td>
                                                        <td style="width:300px;">
                                                            <LogTextBox [ObjectFieldName]="'OITenantNumber'" [Text]="OITenantNumber" [NoObjectField]="true" [DataContext]="DataContext"></LogTextBox>
                                                        </td>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>

                                                    <!-- AmitalCloudEnvironmentURL -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [Text]="'Amital Cloud Environment URL'" [NoObjectField]="true" [DataContext]="DataContext"></LogLabel>
                                                        </td>
                                                        <td>
                                                            <LogTextBox [ObjectFieldName]="'AmitalCloudEnvironmentURL'" [Text]="AmitalCloudEnvironmentURL" [NoObjectField]="true" [DataContext]="DataContext"></LogTextBox>
                                                        </td>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>

                                                    <!-- AmitalCloudLogitudeTenantPrimaryKey -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [Text]="'Amital Primary Key'" [NoObjectField]="true" [DataContext]="DataContext"></LogLabel>
                                                        </td>
                                                        <td>
                                                            <LogTextBox [ObjectFieldName]="'AmitalCloudLogitudeTenantPrimaryKey'" [Text]="AmitalCloudLogitudeTenantPrimaryKey" [NoObjectField]="true" [DataContext]="DataContext"></LogTextBox>
                                                        </td>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>


                                                    <tr>
                                                        <td colspan="3">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>

                                    <!-- Permissions -->
                                    <table [hidden]="SelectedTabCode != 'P'">
                                        <tr>
                                            <td>
                                                <table>
                                                    <tr style="height:28px">
                                                        <td>
                                                            <table>
                                                                <tr style="height:20px">
                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                    <td style="width:200px;">
                                                                        <SearchTextBox [ObjectTableName]="'ShippingLine'" [PlaceHolder]="'Search'" (SearchTextChangeEvent)="OnSearchTextChangeEvent($event)"></SearchTextBox>
                                                                    </td>
                                                                    <td style="width:3px;">
                                                                        <div></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <div class="SimpleGridView">
                                                                <div class="SimpleGridViewHeader">
                                                                    <table>
                                                                        <tr>
                                                                            <td style="width:100px; min-width:100px;max-width:100px;">Code</td>
                                                                            <td style="width:100px; min-width:100px;max-width:100px;">SCAC Code</td>
                                                                            <td style="width:100%; min-width:100%;max-width:100%">Name</td>
                                                                            <td style="width:200px; min-width:200px; max-width:200px;">Allowed for Sending by Container</td>
                                                                            <td style="width:200px; min-width:200px; max-width:200px;" *ngIf="!IsVisibleForTenantZero">Enabled for Sending by Container</td>
                                                                            <td style="width:170px; min-width:170px;max-width:170px;">Allowed for Sending by BOL</td>
                                                                            <td style="width:170px; min-width:170px;max-width:170px;" *ngIf="!IsVisibleForTenantZero">Enabled for Sending by BOL</td>
                                                                        </tr>
                                                                    </table>
                                                                </div>

                                                                <div class="SimpleGridViewBody">
                                                                    <table>
                                                                        <tr style="height: 1px;">
                                                                            <td>
                                                                                <table>
                                                                                    <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ShippingLinesLists">
                                                                                        <td>
                                                                                            <table>
                                                                                                <tr style="height:25px;">
                                                                                                    <td class="GridViewCell" style="width:100px; min-width:100px; max-width:100px;">
                                                                                                        {{item.SCACCode}}
                                                                                                    </td>
                                                                                                    <td class="GridViewCell" style="width:100px; min-width:100px; max-width:100px;">
                                                                                                        {{item.Code}}
                                                                                                    </td>

                                                                                                    <td class="GridViewCell" style="width:100%; min-width:100%; max-width:100%;">
                                                                                                        {{item.Name}}
                                                                                                    </td>

                                                                                                    <td class="GridViewCell" style="width:200px; min-width:200px; max-width:200px; padding:0;">
                                                                                                        <div class="CenterCenter" style="width: 16px;">
                                                                                                            <CheckBox [IsEnabled]="IsVisibleForTenantZero" [IsChecked]="item.TenantZeroIsSendingByContainer" (Checked)="item.TenantZeroIsSendingByContainer = $event"></CheckBox>
                                                                                                        </div>
                                                                                                    </td>

                                                                                                    <td class="GridViewCell" style="width:200px; min-width:200px; max-width:200px; padding:0;" *ngIf="!IsVisibleForTenantZero">
                                                                                                        <div class="CenterCenter" style="width: 16px;">
                                                                                                            <CheckBox [IsEnabled]="item.IsSendingByContainerEnabled" [IsChecked]="item.IsSendingByContainer" (Checked)="item.IsSendingByContainer = $event"></CheckBox>
                                                                                                        </div>
                                                                                                    </td>

                                                                                                    <td class="GridViewCell" style="width:170px; min-width:170px; max-width:170px; padding:0;">
                                                                                                        <div class="CenterCenter" style="width: 16px;">
                                                                                                            <CheckBox [IsEnabled]="IsVisibleForTenantZero" [IsChecked]="item.TenantZeroIsSendingByBillOfLading" (Checked)="item.TenantZeroIsSendingByBillOfLading = $event"></CheckBox>
                                                                                                        </div>
                                                                                                    </td>

                                                                                                    <td class="GridViewCell" style="width:170px; min-width:170px; max-width:170px; padding:0;" *ngIf="!IsVisibleForTenantZero">
                                                                                                        <div class="CenterCenter" style="width: 16px;">
                                                                                                            <CheckBox [IsEnabled]="item.IsSendingByBillOfLadingEnabled" [IsChecked]="item.IsSendingByBillOfLading" (Checked)="item.IsSendingByBillOfLading = $event"></CheckBox>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                </tr>

                                                                                                <tr>
                                                                                                    <td colspan="7"></td>
                                                                                                </tr>
                                                                                            </table>


                                                                                        </td>
                                                                                    </tr>
                                                                                </table>
                                                                            </td>
                                                                        </tr>

                                                                        <tr>
                                                                            <td>
                                                                                <div></div>
                                                                            </td>
                                                                        </tr>
                                                                    </table>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom;">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
