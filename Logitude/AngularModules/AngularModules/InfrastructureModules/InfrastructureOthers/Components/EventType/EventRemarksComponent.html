<div class="TabHolder">     
            <tr class="TabTitleRow">
                <td>View Remarks </td>
            </tr>
            <tr style="height: 20px;">

                <td>
                    <span class="Label">Select partners to view event remarks</span>
                </td>

                <td style="width: 57px;">
                    <button class="Button" (click)="ClearAllClicked($event)">Clear All</button>
                </td>

                <td style="width: 5px;">
                    <div></div>
                </td>

                <td style="width: 57px;">
                    <button class="Button" (click)="SelectAllClicked($event)">Select All</button>
                </td>

                <td style="padding: 4px; width: 250px;" >
                    <SearchTextBox [ObjectTableName]="ObjectTableName" [PlaceHolder]="'General.O.Search' | TextCodeTranslationPipe" (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
                </td>

            </tr>

            <tr style="height: 5px;">
                <td>
                    <div></div>
                </td>
            </tr>

            <tr>
                <td>
                    <div>
                        <div class="SimpleGridView">
                            <div class="SimpleGridViewHeader" style="position: unset;height:20px;" >
                                <table style="width:100%;">
                                    <tr>
                                        <td style="width: 600px; min-width: 600px; max-width: 600px;height:20px;">partner type</td>
                                        <td style="width: 420px; min-width: 420px; max-width: 420px;">choose</td>
                                        <td class="LastChild">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                            <div>
                                <tr >
                                    <td colspan="2">
                                        <table *ngFor="let item of partnerTypesEvent"> 
                                            <tr class="SimpleGridViewRow RowHover">
                                                <!-- <td>
                                                    <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>  -->
                                                <td style="width: 600px;">
                                                    {{item.PartnerTypeName}}
                                                </td>  
                                                <div></div>
                                                <td class="GridViewCell" style="width:150px;min-width:150px;border-bottom:1px solid #E4E3E1;">
                                                    <div class="MediaFill">
                                                        <div class="MediaFillRelative">
                                                            <div class="CenterCenter" style="width: 16px;">
                                                                <CheckBox [IsChecked]="item.IsChoose || IsAllSelected" (Checked)="CheckboxIsSelectedByDefaultClick(item,$event)"></CheckBox>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td colspan="6">
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr> 
                            </div>   
                        </div>
                    </div>    
                </td>
            </tr>  
    </div>
