<table *ngIf="IsLoad">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table>
               
                <tr class="FormFieldRow">
                    <td style="width:70px">
                        <LogLabel [ObjectFieldName]="'ToDatetime'" [NoObjectField]="true" [Text]="'Is Active'" [DataContext]="DataContext"></LogLabel>     
                    </td>

                    <td style="width:200px">
                        <LogCheckBox [ObjectFieldName]="'IsActive'" [NoObjectField]="true" [ObjectTableName]="'DocumentFilingBackupSetting'" [DataContext]="DataContext"></LogCheckBox>
                    </td>

                    <td></td> 
                </tr>



                <tr class="FormFieldRow">

                    <td style="width: 90px;">
                        <LogLabel [Text]="'FTP Detail'" [ObjectFieldName]="'FTPDetailId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width: 200px;"> 
                        <div class="BoxText" style="border:1px solid #ccc9c9; border-radius:3px;">
                            <div style="padding-left:1px; display:inline-block; vertical-align:middle;">
                                <span style="padding-left:5px;vertical-align:middle;">{{FTPDetailHost}}</span>
                            </div>
                        </div>
                    </td>

                    <td style="width: 23px; padding-left: 5px;">
                        <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="AddEditFTPDetails('Edit')" [disabled]="FTPDetailId == null"></IconButton>
                    </td>

                    <td style="width: 20px; padding-left: 2px;">
                        <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddEditFTPDetails('Add')"></IconButton>
                    </td>

                    <td>
                        <div>

                        </div>
                    </td>
                </tr>

                <tr></tr>
            </table>

        </td>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;"><div></div></td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
