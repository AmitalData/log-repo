<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width:85px">
                        <LogLabel [ObjectTableName]="'DocumentFilingBackupBatch'"  [ObjectFieldName]="'FromDatetime'" [NoObjectField]="true" [Text]="'From Date'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:125px">
                        <LogDatePicker [ObjectFieldName]="'FromDatetime'" [NoObjectField]="true" [ObjectTableName]="'DocumentFilingBackupBatch'"
                                       [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="width:85px">
                        <LogLabel  [ObjectTableName]="'DocumentFilingBackupBatch'" [ObjectFieldName]="'ToDatetime'" [NoObjectField]="true" [Text]="'To Date'"
                                  [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:125px">
                        <LogDatePicker [ObjectFieldName]="'ToDatetime'" [NoObjectField]="true" [ObjectTableName]="'DocumentFilingBackupBatch'"
                                       [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td></td>
                </tr>


                <tr class="FormFieldRow">
               <td colspan="3">
                   <table>
                       <tr>
                           <td style="width:30px">
                               <LogCheckBox [ObjectFieldName]="'IncludeBackedUp'" [NoObjectField]="true" [ObjectTableName]="'DocumentFilingBackupBatch'" [DataContext]="DataContext"></LogCheckBox>
                           </td>

                           <td style="text-align:left">

                               <label class="Label" style="color:#6E7172;text-align:left">Include already backed docs</label>

                           </td>

                   
                       </tr>
                   </table>

               </td>
                    
                </tr>




                <tr></tr>
            </table>

        </td>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
