
<div style="background-color:Beige;border:1px solid Gray;border-radius:10px;height:100%">
    <table>


        <tr style="height:5px"><td><div></div></td></tr>

        <tr style="vertical-align:top">


            <td style="position: relative;">
                <div>
                    <table style="height:auto;width:100%;margin-top:0px">

                        <tr style="height:5px"><td style="height:5px"><div style="height:5px"></div></td></tr>

                        <tr>

                            <td>
                                <table>
                                    <tr style="height:15px"><td style="width:15px"><div></div></td><td><span style="font-size:11px">This report may contain old values.</span></td></tr>
                                    <tr style="height:15px"><td style="width:15px"><div></div></td><td><span style="font-size:11px">do you want to regenerate it?</span></td></tr>
                                    <tr><td colspan="2"><span></span></td></tr>
                                </table>
                            </td>

                        </tr>

                        <tr style="height:5px"><td style="height:5px"><div style="height:5px"></div></td></tr>

                    </table>


                </div>
            </td>




        </tr>

        <tr style="height: 25px;">
            <td style="vertical-align: top">
                <table style="height: 22px;">
                    <tr>
                        <td style="width:15px">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <div>
                                <button class="Button" (click)="SaveButtonClicked()">Regenerate</button>
                            </div>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 80px;">
                            <button class="Button" (click)="CancelButtonClicked()">Keep Current Report</button>
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>


        <tr>
            <td style="vertical-align: bottom"><div></div></td>

        </tr>
    </table>
</div>
