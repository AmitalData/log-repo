<div *ngIf="dataReady && tableDataInit" class="view-container">
    <div class="field-container">
        <LogLabel [ObjectFieldName]="'CODE'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM" ></LogLabel>
        <LogTextBox [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM" [HideColumns]="true"></LogTextBox>
    </div>

    <div class="field-container">
        <LogLabel [ObjectFieldName]="'ENGLISHNAME'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM" ></LogLabel>
        <LogTextBox [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM" [HideColumns]="true"></LogTextBox>
    </div>

    <div class="field-container">
        <LogLabel [ObjectFieldName]="'LOCALNAME'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM"></LogLabel>
        <LogTextBox [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM" [HideColumns]="true"></LogTextBox>
    </div>

    <div class="field-container">
        <LogLabel [ObjectFieldName]="'CUSTOMSMETADATACODE'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM"></LogLabel>
        <LogTextBox [ObjectFieldName]="'CustomsMetaDataCode'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM" [HideColumns]="true"></LogTextBox>
    </div>

    <div class="field-container">
        <LogLabel [ObjectFieldName]="'FORMAT'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM"></LogLabel>
        <select [(ngModel)]="documentsMetaDataTypePM.Format">
            <option value=''>{{'Customs.Declaration.O.Choose' | TextCodeTranslationPipe}}</option>
            <option *ngFor="let format of ['boolean', 'datetime', 'integer', 'listofvalues', 'string']"
                [selected]="format == documentsMetaDataTypePM.Format">{{format}}</option>
        </select>
    </div>

    <div class="field-container">
        <LogLabel [ObjectFieldName]="'Inactive'" [ObjectTableName]="ObjectTableName"
            [DataContext]="documentsMetaDataTypePM"></LogLabel>
        <BooleanFilter [SelectedValue]="documentsMetaDataTypePM.InActive ? 'True' : 'False'"
            (SelectedTypeValueChanged)="documentsMetaDataTypePM.InActive = $event === 'True'"></BooleanFilter>
    </div>

    <ValidationSummary *ngIf="!isUpdate && validationErrorsList.length > 0" [ItemsSource]="validationErrorsList">
    </ValidationSummary>

    <log-close-save-buttons *ngIf="!isUpdate" (close)='close($event)'></log-close-save-buttons>
</div>
