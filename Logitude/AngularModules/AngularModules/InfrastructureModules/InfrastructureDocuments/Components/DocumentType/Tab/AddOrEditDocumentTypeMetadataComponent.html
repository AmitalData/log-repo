<div *ngIf="dataReady" class="view-container">

    <div class="field-container">
        <LogLabel [DataContext]="documentTypeMetaData" [ObjectFieldName]="'DocumentTypeId'"
            [ObjectTableName]='tableName'></LogLabel>
        <LogLov [ObjectFieldName]="'documentsMetaDataTypeId'" [ObjectTableName]="tableName"
            [DataContext]="documentTypeMetaData" [LookUpTableName]="'DocumentsMetaDataType'" [HideColumns]="true"
            [QueryFilterItems]="documentsMetaDataTypeFilter">
        </LogLov>
    </div>

    <div class="field-container">
        <LogLabel [DataContext]="documentTypeMetaData" [ObjectFieldName]="'Mandatory'" [ObjectTableName]='tableName'>
        </LogLabel>
        <CheckBox [IsChecked]="documentTypeMetaData['Mandatory']"
            (Checked)="documentTypeMetaData['Mandatory'] = $event;" [ngClass]='{"error": error}'>
        </CheckBox>
    </div>

    <ValidationSummary *ngIf="validationErrorsList.length > 0" [ItemsSource]="validationErrorsList"></ValidationSummary>

    <log-close-save-buttons (close)='close($event)'></log-close-save-buttons>
</div>
