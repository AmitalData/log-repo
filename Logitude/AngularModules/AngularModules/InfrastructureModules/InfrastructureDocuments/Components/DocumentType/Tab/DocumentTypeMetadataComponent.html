<!-- <log-text-box-form *ngIf='fieldsReady' [DataContext]='data' [fields]='fields' [dir]="'ltr'"></log-text-box-form>        -->
<p *ngIf='requiredFieldError' class='error-message'>{{'Customs.General.O.RequiredFields' | TextCodeTranslationPipe}}</p>
<!-- <log-close-save-buttons (close)='close($event)'></log-close-save-buttons>         -->

<button class="Button add-btn" (click)="openAddEditPopup()">{{'General.B.Add' | TextCodeTranslationPipe}}</button>

<div class='margin-vertical user-select' style='height: 330px; width: 100%; position: relative;'
    *ngIf='schemaTableReady'>
    <logitude-edit-grid GridHeight="100%" GridWidth="100%" [ItemSource]="schemaDataSource">
        <log-column [header]="col.label" [width]="col.width" [Alignment]="'center'" [binding]="col.name"
            *ngFor='let col of schemaColumns'>
            <ng-template let-item>
                <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                    <div *ngIf="logcelltemplate.IsDisplayMode" class="TextTrimming" style="text-align:center">
                        {{item[col.name]}}
                    </div>
                </log-cell-template>
            </ng-template>
        </log-column>
        <log-column [width]="'140'" [Alignment]="'center'">
            <ng-template let-item>
                <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                    <div *ngIf="logcelltemplate.IsDisplayMode" class="TextTrimming" style="text-align:center">
                        <button class="Button RedButton edit-btn" (click)="openAddEditPopup(item)">{{'General.B.Edit' |
                            TextCodeTranslationPipe}}</button>
                        <button class="Button RedButton remove-btn"
                            (click)="openRemovePopup(item.Id)">{{'General.B.Remove' |
                            TextCodeTranslationPipe}}</button>
                    </div>
                </log-cell-template>
            </ng-template>
        </log-column>
    </logitude-edit-grid>
</div>
