<style>
    .FormFieldRow {
        height: 30px;
    }
</style>

<table>
    <tr>
        <td>
            <div class="MediaFill">
                <table *ngIf="DocumentCopy">
                    <tr class="FormFieldRow">
                        <td style="width:70px;"> <div></div> </td>
                        <td style="width:250px;"> <div></div> </td>
                    </tr>
                    <tr class="FormFieldRow">
                        <td style="width:70px;">
                            <LogLabel [Text]="'DocumentTypeCopy.O.Name' | TextCodeTranslationPipe" [DataContext]="DataContext"></LogLabel>
                        </td>
                        <td style="width:250px;">
                            <div style="height: 100%; width: 100%;">
                                <LogTextBox [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [HideColumns]="true" [DataContext]="DataContext"></LogTextBox>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2"> </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                    </td>
                    <td style="width: 5px;">
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
