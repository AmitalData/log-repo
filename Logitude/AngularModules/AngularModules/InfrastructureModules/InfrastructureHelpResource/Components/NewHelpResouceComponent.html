
<table *ngIf="IsResourcesReady">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table class="FixedTable">
                    <tr>
                        <td style="width: 500px;">
                            <table>
                                <tr class="FormFieldRow">
                                    <td style="width: 120px;">
                                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td style="width: 230px;">
                                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Language'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <ComboBox [ItemsSource]="LanguageList" [Binding]="'Name'" [SelectedItem]="SelectedLanguage" (SelectedItemChanged)="SelectedLanguage = $event"></ComboBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Category'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <ComboBox [ItemsSource]="CategoryList" [Binding]="'Name'" [SelectedItem]="SelectedCategory" (SelectedItemChanged)="SelectedCategory = $event"></ComboBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Type'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <ComboBox [ItemsSource]="TypeList" [Binding]="'Name'" [SelectedItem]="SelectedType" (SelectedItemChanged)="SelectedType = $event"></ComboBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow" *ngIf="VideoPropertiesVisible">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'VideoURL'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox (LostFocus)="VideoURLKeyUpMethod($event)" [ObjectFieldName]="'VideoURL'" [Text]="VideoURL" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow" *ngIf="VideoPropertiesVisible">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Duration'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox (LostFocus)="DurationKeyUpMethod($event)" [ObjectFieldName]="'Duration'" [Text]="Duration" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'FileName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogTextBox [ObjectFieldName]="'FileName'" [Text]="FileName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'IsNew'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>

                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'IsNew'" [Checked]="IsNew" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr>
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                            </table>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
