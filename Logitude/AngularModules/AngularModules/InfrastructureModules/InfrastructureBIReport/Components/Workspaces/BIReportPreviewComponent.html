
<div class="MediaFillAbsolute" style="background: white;">
    <div class="MarginAbsolute10" style="top: 5px;">
        <table>

            <!-- Back Button + Title -->
            <tr style="height: 22px;">
                <td>
                    <table>
                        <tr>
                            <td style="width: 1px;">
                                <BackButton [Text]="'BI Reports'" (click)="BackButtonClicked()"></BackButton>
                            </td>
                            <td style="width:10px"></td>
                            <td>
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr style="height: 10px;">
                <td></td>
            </tr>

            <!-- Filters -->
            <tr style="height: 1px;">
                <td>
                    <table>
                        <tr>
                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td style="width: 120px;">
                                <button style="width:120px;float:left;" class="Button" (click)="ExportToExcelClicked()">Export To Excel</button>
                            </td>

                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td style="width: 150px;">
                                <button style="width:150px;float:left;" class="Button" (click)="ExportToExcelAGGridClicked()">Export To Excel (AGGrid)</button>
                            </td>

                            <td>
                                <div></div>
                            </td>

                            <td style="width: 90px;float:right">
                                <button *ngIf="!HasChanged" class="Button" style="height:25px;" (click)="SaveBIReport()">
                                    <img [ngStyle]="{'margin-left': '2px'}" src="./Images/Buttons/Save.png" [className]="LeftCenter" />
                                    <span style="line-height: 19px;" [ngStyle]="{'margin-left': '5px'}">Save</span>
                                </button>
                                <button *ngIf="HasChanged" class="EntityChangesButton" (click)="SaveBIReport()" style="height:25px;">
                                    <img src="./Images/Buttons/Save.Red.png" [className]="LeftCenter" [ngStyle]="{'margin-left': '2px'}" />
                                    <span style="line-height: 19px;" [ngStyle]="{'margin-left': '5px'}">Save</span>
                                </button>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr style="height: 10px;">
                <td>
                    <div> </div>
                </td>
            </tr>

            <tr>
                <td>
                    <!--   [suppressCsvExport]="true" [animateRows]="true"  [showToolPanel]="true"-->
                    <div class="MediaFill">
                        <ag-grid-angular style="width:100%; height:100%;"
                                         #agGrid
                                         id="myGrid"
                                         class="ag-theme-balham"
                                         [enableSorting]="true"
                                         [enableFilter]="true"
                                         [floatingFilter]="true"
                                         [rowData]="rowData"
                                         [columnDefs]="columnDefs"
                                         [rowSelection]="multiple"
                                         [rowModelType]="virtual"
                                         [multiSortKey]="'ctrl'"
                                         [excelStyles]="excelStyles"
                                         (gridReady)="onGridReady($event)"
                                         (sortChanged)="onSortChanged($event)"
                                         (columnResized)="onColumnResized($event)"
                                         (columnMoved)="onColumnMoved($event)"
                                         [paginationPageSize]="100" [pagination]="true">
                        </ag-grid-angular>
                    </div>
                </td>
            </tr>

            <tr style="height: 20px;">
                <td>
                    <div> </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="WidthBusyIndicator"></BusyIndicator>
