<style type="text/css">
    button{
        display:initial !important;
    }
</style>
<div class="MediaFillAbsolute" style="background: white;">
    <div class="MarginAbsolute10" style="top: 5px;">
        <table>

            <!-- Back Button + Title -->
            <tr style="height: 22px;">
                <td>
                    <table>
                        <tr>
                            <td style="width: 1px;">
                                <BackButton [Text]="'BI Reports'" (click)="BackButtonClicked()"></BackButton>
                            </td>
                            <td style="width:10px"></td>
                            <td style="vertical-align:middle;">
                                <div style="vertical-align:middle;" class="TabTitleRow">
                                    {{BIReportName}}
                                </div>
                            </td>
                            <td>
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr style="height: 10px;">
                <td></td>
            </tr>

            <!-- Filters -->
            <tr style="height: 1px;">
                <td>
                    <table>
                        <tr>
                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td style="width: 120px;">
                                <button [disabled]="IsNewEntity" style="width:120px;float:left;" class="Button" (click)="ExportToExcelClicked()">Export To Excel</button>
                            </td>


                            <td style="width: 5px;">
                                <div></div>
                            </td>


                            <td style="width: 120px;">
                                <button style="width:120px;float:left;" class="Button" (click)="CountClicked()">Grid Total Rows</button>
                            </td>

                            <td>
                                <div></div>
                            </td>

                            <td style="float:right;width:230px; ">
                                <table>
                                    <tr>
                                        <td style="width: 15px;vertical-align:middle;">
                                            <img src="./Images/Columns.png" (click)="onBIReportColumnsClick()" title="Show/Hide/Reorder Column(s)" style="cursor: pointer; height:18px;" [className]="LeftCenter"/>
                                        </td>

                                        <td style="width: 5px;">
                                            <div></div>
                                        </td>

                                        <td style="width: 57px;">
                                            <button [disabled]="IsNewEntity" class="Button" (click)="EditBIReportClicked()">Edit Report</button>
                                        </td>

                                        <td style="width: 5px;">
                                            <div></div>
                                        </td>

                                        <td style="width: 57px;">
                                            <button [disabled]="IsNewEntity" class="Button" (click)="ShowQueryBuilderClicked()">Edit Query</button>
                                        </td>

                                        <td style="width: 5px;">
                                            <div></div>
                                        </td>

                                        <td style="width: 50px;">
                                            <button *ngIf="!HasChanges" class="Button" (click)="SaveBIReport()">
                                                <img [ngStyle]="{'margin-left': '2px'}" src="./Images/Buttons/Save.png" [className]="LeftCenter" />
                                                <span style="line-height: 19px;vertical-align:middle;" [ngStyle]="{'margin-left': '3px'}">Save</span>
                                            </button>
                                            <button *ngIf="HasChanges" class="EntityChangesButton" (click)="SaveBIReport()">
                                                <img src="./Images/Buttons/Save.Red.png" [className]="LeftCenter" [ngStyle]="{'margin-left': '2px'}" />
                                                <span style="line-height: 19px;vertical-align:middle;" [ngStyle]="{'margin-left': '3px'}">Save</span>
                                            </button>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr style="height: 10px;">
                <td>
                    <div> </div>
                </td>
            </tr>

            <tr>
                <td>
                    <!--   [suppressCsvExport]="true" [animateRows]="true"  [showToolPanel]="true"    [rowModelType]="'virtual'"   [floatingFilter]="true" [enableCellChangeFlash]="true" -->
                    <div class="MediaFill">
                        <ag-grid-angular style="width:100%; height:100%;"
                                         #agGrid
                                         id="myGrid"
                                         [enableCellChangeFlash]="true"
                                         class="ag-theme-balham"
                                         [enableSorting]="true"
                                         [enableFilter]="true"
                                         [rowData]="rowData"
                                         [columnDefs]="columnDefs"
                                         [rowSelection]="'multiple'"
                                         [multiSortKey]="'ctrl'"
                                         (gridReady)="onGridReady($event)"
                                         (sortChanged)="onSortChanged($event)"
                                         (columnResized)="onColumnResized($event)"
                                         (columnMoved)="onColumnMoved($event)">
                        </ag-grid-angular>
                    </div>
                </td>
            </tr>

            <tr style="height: 20px;">
                <td>
                    <div> </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator" [Width]="WidthBusyIndicator"></BusyIndicator>
