<table>
    <tr style="height:100%;vertical-align:top">
        <td>
            <table>
                <tr style="height:25px;">
                    <td style="width:15px;"><div style="width:15px"></div></td>
                    <td class="GridViewCell" style="width: 20px; min-width: 20px; max-width: 20px; position: relative;border:0px">
                        <CheckBox [IsChecked]="IncludeTotals"
                                  (Checked)="IncludeTotals = $event"></CheckBox>
                    </td>


                    <td class="GridViewCell" style="width: 100%; min-width: 100%; max-width: 100%; position: relative;border:0px">
                        Include Totals
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
