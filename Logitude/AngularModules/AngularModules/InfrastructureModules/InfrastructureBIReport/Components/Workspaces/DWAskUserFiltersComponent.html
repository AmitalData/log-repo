
<style type="text/css">
    .LinkBtn {
        text-decoration: underline;
        float: left;
        color: blue;
        font-size: 11px;
        text-indent: 3px;
    }

        .LinkBtn:hover {
            text-decoration: underline;
            float: left;
            color: lightskyblue;
            font-size: 11px;
            cursor: pointer;
        }

    .GroupItem {
        min-width: 70px;
        min-height: 65px;
        /*border-left: 1px solid gray;
        padding-left: 5px;*/
        /*padding-right: 5px;
        border-right: 1px solid gray;*/
        margin: 5px;
        display: inline-block;
    }

    .FilterItem {
        min-width: 55px;
        min-height: 20px;
        margin: 5px;
        /*height:1px;*/
    }

    .Filters {
        /*display: inline-block;*/
        display: table-cell;
        border-left: 1px solid gray;
    }

    .Operator {
        min-width: 55px;
        min-height: 20px;
        margin: 5px;
        display: inline-block;
        /*display: table-cell;
        vertical-align: middle;*/
    }

    .OperatorItem {
        min-width: 55px;
        min-height: 65px;
        margin: 5px;
        display: inline-block;
    }

    .GroupInnerItem {
        min-width: 55px;
        min-height: 65px;
        /*border-right: 1px solid gray;
        padding-right: 5px;*/
        display: inline-block;
    }

    .GroupItemSeperator {
        width: 55px;
        border-right: 1px solid gray;
        height: 100%;
        position: absolute;
        top: 0px;
        bottom: 0px;
        margin-left: 5px;
        display: inline-block;
    }

    .MyFilterItem {
        /*height:30px;*/
    }

        .MyFilterItem:hover .DeleteButton {
            display: block;
        }

    .DeleteButton {
        display: none;
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
    <tr *ngIf="IsDateFilter == false">
        <td>
            <div *ngFor="let item of SelectedFiltersDataSource; let i=index;" style="float:left;">
                <div  style="float:left;margin-left:15px;width:500px;" *ngIf="item && item.FilterType == 'Ask User' && (!item.IsGroup) && (item.ParentDataTypeCode != 'DateTime' && item.ParentDataTypeCode != 'Date')">
                    <div>
                        <table style="height:30px;">
                            <tr style="height:30px;" class="MyFilterItem">
                                <td *ngIf="item.IsMandatoryFilter == true" style="height: 22px;width:7px;">
                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td *ngIf="!item.IsMandatoryFilter" style="height: 22px;width:7px;">
                                    <div style="width: 7px; height: 7px; background: transparent; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="width: 150px;max-width:150px;" class="TextTrimming" [title]="item.DisplayName.replace('[', '').replace(']','')">
                                    <span>{{item.DisplayName.replace('[', '').replace(']','')}}</span>
                                </td>
                                <td style="width:7px;">
                                    <div style="width:7px;"></div>
                                </td>
                                <td style="width: 106px;max-width:106px;" class="TextTrimming" [title]="item.DisplayName.replace('[', '').replace(']','')">
                                    <ComboBox style="width:130px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="OperationValueChanged($event,item)"></ComboBox>
                                </td>
                                <td style="width:7px;">
                                    <div style="width:7px;"></div>
                                </td>
                                <td style="width:180px;" [ngSwitch]="item.ParentDataTypeCode">

                                    <!-- Text -->
                                    <div *ngSwitchCase="'Text'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                        <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:162px;">
                                            <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Text'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </div>

                                    <!-- nText -->
                                    <div *ngSwitchCase="'nText'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                        <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:162px;">
                                            <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'nText'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </div>

                                    <!-- Integer -->
                                    <div *ngSwitchCase="'Integer'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                        <div style="width:162px;">
                                            <LogTextBox [ObjectFieldName]="'TextValue'" [InputType]="'Integer'" [DataContext]="item" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </div>

                                    <!-- Double -->
                                    <div *ngSwitchCase="'Double'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                        <div style="width:162px;">
                                            <LogTextBox [ObjectFieldName]="'TextValue'" [DataContext]="item" [InputType]="'Double'" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </div>

                                    <!-- Decimal -->
                                    <div *ngSwitchCase="'Decimal'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                        <div style="width:162px;">
                                            <LogTextBox [ObjectFieldName]="'TextValue'" [DataContext]="item" [InputType]="'Decimal'" [NoValidation]="true" [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </div>

                                    <!-- Boolean -->
                                    <div *ngSwitchCase="'Boolean'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="item.OperationValueChanged($event)"></ComboBox>-->
                                        <div style="width:180px;">
                                            <!--<LogCheckBox (ValueChanged)="item.onTextChange($event)" [ObjectFieldName]="'TextValue'" [DataContext]="item"></LogCheckBox>-->
                                            <ComboBox *ngIf="BooleanValues" (SelectedItemChanged)="item.onTextChange($event)" [ItemsSource]="BooleanValues" [SelectedItem]="item.BoolValue"></ComboBox>
                                        </div>
                                    </div>

                                    <!-- Lookup -->
                                    <div *ngSwitchCase="'LookUp'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" (SelectedItemChanged)="item.OperationValueChanged($event)" [Binding]="'Name'"></ComboBox>-->
                                        <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:180px;">
                                            <DWLov *ngIf="item.ParentDimTabelName && item.Name"
                                                   [SelectedValue]="item.TextValue"
                                                   [ObjectFieldName]="item.Code"
                                                   [DataContext]="item"
                                                   (ValueChanged)="item.onTextChange($event)"
                                                   [Operation]="item.Operation.Code"
                                                   [ObjectTableName]="item.ParentDimTabelName"
                                                   [LOVAdditionalColumns]="item.LOVAdditionalColumns"
                                                   [IsFreeText]="true">
                                            </DWLov>
                                        </div>
                                    </div>

                                    <div *ngSwitchCase="'Dimension'">
                                        <!--<ComboBox style="width:130px;margin-right:5px;" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" (SelectedItemChanged)="item.OperationValueChanged($event)" [Binding]="'Name'"></ComboBox>-->
                                        <div *ngIf="item.Operation.Code != 'IsNull' && item.Operation.Code != 'IsNotNull'" style="width:180px;">
                                            <DWLov *ngIf="item.ParentDimTabelName && item.Name"
                                                   [SelectedValue]="item.TextValue"
                                                   [ObjectFieldName]="item.Code"
                                                   [DataContext]="item"
                                                   (ValueChanged)="item.onTextChange($event)"
                                                   [Operation]="item.Operation.Code"
                                                   [ObjectTableName]="item.ParentDimTabelName"
                                                   [LOVAdditionalColumns]="item.LOVAdditionalColumns"
                                                   [IsFreeText]="true">
                                            </DWLov>
                                        </div>
                                    </div>
                                </td>
                                <!--<td *ngIf="item.FilterType == 'Ask User'" [style.width.px]="item.FilterType == 'Ask User' && item.IsSetDefaults == true ? 50: 310">
                            <span class="LinkBtn" (click)="item.OpenFilterSettings()">Settings</span>
                        </td>-->
                            </tr>
                        </table>
                        <!-------------------------->
                        <!--<DWQueryBuilderFilters [SelectedFiltersDataSource]="item.FilterItems" [DataContext]="item.MyParentClass"></DWQueryBuilderFilters>-->
                        <DWAskUserFiltersComponent [SelectedFiltersDataSource]="item.FilterItems"></DWAskUserFiltersComponent>
                        <!-------------------------------------------------------->
                        <!-------------------------------------------------------->
                        <div *ngIf="SelectedFiltersDataSource.length > 0 && item.IsGroup == true" style="margin-top: 10px;margin-left: 6px;">
                            <table>
                                <tr>
                                    <td style="width:1%;"></td>
                                    <td style="width:1%;"><span class="LinkBtn" (click)="AddFilterToGroup(item)">Add Filter</span></td>
                                    <td style="width:1%;"></td>
                                    <td style="width:10%;"><span class="LinkBtn" (click)="AddGroup(item)">Add Group</span></td>
                                    <td style="width:4%;"></td>
                                    <td style="width:30%;"></td>
                                </tr>
                            </table>
                        </div>
                    </div>

                </div>
                <!--<div>-->
                    <DWAskUserFiltersComponent *ngIf="item && item.IsGroup == true" [SelectedFiltersDataSource]="item.FilterItems"></DWAskUserFiltersComponent>
                <!--</div>-->

            </div> 
        </td>
        <!--<td><div></div></td>-->

    </tr>
    <tr>
        <td>
            <table>
                <tr *ngFor="let item of SelectedFiltersDataSource; let i=index;">
                    <td style="float:left;margin-left:15px;" *ngIf="item && item.FilterType == 'Ask User' && (!item.IsGroup) && (item.ParentDataTypeCode == 'DateTime' || item.ParentDataTypeCode == 'Date')">
                        <div style="width:700px;">
                            <table style="height:30px;">
                                <tr style="height:30px;" class="MyFilterItem">
                                    <td *ngIf="item.IsMandatoryFilter == true" style="height: 22px;width:7px;">
                                        <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                    </td>
                                    <td *ngIf="!item.IsMandatoryFilter" style="height: 22px;width:7px;">
                                        <div style="width: 7px; height: 7px; background: transparent; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                    </td>
                                    <td style="width: 150px;max-width:150px;" class="TextTrimming" [title]="item.DisplayName.replace('[', '').replace(']','')">
                                        <span>{{item.DisplayName.replace('[', '').replace(']','')}}</span>
                                    </td>
                                    <td style="width:7px;">
                                        <div style="width:7px;"></div>
                                    </td>
                                    <td style="width: 106px;max-width:106px;" class="TextTrimming" [title]="item.DisplayName.replace('[', '').replace(']','')">
                                        <ComboBox style="width:130px;" [ItemsSource]="Operators" [SelectedItem]="item.Operation" [Binding]="'Name'" (SelectedItemChanged)="OperationValueChanged($event,item)"></ComboBox>
                                    </td>
                                    <td style="width:7px;">
                                        <div style="width:7px;"></div>
                                    </td>
                                    <td style="width:180px;" [ngSwitch]="item.ParentDataTypeCode">

                                        <!--Date-->
                                        <div *ngSwitchCase="'Date'">
                                            <div style="width:180px;">

                                                <DWDate [ObjectFieldName]="item.Code"
                                                        [DataContext]="item"
                                                        [Operation]="item.Operation.Code"
                                                        (ValueChanged)="item.onTextChange($event)"
                                                        [SelectedValue]="item.TextValue">
                                                </DWDate>

                                            </div>
                                        </div>
                                        <div *ngSwitchCase="'DateTime'">
                                            <div style="width:180px;">

                                                <DWDate [ObjectFieldName]="item.Code"
                                                        [DataContext]="item"
                                                        [Operation]="item.Operation.Code"
                                                        (ValueChanged)="item.onTextChange($event)"
                                                        [SelectedValue]="item.TextValue">
                                                </DWDate>

                                            </div>
                                        </div>



                                    </td>
                                    <td style="width:180px;" [ngSwitch]="item.ParentDataTypeCode">

                                        <!--Date-->
                                        <div *ngSwitchCase="'Date'">

                                            <div style="width:162px;">

                                                <DateSampleComponent *ngIf="item.TextValue" [ShowSampleDateCommand]="item.ShowSampleDateCommand">
                                                </DateSampleComponent>

                                            </div>
                                        </div>
                                        <div *ngSwitchCase="'DateTime'">

                                            <div style="width:162px;">

                                                <DateSampleComponent *ngIf="item.TextValue" [ShowSampleDateCommand]="item.ShowSampleDateCommand">
                                                </DateSampleComponent>

                                            </div>
                                        </div>




                                    </td>

                                </tr>
                            </table>
                            <!-------------------------->

                            <DWAskUserFiltersComponent [SelectedFiltersDataSource]="item.FilterItems" [IsDateFilter]="true"></DWAskUserFiltersComponent>

                        </div>

                    </td>

                </tr>
            </table>
        </td>
        
    </tr>
     

</table>
