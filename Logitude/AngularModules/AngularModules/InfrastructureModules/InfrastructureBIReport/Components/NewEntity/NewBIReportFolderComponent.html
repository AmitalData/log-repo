<table *ngIf="IsReady">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>

                <!-- Name -->
                <tr class="FormFieldRow">
                    <td style="width:110px;">
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:260px;">
                        <LogTextBox id="{{'BIFolderName' | IdGeneratorPipe}}" [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height:5px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Description -->
                <tr class="FormFieldRow">
                    <td style="vertical-align:top;">
                        <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:260px;height:85px;">
                                    <div class="MediaFill">
                                        <LogTextBox id="{{'BIFolderDescription' | IdGeneratorPipe}}" [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Share With -->
                <tr class="FormFieldRow" *ngIf="IsShareFolderAvailable">
                    <td style="padding-left:10px;"><label>Share with:</label></td>
                    <td style="width:150px;">
                        <ComboBox [ItemsSource]="ShareValuesList" [SelectedItem]="ShareValueSelectedItem" [Binding]="'Name'" (SelectedItemChanged)="ShareValueSelectedItem = $event"></ComboBox>
                    </td>
                    <td style="width:30px;" *ngIf="IsChooseUsersVisible">
                        <Hyperlink style="margin-left:5px;" (click)="ChooseUsers()" [FontSize]="12" [Text]="'Choose'"></Hyperlink>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height:10px;" *ngIf="IsShareFolderAvailable">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height:200px;" *ngIf="IsShareFolderAvailable">
                    <td>
                        <div class="MediaFill">
                            <div class="SimpleGridView" style="width:450px;" *ngIf="IsChooseUsersVisible">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr>
                                            <td style="width:200px; min-width:200px; max-width:200px; text-align:center">Email</td>
                                            <td style="width:200px; min-width:200px; max-width:200px; text-align:center ">Name</td>
                                            <td class="LastChild">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody">
                                    <table>
                                        <tr class="SimpleGridViewRow" *ngFor="let item of SharedWithUsersItemsSource">
                                            <td class="GridViewCell" style="width: 200px; min-width: 200px; max-width: 200px;">
                                                {{item.Email}}
                                            </td>

                                            <td class="GridViewCell" style="width: 200px; min-width: 200px; max-width: 200px;">
                                                {{item.Name}}
                                            </td>

                                            <td class="CellTools">
                                                <span class="CellSeparator"></span>
                                                <IconButton [Name]="'Delete'" [IsSmall]="true" [Left]="3" (click)="DeleteUser(item)"></IconButton>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="3">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'CancelButton' | IdGeneratorPipe}}" class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'OKButton' | IdGeneratorPipe}}" class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
