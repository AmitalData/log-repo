<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr *ngIf="IsTenantZero" style="height:2px;">
        <td>
            <table>
                <tr>
                    <td style="width:3px;">
                        <RadioButton [Name]="'NewBIReport'" [IsChecked]="IsNewBIReport" (Checked)="SetNewBIReport(true)"></RadioButton>
                    </td>
                    <td style="width:40px;">
                        <label style="margin-left: 7px;">New</label>
                    </td>
                    <td style="width:3px;">
                        <RadioButton [Name]="'CopyBIReport'" [IsChecked]="!IsNewBIReport" (Checked)="SetNewBIReport(false)"></RadioButton>
                    </td>
                    <td style="width:50px;">
                        <label style="margin-left: 7px;">Copy From All Tenants</label>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr *ngIf="IsNewBIReport">
        <td>
            <table>

                <!-- Name -->
                <tr class="FormFieldRow">
                    <td style="width:110px;">
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:260px;">
                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Description -->
                <tr class="FormFieldRow">
                    <td style="vertical-align:top;">
                        <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:260px;height:85px;">
                                    <div class="MediaFill">
                                        <LogTextBox [ObjectFieldName]="'Description'" [Text]="Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" [HideColumns]="true"></LogTextBox>
                                    </div>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- TypeCode-->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'TypeCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'TypeCode'"
                                [SelectedValue]="TypeCode"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'BIReportsType'" [HideColumns]="true">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- BIReportFolderId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BIReportFolderId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'BIReportFolderId'"
                                [SelectedValue]="BIReportFolderId"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'BIReportFolder'" [HideColumns]="true">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- DWQueryId -->
                <!--<tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'DWQueryId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <table>
                            <tr>
                                <td *ngIf="IsNewQuery" style="width: 57px;">
                                    <button class="Button" (click)="ShowQueryBuilderClicked()">Build Query</button>
                                </td>
                                <td *ngIf="!IsNewQuery" s style="width: 57px;">
                                    <button class="Button" (click)="ShowQueryBuilderClicked()">Edit Query</button>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>-->

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr *ngIf="!IsNewBIReport">
        <td>
            <table>

                <!-- Name -->
                <tr class="FormFieldRow">
                    <td style="width:120px;">
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width:200px;">
                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- BIReportFolderId -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BIReportFolderId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'BIReportFolderId'"
                                [SelectedValue]="BIReportFolderId"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'BIReportFolder'" [HideColumns]="true">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Tenant -->
                <tr class="FormFieldRow">
                    <td style="width:120px;">
                        <LogLabel [NoObjectField]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Tenant'"></LogLabel>
                    </td>

                    <td style="width:200px;">
                        <LogTextBox [ObjectFieldName]="'Tenant'" [Text]="Tenant" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" (ValueChanged)="OnTextChangeEvent($event)" [InputType]="'integer'" [HideColumns]="true"></LogTextBox>
                        <!--<SearchTextBox [ObjectTableName]="ObjectTableName" [PlaceHolder]="'Tenant 0'" (SearchTextChangeEvent)="OnSearchTextChangeEvent($event)"></SearchTextBox>-->
                    </td>
                    <td colspan="2">
                        <div></div>
                    </td>
                </tr>

                <!-- Tenant -->
                <!--<tr class="FormFieldRow">
                    <td>
                        <LogLabel [NoObjectField]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Tenant'"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'Tenant'"
                                [SelectedValue]="BIReportTenant"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Tenant'"
                                [SelectedValuePath]="BIReportTenant"
                                [HideColumns]="true">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>-->

                <!-- Grid -->
                <tr>
                    <td colspan="4">
                        <div class="FillParent">
                            <div class="ScrollViewer">
                                <div class="ScrollContent">
                                    <table>
                                        <tr>
                                            <td style="height: 100%;">
                                                <div style="height: 100%; width: 100%; position: relative;">


                                                    <logitude-grid [rows]="items"
                                                                   [dataSource]="DataSource"
                                                                   [SearchFieldchangeevent]="textFieldChangeEvent"
                                                                   [columns]="columns"
                                                                   [autoLoad]="true"
                                                                   (rowSelectedEvent)="onRowSelected($event)"
                                                                   [IsCustomTemplate]="true">
                                                    </logitude-grid>


                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
