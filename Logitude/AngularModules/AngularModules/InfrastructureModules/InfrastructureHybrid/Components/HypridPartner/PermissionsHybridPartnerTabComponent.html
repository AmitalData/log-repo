
<style>
    .MessageText {
        white-space: normal;
        word-wrap: break-word;
    }

    .InactiveDevice {
        opacity: 0.5;
    }
</style>

<table style="width:350px">
    <tr style="height:40%">
        <td>
            <div class="TabHolder">
                <table>
                    <tr class="TabTitleRow">
                        <td>
                            <table>
                                <tr>
                                    <td style="color:#54B6FF">Allowed Hybrid Partners</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div class="MediaFill">
                                <div class="SimpleGridView">
                                    <div class="SimpleGridViewHeader">
                                        <table>
                                            <tr>
                                                <td style="width: 150px; min-width: 150px; max-width: 150px;">Tenant</td>
                                                <td style="width: 150px; min-width: 150px; max-width: 150px;">Name</td>

                                            </tr>
                                        </table>
                                    </div>

                                    <div class="SimpleGridViewBody" >
                                        <table>
                                            <tr style="background-color:#ECF3F7" class="SimpleGridViewRow" *ngFor="let item of AllowdHybridPartnerLists">
                                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px;">
                                                    {{item.PartnerTenant}}
                                                </td>

                                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px;">
                                                    {{item.Name}}
                                                </td>






                                            </tr>

                                            <tr>
                                                <td colspan="2">
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height:10%"><td></td></tr>

    <tr style="height:40%">

                            </table>

                    </tr>

                    <tr>
                        <td>

                                <div class="SimpleGridView">
                                    <div class="SimpleGridViewHeader">
                                        <table>
                                            <tr>
                                                <td style="width: 150px; min-width: 150px; max-width: 150px;">Tenant</td>

                                            </tr>
                                        </table>
                                    </div>
