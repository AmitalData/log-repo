
<style>
    .FormFieldRow {
        height: 30px;
    }
</style>

    <table >

            <td>

                    <tr>

                                                    <tr style="height:25px">
                                                        <td>
                                                            <div style="background-color:#EDEDED;height:25px;border-top:2px solid #E4E3E1;border-bottom:2px solid #E4E3E1;border-top-Right-radius:6px; border-top-left-radius:6px;color:black">
                                                                <table>
                                                                    <tr>
                                                                        <td style="width:300px">
                                                                            <p style="font-size:11px;margin-left:5px;margin-top:1px;color:#1B90CB">General</p>
                                                                        </td>
                                                                    </tr>
                                                                </table>
                                                            </div>
                                                        </td>
                                                    </tr>

                                                    <tr style="height:3px">
                                                        <td>
                                                            <div></div>
                                                        </td>

                                                        <td style="vertical-align:top; left:5px;">

                                                            <table>
                                                                <tr>
                                                                    <td style="width:45%">
                                                                        <table>

                                                                            <tr class="FormFieldRow">

                                                                                    <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>

                                                                                </td>
                                                                                <td style="width:150px;">
                                                                                    <div style="height: 100%; width: 100%;">
                                                                                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="DataContext.Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                    </div>
                                                                                </td>
                                                                            </tr>

                                                                            <tr style="height:5px"><td colspan="2"></td></tr>

                                                                                <td style="width:60px;vertical-align:top">
                                                                                    <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                                                                <td style="width:150px;height:50px">
                                                                                    <LogTextBox [ObjectFieldName]="'Description'" [Text]="DataContext.Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr style="height:5px"><td colspan="2"></td></tr>
                                                                            <tr class="FormFieldRow">
                                                                                <td style="width:60px;vertical-align:central">
                                                                                    <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>


                                                                                <td style="width:150px;">
                                                                                    <CheckBox [IsChecked]="EntityPM.InActive" (Checked)="EntityPM.InActive = $event"></CheckBox>
                                                                                </td>
                                                                            </tr>

                                                                            <tr>
                                                                                <td></td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>

                                                                    <td style="width:5%;">
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="width:50%">

                                                                        <table *ngIf="Type == 'Task'">

                                                                            <tr class="FormFieldRow">
                                                                                <td style="width:80px;vertical-align:central">
                                                                                    <LogLabel [ObjectFieldName]="'ServiceClassName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                                                                <td style="width:150px;">
                                                                                    <div style="height: 100%; width: 100%;">
                                                                                        <LogTextBox [ObjectFieldName]="'ServiceClassName'" [Text]="DataContext.ServiceClassName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                    </div>
                                                                                </td>
                                                                            </tr>

                                                                            <tr>
                                                                                <td></td>
                                                                            </tr>
                                                                        </table>

                                                                        <table *ngIf="Type == 'FTP'">

                                                                            <tr class="FormFieldRow">
                                                                                <td style="width:80px;vertical-align:central">
                                                                                    <LogLabel [Text]="'Host'" [DataContext]="DataContext"></LogLabel>

                                                                                <td style="width:150px;">
                                                                                    <div style="height: 100%; width: 100%;">
                                                                                        <LogTextBox [ObjectFieldName]="'Host'" [Text]="DataContext.Host" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>

                                                                            </tr>

                                                             

                                                                            <tr>
                                                                                <td></td>

                                                                        </table>

                                                <table style="border :none;">

                                                    <tr style="height:25px">
                                                        <td>
                                                            <div style="background-color:#EDEDED;height:25px;border-top:2px solid #E4E3E1;border-bottom:2px solid #E4E3E1;border-top-Right-radius:6px; border-top-left-radius:6px;color:black">

                                                                    <tr>

                                                                    </tr>
                                                                </table>

                                                        </td>
                                                    </tr>

                                                                <tr style="height:1px;">
                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width:10px"></td>
                                                                                <td style="width:105px">
                                                                                    <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsOneTime == true" (Checked)="SetTigger('O')" [Text]="'One Time'" [Top]="5"></RadioButton>


                                                                                </td>
                                                                                <td style="width:80px">

                                                                                    <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsDaily == true" (Checked)="SetTigger('D')" [Text]="'Daily'" [Top]="5"></RadioButton>


                                                                                </td>
                                                                                <td style="width:80px">

                                                                                    <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsWeekly == true" (Checked)="SetTigger('W')" [Text]="'Weekly'" [Top]="5"></RadioButton>

                                                                                </td>
                                                                                <td style="width:80px">
                                                                                    <RadioButton style="display:inline" [Name]="'TriggerRadio'" [IsChecked]="IsMonthly == true" (Checked)="SetTigger('M')" [Text]="'Monthly'" [Top]="5"></RadioButton>
                                                                                </td>

                                                                            </tr>
                                                                        </table>

                                                                </tr>
                                                                <tr style="height:5px"></tr>

                                                                                <tr class="FormFieldRow">

                                                                                    <td style="width:220px;">
                                                                                        <table>
                                                                                            <tr>
                                                                                                <td style="width:90px">

                                                                                                <td style="width: 5px;">
                                                                                                    <div></div>
                                                                                                </td>

                                                                                                <td>
                                                                                                    <LogDatePicker [ObjectFieldName]="'StartDateTime'" [SelectedDateValue]="DataContext.StartDateTime" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [InputType]="'time'"></LogDatePicker>
                                                                                                </td>
                                                                                            </tr>
                                                                                        </table>
                                                                                    </td>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>


                                                                                <tr class="FormFieldRow">
                                                                                    <td>
                                                                                        <LogLabel [ObjectFieldName]="'RepeatInMinutes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                    </td>

                                                                                    <td>
                                                                                        <LogTextBox [ObjectFieldName]="'RepeatInMinutes'" [Text]="DataContext.RepeatInMinutes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>

                                                                                <tr style="height:1px;" *ngIf="DataContext.TriggerType == 'W'">

                                                                                        <LogLabel [NoObjectField]="true" [ObjectFieldName]="'Days'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Days'"></LogLabel>
                                                                                    </td>

                                                                                    <td colspan="2">
                                                                                        <table>
                                                                                            <tr style="height:28px;">
                                                                                                <td>
                                                                                                    <table>
                                                                                                        <tr>
                                                                                                            <td style="width:20px;">

                                                                                                            </td>

                                                                                                                <label class="Label">Sunday</label>
                                                                                                            </td>

                                                                                                            <td style="width:10px;">
                                                                                                                <div></div>
                                                                                                            </td>

                                                                                                            <td style="width:20px;">
                                                                                                                <LogCheckBox [ObjectFieldName]="'Monday'" [Checked]="DataContext.Monday" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                                            </td>
                                                                                                            <td style="width:70px;">
                                                                                                                <label class="Label">Monday</label>
                                                                                                            </td>

                                                                                                            <td style="width:10px;">
                                                                                                                <div></div>
                                                                                                            </td>

                                                                                                            <td style="width:20px;">
                                                                                                                <LogCheckBox [ObjectFieldName]="'Tuesday'" [Checked]="DataContext.Tuesday" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                                            </td>
                                                                                                            <td style="width:70px;">
                                                                                                                <label class="Label">Tuesday</label>
                                                                                                            </td>

                                                                                                            <td style="width:10px;">
                                                                                                                <div></div>

                                                                                                            </td>

                                                                                                            <td>
                                                                                                                <div></div>
                                                                                                            </td>
                                                                                                        </tr>
                                                                                                    </table>
                                                                                                </td>
                                                                                            </tr>

                                                                                            <tr style="height:28px;">
                                                                                                <td>
                                                                                                    <table>
                                                                                                        <tr>
                                                                                                            <td style="width:20px;">
                                                                                                                <LogCheckBox [ObjectFieldName]="'Thursday'" [Checked]="DataContext.Thursday" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                                            </td>
                                                                                                            <td style="width:70px;">
                                                                                                                <label class="Label">Thursday</label>
                                                                                                            </td>

                                                                                                            <td style="width:10px;">
                                                                                                                <div></div>
                                                                                                            </td>

                                                                                                            <td style="width:20px;">
                                                                                                                <LogCheckBox [ObjectFieldName]="'Friday'" [Checked]="DataContext.Friday" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                                            </td>
                                                                                                            <td style="width:70px;">
                                                                                                                <label class="Label">Friday</label>
                                                                                                            </td>

                                                                                                            <td style="width:10px;">
                                                                                                                <div></div>
                                                                                                            </td>

                                                                                                            <td style="width:20px;">
                                                                                                                <LogCheckBox [ObjectFieldName]="'Satarday'" [Checked]="DataContext.Satarday" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                                            </td>
                                                                                                            <td style="width:70px;">
                                                                                                                <label class="Label">Satarday</label>
                                                                                                            </td>

                                                                                                            <td>
                                                                                                                <div></div>
                                                                                                            </td>
                                                                                                        </tr>
                                                                                                    </table>
                                                                                                </td>
                                                                                            </tr>
                                                                                        </table>
                                                                                    </td>
                                                                                </tr>

                                                                                <tr class="FormFieldRow" *ngIf="DataContext.TriggerType == 'M'">
                                                                                    <td>
                                                                                        <LogLabel [ObjectFieldName]="'MonthlyDay'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'Day Number'"></LogLabel>
                                                                                    </td>

                                                                                    <td>
                                                                                        <LogTextBox [ObjectFieldName]="'MonthlyDay'" [Text]="DataContext.MonthlyDay" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                                    </td>

                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>

                                                                                <tr>
                                                                                    <td>
                                                                                        <div></div>
                                                                                    </td>
                                                                                </tr>
                                                                            </table>
                                                                        </div>
                                                                    </td>
                                                                </tr>

                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>

                                            </div>
                                        </td>
                                    </tr>

                                    <tr><td></td></tr>
                                </table>
                            </ScrollViewer>
                        </td>
                    </tr>


                </table>
            </td>
       </tr>

        <!--Close And Cancel Area-->
        <tr style="height: 32px;">
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="OKButtonClicked()">Ok</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

</table>
