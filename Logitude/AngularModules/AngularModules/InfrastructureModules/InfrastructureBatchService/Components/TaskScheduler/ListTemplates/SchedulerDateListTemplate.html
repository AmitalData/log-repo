<style>
    .Link:hover {
        cursor: pointer;
        color: #1C59FC;
    }

    .Link {
        cursor: pointer;
        font-size: 13px;
        color: #0094ff;
        height: 21px;
        white-space: nowrap;
    }
</style>
<div *ngIf="fieldName != 'Duration' && fieldName != 'Log'" style="text-indent: 10px; overflow: hidden; text-overflow: ellipsis;">{{dateValue | DateTimePipe:'DTL12NW'}}</div>
<div *ngIf="fieldName == 'Duration'" style="text-indent: 10px; overflow: hidden; text-overflow: ellipsis; text-align: center;">{{dateValue}}</div>
<table *ngIf="fieldName == 'Log'" style="text-indent: 10px; overflow: hidden; text-overflow: ellipsis;">
    <tr>
        <td style="min-width:10px;width:10px;max-width:50px">
            <img *ngIf="Type == 'Warning'" style="width: 18px;height:18px;margin-bottom: 5px;float:left;" src="./Images/WarningIcon.png" />
            <img *ngIf="Type == 'Exception'" style="width: 18px;height:18px;margin-bottom: 5px;float:left;" src="./Images/Error.png" />
            <img *ngIf="Type == 'Info'" style="width: 18px;height:18px;margin-bottom: 5px;float:left;" src="./Images/Info.png" />

        </td>
        <td>
            <div style="text-indent: 10px; overflow: hidden; text-overflow: ellipsis;">{{dateValue}}</div>
        </td>
        <!--<td style="min-width:10px;width:10px;max-width:50px">
            <a class="Link" style="font-size:13px;margin-right:5px;" (click)="ShowFullLog()">Add</a>
        </td>-->
    </tr>
</table>
<div *ngIf="fieldName == 'ViewLog'" style="min-width:10px;width:10px;max-width:50px">
    <!--<a class="Link" style="font-size:13px;margin-right:5px;" (click)="ShowFullLog()">Show Details</a>-->

    <a class="Link" style="font-size:13px;margin-right:5px;" (click)="ViewLogFile()">View Log File</a>
</div>
<div *ngIf="fieldName == 'MyDuration'" style="min-width:10px;width:90px;max-width:90px;text-align:center;">
    <span *ngIf="rowData['Duration'] <= 60">{{rowData['Duration'] | NumbersPipe:'N2'}} sec</span>
    <span *ngIf="rowData['Duration'] > 60">{{rowData['Duration']/60 | NumbersPipe:'N2'}} mins</span>
</div>
<div *ngIf="fieldName == 'Status'" style="min-width:10px;width:90px;max-width:90px;text-align:center;">
    {{rowData['Status']}}
</div>

<div *ngIf="fieldName == 'InActive'" style="width: 90px; min-width: 90px; max-width: 90px;text-align:center;">
    <img class="CenterCenter" src="./Images/GreenTick.png" *ngIf="rowData['InActive']" />
</div>

<div *ngIf="fieldName == 'EditTaskButton'" style="width:30px; min-width:30px; max-width:30px;">
    <div class="MediaFill">
        <div class="MediaFillRelative">

            <div class="LeftCenter" style="height: 20px; left: 1px;">
                <span class="CellSeparator"></span>
            </div>

            <div class="CenterCenter" style="width: 18px; height: 18px;">
                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditTaskClicked()"></IconButton>
            </div>
        </div>
    </div>
</div>
