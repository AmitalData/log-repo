<!-- History -->
<table *ngIf="IsHistoryGridVsisible">
    <tr>
        <td>
            <div class="MediaFill">
                <div style="background-color:white;border-radius: 0 0 0 7px;">
                    <logitude-grid GridWidth="100%" GridHeight="100%" [ObjectTable]="'TaskSchedulerHistory'" [IgnoreRowHoverVisibilityQueryName]="true" [ShowArrow]="true" [dataSource]="DataSource" [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                   [columns]="columns" [autoLoad]="true" [CustomColumnsReady]="CustomColumnsReady" [IsCustomTemplate]="true">
                    </logitude-grid>
                </div>
            </div>

        </td>
    </tr>
</table>
