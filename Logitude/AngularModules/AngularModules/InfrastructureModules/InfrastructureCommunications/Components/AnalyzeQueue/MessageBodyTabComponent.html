<style type="text/css">
    .TextArea {
        padding: 2px;
        padding-left: 5px;
        font-size: 16px;
        color: Black;
        background: #EBEBEB;
        overflow: auto;
        outline: none;
        -webkit-box-shadow: none;
        -moz-box-shadow: none;
        box-shadow: none;
    }
</style>

<div class="TabHolder">
    <table>
        <tr style="height:32px;">
            <td style="width:1400px;">
                <div style="width:50px;max-width:50px;">
                    <button class="Button" (click)="ViewXMLClicked()">View</button>
                </div>
            </td>
            <td>
                <div></div>
            </td>
        </tr>

        <tr style="height:10px;">
            <td>
                <div></div>
            </td>
        </tr>

        <tr style="height:400px;">
            <td style="width:1700px;">
                <div class="MediaFill" style="background:#EBEBEB;">
                    <textarea class="TextArea"
                              [(ngModel)]="MessageBodyString"
                              [readonly]="true"></textarea>
                </div>
            </td>
            <td>
                <div></div>
            </td>
        </tr>

        <tr>
            <td>
                <div></div>
            </td>
        </tr>
    </table>
</div>
