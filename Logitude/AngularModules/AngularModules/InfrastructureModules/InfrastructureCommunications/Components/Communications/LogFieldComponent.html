<style>
    .CustomMultiLinesText {
        width: 800px;
        max-height: 700px;
        height: 300px;
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        font-size: 16px;
        border: 1px solid LightGray;
        border-radius: 3px;
        background-color: #EBEBEB;
    }

        .CustomMultiLinesText:hover {
            border: 1px solid #3BB3E2;
        }
</style>










    <table style="height:100%;width:100%">

        <tr><td style="text-align:left;height:10px"><div></div></td> </tr>

        
        <tr><td style="text-align:left;height:10px"><div style="float:right">{{'CommunicationLog.O.Logs' | TextCodeTranslationPipe}}</div></td> </tr>

        <tr style="vertical-align:top;">
            <td style="margin-left:5px;" colspan="4">

                
                <input type="text" [id]="_inputLogId" [(ngModel)]="_Log" style="width:20px;position: absolute; left: -1000px; top: -1000px;"  >
                <div>
                    <button class="Button" title="Copy to clipboard" (click)="CopyLog2Clipboard()" style="width:50px;float:left;margin-left:100px;">{{'General.Copy' | TextCodeTranslationPipe}}</button>
                    <div style="margin:10px;vertical-align:top;" class="CustomMultiLinesText">

                        <textarea  *ngIf="UseTextarea"  class="NotesTextArea" [readonly]="true">{{_Log}}</textarea>

                        <div *ngIf="!UseTextarea" style="font-family:'Lucida Sans Unicode'; white-space: normal; word-wrap: break-word;;margin-top:5px;margin-bottom:5px; margin-left:10px;margin-right:10px;font-size:15px">
                            {{_Log}}
                        </div>
                    </div>

                </div>


            </td>
        </tr>


        <tr><td style="text-align:left;height:10px"><div></div></td> </tr>

        <tr style="height:100%"><td><div></div></td> </tr>
    </table>
