<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table>

                <tr class="FormFieldRow">
                    <td style="width:120px;">
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:260px;">
                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" ></LogTextBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox [ObjectFieldName]="'LocalName'" [Text]="LocalName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" ></LogTextBox>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'BusinessRoleId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'BusinessRoleId'"
                                [ObjectTableName]="ObjectTableName"
                                [SelectedValue]="BusinessRoleId"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'BusinessRole'"
                                ></LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'ObjectTableId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov [ObjectFieldName]="'ObjectTableId'"
                                [ObjectTableName]="ObjectTableName"
                                [SelectedValue]="ObjectTableId"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'ObjectTable'"
                                
                                [DependencyFilter3Value]="true"></LogLov>
                    </td>
                     <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td style="vertical-align:top;">
                        <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td colspan="2">
                        <table>
                            <tr>
                                <td style="width:260px;height:85px;">
                                    <div class="MediaFill">
                                        <LogTextBox [ObjectFieldName]="'Notes'" [Text]="Notes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true" ></LogTextBox>
                                    </div>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
