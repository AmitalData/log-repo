
<table>
    <tr>
        <td>
            <table *ngIf="IsReady" style="margin-top:-35px">
                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr style="height: 90px; ">
                    <td>
                        <table>
                            <tr><td></td></tr>
                            <tr style="height: 70px;">
                                <td style="width: 60px; height:70px">
                                    <img src="./Images/Customization/CustomizationIcon.png" class="CenterCenter" style="height: 60px; width: 60px" />
                                </td>
                                <td>


                                    <table style="width: 130px; height:50px">
                                        <tr>
                                            <td><label style="padding-left: 10px; color: rgb(96, 96, 96); font-size: 17px; font-weight: bold; font-family: system-ui ">Customization</label></td>

                                        </tr>
                                        <tr>
                                            <td>
                                                <div>
                                                    <label style="padding-left: 10px; color: rgb(96, 96, 96); font-size: 22px; font-weight: bold; font-family: system-ui ">Objects Manager</label>
                                                    <!--<img src="./Images/Customization/4U.png" class="CenterCenter" style="height:30px; left:103px; top:2px" />-->
                                                </div>
                                            </td>

                                        </tr>


                                    </table>
                                </td>
                                <td><div></div></td>
                                <td style="width:300px; text-align: end;">
                                    <div style="display:inline-flex">
                                        <SearchBox style="width:140px; margin-right:5px" [attr.data-cy]="'CustomizationSearch'" [SearchText]="SearchText" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                                        <button *ngIf="IsEnabledCreatingCustomObjects" class="Button" style="width:140px; margin-left:5px" (click)="NewCustomObjectClicked()">New Custom Object</button>

                                    </div>

                                </td>

                            </tr>
                            <tr>
                                <td></td>
                                <td>
                                    <label style="padding-left:10px">{{NumberOfItems}} Items</label>
                                </td>
                            </tr>
                            <tr><td></td></tr>
                        </table>
                    </td>
                </tr>


                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <div class="SimpleGridView">
                                <div class="SimpleGridViewHeader">

                                    <table>
                                        <tr>
                                            <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                <div></div>
                                            </td>

                                            <td style="width: 245px; min-width: 245px; max-width:245px">Name</td>
                                            <td style="width: 80px; min-width: 80px; max-width: 80px;">Is Custom</td>
                                            <td class="LastChild"><div></div></td>
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody">
                                    <table>

                                        <!-- Buisness Records -->
                                        <tr *ngIf="ItemsSource1.length > 0" style="height: 25px; min-height: 25px; max-height: 25px; background: #E4E4E4;">
                                            <td style="height: 25px;">
                                                <table style="height: 25px;">
                                                    <tr style="height: 2px;">
                                                        <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>

                                                        <td>
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <img src="./Images/CellIcons/Arrowup.png" class="CenterCenter" style="cursor: pointer;" [hidden]="ItemsSource1Hidden" (click)="ItemsSource1Hidden = true" />
                                                            <img src="./Images/CellIcons/Arrowdown.png" class="CenterCenter" style="cursor: pointer;" [hidden]="!ItemsSource1Hidden" (click)="ItemsSource1Hidden = false" />
                                                        </td>

                                                        <td>Buisness Records</td>
                                                    </tr>

                                                    <tr style="height: 2px;">
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                        <td>
                                                            <div [hidden]="ItemsSource1Hidden" style="height: 2px; width: 100%; border-top: 1px solid white; border-bottom: 1px solid #848484;"></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                        <tr class="SimpleGridViewRow CellBorder RowHover RowSelected" (click)="OpenCustomizationEditComponent(item)" *ngFor="let item of ItemsSource1" [class.RowSelected]="item === selectedRow" [hidden]="ItemsSource1Hidden || item == null">
                                            <td style="height: 25px;">
                                                <table style="height: 25px;">
                                                    <tr>

                                                        <td style="width: 25px; min-width: 25px; max-width: 25px; background: #E4E4E4; border-bottom: 1px solid #E4E4E4;">
                                                            <table style="height: 25px;">
                                                                <tr>
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="width: 1px; height: 100%;">
                                                                        <div class="Stretch" style="background: white;"></div>
                                                                    </td>

                                                                    <td style="width: 1px; height: 100%;">
                                                                        <div class="Stretch" style="background: #848484;"></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>

                                                        <!-- Default Text -->
                                                        <td [attr.data-cy]="item.DefaultText" class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText">
                                                                {{(item.DefaultText).slice(0,((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.DefaultText).slice(((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.DefaultText).slice((((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}
                                                            </label>

                                                            <label *ngIf="!SearchText">{{item.DefaultText}}</label>
                                                        </td>

                                                        <!-- IsCustom -->
                                                        <td class="GridViewCell" style="width: 80px; min-width: 80px; max-width:80px; padding-left:10px">
                                                            <img *ngIf="IsCustomObjectTableById(item.ObjectTableID)" src="./Images/CheckBoxIcon.png" style="width:15px; height:12px" />
                                                        </td>
                                                        
                                                        <td class="LastChild">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <!-- Master Data -->
                                        <tr *ngIf="ItemsSource2.length > 0" style="height: 25px; min-height: 25px; max-height: 25px; background: #E4E4E4;">
                                            <td style="height: 25px;">
                                                <table style="height: 25px;">
                                                    <tr style="height: 2px;">
                                                        <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>
                                                        <td>
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <img src="./Images/CellIcons/Arrowup.png" class="CenterCenter" style="cursor: pointer;" [hidden]="ItemsSource2Hidden" (click)="ItemsSource2Hidden = true" />
                                                            <img src="./Images/CellIcons/Arrowdown.png" class="CenterCenter" style="cursor: pointer;" [hidden]="!ItemsSource2Hidden" (click)="ItemsSource2Hidden = false" />
                                                        </td>

                                                        <td>Master Data</td>
                                                    </tr>

                                                    <tr style="height: 2px;">
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                        <td>
                                                            <div [hidden]="ItemsSource2Hidden" style="height: 2px; width: 100%; border-top: 1px solid white; border-bottom: 1px solid #848484;"></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                        <tr class="SimpleGridViewRow CellBorder RowHover RowSelected" (click)="OpenCustomizationEditComponent(item)" *ngFor="let item of ItemsSource2" [class.RowSelected]="item === selectedRow" [hidden]="ItemsSource2Hidden || item == null">
                                            <td style="height: 25px;">
                                                <table style="height: 25px;">
                                                    <tr>

                                                        <td style="width: 25px; min-width: 25px; max-width: 25px; background: #E4E4E4; border-bottom: 1px solid #E4E4E4;">
                                                            <table style="height: 25px;">
                                                                <tr>
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="width: 1px; height: 100%;">
                                                                        <div class="Stretch" style="background: white;"></div>
                                                                    </td>

                                                                    <td style="width: 1px; height: 100%;">
                                                                        <div class="Stretch" style="background: #848484;"></div>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>

                                                        <!-- Default Text -->
                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText">
                                                                {{(item.DefaultText).slice(0,((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.DefaultText).slice(((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.DefaultText).slice((((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}
                                                            </label>

                                                            <label *ngIf="!SearchText">{{item.DefaultText}}</label>
                                                        </td>

                                                        <!-- IsCustom -->
                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px; padding-left:10px">
                                                            <img *ngIf="IsCustomObjectTableById(item.ObjectTableID)" src="./Images/CheckBoxIcon.png" style="width:15px; height:12px" />
                                                        </td>

                                                        <td class="LastChild">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <tr style="height: 1px;" *ngIf="ItemsSource1.length > 0 || ItemsSource2.length > 0">
                                            <td>
                                                <div style="height:1px; width: 100%; background: #848484; margin-top: -1px;"></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td><div></div></td>
                    <td style="width: 57px;">
                        <button class="RedButton" (click)="CloseClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
