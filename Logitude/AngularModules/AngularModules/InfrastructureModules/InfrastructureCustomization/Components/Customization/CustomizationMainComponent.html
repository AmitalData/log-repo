
<table>
    <tr>
        <td>
            <table>
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 200px;">
                                    <SearchBox [SearchText]="SearchText" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                                            </td>

                                            <td style="width: 245px; min-width: 245px; max-width:245px">Default Name</td>
                                            <td style="width: 245px; min-width: 245px; max-width:245px">Display Label (Singluar)</td>
                                            <td style="width: 245px; min-width: 245px; max-width:245px">Display Label (Plural)</td>
                                            <td class="LastChild"><div></div></td>
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody">
                                    <table>

                                        <!-- Buisness Records -->
                                        <tr *ngIf="ItemsSource1.length > 0" style="height: 25px; min-height: 25px; max-height: 25px; background: #E4E4E4;">

                                                <table style="height: 25px;">
                                                    <tr style="height: 2px;">
                                                        <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>

                                                        <td>
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <img src="./Images/CellIcons/Arrowup.png" class="CenterCenter" style="cursor: pointer;" [hidden]="ItemsSource1Hidden" (click)="ItemsSource1Hidden = true" />
                                                            <img src="./Images/CellIcons/Arrowdown.png" class="CenterCenter" style="cursor: pointer;" [hidden]="!ItemsSource1Hidden" (click)="ItemsSource1Hidden = false" />

                                                        <td>Buisness Records</td>

                                                        <td style="width: 25px; min-width: 25px; max-width: 25px; background: #E4E4E4; border-bottom: 1px solid #E4E4E4;">

                                                                <tr>
                                                                    <td>
                                                                        <div></div>
                                                                    </td>

                                                                    <td style="width: 1px; height: 100%;">
                                                                        <div class="Stretch" style="background: white;"></div>
                                                                    </td>

                                                                    <td style="width: 1px; height: 100%;">

                                                                </tr>
                                                            </table>

                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">

                                                        </td>

                                                        <!-- Singluar -->
                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText">
                                                                {{(item.TranslatedText).slice(0,((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.TranslatedText).slice(((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.TranslatedText).slice((((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}
                                                            </label>

                                                            <label *ngIf="!SearchText">{{item.TranslatedText}}</label>
                                                        </td>

                                                        <!-- Plural -->
                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText && item.TranslatedTextPlural">
                                                                {{(item.TranslatedTextPlural).slice(0,((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.TranslatedTextPlural).slice(((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.TranslatedTextPlural).slice((((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}
                                                            </label>

                                                            <label *ngIf="!SearchText">{{item.TranslatedTextPlural}}</label>
                                                        </td>

                                                        <td class="LastChild">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <tr *ngIf="ItemsSource2.length > 0" style="height: 25px; min-height: 25px; max-height: 25px; background: #E4E4E4;">

                                                <table style="height: 25px;">
                                                    <tr style="height: 2px;">
                                                        <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>
                                                        <td>
                                                            <div style="height: 2px; width: 100%; border-top: 1px solid #848484; border-bottom: 1px solid white;"></div>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <img src="./Images/CellIcons/Arrowup.png" class="CenterCenter" style="cursor: pointer;" [hidden]="ItemsSource2Hidden" (click)="ItemsSource2Hidden = true" />
                                                            <img src="./Images/CellIcons/Arrowdown.png" class="CenterCenter" style="cursor: pointer;" [hidden]="!ItemsSource2Hidden" (click)="ItemsSource2Hidden = false" />

                                                    </tr>

                                                    <tr style="height: 2px;">
                                                        <td>
                                                            <div></div>

                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                        <tr class="SimpleGridViewRow CellBorder RowHover RowSelected" (click)="Selecting(item)" *ngFor="let item of ItemsSource2" [class.RowSelected]="item === selectedRow" [hidden]="ItemsSource2Hidden || item == null">
                                            <td style="height: 25px;">
                                                <table style="height: 25px;">
                                                    <tr>

                                                        <td style="width: 25px; min-width: 25px; max-width: 25px; background: #E4E4E4; border-bottom: 1px solid #E4E4E4;">

                                                                </tr>
                                                            </table>
                                                        </td>

                                                        <!-- Default Text -->
                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText">
                                                                {{(item.DefaultText).slice(0,((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.DefaultText).slice(((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.DefaultText).slice((((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}
                                                            </label>

                                                            <label *ngIf="!SearchText">{{item.DefaultText}}</label>
                                                        </td>

                                                        <!-- Singluar -->
                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText">
                                                                {{(item.TranslatedText).slice(0,((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.TranslatedText).slice(((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.TranslatedText).slice((((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}

                                                        </td>

                                                        <td class="GridViewCell" style="width: 245px; min-width: 245px; max-width:245px">
                                                            <label *ngIf="SearchText && item.TranslatedTextPlural">
                                                                {{(item.TranslatedTextPlural).slice(0,((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.TranslatedTextPlural).slice(((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.TranslatedTextPlural).slice((((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.TranslatedTextPlural).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}

                                                        <td class="LastChild">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <tr style="height: 1px;" *ngIf="ItemsSource1.length > 0 || ItemsSource2.length > 0">
                                            <td>
                                                <div style="height:1px; width: 100%; background: #848484; margin-top: -1px;"></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td style="width: 57px;">
                        <button class="Button" [disabled]="!IsButtonEnabled" (click)="StandardFieldsClicked()">Standard Fields</button>
                    </td>

                    <td style="width: 5px;"><div></div></td>

                    <td style="width: 57px;">
                        <button class="Button" [disabled]="!IsButtonEnabled" (click)="LabelsClicked()">Labels</button>
                    </td>

                    <td style="width: 5px;"><div></div></td>

                    <td style="width: 57px;">
                        <button [attr.data-cy]="'ScreenLayoutId'" class="Button" [disabled]="!IsButtonEnabled" (click)="ScreensLayoutClicked()">Screens Layout</button>
                    </td>

                    <td style="width: 5px;"><div></div></td>

                    <td style="width: 57px;">
                        
                        <button [attr.data-cy]="'CustomFieldtId'" class="Button" [disabled]="!IsButtonEnabled && !IsRulesCustomizationEnabled" (click)="CustomFieldsClicked()">Custom Fields</button>
                    </td>

                    <td style="width: 5px;"><div></div></td>

                    <td style="width: 57px;">
                        <button class="Button" [disabled]="!IsButtonEnabled" (click)="RulesClicked()">Rules</button>
                    </td>

                    <td><div></div></td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="CloseClicked()">Close</button>
                    </td>
                </tr>
            </table>
