<style>
    .Body {
        overflow: auto;
    }
</style>

<table>
    <tr style="height:30px">
        <td>
            <div *ngIf="SupportSubEntity" style="width: 100%; margin-left: 670px ">
                <button *ngIf="IsEnabledCreatingSubCustomObjects" style="width:100px; position:absolute; bottom:7px; right:0px" class="Button" (click)="AddNewSubEntity()">New Sub Object</button>
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div class="SimpleGridView">
                <div class="SimpleGridViewHeader">

                    <table>
                        <tr>

                            <td style="width: 250px; min-width: 250px; max-width: 250px;">Object Name</td>
                            <td style="width: 80px; min-width: 80px; max-width: 80px;">Is Custom</td>
                            <td style="width: 60px; min-width: 60px; max-width: 60px;"></td>
                            <td class="LastChild" style="min-width: 20px;">
                                <div></div>
                            </td>

                        </tr>
                    </table>
                </div>


                <div class="SimpleGridViewBody">
                    <table>
                        <tr class="SimpleGridViewRow RowHover" *ngFor="let item of SubEntitiesList">

                            <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width: 250px; position: relative;">
                                <div style="display:inline-block">

                                    <span>{{GetItemNameAfterTranslation(item)}}</span>

                                </div>
                            </td>

                            <td class="GridViewCell" style="width: 80px; min-width: 80px; max-width: 80px; position: relative;">
                                <img *ngIf="item.IsCustom" src="./Images/CheckBoxIcon.png" class="CenterCenter" style="width:15px; height:12px"/>
                            </td>

                            <td class="GridViewCell" style="width: 60px; min-width: 60px; max-width: 60px; position: relative;" >
                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="ShowCustomizationEditComponentForSubEntity(item)"></IconButton>
                            </td>


                            <td class="LastChild" style="min-width: 20px;">
                                <div></div>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </div>

            </div>
        </td>
    </tr>
</table>
