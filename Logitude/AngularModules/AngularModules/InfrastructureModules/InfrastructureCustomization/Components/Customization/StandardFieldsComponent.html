
<table>
    <tr>
        <td>
            <table>
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 250px;">
                                    <SearchBox (TextChanged)="SearchTextChanged($event)" [SearchText]="SearchText"></SearchBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <logitude-edit-grid [UseVirtuallization]="true" GridWidth="100%" GridHeight="100%" [ItemSource]="SelectedTabItem.FieldsItemsSource">
                                <!-- Default Name -->
                                <log-column [width]="'250'" [header]="'Default Name'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                <label *ngIf="SearchText">
                                                    {{(item.DefaultText).slice(0,((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length))}}<font style="color:red;">{{(item.DefaultText).slice(((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length), (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}</font>{{(item.DefaultText).slice((((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(),'~' + SearchText.toLowerCase() + '~').split('~')[0].length) + (((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1]) ? ((item.DefaultText).toLowerCase().replace(SearchText.toLowerCase(), '~' + SearchText.toLowerCase() + '~').split('~')[1].length) : 0)))}}
                                                </label>

                                                <label *ngIf="!SearchText">{{item.DefaultText}}</label>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Display Name -->
                                <log-column [width]="'250'" [header]="'Display Name'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                {{item.FullLabelText}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Data Type-->
                                <log-column [width]="'215'" [header]="'Data Type'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                {{item.DataTypeText}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!--Requiered-->
                                <log-column [width]="'70'" [header]="'Requiered'" [Alignment]="'center'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'center'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                <img *ngIf="item.IsRequiered" width="18" height="18" style="vertical-align: middle;" src="./Images/Icons/MiniGreenTick.png" />
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!--Edited-->
                                <log-column [width]="'45'" [header]="'Edited'" [Alignment]="'center'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'center'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                <img *ngIf="item.IsEdited" width="18" height="18" style="vertical-align: middle;" src="./Images/Icons/MiniGreenTick.png" />
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!--Help Text-->
                                <log-column [width]="'65'" [header]="'Help Text'" [Alignment]="'center'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'center'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                <HelpIcon *ngIf="item.HelpTextText" [Text]="item.HelpTextText"></HelpIcon>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Tools Button -->
                                <log-column [width]="'30'" [Editable]="true" [Alignment]="'right'">
                                    <ng-template let-item>
                                        <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                            <div style="width: 100%; height: 100%; position: relative;">
                                                <div class="LeftCenter" style="height: 20px;">
                                                    <table>
                                                        <tr>
                                                            <td style="width: 4px;">
                                                                <span class="CellSeparator"></span>
                                                            </td>
                                                            <td>
                                                                <IconButton [Name]="'Edit'" [IsSmall]="true" [Left]="3" (click)="SelectedTabItem.EditField(item)"></IconButton>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>

                    </td>
                </tr>
            </table>
        </td>
    </tr>

    
</table>
