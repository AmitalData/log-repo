<style>
	.Disabled {
		opacity: 0.5;
		pointer-events: none;
	}
</style>
<table>
	<tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
		<td>
			<ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
		</td>
	</tr>
	<tr style="height:100%">
		<td>
			<table>
				<tr style="height:10px">
					<td></td>
				</tr>
				<tr style="height: 30px;">
					<td>
						<table>
							<tr>
								<td style="width:10px"></td>
								<td style="height: 22px; width: 100px;">


									<table style="table-layout: fixed;">
										<tr>
											<td style="width:10px; vertical-align: middle;">
												<div *ngIf="!Name" style="width: 10px;">
													<div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>

												</div>
											</td>
											<td class="TextTrimming" style="text-align: left; vertical-align:middle;">
												<label *ngIf="Name" class="Label" style="color:#6E7172">Screen Name</label>
												<label *ngIf="!Name" class="Label" style="color:red">Screen Name</label>
											</td>
										</tr>
									</table>


								</td>



								<td style="height: 22px; width: 250px; ">

									<div style="width: 250px;">

										<LogTextBox [ObjectFieldName]="'Name'" [DataContext]="DataContext" [Text]="Name"></LogTextBox>
									</div>
								</td>
								<td></td>
							</tr>
							<tr style="height:15px">
								<td></td>
							</tr>
							<tr *ngIf="IsCustomObjectTable">
								<td style="width:10px"></td>
								<td style="height: 22px; width: 100px;">
									<table style="table-layout: fixed;">
										<tr>
											<td style="width:10px; vertical-align: middle;">
												<div *ngIf="!SelectedScreenType" style="width: 10px;">
													<div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
												</div>
											</td>
											<td class="TextTrimming" style="text-align: left; vertical-align:middle;">
												<label *ngIf="SelectedScreenType" class="Label" style="color:#6E7172">Type</label>
												<label *ngIf="!SelectedScreenType" class="Label" style="color:red">Type</label>
											</td>
										</tr>
									</table>
								</td>
								<td style="height: 22px; width: 214px; ">
									<div style="width: 214px;">
										<ComboBox [IsDisabled]="IsEditMode"
												  (SelectedItemChanged)="SelectedScreenType = $event"
												  [SelectedItem]="SelectedScreenType" [ItemsSource]="ScreenTypes"
												  [Binding]="'Name'"></ComboBox>
									</div>
								</td>
								<td></td>
							</tr>
							<tr *ngIf="IsSubEntity && IsCustomObjectTable" style="height:15px">
								<td></td>
							</tr>
							<tr>
								<td style="width:10px"></td>
								<td style="height: 22px; width: 100px;">
									<label *ngIf="IsEditMode" class="Label" style="color:#6E7172;padding-left: 10px;">Inactive</label>
								</td>



								<td style="height: 22px; width: 250px; ">

									<div style="width: 250px;">
										<CheckBox  *ngIf="IsEditMode" [IsChecked]="Inactive" (Checked)="Inactive = $event"></CheckBox>
									</div>
								</td>
								<td></td>
							</tr>
						</table>
					</td>

				</tr>

<tr>
	<td></td>
</tr>

				<tr style="height: 32px;">
					<td style="vertical-align: bottom">
						<table style="height: 22px;">
							<tr>
								<td>
									<div></div>
								</td>

								<td style="width: 57px;">
									<div>
										<button class="Button" (click)="CloseButtonClicked()">Cancel</button>
									</div>
								</td>

								<td style="width: 5px;">
									<div></div>
								</td>

								<td style="width: 57px;">
									<button class="RedButton" (click)="SaveButtonClicked()">OK</button>
								</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
