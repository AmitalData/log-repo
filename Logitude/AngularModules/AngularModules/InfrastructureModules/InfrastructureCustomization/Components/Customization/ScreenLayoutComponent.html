
<style>
    .SimpleGridViewRow:hover {
        color: black;
        cursor: pointer;
        border: 1px solid #85CBED;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#FFFFFF', endColorstr='#DDE8F5' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
    }

    .Selected {
        background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
    }

        .Selected:hover {
            background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
            background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
            background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        }

    .ObjectField {
        height: 60px;
        width: 100%;
        background-color: gainsboro;
        margin-bottom: 3px;
    }

        .ObjectField:hover {
            height: 60px;
            width: 100%;
            background-color: gray;
            margin-bottom: 3px;
        }

         .MyObjectField {
        height: 60px;
        width: 97%;
        background-color: gainsboro;
        margin: 3px;
    }

        .MyObjectField:hover {
            height: 60px;
            width: 97%;
            background-color: gray;
            margin: 3px;
        }
</style>
<table style="padding:10px">

    <tr>
        <td>
            <table>
                <tr>
                    <td style="width:206px;border:solid 1px silver">
                        <div class="SimpleGridView MediaFillAbsolute">
                            <div class="SimpleGridViewHeader">
                                <table>
                                    <tr>
                                        <td style="width: 198px; min-width: 198px; max-width: 198px;">Screen Name</td>
                                        <td class="LastChild">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody">
                                <table>
                                    <tr class="SimpleGridViewRow" *ngFor="let item of TableScreensCollection" (click)="SelectionChanged(item)" [class.Selected]="item == SelectedItem">
                                        <td class="GridViewCell" style="width: 198px; min-width: 198px; max-width: 198px;">
                                            {{item.Name}}
                                        </td>
                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <!--<div class="MediaFillAbsolute">
                            <ul>
                                <li class="DefaultMenuItem" *ngFor="let item of ListBoxItemSource" (click)="SelectionChanged(item)" [class.SelectedMenuItem]="item === SelectedItem" [class.DisabledTabItem]="item.IsDisabled == true">
                                    <div class="TextTrimming">{{item.Name}}</div>
                                </li>
                            </ul>
                        </div>-->


                    </td>
                    <td style="width:2px"></td>
                    <td>
                        <table style="border:solid 1px silver">
                            <tr>
                                <td  attr.data-cy="{{'Column_' +column}}" style="width:216px;border-right:dashed 1px silver;vertical-align: top;" *ngFor="let item of ScreenRows; let column = index" >
                                    <div (drop)="onMyDrop($event,item,column)" dropzone="true" (dragover)="onMyDragEnter($event)" style="position:absolute;top:0;bottom:0;left:0;right:0;overflow:auto;">
                                        <div name="listItem" class="MyObjectField PreventSelect" *ngFor="let item1 of item.ObjectFieldPMs; let row = index" draggable="true" (dragstart)="OnScreenFieldDragStart($event,item1)" [attr.row]="row" [attr.column]="column">
                                            <table>
                                                <tr>
                                                    <td>
                                                        <table>
                                                            <tr style="height:1px;">
                                                                <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                    {{item1 != null ? item1.FullNameTextCodeDefaultText : ''}}
                                                                </td>
                                                            </tr>
                                                            <tr style="height:1px;">
                                                                <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                    ({{item1 != null ? item1.PMPropertyPath : ''}})
                                                                </td>
                                                            </tr>
                                                            <tr>
                                                                <td></td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                    <td style="width:30px;height:60px;">
                                                        <img class="DeleteButton RightCenter" style="right: 4px;cursor: pointer;" src="Images/RedX.png" (click)="OnDeleteField(item1)" />
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </table>
                    </td>
                    <td style="width:2px"></td>
                    <td style="width:216px;border:solid 1px silver;">
                        <div class="SimpleGridView MediaFillAbsolute">
                            <div class="SimpleGridViewHeader" style="height:50px;">
                                <table>
                                    <tr>
                                        <td style="width: 198px; min-width: 198px; max-width: 198px;">Available Screen Fields</td>
                                    </tr>
                                    <tr>
                                        <td style="width:200px;padding-right: 4px;">
                                            <SearchBox [UseTimer]="true" [Watermark]="'Search'" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody" style="top:50px;">

                                <div class="ObjectField PreventSelect" draggable="true" (dragstart)="OnObjectFieldDragStart($event,item)" *ngFor="let item of banckStackFields">
                                    <table>
                                        <tr>
                                            <td>
                                                <div attr.data-cy="{{'Column_' + item.FieldName}}">
                                                    <table>
                                                        <tr style="height:1px;">
                                                            <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                {{item != null ? item.FullNameTextCodeDefaultText : ''}}
                                                            </td>
                                                        </tr>
                                                        <tr style="height:1px;">
                                                            <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                ({{item != null ? item.PMPropertyPath : ''}})
                                                            </td>
                                                        </tr>
                                                        <tr>
                                                            <td></td>
                                                        </tr>
                                                    </table>
                                                    </div>
                                            </td>
                                            <!--<td style="width:30px;height:60px;">
                                                <img class="DeleteButton RightCenter" style="right: 4px;" src="Images/RedX.png" (click)="OnDeleteValue()" />
                                            </td>-->
                                        </tr>
                                    </table>
                                </div>

                            </div>
                        </div>
                    </td>

                </tr>
            </table>

        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelClicked()">Cancel</button>
                    </td>

                    <td style="width:5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
