
<style>
    .SimpleGridViewRow:hover {
        color: black;
        cursor: pointer;
        border: 1px solid #85CBED;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#FFFFFF', endColorstr='#DDE8F5' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
    }

    .Selected {
        background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
    }

        .Selected:hover {
            background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
            background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
            background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        }

    .ObjectField {
        height: 60px;
        width: 100%;
        background-color: gainsboro;
        margin-bottom: 3px;
    }

        .ObjectField:hover {
            height: 60px;
            width: 100%;
            background-color: gray;
            margin-bottom: 3px;
        }

    .MyObjectField {
        height: 60px;
        width: 97%;
        background-color: gainsboro;
        margin: 3px;
    }

        .MyObjectField:hover {
            height: 60px;
            width: 97%;
            background-color: gray;
            margin: 3px;
        }
    .text-with-dots {
        display: inline-block;
        max-width: 80px;
        min-width: 80px;
        width: 80px;
        white-space: nowrap;
        overflow: hidden !important;
        text-overflow: ellipsis;
    }

    .Header-with-dots {
        display: inline-block;
        max-width: 400px;
        white-space: nowrap;
        overflow: hidden !important;
        text-overflow: ellipsis;
    }
</style>
<table style="padding:10px">

    <tr>
        <td>
            <table>

                <tr *ngIf="(!IsObjectTableFilterEnabled || IsTabsCustomizationEnabled)" style="height: 40px;">

                    <td *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" ></td>
                    <td *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
                        <table style="height:1px;">
                            <tr style="height:1px;">
                                <td>
                                    <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                                </td>
                                <td></td>
                            </tr>
                        </table>
                    </td>
                    <td colspan="5" style="text-align: right; height: 40px;">
                        <button class="Button" style="width: 100px;float:right;margin-right:5px" (click)="NewScreenButtonClicked()">New Screen</button>
                    </td>

                </tr>
                <tr>
                    <!-- Left Sidebar -->
                    <td style="width: 155px; border: solid 1px silver">
                        <div class="SimpleGridView MediaFillAbsolute">
                            <div class="SimpleGridViewHeader">
                                <table>
                                    <tr>
                                        <td style="width: 135px; min-width: 135px; max-width: 135px; ">Screen Name</td>

                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody">
                                <table>
                                    <tr class="SimpleGridViewRow" *ngFor="let item of TableScreensCollection" (click)="SelectionChanged(item)" [class.Selected]="item == SelectedItem">
                                        <td [attr.data-cy]="item.Name">

                                            <div [attr.title]="item.Name" *ngIf="!item.Inactive" class="GridViewCell" style="width: 135px; min-width: 135px; max-width: 135px; font-size: 11px ">
                                                {{item.Name}}
                                            </div>

                                            <div [attr.title]="item.Name" class="text-with-dots GridViewCell" *ngIf="item.Inactive" style="font-size: 11px">
                                                {{item.Name}}
                                            </div>

                                            <div *ngIf="item.Inactive" style="display:inline-block;font-size:11px;font-style:italic;color:gray;text-align:left;vertical-align:central;display:inline">
                                                (inactive)
                                            </div>

                                        </td>

                                    </tr>
                                </table>
                            </div>
                        </div>


                    </td>

                    <!-- Content -->
                    <td *ngIf="!IsMuiltSectionScreen && !IsGridScreen" style="border-top: 1px solid silver;border-bottom: 1px solid silver;">
                        <div class="LocationDirective" LocationDirective Code="ClASSIC"> </div>
                    </td>

                    <td *ngIf="IsMuiltSectionScreen || IsGridScreen" style=" border: 1px solid silver;">

                        <div *ngIf="(!IsObjectTableFilterEnabled || IsTabsCustomizationEnabled)" class="screen-designer-header">
                            <div class="title">
                                <span [attr.title]="SelectedItem.Name" class="Header-with-dots">{{SelectedItem.Name || 'Screen'}}</span>
                                <IconButton style="top:-1px" [Name]="'edit'" (click)="EditSelectedScreen()"></IconButton>
                            </div>
                            <div *ngIf="IsSubEntity && !IsGridScreen" class="buttons" style="width:45px;">
                                <ToggleButton [Title]="'New'" [DropDownWidth]="110" [DropDownHeight]="IsEnabledAddingSummarySection()?'52':'30'">
                                    <ToggleButtonItem [Text]="'Section'" (click)="NewSectionButtonClick('Standard')" style="height:100%; width: 100%;"></ToggleButtonItem>
                                    <ToggleButtonItem [hidden]="!IsEnabledAddingSummarySection()" [Text]="'Summary'" (click)="NewSectionButtonClick('Summary')" style="height:100%; width: 100%"></ToggleButtonItem>
                                </ToggleButton>
                            </div>
                            <div *ngIf="!IsSubEntity && !IsGridScreen && IsReferenceTypeCustomObject" class="buttons">
                                <button class="Button" (click)="NewSectionButtonClick('Standard')">New Section</button>
                            </div>
                            <div *ngIf="!IsSubEntity && !IsGridScreen && !IsReferenceTypeCustomObject" class="buttons" style="width:45px;">
                                <ToggleButton [Title]="'New'" [DropDownWidth]="110" [DropDownHeight]="IsEnabledCreatingSubCustomObjects?'52':'30'">
                                    <ToggleButtonItem [Text]="'Section'" (click)="NewSectionButtonClick('Standard')" style="height:100%; width: 100%;"></ToggleButtonItem>
                                    <ToggleButtonItem [hidden]="!IsEnabledCreatingSubCustomObjects" [Text]="'Child Objects Grids'" (click)="NewSectionButtonClick('Grid')" style="height:100%; width: 100%"></ToggleButtonItem>
                                </ToggleButton>
                            </div>
                        </div>
                        <div *ngIf="!IsGridScreen" class="component-wrapper">
                            <div class="LocationDirective" LocationDirective Code="LIGHTENING"> </div>
                        </div>
                        <div *ngIf="IsGridScreen" class="component-wrapper">
                            <div class="LocationDirective" LocationDirective Code="Grid"> </div>
                        </div>

                    </td>

                    <td style="width:2px;border-top: 1px solid silver;border-bottom: 1px solid silver;"></td>

                    <!-- Right Sidebar -->
                    <td *ngIf="!IsGridScreen" style="width:216px;border:solid 1px silver;">
                        <div class="SimpleGridView MediaFillAbsolute">
                            <div class="SimpleGridViewHeader" style="height:75px;">
                                <table>


                                    <tr>
                                        <td style="width: 198px; min-width: 198px; max-width: 198px;">Available Screen Fields</td>
                                    </tr>
                                    <tr>
                                        <td style="width:200px;padding-right: 4px;">
                                            <SearchBox [attr.data-cy]="'Available Screen Fields Search'" [UseTimer]="true" [Watermark]="'Search'" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody" style="top: 75px;">

                                <div [style.background-color]="IsLineSpaceField(item.DataTypeCode) ? 'darkgrey':''" class="ObjectField PreventSelect" draggable="true" (dragstart)="OnObjectFieldDragStart($event,item)" *ngFor="let item of banckStackFields">
                                    <table>
                                        <tr>
                                            <td>
                                                <div attr.data-cy="{{'Column_ ' + item.FieldName}}">
                                                    <table>
                                                        <tr *ngIf="!IsLineSpaceField(item.DataTypeCode)" style="height:1px;">
                                                            <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px; font-size: 11px">
                                                                {{item != null ? item.FullNameTextCodeDefaultText : ''}}
                                                            </td>
                                                        </tr>
                                                        <tr *ngIf="!IsLineSpaceField(item.DataTypeCode)" style="height:1px;">
                                                            <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px; ">
                                                                <span style="font-size: 11px"> ({{item != null ? item.PMPropertyPath : ''}})</span>
                                                            </td>
                                                        </tr>

                                                        <tr *ngIf="IsLineSpaceField(item.DataTypeCode)" style="height:1px;text-align:center">
                                                            <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                <span style="color: ivory; font-style: italic; font-size: 11px">Insert Space</span>
                                                            </td>
                                                        </tr>


                                                        <tr>
                                                            <td></td>
                                                        </tr>
                                                    </table>
                                                </div>
                                            </td>

                                        </tr>
                                    </table>
                                </div>

                            </div>
                        </div>
                    </td>

                </tr>
            </table>

        </td>
    </tr>

</table>
