<table>
    <tr>
        <td>
            <div class="grid">
                <div class="toolbar">
                    <button class="Button" (click)="NewTabClicked()" float-end>New Tab</button>
                </div>
                <div class="content">
                    <logitude-edit-grid *ngIf="orderedTabs"
                                         GridWidth="100%"
                                        GridHeight="100%"
                                        [ItemSource]="orderedTabs"
                                        [IsReadOnly]="GridDisabled">


                        <!-- Code -->
                        <log-column [header]="'Code'" [width]="'100'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming" text-start>
                                        <span>{{ item.Code }}</span>
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <!-- Name -->
                        <log-column [header]="'Tab Name'" [width]="'200'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming" text-start>
                                        <span>{{ item.Name || item.TabNameTextCodeDefaultText }}</span>
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                         <!-- Screen Name -->
                         <log-column [header]="'Screen'" [width]="'150'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming" text-start>
                                        <span>{{item.ScreenName}}</span>
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                         <!-- Type -->
                         <log-column [header]="'Type'" [width]="'150'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <div class="TextTrimming" text-start>
                                        <span>{{item.Type||'Predefined'}}</span>
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                         <!-- Buttons -->
                        <log-column [width]="'100'" [visibility]="'visibile'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template [IgnoreMods]="true">

                                    <div class="ag-hover-buttons">

                                        <IconButton float-start [Name]="'arrow-up'" [IsSmall]="true" (click)="DecOrder(item)"
                                            [disabled]="item.IndexOrder == 0" style="display: block; margin-left:3px; margin-top:4px;"></IconButton>

                                        <IconButton float-start [Name]="'arrow-down'" [IsSmall]="true" (click)="IncOrder(item)"
                                            [disabled]="item.IndexOrder == this.tabs.length-1" style="display: block; margin-left:3px; margin-top:4px;">
                                        </IconButton>


                                        <IconButton float-start [Name]="'edit'" [IsSmall]="true" (click)="EditTab(item)"
                                            style="display: block; margin-left:3px; margin-top:4px;"></IconButton>


                                        <IconButton *ngIf="item.Type == 'Custom'" float-start [Name]="'delete'" [IsSmall]="true" (click)="DeleteTab(item)"
                                            style="display: block; margin-left:3px; margin-top:4px;"></IconButton>
                                    </div>

                                </log-cell-template>
                            </ng-template>
                        </log-column>

                    </logitude-edit-grid>

                </div>
            </div>
        </td>
    </tr>
</table>
