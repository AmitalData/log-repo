<style>
    .Disabled{
        opacity:0.5;
        pointer-events:none;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table>
                <tr style="height: 30px;">
                    <td>
                        <table>
                            <tr>
                                <td style="height: 22px;width:60px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Code
                                    </label>
                                </td>
                                <td style="height: 22px;width:300px;" [class.Disabled]="isNew == false">
                                    <LogTextBox [ObjectFieldName]="'PickListCode'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                                <td style="padding-right: 2px;float:right;vertical-align:central;margin-top: 8px;">
                                    <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddPickListItem()"></IconButton>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td style="height: 100%;">
                        <div class="MediaFill" style="overflow-x: hidden;">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="PickListsList">

                                <!-- Value -->
                                <log-column [header]="'Value'" [width]="'200'" [Alignment]="'left'">
                                    <log-cell-template template="let item" #logcelltemplate >
                                        <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                            <span>{{item.Value}}</span>
                                        </div>
                                        <div *ngIf="logcelltemplate.IsEditMode">
                                            <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Value'" [DataContext]="item"
                                                        [Text]="item.Value" [ObjectTableName]="'CustomPickList'" [HideColumns]="true"></LogTextBox>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- Buttons -->
                                <log-column [width]="'30'" [Alignment]="'left'">
                                    <log-cell-template [IgnoreMods]="true" template="let item">
                                        <IconButton [Name]="'delete'" [IsSmall]="true"
                                                    style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="DeleteLine(item)"></IconButton>
                                    </log-cell-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td>
                        <div>
                            <button class="RedButton" (click)="SaveChanges()" style="width:57px;float: right;margin-left: 7px;margin-right: 7px;">OK</button>
                            <button class="Button" (click)="CancelClicked()" style="width:57px;float: right;">Close</button>
                        </div> 
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
