<table>
    <tr>
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width:150px;vertical-align:top;">
                        <LogLabel Text="Object Field" [DataContext]="DataContext" style="vertical-align:top"></LogLabel>
                    </td>
                    <td>
                        <!--<ComboBox [ItemsSource]="ObjectFields" [Binding]="'FullNameTextCodeDefaultText'" [SelectedValue]="SelectedObjectFieldId" [SelectedValuePath]="'Id'" (SelectedItemChanged)="onSelectedItemChanged($event)"></ComboBox>-->
                        <LogLov [ObjectFieldName]="'SelectedObjectFieldId'"
                                [QueryFilterItems]="FieldsLovQueryFilters"
                                [ObjectTableName]="'ObjectField'"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'ObjectField'"
                                [NoValidation]="true"
                                [IsFreeText]="true"
                                [SelectedValue]="DataContext.SelectedObjectFieldId"
                                [HideColumns]="true"
                                [HideLastColumn]="true"
                                [DisplayMemberPath]="'FieldName'"
                                (SelectedItemChanged)="onSelectedItemChanged($event)">
                        </LogLov>

                    </td>
                    <td style="width:90px;vertical-align:top;">
                        <!--<button class="Button" style="width:70px;margin-left:5px;" (click)="onSelectFieldTagClicked()">Select Field</button>-->
                    </td>
                  
                </tr>
                <tr class="FormFieldRow" *ngIf="SelectedObjectField && HideLov=== false && (SelectedObjectField.DataTypeCode == 'LookUp' || SelectedObjectField.DataTypeCode == 'PickList')">
                    <td style="width:150px;vertical-align:top;">
                        <LogLabel [Text]="SelectedObjectField.ObjectTable_LookUpTableName" [DataContext]="DataContext" style="vertical-align:top"></LogLabel>
                    </td>
                    <td>
                        <LogLov  *ngIf="SelectedObjectField.DataTypeCode == 'LookUp'"
                                
                                [SelectedValue]="DataContext[Expression]"
                                [DataContext]="DataContext"
                                [LookUpTableName]="SelectedObjectField.ObjectTable_LookUpTableName"
                                (ValueChanged)="SelectedLOVTextChange($event)"
                                [HideLastColumn] ="true">
                        </LogLov>


                        <div *ngIf="SelectedObjectField.DataTypeCode == 'PickList'">
                            <PickList [ObjectFieldName]="'Expression'"
                                      [ObjectTableName]="SelectedObjectField.ObjectTableName"
                                      [DataContext]="DataContext"
                                      [NoValidation]="true"
                                      (ValueChanged)="SelectedLOVTextChange($event)"
                                      [HideLastColumn] ="true"
                                      [PickListCode] ="SelectedObjectField.CustomPickListCode">
                            </PickList>
                        </div>
                    </td>

                    <td style="width:90px;vertical-align:top;"></td>
 
                </tr>
                <tr class="FormFieldRow">
                    <td style="width:150px;vertical-align:top;">
                        <LogLabel Text="Value Expression" [DataContext]="DataContext" style="vertical-align:top"></LogLabel>
                    </td>
                    <td colspan="2">
                        <table>
                            <tr style="height:100px">
                                <td>
                                    <textarea [attr.id]="RuleFieldTXTAreaId" type="text" [(ngModel)]="DataContext.Expression" style="height: 100%; max-height:unset;vertical-align:top;margin-right:10px;"></textarea>
                                </td>
                                <td style="width:90px;vertical-align:top;">
                                    <button class="Button" style="width:70px;margin-left:5px;" (click)="onAddFieldTagClicked()">Add Field</button>
                                </td>
                            </tr>
                        </table>
                    </td>


                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 30px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
