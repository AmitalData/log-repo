
<table  *ngIf="IsResourcesReady">
    <tr>
        <td>
            <table>
                

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <div class="SimpleGridView">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr>
                                            <td style="width: 250px; min-width:250px; max-width:250px;">Name</td>
                                            <td style="width: 250px; min-width:250px; max-width:250px;">Date</td>
                                            <td style="width: 215px; min-width:215px; max-width:215px;">User</td>
                                             
                                            <td style="width: 100%; min-width: 100%"></td>

                                            <!--<td class="LastChild">
        <div></div>
    </td>-->
                                        </tr>
                                    </table>
                                </div>
                                <div *ngIf="IsNoDataFound" class="NoDataTextStyle" style="text-align:center;margin-top:50px;vertical-align:middle">No Data Found</div>
                                <div *ngIf="!IsNoDataFound" class="SimpleGridViewBody" >
                                    <table>
                                        <tr class="SimpleGridViewRow" *ngFor="let item of RuleUpdateHistoryItems">
                                            <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width:250px">
                                                {{item.EventName}}
                                            </td>

                                            <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width:250px">
                                                {{item.CreateDate  | DateTimeToDatePipe}}
                                            </td>

                                            <td class="GridViewCell" style="width: 215px; min-width: 215px; max-width:215px">
                                                {{item.CreatedBy}}
                                            </td>
                                            <td class="CellStretched" style="width:100%;min-width:100%;max-width:100%;position:relative">
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="4">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </td>
                </tr>
            </table>
        </td>

       
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td><div></div></td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseClicked()">Close</button>
                    </td>

                    
                </tr>
            </table>
        </td>
    </tr>
</table>
