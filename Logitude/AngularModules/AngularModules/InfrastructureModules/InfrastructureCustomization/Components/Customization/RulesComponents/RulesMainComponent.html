
<table  *ngIf="IsResourcesReady">
    <tr>
        <td>
            <table>
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 250px;">
                                    <SearchBox  [attr.data-cy]="'SearchRulesMainComponent'" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                                <td>
                                   
                                    <div class="AddButton" (click)="OnAddRule()" style="display:inline;width:18px;float:right;margin-right:10px">
                                        <IconButton [Name]="'Add'" [IsSmall]="true" style="display: block;margin-left:7px"></IconButton>
                                    </div>

                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <div class="SimpleGridView">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr>
                                            <td style="width: 250px; min-width:250px; max-width:250px;">Name</td>
                                            <td style="width: 250px; min-width:250px; max-width:250px;">Code</td>
                                            <td style="width: 215px; min-width:215px; max-width:215px;">Type</td>
                                            <td style="width: 70px; min-width:70px; max-width:70px;">In Active</td>
                                            <td style="width: 30px; min-width:30px; max-width:30px;"></td>
                                            <td style="width: 90px; min-width:90px; max-width:90px;"></td>
                                            <td style="width: 80px; min-width:80px; max-width:80px;"></td>
                                            <td style="width: 100%; min-width: 100%"></td>

                                            <!--<td class="LastChild">
        <div></div>
    </td>-->
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody">
                                    <table>
                                        <tr class="SimpleGridViewRow" *ngFor="let item of TableRulesItems">
                                            <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width:250px">
                                                {{item.Name}}
                                            </td>

                                            <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width:250px">
                                                {{item.RuleCode}}
                                            </td>

                                            <td class="GridViewCell" style="width: 215px; min-width: 215px; max-width:215px">
                                                {{item.RuleTypeName}}
                                            </td>

                                            <td class="GridViewCell" style="width: 70px; min-width: 70px; max-width:70px">
                                                <img *ngIf="item.InActive" width="18" height="18" style="vertical-align: middle;" src="./Images/Icons/MiniGreenTick.png" />
                                            </td>


                                            <td class="GridViewCell" style="width:30px; min-width:30px; max-width:30px;">
                                                <div  class="EditButton" (click)="OnEditRule(item)" style="display:inline;width:18px;">
                                                    <IconButton [DataCy]="'EditRule'"  [Name]="'Edit'" [IsSmall]="true" style="        display: block;
        margin-left: 7px
    "></IconButton>
                                                </div>

                                            </td>

                                            <td class="GridViewCell" style=" width: 90px; min-width: 90px; max-width: 90px;">
                                                <div>
                                                    <button style="display: inline-block;width:80px;" class="Button" (click)="OnViewRuleHistory(item)">View History</button>
                                                </div>
                                            </td>

                                            <td class="GridViewCell" style="        width: 80px;
                                                  min-width: 80px;
                                                    max-width: 80px;">
                                                <div *ngIf="item.IsCreatedFromSystemRule">
                                                    <button style="display: inline-block;width:70px;" class="Button" (click)="OnRestoreRule(item)">Restore</button>
                                                </div>
                                            </td>



                                            <td class="CellStretched" style="width:100%;min-width:100%;max-width:100%;position:relative">
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="8">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
