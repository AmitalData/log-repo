<style>
    .Disabled {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
			<ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
    <tr style="height:100%">
        <td>
            <table>
                <tr style="height:10px">
                    <td></td>
                </tr>
                <tr style="height: 30px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px"></td>
                                <td style="height: 22px; width: 150px;">
                                    <table style="table-layout: fixed;">
                                        <tr>
                                            <td style="width:10px; vertical-align: middle;">
                                                <div *ngIf="!Name" style="width: 10px;">
                                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                                </div>
                                            </td>
                                            <td class="TextTrimming" style="text-align: left; vertical-align:middle;">
                                                <label *ngIf="Name" class="Label" style="color:#6E7172">Grid Title:</label>
                                                <label *ngIf="!Name" class="Label" style="color:red">Grid Title:</label>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                                <td style="height: 22px; width: 250px; ">
                                    <div style="width: 250px;">
                                        <LogTextBox [ObjectFieldName]="'Name'" [DataContext]="DataContext" [Text]="Name"></LogTextBox>
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                            <tr style="height:15px">
                                <td></td>
                            </tr>
                            <tr>
                                <td style="width:10px"></td>
                                <td style="height: 22px; width: 150px;">
                                    <table style="table-layout: fixed;">
                                        <tr>
                                            <td style="width:10px; vertical-align: middle;">
                                                <div *ngIf="!RelatedScreenCode" style="width: 10px;">
                                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                                </div>
                                            </td>
                                            <td class="TextTrimming" style="text-align: left; vertical-align:middle;">
                                                <label *ngIf="RelatedScreenCode" class="Label" style="color:#6E7172">Choose Component:</label>
                                                <label *ngIf="!RelatedScreenCode" class="Label" style="color:red">Choose Component:</label>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                                <td style="height: 22px; width: 250px; ">
                                    <div style="width: 215px;">
                                        <!--<ComboBox (SelectedItemChanged)="GridScreensSelectionChanged($event)"
                                                  [SelectedItem]="SelectedScreen" [ItemsSource]="AllGridScreens"
                                                  [Binding]="'Name'">
                                        </ComboBox>-->


                                        <LogLov *ngIf="IsLogLovReady"  (SelectedItemChanged)="GridScreensSelectionChanged($event)"
                                                [ObjectFieldName]="'SelectedScreen'"
                                                [ObjectTableName]="'ScreenSection'"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Screen'"
                                                [NoValidation]="true"
                                                [IsFreeText]="true"
                                                [SelectedValue]="SelectedScreen"
                                                [HideColumns]="true"
                                                [HideLastColumn]="true"
                                                [DisplayMemberPath]="'Name'"
                                                [QueryFilterItems]="ScreenFilterItems"
                                                >
                                        </LogLov>


                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td></td>
                </tr>
                <tr style="height: 32px;">
                    <td style="vertical-align: bottom">
                        <table style="height: 22px;">
                            <tr>
                                <td>
                                    <div></div>
                                </td>
                                <td style="width: 57px;">
                                    <div>
                                        <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                                    </div>
                                </td>
                                <td style="width: 5px;">
                                    <div></div>
                                </td>
                                <td style="width: 57px;">
                                    <button class="RedButton" (click)="SaveButtonClicked()">OK</button>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
