<style>
    .TitleBackGround {
        background: #F0F0F0; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#F0F0F0, #C5C7C7); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#F0F0F0, #C5C7C7); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#F0F0F0, #C5C7C7); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#F0F0F0, #C5C7C7); /* Standard syntax (must be last) */
    }

    .BodyBackground {
        background: #F2F8FF; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#F2F8FF, #E6EBF0); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#F2F8FF, #E6EBF0); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#F2F8FF, #E6EBF0); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#F2F8FF, #E6EBF0); /* Standard syntax (must be last) */
    }

    select {
        border: none !important;
    }

    .ListBoxItem {
        min-height: 25px;
        background-color: transparent;
    }

        .ListBoxItem:hover {
            background: #ffffff; /* For browsers that do not support gradients */
            background: -webkit-linear-gradient(#ffffff, #DDE8F5); /* For Safari 5.1 to 6.0 */
            background: -o-linear-gradient(#ffffff, #DDE8F5); /* For Opera 11.1 to 12.0 */
            background: -moz-linear-gradient(#ffffff, #DDE8F5); /* For Firefox 3.6 to 15 */
            background: linear-gradient(#ffffff, #E6EBF0); /* Standard syntax (must be last) */
        }

        .ListBoxItem:focus {
            background-color: red;
        }

        .ListBoxItem:active {
            background-color: green;
        }

    .ViewOnly {
        height: 28px;
        margin-right: 20px;
        margin-top: 2px;
        border: 1px solid orange;
        border-radius: 3px;
        background-color: #FFFAB4;
    }
</style>
<table>
    <tr>
        <td style="width:20px"></td>
        <td>
            <div [style.width]="screenWidth" style="height:100%; vertical-align: top; overflow-x: auto;">
                <div style="height:95%">
                    <div style="height:95%; margin-bottom:3px">
                        <table>
                            <tr style="height:90%">
                                <td>
                                    <table>
                                        <tr style="height:50%">
                                            <td style="width: 45%;">
                                                <div style="width:100%;border:solid 1px #BABABA;border-radius:5px">
                                                    <table>
                                                        <tr>
                                                            <td style="height:25px;width:100%;">
                                                                <div class="TitleBackGround" style="width:100%;height:100%;border-radius:5px 5px 0px 0px;">
                                                                    <div style="float:left;">
                                                                        <label style="margin:5px;vertical-align: middle;">Available Fields</label>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        <tr>
                                                            <td style="height:23px;width:100%">
                                                                <div style="width:100%;height:100%;">
                                                                    <input type="text" [id]="SearchFieldsId" placeholder="{{'General.O.Search' | TextCodeTranslationPipe}}" (focus)="ClearPlaceHolder()" (blur)="FillPlaceHolder()" [(ngModel)]="SearchText" style="background-color:white;background: url(Images/Search.png) no-repeat scroll;background-position: right center;padding-right:30px;width:100%;height:100%;"><br>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        <tr>
                                                            <td>
                                                                <table class="BodyBackground">
                                                                    <tr>
                                                                        <td>
                                                                            <LogListBox [DataSource]="UnSelectedFields" [Sort]="true" [Height]="'240'" [DataSourceChanged]="onUnselectedDataSourceChangedEvent" [Binding]="'FullNameTextCodeCode'" [event]="onUnSelectedDataLoadedEvent" (SelectedItemChanged)="onNeedToSelectedItemChanged($event)"></LogListBox>
                                                                        </td>
                                                                    </tr>
                                                                    <tr><td style="height:100%;"></td></tr>
                                                                </table>
                                                            </td>
                                                        </tr>

                                                    </table>

                                                </div>
                                            </td>
                                            <td style="width: 10%; vertical-align: middle;">
                                                <button (click)="btnAdd_Click()" class="Button" [disabled]="IsbtnAddDisabled" style="width:80px;margin: 7px;">
                                                    {{'General.B.Add' | TextCodeTranslationPipe}}
                                                    <img src="./Images/Icons/ArrowRight.png" style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                                                </button>
                                                <button (click)="btnRemove_Click()" class="Button" [disabled]="IsbtnRemoveDisabled" style="width:80px;margin: 7px;">
                                                    <img src="./Images/Icons/ArrowLeft.png" style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                                                    {{'General.B.Remove' | TextCodeTranslationPipe}}
                                                </button>
                                            </td>
                                            <td style="width: 45%;">
                                                <div style="width:100%;border:solid 1px #BABABA;border-radius:5px">
                                                    <table>
                                                        <tr>
                                                            <td style="height:25px;width:100%;">
                                                                <div class="TitleBackGround" style="width:100%;height:100%;border-radius:5px 5px 0px 0px;">
                                                                    <div style="float:left;">
                                                                        <label style="margin:5px;vertical-align: middle;">Selected Fields</label>
                                                                    </div>
                                                                    <div style="float:right;">
                                                                        <button (click)="btnUp_Click()" class="Button" [disabled]="IsbtnUpDisabled || IsFirstSelectedItem" style="width:26px;margin-right: 2px;margin-top:3px;float:right;">
                                                                            <img src="./Images/Icons/ArrowUp.png" style="height:16px;vertical-align:middle;" />
                                                                        </button>
                                                                        <button (click)="btnDown_Click()" class="Button" [disabled]="IsbtnDownDisabled || IsLastSelectedItem" style="width:26px;margin-top:3px;margin-right: 5px; float:right;">
                                                                            <img src="./Images/Icons/ArrowDown.png" style="height:16px;vertical-align:middle;" />
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        <tr>
                                                            <td>
                                                                <table class="BodyBackground">
                                                                    <tr>
                                                                        <td>
                                                                            <LogListBox [DataSource]="SelectedFields" [Height]="'264'" [Binding]="'FullNameTextCodeCode'" [event]="onSelectedDataLoadedEvent" [DataSourceChanged]="onDataSourceChangedEvent" (SelectedItemChanged)="onSelectedItemChanged($event)"></LogListBox>
                                                                        </td>
                                                                    </tr>
                                                                    <tr><td style="height:100%;"></td></tr>
                                                                </table>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr><td></td></tr>
                                    </table>
                                </td>
                            </tr>
                            <tr style="height:5px;">
                                <td></td>
                            </tr>
                            <tr>
                                <td>
                                    <div style="font-weight:bold;height:30px">Advanced Settings:</div>
                                    <table>
                                        <tr>
                                            <td style="width:10px;"></td>
                                            <td style="width:80px;">
                                                Sorted By:
                                            </td>
                                            <td style="width:200px;">
                                                <ComboBox (SelectedItemChanged)="SortedByField($event)"
                                                          [SelectedItem]="SelectedSortedByField" [ItemsSource]="AllFields"
                                                          [BindingTextCode]="'FullNameTextCodeCode'" [MaxHeight]="'100'"></ComboBox>
                                            </td>
                                            <td style="width:10px;"></td>
                                            <td style="width:150px;">
                                                <ComboBox (SelectedItemChanged)="SortedTypeChanged($event)"
                                                          [SelectedItem]="SelectedSortedType" [ItemsSource]="SortedTypes"></ComboBox>
                                            </td>
                                            <td><div></div></td>
                                        </tr>
                                        <tr style="height:5px;">
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td style="width:10px;"></td>
                                            <td style="width:80px;">
                                                New Screen:
                                            </td>
                                            <td style="width:200px;">
                                                <LogLov (SelectedItemChanged)="NewScreensSelectionChanged($event)"
                                                        [ObjectFieldName]="'SelectedNewScreenId'"
                                                        [ObjectTableName]="'Screen'"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Screen'"
                                                        [NoValidation]="true"
                                                        [IsFreeText]="true"
                                                        [SelectedValue]="SelectedNewScreenId"
                                                        [HideColumns]="true"
                                                        [HideLastColumn]="true"
                                                        [DisplayMemberPath]="'Name'"
                                                        [QueryFilterItems]="NewScreenFilterItems">
                                                </LogLov>
                                            </td>
                                            <td><div></div></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div style="height:10px;"></div>
                </div>
            </div>
        </td>
    </tr>
</table>
