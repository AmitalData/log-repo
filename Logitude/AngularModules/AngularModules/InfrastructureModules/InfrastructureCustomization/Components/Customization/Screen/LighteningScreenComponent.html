

<style>
    .SimpleGridViewRow:hover {
        color: black;
        cursor: pointer;
        border: 1px solid #85CBED;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#FFFFFF', endColorstr='#DDE8F5' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
    }

    .Selected {
        background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
    }

        .Selected:hover {
            background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
            background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
            background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        }

    .ObjectField {
        height: 60px;
        width: 100%;
        background-color: gainsboro;
        margin-bottom: 3px;
    }

        .ObjectField:hover {
            height: 60px;
            width: 100%;
            background-color: gray;
            margin-bottom: 3px;
        }

    .MyObjectField {
        height: 60px;
        width: 97%;
        background-color: gainsboro;
        margin: 3px;
    }

        .MyObjectField:hover {
            height: 60px;
            width: 97%;
            background-color: gray;
            margin: 3px;
        }
</style>
<table>
    <tr>
        <td style="width:20px"></td>

        <td>
            <div [style.width]="lighteningScreenWidth" style="height: 100%; vertical-align: top; overflow-x: auto;">

                <div style="height:10px;display:block"></div>

                <!--abed-->
                <div *ngFor="let sectionScreen of Sections;">

                    <div class="screen-section" style="height: 25px;  margin-bottom:3px">
                        <table>
                            <tr>

                                <td style="width:20px">
                                    <img style="height:20px;width:20px;margin-left:-3px" class="LeftCenter" src="./Images/ArrowDown.png" [hidden]="!sectionScreen.HideSectionArea" (click)="ScreenLayoutComponent.HideSectionAreaClicked(sectionScreen)" />
                                    <img style="height: 20px; width: 20px; margin-left: -3px" class="LeftCenter" src="./Images/ArrowUp.png" [hidden]="sectionScreen.HideSectionArea" (click)="ScreenLayoutComponent.HideSectionAreaClicked(sectionScreen)" />
                                </td>
                                <td style="width: 240px;">
                                    <div style="height: 25px; width: 240px; margin-bottom:3px">
                                        <LogTextBox (ValueChanged)="OnSectionScreenNameChange()" [NoObjectField]="true" [Text]="sectionScreen.Section.Name" [ObjectFieldName]="'Name'" [InputType]="'text'" [DataContext]="sectionScreen.Section"
                                                    [ObjectTableName]="'sectionScreen'" [HideColumns]="true"></LogTextBox>
                                    </div>

                                </td>
                                <td style="width: 8px;">
                                    <div></div>
                                </td>
                                <td *ngIf="sectionScreen.Section.Type == 'Grid'" style="width: 22px;">
                                    <IconButton style="margin-left:2px;" class="section-button" [Name]="'edit'" [IsSmall]="true" (click)="EditSection(sectionScreen)"></IconButton>
                                </td>
                                <td style="width: 22px;">
                                    <IconButton style="margin-left:2px;" class="section-button" [Name]="'delete'" [IsSmall]="true" (click)="RemoveSection(sectionScreen)"></IconButton>
                                </td>
                                <td>
                                    <IconButton float-start [Name]="'arrow-up'" [IsSmall]="true" (click)="DecrementOrder(sectionScreen)"
                                                [disabled]="sectionScreen == Sections[0]" style="margin-left:3px;" class="section-button"></IconButton>

                                    <IconButton float-start [Name]="'arrow-down'" [IsSmall]="true" (click)="IncrementOrder(sectionScreen)"
                                                [disabled]="sectionScreen == Sections[this.Sections.length-1]" style="margin-left:3px;" class="section-button">
                                    </IconButton>
                                </td>
                                <td><div></div></td>
                            </tr>
                        </table>
                    </div>



                    <div class="screen-section" *ngIf="sectionScreen.Section.Type != 'Grid'" [hidden]="sectionScreen.HideSectionArea" style="height: 315px; vertical-align: top;">
                        <table style="border:solid 1px silver;margin-left:20px" [style.width]="SectionWidth">
                            <tr>
                                <td attr.data-cy="{{'Column_' + column}}" [style.border-right]="column == '2' || (column == '1' && SectionWidth == '500px') ? 'none':'dashed 1px silver' " style="width:250px;vertical-align: top;" *ngFor="let item of sectionScreen.ScreenRows; let column = index">
                                    <div (drop)="ScreenLayoutComponent.onMyDrop($event,item,column,sectionScreen.Section)" dropzone="true" (dragover)="ScreenLayoutComponent.onMyDragEnter($event)" style="position:absolute;top:0;bottom:0;left:0;right:0;overflow:auto;">
                                        <div name="listItem" class="MyObjectField PreventSelect" *ngFor="let item1 of item.ObjectFieldPMs; let row = index" draggable="true" (dragstart)="ScreenLayoutComponent.OnScreenFieldDragStart($event,item1)" [attr.row]="row" [attr.column]="column">
                                            <table attr.data-cy="{{item1.FullNameTextCodeDefaultText}}">
                                                <tr>
                                                    <td>
                                                        <table>
                                                            <tr style="height:1px;">
                                                                <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                    <span *ngIf="ScreenLayoutComponent && !ScreenLayoutComponent.IsLineSpaceField(item1.DataTypeCode)" style="font-size: 11px"> {{item1 != null ? item1.FullNameTextCodeDefaultText : ''}}</span> 
                                                                </td>
                                                            </tr>
                                                            <tr style="height:1px;">
                                                                <td class="GridViewCell TextTrimming" style="width: 178px; min-width: 178px; max-width: 178px;">
                                                                    <span *ngIf="ScreenLayoutComponent && !ScreenLayoutComponent.IsLineSpaceField(item1.DataTypeCode)" style="font-size: 11px">({{item1 != null ? item1.PMPropertyPath : ''}})</span>
                                                                </td>
                                                            </tr>
                                                            <tr>
                                                                <td></td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                    <td style="width:30px;height:60px;">
                                                        <img class="DeleteButton RightCenter" style="right: 4px;cursor: pointer;" src="Images/RedX.png" (click)="ScreenLayoutComponent.OnDeleteField(item1 , sectionScreen.Section.Number)" />
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </table>
                    </div>

                    <div class="screen-section" *ngIf="sectionScreen.Section.Type == 'Grid'" [hidden]="sectionScreen.HideSectionArea" style="height: 160px;margin-left: 21px;">
                        <GridScreenSectionPreview [ScreenSection]="sectionScreen.Section"></GridScreenSectionPreview>
                    </div>

                    <div style="height:10px;"></div>
                </div>


            </div>
        </td>
    </tr>
</table>
