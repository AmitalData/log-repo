<style>
    .Disabled {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr [ngStyle]="{'height': ShownAdditionalFilters && LookUpTableId ? '35%' : '65%'}">
        <td>
            <table>
                <tr style="height: 10px;">
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>
                <tr>
                    <td style="width:112px;">
                        <table>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Field Label
                                    </label>
                                </td>
                            </tr>

                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Code
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Data Type
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Decimal'">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Length
                                    </label>
                                </td>
                            </tr>



                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Date' || objectField.DataTypeCode == 'DateTime'">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Read Only
                                    </label>
                                </td>
                            </tr>




                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Help Text
                                    </label>
                                </td>
                            </tr>







                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'LookUp'">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Lookup Table
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Min Length
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Max Length
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Is Multiline
                                    </label>
                                </td>
                            </tr>
                            <!--<tr style="height: 30px;" *ngIf="ControlField1Visibile">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Control Field1
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="ControlField1Visibile">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Control Field2
                                    </label>
                                </td>
                            </tr>-->
                            <tr style="height: 30px;" *ngIf="PickListVisibile">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Pick List
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Required
                                    </label>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td style="width:6px;">
                        <div></div>
                    </td>
                    <td>
                        <table style="width:364px;">
                            <tr style="height: 30px;">
                                <td style="height: 22px;" [class.Disabled]="IsPartner">
                                    <LogTextBox [ObjectFieldName]="'FieldLable'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="position:absolute;width: 364px;top: 0;bottom: 0;left: 0;right: 0;" [class.Disabled]="IsNew == false || IsPartner">
                                        <LogTextBox [ObjectFieldName]="'Code'" [DataContext]="DataContext" [Text]="Code"></LogTextBox>
                                    </div>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="position:absolute;width: 326px;top: 0;bottom: 0;left: 0;right: 0;" [class.Disabled]="IsNew == false || IsPartner">
                                        <ComboBox [ItemsSource]="DataTypeCollection" (SelectedItemChanged)="DataTypeSelectionMethod($event)" [SelectedItem]="CustomFieldDataType" [Binding]="'Name'"></ComboBox>
                                    </div>
                                </td>
                            </tr>

                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Decimal'">

                                <td style="height: 22px;">
                                    <table>
                                        <tr>
                                            <td style="width:95px;" [class.Disabled]="IsNew==false || IsPartner">
                                                <LogTextBox [InputType]="'integer'" [ObjectFieldName]="'NumberOfDigits'" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td>
                                                <div>
                                                    <HelpIcon [HideHeader]="true" [Text]="'Number of digits to the left of the decimal points'" [IconSize]="14"></HelpIcon>
                                                </div>
                                            </td>
                                            <td style="height: 22px;">
                                                <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                                    Decimal Digits:
                                                </label>
                                            </td>
                                            <td style="width:95px" [class.Disabled]="IsNew==false || IsPartner">
                                                <LogTextBox [InputType]="'integer'" [ObjectFieldName]="'DigitsAfterPoint'" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                            </td>

                                            <td>
                                                <div>
                                                    <HelpIcon [HideHeader]="true" [Text]="'Number of digits to the right of the decimal points'" [IconSize]="14"></HelpIcon>
                                                </div>
                                            </td>
                                            <td style="width:35px"></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Date' || objectField.DataTypeCode == 'DateTime'">



                                <td style="height: 22px;">
                                    <table>
                                        <tr>
                                            <td style="width: 20px;" [class.Disabled]="IsPartner">
                                                <CheckBox [IsChecked]="DisplayOnly" (Checked)="DisplayOnly = $event"></CheckBox>
                                            </td>

                                            <td>
                                                <div>
                                                    <HelpIcon [HideHeader]="true" [Text]="'This field can\'t be editable With Read Only option unless from using Automatic updating like Documents Populate Automatic Date Values, events ​... etc'" [IconSize]="14"></HelpIcon>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>




                            <tr style="height: 30px;">
                                <td style="height: 22px;" [class.Disabled]="IsPartner">
                                    <LogTextBox [ObjectFieldName]="'HelpText'" [DataContext]="DataContext"></LogTextBox>
                                    <!--<LogLov [RunToggleMode]="true"
                                            [ObjectFieldName]="'ForwarderPartnerId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'HybridPartner'">
                                    </LogLov>-->
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'LookUp'">
                                <td style="height: 22px;" [class.Disabled]="!IsNew || IsPartner">
                                    <div style="position:absolute;width: 326px;top: 0;bottom: 0;left: 0;right: 0;">
                                        <LogLov (SelectedItemChanged)="LookUpTablesSelectionMethod($event)"
                                                [QueryFilterItems]="LookUpTablesFilterItems"
                                                [ObjectFieldName]="'LookUpTableName'"
                                                [ObjectTableName]="'ObjectTable'"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'ObjectTable'"
                                                [NoValidation]="true"
                                                [IsFreeText]="true"
                                                [SelectedValue]="LookUpTableId"
                                                [HideColumns]="true"
                                                [HideLastColumn]="true"
                                                [CustomizedWidth]="326">
                                        </LogLov>
                                    </div>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'">
                                <td style="height: 22px;" [class.Disabled]="IsPartner">
                                    <LogTextBox [InputType]="'integer'" [ObjectFieldName]="'MinLength'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'">
                                <td style="height: 22px;" [class.Disabled]="IsPartner">
                                    <LogTextBox [InputType]="'integer'" [ObjectFieldName]="'MaxLength'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'">
                                <td style="height: 22px;" [class.Disabled]="IsPartner">
                                    <LogCheckBox (ValueChanged)="onIsMultilineChange($event)" [ObjectFieldName]="'IsMultiline'" [DataContext]="DataContext"></LogCheckBox>
                                </td>
                            </tr>
                            <!--<tr style="height: 30px;" *ngIf="ControlField1Visibile">
                                <td style="height: 22px;">
                                    <div style="position:absolute;width: 326px;top: 0;bottom: 0;left: 0;right: 0;">
                                        <ComboBox (SelectedItemChanged)="ContolFieldsList2SelectionMethod($event)" [ItemsSource]="ContolFieldsList1" [SelectedItem]="ControlField1" [Binding]="'FieldName'"></ComboBox>
                                    </div>
                                </td>
                            </tr>
                            <tr style="height: 30px;" *ngIf="ControlField2Visibile">
                                <td style="height: 22px;">
                                    <div style="position:absolute;width: 326px;top: 0;bottom: 0;left: 0;right: 0;">
                                        <ComboBox (SelectedItemChanged)="ContolFieldsList2SelectionMethod($event)" [ItemsSource]="ContolFieldsList2" [SelectedItem]="ControlField2" [Binding]="'FieldName'"></ComboBox>
                                    </div>
                                </td>
                            </tr>-->
                            <tr style="height: 30px;" *ngIf="PickListVisibile">
                                <td style="height: 22px;">
                                    <table>
                                        <tr>
                                            <td style="width:200px;" [class.Disabled]="IsPartner">
                                                <div style="position:absolute;width: 204px;top: 0;bottom: 0;left: 0;right: 0;">
                                                    <ComboBox (SelectedItemChanged)="PickListSelectionMethod($event)" [ItemsSource]="CustomPickListsList" [SelectedItem]="PickListItem"></ComboBox>
                                                </div>
                                            </td>
                                            <td style="width:65px;" [class.Disabled]="IsPartner">
                                                <button class="Button" (click)="EditPickListButtonClicked()" style="width:57px;float: right;margin-left:3px;margin-top:-7px;">Edit</button>
                                            </td>
                                            <td style="width:65px;" [class.Disabled]="IsPartner">
                                                <button class="Button" (click)="AddPickListButtonClicked()" style="width:57px;float: right;margin-left:3px;margin-top:-7px;">Add</button>
                                            </td>
                                            <td></td>
                                        </tr>
                                    </table>

                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;" [class.Disabled]="IsPartner">
                                    <LogCheckBox (ValueChanged)="onIsRequiredChange($event)" [ObjectFieldName]="'IsRequired'" [DataContext]="DataContext"></LogCheckBox>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height:35%" *ngIf="ShownAdditionalFilters && LookUpTableName">
        <td>
            <table>
                <tr style="height: 10px;">
                    <td style="height: 20px;">
                        <label style="padding-left:10px;color: rgb(110, 113, 114);">
                            Optionally, create a filter to limit the records available to users in the lookup field.
                        </label>
                    </td>
                </tr>
                <tr style="height: 10px;">
                    <td style="height: 20px;">
                        <img *ngIf="!ShownAdditionalFiltersSettings" (click)="ShowAdditionalFiltersSettingsClicked()" src="./Images/Arrow-right.png" style="padding-left: 12px;height: 10px; cursor: pointer;" />
                        <img *ngIf="ShownAdditionalFiltersSettings" (click)="ShowAdditionalFiltersSettingsClicked()" src="./Images/Arrow-down-s.png" style="padding-left: 12px;height: 10px; cursor: pointer;" />
                        <label (click)="ShowAdditionalFiltersSettingsClicked()" style="padding-left:10px;text-decoration:underline;cursor:pointer;color: rgb(110, 113, 114);">
                            {{ShownAdditionalFiltersSettings ? 'Hide' : 'Show'}} Filter Settings
                        </label>
                    </td>
                </tr>
                <tr *ngIf="ShownAdditionalFiltersSettings">
                    <td [class.Disabled]="IsPartner">
                        <ScrollViewer [IsTowSides]="true">
                            <QueryFilterTree style="position:absolute;" [DataSource]="AdditionalFiltersData" [IsRoot]="true" [ParentObjectTableName]="ObjectTableName" [ObjectTableName]="LookUpTableName"></QueryFilterTree>
                        </ScrollViewer>
                    </td>
                </tr>
                <tr *ngIf="!ShownAdditionalFiltersSettings">
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height:30%" *ngIf="IsCardObjectTable()">
        <td>
            <table style="width:300px">
                <tr class="TabTitleRow">
                    <td>Partner Types:</td>
                </tr>
                <tr>
                    <td style="padding-left:15px">
                            <table>
                                <tr class="FormFieldRow">
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Customer'" [IsEnabled]="IsEnable('Customer')" [IsChecked]="PartnersDictionary['Customer']" (Checked)="ChangeCheckBoxValue('Customer',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Agent'" [IsEnabled]="IsEnable('Agent')" [IsChecked]="PartnersDictionary['Agent']" (Checked)="ChangeCheckBoxValue('Agent',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Customs Agent'" [IsEnabled]="IsEnable('CustomAgent')" [IsChecked]="PartnersDictionary['CustomAgent']" (Checked)="ChangeCheckBoxValue('CustomAgent',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Coloader'" [IsEnabled]="IsEnable('Coloader')" [IsChecked]="PartnersDictionary['Coloader']" (Checked)="ChangeCheckBoxValue('Coloader',$event)"></CheckBox>
                                    </td>
                                </tr>
                                <tr class="FormFieldRow">
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Vendor'" [IsEnabled]="IsEnable('Vendor')" [IsChecked]="PartnersDictionary['Vendor']" (Checked)="ChangeCheckBoxValue('Vendor',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Shipping Line'" [IsEnabled]="IsEnable('ShippingLine')" [IsChecked]="PartnersDictionary['ShippingLine']" (Checked)="ChangeCheckBoxValue('ShippingLine',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Shipping Agent'" [IsEnabled]="IsEnable('ShippingAgent')" [IsChecked]="PartnersDictionary['ShippingAgent']" (Checked)="ChangeCheckBoxValue('ShippingAgent',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Freelancer'" [IsEnabled]="IsEnable('Freelancer')" [IsChecked]="PartnersDictionary['Freelancer']" (Checked)="ChangeCheckBoxValue('Freelancer',$event)"></CheckBox>
                                    </td>
                                </tr>
                                <tr class="FormFieldRow">
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Customs Shipper'" [IsEnabled]="IsEnable('CustomsShipper')" [IsChecked]="PartnersDictionary['CustomsShipper']" (Checked)="ChangeCheckBoxValue('CustomsShipper',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'AirLine'" [IsEnabled]="IsEnable('Airline')" [IsChecked]="PartnersDictionary['Airline']" (Checked)="ChangeCheckBoxValue('Airline',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Warehouse'" [IsEnabled]="IsEnable('Warehouse')" [IsChecked]="PartnersDictionary['Warehouse']" (Checked)="ChangeCheckBoxValue('Warehouse',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Potential Customer'" [IsEnabled]="IsEnable('PotentialCustomer')" [IsChecked]="PartnersDictionary['PotentialCustomer']" (Checked)="ChangeCheckBoxValue('PotentialCustomer',$event)"></CheckBox>
                                    </td>
                                </tr>
                                <tr class="FormFieldRow">
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Trucker'" [IsEnabled]="IsEnable('Trucker')" [IsChecked]="PartnersDictionary['Trucker']" (Checked)="ChangeCheckBoxValue('Trucker',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Custom Clearance'" [IsEnabled]="IsEnable('CustomClearance')" [IsChecked]="PartnersDictionary['CustomClearance']" (Checked)="ChangeCheckBoxValue('CustomClearance',$event)"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Accounting Partner'" [IsEnabled]="false"></CheckBox>
                                    </td>
                                    <td style="padding-right:10px">
                                        <CheckBox [Text]="'Participant'" [IsEnabled]="false"></CheckBox>
                                    </td>
                                </tr>
                               
                            </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr><td colspan="5"></td></tr>

    <tr style="height:1px;">
        <td>
            <table>
                <tr>
                    <td>
                        <div>
                            <button class="RedButton" (click)="SaveChanges()" style="width:57px;float: right;margin-left: 7px;margin-right: 7px;">OK</button>
                            <button class="Button" (click)="CancelButtonClicked()" style="width:57px;float: right;">Cancel</button>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
