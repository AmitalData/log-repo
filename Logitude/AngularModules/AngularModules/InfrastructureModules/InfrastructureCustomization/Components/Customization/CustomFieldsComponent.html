
<style>
    .Disabled {
        pointer-events: none;
        opacity: 0.5;
    }
</style>
<table>
    <tr>
        <td>
            <table>
                <tr style="height: 20px;">
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <div></div>
                                </td>
                                <td *ngIf="!this.IsCustomFieldsMenue" style="width: 20px; padding-right: 2px;float:right;vertical-align:central;">
                                    <IconButton *ngIf="!IsPartner" [Name]="'Add'" [IsSmall]="true" [IsEnabled]="IsAddButtonEnabled && AllowCustomFields" (click)="AddCustomField()"></IconButton> <!--(click)="DataContext.AddPackageItemMethod()" [disabled]="!DataContext.IsEditingEnabled"-->
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td [style.height]="AllowCustomFields? '100%': '80px'">
                        <div class="MediaFill" style="overflow-x: hidden;">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="CustomFieldsCollection">

                                <!-- FieldName -->
                                <log-column [header]="'Code'" [width]="'95'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IgnoreMods]="true">
                                            <div class="TextTrimming">
                                                <span>{{item.Code}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- FieldName -->
                                <log-column [header]="'Field Name'" [width]="'95'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IgnoreMods]="true">
                                            <div class="TextTrimming">
                                                <span>{{item.FullNameTextCodeCode | TextCodeTranslationPipe}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- DataType -->
                                <log-column [header]="'Data Type'" [width]="'80'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IgnoreMods]="true">
                                            <div class="TextTrimming">
                                                <span>{{item.DataTypeName}}</span>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Buttons -->
                                <log-column [width]="'30'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template [IgnoreMods]="true">
                                            <IconButton [DataCy]="item.FullNameTextCodeCode" [Name]="'edit'" [IsSmall]="true"
                                                        style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="EditLine(item)"></IconButton>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="!AllowCustomFields">
                    <td style="vertical-align: top">
                        <div style="display: table; margin: 0 auto">
                            <label>
                                Custom Fields are not supported on this object
                            </label>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
