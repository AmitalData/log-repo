<style>
    .Disabled{
        pointer-events:none;
        opacity:0.5;
    }
</style>
<table>
    <tr>
        <td>
            <table>
                <tr style="height: 20px;">
                    <td>
                        <table>
                            <tr> 
                                <td><div></div></td>
                                <td style="width: 20px; padding-right: 2px;float:right;vertical-align:central;">
                                    <IconButton [Name]="'Add'" [IsSmall]="true" [IsEnabled]="IsAddButtonEnabled" (click)="AddCustomField()"></IconButton> <!--(click)="DataContext.AddPackageItemMethod()" [disabled]="!DataContext.IsEditingEnabled"-->
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td style="height: 100%;">
                        <div class="MediaFill" style="overflow-x: hidden;">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="CustomFieldsCollection" >

                                <!-- FieldName -->
                                <log-column [header]="'Code'" [width]="'95'" [Alignment]="'left'">
                                    <log-cell-template template="let item" #logcelltemplate [IgnoreMods]="true">
                                        <div class="TextTrimming">
                                            <span>{{item.Code}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- FieldName -->
                                <log-column [header]="'Field Name'" [width]="'95'" [Alignment]="'left'">
                                    <log-cell-template template="let item" #logcelltemplate [IgnoreMods]="true">
                                        <div class="TextTrimming">
                                            <span>{{item.FullNameTextCodeCode | TextCodeTranslationPipe}}</span>
                                        </div>
                                    </log-cell-template>
                                </log-column>

                                <!-- DataType -->
                                <log-column [header]="'Data Type'" [width]="'80'" [Alignment]="'left'" >
                                    <log-cell-template template="let item" #logcelltemplate [IgnoreMods]="true">
                                        <div class="TextTrimming" >
                                            <span>{{item.DataTypeCode}}</span>
                                        </div> 
                                    </log-cell-template>
                                </log-column>
                                 
                                <!-- Buttons -->
                                <log-column [width]="'30'" [Alignment]="'left'">
                                    <log-cell-template [IgnoreMods]="true" template="let item">
                                        <IconButton [Name]="'edit'" [IsSmall]="true"
                                                    style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="EditLine(item)"></IconButton>
                                    </log-cell-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td><div></div></td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
