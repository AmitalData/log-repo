<table>
    <tr>
        <td>
            <div class="FillParent CurvedArea" style="padding:20px">
                <table>
                    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
                        <td style="padding: 3px;">
                            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                        </td>
                    </tr>
                    <tr>
                        <td style="height:60px">
                            <div style="display:flex; width:100%; height:60px; align-items:center">

                                <label style="width:120px">Select Object</label>

                                <LogLov *ngIf="IsLogLovReady"
                                        [ObjectFieldName]="'SelectedObjectTableId'"
                                        [ObjectTableName]="'ObjectTable'"
                                        [DataContext]="DataContext"
                                        [LookUpTableName]="'ObjectTable'"
                                        [NoValidation]="true"
                                        [IsFreeText]="true"
                                        [SelectedValue]="SelectedObjectTableId"
                                        [HideColumns]="true"
                                        [HideLastColumn]="true"
                                        [DisplayMemberPath]="'Name'"
                                        [QueryFilterItems]="ObjectTablesFilterItems"
                                        [CustomizedWidth]="'350px'"
                                        style="width: 350px">
                                </LogLov>

                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="height:100%; vertical-align:initial">
                            <div class="SimpleGridView" style="height: 100%;">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr>
                                            <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                <CheckBox [IsChecked]="SelectAllCustomFields" (Checked)="SelectAllCustomFields = $event"></CheckBox>
                                            </td>
                                            <td style="width: 150px; min-width: 150px; max-width: 150px;">{{'DeploymentPackage.O.CustomField.Code' | TextCodeTranslationPipe}}</td>
                                            <td style="width: 150px; min-width: 150px; max-width: 150px;">{{'DeploymentPackage.O.CustomField.Name' | TextCodeTranslationPipe}}</td>
                                            <td style="width: 150px; min-width: 150px; max-width: 150px;">{{'DeploymentPackage.O.CustomField.DataType' | TextCodeTranslationPipe}}</td>
                                            <td style="width: 25px; max-width:25px;max-width:25px"></td>
                                            <td> </td>
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody" style="overflow-y:auto;overflow-x:hidden">
                                    <table>
                                        <tr class="SimpleGridViewRow RowHover" *ngFor="let item of CustomFields">
                                            <td class="GridViewCell" style="width: 25px; min-width: 25px; max-width: 25px; ">
                                                <CheckBox [IsChecked]="SelectAllCustomFields || IsSelected(item)" (Checked)="SelectCustomField($event, item)"></CheckBox>
                                            </td>
                                            <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; ">
                                                {{item.Code}}
                                            </td>
                                            <td class="GridViewCell" style="width: 150px; min-width: 150px;max-width:150px;">
                                                {{item.DefaultText}}
                                            </td>
                                            <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; ">
                                                {{item.DataTypeName}}
                                            </td>

                                            <td class="GridViewCell"></td>

                                        </tr>

                                        <tr>
                                            <td colspan="6">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'CancelButton' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'OkButton' | IdGeneratorAsyncPipe | async}}" class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
