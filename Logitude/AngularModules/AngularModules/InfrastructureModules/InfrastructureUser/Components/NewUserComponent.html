
<style>
    .MessageText {
        white-space: normal;
        word-wrap: break-word;

<div  style="height:100%;vertical-align:top">

                </div>
            </td>
        </tr>

        <tr *ngIf="DemoTenantMessageVisibility" style="height:5px">

            <td colspan="3">
                <div style="height:5px">
                   
                </div>
            </td>
        </tr>

        <tr *ngIf="Info1Visibility" style="height:20px">

            <td colspan="3">
               

                <table>
                    <tr>
                       
                        <td style="width: 17px;">

                        </td>
                        <td style="width:3px"><div></div></td>

                </table>

                 </tr>

                     <td colspan="2">

                             </tr>
                         </table>

                 </tr>

                 </tr>

                 <tr *ngIf="LicencedUserVisible" style="vertical-align:top;height:25px">

                 </tr>


         
                 <tr *ngIf="IsDistributorVisible" style="vertical-align:top;height:25px">

                    </tr>

                                        </div>

                    <tr><td><div></div></td></tr>

                </table>



            </td>

          <td><div></div></td>

        <tr *ngIf="RolesAreaVisibility" style="height:20px">
           
            <td  colspan="3"><span style="font-size:15px;color:#1B90CB;margin-left:5px">Roles</span>    </td>
           
        </tr>

        <tr *ngIf="RolesAreaVisibility"  style="max-height:300px;vertical-align:central">

                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>

                                <td style="width: 190px; min-width: 190px;">Name</td>
                                <td style="width: 50px; min-width: 50px;">Active</td>

                                <td style="width: 46px; min-width: 46px"></td>

                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">

                            <tr style="height: 1px;">
                                <td>

                                                    <tr style="height:25px;" (click)="SelectedUserRolesItem = item" [class.RowSelected]="item === SelectedUserRolesItem">

                                                          {{item.Name}}

                                                                <label class="CenterCenter" [attr.for]="item.Key"></label>
                                                            </div>

                                                        </td>-->

                                                        <!--<td class="GridViewCell" style="width: 50px; min-width: 50px; max-width: 50px;">
                                                            <div class="MediaFill">
                                                                <div class="MediaFillRelative">
                                                                    <div class="CenterCenter" style="width: 16px;">
                                                                        <CheckBox [IsEnabled]="!(NewUserPM.IsFreelancer && !item.Code.startsWith('FRL'))" (Checked)="IsActiveCheckboxClick(item)" [IsChecked]="item.IsActive"></CheckBox>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>-->

                                                        <td class="GridViewCell" style="width: 50px; min-width: 50px; max-width: 50px;">
                                                            <div class="MediaFill">
                                                                <div class="MediaFillRelative">
                                                                    <div class="CenterCenter" style="width: 16px;">
                                                                        <CheckBox [IsChecked]="item.IsActive" (Checked)="item.IsActive = $event" [IsEnabled]="!(NewUserPM.IsFreelancer && !item.Code.startsWith('FRL'))"></CheckBox>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>




                                                        <td class="GridViewCell" style="width:100%; min-width:100%; max-width:100%; position: relative;">
                                                            <div class="MessageText">{{item.Description}}</div>

                                                        </td>

                                                        <td class="CellStretched" style="width:30px; min-width:30px; max-width:30px; position: relative;">
                                                            <div *ngIf="item.IsActive" class="EditButton" (click)="EditRole(item)" style="display:inline;width:18px;">
                                                                <IconButton [Name]="'Edit'" [IsSmall]="true" style="display: block;margin-left:7px"></IconButton>
                                                            </div>

                                                        </td>

                                                    </tr>
                                                    <tr><td colspan="3"></td></tr>
                                                </table>


                                            </td>
                                        </tr>
                                    </table>
                                </td>

                            <tr>

                    </tr>
                </table>

</div>
