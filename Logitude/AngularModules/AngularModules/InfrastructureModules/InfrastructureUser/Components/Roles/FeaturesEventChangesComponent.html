
<table>
    <tr>
        <td>
            <div class="MediaFill">               
                <textarea [(ngModel)]="Notes"
                          [readonly]="true"
                          style="background: #E6E7E8 !important; padding: 2px; padding-left: 4px;">
                </textarea>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
