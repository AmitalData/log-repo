
<table>
    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 200px; min-width: 200px; max-width: 200px;">Name</td>
                                <td style="width: 120px; min-width: 120px; max-width: 120px;">Date</td>
                                <td style="width: 250px; min-width: 250px; max-width: 250px;">User</td>
                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource">

                                <td class="GridViewCell" style="width: 200px; min-width: 200px; max-width: 200px;">
                                    {{item.Name}}
                                </td>

                                <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px;">
                                    {{item.EventDateTime | DateTimePipe:'DT'}}
                                </td>

                                <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width: 250px;">
                                    {{item.UserName}}
                                </td>

                                <td>
                                    <div class="MediaFill">
                                        <div *ngIf="item.Notes" style="height: 100%; width: 100%; position: relative;">
                                            <div class="LeftCenter" style="height: 20px;">
                                                <IconButton [Name]="'search'" [Left]="3" (click)="ShowNotesClicked(item.Notes)"></IconButton>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
