
<style>
    .iwanttohover:hover {
        background: #DDE6F0;
    }

    GridView th, .GridView td, .GridView td div {
        text-align: left;
        text-indent: 5px;
        /*height: 24px;*/
        line-height: 17px;
        vertical-align: middle;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }
</style>






    <table>
      

        <tr style="height:100%;vertical-align:top">


            <td>
                <table style="vertical-align:top">

                    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                        <td colspan="3">
                            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                        </td>
                    </tr>

                    <tr style="height:30px">
                        <td style="width: 4px;"> <div style="width: 7px; height: 7px;text-align:left; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;" *ngIf="!UserId"></div></td>
                        <td style="width:100px;text-align:left;">User</td>
                        <td style="width:30px"><div></div></td>
                        
                       
                    </tr>

                    <tr style="height:30px">

                        <td style="width:200px;vertical-align:top" colspan="3">
                            <div style="width:200px;">

                                <LogLov [LogitudeForm]="myForm"
                                        [ObjectFieldName]="'UserId'"
                                        [ObjectTableName]="'User'"
                                        [DataContext]="DataContext"
                                        [LookUpTableName]="'User'"
                                        [DisplayMemberPath]="'EnglishName'">
                                </LogLov>

                            </div>
                        </td>
                       
                    </tr>
                    

                    <tr>
                        <td colspan="3"><div></div></td>
                    </tr>

                </table>
            </td>




        </tr>

        <tr style="height: 32px;">
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <div>
                                <button class="Button" (click)="CloseButtonClicked()">Close</button>
                            </div>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="ResetClicked()">Reset</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>
