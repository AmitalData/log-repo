
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 250px;">
                        <SearchBox [SearchText]="SearchFields" (TextChanged)="SearchTextChanged($event)"></SearchBox>
                    </td>

                    <td [style.width.px]="HeaderColumnWidth">
                        <div></div>
                    </td>

                    <td style="width: 100px;" *ngFor="let item of LicensesManagmentsList">
                        <div style="font-size:14px; text-align: center" [ngStyle]="{'color': item.Color}">{{item.Header}}</div>
                    </td>

                    <td><div></div></td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:5px;">
        <td><div></div></td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div style="vertical-align:top;" class="GeneratedGridContainer" *ngIf="DataLoaded">
                    <logitude-grid-v2 style="vertical-align:top;" GridWidth="100%" GridHeight="100%" [dataSource]="DataSource" [ReloadData]="true"
                                   [columns]="Columns" [autoLoad]="true" [rows]="Items" [searchFields]="SearchFields" [SearchFieldchangeevent]="SearchFieldChangeEvent"
                                   [RowBackGroundColor]="'#fbbcbc'" [ChangeColorByPropName]="'InActive'" [ChangeColorByPropValue]="true"
                                   [MenuHeaderchangeevent]="MenuHeaderchangeevent">
                    </logitude-grid-v2>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom" colspan="2">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

</table>
