
<div class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>{{'User.TH.General' | TextCodeTranslationPipe}}</td>
        </tr>

        <tr>
            <td>
                <table>
                    <tr>
                        <td style="width: 350px;">
                            <table>

                                <!-- Email -->
                                <tr class="FormFieldRow">
                                    <td style="width: 130px;">
                                        <LogLabel [ObjectFieldName]="'Email'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogTextBox [ObjectFieldName]="'Email'" [Text]="Email" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- EnglishName -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'EnglishName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogTextBox [ObjectFieldName]="'EnglishName'" [Text]="EnglishName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- LocalName -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'LocalName'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogTextBox [ObjectFieldName]="'LocalName'" [Text]="LocalName" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- PersonalId -->
                                <tr class="FormFieldRow" *ngIf="IsPersonalIdVisible">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'PersonalId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogTextBox [ObjectFieldName]="'PersonalId'" [Text]="PersonalId" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>

                                <!-- DepartmentId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'DepartmentId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogLov [ObjectFieldName]="'DepartmentId'"
                                                [SelectedValue]="DepartmentId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Department'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- BranchId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BranchId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogLov [ObjectFieldName]="'BranchId'"
                                                [SelectedValue]="BranchId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'Branch'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- BusinessUnitId -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'BusinessUnitId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogLov [ObjectFieldName]="'BusinessUnitId'"
                                                [SelectedValue]="BusinessUnitId"
                                                [ObjectTableName]="ObjectTableName"
                                                [DataContext]="DataContext"
                                                [LookUpTableName]="'BusinessUnit'">
                                        </LogLov>
                                    </td>
                                </tr>

                                <!-- ExpirationDate -->

                                <tr class="FormFieldRow" *ngIf="IsExpirationDateVisible">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ExpirationDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogDatePicker [ObjectFieldName]="'ExpirationDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogDatePicker>
                                    </td>
                                </tr>

                                <!-- Technology -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Technology'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <table>
                                            <tr>
                                                <td>
                                                    <ComboBox [IsDisabled]="!IsEditingEnabled" [ItemsSource]="TechnologyList" (SelectedItemChanged)="TechnologyValueChanged($event)" [SelectedItem]="SelectedTechnology" [Binding]="'Name'"></ComboBox>
                                                </td>

                                                <td style="width: 36px;">
                                                    <div></div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>


                                <!-- Mobile -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'Mobile'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogTextBox [ObjectFieldName]="'Mobile'" [Text]="Mobile" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                    </td>
                                </tr>




                                <!-- IsSalesman -->
                                <tr class="FormFieldRow" *ngIf="IsSalesmanVisible">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'IsSalesman'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'IsSalesman'" [Checked]="IsSalesman" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>

                                <!-- InActive -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'InActive'" [Checked]="InActive" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>

                                <!-- LicencedUser -->
                                <tr class="FormFieldRow" *ngIf="IsLicencedUserVisible">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'LicencedUser'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'LicencedUser'" [Checked]="LicencedUser" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>

                                <!-- IsShowContactDetailsInTheMobileApp -->
                                <tr class="FormFieldRow" *ngIf="IsShowContactInMobileVisiable">
                                    <td title="Show Contact Details In The Mobile App">
                                        <LogLabel [ObjectFieldName]="'IsShowContactDetailsInTheMobileApp'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'IsShowContactDetailsInTheMobileApp'" [Checked]="IsShowContactDetailsInTheMobileApp" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>


                                <!-- IsTwoFactorAuthenticationEnabled -->
                                <tr title="Is Two Factor Authentication Enabled" class="FormFieldRow" *ngIf="IsShowFactorAuthenticationEnabled">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'IsTwoFactorAuthenticationEnabled'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'IsTwoFactorAuthenticationEnabled'" [Checked]="IsTwoFactorAuthenticationEnabled" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>

                                <!-- ShowLocalNameInLOV  -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ShowLocalNameInLOV'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'ShowLocalNameInLOV'" [Checked]="ShowLocalNameInLOV" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>

                                <!-- ShowNewReleaseToolTip  -->
                                <tr class="FormFieldRow">
                                    <td>
                                        <LogLabel [ObjectFieldName]="'ShowNewReleaseToolTip'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                    </td>
                                    <td>
                                        <LogCheckBox [ObjectFieldName]="'ShowNewReleaseToolTip'" [Checked]="ShowNewReleaseToolTip" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                    </td>
                                </tr>

                                <!-- Notes -->
                                <tr style="height: 100px;">
                                    <td colspan="2">
                                        <table>
                                            <tr style="height: 1px;">
                                                <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="MediaFill">
                                                        <LogTextBox [ObjectFieldName]="'Notes'" [Text]="Notes" [IsMultiline]="true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="2">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
