
<style>
    .iwanttohover:hover {
        background: #DDE6F0;
    }

    GridView th, .GridView td, .GridView td div {
        text-align: left;
        text-indent: 5px;
        /*height: 24px;*/
        line-height: 17px;
        vertical-align: middle;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }
</style>






    <table>

        <tr style="height:5px">

            <td>
                <div style="height:5px"></div>
            </td>
        </tr>


        <tr>

            <td>
                <div style="font-size:15px;color:#1B90CB">{{Username}}</div>
        
            </td>
        </tr>

        <tr style="height:10px">

            <td>
                <div style="height:10px"></div>
            </td>
        </tr>
        <tr style="height:100%">

             
            

            <td class="CellStretch">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table> 
                            <tr>

                                <td style="width: 150px; min-width: 150px;max-width: 150px;">Local Date Time</td>
                                <td style="width: 150px; min-width: 150px;max-width: 150px;">GMT Date Time</td>
                                <td style="width: 120px; min-width: 120px;max-width: 120px;">IP</td>
                     
                                <td style="width:100%;">
                                    <div>Browser</div>
                                </td>

                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr style="height: 1px;">
                                <td>
                                    <table>
                                        <tr class="SimpleGridViewRow RowHover" *ngFor="let item of UserLoginHistoryLists">
                                            <td>
                                                <table>
                                                    <tr style="height:25px;" (click)="SelectedUserLoginHistory=item" [class.RowSelected]="item === SelectedUserLoginHistory">


                                                        <td class="GridViewCell" style="width: 150px; min-width:150px; max-width:150px; position: relative;">

                                                            <div style="display:inline-block">
                                                                <span>{{item.LocalDateTime | DateTimeToDatePipe}}</span>
                                                                <span style="margin-left:5px">{{item.LocalDateTime | DateTimeToTimePipe}}</span>  

                                                            </div>
                                                        </td>

                                                        <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; position: relative;">
                                                            {{item.GMTDateTime | DateTimePipe:'DT'}}

                                                        </td>


                                                        <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                                           <a target="_blank" href="{{item.IPSiteUri}}">  {{item.IP}}</a>
                                                        </td>



                                                        <td class="GridViewCell" style="width: 100%; min-width: 100%; max-width: 100%; position: relative;">
                                                            {{item.Browser}}
                                                        </td>


                                                    </tr>
                                                    <tr><td colspan="6"></td></tr>
                                                </table>


                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

            </td>


        </tr>

        <tr style="height: 32px;">
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <div>
                                <!--<button class="Button" (click)="CloseButtonClicked()">Cancel</button>-->
                            </div>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="CloseButtonClicked()">Close</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>
