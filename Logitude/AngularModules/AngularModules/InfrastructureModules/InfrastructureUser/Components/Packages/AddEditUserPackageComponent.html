
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table *ngIf="IsResourcesReady">

                <!-- Code -->
                <tr class="FormFieldRow">
                    <td style="width: 90px;">
                        <LogLabel [ObjectFieldName]="'Code'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td style="width: 250px;">
                        <LogTextBox [ObjectFieldName]="'Code'" [Text]="Code" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- Name -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'Name'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogTextBox [ObjectFieldName]="'Name'" [Text]="Name" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- FeaturePackageTypeCode -->
                <tr class="FormFieldRow">
                    <td>
                        <LogLabel [ObjectFieldName]="'FeaturePackageTypeCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogLov [ObjectFieldName]="'FeaturePackageTypeCode'"
                                [SelectedValue]="FeaturePackageTypeCode"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'FeaturePackageType'">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- InActive -->
                <tr class="FormFieldRow" *ngIf="IsEditMode">
                    <td>
                        <LogLabel [ObjectFieldName]="'InActive'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>

                    <td>
                        <LogCheckBox [ObjectFieldName]="'InActive'" [Checked]="InActive" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div class="MediaFill" *ngIf="IsGridViewVisible">
                            <div class="SimpleGridView">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr>
                                            <td style="width: 25px; min-width: 25px; max-width: 25px;">
                                                <div></div>
                                            </td>
                                            <td style="width: 150px; min-width: 150px; max-width: 150px; text-align: center;">Name</td>
                                            <td class="LastChild">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>

                                <div class="SimpleGridViewBody">
                                    <table>
                                        <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource">

                                            <td class="GridViewCell" style="width: 25px; min-width: 25px; max-width: 25px;">
                                                <div class="MediaFill">
                                                    <div class="MediaFillRelative">
                                                        <div class="CenterCenter" style="width: 16px;">
                                                            <CheckBox [IsChecked]="item.IsChecked" (Checked)="item.IsChecked = $event"></CheckBox>
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>

                                            <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px;">
                                                {{item.Name}}
                                            </td>

                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="3">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
