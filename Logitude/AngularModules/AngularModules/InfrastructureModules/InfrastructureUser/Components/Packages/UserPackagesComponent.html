
<table>
    <tr style="height:1px">
        <td>
            <table>
                <tr>
                    <td style="width: 200px;">
                        <button class="Button" (click)="ExportFeaturesToCSVFile()">
                            Export Package-Features to csv file
                        </button>
                    </td>

                    <td style="width:3px"></td>

                    <td style="width: 150px; min-width: 130px;">
                        <button class="Button" (click)="ImportFeaturesToFile()">Import Package-Features</button>
                    </td>

                    <td>
                        <input accept=".csv,.CSV" [attr.id]="ImportFeaturesFileHtmlId" type="file" (change)="ImportFeaturesFile($event)" style="display:none" class="upload" />
                    </td>

                    <td></td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height: 5px;">
        <td></td>
    </tr>
    <tr style="height: 1px;">
        <td>
            <table>

                <tr>
                    <td style="width: 200px;">
                        <SearchBox (TextChanged)="SearchTextChanged($event)"></SearchBox>
                    </td>

                    <td>
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <CheckBox [IsChecked]="ShowInactive" (Checked)="ShowInactive = $event" [Text]="'Show Inactive'"></CheckBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 190px;">
                        <ul class="FiltersMenu" style="float: right;">
                            <li (click)="FilterTypeCode = 'AL'" [class.SelectedFilter]="FilterTypeCode == 'AL'" style="width:40px;">
                                All
                            </li>
                            <li (click)="FilterTypeCode = 'BS'" [class.SelectedFilter]="FilterTypeCode == 'BS'" style="width:40px;">
                                Base
                            </li>
                            <li (click)="FilterTypeCode = 'PK'" [class.SelectedFilter]="FilterTypeCode == 'PK'" style="width:55px;">
                                Package
                            </li>
                            <li (click)="FilterTypeCode = 'AD'" [class.SelectedFilter]="FilterTypeCode == 'AD'" style="width:55px;">
                                Add-On
                            </li>
                        </ul>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <button class="Button" (click)="NewPackageClicked()">New Package</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td></td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 150px; min-width: 150px; max-width: 150px;">Name</td>
                                <td style="width: 100px; min-width: 100px; max-width: 100px;">Type</td>
                                <td style="width: 60px; min-width: 60px; max-width: 60px; text-align: center;">InActive</td>
                                <td style="width: 30px; min-width: 30px; max-width: 30px;">
                                    <div></div>
                                </td>

                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource">
                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px;">
                                    {{item.Name}}
                                </td>

                                <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                    {{item.Type}}
                                </td>

                                <td class="GridViewCell" style="width: 60px; min-width: 60px; max-width: 60px;">
                                    <div class="MediaFill">
                                        <div class="MediaFillRelative">
                                            <div class="CenterCenter" style="width: 16px;">
                                                <CheckBox [IsChecked]="item.InActive" (Checked)="item.InActive = $event"></CheckBox>
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <td class="GridViewCell" style="width:30px; min-width:30px; max-width:30px;">
                                    <div class="MediaFill">
                                        <div class="MediaFillRelative">

                                            <div class="LeftCenter" style="height: 20px; left: 1px;">
                                                <span class="CellSeparator"></span>
                                            </div>

                                            <div class="CenterCenter" style="width: 18px; height: 18px;">
                                                <IconButton [Name]="'Edit'" [IsSmall]="true" (click)="EditPackageClicked(item)"></IconButton>
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="5">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
