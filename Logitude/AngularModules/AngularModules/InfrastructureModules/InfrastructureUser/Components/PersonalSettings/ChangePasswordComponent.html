<style>
    .iwanttohover:hover {
        background: #DDE6F0;
    }

    GridView th, .GridView td, .GridView td div {
        text-align: left;
        text-indent: 5px;
        /*height: 24px;*/
        line-height: 17px;
        vertical-align: middle;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }


    .pwdCheckCase0, .pwdCheckCase1, .pwdCheckCase2, .pwdCheckCase3, .pwdCheckCase4 {
        text-align: center;
        border-right-width: 1px;
        border-bottom-width: 1px;
        border-right-style: solid;
        border-bottom-style: solid;
        vertical-align: central;
    }

    .pwdCheckCase0 {
        background-color: #CCCCCC;
        border-right-color: #CCCCCC;
        border-bottom-color: #CCCCCC;
    }

    .pwdCheckCase1 {
        background-color: #FF0000;
        border-right-color: #FF0000;
        border-bottom-color: #FF0000;
    }

    .pwdCheckCase2 {
        background-color: #FFCC00;
        border-right-color: #FFCC00;
        border-bottom-color: #FFCC00;
    }

    .pwdCheckCase3 {
        background-color: #4DFF00;
        border-right-color: #3333FF;
        border-bottom-color: #3333FF;
    }

    .pwdCheckCase4 {
        background-color: #00CC00;
        border-right-color: #336600;
        border-bottom-color: #336600;
    }

    .pwdCheckTable {
        /*border: 3px outset #CCCCCC;*/
        padding: 0px 0px 0px 0px;
        width: 100%;
    }

    .pwdCheckInnerTable {
        font-family: Tahoma,sans-serif;
        font-weight: bold;
        width: 210px;
        border: 0px 0px 0px 0px;
        height: 19px;
        background-color: #FFFFFF;
    }

        .pwdCheckInnerTable span {
            font-size: 70%;
        }

    .pwdCheckLabelCell {
        font-size: 9pt;
        color: #000000;
        font-weight: bold;
        vertical-align: top;
        text-align: right;
        padding: 5px 20px 13px 5px;
    }

    .pwdCheckDataCell {
        width: 200px;
        vertical-align: top;
        padding: 0px 0px 13px 0px;
    }
</style>


<table>




    <tr style="height:100%;vertical-align:top;margin:15px;">


        <td style="position: relative;vertical-align:top">
            <div style="vertical-align:top">



                <table style="vertical-align:top;margin-top:25px">

                    <tr>
                        <td>
                            <div style="height:70px;">

                                <table>
                                    <tr>
                                        <td><div style="width:5px"></div></td>
                                        <td style="text-align:left;width:75px"><span style="text-align:left;width:75px"><img style="width:75px;height:75px" src="Images/ser-password-icon.png" /></span></td>

                                        <td style="vertical-align:top;font-size:16px;color:#1B90CB;margin-top:5px">Enter new password</td>
                                    </tr>
                                </table>

                            </div>
                        </td>

                    </tr>


                    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;margin-top:10px;">
                        <td>
                            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
                        </td>
                    </tr>



                    <tr style="height:15px">
                        <td style="height:15px">
                            <div style="height:15px"></div>
                        </td>
                    </tr>


                    <tr>
                        <td>


                            <div style="height:auto;margin-top:5px">

                                <table style="margin-left:20px;">
                                    <tr>


                                        <td style="text-align:left;width:120px"><div style="text-align:left;width:120px;font-size:11px;color:#6e7172">Current Password</div> </td>
                                        <td style="text-align:left;width:100px">
                                            <div style="text-align:left">
                                                <input autocomplete="new-password" type="password" style="height:22px;border-radius:3px;border:1px solid gray;width:200px;" [(ngModel)]="CurrentPassword" />


                                            </div>
                                        </td>
                                        <td></td>

                                    </tr>

                                    <tr style="height:5px"> <td colspan="2" style="height:5px"> <div style="height:5px"></div></td> </tr>

                                    <tr>
                                        <td style="text-align:left;width:120px"><div style="text-align:left;width:120px;font-size:11px;color:#6e7172">New Password</div> </td>
                                        <td style="text-align:left;">
                                            <div style="text-align:left;width:auto">
                                                <input type="password" autocomplete="new-password" style="height:22px;border-radius:3px;border:1px solid gray;width:200px;" [(ngModel)]="NewPassword" (keypress)="capLock($event)" (keyup)="EvalPwdStrength(NewPassword,PdwcheckmsgKey,SMKey)" (change)="onPasswordChanged()" value="" />

                                            </div>

                                        </td>

                                        <td>
                                            <table style="margin-left:10px">

                                                <tr>
                                                    <td style="text-align:left;margin-top:2px;"> <img style="width:18px;height:18px;margin-top:4px" src="Images/change-password-icon.png" /></td>

                                                    <td>

                                                        <div style="text-align:left;vertical-align:central;height:22px">
                                                            <table style="text-align:left;width:267px;height:22px" cellpadding="0" cellspacing="0" class="pwdCheckInnerTable">

                                                                <tr>
                                                                    <td [attr.id]="idSM1HtmlId" width="25%" class="pwdCheckCase0" align="center"><span [attr.id]="Pdwcheckmsg1DivId" style="display:none;font-size:13px;vertical-align:central;margin-top:0px">Weak</span></td>
                                                                    <td [attr.id]="idSM2HtmlId" width="25%" class="pwdCheckCase0" align="center" style="border-left:solid 1px #ffffff"><span [attr.id]="Pdwcheckmsg0DivId" style="display:inline;font-size:13px;vertical-align:central;margin-top:1px;font-weight:normal;color:#666">No rating</span><span [attr.id]="Pdwcheckmsg2DivId" style="display:none;font-size:13px;vertical-align:central;margin-top:2px;">Medium</span></td>
                                                                    <td [attr.id]="idSM3HtmlId" width="25%" class="pwdCheckCase0" align="center" style="border-left:solid 1px #ffffff"><span [attr.id]="Pdwcheckmsg3DivId" style="display:none;font-size:13px;vertical-align:central;margin-top:1px">Strong</span></td>
                                                                    <td [attr.id]="idSM4HtmlId" width="25%" class="pwdCheckCase0" align="center" style="border-left:solid 1px #ffffff"><span [attr.id]="Pdwcheckmsg4DivId" style="display:none;font-size:13px;vertical-align:central;margin-top:1px">BEST</span></td>
                                                                </tr>
                                                            </table>




                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>






                                        </td>

                                    </tr>

                                    <tr style="height:5px"> <td colspan="2" style="height:5px"> <div style="height:5px"></div></td> </tr>

                                    <tr>



                                        <td style="text-align:left;width:120px"><div style="text-align:left;width:120px;font-size:11px;color:#6e7172">Retype Password</div> </td>
                                        <td style="text-align:left">
                                            <div style="text-align:left">




                                                <input autocomplete="new-password" type="password" style="height:22px;border-radius:3px;border:1px solid gray;width:200px;" [(ngModel)]="RetypePassword" />
                                                <!--<input autocomplete="off" type="password" [(ngModel)]="RetypePassword" >-->
                                            </div>
                                        </td>
                                        <td><div *ngIf="IsShowVerifypassError" style="text-align:left;color:red;font-size:13px;margin-left:35px;">The passwords you entered do not match. </div></td>

                                    </tr>



                                </table>




                            </div>




                        </td>

                    </tr>


                    <tr><td><div style="height:10px"></div></td></tr>

                    <tr>
                        <td>
                            <div style="height:70px;">

                                <table>
                                    <tr>
                                        <td><div style="width:250px;text-align:left"></div></td>


                                        <td style="text-align:left;">

                                            <table>
                                                <tr><td><span style="color:Teal;font-size:13px"> Strong passwords contain 8-16 characters, </span></td></tr>
                                                <tr><td><span style="color:Teal;font-size:13px"> do not include common words or names,, </span></td></tr>
                                                <tr><td><span style="color:Teal;font-size:13px"> and combine uppercase letters,, </span></td></tr>
                                                <tr><td><span style="color:Teal;font-size:13px"> lowercase letters,numbers, and symbols. </span></td></tr>
                                            </table>

                                        </td>
                                    </tr>


                                </table>

                            </div>

                        </td>

                    </tr>

                </table>



            </div>
        </td>




    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button tabindex="-1" class="Button" (click)="CancelButtonClicked()">Cancel</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button tabindex="-5" class="RedButton" (click)="SaveButtonClicked()">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
