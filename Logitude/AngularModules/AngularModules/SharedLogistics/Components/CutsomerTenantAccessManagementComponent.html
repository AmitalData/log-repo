
<style>
    .iwanttohover:hover {
        background: #DDE6F0;
    }


Test:hover {
    text-decoration: underline;
  
}

.CustomQueryLink:hover{
    cursor: pointer;
    color: #1B90CB;
}

.CustomQueryLink {
    cursor: pointer;
    font-size: 12px;
    color: #282E30;
    height: 21px;
    line-height: 21px;
    white-space: nowrap;
     text-align:center;
}

</style>




<div style="position:absolute; width:100%;height:100%; background:white;">
    <table>


        <tr><td colspan="3"><div style="height:25px"></div></td></tr>
        <tr style="height:100%">
            <td style="width:380px;">
                <table>
                
                    <tr style="vertical-align:top;height:50%;">
                        <td style="vertical-align:top">

                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <label>{{TitleSettings}}</label>
                                    </td>
                                </tr>

                                <tr style="vertical-align:top;height:5px">
                                    <td></td>
                                </tr>

                                <tr style="vertical-align:top;">
                                    <td style="vertical-align:top">
                                  
                                            <div >

                                                <!-- Activation -->
                                                <div class="QueriesSection">
                                                    <div>Activation</div>

                                                    <div>
                                                        <p class="QueryLink" (click)="SettingsLinkClick()">Settings</p>
                                                    </div>
                                                </div>                                              
                                        </div>
                                    </td>
                                </tr>

                                <tr><td><div></div></td></tr>

                            </table>


                        </td>

                    </tr>


                    <tr style="vertical-align:top;height:50%;">
                        <td style="vertical-align:top">

                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <label>{{TitleStatus}}</label>
                                    </td>
                                </tr>

                                <tr style="vertical-align:top;height:15px">
                                    <td></td>
                                </tr>

                                <tr style="vertical-align:top">
                                    <td style="vertical-align:top">

                                        <div style="vertical-align:top;margin-left:15px;">
                                            <table style="height:190px;">

                                                <tr style="vertical-align:top;">
                                                    <td style="width:182px;background-color:white;vertical-align:top">
                                                        
                                                        <div>
                                                        <table>
                                                            <tr style="height:41px;border-bottom:1px solid lightgray;border-style: dashed"><td style="color:orange;font-size:16px;vertical-align:central;">Waiting For Approval</td></tr>
                                                            <tr style="height:41px;border-bottom:1px solid lightgray;border-style: dashed"><td style="color:orange;font-size:16px;vertical-align:central;">In Progress</td></tr>
                                                            <tr style="height:41px;border-bottom:1px solid lightgray;border-style: dashed"><td style="color:green;font-size:16px;vertical-align:central;">Accepted</td></tr>
                                                            <tr style="height:41px;border-bottom:1px solid lightgray;border-style: dashed"><td style="color:red;font-size:16px;vertical-align:central;">Inactive</td></tr>

                                                           </table>
                                                        
                                                        </div>
                                                    
                                                    
                                                    </td>

                                                    <td style="width:10px;vertical-align:top"><div></div></td>

                                                    <td style="width:90px;vertical-align:top">

                                                        <div style="text-align:center;background: #EBEBEB;border-radius: 5px;">
                                                            <table style="text-align:center;">
                                                                <tr style="height:41px;text-align:center;"><td style="text-align:center"><p class="CustomQueryLink" [class.HyperlinkDisabled]="!WaitingCountEnabled"  style="font-size:20px;text-align:center;" (click)="StatusZoomCommand('W')">{{WaitingCount}}</p></td></tr>
                                                                <tr style="height:41px;text-align:center;"><td style="text-align:center"><p [class.HyperlinkDisabled]="!InProgressCountEnabled" class="CustomQueryLink" style="font-size:20px;text-align:center;" (click)="StatusZoomCommand('IP')">{{InProgressCount}}</p></td></tr>


                                                                <tr style="height:41px;text-align:center;"><td style="text-align:center"><p [class.HyperlinkDisabled]="!AcceptedCountEnabled" class="CustomQueryLink" style="font-size:20px;text-align:center" (click)="StatusZoomCommand('A')">{{AcceptedCount}}</p></td></tr>
                                                                <tr style="height:41px;text-align:center;"><td style="text-align:center"><p [class.HyperlinkDisabled]="!InactiveCountEnabled" class="CustomQueryLink" style="font-size:20px;text-align:center" (click)="StatusZoomCommand('IA')">{{InactiveCount}}</p></td></tr>

                                                            </table>

                                                        </div>

                                                    </td>

                                                    <td style="width:10px;vertical-align:top"><div></div></td>
                                                </tr>
                                            </table>
                                          
                                        </div>
                                    </td>

                                </tr>
                                <tr><td><div></div></td></tr>

                            </table>


                        </td>

                    </tr>

                </table>
            </td>

            <td style="width:15px;">
                <div></div>
            </td>

            <td>
                <table>

                    <tr style="vertical-align:top;height:50%;">
              

                        <!--table--> 


                        <td>
                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        <label> 10 Last Customer Requests</label>
                                    </td>
                                </tr>

                                <tr style="height:5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr style="height:100%">




                                    <td>
                                        <div class="CellContent">
                                            <!--(SelectedItemChanged)="OnRowSelected($event)" [SelectedRow]="SelectedRow"-->
                                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ItemsSource" (SelectedItemChanged)="OnRowSelected($event)" >

                                                <log-column [header]="'Copmany'" [binding]="'CompanyName'" [width]="'250'" [visibility]="'visibile'" [Alignment]="'left'"></log-column>
                                                <log-column [header]="'Vat #'" [binding]="'CompanyVat'" [width]="'120'" [visibility]="'visibile'" [Alignment]="'left'"></log-column>
                                                <log-column [header]="'Contact'" [binding]="'ContactName'" [width]="'150'" [visibility]="'visibile'" [Alignment]="'left'"></log-column>
                                                <log-column [width]="'120'" [header]="'Create Date'">
                                                    <log-cell-template template="let item" #logcelltemplate [TabIndex]="-1">
                                                        <div style="height: 100%; width: 100%; position: relative;">
                                                            {{item.RequestDateTime | DateTimePipe}}
                                                        </div>
                                                    </log-cell-template>
                                                </log-column>
                                                <log-column [width]="'120'" [header]="'Is Private Label'">
                                                    <log-cell-template template="let item" #logcelltemplate [TabIndex]="-1">
                                                        <div style="height: 100%; width: 100%; position: relative;">
                                                           <img *ngIf="item.IsPrivateLabelCustomer" src="./Images/GreenTick.png" width="20" height="20" />
                                                        </div>
                                                    </log-cell-template>
                                                </log-column>
                                                <!--<log-column [header]="'Create Date'" [binding]="'RequestDateTime'" [width]="'120'" [visibility]="'visibile'" [Alignment]="'left'"></log-column>-->

                                            </logitude-edit-grid>
                                        </div>
                                    </td>


                                </tr>

                                <tr style="height:5px;">
                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>








                        <!--endtable-->

                    </tr>


                    <tr style="vertical-align:top;height:50%;">
                        <td style="vertical-align:top">

                            <table>
                                <tr class="SectionHeader">
                                    <td>
                                        
                                    </td>
                                </tr>

                                <tr style="vertical-align:top;height:5px">
                                    <td></td>
                                </tr>
                                <tr><td><div></div></td></tr>

                            </table>


                        </td>

                    </tr>

                </table>
            </td>
        </tr>
    </table>

</div>
