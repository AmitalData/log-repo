<table>
    <tr style="height:100%;vertical-align:top">

        <td>

            <table>

                <tr style="height:20px;">
                    <td colspan="5">
                        <ComboBox style="width:160px;float: right;" (SelectedItemChanged)="ComboListSelectedValueChanged($event)" [ItemsSource]="ComboList" [SelectedItem]="ComboListSelectedItem" [Binding]="'Name'"></ComboBox>
                      
                    </td>
                </tr>

                <tr style="height:5px;">
                    <td colspan="5">
                     <div></div>
                    </td>
                </tr>

                <tr style="height:100%">
                    
                    
                    
                    <td style="width:50%">


                        <div style="height:100%">

                            <table>
                                <tr style="height:27px">

                                  <td> <div style="text-align:left;font-size:14px;color:#1B90CB;vertical-align:top">Customers</div></td>  
                                </tr>

                                <tr style="height:3px"><td> <div></div></td></tr>

                                 
                          

                                <tr style="height:100%">




                                    <td class="CellStretch">
                                        <div class="SimpleGridView">
                                            <div class="SimpleGridViewHeader">
                                                <table>
                                                    <tr>

                                                        <td style="width: 100%; min-width: 100%;max-width: 100%;">Customer Name</td>
                                                        <td style="width: 150px; min-width: 150px;max-width: 150px;">Contact Name</td>
                                                        <td style="width: 120px; min-width: 120px;max-width: 120px;">NO. of Activities</td>

                                                    </tr>
                                                </table>
                                            </div>

                                            <div class="SimpleGridViewBody">
                                                <table>
                                                    <tr style="height: 1px;">
                                                        <td>
                                                            <table>
                                                                <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ActivityList">
                                                                    <td>
                                                                        <table>
                                                                            <tr style="height:25px;" (click)="GetActivityDetailsList(item)" [class.RowSelected]="item === ActivityZoomSelectedItemViewModel">


                                                                                <td class="GridViewCell" style="width:100%; min-width:100%; max-width:100%; position: relative;">

                                                                                    {{item.CardName}}
                                                                          
                                                                                </td>

                                                                                <td class="GridViewCell" style="width: 150px; min-width: 150px; max-width: 150px; position: relative;">
   
                                                                                    {{item.ContactName}}
                                                                                
                                                                                </td>


                                                                                <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                                                                  {{item.Activities}}
                                                                                </td>

                                                                            </tr>
                                                                            <tr><td colspan="3"></td></tr>
                                                                        </table>


                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>

                                    </td>


                                </tr>

                            </table>

                        </div>

                    </td>



                    <td style="width:15px;"><div></div> </td>

                    <td style="width:1px;">

                        <table>
                            <tr style="height:27px;"><td><div></div></td></tr>
                            <tr>
                                <td><div style="background-color:lightgray;width:1px;height:100%;"></div></td>
                            </tr>
                        </table>
                    

                    </td>

                    <td style="width:15px;"><div></div> </td>
                   
                   
                    <td style="width:50%">


                        <div style="height:100%;vertical-align:top">

                            <table style="vertical-align:top">
                                <tr style="height:27px;vertical-align:top;">

                                    <td> <div style="text-align:left;font-size:14px;color:#1B90CB;vertical-align:top">Activities</div></td>
                                </tr>
                                <tr style="height:3px"><td> <div></div></td></tr>
                                <tr style="height:100%">




                                    <td class="CellStretch">
                                        <div class="SimpleGridView">
                                            <div class="SimpleGridViewHeader">
                                                <table>
                                                    <tr>

                                                        <td style="width: 150px; min-width: 150px;max-width: 150px;">Activity</td>
                                                        <td style="width: 100px; min-width: 100px;max-width: 100px;">Module</td>
                                                        <td style="width: 120px; min-width: 120px;max-width: 120px;">Log Date</td>
                                                        <td style="width:100%;">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>

                                            <div class="SimpleGridViewBody">
                                                <table>
                                                    <tr style="height: 1px;">
                                                        <td>
                                                            <table>
                                                                <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ActivityDetailsList">
                                                                    <td>
                                                                        <table>
                                                                            <tr style="height:25px;" (click)="ActivityDetailsSelectedItemViewModel = item" [class.RowSelected]="item === ActivityDetailsSelectedItemViewModel">


                                                                                <td class="GridViewCell" style="width:150px; min-width:150px; max-width:150px; position: relative;">

                                                                                 {{item.Activity}}

                                                                                </td>

                                                                                <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px; position: relative;">

                                                                                    {{item.Module}}

                                                                                </td>


                                                                                <td class="GridViewCell" style="width: 120px; min-width: 120px; max-width: 120px; position: relative;">
                                                                                    {{item.GMTLogDateTime | DateTimeToMSDYDatePipe}} ago

                                                                                </td>
                                                                                <td><div></div></td>

                                                                            </tr>
                                                                            <tr><td colspan="3"></td></tr>
                                                                        </table>


                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>

                                    </td>


                                </tr>
                            </table>

                        </div>

                    </td>
                </tr>



            </table>

        </td>


    </tr>



    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div>


                        </div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                          
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="CloseButtonClicked()">OK</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
