<table>
    <tr>
        <td>
            <table>

                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 180px;">
                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select Profile'" (SelectedItemChanged)="SelectedProfileItem = $event" [ItemsSource]="DigitalProfileFilterList" [SelectedItem]="SelectedProfileItem" [Binding]="'Name'"></ComboBox>
                                </td>
                                <td style="width: 5px;">
                                    <div></div>
                                </td>
                                <td style="width: 250px;">
                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select entity to show fields'" (SelectedItemChanged)="SelectedObjectTableItem = $event" [ItemsSource]="ObjectTablesFilterList" [SelectedItem]="SelectedObjectTableItem" [Binding]="'Code'"></ComboBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <logitude-edit-grid [UseVirtuallization]="true" GridWidth="100%" GridHeight="100%" [ItemSource]="FieldsItemsSource">
                                <!-- Field Name -->
                                <log-column [width]="'215'" [header]="'Field Name'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                {{item.Field}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>


                                <!-- Has permission -->
                                <log-column [width]="'250'" [header]="'Has Permission'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div *ngIf="logcelltemplate.IsDisplayMode" style="width: 100%; text-align: left;" class="TextTrimming">
                                                <table>
                                                    <tr>
                                                        <td>
                                                            <img class="CenterCenter" style="width:20px;height:20px" *ngIf="item.HasPersmission" src="./Images/Icons/MiniGreenTick.png" />
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                <LogCheckBox [ObjectFieldName]="'HasPersmission'" [Checked]="item.HasPersmission" [NoObjectField]="true" [DataContext]="item.DataContext"  [HideColumns]="true"></LogCheckBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>

                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
