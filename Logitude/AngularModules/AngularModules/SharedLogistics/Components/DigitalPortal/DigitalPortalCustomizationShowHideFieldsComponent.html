<table>
    <tr>
        <td>
            <table>

                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 180px;">
                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select Profile'" (SelectedItemChanged)="SelectedProfileItem = $event" [ItemsSource]="DigitalProfileFilterList" [SelectedItem]="SelectedProfileItem" [Binding]="'Name'"></ComboBox>
                                </td>
                                <td style="width: 5px;">
                                    <div></div>
                                </td>
                                <td style="width: 250px;">
                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select entity to show fields'" (SelectedItemChanged)="SelectedObjectTableItem = $event" [ItemsSource]="ObjectTablesFilterList" [SelectedItem]="SelectedObjectTableItem" [Binding]="'Code'"></ComboBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                                <td style="width: 100px;">
                                    <button class="Button" (click)="AddFieldClicked()">Add a field </button>
                                </td>
                                <td style="width: 5px;">
                                    <div></div>
                                </td>
                                <td style="width: 400px;">
                                    <SearchBox (TextChanged)="SearchText = $event"></SearchBox>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="FieldsItemsSource">
                                <!-- Field Name -->
                                <log-column [width]="'300'" [header]="'Field Name'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                {{item.FieldCode}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Has permission -->
                                <log-column [width]="'150'" [header]="'Has Permission'" [Editable]="true" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                            <div style="padding-top: 1px; width: 18px; height:20px;float:left;vertical-align:central">
                                                <LogCheckBox [Checked]="item.HasPermission" [NoObjectField]="true"
                                                             [ObjectFieldName]="'HasPermission'" [DataContext]="item.DataContext" [HideColumns]="true"></LogCheckBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>

                                </log-column>

                                <!-- Default Text -->
                                <log-column [width]="'250'" [header]="'Default Text'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'" [IsEnabled]="false">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                <label>{{item.DefaultText}}</label>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Display Label -->
                                <log-column [width]="'250'" [header]="'Display Text'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div *ngIf="logcelltemplate.IsDisplayMode" style="width: 100%; text-align: left;" class="TextTrimming">
                                                <table>
                                                    <tr>
                                                        <td>{{item.DisplayText}}</td>
                                                    </tr>
                                                </table>
                                            </div>
                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                <LogTextBox (LostFocus)="item.UpdateModifiedLables($event)" [FocusOnMe]="'true'" [ObjectFieldName]="'DisplayText'" [Text]="item.DisplayText" [DataContext]="item.DataContext" [NoObjectField]="true" [HideColumns]="true"></LogTextBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
