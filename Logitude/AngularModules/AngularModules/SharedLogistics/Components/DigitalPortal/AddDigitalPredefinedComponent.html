<table>
    
    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="vertical-align:top;">
        <td>
            <div class="MediaFill">
                <logitude-edit-grid  [IsReadOnly]="true" [LastDefaultSpace]="0" GridWidth="100%" GridHeight="100%" [ItemSource]="PreDefinedItemsSource" (SelectedItemChanged)="Selecting($event)" [SelectedRow]="SelectedPredefined">
                    <!-- Name -->
                    <log-column [width]="'250'" [header]="'Name'" [Alignment]="'left'">
                        <ng-template let-item>
                            <log-cell-template #logcelltemplate [Alignment]="'left'">
                                <div style="text-align: left;" class="TextTrimming">
                                    {{item.Name}}
                                </div>
                            </log-cell-template>
                        </ng-template>
                    </log-column>
                </logitude-edit-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button id="{{'CloseBtn' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CloseButtonClicked()">Cancel</button>
                    </td>
                    <td style="width: 5px;">
                        <div></div>
                    </td>
                    <td style="width: 100px;">
                        <button id="{{'CloseBtn' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="AddPredefinedComponentClicked()">Add PreDefined Component</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
