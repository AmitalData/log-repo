
<table>
    <tr>
        <td>
            <table>

                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td><div></div></td>
                                <td style="width: 400px;">
                                    <SearchBox (TextChanged)="SearchText = $event"></SearchBox>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="LabelsItemsSource">
                                <!-- Code -->
                                <log-column  [width]="'215'" [header]="'Code'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'" [IsEnabled]="false">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                {{item.TextCode}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Default Text -->
                                <log-column [width]="'250'" [header]="'Default Text'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'" [IsEnabled]="false">
                                            <div style="width: 100%; text-align: left;" class="TextTrimming">
                                                <label>{{item.DefaultText}}</label>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Display Label -->
                                <log-column [width]="'250'" [header]="'Display Text'" [Alignment]="'left'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [Alignment]="'left'">
                                            <div *ngIf="logcelltemplate.IsDisplayMode" style="width: 100%; text-align: left;" class="TextTrimming">
                                                <table>
                                                    <tr>
                                                        <td>{{item.DisplayText}}</td> 
                                                    </tr>
                                                </table>
                                            </div>
                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                <LogTextBox (LostFocus)="item.UpdateModifiedLables($event)" [FocusOnMe]="'true'" [ObjectFieldName]="'DisplayText'" [Text]="item.DisplayText" [DataContext]="item.DataContext" [NoObjectField]="true" [HideColumns]="true"></LogTextBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                            </logitude-edit-grid>
                        </div>

                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
