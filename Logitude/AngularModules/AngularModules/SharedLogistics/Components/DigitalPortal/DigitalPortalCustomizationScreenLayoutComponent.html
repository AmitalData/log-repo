<style>
    .SimpleGridViewRow:hover {
        color: black;
        cursor: pointer;
        border: 1px solid #85CBED;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#FFFFFF', endColorstr='#DDE8F5' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
    }

    .Selected {
        background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
    }

        .Selected:hover {
            background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%);
            background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
            background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%);
        }

    /* Please see the article */

    #editing, #highlighting {
        /* Both elements need the same text and space styling so they are directly on top of each other */
        margin: 10px;
        padding: 10px;
        border: 0;
        width: calc(100% - 32px);
        height: 150px;
    }

        #editing, #highlighting, #highlighting * {
            /* Also add text styles to highlighing tokens */
            font-size: 15pt;
            font-family: monospace;
            line-height: 20pt;
            tab-size: 2;
        }


    #editing, #highlighting {
        /* In the same place */
        position: absolute;
        top: 0;
        left: 0;
    }


    /* Move the textarea in front of the result */

    #editing {
        z-index: 1;
    }

    #highlighting {
        z-index: 0;
    }


    /* Make textarea almost completely transparent */

    #editing {
        color: transparent;
        background: transparent;
        caret-color: white; /* Or choose your favourite color */
    }

    /* Can be scrolled */
    #editing, #highlighting {
        overflow: auto;
        white-space: nowrap; /* Allows textarea to scroll horizontally */
    }

    /* No resize on textarea */
    #editing {
        resize: none;
    }

    /* Paragraphs; First Image */
    * {
        font-family: "Fira Code", monospace;
    }

    p code {
        border-radius: 2px;
        background-color: #eee;
        color: #111;
    }


    /* Syntax Highlighting from prism.js starts below, partly modified: */

    /* PrismJS 1.23.0
https://prismjs.com/download.html#themes=prism-funky&languages=markup */
    /**
 * prism.js Funky theme
 * Based on “Polyfilling the gaps” talk slides http://lea.verou.me/polyfilling-the-gaps/
 * @author Lea Verou
 */

    code[class*="language-"],
    pre[class*="language-"] {
        font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
        font-size: 1em;
        text-align: left;
        white-space: pre;
        word-spacing: normal;
        word-break: normal;
        word-wrap: normal;
        line-height: 1.5;
        -moz-tab-size: 4;
        -o-tab-size: 4;
        tab-size: 4;
        -webkit-hyphens: none;
        -moz-hyphens: none;
        -ms-hyphens: none;
        hyphens: none;
    }

    /* Code blocks */
    pre[class*="language-"] {
        padding: .4em .8em;
        margin: .5em 0;
        overflow: auto;
        /* background: url('data:image/svg+xml;charset=utf-8,<svg%20version%3D"1.1"%20xmlns%3D"http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg"%20width%3D"100"%20height%3D"100"%20fill%3D"rgba(0%2C0%2C0%2C.2)">%0D%0A<polygon%20points%3D"0%2C50%2050%2C0%200%2C0"%20%2F>%0D%0A<polygon%20points%3D"0%2C100%2050%2C100%20100%2C50%20100%2C0"%20%2F>%0D%0A<%2Fsvg>');
  background-size: 1em 1em; - WebCoder49*/
        background: black; /* - WebCoder49 */
    }

    code[class*="language-"] {
        background: black;
        color: white;
        box-shadow: -.3em 0 0 .3em black, .3em 0 0 .3em black;
    }

    /* Inline code */
    :not(pre) > code[class*="language-"] {
        padding: .2em;
        border-radius: .3em;
        box-shadow: none;
        white-space: normal;
    }

    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
        color: #aaa;
    }

    .token.punctuation {
        color: #999;
    }

    .token.namespace {
        opacity: .7;
    }

    .token.property,
    .token.tag,
    .token.boolean,
    .token.number,
    .token.constant,
    .token.symbol {
        color: #0cf;
    }

    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin {
        color: yellow;
    }

    .token.operator,
    .token.entity,
    .token.url,
    .language-css .token.string,
    .token.variable,
    .token.inserted {
        color: yellowgreen;
    }

    .token.atrule,
    .token.attr-value,
    .token.keyword {
        color: deeppink;
    }

    .token.regex,
    .token.important {
        color: orange;
    }

    .token.important,
    .token.bold {
        font-weight: bold;
    }

    .token.italic {
        font-style: italic;
    }

    .token.entity {
        cursor: help;
    }

    .token.deleted {
        color: red;
    }

    /* Plugin styles: Diff Highlight */
    pre.diff-highlight.diff-highlight > code .token.deleted:not(.prefix),
    pre > code.diff-highlight.diff-highlight .token.deleted:not(.prefix) {
        background-color: rgba(255, 0, 0, .3);
        display: inline;
    }

    pre.diff-highlight.diff-highlight > code .token.inserted:not(.prefix),
    pre > code.diff-highlight.diff-highlight .token.inserted:not(.prefix) {
        background-color: rgba(0, 255, 128, .3);
        display: inline;
    }

    /* End of prism.js syntax highlighting*/
</style>

<table>
    <tr>
        <!-- Left Sidebar -->
        <td style="width: 155px; border: solid 1px silver">
            <div class="SimpleGridView MediaFillAbsolute">
                <div class="SimpleGridViewHeader">
                    <table>
                        <tr>
                            <td style="width: 135px; min-width: 135px; max-width: 135px; ">Screen Name</td>
                        </tr>
                    </table>
                </div>

                <div class="SimpleGridViewBody">
                    <table>
                        <tr class="SimpleGridViewRow" *ngFor="let item of Screens" (click)="SelectionChanged(item)" [class.Selected]="item == SelectedItem">
                            <td [attr.data-cy]="item.Name">
                                <div [attr.title]="item.Name" class="GridViewCell" style="width: 135px; min-width: 135px; max-width: 135px; font-size: 11px ">
                                    {{item.Name}}
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </td>

        <td style="width: 10px;">
            <div></div>
        </td>

        <td>
            <table>
                <tr style="height: 32px;">
                    <td style="vertical-align: top">
                        <table style="height: 22px;">
                            <tr>

                                <td style="width: 170px;">
                                    <button class="Button" (click)="AddPredefinedComponentClicked()">Add Predefined Component </button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="width: 100px;">
                                    <button class="Button" (click)="AddFieldCodesClicked()">Add Field Codes </button>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>
                        </table>
                    </td>
                </tr>
                <tr style="height: 5px; vertical-align: top;">
                    <td>
                        <div></div>
                    </td>
                </tr>
                <tr style="vertical-align: top;">
                    <td>
                        <div class="MediaFill">
                            <textarea [attr.id] = "TextAreaInputId" class="language-html input shadow" style="padding: 5px; border-width: thick;font-size:14px;"
                                      [(ngModel)]="HTMLEditor"
                                      autocomplete="off"
                                      autocorrect="off"
                                      autocapitalize="off"
                                      spellcheck="false"
                                      (blur)="blur($event)"
                                      placeholder="Your HTML text here ">
                            </textarea>
                        </div>
                    </td>
                </tr>

                <tr style="height: 5px; vertical-align: top;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height: 32px;">
                    <td style="vertical-align: top">
                        <table style="height: 22px;">
                            <tr>
                                <td style="width: 150px;">
                                    <button class="Button" (click)="RestoreDefaultLayoutClicked()">Restore Default Layout </button>
                                </td>
                                <td>
                                    <div></div>
                                </td>
                               
                                <td style="width: 100px;">
                                    <button id="{{ 'SaveBtn' | IdGeneratorPipe}}" *ngIf="!IsModified" class="Button" (click)="PublichChangesClicked(false)">
                                        <img class="LeftCenter" style="margin-left: 2px;" src="./Images/Buttons/Save.png" />
                                        <span style="line-height: 19px; margin-left: 17px;">Publich Changes</span>
                                    </button>

                                    <button id="{{ 'SaveBtn' | IdGeneratorPipe}}" class="EntityChangesButton" *ngIf="IsModified" (click)="PublichChangesClicked(false)">
                                        <img class="LeftCenter" style="margin-left: 2px;" src="./Images/Buttons/Save.Red.png" />
                                        <span style="line-height: 19px; margin-left: 17px;">Publich Changes</span>
                                    </button>
                                </td>

                                <td style="width: 3px;">
                                    <div></div>
                                </td>
                                <td style="width: 100px;">
                                    <button class="Button" (click)="PublichChangesClicked(true)">Save Draft </button>
                                </td>
                                <td style="width: 3px;">
                                    <div></div>
                                </td>
                                <td style="width: 100px;">
                                    <button class="Button" (click)="PreviewChangesClicked()">Preview Changes </button>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

               
            </table>
        </td>
    </tr>

</table>
