<table *ngIf="IsVisible">
    <tr style="height: 21px;">
        <td style="height: 21px;">
            <table>
                <tr>
                    <td style="width: 300px; vertical-align:middle;">
                        <SearchTextBox [ObjectTableName]="'ObjectField'"
                                                   (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
                    </td>

                    <td> </td>
                </tr>

                <tr style="height:10px"><td colspan="2"><div></div></td></tr>

            </table>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr>
                    <td>
                        <table>
                            <tr style="vertical-align:top;">
                                <td style="padding-left: 5px; padding-right: 5px;min-height: 300px;vertical-align:top;">
                                    <div style="vertical-align:top;" class="GeneratedGridContainer">
                                        <logitude-grid style="vertical-align:top;" GridWidth="100%" GridHeight="100%"
                                                       [dataSource]="DataSource"
                                                       [columns]="columns"  [ObjectTable]="'ObjectField'"
                                                       [autoLoad]="true"
                                                       [searchFields]="searchFields"
                                                       [QueryChangeEvent]="DigitalPortalQueryChangeEvent"
                                                       [SearchFieldchangeevent]="SearchFieldchangeevent">
                                        </logitude-grid>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
