<table>
    <tr>
        <td>
            <div></div>
        </td>
    </tr>
    <tr style="height:90%;vertical-align:top">
        <td>
            <table>
                <tr>
                    <td>
                        <div class="MediaFill"> 
                            <div class="TabControl">
                                <div class="TabControlHead">
                                    <ul>
                                        <li [class.Selected]="SelectedTabCode == 'ETV'" (click)="SelectedTabChange('ETV')">
                                            <div [attr.data-cy]="'Export Translation'" style="width:150px;text-align:center;font-size:11px;color:black" class="InnerChild">
                                                <span>Export Translation</span>
                                            </div>
                                        </li>

                                        <li [class.Selected]="SelectedTabCode == 'ITV'" (click)="SelectedTabChange('ITV')">
                                            <div [attr.data-cy]="'Import Translation'" style="width:150px;text-align:center;font-size:11px;color:black" class="InnerChild">
                                                <span>Import Translation</span>
                                            </div>
                                        </li>
                                    </ul>
                                </div>

                                <div class="TabControlBody">
                                    <!--Tab 1: Export Translation -->
                                    <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'ETV'">
                                        <div class="MediaFillAbsolute">
                                            <table>
                                                <tr style="height:100%">
                                                    <td>
                                                        <div style="border:1px solid lightGray;height:100%;padding:40px 0 0 24px">
                                                            <div style="margin-bottom: 16px;font-size: 14px;font-weight: bold;">Select Language to Export</div>
                                                            <div>
                                                                <span>
                                                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select Language'" (SelectedItemChanged)="SelectedDisplayLanguage = $event" [ItemsSource]="DigitalDisplayLanguageslList" [SelectedItem]="SelectedDisplayLanguage" [Binding]="'name'"></ComboBox>
                                                                </span>
                                                                <span>
                                                                    <button style="margin-left: 16px;width: 70px;display: inline-block;" class="Button" (click)="ExportLanguage()">Export</button>
                                                                </span>
                                                            </div>
                                                            <div *ngIf="ExportErrorMsg !== null" style="color:#e53030; font-size: 12px; text-align: left;margin-top: 18px;">
                                                                {{ExportErrorMsg}}
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                    <!--Tab 2: Import Translation -->
                                    <div class="MediaFillRelative" [hidden]="SelectedTabCode != 'ITV'">
                                        <div class="MediaFillAbsolute">
                                            <table>
                                                <tr style="height:100%">
                                                    <td>
                                                        <div style="border:1px solid lightGray;height:100%;padding:40px 0 0 24px">
                                                            <div style="margin-bottom: 16px;font-size: 14px;font-weight: bold;">Select Language to Import</div>
                                                            <div>
                                                                <span>
                                                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select Language'" (SelectedItemChanged)="SelectedDisplayLanguage = $event" [ItemsSource]="DigitalDisplayLanguageslList" [SelectedItem]="SelectedDisplayLanguage" [Binding]="'name'"></ComboBox>
                                                                </span>
                                                                <span>
                                                                    <button [disabled]="!IsUploadButtonEnabled" style="margin-left: 16px;width: 70px;display: inline-block;" class="Button" (click)="OpenUpLoadFileToImportLanguage()">Import</button>
                                                                    <input [accept]="ExcelFileTypes" [attr.id]="UploadFileId" type="file" [(ngModel)]="FileData" (change)="UploadFile($event)" style="display:none;width:65px" class="upload" />
                                                                </span>
                                                            </div>
                                                            <div *ngIf="UploadedTranslationFileMSG !== ''" [style.color]="IsFileImportedSuccessfully ? '#009161' : '#e53030'" style="font-size: 12px; text-align: left;margin-top: 18px;">
                                                                {{UploadedTranslationFileMSG}}
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr *ngIf="FullComponentsVisibility" style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CloseButtonClicked()">Close</button>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
