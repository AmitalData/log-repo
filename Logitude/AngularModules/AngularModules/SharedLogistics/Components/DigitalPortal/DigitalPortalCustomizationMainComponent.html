<table>
    <tr>
        <td>
            <table>
                <tr style="height: 5px;">
                    <td></td>
                </tr>

                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 10px;">
                                    <div></div>
                                </td>

                                <td style="width: 180px;">
                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select Profile'" (SelectedItemChanged)="SelectedProfileItem = $event" [ItemsSource]="DigitalProfileFilterList" [SelectedItem]="SelectedProfileItem" [Binding]="'name'"></ComboBox>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td *ngIf="IsObjectTablesFilterVisible" style="width: 250px;">
                                    <ComboBox style="width:250px;float:left;" [WaterMark]="'Select entity to show fields'" (SelectedItemChanged)="SelectedObjectTableItem = $event" [ItemsSource]="ObjectTablesFilterList" [SelectedItem]="SelectedObjectTableItem" [Binding]="'name'"></ComboBox>
                                </td>

                                <td>
                                    <div>
                                        <ComboBox style="width:250px;float: right; margin-right: 12px;" [WaterMark]="'Select Language'" (SelectedItemChanged)="SelectedDisplayLanguage = $event" [ItemsSource]="DigitalDisplayLanguageslList" [SelectedItem]="SelectedDisplayLanguage" [Binding]="'name'"></ComboBox>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFillAbsolute MarginAbsolute10" style="background: white;">
                            <table>
                                <tr>
                                    <td>
                                        <div class="MediaFill CurvedArea">
                                            <table>
                                                <tr>

                                                    <!-- Tabs -->
                                                    <td [style.width.px]="MainMenuWidth">
                                                        <div [className]="LayoutDirection == 'rtl' ? 'MediaFill AppLeftMenuBackgroundRTL' : 'MediaFill AppLeftMenuBackground'">
                                                            <table class="PreventSelect">

                                                                <tr style="background: rgba(212, 212, 212, 0.5);">
                                                                    <td>
                                                                        <table>
                                                                            <tr style="height: 1px; background: #CCCCCC;">
                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>

                                                                            <tr>
                                                                                <td style="vertical-align:top">
                                                                                    <ul>
                                                                                        <li class="DefaultMenuItem" id="{{item.TextCode | IdGeneratorAsyncPipe | async}}" *ngFor="let item of MainMenuItems"
                                                                                            (click)="SelectionChanged(item)"
                                                                                            [style.text-align]="LayoutDirection=='rtl' ? 'right' : 'left'"
                                                                                            [class.SelectedMenuItem]="(item === SelectedMenu)">
                                                                                            <div style="position:absolute; top:0; bottom:0; margin:auto; height: 22px; line-height: 22px;"><span>{{item.TextCode}}</span></div>
                                                                                        </li>
                                                                                    </ul>
                                                                                </td>
                                                                            </tr>

                                                                            <tr style="height: 1px; background: #CCCCCC;">
                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </div>
                                                    </td>

                                                    <!-- Tab Body -->
                                                    <td>
                                                        <div *ngIf="SelectedMenu" class="MediaFill">

                                                            <div class="MediaFillAbsolute MarginAbsolute10" [hidden]="SelectedMenu.Code != 'ChageLabels'">
                                                                <div LocationDirective Code="ChageLabels"></div>
                                                            </div>
                                                            <!--<div class="MediaFillAbsolute MarginAbsolute10" [hidden]="SelectedMenu.Code != 'TranslateLabels'">
                                                                <div LocationDirective Code="TranslateLabels"></div>
                                                            </div>-->
                                                            <div class="MediaFillAbsolute MarginAbsolute10" [hidden]="SelectedMenu.Code != 'ShowHideFields'">
                                                                <div LocationDirective Code="ShowHideFields"></div>
                                                            </div>
                                                            <div class="MediaFillAbsolute MarginAbsolute10" [hidden]="SelectedMenu.Code != 'ScreenLayout'">
                                                                <div LocationDirective Code="ScreenLayout"></div>
                                                            </div>
                                                            <div class="MediaFillAbsolute MarginAbsolute10" [hidden]="SelectedMenu.Code != 'SubObjects'">
                                                                <div LocationDirective Code="SubObjects"></div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>

                <tr style="height:25px">
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <div></div>
                                </td>
                                <td style="width: 57px;">
                                    <button id="{{ 'CloseBtn' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CloseClicked()">Close</button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <!-- Save -->
                                <td *ngIf="IsSaveButtonVisible" style="width: 57px;">
                                    <button id="{{ 'SaveBtn' | IdGeneratorAsyncPipe | async}}" *ngIf="!IsDirty" class="Button" (click)="OkButtonClicked()">
                                        <img class="LeftCenter" style="margin-left: 2px;" src="./Images/Buttons/Save.png" />
                                        <span style="line-height: 19px; margin-left: 17px;">Save</span>
                                    </button>

                                    <button id="{{ 'SaveBtn' | IdGeneratorAsyncPipe | async}}" class="EntityChangesButton" *ngIf="IsDirty" (click)="OkButtonClicked()">
                                        <img class="LeftCenter" style="margin-left: 2px;" src="./Images/Buttons/Save.Red.png" />
                                        <span style="line-height: 19px; margin-left: 17px;">Save</span>
                                    </button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <!-- Save & Close -->
                                <!--<td style="width: 25px;">
                        <button id="{{ 'SaveClose' | IdGeneratorAsyncPipe | async}}" *ngIf="!IsDirty" class="Button" (click)="SaveChangesAndClose()" [title]="'General.B.SaveAndClose' | TextCodeTranslationPipe">
                            <img class="CenterCenter" src="./Images/Buttons/Save.png" />
                            <img src="./Images/RedX2.png" style="width: 7px; height: 7px; position: absolute; top:1px;" />
                        </button>

                        <button id="{{ 'SaveClose' | IdGeneratorAsyncPipe | async}}" class="EntityChangesButton" *ngIf="IsDirty" (click)="SaveChangesAndClose()" [title]="'General.B.SaveAndClose' | TextCodeTranslationPipe">
                            <img class="CenterCenter" src="./Images/Buttons/Save.Red.png" />
                            <img src="./Images/RedX2.png" style="width: 7px; height: 7px; position: absolute; top:1px;" />
                        </button>
                    </td>-->
                                <td style="width: 12px;">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td>
        </td>
    </tr>
</table>
