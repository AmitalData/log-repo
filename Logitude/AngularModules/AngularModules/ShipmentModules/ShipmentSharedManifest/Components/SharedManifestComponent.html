

<style>
  .TemplateSection {
                                width: 100%;
                                height: 100%;
                                position: relative;
                                border-radius: 8px;
                                -moz-border-radius: 8px;
                                -webkit-border-radius: 8px;
                                box-sizing: border-box;
                                -moz-box-sizing: border-box;
                                -webkit-box-sizing: border-box;
                                box-shadow: 0px 0px 1px 1px rgba(170, 170, 170, 0.7);
                                -moz-box-shadow: 0px 0px 1px 1px rgba(170, 170, 170, 0.7);
                                -webkit-box-shadow: 0px 0px 1px 1px rgba(170, 170, 170, 0.7);
                            }
                
                        
  .HousesBoxItem:hover {
        cursor: default;
        background: rgba(232, 247, 255, 1);
        border: 1px solid #3BB3E2;
        background: -moz-linear-gradient(50% 106.14% 90deg,rgba(133, 203, 237, 1) 0%,rgba(150, 211, 240, 1) 22.59%,rgba(196, 231, 248, 1) 67.37%,rgba(232, 247, 255, 1) 99.68%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: -webkit-gradient(linear,50% 106.14%,50% -10.13%,color-stop(0,rgba(133, 203, 237, 1) ),color-stop(0.2259,rgba(150, 211, 240, 1) ),color-stop(0.6737,rgba(196, 231, 248, 1) ),color-stop(0.9968,rgba(232, 247, 255, 1) ));
        background: -o-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        transition: 0.3s;
    }

    .HousesBoxItem {
        height: 60px;
        padding: 5px;
        margin-bottom: 5px;
        border: 1px solid #D1D1D1;
        background: white;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
    }



    </style>





<table *ngIf="IsLoadComponent">

    <tr>
        <td>
            <table>


                <!--Margin-->
                <tr style="height:5px;">
                    <td style="vertical-align:top"></td>
                </tr>


                <tr *ngIf="ValidationWarningsList != null && ValidationWarningsList.length > 0" style="height:1px;">
                    <td>
                        <WarningSummary [ItemsSource]="ValidationWarningsList" [SingleLine]="'true'"></WarningSummary>
                    </td>
                </tr>

                <tr style="height:5px;">
                    <td style="vertical-align:top"></td>
                </tr>


                <!--Header  Area--> 
                <tr style="height:80px;">
                    <td style="vertical-align:top">

                     <div class="TemplateSection">
                         <div #Child></div>
                     </div>
                       
                    </td>
                </tr>

                <!--Margin-->
                <tr style="height:15px;">
                    <td style="vertical-align:top"></td>
                </tr>

                <!--ButtonArea-->
                <tr style="height:15px;">
                    <td style="vertical-align:top">
                        <div *ngIf="ShowAreaButton">
                            <button *ngIf="IsShowEditButon" class="Button" style="float:right;width:55px;" (click)="EditShipment()"><span>Edit</span></button>
                            <button [disabled]="!IsEnableCreateMasterButton || IsDisableEdit" *ngIf="!IsShowEditButon" class="GreenButton" style="float:right;width:55px" (click)="OpenSharedManifestAdditionalComponent()"><span>Create</span></button>
                        </div>


                    </td>
                </tr>



                <!--Margin-->
                <tr style="height:15px;">
                    <td style="vertical-align:top">
         
                    </td>
                </tr>


                <!--House Area--> 
                <tr style="height:100%">
                    <td style="vertical-align:top;height:100%">
                        <div  style="height:100%;width:100%;border-right:1px solid #E4E3E1;border-left:1px solid #E4E3E1;border-bottom:1px solid #E4E3E1;border-radius:6px;vertical-align:top">
                            <table style="border :none;">


                                <tr style="height:25px">
                                    <td>


                                        <div style="background-color:#EDEDED;height:25px;border-top:1px solid #E4E3E1;border-top-Right-radius:6px; border-top-left-radius:6px;color:black;vertical-align:central">

                                            <table>
                                                <tr>
                                                    <td style="width:5px;"><div style="width:5px"></div></td>
                                                    <td style="width:50px;"><div style="color:#1B90CB;width:50px;">Houses</div></td>
                                                    <!--*ngIf="!IsShowEditButon && !IsNoHouses"-->
                                                    <td style="text-align:left"><div  style="font-size:11px;font-style:italic;margin-top:1px">{{LableHouseArea}}</div></td>
                                                </tr>
                                            </table>

                                        </div>

                                    </td>



                                </tr>



                                <tr class="SectionBody">
                                    <td *ngIf="!IsNoHouses">
                                 
                                        <table>

                                            <tr style="height:5px;"><td colspan="2"><div style="height:5px"></div></td></tr>
                                            <tr>
                                                <td style="width:5px;"><div style="width:5px"></div></td>

                                                <td>
                                                    <div class="ScrollViewer">
                                                        <ul class="ScrollContent">

                                                            <li class="HousesBoxItem" *ngFor="let item of HousesList">

                                                                <table>
                                                                    <tr>
                                                                        <td>
                                                                            <table>
                                                                                <tr style="height:5px"><td colspan="3"></td></tr>

                                                                                <tr>
                                                                                    <td style="width:50%">

                                                                                        <table>
                                                                                            <tr>
                                                                                                <td style="width:70px"><div style="color:#6E7172;width:70px">House:</div> </td>
                                                     
                                                                                                <td style="width:100%;">
                                                                                                    <div class="TextTrimming" style="width:200px;text-align:left">
                                                                                                        {{item.HouseNumber}}
                                                                                                    </div>

                                                                                                </td>
                                                                                            </tr>
                                                                                        </table>

                                                                                    </td>


                                                                                    <td style="width:50%">

                                                                                        <table>
                                                                                            <tr>
                                                                                                <td style="width:70px"><div style="color:#6E7172;width:70px">Shipper:</div> </td>
                                                                         
                                                                                                <td style="width:100%;">
                                                                                                    <div class="TextTrimming" style="width:200px;text-align:left">

                                                                                                        <span *ngIf="item.Shipper">{{item.Shipper.EnglishName}}</span>
                                                                                                    </div>

                                                                                                </td>
                                                                                            </tr>
                                                                                        </table>

                                                                                    </td>


                                                                                </tr>

                                                                                <tr>
                                                                                    <td style="width:50%">

                                                                                        <table>
                                                                                            <tr>
                                                                                                <td style="width:70px"><div style="color:#6E7172;width:70px">Agent Ref:</div> </td>
                                                                     
                                                                                                <td style="width:100%">
                                                                                                    <div class="TextTrimming" style="width:200px;color:black;text-align:left">
                                                                                                        {{item.ShipmentNumber}}
                                                                                                    </div>

                                                                                                </td>
                                                                                            </tr>
                                                                                        </table>

                                                                                    </td>


                                                                                    <td style="width:50%">

                                                                                        <table>
                                                                                            <tr>
                                                                                                <td style="width:70px"><div style="color:#6E7172;width:70px">Consignee:</div> </td>
                                                                              
                                                                                                <td style="width:100%;">
                                                                                                    <div class="TextTrimming" style="width:200px;text-align:left">
                                                                                                        <span *ngIf="item.Consignee">{{item.Consignee.EnglishName}}</span>
                                                                                                    </div>

                                                                                                </td>
                                                                                            </tr>
                                                                                        </table>

                                                                                    </td>


                                                                                    <!--<td style="width:100px"><div style="width:100px"></div></td>-->

                                                                                </tr>
                                                                            </table>

                                                                        </td>

                                                                        <td style="width:90px;">

                                                                            <div style="vertical-align:central">
                                                                                <button *ngIf="!item.EntityId" [disabled]="!IsEnableCreateHouse ||  IsDisableEdit" class="GreenButton" style="float:right;width:55px;margin-right:10px" (click)="OpenSharedManifestAdditionalComponent(item)"><span>Create</span></button>
                                                                                <button *ngIf="item.EntityId" class="Button" style="float:right;width:55px;margin-right:10px" (click)="EditShipment(item)"><span>Edit</span></button>
                                                                            </div>
                                                                          
                                                                        </td>

                                                                    </tr>

                                                     


                                                                </table>

                                                            

                                                            </li>
                                                        </ul>
                                                    </div>
                                                </td>


                                                <td style="width:5px;"><div style="width:5px"></div></td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td style="vertical-align:top" *ngIf="IsNoHouses"><div class="NoDataTextStyle" style="text-align:center;margin-top:15px;vertical-align:top">{{MessageNoHouseFound}}</div></td>

                                   
                                </tr>


                            </table>



                        </div>
                    </td>
                </tr>

            </table>

           


        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>


                    <td  *ngIf="IsShowMarkASCompleted" style="width:120px">
                        <div>
                            <button   [disabled]="IsDisableEdit"  class="Button" (click)="MarkASCompleted()"><span>Mark as Completed</span></button>
                        </div>
                    </td>


                    <td style="width: 5px;">
                        <div style="width: 5px;"></div>
                    </td>
                    <td *ngIf="ShowAreaButton" style="width:150px">
                        <div>
                            <button [disabled]="IsDisableEdit"  [style.width]="WidthButtonStatusChange" *ngIf="!IsShowEditButon" class="Button" (click)="ChangeStatusAgentSharedManifest()"><span>{{ButtonChangeStatusLable}}</span></button>
                        </div>
                    </td>

                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                       <div></div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
