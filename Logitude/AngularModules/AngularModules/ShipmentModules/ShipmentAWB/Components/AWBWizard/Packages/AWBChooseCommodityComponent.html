
<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 230px;">
                        <SearchBox [UseTimer]="true" (TextChanged)="SearchText = $event"></SearchBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="vertical-align:top;">
        <td>
            <table>
                <tr class="SectionHeader" style="height: 22px; border: 1px solid #AAAAAA; border-bottom:0;">
                    <td>
                        <table>
                            <tr>
                                <td style="font-size: 12px; padding-left: 10px;">My Commodities ({{MyCommoditiesCount}})</td>

                                <td style="width:20px;">
                                    <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddCommodityClicked()"></IconButton>                                   
                                </td>
                            </tr>
                        </table>
                    </td>                    
                </tr>

                <tr style="border: 1px solid #AAAAAA; border-top:0;vertical-align:top;width:100%;height:100%;">
                    <td style="padding: 2px;">
                        <div class="SimpleGridView" style="min-height:50px;vertical-align:top;">
                            <div class="SimpleGridViewHeaderDark">
                                <table>
                                    <tr>
                                        <td style="width: 100px; min-width: 100px; max-width: 100px;">Code</td>
                                        <td style="width: 600px; min-width: 600px; max-width: 600px;">Name</td>
                                        <td class="LastChild">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody">

                                <table>
                                    <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource" (click)="Selecting(item)">
                                        <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                            {{item.Code}}
                                        </td>

                                        <td class="GridViewCell" style="width: 600px; min-width: 600px; max-width: 600px;">
                                            {{item.Name}}
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>


                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="vertical-align:top;">
        <td>
            <table>
                <tr class="SectionHeader" style="height: 22px; border: 1px solid #AAAAAA; border-bottom:0;">
                    <td style="font-size: 12px; padding-left: 10px;">All Commodities ({{AllCommoditiesCount}})</td>
                </tr>

                <tr style="border: 1px solid #AAAAAA; border-top:0;vertical-align:top;width:100%;height:100%;">
                    <td style="padding: 2px;">
                        <div class="SimpleGridView" style="min-height:50px;vertical-align:top;">
                            <div class="SimpleGridViewHeaderDark">
                                <table>
                                    <tr>
                                        <td style="width: 100px; min-width: 100px; max-width: 100px;">Code</td>
                                        <td style="width: 600px; min-width: 600px; max-width: 600px;">Name</td>
                                        <td class="LastChild">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody">
                                <table>
                                    <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource_TenantZero" (click)="SelectingTenantZero(item)">
                                        <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                            {{item.Code}}
                                        </td>

                                        <td class="GridViewCell" style="width: 600px; min-width: 600px; max-width: 600px;">
                                            {{item.Name}}
                                        </td>

                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td colspan="3">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button  id="{{'CloseBtn' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
