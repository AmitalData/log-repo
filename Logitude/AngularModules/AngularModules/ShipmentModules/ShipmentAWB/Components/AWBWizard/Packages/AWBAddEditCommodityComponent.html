

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">
                <tr>
                    <td style="width: 400px;">
                        <table>

                            <!-- CommodityNumber -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'CommodityNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="DataContext.ShowWarning_CommodityNumber"></LogLabel>
                                </td>

                                <td style="width: 230px;">
                                    <LogTextBox [ObjectFieldName]="'CommodityNumber'" [Text]="DataContext.CommodityNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <!-- RateClassCode -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'RateClassCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="DataContext.ShowWarning_RateClassCode"></LogLabel>
                                </td>

                                <td>
                                    <LogLov [ObjectFieldName]="'RateClassCode'"
                                            [SelectedValue]="DataContext.RateClassCode"
                                            [ObjectTableName]="ObjectTableName"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'RateClass'">
                                    </LogLov>
                                </td>
                            </tr>

                            <!-- ChargeableWeight -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'ChargeableWeight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="ChargeableWeightLabel"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="'ChargeableWeight'" [Text]="DataContext.ChargeableWeight" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <!-- ChargeRate -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'ChargeRate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="DataContext.ShowWarning_ChargeRate"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="'ChargeRate'" [Text]="DataContext.ChargeRate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <!-- ChargeAmount -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'ChargeAmount'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [ShowWarning]="DataContext.ShowWarning_ChargeAmount"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="'ChargeAmount'" [Text]="DataContext.ChargeAmount" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <!-- DescriptionOfGoods -->
                            <tr class="FormFieldRow" style="height: 85px;">
                                <td style="vertical-align: top; padding-top: 5px;">
                                    <LogLabel [ObjectFieldName]="'DescriptionOfGoods'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="height: 85px; vertical-align: top;">
                                    <div style="height: 100%;">
                                        <LogTextBox [ObjectFieldName]="'DescriptionOfGoods'" [Text]="DataContext.DescriptionOfGoods" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="2">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td style="width: 15px;">
                        <div></div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'CancelBtn' | IdGeneratorPipe}}" class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'OKBtn' | IdGeneratorPipe}}" class="RedButton" (click)="OkButtonClicked()" [disabled]="!DataContext.IsEditingEnabled">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
