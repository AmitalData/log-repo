
<div class="TabHolder">
    <table *ngIf="IsResourcesReady">
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td>{{'Shipment.TH.ProductItems' | TextCodeTranslationPipe}}</td>

                        <td style="width: 21px">
                            <IconButton [Name]="'Add'" [IsEnabled]="IsEditingEnabled" (click)="AddProductItem()"></IconButton>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td>
                <div class="MediaFill" style="overflow-x: hidden;">
                    <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ProductItems" [Disabled]="!IsEditingEnabled" (RowEnded)="OnRowEnded($event)">

                        <log-column [header]="'Product Item'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate [IsEnabled]="IsEditingEnabled">
                                    <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                        <span>{{item.Name}}</span>
                                    </div>
                                    <div *ngIf="logcelltemplate.IsEditMode">
                                        <LogLov [ObjectFieldName]="'ProductItemId'"
                                                [ObjectTableName]="'ShipmentProductItem'"
                                                [DataContext]="item"
                                                [LookUpTableName]="'ProductItem'"
                                                [HideColumns]="true"
                                                [HideMaintenanceIcon]="true"
                                                (SelectedItemChanged)="item.ProductItem = $event"
                                                [SelectedValue]="item.ProductItemId"
                                                [DependencyFilter1Value]="CustomerId"
                                                [DisplayMemberPath]="'Name'"
                                                [FocusOnMe]="true"
                                                [QueryFilterItems]="ProductItemQueryFilters">
                                        </LogLov>
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'SKU'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.SKU}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Brand'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.Brand}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'ASIN'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.ASIN}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'UPC'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.UPC}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Country of Origin'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.OriginCountryName}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Description'" [width]="'150'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.Description}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'HTS Code'" [width]="'120'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.HTSCode}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'VAT %'" [width]="'120'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.VATPercentage}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Duties %'" [width]="'120'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.DutiesPercentage}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Other Duties'" [width]="'120'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <span>{{item.OtherDuties}}</span>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Remarks'" [width]="'100'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate [IsEnabled]="false" [CellColor]="item.CellColor">
                                    <div style="height: 100%; width: 100%; left:5px;">
                                        <img class="CenterCenter" *ngIf="!item.Remarks" src="./Images/Notes_notexists.png" style="display: block;" />
                                        <img class="CenterCenter" *ngIf="item.Remarks" src="./Images/Notes_exists.png" style="display: block;" [title]="item.Remarks" />
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <log-column [header]="'Approved'" [width]="'80'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template #logcelltemplate>
                                    <div style="height: 100%; width: 100%; position:relative;">
                                        <div class="CenterCenter" style="width: 16px;">
                                            <img *ngIf="item.ApprovedByCustomer" class="CenterCenter" src="./Images/GreenTick.png" />
                                        </div>
                                    </div>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                        <!-- Buttons -->
                        <log-column [width]="'60'" [Alignment]="'left'">
                            <ng-template let-item>
                                <log-cell-template [IgnoreMods]="true">
                                    <IconButton [Name]="'Edit'" [IsSmall]="true" style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="EditCustomerProductItem(item)"></IconButton>
                                    <IconButton [Name]="'Delete'" [IsSmall]="true" style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="item.RemoveLine()"></IconButton>
                                </log-cell-template>
                            </ng-template>
                        </log-column>

                    </logitude-edit-grid>
                </div>
            </td>
        </tr>

    </table>
</div>
