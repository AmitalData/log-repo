<style>
    .subTitle {
        color: #1b90cb;
        font-size: 16px;
    }

    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }

    .TabTitleRow {
        height: 0px !important;
    }

    .buttonNew{
        height: 21px;
        width: 95px !important;
        height: 21px!important;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>

<table *ngIf="EntityPM != null">
    <tr>
        <td>
            <div class="TableHolder">
                <table *ngIf="IsVisible">
                    <tr style="height:20px">
                        <td class="TabTitleRow" id="InlandTransportHeader" style="width:150px;">
                            {{('Shipment.TH.InlandTransport' | TextCodeTranslationPipe) || "Inland Transport"}}
                        </td>
                    </tr>
                    <tr>
                        <td style="height: 21px;padding: 0px;padding-bottom: 0px;width: 100px;">
                            <div>
                                <button class="Button buttonNew" id="buttonNewInlandTransport" (click)="AddNewInlandTransport()">         
                                    {{'ShipmentPickUpDelivery.O.OpenTransport'| TextCodeTranslationPipe}}
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" style="height: 40%;">
                            <div class="CellContent" style="bottom: 5px;padding:5px">
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ItemsSource"
                                    (SelectedItemChanged)="OnRowSelected($event)">
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.O.PickUpDeliveryNumber' | TextCodeTranslationPipe"
                                        [binding]="'PickUpDeliveryNumber'" [width]="'35'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.PickUpDeliveryNumber}}</span>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.O.CarrierName' | TextCodeTranslationPipe"
                                        [binding]="'CarrierName'" [width]="'90'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.CarrierName}}</span>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.F.Responsibility' | TextCodeTranslationPipe"
                                        [binding]="'Responsibility'" [width]="'140'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.Responsibility}}</span>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.F.FromAddressCityId' | TextCodeTranslationPipe"
                                        [binding]="'FromAddressCity'" [width]="'140'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.FromAddressCity}}</span>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.F.ToAddressCityId' | TextCodeTranslationPipe"
                                        [binding]="'ToAddressCity'" [width]="'100'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.ToAddressCity}}</span>
                                                </div>

                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.F.PackageTypeName' | TextCodeTranslationPipe"
                                        [binding]="'PackageTypeName'" [width]="'135'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.PackageTypeName}}</span>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.F.Quantity' | TextCodeTranslationPipe"
                                        [binding]="'Quantity'" [width]="'140'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.Quantity}}</span>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                    <log-column
                                        [header]="'ShipmentPickUpDelivery.F.GrossWeight' | TextCodeTranslationPipe"
                                        [binding]="'GrossWeight'" [width]="'140'" [Alignment]="'right'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <div style="text-align:right">
                                                    <span>{{item.GrossWeight}}</span>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [width]="'35'" [Editable]="true" [Alignment]="'right'"
                                        [visibility]="'visibile'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                <span class="CellSeparator" style="float: right;"></span>
                                                <div
                                                    style="width: 22px; float: right; height:20px; padding-top: 2px; display:block">
                                                    <IconButton [Name]="'Edit'" [IsSmall]="true"
                                                        (click)="EditButtonClicked(item)"></IconButton>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                 
                                    <log-column [width]="'110'" [Editable]="true" [Alignment]="'right'"
                                        [visibility]="'visibile'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                                    <div style="width: 22px; float: right; height:20px; padding-top: 2px;display:block">
                                                        <IconButton [Name]="'Delete'" [IsSmall]="true"
                                                            (click)="DeleteButtonClicked(item)"></IconButton>
                                                            <!-- [IsEnabled]="!IsDisplayOnly && !item.COONumber"></IconButton> -->
                                                    </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>
                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
</table>
