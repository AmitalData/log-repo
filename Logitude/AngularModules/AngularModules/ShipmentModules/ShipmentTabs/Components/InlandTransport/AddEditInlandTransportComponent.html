<style>
    .DisbleBox {
       display: inline-block;
       border: 1px solid #ffd800;
       border-radius: 5px;
       background: #faf5c0;
       padding: 2px 10px;
       margin: 5px;
       color: gray;
       font-family: sans-serif;
    }

    .x-split-button {
       position: relative;
       display: inline-block;
       text-align: left;
    }

    .x-button {
       width: initial !important;
       position: relative;
       margin: 0;
       height: 22px;
       float: left;
       outline: none;
       line-height: 21px;
       border: 1px solid #6A8299;
       background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(237, 192, 147, 1) 100%);
       background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(237, 192, 147, 1) 100%);
       background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 1) ));
       background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(237, 192, 147, 1) 100%);
       background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(237, 192, 147, 1) 100%);
    }

    .x-button:disabled {
       opacity: 0.5;
       pointer-events: none;
    }

    .x-button:hover {
       cursor: pointer;
       background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(237, 192, 147, 0.85) 100%);
       background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(237, 192, 147, 0.85) 100%);
       background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(237, 192, 147, 0.85) ));
       background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(237, 192, 147, 0.85) 100%);
       background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(237, 192, 147, 0.85) 100%);
    }

    .x-button:active {
       background: #F2F2F2;
    }

    .x-button.x-button-drop {
       border-right: 0;
       height: 22px;
    }

   .x-button-drop-menu {
       position: absolute;
       top: 22px;
       right: 0;
       z-index: 1000;
       text-align: right;
       float: left;
       min-width: 130px;
       font-size: 15px;
       list-style: none;
       background-color: #F2F2F2;
       background-clip: padding-box;
       border: .5px solid #45494A;
       box-shadow: .5px .5px 2px #6A8299;
   }

   .x-button-drop-menu li span {
       display: block;
       padding: 3px 20px;
       clear: both;
       font-family: arial;
       color: #444;
       text-decoration: none;
       height: 22px;
   }

   .x-button-drop-menu li span:hover {
      background: #D3D3D3;
      cursor: pointer;
   }
</style>
<table>
   <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
       <td>
           <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
       </td>
   </tr>

   <tr>
       <td class="CellStretch">
           <div class="Stretch CurvedEditArea">
               <table>
                   <tr>
                       <td class="CellStretch" style="width: 100px;">
                           <div class="Stretch AppLeftMenuBackground">
                               <table>
                                   <tr style="height:5px;">
                                       <td>
                                           <div></div>
                                       </td>
                                   </tr>

                                   <tr>
                                       <td style="vertical-align: top;">
                                           <ul *ngIf="IsResourcesReady && TabsItemsSource.length > 1">
                                               <li id="{{ item.TextCode | IdGeneratorAsyncPipe | async}}" class="DefaultMenuItem" *ngFor="let item of TabsItemsSource" (click)="SelectedTabCode = item.Code" [class.SelectedMenuItem]="item.Code === SelectedTabCode" [class.DisabledTabItem]="item.IsDisabled == true">
                                                   <div>{{item.TextCode | TextCodeTranslationPipe}}</div>
                                                   <img class="RightCenter" *ngIf="item == SelectedTab" src="./Images/SelectedMenuArrow.png" style="margin-right: -1px;" />
                                               </li>
                                           </ul>
                                       </td>
                                   </tr>
                               </table>
                           </div>
                       </td>

                       <td>    
                            <div class="MediaFill">

                               <!-- Main -->
                               <div class="MediaStretch" [hidden]="SelectedTabCode != 'MAIN'">
                                   <div LocationDirective Code="MAIN"></div>
                               </div>
                           </div>
                       </td>
                   </tr>
               </table>
           </div>
       </td>
   </tr>

   <tr style="height: 32px;">
       <td style="vertical-align: bottom">
           <table style="height: 22px;">
               <tr>
                    <td>
                        <div></div>
                    </td>

                    <!-- create new inland transport -->
                    <td style="width: 57px;">
                        <button id="NewInlandTransport" class="Button buttonNew" (click)="AddNewInlandTransport()">{{'ShipmentPickUpDelivery.O.OpenTransport'| TextCodeTranslationPipe}}</button>
                     </td>
                     <td style="width: 5px;">
                        <div></div>
                    </td>

                    <!-- Cancel -->
                    <td style="width: 57px;">
                        <button id="{{ 'CloseBtn' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CloseClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <!-- Save -->
                    <td style="width: 57px;">
                        <button id="{{ 'SaveBtn' | IdGeneratorAsyncPipe | async}}" class="EntityChangesButton" (click)="OkButtonClicked()">{{'General.B.Save' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>
               </tr>
           </table>
       </td>
   </tr>
</table>
