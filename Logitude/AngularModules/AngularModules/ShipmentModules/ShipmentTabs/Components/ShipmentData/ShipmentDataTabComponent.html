<style>

    .section-title {
        font-size: 14px;
        color: #1B90CB;
    }

    .readonly {
        pointer-events: none;
        opacity: 0.5;
    }

    .columnBetweenFields {
        width: 50px;
    }

    .field {
        width: 250px;
    }
</style>

<!-- <div *ngIf="EntityPM"> -->
<div class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td style="width: 1px;">{{('Shipment.TH.ShipmentData' | TextCodeTranslationPipe) || "Shipment Data"}}</td>
                    </tr>
                </table>
            </td>
        </tr>

        <div style="margin-bottom: 40px; width: 100% " class="section">

            <table style="width:100%;">

                <tr class="FormFieldRow">
                    <!-- CustomerId -->
                    <td tyle="width: 180px;">
                        <LogLabel [ObjectFieldName]="'CustomerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td class="field">
                        <LogLov [ObjectFieldName]="'CustomerId'"
                                [SelectedValue]="CustomerId"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DisplayMemberPath]="'LocalName'"
                                [ColumnsWidths]="ColumnsWidths"
                                [HideLastColumn]="true"
                                [HideAddLink]="true"
                                [HideAdd]="true">
                            </LogLov>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- hazmanat lakoah -->
                    <td tyle="width: 180px;">
                        <LogLabel [NoObjectField]="true" [Text]="'Shipment.O.ReferenceTypeValue' | TextCodeTranslationPipe" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td class="field">
                        <table>
                            <tr>
                                <!-- ReferenceType -->
                                <td>
                                    <LogLov [class.readonly]="disableReferenceTypeValue"
                                        [ObjectFieldName]="'ReferenceType'" 
                                        [SelectedValue]="ReferenceType"
                                        [ObjectTableName]="'ShipmentReferance'"
                                        [DataContext]="DataContext"
                                        [HideColumns]="true"
                                        [HideLastColumn]="true"
                                        [LookUpTableName]="'ReferenceType'">
                                    </LogLov>
                                </td>
                                
                                <td style="width:3px;">
                                    <div></div>
                                </td>

                                <!-- ReferenceValue -->
                                <td [class.readonly]="disableReferenceTypeValue">
                                    <LogTextBox
                                        [ObjectFieldName]="'ReferenceValue'" 
                                        [Text]="ReferenceValue"
                                        [ObjectTableName]="'ShipmentReferance'"
                                        [HideLastColumn]="true"
                                        [DataContext]="DataContext">
                                    </LogTextBox>
                                </td>
                                <td><IconButton [IsSmall]="true" [Name]="'Edit'" (click)="EditReferenceTypeValue()"></IconButton></td>
                            </tr>
                        </table>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- DepartmentId -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'DepartmentId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'DepartmentId'" 
                            [SelectedValue]="DepartmentId"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" 
                            [LookUpTableName]="'Department'"
                            [DisplayMemberPath]="'LocalName'"
                            [DependencyFilter1Value]="'C'">
                        </LogLov>
                    </td>
                    <td class="columnBetweenFields"></td>
                    
                    <!-- TransportModeId -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'TransportModeId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov
                                [ObjectFieldName]="'TransportModeId'"
                                [SelectedValue]="TransportModeId"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'TransportMode'">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- CarrierCode -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'CarrierCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'CarrierCode'" 
                            [SelectedValue]="CarrierCode"
                            [ObjectTableName]="ObjectTableName"
                            [DisplayMemberPath]="'LocalName'"
                            [DataContext]="DataContext" 
                            [SearchFieldName]="'Prefix'"
                            [LookUpTableName]="'Airline'">
                        </LogLov>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- Vessel -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'Vessel'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [IsDisabled]="TransportModeId==='A'"
                            [ObjectFieldName]="'Vessel'" 
                            [SelectedValue]="Vessel"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [LookUpTableName]="'Vessel'">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- Mawb -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'Mawb'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Shipment.F.Mawb'"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox
                            [ObjectFieldName]="'Mawb'" 
                            [Text]="Mawb"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- house -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'House'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Shipment.F.House'"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox
                            [ObjectFieldName]="'House'" 
                            [Text]="House"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- MawbDate -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'MawbDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogDatePicker [ObjectFieldName]="'MawbDate'" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="MawbDate" [DataContext]="DataContext"></LogDatePicker>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- HAWBDate -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'HAWBDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogDatePicker [ObjectFieldName]="'HAWBDate'" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="HAWBDate" [DataContext]="DataContext"></LogDatePicker>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- IskaNumber -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'IskaNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox 
                            [ForceDisable]="TransportModeId==='A'"
                            [ObjectFieldName]="'IskaNumber'" 
                            [Text]="IskaNumber"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- FlightVoyageNumber -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'FlightVoyageNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox 
                            [ObjectFieldName]="'FlightVoyageNumber'" 
                            [Text]="FlightVoyageNumber"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- FreightForwarderId / ShipmentNumber -->
                    <td style="width: 180px;">
                        <LogLabel [NoObjectField]="true" [Text]="'Shipment.O.FreightForwarderIdShipmentNumber' | TextCodeTranslationPipe" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <table>
                        <tr>
                            <!-- FreightForwarderId -->
                            <td>
                                <LogLov  [class.readonly] = "disableFreightForwarderId"
                                    [ObjectFieldName]="'FreightForwarderId'" 
                                    [SelectedValue]="FreightForwarderId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [HideLastColumn]="true"
                                    [LookUpTableName]="'Card'">
                                </LogLov>
                            </td>

                            <td style="width:3px;">
                                <div></div>
                            </td>

                            <!-- ForwarderShipmentNumber -->
                            <td>
                                <LogTextBox [class.readonly] = "disableForwarderShipmentNumber"
                                    [ObjectFieldName]="'ForwarderShipmentNumber'" 
                                    [Text]="ForwarderShipmentNumber"
                                    [ObjectTableName]="'FreightForwarderReference'"
                                    [HideLastColumn]="true"
                                    [DataContext]="DataContext">
                                </LogTextBox>
                            </td>
                            <td><IconButton [IsSmall]="true" [Name]="'Edit'" (click)="EditForwarderShipmentNumberValue()"></IconButton></td>
                        </tr>
                    </table>
                    <td class="columnBetweenFields"></td>

                    <!-- IncotermId -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'IncotermId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'IncotermId'" 
                            [SelectedValue]="IncotermId"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [LookUpTableName]="'Incoterm'">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- EstimatedArrivalDate -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'EstimatedArrivalDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <table>
                        <tr>
                            <td>
                                <LogDatePicker [ObjectFieldName]="'EstimatedArrivalDate'" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="EstimatedArrivalDate" [DataContext]="DataContext"
                                [HideColumns]="true" [HideLastColumn]="true"></LogDatePicker>
                            </td>
                            <td style="width:3px;">
                                <div></div>
                            </td>
                            <td>
                                <LogDatePicker [ObjectFieldName]="'EstimatedArrivalDate'" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="EstimatedArrivalDate" [DataContext]="DataContext" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                            </td>
                        </tr>
                    </table>
                    <td class="columnBetweenFields"></td>

                    <!-- ArrivalDate -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'ArrivalDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <table>
                        <tr>
                            <td>
                                <LogDatePicker [ObjectFieldName]="'ArrivalDate'" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="ArrivalDate" [DataContext]="DataContext"
                                [HideColumns]="true" [HideLastColumn]="true"></LogDatePicker>
                            </td>
                            <td style="width:3px;">
                                <div></div>
                            </td>
                            <td>
                                <LogDatePicker [ObjectFieldName]="'ArrivalDate'" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="ArrivalDate" [DataContext]="DataContext" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                            </td>
                        </tr>
                    </table>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- erets motsa -->
                    <td style="width: 180px;">
                        <LogLabel [NoObjectField]="true" [Text]="'ארץ מוצא'" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td></td>
                    <td class="columnBetweenFields"></td>

                    <!-- MainCarriageFromPortId -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'MainCarriageFromPortId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'MainCarriageFromPortId'" 
                            [SelectedValue]="MainCarriageFromPortId"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [LookUpTableName]="'Port'"
                            [DisplayMemberPath]="'EnglishName'"
                            [DependencyFilter1Value]="TransportModeId">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- PackageTypeCode -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'PackageTypeCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'PackageTypeCode'" 
                            [SelectedValue]="PackageTypeCode"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext" 
                            [LookUpTableName]="'Customs.PackingType'">
                        </LogLov>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- NumberOfPackages -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'NumberOfPackages'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox 
                            [ObjectFieldName]="'NumberOfPackages'" 
                            [Text]="NumberOfPackages"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- GrossWeight -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'GrossWeight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox 
                            [ObjectFieldName]="'GrossWeight'" 
                            [Text]="GrossWeight"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- volume -->
                    <td style="width: 180px;">
                        <LogLabel [NoObjectField]="true" [Text]="'Shipment.O.VolumeKgCbm' | TextCodeTranslationPipe" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <table>
                        <tr>
                            <td>
                                <LogTextBox 
                                    [ObjectFieldName]="'VolumetricWeight'" 
                                    [Text]="VolumetricWeight"
                                    [ObjectTableName]="ObjectTableName"
                                    [HideColumns]="true"
                                    [HideLastColumn]="true"
                                    [DataContext]="DataContext">
                                </LogTextBox>
                            </td>

                            <td style="width:3px;">
                                <div></div>
                            </td>

                            <td>
                                <LogTextBox 
                                    [ObjectFieldName]="'Volume'" 
                                    [Text]="Volume"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext">
                                </LogTextBox>
                            </td>
                        </tr>
                    </table>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <!-- ChargeableWeight -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'ChargeableWeight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox 
                            [ObjectFieldName]="'ChargeableWeight'" 
                            [Text]="ChargeableWeight"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- Commodity -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'Commodity'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogTextBox 
                            [ObjectFieldName]="'Commodity'" 
                            [Text]="Commodity"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td></td>
                </tr>
                <tr class="FormFieldRow">
                    <!-- DescriptionOfGoods -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'DescriptionOfGoods'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="padding-bottom: 16px; padding-top: 6px;">
                        <LogTextBox 
                            [ObjectFieldName]="'DescriptionOfGoods'" 
                            [Text]="DescriptionOfGoods"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext">
                        </LogTextBox>
                    </td>
                    <td class="columnBetweenFields"></td>
                </tr>

                <tr class="FormFieldRow">
                    <!-- ReferantUserId -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'ReferantUserId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'ReferantUserId'" 
                            [SelectedValue]="ReferantUserId"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [DisplayMemberPath]="'LocalName'"
                            [LookUpTableName]="'User'">
                        </LogLov>
                    </td>
                    <td class="columnBetweenFields"></td>

                    <!-- SalesmanUserId -->
                    <td style="width: 180px;">
                        <LogLabel [ObjectFieldName]="'SalesmanUserId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td>
                        <LogLov 
                            [ObjectFieldName]="'SalesmanUserId'" 
                            [SelectedValue]="SalesmanUserId"
                            [ObjectTableName]="ObjectTableName"
                            [DataContext]="DataContext"
                            [DisplayMemberPath]="'LocalName'"
                            [LookUpTableName]="'User'">
                        </LogLov>
                    </td>
                    <td></td>
                </tr>
            </table>
        </div>
    </table>
</div>
