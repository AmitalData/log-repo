
<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 230px;">
                        <SearchBox [UseTimer]="true" (TextChanged)="SearchText = $event"></SearchBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr class="SectionHeader" style="height: 22px; border: 1px solid #AAAAAA; border-bottom:0;">
                    <td>
                        <table>
                            <tr>
                                <td style="font-size: 12px; padding-left: 10px;">Harmonizes ({{HarmonizesCount}})</td>                                
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="border: 1px solid #AAAAAA; border-top:0;vertical-align:top;width:100%;height:100%;">
                    <td style="padding: 2px;">
                        <div class="SimpleGridView" style="min-height:50px;vertical-align:top;">
                            <div class="SimpleGridViewHeaderDark">
                                <table>
                                    <tr>
                                        <td style="width: 100px; min-width: 100px; max-width: 100px;">Code</td>

                                        <td>
                                            Description
                                        </td>

                                        <td style="width: 100px; min-width: 100px; max-width: 100px;">Chapter Code</td>
                                        
                                        <td style="width: 130px; min-width: 130px; max-width: 130px;">Sub-Chapter Code</td>

                                        <td style="width: 17px; min-width: 17px; max-width: 17px;" class="LastChild">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="SimpleGridViewBody">
                                <table>
                                    <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource" (click)="Selecting(item)">

                                        <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                            {{item.Code}}
                                        </td>

                                        <td class="GridViewCell">
                                            <div class="MediaFill" style="line-height: 25px;">
                                                {{item.Description}}
                                            </div>
                                        </td>

                                        <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                            {{item.ChapterCode}}
                                        </td>

                                        <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                            {{item.SubChapterCode}}
                                        </td>
                                    </tr>

                                    <tr>
                                        <td colspan="4">
                                            <div></div>
                                        </td>
                                    </tr>
                                </table>


                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'CloseBtn' | IdGeneratorPipe}}" class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
