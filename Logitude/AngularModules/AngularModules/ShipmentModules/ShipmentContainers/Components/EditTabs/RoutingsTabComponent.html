
<style type="text/css">
    .LegName {
        height: 13px;
        font-style: normal;
        font-weight: 500;
        font-size: 13px;
        line-height: 100%;
        color: #292D30;
        cursor: pointer;
    }

    .LegNameSelected {
        color: #1B90CB;
    }

    .LegLocation {
        height: 16px;
        font-style: normal;
        font-weight: 500;
        font-size: 12px;
        line-height: 16px;
        color: #6F7172;
    }

    .SelectedLegName {
        height: 16px;
        font-style: normal;
        font-size: 16px;
        line-height: 100%;
        color: #454545;
    }

    .Circle {
        height: 14px;
        width: 14px;
        border-radius: 50%;
        display: inline-block;
    }

</style>

                                            <tr style="height:25px;">
                                                <td style="width:14px;">
                                                    <span *ngIf="item.IsGreenCircle" class="Circle" style="background-color: #4AC76F;">
                                                        <span style="color: white; width: 7px; height: 6px;" class="TopCenter">&#10003;</span>
                                                    </span>

                                                    <svg *ngIf="item.IsOrangeCircle" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                                                        <path d="M7 14C3.1339 14 0 10.8661 0 7C0 3.1339 3.1339 0 7 0C10.8661 0 14 3.1339 14 7C14 10.8661 10.8661 14 7 14ZM7.7 7V3.5H6.3V8.4H10.5V7H7.7Z" fill="#F3942F" />

                                                <td style="width:4px;">
                                                    <div></div>
                                                </td>

                                                                <hr *ngIf="item.IsDashedLine && item.Code !='EMRT'" style="border-top: dashed 1px #C7C7C7;" />
                                                            </td>

                                                            <td style="width:8px;">
                                                                <div></div>
                                                            </td>
                                                        </tr>
                                                    </table>

                                                </td>
