
<style type="text/css">
    .LegName {
        height: 13px;
        font-style: normal;
        font-weight: 500;
        font-size: 13px;
        line-height: 100%;
        color: #292D30;
        cursor: pointer;
        left: 4px;
    }

    .LegNameSelected {
        color: #1B90CB;
    }

    .LegLocation {
        height: 16px;
        font-style: normal;
        font-weight: 500;
        font-size: 12px;
        line-height: 16px;
        color: #A4A4A4;
    }

    .SelectedLegName {
        height: 16px;
        font-style: normal;
        font-size: 16px;
        line-height: 100%;
        color: #454545;
    }

    .Circle {
        height: 14px;
        width: 14px;
        border-radius: 50%;
        display: inline-block;
    }

</style>

<div class="TabHolder" style="overflow-x:auto">
    <table>
        <tr class="TabTitleRow">
            <td>{{'Container.TH.Routings' | TextCodeTranslationPipe}}</td>
        </tr>

        <tr style="height:10px;">
            <td><div></div></td>
        </tr>

        <tr>
            <td>

                    <tr style="height: 100px;">
                        <td>
                            <table>
                                <tr>
                                    <td style="width:1px;" *ngFor="let item of ItemsSource">
                                        <table *ngIf="!item.IsLine && !item.IsHidden" style="width:140px; max-width:140px;">
                                            <tr>
                                                <td style="width:14px;">
                                                    <span class="Circle" style="background-color: #4AC76F;">
                                                        <span style="color: white; width: 7.88px; height: 6.13px;" class="TopCenter">&#10003;</span>
                                                    </span>
                                                </td>

                                                <td style="width:4px;">
                                                    <div></div>
                                                </td>

                                                <td class="LegName" [class.LegNameSelected]="item.Code == SelectedLegCode" (click)="RoutingItemClicked(item.Code)">
                                                    {{item.Name}}
                                                </td>
                                            </tr>

                                            <tr>
                                                <td style="width:14px;">
                                                    <div></div>
                                                </td>

                                                <td style="width:4px;">
                                                    <div></div>
                                                </td>

                                                <td class="LegLocation TextTrimming" style="max-width:120px;">
                                                    {{item.Location}}
                                                </td>
                                            </tr>

                                            <tr>
                                                <td style="width:14px;">
                                                    <div></div>
                                                </td>

                                                <td style="width:4px;">
                                                    <div></div>
                                                </td>

                                                <td class="LegLocation TextTrimming" style="max-width:120px;">
                                                    {{item.Date}}
                                                </td>
                                            </tr>

                                            <tr>
                                                <td colspan="3"><div></div></td>
                                            </tr>
                                        </table>

                                        <table *ngIf="item.IsLine && !item.IsHidden" style="width:76px; max-width: 76px;">
                                            <tr>
                                                <td style="width:10px;"><div></div></td>

                                                <td style="width: 56px;">
                                                    <hr *ngIf="item.IsContinuousLine" style="border-top: solid 1px #C7C7C7;" />

                                                </td>

                                                <td style="width:10px;"><div></div></td>
                                            </tr>
                                        </table>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
