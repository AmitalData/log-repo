<style>
    .HeaderBackGround {
        background: -moz-linear-gradient(-142.51% 1527.23% 0deg,rgba(226, 227, 228, 1) 0%,rgba(224, 225, 226, 1) 52.31%,rgba(217, 218, 220, 1) 72.91%,rgba(205, 207, 208, 1) 87.87%,rgba(188, 190, 192, 1) 100%);
        background: -webkit-linear-gradient(0deg, rgba(226, 227, 228, 1) 0%, rgba(224, 225, 226, 1) 52.31%, rgba(217, 218, 220, 1) 72.91%, rgba(205, 207, 208, 1) 87.87%, rgba(188, 190, 192, 1) 100%);
        background: -webkit-gradient(linear,-142.51% 1527.23%,-142.03% 1527.23%,color-stop(0,rgba(226, 227, 228, 1) ),color-stop(0.5231,rgba(224, 225, 226, 1) ),color-stop(0.7291,rgba(217, 218, 220, 1) ),color-stop(0.8787,rgba(205, 207, 208, 1) ),color-stop(1,rgba(188, 190, 192, 1) ));
        background: -o-linear-gradient(0deg, rgba(226, 227, 228, 1) 0%, rgba(224, 225, 226, 1) 52.31%, rgba(217, 218, 220, 1) 72.91%, rgba(205, 207, 208, 1) 87.87%, rgba(188, 190, 192, 1) 100%);
        background: -ms-linear-gradient(0deg, rgba(226, 227, 228, 1) 0%, rgba(224, 225, 226, 1) 52.31%, rgba(217, 218, 220, 1) 72.91%, rgba(205, 207, 208, 1) 87.87%, rgba(188, 190, 192, 1) 100%);
        background: linear-gradient(90deg, rgba(226, 227, 228, 1) 0%, rgba(224, 225, 226, 1) 52.31%, rgba(217, 218, 220, 1) 72.91%, rgba(205, 207, 208, 1) 87.87%, rgba(188, 190, 192, 1) 100%);
    }

    .DisableSharedWithAgentButton {
        opacity: 0.5;
        pointer-events: none;
    }

    .CustomTabControl .CustomTabControlHead li:not(.Selected):hover {
        background: #BACEE3;
        background: -moz-linear-gradient(white,#BACEE3);
        background: -webkit-linear-gradient(white,#BACEE3);
        background: -o-linear-gradient(white,#BACEE3);
        background: linear-gradient(white,#BACEE3);
        height: 30px;
    }

    .CustomTabControl .CustomTabControlHead li:not(.Selected) {
        height: 26px;
        margin-top: 2px;
        border-radius: 1px 1px 0px 0px;
    }

    .CustomTabControl .CustomTabControlHead li.Selected {
        height: 33px;
        margin-bottom: -1px;
        background: #DFECF7;
        border: 1px solid #A3AEB9;
        border-bottom: none;
    }

    .CustomTabControl .CustomTabControlHead li:not(:first-child):not(.Selected) {
        border-left: none;
        border-radius: 0px 1px 0px 0px;
        -moz-border-radius: 0px 1px 0px 0px;
        -webkit-border-radius: 0px 1px 0px 0px;
    }

    .CustomTabControl .CustomTabControlHead li .InnerChild {
        height: 100%;
        width: 100%;
        color: black;
        text-align: left;
        padding-left: 3px;
        padding-right: 3px;
        /*border: 1px solid #FFFFFF;*/
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        border-radius: 1px 1px 0px 0px;
        -moz-border-radius: 1px 1px 0px 0px;
        -webkit-border-radius: 1px 1px 0px 0px;
        /*background: -moz-linear-gradient(rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.976) 37.5%, rgba(255, 255, 255, 0.898) 62.5%, rgba(255, 255, 255, 0.776) 100%);
    background: -webkit-linear-gradient(rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.976) 37.5%, rgba(255, 255, 255, 0.898) 62.5%, rgba(255, 255, 255, 0.776) 100%);
    background: -o-linear-gradient(rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.976) 37.5%, rgba(255, 255, 255, 0.898) 62.5%, rgba(255, 255, 255, 0.776) 100%);
    background: linear-gradient(rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.976) 37.5%, rgba(255, 255, 255, 0.898) 62.5%, rgba(255, 255, 255, 0.776) 100%);*/
    }

    .CustomTabControl .CustomTabControlHead li {
        height: 25px;
        line-height: 20px;
        display: inline-block;
        float: left;
        cursor: default;
        overflow: hidden;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        border-radius: 1px 1px 0px 0px;
        -moz-border-radius: 1px 1px 0px 0px;
        -webkit-border-radius: 1px 1px 0px 0px;
    }

    .CustomTabControl .TabControlBody {
        width: 100%;
        height: calc(100% - 25px);
        border: 1px solid #A3AEB9;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        border-radius: 0px 0px 3px 3px;
        -moz-border-radius: 0px 0px 3px 3px;
        -webkit-border-radius: 0px 0px 3px 3px;
        /*background: white;*/
        /*position: relative;*/
    }

    .CustomTabControl .CustomTabControlHead ul {
        width: 100%;
        position: absolute;
        bottom: 0;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .CustomTabControl .CustomTabControlHead {
        width: 100%;
        height: 25px;
        position: relative;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .CustomTabControl {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    .Disable {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr *ngIf="ShareAsDefault == true && IsNewDocument == true" style="height:1px;">
        <td style="text-align:center;">
            <span style="background:#FFD505;padding-left:5px;"> New documents are automatically shared with {{this.AgentLable}} - </span>
            <span *ngIf="ShareAsDefault == true" (click)="onUnShare()" style="color:#0859FB;cursor:pointer;background:#FFD505;padding-right:5px;">UnShare </span>
            <!--<span *ngIf="ShareAsDefault != true" style="color:#0859FB;cursor:pointer;background:#FFD505;padding-right:5px;">UnShared </span>-->
        </td>
    </tr>
    <tr *ngIf="OrigionalShareAsDefault == true && IsNewDocument == true" style="height:3px;">
        <td style="text-align:center;"> 
        </td>
    </tr>
    <tr>

                                    </div>
                                </td>
                                <td style="width:50%;">
                                    <table>
                                        <tr>
                                            <td>

                                                            <!--<img src="./Images/ShareWithAgentGray.png" /> Share With Agent-->
                                                            <div *ngIf="!EntityPm.IsSharedWithForwarder"><img src="./Images/ShareWithAgentGray.png" style="margin-top: -3px;margin-right: 3px;" />Share With {{AgentLable}}</div>
                                                            <div *ngIf="EntityPm.IsSharedWithForwarder"><img src="./Images/SharedWithAgentB.png" style="margin-top: -3px;margin-right: 3px;" />Shared With {{AgentLable}}</div>
                                                        </button>
                                                        <img src="./Images/SharedNote.png" style="width:22px;height:22px;float:left" class="ActionButtons" (mouseout)="HideNoteClicked()" (mouseover)="ShowNoteClicked()" />
                                                    </div>
                                                    <div style="float:right;">
                                                        <img src="./Images/close.png" style="width:22px;height:22px;cursor:pointer;" class="ActionButtons" [class.Disable]="EntityPm.IsSharedWithForwarder || EntityPm.SignRequestByUserEmail" title="Delete" (click)="DeleteDocumentFile()" />
                                                        <img src="./Images/sendmail.png" style="width:22px;height:22px;cursor:pointer;" class="ActionButtons" title="Send" (click)="SendDocumentFile()" />
                                                        <img src="./Images/DownArrow.png" style="width:22px;height:22px;cursor:pointer;" class="ActionButtons" title="DownLoad" (click)="DownloadDocumentFile()" />
                                                        <img [class.DisableSharedWithAgentButton]="!IssharedWithAgentButtonEnabled" [hidden]="!DocumentTypeId" *ngIf="IsPDF" src="./Images/UploadLB.png" style="width:22px;height:22px;cursor:pointer;" class="ActionButtons" title="Upload File" (click)="UploadClicked()" />
                                                        <div style="float:right;margin-left:3px;margin-top:1px;" *ngIf="!EntityPm.SignRequestByUserEmail">
                                                            <img style="width:20px;height:20px;" *ngIf="EntityPm.IsDigitallySigned" src="./Images/DigitallySigned.png" [title]="EntityPm.SignersList" />
                                                            <img style="width:20px;height:20px;cursor:pointer;" *ngIf="!EntityPm.IsDigitallySigned" src="./Images/DigitallySignedG.png" (click)="SetDigitallySigned(EntityPm)" />
                                                        </div>
                                                        <div style="float:right;margin-left:3px;margin-top:1px;width:22px;height:22px;" *ngIf="EntityPm.SignRequestByUserEmail">

                                                            <img src="./Images/DigitallySignedO.png" style="position:absolute;top:6px;right:5px;" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <img id="ShareNote" *ngIf="ShowNote == true" src="./Images/ShareWithAgentNote.png" style="position:fixed;z-index:1;margin-left: 35px;" class="ActionButtons" />
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr  style="height:90px;border-bottom:1px solid rgba(217, 218, 220, 1)">
                    <td >
                        <div>
                            <table>
                                <tr>
                                    <td style="width:50%">
                                        <table>
                                            <tr style="height:40px;">

                                                    <LogLov *ngIf="ShowTypes == true" [LogitudeForm]="myForm" style="float: left;width: 130px;margin-left: 5px;"

                                                    </div>

                                            </tr>

                                            <tr style="height:40px;">
                                                <td style="width:120px">
                                                    <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="'DocumentsFiling'" [DataContext]="DataContext"></LogLabel>

                                                <td><LogTextBox [LogitudeForm]="myForm" [ObjectFieldName]="'Description'" [DataContext]="DataContext" [Text]="Description"></LogTextBox></td>
                                            </tr>


                                            <!--<tr style="height:40px;">
                                                <td>
                                                    <span *ngIf="MetaDataVisibility == true" style="font-size:14px;color:#00C3FF;margin-left:10px;">Meta Data</span>
                                                </td>

                                                        </div>

                                                    <div *ngSwitchCase="'int'" style="display: inline-flex;">

                                                            <div style="height: 22px;min-height: 22px;max-height: 22px;width: 100%;border: 1px solid #AAAAAA;outline: none;font-size: 11px;color: #45494A;background: white;box-shadow: inset 0 0 3px #AAAAAA;">

                                            </tr>-->



                                        </table>
                                    </td>

                                    <td style="height:75px;width:50%" [class.Disable]="IsPrivateLabel">

                                        <table>
                                            <tr>
                                                <td style="width:57px;vertical-align:top"><span style="left:2px;top:5px;font-size:12px;;vertical-align:top"></span></td>
                                                <td>
                                                    <div style="height:75px">
                                                        <LogTextBox  style="height:80px" [Placeholder]="'Notes'" [HideColumns]="true" [HideLastColumn]="true" [ObjectFieldName]="'Notes'" [IsMultiline]="true" [DataContext]="DataContext" [Text]="Notes"></LogTextBox>

                <tr style="height:10px;"><td></td></tr>


                <tr>

                   <div style="height:100%;">

                               <tr>
                                   <td>
                                       <iframe id="pdfQuoteViewerFrame" name="pdfQuoteViewerFrame" [src]="IFrameURI | SafePipe" style="width:100%;height:100%;margin-bottom:5px;">Loading...</iframe>

                               </tr>

                                </td>
                            </tr>
