
<style>
    .MenuFilters {
        color: #909293;
        text-align: center;
        cursor: default;
    }

        .MenuFilters:hover {
            text-align: center;
            background-image: url('../../../Images/LogBox/FilterHover.png');
            background-repeat: no-repeat;
        }

    .Selected {
        color: white;
        text-align: center;
        background-image: url('../../../Images/LogBox/FilterSelected.png');
        background-repeat: no-repeat;
    }

        .Selected:hover {
            color: white;
            text-align: center;
            background-image: url('../../../Images/LogBox/FilterSelected.png');
            background-repeat: no-repeat;
        }

    .MenuFilters .MenuFiltersCount {
        font-size: 33px;
    }

    .MenuFilters .MenuFiltersName {
        font-size: 13px;
    }

    .Disabled {
        opacity: 0.5;
        pointer-events: none;
    }
     .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr style="height: 10px;">
        <td style="height: 10px;">
            <div></div>
            <!--<sample-element style="height:500px;" class="jumbotron simple-element"></sample-element>-->
        </td>
    </tr>
     
    <tr style="height:10px;">
        <td></td>
    </tr>
    <tr style="height: 21px;">
        <td style="height: 21px; vertical-align:middle;">
            <table>
                <tr>
                    <td style="width: 21px;">
                        <IconButton [Name]="'Refresh'" (click)="RefreshBtnClick()"></IconButton>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 250px; vertical-align: middle;">
                        <!--<SearchTextBox [ObjectTableName]="'Shipment'" (SearchTextChangeEvent)="onSearchTextChangeEvent($event)" [PlaceHolder]="'Search Shipments ...'"></SearchTextBox>-->
                        <ComboBox style="width:150px;margin-right:5px;" (SelectedItemChanged)="mySelectedFilterValueChanged($event)" [ItemsSource]="MyFilters" [SelectedItem]="mySelectedFilter" [Binding]="'Name'"></ComboBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 230px; vertical-align: middle; position:relative;">
                        <ul class="FiltersMenu">
                            <li (click)="itemClicked('All')" (mouseover)="itemMouseOver('All')" style="width:55px;" (mouseleave)="itemMouseLeave('All')" [class.SelectedFilter]="SelectedValue === 'All'">
                                All
                            </li>
                            <li (click)="itemClicked('7d')" (mouseover)="itemMouseOver('7d')" style="width:55px;" (mouseleave)="itemMouseLeave('7d')" [class.SelectedFilter]="SelectedValue === '7d'">
                                7d
                            </li>
                            <li (click)="itemClicked('30d')" (mouseover)="itemMouseOver('30d')" style="width:55px;" (mouseleave)="itemMouseLeave('30d')" [class.SelectedFilter]="SelectedValue === '30d'">
                                30d
                            </li>
                            <li (click)="itemClicked('45d')" (mouseover)="itemMouseOver('45d')" style="width:55px;" (mouseleave)="itemMouseLeave('45d')" [class.SelectedFilter]="SelectedValue === '45d'">
                                45d
                            </li>
                        </ul>
                    </td>

                    <td style="width: 3px;">
                        <div></div>
                    </td>

                    <td style="width: 142px; vertical-align: middle; position:relative;">
                        <TransportsFilter (SelectedValueChanged)="SelectedTransportFilter = $event"></TransportsFilter>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr> 
            </table>
        </td>
    </tr>

    <tr style="height: 10px;" *ngIf="SelectedItemsCountText">
        <td>
            <table>
                <tr>
                    <!--<td style="height: 10px;width:7px;">
                        <div></div>
                    </td>
                    <td style="width:30px">
                        <CheckBox [IsChecked]="IsAllRecordSelected" (Checked)="IsAllRecordSelected = $event "></CheckBox>
                    </td>-->
                    <td style="width:200px">
                        <div style="width: 228px;text-align:center;  height:22px;" class="DisbleBox" >
                            <div style="margin-right:5px;margin-left:-2px;float:left;width:16px;">
                                <CheckBox [IsChecked]="IsAllRecordSelected" (Checked)="IsAllRecordSelected = $event "></CheckBox>
                            </div>
                            <div style="width:175px;margin-top:1px;">
                                 
                                {{SelectedItemsCountText}}


                            </div>
                        </div>
                    </td>
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td> 
    </tr> 

    <tr style="height: 10px;">
        <td style="height: 10px;">
            <div></div>
        </td>
    </tr>
    <tr>
        <td style="height: 100%">
            <div style="width:100%;height:100%;background-color: #EAEAEB;border: 1px solid #cccccc;">
                <table>
                    <tr>
                        <td>
                            <div style="height: Calc(100% - 1px);background-color:white;">
                                <logitude-grid GridWidth="100%" GridHeight="100%" [ObjectTable]="'Shipment'" [dataSource]="DataSource"
                                               [MenuHeaderchangeevent]="MenuHeaderchangeevent" (rowSelectedEvent)="onRowSelected($event)"
                                               [SelectedRow]="SelectedRow" [columns]="columns" [autoLoad]="true" [rows]="items"
                                               [CustomColumnsReady]="CustomColumnsReady" (AfterViewInitCompleted)="GridAfterViewInitCompleted($event)"
                                               (CountReady)="onCountReady($event)" [SearchFieldchangeevent]="SearchFieldchangeevent"
                                               [EnableRowHoverVisibility]="true" [RowHoverVisibilityQueryName]="SelectedFilter"  (CheckBoxChecked)="onCheckBoxChecked($event)"
                                               [IsAllRecordsChecked]="IsAllRecordSelected" >
                                </logitude-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="height:30px;float:right;">

                <button class="RedButton" (click)="SaveData()" style="width:80px;float: right;margin: 4px;">Archive</button>
                <button class="Button" (click)="CloseButtonClicked()" style="width:80px;float: right;margin:4px;">Close</button>
            </div>
        </td>
    </tr>
</table>
<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator"></BusyIndicator>
