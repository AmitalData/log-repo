
<style>
    .emptyticket {
        border: 1px solid #8C8C8C;
        border-radius: 10px;
        width: 168px;
        height: 164px;
        background: white;
        margin: 5px;
        margin-left: 15px;
        float: left;
    }

        .emptyticket:hover {
            background: #8C8C8C;
            cursor: pointer;
        }

    .infoColor {
        background: -moz-linear-gradient(50.55% 126.37% 91.55deg,rgba(255, 255, 255, 1) 0%,rgba(242, 242, 242, 1) 51.84%,rgba(212, 212, 212, 1) 100%);
        background: -webkit-linear-gradient(91.55deg, rgba(255, 255, 255, 1) 0%, rgba(242, 242, 242, 1) 51.84%, rgba(212, 212, 212, 1) 100%);
        background: -webkit-gradient(linear,50.55% 126.37%,49.7% 8.42%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(0.5184,rgba(242, 242, 242, 1) ),color-stop(1,rgba(212, 212, 212, 1) ));
        background: -o-linear-gradient(91.55deg, rgba(255, 255, 255, 1) 0%, rgba(242, 242, 242, 1) 51.84%, rgba(212, 212, 212, 1) 100%);
        background: -ms-linear-gradient(91.55deg, rgba(255, 255, 255, 1) 0%, rgba(242, 242, 242, 1) 51.84%, rgba(212, 212, 212, 1) 100%);
        background: linear-gradient(-1.55deg, rgba(255, 255, 255, 1) 0%, rgba(242, 242, 242, 1) 51.84%, rgba(212, 212, 212, 1) 100%);
        border-style: Solid;
        border-color: #BCBEC0;
        border-color: rgba(188, 190, 192, 1);
        border-width: 1px;
        border-radius: 0px 0px 10px 10px;
    }

    .SearchResult {
        border: 1px solid #FFD700;
    }

    .emptyticket .infoColor .ActionButtons {
        visibility: hidden;
    }

    .emptyticket:hover .infoColor .ActionButtons {
        visibility: visible;
    }

    .emptyticket .MyIconButton {
        visibility: hidden;
    }

    .emptyticket:hover .MyIconButton {
        visibility: visible;
    }
    .BodyBackground {
        background: #DFECF7;
    }
    .WarningSummary {
        height: 100%;
        width: 100%;
        border: 1px solid Orange;
        border-radius: 5px;
        background: #FFFBDA;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        overflow: hidden;
    }
    .Disable {
       opacity:0.5;
       pointer-events:none;
    }
   .tooltip {
    position: relative;
    display: inline-block;
    
}

.tooltip .tooltiptext {
    visibility: hidden;
    width: 350px;
    background-color: #6A8299;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 5px 5px;
    position: absolute;
    z-index: 1;
    bottom: 0;
    right: 110%;
    margin-left: 5px;
    opacity: 0;
    transition: opacity 0.3s;
}

.tooltip .tooltiptext::after {
    content: "";
    position: absolute;
    top: 80%;
    left: 98%;
    margin-left: 5px;
    border-width: 5px;
    border-style: solid;
    border-color: transparent transparent transparent #6A8299;
}

.tooltip:hover .tooltiptext {
    visibility: visible;
    opacity: 1;
}
</style>
