

<table>
    <tr style="height:1px;">
        <td>
            <div style="margin-left:7px;color:#5A5A5A;">
                {{SystemName}} allows you to define what document types require a digital sign.
            </div>
        </td>
    </tr>
    <tr style="height:13px;">
        <td></td>
    </tr>
    <tr>
        <td>
            <!--<div class="MediaFill">
                <LogTextBox [Placeholder]="'אנא מלא את ההסבר לדחיית ההצהרה'" [HideColumns]="true" [HideLastColumn]="true" [ObjectFieldName]="'DenyReason'" [IsMultiline]="true" [DataContext]="DataContext" [Text]="DenyReason"></LogTextBox>
            </div>-->
            <div class="SimpleGridView" style="background: none;">
                <div class="SimpleGridViewHeader" style="background: none; border: none;">
                    <table>
                        <tr>
                            <td style="width: 170px; min-width: 170px; max-width: 170px;border-right:none;" class="LastChild">
                                <div></div>
                            </td>
                            <!--<img *ngIf="SelectedShipment && SelectedShipment.TransportModeId == 'O'" src="./Images/Vessel.png" style="width:23px;height:18px;vertical-align:middle;" />
                            <img *ngIf="SelectedShipment && SelectedShipment.TransportModeId == 'A'" src="./Images/Airline.png" style="width:23px;height:18px;vertical-align:middle;" />
                            <img *ngIf="SelectedShipment && SelectedShipment.TransportModeId == 'I'" src="./Images/Trucker.png" style="width:23px;height:18px;vertical-align:middle;" />-->
                            <td style="width: 100px; min-width: 100px; max-width: 100px; color : #6E7172;border-right:none;font-size:13px;" class="LastChild"><img src="./Images/Airline.png" style="width:23px;height:18px;vertical-align:middle;margin-right:7px;" />Air</td>
                            <td style="width: 100px; min-width: 100px; max-width: 100px; color : #6E7172;border-right:none;font-size:13px;" class="LastChild"><img src="./Images/Vessel.png" style="width:23px;height:18px;vertical-align:middle;margin-right:7px;" />Ocean</td>
                            <td style="width: 100px; min-width: 100px; max-width: 100px; color : #6E7172;border-right:none;font-size:13px;" class="LastChild"><img src="./Images/Trucker.png" style="width:23px;height:18px;vertical-align:middle;margin-right:7px;" />Inland</td>
                        </tr>
                    </table>
                </div>

                <div class="SimpleGridViewBody" style="border: 1px solid #cccccc;border-radius: 2px;">
                    <table>
                        <tr class="SimpleGridViewRow" style="border-bottom:none;" *ngFor="let type of DocTypes"><!---->
                            <td class="GridViewCell" style="width: 170px; min-width: 170px; max-width: 170px;" [title]="type.Name.length > 30 ? type.Name : ''">
                                {{type.Name}}
                            </td>
                            <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                <div style="margin-left:25px">
                                    <LogCheckBox [ObjectFieldName]="'IsAirDigitalSignRequired'" [DataContext]="type" (ValueChanged)="onCheckBoxChecked(type)"></LogCheckBox>
                                </div>
                            </td>

                            <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                <div style="margin-left:25px">
                                    <LogCheckBox [ObjectFieldName]="'IsOceanDigitalSignRequired'" [DataContext]="type" (ValueChanged)="onCheckBoxChecked(type)"></LogCheckBox>
                                </div>
                            </td>

                            <td class="GridViewCell" style="width: 100px; min-width: 100px; max-width: 100px;">
                                <div style="margin-left:25px">
                                    <LogCheckBox [ObjectFieldName]="'IsInlandDigitalSignRequired'" [DataContext]="type" (ValueChanged)="onCheckBoxChecked(type)"></LogCheckBox>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="8">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </td>
    </tr>
    <tr style="height:12px;">
        <td></td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="float:left;font-size:11px;color:#5A5A5A;">
                You can change this setting anytime from document types menu in maintenance
            </div>
            <div style="float:right;">
                <button class="RedButton" (click)="OKButtonClicked()" style="float: right;margin-right: 7px;width:65px;">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
            </div>
            <div style="float:right;">
                <button class="Button" (click)="CloseButtonClicked()" style="float: right;margin-left: 7px;margin-right: 7px;">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
            </div>
        </td>
    </tr>
</table>
