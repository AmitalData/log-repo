    .LogitudeWindow {
        position: absolute;
        max-width:600px;
        /*top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: auto;*/
        border-radius: 8px;
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        background: -moz-linear-gradient(50% 100% 90deg,rgba(255, 255, 255, 1) 89.25%,rgba(230, 230, 230, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(230, 230, 230, 1) 100%);

        background: -o-linear-gradient(90deg, rgba(255, 255, 255, 1) 89.25%, rgba(230, 230, 230, 1) 100%);
        background: linear-gradient(0deg, rgba(255, 255, 255, 1) 89.25%, rgba(230, 230, 230, 1) 100%);
        border: 1px solid #C8C8C8;
        overflow: hidden;
        /*vertical-align: middle;
        display: block;
        margin: auto;*/
    }

    .WarningSummary {
        height: 100%;
        width: 100%;
        border: 1px solid Orange;
        border-radius: 5px;
        background: #FFFBDA;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        overflow: hidden;
    }
    .Disable {
       opacity:0.5;
       pointer-events:none;
    }
   .tooltip {
    position: relative;
    display: inline-block;
    
}

.tooltip .tooltiptext {
    visibility: hidden;
    width: 350px;
    background-color: #6A8299;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 5px 5px;
    position: absolute;
    z-index: 1;
    bottom: 0;
    right: 110%;
    margin-left: 5px;
    opacity: 0;
    transition: opacity 0.3s;
}

.tooltip .tooltiptext::after {
    content: "";
    position: absolute;
    top: 80%;
    left: 98%;
    margin-left: 5px;
    border-width: 5px;
    border-style: solid;
    border-color: transparent transparent transparent #6A8299;
}

.tooltip:hover .tooltiptext {
    visibility: visible;
    opacity: 1;
}

.MyLabel{
    font-size:13px;
    padding-left:10px;
    color: rgb(110, 113, 114);
     font-family: sans-serif;
}
</style>
