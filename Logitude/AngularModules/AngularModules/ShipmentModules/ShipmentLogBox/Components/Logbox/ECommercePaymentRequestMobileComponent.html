   .tooltip {
    position: relative;
    display: inline-block;
    
}

.tooltip .tooltiptext {
    visibility: hidden;
    width: 350px;
    background-color: #6A8299;
    color: #fff;
    text-align: left;
    border-radius: 6px;
    padding: 5px 5px;
    position: absolute;
    z-index: 1;
    bottom: 0;
    right: 110%;
    margin-left: 5px;
    opacity: 0;
    transition: opacity 0.3s;
}

.tooltip .tooltiptext::after {
    content: "";
    position: absolute;
    top: 80%;
    left: 98%;
    margin-left: 5px;
    border-width: 5px;
    border-style: solid;
    border-color: transparent transparent transparent #6A8299;
}

.tooltip:hover .tooltiptext {
    visibility: visible;
    opacity: 1;
}

.MyLabel{
    font-size:17px;
    padding-left:10px;
    color: rgb(110, 113, 114);
     font-family: sans-serif;
}
