<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <table>
                <tr style="height: 10px;">
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>
                <tr>
                    <td style="width:112px;">
                        <table>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Transportation Type

                            </tr>

                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Order Number
                                    </label>

                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Agent
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="width: 7px; height: 7px; background: transparent; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Gateway
                                    </label>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="width: 7px; height: 7px; background: transparent; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Supplier Name
                                    </label>
                                </td>
                            </tr>
                            <tr><td><div></div></td></tr>
                        </table>
                    </td>
                    <td style="width:6px;"><div></div></td>
                    <td>
                        <table>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogLov 
                                            [ObjectFieldName]="'TransportModeId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'TransportMode'">
                                    </LogLov>
                                </td>
                            </tr>

                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogTextBox [ObjectFieldName]="'CustomerReference1'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogLov [RunToggleMode]="true"
                                            [ObjectFieldName]="'ForwarderPartnerId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'HybridPartner'">
                                    </LogLov>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogLov [RunToggleMode]="true"
                                            [ObjectFieldName]="'FromPortId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Port'">
                                    </LogLov>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogTextBox [ObjectFieldName]="'ShipperName'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                        </table>

                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">

                            <tr style="height: 30px;">
                                <td style="height: 22px;"></td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <div style="width: 7px; height: 7px; background: transparent; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height: 22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        Destination
                                    </label>
                                </td>

                            <tr style="height: 30px;">
                                <td style="height: 22px;"></td>
                            </tr>
                            <tr><td><div></div></td></tr>
                        </table>
                    </td>
                    <td style="width:6px;"><div></div></td>
                    <td>
                        <table>
                            <tr style="height: 30px;">
                                <td style="height: 22px;"></td>
                            </tr>

                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogTextBox [ObjectFieldName]="'CustomerReference2'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;"></td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;">
                                    <LogLov [RunToggleMode]="true"
                                            [ObjectFieldName]="'ToPortId'"
                                            [DataContext]="DataContext"
                                            [LookUpTableName]="'Port'">
                                    </LogLov>
                                </td>
                            </tr>
                            <tr style="height: 30px;">
                                <td style="height: 22px;"></td>
                            </tr>

                        </table>
                    </td>

                <tr style="height:1px;">
                    <td><div></div></td>
                    <td><div></div></td>
                    <td><div></div></td>
                    <td><div></div></td>
                    <td><div></div></td>
                    <td><div></div></td>
                    <td>
                        <div>
                            <button class="RedButton" (click)="SaveChanges()" style="width:57px;float: right;margin-left: 7px;margin-right: 7px;">OK</button>
                            <button class="Button" (click)="CancelButtonClicked()" style="width:57px;float: right;">Cancel</button>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
