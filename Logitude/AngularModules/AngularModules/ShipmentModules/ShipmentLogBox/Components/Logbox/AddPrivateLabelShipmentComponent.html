

<style type="text/css">
	.NotesBox p {
		font-size: 11px;
		color: #6E7172;
		white-space: normal;
		word-wrap: break-word;
		text-wrap: normal;
		text-overflow: ellipsis;
	}

	.NotesBox {
		background: #FFFADC;
		border: 1px solid #AAAAAA;
		border-radius: 3px;
		-moz-border-radius: 3px;
		-webkit-border-radius: 3px;
		box-sizing: border-box;
		-moz-box-sizing: border-box;
		-webkit-box-sizing: border-box;
		padding: 5px;
		line-height: 12px;
		text-align: left;
		overflow-x: hidden;
		overflow-y: scroll;
		margin-right: 36px;
	}

	.SectionTitle > span {
		font-size: 14px;
		user-select: text;
		-webkit-user-select: auto;
	}

	.SectionTitle td {
		font-size: 14px;
		user-select: text;
	}

	.SectionTitle {
		height: 20px;
		line-height: 20px;
		font-size: 14px;
		color: #1B90CB;
		user-select: text;
		-webkit-user-select: text;
	}

	.SetCustomer:hover .SetCustomerIcon {
		background: url('./Images/Menu/Person.png') center center;
		background-size: contain;
	}

	.SetCustomer:hover .SetCustomerText {
		color: #0075AF;
	}

	.SetCustomerIcon {
		display: inline-block;
		background: url('./Images/Menu/Person.Gray.png') center center;
		background-size: contain;
	}

	.SetCustomerText {
		color: #BABABA;
	}

	.SetCustomer {
		cursor: pointer;
	}

	.AppLeftMenuBackground .RadioButton {
		margin-left: 5px;
		margin-top: 5px;
	}

	.GreenAddButtonDisabled {
		pointer-events: none;
	}

	.GreenAddButton:hover {
		background: url('./Images/Buttons/AddGreenSolid.png') center center;
		background-size: contain;
	}

	.GreenAddButton {
		width: 12px;
		height: 12px;
		background: url('./Images/Buttons/AddGreenBrush.png') center center;
		background-size: contain;
		cursor: pointer;
	}

	.Pakages {
		font-size: 11px;
		font-style: italic;
		position: relative;
		left: 30px;
		color: rgb(110, 113, 114);
	}

    .FlightDate {
        position: relative;
        font-size: 12px;
        color: rgb(110, 113, 114); 
    }

	.Disabled {
		pointer-events: none;
		opacity: 0.5;
	}

	.IconButton img {
		position: absolute;
		top: 1px;
		left: 1px;
		bottom: 0;
		right: 0;
		margin: auto;
	}

	.IconButton:focus:not(:disabled) {
		border: 1px solid #3BB3E2;
		-webkit-box-shadow: 0px 0px 6px 0px #3BB3E2;
		-moz-box-shadow: 0px 0px 6px 0px #3BB3E2;
		box-shadow: 0px 0px 6px 0px #3BB3E2;
	}

	.IconButton:hover:not(:disabled) {
		cursor: pointer;
		background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(221, 232, 245, 1) 100%);
		background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
		background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(221, 232, 245, 1) ));
		background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
		background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(221, 232, 245, 1) 100%);
	}

	.IconButton:disabled {
		opacity: 0.5;
		pointer-events: none;
	}

	.IconButton {
		display: block;
		float: left;
		width: 21px;
		height: 21px;
		outline: none;
		border: 1px solid #6A8299;
		border-radius: 3px;
		-moz-border-radius: 3px;
		-webkit-border-radius: 3px;
		position: relative;
		box-sizing: border-box;
		-moz-box-sizing: border-box;
		-webkit-box-sizing: border-box;
		background: -moz-linear-gradient(50% 0% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
		background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
		background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
		background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
		background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
	}

    .RedPoint {
        width: 7px;
        height: 7px;
        background: #E45A26;
        -webkit-border-radius: 25px;
        -moz-border-radius: 25px;
        border-radius: 25px;
        position: relative;
        top: 12px;
    }
	 
</style>
