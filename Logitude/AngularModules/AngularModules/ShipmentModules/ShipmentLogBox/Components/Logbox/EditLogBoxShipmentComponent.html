<style>
    .Disabled{
        pointer-events:none;
        opacity:0.5;
    }
</style>
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>
    <tr style="height:1px;">
        <td>
            <table>
                <tr style="height: 10px;">
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>
                <tr>
                    <td style="width:112px;">
                      
                        <table>
                            <tr style="height: 33px;">
                                <td style="height:22px;">
                                    <div style="width: 7px; height: 7px; background: #E45A26; -webkit-border-radius: 25px; -moz-border-radius: 25px; border-radius: 25px;"></div>
                                </td>
                                <td style="height:22px;">
                                    <label style="padding-left:10px;color: rgb(110, 113, 114);">
                                        {{IsShownCustomerReference3 ? 'Reference #' : 'My Reference'}}
                                    </label>
                                </td>
                            </tr>
                            <tr>
                                <td style="height: 22px;"></td>
                            </tr>
                        </table>
                    </td>
                    <td style="width:20px;"><div></div></td>
                    <td style="width:200px;float:left;">
                        <table> 
                            <tr style="height: 33px;">
                                <td style="height: 22px;">
                                    <LogTextBox [ObjectFieldName]="IsShownCustomerReference3 ? 'CustomerReference3' : 'CustomerReference2'" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>
                            <tr>
                                <td style="height: 22px;"></td>
                            </tr> 
                        </table>
                    </td>
                    <td style="width:3px;"><div></div></td>
                </tr>
                 
            </table>
        </td>
    </tr> 
    <tr>
        <td></td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="float:right;">
                <button class="RedButton" (click)="SaveChanges()" style="width:57px;float: right;margin-left: 7px;margin-right: 7px;">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                <button class="Button" (click)="CancelButtonClicked()" style="width:57px;float: right;">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
            </div>
            <div *ngIf="IsPrivate == true && DirectionId != 'E'" style="float:left;">
                <img src="./Images/Help.png" style="float:right;margin-left:5px;" title="When selecting this option , the data will be updated at Agent’s system"/>
                <label style="margin-left: -10px;float:right;color: rgb(110, 113, 114);">Share data with agent</label>
                <LogCheckBox [Checked]="SendUpdatesToAgentEnabled" [ObjectFieldName]="'SendUpdatesToAgentEnabled'" [DataContext]="DataContext" style="float:right;"></LogCheckBox>
            </div>
        </td>
    </tr>
</table>
