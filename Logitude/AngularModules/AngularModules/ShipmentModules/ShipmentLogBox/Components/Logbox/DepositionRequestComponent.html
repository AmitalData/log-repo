<style>

        .CustomLink:hover {
        cursor: pointer;
          color:#0026ff;
           text-decoration: underline;


    }

        .CustomLink {

        color: #1B90CB;
        text-decoration: underline;

        }
</style>



<table>
  
    <tr>
        <td>
            <table style="direction:rtl;">

                <tr style="height:5px"><td></td></tr>

                <tr style="height:20px;vertical-align:top">
                    <td style="font-size:13px">
                        על מנת לחדש את התצהיר יש למלא דיגיטלית את הטופס הבא ( <a (click)="NewDepositionFormClcik()" class="CustomLink" style="font-size:13px;width:130px;vertical-align:central">לינק</a> ) באתר רשות המיסים

                    </td>
                </tr>

                <tr style="height:10px"><td></td></tr>

                <tr style="height:45px;vertical-align:top">
                
                    <td>
                        <table>
                            <tr style="height:20px">
                                <td style="width:140px;font-size:13px">מספר ספק</td>
                
                                <td><span style="font-size:13px" [attr.Id]="VendorCodeId">{{VendorCode}}</span>
                                    <img title="copy" src="./_Resources/Images/Icons/All/copy.png" style="width:24px;height:24px;cursor:pointer" (click)="CopyTextButtonClicked()"  *ngIf="VendorCode"  />
                                </td>

                            </tr>

                            <tr style="height:5px"><td colspan="2"></td></tr>

                            <tr style="height:20px">
                                <td style="width:140px;font-size:13px">שם ספק</td>
                 
                                <td style="font-size:13px">{{VendorName}}</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
  
  


    <tr style="height:1px;">
        <td>
       
            <div style="float:left">
                <button class="GreenButton" (click)="MarkAsComplete()" style="float: right;margin-left: 7px;width:60px;">סמן כטופל</button>
            </div>

            <div style="float:left;">

                <button class="Button" (click)="CloseButtonClicked()" style="float: right;margin-left: 7px;width:45px;" title="Close">סגור</button>
            </div>

        </td>
    </tr>

</table>
