                                        <li style="width:50px;" (click)="PackageTypeClicked('LCL')" (mouseover)="itemMouseOver('LCL')" (mouseleave)="itemMouseLeave('LCL')" [class.SelectedFilter]="PackageType === 'LCL' && SelectedTransportationTypes.TransporationType != 'A'">
                                            LCL
                                        </li>
                                        <li style="width:50px;" (click)="PackageTypeClicked('OTHER')" (mouseover)="itemMouseOver('OTHER')" (mouseleave)="itemMouseLeave('OTHER')" [class.SelectedFilter]="(PackageType != 'LCL' && PackageType != 'FCL') || SelectedTransportationTypes.TransporationType == 'A'">

                                    </ul>
