
<style>
    .WarningSummary {
        height: 100%;
        width: 100%;
        border: 1px solid Orange;
        border-radius: 5px;
        background: #FFFBDA;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        overflow: hidden;
    }
    .ValidationSummary {
        height: 100%;
        width: 100%;
        border: 1px solid #DA6F6F;
        border-radius: 5px;
        background: rgba(247, 227, 227, 1);
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        overflow: hidden;
    }    
</style>
<table>
    <!--<tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>-->
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList != ''" style="height:1px;">
        <td>
            <div [style.direction]="Language == 'HB' ? 'rtl' : 'ltr'" class="ValidationSummary" style="margin-bottom: 3px;">{{ValidationErrorsList}}</div>
        </td>
    </tr>
    <tr style="height:4px;">
        <td></td>
    </tr>
    <tr style="height:100px;">
        <td>
            <div class="MediaFill">
                <LogTextBox [Placeholder]="DenyReasonWaterMark" [HideColumns]="true" [HideLastColumn]="true" [ObjectFieldName]="'DenyReason'" [IsMultiline]="true" [DataContext]="DataContext" [Text]="DenyReason"></LogTextBox>
            </div>
        </td>
    </tr>
    <tr style="height:4px;">
        <td></td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="float:left;margin-left:10px;">
                <button class="RedButton" (click)="SendButtonClicked()" style="float: right;margin-left: 7px;margin-right: 7px;">{{'Shipment.O.Send' | TextCodeTranslationPipe}}</button>
            </div>
            <div style="float:left;margin-left:10px;">
                <button class="Button" (click)="CloseButtonClicked()" style="float: right;margin-left: 7px;margin-right: 7px;">{{'Shipment.O.Close' | TextCodeTranslationPipe}}</button>
            </div>
        </td>
    </tr>
</table>
