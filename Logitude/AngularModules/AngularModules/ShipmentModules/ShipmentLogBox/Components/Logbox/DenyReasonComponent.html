

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>
    <tr>
        <td>
            <div class="MediaFill">
                <LogTextBox [Placeholder]="'אנא מלא את ההסבר לדחיית ההצהרה'" [HideColumns]="true" [HideLastColumn]="true" [ObjectFieldName]="'DenyReason'" [IsMultiline]="true" [DataContext]="DataContext" [Text]="DenyReason"></LogTextBox>
            </div>
        </td>
    </tr>
    <tr style="height:8px;">
        <td></td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="float:left;margin-left:10px;">
                <button class="RedButton" (click)="SendButtonClicked()" style="float: right;margin-left: 7px;margin-right: 7px;">שלח</button>
            </div>
            <div style="float:left;margin-left:10px;">
                <button class="Button" (click)="CloseButtonClicked()" style="float: right;margin-left: 7px;margin-right: 7px;">סגור</button>
            </div>
        </td>
    </tr>
</table>
