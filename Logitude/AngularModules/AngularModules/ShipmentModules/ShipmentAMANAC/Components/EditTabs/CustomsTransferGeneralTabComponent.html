
<div class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>{{'CustomsTransferHeader.TH.Details' | TextCodeTranslationPipe}}</td>
        </tr>

        <tr style="height: 1px;">
            <td>
                <table>
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width:1px;">
                            <button class="Button" (click)="RebuildClicked()">Rebuild</button>
                        </td>

                        <td style="width:5px;">
                            <div></div>
                        </td>

                        <td style="width:1px;">
                            <button class="Button" (click)="DownloadClicked()">Download</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 5px;">
            <td>
                <div></div>
            </td>
        </tr>

        <tr>
            <td>
                <div class="MediaFill">
                    <div class="SimpleGridView">
                        <div class="SimpleGridViewHeader">
                            <table>
                                <tr>
                                    <td style="width: 130px; min-width: 130px; max-width: 130px;">Shipment No.</td>
                                    <td style="width: 130px; min-width: 130px; max-width: 130px;">Arrival Date</td>
                                    <td style="width: 180px; min-width: 180px; max-width: 180px;">Shipper</td>
                                    <td style="width: 180px; min-width: 180px; max-width: 180px;">Consignee </td>
                                    <td style="width: 130px; min-width: 130px; max-width: 130px;">Status</td>
                                    <td class="LastChild">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>

                        <div class="SimpleGridViewBody">
                            <table>
                                <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource" [class.RowSelected]="item == SelectedItem" (click)="SelectedItem = item">

                                    <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                        {{item.ShipmentNumber}}
                                    </td>

                                    <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                        {{item.ArrivalDate | DateTimeToDatePipe}}
                                    </td>

                                    <td class="GridViewCell" style="width: 180px; min-width: 180px; max-width: 180px;">
                                        {{item.Shipper}}
                                    </td>

                                    <td class="GridViewCell" style="width: 180px; min-width: 180px; max-width: 180px;">
                                        {{item.Consignee}}
                                    </td>

                                    <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;" [ngStyle]="{color: item.Status | StringToColorPipe}">
                                        {{item.Status}}
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>

                                <tr>
                                    <td colspan="6">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</div>
