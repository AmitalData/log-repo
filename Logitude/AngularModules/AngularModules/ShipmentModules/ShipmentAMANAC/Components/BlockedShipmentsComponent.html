<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width:50px">
                        <ComboBox style="width:50px;" [ItemsSource]="ShipmentDatesList" (SelectedItemChanged)="SelectedShipmentDateChanged($event)" [SelectedItem]="ShipmentDateSelectedItem" [Binding]="'Name'"></ComboBox>
                    </td>

                    <td style="width: 2px;">
                        <div></div>
                    </td>

                    <td class="Label" style="width: 1px;">From Date:</td>
                    <td style="width: 155px; padding-left: 5px;">
                        <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [SelectedDateValue]="FromDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td style="width: 15px;">
                        <div></div>
                    </td>

                    <td class="Label" style="width: 1px;">To Date:</td>
                    <td style="width: 155px; padding-left: 5px;">
                        <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'ToDate'" [SelectedDateValue]="ToDate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td style="float:right;">
                        <table>
                            <tr>
                                <td>
                                    <div></div>
                                </td>
                                <td style="width:90px;">
                                    <div class="MediaFill">
                                        <DirectionsFilter [HideAMANACFilters]="'true'" (SelectedValueChanged)="CurrentDirectionId = $event"></DirectionsFilter>
                                    </div>
                                </td>
                                <td style="width: 200px;">
                                    <SearchBox [UseTimer]="true" (TextChanged)="SearchText = $event"></SearchBox>
                                </td>
                            </tr>
                        </table>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 3px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 110px; min-width: 110px; max-width: 110px;">Shipment #</td>
                                <td style="width: 110px; min-width: 110px; max-width: 110px;">Arrival Date</td>
                                <td style="width: 200px; min-width: 200px; max-width: 200px;">Shipper</td>
                                <td style="width: 200px; min-width: 200px; max-width: 200px;">Consignee</td>
                                <td style="width: 130px; min-width: 130px; max-width: 130px;">Status</td>
                                <td style="width: 170px; min-width: 170px; max-width: 170px;">
                                    <div></div>
                                </td>

                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemsSource">
                                <td attr.data-cy="{{'ShipmentNumber_' + item.ShipmentNumber | IdGeneratorAsyncPipe | async}}" class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px;">
                                    {{item.ShipmentNumber}}
                                </td>

                                <td class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px;">
                                    {{item.Date | DateTimeToDatePipe}}
                                </td>

                                <td class="GridViewCell" style="width: 200px; min-width: 200px; max-width: 200px;">
                                    {{item.Shipper}}
                                </td>

                                <td class="GridViewCell" style="width: 200px; min-width: 200px; max-width: 200px;">
                                    {{item.Consignee}}
                                </td>


                                <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;" [ngStyle]="{color: item.Status | StringToColorPipe}">
                                    {{item.Status}}
                                </td>

                                <td attr.data-cy="{{'Markasnotblocked_' + item.ShipmentNumber | IdGeneratorAsyncPipe | async}}" class="GridViewCell" style="width: 170px; min-width: 170px; max-width: 170px;">
                                    <button attr.data-cy="{{'Markasnotblocked_' + item.ShipmentNumber | IdGeneratorAsyncPipe | async}}" class="Button" (click)="UnblockedClicked(item.Id)">Mark as not blocked for transfer</button>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="6">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button attr.data-cy="{{'CloseAMANACView' | IdGeneratorAsyncPipe | async}}" class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
