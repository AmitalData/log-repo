<table>
    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 110px; min-width: 110px; max-width: 110px;">Shipment #</td>
                                <td style="width: 450px; min-width: 450px; max-width: 450px;">Error</td>

                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource">

                                <td class="GridViewCell" style="width: 110px; min-width: 110px; max-width: 110px;">
                                    {{item.ShipmentNumber}}
                                </td>

                                <td class="GridViewCell TextTrimming" [title]="item.ErrorText" style="width: 450px; min-width: 450px; max-width: 450px;">
                                    {{item.ErrorText}}
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
