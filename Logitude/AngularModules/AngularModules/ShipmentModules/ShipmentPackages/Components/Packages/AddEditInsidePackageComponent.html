<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <ScrollViewer>
                    <table class="FixedTable">
                        <tr>
                            <td style="width: 400px;">
                                <table>
                                    <tr>
                                        <td>
                                            <table>
                                                <!-- PackageTypeId -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'PackageTypeId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogLov [ObjectFieldName]="'PackageTypeId'"
                                                                [SelectedValue]="DataContext.PackageTypeId"
                                                                [ObjectTableName]="ObjectTableName"
                                                                [DataContext]="DataContext"
                                                                [LookUpTableName]="'PackageType'"
                                                                [DependencyFilter2Value]="false">
                                                        </LogLov>
                                                    </td>
                                                </tr>

                                                <!-- Quantity -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Quantity'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Quantity'" [Text]="DataContext.Quantity" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Dimensions -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Length'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="DimensionsLabel"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <table>
                                                            <tr>
                                                                <td>
                                                                    <LogTextBox [ObjectFieldName]="'Length'" [Text]="DataContext.Length" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                                                </td>

                                                                <td style="width: 1px;">
                                                                    <div></div>
                                                                </td>

                                                                <td>
                                                                    <LogTextBox [ObjectFieldName]="'Width'" [Text]="DataContext.Width" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                                                </td>

                                                                <td style="width: 1px;">
                                                                    <div></div>
                                                                </td>

                                                                <td>
                                                                    <LogTextBox [ObjectFieldName]="'Height'" [Text]="DataContext.Height" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                                                </td>

                                                                <td style="width: 36px;">
                                                                    <div></div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <!-- Volume -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Volume'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="VolumeLabel"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Volume'" [Text]="DataContext.Volume" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Volumetric -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'VolumetricWeight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="VolumetricWeightLabel"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'VolumetricWeight'" [Text]="DataContext.VolumetricWeight" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Weight -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Weight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="GrossWeightLabel"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox (LostFocus)="DataContext.OnGrossWeightLostFocus($event)" [ObjectFieldName]="'Weight'" [Text]="DataContext.Weight" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- CommodityNumber -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'CommodityNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <table>
                                                            <tr>
                                                                <td style="width: 100px;">
                                                                    <LogTextBox [HideColumns]="true" [ObjectFieldName]="'CommodityNumber'" [Text]="DataContext.CommodityNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                </td>
                                                                <td style="width: 20px; padding-left: 4px;">
                                                                    <span class="hyperlink" [class.HyperlinkDisabled]="!DataContext.IsEditingEnabled" (click)="DataContext.ChooseCommodityClicked()">
                                                                        <img style="vertical-align: middle; width: 14px; height: 14px; cursor: pointer;" src="./Images/LOVSearch.png" />
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <tr style="height:10px;">
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <tr style="height:32px;">
                                                    <td colspan="2" style="color:#1B90CB;font-size:14px;">
                                                        Additional References
                                                    </td>
                                                </tr>

                                                <!-- Reference 1 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference1'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Reference1'" [Text]="DataContext.Reference1" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Reference 2 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference2'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Reference2'" [Text]="DataContext.Reference2" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Reference 3 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference3'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Reference3'" [Text]="DataContext.Reference3" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Reference 4 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference4'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Reference4'" [Text]="DataContext.Reference4" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td colspan="2">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </td>

                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td>
                                <table>
                                    <tr style="height: 90px;">
                                        <td>
                                            <table>
                                                <tr class="FormFieldRow">
                                                    <td style="vertical-align: middle;">
                                                        <LogLabel [ObjectFieldName]="'Description'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>
                                                </tr>

                                                <tr class="FormFieldRow" style="height: 90px;">
                                                    <td style="height: 90px;">
                                                        <div style="height: 90px;">
                                                            <LogTextBox [ObjectFieldName]="'Description'" [Text]="DataContext.Description" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <tr style="vertical-align:top;">
                                        <td>
                                            <table>
                                                <tr style="height:32px;">
                                                    <td colspan="2" style="color:#1B90CB;font-size:14px;">
                                                        Vehicle Details
                                                    </td>
                                                </tr>

                                                <!-- Make -->
                                                <tr class="FormFieldRow">
                                                    <td style="width: 110px;">
                                                        <LogLabel [ObjectFieldName]="'Make'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Make'" [Text]="DataContext.Make" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>

                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <!-- Model -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Model'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Model'" [Text]="DataContext.Model" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>

                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <!-- Year  -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Year'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Year'" [Text]="DataContext.Year" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>

                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <!-- Color  -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Color'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'Color'" [Text]="DataContext.Color" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>

                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <!-- Chassis Number  -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'ChassisNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>
                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'ChassisNumber'" [Text]="DataContext.ChassisNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <!-- Registration Number  -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'RegistrationNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>
                                                    <td>
                                                        <LogTextBox [ObjectFieldName]="'RegistrationNumber'" [Text]="DataContext.RegistrationNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                                <!-- CountryId -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'CountryId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>
                                                    <td>
                                                        <LogLov [ObjectFieldName]="'CountryId'"
                                                                [SelectedValue]="DataContext.CountryId"
                                                                [ObjectTableName]="ObjectTableName"
                                                                [DataContext]="DataContext"
                                                                [LookUpTableName]="'Country'">
                                                        </LogLov>
                                                    </td>
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                </tr>

                                            </table>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                </table>
                            </td>
                        </tr>
                    </table>
                </ScrollViewer>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" id="{{'CancelInsidePackage' | IdGeneratorPipe}}"  (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" id="{{'OKInsidePackage' | IdGeneratorPipe}}"  [disabled]="!DataContext.IsEditingEnabled">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
