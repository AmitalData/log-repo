<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="SimpleGridView">
                    <div class="SimpleGridViewHeader">
                        <table>
                            <tr>
                                <td style="width: 250px; min-width: 250px; max-width: 250px;">Status</td>
                                <td style="width: 130px; min-width: 130px; max-width: 130px;">Event Date</td>
                                <td style="width: 130px; min-width: 130px; max-width: 130px;">Received date</td>
                                <td style="width: 80px; min-width: 80px; max-width: 80px;">Location</td>
                                <td style="width: 130px; min-width: 130px; max-width: 130px;">Departure</td>
                                <td style="width: 130px; min-width: 130px; max-width: 130px;">Arrival</td>
                                <td class="LastChild">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="SimpleGridViewBody">
                        <table>
                            <tr class="SimpleGridViewRow" *ngFor="let item of ItemsSource">

                                <td class="GridViewCell" style="width: 250px; min-width: 250px; max-width: 250px;">
                                    {{item.StatusName}}
                                </td>

                                <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                    {{item.EventDate | DateTimePipe:'DT'}}
                                </td>

                                <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                    {{item.ReceivingDate | DateTimePipe:'DT'}}
                                </td>

                                <td class="GridViewCell" style="width: 80px; min-width: 80px; max-width: 80px;">
                                    {{item.LocationCode}}
                                </td>

                                <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                    {{item.DepartureDate | DateTimePipe:'DT'}}
                                </td>

                                <td class="GridViewCell" style="width: 130px; min-width: 130px; max-width: 130px;">
                                    {{item.ArrivalDate | DateTimePipe:'DT'}}
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="6">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
