
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="ItemsSource">

                    <!-- Status -->
                    <log-column [width]="'250'" [header]="'Status'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.StatusName}}
                        </log-cell-template>
                    </log-column>

                    <!-- Location -->
                    <log-column [width]="'80'" [header]="'Location'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.LocationCode}}
                        </log-cell-template>
                    </log-column>

                    <!-- Event Date -->
                    <log-column [width]="'140'" [header]="'Event Date'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.EventDate | DateTimePipe:'DT'}}
                        </log-cell-template>
                    </log-column>

                    <!-- Received date -->
                    <log-column [width]="'140'" [header]="'Received Date'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.ReceivingDate | DateTimePipe:'DT'}}
                        </log-cell-template>
                    </log-column>

                    <!-- Vessel / Voyage -->
                    <log-column [width]="'250'" [header]="'Vessel / Voyage'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.VesselName}} / {{item.VoyageNumber}}
                        </log-cell-template>
                    </log-column>

                    <!-- Departure / Arrival Date -->
                    <log-column [width]="'250'" [header]="'Departure / Arrival Date'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.DepartureArrivalDateInfo}} : {{item.DepartureArrivalDate | DateTimePipe:'DT'}}
                        </log-cell-template>
                    </log-column>

                    <!-- Departure -->
                    <!--<log-column [width]="'250'" [header]="'Departure'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.DepartureDate | DateTimePipe:'DT'}} {{item.DepartureDateInfo}}
                        </log-cell-template>
                    </log-column>-->
                    <!-- Arrival -->
                    <!--<log-column [width]="'250'" [header]="'Arrival'">
                        <log-cell-template template="let item" #logcelltemplate [IsEnabled]="false">
                            {{item.ArrivalDate | DateTimePipe:'DT'}} {{item.ArrivalDateInfo}}
                        </log-cell-template>
                    </log-column>-->

                </logitude-edit-grid>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
