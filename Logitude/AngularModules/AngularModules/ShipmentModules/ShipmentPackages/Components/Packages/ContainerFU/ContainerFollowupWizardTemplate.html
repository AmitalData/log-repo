                                        <td style="width: 5px">
                                            <div></div>
                                        </td>

                                                        <table>
                                                            <tr>

                                                                    <LogCheckBox [ObjectFieldName]="'IsDeliveryFU'" [Checked]="IsDeliveryFU" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>

                                                                <td style="width: 10px;">

                                                                </td>

                                                                </td>

                                                                <td style="width: 1px;" *ngIf="HasRouting_D">

                                                                </td>

                                                                <td>
                                                                    <div></div>
                                                                </td>
                                                            </tr>

                                                    <td colspan="2">
