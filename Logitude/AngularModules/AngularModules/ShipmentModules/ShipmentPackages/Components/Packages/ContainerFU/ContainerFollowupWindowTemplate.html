
<table>

    <!-- Follow up -->
    <tr class="FormFieldRow">
        <td style="width: 150px;">
            <LogLabel [ObjectFieldName]="IsFollowupProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 16px;">
                        <LogCheckBox [ObjectFieldName]="IsFollowupProperty" [Checked]="IsFollowup" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogCheckBox>
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <Hyperlink (click)="ActionRoutingLinkClicked()">{{ActionRoutingLinkText}}</Hyperlink>
                    </td>

                    <td style="width:15px;" *ngIf="HasRouting">
                        <div style="width:1px; height: 22px; background: #DADADA; margin:auto;"></div>
                    </td>

                    <td style="width: 1px;" *ngIf="HasRouting && Code == 'D'">
                        <Hyperlink (click)="DisconnectDeliveryLinkClicked()">Disconnect from delivery</Hyperlink>
                    </td>

                    <td style="width: 15px;" *ngIf="HasRouting && !IsDeliveryConnectedWithMultiContainers && Code == 'D'">
                        <div style="width:1px; height: 22px; background: #DADADA; margin:auto;"></div>
                    </td>

                    <td style="width: 1px;" *ngIf="HasRouting && !IsDeliveryConnectedWithMultiContainers">
                        <Hyperlink (click)="DeleteRoutingLinkClicked()">{{DeleteRoutingLinkText}}</Hyperlink>
                    </td>

                    <!--
                    <td style="width: 1px;" *ngIf="HasRouting && IsDeliveryConnectedWithMultiContainers">
                        <Hyperlink (click)="DisconnectDeliveryLinkClicked()">Disconnect from delivery</Hyperlink>
                    </td>
                     -->

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- ETD -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="ETDProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 120px;">
                        <LogDatePicker [ObjectFieldName]="ETDProperty" [SelectedDateValue]="ETD" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td style="width: 2px;">
                        <div></div>
                    </td>

                    <td style="width: 110px;">
                        <LogDatePicker [ObjectFieldName]="ETDProperty" [SelectedDateValue]="ETD" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                    </td>

                    <td style="width: 1px; padding-left: 5px;">
                        <div>
                            <button *ngIf="ETD && !ATD" (click)="SetActualDateClicked(ETDProperty)" class="Button" [disabled]="!IsEditingEnabled" style="height: 18px; font-size: 10px;">Set as Actual</button>
                        </div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- ETA -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="ETAProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="ETATextCode"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 120px;">
                        <LogDatePicker [ObjectFieldName]="ETAProperty" [SelectedDateValue]="ETA" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td style="width: 2px;">
                        <div></div>
                    </td>

                    <td style="width: 110px;">
                        <LogDatePicker [ObjectFieldName]="ETAProperty" [SelectedDateValue]="ETA" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                    </td>

                    <td style="width: 1px; padding-left: 5px;">
                        <div>
                            <button *ngIf="ETA && !ATA" (click)="SetActualDateClicked(ETAProperty)" class="Button" [disabled]="!IsEditingEnabled" style="height: 18px; font-size: 10px;">Set as Actual</button>
                        </div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- ATD -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="ATDProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 120px;">
                        <LogDatePicker [ObjectFieldName]="ATDProperty" [SelectedDateValue]="ATD" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td style="width: 2px;">
                        <div></div>
                    </td>

                    <td style="width: 110px;">
                        <LogDatePicker [ObjectFieldName]="ATDProperty" [SelectedDateValue]="ATD" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- ATA -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="ATAProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="ATATextCode"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 120px;">
                        <LogDatePicker [ObjectFieldName]="ATAProperty" [SelectedDateValue]="ATA" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                    </td>

                    <td style="width: 2px;">
                        <div></div>
                    </td>

                    <td style="width: 110px;">
                        <LogDatePicker [ObjectFieldName]="ATAProperty" [SelectedDateValue]="ATA" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- From -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="FromProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 268px;">
                        <LogTextBox [ObjectFieldName]="FromProperty" [Text]="From" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- To -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="ToProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 268px;">
                        <LogTextBox [ObjectFieldName]="ToProperty" [Text]="To" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- TransportModeCode -->
    <tr class="FormFieldRow">
        <td>
            <LogLabel [ObjectFieldName]="TransportModeProperty" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
        </td>

        <td>
            <table>
                <tr>
                    <td style="width: 268px;">
                        <table>
                            <tr>
                                <td>
                                    <RadioButton [IsEnabled]="IsEditingEnabled" [Name]="'ModeRadio'" [IsChecked]="TransportModeCode == 'BYTR'" (Checked)="TransportModeCode = 'BYTR'" [Text]="'By Truck'"></RadioButton>
                                </td>

                                <td>
                                    <RadioButton [IsEnabled]="IsEditingEnabled" [Name]="'ModeRadio'" [IsChecked]="TransportModeCode == 'BYRA'" (Checked)="TransportModeCode = 'BYRA'" [Text]="'By Rail'"></RadioButton>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <div></div>
        </td>
    </tr>
</table>
