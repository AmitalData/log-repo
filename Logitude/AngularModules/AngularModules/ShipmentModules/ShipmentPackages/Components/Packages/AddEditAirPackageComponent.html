
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                 <table class="FixedTable">
                        <tr>
                            <td style="width: 400px;">
                                <table>
                                    <tr style="height: 1px;">
                                        <td>
                                            <table>

                                                <!-- Quantity -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Quantity'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Quantity'" [Text]="DataContext.Quantity" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Dimensions -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Length'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="DimensionsLabel"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <table>
                                                            <tr>
                                                                <td>
                                                                    <LogTextBox [ObjectFieldName]="'Length'" [Text]="DataContext.Length" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                                                </td>

                                                                <td style="width: 1px;">
                                                                    <div></div>
                                                                </td>

                                                                <td>
                                                                    <LogTextBox [ObjectFieldName]="'Width'" [Text]="DataContext.Width" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                                                </td>

                                                                <td style="width: 1px;">
                                                                    <div></div>
                                                                </td>

                                                                <td>
                                                                    <LogTextBox [ObjectFieldName]="'Height'" [Text]="DataContext.Height" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                                                </td>

                                                                <td style="width: 36px;">
                                                                    <div></div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <!-- Volume -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Volume'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="VolumeLabel"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Volume'" [Text]="DataContext.Volume" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Volumetric -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'VolumetricWeight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="VolumetricWeightLabel"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'VolumetricWeight'" [Text]="DataContext.VolumetricWeight" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Weight -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Weight'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="GrossWeightLabel"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox (LostFocus)="DataContext.OnGrossWeightLostFocus($event)" [ObjectFieldName]="'Weight'" [Text]="DataContext.Weight" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- CommodityNumber -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'CommodityNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <table>
                                                            <tr>
                                                                <td style="width: 100px;">
                                                                    <LogTextBox [HideColumns]="true" [ObjectFieldName]="'CommodityNumber'" [Text]="DataContext.CommodityNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                                </td>
                                                                <td style="width: 20px; padding-left: 4px;">
                                                                    <span class="hyperlink" [class.HyperlinkDisabled]="!DataContext.IsEditingFieldsEnabled" (click)="DataContext.ChooseCommodityClicked()">
                                                                        <img style="vertical-align: middle; width: 14px; height: 14px; cursor: pointer;" src="./Images/LOVSearch.png" />
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <!-- Notes -->
                                                <tr class="FormFieldRow">
                                                    <td style="vertical-align:top;">
                                                        <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <table>
                                                            <tr>
                                                                <td style="width:230px;height:60px;">
                                                                    <div class="MediaFill">
                                                                        <LogTextBox [ObjectFieldName]="'Notes'" [Text]="DataContext.Notes" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td colspan="2">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <tr style="height:22px;vertical-align:top;">
                                        <td>
                                            <div style="color:#1B90CB;font-size:14px;vertical-align:central;">Additional References</div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>
                                            <table>

                                                <!-- Reference 1 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference1'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Reference1'" [Text]="DataContext.Reference1" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Reference 2 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference2'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Reference2'" [Text]="DataContext.Reference2" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Reference 3 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference3'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Reference3'" [Text]="DataContext.Reference3" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <!-- Reference 4 -->
                                                <tr class="FormFieldRow">
                                                    <td>
                                                        <LogLabel [ObjectFieldName]="'Reference4'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                    </td>

                                                    <td style="width: 230px;">
                                                        <LogTextBox [ObjectFieldName]="'Reference4'" [Text]="DataContext.Reference4" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td colspan="2">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                    
                                </table>
                            </td>

                            <td style="width: 10px;">
                                <div></div>
                            </td>

                            <td>
                                <table>
                                    <tr style="height: 20px;">
                                        <td>
                                            <table>
                                                <tr>
                                                    <td>
                                                        <div style="color:#1B90CB;font-size:14px;vertical-align:central;">Package Items</div>
                                                    </td>
                                                    <td>
                                                        <div></div>
                                                    </td>
                                                    <td style="width: 20px; padding-right: 2px;float:right;vertical-align:central;">
                                                        <IconButton [Name]="'Add'" [IsSmall]="true" (click)="DataContext.AddPackageItemMethod()" [disabled]="!DataContext.IsEditingEnabled"></IconButton>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>
                                            <div class="MediaFill" style="overflow-x: hidden;">
                                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="DataContext.PackageItemsList" [Disabled]="!DataContext.IsEditingEnabled" (RowEnded)="DataContext.OnRowEnded($event)">

                                                    <!-- Description -->
                                                    <log-column [header]="'Description'" [width]="'95'" [Alignment]="'left'">
                                                        <log-cell-template template="let item" #logcelltemplate>
                                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                                <span>{{item.Description}}</span>
                                                            </div>
                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Description'" [DataContext]="item"
                                                                            [Text]="item.Description" [ObjectTableName]="'ShipmentPackageItem'" [HideColumns]="true"></LogTextBox>
                                                            </div>
                                                        </log-cell-template>
                                                    </log-column>

                                                    <!-- Value -->
                                                    <log-column [header]="'Value'" [width]="'80'" [Alignment]="'left'">
                                                        <log-cell-template template="let item" #logcelltemplate>
                                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                                <span>{{item.GoodsValue}}</span>
                                                            </div>
                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'GoodsValue'" [DataContext]="item"
                                                                            [Text]="item.GoodsValue" [ObjectTableName]="'ShipmentPackageItem'" [HideColumns]="true"></LogTextBox>
                                                            </div>
                                                        </log-cell-template>
                                                    </log-column>

                                                    <!-- Quantity -->
                                                    <log-column [header]="'Quantity'" [width]="'80'" [Alignment]="'left'">
                                                        <log-cell-template template="let item" #logcelltemplate>
                                                            <div class="TextTrimming" *ngIf="logcelltemplate.IsDisplayMode">
                                                                <span>{{item.Quantity}}</span>
                                                            </div>
                                                            <div *ngIf="logcelltemplate.IsEditMode">
                                                                <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Quantity'" [DataContext]="item"
                                                                            [Text]="item.Quantity" [ObjectTableName]="'ShipmentPackageItem'" [HideColumns]="true"></LogTextBox>
                                                            </div>
                                                        </log-cell-template>
                                                    </log-column>

                                                    <!-- Buttons -->
                                                    <log-column [width]="'30'" [Alignment]="'left'">
                                                        <log-cell-template [IgnoreMods]="true" template="let item">
                                                            <IconButton [Name]="'Delete'" [IsSmall]="true"
                                                                        style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="item.RemoveLine(item)"></IconButton>
                                                        </log-cell-template>
                                                    </log-column>

                                                </logitude-edit-grid>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" id="{{'CancelAirPackage' | IdGeneratorPipe}}"  (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()" id="{{'OkAirPackage' | IdGeneratorPipe}}" [disabled]="!DataContext.IsEditingEnabled" tabindex="0">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
