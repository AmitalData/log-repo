
<table>
    <tr>
        <td>
            <table *ngIf="IsResourcesReady">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <div *ngIf="IsDownloadInProgress">
                            <div style="text-align: center;">
                                <span class="Label" style="font-size: 13px;">Downloading Packages</span>
                            </div>

                            <img src="./Images/ProgressBar.gif" />
                        </div>

                        <div *ngIf="!IsDownloadInProgress">

                            <div *ngIf="IsDownloadingSuccess" style="text-align: center;">
                                <div class="ColorGreen" style="font-size: 13px;">Download Completed Successfully</div>
                                <Hyperlink (click)="DownloadClicked()">{{'General.B.DownloadFile' | TextCodeTranslationPipe}}</Hyperlink>
                            </div>

                            <div *ngIf="IsDownloadingError" style="text-align: center;">
                                <div class="ColorRed" style="font-size: 13px;">Download Error</div>
                                <Hyperlink (click)="RetryClicked()">{{'General.B.Retry' | TextCodeTranslationPipe}}</Hyperlink>
                            </div>
                        </div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()" [disabled]="IsDownloadInProgress">{{'General.B.Close' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
