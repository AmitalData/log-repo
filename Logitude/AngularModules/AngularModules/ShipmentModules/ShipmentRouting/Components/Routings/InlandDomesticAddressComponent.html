<table>
    <tr style="height: 1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 430px;">
                        <table>
                            <!-- Address1 -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="Address1FieldName" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [Text]="'Address 1'"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="Address1FieldName"
                                        [Text]="DataContext[Address1FieldName]" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <!-- Address2 -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="Address2FieldName" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [Text]="'Address 2'"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="Address2FieldName"
                                        [Text]="DataContext[Address2FieldName]" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <!-- StateId -->
                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="StateIdFieldName" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [Text]="'State'"></LogLabel>
                                </td>

                                <td>
                                    <LogLov [ObjectFieldName]="StateIdFieldName"
                                        [SelectedValue]="DataContext[StateIdFieldName]"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"
                                        [LookUpTableName]="'State'"
                                        [DependencyFilter1Value]="DataContext[CountryIdFieldName]">
                                    </LogLov>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width: 70px">
                                    <LogLabel [ObjectFieldName]="PhoneFieldName" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [Text]="'Phone'"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="PhoneFieldName" [Text]="DataContext[PhoneFieldName]"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="FaxFieldName" [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext" [Text]="'Fax'"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="FaxFieldName" [Text]="DataContext[FaxFieldName]"
                                        [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="2">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{'OKButtonID' | IdGeneratorAsyncPipe | async}}" class="RedButton"
                            (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
