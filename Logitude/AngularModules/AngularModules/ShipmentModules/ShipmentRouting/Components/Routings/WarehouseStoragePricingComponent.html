
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <table class="FixedTable">
                    <tr class="FormFieldRow">
                        <td style="width:130px;">
                            <LogLabel [ObjectFieldName]="'ChargeStorageCurrencyId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td style="width:220px;">
                            <LogLov [ObjectFieldName]="'ChargeStorageCurrencyId'"
                                    [SelectedValue]="ChargeStorageCurrencyId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Currency'"
                                    (SelectedItemChanged)="ChargeStorageCurrency = $event">
                            </LogLov>
                        </td>

                        <td>
                            <div>
                            </div>
                        </td>
                    </tr>

                    <tr class="FormFieldRow">
                        <td>
                            <LogLabel [ObjectFieldName]="'WeightMeasurementCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td colspan="2">
                            <table>
                                <tr>
                                    <td style="width:105px;">
                                        <RadioButton [Name]="'WeightMeasurementRadio'" [IsChecked]="WeightMeasurementCode == 'GRWT'" (Checked)="WeightMeasurementCode = 'GRWT'" [Text]="'Gross Weight'"></RadioButton>
                                    </td>

                                    <td style="width: 5px; min-width: 5px;">
                                        <div></div>
                                    </td>

                                    <td style="width:145px;">
                                        <RadioButton [Name]="'WeightMeasurementRadio'" [IsChecked]="WeightMeasurementCode == 'CHWT'" (Checked)="WeightMeasurementCode = 'CHWT'" [Text]="'Chargeable Weight / WM'"></RadioButton>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr class="FormFieldRow">
                        <td>
                            <LogLabel [ObjectFieldName]="'WeightRoundingCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                        </td>

                        <td colspan="2">
                            <table>
                                <tr>
                                    <td style="width:80px;">
                                        <RadioButton [Name]="'WeightRoundingRadio'" [IsChecked]="WeightRoundingCode == 'NON'" (Checked)="WeightRoundingCode = 'NON'" [Text]="'None'"></RadioButton>
                                    </td>

                                    <td style="width: 5px; min-width: 5px;">
                                        <div></div>
                                    </td>

                                    <td style="width:80px;">
                                        <RadioButton [Name]="'WeightRoundingRadio'" [IsChecked]="WeightRoundingCode == 'HAF'" (Checked)="WeightRoundingCode = 'HAF'" [Text]="'0.5'"></RadioButton>
                                    </td>

                                    <td style="width: 5px; min-width: 5px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 80px;">
                                        <RadioButton [Name]="'WeightRoundingRadio'" [IsChecked]="WeightRoundingCode == 'ONE'" (Checked)="WeightRoundingCode = 'ONE'" [Text]="'1'"></RadioButton>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr style="height:10px;">
                        <td>
                            <div></div>
                        </td>
                    </tr>

                    <tr style="height:25px;" class="Label">
                        <td colspan="3">
                            <table>
                                <tr>
                                    <td style="width:10px;">
                                        <div></div>
                                    </td>

                                    <td class="Label" style="font-size:12px;">
                                        {{WeightLabel}}
                                    </td>

                                    <td style="width: 20px; padding-right: 2px;float:right;vertical-align:central;">
                                        <IconButton [Name]="'Add'" [IsSmall]="true" (click)="AddPricingItemMethod()"></IconButton>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3">
                            <div class="MediaFill" style="overflow-x: hidden;">
                                <logitude-edit-grid GridWidth="100%" GridHeight="100%" [ItemSource]="PricingItemsList" (RowEnded)="OnRowEnded($event)" [UseVirtuallization]="IsUsingVirtuallization">

                                    <log-column [header]="'Step From'" [width]="'100'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate [CellColor]="item.CellColor" [IsEnabled]="!item.IsFreeLine">
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.StepFrom}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'StepFrom'" [DataContext]="item" [InputType]="'integer'"
                                                                [Text]="item.StepFrom" [ObjectTableName]="'ShipmentStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Number of Days'" [width]="'120'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate [CellColor]="item.CellColor" [IsEnabled]="!item.IsFreeLine">
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.Days}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Days'" [DataContext]="item" [InputType]="'integer'"
                                                                [Text]="item.Days" [ObjectTableName]="'ShipmentStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Step To'" [width]="'80'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate [CellColor]="item.CellColor" [IsEnabled]="!item.IsFreeLine">
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.StepTo}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'StepTo'" [DataContext]="item" [InputType]="'integer'"
                                                                [Text]="item.StepTo" [ObjectTableName]="'ShipmentStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Sale Price'" [width]="'100'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate [CellColor]="item.CellColor" [IsEnabled]="!item.IsFreeLine">
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.SalePrice}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>

                                                <div *ngIf="logcelltemplate.IsEditMode">
                                                    <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'SalePrice'" [DataContext]="item"
                                                                [Text]="item.SalePrice" [ObjectTableName]="'ShipmentStoragePricing'" [HideColumns]="true"></LogTextBox>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Chargeable Days'" [width]="'120'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate [CellColor]="item.CellColor" [IsEnabled]="false">
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.ChargeableDays}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <log-column [header]="'Amount'" [width]="'100'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template #logcelltemplate [CellColor]="item.CellColor" [IsEnabled]="false">
                                                <div *ngIf="logcelltemplate.IsDisplayMode">
                                                    <table>
                                                        <tr>
                                                            <td style="text-align: right;">
                                                                {{item.Amount | NumbersPipe:'N2'}}
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </div>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                    <!-- Buttons -->
                                    <log-column [width]="'30'" [Alignment]="'left'">
                                        <ng-template let-item>
                                            <log-cell-template [IgnoreMods]="true" [CellColor]="item.CellColor">
                                                <IconButton *ngIf="!item.IsFreeLine" [Name]="'Delete'" [IsSmall]="true"
                                                            style="display: block; float: left; margin-left:3px; margin-top:4px;" (click)="item.RemoveLine()"></IconButton>
                                            </log-cell-template>
                                        </ng-template>
                                    </log-column>

                                </logitude-edit-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
