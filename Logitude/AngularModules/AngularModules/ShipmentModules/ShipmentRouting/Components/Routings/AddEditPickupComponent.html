
<table>
    <tr style="height:1px;" *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill CurvedEditArea">
                <table>
                    <tr>
                        <td style="width: 100px;">
                            <div class="MediaFill AppLeftMenuBackground">
                                <table>
                                    <tr style="height:5px;">
                                        <td>
                                            <div></div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td style="vertical-align: top;">
                                            <ul *ngIf="IsResourcesReady">
                                                <li id="{{ item.TextCode | IdGeneratorPipe}}" class="DefaultMenuItem" *ngFor="let item of TabsItemsSource" (click)="SelectedTabCode = item.Code" [class.SelectedMenuItem]="item.Code === SelectedTabCode" [class.DisabledTabItem]="item.IsDisabled == true">
                                                    <div>{{item.TextCode | TextCodeTranslationPipe}}</div>
                                                    <img class="RightCenter" *ngIf="item == SelectedTab" src="./Images/SelectedMenuArrow.png" style="margin-right: -1px;" />
                                                </li>
                                            </ul>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </td>

                        <td>
                            <div class="MediaFill">

                                <!-- Main -->
                                <div class="MediaFill" [hidden]="SelectedTabCode != 'MAIN'">
                                    <div LocationDirective Code="MAIN"></div>
                                </div>

                                <!-- Packages -->
                                <div class="MediaFill" [hidden]="SelectedTabCode != 'PACG'">
                                    <div LocationDirective Code="PACG"></div>
                                </div>

                                <!-- Docs Out -->
                                <div class="MediaFill" [hidden]="SelectedTabCode != 'DCSO'">
                                    <div LocationDirective Code="DCSO"></div>
                                </div>

                                <!-- Docs In -->
                                <div class="MediaFill" [hidden]="SelectedTabCode != 'DCSI'">
                                    <div LocationDirective Code="DCSI"></div>
                                </div>

                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td *ngIf="IsShowNewWarehouseEntryButton" style="width: 130px;">
                        <button style="width:130px;float:right;" class="Button" (click)="NewWarehouseEntryButtonClicked()">New Cross Dock Entry</button>
                    </td>


                    <td *ngIf="IsShowNewWarehouseEntryButton" style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;" *ngIf="IsAddingStandaloneShipmentVisible && EntityPM.StandaloneShipmentId">
                        <Hyperlink (click)="ViewShipmentClicked(item)">{{EntityPM.StandaloneShipmentNumber}}</Hyperlink>
                    </td>

                    <td style="width: 1px;" *ngIf="IsAddingStandaloneShipmentVisible && !EntityPM.StandaloneShipmentId">
                        <button class="Button" (click)="CreateStandaloneShipmentClicked()" [disabled]="!EntityPM.FullResponsibility">Create Standalone Shipment</button>
                    </td>

                    <td style="width: 5px;" *ngIf="IsAddingStandaloneShipmentVisible">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button id="{{ 'CloseBtn' | IdGeneratorPipe}}" class="Button" (click)="CloseClicked()">Close</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <!-- Save -->
                    <td style="width: 57px;">
                        <button id="{{ 'SaveBtn' | IdGeneratorPipe}}" *ngIf="!EntityPM.IsDirty" class="Button">
                            <img class="LeftCenter" style="margin-left: 2px;" src="./Images/Buttons/Save.png" />
                            <span style="line-height: 19px; margin-left: 17px;">Save</span>
                        </button>

                        <button id="{{ 'SaveBtn' | IdGeneratorPipe}}" *ngIf="EntityPM.IsDirty" class="EntityChangesButton" (click)="OkButtonClicked()">
                            <img class="LeftCenter" style="margin-left: 2px;" src="./Images/Buttons/Save.Red.png" />
                            <span style="line-height: 19px; margin-left: 17px;">Save</span>
                        </button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <!-- Save & Close -->
                    <td style="width: 25px;">
                        <button id="{{ 'SaveClose' | IdGeneratorPipe}}" *ngIf="!EntityPM.IsDirty" class="Button" (click)="SaveChangesAndClose()" [title]="'General.B.SaveAndClose' | TextCodeTranslationPipe">
                            <img class="CenterCenter" src="./Images/Buttons/Save.png" />
                            <img src="./Images/RedX2.png" style="width: 7px; height: 7px; position: absolute; top:1px;" />
                        </button>

                        <button id="{{ 'SaveClose' | IdGeneratorPipe}}" *ngIf="EntityPM.IsDirty" class="EntityChangesButton" (click)="SaveChangesAndClose()" [title]="'General.B.SaveAndClose' | TextCodeTranslationPipe">
                            <img class="CenterCenter" src="./Images/Buttons/Save.Red.png" />
                            <img src="./Images/RedX2.png" style="width: 7px; height: 7px; position: absolute; top:1px;" />
                        </button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
