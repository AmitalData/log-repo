<div style="height: 100%;width: 100%;display: flex;flex-direction: column;">
    <div style="margin-left: 10px;" *ngIf="Tenant != 0">
        <div class="container-setting-directions-container">
            <div class="container-setting-directions-single-container">
                <LogCheckBox style="width:20px; height: 30px;" [HideColumns]="true" [ObjectFieldName]="'IsExport'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                <img width="18" height="16" src="./Images/Directions/E.png" />
                <label class="Label">Export</label>
            </div>
            <div class="container-setting-directions-single-container">
                <LogCheckBox style="width:20px;" [HideColumns]="true" [ObjectFieldName]="'IsDomestic'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                <img width="18" height="16" src="./Images/Directions/D.png" />
                <label class="Label">Domestic</label>
            </div>
        </div>

        <div class="container-setting-directions-container">
            <div class="container-setting-directions-single-container">
                <LogCheckBox style="width:20px;" [HideColumns]="true" [ObjectFieldName]="'IsImport'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                <img width="18" height="16" src="./Images/Directions/I.png" />
                <label class="Label">Import</label>
            </div>
            <div class="container-setting-directions-single-container">
                <LogCheckBox style="width:20px;" [HideColumns]="true" [ObjectFieldName]="'IsDrop'"
                    [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                <img width="18" height="16" src="./Images/Directions/R.png" />
                <label class="Label">Drop</label>
            </div>
        </div>
    </div>
    <div class="container-setting-carriers-header-container">
        <p style="font-size: 14px; color: #1B90CB;">Carriers</p>
        <SearchTextBox style="width: 200px;margin-left:auto;" [ObjectTableName]="ObjectTableName"
            [PlaceHolder]="'Search'" (SearchTextChangeEvent)="OnSearchTextChangeEvent($event)"></SearchTextBox>
    </div>
    <div class="SimpleGridView" style="overflow-x: hidden;">
        <div class="SimpleGridViewHeader">
            <table>
                <tr>
                    <td style="width:100px; min-width:100px;max-width:100px;">Code</td>
                    <td style="width:100px; min-width:100px;max-width:100px;">SCAC Code</td>
                    <td style="width:100%; min-width:100%;max-width:100%">Name</td>
                    <td style="width:163px; min-width:163px; max-width:163px;">Supports Container Tracking</td>
                    <td style="width:143px; min-width:143px; max-width:143px;">Automatic Requests Sent</td>
                </tr>
            </table>
        </div>

        <div class="SimpleGridViewBody">
            <table>
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr class="SimpleGridViewRow RowHover" *ngFor="let item of ItemSource">
                                <td>
                                    <table>
                                        <tr style="height:25px;">
                                            <td class="GridViewCell"
                                                style="width:100px; min-width:100px; max-width:100px;">
                                                {{item.Code}}
                                            </td>
                                            <td class="GridViewCell"
                                                style="width:100px; min-width:100px; max-width:100px;">
                                                {{item.SCACCode}}
                                            </td>

                                            <td class="GridViewCell"
                                                style="width: 100%; min-width: 100%;max-width: 100%;">
                                                {{item.Name}}
                                            </td>

                                            <td class="GridViewCell"
                                                style="width:163px; min-width:163px; max-width:163px; padding:0;">
                                                <div class="CenterCenter" style="width: 16px;">
                                                    <CheckBox [IsEnabled]="Tenant == 0"
                                                        [IsChecked]="item.IsSupportsContainerTracking"
                                                        (Checked)="item.IsSupportsContainerTracking = $event">
                                                    </CheckBox>
                                                </div>
                                            </td>

                                            <td class="GridViewCell"
                                                style="width:143px; min-width:143px; max-width:143px; padding:0;">
                                                <div class="CenterCenter" style="width: 16px;">
                                                    <CheckBox [IsEnabled]="item.IsAutomaticRequestsSentEnabled"
                                                        [IsChecked]="item.IsAutomaticRequestsSent"
                                                        (Checked)="item.IsAutomaticRequestsSent = $event"></CheckBox>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="7"></td>
                                        </tr>
                                    </table>


                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
