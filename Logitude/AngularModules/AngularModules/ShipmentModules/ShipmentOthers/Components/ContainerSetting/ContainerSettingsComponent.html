
<table *ngIf="IsVisible">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <table>
                    <tr style="height: 140px;">
                        <td>
                            <div class="MediaFill">
                                <SectionBox>
                                    <SectionHead>
                                        <table>
                                            <tr>
                                                <td style="width: 1px; color: #45494A; font-size: 14px;">General Settings</td>
                                            </tr>
                                        </table>
                                    </SectionHead>

                                    <SectionBody>
                                        <table>
                                            <tr class="FormFieldRow">
                                                <td style="width: 170px;">
                                                    <LogLabel [ObjectFieldName]="'EmptyReturnClosingDays'" [NoObjectField]="true" [Text]="'Empty Return Closing Days'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width: 200px;">
                                                    <table>
                                                        <tr>
                                                            <td>
                                                                <LogTextBox [InputType]="'unsinteger'" [ObjectFieldName]="'EmptyReturnClosingDays'" [Text]="EmptyReturnClosingDays" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                            </td>
                                                            <td>
                                                                <div float-end>
                                                                    <HelpIcon [Header]="'Help'" [Text]="ClosingContainerToolTipMessage"></HelpIcon>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                                <td>
                                                </td>
                                            </tr>

                                            <tr class="FormFieldRow">
                                                <td style="width: 170px;">
                                                    <LogLabel [ObjectFieldName]="'ShipmentATAClosingDays'" [NoObjectField]="true" [Text]="'Shipment ATA Closing Days'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                </td>

                                                <td style="width: 200px;">
                                                    <table>
                                                        <tr>
                                                            <td>
                                                                <LogTextBox [InputType]="'unsinteger'" [ObjectFieldName]="'ShipmentATAClosingDays'" [Text]="ShipmentATAClosingDays" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
                                                            </td>
                                                            <td>
                                                                <div float-end>
                                                                    <HelpIcon [Header]="'Help'" [Text]="'How many days after the Shipment ATA Date to wait before automatically closing the container.'"></HelpIcon>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                                <td>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td colspan="2">
                                                    <div></div>
                                                </td>
                                            </tr>

                                        </table>
                                    </SectionBody>
                                </SectionBox>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
