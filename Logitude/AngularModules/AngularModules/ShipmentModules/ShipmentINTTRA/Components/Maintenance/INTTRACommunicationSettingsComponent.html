
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table *ngIf="IsResourcesReady">

                <!-- INTTRAProdFTPHost -->
                <tr class="FormFieldRow">
                    <td style="width: 120px;">
                        <LogLabel [NoObjectField]="true" [ObjectFieldName]="'INTTRAProdFTPHost'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'INTTRA Prod FTP'"></LogLabel>
                    </td>

                    <td style="width: 450px;">
                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'INTTRAProdFTPHost'" [Text]="INTTRAProdFTPHost" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <!-- INTTRATestFTPHost -->
                <tr class="FormFieldRow">
                    <td style="width: 120px;">
                        <LogLabel [NoObjectField]="true" [ObjectFieldName]="'INTTRATestFTPHost'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [Text]="'INTTRA Test FTP'"></LogLabel>
                    </td>

                    <td style="width: 450px;">
                        <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'INTTRATestFTPHost'" [Text]="INTTRATestFTPHost" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
