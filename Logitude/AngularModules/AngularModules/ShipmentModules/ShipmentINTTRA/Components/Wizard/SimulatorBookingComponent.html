
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;vertical-align:top;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="vertical-align:top;">
        <td>
            <table>
                <tr>
                    <td>
                        <div class="MediaFill">
                            <div class="MediaFillRelative">
                                <ScrollViewer>
                                    <table>
                                        <tr>
                                            <td>
                                                <table>

                                                    <!-- INTTRABookingStatusName -->
                                                    <tr class="FormFieldRow">
                                                        <td style="width: 220px;">
                                                            <LogLabel [NoObjectField]="true" [ObjectFieldName]="'INTTRABookingStatusCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td> <div>{{INTTRABookingStatusName}}</div></td>
                                                    </tr>

                                                    <!-- INTTRABookingTransStatusName -->
                                                    <tr class="FormFieldRow">
                                                        <td>
                                                            <LogLabel [NoObjectField]="true" [ObjectFieldName]="'INTTRABookingTransStatusCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                        </td>

                                                        <td> <div>{{INTTRABookingTransStatusName}}</div></td>
                                                    </tr>

                                                    <tr>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                </ScrollViewer>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SendButtonClicked()">Send</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
