
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;" *ngIf="IsLimited">
        <td>
            <div class="OrangeInfo" style="margin: 5px;">
                SI re-sending to INTTRA is not allowed
            </div>
        </td>
    </tr>

    <tr style="height: 1px;" *ngIf="ResultMessage">
        <td style="text-align: center; vertical-align: middle; font-size: 14px; color: #009161;">
            {{ResultMessage}}
        </td>
    </tr>

    <tr style="height: 1px;" *ngIf="IsDemoAreaVisible">
        <td>
            <div class="MultiLinesText" style="max-height: 65px; color: #6E7172; font-size: 13px; font-style: italic;">
                Please note that this message will not be sent to the shipping line since it is a demo environment. You can still review the built message
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill">
                <div class="MediaFillRelative">
                    <ScrollViewer>
                        <table>
                            <tr>
                                <td>
                                    <table>

                                        <!-- EmergencyContactId -->
                                        <tr class="FormFieldRow">
                                            <td style="width: 170px;">
                                                <LogLabel [ObjectFieldName]="'EmergencyContactId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'EmergencyContactId'"
                                                        [SelectedValue]="EmergencyContactId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Contact'">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- INTTRAContractNumber -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'INTTRAContractNumber'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogTextBox [ObjectFieldName]="'INTTRAContractNumber'" [Text]="INTTRAContractNumber" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>
                                        </tr>

                                        <!-- INTTRADocumentTypeCode -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'INTTRADocumentTypeCode'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'INTTRADocumentTypeCode'"
                                                        [SelectedValue]="INTTRADocumentTypeCode"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'INTTRADocumentType'">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- INTTRADocumentQTY -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'INTTRADocumentQTY'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogTextBox [ObjectFieldName]="'INTTRADocumentQTY'" [Text]="INTTRADocumentQTY" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogTextBox>
                                            </td>
                                        </tr>

                                        <!-- INTTRAIsFreighted -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'INTTRAIsFreighted'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogCheckBox [ObjectFieldName]="'INTTRAIsFreighted'" [Checked]="INTTRAIsFreighted" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                            </td>
                                        </tr>

                                        <!-- FreightPayerId -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'FreightPayerId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'FreightPayerId'"
                                                        [SelectedValue]="FreightPayerId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Card'"
                                                        [DependencyFilter1Value]="'CS,AG'"
                                                        [DependencyFilter1IsList]="true">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- FreightPayerAddressId -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'FreightPayerAddressId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'FreightPayerAddressId'"
                                                        [SelectedValue]="FreightPayerAddressId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'Address'"
                                                        [DependencyFilter1Value]="FreightPayerId">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- BasicFreightId -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'BasicFreightId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'BasicFreightId'"
                                                        [SelectedValue]="BasicFreightId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'PrepaidCollect'">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- DestinationPortChargesId -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'DestinationPortChargesId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'DestinationPortChargesId'"
                                                        [SelectedValue]="DestinationPortChargesId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'PrepaidCollect'">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- DestinationHaulageChargesId -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'DestinationHaulageChargesId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'DestinationHaulageChargesId'"
                                                        [SelectedValue]="DestinationHaulageChargesId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'PrepaidCollect'">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <!-- AdditionalChargesId -->
                                        <tr class="FormFieldRow">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'AdditionalChargesId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <LogLov [ObjectFieldName]="'AdditionalChargesId'"
                                                        [SelectedValue]="AdditionalChargesId"
                                                        [ObjectTableName]="ObjectTableName"
                                                        [DataContext]="DataContext"
                                                        [LookUpTableName]="'PrepaidCollect'">
                                                </LogLov>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>

                                <td style="width: 15px;">
                                    <div></div>
                                </td>

                                <td style="width: 350px;">
                                    <table>

                                        <!-- INTTRAInstructions -->
                                        <tr class="FormFieldRow" style="height: 85px;">
                                            <td style="width: 90px;">
                                                <LogLabel [ObjectFieldName]="'INTTRAInstructions'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <div class="MediaFill" style="padding-top:3px">
                                                    <LogTextBox [ObjectFieldName]="'INTTRAInstructions'" [Text]="INTTRAInstructions" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr style="height: 10px;">
                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <!-- INTTRAComments -->
                                        <tr class="FormFieldRow" style="height: 85px;">
                                            <td>
                                                <LogLabel [ObjectFieldName]="'INTTRAComments'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                            </td>

                                            <td>
                                                <div class="MediaFill">
                                                    <LogTextBox [ObjectFieldName]="'INTTRAComments'" [Text]="INTTRAComments" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [IsMultiline]="true"></LogTextBox>
                                                </div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="2">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </ScrollViewer>
                </div>                
            </div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td style="width: 57px;" *ngIf="SimulatorIsVisible">
                        <button class="Button" (click)="SimulateClicked()">Simulate</button>
                    </td>
          
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SendButtonClicked()" [disabled]="IsLimited">Send</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
