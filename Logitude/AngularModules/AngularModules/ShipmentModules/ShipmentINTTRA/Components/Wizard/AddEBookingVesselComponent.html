
<table>
    <tr style="height: 1px;">
        <td>
            <div class="OrangeInfo MultiLinesText" style="margin: 3px;width:630px;">
                Vessel not found in your vessels please select the vessel for {{EntityPM.INTTRABookingResponse_Vessel}} or create a new one (you can leave it empty)
            </div>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <!-- Vessel -->
    <tr class="FormFieldRow">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width: 80px;">
                        <LogLabel [ObjectFieldName]="'MainCarriageVesselId'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [TextCode]="'Shipment.F.MainCarriageVesselId.Short'"></LogLabel>
                    </td>

                    <td style="width: 200px;">
                        <LogLov [ObjectFieldName]="'INTTRABookingResponse_VesselId'"
                                [SelectedValue]="EntityPM.INTTRABookingResponse_VesselId"
                                [ObjectTableName]="ObjectTableName"
                                [NoObjectField]="true"
                                [DataContext]="EntityPM"
                                [LookUpTableName]="'Vessel'">
                        </LogLov>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                    <td style="width: 10px;">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
