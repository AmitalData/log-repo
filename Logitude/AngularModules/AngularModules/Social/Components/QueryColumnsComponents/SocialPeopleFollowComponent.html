<style>
        .FollowButton {
        border: 1px solid #057ED0;
        color: white;
      
        border-radius: 3px;
        background: #2DB8EC; /* Old browsers */
        background: -moz-linear-gradient(top, #2DB8EC 0%, #2DB8EC 100%); 
        background: -webkit-linear-gradient(top, #2DB8EC 0%,#2DB8EC 100%);
        background: linear-gradient(to bottom, #2DB8EC 0%,#2DB8EC 100%);
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#2DB8EC', endColorstr='#2DB8EC',GradientType=0 );
    }
        .FollowButton:hover:not(:disabled) {
            border: 1px solid #952F2C;
            border-radius: 3px;
            background: #E75954; /* Old browsers */
            background: -moz-linear-gradient(top, #E75954 0%, #E75954 100%); 
            background: -webkit-linear-gradient(top, #E75954 0%,#E75954 100%);
            background: linear-gradient(to bottom, #E75954 0%,#E75954 100%);
            filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#E75954', endColorstr='#E75954',GradientType=0 ); 

        }

.FollowButton .Unfollow { display: none; }
.FollowButton:hover .Following { display: none; }
.FollowButton:hover .Unfollow { display: inline; }


      .UnFollowButton {
           border: 1px solid #A0A0A0;
        color: black;
      
        border-radius: 3px;
        background: #C8C8C8; 
        background: -moz-linear-gradient(top, #C8C8C8 0%, #C8C8C8 100%); 
        background: -webkit-linear-gradient(top, #C8C8C8 0%,#C8C8C8 100%);
        background: linear-gradient(to bottom, #C8C8C8 0%,#C8C8C8 100%);
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#C8C8C8', endColorstr='#C8C8C8',GradientType=0 );
    }
        .UnFollowButton:hover:not(:disabled) {
              border: 1px solid #A0A0A0;
            border-radius: 3px;
            background: #DDDDDD; /* Old browsers */
            background: -moz-linear-gradient(top, #DDDDDD 0%, #DDDDDD 100%); 
            background: -webkit-linear-gradient(top, #DDDDDD 0%,#DDDDDD 100%);
            background: linear-gradient(to bottom, #DDDDDD 0%,#DDDDDD 100%);
            filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#DDDDDD', endColorstr='#DDDDDD',GradientType=0 ); 
          

        }
</style>


<div >
    <button  *ngIf="rowData && rowData.IsFollowed" (click)="FollowingButtonClick( rowData)" style="width:80px;font-weight:bold;font-size:12px;margin-top:1px;" class="FollowButton CenterCenter">
  
        <span class="Following">Following</span>
        <span class="Unfollow">Unfollow</span>

    </button>

    <button class="UnFollowButton CenterCenter" *ngIf="rowData && !rowData.IsFollowed" (click)="FollowingButtonClick(rowData)" style="width:80px;margin-top:1px;font-size:12px;" >
        Follow

    </button>
</div>
