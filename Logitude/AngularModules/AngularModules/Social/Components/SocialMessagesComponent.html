<style>
    .MessageScrollViewer {
        height: 100%;
        width: 100%;
        max-height: 100%;
        max-width: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
    }



    .Hyperlink:hover:not(:disabled), .HyperlinkQueryButtonControl:focus:not(:disabled) {
        color: #1E8DC4;
        text-decoration: underline;
    }

    .Hyperlink {
        height: 21px !important;
        width: auto !important;
        line-height: 21px !important;
        background: none !important;
        border: none !important;
        padding: 0 !important;
        color: #1E4AC4;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
    }



    .HyperlinkOther:hover:not(:disabled), .HyperlinkQueryButtonControl:focus:not(:disabled) {
        color: #1E8DC4;
        text-decoration: underline;
    }

    .HyperlinkOther {
        height: 21px !important;
        width: auto !important;
        line-height: 21px !important;
        background: none !important;
        border: none !important;
        padding: 0 !important;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
    }
</style>


<table style="width:100%;height:100%">

    <tr style="height:30px;border-bottom:1px solid Gray">
        <td>
            <div style="vertical-align:central">
                <table>
                    <tr>
                        <td style="width:10px"><div style="width:10px"></div></td>
                        <td style="width:100px"><div (click)="GotoInboxButtonClick()" class="Hyperlink">Go to Inbox</div></td>
                        <td></td>
                        <td style="width:60px"><div (click)="RefreshButtonClick()" class="Hyperlink">Refresh</div></td>
                        <td style="width:70px"><div (click)="NewMessageButtonClick()" class="Hyperlink">New Message</div></td>
                        <td style="width:10px"><div style="width:10px"></div></td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
    <tr style="height:100%">
        <td style="vertical-align:top">

            <div class="MediaFill">
                <div (scroll)="onScroll()" [attr.id]="MessageListsId" class="MessageScrollViewer">
                    <table>
                        <tr style="height:100%;">

                            <td *ngIf="!IsNoData" style="vertical-align:top;">

                                <div *ngFor="let item of ConversationHeaderLists">
                                    <div  (mouseleave)="OnmMouseleave(item)"  (mouseover)="OnmMouseOver(item)" [style.background-color]="item.BackgroundConversationHeader" style="min-height:50px;background-color:white;border-bottom:1px solid #DDDDDD; cursor:pointer">
                                        <table >
                                            <tr>
                                                <td (click)="OnSelectMessage(item)" style="width:10px"><div style="width:10px"></div></td>
                                                <td>
                                                    <table>
                                                        <tr (click)="OnSelectMessage(item)" style="height:5px"><td colspan="5"></td></tr>
                                                        <tr  style="height:40px">
                                                            <td (click)="OnSelectMessage(item)" style="width:8px;"></td>
                                                            <td (click)="OnSelectMessage(item)" style="width:40px;vertical-align:top">

                                                                <div style="height:40px;width:40px;margin: auto;vertical-align:top">
                                                                    <ImageComponent style="vertical-align:top" [HeightImage]="'40'" [WidthImage]="'40'" [EntityName]="'SocialMessage'" [ConversationHeaderId]="item.ConversationHeaderId"> </ImageComponent>
                                                                </div>


                                                            </td>
                                                            <td (click)="OnSelectMessage(item)" style="width:10px;"></td>
                                                            <td>
                                                                <div  style="height:20px">
                                                                    <table style="table-layout: fixed; width: 100%">
                                                                        <tr style="height:20px;vertical-align:top">

                                                                            <td style="vertical-align:top">

                                                                          <table>
                                                                              <tr>
                                                                                  <td style="width:1px">
                                                                                      <img (click)="OnSelectMessage(item)" *ngIf="item.DisplayEntityInformation && item.ObjectTableName!='Opportunity' && item.EntityImageSource" style="background-color:transparent;margin-top:-5px;height:20px;width:20px" [attr.src]="item.EntityImageSource" />

                                                                                      <img (click)="OnSelectMessage(item)" *ngIf="item.DisplayEntityInformation && item.ObjectTableName=='Opportunity' && item.EntityImageSource" style="background-color:transparent;margin-top:-5px;height:25px;width:29px" [attr.src]="item.EntityImageSource" />

                                                                                      <span *ngIf="item.DisplayEntityInformation" (click)="item.ViewEntityButtonClick(item)" class="Hyperlink">{{item.EntityDescription}}</span>
                                                                                      <span (click)="OnSelectMessage(item)" *ngIf="item.DisplayEntityInformation"> — </span>
                                                                                      <span (click)="OnSelectMessage(item)" [style.color]="item.ForegroundMessageParticipants" style="font-size:12px">{{item.MessageParticipants}}</span>
                                                                                      <span *ngIf="item.MessageOthers" (click)="item.ViewMessageOthers(item)" class="HyperlinkOther" style="font-size:12px">{{item.MessageOthers}}</span>
                                                                                  </td>
                                                                                  <td  (click)="OnSelectMessage(item)" ></td>
                                                                              </tr>
                                                                          </table>
                                                                                
                                                                        

                                                                            </td>
                                                                        
                                                                            <td (click)="OnSelectMessage(item)" style="width:20px;text-align:center;"><span style="color:#838889;font-size:12px;text-align:center">{{item.CreateDate | DateTimeToMSDYDatePipe}}</span></td>
                                                                            <td style="width:5px;"><div style="width:5px"></div></td>
                                

                                                                        </tr>
                                                                    </table>
                                                                </div>

                                                                <div style="height:20px">
                                                                    <table style="table-layout: fixed; width: 100%">
                                                                        <tr>
                                                                            <td (click)="OnSelectMessage(item)" *ngIf="item.IsShowArrowReceiveMessage" style="width:18px"><div style="width:18px;"><img style="width:17px;cursor:pointer;height:12px;margin-top:-3px" src="./Images/Social/ArrowReceiveMessage.png" /></div></td>
                                                                            <td (click)="OnSelectMessage(item)" *ngIf="item.IsShowArrowSend" style="width:12px"><div style="width:12px;"><img style="width:7px;cursor:pointer;height:10px;margin-top:-2px" src="./Images/Social/ArrowSend.png" /></div></td>
                                                                            <td (click)="OnSelectMessage(item)" ><div [style.color]="item.ForegroundMessageBody" [style.font-weight]="item.FontWeightbody" style="font-size:11px;" class="TextTrimming">{{item.LasMessageUserName}}{{item.MessageBody}}</div></td>
                                                                            <td (click)="OnSelectMessage(item)" style="width:10px"><div style="width:10px"></div></td>
                                                                           
                                                                            <td *ngIf="item.VisibilityIsWaitingForResponse && !item.VisibilityIsNotWaitingForResponse && !item.IsShowNumberUnreadComment" (click)="WaitingForResponse(item)" style="width:20px"><div style="width:20px;cursor:pointer"><img style="width:20px;cursor:pointer;height:15px;margin-top:3px" src="./Images/Social/WaitingForResponse.png" /></div></td>
                                                                            <td *ngIf="item.VisibilityIsNotWaitingForResponse && !item.VisibilityIsWaitingForResponse && !item.IsShowNumberUnreadComment" (click)="WaitingForResponse(item)" style="width:20px"><div style="width:20px;cursor:pointer"><img style="width:20px;height:15px;cursor:pointer;margin-top:3px" src="./Images/Social/NotWaitingForResponse.png" /></div></td>



                                                                            <td (click)="OnSelectMessage(item)" *ngIf="item.IsShowNumberUnreadComment" style="width:17px"><div style="height:17px;width:17px;vertical-align:central;text-align:center;margin-top:3px;color:white;background-color:Gray">{{item.NumberUnreadComment}}</div></td>
                                                                            <td (click)="OnSelectMessage(item)" *ngIf="!item.VisibilityIsNotWaitingForResponse && !item.VisibilityIsWaitingForResponse && !item.IsShowNumberUnreadComment" style="width:27px"><div style="width:10px"></div></td>
                                                                            <td style="width:5px;"><div style="width:5px"></div></td>
                                                                        </tr>
                                                                    </table>
                                                                </div>
                                                                <div (click)="OnSelectMessage(item)" style="height:6px">
                                                                </div>
                                                            </td>
                                                            <td (click)="OnSelectMessage(item)"></td>
                                                        </tr>
                                                    </table>

                                                </td>
                                                <td (click)="OnSelectMessage(item)" style="width:10px"><div style="width:10px"></div></td>
                                            </tr>
                                        </table>


                                    </div>
                                </div>


                            </td>


                            <td style="vertical-align:top;" *ngIf="IsNoData">
                                <div class="NoDataTextStyle" style="text-align:center;vertical-align:top;font-size:14px;margin-left:-5px;margin-top:10PX;color:gray">No Recent Message</div>
                            </td>


                        </tr>
                        <tr><td></td></tr>
                    </table>
                </div>
            </div>




            <!--</ScrollViewer>-->








        </td>

    </tr>
</table>

<div *ngIf="IsViewMessage"  class="MediaFillAbsolute" style="background: white;width:100%;height:100%">
    <div class="MarginAbsolute0" style="top: 0px;">
        <table style="width:100%;height:100%">
            <tr style="height:100%">
                <td>
                    <div style="height:100%;vertical-align:top">
                      <ConversationMessageComponent [SocialMessagesComponent]="SocialMessagesComponent"  [ConversationHeader]="ConversationHeader"></ConversationMessageComponent>
</div>


                </td>
            </tr>
        </table>
      </div>
    </div>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator"></BusyIndicator>
