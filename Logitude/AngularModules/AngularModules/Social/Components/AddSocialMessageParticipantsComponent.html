<style>
    .InputDiv {
        width: 100%;
        vertical-align: top;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        /*text-indent: 5px;*/
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
    }

        .InputDiv:hover {
            border: 1px solid #3BB3E2;
        }

    .InputDivDisabled {
        opacity: 0.5;
        pointer-events: none;
    }
</style>

<table>





    <tr style="height:100%;vertical-align:top">


        <td>
            <table>

                <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
                    <td colspan="4">
                        <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                    </td>
                </tr>

                <tr style="height:30px;">
                  
                    <td><EmailSearchTextBox    (SelectedListChanged) = "ParticipantUserLists = $event" [Watermark]="'Add User'" [EmailsText]="UserIds"  [ExcludedResult]="ExcludedResult"   [SelectedValuePath]="'Id'" [IsUsersList]="true" (EmailsTextChanged)="UserIds = $event"></EmailSearchTextBox></td>

                </tr>
              

                <tr>
                    <td></td>
                
                </tr>
             

            </table>
        </td>



    </tr>



    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClick()">Save</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
