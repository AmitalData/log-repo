<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table>

                <!-- Owner Id -->
                <tr class="FormFieldRow">
                    <td style="width:120px;">
                        <LogLabel [NoObjectField]="true" [Text]="'Available Projects'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                    </td>
                    <td style="width:150px;">
                        <LogLov [ObjectFieldName]="'Id'"
                                [DataContext]="DataContext"
                                [ObjectTableName]="ObjectTableName"
                                [SelectedValue]="Id"
                                [LookUpTableName]="'TMProject'" >
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>               


                <tr>
                    <td colspan="3">
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="ConnectButtonClicked()">Connect</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
