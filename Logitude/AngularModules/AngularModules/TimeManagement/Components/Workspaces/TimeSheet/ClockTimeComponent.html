
<style type="text/css">
    .ItemBox {
        height: 40px;
        border: 1px solid #D1D1D1;
        margin: 2px;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        overflow-x: hidden;
    }

    .ToolsButton {
        display: none;
    }

    .ItemBox:hover .ToolsButton {
        display: block;
    }

    .ItemBox:hover .ToolsButtonDisabled {
        display: block;
    }

    .ItemDisabled {
        background: red;
    }

    .SaveTMButton {
        background: #349BDB;
        height: 30px;
        color: white;
        border-radius: 2px;
        cursor: pointer;
    }

    .SaveTMButtonHasChanges {
        background: Orange;
        height: 30px;
        color: white;
        border-radius: 2px;
        cursor: pointer;
    }
</style>

<table>
    <tr style="vertical-align:top">
        <td style="width:10px;">
            <div></div>
        </td>

        <td>
            <table>
                <tr style="height:5px">
                    <td></td>
                </tr>

                <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;padding-top:5px">
                    <td>
                        <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
                    </td>
                </tr>

                <tr style="height:5px">
                    <td></td>
                </tr>

                <tr style="height:28px;">
                    <td>
                        <div class="MediaFill">
                            <div class="MediaFillAbsolute OrangeInfo" style="top: 2px; bottom: 2px; padding: 0px;">
                                <div style="line-height: 25px; margin-left: 5px; float: left; color:black; font-size:11px;">
                                    Talk to the HR Administrator if you need to update any clock values
                                </div>                                
                            </div>
                        </div>
                    </td>
                </tr>

                <tr style="height:20px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height:22px;">
                    <td style="vertical-align:top">
                        <table>
                            <tr style="vertical-align:top">
                                <td style="width:70px;">
                                    <LogLabel [Text]="'Employee'" [DataContext]="DataContext" [NoObjectField]="true"></LogLabel>
                                </td>

                                <td style="width:120px;">
                                    <LogLov [NoObjectField]="true"
                                            [ObjectFieldName]="'EmployeeUserId'"
                                            [DataContext]="DataContext"
                                            [SelectedValue]="EmployeeUserId"
                                            [LookUpTableName]="'User'"
                                            [HideColumns]="true">
                                    </LogLov>
                                </td>

                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:80px;">
                                    <LogLabel [Text]="'From Date'" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:120px;">
                                    <LogDatePicker [InputType]="'date'" [HideColumns]="true" [NoObjectField]="true" [ObjectFieldName]="'FromDate'" [SelectedDateValue]="FromDate" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td style="width:10px"></td>
                                <td style="width:80px;">
                                    <LogLabel [Text]="'To Date'" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:120px;">
                                    <LogDatePicker [InputType]="'date'" [HideColumns]="true" [NoObjectField]="true" [ObjectFieldName]="'ToDate'" [SelectedDateValue]="ToDate" [DataContext]="DataContext"></LogDatePicker>
                                </td>
                                <td style="width:10px"></td>

                                <td style="width:100px">
                                    <button class="Button" (click)="SearchButtonClicked()">Search</button>
                                </td>
                                <td></td>

                                <td style="width: 90px;">
                                    <button class="Button" (click)="AddNewClockHour()" style="height:25px" [disabled]="!IsHRUser">
                                        <img class="LeftCenter" style="width:17px;height:12px;padding-left:2px;padding-right:2px;" src="./Images/Buttons/AddGreenSolid.png" />
                                        Add Line
                                    </button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="width: 145px;">
                                    <button class="Button" (click)="PrintPreviewClicked()" style="height:25px">
                                        <img class="LeftCenter" style="width:17px;height:12px;padding-left:2px;padding-right:2px;" src="./Images/FileIcons/File-pdf-48.png" />
                                        Print Preview (PDF)
                                    </button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>

                                <td style="width: 90px;">
                                    <button *ngIf="!HasChanged" class="Button" style="height:25px;">
                                        <img [ngStyle]="{'margin-left': '2px'}" src="./Images/Buttons/Save.png" [className]="LeftCenter" />
                                        <span style="line-height: 19px;" [ngStyle]="{'margin-left': '5px'}">Save</span>
                                    </button>
                                    <button *ngIf="HasChanged" class="EntityChangesButton" (click)="SaveTimeOfficeHour()" style="height:25px;">
                                        <img src="./Images/Buttons/Save.Red.png" [className]="LeftCenter" [ngStyle]="{'margin-left': '2px'}" />
                                        <span style="line-height: 19px;" [ngStyle]="{'margin-left': '5px'}">Save</span>
                                    </button>
                                </td>

                                <td style="width: 5px;">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:10px">
                    <td></td>
                </tr>

                <tr style="vertical-align:top;height:100%">
                    <td>
                        <div class="MediaFill">
                            <logitude-edit-grid GridWidth="100%" [HeaderHeight]="25" GridHeight="100%" [ItemSource]="ItemSourceCollection">

                                <!-- WorkDate -->
                                <log-column [width]="'100'" [header]="'Work Date'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IsEnabled]="false">
                                            <div style="width: 100%; text-align: left;" *ngIf="logcelltemplate.IsDisplayMode">
                                                {{item.WorkDate  | DateTimePipe:'SD'}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- EntryTime -->
                                <log-column [width]="'100'" [header]="'Entry Time'">

                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IsEnabled]="!item.Inactive && IsHRUser">
                                            <div style="width: 100%; text-align: left;" *ngIf="logcelltemplate.IsDisplayMode">
                                                {{item.EntryTime  | DateTimePipe:'T'}}
                                                <img src="./Images/EditPencilActiving.png" title="{{item.EditedManualyEntryTime}}" *ngIf="item.RecordedEntryAddedManually" />
                                            </div>

                                            <div style="width: 100%; text-align: center;" *ngIf="logcelltemplate.IsEditMode">
                                                <LogDatePicker [FocusOnMe]="'true'" [ObjectFieldName]="'EntryTime'" [InputType]="'time'" [TimeMode]="24" [NoObjectField]="true" [SelectedDateValue]="EntryTime" [ObjectTableName]="'TMOfficeHour'" [DataContext]="item.DataContext" [HideColumns]="true"></LogDatePicker>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- ExitTime -->
                                <log-column [width]="'100'" [header]="'Exit Time'">

                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IsEnabled]="!item.Inactive && IsHRUser">
                                            <div style="width: 100%; text-align: left;" *ngIf="logcelltemplate.IsDisplayMode">
                                                {{item.ExitTime  | DateTimePipe:'T'}}
                                                <img src="./Images/EditPencilActiving.png" title="{{item.EditedManualyExitTime}}" *ngIf="item.RecordedExitAddedManually" />
                                            </div>

                                            <div style="width: 100%; text-align: center;" *ngIf="logcelltemplate.IsEditMode">
                                                <LogDatePicker [FocusOnMe]="'true'" [ObjectFieldName]="'ExitTime'" [InputType]="'time'" [TimeMode]="24" [NoObjectField]="true" [SelectedDateValue]="ExitTime" [ObjectTableName]="'TMOfficeHour'" [DataContext]="item.DataContext" [HideColumns]="true"></LogDatePicker>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Duration -->
                                <log-column [width]="'80'" [header]="'Duration'">

                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IsEnabled]="false">
                                            <div style="width: 100%; text-align: left;" *ngIf="logcelltemplate.IsDisplayMode" [ngStyle]="{'color':item.Minutes < 0 ?'red':'black'}">
                                                {{item.Minutes | TimeToHoursMinutesPipe}}
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Description -->
                                <log-column [width]="'200'" [header]="'Description'">

                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate [IsEnabled]="!item.Inactive">
                                            <div style="width: 100%; text-align: left;" *ngIf="logcelltemplate.IsDisplayMode">
                                                {{item.Description}}
                                            </div>

                                            <div style="width: 100%; text-align: center;" *ngIf="logcelltemplate.IsEditMode">
                                                <LogTextBox [FocusOnMe]="'true'" [ObjectFieldName]="'Description'" [Text]="Description" [NoObjectField]="true" [ObjectTableName]="'TMOfficeHour'" [DataContext]="item.DataContext"></LogTextBox>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>

                                <!-- Inactive -->
                                <log-column [width]="'80'" [header]="'Inactive'">
                                    <ng-template let-item>
                                        <log-cell-template #logcelltemplate>
                                            <div style="height: 100%; width: 100%; position:relative;">
                                                <div class="CenterCenter" style="width: 16px;">
                                                    <CheckBox (Checked)="item.Inactive=$event" [IsChecked]="item.Inactive" [IsEnabled]="IsHRUser"></CheckBox>
                                                </div>
                                            </div>
                                        </log-cell-template>
                                    </ng-template>
                                </log-column>
                            </logitude-edit-grid>
                        </div>

                    </td>
                </tr>

                <tr style="height: 50px;">
                    <td style="vertical-align: bottom">
                        <div style="height:50px;border:1px solid #E9E9E9; background: #E9E9E9; color:#1B90CB;margin:2px;border-radius:3px;">
                            <table>
                                <tr>
                                    <td style="width: 300px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 80px; font-size: 16px;">
                                        {{TotalMinutes | TimeToHoursMinutesPipe}}
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </td>
                </tr>

                <tr style="height: 15px;">
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>

        <td style="width:10px;">
            <div></div>
        </td>
    </tr>
</table>
