
    <div class="MediaFillRelative">
        <div class="MarginAbsolute10">
            <table>
                <tr style="height: 1px;">
                    <td>
                        <table>
                            <tr>
                                <td style="width: 25px;">
                                    <button class="Button" style="height:25px;width:25px;" (click)="RefreshButtonClicked()">
                                        <img class="CenterCenter" style="padding-left:2px;padding-right:2px;" src="./Images/Buttons/Refresh.png" />
                                    </button>
                                </td>

                                <td style="width: 1px; padding-left: 15px; padding-right: 5px;" class="Label">
                                    Year:
                                </td>

                                <td style="width: 100px;">
                                    <ComboBox [IsBlueBox]="true" [WaterMark]="'Year'" [ItemsSource]="Years" [SelectedItem]="Year" (SelectedItemChanged)="Year=$event"></ComboBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height: 10px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td>
                        <table>
                            <tr>
                                <td style="width:265px;">
                                    <div class="MediaFill">
                                        <SectionBox>
                                            <SectionHead>Totals</SectionHead>
                                            <SectionBody>

                                                <HyperlinkQuery>Holidays ({{Holidays}})</HyperlinkQuery>
                                                <HyperlinkQuery>Vacations ({{Vacations}})</HyperlinkQuery>
                                                <HyperlinkQuery>Half Vacations ({{HalfVacations}})</HyperlinkQuery>
                                                <HyperlinkQuery>Unpaid Vacations ({{UnpaidVacations}})</HyperlinkQuery>
                                                <HyperlinkQuery>Sickness Vacations ({{SicknessVacations}})</HyperlinkQuery>
                                                <HyperlinkQuery>Sick Leaves ({{SickLeaves}})</HyperlinkQuery>


                                            </SectionBody>
                                        </SectionBox>
                                    </div>
                                </td>

                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td>
                                    <div class="MediaFill">
                                        <SectionBox>
                                            <SectionHead>Details</SectionHead>
                                            <SectionBody>

                                            </SectionBody>
                                        </SectionBox>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </div>
    </div>
