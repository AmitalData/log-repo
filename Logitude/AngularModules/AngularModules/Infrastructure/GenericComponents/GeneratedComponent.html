<style>

    .section-title {
        font-size: 14px;
        color: #1B90CB;
    }
</style>
<div *ngIf="EntityPM">

    <div *ngIf="!ShowNoFieldsText">
        <div style="margin-bottom: 40px; width: 100% " *ngFor="let screenSection of ScreenSections">

            <table style="width:100%;">
                <tr *ngIf="ShowSectionName(screenSection)">
                    <td class="section-title">{{screenSection.Title}}</td>
                </tr>
                <tr *ngIf="screenSection.Type != 'Grid'" style="height:100%">
                    <td *ngFor="let ScreenColumn of screenSection.ScreenColumns" style="width: 430px;">
                        <table>
                            <tr class="FormFieldRow" *ngFor="let objectField of ScreenColumn.ObjectFields" [ngStyle]="{border: (IsCustomerCareOrDistributor && objectField.IsCustom == true) ? '1px dashed #CCC' : 'none'}">
                                <td *ngIf="!objectField.MultiLine" [style.width.px]="screenSection.actualColumnsCount == 3 ? 160 : LabelWidth" [style.min-width.px]="screenSection.actualColumnsCount == 3 ? 160 : LabelWidth">
                                    <LogLabel *ngIf="objectField.FieldName != 'CustomField'" [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [DataContext]="EntityPM"></LogLabel>
                                    <LogLabel *ngIf="objectField.FieldName == 'CustomField' && IsCustomerCare" [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [DataContext]="EntityPM"></LogLabel>
                                </td>

                                <td *ngIf="(objectField.DisplayOnly && IsDisplaySummarySection)">
                                    <div *ngIf="objectField.HasTemplate && (objectField.DataTypeCode == 'Date' || objectField.DataTypeCode == 'DateTime')" style="width: 100%;">
                                        {{EntityPM[objectField.Code] | DateTimePipe:'DT'}}
                                    </div>
                                    <div *ngIf="(objectField.DataTypeCode != 'Date' && objectField.DataTypeCode != 'DateTime') || !objectField.HasTemplate" style="width: 100%; padding-bottom: 15px;">
                                        <ObjectFieldTemplate [ObjectTable]="ObjectTable" [ObjectField]="objectField" [Entity]="EntityPM" [IsHeaderScreenTemplate]="true" style="width:100%;"></ObjectFieldTemplate>
                                    </div>
                                </td>

                                <td *ngIf="!objectField.MultiLine && !objectField.GeneratedComponentPath  && !(objectField.DisplayOnly && IsDisplaySummarySection)">
                                    <div *ngIf="objectField.DataTypeCode == 'Boolean'">
                                        <LogCheckBox [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [Checked]="EntityPM[objectField.FieldName]" [DataContext]="EntityPM"
                                                     [HideColumns]="HideColumns">

                                        </LogCheckBox>
                                    </div>

                                    <div *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText' || objectField.DataTypeCode == 'Integer' || objectField.DataTypeCode == 'Double' ||objectField.DataTypeCode == 'Decimal'">
                                        <LogTextBox *ngIf="objectField.IsCustom" [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [DataContext]="EntityPM" [Text]="EntityPM[objectField.FieldName]" [IsNewEntityCall]="IsNewEntityCall"
                                                    [HideColumns]="HideColumns"
                                                    [HideLastColumn]="HideLastColumn"
                                                    [FocusOnMe]="IsFocused(objectField)">

                                        </LogTextBox>
                                        <LogTextBox *ngIf="!objectField.IsCustom" [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [Text]="EntityPM[objectField.FieldName]" [DataContext]="EntityPM" [IsNewEntityCall]="IsNewEntityCall"
                                                    [HideColumns]="HideColumns"
                                                    [HideLastColumn]="HideLastColumn"
                                                    [FocusOnMe]="IsFocused(objectField)">

                                        </LogTextBox>
                                    </div>

                                    <div *ngIf="objectField.DataTypeCode == 'DateTime'">
                                        <table>
                                            <tr class="FormFieldRow">
                                                <td>
                                                    <LogDatePicker [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="EntityPM[objectField.FieldName]" [DataContext]="EntityPM"
                                                                   [HideColumns]="true"
                                                                   [HideLastColumn]="HideLastColumn"
                                                                   [FocusOnMe]="IsFocused(objectField)">

                                                    </LogDatePicker>
                                                </td>
                                                <td style="width:3px;">
                                                    <div></div>
                                                </td>
                                                <td>
                                                    <LogDatePicker [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="EntityPM[objectField.FieldName]" [DataContext]="EntityPM" [InputType]="'time'" [TimeMode]="12"
                                                                   [HideColumns]="HideColumns"
                                                                   [HideLastColumn]="HideLastColumn">

                                                    </LogDatePicker>
                                                </td>
                                            </tr>
                                        </table>

                                    </div>

                                    <div *ngIf="(objectField.DataTypeCode == 'Date')">
                                        <LogDatePicker [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [SelectedDateValue]="EntityPM[objectField.FieldName]" [DataContext]="EntityPM" [HideColumns]="HideColumns" [FocusOnMe]="IsFocused(objectField)"></LogDatePicker>
                                    </div>

                                    <div *ngIf="objectField.DataTypeCode == 'LookUp'">
                                        <LogLov [ObjectFieldName]="objectField.FieldName"
                                                [ObjectTableName]="ObjectTableName"
                                                [SelectedValue]="EntityPM[objectField.FieldName]"
                                                [DataContext]="EntityPM"
                                                [LookUpTableName]="objectField.ObjectTable_LookUpTableName"
                                                [HideColumns]="HideColumns"
                                                [HideLastColumn]="HideLastColumn"
                                                [FocusOnMe]="IsFocused(objectField)">
                                        </LogLov>
                                    </div>
                                    <div *ngIf="objectField.DataTypeCode == 'PickList'">
                                        <PickList [ObjectFieldName]="objectField.FieldName"
                                                  [ObjectTableName]="ObjectTableName"
                                                  [SelectedValue]="EntityPM[objectField.FieldName]"
                                                  [DataContext]="EntityPM"
                                                  [PlaceHolder]="EntityPM[objectField.FieldName]!=null?EntityPM[objectField.FieldName].Code:''"
                                                  [HideColumns]="HideColumns"
                                                  [HideLastColumn]="HideLastColumn"
                                                  [FocusOnMe]="IsFocused(objectField)">
                                        </PickList>
                                    </div>


                                </td>

                                <td *ngIf="objectField.MultiLine && !objectField.GeneratedComponentPath && !(objectField.DisplayOnly && IsDisplaySummarySection)" colspan="2" style="height: 100px;">
                                    <div style="height: 20px; line-height: 20px;">
                                        <LogLabel [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [DataContext]="EntityPM"></LogLabel>
                                    </div>

                                    <div *ngIf="objectField.DataTypeCode == 'Text' || objectField.DataTypeCode == 'nText'" style="height: 80px; padding-left: 10px;">
                                        <LogTextBox [ObjectFieldName]="objectField.FieldName" [ObjectTableName]="ObjectTableName" [Text]="EntityPM[objectField.FieldName]" [DataContext]="EntityPM" [IsNewEntityCall]="IsNewEntityCall" [IsMultiline]="true"
                                                    [HideColumns]="HideColumns"
                                                    [HideLastColumn]="HideLastColumn"
                                                    [FocusOnMe]="IsFocused(objectField)">

                                        </LogTextBox>
                                    </div>
                                </td>

                                <td *ngIf="objectField.GeneratedComponentPath != undefined && objectField.GeneratedComponentPath != null && !(objectField.DisplayOnly && IsDisplaySummarySection)">
                                    <div>
                                        <ObjectFieldComponent [ObjectField]="objectField"
                                                              [ObjectTableName]="ObjectTableName"
                                                              [DataContext]="EntityPM"
                                                              [IsNewEntityCall]="IsNewEntityCall">
                                        </ObjectFieldComponent>
                                    </div>
                                </td>

                                <td [ngStyle]="{'width': (ScreenColumns?.length>1) ? '20px' : '0px;'}">
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td></td>
                </tr>
                <tr *ngIf="screenSection.Type == 'Grid'" style="height:250px">
                    <td>
                        <GridScreenSectionComponent [ScreenSection]="screenSection" [ParentEntityPM]="EntityPM" [ParentObjectTableName]="ObjectTableName"></GridScreenSectionComponent>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div *ngIf="ShowNoFieldsText" style="vertical-align: top; font-size: 11px; font-family: Arial; font-style: italic; color: gray;">There are no fields to display.</div>
</div>
