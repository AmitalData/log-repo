<style type="text/css">   
    .ResponseProgressLayout {
        position: absolute;
        top: -5px;
        bottom: -5px;
        left: -5px;
        right: -5px;
        margin: auto;
        border-radius: 8px;
        background: -moz-linear-gradient(rgba(21, 61, 110, 0.4) 0%, rgba(21, 61, 110, 0.1) 50%, rgba(21, 61, 110, 0.4) 100%);
        background: -webkit-linear-gradient(rgba(21, 61, 110, 0.4) 0%, rgba(21, 61, 110, 0.1) 50%, rgba(21, 61, 110, 0.4) 100%);
        background: linear-gradient(rgba(21, 61, 110, 0.4) 0%, rgba(21, 61, 110, 0.1) 50%, rgba(21, 61, 110, 0.4) 100%);
    }

    .ResponseProgressWindow {
        width: 230px;
        height: 110px;
        position: absolute;
        left: 50%;
        bottom: 170px;
        transform: translateX(-50%);
    }

    .ResponseProgressWindowHeader {
        height: 25px;
        line-height: 25px;
        font-size: 13px;
        padding-left: 10px;
        border-radius: 8px 8px 0 0;
        -moz-border-radius: 8px 8px 0 0;
        -webkit-border-radius: 8px 8px 0 0;
        border: 1px solid #8F9192;
        border-bottom: 0px;
        background: linear-gradient(rgba(189, 191, 191, 1) 0%, rgba(143, 145, 146, 1) 100%);
    }

    .ResponseProgressWindowBody {
        height: 100%;
        width: 100%;
        position: relative;
        border-radius: 0 0 8px 8px;
        -moz-border-radius: 0 0 8px 8px;
        -webkit-border-radius: 0 0 8px 8px;
        border: 1px solid #DADADA;
        border-top: 0px;
        background: linear-gradient(rgba(255, 255, 255, 1) 0%, rgba(208, 208, 208, 0.5) 100%);
    }
</style>

<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;" *ngIf="Message">
        <td>
            <div class="OrangeInfo" style="margin: 5px;">
                <label class="Value">{{Message}}</label>
            </div>
        </td>
    </tr>

    <tr>
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:165px;">
                                    <button class="Button" (click)="DeleteClicked('B')">Delete Business Records</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:70px;">
                                    <button class="Button" (click)="ResetCountersClicked('B')">Reset Counters</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:400px;">
                                    Delete / reset counters for Shipments , Quotes , Invoices & Payments (AR & AP)
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:165px;">
                                    <button class="Button" (click)="DeleteClicked('T')">Delete Tickets</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:70px;">
                                    <button class="Button" (click)="ResetCountersClicked('T')">Reset Counters</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:400px;">
                                    This button will delete / reset counters for Tickets
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>

                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:165px;">
                                    <button class="Button" (click)="DeleteClicked('C')">Delete CRM</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:400px;">
                                    This button will delete Activities and Opportunities
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <table>
                            <tr>
                                <td style="width:10px;">
                                    <div></div>
                                </td>

                                <td style="width:165px;">
                                    <button class="Button" (click)="DeleteClicked('P')">Delete Shippers & Consignees</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:70px;">
                                    <button class="Button" (click)="ResetCountersClicked('P')">Reset Counters</button>
                                </td>

                                <td style="width:5px;">
                                    <div></div>
                                </td>

                                <td style="width:400px;">
                                    This button will delete / reset counters for customers , shippers and consignees
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Close -->
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>

                </tr>
            </table>
        </td>
    </tr>

</table>
