
<style>
    .Link:hover {
        cursor: pointer;
        color: #1C59FC;
    }

    .Link {
        cursor: pointer;
        font-size: 13px;
        color: #0094ff;
        height: 21px;
        white-space: nowrap;
    }
</style>

<div *ngIf="fieldName != 'Choose'" style="vertical-align:central;text-align:left">
    <a class="Link" style="font-size:13px;" (click)="AddField(rowData)">Add</a>
</div>

<div *ngIf="fieldName == 'Choose'" style="margin-top:8px;margin-left:11px">
    <div class="RadioButton">
        <input type="radio" [id]="rowData.Field" [value]="rowData.Field" (click)="ChooseField(rowData)" [checked]="rowData.IsChecked" name="Choose" />
        <label [attr.for]="rowData.Field"></label>
    </div>
</div>
