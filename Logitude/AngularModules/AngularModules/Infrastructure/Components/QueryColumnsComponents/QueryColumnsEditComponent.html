<style>
    .TitleBackGround {
        background: #F0F0F0; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#F0F0F0, #C5C7C7); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#F0F0F0, #C5C7C7); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#F0F0F0, #C5C7C7); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#F0F0F0, #C5C7C7); /* Standard syntax (must be last) */
    }

    .BodyBackground {
        background: #F2F8FF; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#F2F8FF, #E6EBF0); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#F2F8FF, #E6EBF0); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#F2F8FF, #E6EBF0); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#F2F8FF, #E6EBF0); /* Standard syntax (must be last) */
    }

    select {
        border: none !important;
    }

    .ListBoxItem {
        min-height: 25px;
        background-color: transparent;
    }

        .ListBoxItem:hover {
            background: #ffffff; /* For browsers that do not support gradients */
            background: -webkit-linear-gradient(#ffffff, #DDE8F5); /* For Safari 5.1 to 6.0 */
            background: -o-linear-gradient(#ffffff, #DDE8F5); /* For Opera 11.1 to 12.0 */
            background: -moz-linear-gradient(#ffffff, #DDE8F5); /* For Firefox 3.6 to 15 */
            background: linear-gradient(#ffffff, #E6EBF0); /* Standard syntax (must be last) */
        }

        .ListBoxItem:focus {
            background-color: red;
        }

        .ListBoxItem:active {
            background-color: green;
        }
        .ViewOnly {
        height: 28px;
        margin-right: 20px;
        margin-top: 2px;
        border: 1px solid orange;
        border-radius: 3px; 
        background-color: #FFFAB4;
    }

</style>
<table>
    <tr>
        <td>
            <div *ngIf="IsViewOnly" [style.float]="LayoutDirection=='rtl' ? 'right' : 'left'" class="ViewOnly">
                <div style="margin:3px 7px;font-weight:500">
                    You are not allowed to edit or remove the filters of this view. It was shared with view only mode.  <Hyperlink style="margin-left:5px;margin-right:5px;" (click)="IsViewOnly = false" [FontSize]="12" [Text]="'close'"></Hyperlink>

                </div>
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <table>
                <tr>
                    <td style="width: 45%;height:100%;">
                        <div style="height:100%;width:100%;border:solid 1px #BABABA;border-radius:5px">
                            <table>
                                <tr>
                                    <td style="height:25px;width:100%;">
                                        <div class="TitleBackGround" style="width:100%;height:100%;border-radius:5px 5px 0px 0px;">
                                            <div style="float:left;">
                                                <label style="margin:5px;vertical-align: middle;">{{'General.O.AvailableColumns' | TextCodeTranslationPipe}}</label>
                                            </div>
                                            <!--{{General.O<!--{{General.O.AvailableColumns | TextCodeTranslationPipe}}--> 
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="height:23px;width:100%">
                                        <div style="width:100%;height:100%;">
                                            <input type="text" [id]="SearchFieldsId" placeholder="{{'General.O.Search' | TextCodeTranslationPipe}}" (focus)="ClearPlaceHolder();" (blur)="FillPlaceHolder();" [(ngModel)]="SearchText" style="background-color:white;background: url(Images/Search.png) no-repeat scroll;background-position: right center;padding-right:30px;width:100%;height:100%;"><br>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <table class="BodyBackground">
                                            <tr>
                                                <td>
                                                    <!--<LogListBox [DataSource]="unSelectedList" [Height]="'494'" [Binding]="'ListTextCodeCode'" [event]="onUnSelectedDataLoadedEvent"  (SelectedItemChanged)="onFieldSelectedItemChanged($event)"></LogListBox>-->
                                                    <LogListBox [DataSource]="unSelectedList" [Sort]="true" [Height]="'394'" [DataSourceChanged]="onUnselectedDataSourceChangedEvent" [Binding]="'ListTextCodeCode'" [event]="onUnSelectedDataLoadedEvent" (SelectedItemChanged)="onFieldSelectedItemChanged($event)"></LogListBox>
                                                </td>
                                            </tr>
                                            <tr><td style="height:100%;"></td></tr>
                                        </table>
                                    </td>
                                </tr>

                            </table>

                        </div>
                    </td>
                    <td style="width: 10%; vertical-align: middle;">
                        <button (click)="btnAdd_Click()" class="Button" [disabled]="IsbtnAddEnabled || IsViewOnly" style="width:80px;margin: 7px;">
                            {{'General.B.Add' | TextCodeTranslationPipe}}
                            <img *ngIf="RTL == false" src="./Images/Icons/ArrowRight.png" style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                            <img *ngIf="RTL == true" src="./Images/Icons/ArrowLeft.png" style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                        </button>
                        <button (click)="btnRemove_Click()" class="Button" [disabled]="IsbtnRemoveEnabled || IsViewOnly" style="width:80px;margin: 7px;">
                            <img *ngIf="RTL == false" src="./Images/Icons/ArrowLeft.png" style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" />
                            <img *ngIf="RTL == true" src="./Images/Icons/ArrowRight.png" style="width:16px;height:16px;vertical-align:middle;margin-left:3px;" /> 
                            {{'General.B.Remove' | TextCodeTranslationPipe}} 
                        </button>
                    </td>
                    <td style="width: 45%;height:100%;">
                        <div style="height:100%;width:100%;border:solid 1px #BABABA;border-radius:5px">
                            <table>
                                <tr>
                                    <td style="height:25px;width:100%;">
                                        <div class="TitleBackGround" style="width:100%;height:100%;border-radius:5px 5px 0px 0px;">
                                            <div style="float:left;">
                                                <label style="margin:5px;vertical-align: middle;">{{'General.O.SelectedColumns' | TextCodeTranslationPipe}}</label>
                                                <!--{{General.O.AvailableColumns | TextCodeTranslationPipe}}-->
                                            </div>
                                            <div style="float:right;"> 
                                                <button (click)="btnUp_Click()" class="Button" [disabled]="IsbtnDownEnabled || IsViewOnly" style="width:26px;margin-right: 2px;margin-top:3px;float:right;">
                                                    <img src="./Images/Icons/ArrowUp.png" style="height:16px;vertical-align:middle;" />
                                                </button>
                                                <button (click)="btnDown_Click()" class="Button" [disabled]="IsbtnUpEnabled || IsViewOnly" style="width:26px;margin-top:3px;margin-right: 5px; float:right;">
                                                    <img src="./Images/Icons/ArrowDown.png" style="height:16px;vertical-align:middle;" />
                                                </button>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <table class="BodyBackground">
                                            <tr>
                                                <td>
                                                    <LogListBox [DataSource]="OrderedQueryColumnsList" [Height]="'394'" [Binding]="'ObjectFieldListLabelTextCodeCode'" [event]="onSelectedDataLoadedEvent" [DataSourceChanged]="onDataSourceChangedEvent" (SelectedItemChanged)="onSelectedItemChanged($event)"></LogListBox>
                                                </td>
                                            </tr>
                                            <tr><td style="height:100%;"></td></tr>
                                        </table>
                                    </td>
                                </tr>

                            </table>

                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 30px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveChanges()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
