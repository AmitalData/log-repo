
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="false"></ValidationSummary>
        </td>
    </tr>

    <tr style="height:10px;">
        <td></td>
    </tr>

    <!--Set Value-->
    <tr style="width:100%">
        <td>
            <table style="margin-top:-3px">
                <tr class="FormFieldRow">
                    <td style="width:100px;">Document Type:</td>
                    <td style="width:200px;">
                        <LogLov [NoObjectField]="'true'"
                                [ObjectFieldName]="'DocumentTypeId'"
                                [SelectedValue]="DocumentTypeId"
                                [ObjectTableName]="ObjectTableName"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'DocumentType'"
                                [DependencyFilter1Value]="ObjectTableId">
                        </LogLov>
                    </td>
                    <td><div></div></td>
                </tr>

                <tr class="FormFieldRow">
                    <td>Template:</td>
                    <td>
                        <ComboBox (SelectedItemChanged)="alertselected($event)"
                                  [ItemsSource]="DocumentTypeTemplateList"
                                  [SelectedItem]="SelectedDocumentTypeTemplate"
                                  [Binding]="'Name'"></ComboBox>
                    </td>
                    <td><div></div></td>
                </tr>

                <tr class="FormFieldRow">
                    <td>Copy:</td>
                    <td>
                    </td>
                    <td><div></div></td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height:10px;">
        <td></td>
    </tr>

    <tr style="height: 10px;" *ngIf="SelectedItemsCountText">
        <td>
            <table>
                <tr>
                    <td style="width:200px">
                        <div style="width: 228px;text-align:center;  height:22px;" class="DisbleBox">
                            <div style="margin-right:5px;margin-left:-2px;float:left;width:16px;">
                                <CheckBox [IsChecked]="IsAllRecordSelected" (Checked)="IsAllRecordSelectedChange($event,true)">
                                </CheckBox>
                            </div>
                            <div style="width:175px;margin-top:1px;">
                                {{SelectedItemsCountText}}
                            </div>
                        </div>
                    </td>
                    <td style="height: 10px;">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td style="height: 10px;">
            <div></div>
        </td>
    </tr>

    <tr>
        <td style="height: 100%">
            <div style="width:100%;height:100%;background-color: #EAEAEB;border: 1px solid #cccccc;">
                <table>
                    <tr>
                        <td>
                            <div style="height: Calc(100% - 1px);background-color:white;">
                                <logitude-grid GridWidth="100%" GridHeight="100%" [ObjectTable]="ObjectTable"
                                               [dataSource]="dataSource" [MenuHeaderchangeevent]="MenuHeaderchangeevent"
                                               (rowSelectedEvent)="onRowSelected($event)" [SelectedRow]="SelectedRow"
                                               [columns]="columns" [autoLoad]="true" [rows]="items"
                                               (AfterViewInitCompleted)="GridAfterViewInitCompleted($event)"
                                               (CountReady)="onCountReady($event)" [EnableRowHoverVisibility]="true"
                                               (AllRecordsReady)="AllRecordsReady($event)"
                                               [CheckboxProp]="'Id'" [SearchFieldchangeevent]="SearchFieldchangeevent">
                                </logitude-grid>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>

    <tr style="height:1px;">
        <td>
            <div style="height:30px;float:right;">

                <button *ngIf="!IsMultiEntityUpdatedSuccessfully" class="RedButton" (click)="PrintClick()"
                        style="width:80px;float: right;margin: 4px;">
                    Print
                </button>
                <button *ngIf="IsMultiEntityUpdatedSuccessfully" class="RedButton" (click)="NextClicked()"
                        style="width:80px;float: right;margin: 4px;">
                    Next
                </button>
                <button class="Button" (click)="CloseButtonClicked()"
                        style="width:80px;float: right;margin:4px;">
                    Close
                </button>
            </div>
        </td>
    </tr>
</table>

<BusyIndicator [Text]="BusyIndicatorText" [IsBusy]="ShowBusyIndicator"></BusyIndicator>
