<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table>

    <tr style="height:22px;" *ngIf="DocumentId && ItemsSource.length > 0">
        <td>
            <table>
                <tr>
                    <td><div></div></td>

                    <td style="width:80px;">
                        <button class="GreenButton" (click)="DownloadClicked()">View File</button>
                    </td>
                </tr>
            </table>

        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 25px;" *ngIf="ItemsSource.length > 0">
        <td>
            <div style="font-size:18px;color:#1B90CB;">
                Errors
            </div>
        </td>
    </tr>

    <tr style="vertical-align:middle" *ngIf="ItemsSource.length == 0">
        <td>
            <table>
                <tr>
                    <td>
                        <div style="text-align: center">
                            <div style="font-size:15px;"> All selected records were printed successfully.</div>

                            <button style="width:80px; display:inline-block" class="GreenButton" (click)="DownloadClicked()">View File</button>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr *ngIf="ItemsSource.length > 0">
        <td>
            <div class="SimpleGridView" style="height: Calc(100% - 1px);background-color:white;">
                <div class="SimpleGridViewHeader">
                    <table>
                        <tr class="SimpleGridHeaderRow">
                            <td style="padding-right: 5px; padding-left: 5px;width: 150px; max-width: 150px">#</td>
                            <td style="padding-right: 5px; padding-left: 5px;">Error</td>
                            <td></td>
                        </tr>
                    </table>
                </div>
                <div class="SimpleGridViewBody">
                    <table>
                        <tr class="SimpleGridViewRow bg" *ngFor="let item of ItemsSource;">
                            <td class="CellStretched" style="width: 150px; max-width: 150px;  overflow: hidden; text-overflow: ellipsis;" title="{{item.EntityNumber}}">
                                {{item.EntityNumber}}
                            </td>

                            <td class="CellStretched" title="{{item.Error}}">
                                {{item.Error}}
                            </td>
                            <td><div></div></td>

                        </tr>

                        <tr>
                            <td colspan="5">
                                <div></div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height:1px;">
        <td>
            <div style="height:30px;float:right;">
                <button class="Button" (click)="CloseButtonClicked()"
                        style="width:80px;float: right;margin:4px;">
                    Close
                </button>
            </div>
        </td>
    </tr>
</table>
