
<table class="PreventSelect backgroundImage" [style.background-image]="this.BackgroundImage">

				<tr style="height: 50px;">
					<td>
						<div></div>
					</td>
				</tr>

				<tr style="height: 114px;">
					<td style="text-align: center;">
						<a>
							<img [src]="MainLogo" id="loginlogo" style="width:290px; height:114px;float:left;" />

					</td>
				</tr>

				<tr style="height: 20px;">

							<tr>
								<td>

								</td>

								<td style="width: 980px;">

										<tr>
											<td>
												<div></div>
											</td>
										</tr>

										<tr style="height: 16px;">
											<td style="opacity: 0.7; background-image: url('./Images/LoginScreen/shadow1.png'); background-repeat: no-repeat;">
												<div></div>
											</td>
										</tr>

										<tr style="height: 260px; min-height: 260px; background: white;">
											<td>
												<table class="loginProcess" [style.background-image]="this.LoginProgressImage">

														</td>
													</tr>

													<tr>
														<td style="text-align: right">

										<tr style="height: 16px;">

										<tr>
											<td>

								<td>
									<div></div>

							</tr>
						</table>
