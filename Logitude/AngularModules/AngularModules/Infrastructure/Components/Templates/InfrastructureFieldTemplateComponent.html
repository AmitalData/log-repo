
<table *ngIf="Entity">
    <tr>
        <td>
            <div class="MediaFill">
                <div *ngIf="FieldName == 'TransportModeId'" class="MediaFillRelative">
                    <img class="CenterCenter" [attr.src]="'./Images/Icons/' + FieldValue + '.png'" [title]="Entity['TransportModeName']" />
                </div>

                <div *ngIf="ObjectTableName == 'TenantManagement' && FieldName == 'PrivateLabelId'" class="TemplateTrimming">
                    {{FieldValue}}
                </div>

                <div *ngIf="ObjectTableName == 'CommunicationLog' && (FieldName == 'CreateDate' || FieldName == 'CreateDateUTC')" class="TemplateTrimming">
                    {{FieldValue | DateTimePipe:'DTL12'}}
                </div>

                <div *ngIf="ObjectTableName == 'BIReport' && FieldName == 'LastRunDate'" class="TemplateTrimming">
                    {{FieldValue | DateTimePipe:'DT'}}
                </div>

                <div *ngIf="ObjectTableName == 'APILogs' && FieldName == 'Direction'">
                    <img *ngIf="FieldValue == 'O' || FieldValue == 'Out'" style="vertical-align:middle; margin: auto;margin-top:-2px" [attr.src]="'./Images/Icons/ArrowRight.png'" [title]="'Out'" />

                    <img *ngIf="FieldValue == 'I' || FieldValue == 'In' " style="vertical-align:middle; margin: auto;margin-top:-2px" [attr.src]="'./Images/Icons/ArrowLeft.png'" [title]="'In'" />
                </div>

                <div *ngIf="ObjectTableName == 'APILogs' && (FieldName == 'CreateDate' || FieldName == 'CreateDateUTC')">
                    {{FieldValue | DateTimePipe:'DTL12'}}
                </div>

                <div *ngIf="ObjectTableName == 'TenantManagement' && FieldName == 'Id'" style="text-align: left;">{{FieldValue}}</div>

                <div *ngIf="IsSpotLightTemplate == true" style="position:absolute;top:0;bottom:0;left:0;right:0;">
                    <div style="height:100%;width:100%;">

                    </div>
                </div>

                <!-- BatchTaskExecution -->
                <div *ngIf="ObjectTableName == 'BatchTaskExecution'">
                    <div *ngIf="FieldName == 'StatusName'">
                        <div [style.text-align]="isRTL ? 'right' : 'left'" [style.color]="GetStatusColor()">{{ FieldValue }}</div>
                    </div>
                    <div *ngIf="FieldName == 'ProgressPercentage'">
                        <div style="text-align: center;">{{FieldValue}}%</div>
                    </div>
                    <div *ngIf="FieldName == 'CreateDate'||FieldName == 'StartDateTime'||FieldName == 'DoneDateTime'">
                        <div [style.text-align]="isRTL ? 'right' : 'left'">{{FieldValue | DateTimePipe:'DT'}}</div>
                    </div>

                </div>

                <!-- FeatureToggle -->
                <div *ngIf="ObjectTableName == 'FeatureToggle'">
                    <div *ngIf="FieldName == 'TenantNumber'">
                        <div *ngIf="!Entity.IsMultiTenant">{{ FieldValue }}</div>
                        <div *ngIf="Entity.IsMultiTenant">{{ Entity.FromTenantNumber }} - {{Entity.ToTenantNumber}}</div>
                    </div>
                </div>

            </div>
        </td>
    </tr>
</table>
