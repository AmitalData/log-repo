<style>

</style>
<div>
    

    <div class="TextTrimming" *ngIf="fieldName == 'CreatedAt'">
        <span style="float: right"
            >{{_GeneralLockList.CreatedAt| DateTimeToDatePipe
            }}</span
        >
        <span style="float: right"
            >{{_GeneralLockList.CreatedAt| DateTimeToTimePipe
            :'L12' }}</span
        >
    </div>
    <div class="TextTrimming RightCenter" *ngIf="fieldName == 'Delete'">

        <IconButton [Name]="'delete'" [IsSmall] = "'true'"
            (click)="CancleGeneralLock(_GeneralLockList['GeneralKey'])" >
        </IconButton>                     
    </div>
</div>
