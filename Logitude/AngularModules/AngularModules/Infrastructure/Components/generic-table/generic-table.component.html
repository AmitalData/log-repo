<div [draggable] dragTarget=".p-dynamic-dialog" dragHandle='.p-dialog-header'></div>

<p-table [value]="data" [columns]="columns" #table [scrollable]='true' scrollHeight="369px"
    [globalFilterFields]='columnsNames' [rows]='rows' [resizableColumns]="true" [virtualScroll]="lazy"
    [virtualRowHeight]="34" [lazy]="lazy" (onLazyLoad)="loadLazy($event)" (onSort)='onSort($event)'>
    <ng-template pTemplate="colgroup">
        <colgroup>
            <col *ngFor='let col of columns'>
        </colgroup>
    </ng-template>
    <ng-template pTemplate="caption">
        <i class="pi pi-search" style="margin:4px 4px 0 0"></i>
        <input type="text" pInputText size="50" [placeholder]="placeholder"
            (input)="filterTable($any($event.target).value)" style="width:auto">
    </ng-template>
    <ng-template pTemplate="header" let-columns>
        <tr>
            <!-- <th>id</th> -->
            <th *ngFor='let col of columns' [pSortableColumn]="col.name" pResizableColumn>
                {{col.alias}}
                <p-sortIcon [field]="col.name"></p-sortIcon>
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row let-columns="columns" let-i='rowIndex'>
        <!-- [ngClass]='{"highlight-row":(i + 1)%2}' -->
        <tr style='height:34px' (click)='onSelectedRow(row)' >
            <!-- <td>{{i}}</td> -->
            <td *ngFor='let col of columns' [innerHTML]='row[col.name] | highlight: filterVal'></td>
        </tr>
    </ng-template>
    <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:34px">
            <td *ngFor="let col of columns">
                <div class="loading-text"></div>
            </td>
        </tr>
    </ng-template>
</p-table>
