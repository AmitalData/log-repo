<style>
    .Link {
        cursor: pointer;
        font-size: 13px;
        color: #0094ff;
        height: 21px;
        white-space: nowrap;
    }
    .Link:hover {
        cursor: pointer;
        color: #1C59FC;
    }
</style>

<div style="height:85px;width:100%;margin-top:5px;  vertical-align:top">
    <table style="border :none;vertical-align:top;">
        <tr style="height: 25px">
            <td>
                <table>
                    <tr style="height:20px;">
                        <td style="width:10px">
                            <div style="width:10px"></div>
                        </td>
                        <td style="width:120px;">
                            <p style="font-size:11px;color:#6E7172;width:100px">Document</p>
                        </td>
                        <td>
                            <a class="Link" style="font-size:13px;text-align:left" (click)="SelectDocumentTypes()">Document Selection</a>
                            <span style="margin-left:3px;font-style:italic;color:gray">({{CountDocumentSelection}})</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr style="height:5px">
            <td style="height:5px"> </td>
        </tr>
        <tr style="height: 25px">
            <td>
                <table>
                    <tr>
                        <td style="width:10px">
                            <div> </div>
                        </td>
                        <td style="width:120px">
                            <p style="font-size:11px;margin-top:1px;color:#6E7172"> Via</p>
                        </td>
                        <td style="width:200px">
                            <div style="text-align:left;width:200px;">
                                <ComboBox style="width:200px;" (SelectedItemChanged)="SendViaSelected = $event" [ItemsSource]="SendViaClassLists" [SelectedItem]="SendViaSelected" [Binding]="'Name'"> </ComboBox>
                            </div>
                        </td>
                        <td>
                            <div>
                                <table>
                                    <tr>
                                        <td style="width:20px">
                                            <div style="width:20px"> </div>
                                        </td>
                                        <td>
                                            <div>
                                                <table>
                                                    <tr>
                                                        <td style="width:70px">
                                                            <a *ngIf="SendViaSelected && SendViaSelected.Code == 'FTP'" [class.HyperlinkDisabled]="!IsCustomerCare" class="Link" style="font-size:13px;" (click)="ShowFTPDetails()"> FTP Details</a>
                                                        </td>
                                                        <td> </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
        <tr style="height:5px">
            <td style="height:5px"> </td>
        </tr>
        <tr style="height: 25px">
            <td>
                <table>
                    <tr>
                        <td style="width:10px">
                            <div> </div>
                        </td>
                        <td style="width:120px">
                            <p style="font-size:11px;margin-top:1px;color:#6E7172"> Computing Partner</p>
                        </td>
                        <td style="width:200px">
                            <div style="text-align:left;width:200px;">
                                <LogLov [ObjectTableName]="'OnUpdateDocument'" *ngIf="!IsRefreshComputingPartner" (SelectedItemChanged)="SelectedComputedPartnerChange($event)" style="width:200px" [SelectedValue]="ComputingPartnerId" [HideColumns]="true" [HideLastColumn]="true" [ObjectFieldName]="'ComputingPartnerId'" [SelectedValuePath]="'ComputingPartnerId'" [DataContext]="DataContext" [LookUpTableName]="'ComputingPartner'"> </LogLov>
                                <LogLov [ObjectTableName]="'OnUpdateDocument'" *ngIf="IsRefreshComputingPartner" (SelectedItemChanged)="SelectedComputedPartnerChange($event)" style="width:200px" [SelectedValue]="ComputingPartnerId" [HideColumns]="true" [HideLastColumn]="true" [ObjectFieldName]="'ComputingPartnerId'" [SelectedValuePath]="'ComputingPartnerId'" [DataContext]="DataContext" [LookUpTableName]="'ComputingPartner'"> </LogLov>
                            </div>
                        </td>
                        <td style="width:8px"> </td>
                        <td class="CellStretched" style="width:25px; min-width:25px; max-width:25px; position: relative;vertical-align:central">
                            <IconButton [IsEnabled]="IsCustomerCare" [Name]="'Add'" [IsSmall]="true" (click)="AddComputingPartner()"> </IconButton>
                        </td>
                        <td>
                            <div> </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
