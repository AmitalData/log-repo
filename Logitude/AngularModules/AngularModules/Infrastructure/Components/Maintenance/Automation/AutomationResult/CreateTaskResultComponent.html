 <style> 
	.Link:hover {
		cursor: pointer;
		color: #1C59FC;
	}

	.Link {
		cursor: pointer;
		font-size: 13px;
		color: #0094ff;
		height: 21px;
		white-space: nowrap;
	}
</style>
 
<div style="height:180px;width:100%;margin-top:5px;  vertical-align:top">
	<table style="border :none;vertical-align:top;">

		<tr style="height: 25px">

			<td>
				<table>
					<tr>
						<td style="width:10px">
							<div> </div>
						</td>

						<td style="width:120px">
							<p style="font-size:11px;margin-top:1px;color:#6E7172">Task Type</p>
						</td>

						<td style="width:200px">
							<div style="text-align:left;width:200px;">
								<LogTextBox [IsFreeText]="true" [ObjectFieldName]="'TaskType'" [Text]="TaskType" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>

							</div>
						</td>
						 

						<td>
							<div>
								<table>
									<tr>
										<td style="width:20px">
											<div style="width:20px"> </div>
										</td>

										<td>
											<div>
												<table>
													<tr>
														<td class="CellStretched" style="width:80px;vertical-align:central">
															<p style="font-size:12px;color:#6E7172">Due Date</p>
														</td>
														<td style="width:200px;">
															<ComboBox [ItemsSource]="DueDateFieldList" [SelectedItem]="SelectedDueDateField" (SelectedItemChanged)="SelectedItemChanged($event)" [Binding]="'Name'"></ComboBox>

														</td>
														<td>
															<div *ngIf="ShowSpecificDate" style="text-align:left;width:150px;margin-left: 8px;">
																<LogDatePicker [NoObjectField]="true" [HideColumns]="true" [ObjectFieldName]="'EndDate'" [DataContext]="DataContext"></LogDatePicker>
															</div>
															<div *ngIf="ShowCurrentDate" style="text-align:left;width:150px;margin-left: 8px;">
																<table>
																	<tr>
																		<td class="CellStretched" style="width:205px">
																			<table>
																				<tr class="FormFieldRow">

																					<td [style.width]="'97px'" class="CellStretched">
																						<div [style.width]="'60px'" style="margin-right: 5px;">
																							<ComboBox style="width:70px;" (SelectedItemChanged)="SelectedCurrentDateOperatorChange($event)" [SelectedItem]="SelectedCurrentDateOperator" [ItemsSource]="CurrentDateOperator" [Binding]="'Name'"></ComboBox>

																						</div>
																					</td>
																					<td style="width:5px">
																						<div style="width:5px">
																							<p style="font-size:12px;color:#6E7172;margin-right: 10px;">Days</p>
																						</div>
																					</td>
																					<td style="width:70px;">
																						<div style="height:22px;width:70px; margin-left: 30px;">

																							<LogTextBox (ValueChanged)="NumberOfDaysChanged($event)" [FocusOnMe]="'true'" [IsFreeText]="true" [InputType]="'integer'" [ObjectFieldName]="'NumberOfDays'" [NoObjectField]="true" [Text]="NumberOfDays" [DataContext]="DataContext" [HideColumns]="true"></LogTextBox>
																						</div>
																					</td>

																				</tr>
																			</table>

																		</td>
																		<td>
																			<div></div>
																		</td>
																	</tr>
																</table>
															</div>
														</td>
													</tr>
												</table>
											</div>
										</td>
									</tr>
								</table>
							</div>
						</td>
					</tr>
				</table>
			</td>

		</tr>

		<tr style="height:5px"> <td style="height:5px"> </td> </tr>
		<tr style="height: 25px">

			<td>
				<table>
					<tr>

						<td style="width:10px">
							<div> </div>
						</td>

						 
						<td style="width:120px">
							<p style="font-size:11px;margin-top:1px;color:#6E7172">Assignee</p>
						</td>

						<td style="text-align:left;width:240px;">
							<div style="text-align:left;width:270px;">
								<ComboBox style="width:270px;" (SelectedItemChanged)="AssigneeObjectFieldComboBoxChanged($event)" [ItemsSource]="ContactObjectFieldLists" [SelectedItem]="AssigneeObjectFieldSelected" [Binding]="'FullNameTextCodeDefaultText'"></ComboBox>
							</div>
						</td>
						<td style="width:20px">
							<div style="width:30px"></div>
						</td>

						<td *ngIf="automationCreateTask && automationCreateTask.AssigneeFieldType=='Specific'" style="text-align:left;width:168px;">
							<div class="FormFieldRow" style="text-align:left;width:200px;">

								<LogLov style="width:200px;margin-top:-3px"
										[ObjectFieldName]="'AssigneeValue'"
										[SelectedValue]="AssigneeValue"
										[DataContext]="DataContext"
										[HideColumns]="true"
										[HideLastColumn]="true"
										(SelectedItemChanged)="AssigneeValueChange($event)"
										[LookUpTableName]="'User'">
								</LogLov>
							</div>
						</td>


						<td>
							<div>
								<table>
									<tr>
										<td style="width:20px">
											<div style="width:20px"> </div>
										</td>
									</tr>
								</table>
							</div>
						</td>
					</tr>
				</table>
			</td>



		</tr>



		<tr style="height:5px"> <td style="height:5px"> </td> </tr>

		<tr style="height: 25px">

			<td>
				<table>
					<tr>
						<td style="width:10px">
							<div> </div>
						</td>
						<td style="width:120px">
							<p style="font-size:11px;margin-top:1px;color:#6E7172">Owner</p>
						</td>

						<td style="text-align:left;width:240px;">
							<div style="text-align:left;width:270px;">
								<ComboBox style="width:270px;" (SelectedItemChanged)="OwnerObjectFieldComboBoxChanged($event)" [ItemsSource]="ContactObjectFieldLists" [SelectedItem]="OwnerObjectFieldSelected" [Binding]="'FullNameTextCodeDefaultText'"></ComboBox>
							</div>
						</td>
						<td style="width:20px">
							<div style="width:30px"></div>
						</td>

						<td *ngIf="automationCreateTask && automationCreateTask.OwnerFieldType=='Specific'" style="text-align:left;width:168px;">
							<div class="FormFieldRow" style="text-align:left;width:200px;">

								<LogLov style="width:200px;margin-top:-3px"
										[ObjectFieldName]="'OwnerValue'"
										[SelectedValue]="OwnerValue"
										[DataContext]="DataContext"
										[HideColumns]="true"
										[HideLastColumn]="true"
										(SelectedItemChanged)="OwnerValueChange($event)"
										[LookUpTableName]="'User'">
								</LogLov>
							</div>
						</td>

						<td style="width:8px"> </td>

						<td>
							<div> </div>
						</td>
					</tr>
				</table>
			</td>


		</tr>
		<tr style="height:5px"> <td style="height:5px"> </td> </tr>

		<tr>
			<td>
			</td>
		</tr>
	</table>
	 
</div>
