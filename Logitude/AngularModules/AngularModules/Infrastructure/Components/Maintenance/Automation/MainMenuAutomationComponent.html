


<style type="text/css">
    .BoxItem:hover {
        background: #EAEEF5;
    }

    .BoxItem .Title {
        cursor: pointer;
        width: 1px;
        white-space: nowrap;
    }

   

    .BoxItem {
        float: left;
        width: 285px;
        height: 100px;
        border: 1px solid #DADADA;
        margin-left: 20px;
        margin-top: 5px;
        margin-bottom: 10px;
        -webkit-border-radius: 7px;
        -moz-border-radius: 7px;
        border-radius: 7px;
        -webkit-box-shadow: 0px 0px 4px 2px rgba(209,209,209,0.5);
        -moz-box-shadow: 0px 0px 4px 2px rgba(209,209,209,0.5);
        box-shadow: 0px 0px 4px 2px rgba(209,209,209,0.5);
    }
</style>



<table>
    <!--<tr style="height:10px"><td><div style="height:10px"></div></td></tr>-->
    <tr>
        <td class="CellStretch">
            <div class="CellContent">
                <div class="ScrollViewer">
                    <ul class="ScrollContent">

                        <li *ngFor="let item of AutomationEntityLists" class="BoxItem" >
                            <table>
                                <tr>
                                    <td style="width:100px;">
                                        <img class="CenterCenter"  src="./Images/Maintenance/Table.png" />
                                    </td>

                                    <td style="vertical-align: middle;">
                                        <table>
                                            <tr>
                                                <td><div></div></td>
                                            </tr>

                                            <tr style="height:30px;">
                                                <td style="vertical-align: central">
                                                    <div (click)="ItemClicked(item)" class="Title" style="font-size:16px; color: #1B90CB; text-decoration: underline;">{{item.Name}}</div>
                                                    <div *ngIf="item.Description"  class="Title" style="font-size:12px; color: #1B90CB;">{{item.Description}}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                               <td><div></div></td>
                                            </tr>
                                        </table>

                                    </td>

                                    <td style="width: 15px;">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </li>


                

                    </ul>
                </div>
            </div>
        </td>
    </tr>

    <tr><td><div></div></td></tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">  
                        <div>
                            <!-- <button class="RedButton" (click)="CloseButtonClicked()">Cancel</button>-->
                        </div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">Close</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
