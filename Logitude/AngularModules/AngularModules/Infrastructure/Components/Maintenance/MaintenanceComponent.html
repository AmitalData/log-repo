
<style type="text/css">
    .BoxItem:hover {
        background: #EAEEF5;
    }

    .BoxItem .Title {
        cursor: pointer;
        width: 1px;
        white-space: nowrap;
    }

    .BoxItem .Description {
        width: 100%;
        height: 70px;
        max-height: 70px;
        font-size: 12px;
        line-height: 18px;
        color: #595B5B;
        white-space: normal;
        word-wrap: break-word;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .BoxItem {
        float: left;
        width: calc(50% - 24px);
        height: 110px;
        border: 1px solid #DADADA;
        margin-top: 5px;
        margin-bottom: 10px;
        -webkit-border-radius: 7px;
        -moz-border-radius: 7px;
        border-radius: 7px;
        -webkit-box-shadow: 0px 0px 4px 2px rgba(209,209,209,0.5);
        -moz-box-shadow: 0px 0px 4px 2px rgba(209,209,209,0.5);
        box-shadow: 0px 0px 4px 2px rgba(209,209,209,0.5);
    }
</style>

<table>

    <tr style="height:1px;">
        <td>
            <table>
                <tr>
                    <td style="width: 250px;">
                        <SearchBox (TextChanged)="SearchTextChanged($event)"></SearchBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height:10px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height:1px;">
        <td>
            <ul class="PagesMenu">
                <li id="{{ item.Code | IdGeneratorPipe}}"  *ngFor="let item of PagesMenu" (click)="PageChanged(item)" [class.SelectedPageMenu]="item === SelectedMenu" 
                    [style.float]="LayoutDirection=='rtl' ? 'right' : 'left'"
                    [ngStyle]="LayoutDirection == 'rtl' ? {'margin-left': '10px','margin-right': '0px'} : {'margin-right': '10px','margin-left': '0px'}">{{item.Name}}</li>
            </ul>
        </td>
    </tr>

    <tr style="height:15px;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td class="CellStretch">
            <div class="CellContent">
                <div class="ScrollViewer">
                    <ul class="ScrollContent">
                        <li class="BoxItem" *ngFor="let item of ItemsSource" [style.float]="LayoutDirection=='rtl' ? 'right' : 'left'" [ngStyle]="LayoutDirection == 'rtl' ? {'margin-right': '20px'} : {'margin-left': '20px'}">
                            <table>
                                <tr>
                                    <td style="width:100px;">
                                        <img class="CenterCenter" [attr.src]="item.ImageIconSource" />
                                    </td>

                                    <td style="vertical-align: top;">
                                        <table>
                                            <tr style="height:30px;">
                                                <td style="vertical-align: bottom">
                                                    <div (click)="ItemClicked(item)" id="{{'MaintenanceItem'+item.Code | IdGeneratorPipe}}"  class="Title" style="font-size:16px; color: #1B90CB; text-decoration: underline;">{{item.TranslatedName}}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td style="height: 100%;">
                                                    <div class="Description">
                                                        {{item.DescriptionText}}
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>

                                    </td>

                                    <td style="width: 15px;">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>
                        </li>
                    </ul>
                </div>
            </div>
        </td>
    </tr>
</table>
