<style>
    .DisbleBox {
        display: inline-block;
        border: 1px solid #ffd800;
        border-radius: 5px;
        background: #faf5c0;
        padding: 2px 10px;
        margin: 5px;
        color: gray;
        font-family: sans-serif;
    }
</style>
<table>

    <tr style="height:10px;">
        <td>
            <div *ngIf="ItemsSource.length > 0" style="font-size:18px;color:#1B90CB;">
                Errors
            </div>
        </td>
    </tr>

    <tr style="height: 10px;">
        <td style="height: 10px;">
            <div></div>
        </td>
    </tr>
    <tr>
        <td style="height: 100%">
            <div style="width:100%;height:100%;background-color: #EAEAEB;">
                <table>
                    <tr *ngIf="ItemsSource.length == 0">
                        <td style="background-color:white">
                            <div style="font-size:15px;text-align:center;">
                                All {{ObjectTableName}}s were updated successfully.
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div *ngIf="ItemsSource.length > 0" class="SimpleGridView" style="height: Calc(100% - 1px);background-color:white;">
                                <div class="SimpleGridViewHeader">
                                    <table>
                                        <tr class="SimpleGridHeaderRow">
                                            <td style="padding-right: 5px; padding-left: 5px;width: 150px; max-width: 150px">{{ObjectTableName}} #</td>
                                            <td style="padding-right: 5px; padding-left: 5px;">Error</td>
                                            <td></td>
                                        </tr>
                                    </table>
                                </div>
                                <div class="SimpleGridViewBody">
                                    <table>
                                        <tr class="SimpleGridViewRow bg" *ngFor="let item of ItemsSource;" >
                                            <td class="CellStretched" style="width: 150px; max-width: 150px;  overflow: hidden; text-overflow: ellipsis;" title="{{item.EntityNumber}}">
                                                {{item.EntityNumber}}
                                            </td>

                                            <td class="CellStretched" title="{{item.Exception}}">
                                                {{item.Exception}}
                                            </td>
                                            <td><div></div></td>

                                        </tr>

                                        <tr>
                                            <td colspan="5">
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </td>
    </tr>
    <tr style="height:1px;">
        <td>
            <div style="height:30px;float:right;">
                <button class="Button" (click)="CloseButtonClicked()"
                        style="width:80px;float: right;margin:4px;">
                    Close
                </button>
            </div>
        </td>
    </tr>
</table>
