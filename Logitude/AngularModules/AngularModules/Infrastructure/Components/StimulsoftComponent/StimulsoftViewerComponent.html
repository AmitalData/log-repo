
<style>
    .container {
        position: relative;
        text-align: center;
        display: block;
        overflow-y: auto;
        overflow-x: hidden;
    }



    .topleft {
        position: absolute;
        top: 0px;
        left: 0px;
        font-size: 12px;
    }



    input[type="number"]:hover {
        -moz-appearance: none;
        -webkit-appearance: none;
    }

    input[type=number]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        -moz-appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
        display: block;
        width: 8px;
        color: #333;
        text-align: center;
        position: relative;
    }

        input[type=number]::-webkit-inner-spin-button:before,
        input[type=number]::-webkit-inner-spin-button:after {
            content: "^";
            position: absolute;
            right: 0;
            font-family: monospace;
        }

        input[type=number]::-webkit-inner-spin-button:before {
            top: 0px;
        }

        input[type=number]::-webkit-inner-spin-button:after {
            bottom: 0px;
            -webkit-transform: rotate(180deg);
        }
</style>
<div style="border :1px solid gray">

    <div [style.display]="Headervisibility" style="display:block;border-bottom:1px solid gray;height:30px;background-color:#D1D6D8">

        <table>
            <tr>

                <td [hidden]="IsSchedulerReport" style="width:16px"><div style="width:16px"></div></td>

                <td *ngIf="IsShowExportPrinttoPDF" style="width:68px;vertical-align:middle;">
                    <button [disabled]="!IsEditingEnabled" style="width:68px" class="Button" (click)="PrintToPDF()">
                        <table class="LeftCenter">
                            <tr>
                                <td style="width:5px">
                                    <div style="width:5px"></div>
                                </td>

                                <td style="width:20px">
                                    <img style="width:15px;height:12px;margin-top:-2px" src="./Images/BluePrint.png" />
                                </td>


                                <td style="width:30px">
                                    <span>Print</span>
                                </td>

                                <td>
                                    <div></div>
                                </td>



                            </tr>
                        </table>

                    </button>

                </td>

                <td style="width:7px"><div style="width:7px"></div></td>


                <td *ngIf="IsShowExportMicrosoftExcel" style="width:80px;vertical-align:middle;">
                    <div id="{{'SaveExcelToggleButton' | IdGeneratorPipe}}" style="width:80px;vertical-align:central;background-color:#D1D6D8" tabindex="0" class="ToggleButton">
                        <div sstyle="background-color:#D1D6D8">

                            <table class="LeftCenter">
                                <tr>
                                    <td style="width:5px">
                                        <div style="width:5px"></div>
                                    </td>

                                    <td style="width:20px">
                                        <img style="width:15px;height:12px" src="./Images/Buttons/Save.png" />
                                    </td>


                                    <td style="width:30px">
                                        <span>Save</span>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                    <td style="width:10px">


                                        <img style="margin-left:10px" src="./Images/ToggleIcon.png" />
                                        <div style="float:right;left:-65px;width:140px" class="ToggleButtonMenu">

                                            <button id="{{'SaveExcelFileButton' | IdGeneratorPipe}}" [disabled]="!IsEditingEnabled" (click)="SaveToExcelFile()">
                                                <div>Excel File</div>
                                            </button>


                                            <button id="{{'SaveAdvancedExcelFileButton' | IdGeneratorPipe}}" [disabled]="!IsEditingEnabled" (click)="SaveToExcelFileAdvancedButtonClick()">
                                                <div>Excel File (Advanced)</div>
                                            </button>


                                        </div>

                                    </td>
                                    <td style="width:5px">
                                        <div style="width:5px"></div>
                                    </td>
                                </tr>
                            </table>





                        </div>






                    </div>
                </td>

                <td *ngIf="IsShowSendButton" style="width:7px"><div style="width:7px"></div></td>



                <td *ngIf="IsShowSendButton" style="width:80px;vertical-align:middle;">
                    <div style="width:80px;vertical-align:central;background-color:#D1D6D8" tabindex="0" class="ToggleButton">
                        <div sstyle="background-color:#D1D6D8">

                            <table class="LeftCenter">
                                <tr>
                                    <td style="width:7px">
                                        <div style="width:7px"></div>
                                    </td>

                                    <td style="width:22px">
                                        <img style="width:22px;height:22px;margin-right:-3px" src="./Images/BlueSend.png" />

                                    </td>

                                    <td style="width:2px">
                                        <div style="width:2px"></div>
                                    </td>
                                    <td style="width:25px">
                                        <span>Send</span>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                    <td style="width:10px">


                                        <img style="margin-left:10px" src="./Images/ToggleIcon.png" />
                                        <div style="float:right;left:-65px;width:120px" class="ToggleButtonMenu">

                                            <button [disabled]="!IsEditingEnabled" (click)="SendButtonClick('Excel')">
                                                <div>Send as Excel File</div>
                                            </button>


                                            <button [disabled]="!IsEditingEnabled" (click)="SendButtonClick('Pdf')">
                                                <div>Send as Pdf File</div>
                                            </button>


                                        </div>

                                    </td>
                                    <td style="width:5px">
                                        <div style="width:5px"></div>
                                    </td>
                                </tr>
                            </table>





                        </div>






                    </div>
                </td>

                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink && !IsSchedulerReport" style="width:40px"><div style="width:40px"></div></td>

                <td style="width:150px;vertical-align:middle;">
                    <div style="width:150px;vertical-align:central;background-color:#D1D6D8" tabindex="0" class="ToggleButton">
                        <div sstyle="background-color:#D1D6D8">

                            <table class="LeftCenter">
                                <tr>
                                    <td style="width:5px">
                                        <div style="width:5px"></div>
                                    </td>

                                    <td style="width:30px">
                                        <span id="templateType">Stimulsoft Template</span>
                                    </td>

                                    <td>
                                        <div></div>
                                    </td>

                                    <td style="width:10px">


                                        <img style="margin-left:10px" src="./Images/ToggleIcon.png" />
                                        <div style="float:right;width:140px" class="ToggleButtonMenu">

                                            <button (click)="ReportTypeClick('R','Stimulsoft Template')">
                                                <div>Stimulsoft Template</div>
                                            </button>


                                            <button (click)="ReportTypeClick('E','Excel Template')">
                                                <div>Excel Template</div>
                                            </button>


                                        </div>

                                    </td>
                                    <td style="width:5px">
                                        <div style="width:5px"></div>
                                    </td>
                                </tr>
                            </table>





                        </div>






                    </div>
                </td>



                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink" style="width:7px"><div style="width:7px"></div></td>

                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink && !IsRefreshReportsTemplateList" style="width:190px"><ComboBox id="{{'ReportsTemplatesComboBox' | IdGeneratorPipe}}" style="width:190px;height:22px;display:inline" (SelectedItemChanged)="ReportTemplatesChange($event)" [ItemsSource]="ReportsTemplatesLists" [SelectedItem]="SelectedReportsTemplateList" [Binding]="'Description'"></ComboBox></td>
                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink && IsRefreshReportsTemplateList" style="width:190px"><ComboBox id="{{'ReportsTemplatesComboBox' | IdGeneratorPipe}}" style="width:190px;height:22px;display:inline" (SelectedItemChanged)="ReportTemplatesChange($event)" [ItemsSource]="ReportsTemplatesLists" [SelectedItem]="SelectedReportsTemplateList" [Binding]="'Description'"></ComboBox></td>

                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink" style="width:7px"><div style="width:7px"></div></td>


                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink" style="width:100px"><div style="width:100px"><span style="font-size:11px" class="hyperlink" (click)="ManagementReport()">Manage Templates</span></div></td>
                <td *ngIf="ShowReportsTemlatesLists && IsShowReportManageTemplateLink" style="width:7px"><div style="width:7px"></div></td>

                <td *ngIf="IsShowShiftToolbar">
                    <div>
                        <table>
                            <tr>
                                <td style="width:25px;cursor:pointer"> <button style="height:25px;width:25px;margin-left:-5px;background-color:#D1D6D8;margin-top:2px;cursor:pointer" (click)="ResetButtonClick()"> <img style="width:20px;height:20px;vertical-align:middle;cursor:pointer" src="./Images/Buttons/Refresh.png" /></button> </td>
                                <td style="width:40px;text-align:left"><span style="margin-left:-2px">Reset</span></td>
                                <td style="width:20px"><div style="width:20px"></div></td>
                                <td *ngIf="NumberofEditedfield>0" style="width:120px;"><span style="width:120px">Number of Edited field :</span></td>
                                <td style="text-align:left;width:50px" *ngIf="NumberofEditedfield>0">{{NumberofEditedfield}}</td>
                                <td><div></div></td>
                            </tr>
                        </table>

                    </div>

                </td>


                <td *ngIf="IsShowShiftToolbar">
                    <div style="width:440px;float: right;vertical-align:middle">

                        <table style="float: right;">
                            <tr>
                                <td style="width:25px">  <img style="margin-top:0px;width:25px;height:20px;vertical-align:middle;" src="./Images/Two_headed_arrow_Ver.png" /></td>

                                <td style="width:70px;"><span>Vertical Shift</span></td>
                                <td><input style="width:60px;height:22px;" type="number" step="1" [(ngModel)]="VerticalShift" /></td>
                                <td style="width:10px;"><span>mm</span></td>

                                <td style="width:10px;"><span></span></td>
                                <td style="width:25px">  <img style="margin-top:-2px;width:25px;height:25px;vertical-align:middle;" src="./Images/Two_headed_arrow_Hor.png" /></td>
                                <td style="width:5px;"><span></span></td>
                                <td style="width:70px;"><span>Horizontal Shift</span></td>
                                <td><input style="width:60px;height:22px;" type="number" step="1" [(ngModel)]="HorizontalShift" /></td>
                                <td style="width:10px;"><span>mm</span></td>
                                <td style="width:5px;"><span></span></td>
                                <td style="width:25px"> <button style="height:25px;width:25px;margin-left:-5px;background-color:#D1D6D8;margin-top:2px" (click)="ApplayShift(IsCloseEditWindow)"> <img style="width:20px;height:20px;vertical-align:middle;" src="./Images/Buttons/Refresh.png" /></button> </td>


                                <td><div></div></td>


                            </tr>
                        </table>


                    </div>
                </td>

                <td><div></div></td>


            </tr>

        </table>

    </div>

    <div [attr.id]="PreviewStimualDivId" style="text-align:center;background-color:#CBCFD4;" [style.width]="ScreenWidth" [style.height]="ScreenHeight" class="container">
        <img *ngIf="IsShowStimulImage" src={{ImageUrl}}  [style.margin-left]="ImageMargeLeft" style="position:relative;float: left;margin-top:15px;margin-bottom:15px;border:1px solid #FFD700;border-radius:5px" [style.display]="Imagevisibility" [style.min-width]="ImageWidth" [style.min-height]="ImageHeight" [style.width]="ImageWidth" [style.height]="ImageHeight">

        <div   *ngIf="!IsShowStimulImage" style="width:100%;height:100%;">
           <div style="height:47%"></div>
          <div  style="text-align:center;vertical-align:central;font-size:15px">The report is too large to preview. Please use Print/Save buttons to download it. </div>  
        </div>




        <div *ngIf="IsShowStimulImage" [style.margin-left]="ImageMargeLeft" [style.display]="Imagevisibility" style="margin-top:15px;margin-bottom:15px;" class="topleft" [attr.id]="ViewerContentDivId"></div>

        <div *ngIf="IsShowStimulImage" [style.display]="Imagevisibility" style="display:block;height:15px"></div>

    </div>

    <div [style.display]="Footervisibility" style="display:block;border-top:1px solid gray;height:30px;background-color:#D1D6D8;text-align:left;vertical-align:central">
        <table style="width:250px;vertical-align:central;height:30px;">
            <tr style="vertical-align:central">



                <td [attr.title]="'Go to the first page of a report '">

                    <div><button (click)="GoToFirstPage()" [disabled]="!GoToFirstPageButtonEnable" style="height:25px;width:100%;"> <img style="margin-top:0px;width:17px;height:15px;vertical-align:middle;" src="./Images/Icons/GoToFirstPageIcon.png" /></button></div>
                </td>

                <td [attr.title]="'Go to the Previous page of a report'" style="border-right:1px solid gray;">

                    <div><button (click)="PreviousPage()" [disabled]="!PreviouseButtonEnable" style="height:25px;width:100%;"> <img style="margin-top:-2px;width:13px;height:15px;vertical-align:middle;" src="./Images/Icons/Previous.png" /></button></div>
                </td>

                <td>
                    <div style="vertical-align:central"><p style="margin-top:5px;margin-left:30px;color:black">Page {{NumberOfPage}} of {{PagesCount}}</p></div>

                </td>


                <td [attr.title]="'Go to the next page of a report'" style="border-left:1px solid gray">
                    <div><button [disabled]="!NextButtonEnable" style="height:25px;width:100%;" (click)="NextPage()"> <img style="margin-top:-2px;width:13px;height:15px;vertical-align:middle;" src="./Images/Icons/Next.png" /></button></div>
                </td>

                <td [attr.title]="'Go to the last page of a report '" style="border-right:1px solid gray;">

                    <div><button [disabled]="!GoToLastPageButtonEnable" style="height:25px;width:100%;" (click)="GoToLastPage()"> <img style="margin-top:0px;width:17px;height:15px;vertical-align:middle;" src="./Images/Icons/GoToLastPageIcon.png" /></button></div>
                </td>

            </tr>
        </table>

    </div>

</div>
