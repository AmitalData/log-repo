<style>
    .Title {
        display: inline-block;
        font-size: 14px;
        color: #1b90cb;
        vertical-align: middle;
        margin: 7px;
    }
    /* Dropdown Button */
    .dropbtn {
        box-sizing: border-box;
        height: 22px;
        line-height: 22px;
        border: 1px solid #6a8299;
        border-radius: 3px;
        box-sizing: border-box;
        color: #45494a;
        cursor: pointer;
        display: block;
        font-size: 11px;
        height: 22px;
        outline: medium none;
        position: relative;
        text-align: center;
        text-shadow: 1px 1px white;
        width: 100%;
    }

        /* Dropdown button on hover & focus */
        .dropbtn:hover, .dropbtn:focus {
            background-color: #3e8e41;
        }

    /* The container <div> - needed to position the dropdown content */
    .dropdown {
        position: relative;
        display: inline-block;
        margin: 7px;
    }

    /* Dropdown Content (Hidden by Default) */
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        width: 500px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 2147483647;
        height: 246px;
    }

        /* Links inside the dropdown */
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

            /* Change color of dropdown links on hover */
            .dropdown-content a:hover {
                background-color: #f1f1f1;
            }

    .dropcontent {
    }

    /* Show the dropdown menu (use JS to add this class to the .dropdown-content container when the user clicks on the dropdown button) */
    .showDDButton {
        display: block;
        right: 0;
    }

    select {
        min-width: 125px;
        width: 150px;
        margin-right: 5px;
        height: 22px;
    }

    .FilterItem:hover .DeleteButton {
        display: block;
    }

    .DeleteButton {
        display: none;
    }

    .FilterItemDisabled {
        opacity: 0.5;
        pointer-events: none;
    }
    /*table:hover, table:active {
        background-image: url(../../../Images/Trash-can.png);
        background-repeat: no-repeat;
        background-position:left;
        padding-left:10px;
    }*/
    .Disabled {
        opacity: 0.5;
        pointer-events: none;
    }
  
</style>

                            <div *ngSwitchCase="'Decimal'" style="display: inline-flex;">
                                <ComboBox style="width:150px;margin-right:5px;" (SelectedItemChanged)="item.OperationValueChanged($event)" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'"></ComboBox>
                                <div style="width:150px;" [style.margin-right]="LayoutDirection=='rtl' ? '6px' : ''">
                                    <LogTextBox (ValueChanged)="item.onTextChange($event)" [InputType]="item.ObjectField.DataTypeCode" [LogitudeForm]="myForm" *ngIf="item.ObjectField != undefined" [ObjectFieldName]="'TextValue'" [DataContext]="item" [NoValidation]="true"></LogTextBox>
                                </div>
                            </div>
                            <div *ngSwitchCase="'PickList'" style="display: inline-flex;">
                                <ComboBox style="width:150px;margin-right:5px;" (SelectedItemChanged)="item.OperationValueChanged($event)" [ItemsSource]="item.Operators" [SelectedItem]="item.Operation" [Binding]="'Name'"></ComboBox>
                                <div style="width:150px;" [style.margin-right]="LayoutDirection=='rtl' ? '6px' : ''">
                                    <PickList [ObjectFieldName]="item.ObjectField.FieldName"
                                              [ObjectTableName]="ObjectTableName" [NoValidation]="true" [FromNewView]="true"
                                              [DataContext]="item"
                                              (SelectedItemChanged)="item.onTextChange($event ? $event.Id:'')"
                                              [PlaceHolder]="item[item.ObjectField.FieldName]!=null?item[item.ObjectField.FieldName].Code:''">
                                    </PickList>
                                </div>
                            </div>
                        </td>

                        <td style="width: 20px;">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
