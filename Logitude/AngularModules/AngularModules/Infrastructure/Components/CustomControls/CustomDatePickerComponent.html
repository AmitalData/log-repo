<style type="text/css">
    .ComboBox:focus ul {
        /*transition: height 0.35s ease;*/
    }

    .ComboBox:focus .ComboBoxDropdown {
        /*transition: visibility 0.35s ease, height 0.35s ease;*/
    }

    .ComboBox:hover, .ComboBox:focus {
        border: 1px solid #3BB3E2;
    }

    .Selected {
        background: rgba(232, 247, 255, 1);
        background: -moz-linear-gradient(50% 106.14% 90deg,rgba(133, 203, 237, 1) 0%,rgba(150, 211, 240, 1) 22.59%,rgba(196, 231, 248, 1) 67.37%,rgba(232, 247, 255, 1) 99.68%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: -webkit-gradient(linear,50% 106.14%,50% -10.13%,color-stop(0,rgba(133, 203, 237, 1) ),color-stop(0.2259,rgba(150, 211, 240, 1) ),color-stop(0.6737,rgba(196, 231, 248, 1) ),color-stop(0.9968,rgba(232, 247, 255, 1) ));
        background: -o-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 99.68%);
    }

    .ComboBoxItem:not(.Selected):hover {
        background: -moz-linear-gradient(50% 17.31% -90deg,rgba(255, 255, 255, 1) 0%,rgba(186, 206, 227, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: -webkit-gradient(linear,50% 17.31%,50% 105.85%,color-stop(0,rgba(255, 255, 255, 1) ),color-stop(1,rgba(186, 206, 227, 1) ));
        background: -o-linear-gradient(-90deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
        background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(186, 206, 227, 1) 100%);
    }

    .ComboBoxItem {
        height: 22px;
        min-height: 22px;
        width: 100%;
        border: 1px solid #AAAAAA;
        margin-top: 1px;
        text-align: left;
        padding-left: 5px;
        padding-right: 5px;
    }

    .ComboBoxDropdown ul {
        padding: 1px;
        width: 100%;
        height: 0;
        overflow: hidden;
    }

    .ComboBoxDropdown {
        background: white;
        border: 1px solid #AAAAAA;
        box-shadow: 0 4px 8px 0 #AAAAAA;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        border-top: none;
        height: 0;
        visibility: hidden;
        /*transition: visibility 0.15s, height 0.15s;*/
        z-index: 1;
        /*overflow: hidden;*/
    }

    .ComboBox {
        display: block;
        height: 22px;
        max-height: 22px;
        line-height: 22px;
        outline: none;
        width: 100%;
        background: white;
        border: 1px solid #AAAAAA;
        font-size: 11px;
        color: #45494A;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
    }

    .ComboBoxDisabled {
        display: block;
        height: 22px;
        max-height: 22px;
        line-height: 22px;
        outline: none;
        width: 100%;
        background: white;
        border: 1px solid #AAAAAA;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
        cursor: pointer;
        opacity: 0.5;
        pointer-events: none;
    }

    .NewView {
        text-decoration: underline;
        float: left;
        color: #0000EE;
        font-size: 11px;
    }

        .NewView:hover {
            text-decoration: underline;
            float: left;
            color: lightskyblue;
            font-size: 11px;
            cursor: pointer;
        }
</style>

<div class="ComboBox" [class.ComboBoxDisabled]="IsDisabled" [attr.id]="ControlId" style="width:250px;" (focus)="OnFocus()" (blur)="OnLostFocus()" (mouseover)="onMouseOver()" (mouseout)="onMouseOut()" tabindex="0">
    <table (mousedown)="mousedown()">
        <tr>
            <td style="width: 2px;">
                <div></div>
            </td>

            <td>
                <div class="FillParent">
                    <div style="text-align: center;" class="TextTrimming">{{Text}}</div>
                    <div style="text-align: center;" class="TextTrimming Label" *ngIf="!Text">{{WaterMark}}</div>
                </div>
            </td>

            <td style="width: 3px;">
                <div></div>
            </td>

            <td style="width: 10px;">
                <img class="LeftCenter" src="Images/ToggleIcon.png" />
            </td>
        </tr>
    </table> 
    <div class="ComboBoxDropdown" style="top:214px;border-top:solid 1px #aaaaaa" [attr.id]="DropdownId">
        <div class="ScrollViewer">
            <ul class="ScrollContent" [attr.id]="ListControlId">
                <li class="TextTrimming" style="border:none;height: 22px;margin-top: 1px;min-height: 22px;padding-left: 5px;padding-right: 5px;text-align: left;width: 100%;">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Greater Than</td>
                            <td style="float:left;cursor:default;">
                                <LogDatePicker id="AAA" (mousedown)="OnCalendarClick()" [LogitudeForm]="myForm" [ObjectFieldName]="'GreaterTextValue'" [SelectedDateValue]="GreaterTextValue" [DataContext]="DataContext"></LogDatePicker>
                            </td>
                        </tr>
                    </table>
                </li>
                <li class="TextTrimming" style="border:none;height: 22px;margin-top: 1px;min-height: 22px;padding-left: 5px;padding-right: 5px;text-align: left;width: 100%;">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Less Than</td>
                            <td style="float:left;cursor:default;">
                                <LogDatePicker id="BBB" (mousedown)="OnCalendarClick()" [LogitudeForm]="myForm" [ObjectFieldName]="'LesstextValue'" [SelectedDateValue]="LesstextValue" [DataContext]="DataContext"></LogDatePicker>
                            </td>
                        </tr>
                    </table>
                </li>
                <li class="ComboBoxItem TextTrimming" (click)="ItemClicked('Today')" style="border:none;" [class.Selected]="'Today' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Today</td>
                            <td style="float:left;cursor:default;">
                                <span tabindex="0" (mousedown)="ItemClicked('Today')">{{Today}}</span>
                            </td>
                        </tr>
                    </table>

                </li>
                <li class="ComboBoxItem TextTrimming" (click)="ItemClicked('Yesterday')" style="border:none;" [class.Selected]="'Yesterday' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Yesterday</td>
                            <td style="float:left;cursor:default;">
                                <span tabindex="0" (mousedown)="ItemClicked('Yesterday')">{{Yesterday}}</span>
                            </td>
                        </tr>
                    </table>
                </li>
                <li class="ComboBoxItem TextTrimming" (click)="ItemClicked('Last 7 Days')" style="border:none;" [class.Selected]="'Last 7 Days' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Last 7 Days</td>
                            <td style="float:left;cursor:default;">
                                <span tabindex="0" (mousedown)="ItemClicked('Last 7 Days')">{{LastSevenDays}}</span>
                            </td>
                        </tr>
                    </table>
                </li>
                <li class="ComboBoxItem TextTrimming" (click)="ItemClicked('Last 30 Days')" style="border:none;" [class.Selected]="'Last 30 Days' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Last 30 Days</td>
                            <td style="float:left;cursor:default;">
                                <span tabindex="0" (mousedown)="ItemClicked('Last 30 Days')">{{LastThirtyDays}}</span>
                            </td>
                        </tr>
                    </table>
                </li>
                <li class="ComboBoxItem TextTrimming" (click)="ItemClicked('Current Year')" style="border:none;" [class.Selected]="'Current Year' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Current Year</td>
                            <td style="float:left;cursor:default;">
                                <span tabindex="0" (mousedown)="ItemClicked('Current Year')">{{CurrentYear}}</span>
                            </td>
                        </tr>
                    </table>
                </li>
                <li class="ComboBoxItem TextTrimming" (click)="ItemClicked('Last Year')" style="border:none;" [class.Selected]="'Last Year' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">Last Year</td>
                            <td style="float:left;cursor:default;">
                                <span tabindex="0" (mousedown)="ItemClicked('Last Year')">{{LastYear}}</span>
                            </td>
                        </tr>
                    </table>
                </li>
                <li *ngIf="NoDateVisibile" class="ComboBoxItem TextTrimming" tabindex="0" (focus)="ItemClicked('No Date')" style="border:none;" [class.Selected]="'No Date' === SelectedItem">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:default;">No Date</td>
                            <td style="float:left;cursor:default;"></td>
                        </tr>
                    </table>
                </li>
                
                <li class="TextTrimming" style="border:none;height: 22px;margin-top: 1px;min-height: 22px;padding-left: 5px;padding-right: 5px;text-align: left;width: 100%;">
                    <table>
                        <tr>
                            <td style="width:90px;cursor:pointer;"><span tabindex="0" class="NewView" (mousedown)="ChooseDatesClicked()">Choose Dates</span></td>
                            <td style="float:left;cursor:default;"></td>
                        </tr>
                    </table>
                </li>
            </ul>
        </div>

    </div>
</div>
