<style type="text/css">
    .DatePicker {
        display: inline;
        position: relative;
    }

    .DatePicker:disabled {
        opacity: 0.5;
        pointer-events: none;
    }

    .DatePickerCalendar {
        background: white;
        box-shadow: 0 4px 8px 0 #AAAAAA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        border-top-left-radius: unset;
        -moz-border-radius-topleft: unset;
        -webkit-border-top-left-radius: unset;
        border-top: none;
        z-index: 10000000;
    }


    .DatePickerInputDiv {
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        width: 100%;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        display: block;
    }

    .CalendarButton {
        -moz-border-radius-topright: 3px;
        -moz-border-radius-bottomright: 3px;
        -moz-border-radius-topleft: unset;
        -moz-border-radius-bottomleft: unset;
        -webkit-border-top-right-radius: 3px;
        -webkit-border-bottom-right-radius: 3px;
        -webkit-border-bottom-left-radius: unset;
        -webkit-border-top-left-radius: unset;
        border-top-right-radius: 3px;
        border-bottom-right-radius: 3px;
        border-top-left-radius: unset;
        border-bottom-left-radius: unset;
        background-color: #f3f3f3;
        background-position: center center;
        background-repeat: no-repeat;
        background-image: url('Images/calender-icon-sm.png');
        width: 20px;
        height: 20px;
    }

    .CalendarButton:focus {
        outline: 0;
    }

    .CalendarButton:hover:not(:disabled) {
        background-position: center center;
        background-repeat: no-repeat;
        background-image: url('Images/calender-icon-sm.png');
    }

    .DatePickerInputDivDisabled {
        opacity: 0.5;
        pointer-events: none;
    }

    .DatePickerInputDivDisabledWithColor {
        pointer-events: none;
    }


    .ErrorPopUp {
        background-image: url('Images/ValidationTooltip.png');
        background-repeat: no-repeat;
        background-size: auto;
        position: absolute;
        height: 110px;
        width: auto;
        color: white;
        z-index: 100;
        word-break: break-all;
        word-wrap: break-word;
        overflow: hidden;
        white-space: normal;

    }

    .ErrorPopUpMessage {
        color: white;
        white-space: normal;
        word-break: break-word;
        word-wrap: break-word;
        font-size: 11px;
        width: 215px !important;
        height: 110px;
        margin: 10px 10px 10px 10px;
        padding: 2px 8px;
        overflow: hidden;
    }

    .Button {
        border: 1px solid #d1d1d1 !important;
        border-radius: 0px;
        border-top-right-radius: 3px !important;
        border-bottom-right-radius: 3px !important;
    }

    .FlipImgHoriz {
        -moz-transform: scaleX(-1);
        -o-transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
        transform: scaleX(-1);
        filter: FlipH;
        -ms-filter: "FlipH";
    }

    .DateTimePickerBox {
        direction: ltr;
        width: 100%;
        height: 101%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .DateTimePickerBoxHeader {
        height: 12px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear, 50% 0%, 50% 100%, color-stop(0, rgba(245, 245, 245, 1)), color-stop(0.5024, rgba(243, 243, 243, 1)), color-stop(0.6998, rgba(236, 236, 236, 1)), color-stop(0.8435, rgba(224, 224, 224, 1)), color-stop(0.9604, rgba(207, 207, 207, 1)), color-stop(1, rgba(199, 199, 199, 1)));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .DayCell {
        /*background: #f6f6f6;*/
        text-decoration: none;
        display: block;
        height: 21px;
        font-weight: normal;
        color: #454545;
        border-radius: 2px;
        font-size: 11px;
        text-align: center;
        line-height: 153%;
        padding: 3px;
        background-color: #F0F0F0;
    }

    .DayCell:hover:not(.Selected) {
        background: #ffe3b5;
        outline: 1px solid #f8b555;
    }

    .Selected {
        background: -moz-linear-gradient(50% 100% 90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: -webkit-gradient(linear, 50% 100%, 50% 0%, color-stop(0, rgba(28, 131, 185, 1)), color-stop(0.1369, rgba(32, 133, 187, 1)), color-stop(0.2814, rgba(45, 141, 191, 1)), color-stop(0.4294, rgba(66, 153, 198, 1)), color-stop(0.5799, rgba(96, 170, 209, 1)), color-stop(0.7322, rgba(134, 192, 222, 1)), color-stop(0.884, rgba(180, 219, 239, 1)), color-stop(1, rgba(220, 242, 253, 1)));
        background: -o-linear-gradient(90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: linear-gradient(0deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        color: white;
        border-radius: 2px;

    }

    /* today */
    .today:not(.Selected) {
        border: 1px solid rgba(96, 170, 209, 1);
        background-color: rgb(245, 251, 255);
    }

    .Calendar {
        width: 185px;
        /*border: 1px solid #A7A9AC;*/
        border-radius: 5px;
        box-shadow: 2.5px 2.5px #D1D1D1;
    }

    .CalendarWeek {
        color: #1B90CB;
        line-height: 25px;
        position: relative;
        height: 21px;
        max-height: 21px;
        display: flex;
        font-size: 12px;
        margin-left: 6px;
    }

    .WeekDayCell {
        width: 25px;
        font-size: 11px;
    }

    .WeekRow {
        line-height: 25px;
        position: relative;
        height: 23px;
        max-height: 23px;
        display: flex;
        margin-left: 3px;
        width: 180px;
    }

    .DayCellDev {
        width: 25px;
        text-align: center;
    }


    .CalendarHeader {
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
        text-align: center;
    }

    .CalendarHeader button {
        font-size: 12px;
        font-weight: normal;
        cursor: pointer;
        background-size: 14px 14px;
        width: 18px;
        height: 14px;
        background-position: center center;
        background-repeat: no-repeat;

    }

    .CalendarHeader button:focus {
        outline: 0;
    }

    .calender-header-text {
        text-decoration: none;
        color: #454545;
        font-size: 12px;
        font-weight: 700;
    }

    .calender-header-text-Click {
        text-decoration: none;
        color: #454545;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
    }

    .calender-header-text-Click:hover {
        background: -moz-linear-gradient(50% 100% 90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: -webkit-gradient(linear, 50% 100%, 50% 0%, color-stop(0, rgba(28, 131, 185, 1)), color-stop(0.1369, rgba(32, 133, 187, 1)), color-stop(0.2814, rgba(45, 141, 191, 1)), color-stop(0.4294, rgba(66, 153, 198, 1)), color-stop(0.5799, rgba(96, 170, 209, 1)), color-stop(0.7322, rgba(134, 192, 222, 1)), color-stop(0.884, rgba(180, 219, 239, 1)), color-stop(1, rgba(220, 242, 253, 1)));
        background: -o-linear-gradient(90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: linear-gradient(0deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        color: white;
        border-radius: 2px;
        cursor: pointer;
    }

    .CalendarHeader>div:first-child {
        float: left;
        display: block;
        width: 20px;
        height: 20px;
        padding-top: 3px;

    }

    .CalendarHeader>div:first-child>button {

        /* Icon */
        background-image: url('Images/Arrow-left.png');
        background-size: 8px 8px;
        background-position: center;
        background-color: transparent !important;
    }

    .CalendarHeader>div:nth-child(2) {
        float: left;
        display: block;
        width: 142px;
        text-align: center;
        height: 20px;
        line-height: 1;
        padding-top: 4px;
    }

    .CalendarHeader>div:last-child {
        float: right;
        display: block;
        width: 20px;
        height: 20px;
        padding-top: 3px;

    }

    .CalendarHeader>div:last-child>button {
        /* Icon */
        background-color: transparent !important;
        background-image: url('Images/Arrow-right.png');
        background-size: 8px 8px;
        background-position: center;
    }

    .CalendarHeader .calender-header-left-button {
        background-image: url('Images/Arrow-left.png');
        background-size: 8px 8px;
        background-position: center;
        background-color: transparent !important;
        background-color: none !important;
    }

    .CalendarHeader .calender-header-right-button {
        background-color: transparent !important;
        background-image: url('Images/Arrow-right.png');
        background-size: 8px 8px;
        background-position: center;
    }

    .db-grid-container {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-gap: 3px;
        margin: 2px;
    }
    .db-grid-container-quarter {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-gap: 3px;
        margin: 2px;
    }
</style>

<div class="DatePicker">
    <div id="focus-div" tabindex="999999"></div>
    <table style="table-layout: fixed;">
        <tr>
            <td>
                <div class="DatePickerInputDiv" style="border: 1px solid #3BB3E2;">
                    <!-- Input -->
                    <div style="height: 100%;width: calc(100% - 24px);" float-start>
                        <input  [id]="DatePickerInputId"
                            style="background: transparent;padding-top: 2px;box-shadow:none;border:1px solid transparent; border-radius:3px; text-indent:5px;height:18px;min-height:18px;max-height:20px;opacity:1 !important;line-height: 1.0;display: block;"
                            [(ngModel)]="DateText" class="DatePickerInput" autocomplete="off" ondrop="return false"
                            disabled="true" />
                    </div>
                    <!-- Toggle Button -->
                    <div style="height: 100%;width: 20px;" [style.float]="isRTL ? 'left' : 'right'">
                        <button  tabindex="-1"
                            class="Button CalendarButton RightCenter CustomButton" (click)="ToggleCalendar()"></button>
                    </div>

                    <div FixedPosition [VertDisplacement]="22" [HorizDisplacement]="2" [PopupWidth]="184"
                        [ComponentHight]="183" *ngIf="IsDateDropDownOpen" tabindex="-1" class="DatePickerCalendar"
                        [ElementId]="DropDownId" [RelativeElementId]="DatePickerInputId" [id]="DropDownId"
                        [ComponentType]="'datepicker'">

                        <div class="Calendar">
                            <div class="DateTimePickerBox">

                                <!-- Header -->
                                <div class="CalendarHeader DateTimePickerBoxHeader" style="height: 20px;">

                                    <div>
                                        <button tabindex="-1" (click)="Previous()" class="CustomButton"></button>
                                    </div>

                                    <div tabindex="-1" class="calender-header-text"
                                        [ngClass]="{'calender-header-text-Click': PickerType == 'Year'}"
                                        (click)="Selectyear()">
                                        {{model.selectedYearText}}
                                    </div>

                                    <div>
                                        <button tabindex="-1" (click)="Next()" class="CustomButton"></button>
                                    </div>
                                </div>

                                <!-- Calendar -->
                                <div *ngIf="!HideCalendar">
                                    <div class="db-grid-container">
                                        <div *ngFor="let month of model.months; let i = index">
                                            <a class="DayCell" [class.Selected]="isSelectedMonth(i)" href="#"
                                                (click)="SelectMonth(i)">
                                                {{month}}
                                            </a>
                                        </div>
                                    </div>

                                    <!-- This Month Button -->
                                    <div style="height: 35px; width: 100%; position: relative;">
                                        <div
                                            style="height: 1px; background: #7BA4E0; position: absolute; top: 3px; left: 15px; right: 15px;">
                                        </div>

                                        <div class="CenterCenter" style="height: 22px; width: 65px; padding-top: 2px;">
                                            <button class="Button" (click)="ThisMonthButtonClicked()">This
                                                Month</button>
                                        </div>
                                    </div>
                                </div>


                                <!-- Quarters -->
                                <div *ngIf="IsQuarterCalendar">
                                    <div class="db-grid-container-quarter">
                                        <div *ngFor="let item of Quarters; let i = index">
                                            <a class="DayCell" [class.Selected]="SelectedQuarter == item" href="#"
                                                (click)="SelectQuarter(item)">
                                                {{item}}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </td>

        </tr>
    </table>
</div>
