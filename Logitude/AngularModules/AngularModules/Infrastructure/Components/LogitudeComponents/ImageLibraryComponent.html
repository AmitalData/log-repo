<style>
    .gallery {
        display: grid;
        grid-column-gap: 5px;
        grid-row-gap: 5px;
        grid-template-columns: auto auto auto;
        margin: 10px;
        overflow-y: auto;
        overflow-x: hidden;
        height: calc(100% - 6px);
        padding: 5px;
    }

    .gallery img {
        max-width: 100%;
        height: 140px;
        width: 100%;
        border-radius: 5px;
        transition: all 1.5s ease;
        background-color: #EDEDED;
    }

    .gallery .content {
        padding: 2px;
    }

    .gallery-item {
        border-radius: 5px;
        margin: 5px;
        max-height: 140px;
        max-width: 225px;
    }

    .gallery .gallery-item {
        transition: grid-row-start 300ms linear;
        transition: transform 300ms ease;
        transition: all 0.5s ease;
        cursor: pointer;
        background-color: #EDEDED;
    }

    .gallery .gallery-item:hover {
        transform: scale(1.025);
    }
</style>

<table>
    <tr style="height:100%;vertical-align:top">
        <td>
            <table>
                <tr style="height:20px">
                    <td>
                        <table>
                            <tr>
                                <td><span>
                                        <SearchTextBox style="float: right;margin-top:0px;margin-right:0px;width: 100%;margin-bottom: 5px;"
                                            [ObjectTableName]="'ImageLibrary'" [PlaceHolder]="'Search'"
                                            (SearchTextChangeEvent)="onSearchTextChangeEvent($event)"
                                            [SearchText]="SearchText">
                                        </SearchTextBox>
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="MediaFill">
                            <div class="TabControl">
                                <div class="TabControlHead">
                                    <ul style="margin-left: 2px;">
                                        <li [class.Selected]="SelectedTabCode == 'CT'"
                                            (click)="SelectedTabChange('CT')" style="margin-left:2px;">
                                            <div [attr.data-cy]="'My Images'"
                                                style="width:100px;text-align:left;font-size:11px;color:black"
                                                class="InnerChild">
                                                <span>My Images</span>
                                            </div>
                                        </li>

                                        <li [class.Selected]="SelectedTabCode == 'ZT'"
                                            (click)="SelectedTabChange('ZT')">
                                            <div [attr.data-cy]="'System Images'"
                                                style="width:100px;text-align:left;font-size:11px;color:black"
                                                class="InnerChild"
                                                *ngIf="IsNotTenantZero()">
                                                <span>System Images</span>
                                            </div>
                                        </li>

                                    </ul>
                                </div>

                                <div class="TabControlBody">
                                    <div class="gallery">
                                        <div *ngFor="let image of FilteredImages;" class="gallery-item"
                                            (click)="OnImageClick(image)">
                                            <div class="content"><img [src]="image.URL"></div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
