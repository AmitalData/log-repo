<style>
    .gallery {
        display: grid;
        grid-column-gap: 5px;
        grid-row-gap: 5px;
        grid-template-columns: auto auto auto;
        margin: 10px;
        overflow-y: auto;
        overflow-x: hidden;
        height: calc(100% - 6px);
    }

    .gallery img {
        max-width: 100%;
        height: 140px;
        width: 100%;
        border-radius: 5px;
        transition: all 1.5s ease;
        background-color: #EDEDED;
    }

    .gallery .content {
        padding: 2px;
    }

    .gallery-item{
        border-radius: 5px;
        margin: 5px;
    }

    .gallery .gallery-item {
        transition: grid-row-start 300ms linear;
        transition: transform 300ms ease;
        transition: all 0.5s ease;
        cursor: pointer;
        background-color: #EDEDED;
    }

    .gallery .gallery-item:hover {
        transform: scale(1.025);
    }
</style>

<div class="gallery">
    <div *ngFor="let image of Images;" class="gallery-item" (click)="OnImageClick(image.URL)">
        <div class="content"><img [src]="image.URL"></div>
    </div>
</div>
