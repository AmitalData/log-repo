<div class="LocationDirective" LocationDirective Code="SREQ" style="height:calc(100% - 6px);">
    <div style="overflow-y:auto;overflow-x:hidden;" class="BodyBackground MediaFill">

        <div *ngFor="let url of Imageurls; let i = index" style="padding:5px;float:left;width:170px;">
            <a (click)="OnImageClick(url)" style="cursor:pointer;margin:5px;padding:5px;">
                <img [src]="url" class="rounded mb-3" width="150" height="150">
            </a>

        </div>

    </div>
</div>
