
<style type="text/css">

        .TitleBackGround {
        background: #F0F0F0; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#F0F0F0, #C5C7C7); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#F0F0F0, #C5C7C7); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#F0F0F0, #C5C7C7); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#F0F0F0, #C5C7C7); /* Standard syntax (must be last) */

    .SimpleGridView .SimpleGridViewHeaderDark2 td:not(.LastChild):hover {
    background: #cecece;
    background: -moz-linear-gradient(top,  #cecece 0%, #efefef 6%, #ededed 75%, #cecece 100%);
    background: -webkit-linear-gradient(top,  #cecece 0%,#efefef 6%,#ededed 75%,#cecece 100%);
    background: linear-gradient(to bottom,  #cecece 0%,#efefef 6%,#ededed 75%,#cecece 100%);
    filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#cecece', endColorstr='#cecece',GradientType=0 );
    filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#efefef', endColorstr='#dbdbdb',GradientType=0 );
    color: #58595B;
}

.SimpleGridView .SimpleGridViewHeaderDark2 td:not(:last-child) {
    border-right: 1px solid #D1D3D4;
}

.SimpleGridView .SimpleGridViewHeaderDark2 td {
    color: white;
    font-size: 11px;
    padding-left: 4px;
}

.SimpleGridView .SimpleGridViewHeaderDark2 {
    height: 27px;
    min-width: 100%;
    position: absolute;
    border: 1px solid #DADADA;
    border-radius: 3px 3px 0 0;
    -moz-border-radius: 3px 3px 0 0;
    -webkit-border-radius: 3px 3px 0 0;
    background: -moz-linear-gradient(50% 100% 90deg,rgba(112, 112, 112, 1) 0%,rgba(168, 168, 168, 1) 100%);
    background: -webkit-linear-gradient(90deg, rgba(112, 112, 112, 1) 0%, rgba(168, 168, 168, 1) 100%);
    background: -webkit-gradient(linear,50% 100%,50% 0%,color-stop(0,rgba(112, 112, 112, 1) ),color-stop(1,rgba(168, 168, 168, 1) ));
    background: -o-linear-gradient(90deg, rgba(112, 112, 112, 1) 0%, rgba(168, 168, 168, 1) 100%);
    background: linear-gradient(0deg, rgba(112, 112, 112, 1) 0%, rgba(168, 168, 168, 1) 100%);
}
