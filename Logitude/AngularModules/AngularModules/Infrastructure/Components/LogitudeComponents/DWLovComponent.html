

<style>
    .OverflowSpan {
        -ms-text-overflow: ellipsis;
        -o-text-overflow: ellipsis;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .AllDataHeader {
        /*width: calc(100% - 5px);*/
        overflow: hidden;
        border: 1px solid #DFE0E0;
        /*margin-left: 3px;*/
        text-indent: 3px;
        background: #e1e2e2;
        background: -moz-linear-gradient(top,  #e1e2e2 0%, #e1e2e2 42%, #d8d8d8 78%, #bfbfbf 100%);
        background: -webkit-linear-gradient(top,  #e1e2e2 0%,#e1e2e2 42%,#d8d8d8 78%,#bfbfbf 100%);
        background: linear-gradient(to bottom,  #e1e2e2 0%,#e1e2e2 42%,#d8d8d8 78%,#bfbfbf 100%);
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#e1e2e2', endColorstr='#bfbfbf',GradientType=0 );

    }

    .disabled{
        cursor: default !important;
        -webkit-filter: grayscale(100%);
        filter: grayscale(50%);
        opacity: 0.5;
    }


    .LogLOVControl {
        display: block;
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        line-height: 22px;
        width: 100%;
        position: relative;
    }

    .LogLovContainer {
        height: 100%;
        width: 100%;
        background: white;
        font-size: 11px;
        color: #45494A;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
    }



    .DropDownInput {
        position: relative;
        z-index: 101010;
        margin: 0;
        padding: 3px 4px;
        white-space: nowrap;
    }

    .LogLovGridHeader {
        background: #bbbdbd;
        background: -moz-linear-gradient(top,  #bbbdbd 0%, #8f9192 100%);
        background: -webkit-linear-gradient(top,  #bbbdbd 0%,#8f9192 100%);
        background: linear-gradient(to bottom,  #bbbdbd 0%,#8f9192 100%);
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#bbbdbd', endColorstr='#8f9192',GradientType=0 );
        color: white;
        height: 22px;
        font-size: 10px;
        width: calc(100% - 1px);
        overflow: hidden;
        position: relative;
        /*display: inline-block;*/
        /*border-radius:2px;*/
    }

    .DropDownList {
        color: #444;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        /*max-height: 210px;*/
        background: white;
        -webkit-overflow-scrolling: touch;
        height: 205px;
    }

    .LogLovInputDiv:hover:not(:disabled), .LogLovInputDiv:focus:not(:disabled) {
        border: 1px solid #3BB3E2;
    }

    .LogLovDropdown {
        background: white;
        border: 1px solid #AAAAAA;
        box-shadow: 0 4px 8px 0 #AAAAAA;
        border-radius: 4px;
        -moz-border-radius: 4px;
        -webkit-border-radius: 4px;
        border-top-left-radius: unset;
        -moz-border-radius-topleft: unset;
        -webkit-border-top-left-radius: unset;
        border-top: none;
        height: 224px;
        /*visibility: hidden;*/
        z-index: 10000000;
    }

    .DropDownListItem:not(.liItemSelected):hover {
        outline: 1px solid #8ebff5;
        background: #ffffff; /* Old browsers */
        background: -moz-linear-gradient(top,  #ffffff 0%, #c6ebff 100%) !important; /* FF3.6-15 */
        background: -webkit-linear-gradient(top,  #ffffff 0%,#c6ebff 100%) !important; /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom,  #ffffff 0%,#c6ebff 100%) !important; /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffffff', endColorstr='#c6ebff',GradientType=0 ) !important; /* IE6-9 */
    }

    .DropDownListItem {
        display: list-item;
        cursor: pointer;
        /*line-height: 17px;*/
            height: 20px;
        word-wrap: break-word;
        -webkit-touch-callout: none;
        border-bottom: 1px solid #d7d7d7;
        vertical-align: middle;
    }
    .DropDownListItem:not(.liItemSelected):not(.highlighted):nth-child(even):not(.InActive){
       background:#ecf1f3;
    }

    .liItemSelected {
        background: #c5dce8; /* Old browsers */
        background: -moz-linear-gradient(top,  #c5dce8 0%, #e2f5ff 14%, #91d6f2 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top,  #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom,  #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#c5dce8', endColorstr='#91d6f2',GradientType=0 ); /* IE6-9 */
    }

    li.highlighted {
        background: #c5dce8; /* Old browsers */
        background: -moz-linear-gradient(top,  #c5dce8 0%, #e2f5ff 14%, #91d6f2 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top,  #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom,  #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#c5dce8', endColorstr='#91d6f2',GradientType=0 ); /* IE6-9 */
    }

    .DeleteButton {
        visibility: hidden;
        cursor: pointer;
        margin: 3px 0px;
    }

    .LogLovInputDiv:hover:not(:disabled) .DeleteButton {
        visibility: visible;
    }

    .LogLovInputDiv:disabled {
        opacity: 0.5;
        pointer-events: none;
    }
    .DisabledItem {
        opacity: 0.5;
        pointer-events: none;
    }
    .LogLovInputDiv {
        height: 100%;
        width: 100%;
        line-height: 22px;
        width: 100%;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        text-decoration: none;
        vertical-align: middle;
    }

     .ErrorPopUp {
        background-image: url('Images/ValidationTooltip.png');
        background-repeat: no-repeat;
        background-size: 180px 100px;
        position: absolute;
        height: 91px;
        width: 180px;
        color: white;
        z-index: 100;
        word-break: break-all;
        word-wrap: break-word;
        overflow: hidden;
        white-space: normal;
    }

    .ErrorPopUpMessage {
        color: white;
        white-space: normal;
        word-break: break-word;
        word-wrap: break-word;
        font-size: 11px;
        width: 165px;
        height: 110px;
        margin: 10px 10px 10px 10px;
        overflow: hidden;
    }

    .LogLOVFooter{
        text-align: right;
        padding: 1px 13px;
        height: 28px;
        border-top: 1px solid #cdcdcd;
        border-bottom-left-radius: 3px;
        border-bottom-right-radius: 3px;
        position: absolute;
        background: white;
        bottom: 0;
        right: 0;
        left: 0;
    }
    .LovColHeaderCell{
        height:100%; 
        width:120px; 
        overflow:hidden; 
        text-overflow:ellipsis; 
        white-space:nowrap; 
        position: relative;
        display: inline-block; 
        border-right: 1px solid #8f8f8f; 
        border-left: 1px solid #bcbcbc;
        text-indent: 4px;
        font-size: 11px;
        cursor: default;

    }
    .LovColHeaderCell:hover {
        background: #cecece;
        background: -moz-linear-gradient(top,  #cecece 0%, #efefef 6%, #ededed 75%, #cecece 100%);
        background: -webkit-linear-gradient(top,  #cecece 0%,#efefef 6%,#ededed 75%,#cecece 100%);
        background: linear-gradient(to bottom,  #cecece 0%,#efefef 6%,#ededed 75%,#cecece 100%);
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#cecece', endColorstr='#cecece',GradientType=0 );
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#efefef', endColorstr='#dbdbdb',GradientType=0 );
        color: #58595B;
    }
    .NoResult{
        font-style: italic;
        color: #AAA;
        text-align: center;
        font-family: Calibri, 'Trebuchet MS', sans-serif;
        display: flex;
        align-items: center;
        height: 100%;
        justify-content: center;

    }
    .LoadingDiv{
        display: flex;
        align-items: center;
    }
    .InActive{
        background: #fbbcbc;
    }

    .spinner-AllData {
      margin: 40px auto 0 !important;
    }
    .spinner-AllData > div {
        width: 12px !important;
        height: 12px !important;
    }
    .spinner {
      margin: 100px auto 0;
      width: 70px;
      text-align: center;
      height: 100%;
    }

        .spinner > div {
            height: 100%;
            width: 14px;
            height: 14px;
            background-color: #83b7dd;

            border-radius: 100%;
            display: inline-block;
            -webkit-animation: sk-bouncedelay 1.4s infinite ease-in-out both;
            animation: sk-bouncedelay 1.4s infinite ease-in-out both;
        }

        .spinner .bounce1 {
          -webkit-animation-delay: -0.32s;
          animation-delay: -0.32s;
        }

        .spinner .bounce2 {
          -webkit-animation-delay: -0.16s;
          animation-delay: -0.16s;
        }

    @-webkit-keyframes sk-bouncedelay {
      0%, 80%, 100% { -webkit-transform: scale(0) }
      40% { -webkit-transform: scale(1.0) }
    }

    @keyframes sk-bouncedelay {
      0%, 80%, 100% { 
        -webkit-transform: scale(0);
        transform: scale(0);
      } 40% { 
        -webkit-transform: scale(1.0);
        transform: scale(1.0);
      }
    }

    .show{
        display: block !important;
    }
    .MaintenanceButton{
        cursor: pointer;
        width: 15px;
        height: 15px;
    }
        .MaintenanceButton .btn{
            display: inline-block;
            width: 15px;
            background: url('./Images/LOV/tool.png') no-repeat center;
        }
        .MaintenanceButton .btn:hover{
            background: url('./Images/LOV/tool-hover.png') no-repeat center;
        }
        .MaintenanceButton > .popup img {
            margin-right: 5px;
        }
        .MaintenanceButton .popup-arrow{
            background: url('./Images/LOV/popup-arrow.png') no-repeat center;
            height: 10px;
            display: block;
            position: absolute;
            width: 12px;
            top: -9px;
            right: 9px;
        }
        .MaintenanceButton > .popup{
            /*display: none;*/
            transition: 1s all;
            /*position: absolute;
            top: 26px;
            right: 1px;*/
            z-index: 999999999;
            width: 85px;
            padding: 2px;

            border-radius: 2px;
            border: 1px solid #e8e8e8;
            background: #f2f2f2;
            background: -moz-linear-gradient(top,  #f2f2f2 0%, #ffffff 100%);
            background: -webkit-linear-gradient(top,  #f2f2f2 0%,#ffffff 100%);
            background: linear-gradient(to bottom,  #f2f2f2 0%,#ffffff 100%);
            filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#f2f2f2', endColorstr='#ffffff',GradientType=0 );
            -webkit-box-shadow: 1px 2px 3px 0px rgba(0,0,0,0.42);
            -moz-box-shadow: 1px 2px 3px 0px rgba(0,0,0,0.42);
            box-shadow: 1px 2px 3px 0px rgba(0,0,0,0.42);

        }
            .MaintenanceButton .popup li{
                font-size: 11px;
                padding: 0px 4px;
            }
            .MaintenanceButton .popup li:hover{
                background: #ffe9bb;
                outline: 1px solid #ffb145;
            }

            .MaintenanceButton .popup .disabled{
                cursor: default !important;
                -webkit-filter: grayscale(100%);
                filter: grayscale(27%);
                opacity: 0.5;
            }
            .MaintenanceButton .popup .disabled:hover{
                outline: none !important;
                background: none !important;
            }

    .PartnersTypeMenu {
        padding: 2px;
        position: absolute;
        top: 23px;
        left:43px;
        right: 0;
        z-index: 1;
        overflow:hidden;
        width:100px;
        min-width: 100px;
        background: white;
        border: 1px solid #BABABA;
        -webkit-box-shadow: 2px 2px 5px 0px rgba(50, 50, 50, 0.5);

        box-shadow: 2px 2px 5px 0px rgba(50, 50, 50, 0.5);
        cursor: default;
    }
   .PartnersTypeMenu button:hover:not(:disabled) {
    background: rgba(255, 239, 43, 0.2);
    border: 1px solid #FFC92B;
}
   .PartnersTypeMenu button {
    display: block;
    height: 23px;
    line-height: 23px;
    text-align: left;
    /*width: 100%;*/
    width:auto;

    background: white;

    padding-right: 3px;
}
   .truncate {
  width: 150px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
      
      
    .FlipImgHoriz{
        -moz-transform: scaleX(-1);
        -o-transform: scaleX(-1);

    .english{
        text-align: left !important;

</style>
