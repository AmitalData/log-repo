
<style>
    .active {
        background: #cfcbcb;
        color: rgb(103, 103, 103);
    }

    .OverflowSpan {
        -ms-text-overflow: ellipsis;
        -o-text-overflow: ellipsis;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .resizer {
        width: 5px;
        cursor: w-resize;
        height: 100%;
        /*float: left;*/
        float: right;
        position: relative;
        right: 0;
        display: inline-block;
    }

    .sorting-img {
        position: absolute;
        top: 2px;
        right: 50%;
        height: 10px;
        width: 10px;
    }

    .svg-triangle {
        margin: 0 auto;
        width: 6px;
        height: 5px;
    }

        .svg-triangle polygon {
            fill: gray;
            /*stroke: white;
          stroke-width:2;*/
        }

    .Selected {
        background: #DFECF7;
        border-left: 3px solid #81A8C7;
    }

    .SelectedArchive {
        background: #EAEAEB;
    }

    .Selected:hover {
        background: #DFECF7;
        border-left: 3px solid #81A8C7;
    }

    .SelectedGradiant {
        background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%) !important;
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%) !important;
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%) !important;
    }

        .SelectedGradiant:hover {
            background: -moz-linear-gradient(50% 119.23% 90deg,rgba(133, 203, 237, 1) 0%,rgba(232, 247, 255, 1) 100%) !important;
            background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%) !important;
            background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(232, 247, 255, 1) 100%) !important;
        }

    .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Chrome/Safari/Opera */
        -khtml-user-select: none; /* Konqueror */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently
                                      not supported by any browser */
    }

    .outer-container {
        /*background-color: #ccc;*/
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }

    .inner-container {
        height: 100%;
        overflow: hidden;
    }

    .RowWidth {
        height: 100%;
        overflow: hidden;
    }

    .ToolTip {
        border: 1px solid #85CBED;
        border-radius: 3px;
        background: rgba(221, 232, 245, 1);
    }

    .tooltip {
        /*position: relative;
        display: inline-block;
        border-bottom: 1px dotted black;*/
    }

        .tooltip .tooltiptext {
            visibility: hidden;
            background-color: #C8C8FA;
            color: #000;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 5;
            top: 125%;
            right: 20px;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 1s;
        }

            .tooltip .tooltiptext::before {
                content: "";
                position: absolute;
                bottom: 100%;
                left: 95%;
                margin-left: -5px;
                border-width: 5px;
                border-style: solid;
                border-color: transparent transparent #C8C8FA transparent;
            }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

    .Disabled {
        opacity: 0.5;
        pointer-events: none;
    }

    .SortEnabled {
        color: rgb(103, 103, 103);
        background: #cfcbcb;
    }

    .DisabledCell {
        opacity: 0.5;
        pointer-events: none;
    }
</style>
<div id="{{'ListDataLoaded' | IdGeneratorAsyncPipe | async}}" *ngIf="IsDataLoaded" ></div>
<div class="outer-container">
    <div [id]="LogGridId" [style.direction]="RTL == true ? 'rtl' : 'ltr'" class="GeneratedGrid  inner-container" (mousemove)="OnMyMouseMove($event)">
        <!--(mouseup)="OnMyMouseUp($event)"-->
        <div class="GeneratedGridHeader" [id]="LogGridColumnsId" style="position:relative;" *ngIf="columns" [ngStyle]="headerStyle">
            <div *ngIf="HasPermition == true">
                <div class="ag-header-cell" (mousedown)="OnDragMouseDown($event,ColumnId + 'resizable-column-,'+i)"
                     *ngFor="let col of columns; let i = index" [attr.ColId]="col.FieldName" [attr.LogGridId]="LogGridId"
                     [id]="ColumnId + 'resizable-column-,' + i" [class.SortEnabled]="sortingCol === col.FieldName"
                     [ngStyle]="col.Styles"
                     style="position: absolute;display: inline-block;min-width:25px;">

                    <div style="width: calc(100% - 5px);" [style.float]="RTL == true ? 'right' : 'left'" (mousedown)="ServerSort(col, ColumnId + 'resizable-column-,'+i)">
                        <list-header-template *ngIf="col.ColumnHeaderTemplateName" [htmlListHeaderUrl]="col.ColumnHeaderTemplateUrl" [colDef]="col"></list-header-template>

                        <div [style.lineHeight.px]="IsCustomTemplate == true ? 23 : 27" [style.textAlign]="RTL == true ? 'right' : 'left'" style="overflow:hidden; text-overflow: ellipsis;" *ngIf="!col.ColumnHeaderTemplateName" [title]="col.Display">{{col.Display}}</div>

                        <!--<span class="sorting-img" *ngIf="sortingDir === 'Descending' && sortingCol === col.FieldName">-->
                        <!--<img src="./Images/ToggleIcon.png" alt="Descending" />-->
                        <svg class="svg-triangle sorting-img" *ngIf="sortingDir === 'Descending' && sortingCol === col.FieldName">
                            <polygon points="0,0 6,0 3,5" />
                        </svg>
                        <!--</span>-->
                        <!--<span class="sorting-img" *ngIf="sortingDir === 'Ascending' && sortingCol === col.FieldName">-->
                        <!--<img src="./Images/ToggleIcon.png" alt="Ascending" style="transform: rotate(180deg);" />-->
                        <svg class="svg-triangle sorting-img" style="transform: rotate(180deg);" *ngIf="sortingDir === 'Ascending' && sortingCol === col.FieldName">
                            <polygon points="0,0 6,0 3,5" />
                        </svg>
                        <!--</span>-->
                    </div>
                    <!--<div class="resizer" (mousedown)="resizeColumn($event, 'resizable-column-'+i)" (mouseup)="resizeColumn2($event, 'resizable-column-'+i)"></div>-->
                    <div class="resizer" (mousedown)="OnMyMouseDown($event,ColumnId + 'resizable-column-,'+i)"></div>
                </div>
                <div [id]="ColumnId + 'Mask'" style="height:25px;width:0px;cursor:move;text-overflow:ellipsis;" class="Mask">
                </div>
            </div>


            <!--<div id="last-column-header" class="ag-header-cell" style="width: 100%; height: 35px; display: inline-block; background-color: darkgray; text-align: center; margin-left: -4px;">

            </div>-->

        </div>
        <div [id]="LogGridRowsId" class="GeneratedGridBody" (scroll)="onScroll()" style="position:absolute;top:27px;overflow:auto;min-height: 50px;">
            <div *ngIf="rowCount > 0 &&  HasPermition == true" [ngStyle]="canvasHeight" [id]="LogGridId + LogGridRowsId" style="position: absolute;top: 0;bottom: 0;left: 0;right: 0;">
                <div *ngFor="let row of rows; let rowIndex = index">
                    <div class="Row ag-row tooltip" [style.height.px]="rowHeight" [class.HLine]="row.rowData.ShowLineOverRow == true"
                         [style.background]="(ChangeColorByPropName && ChangeColorByPropValue && row.rowData[ChangeColorByPropName] == ChangeColorByPropValue) ? RowBackGroundColor : ((SelectedRow == row.rowData)? '#DFECF7':'transparent')"
                         [attr.SIndex]="row.rowIndex" [class.Selected]="SelectedRow == row.rowData"
                         (ondblclick)="onRowSelected(1, 1, row.rowData, row.rowIndex)"
                         (mouseout)="onRowMouseOut('rowtemplate'+rowIndex,rowIndex,row)" (mouseover)="onRowMouseOver('rowtemplate'+rowIndex,rowIndex,row)"
                         (click)="onRowSelected(1, 1, row.rowData, row.rowIndex)" [class.SelectedGradiant]="IsGradiantSelectedColor && (SelectedRow==row.rowData || row.rowData.IsSelected == true)"
                         [ngStyle]="row.styles" [id]="LogGridId +'row'+rowIndex" style="position:absolute;display: flex;width:100%; border-bottom: 1px solid #A7A9AC; border-top: 1px solid transparent;">
                        <div *ngIf="IsSpotLight" class="row-cell" (click)="onSpotLightSelect(row)"
                             style="display: block;position: absolute;min-width:25px;width:25px"
                             [id]="'row'+rowIndex+'pluscol'">
                            <img [src]="row.DetailsIcon" />
                        </div>
                        <!--<div *ngIf="SelectedRow == row.rowData && ShowArrow == true" class="row-cell"
                             style="display: block;position: absolute;min-width:25px;width:25px">
                            <img src="./Images/ShipmentArrow.png" style="position: absolute;left: 0;top: 4px;" />
                        </div>-->
                        <div class="row-cell"
                             style="display: block;position: absolute;min-width:25px;"
                             *ngFor="let col of columns; let colIndex = index" [class.DisabledCell]="Disabled"
                             [ngStyle]="col.Styles"
                             [id]="'row'+rowIndex+'col'+colIndex">

                            <div class="OverflowSpan" (click)="PreventCheckBoxSelect($event,col)" [id]="'span-row'+rowIndex+'col'+colIndex" [ngStyle]="col.Styles" style="height: 100%; text-align: left; text-indent: 10px;min-width:25px;">
                                <CheckBox class="CenterCenter" [class.Disabled]="IsCheckBoxEnabled == false" *ngIf="col.IsCheckBox == true" style="margin-left:10px;float:right;" (click)="$event.stopPropagation();"
                                          [IsChecked]="row.rowData.IsChecked == true" (Checked)="OnCheckBoxChecked(row.rowData,$event,row.rowIndex)"></CheckBox>
                                <ObjectFieldTemplate *ngIf="!col.IsCustomTemplate" [ObjectTable]="ObjectTable" [ObjectField]="col.ObjectField" [Entity]="row.rowData"  [RowIndex]="row.rowIndex" [IsListColumnCellTemplate]="true"></ObjectFieldTemplate>
                                <div [id]="LogGridId + colIndex + 'rowtemplate'+rowIndex" [style.visibility]="col.EnableHoverVisibility ? 'hidden' : 'visible'">
                                    <list-template *ngIf="col.IsCustomTemplate" style="text-indent: 10px; overflow: hidden; text-overflow: ellipsis;"
                                                   [rowData]="row.rowData"
                                                   [SearchTerm]="searchFields"
                                                   [AdditionalData]="{rowIndex:row.rowIndex,gridId:LogGridId,RowOutEvent:RowOutEvent,RowOverEvent:RowOverEvent}"
                                                   [PassAdditionalData]="PassAdditionalDataToTemplates"
                                                   [fieldName]="col.FieldName"
                                                   [htmlListComponentName]="col.HtmlListComponentName"
                                                   [htmlListComponentUrl]="col.HtmlListComponentUrl"
                                                   [AdditionalDataCustom]="col.AdditionalDataCustom">
                                    </list-template>
                                </div>
                            </div>
                        </div>

                        <div class="row-cell" style="line-height: 35px; height: 35px; max-height: 35px; display: block; ">

                        </div>
                        <div *ngIf="EnableRowToolTip" class="tooltiptext" [style.width.px]="ToolTipWidth" [style.minHeight.px]="ToolTipHeight" style="word-wrap:break-word;word-break:keep-all;white-space:normal;">
                            <div [style.textAlign]="RTL == true ? 'right' : 'left'" style="padding:5px;white-space: pre-wrap;word-wrap:break-word;">{{row.rowData[ToolTipBinding]}}</div>
                        </div>
                    </div>
                    <div *ngIf="row.ShowDetails && IsSpotLight" [id]="'DetailsDiv' + row.rowIndex" [style.height.px]="SpotLightHeight" style="position:absolute;display: flex;width:100%;" [ngStyle]="row.Detailsstyles">
                        <ObjectFieldTemplate [ObjectTable]="ObjectTable" [RowIndex]="row.rowIndex" [Entity]="row.rowData" [IsSpotLightTemplate]="IsSpotLight" [SpotlightDataTemplate]="SpotlightDataTemplate" style="width:100%;"></ObjectFieldTemplate>
                    </div>


                </div>
            </div>
            <div *ngIf="rowCount == 0 || HasPermition == false" style="width:100%;top:10px;position: relative;">
                <label *ngIf="rowCount == 0 &&  HasPermition == true && !NoDataTextCode" style="text-align:center;font-size:18px;color:gray" class="CenterCenter">
                    {{'General.O.NoDataFound' | TextCodeTranslationPipe}}
                </label>
                <label *ngIf="rowCount == 0 &&  HasPermition == true && NoDataTextCode" style="text-align:center;font-size:18px;color:gray" class="CenterCenter">
                    {{NoDataTextCode | TextCodeTranslationPipe}}
                </label>
                <label *ngIf="HasPermition == false" style="text-align:center;font-size:18px;color:gray" class="CenterCenter">
                    {{'General.O.PckgNotIncluded' | TextCodeTranslationPipe}}
                </label>
            </div>
        </div>

    </div>
</div>
