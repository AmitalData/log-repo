
<style type="text/css">
    .ErrorPopUp {
        background-image: url(Images/ValidationTooltip.png);
        background-repeat: no-repeat;
        background-size: 250px 100px;
        position: absolute;
        height: 110px;
        width: 250px;
        color: white;
        z-index: 100;
        word-break: break-all;
        word-wrap: break-word;
        overflow: hidden;
        white-space: normal;
        padding: 8px;
    }

    .ErrorPopUpMessage {
        color: white !important;
        white-space: normal !important;
        word-break: break-word !important;
        word-wrap: break-word !important;
        font-size: 11px !important;
        width: 215px !important;
        height: 110px !important;
        margin: 10px 10px 10px 10px !important;
        overflow: hidden !important;
    }

    .InputDiv input:disabled {
        opacity: 1;
    }

    .InputDiv {
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        /*line-height: 21px;*/
        width: 100%;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        /*text-indent: 5px;*/
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
    }

        .InputDiv:hover {
            border: 1px solid #3BB3E2;
        }

    .InputDivNoBorder {
        height: 20px;
        min-height: 20px;
        max-height: 20px;
        width: 100%;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        box-sizing: border-box;
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
    }

    .InputDivDisabled {
        opacity: 0.5;
        /*pointer-events: none;*/
    }

    .TextAreaDisabled {
        /*background:#e2e2e2 !important;*/
        opacity: 0.5;
    }

    .ArialFont {
        font-family: Arial;
    }

    .FlipImgHoriz {
        -moz-transform: scaleX(-1);
        -o-transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
        transform: scaleX(-1);
        filter: FlipH;
        -ms-filter: "FlipH";
        /*transform: rotate(180deg);*/
    }

    .AlignRight {
        text-align: right;
        padding-right: 6px;
    }

    .collapse-btn {
        background-image: url('./Images/Icons/collapse.png') !important;
    }

    .expand-btn {
        position: absolute;
        top: 2px;
        width: 20px;
        height: 20px;
        cursor: pointer;
        background-color: #fff;
        background-image: url('./Images/Icons/expand.png');
        background-position: center;
        background-repeat: no-repeat;
        background-size: 12px;
    }

        .expand-btn:hover {
            background-color: #dceeff;
        }

        .expand-btn:active {
            background-color: #cfe0f0;
            top: 1px;
            right: 1px;
        }
</style>


<!-- [disabled]="IsDisabled" -->

<div style="height:100%;width:100%">
    <div [id]="ErrorPopUpId"
         FixedPosition
         [ElementId]="ErrorPopUpId"
         [RelativeElementId]="InputId"
         [TopDisplacement]="-95"
         [LeftDisplacement]="30"
         [ComponentType]="'popup'"
         [PopupWidth]="250"
         [class.FlipImgHoriz]="LayoutDirection == 'rtl'"
         class="ErrorPopUp"
         *ngIf="ShowErrorPopup"
         style="min-width: 250px !important;">

        <div class="ErrorPopUpMessage" [class.FlipImgHoriz]="LayoutDirection == 'rtl'">
            {{uiProperty.ValidationError}}
        </div>


    </div>

    <table *ngIf="uiProperty.IsVisible" class="FixedTable">
        <tr lang="en">
            <td style="height: 100%;">
                <div *ngIf="!IsMultiline" [ngStyle]="InputDivStyle" style="position:relative;" [className]="IsRatioBox == true ? 'InputDivNoBorder' : 'InputDiv'" [id]="InputDivId" (mouseover)="OnMouseOver()">
                    <input [disabled]="IsDisabled" type="text" autocomplete="off"
                           style="-moz-box-shadow: inset 0 0 3px #AAAAAA;
                                  -webkit-box-shadow: inset 0 0 3px #AAAAAA;
                                  box-shadow: inset 0 0 3px #AAAAAA;
                                  border:none;
                                  max-height:unset;
                                  min-height:unset;
                                  height: 100%;
                                  position: absolute;
                                  top: 0;
                                  bottom: 0;
                                  left: 0;
                                  right: 0;
                                  opacity:1 !important; font-size:12px;
                                  direction: ltr;
                                  padding: 0 2px;"
                            [style.text-align]="isRTL?'right':'left'"
                           [spellcheck]="AllowSpellCheck"
                           [(ngModel)]="TextValue"
                           (focus)="onFocus()"
                           (blur)="onBlur()"
                           (keyup)="OnKeyUp($event)"
                           (keydown)="OnKeyDown($event)"
                           [placeholder]="Placeholder"
                           [class.AlignRight]="AlignTextToRight"
                           [id]="InputId" #input ondrop="return false" (paste)="OnPaste($event)" />
                </div>

                <div *ngIf="IsMultiline"
                     [id]="InputDivId"
                     class="InputDiv"
                     [ngStyle]="InputDivStyle"
                     style="height: 100%; max-height:unset; margin-bottom: 5px;"
                     (mouseover)="OnMouseOver()"
                     (mouseleave)="OnMouseLeave()">

                    <textarea [readonly]="IsDisabled"
                              wrap="hard"
                              [class.ArialFont]="UseArialFont == true"
                              [(ngModel)]="TextValue"
                              (focus)="onFocus()" [placeholder]="Placeholder"
                              (blur)="onBlur()"
                              (keydown)="OnKeyDown($event)"
                              [attr.rows]="RowsCount"
                              [id]="InputId" style="box-shadow:none;border:1px solid transparent; font-size:12px; font-family:inherit;"
                              ondrop="return false"
                              (paste)="OnPaste($event)"></textarea>

                    <div *ngIf="!IsDisabled && isMouseOver" [class.collapse-btn]="isExpanded"
                         class="expand-btn"
                         [style.right]="isRTL ? 'initial' : (multlineTextBoxLines > RowsCount ? '22px' : '2px')"
                         [style.left]="isRTL ? (multlineTextBoxLines > RowsCount ? '22px' : '2px') : 'initial'"
                         (click)="ExpandButtonClicked()"></div>

                </div>
            </td>

            <td style="width: 18px; position: relative;" *ngIf="!HideColumns">
                <HelpIcon *ngIf="ShowHelp" [HideHeader]="true" [Text]="ObjectFieldHelp" [IconSize]="15"></HelpIcon>
            </td>

            <td style="width: 18px; position: relative;" *ngIf="!HideColumns && !HideLastColumn">
                <div></div>
            </td>
        </tr>
    </table>
</div>
