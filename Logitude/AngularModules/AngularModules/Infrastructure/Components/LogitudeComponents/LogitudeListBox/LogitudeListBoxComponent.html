<style>
    .ListBoxItem{
        min-height:25px;
        margin-left: 5px;
        margin-right: 5px;
        line-height:25px;
        background-color:transparent;
    }
    .ListBoxItem:hover{
        cursor:pointer;
        margin: 0px 5px 0px 5px;
        background: #ffffff; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#ffffff, #DDE8F5); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#ffffff, #DDE8F5); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#ffffff, #DDE8F5); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#ffffff, #E6EBF0); /* Standard syntax (must be last) */
    }
     .SelectedListBoxItem{ 
        cursor:pointer;
        min-height:25px;
        line-height:25px;
        margin: 0px 5px 0px 5px;
        background: #E8F7FF; /* For browsers that do not support gradients */
        background: -webkit-linear-gradient(#E8F7FF, #85CAEC); /* For Safari 5.1 to 6.0 */
        background: -o-linear-gradient(#E8F7FF, #85CAEC); /* For Opera 11.1 to 12.0 */
        background: -moz-linear-gradient(#E8F7FF, #85CAEC); /* For Firefox 3.6 to 15 */
        background: linear-gradient(#E8F7FF, #85CAEC); /* Standard syntax (must be last) */
    }
</style>


<ul [ngStyle]="Style" *ngIf="SourceItems" >
    <li *ngFor="let item of SourceItems" class="{{item.ClassName}}" (click)="item.setSelected()">{{item.TranslatedText}}</li>
</ul>
