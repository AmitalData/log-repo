            margin-bottom: -1px;

            border-bottom: 1px solid white;
        }

        .LogTabControl .TabControlBody {
            position: absolute;
            left: 0;
            right: 0;
            top: 25px;
            bottom: 0;
            background: white;
            border-top: none !important;
        }

        .LogTabControl .TabControlHead {
            width: 100%;
            height: 25px;
            position: relative;
            border-bottom: 1px solid #3BB3E2;
        }

            .LogTabControl .TabControlHead ul {
        width: 100%;

        padding-left: 5px;
        padding-right: 5px;

    .CloseButtonWrapper {
        BACKGROUND-COLOR: #fff;
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }

        .CloseButtonWrapper:hover {
            BACKGROUND-COLOR: #e5e5e5;
        }

        .CloseButtonWrapper:active {
            BACKGROUND-COLOR: #b1b1b1;
        }

    .CloseButton {
        cursor: pointer;
        background: url('./Images/Tab.X.Blue.png') no-repeat;
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        font-size: 12px;
        color: #2d71aa;
        border-radius: 50%;
    }

<table>
    <tr>
        <td>
            <div class="TableHolder">
                <table>
                    <tr>
                        <td>
                            <div style="position: absolute; top: 0;" class="LogTabControl">
                                <div class="TabControlHead" [ngStyle]="MultiLineTabs ? {'overflow':'auto'} : ''" >
                                    <ul >
                                        <li *ngFor="let tab of TabsSource" [class.Selected]="tab.IsSelected" [style.float]="IsRTL ? 'right' : 'left'" (click)="SelectionChanged(tab)">

                                            <div style="position: relative; width: 100%;" class="InnerChild"
                                                 [style.text-align]="IsRTL ? 'right' : 'left'"
                                                 [title]="tab.Header"
                                                 (mousedown)="onListMouseDown($event,tab)">

                                                <div class="TextTrimming" [style.padding-left]="tab.IsSelected ? '3px' : ''">{{tab.Header}}</div>
                                                <div *ngIf="!HideCloseButton && !Disabled && (tab.IsSelected && TabsSource.length > 1)" class="CloseButtonWrapper" [title]="'General.B.Close' | TextCodeTranslationPipe"><div class="CloseButton" (click)="CloseTab(tab)"></div></div>
                                            </div>

                                        </li>

                                        <li *ngIf="!IsFixedTabs" class="NewTabItem" (click)="AddTab()" [style.float]="IsRTL ? 'right' : 'left'">+</li>
                                    </ul>
                                </div>

                                
                                <div class="TabControlBody" style="background: white;" [style.border]="NoBorder ? 'none' : '1px solid #3bb3e2'">
                                    <div class="MediaFillAbsolute" *ngFor="let tab of TabsSource;" [hidden]="!tab.IsSelected">
                                        <div LocationDirective Code="{{tab.Code}}" Index="{{tab.Index}}"></div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>

            </div>
        </td>
    </tr>
</table>
<div *ngIf="TabsSource.length <= 0" style="background: #f5f5f5; height: 100px; text-align: center; color: #a3a3a3; font-style: italic; padding-top: 40px; font-family: Verdana;">
    No tabs!
</div>
