
<style type="text/css">
    .FollowupItem:hover {
        background: -moz-linear-gradient(50% 106.14% 90deg,rgba(133, 203, 237, 1) 0%,rgba(150, 211, 240, 1) 22.59%,rgba(196, 231, 248, 1) 67.37%,rgba(232, 247, 255, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 100%);
        background: linear-gradient(0deg, rgba(133, 203, 237, 1) 0%, rgba(150, 211, 240, 1) 22.59%, rgba(196, 231, 248, 1) 67.37%, rgba(232, 247, 255, 1) 100%);
        transition: 0.3s;
    }

    .FollowupItem {
        width: 100%;
        background: #FFFFFF;
        border: 1px solid #A7A9AC;
        border-radius: 2px;
        -moz-border-radius: 2px;
        -webkit-border-radius: 2px;
        margin-top: 4px;
        position: relative;
    }

    .FollowupTooltip {
        position: fixed;
        background-image: url('./_Resources/Images/Icons/Tooltips/CellTooltipFlipped.png');
        background-repeat: no-repeat;
        background-size: 100% 100%;
        z-index: 1;
        pointer-events: none;
    }

    .FollowupItemTextArea {
        padding: 2px;
        padding-left: 4px;
        text-indent: 0px;
        font-size: 10px;
        color: #939598 !important;
        border: none !important;
        box-shadow: none !important;
        -moz-box-shadow: none !important;
        -webkit-box-shadow: none !important;
        background: transparent !important;
    }
</style>


<table>
    <tr style="height: 26px;">
        <td>
            <table>
                <tr>
                    <td style="width: 10px;">
                        <div></div>
                    </td>

                    <td style="width: 1px;">
                        <img style="float: left;" [attr.src]="IconPath" />
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="font-size: 13px; color: #464A4B;" [hidden]="IsMainSidebarCollapsed">
                        {{'General.O.FollowUps' | TextCodeTranslationPipe}}
                    </td>

                    <td style="width: 1px; font-size: 13px; color: #1B90CB;">
                        ({{ItemsSource.length}})
                    </td>

                    <td style="width: 10px;">
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 1px; background: #CCCCCC;">
        <td>
            <div></div>
        </td>
    </tr>

    <tr>
        <td>
            <div class="MediaFill" [hidden]="IsMainSidebarCollapsed">
                <div class="MediaFillAbsolute" style="left: 3px; right: 1px;">
                    <ScrollViewer [Small]="true">
                        <ul class="MediaFillAbsolute" style="right: 3px;">
                            <li class="FollowupItem"
                                *ngFor="let item of ItemsSource"
                                [attr.id]="item.ItemId"
                                [style.height.px]="item.ListItemHeight"
                                [style.background-color]="item.Background"
                                (mouseover)="item.ShowTooltip(true)"
                                (mouseleave)="item.ShowTooltip(false)">
                                <div class="MarginAbsolute3">
                                    <table>

                                        <!-- Icon + Name -->
                                        <tr style="height: 1px;">
                                            <td style="width:2px">
                                                <div></div>
                                            </td>
                                            <td [style.width.px]="item.IconWidth">
                                                <img style="float: left" [attr.src]="item.IconPath" [style.width.px]="item.IconWidth" [style.height.px]="item.IconHeight" />
                                            </td>

                                            <td>
                                                <div class="MediaFill TextTrimming" style="line-height: 12px; font-size: 10px; color: #1B90CB; padding-left: 3px;">
                                                    {{item.Name}}
                                                </div>
                                            </td>
                                        </tr>

                                        <!-- Date -->
                                        <tr style="height: 1px;" *ngIf="item.Date">
                                            <td style="width:2px">
                                                <div></div>
                                            </td>
                                            <td [style.width.px]="item.IconWidth">
                                                <div></div>
                                            </td>

                                            <td style="line-height: 11px; font-size: 10px; color: #282E30;">
                                                {{item.Date | DateTimeToDatePipe}}
                                            </td>
                                        </tr>

                                        <tr>
                                            <td colspan="3">
                                                <div class="MediaFill">

                                                </div>
                                                <div class="MediaFill TextTrimming" style="line-height: 12px; ">
                                                    <span style="padding:2px;padding-left:2px;text-indent:0px;font-size:10px;color: #939598 !important;">{{item.Notes}}</span>
                                                </div>

                                            </td>
                                        </tr>

                                        <!-- EntityNumber -->
                                        <tr style="height: 1px;">
                                            <td colspan="3" style="text-align: right; line-height: 11px;">
                                                <Hyperlink (click)="item.ViewEntityClicked()">{{item.EntityNumber}}</Hyperlink>
                                            </td>
                                        </tr>
                                    </table>
                                </div>

                                <div [attr.id]="item.ItemTooltipId" class="FollowupTooltip" [style.height.px]="item.TooltipHeight" [style.width.px]="item.TooltipWidth" [hidden]="!item.IsShowTooltip">
                                    <div class="MediaFillRelative">
                                        <div class="MarginAbsolute15" style="left: 30px; top: 13px; right: 12px;">
                                            <table>
                                                <tr style="height:1px">
                                                    <td>
                                                        <table>
                                                            <tr>
                                                                <!--<td style="width: 1px;">
                                                                    <img style="float: left" [attr.src]="item.IconPath" />
                                                                </td>-->

                                                                <td style="width: 5px;">
                                                                    <div></div>
                                                                </td>

                                                                <td style="font-size: 12px; color: #1B90CB;">Notes</td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <tr>
                                                    <td>
                                                        <div class="MediaFill">
                                                            <textarea class="FollowupItemTextArea" style="font-size: 11px;" [readonly]="true">{{item.Notes}}</textarea>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </ScrollViewer>
                </div>
            </div>
        </td>
    </tr>

    <tr style="height: 5px;">
        <td>
            <div></div>
        </td>
    </tr>
</table>
