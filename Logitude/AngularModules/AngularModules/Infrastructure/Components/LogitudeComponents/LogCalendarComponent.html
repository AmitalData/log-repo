
<style type="text/css">
    .DateTimePickerBox {
        direction: ltr;
        width: 100%;
        height: 101%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .DateTimePickerBoxHeader {
        height: 12px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }

    .DayCell {
        /*background: #f6f6f6;*/
        text-decoration: none;
        display: block;
        width: 21px;
        height: 21px;
        font-weight: normal;
        color: #454545;
        border-radius: 2px;
        font-size: 11px;
        text-align: center;
        line-height: 153%;
        padding: 3px;
    }
    .DayCell:hover:not(.Selected) {
        background: #ffe3b5;
        outline: 1px solid #f8b555;
    }
    .Selected {
        background: -moz-linear-gradient(50% 100% 90deg,rgba(28, 131, 185, 1) 0%,rgba(32, 133, 187, 1) 13.69%,rgba(45, 141, 191, 1) 28.14%,rgba(66, 153, 198, 1) 42.94%,rgba(96, 170, 209, 1) 57.99%,rgba(134, 192, 222, 1) 73.22%,rgba(180, 219, 239, 1) 88.4%,rgba(220, 242, 253, 1) 100%);
        background: -webkit-linear-gradient(90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: -webkit-gradient(linear,50% 100%,50% 0%,color-stop(0,rgba(28, 131, 185, 1) ),color-stop(0.1369,rgba(32, 133, 187, 1) ),color-stop(0.2814,rgba(45, 141, 191, 1) ),color-stop(0.4294,rgba(66, 153, 198, 1) ),color-stop(0.5799,rgba(96, 170, 209, 1) ),color-stop(0.7322,rgba(134, 192, 222, 1) ),color-stop(0.884,rgba(180, 219, 239, 1) ),color-stop(1,rgba(220, 242, 253, 1) ));
        background: -o-linear-gradient(90deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        background: linear-gradient(0deg, rgba(28, 131, 185, 1) 0%, rgba(32, 133, 187, 1) 13.69%, rgba(45, 141, 191, 1) 28.14%, rgba(66, 153, 198, 1) 42.94%, rgba(96, 170, 209, 1) 57.99%, rgba(134, 192, 222, 1) 73.22%, rgba(180, 219, 239, 1) 88.4%, rgba(220, 242, 253, 1) 100%);
        color: white;
        border-radius: 2px;

    }
    /* today */
    .today:not(.Selected) {
        border: 1px solid rgba(96, 170, 209, 1);
        background-color: rgb(245, 251, 255);
    }

    .Calendar {
        width: 185px;
        /*border: 1px solid #A7A9AC;*/
        border-radius: 5px;
        box-shadow: 2.5px 2.5px #D1D1D1;
    }
    .CalendarWeek {
        color: #1B90CB;
        line-height: 25px;
        position: relative;
        height: 21px;
        max-height: 21px;
        display: flex;
        font-size: 12px;
        margin-left: 6px;
    }

    .WeekDayCell {
        width: 25px;
        font-size: 11px;
    }

    .WeekRow {
        line-height: 25px;
        position: relative;
        height: 23px;
        max-height: 23px;
        display: flex;
        margin-left: 3px;
        width: 180px;
    }

    .DayCellDev {
        width: 25px;
        text-align: center;
    }


    .CalendarHeader {
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
        text-align: center;
    }

    .CalendarHeader button {
        font-size: 12px;
        font-weight: normal;
        cursor: pointer;
        background-size: 14px 14px;
        width: 18px;
        height: 14px;
        background-position: center center;
        background-repeat: no-repeat;

    }

        .CalendarHeader button:focus {
            outline: 0;
        }

    .CalendarHeader .calender-header-text {
        text-decoration: none;
        color: #454545;
        font-size: 10px;
    }

    .CalendarHeader > div:first-child{
        float:left;display: block; width: 20px;height:20px; padding-top: 3px;

    }
    .CalendarHeader > div:first-child > button{

        /* Icon */
        background-image: url('Images/Arrow-left.png');
        background-size: 8px 8px;
        background-position: center;
        background-color: transparent !important;
    }
    .CalendarHeader > div:nth-child(2){
        float:left;display: block; width:142px; text-align: center;height: 20px;line-height: 1;padding-top:4px;
    }
    .CalendarHeader > div:last-child{
        float:right;display: block; width: 20px;height:20px; padding-top: 3px;

    }
        .CalendarHeader > div:last-child > button{
            /* Icon */
            background-color: transparent !important;
            background-image: url('Images/Arrow-right.png');
            background-size: 8px 8px;
            background-position: center;
        }

    .CalendarHeader .calender-header-left-button {
        background-image: url('Images/Arrow-left.png');
        background-size: 8px 8px;
        background-position: center;
        background-color: transparent !important;
        background-color: none !important;
    }

    .CalendarHeader .calender-header-right-button {
        background-color: transparent !important;
        background-image: url('Images/Arrow-right.png');
        background-size: 8px 8px;
        background-position: center;
    }
</style>


<div class="Calendar">
    <div class="DateTimePickerBox">

        <!-- Header -->
        <div class="CalendarHeader DateTimePickerBoxHeader" style="height: 20px;">

            <div>
                <button  tabindex="-1" (click)="Previous()" class="CustomButton" ></button>
            </div>

            <div tabindex="-1"  class="calender-header-text">
                {{SelectedMonthYear}}
            </div>

            <div>
                <button  tabindex="-1" (click)="Next()" class="CustomButton" ></button>
            </div>
        </div>

        <!-- Calendar -->
        <div>
                <div class="CalendarWeek">
                    <div *ngFor="let dayOfWeek of shortDayNames">
                        <div class="WeekDayCell">{{dayOfWeek}}</div>
                    </div>
                </div>

                <div style="position:relative">
                    <div class="WeekRow" *ngFor="let week of weekRows; let weekIndex=index">
                        <div *ngFor="let day of weekRows[weekIndex]">
                            <div class="DayCellDev">
                                <a tabindex="-1" class="DayCell" *ngIf="day"
                                   [class.Selected]="SelectedDate && day.Day === SelectedDate.getDate()"
                                   [class.today]="day.Day === TodayDate.getDate()"
                                   href="#"
                                   (click)="OnDayClick(day)">
                                    {{day.Day}}
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Today Button -->
                <div style="height: 35px; width: 100%; position: relative;">
                    <div style="height: 1px; background: #7BA4E0; position: absolute; top: 3px; left: 15px; right: 15px;"></div>

                    <div class="CenterCenter" style="height: 22px; width: 57px; padding-top: 2px;">
                        <button class="Button" (click)="TodayButtonClicked()">Today</button>
                    </div>
                </div>
        </div>

    </div>
</div>
