<style>
    .Disable {
        pointer-events: none;
    }
</style>
<table>

    <tr style="height: 100%;">
        <td style="padding: 5px 15px;" >

                <textarea
                [(ngModel)]="Text"
                style="height: 100%;" [class.Disable]="DisplayMode == true"
                >

                      </textarea>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="padding: 0 15px">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;" *ngIf="DisplayMode == false">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
