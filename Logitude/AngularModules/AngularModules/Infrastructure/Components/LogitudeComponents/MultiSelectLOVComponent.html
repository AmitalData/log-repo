<div class="container">
    <table>
        <tr class="FormFieldRow">
            <td style="width: 400px;">
                <table>
                    <tr>
                        <td><div (click)="DropdownMenuButtonClick($event)" >{{_ChosenFormatedList}}</div></td>
                        <td *ngIf="_ChosenFormatedList"  style="width:20px"><button style="width:15px" (click)="ClearList()" >X</button> </td>
                    </tr>
                </table>
                
            </td>
            <td >
                <button [disabled]="IsDisabled"
                        (click)="DropdownMenuButtonClick($event)"
                        [attr.id]="_MultiSelectLOVId"
                        style="background-color: transparent;cursor:pointer">
                    show
                </button>

            </td>
        </tr>
    </table>
    <div [attr.id]="_MultiSelectLOVMenuId"
         [ngStyle]="{'display': _DropdownDisplay  }"
         style="position: fixed;z-index: 1;border: .5px solid  #45494A;border-radius: 3px;background-color: #F2F2F2;">
        <div style="height:450px;width:300px">
            
            <div>
                <table>
                    <tr class="FormFieldRow">
                        <td style="width: 400px;" class="myLOV-td" >
                            <!--<ng-content select=".class-MultiSelectLOV-content"></ng-content>-->
                                <LogLov [ObjectFieldName]="'CurrencyTypeCode'"
                                        [ObjectTableName]="ObjectTableName"
                                        [DataContext]="DataContext"
                                        [HideColumns]="true"
                                        [LookUpTableName]="'Customs.CurrencyType'"
                                        [DisplayMemberPath]="'LocalName'">
                                </LogLov>
                            

                        </td>
                        <td  style="width:50px;">
                            <button (click)="AddToList()">Add</button>
                        </td>
                    </tr>
                </table>
            </div>
            <div>
                <ul>
                    <li *ngFor="let item of DataContext[LOVListComponentPropName]">
                        <button (click)="DeleteFromList(item)">x</button> {{item[this.MyLogLovV2Component.DisplayMemberPath]}}
                    </li>
                </ul>
            </div>

        </div>


    </div>
</div>
