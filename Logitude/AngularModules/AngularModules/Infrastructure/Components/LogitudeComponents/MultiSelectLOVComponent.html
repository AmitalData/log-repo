<style>
scrollable-content {
  
  background-color: blue;
}
</style>
<div class="container">
    <table>
        <tr class="FormFieldRow">
            <td style="width: 400px;">
                <!--<table>
                    <tr>
                        <td><div (click)="DropdownMenuButtonClick($event)" >{{_ChosenFormatedList}}</div></td>
                        <td *ngIf="_ChosenFormatedList"  style="width:20px"><button style="width:15px" (click)="ClearList()" >X</button> </td>
                    </tr>
                </table>-->
                <!--(focus)="DropdownMenuButtonClick($event)"-->
                <input type="text" placeholder="{{PlaceHolder}}" [(ngModel)]="_ChosenFormatedList"
                       [ngStyle]="LayoutDirection == 'rtl' ? {'padding-left': '30px'} : {'padding-right': '30px'}"
                       (click)="DropdownMenuButtonClick($event,true)" />
                <img *ngIf="_ChosenFormatedList" [className]="LayoutDirection == 'rtl' ? 'DeleteButton LeftCenter' : 'DeleteButton RightCenter'" [ngStyle]="LayoutDirection == 'rtl' ? {'left': '30px'} : {'right': '30px'}" src="Images/RedX.png" (click)="ClearList()" />
                <button class="DeleteButton LeftCenter"
                        [disabled]="IsDisabled"
                        (click)="DropdownMenuButtonClick($event,false)"
                        [attr.id]="_MultiSelectLOVId"
                        style="background-color: transparent;cursor:pointer;left:5px;width:20px">
                    &#9660;
                </button>

            </td>
            <td>
            </td>
        </tr>
    </table>
    <div [attr.id]="_MultiSelectLOVMenuId"
         [ngStyle]="{'display': _DropdownDisplay  }"
         style="position: fixed;z-index: 1;border: .5px solid  #45494A;border-radius: 3px;background-color: #F2F2F2;">
        <div style="height:250px;width:300px;">

            <div style="margin:5px;padding:10px">
                <table>
                    <tr class="FormFieldRow">
                        <td style="width:10px"></td>
                        <td style="width: 400px;" class="myLOV-td">
                            <ng-content select=".class-MultiSelectLOV-content"></ng-content>
                            <!--<LogLov [ObjectFieldName]="'UserId'"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [HideColumns]="true"
                                    [LookUpTableName]="'User'"
                                    [DisplayMemberPath]="'LocalName'">
                            </LogLov>-->


                        </td>
                        <td style="width:50px;">
                            <IconButton [IsEnabled]="!IsDisplayOnly" [Name]="'Add'" (click)="AddToList()"></IconButton>
                            <!--<button (click)="AddToList()">Add</button>-->
                        </td>
                    </tr>
                </table>
            </div>
            <div style="height:10px"></div>
            <div  class="" style="margin:5px;padding:10px;height: 200px;overflow-x: auto;">
                <table>
                    <tr  [ngClass]="_MultiSelectLOVMenuId" style="height:20px" *ngFor="let item of DataContext[LOVListComponentPropName]">
                        <td>
                            <span> {{item[this.MyLogLovV2Component.DisplayMemberPath]}}</span>
                        </td>
                        <td style="width:30px">
                            <IconButton [Name]="'Delete'" [IsSmall]="true" (click)="DeleteFromList(item)"></IconButton>
                        </td>
                    </tr>
                    <tr>

                    </tr>
                </table>
            </div>

        </div>


    </div>
</div>
