<style>
    .AdvancedDatePickerControl {
        display: block;
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        line-height: 22px;
        width: 100%;
        position: relative;
    }

    .AdvancedDatePickerContainer {
        height: 100%;
        width: 100%;
        background: white;
        font-size: 11px;
        color: #45494A;
        border-radius: 3px;
        -moz-border-radius: 3px;
        -webkit-border-radius: 3px;
        position: relative;
    }

    .AdvancedDatePickerWrap {
        height: 100%;
        width: 100%;
        line-height: 22px;
        width: 100%;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        text-indent: 5px;
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        text-decoration: none;
        vertical-align: middle;
        cursor: pointer;
    }

    .AdvancedDatePickerWrap:hover:not(:disabled), .AdvancedDatePickerWrap:focus:not(:disabled) {
        border: 1px solid #3BB3E2;
    }

    .AdvancedDatePickerWrap:disabled {
        opacity: 0.5;
        pointer-events: none;
    }

    .AdvancedDatePickerWrap:hover:not(:disabled) .DeleteButton {
        visibility: visible;
    }

    .DropDownList {
        color: #444;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        max-height: 305px;
        background: white;
        -webkit-overflow-scrolling: touch;
        border: 1px solid #AAAAAA;
        height: 305px;
    }

    .AdvancedDatePickerDropdown {
        background: white;
        border: 1px solid #AAAAAA;
        box-shadow: 0 4px 8px 0 #AAAAAA;
        border-radius: 4px;
        -moz-border-radius: 4px;
        -webkit-border-radius: 4px;
        border-top-left-radius: unset;
        -moz-border-radius-topleft: unset;
        -webkit-border-top-left-radius: unset;
        border-top: none;
        /*visibility: hidden;*/
        z-index: 10000000;
    }

    .AdvancedDatePickerDropdownItem {
        font-size:11px;
        width:100%;
        position:relative;
        display: inline-block;
        height: 20px;
    }

    .AdvancedDatePickerDropdownInnerItem {
        height: 100%;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        position: relative;
        display: inline-block;
        margin-left: 3px;
        margin-right: 3px;
    }

    .DropDownListItem:not(.liItemSelected):hover {
        outline: 1px solid #8ebff5;
        background: #ffffff; /* Old browsers */
        background: -moz-linear-gradient(top, #ffffff 0%, #c6ebff 100%) !important; /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #ffffff 0%,#c6ebff 100%) !important; /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #ffffff 0%,#c6ebff 100%) !important; /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffffff', endColorstr='#c6ebff',GradientType=0 ) !important; /* IE6-9 */
    }

    .DropDownListItem {
        display: list-item;
        cursor: pointer;
        /*line-height: 17px;*/
        height: 20px;
        word-wrap: break-word;
        -webkit-touch-callout: none;
        border-bottom: 1px solid #d7d7d7;
        vertical-align: middle;
    }

        .DropDownListItem:not(.liItemSelected):not(.highlighted):nth-child(even):not(.InActive) {
            background: #ecf1f3;
        }

    .liItemSelected {
        background: #c5dce8; /* Old browsers */
        background: -moz-linear-gradient(top, #c5dce8 0%, #e2f5ff 14%, #91d6f2 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#c5dce8', endColorstr='#91d6f2',GradientType=0 ); /* IE6-9 */
    }

    li.highlighted {
        background: #c5dce8; /* Old browsers */
        background: -moz-linear-gradient(top, #c5dce8 0%, #e2f5ff 14%, #91d6f2 100%); /* FF3.6-15 */
        background: -webkit-linear-gradient(top, #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, #c5dce8 0%,#e2f5ff 14%,#91d6f2 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#c5dce8', endColorstr='#91d6f2',GradientType=0 ); /* IE6-9 */
    }


    .DeleteButton {
        visibility: hidden;
        cursor: pointer;
    }

    .DatePickerCalendar {
        background: white;
        box-shadow: 0 4px 8px 0 #AAAAAA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        border-top-left-radius: unset;
        -moz-border-radius-topleft: unset;
        -webkit-border-top-left-radius: unset;
        border-top: none;
        z-index: 10000000;
    }

    .AdvancedDatePickerInput {
        background: transparent;
        padding-top: 2px;
        box-shadow:none;
        border:1px solid transparent;
        border-radius:3px;
        text-indent:5px;
        height:18px;
        min-height:18px;
        max-height:20px;
        opacity:1 !important;
        line-height: 1.0;
        display: block;
    }

    input[title]:hover {
        border: 1px solid transparent;
    }

    input[title]:focus {
        border: 1px solid transparent;
    }

    .ErrorPopUp {
        background-image: url('Images/ValidationTooltip.png');
        background-repeat: no-repeat;
        background-size: auto;
        position: absolute;
        height: 110px;
        width: auto;
        color: white;
        z-index: 100;
        word-break: break-all;
        word-wrap: break-word;
        overflow: hidden;
        white-space: normal;
    }

    .ErrorPopUpMessage {
        color: white;
        white-space: normal;
        word-break: break-word;
        word-wrap: break-word;
        font-size: 11px;
        width: 215px !important;
        height: 110px;
        margin: 10px 10px 10px 10px;
        padding: 2px 8px;
        overflow: hidden;
    }

    #periodNumber {
        width: 35px;
        border: none;
        height: 15px !important;
        box-shadow: none;
        min-height: 15px;
    }

    .periodText {
        font-size: 11px;
        color: #45494A;
    }

    #periodUnit {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url(Images/ToggleIcon.png);
        background-repeat: no-repeat;
        background-position: right 3px center;
        padding-right: 10px;
        width: 52px;
        cursor: pointer;
        border: none !important;
    }

    .offset-popup {
        position: fixed;
        position-area: left;
        width: 170px;
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        z-index: 99999999;
    }

    .offset-row {
        height: 20px;
        display: flex;
        margin: 5px 10px;
    }

    .units {
      padding: 10px;
      display: flex;
      flex-direction: column;
      direction: ltr;
    }

    .unit {
        box-shadow: none;
        width: initial;
        float: left;
        margin-right: 5px;
    }

    .result {
        margin: 0px 10px;
        direction: ltr;
    }
    .result-v {
        float: right;
    }
    .result-v:hover {
        color: limegreen;
        cursor: pointer;
        font-weight: bold;
    }

</style>
<div style="width:100%;height:100%" *ngIf="DataContext">
    <div [id]="ErrorPopUpId"
         FixedPosition
         [ElementId]="ErrorPopUpId"
         [RelativeElementId]="AdvancedDatePickerInputId"
         [TopDisplacement]="-105"
         [HorizDisplacement]="LayoutDirection == 'rtl' ? 120 : 0"
         [ComponentType]="'popup'"
         [class.FlipImgHoriz]="LayoutDirection == 'rtl'"
         [PopupWidth]="180"
         class="ErrorPopUp"
         *ngIf="ShowErrorPopup">
        <div class="ErrorPopUpMessage" [class.FlipImgHoriz]="LayoutDirection == 'rtl'">
            {{uiProperty.ValidationError}}
        </div>
    </div>
    <table class="FixedTable" (mouseover)="OnComponentMouseOver()" (mouseout)="OnComponentMouseOut()">
        <tr>
            <td>
                <div [id]="DivAdvancedDatePickerId"
                     class="AdvancedDatePickerControl">
                    <div class="AdvancedDatePickerContainer">
                        <div  *ngIf="!IsDisabled"
                             class="AdvancedDatePickerWrap"
                             [ngStyle]="AdvancedDatePickerInputDivStyle"
                             tabindex="0">
                            <table>
                                <tr>
                                    <td style="width: 2px;">
                                        <div></div>
                                    </td>
                                    <td>
                                        <div class="FillParent">
                                            <input *ngIf="!IsRelativeperiodDropDownOpen" [id]="AdvancedDatePickerInputId"
                                                   [(ngModel)]="InputValue"
                                                   (focus)="OnInputFocus()"
                                                   (blur)="OnInputBlur()"
                                                   (keydown)="Onkeydown($event)"
                                                   (keyup)="Onkeyup($event)"
                                                   class="AdvancedDatePickerInput"
                                                   autocomplete="off"
                                                   [placeholder]="AdvancedDatePickerPlaceHolder"
                                                   ondrop="return false"
                                                   title="{{ShowToolTip ? InputValue:''}}"/>
                                            
                                            <select *ngIf="IsRelativeperiodDropDownOpen"
                                                id="periodUnit" class="periodText"
                                                [(ngModel)]="selectedPeriodUnit"
                                                (change)="updateSelectedPeriodUnit()">
                                                <option *ngFor="let period of PeriodUnitList" [value]="period" [selected]="selectedPeriodUnit == period" class="periodText">{{ period }}</option>
                                            </select>

                                            <input *ngIf="IsRelativeperiodDropDownOpen" type="number" [(ngModel)]="periodNumber" id="periodNumber" (keyup)="updateSelectedPeriodUnit($event)">

                                        </div>
                                    </td>
                                    <td style="width: 2px;">
                                        <div></div>
                                    </td>
                                    <td style="width: 10px;">
                                        <img class="DeleteButton LeftCenter" src="Images/RedX.png" (click)="OnDeleteValue()" [ngStyle]="DeleteButtonNgStyle" />
                                    </td>
                                    <td style="width: 4px;">
                                        <div></div>
                                    </td>
                                    <td (click)="OnDropDownClicked()" style="width: 10px;">
                                        <img class="LeftCenter" src="Images/ToggleIcon.png" />
                                    </td>
                                </tr>
                            </table>

                        </div>
                        <div *ngIf="IsDropDownVisible"
                             (mouseover)="OnDropDownMouseOver()"
                             (mouseout)="OnDropDownMouseOut()"
                             FixedPosition
                             [ElementId]="DropdownId"
                             [RelativeElementId]="DivAdvancedDatePickerId"
                             [VertDisplacement]="25"
                             [HorizDisplacement]="1"
                             [PopupWidth]="200"
                             [ComponentHight]="50"
                             class="AdvancedDatePickerDropdown"
                             [id]="DropdownId"
                             [style.width.px]="200"
                             [style.height.px]="50">

                            <ul *ngIf="IsDropDownVisible"
                                class="DropDownList"
                                style="width:200px;">
                                <li *ngFor="let item of ItemsSource;"
                                    class="DropDownListItem"
                                    (mousedown)="OnDropDownSelectedMouse($event, item)"
                                    (mouseover)="OnLiMouseOver($event, item)"
                                    (mouseleave)="OnLiMouseLeave($event)">
                                    <div
                                         class="AdvancedDatePickerDropdownItem"
                                         (mouseover)="OnLiMouseOver($event, item)"
                                         (mouseleave)="OnLiMouseLeave($event)">
                                         <div
                                             class="AdvancedDatePickerDropdownInnerItem"
                                             (mouseover)="OnLiMouseOver($event, item)"
                                             (mouseleave)="OnLiMouseLeave($event)">
                                            <span style="padding: 4px;" id="setOffset" *ngIf="hoveredItem === item && hoveredItem.Code != 'SPD' && hoveredItem.Code != 'PER'" >&lt;</span>
                                            {{item.Name}}
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>
    <div FixedPosition [ElementId]="LogCalendarId" [RelativeElementId]="DropdownId" [VertDisplacement]="0" [HorizDisplacement]="LayoutDirection == 'rtl' ? 200 : 185"
         [PopupWidth]="184" [ComponentHight]="183"
         [id]="LogCalendarId" *ngIf="IsCalendarDateDropDownOpen && IsDropDownVisible" (mouseover)="OnCalendarMouseOver()" (mouseout)="OnCalendarMouseOut()" (blur)="OnCalendarBlur()"
         tabindex="-1" class="DatePickerCalendar" [ComponentType]="'datepicker'">
        <LogCalendar [ToggleOpened]="IsCalendarOpen" [SelectedDate]="SelectedCalendarDate" (SelectedDateChanged)="OnSelectedCalendarDateChanged($event)"></LogCalendar>
    </div>

    <div class="offset-popup periodText" *ngIf="isOffsetOpen">
        <div style="cursor: pointer; margin-top: 5px; margin-right: 5px; width: 10px; height: 10px;" (click)="isOffsetOpen = false">X</div>

        <div class="result">Offset from selection:</div>
        <div class="offset-row">
            <button (click)="Offset = Offset - 1" style="cursor: pointer;">−</button>
            <input style="direction: ltr;" type="number" min="1" [(ngModel)]="Offset">
            <button (click)="Offset = Offset + 1" style="cursor: pointer;">+</button>
        </div>

        <div class="units">
            <span class="FieldRow">Units:</span>
            <RadioButton class="unit FieldRow" *ngFor="let u of units" [Name]="u" [IsChecked]="selectedUnit == u" (Checked)="$event? selectedUnit = u: null; recalculate()" [Text]="u"></RadioButton>
        </div>

        <div class="result FieldRow">
            <span>Result: {{ result | date:'dd/MM/yyyy' }}</span>
            <span class="result-v" (click)="SaveOffsetDate()">V</span>
        </div>
    </div>
</div>
