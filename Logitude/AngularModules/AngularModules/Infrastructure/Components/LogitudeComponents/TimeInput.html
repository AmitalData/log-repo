
<div style="height:100%;width:100%" [attr.id]="ControlId">
    <table>
        <tr>
            <td>
                <LogTextBox [FocusOnMe]="FocusOnMe"
                            (LostFocus)="TextBoxLostFocus()"
                            (keydown)="onkeydown($event)"
                            [NoObjectField]="true"
                            [ObjectFieldName]="'InputValue'"
                            [Text]="InputValue"
                            [ObjectTableName]="'TMEmployeeTime'"
                            [DataContext]="DataContext"
                            [HideColumns]="true">
                </LogTextBox>
            </td>
        </tr>
    </table>
</div>
