
<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        /*border: 1px solid #BABABA;*/
        /*border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;*/
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }
</style>
<table>

    <tr style="height: 21px;">
        <td style="height: 21px;">
            <table>
                <tr>
                    <td style="width: 230px; vertical-align:middle;">
                        <SearchTextBox [ObjectTableName]="ParentTableName"
                                       (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height:10px"></tr>

            </table>
        </td>
    </tr>

    <!-- My Tenant data -->
    <tr style="min-height: 244px" *ngIf="IsMyDataVisible">
        <td>
            <table>
                <tr>
                    <td>
                        <table>                           
                            <tr>
                                <td style="height: 100%;width:100%">

                                    <div class="SystemDefaultsBox">
                                        <table>
                                            <tr class="SystemDefaultsBoxHeader">
                                                <td>
                                                    <table>
                                                        
                                                        <tr [style.background-color]="DataSource.rowCount == ConstantPageSize && DontApplyVirtualization ? '#FFFBDA':''">
                                                            <td style="color: #666666; font-size: 11px; padding-left: 15px;">
                                                                <span *ngIf="DataSource.rowCount != ConstantPageSize || !DontApplyVirtualization"> My {{ObjectTableNamePluralName}} ({{DataSource.rowCount}}) </span>   <span *ngIf="DataSource.rowCount == ConstantPageSize && DontApplyVirtualization">Showing the first {{ConstantPageSize}} rows, use the search field to find more results.</span>
                                                            </td>

                                                            <!-- Add US Warehouse Button -->
                                                            <td style="width: 50px; padding-left: 5px;" *ngIf="IsAddUSWarehouseVisible">
                                                                <button class="Button" (click)="AddUSWarehouseClicked()">Add</button>
                                                            </td>

                                                            <!-- Add Button -->
                                                            <td style="width: 1px; padding-left: 5px;" *ngIf="!IsAddDisabled && IsAddBtnVisible">
                                                                <IconButton [IsSmall]="true" [Name]="'Add'" (click)="AddButtonClicked()"></IconButton>
                                                            </td>

                                                            <!-- Add Toggle -->
                                                            <td style="width: 1px;" *ngIf="!IsAddDisabled && IsAddToggleVisible">
                                                                <div tabindex="0" class="ToggleButton" style="width:34px;float:right;">
                                                                    <table>
                                                                        <tr>
                                                                            <td style="width: 2px;">
                                                                                <div></div>
                                                                            </td>

                                                                            <td class="TextTrimming" style="text-shadow: 1px 1px white; color: #3a3d58; padding: 0px 2px;">
                                                                                <img src="./Images/Buttons/Add.png" />
                                                                            </td>

                                                                            <td style="width: 3px;">
                                                                                <div></div>
                                                                            </td>

                                                                            <td style="width: 10px;">
                                                                                <img class="LeftCenter" src="Images/ToggleIcon.png" />
                                                                            </td>
                                                                        </tr>
                                                                    </table>

                                                                    <div class="ToggleButtonMenu" style="top:22px;">
                                                                        <div *ngFor="let type of LovPartnerTypes">
                                                                            <button (click)="AddPartnerOfType(type)">
                                                                                {{type.Name}}
                                                                            </button>
                                                                        </div>
                                                                    </div>

                                                                    <!-- <img class="LeftCenter" src="Images/ToggleIcon.png" />-->
                                                                </div>
                                                            </td>

                                                            <td>
                                                                <div></div>
                                                            </td>

                                                            <td style="width: 5px;">
                                                                <div></div>
                                                            </td>
                                                        </tr>

                                                    </table>
                                                </td>
                                            </tr>

                                            <tr style="border: 1px solid #BABABA; border-top: none;">
                                                <td style="padding: 2px; min-height: 215px;">
                                                    <table class="FixedTable">
                                                        <tr>
                                                            <td style="height: 100%">
                                                                <div *ngIf="IsDataReady" class="GeneratedGridContainer">
                                                                    <logitude-grid *ngIf="!UsingLogGridV2" GridWidth="100%" GridHeight="100%" [dataSource]="DataSource"
                                                                                   [columns]="columns1" [autoLoad]="true" [rows]="items"
                                                                                   [searchFields]="searchFields" [SearchFieldchangeevent]="SearchFieldchangeevent"
                                                                                   (rowSelectedEvent)="onRowSelected($event)">
                                                                    </logitude-grid>

                                                                    <logitude-grid-v2 *ngIf="UsingLogGridV2" GridWidth="100%" GridHeight="100%" [dataSource]="DataSource"
                                                                                      [columns]="columns1" [autoLoad]="true" [rows]="items"
                                                                                      [searchFields]="searchFields" [SearchFieldchangeevent]="SearchFieldchangeevent"
                                                                                      (rowSelectedEvent)="onRowSelected($event)">
                                                                    </logitude-grid-v2>
                                                                </div>
                                                            </td>
                                                        </tr>

                                                    </table>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- tenent zero -->
    <tr style="min-height: 244px;" *ngIf="IsAllDataVisible">
        <td>
            <table>
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td style="height: 100%;width:100%">

                                    <div class="SystemDefaultsBox">
                                        <table>
                                            <tr class="SystemDefaultsBoxHeader">
                                                <td>
                                                    <table>
                                                        <tr>
                                                          <td style="color: #666666; font-size: 11px; padding-left: 15px;">All {{ObjectTableNamePluralName}} ({{DataSource2.rowCount2}})</td>
                                                        </tr>

                                                    </table>
                                                </td>
                                            </tr>

                                            <tr style="border: 1px solid #BABABA; border-top: none;">
                                                <td style="padding: 2px; min-height: 215px;">
                                                    <table class="FixedTable">
                                                        <tr>
                                                            <td style="height: 100%">
                                                                <div *ngIf="IsDataReady" class="GeneratedGridContainer">
                                                                    <logitude-grid *ngIf="!UsingLogGridV2" GridWidth="100%" GridHeight="100%" [dataSource]="DataSource2"
                                                                                   [columns]="columns" [autoLoad]="true" [rows]="items" 
                                                                                   [searchFields]="searchFields" [SearchFieldchangeevent]="SearchFieldchangeevent"
                                                                                   (rowSelectedEvent)="onRowSelected($event)">
                                                                    </logitude-grid>
                                                                    <logitude-grid-v2 *ngIf="UsingLogGridV2" GridWidth="100%" GridHeight="100%" [dataSource]="DataSource2"
                                                                                      [columns]="columns" [autoLoad]="true" [rows]="items"
                                                                                      [searchFields]="searchFields" [SearchFieldchangeevent]="SearchFieldchangeevent"
                                                                                      (rowSelectedEvent)="onRowSelected($event)">
                                                                    </logitude-grid-v2>
                                                                </div>
                                                            </td>
                                                        </tr>

                                                    </table>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CloseButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
