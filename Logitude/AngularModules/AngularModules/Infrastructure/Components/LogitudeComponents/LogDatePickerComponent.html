

<style type="text/css">
    .DatePicker {
        display: inline;
        position: relative;
    }

        .DatePicker:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

    .DatePickerCalendar {
        background: white;
        /*border: 1px solid #AAAAAA;*/
        box-shadow: 0 4px 8px 0 #AAAAAA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
        border-top-left-radius: unset;
        -moz-border-radius-topleft: unset;
        -webkit-border-top-left-radius: unset;
        border-top: none;
        /*visibility: hidden;*/
        z-index: 10000000;
    }


    .DatePickerInputDiv {
        height: 22px;
        min-height: 22px;
        max-height: 22px;
        /*line-height: 21px;*/
        width: 100%;
        border: 1px solid #AAAAAA;
        outline: none;
        font-size: 11px;
        color: #45494A;
        background: white;
        /*text-indent: 5px;*/
        border-radius: 3px;
        -webkit-border-radius: 3px;
        -moz-border-radius: 3px;
        -moz-box-shadow: inset 0 0 3px #AAAAAA;
        -webkit-box-shadow: inset 0 0 3px #AAAAAA;
        box-shadow: inset 0 0 3px #AAAAAA;
        display: block;
    }

    .CalendarButton {
        -moz-border-radius-topright: 3px;
        -moz-border-radius-bottomright: 3px;
        -moz-border-radius-topleft: unset;
        -moz-border-radius-bottomleft: unset;
        -webkit-border-top-right-radius: 3px;
        -webkit-border-bottom-right-radius: 3px;
        -webkit-border-bottom-left-radius: unset;
        -webkit-border-top-left-radius: unset;
        border-top-right-radius: 3px;
        border-bottom-right-radius: 3px;
        border-top-left-radius: unset;
        border-bottom-left-radius: unset;
        /*border-color: transparent;*/
        background-color: #f3f3f3;
        background-position: center center;
        background-repeat: no-repeat;
        background-image: url('Images/calender-icon-sm.png');
        width: 20px;
        height: 20px;

        /*background: rgba(244,249,252,1);
        background: -moz-linear-gradient(top, rgba(244,249,252,1) 0%, rgba(114,125,133,1) 100%);
        background: -webkit-gradient(left top, left bottom, color-stop(0%, rgba(244,249,252,1)), color-stop(100%, rgba(114,125,133,1)));
        background: -webkit-linear-gradient(top, rgba(244,249,252,1) 0%, rgba(114,125,133,1) 100%);
        background: -o-linear-gradient(top, rgba(244,249,252,1) 0%, rgba(114,125,133,1) 100%);
        background: linear-gradient(to bottom, rgba(244,249,252,1) 0%, rgba(114,125,133,1) 100%);
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#f4f9fc', endColorstr='#727d85', GradientType=0 );*/


        }

        .CalendarButton:focus {
            outline: 0;
        }

        .CalendarButton:hover:not(:disabled) {
            background-position: center center;
            background-repeat: no-repeat;
            background-image: url('Images/calender-icon-sm.png');
        }

    .DatePickerInputDivDisabled {
        opacity: 0.5;
        pointer-events: none;
    }

      .ErrorPopUp {
        background-image: url('Images/ValidationTooltip.png');
        background-repeat: no-repeat;
        background-size: auto;
        position: absolute;
        height: 110px;
        width:auto;
        color: white;
        z-index: 100;
        word-break: break-all;
        word-wrap: break-word;
        overflow: hidden;
        white-space: normal;
      
    }

    .ErrorPopUpMessage {
        color: white;
        white-space: normal;
        word-break: break-word;
        word-wrap: break-word;
        font-size: 11px;
        width: 215px !important;
        height: 110px;
        margin: 10px 10px 10px 10px;
        padding: 2px 8px;
        overflow: hidden;
    }
    .Button{
        border: 1px solid #d1d1d1 !important;
        border-radius: 0px;
        border-top-right-radius: 3px !important;
        border-bottom-right-radius: 3px !important;
    }

    .FlipImgHoriz{
        -moz-transform: scaleX(-1);
        -o-transform: scaleX(-1);
        -webkit-transform: scaleX(-1);
        transform: scaleX(-1);
        filter: FlipH;
        -ms-filter: "FlipH";
    }
</style>

<div class="DatePicker" (mouseover)="OnMouseOver()" (mouseout)="OnMouseOut()">
    <div [id]="ErrorPopUpId"
         FixedPosition
         [ElementId]="ErrorPopUpId"
         [RelativeElementId]="DatePickerInputId"
         [TopDisplacement]="-95"
         [LeftDisplacement]="0"
         [ComponentType]="'popup'"
         [class.FlipImgHoriz]="LayoutDirection == 'rtl'"
         [PopupWidth]="180"
         class="ErrorPopUp"
         *ngIf="ShowErrorPopup">
        <div class="ErrorPopUpMessage" [class.FlipImgHoriz]="LayoutDirection == 'rtl'">
            {{uiProperty.ValidationError}}
        </div>
    </div>
    <!--<input id="asd" style="width: 0px; height: 0px; " />-->
    <div id="focus-div" tabindex="999999" ></div>
    <table *ngIf="uiProperty.IsVisible" style="table-layout: fixed;">
        <tr>
            <td>
                <div [id]="InputDivId" class="DatePickerInputDiv" [ngStyle]="DatePickerInputDivStyle">

                    <!-- Input -->
                    <div style="height: 100%;width: calc(100% - 24px);"  float-start >
                        <input [id]="DatePickerInputId"
                            style="background: transparent;padding-top: 2px;box-shadow:none;border:1px solid transparent; border-radius:3px; text-indent:5px;height:18px;min-height:18px;max-height:20px;opacity:1 !important;line-height: 1.0;display: block;"
                            [disabled]="IsDisabled"
                            [(ngModel)]="InputValue"
                            (focus)="onFocus()"
                            (blur)="onBlur()"
                            (keydown)="onkeydown($event)"
                            (keyup)="onkeyup($event)"
                            class="DatePickerInput"
                            autocomplete="off" [placeholder]="DatePickerPlaceHolder" ondrop="return false"/>
                    </div>

                    <!-- Toggle Button -->
                    <div style="height: 100%;width: 20px;" [style.float]="isRTL ? 'left' : 'right'">
                        <button [id]="CalendarButtonId" tabindex="-1"
                            class="Button CalendarButton RightCenter CustomButton"
                            (click)="ToggleCalendar()"
                            (focus)="OnBtnFocus()"
                            [disabled]="IsDisabled"></button>
                    </div>

                    <!-- <table>
                        <tr>
                            <td>
                                <input [id]="DatePickerInputId"
                                       style="box-shadow:none;border:1px solid transparent; border-radius:3px; text-indent:5px;height:18px;min-height:18px;max-height:20px;opacity:1 !important;line-height: 1.0;display: block;"
                                       [disabled]="IsDisabled"
                                       [(ngModel)]="InputValue"
                                       (focus)="onFocus()"
                                       (blur)="onBlur()"
                                       (keydown)="onkeydown($event)"
                                       (keyup)="onkeyup($event)"
                                       class="DatePickerInput"
                                       autocomplete="off" [placeholder]="DatePickerPlaceHolder" ondrop="return false"/>
                            </td>
                            <td style="width:20px">
                                <button [id]="CalendarButtonId" tabindex="-1" class="Button CalendarButton RightCenter CustomButton" (click)="ToggleCalendar()" (focus)="OnBtnFocus()" [disabled]="IsDisabled">

                                </button>
                            </td>
                        </tr>
                    </table> -->


                </div>
            </td>

            <td *ngIf="!HideColumns" style="width: 18px;">
                <HelpIcon *ngIf="ShowHelp" [HideHeader]="true" [Text]="ObjectFieldHelp" [IconSize]="15"></HelpIcon>
            </td>

            <td *ngIf="!HideColumns && !HideLastColumn" style="width: 18px; position: relative;">
                <div></div>
            </td>
        </tr>
    </table>



    <div FixedPosition [UseDefaultPosition]="UseDefaultPosition" [ElementId]="DropDownId" [RelativeElementId]="DatePickerInputId" [VertDisplacement]="22" [HorizDisplacement]="2"
         [PopupWidth]="184" [ComponentHight]="183"
         [id]="DropDownId" *ngIf="IsDateDropDownOpen" (mouseover)="OnCalendarMouseOver()" (mouseout)="OnCalendarMouseOut()"
         tabindex="-1" class="DatePickerCalendar" [ngStyle]="DatePickerCalendarStyle" [ComponentType]="'datepicker'">
        <LogCalendar [ToggleOpened]="IsCalendarOpen" [SelectedDate]="SelectedDate" (SelectedDateChanged)="OnSelectedDateChanged($event)"></LogCalendar>
    </div>

    <div FixedPosition [UseDefaultPosition]="UseDefaultPosition" [ElementId]="DropDownId" [RelativeElementId]="DatePickerInputId" [VertDisplacement]="22" [HorizDisplacement]="2"
         [PopupWidth]="180" [ComponentHight]="152"
         [id]="DropDownId" *ngIf="IsTimeDropDownOpen" (mouseover)="OnCalendarMouseOver()" (mouseout)="OnCalendarMouseOut()"
         tabindex="-1" class="DatePickerCalendar" [ngStyle]="DatePickerCalendarStyle" [ComponentType]="'datepicker'">
        <LogTimePicker [TimeMode]="TimeMode" [ToggleOpened]="IsCalendarOpen" [SelectedTime]="SelectedDate" (OnSelectedTimeChanged)="OnSelectedTimeChanged($event)" ></LogTimePicker>
    </div>
</div>
