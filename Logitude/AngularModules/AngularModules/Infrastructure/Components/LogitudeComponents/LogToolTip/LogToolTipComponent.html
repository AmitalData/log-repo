<!-- info icon -->
<span (click)="OnClickInsideToolTip()"  float-start [attr.id]="'tooltip'+this.name" id="t"
    class="small-tooltip" (mouseover)="OnMouseOver()" (mouseleave)="OnMouseLeave()">

    <!--<img src="./Images/Info.png" width="18" height="18" />-->
    <div [attr.id]="this.mode+this.name"  *ngIf="mode == 'Info'" class="ConfirmIcon">!</div>
    <img  [attr.id]="this.mode+this.name" *ngIf="mode == 'Warning'" src="./Images/Warning_icon_24.png" alt="warning" style="width: 18px;" />
    <img  [attr.id]="this.mode+this.name"   *ngIf="mode == 'error'" src="./Images/error-16.png" alt="error" style="width: 18px;" />
    <img  [attr.id]="this.mode+this.name"  *ngIf="mode == 'Info2'" style="margin-top:2px;" class="CenterCenter"   src ="./Images/Info.png" />
    <div  [style.max-width.px]="MaxWidthOfToolTip? MaxWidthOfToolTip :'auto'"   [attr.id]="'tooltip-body'+this.name" class="small-tooltip-body">
        <!-- <div class="popup-arrow"></div> -->
        <div *ngIf="title" text-start class="tooltip-header blue-title">
            {{title}}
        </div>
        <div [style.max-height]="Scrollable? '200px':'auto'"   class="tooltip-text" [style.padding]="isRTL?'1px 3px 1px 20px' : '1px 20px 1px 3px'" style="max-width: 900px; white-space: initial;overflow-y: auto;">

            <div [style.top.px]="ArrowTop" [attr.id]="'tooltip-arrow'+this.name" [className]="GetArrowClassName()"></div>
            <div [style.top.px]="ArrowTop" [attr.id]="'tooltip-arrow2'+this.name" [className]="GetArrowClassName()+'2'"></div>

            <ng-content ></ng-content>

        </div>
    </div>

</span>
