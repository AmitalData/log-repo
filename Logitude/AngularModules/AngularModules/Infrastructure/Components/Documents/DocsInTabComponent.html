
<style>
    .FormFieldRow {
        height: 25px;
    }
</style>





<div *ngIf="IsStardLoadPage" class="TabHolder">
    <table>
        <tr class="TabTitleRow">
            <td>
                <table>
                    <tr>
                        <td style="width: 1px;">{{TabHeaderTextCode | TextCodeTranslationPipe}}</td>

                        <td>
                            <div></div>
                        </td>

                        <td style="width:1px">
                            <button *ngIf="DownloadAllVisibile" class="Button" (click)="DownloadAllClick()"
                                    [disabled]="!HasDocuments">
                                <div style="display:inline">
                                    <span>Download Documents</span>
                                </div>
                            </button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width:1px">
                            <button [disabled]="!UndoReceivedButtonEnable" class="Button" (click)="UndoReceivedButtonClicked()">
                                <div style="display:inline">
                                    <span>
                                        <img style="height:15px;width:15px;vertical-align:central"
                                             src="./Images/Undo.png" />
                                    </span>
                                    <span>{{'DocsIn.B.UndoReceived' | TextCodeTranslationPipe}}</span>
                                </div>
                            </button>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width:1px">
                            <button [disabled]="!DeleteAttachmentButtonEnable" class="Button" (click)="DeleteAttachmentButtonClicked()">
                                <div style="display:inline">
                                    <span>
                                        <img style="vertical-align:top;margin-top:2px"
                                             src="./Images/RedX.png" />
                                    </span>
                                    <span>{{'DocsIn.B.DeleteAttachment' | TextCodeTranslationPipe}}</span>
                                </div>
                            </button>
                        </td>

                        <td style="width:15px;">
                            <div style="width:1px; height: 22px; background: #DADADA; margin:auto;"></div>
                        </td>

                        <td style="width: 150px;">
                            <SearchTextBox [ObjectTableName]="'Shipment'" [PlaceHolder]="'Search'"
                                           (SearchTextChangeEvent)="onSearchTextChangeEvent($event)"></SearchTextBox>
                        </td>

                        <td style="width: 7px;">
                            <div></div>
                        </td>

                        <td style="width: 21px;">
                            <IconButton [Name]="'Refresh'" (click)="RefreshButtonClicked()"></IconButton>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>
                    </tr>
                </table>
            </td>

        </tr>

        <tr>
            <td style="vertical-align:top">
                <!--<div  class="MediaFill">-->
                <logitude-edit-grid (SelectedItemChanged)="OnSelectedDocumentInList($event)" [SelectedRow]="SelectedExternalViewModel" (MouseleaveChanged)="OnMouseleave($event)" (MouseOverChanged)="OnMouseOver($event)"
                                    [HeaderHeight]="25" GridHeight="100%" [ItemSource]="ItemsSource">

                    <!--Attach-->
                    <log-column [width]="'60'" [header]="'DocsIn.O.Attach' | TextCodeTranslationPipe">

                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                <table>
                                    <tr>

                                        <td class="CellStretched" [style.width]="IsRTL ? 'initial' : '60px'" [style.min-width]="IsRTL ? 'initial' : '60px'" [style.max-width]="IsRTL ? 'initial' : '60px'" style="position: relative;">

                                            <div *ngIf="item.SetAttachedIconVisibility" [ngSwitch]="item.Extention">
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'PDF'" src="./Images/FileIcons/File-pdf-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'TXT'" src="./Images/FileIcons/txt_48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'XLS'" src="./Images/FileIcons/Microsoft-Office-Excel-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'XLSX'" src="./Images/FileIcons/Microsoft-Office-Excel-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'DOC'" src="./Images/FileIcons/Microsoft-Office-Word-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'DOCX'" src="./Images/FileIcons/Microsoft-Office-Word-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'PPT'" src="./Images/FileIcons/Microsoft-Office-PowerPoint-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'PPTX'" src="./Images/FileIcons/Microsoft-Office-PowerPoint-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'ZIP'" src="./Images/FileIcons/Zip-icon.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" *ngSwitchCase="'RAR'"
                                                     src="./Images/FileIcons/Zip-icon.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px"
                                                     *ngSwitchCase="'XML'" src="./Images/FileIcons/Document-xml-48.png" />
                                                <img class="CenterCenter" (click)="item.VeiwDocumentButtonClicked(item)" [attr.title]="'View'" style="width:20px;height:20px" *ngSwitchDefault
                                                     src="./Images/FileIcons/attachment-icon.png" />
                                            </div>

                                        </td>

                                    </tr>
                                </table>

                            </log-cell-template>

                        </ng-template>


                    </log-column>

                    <!--File Name-->
                    <log-column [width]="'200'" [header]="'File Name'">

                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>


                                <table>
                                    <tr>

                                        <td>
                                            <div [style.width]="IsRTL ? 'initial' : '200px'" class="TextTrimming">
                                                {{item.FileName}}
                                            </div>

                                        </td>
                                    </tr>
                                </table>
                            </log-cell-template>
                        </ng-template>

                    </log-column>

                    <!--Actions-->
                    <log-column [width]="'190'" [header]="'DocsIn.O.Actions' | TextCodeTranslationPipe">

                        <ng-template let-item>

                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>

                                <table>
                                    <tr>


                                        <td class="CellStretched" [style.width]="IsRTL ? 'initial' : '190px'" [style.min-width]="IsRTL ? 'initial' : '190px'" [style.max-width]="IsRTL ? 'initial' : '190px'" style="position: relative;">
                                            <button id="{{'SetReceivedDocumentbtn' | IdGeneratorPipe}}" *ngIf="item.SetReceivedButtonVisibility" style="display:inline;width:75px;height:20px;font-size:10px;vertical-align:top;text-align:left;margin-top:2px" class="Button" (click)="item.SetReceivedButtonClicked()">

                                                {{'DocsIn.B.SetReceived' | TextCodeTranslationPipe}}
                                            </button>

                                            <button [style.margin-left]="item.SetReceivedButtonVisibility? '5px':'0px'" id="{{'UploadDocumentdbtn' | IdGeneratorPipe}}" [disabled]="IsClickToUpload" *ngIf="item.SetAttachedButtonVisibility" style="display:inline;height:20px;width:50px;font-size:10px;vertical-align:top;text-align:left;margin-top:2px;" class="Button" (click)="item.UploadButtonClicked()">
                                                {{'DocsIn.B.Upload' | TextCodeTranslationPipe}}
                                            </button>



                                            <button [style.margin-left]="item.SetReceivedButtonVisibility || item.SetAttachedButtonVisibility ? '5px':'0px'" *ngIf="item.DownloadButtonVisibility" style="display:inline;height:20px;width:35px;font-size:10px;vertical-align:top;text-align:left;margin-top:2px;"
                                                    class="Button" (click)="item.VeiwDocumentButtonClicked(item)">
                                                {{'DocsIn.B.View' | TextCodeTranslationPipe}}

                                            </button>


                                            <button *ngIf="item.DownloadButtonVisibility"
                                                    style="display:inline;width:64px;vertical-align:top;height:20px;text-align:left;margin-top:2px;margin-left:5px" class="Button"
                                                    (click)="item.AdditionalButtonClicked()">
                                                <span style="margin-left:-0px;font-size:11px">
                                                    {{'DocsIn.B.Additional' |TextCodeTranslationPipe}}
                                                </span>
                                            </button>
                                        </td>


                                    </tr>
                                </table>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!--Name-->
                    <log-column [width]="'200'" [header]="'DocsIn.O.Name' | TextCodeTranslationPipe">


                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                <table>
                                    <tr>
                                        <td>
                                            <div [style.width]="IsRTL ? 'initial' : '200px'" style="width:200px" class="TextTrimming">
                                                {{item.Name}}
                                            </div>

                                        </td>

                                    </tr>
                                </table>

                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!--ChildReference-->
                    <log-column [width]="'150'" [header]="'DocsIn.O.ReferenceNo' | TextCodeTranslationPipe">

                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>

                                <table>
                                    <tr>


                                        <td class="CellStretched" [style.width]="IsRTL ? 'initial' : '150px'" [style.min-width]="IsRTL ? 'initial' : '150px'" [style.max-width]="IsRTL ? 'initial' : '150px'" style="position: relative;">


                                            {{item.ChildReference}}


                                        </td>

                                    </tr>
                                </table>

                            </log-cell-template>

                        </ng-template>
                    </log-column>

                    <!--ReceivedBy-->
                    <log-column [width]="'90'" [header]="'DocsIn.O.ReceivedBy' | TextCodeTranslationPipe">


                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>

                                <table>
                                    <tr>


                                        <td class="GridViewCell" [style.width]="IsRTL ? 'initial' : '90px'" [style.min-width]="IsRTL ? 'initial' : '90px'" [style.max-width]="IsRTL ? 'initial' : '90px'" style="position: relative;">

                                            {{item.ReceivedByUserName}}

                                        </td>

                                    </tr>
                                </table>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!--ReceivedDate-->
                    <log-column [width]="'150'" [header]="'DocsIn.O.ReceivedDate' | TextCodeTranslationPipe">

                        <ng-template let-item>

                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>

                                <table>
                                    <tr class="FormFieldRow">
                                        <td [style.width]="IsRTL ? 'initial' : '100px'" [style.min-width]="IsRTL ? 'initial' : '100px'" [style.max-width]="IsRTL ? 'initial' : '100px'" style="position:relative;">
                                            <LogDatePicker *ngIf="item.Received || item.DocumentHasFile"
                                                           (ValueChanged)="item.EditReceiveDate(item,$event)" [ObjectFieldName]="'ReceivedDate'" [ObjectTableName]="ObjectTableName"
                                                           [NoObjectField]="true"
                                                           [DataContext]="item" [SelectedDateValue]="item.ReceivedDate" [HideColumns]="true"></LogDatePicker>

                                        </td>
                                    </tr>
                                </table>
                            </log-cell-template>
                        </ng-template>
                    </log-column>

                    <!--FollowUp-->
                    <log-column [width]="'70'" [header]="'Follow-Up'">

                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                <div style="width: 100%; height: 100%; position: relative;">
                                    <div (mouseleave)="OnFollowMouseleave(item)" (mouseover)="OnFollowMouseOver(item)" class="CenterCenter">
                                        <span (click)="AddFollowUp(item)" style="width:20px">

                                            <img *ngIf="item.ShowFollowUp || item.HasFollowUp"
                                                 src="./_Resources/Images/Icons/Followups/Followup_Black.png" />
                                            <img style="opacity:0.7" *ngIf="!item.ShowFollowUp && !item.HasFollowUp" src="./_Resources/Images/Icons/Followups/Followup.png" />


                                        </span>
                                    </div>
                                </div>
                            </log-cell-template>
                        </ng-template>


                    </log-column>

                    <!--Note-->
                    <log-column [width]="'150'" [header]="'DocsIn.O.Notes' | TextCodeTranslationPipe">

                        <ng-template let-item>
                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>

                                <table>
                                    <tr>
                                        <td [style.width]="IsRTL ? 'initial' : '150px'" [style.min-width]="IsRTL ? 'initial' : '150px'" [style.max-width]="IsRTL ? 'initial' : '150px'" style="position:relative;">

                                            <input [attr.id]="item.Key" (change)="item.EditNote(item)"
                                                   type="text" autocomplete="off" style="height:22px;width:140px" [(ngModel)]="item.Note" value="" />

                                        </td>

                                    </tr>
                                </table>
                            </log-cell-template>
                        </ng-template>

                        <!--IsRequested-->
                    </log-column>

                    <!--IsRequired-->
                    <log-column [width]="'90'" [header]="'Is Required'">

                        <ng-template let-item>

                            <log-cell-template [IgnoreMods]="true" #logcelltemplate>
                                <div style="width: 100%; height: 100%; position: relative;">
                                    <div class="CenterCenter">
                                        <CheckBox [IsChecked]="item.IsRequested" (Checked)="item.IsRequested =$event"></CheckBox>
                                    </div>
                                </div>




                            </log-cell-template>
                        </ng-template>
                    </log-column>

                </logitude-edit-grid>
                <!--</div>-->
            </td>
        </tr>
    </table>
</div>
