<div class="MediaFillAbsolute" style="background: white;">
  <div class="MarginAbsolute10">
    <div class="MediaFill CurvedArea">
      <div>

        <div style="display: flex;margin: 10px;">
          <div [title]="Dashboard?.Name" style="width: 100px;">
            <BackButton [Text]="Title" (click)="BackButtonClicked()"></BackButton>
          </div>
          <div class="TabTitleRow TextTrimming" style="margin: 0px 10px;padding-top: 3px;">
            {{rowData?.length}} {{DataPointSelection?.Widget?.Title}} </div>
        </div>

        <ValidationSummary *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>

        <div class="db-edit-screen-holder db-center">

          <div style="width: 21px;" class="db-center">
            <IconButton [Name]="'Refresh'" (click)="RefreshBtnClick()"></IconButton>
          </div>

        </div>

        <div style="position: absolute;height: calc(100% - 80px); width: 100%;">
          <ag-grid-angular style="width:100%; height:100%;"
                  #agGrid
                  id="myGrid"
                  [context]="context"
                  [enableCellChangeFlash]="true"
                  class="ag-theme-balham"
                  [rowData]="rowData"
                  [columnDefs]="columns"
                  [rowSelection]="'multiple'"
                  [multiSortKey]="'ctrl'"
                  [accentedSort]="'true'"
                  [suppressFieldDotNotation]="true"
                  (gridReady)="onGridReady($event)"
                  (sortChanged)="onSortChanged($event)"
                  (columnResized)="onColumnResized($event)"
                  (columnMoved)="onColumnMoved($event)">
          </ag-grid-angular>
        </div>


      </div>
    </div>
  </div>
</div>
