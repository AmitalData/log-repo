
<div class="dl-tab-container">
    <div style="min-width: 1220px;">
        <table>
            <tr style="height:10px;">
                <td>
                    <div></div>
                </td>
            </tr>

            <tr style="display: flex; align-items: center; justify-content: space-between;width: 100%;">
                <div style="margin-left: 12px;max-width: 400px;">
                    <td style="width: 1px; max-width: 340px;">
                        <div class="TextTrimming">
                            <span style="font-size: 14px; color: #292D30;font-weight: 600;line-height: 21px;">{{SelectedDashboardName}}</span>
                          </div>
                    </td>
                    
                    <td style="width: 1px;">
                        <IconButton [style.visibility]="IsEditDashboardButtonVisible ? 'visible':'hidden'" [Left]="3" [Name]="'Edit'" [IsSmall]="true"
                                    (click)="EditDashboardClicked()"></IconButton>
                    </td>
                    <td style="font-size: 10px; color: #292D30;font-weight: 600; padding-top:2px; white-space: pre">
                        {{DateRangeLabel}}
                    </td>
                </div>
                <div style="display: flex;">
                    <span (click)="ViewDashboardLayoutClicked()"  [class.dashboard-outline-active-btn]="!IsEditLayoutModeActive" class="dashboard-outline-btn">View</span>
                    <span (click)="EditDashboardLayoutClicked()" [class.dashboard-outline-active-btn]="IsEditLayoutModeActive" class="dashboard-outline-btn">Edit</span>
                </div>
                <div [style.padding-right]="IsGlobalFiltersOpened ? '0px' : '8px'" style="width: auto; min-width: 200px; display: flex; align-items: center; justify-content: flex-end;">
                    <td style="width: 55px; min-width: 55px;" *ngIf="IsEditLayoutModeActive">
                        <button *ngIf="!HasChanges" class="Button" style="right: 8px;">
                            <img src="./Images/Buttons/Save.png" class="LeftCenter" style="margin-left:2px;" />
                            <span style=" line-height: 19px; vertical-align: middle; margin-left: 17px;">Save</span>
                        </button>
    
                        <button *ngIf="HasChanges" class="EntityChangesButton" (click)="SaveDashboard()"  style="right: 8px;">
                            <img src="./Images/Buttons/Save.Red.png" class="LeftCenter" style="margin-left:2px;" />
                            <span style=" line-height: 19px; vertical-align: middle; margin-left: 17px;">Save</span>
                        </button>
                    </td>
                    <td style="width: auto; min-width: 55px;" *ngIf="IsEditLayoutModeActive">
                        <button class="BlueButton" (click)="HereClicked()">Add Widget</button>
                    </td>
    
                    <td style="width: auto; min-width: 87px; height: 22px; margin-right: 8px;" *ngIf="!IsEditLayoutModeActive">
                        <button class="TabButton Button" (click)="this.IsGlobalFiltersOpened = !this.IsGlobalFiltersOpened">
                            <img style="width: 12px; height: 13px;" src="./Images/FilterGrayTrans.png" />
                            {{HideShowFilterText}}              
                        </button>
                    </td>
    
                    <td style="width: 69px;" *ngIf="!IsEditLayoutModeActive">
                        <button class="TabButton Button" (click)="RefreshLayoutClicked()">
                            <img style="width: 15px; height: 17px;" src="./Images/Buttons/Refresh.png" />
                            Refresh
                        </button>
                    </td>
    
                    <td style="width: 8px;" *ngIf="!IsEditLayoutModeActive">
                        <div></div>
                    </td>
    
                    <td style="width:24px;" *ngIf="!IsEditLayoutModeActive">
                        <div tabindex="0" class="ToggleButton">
                            <img style="width:2px; height: 12px; top: 10px; left: 3px; position: absolute;" src="./Images/Buttons/threedots.png" />
    
                            <div class="ToggleButtonMenu" style="top: 22px;">
                                <button (click)="CopyDashboardClicked()" [disabled]="!CanCopy">Copy Dashboard</button>
                            </div>
                        </div>
                    </td>
                </div>
               
            </tr>
        </table>
    </div>

    <div *ngIf="SelectedDashboard" [hidden]="!IsGlobalFiltersOpened" class="dl-flobal-filter-container">
        <GlobalFilter [Dashboard]="SelectedDashboard" (ApplyFilters)="ApplyFilters($event)" (ApplyFiltersCountChange)="ApplyFiltersCountChange($event)"></GlobalFilter>
    </div>

    <div [hidden]="IsEmptyDashboardVisible" class="custom-layout-container">
        <custom-layout (onReactChangeLayouts)="onReactChangeLayouts($event)"
                       (openEditWidget)="openEditWidget($event)" [IsEditLayout]="IsEditLayoutModeActive"
                       [DashboardDataBinding]="DashboardDataBinding" [SelectedDashboard]="SelectedDashboard"></custom-layout>
    </div>

    <div *ngIf="IsEmptyDashboardVisible" class="MediaFillRelative">
        <div class="dl-info-card">
            <div class="dl-info-image-cotainer">
                <img class="TopCenter" style="position: unset;width: 290px; height: 202px;"
                     src="./Images/Charts/Empty-Dashboard3.png" />
            </div>

            <div style="margin-top: 20px;">
                <div class="dl-info-center-div">
                    <p class="dl-info-header-text">
                        {{
                        IsPermissionMessageVisible ? "Sorry, you have no permissions" :
                        "You don’t have any information here"
                        }}
                    </p>
                </div>
                <div class="dl-info-center-div" *ngIf="!IsPermissionMessageVisible">
                    <p class="dl-info-description-text">
                        There are currently no widgets.
                        <br> It is time to add a new one
                    </p>
                </div>
            </div>

            <td class="dl-info-center-div" style="margin-top: 12px;" *ngIf="!IsPermissionMessageVisible">
                <button class="Button" (click)="HereClicked()">
                    <svg width="20" height="20" viewBox="0 0 5 5"
                         style="display: inline-block; vertical-align: middle;">
                        <path fill="#4D8ABB" d="M2 1 h1 v1 h1 v1 h-1 v1 h-1 v-1 h-1 v-1 h1 z" />
                    </svg>
                    Add new widget
                </button>
            </td>

        </div>
    </div>


</div>
