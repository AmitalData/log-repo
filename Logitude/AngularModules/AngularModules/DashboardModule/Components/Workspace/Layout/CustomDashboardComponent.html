
<div style="height: 100%;" class="Dashboard-body">
    <div class="FormFieldRow" style="height: 23px;margin-top: 8px;margin-bottom: 6px;">
        <table>
            <tr style="height:22px;">
                <td style="width: 1px; font-size: 18px; color: #292D30; font-weight: 600; line-height: 120%;">
                    Dashboards
                </td>

                <td >
                    <div></div>
                </td>

                <td style="width:200px; height:22px;" *ngIf="dashbaordCount > 0">
                    <dashboard-dropdown [DisplayMemberPath]="'Name'"
                                        [SelectedItem]="SelectedDashboard"
                                        [ItemsSource]="ItemsSource"
                                        (SelectedItemChanged)="DropDwonSelectionChanged($event)"
                                        [Loading]="DashboardDropdownLoading"
                                        [SectionsItemsSource]="SectionsItemsSource">
                    </dashboard-dropdown>
                </td>

                <td class="Table-cell10" >
                    <div></div>
                </td>

                <td style="width: 117px; height: 22px;" *ngIf="dashbaordCount > 0">
                    <button class="Dashboard-create-button" (click)="AddDashboardClicked()">
                        <img style="width:10px; height: 10px; margin-right: 4px; color: #F3942F;" src="./Images/Buttons/add.orange.png" />
                        Create dashboard
                    </button>
                </td>
            </tr>
        </table>
    </div>

    <div class="DashboardTab">

        <div class="DashboardTabHead">
            <ul style="display: flex;">
                <li *ngFor="let item of DashboardsTabs" class="DashboardTabHeadLi" [class.DashboardTabSelected]="item.Dashboard.Id == SelectedDashboard?.Id">
                    <div class="DashboardInnerTab">
                        <p (click)="TabSelectionChanged(item)" class="dl-tab-text TextTrimming">{{item.Name}}</p>
                        <div class="dl-tab-bts-container">
                            <div class="dl-tab-btn-div" *ngIf="!item.IsPinned && CanPinn" (click)="PinDashboardTabClicked(item)" data-toggle="tooltip" data-placement="top" title="Pin tab">
                                <svg class="dl-pin-image" width="11" height="11" viewBox="0 0 11 11" fill="none">
                                    <path class="dl-tab-btn" d="M6.11073 0L11 4.88927L10.1847 5.70396L9.77739 5.29662L7.33333 7.74068L6.92599 9.77797L6.11073 10.5927L3.66667 8.14802L0.814687 11L0 10.1853L2.85198 7.33333L0.407343 4.88927L1.22203 4.07401L3.2599 3.66667L5.70396 1.22261L5.29662 0.815263L6.1113 0H6.11073ZM6.51865 2.03729L3.82741 4.72795L2.2015 5.05348L5.94652 8.7985L6.27148 7.17259L8.96271 4.48193L6.51865 2.03729Z" fill="#737578"/>
                                </svg>
                            </div>
                          
                            <div class="dl-tab-btn-div" *ngIf="item.IsPinned" (click)="UnpinDashboardTabClicked(item)" data-toggle="tooltip" data-placement="top" title="Unpin tab">
                                <svg class="dl-tab-svg" width="9" height="11" viewBox="0 0 9 11" fill="none">
                                    <path class="dl-tab-btn" d="M8.35714 0V1.1H7.71429V4.4L9 6.05V7.15H5.14286V11H3.85714V7.15H0V6.05L1.28571 4.4V1.1H0.642857V0H8.35714ZM2.57143 1.1V4.7333L1.54543 6.05H7.45457L6.42857 4.7333V1.1H2.57143Z" fill="#737578"/>
                                </svg>
                            </div>
                  
                            <div class="dl-tab-btn-div" *ngIf="!item.IsPinned" (click)="CloseDashboardTabClicked(item)">
                                <svg class="dl-tab-svg" width="10" height="10" viewBox="0 0 8 8" fill="none">
                                    <path class="dl-tab-btn" d="M4 3.11125L7.11125 0L8 0.888749L4.88875 4L8 7.11125L7.11125 8L4 4.88875L0.888749 8L0 7.11125L3.11125 4L0 0.888749L0.888749 0L4 3.11125Z" />
                                </svg>
                            </div>
              
                        </div>
                    </div>
                </li>
            </ul>
        </div>

        <div class="DashboardTabBody" [ngStyle]="{'top': dashbaordCount > 0 ? '19px': '0'}">
            <div *ngIf="dashbaordCount > 0 && SelectedDashboard && ShowDashboardTab" style="height: 100%;">
                <dashboard-tab [DashboardId]="SelectedDashboard.Id"
                               [OpenEditLayout]="OpenEditLayout"
                               [PresetFilters]="PresetFilters"
                               (DashboardDeleted)="RefreshTabsAfterDelete($event)"
                               (DashboardChanged)="DashboardChanged($event)"
                               (RefreshAfterCopy)="RefreshAfterCopy($event)"
                               (TabHasChanges)="HasChanges = $event"
                               (DashboardEntity)="DashboardEntity = $event"
                               >
                </dashboard-tab>
            </div>
        </div>

        <div class="DashboardTabBody" style="top: 0;" *ngIf="dashbaordCount != -1 && (dashbaordCount == 0 || DashboardsTabs.length == 0)">
            <div class="dl-info-card">

                <div class="dl-info-image-cotainer">
                    <img class="TopCenter" style="position: unset;width: 290px; height: 202px;"
                         src="./Images/Charts/Empty-Dashboard3.png" />
                </div>

                <div style="margin-top: 20px;">
                    <div class="dl-info-center-div">
                        <p class="dl-info-header-text"> You don’t have any information here</p>
                    </div>
                    <div class="dl-info-center-div">
                        <p class="dl-info-description-text">
                            {{MainMessage}}
                            <br> 
                            {{MainSubMessage}}
                        </p>
                    </div>
                </div>

                <div class="dl-info-center-div" style="margin-top: 12px;">
                    <button class="Button" (click)="AddDashboardClicked()">
                        <svg width="20" height="20" viewBox="0 0 5 5"
                             style="display: inline-block; vertical-align: middle;">
                            <path fill="#4D8ABB" d="M2 1 h1 v1 h1 v1 h-1 v1 h-1 v-1 h-1 v-1 h1 z" />
                        </svg>
                        Add new dashboard
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
