<div style="position: relative;display: inline-block;">

    <div class="db-drop-container" [ngStyle]="{ 'border-color': IsOpen ? '#5FAFDA': '#D9D9D9' }"
        (click)="OpenCloseDropDown()">
        <p class="db-drop-selected-text" [title]="GetSelectedItemText(SelectedItem)" [ngStyle]="!SelectedItem && {'color': '#D9D9D9'}">{{ GetSelectedItemText(SelectedItem) }}</p>
        <span class="db-drop-pic" [ngClass]="IsOpen ? 'db-drop-arrow-up' : 'db-drop-arrow-down'"></span>
    </div>

    <div class="db-dropdown-list" [ngClass]="{'dropdown-open' : IsOpen}">
        <div class="db-dropdown-search-section">
            <div class="db-dropdown-search-container">
                <img src="./Images/Charts/db-search-icon.png" class="db-dropdown-search-icon">
                <input type="text" class="db-dropdown-search-text" [(ngModel)]="SearchText" [disabled]="Loading || !ItemsSource"
                    placeholder="Search by name" (input)="onSearchChange($event.target.value)">
            </div>
        </div>
        <div class="db-dropdown-scroll">
            <div *ngFor="let sectionItem of SectionsItemsSource">
                <p class="db-drop-section-text">{{sectionItem.Name}}</p>

                <ul role="listbox" aria-expanded="false">
                    <ng-container *ngIf="!Loading">
                        <li *ngFor="let item of GetSectionDisplayItemsSource(sectionItem.Code)" (click)="SelectItem(item)" [title]="GetItemText(item)">
                            <p class="db-drop-item-text">{{ GetItemText(item) }}</p>
                        </li>
                    </ng-container>

                    <ng-container *ngIf="Loading">
                        <li *ngFor="let item of SkeletonCount" style="cursor: default;pointer-events: none;">
                            <p class="card__desc-text"></p>
                        </li>
                    </ng-container>
                </ul>
            </div>            
        </div>

    </div>

</div>
