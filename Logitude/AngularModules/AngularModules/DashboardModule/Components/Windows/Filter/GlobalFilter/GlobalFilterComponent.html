<div style="height: 100%;">
    <div class="dl-global-filters-container">
        <div *ngIf="ShowFilters">
            <GlobalFilterItem style="display: inline-flex" *ngFor="let item of FilterItems; let i = index"
                [(FilterItem)]="FilterItems[i]" [Position]="i" [HasKpiChart]="HasKpiChart">
            </GlobalFilterItem>
        </div>
    </div>
    <div class="dl-global-filter-btn-container">
        <p class="dl-apply-filter-text" (click)="ClearFiltersClick()">Clear Filters</p>

        <div style="width: 89.31px">
            <button *ngIf="!FilterHasChanges" class="TabButton Button" (click)="ApplyFiltersClick()">
                <img style="width: 12px; height: 13px;" src="./Images/GrayTick.png" />
                Apply filters
            </button>

            <button *ngIf="FilterHasChanges" class="TabButton_orange Button" (click)="ApplyFiltersClick()">
                <img style="width: 12px; height: 13px;" src="./Images/GrayTick.png" />
                Apply filters
            </button>
        </div>
    </div>
</div>
