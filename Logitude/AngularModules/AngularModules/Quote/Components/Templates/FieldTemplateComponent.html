
<table *ngIf="Entity">
    <tr>
        <td>
            <div class="MediaFill">

                <div *ngIf="FieldName == 'FollowUpDate'" [ngStyle]="{color: FieldValue | FollowUpDatePipe:'F'}">{{FieldValue | DateTimeToDatePipe}}</div>
                <div *ngIf="FieldName == 'AcceptedDate'">{{FieldValue | DateTimePipe :'DT'}}</div>

                <div *ngIf="FieldName == 'Notes'">{{FieldValue}}</div>

                <table *ngIf="FieldName == 'Routing'">
                    <tr>
                        <td style="width: 16px; min-width: 16px;">
                            <img style="width: 16px; height: 16px; float:left" [attr.src]="Entity.FromCountryCode | CountryFlagPipe" [attr.title]="Entity.FromCountryName" />
                        </td>

                        <td style="width:5px;">
                            <div></div>
                        </td>

                        <td style="color:#282E30; width:2px;">></td>

                        <td style="width:5px;">
                            <div></div>
                        </td>

                        <td style="width: 16px; min-width: 16px;">
                            <img style="width: 16px; height: 16px; float:left" [attr.src]="Entity.ToCountryCode | CountryFlagPipe" [attr.title]="Entity.ToCountryName" />
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>

                <table *ngIf="FieldName == 'StageName'">
                    <tr>
                        <td style="width:70px;" [ngStyle]="{color: FieldValue | StringToColorPipe}">{{FieldValue}}</td>

                        <td *ngIf="Entity.LastStageDate">
                            <div class="Label" style="font-size: 10px;" [attr.title]="Entity.LastStageDate | StageAgePipe">({{Entity.LastStageDate | StageAgePipe:'1'}})</div>
                        </td>

                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>

                <table *ngIf="FieldName == 'DirectionId'">
                    <tr>
                        <td>
                            <div></div>
                        </td>
                        <td style="width: 15px; min-width: 15px; max-width: 15px; text-indent:0; padding:0;">
                            <img [attr.src]="'./Images/Directions/' + FieldValue + '.png'" title="Entity.DirectionName" style="margin:0; padding:0; vertical-align: middle;" />
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>

                <table *ngIf="FieldName == 'TransportModeId'">
                    <tr>
                        <td>
                            <div></div>
                        </td>
                        <td style="width: 15px; min-width: 15px; max-width: 15px; text-indent:0; padding:0;">
                            <img [attr.src]="'./Images/Icons/' + FieldValue + '.png'" title="Entity.TransportModeName" style="margin:0; padding:0; vertical-align: middle;" />
                        </td>
                        <td>
                            <div></div>
                        </td>
                    </tr>
                </table>

                <div *ngIf="FieldName == 'GrossWeight'|| FieldName == 'GrossWeightInKG' || FieldName == 'GrossWeightPerTon' || FieldName == 'VolumeInCBM'" class="TemplateTrimming">
                    <div class="TemplateTrimmingChild TextRight">{{FieldValue | NumbersPipe:'N2'}}</div>
                </div>

                <div *ngIf="FieldName == 'SentDate'" class="TemplateTrimming">
                    <div class="TemplateTrimmingChild">{{Entity[FieldName] | DateTimePipe:'DT'}}</div>
                </div>

                <div *ngIf="IsSpotLightTemplate == true" style="position:absolute;top:0;bottom:0;left:0;right:0;">
                    <div style="height:100%;width:100%;">

                    </div>
                </div>
            </div>
        </td>
    </tr>
</table>
