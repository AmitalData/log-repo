
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList" [SingleLine]="true"></ValidationSummary>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width: 120px;" class="Label">Shipper:</td>
                    <td style="width: 230px;">
                        <LogLov [ObjectFieldName]="'ShipperId'"
                                [SelectedValue]="DataContext.ShipperId"
                                [DataContext]="DataContext"
                                [LookUpTableName]="'Card'"
                                [DependencyFilter1Value]="'CS'">
                        </LogLov>
                    </td>
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 1px;">
        <td>
            <table>
                <tr class="FormFieldRow">
                    <td style="width: 120px;">
                        <CheckBox [IsChecked]="IsPartialSelection" (Checked)="IsPartialSelection = $event" [Text]="'Partial Selection'"></CheckBox>
                    </td>

                    <td style="width: 180px;">
                        <div></div>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <span class="Label">Total:</span>
                    </td>

                    <td>
                        <LogTextBox [ObjectFieldName]="'Total'" [Text]="Total" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <span class="Label">From:</span>
                    </td>

                    <td>
                        <LogTextBox [ObjectFieldName]="'From'" [Text]="From" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr class="FormFieldRow">
                    <td>
                        <span class="Label">To:</span>
                    </td>

                    <td>
                        <LogTextBox [ObjectFieldName]="'To'" [Text]="To" [DataContext]="DataContext"></LogTextBox>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <div></div>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
