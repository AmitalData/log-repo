
<table>
    <tr *ngIf="!IsEditingEnabled" style="height:1px;">
        <td>
            <div style="margin:1px">
                <label style="margin: 5px 0px 0px 0px">Please note that you can't Edit currency rates in the demo environment ! </label>
            </div>
        </td>
    </tr>

    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr *ngIf="WarningsList != null && WarningsList.length > 0" style="height:1px;">
        <td>
            <WarningSummary [ItemsSource]="WarningsList"></WarningSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">

                <tr style="height:1px;">
                    <td>
                        <table>
                            <tr style="height:22px;">
                                <td style="width:50px;">
                                    <LogLabel [ObjectFieldName]="'Code'" [DataContext]="DataContext" [TextCode]="'RatesTable.O.Code'"></LogLabel>
                                </td>

                                <td style="width:150px;">
                                    {{EntityPM.ForeignCurrencyCode}}
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr style="height:22px;">
                                <td>
                                    <LogLabel [ObjectFieldName]="'Name'" [DataContext]="DataContext" [TextCode]="'RatesTable.O.Name'"></LogLabel>
                                </td>

                                <td>
                                    {{EntityPM.ForeignCurrencyName}}
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr style="height:1px;">
                    <td>
                        <table>

                            <tr class="FormFieldRow">
                                <td style="width:70px;">
                                    <div></div>
                                </td>

                                <td style="width:120px;">
                                    <div></div>
                                </td>

                                <td style="width:75px;font-size: 12px;text-align:center;margin-left:10px;">
                                    {{'RatesTable.O.OldValues'|TextCodeTranslationPipe}}
                                </td>

                                <td style="width:1px;">
                                    <div></div>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td style="width:70px;">
                                    <LogLabel [ObjectFieldName]="'ValueDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:120px;">
                                    <LogDatePicker [ObjectFieldName]="'ValueDate'" [SelectedDateValue]="ValueDate" [ObjectTableName]="ObjectTableName" [InputType]="'date'" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                </td>

                                <td style="width:75px; font-size: 12px; text-align:center;margin-left:10px;padding-left:10px;">
                                    {{DataContext.CurrentValueDate| DateTimeToDatePipe}}
                                </td>

                                <td>
                                    <div></div>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [ObjectFieldName]="'Rate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td>
                                    <LogTextBox [ObjectFieldName]="'Rate'" [Text]="Rate" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext" [HideColumns]="true" [DigitsAfterPoint]="5"></LogTextBox>
                                </td>

                                <td style="width:75px; font-size: 12px; text-align:center;margin-left:10px;">
                                    {{DataContext.CurrentRate| RatesNumbersPipe:'N5'}} 
                                </td>

                                <td style="width:1px;">
                                    <button [disabled]="!IsEditingEnabled" class="Button" (click)="SetAsToday()">{{'RatesTable.B.SetAsToday' | TextCodeTranslationPipe}}</button>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div></div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td *ngIf="IsEditingEnabled" style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
