<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }
</style>

<table *ngIf="IsVisibile">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <div class="TableHolder" style="padding-top: 5px;">
                    <table>

                        <tr>
                            <td>
                                <table>
                                    <!-- Settings -->
                                    <tr style="height:1px;">
                                        <td>
                                            <table>
                                                <tr>
                                                    <td style="height: 100%">
                                                        <div class="SystemDefaultsBox">
                                                            <table>
                                                                <tr class="SystemDefaultsBoxHeader">
                                                                    <td>Settings</td>
                                                                </tr>
                                                                <tr class="FormFieldRow">
                                                                    <td style="padding-left: 5px; padding-right: 5px;">
                                                                        <table>
                                                                            <tr>
                                                                                <td style="width: 200px;">
                                                                                    <div></div>
                                                                                </td>

                                                                                <td style="width: 70px;">
                                                                                    <div style="color:black;font-size:12px;text-align:center;"> Potential </div>
                                                                                </td>

                                                                                <td style="width: 70px;">
                                                                                    <div style="color:black;font-size:12px;text-align:center;"> Active </div>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>
                                                                        </table>

                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td style="padding-left: 5px; padding-right: 5px;">
                                                                        <table class="FixedTable">
                                                                            <tr class="FormFieldRow">
                                                                                <td style="width: 220px;">
                                                                                    <LogLabel [ObjectFieldName]="'IsCustomerTelRequired'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>

                                                                                <td style="width: 80px;">
                                                                                    <LogCheckBox [ObjectFieldName]="'IsPotentialTelRequired'" [Checked]="IsPotentialTelRequired" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                </td>

                                                                                <td style="width: 80px;">
                                                                                    <LogCheckBox [ObjectFieldName]="'IsCustomerTelRequired'" [Checked]="IsCustomerTelRequired" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'IsCustomerFaxRequired'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <LogCheckBox [ObjectFieldName]="'IsPotentialFaxRequired'" [Checked]="IsPotentialFaxRequired" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                </td>

                                                                                <td>
                                                                                    <LogCheckBox [ObjectFieldName]="'IsCustomerFaxRequired'" [Checked]="IsCustomerFaxRequired" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'IsPickDelAdrsRequired'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>

                                                                                <td>
                                                                                    <LogCheckBox [ObjectFieldName]="'IsPickDelAdrsRequired'" [Checked]="IsPickDelAdrsRequired" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'IsCustomerAddress1Required'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>

                                                                                <td>
                                                                                    <LogCheckBox [ObjectFieldName]="'IsCustomerAddress1Required'" [Checked]="IsCustomerAddress1Required" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'HasPrimaryContact'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>

                                                                                <td>
                                                                                    <table>
                                                                                        <tr>
                                                                                            <td style="width:20px;">
                                                                                                <LogCheckBox [ObjectFieldName]="'HasPrimaryContact'" [Checked]="HasPrimaryContact" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogCheckBox>
                                                                                            </td>
                                                                                            <td style="width:20px;">
                                                                                                <HelpIcon [Text]="'The primary contact will only be required when activating a customer'"></HelpIcon>
                                                                                            </td>
                                                                                            <td>
                                                                                                <div></div>
                                                                                            </td>
                                                                                        </tr>
                                                                                    </table>
                                                                                   
                                                                                </td>

                                                                                <td>
                                                                                    <div></div>
                                                                                </td>
                                                                            </tr>


                                                                            <tr *ngIf="IsShowAreaDefaultQuestionnaire" class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [Text]="'Default Questionnaire'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                                                                </td>

                                                                                <td colspan="2">
                                                                                    <ComboBox [ItemsSource]="QuestionnaireList" [SelectedItem]="QuestionnaireSelected" (SelectedItemChanged)="QuestionnaireSelected = $event" [Binding]="'Name'"></ComboBox>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr><td colspan="4"><div></div></td></tr>
                                                                        </table>

                                                                    </td>
                                                                </tr>

                                                            </table>

                                                        </div>

                                                    </td>

                                                    <td style="width: 4px;">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                </table>
                            </td>
                        </tr>

                    </table>
                </div>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
