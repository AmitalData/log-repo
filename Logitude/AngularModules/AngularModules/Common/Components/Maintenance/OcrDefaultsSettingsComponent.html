<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }
</style>

<table *ngIf="IsVisibile">
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <ScrollViewer>
                <div class="TableHolder" style="padding-top: 5px;">
                    <table>

                        <tr>
                            <td>
                                <table>
                                    <!-- Settings -->
                                    <tr style="height:1px;">
                                        <td>
                                            <table>
                                                <tr>
                                                    <td style="height: 100%">
                                                        <div class="noselect">
                                                            <table>
                                                                <tr style="height: 10%">
                                                                    <td></td>
                                                                </tr>
                                                               
                                                                <tr>
                                                                    <td style="position: absolute; top:0px; bottom:0; left:0; right:0; margin:auto; padding: 10px; background: white;border-radius:0 5px 5px 0;">
                                                                        <table class="noselect">
                                                                            <tr class="FormFieldRow">


                                                                                <td style="width: 150px;">
                                                                                    <LogLabel [ObjectFieldName]="'AccountTypeCode'" [ObjectTableName]="ObjectTableName"
                                                                                              [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                            
                                                                                <td style="width: 160px;">
                                                                                    <LogLov tabindex="1" [ObjectFieldName]="'AccountTypeCode'"
                                                                                            [ObjectTableName]="ObjectTableName"
                                                                                            [DataContext]="DataContext"
                                                                                            [LookUpTableName]="'Customs.InvoiceType'"
                                                                                            [HideColumns]="true"
                                                                                            [FocusOnMe]="true"
                                                                                            [SelectedValue]="AccountTypeCode"
                                                                                           >
                                                                                    </LogLov>
                                                                                </td>
                                                                               

                                                                              

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">

                                                                                <td style="width: 130px;">
                                                                                    <LogLabel [ObjectFieldName]="'PartyRelationshipCode'" [ObjectTableName]="ObjectTableName"
                                                                                              [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                                                                <td style="width: 160px;">
                                                                                    <LogLov [ObjectFieldName]="'PartyRelationshipCode'"
                                                                                            [ObjectTableName]="ObjectTableName"
                                                                                            [DataContext]="DataContext"
                                                                                            [HideColumns]="true"
                                                                                            [SelectedValue]="PartyRelationshipCode"
                                                                                            [LookUpTableName]="'Customs.PartyRelationshipType'">
                                                                                    </LogLov>
                                                                                </td>
                                                                              

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                           

                                                                            <tr class="FormFieldRow">
                                                                                <td style="width: 130px;">
                                                                                    <LogLabel [ObjectFieldName]="'BuyerRoleCode'" [ObjectTableName]="ObjectTableName"
                                                                                              [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                                                                <td style="width: 160px;">
                                                                                    <LogLov [ObjectFieldName]="'BuyerRoleCode'"
                                                                                            [ObjectTableName]="ObjectTableName"
                                                                                            [DataContext]="DataContext"
                                                                                            [HideColumns]="true"
                                                                                            [SelectedValue]="BuyerRoleCode"
                                                                                            [LookUpTableName]="'Customs.BuyerRoleType'">
                                                                                    </LogLov>
                                                                                </td>

                                                                                <td><div></div></td>
                                                                            </tr>

                                                                            <tr class="FormFieldRow">
                                                                                <td style="width: 140px;">
                                                                                    <LogLabel [ObjectFieldName]="'ClaimReasonCode'" [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                                                                              [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                                                                <td style="width: 135px;">
                                                                                    <LogLov [ObjectFieldName]="'ClaimReasonCode'"
                                                                                            [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                                                                            [DataContext]="DataContext"
                                                                                            [HideColumns]="true"
                                                                                            [LookUpTableName]="'Customs.ClaimReasonType'">
                                                                                    </LogLov>
                                                                                </td>
                                        
                                                                            </tr>


                                                                            <tr  class="FormFieldRow">
                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'TransactionNatureCode'" [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                                                                              [DataContext]="DataContext"></LogLabel>
                                                                                </td>
                                        
                                                                                <td>
                                                                                    <LogLov [ObjectFieldName]="'TransactionNatureCode'"
                                                                                            [ObjectTableName]="'Customs.SupplierInvoiceItem'"
                                                                                            [DataContext]="DataContext"
                                                                                            [HideColumns]="true"
                                                                                            [LookUpTableName]="'Customs.TransactionNatureType'">
                                                                                    </LogLov>
                                                                                </td>
                                                                            </tr>

                                                                            <tr  class="FormFieldRow">

                                                                                <td>
                                                                                    <LogLabel [ObjectFieldName]="'ProcessTypeCode'" [ObjectTableName]="ObjectTableName"
                                                                                    [DataContext]="DataContext" [Text]="'Customs.SupplierInvoiceItemProcesType.F.ProcessTypeCode' | TextCodeTranslationPipe"></LogLabel>
                                                                                </td>
                                        
                                                                                <td>
                                                                                    <LogLov [ObjectFieldName]="'ProcessTypeCode'"
                                                                                    [ObjectTableName]="ObjectTableName"
                                                                                    [DataContext]="DataContext"
                                                                                    [HideColumns]="true"
                                                                                    [LookUpTableName]="'Customs.ItemGovernmentProcedureType'"
                                                                                    [FocusOnMe]="true">
                                                                                    </LogLov>

                                                                                </td>
                                                                              
                                                                            </tr>

                                                                            <tr><td colspan="4"><div></div></td></tr>
                                                                        </table>

                                                                    </td>
                                                                </tr>

                                                            </table>

                                                        </div>

                                                    </td>

                                                    <td style="width: 4px;">
                                                        <div></div>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                </table>
                            </td>
                        </tr>

                    </table>
                </div>
            </ScrollViewer>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">{{'General.B.Cancel' | TextCodeTranslationPipe}}</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">{{'General.B.Ok' | TextCodeTranslationPipe}}</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
