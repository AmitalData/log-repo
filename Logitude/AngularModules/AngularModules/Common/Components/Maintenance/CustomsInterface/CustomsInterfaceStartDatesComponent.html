
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>
            <table class="FixedTable">
                <tr>
                    <td>
                        <table>
                            <tr style="height:10px;">
                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr class="FormFieldRow" *ngIf="Code == 'Air'">
                                <td style="width: 200px;">
                                    <LogLabel [ObjectFieldName]="'AMCAirStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 220px;">
                                    <LogDatePicker [ObjectFieldName]="'AMCAirStartDate'" [SelectedDateValue]="AMCAirStartDate" [HideColumns]=" true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>


                            <tr class="FormFieldRow" *ngIf="Code == 'Ocean'">
                                <td style="width: 230px;">
                                    <LogLabel [ObjectFieldName]="'AMCOceanStartDate'" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width: 220px;">
                                    <LogDatePicker [ObjectFieldName]="'AMCOceanStartDate'" [SelectedDateValue]="AMCOceanStartDate" [HideColumns]=" true" [ObjectTableName]="ObjectTableName" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td>
                                    <div></div>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="3">
                                    <table>
                                        <tr>
                                            <td style="width: 90px;">
                                                <div></div>
                                            </td>

                                            <td style="vertical-align: top;">
                                                <div class="ItalicArialText" *ngIf="IsNoDataTextVisible">{{NoDataText}}</div>
                                                <div class="ItalicArialText" *ngIf="IsUpdateTextVisible">{{UpdatedDataText}}</div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>

                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
