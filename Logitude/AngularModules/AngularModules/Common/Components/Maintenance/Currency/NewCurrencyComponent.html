
<table>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td>
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>

    <tr>
        <td>

            <table>
                <tr class="FormFieldRow">
                    <td>
                        <table>

                            <tr class="FormFieldRow">
                                <td style="width:135px;">
                                    <LogLabel [NoObjectField]="true" [Text]="'Currency'" [ObjectFieldName]="'CurrencyId'" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:230px;">
                                    <LogLov [ObjectFieldName]="'CurrencyId'" [NoObjectField]="true"
                                            [ObjectTableName]="'Tenant'"
                                            [DataContext]="DataContext"
                                            [HideLastColumn]="false"
                                            [AutoCompleteSearchWindow]="true"
                                            [HideAddLink]="true" [HideMaintenanceIcon]="true"
                                            [LookUpTableName]="'Currency'" (SelectedItemChanged)="DataContext.SeletedCurrency = $event" [IsTenantZeroSearch]="true">
                                    </LogLov>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [NoObjectField]="true" [Text]="'Exchange Rate'" [ObjectFieldName]="'CurrencyRate'" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:230px;">
                                    <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'CurrencyRate'" [InputType]="'double'" [DataContext]="DataContext"></LogTextBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>

                            <tr *ngIf="IsAccountingActivated" class="FormFieldRow">
                                <td>
                                    <LogLabel [NoObjectField]="true" [Text]="'Unit'" [ObjectFieldName]="'Unit'" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:230px;">
                                    <LogTextBox [NoObjectField]="true" [ObjectFieldName]="'Unit'" [InputType]="'integer'" Min="1" [DataContext]="DataContext"></LogTextBox>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>

                            <tr class="FormFieldRow">
                                <td>
                                    <LogLabel [NoObjectField]="true" [Text]="'Exchange Rate Date'" [ObjectFieldName]="'RateDate'" [DataContext]="DataContext"></LogLabel>
                                </td>

                                <td style="width:230px;">
                                    <LogDatePicker [NoObjectField]="true" [ObjectFieldName]="'RateDate'" [InputType]="'date'" [DataContext]="DataContext"></LogDatePicker>
                                </td>

                                <td>
                                    <div></div>
                                </td>

                            </tr>

                            <tr>
                                <td>
                                    <div></div>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>
            </table>

        </td>

    </tr>

    <tr style="height: 32px;">
        <td style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="Button" (click)="CancelButtonClicked()">Cancel</button>
                    </td>

                    <td style="width: 5px;">
                        <div></div>
                    </td>

                    <td style="width: 57px;">
                        <button class="RedButton" (click)="OkButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

</table>
