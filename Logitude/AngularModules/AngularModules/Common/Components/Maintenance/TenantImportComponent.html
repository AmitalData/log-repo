<style type="text/css">
    .SystemDefaultsBox {
        width: 100%;
        height: 100%;
        border: 1px solid #BABABA;
        border-radius: 5px;
        -moz-border-radius: 5px;
        -webkit-border-radius: 5px;
    }

    .SystemDefaultsBoxHeader {
        height: 20px;
        font-size: 12px;
        color: #1B90CB;
        text-indent: 5px;
        background: -moz-linear-gradient(50% 0% -90deg,rgba(245, 245, 245, 1) 0%,rgba(243, 243, 243, 1) 50.24%,rgba(236, 236, 236, 1) 69.98%,rgba(224, 224, 224, 1) 84.35%,rgba(207, 207, 207, 1) 96.04%,rgba(199, 199, 199, 1) 100%);
        background: -webkit-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        background: -webkit-gradient(linear,50% 0%,50% 100%,color-stop(0,rgba(245, 245, 245, 1) ),color-stop(0.5024,rgba(243, 243, 243, 1) ),color-stop(0.6998,rgba(236, 236, 236, 1) ),color-stop(0.8435,rgba(224, 224, 224, 1) ),color-stop(0.9604,rgba(207, 207, 207, 1) ),color-stop(1,rgba(199, 199, 199, 1) ));
        background: -o-linear-gradient(-90deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr='#F5F5F5', endColorstr='#C7C7C7' ,GradientType=0)";
        background: linear-gradient(180deg, rgba(245, 245, 245, 1) 0%, rgba(243, 243, 243, 1) 50.24%, rgba(236, 236, 236, 1) 69.98%, rgba(224, 224, 224, 1) 84.35%, rgba(207, 207, 207, 1) 96.04%, rgba(199, 199, 199, 1) 100%);
    }
</style>

<table *ngIf="IsVisible">
        <tr style="height: 21px;">
            <td style="height: 21px;">
                <table>
                    <tr>
                        <td style="width: 230px; vertical-align:middle;">
                            <SearchTextBox [ObjectTableName]="ObjectTableName" (SearchTextChangeEvent)="TextChanged($event)"></SearchTextBox>
                        </td>

                        <td style="width: 5px;" *ngIf="IsNewEntityButtonVisible">
                            <div></div>
                        </td>

                        <td style="width: 1px;" *ngIf="IsNewEntityButtonVisible">
                            <button style="min-width: 95px; padding-left: 5px; padding-right: 5px;" class="Button" (click)="AddNewEntityClicked()">{{NewEntityButtonLabel}}</button>
                        </td>

                        <td> </td>
                    </tr>

                    <tr style="height:10px"><td colspan="2"><div></div></td></tr>

                </table>
            </td>
        </tr>

        <tr>
            <td>
                <table>
                    <tr>
                        <td>
                            <table>
                                <tr>
                                    <td style="height: 100%;width:100%">
                                        <div class="SystemDefaultsBox">
                                            <table>
                                                <tr class="SystemDefaultsBoxHeader">
                                                    <td>
                                                        <table>
                                                            <tr>
                                                                <td style="height:10px;width:10px;"><div></div></td>
                                                                <td style="color:black;">
                                                                    <label style="vertical-align: middle;">
                                                                        Available {{ObjectTableName}}s ({{DataSource.rowCount}})
                                                                    </label>
                                                                </td>
                                                               
                                                                <td style="width:2px;">
                                                                    <div></div>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    </td>
                                                </tr>

                                                <tr style="vertical-align:top;">
                                                    <td style="padding-left: 5px; padding-right: 5px;min-height: 215px;vertical-align:top;">
                                                        <div style="vertical-align:top;" class="GeneratedGridContainer">
                                                            <logitude-grid style="vertical-align:top;" GridWidth="100%" GridHeight="100%" [dataSource]="DataSource"
                                                                           [columns]="columns" [autoLoad]="true" [rows]="items" [searchFields]="searchFields" [SearchFieldchangeevent]="SearchFieldchangeevent">
                                                            </logitude-grid>
                                                        </div>
                                                    </td>
                                                </tr>
                                               
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr style="height: 32px;">
            <td style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="Button" (click)="CloseButtonClicked()">Close</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>
