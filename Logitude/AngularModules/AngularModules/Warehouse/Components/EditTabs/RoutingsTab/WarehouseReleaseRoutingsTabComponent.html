                                                        <LogLov [ObjectFieldName]="'ToPartnerCardId'"

                                            <table *ngIf="ToTypeCode == 'PORT'">

            <td>

            </td>
        </tr>

                                                <tr>
                                                    <td colspan="2">

                                                    <td>
