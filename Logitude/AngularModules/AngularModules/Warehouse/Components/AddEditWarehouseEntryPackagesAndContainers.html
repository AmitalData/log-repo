
<style>
    .MessageText {
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        line-height: 18px;
    }
</style>
 
  
 

   
 
<div *ngIf="IsLoadPage" style="height:100%;vertical-align:top">

    <table style="height:100%;vertical-align:top"> 

        <tr style="height:10px"><td colspan="3"><div></div></td></tr>

        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="3">
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td>
        </tr>  

        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:5px;">
            <td colspan="3">
                <div style="height:5px"></div>
            </td> 
        </tr>

        <tr *ngIf="WarningErrorsList != null && WarningErrorsList.length > 0" style="height:1px;">
            <td colspan="3">
                <WarningSummary [ItemsSource]="WarningErrorsList" [SingleLine]="true"></WarningSummary>
            </td>
        </tr>
         


        <tr style="height:210px;vertical-align:top;">
              

            <td style="width:480px"> 
                <table style="vertical-align:top"> 
                    <tr style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:200px;">  <LogLabel [ObjectFieldName]="'PackageTypeId'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px"><LogLov style="width:230px"  [ObjectFieldName]="'PackageTypeId'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" [DependencyFilter2Value]="IsDependencyFilter2Value" [LookUpTableName]="'PackageType'"></LogLov></td>
                        <td><div></div></td>
                    </tr>

                      

                     
                    <tr *ngIf="warehouseEntryPackagePM && warehouseEntryPackagePM.IsContainer" style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel [ObjectFieldName]="'ContainerNumber'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox style="width:230px"  (LostFocus)="ContainerNumberLostFocus($event)" [ObjectFieldName]="'ContainerNumber'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>


                     

                    <tr style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel  [ObjectFieldName]="'Quantity'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox (ValueChanged)="OnQuantityChange()" style="width:230px" [ObjectFieldName]="'Quantity'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>



                    <tr *ngIf="warehouseEntryPackagePM && !warehouseEntryPackagePM.IsContainer" style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel [Text]="DimensionsLabel" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px">

                            <table>
                                <tr>
                                    <td>
                                        <LogTextBox (ValueChanged)="OnDimensionsChange($event,'Length')"  [Text]="warehouseEntryPackagePM.Length" [ObjectFieldName]="'Length'"  [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                    </td>

                                    <td style="width: 1px;">
                                        <div></div>
                                    </td>

                                    <td>
                                        <LogTextBox (ValueChanged)="OnDimensionsChange($event,'Width')" [Text]="warehouseEntryPackagePM.Width" [ObjectFieldName]="'Width'"  [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                    </td> 

                                    <td style="width: 1px;">
                                        <div></div>
                                    </td>   
                                     
                                    <td>
                                        <LogTextBox (ValueChanged)="OnDimensionsChange($event,'Height')" [Text]="warehouseEntryPackagePM.Height" [ObjectFieldName]="'Height'"  [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" [HideColumns]="true" [DisableZeroPadding]="true"></LogTextBox>
                                    </td>

                                    <td style="width: 36px;">
                                        <div></div>
                                    </td>
                                </tr>
                            </table>

                        </td>
                        <td><div></div></td> 
                    </tr>

                  
                    <tr style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel  [Text]="VolumeLabel" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px">
                        
                           <LogTextBox *ngIf="!IsVolumRefresh" (ValueChanged)="OnVolumChange($event)" style="width:230px" [ObjectFieldName]="'Volume'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" ></LogTextBox>
                            <LogTextBox *ngIf="IsVolumRefresh" (ValueChanged)="OnVolumChange($event)" style="width:230px" [ObjectFieldName]="'Volume'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogTextBox>
                        
                        </td>
                        <td><div></div></td>
                    </tr>

                     
                    <tr style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel  [Text]="GrossWeightLabel"  [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox style="width:230px" [ObjectFieldName]="'Weight'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" [DisableZeroPadding]="true"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>


                    <tr *ngIf="warehouseEntryPackagePM && warehouseEntryPackagePM.IsContainer" style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel [ObjectFieldName]="'Seal'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox style="width:230px" [ObjectFieldName]="'Seal'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" ></LogTextBox></td>
                        <td><div></div></td>
                    </tr>

                     
                    
                     
                    <tr style="vertical-align:top;height:35px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;">  <LogLabel [ObjectFieldName]="'Harmonize'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox style="width:230px" [ObjectFieldName]="'Harmonize'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>
            

                 <tr style="vertical-align:top;height:3px"><td colspan="4"></td></tr>

                    <tr class="FormFieldRow">
                        <td style="width:5px"><div></div></td>
                        <td style="width:150px;vertical-align:top;">
                            <LogLabel [ObjectFieldName]="'Location'"  [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel>
                        </td>

                        <td style="width: 270px;">
                            <table>
                                <tr>
                                    <td style="width:230px;height:60px;">
                                        <div class="MediaFill">
                                            <LogTextBox [ObjectFieldName]="'Location'"  [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM" [IsMultiline]="true"></LogTextBox>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                        <td><div></div></td>
                    </tr>


                    <tr><td></td></tr>

                </table>



            </td>

            <td><div></div></td>


            <td style="width:385px;">

                <table style="vertical-align:top">


                    <tr style="height:10px">

                        <td style="width:345px;"> <div></div></td>


                    </tr>


                    <tr style="height:15px">
                      
                        <td style="width:345px;">  <LogLabel [ObjectFieldName]="'Description'" [Text]="'Description Of Goods'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogLabel></td>

                  
                    </tr>

                    <tr style="vertical-align:top;height:100px;">
                      
                      
                        <td style="width:345px;height:100px">
                            <div style="height: 100%; width:320px;height:100px">
                                <LogTextBox style="width:315px;" [IsMultiline]="true" [ObjectFieldName]="'Description'" [ObjectTableName]="'WarehouseEntryPackage'" [DataContext]="warehouseEntryPackagePM"></LogTextBox>
                            </div>
                        </td>

                    </tr>

                 

                    <tr><td ><div></div></td></tr>

                </table>



            </td>



        </tr>

        <tr>
            <td colspan="3">
                <div style="height:5px"></div>
            </td>


        </tr>
     

        <tr style="height: 32px;">
            <td colspan="3" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <div>
                                <button class="Button" (click)="CanceluttonClicked()">Cancel</button>
                            </div>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="SaveButtonClicked()">Ok</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>

</div>
