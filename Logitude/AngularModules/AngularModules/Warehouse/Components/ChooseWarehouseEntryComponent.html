<table *ngIf="IsLoadPage">
    <tr style="height:10px"><td colspan="3"><div></div></td></tr>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
        <td colspan="3">
            <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
        </td>
    </tr>
    <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:5px;">
        <td colspan="3">
            <div style="height:5px"></div>
        </td>
    </tr>
    <tr style="height: 34px;">
        <td>
            <table>
                <tr>
                    <td style="width:117px;">
                        <div [style.opacity]="'1'" [style.pointer-events]="'auto'">
                            <TransportsFilter [SelectedValue]="TransportModeId" (SelectedValueChanged)="TransportModeId = $event"></TransportsFilter>
                        </div>
                    </td>
                    <td style="width:35px;">
                        <div></div>
                    </td>
                    <td style="width:150px;">
                        <div [style.opacity]="'1'" [style.pointer-events]="'auto'">
                            <DirectionsFilter [HideCustomsImport]="true" [SelectedValue]="DirectionId" (SelectedValueChanged)="DirectionId = $event"></DirectionsFilter>
                        </div>
                    </td>
                    <td>
                        <div style="width: 70px; display: block; float:left; margin-left: 35px;">
                            <LogLabel [HideColumns]="true" [DataContext]="DataContext" [Text]="'Customer'"></LogLabel>
                        </div>
                        <div style="width: 165px; display: block; float:left; ">
                            <LogLov [ObjectFieldName]="'CustomerId'"
                                    [SelectedValue]="CustomerId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Card'"
                                    [ForceDisabled]="true"
                                    [HideLastColumn]="true">
                            </LogLov>
                        </div>
                        <div style="width: 180px; display: block; float:left; margin-left: 35px;"></div>
                    </td>
                    <td>
                        <div style="width: 70px; display: block; float:left; margin-left: 35px;">
                            <LogLabel [HideColumns]="true" [DataContext]="DataContext" [Text]="'Warehouse'"></LogLabel>
                        </div>
                        <div style="width: 165px; display: block; float:left; ">
                            <LogLov [ObjectFieldName]="'WarehouseId'"
                                    [SelectedValue]="WarehouseId"
                                    [ObjectTableName]="ObjectTableName"
                                    [DataContext]="DataContext"
                                    [LookUpTableName]="'Warehouse'"
                                    [ForceDisabled]="true"
                                    [HideLastColumn]="true">
                            </LogLov>
                        </div>
                        <div style="width: 300px; display: block; float:left; margin-left: 35px;"></div>
                    </td>
                </tr>
                <tr style="height: 5px;">
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="vertical-align:central;">
        <td colspan="3">
            <table>
                <tr style="height: 10px;">
                    <td>
                        <div></div>
                    </td>
                </tr>
                <tr style="height:100%">
                    <td>
                        <table>
                            <tr style="height:100%">
                                <td>
                                    <div class="MediaFill">
                                        <div class="SimpleGridView">
                                            <div class="SimpleGridViewHeader">
                                                <table>
                                                    <tr>
                                                        <td style="width: 30px; min-width: 30px;max-width: 30px;"></td>
                                                        <td style="width: 30px; min-width: 30px;max-width: 30px;"></td>
                                                        <td style="width: 30px; min-width: 30px;max-width: 30px;"></td>
                                                        <td style="width: 70px; min-width: 70px;max-width: 70px;">Entry #</td>
                                                        <td style="width: 100%;min-width: 100%;max-width: 100%;"></td>
                                                    </tr>
                                                </table>
                                            </div>
                                            <div class="SimpleGridViewBody" style="vertical-align:top;text-align:center;margin-top:5px;height:50px;" *ngIf="IsShowMessageNoResult">
                                                <span style="font-size:15px;color:gray;margin-top:10px">No Result Found</span>
                                            </div>
                                            <div *ngIf="!IsShowMessageNoResult" class="SimpleGridViewBody">
                                                <table>
                                                    <tr style="height: 1px;">
                                                        <td>
                                                            <table>
                                                                <tr class="SimpleGridViewRow RowHover" *ngFor="let item of WarehouseEntries">
                                                                    <td>
                                                                        <table>
                                                                            <tr style="height:25px;" (click)="SelectedWarehouseEntry = item" [class.RowSelected]="item === SelectedWarehouseEntry">
                                                                                <td class="GridViewCell" style="width: 30px; min-width: 30px; max-width: 30px; position: relative;vertical-align:central">
                                                                                    <div class="CheckBox">
                                                                                        <input [(ngModel)]="item === SelectedWarehouseEntry" class="LeftCenter" style="text-align:center" type="checkbox" />
                                                                                        <label style="color:black;" class="LeftCenter" [attr.for]="item.IsSelectedKeyId"></label>
                                                                                    </div>
                                                                                </td>
                                                                                <td class="GridViewCell" style="width: 30px; min-width: 30px; max-width: 30px; position: relative;vertical-align:central">
                                                                                    <img [attr.src]="'./Images/Directions/' + item.WarehouseEntryList.DirectionId + '.png'" class="CenterCenter" />
                                                                                </td>
                                                                                <td class="GridViewCell" style="width: 30px; min-width: 30px; max-width: 30px; position: relative;vertical-align:central">
                                                                                    <img [attr.src]="'./Images/TransportModes/' + item.WarehouseEntryList.TransportModeId + '.png'" class="CenterCenter" />
                                                                                </td>
                                                                                <td class="GridViewCell" style="width: 70px; min-width: 70px; max-width: 70px;vertical-align:central;text-align:center">
                                                                                    <a (click)="ViewWarehouseEntry(item.WarehouseEntryList.Id)">
                                                                                        {{item.WarehouseEntryList.EntryNumber}}
                                                                                    </a>
                                                                                </td>
                                                                                <td style="width: 100%;min-width: 100%;max-width: 100%;"></td>
                                                                            </tr>
                                                                            <tr><td colspan="15"></td></tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr style="height: 10px;">
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr style="height: 32px;">
        <td colspan="3" style="vertical-align: bottom">
            <table style="height: 22px;">
                <tr>
                    <td>
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <div>
                            <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                        </div>
                    </td>
                    <td style="width: 5px;">
                        <div></div>
                    </td>
                    <td style="width: 57px;">
                        <button class="RedButton" (click)="SaveButtonClicked()">Ok</button>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
