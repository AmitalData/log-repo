
<style>
    .MessageText {
        white-space: normal;
        word-wrap: break-word;
        overflow-x: hidden;
        overflow-y: auto;
        line-height: 18px;
    }
</style>






<div *ngIf="IsLoadPage" style="height:100%;vertical-align:top">

    <table style="height:100%;vertical-align:top">

        <tr style="height:10px"><td colspan="3"><div></div></td></tr>


        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:1px;">
            <td colspan="3">
                <ValidationSummary [ItemsSource]="ValidationErrorsList"></ValidationSummary>
            </td> 
        </tr>

        <tr *ngIf="ValidationErrorsList != null && ValidationErrorsList.length > 0" style="height:5px;">
            <td colspan="3">
                <div style="height:5px"></div>
            </td>
        </tr>
          


        <tr style="height:210px;vertical-align:top;">


            <td style="width:400px">
                <table style="vertical-align:top">
                    <tr style="vertical-align:top;height:30px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:125px;">  <LogLabel [ObjectFieldName]="'WarehouseId'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td  style="width:270px"><LogLov (SelectedItemChanged)="WarehouseValueChange($event)" style="width:230px" 
                                                        [ObjectFieldName]="'WarehouseId'" 
                                                        [SelectedValue]="warehouseReleasePM.WarehouseId"
                                                        [ObjectTableName]="'WarehouseRelease'" 
                                                        [DataContext]="warehouseReleasePM" 
                                                        [LookUpTableName]="'Warehouse'"></LogLov></td>
                        <td><div></div></td>
                    </tr>
                           


                    <tr style="vertical-align:top;height:30px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:125px;">  <LogLabel [ObjectFieldName]="'CustomerId'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:270px"><LogLov *ngIf="IsRefreshCustomer" [DependencyFilter1Value]="'CS'"  (SelectedItemChanged)="CustomerValueChange($event)"  style="width:230px"  [ObjectFieldName]="'CustomerId'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM" [LookUpTableName]="'Card'"></LogLov>
                            <LogLov *ngIf="!IsRefreshCustomer" [DependencyFilter1Value]="'CS'" (SelectedItemChanged)="CustomerValueChange($event)" style="width:230px" [ObjectFieldName]="'CustomerId'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM" [LookUpTableName]="'Card'"></LogLov>
                        
                        </td>
                        <td><div></div></td>
                    </tr>

                    <tr style="vertical-align:top;height:30px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:125px;">  <LogLabel [ObjectFieldName]="'CustomerRef1'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox style="width:230px" [ObjectFieldName]="'CustomerRef1'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>


                    <tr style="vertical-align:top;height:30px">
                        <td style="width:5px"><div></div></td>
                        <td style="width:125px;">  <LogLabel [ObjectFieldName]="'CustomerRef2'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:270px"><LogTextBox style="width:230px" [ObjectFieldName]="'CustomerRef2'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>

                    <tr style="vertical-align:top;height:4px">
                        <td colspan="4"><div></div></td>

                    </tr>

                    <tr style="vertical-align:top;height:80px;">
                        <td style="width:5px"><div></div></td>
                        <td style="width:125px;">  <LogLabel [ObjectFieldName]="'SpecialInstruction'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:270px;">

                            <div style="height: 100%; width:270px;">
                                <LogTextBox style="width:270px;" [IsMultiline]="true" [ObjectFieldName]="'SpecialInstruction'" [ObjectTableName]="'WarehouseRelease'"  [DataContext]="warehouseReleasePM"></LogTextBox>
                            </div>

                        <td><div></div></td>
                    </tr>


                    <tr><td></td></tr>

                </table>



            </td>

            <td><div></div></td>


            <td style="width:470px;">

                <table style="vertical-align:top">


                    <tr style="vertical-align:top;height:30px">
                        <td style="width:80px">
                            <div>
                                <button *ngIf="warehouseReleasePM && warehouseReleasePM.ExpectedReleaseDate && !warehouseReleasePM.ActualReleaseDate" (click)="SetActualDateClicked()" class="Button" style="height: 18px; font-size: 10px;">Set as Actual</button>
                            </div>
                        </td>

                        <td style="width:5px"><div></div></td>
                        <td style="width:145px;"> <LogLabel [ObjectFieldName]="'ExpectedReleaseDate'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:240px;">


                            <table>
                                <tr>
                                    <td style="width: 117px;">
                                        <LogDatePicker [ObjectFieldName]="'ExpectedReleaseDate'" [SelectedDateValue]="ExpectedReleaseDate" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td style="width: 5px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 117px;">
                                        <LogDatePicker [ObjectFieldName]="'ExpectedReleaseDate'" [SelectedDateValue]="ExpectedReleaseDate" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM" [HideColumns]="true" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                                    </td>
                                    <td><div></div></td>
                                </tr>
                            </table>



                        </td>
                        <td><div></div></td>
                    </tr>


                    <tr style="vertical-align:top;height:30px">
                        <td colspan="2" style="width:75px"><div></div></td>
                        <td style="width:145px;"> <LogLabel [Text]="'Actual Release Date'" [ObjectFieldName]="'ActualReleaseDate'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
            
                        <td style="width:240px;">

                            <table>
                                <tr>
                                    <td style="width: 117px;">
                                        <LogDatePicker  [ObjectFieldName]="'ActualReleaseDate'" [SelectedDateValue]="ActualReleaseDate" [ObjectTableName]="'WarehouseRelease'" [DataContext]="DataContext" [HideColumns]="true"></LogDatePicker>
                                    </td>

                                    <td style="width: 5px;">
                                        <div></div>
                                    </td>

                                    <td style="width: 117px;">
                                        <LogDatePicker [ObjectFieldName]="'ActualReleaseDate'" [SelectedDateValue]="ActualReleaseDate" [ObjectTableName]="'WarehouseRelease'" [DataContext]="DataContext" [HideColumns]="true" [InputType]="'time'" [TimeMode]="12"></LogDatePicker>
                                    </td>
                                    <td><div></div></td>
                                </tr>
                            </table>

                             
                        </td>
                        <td><div></div></td>
                    </tr>



                    <tr style="vertical-align:top;height:30px">
                        <td colspan="2" style="width:75px"><div></div></td>
                        <td style="width:145px;">  <LogLabel [ObjectFieldName]="'ReleaseBy'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:240px"><LogTextBox style="width:240px" [ObjectFieldName]="'ReleaseBy'" [HideColumns]="true" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogTextBox></td>
                        <td><div></div></td>
                    </tr>


                    <tr style="vertical-align:top;height:4px">
                        <td colspan="5"><div></div></td>

                    </tr>


                    <tr style="vertical-align:top;height:80px">
                        <td colspan="2" style="width:75px"><div></div></td>
                        <td style="width:145px;">  <LogLabel [ObjectFieldName]="'Notes'" [ObjectTableName]="'WarehouseRelease'" [DataContext]="warehouseReleasePM"></LogLabel></td>
                        <td style="width:240px">

                            <div style="height: 100%; width:240px;">
                                <LogTextBox style="width:240px;" [IsMultiline]="true" [ObjectFieldName]="'Notes'" [HideColumns]="true" [ObjectTableName]="'WarehouseRelease'"  [DataContext]="warehouseReleasePM"></LogTextBox>
                            </div>


                        <td><div></div></td>

                    </tr>





                    <tr><td colspan="5"><div></div></td></tr>

                </table>



            </td>



        </tr>


       
        <!--End Fields Grid-->
        <tr style="vertical-align:central;height:10px;">
            <td colspan="3">
                <div></div>
            </td>
        </tr>

        <tr style="vertical-align:central;height:100%;">
            <td colspan="3">
                <div class="MediaFill" LocationDirective Code="WRPD"></div>
            </td>
        </tr>




        <tr style="height: 32px;">
            <td colspan="3" style="vertical-align: bottom">
                <table style="height: 22px;">
                    <tr>
                        <td>
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <div>
                                <button class="Button" (click)="CloseButtonClicked()">Cancel</button>
                            </div>
                        </td>

                        <td style="width: 5px;">
                            <div></div>
                        </td>

                        <td style="width: 57px;">
                            <button class="RedButton" (click)="SaveButtonClicked()">Ok</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

    </table>

</div>
