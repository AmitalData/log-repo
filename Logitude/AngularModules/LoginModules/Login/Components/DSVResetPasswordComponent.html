
<style type="text/css">
    label {
        font-size: 13px;
        text-align: left;
    }

    input:not(.DSVLoginButton) {
        width: 280px;
        height: 30px;
        min-height: 30px;
        font-size: 13px;
        font-family: tahoma, arial, sans-serif;
        background: #dbdbdb;
        background: -moz-linear-gradient(top, #dbdbdb 0%, #f2f2f2 28%, #ffffff 41%, #ffffff 100%); /* FF3.6+ */
        background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#dbdbdb), color-stop(28%,#f2f2f2), color-stop(41%,#ffffff), color-stop(100%,#ffffff)); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(top, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(top, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* Opera 11.10+ */
        background: linear-gradient(to bottom, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* W3C */
    }

    #myBar {
        width: 1%;
        height: 10px;
        background: red;
        background: -webkit-linear-gradient(left,red,orange,yellow,green,blue,indigo);
        background: -o-linear-gradient(left,red,orange,yellow,green,blue,indigo);
        background: -moz-linear-gradient(left,red,orange,yellow,green,blue,indig);
        background: linear-gradient(to right, red,orange,yellow,green,blue,indigo);
    }

    .DSVLoginButton {
        height: 30px;
        width: 100px;
        cursor: pointer;
        text-align: center;
        text-shadow: 1px 1px 0px #23347B;
        border-radius: 0px;
        -moz-border-radius: 0px;
        -webkit-border-radius: 0px;
        border: 1px solid #23347B;
        font-family: Arial;
        color: #ffffff;
        font-size: 15px;
        font-weight: bold;
        font-style: normal;
        /*box-shadow: inset 0px 1px 0px 0px #f29c93;
    -moz-box-shadow: inset 0px 1px 0px 0px #f29c93;
    -webkit-box-shadow: inset 0px 1px 0px 0px #f29c93;*/
        background: #212E63;
    }

        .DSVLoginButton:hover {
            cursor: pointer;
            background: #10205E;
        }

    .cmdSubmit {
        -moz-box-shadow: inset 0px 1px 0px 0px #caefab;
        -webkit-box-shadow: inset 0px 1px 0px 0px #caefab;
        box-shadow: inset 0px 1px 0px 0px #caefab;
        background: -webkit-gradient( linear, left top, left bottom, color-stop(0.05, #77d42a), color-stop(1, #5cb811) );
        background: -moz-linear-gradient( center top, #77d42a 5%, #5cb811 100% );
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#77d42a', endColorstr='#5cb811');
        background-color: #77d42a;
        -moz-border-radius: 6px;
        -webkit-border-radius: 6px;
        border-radius: 6px;
        border: 1px solid #268a16;
        display: inline-block;
        color: #ffffff;
        font-family: arial;
        font-size: 15px;
        font-weight: bold;
        padding: 6px 24px;
        text-decoration: none;
        text-shadow: 1px 1px 0px #aade7c;
        width: 100px;
        margin-top: 2px;
    }

        .cmdSubmit:hover {
            background: -webkit-gradient( linear, left top, left bottom, color-stop(0.05, #5cb811), color-stop(1, #77d42a) );
            background: -moz-linear-gradient( center top, #5cb811 5%, #77d42a 100% );
            filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#5cb811', endColorstr='#77d42a');
            background-color: #5cb811;
        }

        .cmdSubmit:active {
            position: relative;
            top: 1px;
        }

    .backgroundImage {
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center center;
        position: absolute;
    }

    .forgetPasswordImage {
        background-position: center center;
        background-repeat: no-repeat;
        background-size: 100% 100%;
    }

    .image-container {
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
    }
</style>
  
<!-- backgroundImage -->

<table  class="PreventSelect backgroundImage" [style.background-image]="this.BackgroundImage">
    <tr>
        <td style="width:30%;">
            <div></div>
        </td>

        <td>
            <!--style="width: 1024px;"-->
            <table>
                <tr style="height: 50px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr style="height: 114px;">
                    <td style="text-align: center;">
                        <a>
                            <img [src]="MainLogo" id="loginlogo" style="width:290px; height:114px;float:left;" />
                        </a>
                    </td>
                </tr>

                <tr style="height: 20px;">
                    <td>
                        <div></div>
                    </td>
                </tr>

                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <div></div>
                                </td>

                                <td>
                                    <table>
                                        <tr>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr style="height: 16px;">
                                            <td style="opacity: 0.7; background-image: url('Images/LoginScreen/shadow1.png'); background-repeat: no-repeat;">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr style="height: 260px; min-height: 260px; background: white;">
                                            <td>
                                                <table>
                                                    <tr>
                                                        <td style="width:30%;">
                                                            <table style="vertical-align:top;margin-left:45px;">

                                                                <tr [style.height]="HasErrors && IsShowAreaCaptcha ? '0px':'15px'">
                                                                    <td [style.height]="HasErrors && IsShowAreaCaptcha ? '0px':'15px'">
                                                                        <div [style.height]="HasErrors && IsShowAreaCaptcha ? '0px':'15px'"></div>
                                                                    </td>
                                                                </tr>


                                                                <tr>
                                                                    <td>


                                                                        <div style="height:auto;margin-top:5px">
                                                                            <table>

                                                                                <tr>
                                                                                    <td style="text-align:left;">
                                                                                        <div style="text-align:left;width:auto">
                                                                                            <div [ngStyle]="MainColor != null ? {'color': MainColor} : {}" style="text-align:left;width:120px;font-family:Lucida Sans Unicode;font-size:16px;font-weight:bold;">Reset Password</div>
                                                                                            <div style="text-align:left;width:120px;font-family:Arial;font-size:12px;color:#4B4A4A;font-weight:bold;">Please enter your email and press submit.</div>
                                                                                            <div style="text-align:left;width:120px;font-family:Myriad Pro;font-size:14px;color:#4B4A4A;font-weight:bold;">e-mail:</div>
                                                                                        </div>
                                                                                    </td>
                                                                                </tr>
                                                                                <tr>
                                                                                    <td style="text-align:left;">
                                                                                        <div style="text-align:left;width:auto; margin-right:10px">
                                                                                            <input type="email" style="height:22px;border-radius:3px;border:1px solid gray;width:250px;" [(ngModel)]="Email" value="" placeholder="e.g. myname@example.net" />
                                                                                        </div>
                                                                                    </td>
                                                                                </tr>
                                                                            </table>
                                                                        </div>
                                                                    </td>
                                                                </tr>

                                                                <tr *ngIf="IsShowAreaCaptcha" style="height:5px">
                                                                    <td>
                                                                        <div></div>
                                                                    </td>
                                                                </tr>

                                                                <tr *ngIf="IsShowAreaCaptcha" style="height:19px;">
                                                                    <td>
                                                                        <img src={{CaptchaImageUrl}} style="height:auto;width:auto;float:left;" />

                                                                    </td>
                                                                </tr>


                                                                <tr *ngIf="IsShowAreaCaptcha" style="height:19px;">
                                                                    <td>

                                                                        <input [(ngModel)]="CaptchaCode" style="height:19px;width:250px;margin-bottom:5px;margin-top:5px;float:left;" type="text" placeholder="type the text you see" id="CaptchaTextBox" />

                                                                    </td>
                                                                </tr>

                                                                <tr style="height:30px;">
                                                                    <td>
                                                                        <table>
                                                                            <tr>
                                                                                <!-- [style.backgroundColor]="MainColor != null ? {'color': MainColor} : {}"  -->
                                                                                <td><button class="DSVLoginButton" (click)="SubmitBtnClicked()">Submit ></button></td>

                                                                                <td><div></div></td>
                                                                            </tr>
                                                                        </table>

                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td>
                                                                        <div style="text-align:left;width:120px;font-family:Arial;font-size:12px;color:#4B4A4A;font-weight:bold;">Having trouble logging in ? <a id="DefaultContactUs" [href]="this.ContactUsEmail">Contact us</a></div>
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td>
                                                                        <p *ngIf="HasErrors && !HasCaptchaErrors" style="color:red;text-align:left" id="errorsList">{{ErrorMessage}}</p>
                                                                        <p *ngIf="HasCaptchaErrors" style="color:red;text-align:left" id="errorsList">Please re-enter the characters you see  <br /> in the image above</p>
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td>
                                                                        <p *ngIf="Succeeded == true" style="color:SteelBlue;text-align:left" id="message">Submiting completed successfully.<br /> A reset link has been sent to your Email</p>
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <td>
                                                                        <p *ngIf="ShowbusyIndicator"><img width="50" height="50" src="images/LoginScreen/indicator.gif" alt='loading' /></p>

                                                                    </td>
                                                                </tr>


                                                                <tr style="height:30px">
                                                                    <td> <a id="BackToLogin" style="color:blue;vertical-align:top;text-decoration:underline" href="" (click)="BackToLoginClicked()">Back to login page</a></td>
                                                                </tr>
                                                            </table>
                                                        </td>

                                                        <!-- ForgetPasswordImage -->
                                                        <td class="forgetPasswordImage" [style.background-image]="this.ForgetPasswordImage">
                                                            <div></div>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>

                                        <tr style="height: 16px;">
                                            <td style="opacity: 0.7; background-image: url('Images/LoginScreen/shadow2.png'); background-repeat: no-repeat;">
                                                <div></div>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td>
                                                <div></div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div></div>
                    </td>
                </tr>
            </table>
        </td>

        <td>
            <div></div>
        </td>
    </tr>
</table>
