
<style type="text/css">
    label {
        font-size: 13px;
        text-align: left;
    }

    input:not(.LoginButton) {
        width: 280px;
        height: 30px;
        min-height: 30px;
        font-size: 13px;
        font-family: tahoma, arial, sans-serif;
        background: #dbdbdb;
        background: -moz-linear-gradient(top, #dbdbdb 0%, #f2f2f2 28%, #ffffff 41%, #ffffff 100%); /* FF3.6+ */
        background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#dbdbdb), color-stop(28%,#f2f2f2), color-stop(41%,#ffffff), color-stop(100%,#ffffff)); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(top, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(top, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* Opera 11.10+ */
        background: linear-gradient(to bottom, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* W3C */
    }

    .pwdCheckCase0, .pwdCheckCase1, .pwdCheckCase2, .pwdCheckCase3, .pwdCheckCase4 {
        text-align: center;
        border-right-width: 1px;
        border-bottom-width: 1px;
        border-right-style: solid;
        border-bottom-style: solid;
        vertical-align: central;
    }

    .pwdCheckCase0 {
        background-color: #CCCCCC;
        border-right-color: #CCCCCC;
        border-bottom-color: #CCCCCC;
    }

    .pwdCheckCase1 {
        background-color: #FF0000;
        border-right-color: #FF0000;
        border-bottom-color: #FF0000;
    }

    .pwdCheckCase2 {
        background-color: #FFCC00;
        border-right-color: #FFCC00;
        border-bottom-color: #FFCC00;
    }

    .pwdCheckCase3 {
        background-color: #4DFF00;
        border-right-color: #3333FF;
        border-bottom-color: #3333FF;
    }

    .pwdCheckCase4 {
        background-color: #00CC00;
        border-right-color: #336600;
        border-bottom-color: #336600;
    }

    .pwdCheckTable {
        /*border: 3px outset #CCCCCC;*/
        padding: 0px 0px 0px 0px;
        width: 100%;
    }

    .pwdCheckInnerTable {
        font-family: Tahoma,sans-serif;
        font-weight: bold;
        width: 210px;
        border: 0px 0px 0px 0px;
        height: 19px;
        background-color: #FFFFFF;
    }

        .pwdCheckInnerTable span {
            font-size: 70%;
        }

    .pwdCheckLabelCell {
        font-size: 9pt;
        color: #000000;
        font-weight: bold;
        vertical-align: top;
        text-align: right;
        padding: 5px 20px 13px 5px;
    }

    .pwdCheckDataCell {
        width: 200px;
        vertical-align: top;
        padding: 0px 0px 13px 0px;
    }

    input:not(.DSVLoginButton) {
        width: 280px;
        height: 30px;
        min-height: 30px;
        font-size: 13px;
        font-family: tahoma, arial, sans-serif;
        background: #dbdbdb;
        background: -moz-linear-gradient(top, #dbdbdb 0%, #f2f2f2 28%, #ffffff 41%, #ffffff 100%); /* FF3.6+ */
        background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#dbdbdb), color-stop(28%,#f2f2f2), color-stop(41%,#ffffff), color-stop(100%,#ffffff)); /* Chrome,Safari4+ */
        background: -webkit-linear-gradient(top, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* Chrome10+,Safari5.1+ */
        background: -o-linear-gradient(top, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* Opera 11.10+ */
        background: linear-gradient(to bottom, #dbdbdb 0%,#f2f2f2 28%,#ffffff 41%,#ffffff 100%); /* W3C */
    }

    .DSVLoginButton {
        height: 30px;
        width: 100px;
        cursor: pointer;
        text-align: center;
        text-shadow: 1px 1px 0px #23347B;
        border-radius: 0px;
        -moz-border-radius: 0px;
        -webkit-border-radius: 0px;
        border: 1px solid #23347B;
        font-family: Arial;
        color: #ffffff;
        font-size: 15px;
        font-weight: bold;
        font-style: normal;
        /*box-shadow: inset 0px 1px 0px 0px #f29c93;
    -moz-box-shadow: inset 0px 1px 0px 0px #f29c93;
    -webkit-box-shadow: inset 0px 1px 0px 0px #f29c93;*/
        background: #212E63;
    }

        .DSVLoginButton:hover {
            cursor: pointer;
            background: #10205E;
        }

    .BackgroundImage {
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center center;
        position: absolute;
    }

    .MainImage {
        background-position: center center;
        background-repeat: no-repeat;
        background-size: 100% 100%;
    }

    .MainLogo {
        width: 290px;
        height: 114px;
        float: left;
    }

    .ForgetPasswordImage {
        background-position: center center;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        opacity: 0.7;
    }

</style>
