 <!-- BackgroundImage -->
<table  class="PreventSelect backgroundImage" [style.background-image]="this.BackgroundImage">
	<tr>
		<td style="width:30%;">
			<div></div>
		</td>

		<td>
			<table>
				<tr style="height: 50px;">
					<td>
						<div></div>
					</td>
				</tr>

				<tr style="height: 114px;">
					<td style="text-align: center;">
						<a>
							<!--MainLogo-->
							<img [src]="MainLogo" id="loginlogo" style="width:290px; height:114px;float:left;" />
						</a>
					</td>
				</tr>

				<tr style="height: 20px;">
					<td>
						<div></div>
					</td>
				</tr>

				<tr>
					<td>
						<table>
							<tr>
								<td>
									<div></div>
								</td>

								<td>
									<table>
										<tr>
											<td>
												<div></div>
											</td>
										</tr>

										<tr style="height: 16px;">
											<td style="opacity: 0.7; background-image: url('Images/LoginScreen/shadow1.png'); background-repeat: no-repeat;">
												<div></div>
											</td>
										</tr>

										<tr style="height: 260px; min-height: 260px; background: white;">
											<td>
												<table>
													<tr>
														<td style="width:30%;">
															<table style="vertical-align:top;margin-left:45px;">

																<tr [style.height]="HasErrors && IsShowAreaCaptcha ? '0px':'15px'">
																	<td [style.height]="HasErrors && IsShowAreaCaptcha ? '0px':'15px'">
																		<div [style.height]="HasErrors && IsShowAreaCaptcha ? '0px':'15px'"></div>
																	</td>
																</tr>


																<tr>
																	<td>


																		<div style="height:auto;margin-top:5px">
																			<table>

																				<tr>
																					<td style="text-align:left;">
																						<div style="text-align:left;width:auto">
																							<div style="text-align:left;width:120px;font-family:Lucida Sans Unicode;font-size:16px;font-weight:bold;">Reset Password</div>
																							<div style="text-align:left;width:120px;font-family:Arial;font-size:12px;color:#4B4A4A;font-weight:bold;">Please enter your email and press submit.</div>
																							<div style="text-align:left;width:120px;font-family:Myriad Pro;font-size:14px;color:#4B4A4A;font-weight:bold;">e-mail:</div>
																						</div>
																					</td>
																				</tr>
																				<tr>
																					<td style="text-align:left;">
																						<div style="text-align:left;width:auto; margin-right:10px">
																							<input type="email" style="height:22px;border-radius:3px;border:1px solid gray;width:250px;" [(ngModel)]="Email" value="" placeholder="e.g. myname@example.net" />
																						</div>
																					</td>
																				</tr>
																			</table>
																		</div>
																	</td>
																</tr>

																<tr *ngIf="IsShowAreaCaptcha" style="height:5px">
																	<td>
																		<div></div>
																	</td>
																</tr>

																<tr *ngIf="IsShowAreaCaptcha" style="height:19px;">
																	<td>
																		<img src={{CaptchaImageUrl}} style="height:auto;width:auto;float:left;" />

																	</td>
																</tr>


																<tr *ngIf="IsShowAreaCaptcha" style="height:19px;">
																	<td>

																		<input [(ngModel)]="CaptchaCode" style="height:19px;width:250px;margin-bottom:5px;margin-top:5px;float:left;" type="text" placeholder="type the text you see" id="CaptchaTextBox" />

																	</td>
																</tr>

																<tr style="height:30px;">
																	<td>
																		<table>
																			<tr>
																				<td><button class="DSVLoginButton" (click)="SubmitBtnClicked()"  [ngStyle]="SecondaryColor != null ? {'background': SecondaryColor} : {}">Submit ></button></td>

																				<td><div></div></td>
																			</tr>
																		</table>

																	</td>
																</tr>
																<tr>
																	<td>
																		<div style="text-align:left;width:120px;font-family:Arial;font-size:12px;color:#4B4A4A;font-weight:bold;">Having trouble logging in ? <a id="DefaultContactUs" [href]="this.ContactUsEmail">Contact us</a></div>
																	</td>
																</tr>
																<tr>
																	<td>
																		<p *ngIf="HasErrors && !HasCaptchaErrors" style="color:red;text-align:left;width:250px;white-space: normal" id="errorsList">{{ErrorMessage}}</p>
																		<p *ngIf="HasCaptchaErrors" style="color:red;text-align:left;width:250px;white-space: normal" id="errorsList">Please re-enter the characters you see  <br /> in the image above</p>
																	</td>
																</tr>
																<tr>
																	<td>
																		<p *ngIf="Succeeded == true" style="color:SteelBlue;text-align:left" id="message">Submiting completed successfully.<br /> A reset link has been sent to your Email</p>
																	</td>
																</tr>
																<tr>
																	<td>
																		<p *ngIf="ShowbusyIndicator"><img width="50" height="50" src="images/LoginScreen/indicator.gif" alt='loading' /></p>

																	</td>
																</tr>


																<tr style="height:30px">
																	<td> <a id="BackToLogin" style="color:blue;vertical-align:top;text-decoration:underline" href="" (click)="BackToLoginClicked()">Back to login page</a></td>
																</tr>
															</table>
														</td>

														<!-- ForgetPasswordImage -->
														<td class="forgetPasswordImage" [style.background-image]="this.ForgetPasswordImage">
															<div></div>
														</td>
													</tr>
												</table>
											</td>
										</tr>

										<tr style="height: 16px;">
											<td style="opacity: 0.7; background-image: url('Images/LoginScreen/shadow2.png'); background-repeat: no-repeat;">
												<div></div>
											</td>
										</tr>

										<tr>
											<td>
												<div></div>
											</td>
										</tr>
									</table>
								</td>
							</tr>
						</table>
					</td>
				</tr>

				<tr>
					<td>
						<div></div>
					</td>
				</tr>
			</table>
		</td>

		<td>
			<div></div>
		</td>
	</tr>
</table>
