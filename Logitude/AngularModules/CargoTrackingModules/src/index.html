<!doctype html>

<head>
    <meta charset="utf-8">
    <title>Cargo Tracking Prototype</title>
 
    <script>
        var locationhref = document.location.href;
		var locationorigin = document.location.origin;
        var MainFolder = "CargoTracking"
        var baseref =locationhref.replace(locationorigin,"");
       if(baseref.includes(MainFolder)){
         var AllLength = baseref.lastIndexOf(MainFolder) + MainFolder.length ;
            baseref ='<base href="' +baseref.substring(0, AllLength)+"/"+ '" />';
       }
       else{
            baseref ='<base href="' +"/"+ '" >';

       }
         document.write(baseref);
    </script>
