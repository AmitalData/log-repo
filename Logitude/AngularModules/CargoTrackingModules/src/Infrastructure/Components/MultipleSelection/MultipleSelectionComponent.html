<mat-form-field appearance="fill">
    <mat-label>{{Title}}</mat-label>
    <mat-select  #select  multiple>
        <mat-option matInput *ngFor="let selection of MultipleSelectionList" [value]="selection" (click)="ToggleFilter(selection)">{{selection.Name}}({{selection.Count}})</mat-option>
    </mat-select>
</mat-form-field>
