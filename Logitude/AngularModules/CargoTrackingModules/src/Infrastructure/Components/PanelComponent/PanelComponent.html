
<div class="panel" [attr.id]="Name" [class.transparent]="TransparentBackground" >

    <div class="header">
        <div class="title">
            {{Title}}
            <a *ngIf="HeaderLinkText" (click)="HeaderLinkClicked()" href="javascript:;">{{HeaderLinkText}}</a>
        </div>
        <div class="buttons hide-mobile">
            <button *ngIf="HaveDetailsSection" (click)="ShowMoreDetails()">{{ShowDetailsSection?'Show less':'Show more'}}</button>
        </div>
    </div>

    <div class="body" [class.mobile-white-panel]="ShowWhitePanelOnMobile" [class.mobile-gray-panel]="ShowGrayPanelOnMobile">
        <ng-content select="[body]"></ng-content>
    </div>

    <div *ngIf="ShowDetailsSection" class="details"  [class.mobile-white-panel]="ShowWhitePanelOnMobile" [class.mobile-gray-panel]="ShowGrayPanelOnMobile">
        <div class="title">{{DetailsTitle}}</div>
        <ng-content select="[details]"></ng-content>
    </div>

</div>
