<div #container style="display: inline;" >
    <div class="inline-flex">
       
          <span *ngIf="isMobile" class="nowrap" appLabelUtilElement>
            <ng-container [ngTemplateOutlet]="myContent?.templateRef"></ng-container>
          </span>      
        <div *ngIf="isHasMore" class="icon-display" (click)="showPopup($event)">
            <svg class="mobile-only icon-margin" [style.width.px]="iconSize" [style.height.px]="iconSize" x="0px"
                y="0px" viewBox="0 0 1000 1000" enable-background="new 0 0 1000 1000" xml:space="preserve">
                <g>
                    <path
                        d="M500,12.9C229.4,12.9,10,231,10,500c0,269,219.4,487.1,490,487.1c270.6,0,490-218.1,490-487.1C990,231,770.6,12.9,500,12.9z M499.9,923.8c-233.8,0-423.3-189.5-423.3-423.3c0-233.8,189.5-423.3,423.3-423.3s423.3,189.5,423.3,423.3C923.2,734.3,733.7,923.8,499.9,923.8z" />
                    <path
                        d="M245,497.7c0,34.1,27.6,61.7,61.7,61.7c34.1,0,61.7-27.6,61.7-61.7c0-34.1-27.6-61.7-61.7-61.7C272.6,436,245,463.6,245,497.7L245,497.7L245,497.7z" />
                    <path
                        d="M451.6,497.7c0,34.1,27.6,61.7,61.7,61.7c34.1,0,61.7-27.6,61.7-61.7c0,0,0-0.1,0-0.1c0-34.1-27.6-61.7-61.7-61.7C479.2,436,451.6,463.6,451.6,497.7L451.6,497.7L451.6,497.7z" />
                    <path
                        d="M638.1,497.7c0,34.1,27.6,61.7,61.7,61.7c34.1,0,61.7-27.6,61.7-61.7c0,0,0-0.1,0-0.1c0-34.1-27.6-61.7-61.7-61.7C665.8,436,638.1,463.6,638.1,497.7L638.1,497.7z" />
                </g>
            </svg>
        </div>

        <app-tooltip class="hide-mobile"  [isHasMore]="isHasMore">
            <div tooltip-trigger>             
                <span *ngIf="!isMobile"  class="nowrap" appLabelUtilElement>
                    <ng-container [ngTemplateOutlet]="myContent?.templateRef"></ng-container>
                  </span>
            </div>
            <div tooltip-body *ngIf="isHasMore">
                <span class="word-break-all" [innerHTML]="originText"></span>
            </div>
        </app-tooltip>
    </div>


</div>

<ng-template appLabelUtilContent>        
     <ng-content></ng-content> 
</ng-template>
