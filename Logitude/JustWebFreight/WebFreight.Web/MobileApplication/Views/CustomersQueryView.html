        jQuery.BuilCustomersList = (function (list) {
            var isColored = false;
            var CustomersList = [];

            $.CurrentCustomersList = CustomersList;


            $.each(list, function (index, customer) {
                isColored = !isColored;

                var item = new CustomerListClass();
                item.CustomersList = customer;


                if (item.ItemBackground = isColored) {
                    item.ItemBackground = " #EFF5F5";


                }
                else {

                    item.ItemBackground = " #FFFFFF";
                }

                item.AccountManagerUserEnglishName = $.trim(customer.AccountManagerUserEnglishName);



                item.RankName = $.trim(customer.RankName);


                item.ClassifierName = $.trim(customer.ClassifierName);
                item.CollectorName = $.trim(customer.CollectorName);

                item.IndustryName = $.trim(customer.IndustryName);

                item.CustomerId = customer.Id;

                //item.StartWorkingDate = $.Convert.ToShortDate(customer.StartWorkingDate);
                item.EnglishName = $.trim(customer.EnglishName);
                item.Code = $.trim(customer.Code);
                item.BillToName = $.trim(customer.BillToName);
                item.CityName = $.trim(customer.CityName);
                item.SalesmanUserEnglishName = $.trim(customer.SalesmanUserEnglishName);

                item.PhoneNumber = $.trim(customer.PhoneNumber);



                //item.LastShipmentDate = $.Convert.ToShortDate(customer.LastShipmentDate);



                item.RankCode = $.trim(customer.RankCode);
                if ($.trim(customer.RankCode) == "1") {
                    item.DisplayRank1 = "inline-block";
                    item.DisplayNoRank2 = "inline-block";
                    item.DisplayNoRank3 = "inline-block";

                    item.DisplayRank4 = "none";
                    item.DisplayRank5 = "none";
                    item.DisplayNoRank6 = "none";

                    item.DisplayRank7 = "none";
                    item.DisplayRank8 = "none";
                    item.DisplayRank9 = "none";

                    item.DisplayNoRank10 = "none";
                    item.DisplayNoRank11 = "none";
                    item.DisplayNoRank12 = "none";
                }
                else {
                    if ($.trim(customer.RankCode) == "2") {
                        item.DisplayRank1 = "none";
                        item.DisplayNoRank2 = "none";
                        item.DisplayNoRank3 = "none";

                        item.DisplayRank4 = "inline-block";
                        item.DisplayRank5 = "inline-block";
                        item.DisplayNoRank6 = "inline-block";

                        item.DisplayRank7 = "none";
                        item.DisplayRank8 = "none";
                        item.DisplayRank9 = "none";

                        item.DisplayNoRank10 = "none";
                        item.DisplayNoRank11 = "none";
                        item.DisplayNoRank12 = "none";
                    }
                    else {
                        if ($.trim(customer.RankCode) == "3") {
                            item.DisplayRank1 = "none";
                            item.DisplayNoRank2 = "none";
                            item.DisplayNoRank3 = "none";

                            item.DisplayRank4 = "none";
                            item.DisplayRank5 = "none";
                            item.DisplayNoRank6 = "none";

                            item.DisplayRank7 = "inline-block";
                            item.DisplayRank8 = "inline-block";
                            item.DisplayRank9 = "inline-block";

                            item.DisplayNoRank10 = "none";
                            item.DisplayNoRank11 = "none";
                            item.DisplayNoRank12 = "none";
                        }
                        else {
                            item.DisplayRank1 = "none";
                            item.DisplayNoRank2 = "none";
                            item.DisplayNoRank3 = "none";

                            item.DisplayRank4 = "none";
                            item.DisplayRank5 = "none";
                            item.DisplayNoRank6 = "none";

                            item.DisplayRank7 = "none";
                            item.DisplayRank8 = "none";
                            item.DisplayRank9 = "none";

                            item.DisplayNoRank10 = "inline-block";
                            item.DisplayNoRank11 = "inline-block";
                            item.DisplayNoRank12 = "inline-block";
                        }

                    }
                }
                //start working
                var days;
                var tv1 = Date.parse(customer.StartWorkingDate);
                var tv2 = Date.parse(new Date());

                days = (tv2 - tv1) / 1000 / 86400;
                days = Math.round(days - 0.5);
                if (days < 0) {
                    days = days * -1;
                }


                if (days == 0) {
                    item.StartWorkingDate = "Today";
                }

                if (days == 1) {
                    item.StartWorkingDate = "Yesterday";
                }

                if (days > 1 && days < 31) {
                    item.StartWorkingDate = days + " Days";
                }

                if (days > 31 && days < 1095) {
                    var months = days / 31;
                    months = Math.round(months - 0.5);

                    if (months == 1) {
                        item.StartWorkingDate = months + " Month";
                    }

                    else {
                        item.StartWorkingDate = months + " Months";
                    }
                }

                if (days > 1095) {
                    var years = days / 365;
                    years = Math.round(years - 0.5);

                    if (years == 1) {
                        item.startDate = years + " Year";
                    }

                    else {
                        item.startDate = years + " Years";
                    }
                }




                //lastData

                var days2;
                var tv11 = Date.parse(customer.LastShipmentDate);
                var tv22 = Date.parse(new Date());

                days2 = (tv22 - tv11) / 1000 / 86400;
                days2 = Math.round(days2 - 0.5);
                if (days2 < 0) {
                    days2 = days2 * -1;
                }


                if (days2 == 0) {
                    item.LastShipmentDate = "Today";
                }

                if (days2 == 1) {
                    item.LastShipmentDate = "Yesterday";
                }

                if (days2 > 1 && days2 < 31) {
                    item.LastShipmentDate = days2 + " Days";
                }

                if (days2 > 31 && days2 < 1095) {
                    var months2 = days2 / 31;
                    months2 = Math.round(months - 0.5);

                    if (months2 == 1) {
                        item.LastShipmentDate = months2 + " Month";
                    }

                    else {
                        item.LastShipmentDate = months2 + " Months";
                    }
                }

                if (days2 > 1095) {
                    var years2 = days2 / 365;
                    years2 = Math.round(years2 - 0.5);

                    if (years2 == 1) {
                        item.LastShipmentDate = years2 + " Year";
                    }

                    else {
                        item.LastShipmentDate = years2 + " Years";
                    }
                }

                item.Code = $.trim(customer.Code);



                CustomersList.push(item);
            });



            $.CurrentCustomersList = CustomersList;

            return CustomersList;

        });

            for (var i = 0, m = null; i < $.CurrentCustomersList.length; ++i) {
                if ($.CurrentCustomersList[i].CustomerId == id) {

            $.CurrentEntityId = id;
            $.Application.navigate("Views/CustomerView.html");
