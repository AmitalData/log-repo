    <script>
 
        function onDataShow(e) {

             
            $("#companyLogo").attr('src', $.LogoSource);

           // var scroller = e.view.scroller;
            //scroller.reset();
        
            ko.applyBindings($.CurrentEntityList);
            $.Application.showLoading();

            var url = "../api/shipments/getsinglepm/" + $.CurrentEntityId + "/" + $.CurrentTenant;

            $.ajax({
                url: url,
                type: 'GET',
                contentType: 'application/json',

                success: function (shipmentPM) {

                    
                    if (shipmentPM) {
                        $.CurrentEntityPM = shipmentPM;
                        $.CurrentEntityId = shipmentPM.Id;
                    }

                    else {

                      
                    }
       
                    $.Application.hideLoading();
                },

                error: function (jqXHR, textStatus, errorThrown) {
                 
                    $.Application.hideLoading();
                
                }
            });
        }
    </script>
