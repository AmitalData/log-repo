<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    
</head>
<body><!--chart-->
       <div data-role="view"  data-show="onChartShow">
    <header data-role="header">
           <div style="height:55px;display:table;width:100% ">

                  <div style="display:table-cell; width:auto; vertical-align:middle;margin-top:-15px;">
                             <a data-role="backbutton" data-align="left" style="margin-left:5px;margin-bottom:10px;width:90px;height:30px;font-size:11px;position:relative;"><span style="position:absolute;top:7px;left:8px;">< Details</span></a>
                          
                  </div>
             </div>
           
        </header>
             <div style="width:100% ;background-color: white ;">
                        <div style ="margin-left :10px; margin-right:10px; background-color: white;">
                                    <div style="display:table;width:100% ; height: 55px; border-bottom:1px solid #EEF0F1  ;" >
                                                                  
                                                         <div style="display:table-cell; vertical-align:middle; text-align:left; width:320px;">
                                                                     <div class="HeaderNameCustomer TemplateItem" style="display:inline-block;   margin-top:4px; max-width:270px;"  data-bind="text: EnglishName"></div>

                                                                 
                                                                 <div id="Rank1111111" style="display:none; width:19px;margin-top:4px;"><img style="width: 18px; height:18px; padding:0px; margin:0px;" <img src="images/Rank.png"/></div>
                                                                    <div id="Rank2222222"  style="display:none; width:19px;margin-top:4px;"><img style="width: 18px; height:18px; padding:0px; margin:0px;" <img src="images/Rank.png" /></div>
										                                  <div id="Rank3333333"  style="display:none; width:19px;margin-top:4px;"><img style="width: 18px; height:18px; padding:0px; margin:0px;" <img src="images/Rank.png" /></div>
                                                              
                                                              
                                                                    
                                                        </div>




                                    </div>
                        </div>

           </div>

           <div class="HeaderNameCustomer TemplateItem" style="display:inline-block; text-align:center; margin-top:15px;margin-left:50px; margin-bottom:10px; max-width:200px;">Last year Shipments</div>

           <div id="example" class="k-content" style="margin-left:10px">
    <div class="chart-wrapper">
        <div id="chart"></div>
    </div>



               </div>

    <script>


     

        function DrawShipmentsChart() {

            var ChartLabels = [];
            var ChartValues = [];

            var dataCode = "SP";
            var dataName = "Shipments";

            $.each($.ShipmentsChartDataList, function (index, item) {

                var fieldValue = 0;
                ChartLabels.push(item.LabelProperty);

                switch (dataCode) {

                    case "SP": { fieldValue = item.Shipments; break; }
                    case "GW": { fieldValue = item.GrossWeight; break; }
                    case "CW": { fieldValue = item.ChargeableWeight; break; }
                    case "PL": { fieldValue = item.ProfitInLocal; break; }
                    case "PP": { fieldValue = item.ProfitInProfit; break; }
                    case "RL": { fieldValue = item.ReceivablesInLocal; break; }
                    case "RP": { fieldValue = item.ReceivablesInProfit; break; }
                    default: { fieldValue = item.Shipments; break; }
                }

                ChartValues.push(fieldValue);
            });

            $("#chart").kendoChart({

                title: {
                    visible: false,
                    text: ""
                },

                legend: {
                    visible: false,
                    position: "bottom"
                },

                seriesDefaults: {
                    type: "area"
                },

                series: [{
                    name: dataName,
                    data: ChartValues,
                    color: "Orange",
                    opacity: 1,
                }],

                valueAxis: {
                    labels: {
                        //format: axisFormat
                    },

                    line: {
                        visible: false
                    }
                },

                categoryAxis: {
                    categories: ChartLabels,
                    majorGridLines: {
                        visible: false
                    },
                    labels: {
                        rotation: -90
                    },
                },

                tooltip: {
                    visible: true,
                    //format: "N0",
                    background: "Teal",
                    color: "white",
                    template: "#= value #"
                    //template: "#= series.name #: #= value #"
                }
            });
        }

        
        jQuery.LoadChartData = (function () {

            $.Application.showLoading();

            var url = "../api/CustomersData?customerid=" + $.CurrentEntityId + "&tenant=" + $.CurrentTenant + "&lastMonthsCount=" + -12;

        $.ajax({
            url: url,
            type: 'GET',
            contentType: 'application/json',

            success: function (result) {

                $.ShipmentsChartDataList = result;
                DrawShipmentsChart();

                
                $.Application.hideLoading();
            },

            error: function (jqXHR, textStatus, errorThrown) {
                
                $.Application.hideLoading();
            }
        });
        });
      

        jQuery.LoadRankChart = (function () {

            
            switch ($.CurrentEntityList.RankCode) {

                case "1": {

                    document.getElementById('Rank1111111').style.display = "inline-block";
                    document.getElementById('Rank2222222').style.display = "none";
                    document.getElementById('Rank3333333').style.display = "none";

                    break;
                }

                case "2": {
                    document.getElementById('Rank1111111').style.display = "inline-block";
                    document.getElementById('Rank2222222').style.display = "inline-block";
                    document.getElementById('Rank3333333').style.display = "none";
                    break;
                }

                case "3": {
                    document.getElementById('Rank1111111').style.display = "inline-block";
                    document.getElementById('Rank2222222').style.display = "inline-block";
                    document.getElementById('Rank3333333').style.display = "inline-block";
                    break;
                }
                default: {
                    document.getElementById('Rank1111111').style.display = "none";
                    document.getElementById('Rank2222222').style.display = "none";
                    document.getElementById('Rank3333333').style.display = "none";
                }

            }

        });



        function onChartShow(e) {
            var scroller = e.view.scroller;
            scroller.reset();

            ko.applyBindings($.CurrentEntityList);
            $.LoadChartData();
            $.LoadRankChart();

            
        }

    </script>
</div>


</body>
</html>
