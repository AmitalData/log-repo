              </div>



          <div style="height:auto; width:100%;  background-color:white;padding-bottom:22px; padding-top:-1px ; border-bottom :1px solid \\#E0E8EB; display:none;">
              
                  <div style="height :auto ; border: 1px solid \\#ACB3B7 ; margin-top:14px; margin-right:10px ; margin-left:10px ; margin-buttom:10px"  >

                

              <div style="display:table; height:42px; width:100%; border-bottom :1px solid \\#E0E8EB" >
                       <div class="SHDQD1TextStyle" style="display:table-cell; width:145px ; vertical-align:middle; text-align:left; background-color:\\#ECF1F4;text-indent:10px;" >Name</div>
                       <div  class="HederSHDQD2TextStyle" style="display:table-cell;vertical-align:middle;text-indent:10px;">${Name}</div>
                       </div>




           
              <div style="display:table; height:42px; width:100%; border-bottom :1px solid \\#E0E8EB" >
                       <div class="SHDQD1TextStyle" style="display:table-cell; width:145px ; vertical-align:middle; text-align:left; background-color:\\#ECF1F4;text-indent:10px;" >Website</div>
                       <div  class="HederSHDQD2TextStyle" style="display:table-cell;vertical-align:middle;text-indent:10px;">${Website}</div>
                       </div>




             <div style="display:table; height:42px; width:100%; border-bottom :1px solid \\#E0E8EB" >
                       <div class="SHDQD1TextStyle" style="display:table-cell; width:145px ; vertical-align:middle; text-align:left; background-color:\\#ECF1F4;text-indent:10px;" >Weaknesses</div>
                       <div  class="HederSHDQD2TextStyle" style="display:table-cell;vertical-align:middle;text-indent:10px;">${Weaknesses}</div>
                       </div>




           
              <div style="display:table; height:42px; width:100%; border-bottom :1px solid \\#E0E8EB" >

       <script>

           var competitorListClass = function () {
               this.Name = "";
               this.Website = "";
               this.Strengths = "";
               this.Weaknesses = "";
               this.Opportunity = "";
               this.Threat = "";
           }

           jQuery.BuildCompetitorsList = (function (list) {

               var CompetitorsList = [];

               $.CurrentCompetitorsList = CompetitorsList;


               $.each(list, function (index, Competitor) {


                   var item = new competitorListClass();

                   item.CompetitorsList = Competitor;

                   item.Website = $.trim(Competitor.CompetitorWebsite);
                   item.Name = $.trim(Competitor.CompetitorName);
                   item.Strengths = $.trim(Competitor.CompetitorStrengths);
                   item.Weaknesses = $.trim(Competitor.CompetitorWeaknesses);
                   item.Opportunity = $.trim(Competitor.CompetitorOpportunity);
                   item.Threat = $.trim(Competitor.CompetitorThreat);
                   
                   CompetitorsList.push(item);
               });

               return CompetitorsList;

           });

           jQuery.LoadCompetitors = (function () {

               $.Application.showLoading();

                   this.CustomerId = $.CurrentEntityId;
         
                   var url = "../api/Competitors?customerId=" + $.CurrentEntityId + "&tenant=" + $.CurrentTenant;
                   $.ajax({
                   url: url,
                   type: 'GET',
                   contentType: 'application/json',
                   success: function (result) {
                      

                       if (result.length > 0) {
                          
                           document.getElementById('ComNo').style.display = "none";
                           

                       }
                       else {
                          
                           document.getElementById('ComNo').style.display = "block";
                       }
                       
                       var dataSource = new kendo.data.DataSource({
                           data: $.BuildCompetitorsList(result)
                       });
                       $("#CompetitorsListBox").kendoMobileListView(
                       {
                           dataSource: dataSource,
                           template: kendo.template($("#CompetitorsTemplate").html()),

                       });


                       $.Application.hideLoading();
                   },

                   error: function (jqXHR, textStatus, errorThrown) {
                       
                       $.Application.hideLoading();

                   }
               });

           });
           jQuery.LoadRankCompetitior = (function () {

           
               switch ($.CurrentEntityList.RankCode) {

                   case "1": {

                       document.getElementById('Rank111').style.display = "inline-block";
                       document.getElementById('Rank222').style.display = "none";
                       document.getElementById('Rank333').style.display = "none";

                       break;
                   }

                   case "2": {
                       document.getElementById('Rank111').style.display = "inline-block";
                       document.getElementById('Rank222').style.display = "inline-block";
                       document.getElementById('Rank333').style.display = "none";
                       break;
                   }

                   case "3": {
                       document.getElementById('Rank111').style.display = "inline-block";
                       document.getElementById('Rank222').style.display = "inline-block";
                       document.getElementById('Rank333').style.display = "inline-block";
                       break;
                   }
                   default: {
                       document.getElementById('Rank111').style.display = "none";
                       document.getElementById('Rank222').style.display = "none";
                       document.getElementById('Rank333').style.display = "none";
                   }

               }

           });






           function onCompitiorsViewShow(e) {
           
               
               var scroller = e.view.scroller;
               scroller.reset();

               ko.applyBindings($.CurrentEntityList);
               $.LoadCompetitors();
               $.LoadRankCompetitior();
           }
        



           </script>
