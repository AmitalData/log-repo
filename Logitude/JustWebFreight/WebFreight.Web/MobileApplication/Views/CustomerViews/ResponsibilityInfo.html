                  <div style="display:table; height:41px; width:100%;border-bottom :1px solid #E0E8EB" >
                      <div class="SHDQD1TextStyle " style="display:table-cell; width:145px; vertical-align:middle; text-align:left;background-color:#ECF1F4;text-indent:10px;">Account Manager</div>

    <div style="display:table; height:41px; width:100%;border-bottom :1px solid #E0E8EB" >

        </div>
    
       <script>




           jQuery.LoadRankResponsibility = (function () {

              
               switch ($.CurrentEntityList.RankCode) {

                   case "1": {

                       document.getElementById('Rank1111').style.display = "inline-block";
                       document.getElementById('Rank2222').style.display = "none";
                       document.getElementById('Rank3333').style.display = "none";

                       break;
                   }

                   case "2": {
                       document.getElementById('Rank1111').style.display = "inline-block";
                       document.getElementById('Rank2222').style.display = "inline-block";
                       document.getElementById('Rank3333').style.display = "none";
                       break;
                   }

                   case "3": {
                       document.getElementById('Rank1111').style.display = "inline-block";
                       document.getElementById('Rank2222').style.display = "inline-block";
                       document.getElementById('Rank3333').style.display = "inline-block";
                       break;
                   }
                   default: {
                       document.getElementById('Rank1111').style.display = "none";
                       document.getElementById('Rank2222').style.display = "none";
                       document.getElementById('Rank3333').style.display = "none";
                   }

               }

           });

           function onResponsibilityViewShow(e) {

               var scroller = e.view.scroller;
               scroller.reset();

               ko.applyBindings($.CurrentEntityList);

            
               $.LoadRankResponsibility();
           }
              </script>
