<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
</head>

<body>
    <div data-role="view"  data-transition="slide" data-show="onAdressShow">
           <header data-role="header">
           
        <div style="height:55px;display:table;width:100% ">

                  <div style="display:table-cell; width:auto; vertical-align:middle;margin-top:-15px;">
                             <a data-role="backbutton" data-align="left" style="margin-left:5px;margin-bottom:10px;width:90px;height:30px;font-size:11px;position:relative;"><span style="position:absolute;top:7px;left:8px;">< Details</span></a>
                          
                  </div>
             </div>
           
          </header>

                   <div style="width:100% ;background-color: white ; ">
                        <div style ="margin-left :10px; margin-right:10px; background-color: white;">
                                    <div style="display:table;width:100% ; height: 55px; border-bottom:1px solid #EEF0F1  ;" >
                                                                  
                                                         <div style="display:table-cell; vertical-align:middle; text-align:left; width:320px;">
                                                                     <div class="HeaderNameCustomer TemplateItem" style="display:inline-block;   margin-top:4px; max-width:270px;"  data-bind="text: EnglishName"></div>

                                                                 
                                                                 <div id="Rank111111" style="display:none; width:19px;margin-top:4px;"><img style="width: 18px; height:18px; padding:0px; margin:0px;" <img src="images/Rank.png"/></div>
                                                                    <div id="Rank222222"  style="display:none; width:19px;margin-top:4px;"><img style="width: 18px; height:18px; padding:0px; margin:0px;" <img src="images/Rank.png" /></div>
										                                  <div id="Rank333333"  style="display:none; width:19px;margin-top:4px;"><img style="width: 18px; height:18px; padding:0px; margin:0px;" <img src="images/Rank.png" /></div>
                                                              
                                                              
                                                                    
                                                        </div>




                                    </div>
                        </div>

           </div>

            <ul data-role="listview" data-style="inset" data-type="group" style="margin-top: -10px;">
            <li>

                <ul id="AddressesListBox"></ul>
            </li>
        </ul>

        <div class="Nofound"  id="NoAddresses" style="height: auto; width: 100%; display:none;background-color: white; vertical-align:bottom;  text-align:left; margin-left:7px;">No Addresses</div>
   </div>


        <script type="text/x-kendo-tmpl" id="AddressesTemplate">

            <div style="height:10px;"></div>
                  <div style="height:auto; border:1px solid \\#94C0D2; background: \\#F5F5F5; margin:5px;">
             <table style="border-collapse:collapse; text-space-collapse:collapse; border:none; width:100%; height:100%;">
                <tr style="height:20px;DisplayAddressTypeName">
                    <td class="HeaderAdressTextStyle" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;font-size:14px;text-align:left;text-indent:10px;">${AddressTypeName}</td>
                    <td style="width:5px;"></td>
               </tr>
              
             <tr style="height:15px;display: #= DisplayAddress1 #;">
                    <td style="font-size:11px;text-align:left;text-indent:10px;">${Address1}</td>      
                 <td style="width:400px;"></td>             
             </tr>

             <tr style="height:20px;display: #= DisplayAddress2 #;">
                    <td style="font-size:11px;text-align:left;text-indent:10px;">${Address2}</td>      
             </tr>

             <tr style="height:15px;display: #= DisplayCityName #;">
                    <td style="font-size:11px;text-align:left;text-indent:10px;">${CityName}</td>      
                                    
             </tr>

             <tr style="height:15px;display: #= DisplayName #;">
                    <td style="font-size:11px;text-align:left;text-indent:10px;">${Name}</td>      
                    <td style="width:5px;"></td>              
                </tr>

             <tr style="height:15px;display: #= DisplayPhoneNumber #;">
                    <td style="text-align:left;width:100px;font-size:11px; text-indent:10px;font-weight:bold;">Phone:</td>
                    <td style="font-size:11px;text-align:left;text-indent:10px;width:100px">${PhoneNumber}</td> 
                    <td class="HederSHDQD2TextStyle33"  style="font-size:13px;text-align:left;display: #= DisplayCallPhoneAddress #;margin-left:5px;width:100px"><a href="tel:${PhoneNumber}">Call</a></td>     
                   
                </tr>

            <tr style="height:15px;display: #= DisplayFaxNumber #;">
                    <td style="text-align:left;width:auto;font-size:11px; text-indent:10px;width:100px;font-weight:bold;">Fax:</td>
                    <td style="font-size:11px;text-align:left;text-indent:10px;width:100px">${FaxNumber}</td>      
                    <td style="width:5px;"></td>              
                </tr>

              <tr style="height:15px;display: #= DisplayZipCode #;">
                    <td style="font-size:11px;text-align:left;text-indent:10px;">${ZipCode}</td>      
                    <td style="width:5px;"></td>              
                </tr>
             </table>
           <div  style="text-align:left;text-indent:10px;display: #= DisplayCountrySRC #;"> <img style="width:29px; padding:0px; margin:0px;" src="#= CountrySRC #" /> <div>
        </div>

        </script>

    <script>

        var AddressesClass = function () {
            //rowspan = "2"
            //<td ><img style="width:29px; padding:0px; margin:0px;" src="#= CountrySRC #" /></td> 
            //&& $.trim(address.CountryCode) == "")
            this.Name = "";
            this.CityName = "";
            this.FaxNumber = "";
            this.Address1 = "";
            this.Address2 = "";
            this.PhoneNumber = "";
            this.AddressType = "";
            this.ZipCode = "";
            this.AddressTypeName = "";
            this.CountryCode = "";
            this.CountrySRC = "";

            this.DisplayName = " ";
            this.DisplayCityName = " ";
            this.DisplayFaxNumber = " ";
            this.DisplayAddress1 = " ";
            this.DisplayAddress2 = " "; 
            this.DisplayAddressTypeName = " ";
            this.DisplayZipCode = " ";
            this.DisplayCountrySRC = "";
            this.DisplayPhoneNumber = " ";

            this.DisplayCallPhoneAddress = "";
            



            
            
 
        }

        jQuery.BuildAddressesList = (function (list) {

            var AddressesList = [];

        


            $.each(list, function (index, address) {


                var item = new AddressesClass();
                item.AddressesList = address;

                item.CityName = $.trim(address.City);
                item.FaxNumber = $.trim(address.FaxNumber);
                item.Address1 = $.trim(address.Address1);
                item.Address2 = $.trim(address.Address2);
                item.AddressType = $.trim(address.AddressTypeId);
                item.PhoneNumber = $.trim(address.PhoneNumber);
                item.Name = $.trim(address.Name);
                item.ZipCode = $.trim(address.ZipCode);
                item.CountryCode = $.trim(address.CountryCode);
              
                item.CountrySRC = "../images/Flags/" + $.trim(address.CountryCode) + ".png";
                if ($.trim(address.AddressTypeId) == "M") {
                    item.AddressTypeName = "Main Address";
                }
                else
                {
                    if ($.trim(address.AddressTypeId) == "B")
                        {
                        item.AddressTypeName = "Billing Address";
                    }
                    else if ($.trim(address.AddressTypeId) == "O") {
                        item.AddressTypeName = " ";
                        item.DisplayAddressTypeName = "none";
                    }
                    else {
                        item.AddressTypeName = " ";
                        item.DisplayAddressTypeName = "none";
                    }
                }



                if ($.trim(address.CountryCode) == "") {
                    item.DisplayCountrySRC = "none";
                }
                



                if ($.trim(address.City) == "") {
                    item.DisplayCityName = "none";
                }


                if ($.trim(address.FaxNumber) == "") {
                    item.DisplayFaxNumber = "none";
                }


                if ($.trim(address.Address1) == "") {
                    item.DisplayAddress1 = "none";
                }

                if ($.trim(address.Address2) == "" ) {
                    item.DisplayAddress2 = "none";
                }



                if ($.trim(address.PhoneNumber) == "") {
                    item.DisplayPhoneNumber = "none";
                    item.DisplayCallPhoneAddress = "none";
                }

                if ($.trim(address.ZipCode) == "") {
                    item.DisplayZipCode = "none";
                }

                
                AddressesList.push(item);
            });




            return AddressesList;

        });

        jQuery.LoadAdressData = (function () {

            $.Application.showLoading();

            var url = "../api/CustomersData?addressesCustomerId=" + $.CurrentEntityId + "&tenant=" + $.CurrentTenant;

            $.ajax({
                url: url,
                type: 'GET',
                contentType: 'application/json',

                success: function (result) {
                    if (result.length > 0) {

                        document.getElementById('NoAddresses').style.display = "none";


                    }
                    else {

                        document.getElementById('NoAddresses').style.display = "block";

                    }



                    var dataSource = new kendo.data.DataSource({
                        data: $.BuildAddressesList(result)
                    });


                    $("#AddressesListBox").kendoMobileListView(
                    {
                        dataSource: dataSource,
                        template: kendo.template($("#AddressesTemplate").html()),

                    });


                    $.Application.hideLoading();
                },

                error: function (jqXHR, textStatus, errorThrown) {
                    $.Application.hideLoading();

                }
            });

        });

        jQuery.LoadRankAdress = (function () {

     
            switch ($.CurrentEntityList.RankCode) {

                case "1": {

                    document.getElementById('Rank111111').style.display = "inline-block";
                    document.getElementById('Rank222222').style.display = "none";
                    document.getElementById('Rank333333').style.display = "none";

                    break;
                }

                case "2": {
                    document.getElementById('Rank111111').style.display = "inline-block";
                    document.getElementById('Rank222222').style.display = "inline-block";
                    document.getElementById('Rank333333').style.display = "none";
                    break;
                }

                case "3": {
                    document.getElementById('Rank111111').style.display = "inline-block";
                    document.getElementById('Rank222222').style.display = "inline-block";
                    document.getElementById('Rank333333').style.display = "inline-block";
                    break;
                }
                default: {
                    document.getElementById('Rank111111').style.display = "none";
                    document.getElementById('Rank222222').style.display = "none";
                    document.getElementById('Rank333333').style.display = "none";
                }

            }

        });
     

        function onAdressShow(e) {

            var scroller = e.view.scroller;
            scroller.reset();

            ko.applyBindings($.CurrentEntityList);

            $.LoadAdressData();
            $.LoadRankAdress();
        }



    </script>

    


</body>
</html>
