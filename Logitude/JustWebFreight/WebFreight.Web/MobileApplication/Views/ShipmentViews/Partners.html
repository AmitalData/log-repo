    <script>


        var PartnerClass = function () {
            this.PartnerType = "";
            this.Company = "";
            this.ContactName = "";
            this.Phone = "";
            this.Email = "";
            this.AddressName = "";
            this.Address1 = "";
            this.Address2 = "";
            this.DisplayPhone = "";
            this.DisplayEmail = "";
            this.FlagSRC = "";
        }

        function BuildPartnersList(partners) {

           

            var PartnersList = [];

            $.each(partners, function (index, partner) {
           
                var item = new PartnerClass();
           
                item.PartnerType = $.trim(partner.PartnerType);
                item.Company = $.trim(partner.PartnerName);
                item.AddressName = ($.trim(partner.Name) == "") ? $.trim(partner.Name) : $.trim(partner.Name) + ".";
                item.Address1 = ($.trim(partner.Address1) == "") ? $.trim(partner.Address1) : $.trim(partner.Address1) + ",";
                item.Address2 = ($.trim(partner.Address2) == "") ? $.trim(partner.Address2) : $.trim(partner.Address2);

                item.ContactName = $.trim(partner.ContactName);

                item.FlagSRC = $.trim(partner.FlagSRC);

                if ($.trim(partner.Phone) == "") {
                    item.DisplayPhone = "none";
                }

                if ($.trim(partner.Email) == "") {
                    item.DisplayEmail = "none";
                }


                item.Phone = $.trim(partner.Phone);
                item.Email = $.trim(partner.Email);

                PartnersList.push(item);
            });

            $("#PartnersListBox").html("");
            $("#PartnersListBox").kendoListView(
                   {
                       dataSource: { data: PartnersList },
                       template: kendo.template($("#PartnersItemTemplate").html())
                   });
        }

        jQuery.GetShipmentPartners = (function () {

            $.Application.showLoading();


            var url = "../api/shipments?shipmentId=" + $.CurrentEntityId + "&tenant=" + $.CurrentTenant;



            $.ajax({
                url: url,
                type: 'GET',
                contentType: 'application/json',

                success: function (result) {

                    //$.SendContactActivity($.CurrentEmail, "Shipment", "Partners Display", $.CurrentTenant, $.CurrentCardId);


                    //$("#PartnersListBox").kendoMobileListView(
                    //{
                    //    dataSource: {
                    //        data: PartnersList,
                    //    },

                    //    template: kendo.template($("#PartnersItemTemplate").html()),
                    //});

                    BuildPartnersList(result);


                    $.Application.hideLoading();
                },

                error: function (jqXHR, textStatus, errorThrown) {
                    //$.CheckUserException(jqXHR);
                    $.Application.hideLoading();


                }
            });

        });

        function onPartnersShow(e) {
            var scroller = e.view.scroller;
            scroller.reset();

            ko.applyBindings($.CurrentEntityList);

            $("#PartnersListBox").html("");
            $("#PartnersListBox").kendoListView(
               {
                   dataSource: { data: [] },
                   template: kendo.template($("#PartnersItemTemplate").html())
               });

            $.GetShipmentPartners();
        }




    </script>
