      <script>



          jQuery.GetShipmentEvents = (function () {

              $.Application.showLoading();

              var url = "../api/CommonData?entityId=" + $.CurrentEntityId + "&objectTableName=Shipment" + "&partnerType=" + $.CurrentCardType + "&tenant=" + $.CurrentTenant;

              $.ajax({
                  url: url,
                  type: 'GET',
                  contentType: 'application/json',

                  success: function (result) {

                      //$.SendContactActivity($.CurrentEmail, "Shipment", "Events Display", $.CurrentTenant, $.CurrentCardId);

                      if (result.length > 0) {
                          document.getElementById('endlineEvent').style.display ="block";

                          $("#EventListBox").html("");
                          $("#EventListBox").kendoListView(
                          {
                              dataSource: { data: BuildEventList(result) },
                              template: kendo.template($("#EventItemTemplate").html())
                          });
                      }

                      else {
                          document.getElementById('endlineEvent').style.display ="none";

                          $("#EventListBox").css({
                              "font-family": "Arial",
                              "color": "gray",
                              "font-size": "14px",
                              "margin-left": "15px",
                          });

                          $("#EventListBox").html("No Events");
                      }

                      $.Application.hideLoading();
                  },

                  error: function (jqXHR, textStatus, errorThrown) {
                      //$.CheckUserException(jqXHR);
                      $.Application.hideLoading();
                  }
              });

          });


          function onEventViewShow(e) {
              $("#companyLogo").attr('src', $.LogoSource);

              var scroller = e.view.scroller;
              scroller.reset();
              ko.applyBindings($.CurrentEntityList);
              $.GetShipmentEvents();
          }
              </script>
