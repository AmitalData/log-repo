    <script>
        
    

        jQuery.GetShipmentDocuments = (function () {

            $.Application.showLoading();

            var url = "../api/DocumentsData?entityId=" + $.CurrentEntityId + "&partnerType=" + $.CurrentCardType + "&tenant=" + $.CurrentTenant;

            $.ajax({
                url: url,
                type: 'GET',
                contentType: 'application/json',

                success: function (result) {

                    $.SendContactActivity($.CurrentEmail, "Shipment", "Documents Display", $.CurrentTenant, $.CurrentCardId);

                    if (result.length > 0) {
                        document.getElementById('endline2').style.display = "block";

                        $("#DocumentListBox").html("");
                        $("#DocumentListBox").kendoListView(
                        {
                            dataSource: { data: result },
                            template: kendo.template($("#DocumentItemTemplate").html())
                        });
                    }

                    else {
                        document.getElementById('endline2').style.display = "none";
                        $("#DocumentListBox").css({
                            "font-family": "Arial",
                            "color": "gray",
                            "font-size" : "14px",
                            "margin-left": "5px",
                        });
                        $("#DocumentListBox").html("No Documents");
              
                    }

                    $.Application.hideLoading();
                },

                error: function (jqXHR, textStatus, errorThrown) {
                    $.CheckUserException(jqXHR);
                    $.Application.hideLoading();
                }
            });

        });


        function onDocumentViewShow(e) {
            $("#companyLogo").attr('src', $.LogoSource);
            var scroller = e.view.scroller;
            scroller.reset();

            ko.applyBindings($.CurrentEntityList);
            $.GetShipmentDocuments();
        }

        </script>
