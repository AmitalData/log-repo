<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
     <title>Logitude</title>

    <link href="http://cdn.kendostatic.com/2013.2.716/styles/kendo.common.min.css" rel="stylesheet" />
    <link href="http://cdn.kendostatic.com/2013.2.716/styles/kendo.default.min.css" rel="stylesheet" />
    <link href="http://cdn.kendostatic.com/2013.2.716/styles/kendo.mobile.all.min.css" rel="stylesheet" />
    <script src="http://code.jquery.com/jquery-1.9.1.min.js" type="text/javascript"></script>
    <script src="http://cdn.kendostatic.com/2013.2.716/js/kendo.all.min.js" type="text/javascript"></script>


    <link href="css/CustomersMobileStyle.css" rel="stylesheet" />
    <link href="css/PostsMobileStyle.css" rel="stylesheet" />

    <script type="text/javascript" src="../HtmlHelpers/JS/jquery.dateFormat-1.0.js"></script>
    <script type="text/javascript" src="../HtmlHelpers/JS/Logitude.Converters.js"></script>
    <script type="text/javascript" src="../HtmlHelpers/JS/ContactActivityLog.js"></script>
    <script type="text/javascript" src="../HtmlHelpers/JS/Logitude.Entites.js"></script>
    <script type="text/javascript" src="../HtmlHelpers/JS/knockout-2.2.0.js"></script>
</head>
<body>
<div data-role="view" data-stretch="true">
        <div style="background:url('../HtmlHelpers/Images/Bars_Images/loginbackground.png'); background-repeat:no-repeat ; background-size:cover;">
            <div style="height:142px; background-color:white;">
                <div style="display:table; width:100%; height:100%;">
                    <div style="display:table-cell; text-align:center; vertical-align:middle;">
                        <a href="http://www.logitudeworld.com/" target="_blank" style="height:75px; width:85px; vertical-align:middle"> <img style="height:75px; width:85px; vertical-align:middle" src="images/appIcon.png"/></a>
                        
                        <span style="font-size:36px; color:#4F4F4D;">Logitude</span>
                        <div style="margin-top:-10px; color:#828282;">Shared Logistics, Anytime, Anywhere</div>
                    </div>
                </div>
            </div>
        
            <div style="margin:10px; background-color:transparent">
                <div style="margin-top:30px; font-size:18px; color:white;">Email</div>
                <input id="EmailBox" type="email" required="required" style="margin-top:1px; border:2px solid #E9E9E9; border-radius:2px;"/>

                <div style="margin-top:28px; font-size:18px; color:white;">Password</div>
                <input id="PassBox" type="password" required="required" style="margin-top:1px; border:2px solid #E9E9E9; border-radius:2px;"/>
                <!--/*background-color:#FFEFEC*/-->

                <div style="height:47px; padding-top:5px;">
                    <div id="Error" style="position:relative; height:0px; opacity:0; background-color:red; width:100%; color:white;">
                        <div style="height:100%; display:table;">
                            <div id="ErrorText" style="display:table-cell; vertical-align:middle; text-indent:10px;">
                                Wronge password, please try again
                            </div>
                        </div>
                    </div>
                </div>

                <input id="LoginButton" type="button" value="Log in" style="height:51px; background:url('../HtmlHelpers/Images/Bars_Images/loginback.png');background-repeat:no-repeat; background-size:cover;  font-size:18px ;"/>
                <a href="#" style="font-size:16px; color:white;">Forget your password?</a>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/CustomerViewModel.js"></script>   
    <script type="text/javascript" src="js/Heper.js"></script>   
</body>

</html>
